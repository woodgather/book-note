<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C程序设计语言 - Anki精华卡片</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #2563eb;
    --primary-light: #3b82f6;
    --primary-dark: #1d4ed8;
    --bg: #f1f5f9;
    --card-front: #ffffff;
    --card-back: #eff6ff;
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --accent: #f59e0b;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }

  /* 头部 */
  .header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-light) 100%);
    color: white;
    padding: 48px 24px 40px;
    text-align: center;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .header .subtitle {
    font-size: 15px;
    opacity: 0.9;
    margin-bottom: 24px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 700;
  }

  .stat-label {
    font-size: 13px;
    opacity: 0.85;
  }

  /* 控制栏 */
  .controls {
    max-width: 1200px;
    margin: -24px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 10;
  }

  .search-box {
    flex: 1;
    min-width: 280px;
    max-width: 400px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    background: white;
    box-shadow: var(--shadow);
    outline: none;
    transition: box-shadow 0.2s;
  }

  .search-box input:focus {
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2), var(--shadow);
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 16px;
  }

  .filter-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: white;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }

  .filter-btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }

  .filter-btn.active {
    background: var(--primary);
    color: white;
  }

  .action-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: var(--accent);
    color: white;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }

  .action-btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }

  /* 章节分隔 */
  .chapter-divider {
    max-width: 1200px;
    margin: 40px auto 16px;
    padding: 0 24px;
  }

  .chapter-title {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    color: var(--primary-dark);
    padding-bottom: 8px;
    border-bottom: 3px solid var(--primary);
  }

  .chapter-num {
    background: var(--primary);
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
  }

  /* 卡片网格 - 2列 */
  .cards-grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px 48px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  @media (max-width: 768px) {
    .cards-grid {
      grid-template-columns: 1fr;
    }
  }

  /* 卡片翻转效果 */
  .card-container {
    perspective: 1200px;
    height: 300px;
    cursor: pointer;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 14px;
  }

  .card-container.flipped .card {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-front {
    background: var(--card-front);
  }

  .card-back {
    background: linear-gradient(135deg, var(--card-back) 0%, #dbeafe 100%);
    transform: rotateY(180deg);
  }

  /* 卡片标签 */
  .card-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    align-self: flex-start;
  }

  .card-front .card-tag {
    background: #ede9fe;
    color: #6d28d9;
  }

  .card-back .card-tag {
    background: #dcfce7;
    color: #15803d;
  }

  /* 卡片编号 */
  .card-num {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 12px;
    color: var(--text-light);
    font-weight: 500;
  }

  /* 问题/答案标题 */
  .card-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  /* 问题文本 */
  .question-text {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.6;
    flex: 1;
    display: flex;
    align-items: center;
  }

  /* 答案文本 */
  .answer-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
    flex: 1;
    overflow-y: auto;
  }

  .answer-text code {
    background: rgba(0,0,0,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 12px;
  }

  .answer-text pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 8px;
    margin: 8px 0;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
  }

  .answer-text ul {
    padding-left: 20px;
    margin: 4px 0;
  }

  .answer-text li {
    margin-bottom: 3px;
  }

  .answer-text strong {
    color: var(--primary-dark);
  }

  /* 翻转提示 */
  .flip-hint {
    font-size: 12px;
    color: var(--text-light);
    text-align: center;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .flip-icon {
    display: inline-block;
    transition: transform 0.3s;
  }

  .card-container:hover .flip-icon {
    transform: rotate(180deg);
  }

  /* 滚动条美化 */
  .answer-text::-webkit-scrollbar {
    width: 4px;
  }

  .answer-text::-webkit-scrollbar-track {
    background: transparent;
  }

  .answer-text::-webkit-scrollbar-thumb {
    background: var(--primary-light);
    border-radius: 2px;
  }

  /* 页脚 */
  .footer {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-light);
    font-size: 13px;
    border-top: 1px solid var(--border);
    background: white;
  }

  /* 无结果提示 */
  .no-results {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-light);
    grid-column: 1 / -1;
  }

  .no-results .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* 难度指示 */
  .difficulty {
    display: inline-flex;
    gap: 2px;
    vertical-align: middle;
  }

  .diff-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    display: inline-block;
  }

  .diff-dot.filled {
    background: var(--accent);
  }
</style>
</head>

// 渲染卡片
function renderCards(filteredCards) {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';

  if (filteredCards.length === 0) {
    container.innerHTML = `
      <div class="no-results">
        <div class="icon">🔍</div>
        <div>没有找到匹配的卡片</div>
      </div>
    `;
    return;
  }

  // 按章节分组
  const chapters = {};
  const chapterOrder = ['ch1','ch2','ch3','ch4','ch5','ch6','ch7','ch8'];
  filteredCards.forEach(card => {
    if (!chapters[card.chapter]) {
      chapters[card.chapter] = { name: card.chapterName, cards: [] };
    }
    chapters[card.chapter].cards.push(card);
  });

  chapterOrder.forEach(chapterKey => {
    if (!chapters[chapterKey]) return;
    const chapter = chapters[chapterKey];

    const divider = document.createElement('div');
    divider.className = 'chapter-divider';
    divider.innerHTML = `
      <div class="chapter-title">
        <span class="chapter-num">${chapterKey.replace('ch', '')}</span>
        ${chapter.name}
        <span style="font-size:13px; color:#64748b; font-weight:normal; margin-left:8px;">(${chapter.cards.length} 张)</span>
      </div>
    `;
    container.appendChild(divider);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    chapter.cards.forEach(card => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card-container';
      cardEl.dataset.cardId = card.id;

      const diffDots = Array(5).fill(0).map((_, i) =>
        `<span class="diff-dot ${i < card.difficulty ? 'filled' : ''}"></span>`
      ).join('');

      cardEl.innerHTML = `
        <div class="card">
          <div class="card-face card-front">
            <div class="card-num">#${String(card.id).padStart(2, '0')} <span class="difficulty">${diffDots}</span></div>
            <span class="card-tag">${card.tag}</span>
            <div class="card-label">问题 Question</div>
            <div class="question-text">${card.question}</div>
            <div class="flip-hint"><span class="flip-icon">↻</span> 点击翻转查看答案</div>
          </div>
          <div class="card-face card-back">
            <div class="card-num">#${String(card.id).padStart(2, '0')}</div>
            <span class="card-tag">答案</span>
            <div class="card-label">答案 Answer</div>
            <div class="answer-text">${card.answer}</div>
            <div class="flip-hint"><span class="flip-icon">↻</span> 点击翻转返回</div>
          </div>
        </div>
      `;

      cardEl.addEventListener('click', () => {
        cardEl.classList.toggle('flipped');
      });

      grid.appendChild(cardEl);
    });

    container.appendChild(grid);
  });
}

// 状态管理
let currentChapter = 'all';
let searchQuery = '';

function filterCards() {
  let filtered = cards;

  if (currentChapter !== 'all') {
    filtered = filtered.filter(c => c.chapter === currentChapter);
  }

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(c =>
      c.question.toLowerCase().includes(q) ||
      c.answer.toLowerCase().includes(q) ||
      c.tag.toLowerCase().includes(q)
    );
  }

  document.getElementById('totalCards').textContent = filtered.length;
  renderCards(filtered);
}

// 事件绑定
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  filterCards();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentChapter = btn.dataset.chapter;
    filterCards();
  });
});

document.getElementById('flipAllBtn').addEventListener('click', () => {
  const allFlipped = document.querySelectorAll('.card-container.flipped');
  const allCards = document.querySelectorAll('.card-container');

  if (allFlipped.length === allCards.length) {
    allCards.forEach(c => c.classList.remove('flipped'));
  } else {
    allCards.forEach(c => c.classList.add('flipped'));
  }
});

// 初始化
filterCards();
</script>
