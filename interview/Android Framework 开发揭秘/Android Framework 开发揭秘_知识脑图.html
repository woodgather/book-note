    breadcrumb: ['第六章', '启动过程分析'],
    sections: [
      { title: 'SystemServer七步走', html: `
        <h4>startBootstrapServices 中第1-4步</h4>
        <ol class="step-list">
          <li><strong>启动Installer服务</strong> — 阻塞等待installd完成启动，创建具有适当权限的关键目录（如/data/user）</li>
          <li><strong>获取设备是否加密</strong> — 加密则只解析"core"应用，mOnlyCore=true</li>
          <li><strong>调用PKMS.main()初始化PKMS</strong> — 调用PackageManagerService构造函数创建对象</li>
          <li><strong>设备未加密时管理A/B OTA dexopting</strong> — 启动OtaDexoptService</li>
        </ol>
        <h4>startOtherServices 中第5-7步</h4>
        <ol class="step-list" start="5">
          <li><strong>updatePackagesIfNeeded</strong> — 完成dex优化</li>
          <li><strong>performFstrimIfNeeded</strong> — 完成磁盘维护</li>
          <li><strong>systemReady</strong> — PKMS准备就绪</li>
        </ol>
      `},
      { title: 'PKMS.main()四件事', html: `
        <ol class="step-list">
          <li>检查Package编译相关系统属性</li>
          <li>调用PackageManagerService构造方法</li>
          <li>启用部分应用服务于多用户场景（enableSystemUserPackages）</li>
          <li>往ServiceManager中注册"package"和"package_native"</li>
        </ol>
      `},
      { title: '两个重要的锁', html: `
        <h4>mInstallLock</h4>
        <ul class="knowledge-list">
          <li>保护所有安装apk的访问权限</li>
          <li>涉及繁重的磁盘数据读写，单线程操作，可能很慢</li>
          <li>不会在持有mPackages锁的情况下获取</li>
          <li>持有mInstallLock时获取mPackages是安全的</li>
        </ul>
        <h4>mPackages</h4>
        <ul class="knowledge-list">
          <li>保护内存中所有apk的package信息及相关状态</li>
        </ul>
      `},
      { title: '五个阶段', html: `
        <ol class="step-list">
          <li><strong>BOOT_PROGRESS_PMS_START</strong> — 构造DisplayMetrics、创建Installer、PermissionManager、Settings、PackageDexOptimizer、SystemConfig，创建handler线程，添加8种shareUserId</li>
          <li><strong>BOOT_PROGRESS_PMS_SYSTEM_SCAN_START</strong> — 获取BOOTCLASSPATH，判断fingerprint更新，旧版本升级处理，扫描system/vendor/product/odm/oem等目录的priv-app、app、overlay包</li>
          <li><strong>BOOT_PROGRESS_PMS_DATA_SCAN_START</strong> — 扫描data目录应用信息，移除OTA删除的更新系统应用的禁用package设置</li>
          <li><strong>BOOT_PROGRESS_PMS_SCAN_END</strong> — SDK版本变更更新权限，首次启动初始化默认首选应用，准备系统用户存储，OTA升级清除缓存，更新package.xml</li>
          <li><strong>BOOT_PROGRESS_PMS_READY</strong> — 获取PermissionController，更新instant app installer，读取dex文件用法，GC回收内存</li>
        </ol>
      `}
    ]
  },

    type: 'section',
    chapter: 6,
    title: '第五节 · APK的扫描',
    breadcrumb: ['第六章', 'APK的扫描'],
    sections: [
      { title: '扫描调用链', html: `
        <p>入口：PKMS构造函数中调用scanDirTracedLI扫描目录APK文件。</p>
        <ol class="step-list">
          <li><strong>PKMS.scanDirTracedLI</strong> — 加入systrace日志追踪，调用scanDirLI</li>
          <li><strong>PKMS.scanDirLI</strong> — 核心扫描函数，创建ParallelPackageParser，遍历文件submit提交解析，从队列取出结果</li>
          <li><strong>ParallelPackageParser.submit</strong> — 创建PackageParser对象，设置回调，调用scanFile解析APK</li>
          <li><strong>PackageParser.parsePackage</strong> — 解析给定APK文件，parseBaseApk解析AndroidManifest.xml，所有解析信息放在Package对象中</li>
        </ol>
      `},
      { title: '各环节详解', html: `
        <h4>scanDirLI</h4>
        <ul class="knowledge-list">
          <li>获取目录下所有文件</li>
          <li>创建ParallelPackageParser对象（并行解析器队列）</li>
          <li>遍历文件，调用parallelPackageParser.submit(file, parseFlags)提交解析</li>
          <li>从队列中取出解析结果（ParallelPackageParser.ParseResult）</li>
        </ul>
        <h4>PackageParser.parsePackage</h4>
        <ul class="knowledge-list">
          <li>parseMonolithicPackage()：解析单块包</li>
          <li>parseBaseApk()：主要解析AndroidManifest.xml</li>
          <li>parseBaseApkCommon：从AndroidManifest.xml获取标签名，解析各标签属性</li>
          <li>parseBaseApplication()：解析application标签</li>
        </ul>
      `}
    ]
  },

  'ch6-s5-2': { type: 'leaf', chapter: 6, title: '各环节详解', breadcrumb: ['第六章', 'APK的扫描', '各环节'], redirect: 'ch6-s5' },

  'ch6-s6': {
    type: 'section',
    chapter: 6,
    title: '第六节 · APK的安装',
    breadcrumb: ['第六章', 'APK的安装'],
    sections: [
      { title: '安装三步走', html: `
        <ol class="step-list">
          <li>把APK的信息通过IO流写入到PackageInstaller.Session中</li>
          <li>调用PackageInstaller.Session的commit方法，把APK信息交给PKMS处理</li>
          <li>进行APK的Copy操作，进行安装</li>
        </ol>
      `},
      { title: '整体安装流程', html: `
        <ol class="step-list">
          <li>用户点击APK → PackageInstallerActivity → 点击"安装"按钮</li>
          <li>startInstall() 跳转到 InstallInstalling Activity</li>
          <li>InstallInstalling.onCreate 六步：获取保存的mSessionId → 注册观察者 → 创建SessionParams → 轻量级解析APK → 返回新的mInstallId → createSession内部通过Binder调用PKMS</li>
          <li>InstallingAsyncTask：doInBackground中通过IO流将APK写入Session；onPostExecute调用Session.commit()</li>
          <li>PKMS处理安装请求：INIT_COPY消息 → 创建InstallParams → installPackagesTracedLI → installPackagesLI</li>
        </ol>
      `},
      { title: 'installPackagesLI五大环节', html: `
        <ol class="step-list">
          <li><strong>Prepare（准备）</strong> — 分析当前安装状态，分析包并进行初始验证，preparePackageLI</li>
          <li><strong>Scan（扫描）</strong> — 基于prepare收集的上下文分析已解析的包，scanPackageTracedLI</li>
          <li><strong>Reconcile（调和）</strong> — 在彼此上下文和当前系统状态中验证扫描的包，确保安装成功，构造ReconcileRequest</li>
          <li><strong>Commit（提交）</strong> — 提交所有扫描的包并更新系统状态，是安装流中唯一可以修改系统状态的地方，commitPackagesLocked</li>
          <li><strong>executePostCommitSteps（完成安装）</strong> — prepareAppDataAfterInstallLIF进行安装，替换安装时清除APP代码缓存，为新代码路径准备配置文件，执行dex优化</li>
        </ol>
      `}
    ]
  },
  'ch6-s6-1': { type: 'leaf', chapter: 6, title: '安装三步走', breadcrumb: ['第六章', 'APK的安装', '三步走'], redirect: 'ch6-s6' },
  'ch6-s6-2': { type: 'leaf', chapter: 6, title: '整体安装流程', breadcrumb: ['第六章', 'APK的安装', '整体流程'], redirect: 'ch6-s6' },
  'ch6-s6-3': { type: 'leaf', chapter: 6, title: 'installPackagesLI五大环节', breadcrumb: ['第六章', 'APK的安装', '五大环节'], redirect: 'ch6-s6' },

  'ch6-s7': {
    type: 'section',
    chapter: 6,
    title: '第七节 · PMS之权限扫描',
    breadcrumb: ['第六章', '权限扫描'],
    sections: [
      { title: '权限扫描整体流程', html: `
        <p>PKMS执行systemReady()后，对/system/etc/permissions中的各种xml进行扫描，进行权限存储，供后续使用。</p>
        <ol class="step-list">
          <li>PKMS.systemReady() → SystemConfig.readPermissions()</li>
          <li>readPermissionsFromXml()解析每个xml文件</li>
          <li>存入SystemConfig相应的成员数组变量</li>
        </ol>
        <p><strong>SystemConfig.readPermissions()</strong>：遍历/system/etc/permissions目录下所有xml文件，先扫描其他xml，最后读取platform.xml（优先级最高）。</p>
      `},

// ============================================================
// 导航树渲染
// ============================================================
function buildTree(nodes, parentUl, level = 0) {
  nodes.forEach((node, idx) => {
    const li = document.createElement('li');
    if (level === 0) {
      li.className = `chapter-${node.chapter}`;
    }

    const item = document.createElement('div');
    item.className = 'node-item';
    if (node.interview) item.classList.add('interview');
    item.dataset.id = node.id;

    // 箭头
    const toggle = document.createElement('span');
    toggle.className = 'node-toggle';
    if (node.children && node.children.length > 0) {
      toggle.innerHTML = '▶';
    } else {
      toggle.classList.add('leaf');
    }
    item.appendChild(toggle);

    // 图标
    const icon = document.createElement('span');
    icon.className = 'node-icon';
    item.appendChild(icon);

    // 标签
    const label = document.createElement('span');
    label.className = 'node-label';
    label.textContent = node.label;
    item.appendChild(label);

    // 点击事件
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      // 切换展开/折叠
      if (node.children && node.children.length > 0) {
        const childUl = li.querySelector(':scope > ul');
        const isExpanded = childUl.classList.contains('expanded');
        if (isExpanded) {
          collapseNode(childUl, toggle);
        } else {
          expandNode(childUl, toggle);
        }
      }
      // 选中
      selectNode(node.id);
    });

    li.appendChild(item);

    // 子节点
    if (node.children && node.children.length > 0) {
      const childUl = document.createElement('ul');
      buildTree(node.children, childUl, level + 1);
      li.appendChild(childUl);
    }

    parentUl.appendChild(li);
  });
}

function expandNode(ul, toggle) {
  ul.classList.add('expanded');
  toggle.classList.add('expanded');
}

function collapseNode(ul, toggle) {
  ul.classList.remove('expanded');
  toggle.classList.remove('expanded');
}

function expandAll() {
  document.querySelectorAll('.tree ul').forEach(ul => ul.classList.add('expanded'));
  document.querySelectorAll('.node-toggle:not(.leaf)').forEach(t => t.classList.add('expanded'));
}

function collapseAll() {
  document.querySelectorAll('.tree ul').forEach(ul => ul.classList.remove('expanded'));
  document.querySelectorAll('.node-toggle').forEach(t => t.classList.remove('expanded'));
}

// ============================================================
// 全文内容构建 + 锚点跳转 + 滚动联动高亮
// ============================================================
let currentId = null;
let isScrollingByClick = false;
let scrollTimeout = null;

// 构建全文内容
function buildFullContent() {
  const contentArea = document.getElementById('contentArea');
  let html = '';

  // 遍历 knowledgeTree，按章节顺序构建
  knowledgeTree.forEach(chapter => {
    html += buildChapterContent(chapter);
  });

  contentArea.innerHTML = html;
}

// 构建单个章节的全部内容（章 + 所有子节）
function buildChapterContent(chapterNode) {
  let html = '';
  const chapterId = chapterNode.id;
  const chapterData = contentData[chapterId];

  // 章节点内容
  html += buildSectionBlock(chapterId, chapterData);

  // 递归构建所有子节点内容
  if (chapterNode.children && chapterNode.children.length > 0) {
    chapterNode.children.forEach(child => {
      html += buildSubSectionContent(child);
    });
  }

  return html;
}

// 构建子节内容（递归）
function buildSubSectionContent(node) {
  let html = '';
  const data = contentData[node.id];

  // 只渲染有实际内容的节点（非 leaf 重定向节点）
  if (data && data.type !== 'leaf') {
    html += buildSectionBlock(node.id, data);
  }

  if (node.children && node.children.length > 0) {
    node.children.forEach(child => {
      html += buildSubSectionContent(child);
    });
  }

  return html;
}

// 构建单个内容区块（带 id）
function buildSectionBlock(id, data) {
  if (!data) return '';

  const chapterColor = getChapterColor(data.chapter);
  const chapterName = getChapterName(data.chapter);

  let html = `<section class="content-section" id="section-${id}" data-id="${id}">`;

  // 面包屑
  if (data.breadcrumb && data.breadcrumb.length > 0) {
    html += '<div class="breadcrumb">';
    data.breadcrumb.forEach((crumb, i) => {
      if (i > 0) html += '<span class="crumb-sep">›</span>';
      if (i === data.breadcrumb.length - 1) {
        html += `<span class="crumb-current">${crumb}</span>`;
      } else {
        html += `<span>${crumb}</span>`;
      }
    });
    html += '</div>';
  }

  // 章节徽章
  if (data.type === 'chapter') {
    html += `<div class="chapter-badge" style="border-color: ${chapterColor}40; color: ${chapterColor};">
      <span class="badge-dot" style="background: ${chapterColor}; box-shadow: 0 0 8px ${chapterColor}80;"></span>
      ${chapterName} · 共 ${countSections(id)} 个知识点
    </div>`;
  }

  // 标题
  html += '<div class="content-header">';
  html += `<h1 class="content-title">${data.title}</h1>`;
  if (data.desc) html += `<p class="content-desc">${data.desc}</p>`;
  html += '</div>';

  // 章节内容
  if (data.type === 'chapter' && data.sections) {
    data.sections.forEach(section => {
      html += '<div class="section-block">';
      html += `<h2>${section.title}</h2>`;
      html += section.html;
      html += '</div>';
    });
  }

  // 小节内容
  if (data.type === 'section' && data.sections) {
    data.sections.forEach(section => {
      html += '<div class="section-block">';
      html += `<h3>${section.title}</h3>`;
      html += section.html;
      html += '</div>';
    });
  }

  // 面试题
  if (data.type === 'interview' && data.interviews) {
    html += '<div class="section-block">';
    html += `<h2>面试题（${data.interviews.length}道）</h2>`;
    html += '<p style="margin-bottom: 16px;">精选高频面试题，覆盖核心考点，建议结合前面知识系统学习后再来刷题。</p>';
    data.interviews.forEach((item, i) => {
      html += '<div class="interview-card">';
      html += `<div class="interview-question"><span class="q-label">Q${i + 1}</span><span>${item.q}</span></div>`;
      html += `<div class="interview-answer">${item.a}</div>`;
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</section>';
  return html;
}

// 选中节点：滚动到对应内容 + 高亮
function selectNode(id) {
  // 处理 leaf 重定向
  const data = contentData[id];
  let targetId = id;
  if (data && data.type === 'leaf' && data.redirect) {
    targetId = data.redirect;
  }

  // 移除旧选中
  document.querySelectorAll('.node-item.active').forEach(el => el.classList.remove('active'));
  // 添加新选中（用原始 id 高亮，而非重定向 id）
  const nodeEl = document.querySelector(`.node-item[data-id="${id}"]`);
  if (nodeEl) {
    nodeEl.classList.add('active');
    // 滚动到可见区域
    nodeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // 展开父级路径
  if (nodeEl) {
    let parent = nodeEl.parentElement;
    while (parent && parent.id !== 'treeRoot') {
      if (parent.tagName === 'UL') {
        parent.classList.add('expanded');
        const prevLi = parent.parentElement;
        if (prevLi) {
          const toggle = prevLi.querySelector(':scope > .node-item > .node-toggle');
          if (toggle) toggle.classList.add('expanded');
        }
      }
      parent = parent.parentElement;
    }
  }

  currentId = id;

  // 滚动到对应内容区块
  const section = document.getElementById(`section-${targetId}`);
  if (section) {
    isScrollingByClick = true;
    const mainEl = document.getElementById('mainContent');
    const offsetTop = section.offsetTop - 16;
    mainEl.scrollTo({ top: offsetTop, behavior: 'smooth' });

    // 滚动结束后重置标记
    if (scrollTimeout) clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      isScrollingByClick = false;
    }, 800);
  }
}

function navigateTo(id) {
  selectNode(id);
}

// 滚动联动：检测当前视口中最接近顶部的内容区块
function setupScrollSpy() {
  const mainEl = document.getElementById('mainContent');
  let ticking = false;

  mainEl.addEventListener('scroll', () => {
    if (!ticking) {
      window.requestAnimationFrame(() => {
        updateActiveSection();
        ticking = false;
      });
      ticking = true;
    }
  });
}

function updateActiveSection() {
  // 如果是点击触发的滚动，跳过联动检测（避免闪烁）
  if (isScrollingByClick) return;

  const mainEl = document.getElementById('mainContent');
  const sections = document.querySelectorAll('.content-section');
  const scrollTop = mainEl.scrollTop;
  const offset = 20; // 容差偏移

  // 如果已滚动到底部，高亮最后一个 section
  const isAtBottom = mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 10;
  if (isAtBottom && sections.length > 0) {
    const lastId = sections[sections.length - 1].dataset.id;
    if (lastId !== currentId) {
      highlightNavNode(lastId);
    }
    return;
  }

  let activeId = null;

  // 找到最后一个 offsetTop <= scrollTop + offset 的 section
  for (let i = 0; i < sections.length; i++) {
    const section = sections[i];
    if (section.offsetTop - offset <= scrollTop) {
      activeId = section.dataset.id;
    } else {
      break;
    }
  }

  // 如果还没到任何 section，高亮第一个
  if (!activeId && sections.length > 0) {
    activeId = sections[0].dataset.id;
  }

  if (activeId && activeId !== currentId) {
    highlightNavNode(activeId);
  }
}

function highlightNavNode(id) {
  currentId = id;

  // 移除旧选中
  document.querySelectorAll('.node-item.active').forEach(el => el.classList.remove('active'));

  // 添加新选中
  const nodeEl = document.querySelector(`.node-item[data-id="${id}"]`);
  if (nodeEl) {
    nodeEl.classList.add('active');
    nodeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // 展开父级路径
  if (nodeEl) {
    let parent = nodeEl.parentElement;
    while (parent && parent.id !== 'treeRoot') {
      if (parent.tagName === 'UL') {
        parent.classList.add('expanded');
        const prevLi = parent.parentElement;
        if (prevLi) {
          const toggle = prevLi.querySelector(':scope > .node-item > .node-toggle');
          if (toggle) toggle.classList.add('expanded');
        }
      }
      parent = parent.parentElement;
    }
  }
}

function getChapterColor(chapter) {
  const colors = {
    1: '#3dd6e0',
    2: '#5b8def',
    3: '#8b5cf6',
    4: '#f472b6',
    5: '#fbbf24',
    6: '#34d399'
  };
  return colors[chapter] || '#3dd6e0';
}

function getChapterName(chapter) {
  const names = {
    1: '系统启动流程分析',
    2: 'Binder解析',
    3: 'Handler解析',
    4: 'AMS解析',
    5: 'WMS解析',
    6: 'PKMS Android10.0'
  };
  return names[chapter] || '';
}

function countSections(chapterId) {
  let count = 0;
  function walk(nodes) {
    nodes.forEach(node => {
      if (node.children && node.children.length > 0) {
        walk(node.children);
      } else {
        count++;
      }
    });
  }
  const chapterNode = knowledgeTree.find(n => n.id === chapterId);
  if (chapterNode && chapterNode.children) walk(chapterNode.children);
  return count;
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const treeRoot = document.getElementById('treeRoot');
  buildTree(knowledgeTree, treeRoot, 0);

  // 构建全文内容
  buildFullContent();

  // 设置滚动联动高亮
  setupScrollSpy();

  // 默认全部折叠（buildTree默认就是折叠状态）
  // 默认高亮第一章
  selectNode('ch1');
});
