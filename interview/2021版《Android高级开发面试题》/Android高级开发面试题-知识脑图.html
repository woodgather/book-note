内。 RecyclerView比ListView多两级缓存 ListView缓存View。 RecyclerView", "缓存RecyclerView.ViewHolder"], "sub_items": [[1, "布局效果"], [2, "局部刷新"], [3, "缓存区别"]]}, {"id": "8.6", "title": "RecyclerView性能优化", "content_lines": ["简单来说就是在onBindViewHolder()只设置UI显示，不做任何逻辑判断，需要的业务逻辑在得到javabean之前处理", "好，", "减少过渡绘制 减少布局层级", "3.设置RecyclerView.addOnScrollListener()来在滑动过程中停止加载的操作。"], "sub_items": [[1, "数据处理与视图加载分离"], [2, "布局优化"], [9, "Viewpager&Fragment"]]}]}, {"id": "9", "title": "ViewPager & Fragment", "sections": [{"id": "9.1", "title": "Fragment的生命周期 & 结合Activity的生命周期", "content_lines": [], "sub_items": []}, {"id": "9.2", "title": "Activity和Fragment的通信方式， Fragment之间如何进行通信", "content_lines": ["Activity和Fragment", "1.采用Bundle的方式 在activity中建一个bundle，把要传的值存入bundle，然后通过fragment的", "setArguments（bundle）传到fragment，在fragment中，用getArguments接收。", "4.viewModel 做数据管理，activity 和 fragment 公用同个viewModel 实现数据传递", "Fragment之间", "3.Fragment 通过 getActivity 获取到Activity，Activity通过findFragmentByTag||findFragmentById获取", "Fragment,Fragment 实现接口."], "sub_items": [[2, "采用接口回调的方式"], [3, "EventBus的方式"], [1, "EventBus的方式"], [2, "采用接口回调的方式"]]}, {"id": "9.3", "title": "为什么使用Fragment.setArguments(Bundle)传递参数", "content_lines": ["Activity.onCreate(Bundle saveInstance)->Fragment.instantitate()", "当再次重建时会通过空参构造方法反射出新的fragment。并且给mArgments初始化为原先的值，而原来的", "Fragment实例的数据都丢失了。", "Activity重新创建时，会重新构建它所管理的Fragment，原先的Fragment的字段值将会全部丢失，但是通过", "Fragment.setArguments(Bundle bundle)方法设置的bundle会保留下来，并在重建时恢复。所以，尽量使用", "Fragment.setArguments(Bundle bundle)方式来进行参数传递。"], "sub_items": []}, {"id": "9.4", "title": "FragmentPageAdapter和FragmentStatePageAdapter区别及使用场", "content_lines": ["景", "使用FragmentPagerAdapter时 页面切换，只是调用detach，而不是remove，所以只执行onDestroyView，而不是", "onDestroy，不会摧毁Fragment实例，只会摧毁Fragment 的View；", "使用FragmentStatePageAdapter时 页面切换，调用remove，执行onDestroy。直接摧毁Fragment。", "FragmentPagerAdapter最好用在少数静态Fragments的场景，用户访问过的Fragment都会缓存在内存中，即使其", "视图层次不可见而被释放(onDestroyView) 。因为Fragment可能保存大量状态，因此这可能会导致使用大量内存。", "页面很多时，可以考虑FragmentStatePagerAdapter"], "sub_items": []}, {"id": "9.5", "title": "fragment懒加载", "content_lines": ["判断当前 Fragment 是否对用户可见，只是 onHiddenChanged() 是在 add+show+hide 模式下使用，", "setUserVisibleHint 是在 ViewPager+Fragment 模式下使用。", "老的懒加载处理方案", "对 ViewPager 中的 Fragment 懒加载", "方法1： 继承模式", "通过继承懒加载Fragment基类，在setUserVisibleHint中判断可见并且 当onViewCreated()表明View已经加载完毕后", "再掉用加载方法。", "方法2:代理+反射模式", "方法1：不可见的 Fragment 执行了 onResume() 方法。因为setUserVisibleHint位于onCreateView之前,此时为", "false，onResume之后为true，在true后加载相当于onResume()等方法在真实的createView之前调用，不可见的", "Fragment 执行了 onResume() 方法。", "Androidx 下的懒加载", "在 FragmentPagerAdapter 与 FragmentStatePagerAdapter 新增了含有 behavior 字段的构造函数", "如果 behavior 的值为 BEHAVIOR_RESUME_ONLY_CURRENT_FRAGMENT ，那么当前选中的 Fragment 在", "Lifecycle.State#RESUMED 状态 ，其他不可见的 Fragment 会被限制在 Lifecycle.State#STARTED 状态", "原因:FragmentPagerAdapter 在其 setPrimaryItem 方法中调用了 setMaxLifecycle, 所以说onResume中执行懒加", "载"], "sub_items": [[1, "adapter中getitem时new一个代理fragment"], [2, "setUserVisibleHint中根据反射得到真正的fragement"], [3, "通过add commit把真正的fragement添加到代理fragment中"]]}, {"id": "9.6", "title": "ViewPager2与ViewPager区别", "content_lines": ["1. FragmentStateAdapter 替代FragmentStatePagerAdapter，PagerAdapter被RecyclerView.Adapter替代", "4. 预加载当setOffscreenPageLimit被设置为OFFSCREEN_PAGE_LIMIT_DEFAULT时候会使用RecyclerView的缓存", "机制。"], "sub_items": [[2, "支持竖直滑动，禁止滑动"], [3, "PageTransformer用来设置页面动画，设置页面间距"]]}, {"id": "9.7", "title": "fragment嵌套问题", "content_lines": [], "sub_items": [[10, "WebView"]]}]}, {"id": "10", "title": "WebView", "sections": [{"id": "10.1", "title": "如何提高WebView加载速度", "content_lines": ["WebView启动过程大概分为以下几个阶段：", "图片名称", "App中打开WebView的第一步并不是建立连接，而是启动浏览器内核。", "预加载WebView。", "加载WebView的同时，请求H5页面数据。", "全局WebView", "在客户端刚启动时，就初始化一个全局的WebView待用，并隐藏；", "这种方法可以比较有效的减少WebView在App中的首次打开时间。当用户访问页面时，不需要初始化WebView的时", "间。", "当然这也带来了一些问题，包括：", "额外的内存消耗。", "页面间跳转需要清空上一个页面的痕迹，更容易内存泄露。", "客户端代理页面请求WebView初始化完成后向客户端请求数据", "在客户端初始化WebView的同时，直接由native开始网络请求数据；", "当页面初始化完成后，向native获取其代理请求的数据。", "asset存放离线包。", "DNS和链接慢", "想办法复用客户端使用的域名和链接，可以让客户端复用使用的域名与链接。", "DNS采用和客户端API相同的域名", "DNS会在系统级别进行缓存，对于WebView的地址，如果使用的域名与native的API相同，则可以直接使用缓存的"], "sub_items": [[1, "优化手段围绕着以下两个点进行"], [2, "常见的方法是"], [3, "除此之外还有一些其他的优化手段："]]}, {"id": "10.2", "title": "WebView与 js的交互", "content_lines": ["Android去调用JS的代码", "JS调用Android代码的方法", "2.通过 WebViewClient 的shouldOverrideUrlLoading ()方法回调拦截 url", "3.Android通过 WebChromeClient 的onJsAlert()、onJsConfirm()、onJsPrompt（方法回调分别拦截JS对话框（即上", "述三个方法），得到他们的消息内容，然后解析即可。"], "sub_items": [[1, "通过WebView的loadUrl（）"], [2, "通过WebView的evaluateJavascript（）"], [1, "通过WebView的addJavascriptInterface（）进行对象映射"]]}, {"id": "10.3", "title": "WebView的漏洞", "content_lines": ["任意代码执行漏洞", "JS调用Android的可以通过addJavascriptInterface接口进行对象映射", "当JS拿到Android这个对象后，就可以调用这个Android对象中所有的方法，包括系统类（java.lang.Runtime 类），", "从而进行任意代码执行。", "java.lang.Runtime 类，可以执行本地命令的", "解决", "对于Android 4.2以前，需要采用拦截prompt（）的方式进行漏洞修复", "原理", "每次当 WebView 加载页面前加载一段本地的 JS 代码，", "让JS调用一Javascript方法：该方法是通过调用prompt（）把JS中的信息（含特定标识，方法名称等）传递到", "Android端；", "在Android的onJsPrompt（）中 ，解析传递过来的信息，再通过反射机制调用Java对象的方法，这样实现安全的JS调", "用Android代码。", "对于Android 4.2以后，则只需要对被调用的函数以 @JavascriptInterface进行注解", "密码明文存储漏洞", "WebView默认开启密码保存功能", "原因 WebView默认开启密码保存功能：mWebView.setSavePassword(true) 开启后，在用户输入密码时，会弹出提", "示框：询问用户是否保存密码； 如果选择”是”，密码会被明文保到", "/data/data/com.package.name/databases/webview.db 中，这样就有被盗取密码的危险 解决 关闭密码保存提醒：", "WebSettings.setSavePassword(false)"], "sub_items": []}, {"id": "10.4", "title": "JsBridge原理", "content_lines": ["JavaScript 调用 Native", "注入 API 和 拦截 URL SCHEME。", "注入API", "在 4.2 之前，Android 注入 JavaScript 对象的接口是 addJavascriptInterface，但是这个接口有漏洞，可以被不法分", "子利用，危害用户的安全，因此在 4.2 中引入新的接口 @JavascriptInterface（上面代码中使用的）来替代这个接", "口，解决安全问题。所以 Android 注入对对象的方式是 有兼容性问题的。", "拦截 URL SCHEME", "mWebView.registerHandler(\"startload\", (data, function) -> { function.onCallBack(\"aaaaa\");});", "1.初始化webview时,将WebViewJavascriptBridge.js文件注入页面。向body中添加一个不可见的iframe元素。通过", "改变一个不可见的iframe的src就可以让webview拦截到url，而用户是无感知的。", "2.Web 端通过某种方式（例如 iframe.src）发送 URL Scheme 请求，通过shouldOverrideUrlLoading来拦截约定规", "则的Ur", "Native 调用 JavaScript", "mWebView.callHandler(\"test\", mJson, data -> LogUtil.d(回调:\" + data));", "webView.loadUrl(\"javascript:\" + javaScriptString);", "dosend发送消息时,带上callId，如果Js在调用Handler的时候设置了回调方法，会调用queueMessage的方法，然后", "往下就是走Native给Js发送消息的步骤。", "B4%A2/"], "sub_items": [[1, "优点"], [1, "JavaScript 端可以确定 JSBridge 的存在，直接调用即可"], [2, "H5同时适配Android和iOS两个平台"], [3, "java与js的交互存在一些安全漏洞"], [2, "原理"], [11, "动画"]]}]}, {"id": "11", "title": "动画", "sections": [{"id": "11.1", "title": "动画的类型", "content_lines": [], "sub_items": []}, {"id": "11.1", "title": "1.视图动画", "content_lines": ["android:duration=\"3000\" // 动画持续时间（ms），必须设置，动画才有效果 android:startOffset =\"1000\" // 动画", "延迟开始时间（ms） android:fillBefore = “true” // 动画播放完后，视图是否会停留在动画开始的状态，默认为true", "android:fillAfter = “false” // 动画播放完后，视图是否会停留在动画结束的状态，优先于fillBefore值，默认为false", "android:fillEnabled= “true” // 是否应用fillBefore值，对fillAfter值无影响，默认为true android:repeatMode=", "“restart” // 选择重复播放动画模式，restart代表正序重放，reverse代表倒序回放，默认为restart|", "android:repeatCount = “0” // 重放次数（所以动画的播放次数=重放次数+1），为infinite时无限重复", "android:interpolator = @nim/interpolator_resource // 插值器，即影响动画的播放速度,下面会详细讲"], "sub_items": []}, {"id": "11.1", "title": "2补间动画", "content_lines": ["平移动画（Translate） // 1. fromXDelta ：视图在水平方向x 移动的起始值 // 2. toXDelta ：视图在水平方向x 移动", "的结束值 // 3. fromYDelta ：视图在竖直方向y 移动的起始值 // 4. toYDelta：视图在竖直方向y 移动的结束值 缩放动", "画（scale） android:fromXScale=\"0.0\" // 动画在水平方向X的起始缩放倍数 // 0.0表示收缩到没有；1.0表示正常无", "伸缩 // 值小于1.0表示收缩；值大于1.0表示放大 android:toXScale=\"2\" //动画在水平方向X的结束缩放倍数", "android:fromYScale=\"0.0\" //动画开始前在竖直方向Y的起始缩放倍数 android:toYScale=\"2\" //动画在竖直方向Y的结", "束缩放倍数 android:pivotX=\"50%\" // 缩放轴点的x坐标 android:pivotY=\"50%\" // 缩放轴点的y坐标 旋转动画", "（rotate） android:fromDegrees=\"0\" // 动画开始时 视图的旋转角度(正数 = 顺时针，负数 = 逆时针)", "android:toDegrees=\"270\" // 动画结束时 视图的旋转角度(正数 = 顺时针，负数 = 逆时针) android:pivotX=\"50%\" //", "旋转轴点的x坐标 android:pivotY=\"0\" // 旋转轴点的y坐标 透明度动画（alpha） android:fromAlpha=\"1.0\" // 动画", "开始时视图的透明度(取值范围: -1 ~ 1) android:toAlpha=\"0.0\"// 动画结束时视图的透明度(取值范围: -1 ~ 1)"], "sub_items": []}, {"id": "11.1", "title": "3逐帧动画", "content_lines": ["按序播放一组预先定义好的图片", "xml:animation-list", "// item = 动画图片资源；duration = 设置一帧持续时间(ms)", "属性动画", "what", "顾名思义，通过控制对象的属性，来实现动画效果。官方定义：定义一个随着时间 （注：停个顿）更改任何对象属", "性的动画，无论其是否绘制到屏幕上", "链接：https://www.jianshu.com/p/821ef6d1e1c9", "Duration：定义动画时长，默认是300 ms。", "Time interpolation: 时间插值器，它可以指定属性值如何随时间变化的，反应了动画的运动速率。", "Repeat count and behavior: 指定当动画结束时是否重复动画以及动画重复多少次，还可以设置反向播放动画，播放", "到达指定次数后动画结束。", "Animator sets：把一组动画聚在一起，顺序播放或者同时播放或者延迟播放。", "Frame refresh delay：指定刷新动画帧的频率，默认时间是10ms，但是刷新频率最终取决于系统是否繁忙以及系统", "服务底层计时器的快慢。", "why"], "sub_items": []}, {"id": "11.2", "title": "补间动画和属性动画的区别", "content_lines": ["a. 作用对象局限：View", "补间动画 只能够作用在视图View上，即只可以对一个Button、TextView、甚至是LinearLayout、或者其它继承自", "View的组件进行动画操作，但无法对非View的对象进行动画操。", "有些情况下的动画效果只是视图的某个属性 & 对象而不是整个视图； 如，现需要实现视图的颜色动态变化，那么就", "需要操作视图的颜色属性从而实现动画效果，而不是针对整个视图进行动画操作", "b. 没有改变View的属性，只是改变视觉效果", "补间动画只是改变了View的视觉效果，而不会真正去改变View的属性。", "如，将屏幕左上角的按钮 通过补间动画 移动到屏幕的右下角", "点击当前按钮位置（屏幕右下角）是没有效果的，因为实际上按钮还是停留在屏幕左上角，补间动画只是将这个按钮", "绘制到屏幕右下角，改变了视觉效果而已。", "c. 动画效果单一", "补间动画只能实现平移、旋转、缩放 & 透明度这些简单的动画需求"], "sub_items": []}, {"id": "11.3", "title": "ObjectAnimator，ValueAnimator及其区别", "content_lines": ["ObjectAnimator", "位移", "val objectAnimation =ObjectAnimator.ofFloat(llAddAccount, \"translationX\", 0f, -70f) 第三参数为可变长参数，第", "一个值为动画开始的位置，第二个值为结束值得位置，如果数组大于3位数，那么前者将是后者的起始位置", "旋转 val objectAnimation = ObjectAnimator.ofFloat(tvText, \"rotation\", 0f,180f,0f)", "ofFloat()方法的可变长参数，如果后者的值大于前者，那么顺时针旋转，小于前者，则逆时针旋转。", "缩放", "val objectAnimation =ObjectAnimator.ofFloat(tvText, \"scaleX\", 1f,2f)", "ofFloat()方法传入参数属性为scaleX和scaleY时，动态参数表示缩放的倍数", "透明 val objectAnimation =ObjectAnimator.ofFloat(tvText, \"alpha\", 1f,0f,1f)", "ValueAnimator", "val valueAnimator = ValueAnimator.ofFloat(0f, 180f) valueAnimator.addUpdateListener { tvText.rotationY =", "it.animatedValue as Float //手动赋值 } valueAnimator.start()", "等价于", "ObjectAnimator.ofFloat(tvText, \"rotationY\", 0f, 180f).apply { start() }", "ValueAnimator作为ObjectAnimator的父类，主要动态计算目标对象属性的值，然后设置给对象属性，达到动画效", "果", "使用ValueAnimator实现动画，需要手动赋值给目标对象tvText的rotationY，而ObjectAnimator则是自动赋值，不", "需要手动赋值就可以达到效果", "ObjectAnimator和ValueAnimator区别"], "sub_items": []}, {"id": "11.4", "title": "TimeInterpolator插值器，自定义插值器", "content_lines": ["TimeInterpolator", "它的作用是根据时间流逝的百分比来计算出当前属性值改变的百分比", "插值器 ，Interpolator负责控制动画变化的速率，使得基本的动画效果能够以匀速、加速、减速、抛物线速率等各种", "速率变化", "匀速插值器 https://blog.csdn.net/qinxiandiqi/article/details/51719926 图1假设了一个对象需要对它的x属性设定", "动画，这个x属性代表这个对象在屏幕上面的横坐标。这个动画的时间设定为40毫秒，以及需要移动的距离是40个像", "素。每过10毫秒（默认的帧频率），这个对象就会在水平方向上移动10个像素。等到40毫秒之后，这个动画停止，", "对象在水平方向上总共移动了40个像素。这个例子中的动画使用了一个线性插值器，意味着这个对象以匀速移动。", "例子: http://static.kancloud.cn/alex_wsc/android_art/1828610", "，当时间t=20ms的时候，时间流逝的百分比是0.5（20/40=0.5）意味着现在时间过了一半，那x应该改变多少呢这个", "就由插值器和估值算法来确定", "拿线性插值器来说，当时间流逝一半的时候，x的变换也应该是一半，即x的改变是0.5，为什么呢？因为它是线性插", "值器，是实现匀速动画的", "估值器evaluate的三个参数分别表示估值小数、开始值和结束值，对应于我们的例子就分别是0.5、0、40。根据上述", "算法，整型估值返回给我们的结果是20，这就是（x=20, t=20ms）的由来。", "系统已有的插值器： ①LinearInterpolator（线性插值器）：匀速动画。 ②AccelerateDecelerateInterpolator（加", "速减速插值器）：动画两头慢，中间快。 ③DecelerateInterpolator（减速插值器）：动画越来越慢课。", "自定义插值器", "写一个自定义Interpolator：先减速后加速", "public class DecelerateAccelerateInterpolator implements TimeInterpolator {"], "sub_items": []}, {"id": "11.5", "title": "TypeEvaluator估值器", "content_lines": ["TypeEvaluator", "估值器 据当前属性改变的百分比来计算改变后的属性值", "①IntEvaluator：针对整型属性 ②FloatEvaluator：针对浮点型属性 ③ArgbEvaluator：针对Color属性", "public class FloatEvaluator implements TypeEvaluator {", "// FloatEvaluator实现了TypeEvaluator接口", "// 重写evaluate() public Object evaluate(float fraction, Object startValue, Object endValue) {", "// 参数说明 // fraction：表示动画完成度（根据它来计算当前动画的值） // startValue、endValue：动画的初始值和", "结束值 float startFloat = ((Number) startValue).floatValue();", "return startFloat + fraction * (((Number) endValue).floatValue() - startFloat);", "// 初始值 过渡 到结束值 的算法是：", "// 1\\. 用结束值减去初始值，算出它们之间的差值", "// 2\\. 用上述差值乘以fraction系数", "// 3\\. 再加上初始值，就得到当前动画的值", "}", "实例", "实现的动画效果：一个圆从一个点 移动到 另外一个点", "2:创建动画对象 & 设置初始值 和 结束值 ValueAnimator anim = ValueAnimator.ofObject(new PointEvaluator(),", "startPoint, endPoint);", "3.自定义PointEvaluator,evaluate根据插值器的速率计算出Point 的x,y 4.通过 值 的更新监听器，将改变的对象手动", "赋值给当前对象"], "sub_items": [[1, "onDraw画圆canvas.drawCircle(x, y, RADIUS, mPaint)"], [5, "每次赋值后就重新绘制，从而实现动画效果"], [12, "Bitmap"]]}]}, {"id": "12", "title": "Bitmap", "sections": [{"id": "12.1", "title": "Bitmap 内存占用的计算", "content_lines": ["占用的内存大小 = 像素总数量（图片宽x高）x 每个像素的字节大小", "每个像素的字节大小与Bitmap的色彩模式有关", "public static final Bitmap.Config ALPHA_8 //代表8位Alpha位图 每个像素占用1byte内存", "public static final Bitmap.Config ARGB_4444 //代表16位ARGB位图 每个像素占用2byte内存", "public static final Bitmap.Config ARGB_8888 //代表32位ARGB位图 每个像素占用4byte内存", "public static final Bitmap.Config RGB_565 //代表8位RGB位图 每个像素占用2byte内存", "假设这张图片是ARGB_8888的，那这张图片占的内存就是 width * height * 4个字节或者 width * height *", "inTargetDensity /inDensity * 4", "加载一张本地Res、Raw资源图片，得到的是图片的原始尺寸 * 缩放系数(inDensity)", "inTargetDensity 为当前屏幕像素密度(宽平方+高平方)/尺寸。", "inDensity默认为图片所在文件夹对应的密度()", "densityDpi 160 240 320 480 640", "资源目录dpi mdpi hdpi xhdpi xxhdpi xxxhdpi；", "像素密度 5.0英寸的手机的屏幕分辨率为1280x720，那么像素密度为192dpi", "占用的内存 = width * height * targetDensity/inDensity * 一个像素所占的内存", "读取SD卡上的图,得到的是图片的原始尺寸", "占用的内存 = width * height * 一个像素所占的内存。"], "sub_items": []}, {"id": "12.2", "title": "getByteCount() & getAllocationByteCount()的区别", "content_lines": ["如果被复用的Bitmap的内存比待分配内存的Bitmap大", "getByteCount()获取到的是当前图片应当所占内存大小", "getAllocationByteCount()获取到的是被复用Bitmap真实占用内存大小", "在复用Bitmap的情况下，getAllocationByteCount()可能会比getByteCount()大。"], "sub_items": []}, {"id": "12.3", "title": "Bitmap的压缩方式", "content_lines": ["质量压缩，不会对内存产生影响；", "采样率压缩，比例压缩，会对内存产生影响；", "质量压缩", "不会减少图片的像素，它是在保持像素的前提下改变图片的位深及透明度等", "图片的长，宽，像素都不变，那么bitmap所占内存大小是不会变的", "ByteArrayOutputStream baos = new ByteArrayOutputStream();", "src.compress(Bitmap.CompressFormat.JPEG, quality, baos);", "byte[] bytes = baos.toByteArray();", "Bitmap mBitmap = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);", "RGB_565法", "改变一个像素所占的内存", "BitmapFactory.Options options2 = new BitmapFactory.Options();", "options2.inPreferredConfig = Bitmap.Config.RGB_565;", "bm = BitmapFactory.decodeFile(Environment .getExternalStorageDirectory().getAbsolutePath()", "+ \"/DCIM/Camera/test.jpg\", options2);", "采样率压缩", "设置inSampleSize的值(int类型)后，假如设为n，则宽和高都为原来的1/n，宽高都减少，内存降低", "BitmapFactory.Options options = new BitmapFactory.Options();", "options.inSampleSize = 2;", "bm = BitmapFactory.decodeFile(Environment.getExternalStorageDirectory().getAbsolutePath()+"], "sub_items": []}, {"id": "12.4", "title": "LruCache & DiskLruCache原理", "content_lines": ["LRU（Least Recently Used）", "LruCache的核心思想就是维护一个缓存对象列表，从表尾访问数据，在表头删除数据。对象列表的排课列方式是按照", "访问顺序实现，就是 当访问的数据项在链表中存在时，则将该数据项移动到表尾，否则在表尾新建一个数据项。当", "链表容量超过一定阈值，则移除表头的数据。", "利用LinkedHashMap数组+双向链表的数据结构来实现的。其中双向链表的结构可以实现访问顺序和插入顺序，使得", "LinkedHashMap中的accessOrder设置为true则为访问顺序，为false，则为插入顺序。", "写入缓存", "1插入元素，并相应增加当前缓存的容量。", "2调用trimToSize()开启一个死循环，不断的从表头删除元素，直到当前缓存的容量小于最大容量为止。", "读取缓存", "调用LinkedHashMap的get()方法，注意如果该元素存在，这个方法会将该元素移动到表尾.", "DiskLruCache", "利用 LinkedHashMap实现算法LRU", "DiskLruCache 有三个内部类，分别为 Entry、Snapshot 和 Editor。", "Entry是 DiskLruCache 内 LinkedHashMap Value 的基本结构。", "Journal 文件", "DiskLruCache 通过在磁盘中创建并维护一个简单的Journal文件来记录各种缓存操作，。记录的类型有4种，分别为", "READ、REMOVE、CLEAN和DIRTY。", "写入缓存的时候会向journal文件写入一条以DIRTY开头的数据表示正在进行写操作，当写入完毕时，分两种情况：", "1、写入成功，会向journal文件写入一条以CLEAN开头的文件，其中包括该文件的大小。 2、写入失败，会向journal"], "sub_items": []}, {"id": "12.5", "title": "如何设计一个图片加载库", "content_lines": [], "sub_items": [[1, "对图片进行内存压缩；"], [2, "高分辨率的图片放入对应文件夹；"], [3, "缓存"], [4, "及时回收"]]}, {"id": "12.6", "title": "有一张非常大的图片,如何去加载这张大图片", "content_lines": [], "sub_items": []}, {"id": "12.7", "title": "如果把drawable-xxhdpi下的图片移动到drawable-xhdpi下，图片内", "content_lines": ["存是如何变的。", "验证 原图：1000宽X447高，位于drawable-xxhdpi（480dpi）文件包，设备Pixel-XL（560dpi）。使用默认", "Bitmap.Config=ARGB_8888,设置inSampleSize=2", "缩放比=主动设置×被动设置=1/2×(560/480)=0.5×1.166=0.5833", "一个像素所占的内存=ARGB_8888=32bit=4byte", "原始大小=1000×447", "width * height * *", "内存占用=(原始宽×缩放比)×(原始高×缩放比)×targetDensity/inDensity×一个像素所占的内存", "=1000×0.5833×447×0.5833×4 =583×260×4 =606320byte ≈0.578MB", "，"], "sub_items": []}, {"id": "12.8", "title": "如果在hdpi、xxhdpi下放置了图片，加载的优先级。如果是400800", "content_lines": ["10801920，加载的优先级。", "优先会去更高密度的文件夹下找这张图片，我们当前的场景就是drawable-xxxhdpi文件夹，然后发现这里也没有", "android_logo这张图，接下来会尝试再找更高密度的文件夹，发现没有更高密度的了，这个时候会去drawable-", "nodpi文件夹找这张图，发现也没有，那么就会去更低密度的文件夹下面找，依次是drawable-xhdpi -> drawable-", "hdpi -> drawable-mdpi -> drawable-ldp", "0dpi ~ 120dpi ldpi", "120dpi ~ 160dpi mdpi", "160dpi ~ 240dpi hdpi", "240dpi ~ 320dpi xhdpi", "320dpi ~ 480dpi xxhdpi", "480dpi ~ 640dpi xxxhdpi", "原理", "视图层(View)", "一般采用XML文件进行界面的描述，这些XML可以理解为AndroidApp的View。", "控制层(Controller)", "Android的控制层的重任通常落在了众多的Activity的肩上。", "模型层(Model)", "我们针对业务模型，建立的数据结构和相关的类，就可以理解为AndroidApp的Model，Model是与View无关，而与", "业务相关的。对数据库的操作、对网络等的操作都应该在Model里面处理，当然对业务计算等操作也是必须放在的该", "层的。"], "sub_items": [[13, "mvc&mvp&mvvm"], [1, "MVC及其优缺点"], [2, "MVP及其优缺点"]]}]}, {"id": "13", "title": "架构模式 (MVC/MVP/MVVM)", "sections": [{"id": "13.1", "title": "MVC及其优缺点", "sub_items": [], "content_lines": ["MVC 是 Model View Controller 的缩写。", "Model：数据模型层，负责处理数据的加载和存储。", "View：视图层，负责界面数据的展示，与用户进行交互。", "Controller：控制层，负责逻辑处理，更新模型和视图。", "优点：一定程度上实现了 Model 与 View 的分离，降低了代码耦合。", "缺点：Controller 职责过重，View 和 Model 还是存在耦合，不利于维护和测试。"]}, {"id": "13.2", "title": "MVP及其优缺点", "sub_items": [], "content_lines": ["MVP 是 Model View Presenter 的缩写。", "View 与 Model 并不直接交互，而是通过与 Presenter 交互来与 Model 间接交互。", "Presenter 层持有 View 层的引用，同时持有 Model 层的引用。", "优点：View 与 Model 完全分离，修改 View 不影响 Model，可进行单元测试。", "缺点：Presenter 层代码会越来越臃肿，维护成本高。"]}, {"id": "13.3", "title": "MVVM及其优缺点", "sub_items": [], "content_lines": ["MVVM 是 Model View ViewModel 的缩写。", "ViewModel 与 Presenter 大致相同，都负责处理数据和实现业务逻辑。", "ViewModel 层不应该直接或者间接持有 View 层的引用。", "采用数据绑定的方式，View 的变化会自动通知 ViewModel。", "优点：实现了数据的双向绑定，减少了代码量，View 和 ViewModel 完全解耦。", "缺点：学习成本较高，调试困难，数据绑定使得 Bug 定位困难。"]}, {"id": "13.4", "title": "MVC与MVP区别", "sub_items": [], "content_lines": ["在 MVC 中 View 可以与 Model 直接交互，而在 MVP 中 View 与 Model 不直接交互。", "MVP 中 View 与 Presenter 通过接口交互，更便于单元测试。", "MVC 的 Controller 基于行为，可被多个 View 共享。", "MVP 的 Presenter 与 View 是一对一的关系。"]}, {"id": "13.5", "title": "MVP与MVVM区别", "sub_items": [], "content_lines": ["MVVM 实现了数据双向绑定，ViewModel 不持有 View 引用。", "MVP 中 Presenter 持有 View 引用，通过接口回调更新 View。", "MVVM 相比 MVP 代码量更少，但学习成本更高。"]}]}, {"id": "14", "title": "Binder & IPC", "sections": [{"id": "14.1", "title": "Android中进程和线程的关系,区别", "content_lines": ["它是系统进行资源分配和调度的一个独立单位,也就是说进程是可以独立运行的一段程序。", "线程进程的一个实体，是CPU调度和分派的基本单位，他是比进程更小的能独立运行的基学本单位,线程自己基本上不", "拥有系统资源。在运行时，只是暂用一些计数器、寄存器和栈 。", "上下文。", "2、进程间相互独立，同一进程的各线程间共享。", "3、进程间通信IPC，线程间可以直接读写进程数据段（如全局变量）来进行通信——需要进程同步和互斥手段的辅", "助，以保证数据的一致性。"], "sub_items": [[1, "进程是什么？"], [2, "线程又是什么？"], [1, "进程有不同的代码和数据空间，而多个线程则共享数据空间，每个线程有自己的执行堆栈和程序计数器为其执行"]]}, {"id": "14.2", "title": "为何需要进行IPC,多进程通信可能会出现什么问题", "content_lines": ["为了保证进程空间不被其他进程破坏或干扰，Linux中的进程是相互独立或相互隔离的。在Android系统中一个应用", "默认只有一个进程，每个进程都有自己独立的资源和内存空间，其它进程不能任意访问当前进程的内存和资源。这样", "导致在不同进程的四大组件没法进行通信，线程间没法做同步，静态变量和单例也会失效。所以需要有一套IPC机制", "来解决进程间通信、数据传输的问题。", "开启多进程虽简单，但会引发如下问题，必须引起注意。", "对于前两个问题，可以这么理解，在Android中，系统会为每个应用或进程分配独立的虚拟机，不同的虚拟机自然占", "有不同的内存地址空间，所以同一个类的对象会产生不同的副本，导致共享数据失败，必然也不能实现线程的同步。", "由于SharedPreferences底层采用读写XML的文件的方式实现，多进程并发的的读写很可能导致数据异常。", "Application被多次创建和前两个问题类似，系统在分配多个虚拟机时相当于把同一个应用重新启动多次，必然会导", "致 Application 多次被创建，为了防止在 Application 中出现无用的重复初始化，可使用进程名来做过滤，只让指定", "进程的才进行全局初始：", "public class MyApplication extends Application{", "@Override", "public void onCreate() {", "super.onCreate();", "String processName = \"com.shh.ipctest\";", "if (getPackageName().equals(processName)){", "// do some init", "}", "}"], "sub_items": [[1, "静态成员和单例模式失效"], [2, "线程同步机制失效"], [3, "SharedPreferences 可靠性降低"], [4, "Application 被多次创建"]]}, {"id": "14.3", "title": "Android中IPC方式有几种、各种方式优缺点", "content_lines": [], "sub_items": []}, {"id": "14.4", "title": "为何新增Binder来作为主要的IPC方式", "content_lines": ["Android也是基于Linux内核，Linux现有的进程通信手段有管道/消息队列/共享内存/套接字/信号量。", "既然有现有的IPC方式，为什么重新设计一套Binder机制呢", "主要是出于以上三个方面的考量：", "1、效率：传输效率主要影响因素是内存拷贝的次数，拷贝次数越少，传输速率越高。从Android进程架构角度分", "析：对于消息队列、Socket和管道来说，数据先从发送方的缓存区拷贝到内核开辟的缓存区中，再从内核缓存区拷贝", "到接收方的缓存区，一共两次拷贝。", "一次数据传递需要经历：用户空间 –> 内核缓存区 –> 用户空间，需要2次数据拷贝，这样效率不高。", "而对于Binder来说，数据从发送方的缓存区拷贝到内核的缓存区，而接收方的缓存区与内核的缓存区是映射到同一块", "物理地址的，节省了一次数据拷贝的过程 ： 共享内存不需要拷贝，Binder的性能仅次于共享内存。", "2、稳定性：上面说到共享内存的性能优于Binder，那为什么不采用共享内存呢，因为共享内存需要处理并发同步问", "题，容易出现死锁和资源竞争，稳定性较差。 Binder基于C/S架构 ，Server端与Client端相对独立，稳定性较好。", "3、安全性：传统Linux IPC的接收方无法获得对方进程可靠的UID/PID，从而无法鉴别对方身份；而Binder机制为每", "个进程分配了UID/PID，且在Binder通信时会根据UID/PID进行有效性检测。"], "sub_items": []}, {"id": "14.5", "title": "什么是Binder", "content_lines": ["从进程间通信的角度看，Binder 是一种进程间通信的机制；", "从 Server 进程的角度看，Binder 指的是 Server 中的 Binder 实体对象(Binder类 IBinder)；", "从 Client 进程的角度看，Binder 指的是对 Binder 代理对象，是 Binder 实体对象的一个远程代理", "从传输过程的角度看，Binder 是一个可以跨进程传输的对象；Binder 驱动会自动完成代理对象和本地对象之间的转", "换。", "从Android Framework角度来说，Binder是ServiceManager连接各种Manager和相应ManagerService的桥梁", "Binder跨进程通信机制：基于C/S架构，由Client、Server、ServerManager和Binder驱动组成。", "进程空间分为用户空间和内核空间。用户空间不可以进行数据交互；内核空间可以进行数据交互，所有进程共用一个", "内核空间", "Client、Server、ServiceManager均在用户空间中实现，而Binder驱动程序则是在内核空间中实现的；"], "sub_items": []}, {"id": "14.6", "title": "Binder的原理", "content_lines": ["Binder Driver 如何在内核空间中做到一次拷贝的", "进程空间分为用户空间和内核空间。用户空间不可以进行数据交互；内核空间可以进行数据交互，所有进程共用一个", "内核空间。", "应用程序不能直接操作设备硬件地址,如果用户空间需要读取磁盘的文件， 如果不采用内存映射， 需要两次拷贝（磁", "盘-->内核空间-->用户空间）；", "内存映射将用户空间的一块内存区域映射到内核空间。映射关系建立后，内核空间对这段区域的修改也能直接反应到", "用户空间,少了一次拷贝。", "Binder 驱动使用 mmap() 在内核空间创建数据接收的缓存空间。 mmap(NULL, MAP_SIZE, PROT_READ,", "MAP_PRIVATE, fd, 0)的返回值是内核空间映射在用户空间的地址", "1.Binder 驱动在内核空间创建一个数据接收缓存区。", "2.在内核空间开辟一块内核缓存区，建立内核缓存区和内核空间的数据接收缓存区之间的映射关系，以及内核中数据", "接收缓存区和接收进程用户空间地址的映射关系。", "3.发送方进程通过系统调用 copyfromuser() 将数据 copy 到内核空间的内核缓存区，由于内核缓存区和接收进程的用", "户空间存在内存映射，因此也就相当于把数据发送到了接收进程的用户空间，这样便完成了一次进程间的通信。"], "sub_items": []}, {"id": "14.7", "title": "使用Binder进行数据传输的具体过程", "content_lines": ["系统层面:", "注册服务", "服务进程向Binder进程发起服务注册", "Binder驱动将注册请求转发给ServiceManager进程", "ServiceManager进程添加这个服务进程", "获取服务", "用户进程向Binder驱动发起获取服务的请求，传递要获取的服务名称Binder驱动", "将该请求转发给ServiceManager进程", "ServiceManager进程查到到用户进程需要的服务进程信息最后", "通过Binder驱动将上述服务信息返回个用户进程", "使用服务", "2.根据ServiceManager查到的服务的进程和数据缓存区 , 数据缓存区和client进程的内存缓存区建立映射", "具体代码层面:", "2、客户端通过AIDL接口中的asInterface()将这个Binder对象转换为代理Proxy并通过它发起RPC请求", "3、client进程的请求数据data通过代理binder对象的transact方法，发送到内核空间，当前线程被挂起", "4、server进程收到binder驱动通知， onTransact(在线程池中进行数据反序列化&调用目标方法)处理客户端请求，", "并将结果写入reply"], "sub_items": [[1, "Binder通过内存映射建立数据缓存区"], [3, "client掉用copy_from_user数据到内存缓存区"], [4, "收到binder启动后服务进程根据用户进程要求调用目标方法"], [5, "服务进程将目标方法的结果返回给用户进程"], [1, "服务端中的Service给客户端提供Binder对象"], [5, "Binder驱动将server进程的目标方法执行结果，拷贝到client进程的内核空间"], [6, "Binder驱动通知client进程，之前挂起的线程被唤醒，并收到返回结果"]]}, {"id": "14.8", "title": "Binder框架中ServiceManager的作用", "content_lines": ["ServiceManager使得客户端可以获取服务端binder实例对象的引用"], "sub_items": []}, {"id": "14.9", "title": "什么是AIDL", "content_lines": ["AIDL是android提供的接口定义语言，简化Binder的使用 ， 轻松地实现IPC进程间通信机制。 AIDL会生成一个服务", "端对象的代理类，通过它客户端可以实现间接调用服务端对象的方法。"], "sub_items": []}, {"id": "14.10", "title": "AIDL使用的步骤", "content_lines": ["书写 AIDL", "创建要操作的实体类，实现 Parcelable 接口，以便序列化/反序列化", "新建 aidl 文件夹，在其中创建接口 aidl 文件以及实体类的映射 aidl 文件", "Make project ，生成 Binder 的 Java 文件", "编写服务端", "创建 Service，在Service中创建生成的Stub实例，实现接口定义的方法", "在 onBind() 中返回Binder实例", "编写客户端", "实现 ServiceConnection 接口，在其中通过asInterface拿到 AIDL 类", "bindService()", "调用 AIDL 类中定义好的操作请求"], "sub_items": []}, {"id": "14.11", "title": "AIDL支持哪些数据类型", "content_lines": ["Java八种基本数据类型(int、char、boolean、double、float、byte、long、string) 但不支持short", "String、CharSequence", "List和Map，List接收方必须是ArrayList，Map接收方必须是HashMap", "实现Parcelable的类"], "sub_items": []}, {"id": "14.12", "title": "AIDL的关键类，方法和工作流程", "content_lines": ["Client和Server都使用同一个AIDL文件，在AIDL 编译后会生成java文件 ,其中有Stub服务实体和Proxy服务代理两个", "类", "AIDL接口：编译完生成的接口继承IInterface。", "Stub类： 服务实体，Binder的实现类，服务端一般会实例化一个Binder对象，在服务端onBind中绑定，", "客户端asInterface获取到Stub。", "这个类在编译aidl文件后自动生成，它继承自Binder，表示它是一个Binder本地对象；它是一个抽象类，实现了", "IInterface接口，表明它的子类需要实现Server将要提供的具体能力（即aidl文件中声明的方法）。", "Stub.Proxy类： 服务的代理，客户端asInterface获取到Stub.Proxy。", "它实现了IInterface接口，说明它是Binder通信过程的一部分；它实现了aidl中声明的方法，但最终还是交由其中的", "mRemote成员来处理，说明它是一个代理对象，mRemote成员实际上就是BinderProxy。", "asInterface()：客户端在ServiceConnection通过Person.Stub.asInterface(IBinder)， 会根据是同一进行通信，还是", "不同进程通信，返回Stub()实体，或者Stub.Proxy()代理对象", "transact()：运行在客户端，当客户端发起远程请求时，内部会把信息包 装好，通过transact()向服务端发送。并将当", "前线程挂起， Binder驱动完成一系列的操作唤醒 Server 进程 ，调用 Server 进程本地对象的 onTransact()来调用相", "关函数 。 到远程请求返回，当前线程继续执行。", "onTransact()：运行在服务端的Binder线程池中，当客户端发起跨进程请求时， onTransact()根据 Client传来的", "code 调用相关函数 。调用完成后把数据写入Parcel，通过reply发送给Client。 驱动唤醒 Client 进程里刚刚挂起的线", "程并将结果返回。"], "sub_items": []}, {"id": "14.13", "title": "如何优化多模块都使用AIDL的情况", "content_lines": ["每个业务模块创建自己的AIDL接口并创建Stub的实现类，向服务端提供自己的唯一标识和实现类。", "服务端只需要一个Service，创建Binder连接池接口,跟据业务模块的特征来返回相应的Bin学der对象.", "客户端掉 用时通过Binder连接池， 即将每个业务模块的Binder请求统一转发到一个远程Service中去执行， 从而避", "免重复创建Service。"], "sub_items": []}, {"id": "14.14", "title": "使用 Binder 传输数据的最大限制是多少，被占满后会导致什么问题", "content_lines": ["因为Binder本身就是为了进程间频繁而灵活的通信所设计的，并不是为了拷贝大数据而使用的。比如在Activity之间", "传输BitMap的时候，如果Bitmap过大，就会引起问题，比如崩溃等，这其实就跟Binder传输数据大小的限制有关系", "mmap函数会为Binder数据传递映射一块连续的虚拟地址，这块虚拟内存空间其实是有大小限制。", "普通的由Zygote孵化而来的用户进程，所映射的Binder内存大小是不到1M的，准确说是 110241024) - (4096 *2)", "#define BINDER_VM_SIZE ((1*1024*1024) - (4096 *2))", "特殊的进程ServiceManager进程，它为自己申请的Binder内核空间是128K，这个同ServiceManager的用途是分不", "开的，ServcieManager主要面向系统Service，只是简单的提供一些addServcie，getService的功能，不涉及多大的", "数据传输，因此不需要申请多大的内存：", "bs = binder_open(128*1024);", "当服务端的内存缓冲区被Binder进程占用满后，Binder驱动不会再处理binder调用并在c++层抛出", "DeadObjectException到binder客户端"], "sub_items": []}, {"id": "14.15", "title": "Binder 驱动加载过程中有哪些重要的步骤", "content_lines": ["从 Java 层来看就像访问本地接口一样，客户端基于 BinderProxy 服务端基于 IBinder 对象 。", "在Native层有一套完整的binder通信的C/S架构，Bpinder作为客户端，BBinder作为服务端。基于naive层的Binder", "框架，Java也有一套镜像功能的binder C/S架构，通过JNI技术，与native层的binder对应，Java层的binder功能最终", "都是交给native的binder来完成。", "从内核看跨进程通信的原理最终是要基于内核的，所以最会会涉及到 binder_open 、binder_mmap 和 binder_ioctl", "这三种系统调用。"], "sub_items": []}, {"id": "14.16", "title": "系统服务与bindService启动的服务的区别", "content_lines": ["服务可分为系统服务与普通服务，系统服务一般是在系统启动的时候，由SystemServer进程创建并注册到", "ServiceManager中 例如AMS，WMS，PMS。而普通服务一般是通过ActivityManagerService启动的服务，或者说通", "过四大组件中的Service组件启动的服务。不同主要从以下几个方面：", "服务的启动方式 系统服务这些服务本身其实实现了Binder接口，作为Binder实体注册到ServiceManager中，被", "ServiceManager管理。这些系统服务是位于SystemServer进程中", "普通服务一般是通过Activity的startService或者其他context的startService启动的，这里的Service组件只是个封装，", "主要的是里面Binder服务实体类，这个启动过程不是ServcieManager管理的，而是通过ActivityManagerService进", "行管理的，同Activity管理类似", "服务的注册与管理", "系统服务一般都是通过ServiceManager的addService进行注册的，这些服务一般都是需要拥有特定的权限才能注册", "到ServiceManager，而bindService启动的服务可以算是注册到ActivityManagerService，只不过", "ActivityManagerService管理服务的方式同ServiceManager不一样，而是采用了Activity的管理模型", "服务的请求使用方式", "使用系统服务一般都是通过ServiceManager的getService得到服务的句柄，这个过程其实就是去ServiceManager中", "查询注册系统服务。而bindService启动的服务，主要是去ActivityManagerService中去查找相应的Service组件，最", "终会将Service内部Binder的句柄传给Client"], "sub_items": []}, {"id": "14.17", "title": "Activity的bindService流程", "content_lines": ["1、Activity调用bindService：通过Binder通知ActivityManagerService，要启动哪个Service", "2、ActivityManagerService创建ServiceRecord，并利用ApplicationThreadProxy回调，通知APP新建并启动", "Service启动起来", "3、ActivityManagerService把Service启动起来后，继续通过ApplicationThreadProxy，通知APP，bindService，其", "实就是让Service返回一个Binder对象给ActivityManagerService，以便AMS传递给Client", "4、ActivityManagerService把从Service处得到这个Binder对象传给Activity，这里是通过IServiceConnection", "binder实现。", "5、Activity被唤醒后通过Binder Stub的asInterface函数将Binder转换为代理Proxy，完成业务代理的转换，之后就", "能利用Proxy进行通信了。"], "sub_items": []}, {"id": "14.18", "title": "不通过AIDL，手动编码来实现Binder的通信", "content_lines": [], "sub_items": [[15, "内存泄漏&内存溢出"]]}]}, {"id": "15", "title": "内存泄漏 & OOM", "sections": [{"id": "15.1", "title": "什么是OOM & 什么是内存泄漏以及原因", "content_lines": ["内存泄漏", "什么是", "没有用的对象资源任与GC-Root保持可达路径，导致系统无法进行回收。", "原因", "1 非静态内部类默示持有外部类的引用，如非静态handler持有activity的引用", "内存溢出", "根据java的内存模型会出现内存溢出的内存有堆内存、 方法区内存、虚拟机栈内存、native方法区内存， 一般说的", "OOM基本都是针对堆内存；", "（1）app进程内存达到上限", "（2）手机可用内存不足，这种情况并不是我们app消耗了很多内存， 而是整个手机内存不足", "（1）申请内存的速度超出gc释放内存的速度.往内存中加载超大文件，加载的文件或者图片过大造成或者循环创建大", "量对象", "（2）内存出现泄漏，gc无法回收泄漏的内存，导致可用内存越来越少"], "sub_items": [[2, "接收器、监听器注册没取消造成的内存泄漏，如广播，eventsbus"], [3, "Activity 的 Context 造成的泄漏，可以使用 ApplicationContext"], [4, "单例中的static成员间接或直接持有了activity的引用"], [5, "资源对象没关闭造成的内存泄漏（如： Cursor、File等）"], [6, "全局集合类强引用没清理造成的内存泄漏（特别是 static 修饰的集合）"], [1, "对于堆内存溢出主的根本原因有两种"], [2, "对于app内存达到上限只有两种情况"]]}, {"id": "15.2", "title": "Thread是如何造成内存泄露的，如何解决？", "content_lines": ["垃圾回收器不会回收GC Roots以及那些被它们间接引用的对象", "非静态内部类会持有外部类的引用。Thread 会长久地持有 Activity 的引用，使得系统无法回收 Activity 和它所关联", "的资源和视图。", "使用静态内部类/匿名类，不要使用非静态内部类/匿名类。", "该养成为thread设置退出逻辑条件的习惯。"], "sub_items": []}, {"id": "15.3", "title": "Handler导致的内存泄露的原因以及如何解决", "content_lines": ["原因:1.Java中非静态内部类和匿名内部类都会隐式持有当前类的外部引用", "2.我们在Activity中使用非静态内部类初始化了一个Handler, 此Handler就会持有当前Activity的引用。", "3.我们想要一个对象被回收，那么前提它不被任何其它对象持有引用， 所以当我们Activity页面关闭之后,存在引用关", "系： \"未被处理 / 正处理的消息 -> Handler实例 -> 外部类\", 如果在Handler消息队列 还有未处理的消息 / 正在处理消", "息时 导致Activity不会被回收，从而造成内存泄漏", "解决方案: 1.将Handler的子类设置成 静态内部类,使用WeakReference弱引用持有Activity实例"], "sub_items": [[2, "当外部类结束生命周期时，清空Handler内消息队列"]]}, {"id": "15.4", "title": "如何加载Bitmap防止内存溢出", "content_lines": [], "sub_items": [[1, "对图片进行内存压缩；"], [2, "高分辨率的图片放入对应文件夹；"], [3, "内存复用"], [4, "及时回收"]]}, {"id": "15.5", "title": "MVP中如何处理Presenter层以防止内存泄漏的", "content_lines": ["首先 MVP 会出现内存泄漏是因为 Presenter 层持有 View 对象，一般我们会把 Activity 做为 View 传递到", "Presenter，Presenter 持有 View对象，Activity 退出了但是没有回收出现内存泄漏。", "解决办法： 1.Activity onDestroy() 方法中调用 Presenter 中的方法，把 View 置为 null"], "sub_items": [[2, "使用 Lifecycle"], [16, "性能优化"]]}]}, {"id": "16", "title": "性能优化", "sections": [{"id": "16.1", "title": "内存优化", "content_lines": ["首先你要确保你的应用里没有存在内存泄漏，然后再去做其他的内存优化。内存泄漏和图片优化相对来说比较容易定位问题，", "且优化后效果也非常明显，性价比非常高。", "事实上很多优化都是这样，比如减包大小的优化，也是要先分析出主要大头祸首，比如可能你的包里包含了一张3M", "大小的无用图片，如果你没找到这种祸首，可能你做了大量的工作去想办法减少无用代码等，最终可能只有几百K的", "收益。", "Handler内存泄漏", "在Activity中使用非静态内部类初始化了一个Handler,此Handler就会持有当前Activity的引用。Activity页面关闭之后,", "存在引用关系。非静态内部类和匿名内部类都会隐式持有当前类的外部引用。", "单例造成的内存泄漏", "单例持有 Context 对象，如果 Activity 中调用 getInstance 方法并传入 this 时，singleTon 就持有了此 Activity 的引", "用，当退出 Activity 时，Activity 就无法回收，造成内存泄漏", "资源性对象未关闭，注册对象未注销", "例如Bitmap等资源未关闭会造成内存泄漏，例如BraodcastReceiver、EventBus未注销造成的内存泄漏，我们应该", "在Activity销毁时及时注销。", "MVP中的内存泄漏", "Presenter 层持有 View 对象，一般我们会把 Activity 做为 View 传递到 Presen享ter，Presenter 持有 View对象，", "Activity 退出了但是没有回收出现内存泄漏。", "ViewPager+fragment内存泄露", "List里一直有Fragment的引用，Fragment无法回收造成内存泄漏 在重写的PagerAdapter的getItem()方法中，", "return new yourFragment()解决此问题"], "sub_items": [[1, "内存泄漏和图片优化"], [1, "1 避免内存泄漏"], [1, "1.1 注意代码中常见内存泄漏场景"], [1, "1.2 使用工具查找内存泄漏具体位置"], [1, "2 图片优化"], [1, "对图片进行内存压缩；"], [2, "高分辨率的图片放入对应文件夹；"], [3, "缓存"], [4, "及时回收"], [5, "ARTHook非侵入式之图片检查"], [2, "内存占用分析优化"], [2, "1静态内存分析优化"], [2, "2 动态内存分析优化"]]}, {"id": "16.2", "title": "启动优化", "content_lines": ["统计启动时间的方式", "adb shell am start -S -R 10 -W", "com.ctg.and.mob.cuservice/com.ctg.and.mob.cuservice.mvp.ui.activity.MainActivity", "TotalTime代表当前Activity启动时间，将多次TotalTime加起来求平均即可得到启动这个Activity的时间", "缺点", "应用的启动过程往往不只一个Activity，有可能是先进入一个启动页，然后再从启动页打开真正的首页。某些情况下", "还有可能中间经过更多的Activity，这个时候需要将多个Activity的时间加起来。", "将多个Activity启动时间加起来并不完全等于用户感知的启动时间。例如在启动页可能是先等待某些初始化完成堂或者", "某些动画播放完毕后再进入首页。使用命令行统计的方式只是计算了Activity的启动以及初始化时间，并不能体现这", "种等待任务的时间。", "解决", "AMS会通过Zygote创建应用程序的进程后,执行Application构造方法 –> attachBaseContext() –> onCreate() –>", "Activity onCreate() –>–> onStart() –> onResume() –> 测量布局绘制显示在界面上–>onWindowFocusChanged()绘", "制完毕 在Application的attachBaseContext()方法中开始计算冷启动计时，然后在真正首页Activity的", "onWindowFocusChanged()中停止冷启动计时。", "代码", "设置一个Util类专门做计时,Application的attachBaseContext()开始,首页Activity的 onWindowFocusChanged()结束", "具体代码方法耗时分析工具", "每个方法前记录System.currentTimeMillis(),之后System.currentTimeMillis()进行相减", "Aspect统计 Application 中所有方法的耗时，AspectJ 其实就是一种 AOP 框架"], "sub_items": [[1, "手动记录"], [2, "AOP"], [2, "1、连接点（JoinPoint）"], [2, "2、切入点（PointCut）"], [2, "3、通知（Advice）"], [3, "Android Profiler得到启动过程的CPU过程，看到线程的具体代码耗时"], [1, "启动闪屏主题设置"], [2, "线程池和启动器"], [2, "线程池"], [2, "2.启动器"], [4, "延迟执行任务"], [3, "首页"]]}, {"id": "16.3", "title": "布局优化", "content_lines": ["布局加载流程", "原理", "3%E5%B1%80%E4%BC%98%E5%8C%96%EF%BC%88%E4%B8%8A%EF%BC%89/", "1、在setContentView方法中，会通过LayoutInflater的inflate方法去加载对应的布局到android.R.id.content中。", "2、inflate方法中首先会调用Resources的getLayout方法去通过IO的方式去加载对应的Xml布局解析器到内存中。", "调用链最终掉用的是 AssetManager的openXmlAssetNative,一个Native方法，通过IO流的方式进行。", "方法返回XmlResourceParser,XmlResourceParser继承XmlPullParser, 根据提供的布局资源文件id可读取布局文件", "中view相关属性。", "3、inflate，createViewFromTag来创建View的实例，在每次递归完成的时候将这个View添加到父布局中。", "内部首先会判断mFactory2是否存在，存在就会使用mFactory2的onCreateView方法区创建视图，否则就会调用", "mFactory的onCreateView方法，接下来，如果此时的tag是一个Fragment，则会调用mPrivateFactory的", "onCreateView方法", "createViewFromTag 将一些 控件变成兼容性控件 （例如将 TextView 变成 AppCompatTextView）以便于向下兼容", "新版本中的效果 ，创建View，使用类加载器创建了对应的Class实例， 根据Class实例获取到了对应的构造器实例，", "通过构造器实例constructor的newInstance方法创建了对应的View对象", "LayoutInflater.Factory的意义：", "通过 LayoutInflater 创建 View 时候的一个回调，可以通过 LayoutInflater.Factory 来改造或定制创建 View 的过程。", "AppCompatActivity 为什么 setFactory", "向下兼容新版本中的效果。", "Factory与Factory2的区别："], "sub_items": [[1, "CPU主要负责Measure、Layout、Record、Execute的数据计算工作"], [5, "3 视图与数据绑定耗时"]]}, {"id": "16.4", "title": "卡顿优化", "content_lines": ["%AE%E9%A2%98%E4%BB%8B%E7%BB%8D", "卡顿原因", "FPS（帧率）：每秒显示帧数（Frames per Second）。表示图形处理器每秒钟能够更新的次数。高的帧率可以得到", "更流畅、更逼真的动画。一般来说12fps大概类似手动快速翻动书籍的帧率，这明显是可以感知到不够顺滑的。 提升", "至60fps则可以明显提升交互感和逼真感", "开发app的性能目标就是保持60fps，这意味着每一帧你只有16ms≈1000/60的时间来处理所有的任务。Android系统", "每隔16ms发出VSYNC信号，触发对UI进行渲染，如果每次渲染都成功，这样就能够达到流畅的画面所需要的", "60fps。", "android中某个操作花费时间是24ms，系统在得到VSYNC信号的时候就无法进行正常渲染，这样就发生了丢帧现", "象。那么用户在32ms内看到的会是同一帧画面。就会感觉到界面不流畅了（卡了一下）。丢帧导致卡顿产生。", "卡顿优化就是监控和分析由于哪些因素的影响导致绘制渲染任务没有在一个vsync的时间内完成。尤其关注连续丢帧", "点。", "卡顿产生的原因是错综复杂的，它涉及到代码、内存、绘制、IO、CPU等等", "卡顿监控", "1.BlockCanary: 动态检测消息执行耗时。 基于消息机制，向Looper中设置Printer，监控dispatcher到finish之间的", "操作，满足耗时阀值dump堆栈、设备信息，以通知形式弹出卡顿信息以供分析 非侵入式的性能监控组件，通知形式", "弹出卡顿信息 AndroidPerformanceMonitor implementation 'com.github.markzhai:blockcanary-android:1.5.0' h", "ttps://github.com/markzhai/AndroidPerformanceMonitor", "ANR-WatchDog", "界面打开页面从onCreate到onWindowFocusChanged耗时统计 Activity/Fragement 生命周期耗时统计 我们也需要"], "sub_items": [[2, "ANR"], [3, "单点问题监控"]]}, {"id": "16.5", "title": "网络优化", "content_lines": ["D%A0%E7%8E%A9%E8%BD%ACAndroid%E6%80%A7%E8%83%BD%E5%88%86%E6%9E%90%E4%B8%8E%E4", "%BC%98%E5%8C%96/#Java%E5%86%85%E5%AD%98%E5%9B%9E%E6%94%B6%E7%AE%97%E6%B3%95", "流量消耗过多", "请求次数", "模拟数据", "弱网模拟"], "sub_items": [[1, "流量维度"], [3, "1.1 自定义事件监听器"], [4, "1 数据缓存 4.2 数据压缩 4.3 图片压缩"], [2, "质量维度"], [17, "Window&WindowManager"]]}]}, {"id": "17", "title": "Window & WindowManager", "sections": [{"id": "17.1", "title": "什么是Window", "content_lines": ["视图承载器，是一个视图的顶层窗口， 包含了View并对View进行管理, 是一个抽象类，具体的实现类为", "PhoneWindow,内部持有DecorView。 通过WindowManager创建，并通过WindowManger将DecorView添加进", "来。"], "sub_items": []}, {"id": "17.2", "title": "什么是WindowManager", "content_lines": ["WindowManager是一个接口，继承自只有添加、删除、更新三个方法的ViewManager接口。 它的实现类为", "WindowManagerImpl，WindowManagerImpl通过WindowManagerGlobal代理实现addView， 最后调用到", "ViewRootImpl的setView 使ViewRoot和Decorview相关联。如果要对Window进行添加和删除就需要使用", "WindowManager， 具体的工作则由WMS来处理，WindowManager和WMS通过Binder来进行跨进程通信。", "ViewRoot是View和WindowManager的桥梁，View通过WindowManager来转接调用ViewRootImpl View的三大流", "程(测量（measure），布局（layout），绘制（draw）)均通过ViewRoot来完成。 Android的所有触屏事件、按键", "事件、界面刷新等事件都是通过ViewRoot进行分发的。"], "sub_items": [[3, "什么是ViewRootImpl"]]}, {"id": "17.4", "title": "什么是DecorView", "content_lines": ["DecorView是FrameLayout的子类，它可以被认为是Android视图树的根节点视图, 一般情况下它内部包含一个竖直", "方向的LinearLayout，在这个LinearLayout里面有上下三个部分， 上面是个ViewStub,延迟加载的视图（应该是设置", "ActionBar,根据Theme设置）， 中间的是标题栏(根据Theme设置，有的布局没有)，下面的是内容栏。", "setContentView就是把需要添加的View的结构添加保存在DecorView中。"], "sub_items": []}, {"id": "17.5", "title": "Activity，View，Window三者之间的关系", "content_lines": ["Activity并不负责视图控制，它只是控制生命周期和处理事件，Activity中持有的是Window Window是视图的承载", "器，内部持有一个 DecorView，而这个DecorView才是 view 的根布局", "View就是视图,在setContentView中将R.layout.activity_main添加到DecorView。"], "sub_items": []}, {"id": "17.6", "title": "DecorView什么时候被WindowManager添加到Window中", "content_lines": ["即使Activity的布局已经成功添加到DecorView中，DecorView此时还没有添加到Window中", "ActivityThread的handleResumeActivity方法中，首先会调用Activity的onResume方法，接着调用Activity的", "makeVisible()方法", "makeVisible()中完成了DecorView的添加和显示两个过程"], "sub_items": [[18, "AMS"]]}]}, {"id": "18", "title": "AMS", "sections": [{"id": "18.1", "title": "ActivityManagerService是什么？什么时候初始化的？有什么作用？", "content_lines": ["ActivityManagerService 主要负责系统中四大组件的启动、切换、调度及应用进程的管理和调度等工作，其职责与操", "作系统中的进程管理和调度模块类似。", "ActivityManagerService进行初始化的时机很明确，就是在SystemServer进程开启的时候，就会初始化", "ActivityManagerService。（系统启动流程）", "如果打开一个App的话，需要AMS去通知zygote进程， 所有的Activity的生命周期AMS来控制"], "sub_items": []}, {"id": "18.2", "title": "ActivityThread是什么?ApplicationThread是什么?他们的区别", "content_lines": ["ActivityThread", "在Android中它就代表了Android的主线程,它是创建完新进程之后,main函数被加载，然后执行一个loop的循环使当", "前线程进入消息循环，并且作为主线程。", "ApplicationThread", "ApplicationThread是ActivityThread的内部类， 是一个Binder对象。在此处它是作为IApplicationThread对象的", "server端等待client端的请求然后进行处理，最大的client就是AMS。"], "sub_items": []}, {"id": "18.3", "title": "Instrumentation是什么？和ActivityThread是什么关系？", "content_lines": ["AMS与ActivityThread之间诸如Activity的创建、暂停等的交互工作实际上是由Instrumentation具体操作的。每个", "Activity都持有一个Instrumentation对象的一个引用， 整个进程中是只有一个Instrumentation。", "mInstrumentation的初始化在ActivityThread::handleBindApplication函数。", "可以用来独立地控制某个组件的生命周期。", "Activity`的`startActivity`方法。`startActivity`会调用`mInstrumentation.execStartActivity();", "mInstrumentation掉用AMS,AMS通过socket通信告知Zygote进程fork子进程。"], "sub_items": []}, {"id": "18.4", "title": "ActivityManagerService和zygote进程通信是如何实现的。", "content_lines": ["应用启动时,Launcher进程请求AMS。 AMS发送创建应用进程请求，Zygote进程接受请求并fork应用进程", "客户端发送请求", "调用 Process.start() 方法新建进程", "连接调用的是 ZygoteState.connect() 方法，ZygoteState 是 ZygoteProcess 的享内部类。ZygoteState里用的", "LocalSocket", "public static ZygoteState connect(LocalSocketAddress address) throws IOException {", "DataInputStream zygoteInputStream = null;", "BufferedWriter zygoteWriter = null;", "final LocalSocket zygoteSocket = new LocalSocket();", "try {", "zygoteSocket.connect(address);", "zygoteInputStream = new DataInputStream(zygoteSocket.getInputStream());", "zygoteWriter = new BufferedWriter(new OutputStreamWriter(", "zygoteSocket.getOutputStream()), 256);", "} catch (IOException ex) {", "try {", "zygoteSocket.close();", "} catch (IOException ignore) {", "}", "throw ex;"], "sub_items": []}, {"id": "18.5", "title": "ActivityRecord、TaskRecord、ActivityStack，", "content_lines": ["ActivityStackSupervisor，ProcessRecord", "ActivityRecord", "Activity管理的最小单位，它对应着一个用户界面", "ActivityRecord是应用层Activity组件在AMS中的代表，每一个在应用中启动的Activity，在AMS中都有一个", "ActivityRecord实例来与之对应，这个ActivityRecord伴随着Activity的启动而创建，也伴随着Activity的终止而销毁。", "TaskRecord", "TaskRecord即任务栈， 每一个TaskRecord都可能存在一个或多个ActivityRecord，栈顶的ActivityRecord表示当前可", "见的界面。", "一个App是可能有多个TaskRecord存在的", "一般情况下,启动App的第一个activity时，AMS为其创建一个TaskRecord任务栈", "特殊情况,启动singleTask的Activity，而且为该Activity指定了和包名不同的taskAffinity， 也会为该activity创建一个", "新的TaskRecord", "ActivityStack", "ActivityStack,ActivityStack是系统中用于管理TaskRecord的,内部维护了一个A享rrayList。", "ActivityStackSupervisor内部有两个不同的ActivityStack对象：mHomeStack、mFocusedStack，用来管理不同的任", "务。", "我们启动的App对应的TaskRecord由非Launcher ActivityStack管理，它是在系统启动第一个app时创建的。", "ActivityStackSupervisor", "ActivityStackSupervisor管理着多个ActivityStack，但当前只会有一个获取焦点(Focused)的ActivityStack;", "AMS对象只会存在一个，在初始化的时候，会创建一个唯一的ActivityStackSupervisor对象"], "sub_items": []}, {"id": "18.6", "title": "ActivityManager、ActivityManagerService、", "content_lines": ["ActivityManagerNative、ActivityManagerProxy的关系", "Activity的startActivity方法。startActivity会调用mInstrumentation.execStartActivity();", "execStartActivity通过ActivityManager的getService。", "代码层面:", "ActivityManager.getRunningServices里通过ActivityManagerNative.getDefault得到此代理对象", "ActivityManagerProxy，ActivityManagerProxy代理类是ActivityManagerNative的内部类。ActivityManagerNative", "是个抽象类，真正发挥作用的是它的子类ActivityManagerService。", "介绍:", "ActivityManager", "ActivityManager官方介绍：是与系统所有正在运行着的Acitivity进行交互，对系统所有运行中的Activity相关信息", "（Task，Memory，Service，App）进行管理和维护。", "ActivityManagerNative、ActivityManagerProxy", "IActivityManager继承了Interface接口。而ActivityManagerNative和ActivityManagerPorxy实现了这个", "IActivityManager接口", "ActivityManagerProxy代理类是ActivityManagerNative的内部类；", "ActivityManagerNative是个抽象类，真正发挥作用的是它的子类ActivityManagerService", "ActivityManager持有的是这个ActivityManagerPorxy代理对象，这样，只需要操作这个代理对象就能操作其业务实", "现的方法。那么真正实现其也业务的则是ActivityManagerService。", "ActivityManagerNative这个类，他继承了Binder而Binder实现了IBinder接口。其子类则是", "ActivityManagerService。"], "sub_items": []}, {"id": "18.7", "title": "手写实现简化版AMS", "content_lines": ["AMS与Binder相关，其中要明白下面几个类的职责:", "IBinder：跨进程通信的Base接口，它声明了跨进程通信需要实现的一系列抽象方法，实现了这个接口就说明可以进", "行跨进程通信，所有的Binder实体都必须实现IBinder接口。", "IInterface：这也是一个Base接口，用来表示Server提供了哪些能力，是Client和Server通信的协议，Client和Server", "都要实现此接口。", "Binder：IBinder的子类，Java层提供服务的Server进程持有一个Binder对象从而完成跨进程间通信。", "BinderProxy：在Binder.java这个文件中还定义了一个BinderProxy类，这个类表示Binder代理对象它同样实现了", "IBinder接口。Client中拿到的实际上是这个代理对象。", "public interface IActivityManager extends IInterface {", "//binder描述符", "String DESCRIPTOR = \"android.app.IActivityManager\";", "//方法编号", "int TRANSACTION_startActivity = IBinder.FIRST_CALL_TRANSACTION + 0;", "//声明一个启动activity的方法，为了简化，这里只传入intent参数", "int startActivity(Intent intent) throws RemoteException;", "}", "public abstract class ActivityManagerNative extends Binder implements IActivityManager {", "public static IActivityManager asInterface(IBinder obj) {", "if (obj == null) {", "return null;"], "sub_items": [[1, "首先定义IActivityManager接口(继承IInterface)："], [2, "实现ActivityManagerService侧的本地Binder对象基类："], [3, "实现Client侧的代理对象："], [4, "实现Binder本地对象（IActivityManager接口）："], [19, "系统启动"]]}]}, {"id": "19", "title": "系统启动", "sections": [{"id": "19.1", "title": "Android系统启动流程", "content_lines": ["Android系统架分为应用层，framework层，系统运行库层（Native)，Linux内核层 启动按照一个流程：Loader-", ">kernel->framework->Application来进行的", "当电源按下时，引导芯片代码 从 ROM (4G)开始执行。Bootloader引导程序把操作系统映像文件拷贝到RAM中", "去，然后跳转到它的入口处去执行,启动Linux内核。", "Linux kernel内核启动,会做设置缓存,加载驱动等一些列操作", "当内核启动完成之后,启动init进程,作为第一个系统进程,init进程从内核态转换成用户态。", "fork出ServerManager子进程。 ServerManager主要用于管理我们的系统服务，他内部存在一个server服务", "列表，这个列表中存储的就是那些已经注册的系统服务。", "解析init.rc配置文件并启动Zygote进程", "孵化其他应用程序进程，所有的应用的进程都是由zygote进程fork出来的。 通过创建服务端Socket,等待AMS的", "请求来创建新的应用程序进程。", "创建SystemServer进程,在Zygote进程启动之后,会通过ZygoteInit的main方法fork出SystemServer进程", "创建SystemServiceManager，它用来对系统服务进行创建、启动和生命周期管理。", "ServerManager.startService启动各种系统服务：WMS/PMS/AMS等，调用ServerManager的addService方，", "将这些Service服务注册到ServerManager里面", "启动桌面进程，这样才能让用户见到手机的界面。", "开启系统Launcher程序来完成系统界面的加载与显示。", "图片名称"], "sub_items": [[1, "Bootloader引导"], [2, "init进程启动"], [3, "Zygote进程启动"], [4, "SystemServer进程启动"], [5, "Launcher进程启动"]]}, {"id": "19.2", "title": "SystemServer，ServiceManager，SystemServiceManager的关系", "content_lines": ["在SystemServer进程中创建SystemServiceManager, ServiceManager是系统服务管理者,SysytemServiceManager", "启动一些继承自SystemService的服务，并将这些服务的Binder注册到ServiceManager中，对于其他的一些继承于", "IBinder的服务,通过ServiceMaanager的addService方法添加", "SystemServer：", "SystemServer是一个由zygote孵化出来的进程， 名字为system_server 。 SystemServer叫做系统服务进程，大部", "分Android提供的一些系统服务都运行在该进程中,包括AMS，WMS，PMS，这些系统的服务都是以一个线程的方式", "存在在SysyemServer进程中。", "SystemServiceManager：", "管理一些系统的服务，在SystemServer中初始化。启动各种系统服务：WMS/PMS/AMS等,调用ServerManager的", "addService方，将这些Service服务注册到ServerManager里面", "ServiceManager：", "ServiceManager像是一个路由，Service把自己注册在ServiceManager中,客户端 通过ServiceManager查询服务", "1、维护一个svclist列表来存储service信息。", "2、向客户端提供Service的代理，也就是BinderProxy。", "3、维护一个死循环，不断的查看是否有service的操作请求，如果有就读取相应的内核binder driver。"], "sub_items": []}, {"id": "19.3", "title": "孵化应用进程这种事为什么不交给SystemServer来做，而专门设计一", "content_lines": ["个Zygote", "Zygote进程是所有Android进程的母体，包括system_server和各个App进程。zygote利用fork()方法生成新进", "程，对于新进程A复用Zygote进程本身的资源，再加上新进程A相关的资源，构成新的应用进程A。应用在启动", "的时候需要做很多准备工作，包括启动虚拟机，加载各类系统资源等等，这些都是非常耗时的，如果能在", "zygote里就给这些必要的初始化工作做好，子进程在fork的时候就能直接共享，那么这样的话效率就会非常高", "SystemServer里跑了一堆系统服务，这些不能继承到应用进程"], "sub_items": []}, {"id": "19.4", "title": "Zygote的IPC通信机制为什么使用socket而不采用binder", "content_lines": ["Zygote是通过fork生成进程的", "因为fork只能拷贝当前线程，不支持多线程的fork，fork的原理是copy-on-write机制，当父子进程任一方修改", "内存数据时（这是on-write时机），才发生缺页中断，从而分配新的物理内存（这是copy操作）。zygote进程", "中已经启动了虚拟机、进行资源和类的预加载以及各种初始化操作，App进程用时拷贝即可。Zygotefork出来", "的进程A只有一个线程，如果Zygote有多个线程，那么A会丢失其他线程。这时可能造成死锁。", "Binder通信需要使用Binder线程池,binder维护了一个16个线程的线程池，fork()出的App进程的binder通讯没", "法用"], "sub_items": [[20, "App启动&打包&安装"]]}]}, {"id": "20", "title": "App启动&打包&安装", "sections": [{"id": "20.1", "title": "应用启动流程", "content_lines": ["点击图标发生在Launcher应用的进程,实际上执行的是Launcher的onClick方法，在onClick里面会执行到", "Activity的startActivity方法。startActivity会调用mInstrumentation.execStartActivity();", "execStartActivity通过ActivityManager的getService方法来得到AMS的代理对象(Launcher进程作为客户", "端与服务端AMS不在同一个进程,ActivityManager.getService返回的是IActivityManager.Stub的代理对象,此", "时如果要实现客户端与服务端进程间的通信， 需要AMS继承IActivityManager.Stub类并实现相应的方法,这样", "Launcher进程作为客户端就拥有了服务端AMS的代理对象，然后就可以调用AMS的方法来实现具体功能了)", "AMS通过socket通信告知Zygote进程fork子进程。", "应用进程启动ActivityThread,执行ActivityThread的main方法。", "main方法中创建ApplicationThread，Looper，Handler 对象，并开启主线程消息循环Looper.loop()。", "3.App进程通过Binder向AMS(sytem_server)发起attachApplication请求,A享MS绑定ApplicationThread", "在ActivityThread的main中,通过ApplicationThread.attach(false, startSeq),将AMS绑定", "ApplicationThread对象,这样AMS就可以通过这个代理对象 来控制应用进程。", "system_server进程在收到请求后，进行一系列准备工作后，再通过binder向App进程发送", "scheduleLaunchActivity请求；AMS将启动Activity的请求发送给ActivityThread的Handler。", "App进程的binder线程（ApplicationThread）在收到请求后，通过handler向主线程发送LAUNCH_ACTIVITY", "消息； 主线程在收到Message后，通过发射机制创建目标Activity，并回调Activity.onCreate()等方法。 到", "此，App便正式启动，开始进入Activity生命周期，执行完onCreate/onStart/onResume方法，UI渲染结束后", "便可以看到App的主界面。"], "sub_items": [[1, "Launcher进程请求AMS"], [2, "AMS发送创建应用进程请求，Zygote进程接受请求并fork应用进程"], [4, "AMS发送启动Activity的请求"], [5, "ActivityThread的Handler处理启动Activity的请求"]]}, {"id": "20.2", "title": "apk组成和Android的打包流程?", "content_lines": ["resources.arsc 编译后的二进制资源文件。", "classes.dex 是.dex文件。最终生成的Dalvik字节码", "AndroidManifest.xml 程序的全局清单配置文件", "res是uncompiled resources。存放资源文件的目录。", "META-INF是签名文件夹。 存放签名信息", "MANIFEST.MF（清单文件）：其中每一个资源文件都有一个SHA-256-Digest签名，MANIFEST.MF文件的", "SHA256（SHA1）并base64编码的结果即为CERT.SF中的SHA256-Digest-Manifest值。", "CERT.SF（待签名文件）：除了开头处定义的SHA256（SHA1）-Digest-Manifest值，后面几项的值是对", "MANIFEST.MF文件中的每项再次SHA256并base64编码后的值。", "CERT.RSA（签名结果文件）：其中包含了公钥、加密算法等信息。首先对前一步生成的MANIFEST.MF使用了", "SHA256（SHA1）-RSA算法，用开发者私钥签名，然后在安装时使用公钥解密。最后，将其与未加密的摘要信息", "（MANIFEST.MF文件）进行对比，如果相符，则表明内容没有被修改。", "具体打包过程", "1.aapt 打包资源文件生成 R.java 文件；aidl 生成 java 文件 2.将 java 文件编译为 class 文件 3.将工程及第三方的", "class 文件转换成 dex 文件 4.将 dex 文件、so、编译过的资源、原始资源等打包成 apk 文件 5.签名 6.资源文件对", "齐，减少运行时内存", "通过AAPT工具进行资源文件 打包，生成R.java、resources.arsc和res文件", "通过AIDL工具处理AIDL文件，生成对应的Java接口文件。", "通过Java Compiler编译R.java、Java接口文件、Java源文件，生成.class文件。", "通过dex命令，将.class文件和第三方库中的.class文件处理生成classes.dex，该过程主要完成Java字节码转换成"], "sub_items": [[2, "assets可以能有更深的目录结构，而res/raw里面只能有一层目录；"]]}, {"id": "20.3", "title": "Android的签名机制，签名如何实现的,v2相比于v1签名机制的改变", "content_lines": ["签名工具", "Android 应用的签名工具有两种：jarsigner 和 signAPK。 它们的签名算法没什么区别，主要是签名使用的文件不同", "jarsigner：jdk 自带的签名工具，可以对 jar 进行签名。使用 keystore 文件进行签名。生成的签名文件默认使用", "keystore 的别名命名。", "signAPK：Android sdk 提供的专门用于 Android 应用的签名工具。 signapk.jar是Android源码包中的一个签名工", "具。代码位于Android源码目录下，signapk.jar 可以编译build/tools/signapk/ 得到。 使用 pk8、x509.pem 文件进", "行签名。其中 pk8 是私钥文件，x509.pem 是含有公钥的文件。生成的签名文件统一使用“CERT”命名。", "jarsigner和apksigner的区别", "Android提供了两种对Apk的签名方式，一种是基于JAR的签名方式，另一种是基于Apk的签名方式，它们的主要区别", "在于使用的签名文件不一样： jarsigner使用keystore文件进行签名； apksigner除了支持使用keystore文件进行签名", "外，还支持直接指定pem证书文件和私钥进行签名。", "签名过程", "APK是先摘要，再签名", "要了解如何实现签名，需要了解两个基本概念：数字摘要和数字证书。", "数字摘要", "就是对消息数据，通过一个Hash算法计算后，都可以得到一个固定长度的Hash值，这个值就是消息摘要。", "特征： 唯一性 固定长度：比较常用的Hash算法有MD5和SHA1，MD5的长度是128拉，SHA1的长度是160位。 不可", "逆性", "消息摘要只能保证消息的完整性，并不能保证消息的不可篡改性", "数字签名"], "sub_items": [[1, "计算摘要："], [2, "计算签名："], [3, "写入签名："], [1, "计算摘要"], [2, "解密签名："], [3, "比较摘要："], [1, "V2计算加快签名速度"], [2, "V2保证META-INFO目录不会被篡改"]]}, {"id": "20.4", "title": "APK的安装流程", "content_lines": ["复制APK到/data/app目录下，解压并扫描安装包。", "资源管理器解析APK里的资源文件。", "解析AndroidManifest文件，并在/data/data/目录下创建对应的应用数据目录。", "然后对dex文件进行优化，并保存在dalvik-cache目录下。", "将AndroidManifest文件解析出的四大组件信息注册到PackageManagerService中。", "安装完成后，发送广播。"], "sub_items": [[21, "序列化"]]}]}, {"id": "21", "title": "序列化", "sections": [{"id": "21.1", "title": "什么是序列化,", "content_lines": ["Java序列化是指把Java对象转换为字节序列的过程", "Java反序列化是指把字节序列恢复为Java对象的过程；"], "sub_items": []}, {"id": "21.2", "title": "为什么需要使用序列化和反序列化", "content_lines": ["不同进程/程序间进行远程通信时，可以相互发送各种类型的数据，包括文本、图片、音频、视频等，而这些数据都", "会以二进制序列的形式在网络上传送。", "当两个Java进程进行通信时，对于进程间的对象传送需要使用Java序列化与反序列化了。发送方需要把这个Java对象", "转换为字节序列，接收方则需要将字节序列中恢复出Java对象。"], "sub_items": []}, {"id": "21.3", "title": "序列化的有哪些好处", "content_lines": ["实现了数据的持久化，通过序列化可以把数据永久地保存到硬盘上（如：存储在文件里），实现永久保存对象。", "利用序列化实现远程通信，即：能够在网络上传输对象。"], "sub_items": []}, {"id": "21.4", "title": "Serializable 和 Parcelable 的区别", "content_lines": ["Serializable原理(https://juejin.im/post/6844904049997774856)", "Serializable接口没有方法和属性，只是一个识别类可被序列化的标志。", "Serializable是通过I/O读写存储在磁盘上的, 通过反射解析出对象描述、属性的描述 以HandleTable来缓存解析信息,", "之后解析成二进制，存储、传输。", "Parcel原理(https://www.wanandroid.com/wenda/show/9002)", "Parcel翻译过来是打包的意思,其实就是包装了我们需要传输的数据,然后在Binder中传输,也就是用于跨进程传输数据", ",将序列化之后的数据写入到一个共享内存中，其他进程通过Parcel可以从这块共享内存中读出字节流，并反序列化成", "对象,", "它的各种writeXXX方法，在native层都是会调用Parcel.cpp的write方法", "Serializable 和 Parcelable 的区别", "存储媒介的不同(https://www.jianshu.com/p/1b362e374354)", "Serializable 使用 I/O 读写存储在硬盘上，而 Parcelable 是直接 在内存中读写。很明显，内存的读写速度通常大", "于 IO 读写，所以在 Android 中传递数据优先选择 Parcelable。", "效率不同", "Serializable 会使用反射，序列化和反序列化过程需要大量 I/O 操作，", "Parcelable 自已实现封送和解封（marshalled &unmarshalled）操作不需要用反射，数据也存放在 Native 内存", "中，效率要快很多。"], "sub_items": []}, {"id": "21.5", "title": "什么是serialVersionUID", "content_lines": ["序列化是将对象的状态信息转换为可存储或传输的形式的过程。我们都知道，Java对象是保存在JVM的堆内存中的，", "也就是说，如果JVM堆不存在了，那么对象也就跟着消失了。", "而序列化提供了一种方案，可以让你在即使JVM停机的情况下也能把对象保存下来的方案。就像我们平时用的U盘一", "样。把Java对象序列化成可存储或传输的形式（如二进制流），比如保存在文件享中。这样，当再次需要这个对象的时", "候，从文件中读取出二进制流，再从二进制流中反序列化出对象。", "虚拟机是否允许反序列化，不仅取决于类路径和功能代码是否一致，一个非常重要的一点是两个类的序列化 ID 是否", "一致，这个所谓的序列化ID，就是我们在代码中定义的serialVersionUID。"], "sub_items": []}, {"id": "21.6", "title": "为什么还要显示指定serialVersionUID的值?", "content_lines": ["如果不显示指定serialVersionUID, JVM在序列化时会根据属性自动生成一个serialVersionUID, 然后与属性一起序列", "化, 再进行持久化或网络传输. 在反序列化时, JVM会再根据属性自动生成一个新版serialVersionUID, 然后将这个新版", "serialVersionUID与序列化时生成的旧版serialVersionUID进行比较, 如果相同则反序列化成功, 否则报错.", "如果显示指定了serialVersionUID, JVM在序列化和反序列化时仍然都会生成一个serialVersionUID, 但值为我们显示", "指定的值, 这样在反序列化时新旧版本的serialVersionUID就一致了.", "在实际开发中, 不显示指定serialVersionUID的情况会导致什么问题? 如果我们的类写完后不再修改, 那当然不会有问", "题, 但这在实际开发中是不可能的, 我们的类会不断迭代, 一旦类被修改了, 那旧对象反序列化就会报错. 所以在实际开", "发中, 我们都会显示指定一个serialVersionUID, 值是多少无所谓, 只要不变就行.", "Dalvik，ART是Android的两种运行环境，也可以叫做Android虚拟机 JIT，AOT是Android虚拟机采用的两种不同的编", "译策略", "在Dalvik虚拟机上，APK中的Dex文件在安装时会被优化成odex文件，在运行时，会被JIT编译器编译成native代码。", "在ART虚拟机上安装时，Dex文件会直接由dex2oat工具翻译成oat格式的文件，oat文件中既包含了dex文件中原先的", "内容，也包含了已经编译好的native代码。"], "sub_items": [[22, "Art & Dalvik 及其区别"], [22, "1Art & Dalvik 及其区别"]]}]}, {"id": "22", "title": "Dalvik & ART 编译策略", "sections": [{"id": "22.1", "title": "1.Dalvik", "content_lines": ["一个应用首先经过DX工具将class文件转换成Dalvik虚拟机可以执行的dex文件，然后由类加载器加载原生类和Java", "类。Dalvik虚拟机负责解释器根据指令集对Dalvik字节码进行释dex文件为机器码。", "JIT编译器", "Dalvik负责将dex翻译为机器码交由系统调用，有一个缺陷，每次执行代码，都需要Dalvik将操作码代码翻译为堂机器", "对应的微处理器指令，然后交给底层系统处理，运行效率很低。", "JIT编译器，当App运行时，每当遇到一个新类，JIT编译器就会对这个类进行即时编译，经过编译后的代码，会被优化", "成相当精简的原生型指令码（即native code），这样在下次执行到相同逻辑的时候，速度就会更快。", "Dalvik进程管理是依赖于linux的进程体系结构的，如要为应用程序创建一个进程，它会使用linux的fork机制来复制", "一个进程。"], "sub_items": [[1, "原理"], [2, "Dalvik的启动流程"]]}, {"id": "22.1", "title": "2.ART", "content_lines": ["JIT是运行时编译，这样可以对执行次数频繁的dex代码进行编译和优化，减少以后使用时的翻译时间， 但将dex翻译", "为本地机器码也要占用时间，所以Google在4.4之后推出了ART，用来替换Dalvik。", "ART的策略与Dalvik不同，在ART 环境中，应用在第一次安装的时候，字节码就会预先编译成机器码，使其成为真正", "的本地应用。之后打开App的时候，不需要额外的翻译工作，直接使用本地机器码运行，因此运行速度提高。", "AOT", "AOT 是静态编译，应用在安装的时候会启动 dex2oat 过程把 dex预编译成 ELF 文件，每次运行程序的时候不用重新", "编译。"], "sub_items": [[1, "原理"], [23, "模块化&组件化"]]}]}, {"id": "23", "title": "模块化 & 组件化", "sections": [{"id": "23.1", "title": "什么是模块化", "content_lines": ["原本一个 App模块 承载了所有的功能，而模块化就是拆分成多个模块放在不同的Module里面，每个功能的代码都在", "自己所属的 module 中添加", "通常还会有一个通用基础模块module_common，提供BaseActivity/BaseFragment、图片加载、网络请求等基础能", "力，然后每个业务模块都会依赖这个基础模块。 业务模块之间有有依赖", "但多个模块中肯定会有页面跳转、数据传递、方法调用 等情况，所以必然存在以上这种依赖关系，即模块间有着高", "耦合度。 高耦合度 加上 代码量大，就极易出现上面提到的那些问题了，严重影响了团队的开发效率及质量。"], "sub_items": []}, {"id": "23.2", "title": "什么是组件化", "content_lines": ["组件化，去除模块间的耦合，使得每个业务模块可以独立当做App存在，对于其他模块没有直接的依赖关系。 此时业", "务模块就成为了业务组件。"], "sub_items": []}, {"id": "23.3", "title": "组件化优点和方案", "content_lines": ["加快编译速度：每个业务功能都是一个单独的工程，可独立编译运行，拆分后代码量较少，编译自然变快。", "提高协作效率：解耦 使得组件之间 彼此互不打扰，组件内部代码相关性极高。 团队中每个人有自己的责任组件，不", "会影响其他组件；降低团队成员熟悉项目的成本，只需熟悉责任组件即可；对测试来说，只需重点测试改动的组件，", "而不是全盘回归测试。", "组件化方案", "宿主app 在组件化中，app可以认为是一个入口，一个宿主空壳，负责生成app和加载初始化操作。", "业务层 每个模块代表了一个业务，模块之间相互隔离解耦，方便维护和复用。", "公共层", "既然是base，顾名思义，这里面包含了公共的类库。如Basexxx 、 toast,logutil，glide工学具类，资源文件等", "网络层", "提供网络加载", "三方库层", "提供网络加载", "组件化开发的问题点"], "sub_items": []}, {"id": "23.4", "title": "组件独立调试", "content_lines": ["1.1gradle.properties中定义一个常量值 isModule 1.2 apply plugin根据boolean值判断 if (isModule.toBoolean()){", "apply plugin: 'com.android.application' }else { apply plugin: 'com.android.library' } 1.3配置 applicationId 和", "mainfest"], "sub_items": []}, {"id": "23.5", "title": "组件间通信", "content_lines": ["跳转", "ARouter 1.@Route 2.ARouter.getInstance().build(\"/xx/xx\").navigation()", "为彼此提供服务", "既然首页组件可以访问购物车组件接口了，那就需要依赖购物车组件啊，这俩组件还是耦合", "1.首先在commonlib模块里创建一个暴露方法的接口，并定义接口签名，同时继承 Iprovide 1.首先在commonlib模", "块里创建一个暴露方法的接口，并定义接口签名，同时继承 Iprovider 接口", "2.然后在home模块中继承commonlib里定义的接口，并实现签名方法。", "r 接口", "2.然后在home模块中继承commonlib里定义的接口，并实现签名方法。"], "sub_items": [[3, "Arouter的 @Router注解调用"], [3, "Arouter的 @Router注解调用"]]}, {"id": "23.6", "title": "Aplication动态加载", "content_lines": ["组件有时候也需要获取应用的Application，也需要在应用启动时进行初始化。这就涉及到组件的生命周期管理问", "题。", "假设我们有组件ModuleA、ModuleB、ModuleC，这3个组件内分别有ModuleAAppLike、ModuleBAppLike、", "ModuleCAppLike，那么我们在壳工程集成时，怎么去组装他们呢。最简单的办法是，在壳工程的", "Application.onCreate()方法里执行", "问题1： 组件初始化的先后顺序，上层业务组件是依赖下层业务组件的， 那么我们在加载组件时，必然要先加载下层", "组件，否则加载上层组件时可能会出现问题。", "问题2： 新增加一个组件，去修改壳工程代码，不利于代码维护。", "解决", "3.组件集成后在应用的Application.onCreate()方法里，调用组件生命周期管理类的初始化方法。", "4.组件生命周期管理类的内部，扫描到所有的BaseAppLikeProxy类名之后，通过反射进行类实例化。", "难点", "需要了解APT技术，怎么在编译时动态生成java代码；", "1创建一个注解类 2定义baseapplication接口,设置优先级 3继承AbstractProcessor process中 ，生成代理类，并写", "入到文件里（StringBuilder 。append）", "应用在运行时，怎么能扫描到某个包名下有多少个class，以及他们的名称呢；", "如果有十多个组件里都有实现IAppLike接口的类，最终我们也会生成10多个代理类，这些代理类都是在同一个包下面", "运行时读取手机里的dex文件，从中读取出所有的class文件名，根据我们前面定义的代理类包名，来判断是不是我们", "的目标类，这样扫描一遍之后，就得到了固定包名下面所有类的类名了通常一个安装包里，加上第三方库，class文", "件可能数以千计、数以万计，这让人有点杀鸡用牛刀的感觉。每次应用冷启动时，都要读取一次dex文件并扫描全部"], "sub_items": [[1, "定义一个注解来标识实现了BaseAppLike的类。"], [2, "通过APT技术，在组件编译时扫描和处理前面定义的注解，生成一个BaseAppLike的代理类"]]}, {"id": "23.7", "title": "ARouter原理", "content_lines": ["@Route注解，会在编译时期通过apt生成一些存储path和activityClass映射关系的类文件", "APT是Annotation Processing Tool的简称,即注解处理工具。它是在编译期对代码中指定的注解进行解析，然后做一", "些其他处理（如通过javapoet生成新的Java文件）", "第一步：定义注解处理器，用来在编译期扫描加入@Route注解的类，然后做处理。 这也是apt最核心的一步，新建", "RouterProcessor 继承自 AbstractProcessor,然后实现process方法。在项目编译期会执行RouterProcessor的", "process()方法，我们便可以在这个方法里处理Route注解了", "第二步，在process()方法里开始生成EaseRouter_Route_moduleName类文件和EaseRouter_Group_moduleName文", "件。这里在process()里生成文件用javapoet生成java文件，就会用 JavaPoet 生成 Group、Provider 和 Root 路", "由文件，路由表就是由这些文件组成的，内容loadInto方法通过传入一个特定类型的享map就能把分组信息放入map里为，一个", "map(其实是两个map，一个保存group列表，一个保存group下的路由地址和activityClass关系)保存了路由地址和", "ActivityClass的映射关系，然后通过map.get(\"router address\") 拿到AncivityClass，通过startActivity()", "调用就好了", "E5%8C%96", "app进程启动的时候会拿到这些类文件，把保存这些映射关系的数据读到内存里(保存在map里)到这些类文件便可以", "得到所有的routerAddress---activityClass映射关系 去扫描apk中所有的dex，遍历找到所有包名为packageName的", "类名，然后将类名再保存到classNames集合里", "1. 读取apk中所有的dex文件 2.然后判断类的包名是否为 “com.alibaba.android.arouter.routes”，获取到注解处", "理器生成的类名时，就会把这些类名保存 SharedPreferences 中，下次就根据 App 版本判断，如果不是新版", "本，就从本地中加载类名，否则就用 ClassUtils 读取类名。 3.就会根据类名的后缀判断类是 IRouteRoot 、", "IInterceptorGroup 还是 IProviderGroup ，然后根据不同的类把类文件的内容加载到索引中。获取到映射关系"], "sub_items": [[1, "ARouter 路由表生成原理"], [2, "ARouter 路由表加载原理"], [3, "ARouter 跳转原理"], [24, "热修复&插件化"]]}]}, {"id": "24", "title": "热修复 & 插件化", "sections": [{"id": "24.1", "title": "插件化的定义", "content_lines": ["所谓插件化，就是让我们的应用不必再像原来一样把所有的内容都放在一个apk中，可以把一些功能和逻辑单独抽出", "来放在插件apk中，然后主apk做到［按需调用］。"], "sub_items": []}, {"id": "24.2", "title": "插件化的优势", "content_lines": ["2.让用户不用重新安装 APK 就能升级应用功能，减少发版本频率，增加用户体验。", "应用程序的工程和功能模块数量会越来越多，如果功能模块间的耦合度较高，修改一个模块会影响其它功能模块，势", "必会极大地增加成本。"], "sub_items": [[1, "减少主apk的体积、65535 问题。让应用更轻便"], [3, "模块化、解耦合"]]}, {"id": "24.3", "title": "插件化框架对比", "content_lines": ["1.最早的插件化框架：2012年大众点评的屠毅敏就推出了AndroidDynamicLoader框架。", "(1) 首先通过 DLPluginManager 的 loadApk 函数加载插件，这步每个插件只需调用一次。", "(2) 通过 DLPluginManager 的 startPluginActivity 函数启动代理 Activity。", "(3) 代理 Activity 启动过程中构建、启动插件 Activity", "2.目前主流的插件化方案有滴滴任玉刚的VirtualApk、 Wequick的Small框架。", "Hook IActivityManager和Hook Instrumentation。主要方案就是先用一个在AndroidManifest.xml中注册的Activity", "来进行占坑，用来通过AMS的校验，接着在合适的时机用插件Activity替换占坑的Activity。"], "sub_items": []}, {"id": "24.4", "title": "插件化流程", "content_lines": ["在Android中应用插件化技术，其实也就是动态加载的过程，分为以下几步：", "把可执行文件（ .so/dex/jar/apk 等）拷贝到应用 APP 内部。", "加载可执行文件，更换静态资源", "调用具体的方法执行业务逻辑"], "sub_items": []}, {"id": "24.5", "title": "插件化原理", "content_lines": ["一.类加载原理", "1.1 apk被安装之后，APK文件的代码以及资源会被系统存放在固定的目录（比如/data/app/package_name/base-", "系统无法加载我们插件中的类。需要我们自己处理 这个类加载的过程。", "1.2 这里用的DexClassLoader Android中的类加载器中主要包括三类BootClassLoader（继承ClassLoader），", "PathClassLoader和DexClassLoader,后两个继承于BaseDexClassLoader。", "BootClassLoader:主要用于加载系统的类，包括java和android系统的类库。（比如TextView,Context，只要是系统", "的类都是由BootClassLoader加载完成）。", "PathClassLoader:主要用于加载我们应用程序内的类。路径是固定的，只能加载 /data/app，无法指定解压释放dex", "的路径，无法动态加载。对于我们的应用默认为PathClassLoader", "DexClassLoader：可以用来加载任意路径的zip,jar或者apk文件。", "DexClassLoader重载findClass方法，在加载类时会调用其内部的DexPathList去加载。 而DexPathList的loadClass", "会去遍历DexFile直到找到需要加载的类。", "1.3 插件化中 有单DexClassLoader和多DexClassLoader两种结构。", "插件化要解决的是", "主工程调用插件", "有单DexClassLoader", "对于每个插件都会生成一个DexClassLoader，", "当加载该插件中的类时需要通过对应DexClassLoader加载 需要先通过插件的ClassLoade学r加载该类再通过反射调用", "其方法", "多DexClassLoader"], "sub_items": [[1, "apk )系统在进行类加载的时候，会自动去这一个或者几个特定的路径来寻找这个类；"], [2, "2 合并式：addAssetPath时加入所有插件和主工程的路径；"], [3, "1 Hook IActivityManager："], [3, "1.1 占坑、通过校验："], [1, "1 AndroidManifest.xml中注册SubActivity"], [2, "反射获取Singleton中的mInstance实例"], [3, "获取此IActivityManagerSingleton内部的mInstance"], [4, "动态代理创建代理IActivityManager"], [5, "将重写的代理IActivityManager设置给mInstance"], [3, "1.2 还原插件Activity："], [3, "2 Hook Instrumentation："], [2, "在Instrumentation的newActivity方法中还原TargetActivity"]]}]}, {"id": "25", "title": "AOP", "sections": [{"id": "25.1", "title": "AOP是什么", "content_lines": ["AOP: 即面向切面编程。 和OOP一样，是一种程序设计思想.实现是通过预编译方式和运行期动态代理实现程序功能", "的统一维护。", "OOP（Object Oriented Programming）面向对象设计就是一种典型的纵向编程方式。 OOP更多关注的是对象", "Object本身的功能，对象之间的功能的联系往往不会考虑的那么详细。", "1、继承模式比如之类和父类之间的这种关系就是一个很好的展示。", "2、分层架构如MVP，每一层之间也是纵向关联在一起的。", "切面，也叫横向，横切关注点是一个抽象的概念，它是指那些在项目中贯穿多个模块的业务。AOP在将横切关注点与", "业务主体进行分类，从而提高程序代码的模块化程度,则是将涉及到众多模块的某一类功能进行统一管理。", "1 我们要为方法添加调用日志，那就必须为所有类的所有方法添加日志调用，尽管它们都是相同的。"], "sub_items": []}, {"id": "25.2", "title": "AOP的好处", "content_lines": ["使用切面的好处：", "1.核心代码中不在包含记录日志的代码， 类更专注于它的职责。 2.如果想修改日志的记录方式， 不需要修改", "Account类，只需要修改相应的配置文件和日志的实现，修改工作量小。 3.解耦。为什么说解耦呢？用打印Log举", "例，app中可能存在不同的Log框架来实现。如果同一使用Log标签切入，那么在处理Log标签的地方可以统一Log框", "架。实现AOP的同时需要依赖注入， 这又会减少模块间的依赖。"], "sub_items": []}, {"id": "25.3", "title": "AOP的实现方式", "content_lines": ["Android中AOP的实现方式分两类：", "运行时切入", "(android hook机制)", "集成Dexposed， epic框架（运行时hook某些关键方法）", "Java API实现动态代理机制（基于反射，性能不佳）", "编译时切入", "生成代理类(APT)", "集成AspactJ框架(特殊的插件或编译器来生成特殊的class文件)", "使用ASM,Javassit等字节码工具类来修改字节码(编译打包APK文件前修改class文件)", "APT （Annotation Processing Tool ）即注解处理器，是一种处理注解的工具， 在编译时扫描和处理注解。注解处", "理器 在编译期，通过注解生成 .java 文件。使用的 Annotation 类型是 SOURCE。", "它在编译时扫描、解析、处理注解。它会对源代码文件进行检测，找出用户自定义的注解，根据注解、注解处理器和", "相应的apt工具自动生成代码。这段代码是根据用户编写的注解处理逻辑去生成的。最终将生成的新课的源文件与原来", "的源文件共同编译（注意：APT并不能对源文件进行修改操作，只能生成新的文件，例如往原来的类中添加方法）", "代表框架：DataBinding、Dagger2、ButterKnife、EventBus3、DBFlow、AndroidAnnotation", "为什么这些框架注解实现 AOP 要使用 APT？", "目前 Android 注解解析框架主要有两种实现方法，", "一种是运行期通过反射去解析当前类，注入相应要运行的方法。", "另一种是在编译期生成类的代理类，在运行期直接调用代理类的代理方法，APT 指的是后者。", "如果不使用APT基于注解动态生成 java 代码，那么就需要在运行时使用反射或者动态代理，比如大名鼎鼎的"], "sub_items": [[1, "APT"], [2, "AspectJ"], [3, "ASM"], [4, "epic"], [5, "hook"], [26, "jectpack"]]}]}, {"id": "26", "title": "Jetpack", "sections": [{"id": "26.1", "title": "Navigation", "content_lines": ["what", "对于单个Activity嵌套多个Fragment的UI架构方式， 对Fragment的管理一直是一个比较麻烦的事情。", "需要通过FragmentManager和FragmentTransaction来管理Fragment之间的切换 对应用程序的App bar的管理，", "Fragment间的切换动画 Fragment间的参数传递 总之，使用起来不是特别友好。", "Navigation是用来管理Fragment的切换，并且可以通过可视化的方式，看见App的交互流程", "why", "可以可视化的编辑各个组件之间的跳转关系", "优雅的支持fragment之间的转场动画", "通过第三方的插件支持fragment之间安全的参数传递", "通过NavigationUI类，对菜单，底部导航，抽屉菜单导航进行方便统一的管理", "支持通过deeplink直接定位到fragment", "how", "1 创建导航图", "在 res 目录内创建一个 navigation 资源目录", "根标签是navigation，它需要有一个属性startDestination，表示默认第一个显示的界面", "每个fragment标签代表一个fragment类", "每个action标签就相当于上图中的每条线，代表了执行切换的时候的目的地，切换动画等信息。", "2 添加NavHostFragment", "标签为fragment，android:name就是NavHost的实现类，这里是NavHostFragment app:navGraph 属性就是我们", "前面在res文件夹下创建的文件"], "sub_items": [[1, "开启导航"], [1, "页面跳转和参数传递"], [1, "Bundle方式"], [3, "导航堆栈管理"], [3, "popUpTo 和 popUpToInclusive"], [1, "onInflate解析在xml配置的两个参数defaultNavHost， 和navGraph"], [2, "onCreate 创建NavController"], [3, "onCreateView 创建一个FrameLayout"], [1, "NavHostFragment把导航文件的资源id传给了NavController"], [2, "NavController把导航xml文件传递给了NavInflater解析导航xml文件"], [3, "生成NavGraph保存着xml中配置的导航目标NavDestination"]]}, {"id": "26.2", "title": "DataBinding", "content_lines": ["原理", "1.APT预编译方式生成ActivityMainBinding和ActivityMainBindingImpl", "activity_main-layout.xml（DataBinding需要的布局控件信息）", "activity_main.xml（Android OS 渲染的布局文件）", "Model是如何刷新View", "1.DataBindingUtil.setContentView方法将xml中的各个View赋值给ViewDataBinding，完成findviewbyid的任务", "2.当VM层调用notifyPropertyChanged方法时，最终在ViewDataBindingImpl的executeBindings方法中处理逻辑", "View是如何刷新Model", "ViewDataBindingImpl的executeBindings方法中在设置了双向绑定的控件上，为其添加对应的监听器，监听其变", "动，如：EditText上设置TextWatcher，具体的设置逻辑放置到了TextViewBindingAdapter.setTextWatcher里", "当数据发生变化的时候，TextWatcher在回调onTextChanged()的最后，会通过textAttrChanged.onChange()回调到", "传入的mboundView2androidTextAttrChanged的onChange()。", "使用"], "sub_items": [[2, "处理布局的时候生成了两个xml文件"]]}, {"id": "26.3", "title": "ViewModel", "content_lines": ["es&utm_source=recommendation", "how", "viewmodel = ViewModelProvider(this).get(MyViewModel::class.java)", "what", "ViewModel 类旨在以注重生命周期的方式存储和管理界面相关的数据", "why", "Activity配置更改重建时(比如屏幕旋转)保留数据", "问题", "例如你的 APP 某个 Activity 中包含一个 列表，因为配置更改而重新创建 Activity 后（例如众所周知的屏幕旋转发生", "后需手动保存数据在旋转后进行恢复），新 Activity 必须重新提取列表数据，对于简单数据，Activity 可以使用", "onSaveInstanceState() 方法从 onCreate() 中的捆绑包恢复数据，但这种方法仅适合可以序列化再反序列化但少量数", "据，不适合数量可能较大但数据，如用户列表或位图", "因为ViewModel的生命周期是比Activity还要长，所以ViewModel可以持久保存UI数据。", "通常在系统首次调用 Activity 对象的 onCreate() 方法时请求 ViewModel。系统可能会在 Activity 的整个生命周期内", "多次调用 onCreate()，如在旋转设备屏幕时。 所以当前Activity的生命周期不断变化，经历了被销毁重新创建，而", "ViewModel的生命周期没有发生变化，Activity因为配置更改或者被系统意外回收的时候，会自动保存数 据。在", "Activity重建的时候就可以继续使用销毁之前保存的数据。", "源码 https://www.jianshu.com/p/ebdf656b6dd4", "ComponentActivity 中", "onRetainNonConfigurationInstance是在onStop() 和 onDestroy()之间被调用，它内部会保存ViewModel数据;"], "sub_items": []}, {"id": "26.4", "title": "vm+livedata", "content_lines": ["Viewmodel", "2.在Activity或者Fragment中，是由Activity和Fragment来提ViewModelStore类对象， 每个Activity或者Fragment都", "有一个，目的是用于保存该页面的ViewModel对象", "1.管理UI界面数据,数据持久化(将加载数据与数据恢复从 Activity or Fragment中解耦)", "在 Android 系统中，需要数据恢复有如下两种场景：", "场景1：资源相关的配置发生改变导致 Activity 被杀死并重新创建。 场景2：资源内存不足导致低优先级的 Activity 被", "杀死。", "使用 onSaveInstanceState 与 onRestoreInstanceState", "onSaveInstanceState只适合保存少量的可以被序列化、反序列化的数据", "onRetainNonConfigurationInstance 方法，用于处理配置发生改变时数据的保存。随后在重新创建的 Activity 中调", "用 getLastNonConfigurationInstance 获取上次保存的数据", "官方最终采用了 onRetainNonConfigurationInstance 的方式来恢复 ViewModel 。", "其实就是在屏幕旋转的时候，AMS通过Binder回调Activity的retainNonConfigurationInstances()方法，数据保存就", "是通过retainNonConfigurationInstances()方法保存在NonConfigurationInstances对象，而再一次使用取出", "ViewModel的数据的时候，就是从nc对象中取出ViewModelStore对象，而ViewModelStore对象保存有ViewModel", "集合 ，官方重写了 onRetainNonConfigurationInstance 方法，在该方法中保存了 ViewModelStor", "监听 Activity 声明周期，在 onDestory 方法被调用时，判断配置是否改变。如果没有发送改变，则调用 Activity 中的", "ViewModelStore 的 clear() 方法，清除所有的 ViewModel", "获取到了Activity的ViewModelStore对象，从而实现了Fragment之间共享ViewModel", "为什么不同的Fragment使用相同的Activity对象来获取ViewModel，可以轻易的实现ViewModel共享？"], "sub_items": [[1, "how"], [1, "通过ViewModelProviders.of()方法创建ViewModel对象"], [2, "why"], [2, "Fragments 间共享数据"]]}, {"id": "26.5", "title": "liferecycle", "content_lines": ["Lifecycle使用", "LifecycleObserver:是一个空方法接口，用于标识观察者，对这个 Lifecycle 对象进行监听", "LifecycleOwner: 是一个接口，持有方法Lifecycle getLifecycle()。", "LifecycleRegistry 类用于注册和反注册需要观察当前组件生命周期的 LifecycleObserver", "1.实现LifecycleOwner重写getLifecycle 返回mLifecycleRegistry，mLifecycleRegistry不同生命周期markState"], "sub_items": [[2, "继承LifecycleObserver"], [3, "getLifecycle.addObserver注册LifecycleObserver"], [27, "开源框架"]]}]}, {"id": "27", "title": "开源框架", "sections": [{"id": "27.1", "title": "Okhttp", "content_lines": ["exectute()方法执行RealCall的execute方法", "client.dispatcher().enqueue(new AsyncCall(responseCallback));", "利用dispatcher调度器enqueueAsyncCall，并通过回调（Callback）获取服务器返回的结果", "Dispatcher将call 加入到队列中，然后通过线程池来执行call", "Dispatcher是一个任务调度器，它内部维护了三个双端队列： readyAsyncCalls：准备运行的异步请求", "runningAsyncCalls：正在运行的异步请求 runningSyncCalls：正在运行的同步请求", "新来的请求放队尾，执行请求从对头部取。", "这不是一个newCachedThreadPool吗？没错，除了最后一个threadFactory参数之外与newCachedThreadPool一毛", "一样，只不过是设置了线程名字而已，用于排查问题。", "阻塞队列用的SynchronousQueue，它的特点是不存储数据，当添加一个元素时，必须等待一个消费线程取出它，", "否则一直阻塞。", "通常用于需要快速响应任务的场景，在网络请求要求低延迟的大背景下比较合适，", "采用责任链的模式来使每个功能分开，每个Interceptor自行完成自己的任务", "利用Builder模式配置各种参数，例如：超时时间、拦截器等", "retryAndFollowUpInterceptor", "失败和重定向拦截器", "当请求内部抛出异常时，判定是否需要重试", "当响应结果是3xx重定向时，构建新的请求并发送请求", "BridgeInterceptor", "封装request和response拦截"], "sub_items": [[1, "exectute执行"], [1, "1.真正的请求交给了 RealCall 类"], [1, "2 Dispatcher"], [1, "3 线程池"], [2, "拦截器"], [3, "addInterceptor 和 addNetworkdInterceptor区别"], [4, "责任链模式"], [5, "缓存怎么处理"], [6, "Okhttp连接池"], [1, "http协议"], [2, "域名和http和ssl协议配置需要匹配"]]}, {"id": "27.2", "title": "Glide", "content_lines": ["Glide.with(Activity activity)的方式传入页面引用", "2.builder模式创建RequestManager， 将fragment的lifecycle传入，这样Fragment和RequestManager就建立了联", "系", "Glide的缓存机制，主要分为2种缓存，一种是内存缓存，一种是磁盘缓存。", "之所以使用内存缓存的原因是：防止应用重复将图片读入到内存，造成内存资源浪费。", "之所以使用磁盘缓存的原因是：防止应用重复的从网络或者其他地方下载和读取数据", "具体来讲，缓存分为加载和存储：", "内存缓存分为弱引用和lru缓存", "弱引用是缓存正在使用的图片，避免内存泄漏", "将缓存图片的时候，写入顺序", "弱引用缓存-》Lru算法缓存-》磁盘缓存中", "当加载一张图片的时候，获取顺序", "弱引用缓存-》Lru算法缓存-》磁盘缓存", "LruCache 内部用LinkHashMap存取数据", "LinkedHashMap继承于HashMap，它使用了一个双向链表来存储Map中的Entry顺序关系，这种顺序有两种，一种", "是LRU顺序，一种是插入顺序", "LruCache中将LinkedHashMap的顺序设置为LRU顺序来实现LRU缓存", "每次调用get(也就是从内存缓存中取图片)，则将该对象移到链表的尾端。", "调用put插入新的对象也是存储在链表尾端，这样当内存缓存达到设定的最大值时，将链表头部的对象（近期最少用", "到的）移除。"], "sub_items": [[2, "1 Glide怎么绑定生命周期"], [1, "创建无UI的Fragment，并绑定到当前activity"], [3, "RequestManager实现LifecycleListener 是一个接口,回调中处理请求"], [2, "1 Glide缓存机制内存缓存，磁盘缓存"], [2, "3关于LruCache"], [2, "4 Glide与Picasso的区别"]]}, {"id": "27.3", "title": "LruCache的原理是什么？", "content_lines": ["LruCache的实现需要两个数据结构：双向链表和哈希表。", "双向链表用于记录元素被塞进cache的顺序，然后淘汰最久未使用的元素。", "哈希表用于直接记录元素的位置，即用O(1)的时间复杂度拿到链表的元素。", "get的操作逻辑：根据传入的key(图片url的MD5值)去哈希表里拿到对应的元素，如果元素存在，就把元素挪到链表的尾部。", "put的操作逻辑：首先判断key是否在哈希表里面，如果在的话就去更新值，并把元素挪到链表的尾部。", "如果不在哈希表里，说明是一个新的元素。这时候需要去判断此时cache的容量了，", "如果超过了最大的容量，就淘汰链表头部的元素，再将新的元素插入链表的尾部，如果没有超过最大容量，", "直接在链表尾部追加新的元素。", "为啥要用linkedHashMap的数据结构？？ HashMap是无序的，当我们希望有顺序地去存储key-value时，就需要使", "用LinkedHashMap了."], "sub_items": []}, {"id": "27.4", "title": "Glide如何绑定生命周期
