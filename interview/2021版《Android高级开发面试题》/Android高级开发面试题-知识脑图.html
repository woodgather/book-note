let expandedNodes = new Set();
let activeId = null;
let scrollTimeout = null;
let isClickScrolling = false; // 是否处于点击跳转的滚动过程中
let clickScrollTimer = null;

// ---- Init ----
document.addEventListener('DOMContentLoaded', () => {
  buildNavTree();
  renderAllContent();
  setupScrollSpy();
  setupBackToTop();
});

// ---- Build Nav Tree ----
function buildNavTree() {
  const container = document.getElementById('navTree');
  container.innerHTML = '';
  KNOWLEDGE_TREE.forEach(ch => container.appendChild(createTreeNode(ch, 1)));

  let totalSec = 0, totalSub = 0;
  KNOWLEDGE_TREE.forEach(ch => {
    totalSec += ch.sections?.length || 0;
    (ch.sections || []).forEach(s => { totalSub += s.sub_items?.length || 0; });
  });
  document.getElementById('statSections').textContent = totalSec;
  document.getElementById('statSubItems').textContent = totalSub;
}

function createTreeNode(data, level) {
  // 只渲染到二级目录（章 + 节），三级及以下不渲染
  if (level > 2) return null;

  const hasChildren = level === 1 && data.sections && data.sections.length > 0;

  const node = document.createElement('div');
  node.className = `tree-node level-${level}`;
  node.dataset.id = data.id;

  const label = document.createElement('a');
  label.className = 'tree-node-label';
  label.dataset.id = data.id;
  label.dataset.title = data.title;
  label.href = '#' + getAnchorId(data.id);

  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle' + (hasChildren ? '' : ' leaf');
  toggle.textContent = '▶';

  const icon = document.createElement('span');
  icon.className = 'tree-icon';
  if (level === 1) icon.textContent = data.id;
  else if (level === 2) {
    const parts = data.id.split('.');
    icon.textContent = parts[1] || '';
  }

  const text = document.createElement('span');
  text.className = 'tree-text';
  text.textContent = data.title;

  const count = document.createElement('span');
  count.className = 'tree-count';
  if (level === 1 && data.sections) count.textContent = data.sections.length + '节';
  else count.style.display = 'none';

  label.appendChild(toggle);
  label.appendChild(icon);
  label.appendChild(text);
  label.appendChild(count);

  // Click: toggle expand + navigate
  label.addEventListener('click', (e) => {
    e.preventDefault();
    // 一级目录：切换展开 + 跳转
    if (level === 1 && hasChildren) {
      const willExpand = !expandedNodes.has(data.id);
      toggleNode(data.id, willExpand);
      // 展开时跳转到章节标题，折叠时也跳转
      scrollToSection(data.id);
    } else {
      // 二级目录：直接跳转
      scrollToSection(data.id);
    }
    // Close mobile sidebar
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.remove('open');
    }
  });

  node.appendChild(label);

  if (hasChildren) {
    const cc = document.createElement('div');
    cc.className = 'tree-children';
    cc.dataset.parentId = data.id;

    data.sections.forEach(s => {
      const childNode = createTreeNode(s, level + 1);
      if (childNode) cc.appendChild(childNode);
    });
    node.appendChild(cc);
  }
  return node;
}

function getAnchorId(id) {
  return 'section-' + id.replace(/\./g, '-');
}

function toggleNode(id, expand) {
  const node = document.querySelector(`.tree-node[data-id="${CSS.escape(id)}"]`);
  if (!node) return;
  const children = node.querySelector(':scope > .tree-children');
  const toggle = node.querySelector(':scope > .tree-node-label > .tree-toggle');

  if (expand) {
    expandedNodes.add(id);
    if (children) children.classList.add('expanded');
    if (toggle) toggle.classList.add('expanded');
  } else {
    expandedNodes.delete(id);
    if (children) children.classList.remove('expanded');
    if (toggle) toggle.classList.remove('expanded');
  }
}

function expandAll() {
  document.querySelectorAll('.tree-children').forEach(el => el.classList.add('expanded'));
  document.querySelectorAll('.tree-toggle:not(.leaf)').forEach(el => el.classList.add('expanded'));
  document.querySelectorAll('.tree-node').forEach(node => {
    if (node.querySelector(':scope > .tree-children')) expandedNodes.add(node.dataset.id);
  });
}

function collapseAll() {
  document.querySelectorAll('.tree-children').forEach(el => el.classList.remove('expanded'));
  document.querySelectorAll('.tree-toggle').forEach(el => el.classList.remove('expanded'));
  expandedNodes.clear();
}

// ---- Render ALL content ----
function renderAllContent() {
  const wrapper = document.getElementById('contentWrapper');
  let html = '';

  // Hero
  let totalSec = 0, totalSub = 0;
  KNOWLEDGE_TREE.forEach(ch => {
    totalSec += ch.sections?.length || 0;
    (ch.sections || []).forEach(s => { totalSub += s.sub_items?.length || 0; });
  });
  const total = KNOWLEDGE_TREE.length + totalSec + totalSub;

  html += `
    <section class="hero" id="section-top">
      <div class="hero-icon">📚</div>
      <h1>Android 高级开发面试知识脑图</h1>
      <p>系统梳理 27 大核心技术板块、200+ 高频面试考点，<br>助你构建完整的 Android 高级开发知识体系，轻松应对面试。</p>
      <div class="hero-stats">
        <div class="hero-stat"><div class="num">${KNOWLEDGE_TREE.length}</div><div class="label">核心章节</div></div>
        <div class="hero-stat"><div class="num">${totalSec}</div><div class="label">二级考点</div></div>
        <div class="hero-stat"><div class="num">${totalSub}</div><div class="label">三级知识点</div></div>
        <div class="hero-stat"><div class="num">${total}</div><div class="label">总计条目</div></div>
      </div>
    </section>
  `;

  // Chapters
  KNOWLEDGE_TREE.forEach(chapter => {
    html += renderChapterBlock(chapter);
  });

  html += '<div class="footer-note">Android 高级开发面试知识脑图 · 基于《Android高级开发面试题》2.0版整理</div>';
  wrapper.innerHTML = html;
}

function renderChapterBlock(chapter) {
  const numSec = chapter.sections?.length || 0;
  let numSub = 0;
  (chapter.sections || []).forEach(s => { numSub += s.sub_items?.length || 0; });
  const anchorId = getAnchorId(chapter.id);

  let html = `
    <section class="chapter-section" id="${anchorId}" data-id="${chapter.id}">
      <div class="chapter-header">
        <span class="chapter-num">第 ${chapter.id} 章</span>
        <h2 class="chapter-title">${esc(chapter.title)}</h2>
      </div>

      <div class="chapter-intro">
        <div class="chapter-intro-text">
          本章系统梳理 <strong>${esc(chapter.title)}</strong> 相关的 ${numSec} 个核心面试考点${numSub > 0 ? `，涵盖 ${numSub} 个细分知识点` : ''}。
          建议结合实际项目经验深入理解，做到融会贯通。
        </div>
        <div class="chapter-intro-stats">
          <div class="cis-item"><div class="n">${numSec}</div><div class="l">核心考点</div></div>
          <div class="cis-item"><div class="n">${numSub}</div><div class="l">细分知识点</div></div>
        </div>
      </div>

      <div class="knowledge-grid">
  `;

  (chapter.sections || []).forEach(section => {
    html += renderKnowledgeCard(section);
  });

  html += `
      </div>
    </section>
  `;

  return html;
}

function renderKnowledgeCard(section) {
  const hasSubs = section.sub_items && section.sub_items.length > 0;
  const points = section.content_lines || [];
  const anchorId = getAnchorId(section.id);

  let html = `
    <div class="knowledge-card" id="${anchorId}" data-id="${section.id}">
      <div class="kc-header">
        <span class="kc-dot"></span>
        <span class="kc-title">${esc(section.title)}</span>
        <span class="kc-id">${section.id}</span>
      </div>
      <div class="kc-content">
  `;

  if (points.length > 0) {
    html += '<ul>';
    let count = 0;
    points.forEach(p => {
      if (count >= 6) return;
      const t = p.trim();
      if (!t) return;
      // Strip leading numbers
      const clean = t.replace(/^[\d一二三四五六七八九十]+[.、]\s*/, '').replace(/^[（(][一二三四五六七八九十\d]+[)）]\s*/, '');
      if (clean && clean.length > 2) {
        html += `<li>${esc(clean.length > 80 ? clean.slice(0, 80) + '...' : clean)}</li>`;
        count++;
      }
    });
    html += '</ul>';
  } else {
    html += '<p style="color: var(--text-muted); font-style: italic;">面试高频考点，建议深入学习掌握。</p>';
  }

  html += '</div>';

  if (hasSubs) {
    html += '<div class="kc-sub-items">';
    section.sub_items.slice(0, 8).forEach(item => {
      html += `
        <div class="kc-sub-item">
          <span class="si-dot"></span>
          <span>${esc(item[1])}</span>
        </div>
      `;
    });
    if (section.sub_items.length > 8) {
      html += `<div class="kc-sub-item" style="color: var(--text-muted); font-style: italic;"><span class="si-dot"></span><span>...还有 ${section.sub_items.length - 8} 个子知识点</span></div>`;
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

// ---- Scroll to section ----
function scrollToSection(id) {
  // 标记：处于点击跳转的滚动过程中，滚动监听不要自动展开/收起
  isClickScrolling = true;
  if (clickScrollTimer) clearTimeout(clickScrollTimer);
  clickScrollTimer = setTimeout(() => {
    isClickScrolling = false;
  }, 900);

  // 手风琴效果：展开当前章节，收起其他章节
  const chapterId = id.split('.')[0];
  collapseOtherChapters(chapterId);
  // 展开当前章节（如果是二级id，展开父级）
  expandParents(id);

  // 滚动到目标位置
  const anchorId = getAnchorId(id);
  const el = document.getElementById(anchorId);
  if (el) {
    const offset = 16;
    const top = el.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo({ top, behavior: 'smooth' });
  }

  // 立即高亮
  setActiveNav(id, false);

  // 等待左侧目录展开动画完成后，滚动左侧导航到可见位置
  setTimeout(() => {
    const label = document.querySelector(`.tree-node-label[data-id="${CSS.escape(id)}"]`);
    if (label) {
      label.classList.add('active');
      scrollNavToLabel(label);
    }
  }, 320);
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setActiveNav(null);
}

function expandParents(id) {
  const parts = id.split('.');
  for (let i = 1; i < parts.length; i++) {
    const parentId = parts.slice(0, i).join('.');
    toggleNode(parentId, true);
  }
}

// ---- Active nav on scroll (scroll spy) ----
function setupScrollSpy() {
  let scrollEndTimer = null;
  window.addEventListener('scroll', () => {
    if (scrollTimeout) return;
    scrollTimeout = setTimeout(() => {
      scrollTimeout = null;
      updateActiveOnScroll();
    }, 50); // 更灵敏的滚动监听

    // 滚动停止后 200ms，再做章节展开/收起操作
    if (scrollEndTimer) clearTimeout(scrollEndTimer);
    scrollEndTimer = setTimeout(() => {
      // 手动滚动时，自动展开当前章节（手风琴效果：只展开当前章，其他收起）
      if (!isClickScrolling && activeId) {
        const chapterId = activeId.split('.')[0];
        collapseOtherChapters(chapterId);
        toggleNode(chapterId, true);
      }
    }, 200);
  });
}

// 收起除指定章节外的所有一级章节
function collapseOtherChapters(keepChapterId) {
  KNOWLEDGE_TREE.forEach(ch => {
    if (ch.id !== keepChapterId) {
      toggleNode(ch.id, false);
    }
  });
}

function updateActiveOnScroll() {
  const scrollY = window.scrollY + 120; // 偏移量调整

  let currentId = null;
  let currentChapterId = null;

  // Find current chapter
  document.querySelectorAll('.chapter-section').forEach(sec => {
    const top = sec.offsetTop;
    if (top <= scrollY) {
      currentChapterId = sec.dataset.id;
    }
  });

  // Find current card within chapter
  if (currentChapterId) {
    const chapter = document.getElementById(getAnchorId(currentChapterId));
    if (chapter) {
      const cards = chapter.querySelectorAll('.knowledge-card');
      cards.forEach(card => {
        const top = card.offsetTop;
        if (top <= scrollY + 20) {
          currentId = card.dataset.id;
        }
      });
    }
  }

  if (currentId && currentId !== activeId) {
    setActiveNav(currentId, false); // 滚动监听只高亮，不自动滚动左侧
    // 只有在用户手动滚动时，才自动展开父级目录
    if (!isClickScrolling) {
      expandParents(currentId);
    }
  } else if (currentChapterId && !currentId && currentChapterId !== activeId) {
    setActiveNav(currentChapterId, false);
  }
}

function setActiveNav(id, scrollSidebar) {
  if (id === activeId && !scrollSidebar) return;
  activeId = id;

  document.querySelectorAll('.tree-node-label.active').forEach(el => {
    el.classList.remove('active');
  });

  if (id) {
    const label = document.querySelector(`.tree-node-label[data-id="${CSS.escape(id)}"]`);
    if (label) {
      label.classList.add('active');
      // Scroll sidebar nav to show active item
      if (scrollSidebar) {
        scrollNavToLabel(label);
      }
    }
  }
}

// 让左侧导航滚动到指定 label 可见位置
function scrollNavToLabel(label) {
  const navTree = document.querySelector('.nav-tree');
  if (!navTree || !label) return;

  const navRect = navTree.getBoundingClientRect();
  const labelRect = label.getBoundingClientRect();

  // 只有当 label 不在可视区域内时才滚动
  const isAbove = labelRect.top < navRect.top + 10;
  const isBelow = labelRect.bottom > navRect.bottom - 10;

  if (isAbove || isBelow) {
    // 计算需要滚动的距离，让 label 居中显示
    const navScrollTop = navTree.scrollTop;
    const labelOffsetTop = label.offsetTop;
    const targetScrollTop = labelOffsetTop - navTree.clientHeight / 2 + label.offsetHeight / 2;

    navTree.scrollTo({
      top: Math.max(0, targetScrollTop),
      behavior: 'smooth'
    });
  }
}

// ---- Search ----
function handleSearch(query) {
  query = query.trim().toLowerCase();
  const nodes = document.querySelectorAll('.tree-node');
  const labels = document.querySelectorAll('.tree-node-label');

  labels.forEach(l => l.classList.remove('highlight'));

  if (!query) {
    nodes.forEach(n => { n.style.display = ''; });
    // Remove highlights from content
    document.querySelectorAll('.search-highlight').forEach(el => {
      el.replaceWith(el.textContent);
    });
    return;
  }

  // Filter nav tree
  nodes.forEach(node => {
    const label = node.querySelector(':scope > .tree-node-label');
    const text = label?.dataset.title?.toLowerCase() || '';
    const matches = text.includes(query);

    if (matches) {
      label.classList.add('highlight');
      node.style.display = '';
      let parent = node.parentElement;
      while (parent) {
        if (parent.classList.contains('tree-children')) {
          parent.classList.add('expanded');
          const tog = parent.previousElementSibling?.querySelector('.tree-toggle');
          if (tog) tog.classList.add('expanded');
        }
        if (parent.classList.contains('tree-node')) parent.style.display = '';
        parent = parent.parentElement;
      }
      node.querySelectorAll('.tree-node').forEach(c => { c.style.display = ''; });
    } else {
      const childMatches = node.querySelectorAll('.tree-node .tree-node-label.highlight').length > 0;
      if (childMatches) node.style.display = '';
      else node.style.display = 'none';
    }
  });

  // Highlight in content cards
  highlightInContent(query);

  // Scroll to first match
  const firstMatch = document.querySelector('.tree-node-label.highlight');
  if (firstMatch) {
    const firstId = firstMatch.dataset.id;
    // Don't auto-scroll on every keystroke, just mark the nav
  }
}

function highlightInContent(query) {
  // Simple approach: find cards whose title matches and add a border
  document.querySelectorAll('.knowledge-card').forEach(card => {
    const title = card.querySelector('.kc-title')?.textContent?.toLowerCase() || '';
    if (title.includes(query)) {
      card.style.borderColor = 'var(--accent)';
      card.style.boxShadow = '0 0 0 2px rgba(76, 175, 80, 0.2)';
    } else {
      card.style.borderColor = '';
      card.style.boxShadow = '';
    }
  });
}

// ---- Back to top ----
function setupBackToTop() {
  const btn = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) btn.classList.add('show');
    else btn.classList.remove('show');
  });
}

// ---- Mobile sidebar toggle ----
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ---- Utils ----
function esc(text) {
  const div = document.createElement('div');
  div.textContent = text ?? '';
  return div.innerHTML;
}
