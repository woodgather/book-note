<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android高级开发面试知识脑图</title>
<style>
  :root {
    --primary: #2d5a27;
    --primary-light: #3d7a35;
    --primary-dark: #1e3d1a;
    --primary-soft: #e8f0e5;
    --accent: #4caf50;
    --accent-light: #81c784;
    --bg: #f5f7f3;
    --bg-sidebar: #eef2ea;
    --bg-card: #ffffff;
    --text: #1a2b1a;
    --text-secondary: #4a5a48;
    --text-muted: #8a9a88;
    --border: #d4ddd0;
    --border-light: #e5ebe3;
    --shadow-sm: 0 1px 2px rgba(45, 90, 39, 0.06);
    --shadow-md: 0 2px 8px rgba(45, 90, 39, 0.08);
    --shadow-lg: 0 8px 24px rgba(45, 90, 39, 0.1);
    --radius: 8px;
    --radius-lg: 12px;
    --sidebar-width: 310px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue",
                 Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    min-height: 100vh;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 50;
  }

  .sidebar-header {
    padding: 26px 22px 20px;
    background: linear-gradient(135deg, #1e3d1a 0%, #2d5a27 60%, #3d7a35 100%);
    color: #fff;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(129,199,132,0.3) 0%, transparent 70%);
    border-radius: 50%;
  }

  .sidebar-header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
    position: relative;
  }

  .sidebar-header .subtitle {
    font-size: 12px;
    opacity: 0.75;
    font-weight: 400;
    position: relative;
  }

  .sidebar-header .stats-row {
    display: flex;
    gap: 14px;
    margin-top: 14px;
    position: relative;
  }

  .stat-mini { display: flex; flex-direction: column; }
  .stat-mini .num { font-size: 16px; font-weight: 700; }
  .stat-mini .label { font-size: 11px; opacity: 0.7; margin-top: 1px; }

  /* Search */
  .search-box {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-sidebar);
    flex-shrink: 0;
  }

  .search-input-wrap { position: relative; }

  .search-input-wrap::before {
    content: '🔍';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: 0.5;
  }

  .search-box input {
    width: 100%;
    padding: 8px 12px 8px 30px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-card);
    color: var(--text);
    outline: none;
    transition: all 0.15s;
    font-family: inherit;
  }

  .search-box input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
  }

  .search-box input::placeholder { color: var(--text-muted); }

  /* Actions */
  .sidebar-actions {
    padding: 10px 14px;
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11.5px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }

  .sidebar-btn:hover {
    border-color: var(--primary-light);
    color: var(--primary);
    background: #f1f7ef;
  }

  /* Nav Tree */
  .nav-tree {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0 24px;
  }

  .nav-tree::-webkit-scrollbar { width: 5px; }
  .nav-tree::-webkit-scrollbar-track { background: transparent; }
  .nav-tree::-webkit-scrollbar-thumb {
    background: #c5cfc2;
    border-radius: 3px;
  }

  .tree-node { user-select: none; }

  .tree-node-label {
    display: flex;
    align-items: center;
    padding: 7px 14px 7px 10px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    position: relative;
    font-size: 13.5px;
    color: var(--text);
    text-decoration: none;
  }

  .tree-node-label:hover { background: #e0e8dc; }

  .tree-node-label.active {
    background: #d4e6cf;
    color: var(--primary-dark);
    font-weight: 500;
  }

  .tree-node-label.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    bottom: 4px;
    width: 3px;
    background: var(--primary);
    border-radius: 0 2px 2px 0;
  }

  .tree-toggle {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 2px;
    flex-shrink: 0;
    transition: transform 0.2s ease;
    color: var(--text-muted);
    font-size: 8px;
  }

  .tree-toggle.expanded { transform: rotate(90deg); }
  .tree-toggle.leaf { visibility: hidden; }

  .tree-icon {
    width: 22px;
    height: 22px;
    margin-right: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    border-radius: 5px;
  }

  .level-2 .tree-icon {
    width: 18px;
    height: 18px;
    font-size: 10px;
    background: var(--primary-light);
    opacity: 0.7;
  }

  .tree-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tree-count {
    font-size: 10.5px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.05);
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 6px;
    flex-shrink: 0;
  }

  .tree-children {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .tree-children.expanded { max-height: 6000px; }

  .level-1 > .tree-node-label { padding-left: 10px; font-weight: 500; }
  .level-2 > .tree-node-label {
    padding-left: 32px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .level-2 > .tree-node-label:hover { color: var(--text); }
  .level-2 > .tree-node-label.active { color: var(--primary-dark); }

  /* ===== Main Content ===== */
  .main {
    flex: 1;
    margin-left: var(--sidebar-width);
    min-height: 100vh;
  }

  .content-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 48px 80px;
  }

  /* ===== Hero ===== */
  .hero {
    text-align: center;
    padding: 50px 20px 60px;
    margin-bottom: 40px;
    position: relative;
  }

  .hero-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    border-radius: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin-bottom: 20px;
    box-shadow: 0 10px 28px rgba(45, 90, 39, 0.2);
  }

  .hero h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  .hero p {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.8;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 36px;
    margin-top: 30px;
  }

  .hero-stat {
    text-align: center;
  }

  .hero-stat .num {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
  }

  .hero-stat .label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* ===== Chapter Section ===== */
  .chapter-section {
    margin-bottom: 56px;
    scroll-margin-top: 20px;
  }

  .chapter-header {
    margin-bottom: 24px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--primary);
    position: relative;
  }

  .chapter-header::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 70px;
    height: 2px;
    background: var(--accent);
  }

  .chapter-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 600;
    background: var(--primary);
    color: #fff;
    border-radius: 5px;
    margin-bottom: 10px;
  }

  .chapter-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary-dark);
    line-height: 1.3;
    letter-spacing: -0.3px;
  }

  .chapter-intro {
    background: linear-gradient(135deg, #f0f7ee 0%, #e4efdf 100%);
    border: 1px solid #cfdfc9;
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .chapter-intro-text {
    flex: 1;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .chapter-intro-text strong { color: var(--primary-dark); }

  .chapter-intro-stats {
    display: flex;
    gap: 20px;
    flex-shrink: 0;
  }

  .cis-item { text-align: center; }
  .cis-item .n { font-size: 20px; font-weight: 700; color: var(--primary); }
  .cis-item .l { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  /* ===== Knowledge Grid ===== */
  .knowledge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .knowledge-card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    scroll-margin-top: 20px;
  }

  .knowledge-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--accent-light);
  }

  .knowledge-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary-light), var(--accent));
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }

  .knowledge-card:hover::before { opacity: 1; }
  .knowledge-card { position: relative; overflow: hidden; }

  .kc-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }

  .kc-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .kc-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--primary-dark);
    line-height: 1.4;
  }

  .kc-id {
    font-size: 10.5px;
    color: var(--text-muted);
    font-family: "SF Mono", Monaco, Consolas, monospace;
    margin-left: auto;
    flex-shrink: 0;
  }

  .kc-content {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.75;
  }

  .kc-content p { margin-bottom: 6px; }
  .kc-content p:last-child { margin-bottom: 0; }

  .kc-content ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .kc-content li {
    position: relative;
    padding-left: 14px;
    margin-bottom: 4px;
  }

  .kc-content li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--accent-light);
    font-size: 10px;
    top: 0;
  }

  .kc-sub-list {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-light);
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .kc-sub-tag {
    font-size: 11px;
    padding: 3px 8px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    border-radius: 4px;
    white-space: nowrap;
  }

  /* ===== Sub items expanded in card ===== */
  .kc-sub-items {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-light);
  }

  .kc-sub-item {
    display: flex;
    align-items: flex-start;
    padding: 4px 0;
    font-size: 12px;
    color: var(--text-secondary);
    gap: 8px;
  }

  .kc-sub-item .si-dot {
    width: 4px;
    height: 4px;
    background: var(--accent-light);
    border-radius: 50%;
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* ===== Back to top ===== */
  .back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 44px;
    height: 44px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
    z-index: 100;
  }

  .back-to-top.show {
    opacity: 1;
    visibility: visible;
  }

  .back-to-top:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
  }

  /* ===== Footer ===== */
  .footer-note {
    text-align: center;
    margin-top: 60px;
    padding-top: 30px;
    border-top: 1px solid var(--border-light);
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ===== Highlight for search ===== */
  .tree-node-label.highlight {
    background: #fff8e1 !important;
    color: var(--primary-dark) !important;
  }

  .search-highlight {
    background: #fff59d;
    color: var(--text);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* ===== Mobile ===== */
  @media (max-width: 768px) {
    .sidebar {
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .content-wrapper { padding: 20px; }
    .chapter-title { font-size: 22px; }
    .knowledge-grid { grid-template-columns: 1fr; }
    .chapter-intro { flex-direction: column; gap: 14px; }
  }

  /* Mobile toggle */
  .mobile-toggle {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 60;
    width: 40px;
    height: 40px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    font-size: 18px;
  }

  @media (max-width: 768px) {
    .mobile-toggle { display: flex; align-items: center; justify-content: center; }
  }
</style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleSidebar()">☰</button>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Android 知识脑图</h1>
      <div class="subtitle">高级开发面试题精解</div>
      <div class="stats-row">
        <div class="stat-mini">
          <span class="num" id="statChapters">27</span>
          <span class="label">章节</span>
        </div>
        <div class="stat-mini">
          <span class="num" id="statSections">--</span>
          <span class="label">考点</span>
        </div>
        <div class="stat-mini">
          <span class="num" id="statSubItems">--</span>
          <span class="label">知识点</span>
        </div>
      </div>
    </div>
    <div class="search-box">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="搜索知识点..." oninput="handleSearch(this.value)">
      </div>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" onclick="expandAll()">全部展开</button>
      <button class="sidebar-btn" onclick="collapseAll()">全部折叠</button>
    </div>
    <div class="nav-tree" id="navTree"></div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <div class="content-wrapper" id="contentWrapper">
      <!-- Dynamically rendered -->
    </div>
  </main>
</div>

<button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>

<script>
const KNOWLEDGE_TREE = [{"id": "1", "title": "Activity", "sections": [{"id": "1.1", "title": "Activity的启动流程", "content_lines": ["Activity跨进程启动", "启动流程：", "点击桌面App图标，Launcher进程采用Binder IPC向system_server进程发起startActivity请求；", "system_server进程接收到请求后，向zygote进程发送创建进程的请求；", "Zygote进程fork出新的子进程，即App进程；", "App进程，通过Binder IPC向sytem_server进程发起attachApplication请求；", "system_server进程在收到请求后，进行一系列准备工作后，再通过binder IPC向App进 程发送", "scheduleLaunchActivity请求；", "App进程的binder线程（ApplicationThread）在收到请求后，通过handler向主线程发送LAUNCH_ACTIVITY消息；", "主线程在收到Message后，通过发射机制创建目标Activity，并回调Activity.onCreate()等方法。", "Activity进程内启动", "请求进程A：startActivity—(hook插入点1) (AMP，ActivityManager代理对象)——>", "system_server进程：AMS(ActivityManagerService)", "解析Activity信息、处理启动参数、scheduleLaunchActivity/mH中EXECUTE_TRANSACTION消息处理(Android P)-->", "回到请求进程A：ApplicationThread --> ActivityThread -(hook插入点2)-> Activity生命周期", "()"], "sub_items": []}, {"id": "1.2", "title": "onSaveInstanceState(),onRestoreInstanceState的掉用时机", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "1onSaveInstanceState(Bundle outState)会在以下情况被调用：", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "1.1、从最近应用中选择运行其他的程序时。", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "1.2、当用户按下HOME键时。", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "1.3、屏幕方向切换时(无论竖屏切横屏还是横屏切竖屏都会调用)。", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "1.4、按下电源按键（关闭屏幕显示）时。", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "1.5、从当前activity启动一个新的activity时。", "content_lines": ["onPause -> onSaveInstanceState -> onStop。"], "sub_items": []}, {"id": "1.2", "title": "2onRestoreInstanceState(Bundle outState)会在以下情况被调用：", "content_lines": ["onRestoreInstanceState(Bundle savedInstanceState)只有在activity确实是被系统回收，重新创建activity的情况下", "才会被调用。"], "sub_items": []}, {"id": "1.2", "title": "2.1.屏幕方向切换时，activity生命周期如下", "content_lines": ["onPause -> onSaveInstanceState -> onStop -> onDestroy -> onCreate -> onStart -> onRestoreInstanceState ->", "onResume"], "sub_items": []}, {"id": "1.2", "title": "2.2.在后台被回收", "content_lines": [], "sub_items": []}, {"id": "1.2", "title": "2.3.按HOME键返回桌面,又马上点击应用图标回到原来页面时不会被回收", "content_lines": ["onStart -> onRestoreInstanceState -> onResume"], "sub_items": []}, {"id": "1.2", "title": "3源码", "content_lines": ["系统会调用ActivityThread的performStopActivity方法中掉用onSaveInstanceState， 将状态保存在mActivities中，", "mActivities维护了一个Activity的信息表，当Activity重启时候，会从mActivities中查询到对应的", "ActivityClientRecord。", "如果有信息，则调用Activity的onResoreInstanceState方法，", "在ActivityThread的performLaunchActivity方法中，统会判断ActivityClientRecord对象的state是否为空", "不为空则通过Activity的onSaveInstanceState获取其UI状态信息，通过这些信息传递给Activity的onCreate方法，"], "sub_items": []}, {"id": "1.3", "title": "activity的启动模式和使用场景", "content_lines": [], "sub_items": []}, {"id": "1.3", "title": "1 android任务栈", "content_lines": ["我们每次打开一个新的Activity或者退出当前Activity都会在一个称为任务栈的结构中添加或者减少一个Activity组件，", "一个任务栈包含了一个activity的集合。", "android通过ActivityRecord、TaskRecord、ActivityStack，ActivityStackSupervisor，ProcessRecord有序地管理每", "个activity。"], "sub_items": []}, {"id": "1.3", "title": "2 Standard", "content_lines": ["默认模式，每次启动Activity都会创建一个新的Activity实例。"], "sub_items": []}, {"id": "1.3", "title": "3 SingleTop", "content_lines": ["通知消息打开的页面", "如果要启动的Activity已经在栈顶，则不会重新创建Activity，只会调用该该Activity的onNewIntent()方法。", "如果要启动的Activity不在栈顶，则会重新创建该Activity的实例。"], "sub_items": []}, {"id": "1.3", "title": "4 SingleTask", "content_lines": ["主界面", "如果要启动的Activity已经存在于它想要归属的栈中，那么不会创建该Activity实例，将栈中位于该Ac课tivity上的所有的", "Activity出栈，同时该Activity的onNewIntent()方法会被调用。"], "sub_items": []}, {"id": "1.3", "title": "5SingleInstance", "content_lines": ["呼叫来电界面", "要创建在一个新栈，然后创建该Activity实例并压入新栈中，新栈中只会存在这一个Activity实例。"], "sub_items": []}, {"id": "1.4", "title": "Activity A跳转Activity B，再按返回键，生命周期执行的顺序", "content_lines": ["在A跳转B会执行：A onPause -> B onCreate -> B onStart -> B onResume->A onStop", "在B按下返回键会执行：B onPause -> A onRestart -> A onStart -> A onResume-> B onStop -> B onDestroy", "当A跳转到B的时候，A先执行onPause，然后居然是B再执行onCreate -> onStart -> onResume，最后才执行A的", "onStop!!!", "当B按下返回键，B先执行onPause，然后居然是A再执行onRestart -> onStart -> onResume，最后才是B执行", "onStop -> onDestroy!!!", "当 B Activity 的 launchMode 为 singleInstance，singleTask 且对应的 B Activity 有可复用的实例时，生命周期回调", "是这样的:", "A.onPause -> B.onNewIntent -> B.onRestart -> B.onStart -> B.onResume -> A.onStop -> ( 如果 A 被移出栈的话还", "有一个 A.onDestory)", "当 B Activity 的 launchMode 为 singleTop且 B Activity 已经在栈顶时（一些特殊情况如通知栏点击、连点），此时", "只有 B 页面自己有生命周期变化:", "B.onPause -> B.onNewIntent -> B.onResume"], "sub_items": []}, {"id": "1.5", "title": "横竖屏切换,按home键,按返回键,锁屏与解锁屏幕,跳转透明Activity界面,", "content_lines": ["启动一个 Theme 为 Dialog 的 Activity，弹出Dialog时Activity的生命周期", "横竖屏切换：", "从 Android 3.2 (API级别 13)开始", "1、不设置Activity的androidconfigChanges，或设置Activity的androidconfigChanges=\"orientation\"，或设置", "Activity的android:configChanges=\"orientation|keyboardHidden\"，切屏会重新调用各个生命周期，切横屏时会执", "行一次，切竖屏时会执行一次。", "2、配置 android:configChanges=\"orientation|keyboardHidden|screenSize\"，才不会销毁 activity，且只调用", "onConfigurationChanged方法。", "竖屏：", "启动：onCreat->onStart->onResume.", "切换横屏时：", "onPause-> onSaveInstanceState ->onStop->onDestory", "onCreat->onStart->onSaveInstanceState->onResume.", "如果配置这个属性:androidconfigChanges=\"orientation|keyboardHidden|screenSize\"", "就不会在调用Activity的生命周期，只会调用onConfigurationChanged方法", "HOME键的执行顺序：onPause->onStop->onRestart->onStart->onResume", "BACK键的顺序： onPause->onStop->onDestroy->onCreate->onStart->onResume", "锁屏：锁屏时只会调用onPause()，而不会调用onStop方法，开屏后则调用onResume()。", "弹出 Dialog： 直接是通过 WindowManager.addView 显示的（没有经过 AMS），所以不会对生命周期有任何影", "响。"], "sub_items": []}, {"id": "1.6", "title": "onStart 和 onResume、onPause 和 onStop 的区别", "content_lines": ["onStart 和 onResume 从 Activity 可见可交互区分", "onStart 用户可以看到部分activity但不能与它交互 onResume()可以获得activity的焦点，能够与用户交互", "onStop 和 onPause 从 Activity 是否位于前台，是否有焦点区分", "onPause表示当前页面失去焦点。", "onStop表示当前页面不可见。", "dialog的主题页面，这个时候，打开着一个页面，就只会执行onPause，而不会执行onStop。"], "sub_items": []}, {"id": "1.7", "title": "Activity之间传递数据的方式Intent是否有大小限制，如果传递的数据量", "content_lines": ["偏大，有哪些方案", "startActivity->startActivityForResult->Instrumentation.execStartActivity", "->ActivityManger.getService().startActivity", "intent中携带的数据要从APP进程传输到AMS进程，再由AMS进程传输到目标Activity所在进程", "通过Binder来实现进程间通信", "1.Binder 驱动在内核空间创建一个数据接收缓存区。", "2.在内核空间开辟一块内核缓存区，建立内核缓存区和内核空间的数据接收缓存区之间的映射关系，以及内核中数据", "接收缓存区和接收进程用户空间地址的映射关系。", "3.发送方进程通过系统调用 copyfromuser() 将数据 copy 到内核空间的内核缓存区，由于内核缓存区和接收进程的用", "户空间存在内存映射，因此也就相当于把数据发送到了接收进程的用户空间，这样便完成了一次进程间的通信。", "为当使用Intent来传递数据时，用到了Binder机制，数据就存放在了Binder的事务缓冲区里面，而事务缓冲区是有大", "小限制的。普通的由Zygote孵化而来的用户进程，映射的Binder内存大小是不到1M的", "Binder 本身就是为了进程间频繁-灵活的通信所设计的, 并不是为了拷贝大量数据", "如果非 ipc", "单例,eventBus,Application,sqlite、shared preference、file 都可以;", "如果是 ipc", "1.共享内存性能还不错， 通过 MemoryFile 开辟内存空间，获得 FileDescriptor； 将 FileDescriptor 传递给其他进", "程； 往共享内存写入数据； 从共享内存读取数据。(https://www.jianshu.com/p/4a4bc36000fc)", "2.Socket或者管道性能不太好，涉及到至少两次拷贝。"], "sub_items": []}, {"id": "1.8", "title": "Activity的onNewIntent()方法什么时候执行", "content_lines": ["果IntentActivity处于任务栈的顶端，也就是说之前打开过的Activity，现在处于onPause、onStop 状态的话，其他应", "用再发送Intent的话，执行顺序为：onNewIntent，onRestart，onStart，onResume。", "ActivityA已经启动过,处于当前应用的Activity堆栈中;", "当ActivityA的LaunchMode为SingleTop时，如果ActivityA在栈顶,且现在要再启动ActivityA，这时会调用", "onNewIntent()方法;", "当ActivityA的LaunchMode为SingleInstance,SingleTask时,如果已经ActivityA已经在堆栈中，那么此时再次启动会调", "用onNewIntent()方法;"], "sub_items": []}, {"id": "1.9", "title": "显示启动和隐式启动", "content_lines": ["显示启动", "隐式启动", "隐式Intent是通过在AndroidManifest文件中设置action、data、category，让系统来筛选出合适的Activity", "action的匹配规则", "Intent-filter action可以设置多条", "intent中的action只要与intent-filter其中的一条匹配成功即可，且intent中action最多只有一条", "Intent-filter内必须至少包含一个action。", "category的匹配规则", "Intent-filter内必须至少包含一个category，android:name为android.intent.category.DEFAULT。", "intent-filter中，category可以有多条", "intent中，category也可以有多条", "intent中所有的category都可以在intent-filter中找到一样的（包括大小写）才算匹配成功", "data的匹配规则", "intent-filter中可以设置多个data", "intent中只能设置一个data", "intent-filter中指定了data，intent中就要指定其中的一个data"], "sub_items": [[1, "构造方法传入Component，最常用的方式"], [2, "setComponent(componentName)方法"], [3, "setClass/setClassName方法"]]}, {"id": "1.10", "title": "scheme使用场景,协议格式,如何使用", "content_lines": ["scheme是一种页面内跳转协议，是一种非常好的实现机制，通过定义自己的scheme协议，可以非常方便跳转app中", "的各个页面", "APP根据URL跳转到另外一个APP指定页面", "可以通过h5页面跳转app原生页面", "服务器可以定制化跳转app页面", "Scheme链接格式样式", "样式scheme://host/path?query", "Uri.parse(\"hr://test:8080/goods?goodsId=8897&name=test\")", "hr代表Scheme协议名称", "test代表Scheme作用的地址域", "8080代表改路径的端口号", "/goods代表的是指定页面(路径)", "goodsId和name代表传递的两个参数", "使用", "<intent-filter>", "<!-- 协议部分配置 ,注意需要跟web配置相同-->", "<!--协议部分，随便设置 hr://test:8080/goods?name=test -->", "<data android:scheme=\"hr\"", "android:host=\"test\"", "android:path=\"/goods\""], "sub_items": []}, {"id": "1.11", "title": "ANR 的四种场景", "content_lines": ["ANR 的四种场景：", "Service TimeOut: service 未在规定时间执行完成：前台服务 20s，后台 200s", "BroadCastQueue TimeOut: 未在规定时间内未处理完广播：前台广播 10s 内, 后台 60s 内", "ContentProvider TimeOut: publish 在 10s 内没有完成", "Input Dispatching timeout: 5s 内未响应键盘输入、触摸屏幕等事件", "我们可以看到， Activity 的生命周期回调的阻塞并不在触发 ANR 的场景里面，所以并不会直接触发 ANR。", "只不过死循环阻塞了主线程，如果系统再有上述的四种事件发生，就无法在相应的时间内处理从而触发 ANR。"], "sub_items": []}, {"id": "1.12", "title": "onCreate和onRestoreInstance方法中恢复数据时的区别", "content_lines": ["onSaveInstanceState 不一定会被调用，因为它只有在上次activity被回收了才会调用。", "onCreate()里的Bundle参数可能为空，一定要做非空判断。 而onRestoreInstanceState的Bundle参数一定不会是空", "值。"], "sub_items": []}, {"id": "1.13", "title": "activty间传递数据的方式", "content_lines": ["通过 Intent 传递（Intent.putExtra 的内部也是维护的一个 Bundle，因此，通过 putExtra 放入的 数据，取出时也可", "以通过 Bundle 去取）", "通过全局变量传递", "通过 SharedPreferences 传递", "通过数据库传递", "通过文件传递"], "sub_items": []}, {"id": "1.14", "title": "跨App启动Activity的方式,注意事项", "content_lines": ["使用intentFilter(隐式跳转)", "在Manifest的Activity标签中添加：", "启动时：startActivity(new Intent(\"com.example.test.action.BActivity\"))", "如果有两个action属性值相同的Activity，那么在启动时手机系统会让你选择启动哪一个Activity", "要解决这个问题，需要给被启动的Activity再加上一个属性，", "然后再启动该Activity的Intent中加上一个URI，其中“app”必须与data属性的scheme的值一样，", "intent=new Intent(\"com.zs.appb.intent.action.BeStartActivity\", Uri.parse(\"app://hello\"));", "共享uid的App", "android中uid用于标识一个应用程序，uid在应用安装时被分配，并且在应用存在于手机上期间，都不会改变。一个", "应用程序只能有一个uid，多个应用可以使用sharedUserId 方式共享同一个uid，前提是这些应用的签名要相同。", "在AndroidManifest中：manifest标签中添加android:sharedUserId=\"xxxx\"", "启动时：startActivity(new Intent().setComponent(new", "ComponentName(\"com.example.test\",\"com.example.test.XxxActivity\")));", "使用exported", "一旦设置了intentFilter之后，exported就默认被设置为true了", "在Manifest中添加exported属性", "启动时：startActivity(new Intent().setComponent(new", "ComponentName(\"com.example.zhu\",\"com.example.zhu.XxxActivity\")));", "注意(如何防止自己的Activity被外部非正常启动):", "如果AppB设置了android:permission=”xxx.xxx.xx”那么， 就必须在你的AppA的AndroidManifast.xml中uses-"], "sub_items": []}, {"id": "1.15", "title": "Activity任务栈是什么", "content_lines": ["1.android任务栈又称为Task，它是一个栈结构，具有后进先出的特性，用于存放我们的Activity组件。", "2.我们每次打开一个新的Activity或者退出当前Activity都会在一个称为任务栈的结构中添加或者减少一个Activity组", "件， 一个任务栈包含了一个activity的集合, 只有在任务栈栈顶的activity才可以跟用户进行交互。", "3.在我们退出应用程序时，必须把所有的任务栈中所有的activity清除出栈时,任务栈才会被销毁。当然任务栈也可以", "移动到后台, 并且保留了每一个activity的状态. 可以有序的给用户列出它们的任务, 同时也不会丢失Activity的状态信", "息。", "4.对应AMS中的ActivityRecord、TaskRecord、ActivityStack(AMS中的总结)"], "sub_items": []}, {"id": "1.16", "title": "有哪些Activity常用的标记位Flags", "content_lines": ["FLAG_ACTIVITY_NEW_TASK", "此标记位作用是为Activity指定“singleTask”启动模式，其效果和在XML中指定相同", "android:launchMode=\"singleTask\"", "FLAG_ACTIVITY_SINGLE_TOP", "此标记位作用是为Activity指定“singleTop”启动模式，其效果和在XML中指定相同android:launchMode=\"singleTop\"", "FLAG_ACTIVITY_CLEAR_TOP", "具有此标记位的Activity，当它启动时，在同一个任务栈中位于它上面的Activity都要出栈。此标记位一般会和", "singleTask启动模式一起出现，此情况下，若被启动的Activity实例存在，则系统会调用它的onNewIntent。"], "sub_items": []}, {"id": "1.17", "title": "Activity的数据是怎么保存的,进程被Kill后,保存的数据怎么恢复的", "content_lines": ["在Activity的onSaveInstanceState方法回调时，put到参数outState（Bundle）里面。outState就是", "ActivityClientRecord的state。", "ActivityClientRecord实例，都存放在ActivityThread的mActivities里面。", "Activity变得不可见时（onSaveInstanceState和onStop回调之后），在应用进程这边会通过", "ActivityTaskManagerService的activityStopped方法，把刚刚在onSaveInstanceState中满载了数据的Bundle对象，", "传到系统服务进程那边！ 然后（在系统服务进程这边），会进一步将这个Bundle对象，赋值到对应ActivityRecord的", "icicle上", "ActivityRecord是用来记录对应Activity的各种信息的，如theme，启动模式、当前是否可见等等（为了排版更简洁，", "上图只列出来一个icicle），它里面还有很多管理Activity状态的相关方法；", "TaskRecord就是大家耳熟能详的任务栈（从上图可以看出并不真的是栈）了，它的主要职责就是管理", "ActivityRecord。每当Activity启动时，会先找到合适的TaskRecord（或创建新实例），然后将该Activity所对应的", "ActivityRecord添加到TaskRecord的mActivities中；", "ActivityStack管理着TaskRecord，当新TaskRecord被创建后，会被添加到它mTaskHistory里面。", "startService", "onCreate() -> onStartCommand() -> onDestroy()", "bindService", "onCreate() -> onbind() -> onUnbind()-> onDestroy()", "区别", "启动", "如果服务已经开启，多次执行startService不会重复的执行onCreate()， 而是会调用onStart()和"], "sub_items": [[2, "Service"], [2, "1.service 的生命周期，两种启动方式的区别"], [1, "单独使用startService & stopService"], [2, "单独使用bindService & unbindService"], [2, "2.Service启动流程"], [2, "system_server进程接收到请求后，向zygote进程发送创建进程的请求；"], [3, "zygote进程fork出新的子进程Remote Service进程；"], [2, "3.Service与Activity怎么实现通信"], [1, "Service中添加一个继承Binder的内部类，并添加相应的逻辑方法"], [2, "Service中重写Service的onBind方法，返回我们刚刚定义的那个内部类实例"], [1, "创建一个名叫 ServiceHandler 的内部 Handler"], [2, "把内部Handler与HandlerThread所对应的子线程进行绑定"], [3, "HandlerThread开启线程 创建自己的looper"], [2, "5.Service 的 onStartCommand 方法有几种返回值?各代表什么意思?"]]}, {"id": "1.1", "title": "1 注意代码中常见内存泄漏场景", "content_lines": ["Handler内存泄漏", "在Activity中使用非静态内部类初始化了一个Handler,此Handler就会持有当前Activity的引用。Activity页面关闭之后,", "存在引用关系。非静态内部类和匿名内部类都会隐式持有当前类的外部引用。", "单例造成的内存泄漏", "单例持有 Context 对象，如果 Activity 中调用 getInstance 方法并传入 this 时，singleTon 就持有了此 Activity 的引", "用，当退出 Activity 时，Activity 就无法回收，造成内存泄漏", "资源性对象未关闭，注册对象未注销", "例如Bitmap等资源未关闭会造成内存泄漏，例如BraodcastReceiver、EventBus未注销造成的内存泄漏，我们应该", "在Activity销毁时及时注销。", "MVP中的内存泄漏", "Presenter 层持有 View 对象，一般我们会把 Activity 做为 View 传递到 Presen享ter，Presenter 持有 View对象，", "Activity 退出了但是没有回收出现内存泄漏。", "ViewPager+fragment内存泄露", "List里一直有Fragment的引用，Fragment无法回收造成内存泄漏 在重写的PagerAdapter的getItem()方法中，", "return new yourFragment()解决此问题", "在 MVP 的架构中，通常 Presenter 要同时持有 View 和 Model 的引用，如果在 Activity 退出的时候，Presenter 正", "在进行一个耗时操作，那么 Presenter 的生命周期会比 Activity 长，导致 Activity 无法回收，造成内存泄漏", "避免在循环里创建对象，建立合适的缓存复用对象，避免在onDraw里创建对象"], "sub_items": []}, {"id": "1.1", "title": "2 使用工具查找内存泄漏具体位置", "content_lines": ["LeakCanary", "在Activity执行完onDestroy()之后，将它放入WeakReference中，然后将这个WeakReference类型的Activity对象与", "ReferenceQueque关联。这时再从ReferenceQueque中查看是否有没有该对象，如果没有，执行gc，再次查看，还", "是没有的话则判断发生内存泄露了。最后用HAHA这个开源库去分析dump之后的heap内存", "Profiler", "使用App后，Android Profiler中先触发GC，然后dump内存快照，之后点击按package分类，就可以迅速查看到你", "的App目前在内存中残留的class,点击class即可在右边查看到对应的实例以及引用对象。", "Bitmap 内存占用的计算", "包括图片质量的压缩， RGB_565法，采样率压缩，Matrix比例压缩", "不同dpi占用内存不一样,假设这张图片是ARGB_8888的，那这张图片占的内存就是 width * height * 4个字节或者", "width * height * inTargetDensity /inDensity * 4", "LruCache & DiskLruCache", "ARTHook 监控加载的图片是否过大的ImageView，可以在debug阶段发出警告，方便及早发现过大的图片。", "1 使用Epic来进行Hook", "2 DexposedBridge.hookAllConstructors(ImageView.class, new XC_MethodHook()", "3 ImageHook中，图标宽高都大于view的2倍以上，则警告，当宽高度等于0时，说明ImageView还没有进行绘制，", "使用ViewTreeObserver进行大图检测的处理。", "确保打开每一个主要页面的主要功能，然后回到首页，进开发者选项去打开\"不保留后台活动\"。然后，将我们的app", "退到后台，GC，dump出内存快照。最后，我们就可以将对dump出的内存快照进行分析，看看有哪些地方是可以优", "化的，比如加载的图片、应用中全局的单例数据配置、静态内存与缓存、埋点数据、内存泄漏等等。"], "sub_items": [[1, "2 图片优化"], [1, "对图片进行内存压缩；"], [2, "高分辨率的图片放入对应文件夹；"], [3, "缓存"], [4, "及时回收"], [5, "ARTHook非侵入式之图片检查"], [2, "内存占用分析优化"], [2, "1静态内存分析优化"], [2, "2 动态内存分析优化"], [16, "2.启动优化"]]}, {"id": "1.1", "title": "真正的请求交给了 RealCall 类", "content_lines": [], "sub_items": []}]}, {"id": "2", "title": "Service", "sections": [{"id": "2.1", "title": "service 的生命周期，两种启动方式的区别", "content_lines": ["startService", "onCreate() -> onStartCommand() -> onDestroy()", "bindService", "onCreate() -> onbind() -> onUnbind()-> onDestroy()", "区别", "启动", "如果服务已经开启，多次执行startService不会重复的执行onCreate()， 而是会调用onStart()和", "onStartCommand()。", "如果服务已经开启，多次执行bindService时,onCreate和onBind方法并不会被多次调用", "销毁", "当执行stopService时，直接调用onDestroy方法", "调用者调用unbindService方法或者调用者Context不存在了（如Activity被finish了），Service就会调用onUnbind-", ">onDestroy", "使用startService()方法启用服务，调用者与服务之间没有关连，即使调用者退出了，服 务仍然运行。", "使用bindService()方法启用服务，调用者与服务绑定在了一起，调用者一旦退出，服务也就终止。", "（1）第一次调用startService会执行onCreate、onStartCommand。", "（2）之后再多次调用startService只执行onStartCommand，不再执行onCreate。", "（3）调用stopService会执行onDestroy。", "（1）第一次调用bindService会执行onCreate、onBind。", "（2）之后再多次调用bindService不会再执行onCreate和onBind。"], "sub_items": [[1, "单独使用startService & stopService"], [2, "单独使用bindService & unbindService"]]}, {"id": "2.2", "title": "Service启动流程", "content_lines": ["1.Process A进程采用Binder IPC向system_server进程发起startService请求；", "4.Remote Service进程，通过Binder IPC向sytem_server进程发起attachApplication请求；", "5.system_server进程在收到请求后，进行一系列准备工作后，再通过binder IPC向remote Service进程发送", "scheduleCreateService请求；", "6.Remote Service进程的binder线程在收到请求后，通过handler向主线程发送CREATE_SERVICE消息课；", "7.主线程在收到Message后，通过发射机制创建目标Service，并回调Service.onCreate()方法。", "到此，服务便正式启动完成。当创建的是本地服务或者服务所属进程已创建时，则无需经学过上述步骤2、3，直接创建", "服务即可。", "bindService", "startService"], "sub_items": [[2, "system_server进程接收到请求后，向zygote进程发送创建进程的请求；"], [3, "zygote进程fork出新的子进程Remote Service进程；"]]}, {"id": "2.3", "title": "Service与Activity怎么实现通信", "content_lines": ["通过Binder对象", "3.Activity中绑定服务,重写ServiceConnection，onServiceConnected时返回的IBinder（Service中的binder）调用", "逻辑方法", "Service通过BroadCast广播与Activity通信"], "sub_items": [[1, "Service中添加一个继承Binder的内部类，并添加相应的逻辑方法"], [2, "Service中重写Service的onBind方法，返回我们刚刚定义的那个内部类实例"]]}, {"id": "2.4", "title": "IntentService是什么,IntentService原理，应用场景及其与Service的区", "content_lines": ["别", "what", "IntentService 是 Service 的子类，默认开启了一个工作线程HandlerThread，使用这个工作线程逐一处理所有启动", "请求，在任务执行完毕后会自动停止服务。只要实现一个方法 onHandleIntent，该方法会接收每个启动请求的", "Intent，能够执行后台工作和耗时操作。", "可以启动 IntentService 多次，而每一个耗时操作会以队列的方式在 IntentService 的 onHandlerIntent 回调方法中", "执行，并且，每一次只会执行一个工作线程，执行完第一个再执行第二个。并且等待所有消息都执行完后才终止服", "务。", "how", "4.通过 onStartCommand() intent，依次插入到工作队列中，并发送给 onHandleIntent()逐个处理", "可以用作后台下载任务 静默上传", "why IntentService会创建独立的worker线程来处理所有的Intent请求 Service主线程不能处理耗时操", "作,IntentService不会阻塞UI线程，而普通Serveice会导致ANR异常。", "为Service的onBind()提供默认实现，返回null；onStartCommand提供默认实现，将请求Intent添加到队列中。", "所有请求处理完成后，IntentService会自动停止，无需调用stopSelf()方法停止Service。"], "sub_items": [[1, "创建一个名叫 ServiceHandler 的内部 Handler"], [2, "把内部Handler与HandlerThread所对应的子线程进行绑定"], [3, "HandlerThread开启线程 创建自己的looper"]]}, {"id": "2.5", "title": "Service 的 onStartCommand 方法有几种返回值?各代表什么意思?", "content_lines": ["START_NOT_STICKY", "在执行完 onStartCommand 后,服务被异常 kill 掉,系统不会自动重启该服务。", "START_STICKY", "重传 Intent。使用这个返回值时,如果在执行完 onStartCommand 后,服务被异 常 kill 掉,系统会自动重启该服务 ，并", "且onStartCommand方法会执行,onStartCommand方法中的intent值为null。", "适用于媒体播放器或类似服务。", "START_REDELIVER_INTEN", "使用这个返回值时,服务被异 常 kill 掉,系统会自动重启该服务,并将 Intent 的值传入。", "适用于主动执行应该立即恢复的作业（例如下载文件）的服务。"], "sub_items": []}, {"id": "2.6", "title": "bindService和startService混合使用的生命周期以及怎么关闭", "content_lines": ["如果你只是想要启动一个后台服务长期进行某项任务，那么使用startService便可以了。如果你还想要与正在运行的", "Service取得联系，那么有两种方法：一种是使用broadcast，另一种是使用bindService。", "如果先startService，再bindService", "onCreate() -> onbind() -> onStartCommand()", "如果先bindService，再startService", "onCreate() -> onStartCommand() -> onbind()", "如果只stopService", "Service的OnDestroy()方法不会立即执行,在Activity退出的时候，会执行OnDestroy。", "如果只unbindService", "只有onUnbind方法会执行，onDestory不会执行", "如果要完全退出Service，那么就得执行unbindService()以及stopService。", "Android 广播分为两个角色：广播发送者、广播接受者", "广播接收器的注册分为两种：静态注册、动态注册。", "静态广播接收者：通过AndroidManifest.xml的标签来申明的BroadcastReceiver。", "动态广播接收者：通过AMS.registerReceiver()方式注册的BroadcastReceiver，动态注册更为灵活，可在不需要时通", "过unregisterReceiver()取消注册。", "广播类型：根据广播的发送方式，", "2.系统广播：当使用系统广播时，只需在注册广播接收者时定义相关的action即可，不需要手动发送课广播(网络变化,", "锁屏,飞行模式)", "3.有序广播： 指的是发送出去的广播被 BroadcastReceiver 按照先后顺序进行接收 发送方式变为："], "sub_items": [[3, "BroadcastReceiver"], [3, "1.广播的分类和使用场景"], [1, "普通广播：通过Context.sendBroadcast()发送，可并行处理"], [4, "App应用内广播（Local Broadcast）"], [3, "2.广播的两种注册方式的区别"], [3, "3.广播发送和接收的原理"], [3, "4.本地广播和全局广播的区别"]]}, {"id": "2.1", "title": "连接点（JoinPoint）", "content_lines": ["JPoint 是一个程序的关键执行点，也是我们关注的重点。它就是指被拦截到的点（如方法、字段、构造器等等）。"], "sub_items": []}, {"id": "2.2", "title": "切入点（PointCut）", "content_lines": ["对 JoinPoint 进行拦截的定义。PointCut 的目的就是提供一种方法使得开发者能够选择自己感兴趣的 JoinPoint。"], "sub_items": []}, {"id": "2.3", "title": "通知（Advice）", "content_lines": ["1）、Before：PointCut 之前执行。 2）、After：PointCut 之后执行。 3）、Around：PointCut 之前、之后分别执", "行。", "Run -> Edit Configurations-> Sample Java Methods，可以定位到Java代码大致定位到启动CPU耗时的原因", "启动优化方案", "log-BlogCommendFromBaidu-1.control&depth_1-utm_source=distribute.pc_relevant_t0.none-task-blog-BlogC", "ommendFromBaidu-1.control", "白屏原因:", "1.从zygote进程fork出一个新进程 2.创建Application类并初始化，主要是执行Application.onCreate()方法； 3.创建", "并初始化入口Activity类，并在窗口上绘制UI；", "设置android:windowBackground属性", "windowBackground属性可以配置任意drawable， 与你启动页一样的图片。做到视觉上的无缝过渡.", "2.application初始化内存,异步改造。", "子线程来分担主线程的任务，并减少运行时间", "线程缺乏统一管理，可能无限制新建线程，相互之间竞争，及可能占用过多系统资源导致死机或oom，所以我们使用", "线程池的方式去执行异步。", "使用FixedThreadPool：创建一个定长的线程池，可控制线程最大的并发数，超出的部分任务，会在队列中等待。", "利用CPU设置线程池数量", "// 获得当前CPU的核心数 private static final int CPU_COUNT = Runtime.getRuntime().availableProcessors();", "// 设置线程池的核心线程数2-4之间,但是取决于CPU核数 private static final int CORE_POOL_SIZE = Math.max(2,", "Math.min(CPU_COUNT - 1, 4));"], "sub_items": [[3, "Android Profiler得到启动过程的CPU过程，看到线程的具体代码耗时"], [1, "启动闪屏主题设置"], [2, "线程池和启动器"], [2, "线程池"]]}, {"id": "2.2", "title": "启动器", "content_lines": [], "sub_items": []}]}, {"id": "3", "title": "BroadcastReceiver", "sections": [{"id": "3.1", "title": "广播的分类和使用场景", "content_lines": ["Android 广播分为两个角色：广播发送者、广播接受者", "广播接收器的注册分为两种：静态注册、动态注册。", "静态广播接收者：通过AndroidManifest.xml的标签来申明的BroadcastReceiver。", "动态广播接收者：通过AMS.registerReceiver()方式注册的BroadcastReceiver，动态注册更为灵活，可在不需要时通", "过unregisterReceiver()取消注册。", "广播类型：根据广播的发送方式，", "2.系统广播：当使用系统广播时，只需在注册广播接收者时定义相关的action即可，不需要手动发送课广播(网络变化,", "锁屏,飞行模式)", "3.有序广播： 指的是发送出去的广播被 BroadcastReceiver 按照先后顺序进行接收 发送方式变为：", "sendOrderedBroadcast(intent);", "广播接受者接收广播的顺序规则（同时面向静态和动态注册的广播接受者）：按照 Priority 属性值从大-小排序，", "Priority属性相同者，动态注册的广播优先。", "背景 Android中的广播可以跨App直接通信（exported对于有intent-filter情况下默认值为true）", "冲突 可能出现的问题：", "其他App针对性发出与当前App intent-filter相匹配的广播，由此导致当前App不断接收广播并处理；", "其他App注册与当前App一致的intent-filter用于接收广播，获取广播具体信息； 即会出现安全性 & 效率性的问题。", "解决方案 使用App应用内广播（Local Broadcast）", "App应用内广播可理解为一种局部广播，广播的发送者和接收者都同属于一个App。 相比于全局广播（普通广播），", "App应用内广播优势体现在：安全性高 & 效率高", "具体使用1 - 将全局广播设置成局部广播"], "sub_items": [[1, "普通广播：通过Context.sendBroadcast()发送，可并行处理"], [4, "App应用内广播（Local Broadcast）"]]}, {"id": "3.2", "title": "广播的两种注册方式的区别", "content_lines": ["静态注册：常驻系统，不受组件生命周期影响，即便应用退出，广播还是可以被接收，耗电、占内存。", "动态注册：非常驻，跟随组件的生命变化，组件结束，广播结束。在组件结束前，需要先移除广播，否则容易造成内", "存泄漏。"], "sub_items": []}, {"id": "3.3", "title": "广播发送和接收的原理", "content_lines": ["动态注册", "1.创建对象LoadedApk.ReceiverDispatcher.InnerReceiver的实例，该对象继承于", "IIntentReceiver.Stub（InnerReceiver实际是一个binder本地对象(BBinder：本地Binder，服务实现方的基类，提供", "了onTransact接口来接收请求)）。", "2.将IIntentReceiver对象和注册所传的IntentFilter对象发送给AMS。 AMS记录IIntentReceiver、IntentFilter和注册", "的进程ProcessRecord，并建立起它们的对应关系。", "3.当有广播发出时，AMS根据广播intent所携带的IntentFilter找到IIntentReceiver和ProcessRecord，然后回调App", "的ApplicationThread对象的scheduleRegisteredReceiver，将IIntentReceiver和广播的intent一并传给App，App直", "接调用IIntentReceiver的performReceive。", "4.因为广播是通过binder线程回调到接收进程的，接收进程通过ActivityThread里的H这个Handler将调用转到主线", "程，然后回调BroadcastReceiver的onReceive。", "静态注册", "静态注册是通过在Manifest文件中声明实现了BroadcastReceiver的自定义类和对应的IntentFilter，来告诉", "PMS(PackageManagerService)这个App所注册的广播。", "当AMS接收到广播后，会查找所有动态注册的和静态注册的广播接收器，静态注册的广播接收器是通过", "PMS(PackageManagerService)发现的，PMS找到对应的App", "对应进程已经创建，直接调用App的ApplicationThread对象的scheduleReceiver", "对应进程尚未创建，先启动App进程，App进程启动后回调AMS的attachApplication，attachApplication则继续派发", "刚才的广播App这边收到调用后会先通过Handler转到主线程，然后根据AMS传过来的参数实例化广播接收器的类，", "接着调用广播接收器的onReceive。"], "sub_items": []}, {"id": "3.4", "title": "本地广播和全局广播的区别", "content_lines": ["BroadcastReceiver是针对应用间、应用与系统间、应用内部进行通信的一种方式", "LocalBroadcastReceiver仅在自己的应用内发送接收广播，也就是只有自己的应用能收到，数据更加安全广播只在这", "个程序里，而且效率更高。", "BroadcastReceiver采用的binder方式实现跨进程间的通信；", "LocalBroadcastManager使用Handler通信机制。", "LocalBroadcastReceiver 使用", "LocalBroadcastReceiver不能静态注册，只能采用动态注册的方式。", "在发送和注册的时候采用，LocalBroadcastManager的sendBroadcast方法和registerReceiver方法", "注册过程，主要是向mReceivers和mActions添加相应数据：", "mReceivers：数据类型为HashMap<BroadcastReceiver, ArrayList>， 记录广播接收者与IntentFilter列表的对应关", "系；", "mActions：数据类型为HashMap<String, ArrayList>， 记录action与广播接收者的对应关系", "根据Intent的action来查询相应的广播接收者列表；", "发送MSG_EXEC_PENDING_BROADCASTS消息，回调相应广播接收者的onReceive方法", "ContentProvider的作用是为不同的应用之间数据共享，提供统一的接口，我们知道安卓系统中应用内部的数据是对", "外隔离的，要想让其它应用能使用自己的数据（例如通讯录）这个时候就用到了ContentProvider。", "ContentProvider（内容提供者）通过 uri 来标识其它应用要访问的数据。", "通过 ContentResolver（内容解析者）的增、删、改、查方法实现对共享数据的操作。", "还可以通过注册 ContentObserver（内容观察者）来监听数据是否发生了变化来对应的刷新页面", "4.2.ContentProvider,ContentResolver,ContentObserver之间的关系"], "sub_items": [[4, "ContentProvider"], [4, "1.什么是ContentProvider及其使用"], [4, "3.ContentProvider的实现原理"], [4, "4.ContentProvider的优点"], [4, "5.Uri 是什么"], [5, "Handler"], [5, "1.Handler的实现原理"], [5, "2.子线程中能不能直接new一个Handler,为什么主线程可以"]]}, {"id": "3.1", "title": "1 自定义事件监听器", "content_lines": ["请求次数", "模拟数据", "弱网模拟", "视图承载器，是一个视图的顶层窗口， 包含了View并对View进行管理, 是一个抽象类，具体的实现类为", "PhoneWindow,内部持有DecorView。 通过WindowManager创建，并通过WindowManger将DecorView添加进", "来。", "WindowManager是一个接口，继承自只有添加、删除、更新三个方法的ViewManager接口。 它的实现类为", "WindowManagerImpl，WindowManagerImpl通过WindowManagerGlobal代理实现addView， 最后调用到", "ViewRootImpl的setView 使ViewRoot和Decorview相关联。如果要对Window进行添加和删除就需要使用", "WindowManager， 具体的工作则由WMS来处理，WindowManager和WMS通过Binder来进行跨进程通信。", "ViewRoot是View和WindowManager的桥梁，View通过WindowManager来转接调用ViewRootImpl View的三大流", "程(测量（measure），布局（layout），绘制（draw）)均通过ViewRoot来完成。 Android的所有触屏事件、按键", "事件、界面刷新等事件都是通过ViewRoot进行分发的。", "DecorView是FrameLayout的子类，它可以被认为是Android视图树的根节点视图, 一般情况下它内部包含一个竖直", "方向的LinearLayout，在这个LinearLayout里面有上下三个部分， 上面是个ViewStub,延迟加载的视图（应该是设置", "ActionBar,根据Theme设置）， 中间的是标题栏(根据Theme设置，有的布局没有)，下面的是内容栏。", "setContentView就是把需要添加的View的结构添加保存在DecorView中。", "Activity并不负责视图控制，它只是控制生命周期和处理事件，Activity中持有的是Window Window是视图的承载", "器，内部持有一个 DecorView，而这个DecorView才是 view 的根布局", "View就是视图,在setContentView中将R.layout.activity_main添加到DecorView。"], "sub_items": [[4, "1 数据缓存 4.2 数据压缩 4.3 图片压缩"], [2, "质量维度"], [17, "Window&WindowManager"], [17, "1.什么是Window"], [17, "2.什么是WindowManager"], [3, "什么是ViewRootImpl"], [17, "4.什么是DecorView"], [17, "5.Activity，View，Window三者之间的关系"], [17, "6.DecorView什么时候被WindowManager添加到Window中"], [18, "AMS"], [18, "1.ActivityManagerService是什么？什么时候初始化的？有什么作用？"], [18, "2.ActivityThread是什么?ApplicationThread是什么?他们的区别"], [18, "3.Instrumentation是什么？和ActivityThread是什么关系？"], [18, "5. ActivityRecord、TaskRecord、ActivityStack，"]]}, {"id": "3.1", "title": "1 占坑、通过校验：", "content_lines": ["hook点", "IActivityManager", "Activity启动过程", "startActivity-Instrumentation.execStartActivity()->ActivityManager.getService().startActivity()->", "IActivityManager.Stub.asInterface->AMS.startActivity()", "ActivityManager中getService()借助Singleton类实现单例,而且该单例是静态的,IActivityManager是一个比较好的", "Hook点。由于Hook点IActivityManager是一个接口(源码中IActivityManager.aidl文件)，建议这里采用动态代理。", "过程", "1.2 拦截startActivity方法，获取参数args中保存的Intent对象，它是原本要启动插件TargetActivity的Intent。", "1.3 新建一个subIntent用来启动StubActivity，并将前面得到的TargetActivity的Intent保存到subIntent中，便于以后", "还原TargetActivity。", "代码", "1、反射获取ActivityManager类中的静态实例IActivityManagerSingleton"], "sub_items": [[1, "1 AndroidManifest.xml中注册SubActivity"], [2, "反射获取Singleton中的mInstance实例"], [3, "获取此IActivityManagerSingleton内部的mInstance"], [4, "动态代理创建代理IActivityManager"], [5, "将重写的代理IActivityManager设置给mInstance"]]}, {"id": "3.1", "title": "2 还原插件Activity：", "content_lines": [], "sub_items": []}]}, {"id": "4", "title": "ContentProvider", "sections": [{"id": "4.1", "title": "什么是ContentProvider及其使用", "content_lines": ["ContentProvider的作用是为不同的应用之间数据共享，提供统一的接口，我们知道安卓系统中应用内部的数据是对", "外隔离的，要想让其它应用能使用自己的数据（例如通讯录）这个时候就用到了ContentProvider。", "ContentProvider（内容提供者）通过 uri 来标识其它应用要访问的数据。", "通过 ContentResolver（内容解析者）的增、删、改、查方法实现对共享数据的操作。", "还可以通过注册 ContentObserver（内容观察者）来监听数据是否发生了变化来对应的刷新页面"], "sub_items": []}, {"id": "4.2", "title": "ContentProvider,ContentResolver,ContentObserver之间的关系", "content_lines": ["ContentProvider：管理数据，提供数据的增删改查操作，数据源可以是数据库、文件、XML、网络等。", "ContentResolver：外部进程可以通过 ContentResolver 与 ContentProvider 进行交互。其他应用中", "ContentResolver 可以不同 URI 操作不同的 ContentProvider 中的数据。", "ContentObserver：观察 ContentProvider 中的数据变化，并将变化通知给外界。"], "sub_items": []}, {"id": "4.3", "title": "ContentProvider的实现原理", "content_lines": ["ContentProvider的安装(ActivityThread.installProvider)", "当主线程收到H.BIND_APPLICATION消息后，会调用handleBindApplication方法。", "handleBindApplication->installProvider", "installProvider()", "创建了provider对象", "创建ProviderClientRecord，这是一个provider在client进程中对应的对象", "放入mProviderMap(记录所有contentProvider)", "总结：把provider启动起来并记录和发布给AMS", "ContentResolver.query", "调用端App在使用ContentProvider前首先要获取ContentProvider", "1。通过ContentResolver调用acquireProvider", "2.ActivityThread首先通过一个map查找是否已经install过这个Provider，如果install过就直接将之返回给调用者，如", "果没有install过就调用AMS的getContentProvider,AMS首先查找这个Provider是否被publish过，如果publish过就直", "接返回，否则通过PMS找到Provider所在的App。", "3.如果发现目标App进程未启动,就创建一个ContentProviderRecord对象然后调用其wait方法阻塞当前执行流程,启动", "目标App进程,AMS找到App的所有运行于当前进程的Provider,保存在map中,将要启动的所有Provider传给目标App", "进程,解除前面对获取Provider执行流程的阻塞.", "4.如果目标App进程已启动，AMS在getContentProvider里会查找到要获取的Provider，就直接返回了.调用端App收", "到AMS的返回结果后(acquireProvider返回)，调用ActivityThread的installProvider将Pro学vider记录到本地的一个", "map中，下次再调用acquireProvider就直接返回。"], "sub_items": []}, {"id": "4.4", "title": "ContentProvider的优点", "content_lines": ["封装", "采用ContentProvider方式，其 解耦了 底层数据的存储方式，使得无论底层数据存储采用何种方式，外界对数据的", "访问方式都是统一的，这使得访问简单 & 高效", "如一开始数据存储方式 采用 SQLite 数据库，后来把数据库换成 MongoDB，也不会对上层数据ContentProvider使", "用代码产生影响", "提供一种跨进程数据共享的方式。", "应用程序间的数据共享还有另外的一个重要话题，就是数据更新通知机制了。因为数据是在多个应用程序中共享的，", "当其中一个应用程序改变了这些共享数据的时候，它有责任通知其它应用程序，让它们知道共享数据被修改了，这样", "它们就可以作相应的处理。"], "sub_items": []}, {"id": "4.5", "title": "Uri 是什么", "content_lines": ["定义：Uniform Resource Identifier，即统一资源标识符", "作用：唯一标识 ContentProvider & 其中的数据，URI分为 系统预置 & 自定义，分别对应系统内置的数据（如通讯", "录、日程表等等）和自定义数据库", "每一个 ContentProvider 都拥有一个公共的 URI ，这个 URI 用于表示这个 ContentProvider 所提供的数据。", "将其分为 A，B，C，D 4个部分：", "A：标准前缀，；\"content://\"；", "B：URI 的标识，用于唯一标识这个 ContentProvider ，外部调用者可以根据这个标识来找到它。", "C：路径（ path ），通俗的讲就是你要操作的数据库中表的名字，", "D：如果URI中包含表示需要获取的记录的 ID；则就返回该id对应的数据，如果没有 ID，就表示返回全部。"], "sub_items": [[5, "Handler"]]}]}, {"id": "5", "title": "Handler", "sections": [{"id": "5.1", "title": "Handler的实现原理", "content_lines": ["从四个方面看Handler、Message、MessageQueue 和 Looper", "Handler:负责消息的发送和处理", "Message:消息对象，类似于链表的一个结点;", "MessageQueue:消息队列，用于存放消息对象的数据结构;", "Looper:消息队列的处理者（用于轮询消息队列的消息对象)", "Handler发送消息时调用MessageQueue的enqueueMessage插入一条信息到MessageQueue,Looper不断轮询调用", "MeaasgaQueue的next方法 如果发现message就调用handler的dispatchMessage，dispatchMessage被成功调", "用，接着调用handlerMessage()。"], "sub_items": []}, {"id": "5.2", "title": "子线程中能不能直接new一个Handler,为什么主线程可以", "content_lines": ["主线程的Looper第一次调用loop方法,什么时候,哪个类", "不能，因为Handler 的构造方法中，会通过Looper.myLooper()获取looper对象，如果为空，则抛出异常，", "主线程则因为已在入口处ActivityThread的main方法中通过 Looper.prepareMainLooper()获取到这个对象，", "并通过 Looper.loop()开启循环，在子线程中若要使用handler，可先通过Loop.prepare获取到looper对象，并使用", "Looper.loop()开启循环"], "sub_items": []}, {"id": "5.3", "title": "Handler导致的内存泄露原因及其解决方案", "content_lines": ["原因:1.Java中非静态内部类和匿名内部类都会隐式持有当前类的外部引用", "2.我们在Activity中使用非静态内部类初始化了一个Handler,此Handler就会持有当前Activity的引用。", "3.我们想要一个对象被回收，那么前提它不被任何其它对象持有引用，所以当我们Activity页面关闭之后,存在引用关", "系：\"未被处理 / 正处理的消息 -> Handler实例 -> 外部类\",如果在Handler消息队列 还有未处理的消息 / 正在处理消", "息时 导致Activity不会被回收，从而造成内存泄漏 解决方案: 1.将Handler的子类设置成 静态内部类,使用", "WeakReference弱引用持有Activity实例 2.当外部类结束生命周期时，清空Handler内消息队列"], "sub_items": []}, {"id": "5.4", "title": "一个线程可以有几个Handler,几个Looper,几个MessageQueue对象", "content_lines": ["一个线程可以有多个Handler,只有一个Looper对象,只有一个MessageQueue对象。Looper.prepare()函数中知", "道，。在Looper的prepare方法中创建了Looper对象，并放入到ThreadLocal中，并通过ThreadLocal来获取looper", "的对象, ThreadLocal的内部维护了一个ThreadLocalMap类,ThreadLocalMap是以当前thread做为key的,因此可以得", "知，一个线程最多只能有一个Looper对象， 在Looper的构造方法中创建了MessageQueue对象，并赋值给mQueue", "字段。因为Looper对象只有一个，那么Messagequeue对象肯定只有一个。"], "sub_items": []}, {"id": "5.5", "title": "Message对象创建的方式有哪些 & 区别", "content_lines": ["Message.obtain()怎么维护消息池的", "每次需要Message对象的时候都创建一个新的对象，每次都要去堆内存开辟对象存储空间 2.Message msg =", "Message.obtain();", "obtainMessage能避免重复Message创建对象。它先判断消息池是不是为空，如果非空的话就从消息池表头的", "Message取走,再把表头指向 next。", "如果消息池为空的话说明还没有Message被放进去，那么就new出来一个Message对象。消息池使用 Message 链表", "结构实现，消息池默认最大值 50。消息在loop中被handler分发消费之后会执行回收的操作，将该消息内部数据清空", "并添加到消息链表的表头。", "3.Message msg = handler.obtainMessage(); 其内部也是调用的obtain()方法"], "sub_items": [[1, "Message msg = new Message();"]]}, {"id": "5.6", "title": "Handler 有哪些发送消息的方法", "content_lines": ["sendMessage(Message msg)", "sendMessageDelayed(Message msg, long uptimeMillis)", "post(Runnable r)", "postDelayed(Runnable r, long uptimeMillis)", "sendMessageAtTime(Message msg,long when)"], "sub_items": []}, {"id": "5.7", "title": "Handler的post与sendMessage的区别和应用场景", "content_lines": ["sendMessage", "sendMessage-sendMessageAtTime-enqueueMessage。", "post", "sendMessage-getPostMessage-sendMessageAtTime-enqueueMessage getPostMessage会先生成一个", "Messgae，并且把runnable赋值给message的callback", "public void dispatchMessage(@NonNull Message msg) {", "if (msg.callback != null) {", "handleCallback(msg);", "} else {", "if (mCallback != null) {", "if (mCallback.handleMessage(msg)) {", "return;", "}", "}", "handleMessage(msg);", "}", "}", "dispatchMessage方法中直接执行post中的runnable方法。", "而sendMessage中如果mCallback不为null就会调用mCallback.handleMessage(msg)方法，如果handler内的", "callback不为空，执行mCallback.handleMessage(msg)这个处理消息并判断返回是否为true，如果返回true，消息"], "sub_items": [[1, "源码"], [2, "Looper->dispatchMessage处理时"]]}, {"id": "5.8", "title": "handler postDealy后消息队列有什么变化，假设先 postDelay 10s, 再", "content_lines": ["postDelay 1s, 怎么处理这2条消息sendMessageDelayed-", "sendMessageAtTime-sendMessage", "postDelayed传入的时间，会和当前的时间SystemClock.uptimeMillis()做加和,而不是单纯的只是用延时时间。延时", "消息会和当前消息队列里的消息头的执行时间做对比，如果比头的时间靠前，则会做为新的消息头，不然则会从消息", "头开始向后遍历，找到合适的位置插入延时消息。", "postDelay()一个10秒钟的Runnable A、消息进队，MessageQueue调用nativ 享 ePollOnce()阻塞，Looper阻塞；", "紧接着post()一个Runnable B、消息进队，判断现在A时间还没到、正在阻塞，把B插入消息队列的头部（A的前", "面），然后调用nativeWake()方法唤醒线程；", "MessageQueue.next()方法被唤醒后，重新开始读取消息链表，第一个消息B无延时，直接返回给Looper；", "Looper处理完这个消息再次调用next()方法，MessageQueue继续读取消息链表，第二个消息A还没到时间，计算一", "下剩余时间（假如还剩9秒）继续调用nativePollOnce()阻塞； 直到阻塞时间到或者下一次有Message进队；"], "sub_items": []}, {"id": "5.9", "title": "MessageQueue是什么数据结构", "content_lines": ["内部存储结构并不是真正的队列，而是采用单链表的数据结构来存储消息列表", "这点和传统的队列有点不一样，主要区别在于Android的这个队列中的消息是按照时间先后顺序来存储的，时间较早", "的消息，越靠近队头。 当然，我们也可以理解成，它是先进先出的，只是这里的先依据的不是谁先入队，而是消息", "待发送的时间"], "sub_items": []}, {"id": "5.10", "title": "Handler怎么做到的一个线程对应一个Looper，如何保证只有一个", "content_lines": ["MessageQueue ThreadLocal在Handler机制中的作用", "设计的初衷是为了解决多线程编程中的资源共享问题，", "synchronized采取的是“以时间换空间”的策略，本质上是对关键资源上锁，让大家排队操作。", "而ThreadLocal采取的是“以空间换时间”的思路， 它一个线程内部的数据存储类，通过它可以在制定的线程中存储数", "据，数据存储以后，只有在指定线程中可以获取到存储的数据， 对于其他线程就获取不到数据，可以保证本线程任", "何时间操纵的都是同一个对象。比如对于Handler，它要获取当前线程的Looper,很显然Looper的作用域就是线程，", "并且不同线程具有不同的Looper。 ThreadLocal本质是操作线程中ThreadLocalMap来实现本地线程变量的存储的", "ThreadLocalMap是采用数组的方式来存储数据，其中key(弱引用)指向当前ThreadLocal对象，value为设的值 通过", "ThreadLocal计算出Hash key，通过这个哈 ThreadLocal对象，value为设的值"], "sub_items": []}, {"id": "5.11", "title": "HandlerThread是什么 & 好处 &原理 & 使用场景", "content_lines": ["HHandlerThread本质上是一个线程类，它继承了Thread； HandlerThread有自己的内部Looper对象，通过", "Looper.loop()进行looper循环；", "通过获取HandlerThread的looper对象传递给Handler对象，然后在handleMessage()方法中执行异步任务；", "优势:", "1.将loop运行在子线程中处理,减轻了主线程的压力,使主线程更流畅,有自己的消息队列,不会干扰UI线程", "劣势:", "我们可以使用HandlerThread处理本地IO读写操作（数据库，文件），因为本地IO操作大多数的耗时属于毫秒级别，", "对于单线程 + 异步队列的形式 不会产生较大的阻塞"], "sub_items": [[2, "串行执行,开启一个线程起到多个线程的作用"], [1, "由于每一个任务队列逐步执行,一旦队列耗时过长,消息延时"], [2, "对于IO等操作,线程等待,不能并发"]]}, {"id": "5.12", "title": "IdleHandler及其使用场景", "content_lines": ["Handler 机制提供的一种，可以在 Looper 事件循环的过程中，当出现空闲的时候，允许我们执行任务的一种机制.", "IdleHandler在looper里面的message处理完了的时候去调用", "怎么使用", "IdleHandler 被定义在 MessageQueue 中，它是一个接口. 定义时需要实现其 queueIdle() 方法。返回值为 true 表", "示是一个持久的 IdleHandler 会重复使用，返回 false 表示是一个一次性的 IdleHandler。", "IdleHandler 被 MessageQueue 管理，对应的提供了 addIdleHandler() 和 removeIdleHandler() 方法。将其存入", "mIdleHandle addIdleHandler() 和 removeIdleHandler() 方法。将其存入 mIdleHandlers 这个 ArrayList 中。", "什么时候掉用", "就在MessageQueue的next方法里面。 MessageQueue 为空，没有 Message； MessageQueue 中最近待处理的", "Message，是一个延迟消息（when>currentTime），需要滞后执行；", "使用场景", "1.Activity启动优化：onCreate，onStart，onResume中耗时较短但非必要的代码可以放到IdleHandler中执行，减", "少启动时间", "2.想要在一个View绘制完成之后添加其他依赖于这个View的View，当然这个用View#post()也能实现，区别就是前者", "会在消息队列空闲时执行", "优化页面的启动,较复杂的view填充 填充里面的数据界面view绘制之前的话，就会出现以上的效果了，view先是白", "的，再出现. app的进程其实是ActivityThread,performResumeActivity先回调onResume ， 之后 执行view绘制的", "measure, layout, draw,也就是说onResume的方法是在绘制之前，在onResume中做一些耗时操作都会影响启动时", "间 把在onResume以及其之前的调用的但非必须的事件（如某些界面View的绘制）挪出来找一个时机（即绘制完成", "以后）去调用即可。"], "sub_items": []}, {"id": "5.13", "title": "消息屏障，同步屏障机制what", "content_lines": ["同步屏障只在Looper死循环获取待处理消息时才会起作用，也就是说同步屏障在MessageQueue.next函数中发挥着", "作用。", "在next()方法中，有一个屏障的概念(message.target ==null为屏障消息), 遇到target为null的Message，说明是同步", "屏障，循环遍历找出一条异步消息，然后处理。 在同步屏障没移除前，只会处理异步消息，处理完所有的异步消息", "后，就会处于堵塞 当出现屏障的时候，会滤过同步消息，而是直接获取其中的异步消息并返回, 就是这样来实现「异", "步消息优先执行」的功能", "how", "1、Handler构造方法中传入async参数，设置为true，使用此Handler添加的Message都是异步的；", "2、创建Message对象时，直接调用setAsynchronous(true) 3.removeSyncBarrier() 移除同步屏障：", "应用", "在 View 更新时，draw、requestLayout、invalidate 等很多地方都调用了ViewRootImpl#scheduleTraversals(", "Android应用框架中为了更快的响应UI刷新事件在ViewRootImpl.scheduleTraversals中使用了同步屏障"], "sub_items": []}, {"id": "5.14", "title": "子线程能不能更新UI", "content_lines": ["刷新UI， 都会调用到ViewRootImpl.Android每次刷新UI的时候，最终根布局ViewRootImpl.checkThread()来检验线", "程是否是View的创建线程。 ViewRootImpl创建的第一个地方，从Acitivity声明周期handleResumeActivity会被优先", "调用到，也就是说在OnResume后ViewRootImpl就被创建，这个时候无法在在子线程中访问UI了，上面子线程延迟", "了一会，handleResumeActivity已经被调用了，所以发生了崩溃 不延迟在creae里直接设置不会崩溃 线程更新UI也", "行，但是只能更新自己创建的View"], "sub_items": []}, {"id": "5.15", "title": "为什么Android系统不建议子线程访问UI", "content_lines": ["在android中子线程可以有好多个，但是如果每个线程都可以对ui进行访问，我们的界面可能就会变得混乱不堪，这", "样多个线程操作同一资源就会造成线程安全问题，当然，需要解决线程安全问题的时候，我们第一想到的可能就是加", "锁，但是加锁会降低运行效率，所以android出于性能的考虑，并没有使用加锁来进行ui操作的控制。"], "sub_items": []}, {"id": "5.16", "title": "Android中为什么主线程不会因为Looper.loop()里的死循环卡死？", "content_lines": ["MessageQueue#next 在没有消息的时候会阻塞，如何恢复？", "他不阻塞的原因是epoll机制，他是linux里面的，在native层会有一个读取端和一个写入端，当有消息发送过来的时", "候会去唤醒读取端，然后进行消息发送与处理，没消息的时候是处于休眠状态，所以他不会阻塞他。"], "sub_items": []}, {"id": "5.17", "title": "Handler消息机制中，一个looper是如何区分多个Handler的当", "content_lines": ["Activity有多个Handler的时候，怎么样区分当前消息由哪个Handler处理处", "理message的时候怎么知道是去哪个callback处理的", "每个Handler会被添加到 Message 的target字段上面，Looper 通过调用 Message.target.handleMessage() 来让", "Handler 处理消息。"], "sub_items": []}, {"id": "5.18", "title": "Looper.quit/quitSafely的区别", "content_lines": ["当我们调用Looper的quit方法时，实际上执行了MessageQueue中的removeAllMessagesLocked方法，该方法的作", "用是把MessageQueue消息池中所有的消息全部清空， 无论是延迟消息（延迟消息是指通过sendMessageDelayed", "或通过postDelayed等方法发送的需要延迟执行的消息）还是非延迟消息。", "当我们调用Looper的quitSafely方法时，实际上执行了MessageQueue中的removeAllFutureMessagesLocked方", "法，通过名字就可以看出，该方法只会清空MessageQueue消息池中所有的延迟消息，并将消息池中所有的非延迟", "消息派发出去让Handler去处理，quitSafely相比于quit方法安全之处在于清空消息之前会派发所有的非延迟消息。"], "sub_items": []}, {"id": "5.19", "title": "通过Handler如何实现线程的切换", "content_lines": ["当在A线程中创建handler的时候，同时创建了MessageQueue与Looper，Looper在A线程中调用loop进入一个无限", "的for循环从MessageQueue中取消息，当B线程调用handler发送一个message的时候，会通过", "msg.target.dispatchMessage(msg);将message插入到handler对应的MessageQueue中，Looper发现有message", "插入到MessageQueue中，便取出message执行相应的逻辑，因为Looper.loop()是在A线程中启动的，所以则回到", "了A线程，达到了从B线程切换到A线程的目的。"], "sub_items": []}, {"id": "5.20", "title": "Handler 如何与 Looper 关联的", "content_lines": ["通过构造方法 mLooper = Looper.myLooper()->sThreadLocal.get()( sThreadLocal.set)"], "sub_items": []}, {"id": "5.21", "title": "Looper 如何与 Thread 关联的", "content_lines": ["Looper 与 Thread 之间是通过 ThreadLocal 关联的，这个可以看 Looper#prepare() 方法 Looper 中有一个", "ThreadLocal 类型的 sThreadLocal静态字段，Looper通过它的 get 和 set 方法来赋值和取值。 由于 ThreadLocal是", "与线程绑定的，所以我们只要把 Looper 与 ThreadLocal 绑定了，那 Looper 和 Thread 也就关联上了"], "sub_items": []}, {"id": "5.22", "title": "Looper.loop()源码", "content_lines": ["for无限循环，阻塞于消息队列的next方法 取出消息后调用msg.target.dispatchMessage(msg)进行消息分发"], "sub_items": []}, {"id": "5.23", "title": "MessageQueue的enqueueMessage()方法如何进行线程同步的", "content_lines": ["就是单链表的插入操作 如果消息队列被阻塞回调用nativeWake去唤醒。 用synchronized代码块去进行同步。"], "sub_items": []}, {"id": "5.24", "title": "MessageQueue的next()方法内部原理", "content_lines": ["next() 是如何处理一般消息的？", "next() 是如何处理同步屏障的？", "next() 是如何处理延迟消息的？", "调用 MessageQueue.next() 方法的时候会调用 Native 层的 nativePollOnce() 方法进行精准时间的阻塞。在 Native", "层，将进入 pullInner() 方法，使用 epoll_wait 阻塞等待以读取管道的通知。如果没有从 Native 层得到消息，那么这", "个方法就不会返回。此时主线程会释放 CPU 资源进入休眠状态。"], "sub_items": []}, {"id": "5.25", "title": "子线程中是否可以用MainLooper去创建Handler，Looper和Handler", "content_lines": ["是否一定处于一个线程", "可以的。 子线程中Handler handler = new Handler(Looper.getMainLooper());，此时两者就不在一个线程中"], "sub_items": []}, {"id": "5.26", "title": "ANR和Handler的联系", "content_lines": ["Handler是线程间通讯的机制，Android中，网络访问、文件处理等耗时操作必须放到子线程中去执行，否则将会造", "成ANR异常。 ANR异常：Application Not Response 应用程序无响应 产生ANR异常的原因：在主线程执行了耗时操", "作，对Activity来说，主线程阻塞5秒将造成ANR异常，对BroadcastReceiver来说，主线程阻塞10秒将会造成ANR异", "常。 解决ANR异常的方法：耗时操作都在子线程中去执行 但是，Android不允许在子线程去修改UI，可我们又有在", "子线程去修改UI的需求，因此需要借助Handler。"], "sub_items": [[6, "View绘制"]]}]}, {"id": "6", "title": "View绘制", "sections": [{"id": "6.1", "title": "View绘制流程", "content_lines": ["触发addView流程：", "performTraversals流程：", "measure、layout、draw流程：", "startActivity->ActivityThread.handleLaunchActivity->onCreate ->完成DecorView和Activity的创建-", ">handleResumeActivity->onResume()->DecorView添加到WindowManager->ViewRootImpl.performTraversals()", "方法，测量（measure）,布局（layout）,绘制（draw）, 从DecorView自上而下遍历整个View树。", "Measure：测量视图宽高。", "单一View:measure() -> onMeasure() -> getDefaultSize() 计算View的宽/高值 -> setMeasuredDimension存储测量", "后的View宽 / 高", "ViewGroup:", "-> measure()", "-> 需要重写onMeasure( ViewGroup没有定义测量的具体过程，因为ViewGroup是一个抽象类，其测量过程的", "onMeasure方法需要各个子类去实现。如：LinearLayout、RelativeLayout、FrameLayout等等，这些控件的特性", "都是不一样的，测量规则自然也都不一样。)遍历测量ViewGroup中所有的View", "-> 根据父容器的MeasureSpec和子View的LayoutParams等信息计算子View的MeasureSpec", "-> 合并所有子View计算出ViewGroup的尺寸", "-> setMeasuredDimension 存储测量后的宽 / 高 从顶层父View向子View的递归调用view.layout方法的过程，即父", "View根据上一步measure子View所得到的布局大小和布局参数，将子View放在合适的位置上。", "Layout：先通过 measure 测量出 ViewGroup 宽高，ViewGroup 再通过 layout 方法根据自身宽高来确定自身位", "置。当 ViewGroup 的位置被确定后，就开始在 onLayout 方法中调用子元素的 layout 方法确定子元素的位置。子元"], "sub_items": []}, {"id": "6.2", "title": "MeasureSpec是什么", "content_lines": ["MeasureSpec表示的是一个32位的整形值，它的高2位表示测量模式SpecMode，低30位表示某种测量模式下的规格", "大小SpecSize。MeasureSpec是View类的一个静态内部类，用来说明应该如何测量这个View。它由三种测量模式，", "如下：", "EXACTLY：精确测量模式，视图宽高指定为match_parent或具体数值时生效，表示父视图已经决定了子视图的精确", "大小，这种模式下View的测量值就是SpecSize的值。", "AT_MOST：最大值测量模式，当视图的宽高指定为wrap_content时生效，此时子视图的尺寸可以是不超过父视图允", "许的最大尺寸的任何尺寸。", "UNSPECIFIED：不指定测量模式, 父视图没有限制子视图的大小，子视图可以是想要的任何尺寸，通常用于系统内", "部，应用开发中很少用到。", "MeasureSpec通过将SpecMode和SpecSize打包成一个int值来避免过多的对象内存分配，为了方便操作，其提供了", "打包和解包的方法，打包方法为makeMeasureSpec，解包方法为getMode和getSize。"], "sub_items": []}, {"id": "6.3", "title": "子View创建MeasureSpec创建规则是什么", "content_lines": ["根据父容器的MeasureSpec和子View的LayoutParams等信息计算子View的MeasureSpec"], "sub_items": []}, {"id": "6.4", "title": "自定义Viewwrap_content不起作用的原因", "content_lines": ["1.因为onMeasure()->getDefaultSize()，当View的测量模式是AT_MOST或EXACTLY时，View的大小都会被设置成子", "View MeasureSpec的specSize。", "public static int getDefaultSize(int size, int measureSpec) {", "switch (specMode) {", "case MeasureSpec.UNSPECIFIED:", "result = size;", "break;", "case MeasureSpec.AT_MOST:", "case MeasureSpec.EXACTLY:", "result = specSize;", "break;", "}", "return result;", "}", "2.View的MeasureSpec值是根据子View的布局参数（LayoutParams）和父容器的Measu学reSpec值计算得来，具体", "计算逻辑封装在getChildMeasureSpec()。 当子View wrap_content或match_parent情况下，子View MeasureSpec", "的specSize被设置成parenSize = 父容器当前剩余空间大小", "3.所以当给一个View/ViewGroup设置宽高为具体数值或者match_parent，它都能正确的显示，但是如果你设置的是", "wrap_content->AT_MOST，则默认显示出来是其父容器的大小。如果你想要它正常的显示为wrap_content，所以需", "要自己重写onMeasure()来自己计算它的宽高度并设置。此时，可以在wrap_content的情况下（对应"], "sub_items": []}, {"id": "6.5", "title": "在Activity中获取某个View的宽高有几种方法", "content_lines": ["Activity/View#onWindowFocusChanged：此时View已经初始化完毕，当Activity的窗口得到焦点和失去焦点时", "均会被调用一次，如果频繁地进行onResume和onPause，那么onWindowFocusChanged也会被频繁地调用。", "view.post(runnable)： 通过post将runnable放入ViewRootImpl的RunQueue中，RunQueue中runnable最后", "的执行时机，是在下一个performTraversals到来的时候，也就是view完成layout之后的第一时间获取宽高。", "ViewTreeObserver#addOnGlobalLayoutListener：当View树的状态发生改变或者View树内部的View的可见性", "发生改变时，onGlobalLayout方法将被回调。", "View.measure(int widthMeasureSpec, int heightMeasureSpec)： match_parent 直接放弃，无法", "measure出具体的宽/高。原因很简单，根据view的measure过程，构造此种MeasureSpec需要知道", "parentSize，即父容器的剩余空间，而这个时候我们无法知道parentSize的大小，所以理论上不可能测量处", "view的大小。", "wrap_content int widthMeasureSpec = View.MeasureSpec.makeMeasureSpec((1<<30)-1,", "View.MeasureSpec.AT_MOST); int heightMeasureSpec = View.MeasureSpec.makeMeasureSpec((1<<30)-1,", "View.MeasureSpec.AT_MOST); v_view1.measure(widthMeasureSpec, heightMeasureSpec);", "注意到(1<<30)-1，我们知道MeasureSpec的前2位为mode，后面30位为size，所以说我们使用最大size值去匹配该", "最大化模式，让view自己去计算需要的大小。 这个特殊的 int 值就是 View 理论上能支持的最大值。 View 的尺寸使", "用 30 位二进制来表示，也就是说最大是 30 个 1（即 2^30 -1），也就是 (1<<30)-1。", "具体的数值(dp/px) 这种模式下，只需要使用具体数值去measure即可，比如宽/高都是100px： int", "widthMeasureSpec = View.MeasureSpec.makeMeasureSpec(100, View.MeasureSpec.EXACTLY);课 int", "heightMeasureSpec = View.MeasureSpec.makeMeasureSpec(100, View.MeasureSpec.EXACTLY);", "v_view1.measure(widthMeasureSpec, heightMeasureSpec);"], "sub_items": []}, {"id": "6.6", "title": "为什么onCreate获取不到View的宽高", "content_lines": ["Activity在执行完oncreate，onResume之后才创建ViewRootImpl,ViewRootImpl进行View的绘制工作", "调用链", "startActivity->ActivityThread.handleLaunchActivity->onCreate ->完成DecorView和Activity的创建-", ">handleResumeActivity->onResume()->DecorView添加到WindowManager->ViewRootImpl.performTraversals()", "方法，测量（measure）,布局（layout）,绘制（draw）, 从DecorView自上而下遍历整个View树。"], "sub_items": []}, {"id": "6.7", "title": "View#post与Handler#post的区别", "content_lines": ["public boolean post(Runnable action) {", "final AttachInfo attachInfo = mAttachInfo;", "if (attachInfo != null) {", "return attachInfo.mHandler.post(action);", "}", "getRunQueue().post(action);", "return true;", "}", "对于View#post当View已经attach到window，直接调用UI线程的Handler发送runnable。如果View还未attach到", "window，将runnable放入ViewRootImpl的RunQueue中，而不是通过MessageQueue。RunQueue的作用类似于", "MessageQueue，只不过这里面的所有runnable最后的执行时机，是在下一个performTraversals到来的时候，也就", "是view完成layout之后的第一时间获取宽高，MessageQueue里的消息处理的则是下一次loop到来的时候。"], "sub_items": []}, {"id": "6.8", "title": "Android绘制和屏幕刷新机制原理", "content_lines": ["绘制原理", "E6%9E%90%EF%BC%88%E4%BA%8C%EF%BC%89%E2%80%94%E2%80%94%20WindowManagerService%E5%", "9B%BE%E5%B1%82%E7%AE%A1%E7%90%86%E4%B9%8B%E7%AA%97%E5%8F%A3%E7%9A%84%E6%B7%BB", "%E5%8A%A0/", "1.在 App 进程中创建PhoneWindow 后会创建ViewRoot。ViewRoot 的创建会创建一个 Surface壳子，请求WMS填", "充Surface，WMS copyFrom() 一个 NativeSurface。", "2.响应客户端事件，创建Layer(FrameBuffer)与客户端的Surface建立连接。", "3.copyFrom()的同时创建匿名共享内存SharedClient（每一个应用和SurfaceFlinger之间都会创建一个", "SharedClient）", "4.当客户端 addView() 或者需要更新 View 时，App 进程的SharedBufferClient 写入数据到共享内存ShareClient", "中,SurfaceFlinger中的 SharedBufferServer 接收到通知会将 FrameBuffer 中的数据传输到屏幕上。", "绘制的过程 CPU准备数据，通过Driver层把数据交给GPU渲染,Display负责消费显示内容", "2.GPU负责Rasterization（栅格化(向量图形的格式表示的图像转换成位图用于显示器)）、渲染,渲染好后放到", "buffer(图像缓冲区)里存起来.", "3.Display（屏幕或显示器）屏幕会以一定的帧率刷新，每次刷新的时候，就会从缓存区将图像数据读取显示出来,如", "果缓存区没有新的数据，就一直用旧的数据，这样屏幕看起来就没有变", "刷新机制（https://juejin.cn/post/6863756420380196877#heading-11）", "双缓存", "屏幕刷新频是固定的,每16.6ms从buffer取数据显示完一帧,理想情况是帧率（GPU 在一秒内绘制操作的帧数，单位", "fps）和刷新频率保持一致，即每绘制完成一帧，显示器显示一帧,但是CPU/GPU写数据是不可控,所以会出现buffer里有些"], "sub_items": [[1, "CPU主要负责Measure、Layout、Record、Execute的数据计算工作"], [1, "drawing with VSync"], [2, "三缓存"], [3, "Choreographer"], [16, "6ms，避免绘制的随机性。控制只在vsync信号来时触发重绘呢"]]}, {"id": "6.9", "title": "Choreography原理", "content_lines": ["绘制是由应用端(任何时候都有可能)发起的，如果屏幕收到vsync信号，但是这一帧的还没有绘制完，就会显示上一", "帧的数据，这并不是因为绘制这一帧的时间过长(超过了信号发送周期)，只是信号快来的时候才开始绘制，如果频繁", "的出现的这种情况。 一般调用requestLayout触发，这个函数随时都能调用，为了只控制在vsync信号来时触发重绘", "引入Choreography。 ViewRoot.doTravle()->mChoreographer.postCallback", "Choreographer对外提供了postCallback等方法，最终他们内部都是通过调用postCallbackDelayedInternal（）实", "现这个方法主要会做两件事情 1存储Action 请求垂直同步，垂直同步 2垂直同步回调立马执行", "Action（CallBack/Runnable）。"], "sub_items": []}, {"id": "6.10", "title": "什么是双缓冲", "content_lines": ["通俗来讲就是有两个缓冲区，一个后台缓冲区和一个前台缓冲区，每次后台缓冲区接受数据，当填充完整后交换给前", "台缓冲，这样就保证了前台缓冲里的数据都是完整的。 Surface 对应了一块屏幕缓冲区，是要显示到屏幕的内容的载", "体。每一个 Window 都对应了一个自己的 Surface 。这里说的 window 包括 Dialog, Activity, Status Bar 等。", "SurfaceFlinger 最终会把这些 Surface 在 z 轴方向上以正确的方式绘制出来（比如 Dialog 在 Activity 之上）。", "SurfaceView 的每个 Surface 都包含两个缓冲区，而其他普通 Window 的对应的 Surface 则不是。"], "sub_items": []}, {"id": "6.11", "title": "为什么使用SurfaceView", "content_lines": ["我们知道View是通过刷新来重绘视图，系统通过发出VSSYNC信号来进行屏幕的重绘，刷新的时间间隔是16ms,如果", "我们可以在16ms以内将绘制工作完成，则没有任何问题，如果我们绘制过程逻辑很复杂，并且我们的界面更新还非", "常频繁，这时候就会造成界面的卡顿，影响用户体验，为此Android提供了SurfaceView来解决这一问题。他们的UI", "不适合在主线程中绘制。对一些游戏画面，或者摄像头，视频播放等，UI都比较复杂，要求能够进行高效的绘制，因", "此，他们的UI不适合在主线程中绘制。这时候就必须要给那些需要复杂而高效的UI视图生成一个独立的绘制表面", "Surface,并且使用独立的线程来绘制这些视图UI。"], "sub_items": []}, {"id": "6.12", "title": "什么是SurfaceView", "content_lines": ["SurfaceView是View的子类，且实现了Parcelable接口且实现了Parcelable接口，其中内嵌了一个专门用于绘制的", "Surface，SurfaceView可以控制这个Surface的格式和尺寸，以及Surface的绘制位置。可以理解为S课urface就是管理", "数据的地方，SurfaceView就是展示数据的地方。使用双缓冲机制，有自己的 surface，在一个独立的线程里绘制。", "SurfaceView虽然具有独立的绘图表面，不过它仍然是宿主窗口的视图结构中的一个结点，因此，它仍然是可以参与", "到宿主窗口的绘制流程中去的。从SurfaceView类的成员函数draw和dispatchDraw的实现学就可以看出，SurfaceView", "在其宿主窗口的绘图表面上面所做的操作就是将自己所占据的区域绘为黑色，除此之外，就没有其它更多的操作了，", "这是因为SurfaceView的UI是要展现在它自己的绘图表面上面的。 优点： 使用双缓冲机制，可以在一个独立的线程", "中进行绘制，不会影响主线程，播放视频时画面更流畅 缺点：Surface不在Vie享w hierachy中，它的显示也不受View", "的属性控制，SurfaceView 不能嵌套使用。在7.0版本之前不能进行平移，缩放等变换，也不能放在其它ViewGroup", "中，在7.0版本之后可以进行平移，缩放等变换。"], "sub_items": []}, {"id": "6.13", "title": "View和SurfaceView的区别", "content_lines": ["View适用于主动更新的情况，而SurfaceView则适用于被动更新的情况，比如频繁刷新界面。 View在主线程中对页", "面进行刷新，而SurfaceView则开启一个子线程来对页面进行刷新。 View在绘图时没有实现双缓冲机制，", "SurfaceView在底层机制中就实现了双缓冲机制。"], "sub_items": []}, {"id": "6.14", "title": "SurfaceView为什么可以直接子线程绘制", "content_lines": ["通常View更新的时候都会调用ViewRootImpl中的performXXX()方法，在该方法中会首先使用checkThread()检查是", "否当前更新位于主线线程，SurfaceView提供了专门用于绘制的Surface，可以通过SurfaceView来控制Surface的格", "式和尺寸，SurfaceView更新就不需要考虑线程的问题，它既可以在子线程更新，也可以在主线程更新。"], "sub_items": []}, {"id": "6.15", "title": "SurfaceView、TextureView、SurfaceTexture、GLSurfaceView", "content_lines": ["SurfaceView：使用双缓冲机制，有自己的 surface，在一个独立的线程里绘制，Android7.0之前不能平移、缩放", "TextureView：它不会在WMS中单独创建窗口，而是作为一个普通View，可以和其它普通View一样进行移动，旋", "转，缩放，动画等变化。值得注意的是TextureView必须在硬件加速的窗口中。", "SurfaceTexture：SurfaceTexture和SurfaceView不同的是，它对图像流的处理并不直接显示，而是转为OpenGL外", "部纹理，因此可用于图像流数据的二次处理（如Camera滤镜，桌面特效等）。 GLSurfaceView：SurfaceView不同", "的是，它加入了EGL的管理，并自带了渲染线程。"], "sub_items": []}, {"id": "6.16", "title": "getWidth()方法和getMeasureWidth()区别", "content_lines": ["①getMeasuredWidth方法获得的值是setMeasuredDimension方法设置的值，它的值在measure方法运行后就会确", "定", "②getWidth方法获得是layout方法中传递的四个参数中的mRight-mLeft，它的值是在layout方法运行后确定的", "③一般情况下在onLayout方法中使用getMeasuredWidth方法，而在除onLayout方法之外的地方用getWidth方法。"], "sub_items": []}, {"id": "6.17", "title": "invalidate() 和 postInvalidate() 方法的区别", "content_lines": ["requestLayout：会触发三大流程。 invalidate：触发 onDraw 流程，在 UI 线程调用。 postInvalidate：触发", "onDraw 流程，在非 UI 线程中调用。", "1. view的invalidate递归调用父view的invalidateChildInParent，直到ViewRootImpl的invalidateChildInParent，", "然后触发peformTraversals，会导致当前view被重绘,由于mLayoutRequested为false，不会导致onMeasure", "和onLayout被调用，而OnDraw会被调用", "2. postInvalidate(),它可以在UI线程调用，也可以在子线程中调用， postInvalidate()方法内部通过Handler发送了", "一个消息将线程切回到UI线程通知重新绘制 。最终还是调用了子View的invalidate()"], "sub_items": []}, {"id": "6.18", "title": "Requestlayout，onlayout，onDraw，DrawChild区别与联系", "content_lines": ["requestLayout()方法 ：会导致调用 measure()过程 和 layout()过程,不一定会触发OnDra学w。 requestLayout会直接", "递归调用父窗口的requestLayout，直到ViewRootImpl,然后触发peformTraversals，由于mLayoutRequested为", "true，会导致onMeasure和onLayout被调用。不一定会触发OnDraw， 将会根据标志位判断是否需要ondraw。", "onLayout()方法(如果该View是ViewGroup对象，需要实现该方法，对每个子视享图进行布局) onDraw()方法：绘制视", "图本身 (每个View都需要重载该方法，ViewGroup不需要实现该方法)。 drawChild()：去重新回调每个子视图的", "draw()方法。"], "sub_items": []}, {"id": "6.19", "title": "LinearLayout、FrameLayout 和 RelativeLayout 哪个效率高", "content_lines": ["简单布局 FrameLayout>LinearLayout>RelativeLayout 复杂布局 RelativeLayout>LinearLayout>FrameLayout", "（1）Fragment是从上到下的一个堆叠的方式布局的，那当然是绘制速度最快，只需要将本身绘制出来即可，但是由", "于它的绘制方式导致在复杂场景中直接是不能使用的，所以工作效率来说Fragment仅使用于单一场景", "（2）RelativeLayout会让子View调用2次onMeasure，LinearLayout 在有weight时，也会调用子View 2次", "onMeasure。 由于RelativeLayout需要在横向和纵向分别进行一次measure过程。而LinearLayout只进行纵向或横", "向的测量，所以measure的时间会比RelativeLayout少很多。但是如果设置了 weight,在测量的过程中，", "LinearLayout会将设置过weight的和没设置的分别测量一次，这样就导致measure两次。 （3）在不影响层级深度的", "情况下,使用LinearLayout和FrameLayout而不是RelativeLayout，复杂布局使用RelativeLayout", "简单布局:在DecorView自己是FrameLayout但是它只有一个子元素是属于LinearLayout。因为DecorView的层级深", "度是已知而且固定的，上面一个标题栏，下面一个内容栏。采用RelativeLayout并不会降低层级深度，所以此时在根", "节点上用LinearLayout是效率最高的。", "复杂布局:RelativeLayout 在性能上更好，使用 LinearLayout 容易产生多层嵌套的布局结构，这在性能上是不好的。", "而 RelativeLayout 通常层级结构都比较扁平，很多使用LinearLayout 的情况都可以用一个 RelativeLayout 来替代，", "以降低布局的嵌套层级，优化性能。"], "sub_items": []}, {"id": "6.20", "title": "LinearLayout的绘制流程", "content_lines": ["onMeasure():1>：把 ViewRootImpl 的测量模式 传递给 DecorView，然后 DecorView 把测量模式 传递给", "LinearLayout，遍历子元素并对每个子元素执行measureChildBeforeLayout方法，这个方法内部会调用子元素的", "measure方法，这样各个子元素就开始依次进入measure过程。 2.LinearLayout类的measureVertical方法会遍历每", "一个子元素并且执行LinearLayout类的measureChildBeforeLayout方法对子元素进行测量，LinearLayout类的", "measureChildBeforeLayout方法内部会执行子元素的measure方法。在代码中，变量mTotalLength会是用来存放", "LinearLayout在竖直方向上的当前高度，每遍历一个子元素，mTotalLength就会增加 onLayout(): onLayout(): 其中", "会遍历调用每个子View的setChildFrame方法为子元素确定对应的位置 其中会遍历调用每个子View的setChildFrame", "方法为子元素确定对应的位置。其中的childTop会逐渐增大，意味着后面的子元素会被放置在靠下的位置。"], "sub_items": []}, {"id": "6.21", "title": "自定义 View 的流程和注意事项", "content_lines": ["大多数自定义View要么是在onDraw方法中画点东西，和在onTouchEvent中处理触摸事件。", "自定义View步骤 ： onMeasure，可以不重写，不重写的话就要在外面指定宽高，建议重写； onDraw，看情况重", "写，如果需要画东西就要重写； onTouchEvent，也是看情况，如果要做能跟手指交互的View，就重写； 自定义", "View注意事项：", "如果有自定义布局属性的，在构造方法中取得属性后应及时调用recycle方法回收资源；", "onDraw和onTouchEvent方法中都应尽量避免创建对象，过多操作可能会造成卡顿；", "自定义ViewGroup步骤：", "onMeasure（必须），在这里测量每一个子View，还有处理自己的尺寸；", "onLayout（必须），在这里对子View进行布局；", "如有自己的触摸事件，需要重写onInterceptTouchEvent或onTouchEvent;", "自定义ViewGroup注意事项：", "如果想在ViewGroup中画点东西，又没有在布局中设置background的话，会画不出来，这学时候需要调用", "setWillNotDraw方法，并设置为false；", "如果有自定义布局属性的，在构造方法中取得属性后应及时调用recycle方法回收资源；", "onDraw和onTouchEvent方法中都应尽量避免创建对象，过多操作可能会造成享卡顿；"], "sub_items": []}, {"id": "6.22", "title": "自定义View如何考虑机型适配", "content_lines": ["合理使用warp_content，match_parent。 尽可能地使用RelativeLayout。", "针对不同的机型，使用不同的布局文件放在对应的目录下，android会自动匹配。", "尽量使用点9图片。", "使用与密度无关的像素单位dp，sp。", "引入android的百分比布局。", "切图的时候切大分辨率的图，应用到布局当中，在小分辨率的手机上也会有很好的显示效果。"], "sub_items": []}, {"id": "6.23", "title": "自定义控件优化方案", "content_lines": ["1.降低View.onDraw（）的复杂度 onDraw不要创建新的局部对象 onDraw不执行耗时操作 2.避免过度绘制", "（Overdraw） 过度绘制 会导致屏幕显示的色块不同， 尽可能避免 过度绘制的粉色 & 红色情况 移除默认的 Window", "背景 @null 若不移除，则导致所有界面都多 1 次绘制 移除 控件中不必要的背景 对于1个ViewPager + 多个", "Fragment 组成的首页界面，若每个 Fragment 都设有背景色，即 ViewPager 则无必要设置，可移除 减少布局文件", "的层级（嵌套） 减少不必要的嵌套 ->> UI层级少 ->> 过度绘制的可能性低 自定义控件View优化：使用 clipRect() 、", "quickReject() 给 Canvas 设置一个裁剪区域，只有在该区域内才会被绘制，区域之外的都不绘制"], "sub_items": []}, {"id": "6.24", "title": "invalidate怎么局部刷新", "content_lines": [], "sub_items": []}, {"id": "6.25", "title": "View加载流程（setContentView）", "content_lines": ["（1）通过xml的Pull方式去解析xml布局文件，获取xml信息，并保存缓存信息.", "（2）根据xml的tag标签通过反射创建View逐层构建View", "（3）递归构建其中的子View，并将子View添加到父ViewGroup中"], "sub_items": [[1, "DecorView初始化"], [2, "通过LayoutInflate对象去加载View，主要步骤是"], [7, "View事件分发"]]}]}, {"id": "7", "title": "View事件分发", "sections": [{"id": "7.1", "title": "View事件分发机制", "content_lines": ["三个角色", "1、Activity：只有分发dispatchTouchEvent和消费onTouchEvent两个方法。 事件由ViewRootImpl中DecorView", "dispatchTouchEvent分发Touch事件->Activity的dispatchTouchEvent()- DecorView。superDispatchTouchEvent->", "ViewGroup的dispatchTouchEvent()。 如果返回false直接掉用onTouchEvent，true表示被消费", "2、ViewGroup：拥有分发、拦截和消费三个方法。：对应一个根ViewGroup来说，点击事件产生后，首先会传递给", "它，dispatchTouchEvent就会被调用，如果这个ViewGroup的onInterceptTouchEvent方法返回true就表示它要拦", "截当前事件， 事件就会交给这个ViewGroup的onTouchEvent处理。如果这个ViewGroup的onInterceptTouchEvent", "方法返回false就表示它不拦截当前事件，这时当前事件就会继续传递给它的子元素，接着子元素的", "dispatchTouchEvent方法就会被调用。", "3、View：只有分发和消费两个方法。方法返回值为true表示当前视图可以处理对应的事件；返回值为false表示当前", "视图不处理这个事件，会被传递给父视图的", "三个核心事件", "1、dispatchTouchEvent()：方法返回值为true表示事件被当前视图消费掉； 返回为false表示 停止往子View传递和", "分发,交给父类的onTouchEvent处理", "2、onInterceptTouchEvent() ： return false 表示不拦截，需要继续传递给子视图。return true 拦截这个事件并交", "由自身的onTouchEvent方法进行消费.", "3、 onTouchEvent() ： return false 是不消费事件，会被传递给父视图的onTouchEvent方法进行处理。return true", "是消费事件。"], "sub_items": []}, {"id": "7.2", "title": "view的onTouchEvent，OnClickListerner和OnTouchListener的", "content_lines": ["onTouch方法 三者优先级", "dispatchTouchEvent->onTouch->onInterceptTouchEvent->onTouchEvent。", "1.dispatchTouchEvent中限制性mOnTouchListener.onTouch() onTouchListener的onTouch方法优先级比", "onTouchEvent高，会先触发。 2.假如onTouch方法返回false会接着触发onTouchEvent，返回true,onTouchEvent", "方法不会被调用。 3.onClick事件是在onTouchEvent的MotionEvent.ACTION_UP事件通过performClick() 触发的。", "OnTouchListener中onTouch方法如果返回true，则不会执行view的onTouchEvent方法，也就更不会执行view的", "onClickListener的onClick方法,返回false，则两个都会执行。"], "sub_items": []}, {"id": "7.3", "title": "onTouch 和onTouchEvent 的区别", "content_lines": ["onTouch方法是View的 OnTouchListener借口中定义的方法。 当一个View绑定了OnTouchLister后，当有touch事", "件触发时，就会调用onTouch方 onTouchEvent 处理点击事件在dispatchTouchEvent中掉用", "onTouchListener的onTouch方法优先级比onTouchEvent高，会先触发。 假如onTouch方法返回false，会接着触发", "onTouchEvent，反之onTouchEvent方法不会被调用。 内置诸如click事件的实现等等都基学于onTouchEvent，假如", "onTouch返回true，这些事件将不会被触发"], "sub_items": []}, {"id": "7.4", "title": "ACTION_CANCEL什么时候触发", "content_lines": ["1.如果在父View中拦截ACTION_UP或ACTION_MOVE，在第一次父视图拦截消息的瞬间，父视图指定子视图不接受", "后续消息了，同时子视图会收到ACTION_CANCEL事件。", "2.如果触摸某个控件，但是又不是在这个控件的区域上抬起（移动到别的地方了），就会出现action_cancel。"], "sub_items": []}, {"id": "7.5", "title": "事件是先到DecorView还是先到Window", "content_lines": ["DecorView -> Activity -> PhoneWindow -> DecorView", "当屏幕被触摸input系统事件从Native层分发Framework层的InputEventReceiver.dispachInputEvent()调用了", "ViewRootImpl.WindowInputEventReceiver.dispachInputEvent()->ViewRootImpl中的", "DecorView.dispachInputEvent()->Activity.dispachInputEvent()->window.superDispatchTouchEvent()-", ">DecorView.superDispatchTouchEvent()->Viewgroup.superDispatchTouchEvent()"], "sub_items": []}, {"id": "7.6", "title": "点击事件被拦截，但是想传到下面的View，如何操作", "content_lines": ["重写子类的requestDisallowInterceptTouchEvent()方法返回true就不会执行父类的onInterceptTouchEvent()， 可", "将点击事件传到下面的View, 剥夺了父view 对除了ACTION_DOWN以外的事件的处理权。"], "sub_items": []}, {"id": "7.7", "title": "如何解决View的事件冲突", "content_lines": ["常见开发中事件冲突的有ScrollView与RecyclerView的滑动冲突、RecyclerView内嵌同时滑动同一方向", "滑动冲突的实现方法：", "外部拦截法：指点击事件都先经过父容器的拦截处理，如果父容器需要此事件就拦截，否则就不拦截。具体方法：需", "要重写父容器的onInterceptTouchEvent方法，在内部做出相应的拦截。 内部拦截法：指父容器不拦截任何事件，而", "将所有的事件都传递给子容器，如果子容器需要此事件就直接消耗，否则就交由父容器进行处理。具体方法：需要配", "合requestDisallowInterceptTouchEvent方法。", "外部拦截法：", "父View在ACTION_MOVE中开始拦截事件，那么后续ACTION_UP也将默认交给父View处理！", "内部拦截法：", "即父View不拦截任何事件，所有事件都传递给子View，子View根据需要决定是自己消费事件还是给父View处理", "如果父容器需要获取点击事件则调用 parent.requestDisallowInterceptTouchEvent(false)方法，让父容器去拦截事", "件"], "sub_items": []}, {"id": "7.8", "title": "在 ViewGroup 中的 onTouchEvent 中消费 ACTION_DOWN 事件，", "content_lines": ["ACTION_UP事件是怎么传递", "一个事件序列只能被一个View拦截且消耗。因为一旦一个元素拦截了此事件，那么同一个事件序列内的所有事件都", "会直接交给它处理（即不会再调用这个View的拦截方法去询问它是否要拦截了，而是把剩余的ACTION_MOVE、", "ACTION_DOWN等事件直接交给它来处理）。", "Activity.dispatchTouchEvent() -> ViewGroup1.dispatchTouchEvent() -> ViewGroup1.onInterceptTouchEvent() ->", "view1.dispatchTouchEvent() -> view1.onTouchEvent() -> ViewGroup1.onTouchEvent()", "-> Activity.dispatchTouchEvent() -> ViewGroup1.dispatchTouchEvent() -> ViewGroup1.onTouchEvent()"], "sub_items": []}, {"id": "7.9", "title": "Activity ViewGroup和View都不消费ACTION_DOWN,那么ACTION_UP", "content_lines": ["事件是怎么传递的", "ACTION_DOWN:-> Activity.dispatchTouchEvent() -> ViewGroup1.dispatchTouchEvent() ->", "ViewGroup1.onInterceptTouchEvent() -> view1.dispatchTouchEvent() -> view1.onTouchEvent() ->", "ViewGroup1.onTouchEvent() -> Activity.onTouchEvent();", "ACTION_MOVE > Activity.dispatchTouchEvent() ->", "Activity.onTouchEvent(); -> 消费"], "sub_items": []}, {"id": "7.10", "title": "同时对父 View 和子 View 设置点击方法，优先响应哪个", "content_lines": ["优先响应子 view， ，如果先响应父 view，那么子 view 将永远无法响应，父 view 要优先响应事件，必须先调用", "onInterceptTouchEvent 对事件进行拦截，那么事件不会再往下传递，直接交给父 view 的 onTouchEvent 处理。"], "sub_items": []}, {"id": "7.11", "title": "requestDisallowInterceptTouchEvent的调用时机", "content_lines": ["事件分发列子"], "sub_items": [[8, "RecycleView"]]}]}, {"id": "8", "title": "RecyclerView", "sections": [{"id": "8.1", "title": "RecyclerView的多级缓存机制,每一级缓存具体作用是什么,分别在什么场", "content_lines": ["景下会用到哪些缓存", "D%98%E6%9C%BA%E5%88%B6%E7%9A%84%E7%90%86%E8%A7%A3/", "Scrap、Cache、ViewCacheExtension 、RecycledViewPool", "Scrap缓存用在RecyclerView布局时，布局完成之后就会清空", "添加到Cache缓存和RecyclerViewPool缓存的item，他们的View必须已经从RecyclerView中detached或removed", "一级缓存：mAttachedScrap 和 mChangedScrap 二级缓存：mCachedViews 三级缓存：ViewCacheExtension 四", "级缓存：RecycledViewPool 然后说怎么用，就是先从 1 级找，然后 2 级...然后4 级，找不到 create ViewHolder。", "mAttachedScrap/mChangedScrap", "屏幕内缓存", "RecyclerView 的滑动场景来说，新卡位的复用以及旧卡位的回收机制， 不会涉及到 mChangedScrap 和", "mAttachedScrap", "notifyItemChanged/rangeChange，此时如果Holder发生了改变那么就放入changeScrap中，反之放入到", "AttachScrap。", "mCachedViews", "当列表滑动出了屏幕时，ViewHolder会被缓存在 mCachedViews ，其大小由mViewCacheMax决定，默认", "DEFAULT_CACHE_SIZE为2，可通过Recyclerview.setItemViewCacheSize()动态设置。", "ViewCacheExtension", "可以自己实现ViewCacheExtension类实现自定义缓存，可通过Recyclerview.setViewCacheExtension()设置。", "缓存池", "ViewHolder在首先会缓存在 mCachedViews 中，当超过了个数（比如默认为2）， 就会添加到 RecycledViewPool"], "sub_items": []}, {"id": "8.2", "title": "RecyclerView的滑动回收复用机制", "content_lines": ["RecyclerView 滑动的场景触发的回收复用机制工作时， 并不需要四级缓存都参与的。", "1.RecyclerView 向下滑动操作的日志，第三行5个卡位的显示都是重新创建的 ViewHolder", "新一行5个卡位和复用不可能会用到刚移出屏幕的5个卡位， 因为先复用再回收，新一行的5个卡位先去目前的", "mCachedViews 和 ViewPool 的缓存中寻找复用，没有就重新创建，然后移出屏幕的那行的5个卡位再回收缓存到", "mCachedViews 和 ViewPool 里面，", "2.RecyclerView 再次向上滑动重新显示第一行的5个卡位时，只有后面3个卡位触发了 onBindViewH课older() 方法，重", "新绑定数据。", "滑动场景下涉及到的回收和复用的结构体是 mCachedViews 和 ViewPool，前者默认大小为2，后者为5。所以，当", "第三行显示出来后，第一行的5个卡位被回收，回收时先缓存在 mCachedViews，满了再移出旧的到 ViewPool 里，", "所有5个卡位有2个缓存在 mCachedViews 里，3个缓存在 ViewPool，所以最新的两个卡位是0、1，会放在", "mCachedViews 里，而2、3、4的卡位则放在 ViewPool 里。", "3.而至于为什么会创建了17个 ViewHolder，那是因为再第四行的卡位要显示出来时，ViewPool 里只有3个缓存，而", "第四行的卡位又用不了 mCachedViews 里的2个缓存，因为这两个缓存的是6、7卡位的 ViewHolder，所以就需要再", "重新创建2个 ViewHodler 来给第四行最后的两个卡位使用。"], "sub_items": []}, {"id": "8.3", "title": "RecyclerView的刷新回收复用机制", "content_lines": ["notifyXxx后会RecyclerView会进行两次布局，一次预布局，一次实际布局，然后执行动画操作", "dispatchLayoutStep1", "查找改变holder，并保存在mChangedScrap中；其他未改变的保存到mAttachedScrap中 （mChangedScrap保存", "的holder信息只有预布局时才会被复用）", "dispatchLayoutStep2", "此步骤会创建一个新的holder并执行绑定数据，充当改变位置的holder，其他位置holder从mAttachedScrap中获取"], "sub_items": []}, {"id": "8.4", "title": "RecyclerView 为什么要预布局", "content_lines": ["why", "这种负责执行动画的View在原布局或新布局中不存在的动画，就是预测动画。", "因为RecyclerView 要执行预测动画。比如有A,B,C三个itemView，其中A和B被加载到屏幕上，这时候删除B后，按照", "最终效果我们会看到C移动到B的位置；因为我们只知道 C 最终的位置，但是不知道 C 的起始位置在哪里(即C还未被", "加载)。", "用户有 A、B、C 三个 item，A，B 刚好显示在屏幕中，这个时候，用户把 B 删除了，那么最终 C 会显示在 B 原来的", "位置", "因为我们只知道 C 最终的位置，但是不知道 C 的起始位置在哪里，无法确定 C 应该从哪里滑动过来。", "在其他 LayoutManager 中，它可能是从侧面或者是其他地方滑动过来的。", "what", "当 Adapter 发生变化的时候，RecyclerView 会让 LayoutManager 进行两次布局。", "第一次，预布局,为动画前的表项先执行一次pre-layout，根据 Adapter 的 notify 信息，我们知道哪些 item 即将变化", "了,将不可见的表项 3 也加载到布局中，形成一张布局快照（1、2、3）。", "第二次，实际布局，也就是变化完成之后的布局同样形成一张布局快照（1、3）。", "这样只要比较前后布局的变化，就能得出应该执行什么动画了，就称为预测动画。"], "sub_items": []}, {"id": "8.5", "title": "ListView 与 RecyclerView区别", "content_lines": ["ListView 的布局比较单一，只有一个纵向效果； RecyclerView 的布局效果丰富， 可以在 LayoutMananger 中设", "置：线性布局（纵向，横向），表格布局，瀑布流布局", "RecyclerView中可以实现局部刷新，例如：notifyItemChanged()；", "如果要在ListView实现局部刷新，依然是可以实现的，当一个item数据刷新时，我们可以在Adapter中，实现一个", "notifyItemChanged()方法，在方法里面通过这个 item 的 position，刷新这个item的数据", "ListView有两级缓存，在屏幕与非屏幕
