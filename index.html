<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记 · Book Notes Index</title>
<style>
  :root {
    --paper: #F2EDE2;
    --paper-warm: #E8E1D2;
    --card: #FBF8F0;
    --ink: #1C1814;
    --ink-muted: #5C5247;
    --ink-faint: #8B8175;
    --rule: #C9BEA8;
    --rule-soft: #DDD4BF;
    --accent: #7A1F2B;
    --accent-hover: #9B3A4A;
    --gold: #B08A4F;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(176, 138, 79, 0.08), transparent 70%);
    color: var(--ink);
    font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.75;
    min-height: 100vh;
    padding: 72px 24px 96px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  /* ── Masthead ─────────────────────────── */
  .masthead {
    text-align: center;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 64px;
    position: relative;
    animation: rise 0.7s ease-out both;
  }

  .masthead::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -4px;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  .eyebrow {
    font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .masthead h1 {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .masthead .subtitle {
    font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    font-size: 13px;
    color: var(--ink-muted);
    letter-spacing: 0.08em;
  }

  /* ── Section ──────────────────────────── */
  .section {
    margin-bottom: 56px;
    animation: rise 0.7s ease-out both;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 24px;
  }

  .section-num {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.1em;
  }

  .section-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .section-rule {
    flex: 1;
    height: 1px;
    background: var(--rule);
    align-self: center;
  }

  /* ── Entry card ───────────────────────── */
  .entries {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .entry {
    background: var(--card);
    border: 1px solid var(--rule-soft);
    border-left: 3px solid var(--accent);
    padding: 20px 24px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    position: relative;
  }

  .entry:hover,
  .entry:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(28, 24, 20, 0.08);
    border-left-color: var(--gold);
    background: #FFFDF7;
    outline: none;
  }

  .entry-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .entry-arrow {
    margin-left: auto;
    font-size: 14px;
    color: var(--ink-faint);
    transition: color 0.22s ease, transform 0.22s ease;
  }

  .entry:hover .entry-arrow,
  .entry:focus-visible .entry-arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  .entry-meta {
    font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 12px;
    letter-spacing: 0.04em;
  }

  /* ── Colophon ─────────────────────────── */
  .colophon {
    margin-top: 80px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
    text-align: center;
    font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", sans-serif;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.18em;
  }

  .colophon .ornament {
    color: var(--gold);
    margin: 0 8px;
  }

  /* ── Motion & responsive ──────────────── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-width: 600px) {
    body { padding: 48px 18px 64px; font-size: 16px; }
    .masthead { margin-bottom: 48px; }
    .masthead h1 { font-size: 32px; }
    .section { margin-bottom: 44px; }
    .section-title { font-size: 20px; }
    .entry { padding: 16px 18px; }
    .entry-title { font-size: 16px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1A1611;
      --paper-warm: #100D09;
      --card: #221C16;
      --ink: #E8DFD0;
      --ink-muted: #A89A87;
      --ink-faint: #6E6457;
      --rule: #3D3329;
      --rule-soft: #2D251D;
      --accent: #D8756B;
      --accent-hover: #E89389;
      --gold: #D4A574;
    }
    body {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(212, 165, 116, 0.06), transparent 70%);
    }
    .entry:hover,
    .entry:focus-visible {
      background: #2A2218;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
  }
</style>
</head>
<body>
  <main class="container">
    <header class="masthead">
      <div class="eyebrow">Index · 索引</div>
      <h1>读书笔记</h1>
      <p class="subtitle">Book Notes &amp; Mind Maps</p>
    </header>

    <section class="section" aria-labelledby="cat-learn">
      <div class="section-head">
        <span class="section-num">01</span>
        <h2 class="section-title" id="cat-learn">学习笔记</h2>
        <span class="section-rule" aria-hidden="true"></span>
      </div>
      <div class="entries">
        <a class="entry" href="learn/如何阅读一本书-知识脑图/如何阅读一本书-知识脑图.html">
          <div class="entry-title">
            如何阅读一本书 · 知识脑图
            <span class="entry-arrow" aria-hidden="true">→</span>
          </div>
          <div class="entry-meta">learn/如何阅读一本书-知识脑图/</div>
        </a>
        <a class="entry" href="learn/如何阅读一本书-知识脑图/如何阅读一本书-思维导图.html">
          <div class="entry-title">
            如何阅读一本书 · 思维导图
            <span class="entry-arrow" aria-hidden="true">→</span>
          </div>
          <div class="entry-meta">learn/如何阅读一本书-知识脑图/</div>
        </a>
      </div>
    </section>

    <footer class="colophon">
      <span class="ornament">❦</span>个人阅读沉淀 · MMXXVI<span class="ornament">❦</span>
    </footer>
  </main>
</body>
</html>
