<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刻意练习 · 知识脑图</title>
<style>
  :root {
    color-scheme: light;
    --paper: #F2F5F3;      /* 冷调雾面纸底 */
    --surface: #FFFFFF;
    --ink: #1D2B29;        /* 墨绿黑 */
    --muted: #5F706C;
    --line: #D8E0DC;
    --jade: #17685A;       /* 青玉绿：练习与生长 */
    --jade-deep: #0F4C41;
    --jade-soft: #E4EFEB;
    --gold: #A87720;       /* 数据高亮：黄金标准 */
    --gold-soft: #F7EFDC;
    --rail-w: 300px;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --kai: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.75;
  }
  a { color: inherit; }

  /* ============ 左侧目录（竖向，可折叠，默认折叠） ============ */
  .rail {
    position: fixed; inset: 0 auto 0 0;
    width: var(--rail-w);
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    z-index: 30;
  }
  .rail-head {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .rail-head .book {
    font-family: var(--kai);
    font-size: 22px; font-weight: 700; letter-spacing: 2px;
  }
  .rail-head .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .rail-tools {
    display: flex; gap: 8px; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .search {
    flex: 1; min-width: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit; font-size: 13px;
    background: var(--paper);
    color: var(--ink);
  }
  .search:focus { outline: 2px solid var(--jade); outline-offset: 1px; background: var(--surface); }
  .tool-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 6px;
    font-size: 12px;
    padding: 6px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tool-btn:hover, .tool-btn:focus-visible { color: var(--jade); border-color: var(--jade); outline: none; }

  .toc { flex: 1; overflow-y: auto; padding: 10px 10px 40px; }
  .toc::-webkit-scrollbar { width: 8px; }
  .toc::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .ch-item { margin: 2px 0; }
  .ch-row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 8px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .ch-row:hover { background: var(--jade-soft); }
  .ch-row:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }
  .ch-row .no {
    flex: none;
    font-family: var(--kai);
    font-size: 12px;
    color: var(--jade);
    background: var(--jade-soft);
    border-radius: 4px;
    padding: 1px 6px;
    min-width: 34px; text-align: center;
  }
  .ch-row .t { font-size: 14px; font-weight: 600; }
  .ch-row .arrow {
    margin-left: auto; flex: none;
    width: 16px; text-align: center;
    color: var(--muted);
    font-size: 11px;
    transition: transform .18s ease;
  }
  .ch-item.open > .ch-row .arrow { transform: rotate(90deg); }
  .ch-item.active > .ch-row { background: var(--jade-soft); }
  .ch-item.active > .ch-row .t { color: var(--jade-deep); }

  /* 子节点：竖向分支线 */
  .ch-kids {
    display: none;
    margin: 2px 0 6px;
    padding-left: 26px;
    position: relative;
  }
  .ch-item.open > .ch-kids { display: block; }
  .ch-kids::before {
    content: ""; position: absolute; left: 20px; top: 2px; bottom: 8px;
    width: 1.5px; background: var(--line); border-radius: 2px;
  }
  .kid-row {
    position: relative;
    display: block;
    padding: 4px 8px 4px 14px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    border-radius: 5px;
    cursor: pointer;
  }
  .kid-row::before {
    content: ""; position: absolute; left: -8px; top: 50%;
    width: 9px; height: 1.5px; background: var(--line);
  }
  .kid-row:hover { color: var(--jade-deep); background: var(--jade-soft); }
  .kid-row:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }
  .kid-row.active { color: var(--jade-deep); font-weight: 600; }
  .kid-row.active::before { background: var(--jade); width: 11px; }
  .kid-row.dim { opacity: .3; }

  /* ============ 主内容 ============ */
  .main { margin-left: var(--rail-w); }

  .hero {
    padding: 72px 48px 46px;
    background: linear-gradient(180deg, #123F37 0%, #17685A 88%);
    color: #F2F6F4;
  }
  .hero .book-title {
    font-family: var(--kai);
    font-size: 46px; font-weight: 700; letter-spacing: 6px;
    margin: 0;
  }
  .hero .book-sub {
    font-family: var(--kai);
    font-size: 19px; letter-spacing: 3px;
    color: #BCD6CE; margin-top: 8px;
  }
  .hero .thesis {
    margin: 26px 0 0;
    max-width: 640px;
    font-family: var(--kai);
    font-size: 17px; line-height: 1.9;
    border-left: 3px solid #3E8A7B;
    padding-left: 16px;
    color: #E8F1EE;
  }
  .hero .meta { margin-top: 26px; font-size: 13px; color: #9DBFB6; }

  .overview {
    max-width: 900px;
    margin: -22px auto 0;
    padding: 0 48px;
    display: flex; gap: 10px; flex-wrap: wrap;
    position: relative; z-index: 2;
  }
  .ov-chip {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13.5px;
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(23,60,52,.07);
  }
  .ov-chip b { color: var(--jade-deep); font-family: var(--kai); letter-spacing: 1px; }

  .content { max-width: 900px; margin: 0 auto; padding: 24px 48px 120px; }

  .chapter { margin-top: 54px; }
  .ch-head { display: flex; align-items: baseline; gap: 16px; border-bottom: 2px solid var(--jade); padding-bottom: 10px; }
  .ch-head .big-no {
    font-family: var(--kai); font-size: 15px; font-weight: 700;
    color: var(--jade);
    background: var(--jade-soft);
    border-radius: 6px; padding: 3px 12px;
    white-space: nowrap;
  }
  .ch-head h2 {
    margin: 0;
    font-family: var(--kai);
    font-size: 28px; font-weight: 700; letter-spacing: 3px;
  }

  /* 小节：知识节点，竖向分支线连接 */
  .nodes { position: relative; padding-left: 22px; margin-top: 8px; }
  .nodes::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 18px;
    width: 2px; background: var(--line); border-radius: 2px;
  }
  .node { position: relative; margin-top: 26px; }
  .node::before {
    content: ""; position: absolute; left: -22px; top: 14px;
    width: 22px; height: 2px; background: var(--line);
  }
  .node::after {
    content: ""; position: absolute; left: -26px; top: 11px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--jade);
    box-shadow: 0 0 0 3px var(--jade-soft);
  }
  .node.flash::after { background: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .node h3 {
    margin: 0 0 8px;
    font-size: 17px; font-weight: 700; color: var(--jade-deep);
    scroll-margin-top: 28px;
  }
  .node ul { margin: 0; padding-left: 20px; }
  .node li { margin: 5px 0; color: #33423F; }
  .node li b { color: var(--jade-deep); }
  .node li .num { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
  .node li.key { color: var(--ink); font-weight: 500; }
  .node li.key::marker { color: var(--gold); }

  mark { background: var(--gold-soft); color: inherit; padding: 0 2px; border-radius: 2px; }
  .no-result { color: var(--muted); font-size: 13px; padding: 10px 8px; display: none; }

  .footer-note {
    margin-top: 70px; padding-top: 18px;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12.5px;
  }

  /* 移动端抽屉 */
  .rail-toggle {
    display: none;
    position: fixed; left: 14px; bottom: 14px; z-index: 40;
    border: none; border-radius: 50%;
    width: 48px; height: 48px;
    background: var(--jade); color: #fff;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(15,76,65,.35);
  }
  .rail-mask { display: none; position: fixed; inset: 0; background: rgba(20,40,36,.4); z-index: 25; }

  @media (max-width: 980px) {
    :root { --rail-w: 280px; }
    .main { margin-left: 0; }
    .hero { padding: 48px 22px 40px; }
    .overview, .content { padding-left: 22px; padding-right: 22px; }
    .rail { transform: translateX(-100%); transition: transform .22s ease; }
    body.rail-open .rail { transform: translateX(0); }
    body.rail-open .rail-mask { display: block; }
    .rail-toggle { display: block; }
    .hero .book-title { font-size: 34px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<!-- ============ 目录导航（竖向 / 可折叠 / 默认折叠） ============ -->
<aside class="rail" id="rail" aria-label="知识脑图目录">
  <div class="rail-head">
    <div class="book">刻意练习</div>
    <div class="sub">如何从新手到大师 · 知识脑图</div>
  </div>
  <div class="rail-tools">
    <input class="search" id="search" type="search" placeholder="搜索知识节点…" aria-label="搜索知识节点">
    <button class="tool-btn" id="btnExpand" title="展开全部章节">展开</button>
    <button class="tool-btn" id="btnCollapse" title="折叠全部章节">折叠</button>
  </div>
  <nav class="toc" id="toc">
    <div class="no-result" id="noResult">没有匹配的节点，换个关键词试试。</div>
  </nav>
</aside>
<div class="rail-mask" id="railMask"></div>
<button class="rail-toggle" id="railToggle" aria-label="打开目录">☰</button>

<main class="main">
  <header class="hero">
    <h1 class="book-title">刻意练习</h1>
    <div class="book-sub">如何从新手到大师</div>
    <p class="thesis">天才不是天生的，而是训练的产物。决定一个人卓越水平的，不是基因，也不是单纯的练习时长，而是"刻意练习"——走出舒适区、带着明确目标、依靠反馈与心理表征不断精进的练习。</p>
    <div class="meta">[美] 安德斯·艾利克森（Anders Ericsson） / 罗伯特·普尔（Robert Pool） 著 · 本脑图依据原书全文整理</div>
  </header>

  <div class="overview" id="overview"></div>

  <div class="content" id="content"></div>
</main>

<script>
/* ================= 知识数据（全书结构，自顶向下） ================= */
const DATA = [
{ no:"推荐序", title:"超越1万小时定律（阳志平）", id:"c0", nodes:[
  { t:"1万小时定律的真相", pts:[
    "格拉德威尔《异类》把\"1万小时定律\"演绎得过火：它并非精确的魔法数字",
    "源头是西蒙与蔡斯 1973 年的<b>\"十年定律\"</b>：国际象棋大师约需 10 年积累 5万~10万个棋局组块",
    "艾利克森 1993 年柏林音乐学院研究：未来独奏家≈<span class='num'>1万</span>小时、优异者≈<span class='num'>8000</span>、音乐教师≈<span class='num'>4000</span>——优秀与卓越确有差别",
    "用<b>沙堆悖论</b>说明：从量变到质变，没有简单的线性模型" ]},
  { t:"刻意练习的本质：长时记忆", pts:[
    "卓越者与普通人的关键区别在<b>长时记忆</b>——像\"SSD 硬盘\"，能在需要时高速调用大量知识资源",
    "长时记忆可以刻意培养，要点有三：<b>赋予意义</b>（精细编码）、<b>提取结构或模式</b>、<b>加快速度增加连接</b>" ]},
  { t:"隐性知识与情境学习", pts:[
    "认知复杂性高的活动（如认知活动）存在大量<b>隐性知识</b>，无法靠书本直授",
    "学习方式应是<b>情境学习</b>、成为\"认知学徒\"：找到学习共同体 → 隐性知识显性化 → 模仿榜样 → 培养多样性" ]},
  { t:"小结", pts:[
    "哈明：<b>\"没有简单的模型通向伟大。\"</b>",
    "刻意练习无法承诺速成，但它给出了成为专家的可复制路径" ]} ]},

{ no:"引言", title:"天才存在吗", id:"c1", nodes:[
  { t:"莫扎特的完美音高", pts:[
    "<b>完美音高</b>：听到声音立刻辨明具体音高，全球每万人仅约<span class='num'>1</span>人，曾被视为天赋",
    "榊原彩子 2014 年实验：<span class='num'>24</span> 个 2~6 岁儿童经数月训练后<b>个个拥有完美音高</b>",
    "莫扎特 4 岁显才华，其父列奥波尔得是小提琴家与作曲家——从他出生起就给予高强度专业训练" ]},
  { t:"\"天才\"是训练的产物", pts:[
    "大脑有极强的适应能力，能够<b>\"重新布线\"</b>以响应训练",
    "即使 6 岁后\"适应潜力\"看似变小，也没有彻底消失",
    "NBA 球星雷·阿伦被认为是天生射手，他自己却说：与队友的差别只是<b>反复练习</b>" ]},
  { t:"本书将告诉我们什么", pts:[
    "学习不是<b>挖掘</b>已有潜力，而是<b>创造</b>原本不存在的潜力",
    "专业特长科学是近年最重要的发现；<b>刻意练习是迄今最有效的学习黄金标准</b>",
    "本书如同登山向导：告诉你最佳路线，路仍需自己攀登" ]} ]},

{ no:"第1章", title:"有目的的练习", id:"c2", nodes:[
  { t:"史蒂夫·法隆的记忆实验", pts:[
    "短时记忆存在局限：约<span class='num'>7</span>个事物（7±2 理论）",
    "实验设计：每周一课，逐步加 1 个数字，每次只求<b>\"比上一次多记 1 个\"</b>",
    "约 200 次练习后，史蒂夫能记住<span class='num'>82</span>个数字，而全世界没有几个人能做到",
    "秘诀：他构建了一种<b>心理检索结构</b>（编码+线索），而非天赋改善" ]},
  { t:"各领域杰出人物都靠大量练习", pts:[
    "马拉松：1908 年世界纪录 <span class='num'>2:55:18</span> → 如今 <span class='num'>2:02:57</span>",
    "跳水：从空翻两周 → 空翻四周半；圆周率背诵纪录突破<span class='num'>7万</span>位",
    "各领域的\"人类极限\"持续被刷新：训练<b>时长与方法</b>都在与时俱进" ]},
  { t:"从有目的的练习讲起", pts:[
    "一般学习模式：达到\"可接受\"水平后动作<b>自动化</b>，此后再练数年也不会进步，甚至退化",
    "<b>天真的练习</b>：只是埋头重复，不设目标、不加思考（\"你只是反复做某件事\"）",
    "反例：富兰克林下了 30 年国际象棋，因从未专门练习，水平始终平庸" ]},
  { t:"有目的的练习的四个特点", pts:[
    "① <b>定义明确的特定目标</b>：整体目标分解、逐个击破，并制订计划",
    "② <b>专注</b>：练习必须全神贯注",
    "③ <b>包含反馈</b>：知道自己做得对不对、哪里错了",
    "④ <b>走出舒适区</b>：停留在舒适区内的练习不会带来进步" ]},
  { t:"遇到瓶颈怎么办", pts:[
    "最常见的障碍不是\"达到极限\"，而是<b>动机不足</b>",
    "换角度：试着<b>做不同的事情，而不是更难的事情</b>（多萝西·迪蕾用节拍器攻克过不去的乐句）",
    "有意义的<b>正面反馈</b>是保持前进的动力之一" ]},
  { t:"有目的的练习还不够", pts:[
    "雷妮花 30 小时记数字失败，史蒂夫成功：差别在于史蒂夫的<b>心理表征/检索结构</b>",
    "达里奥用同样方法也记住<span class='num'>100+</span>个数字 → 方法可以复制",
    "结论：更彻底的答案叫<b>刻意练习</b>——见第4章" ]} ]},

{ no:"第2章", title:"大脑的适应能力", id:"c3", nodes:[
  { t:"伦敦出租车司机", pts:[
    "\"知识\"测试：需记住伦敦约<span class='num'>25万</span>条街道，全球最难考试之一",
    "马圭尔 MRI 研究：资深出租车司机<b>海马体后部显著更大</b>",
    "追踪 79 名受训者 4 年：通过考试者海马体增大、未通过者不变 → <b>训练导致结构改变</b>，而非天生如此" ]},
  { t:"大脑拥有无限适应能力", pts:[
    "俯卧撑世界纪录：<span class='num'>46001</span> 个",
    "盲人用<b>视觉皮层</b>阅读盲文——大脑重新布线、区域功能重组",
    "用三个手指读盲文的人，触觉皮层对应部位异常扩大、重叠",
    "老花眼训练 3 个月：能看清比原来小<span class='num'>60%</span>的文字——是<b>大脑\"去模糊\"</b>，而非眼睛改善" ]},
  { t:"走出舒适区的重要性", pts:[
    "身体偏爱稳定：<b>体内平衡（homeostasis）</b>",
    "被迫走出舒适区 → 身体为重建平衡而改变，能力随之提升",
    "<b>挑战越大、变化越大，但不要太过</b>：过了\"甜蜜点\"反而受伤",
    "神经髓鞘化：髓磷脂使神经信号传导快约<span class='num'>10</span>倍" ]},
  { t:"练习改变大脑结构", pts:[
    "音乐家（陶布 1995）：控制左手手指的大脑区域明显增大",
    "数学家：顶下小叶更发达",
    "三个细节：① <b>折弯幼枝效应</b>——年纪越小，训练对大脑影响越大；② 超常发展有代价——出租车司机其他类型记忆下降；③ <b>停止训练，改变会消失</b>" ]},
  { t:"潜能可以被构筑", pts:[
    "传统学习法不挑战体内平衡，潜能看起来像天生固定的",
    "刻意练习的目标：<b>通过训练构筑新潜能，而非发掘已有潜能</b>" ]} ]},

{ no:"第3章", title:"心理表征", id:"c4", nodes:[
  { t:"偶然的盲棋大师", pts:[
    "阿廖欣 1924 年：26 盘同步盲棋，17 胜 5 平 4 负",

/* ================= 渲染 ================= */
const toc = document.getElementById("toc");
const content = document.getElementById("content");
const noResult = document.getElementById("noResult");
const esc = s => s.replace(/<(?!\/?b>|\/?span|\/?mark)/g, m => m.replace(/</,"&lt;"));

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

/* overview chips */
const ov = document.getElementById("overview");
OVERVIEW.forEach(([b,t])=> ov.appendChild(el(`<div class="ov-chip"><b>${b}</b> · ${t}</div>`)));

/* content panels */
DATA.forEach(ch => {
  const sec = el(`<section class="chapter" id="${ch.id}"></section>`);
  sec.appendChild(el(`<div class="ch-head"><span class="big-no">${ch.no}</span><h2>${ch.title}</h2></div>`));
  const nodes = el(`<div class="nodes"></div>`);
  ch.nodes.forEach((n,i) => {
    const node = el(`<article class="node" id="${ch.id}-n${i}"></article>`);
    node.appendChild(el(`<h3>${n.t}</h3>`));
    const ul = document.createElement("ul");
    n.pts.forEach(p => ul.appendChild(el(`<li>${p}</li>`)));
    node.appendChild(ul);
    nodes.appendChild(node);
  });
  sec.appendChild(nodes);
  content.appendChild(sec);
});
content.appendChild(el(`<div class="footer-note">依据《刻意练习：如何从新手到大师》（安德斯·艾利克森 / 罗伯特·普尔）全书内容整理 · 目录可展开折叠，点击节点可定位正文</div>`));

/* TOC tree —— 默认折叠（子节点隐藏） */
const chItems = [];
DATA.forEach(ch => {
  const item = el(`<div class="ch-item" data-ch="${ch.id}">
      <div class="ch-row" role="button" tabindex="0" aria-expanded="false">
        <span class="no">${ch.no}</span><span class="t">${ch.title}</span><span class="arrow">▶</span>
      </div>
      <div class="ch-kids"></div>
    </div>`);
  const kids = item.querySelector(".ch-kids");
  ch.nodes.forEach((n,i)=> kids.appendChild(el(`<a class="kid-row" role="button" tabindex="0" data-goto="${ch.id}-n${i}">${n.t}</a>`)));
  toc.appendChild(item);
  chItems.push({ item, id: ch.id, text: (ch.no+ch.title+ch.nodes.map(n=>n.t+n.pts.join("")).join("")).toLowerCase(), kids });
});

function setOpen(item, open){
  item.classList.toggle("open", open);
  item.querySelector(".ch-row").setAttribute("aria-expanded", open);
}

/* 交互 */
toc.addEventListener("click", e => {
  const row = e.target.closest(".ch-row");
  if (row) { const it = row.parentElement; setOpen(it, !it.classList.contains("open")); return; }
  const kid = e.target.closest(".kid-row");
  if (kid) { goTo(kid.dataset.goto); if (innerWidth <= 980) document.body.classList.remove("rail-open"); }
});
toc.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target;
  if (t.classList.contains("ch-row")) { e.preventDefault(); const it=t.parentElement; setOpen(it, !it.classList.contains("open")); }
  else if (t.classList.contains("kid-row")) { e.preventDefault(); goTo(t.dataset.goto); }
});
document.getElementById("btnExpand").onclick = () => chItems.forEach(({item}) => setOpen(item,true));
document.getElementById("btnCollapse").onclick = () => { chItems.forEach(({item}) => setOpen(item,false)); clearFlash(); };

/* 定位 + 高亮 */
let flashTimer = null;
function clearFlash(){ document.querySelectorAll(".node.flash").forEach(n=>n.classList.remove("flash")); }
function goTo(id){
  clearFlash();
  const node = document.getElementById(id);
  if (!node) return;
  node.classList.add("flash");
  node.scrollIntoView({ behavior:"smooth", block:"start" });
  clearTimeout(flashTimer);
  flashTimer = setTimeout(clearFlash, 2200);
}

/* 搜索：过滤目录 + 自动展开匹配章节 */
const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  let any = false;
  chItems.forEach(({item, id, text, kids}) => {
    if (!q) { item.style.display=""; setOpen(item,false); kids.querySelectorAll(".kid-row").forEach(k=>k.classList.remove("dim")); return; }
    const hit = text.includes(q);
    item.style.display = hit ? "" : "none";
    if (hit) { any = true; setOpen(item,true);
      kids.querySelectorAll(".kid-row").forEach(k => {
        const n = document.getElementById(k.dataset.goto);
        k.classList.toggle("dim", !(n.textContent.toLowerCase().includes(q)));
      });
    }
  });
  noResult.style.display = any ? "none" : "block";
});

/* 滚动监听：高亮当前章节 */
const spy = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    chItems.forEach(({item, id}) => {
      item.classList.toggle("active", id === en.target.id);
    });
  });
}, { rootMargin: "-10% 0px -75% 0px" });
document.querySelectorAll(".chapter").forEach(s => spy.observe(s));

/* 移动端抽屉 */
document.getElementById("railToggle").onclick = () => document.body.classList.add("rail-open");
document.getElementById("railMask").onclick = () => document.body.classList.remove("rail-open");
</script>
</body>
</html>
