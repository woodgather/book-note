<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习之道 · 精华闪卡（Anki）</title>
<style>
  :root {
    color-scheme: light;
    --paper: #F5F6F4;
    --ink: #1C2530;
    --ink-soft: #4A5563;
    --line: #D9DDD6;
    --card-face: #FFFFFF;
    --card-back: #22304A;
    --card-back-ink: #E8EDF5;
    --accent: #2B4C7E;
    --accent-soft: #E4EAF3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
    line-height: 1.75;
    padding: 40px 24px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- 页头 ---------- */
  header { margin-bottom: 32px; }
  .kicker {
    font-size: 13px; letter-spacing: 0.12em; color: var(--accent);
    margin-bottom: 10px;
  }
  h1 {
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-size: 34px; font-weight: 700; letter-spacing: 0.02em;
  }
  .intro {
    margin-top: 12px; max-width: 46em; color: var(--ink-soft); font-size: 15px;
  }
  .intro b { color: var(--ink); font-weight: 600; }

  /* ---------- 工具条 ---------- */
  .toolbar {
    margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: center;
  }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 999px; padding: 6px 14px; font-size: 13.5px; cursor: pointer;
    font-family: inherit; transition: all .18s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 7px 15px; font-size: 13.5px; cursor: pointer;
    font-family: inherit; transition: all .18s ease;
  }
  .btn:hover { background: var(--ink); color: #fff; }
  .stats {
    width: 100%; margin-top: 6px; font-size: 13px; color: var(--ink-soft);
  }

  /* ---------- 卡片组 ---------- */
  .deck {
    margin-top: 30px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px;
  }
  @media (max-width: 880px) { .deck { grid-template-columns: 1fr; } }

  .card { perspective: 1400px; cursor: pointer; }
  .card-inner {
    display: grid; position: relative;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.35,.15,.25,1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 12px; padding: 26px 28px 22px;
    display: flex; flex-direction: column; min-height: 250px;
  }
  .face-front {
    background: var(--card-face);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(28,37,48,.05);
  }
  .face-back {
    background: var(--card-back); color: var(--card-back-ink);
    transform: rotateY(180deg);
    box-shadow: 0 6px 18px rgba(34,48,74,.25);
  }
  .face-back a { color: #AFC6E8; }

  .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .chap {
    font-size: 12px; color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 4px; white-space: nowrap;
  }
  .face-back .chap { color: #F0D48A; background: rgba(240,212,138,.14); }
  .theme { font-size: 12px; color: var(--ink-soft); }
  .face-back .theme { color: #8FA3C2; }

  .q, .a { flex: 1; }
  .q {
    font-size: 17.5px; font-weight: 600; line-height: 1.65;
    font-family: Georgia, "Songti SC", "SimSun", serif;
  }
  .a { font-size: 14.5px; line-height: 1.85; }
  .a em { font-style: normal; color: #F0D48A; font-weight: 600; }

  .hint {
    margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line);
    font-size: 12px; color: #9AA3AD; display: flex; justify-content: space-between;
  }
  .face-back .hint { border-top-color: rgba(232,237,245,.18); color: #7C8FA9; }

  footer {
    margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .card-inner { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">A MIND FOR NUMBERS · 芭芭拉·奥克利</div>
    <h1>学习之道 · 精华闪卡</h1>
    <p class="intro">基于全书 18 章提炼的 <b>47 张 Anki 精华卡片</b>，按六大主题编排。<b>点击任意卡片即可翻面</b>查看答案；可用主题筛选，或一键全部翻开通读。</p>
    <div class="toolbar" id="toolbar">
      <button class="chip on" data-theme="all">全部主题</button>
      <button class="chip" data-theme="mode">思维模式</button>
      <button class="chip" data-theme="chunk">组块构建</button>
      <button class="chip" data-theme="delay">对抗拖延</button>
      <button class="chip" data-theme="memory">记忆与创造力</button>
      <button class="chip" data-theme="coop">自学与协作</button>
      <button class="chip" data-theme="exam">考试与总结</button>
      <span class="spacer"></span>
      <button class="btn" id="flipAll">全部翻开</button>
      <button class="btn" id="shuffle">打乱顺序</button>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="deck" id="deck"></main>

  <footer>内容整理自《学习之道》（A Mind for Numbers）芭芭拉·奥克利 著，教育无边界字幕组 译，机械工业出版社 2016。卡片仅摘取核心观点，建议配合原书章节回顾。</footer>
</div>

<script>
const THEMES = {
  mode:   "思维模式",
  chunk:  "组块构建",
  delay:  "对抗拖延",
  memory: "记忆与创造力",
  coop:   "自学与协作",
  exam:   "考试与总结"
};

const CARDS = [
// ---------- 思维模式（第1–3章） ----------
{ t:"mode", c:"第1章", q:"作者芭芭拉·奥克利从“数理挂科少女”到工程学教授，这段经历说明了什么？", a:"学习能力并非天生固定——她高中数理不及格，26岁才补三角学，最终拿到系统工程学博士。掌握方法、给自己充裕的练习时间，人人都能重塑自己的大脑和学习能力。" },
{ t:"mode", c:"第1章", q:"为什么说每个人都具备学好数学的天生基础？", a:"每次接球、随节拍舞动、开车绕开路面的坑，我们都在无意识地做复杂心算。人天生拥有数理直觉，缺的只是数理学科独有的“语言”和知识背景。" },
{ t:"mode", c:"第2章", q:"什么是专注模式（focused mode）？", a:"利用理性、连贯、分解的路径直接解决问题的思维模式，与额头正后方的前额叶皮层相关。像手电筒的紧密光柱——穿透力强，但只照亮熟悉的区域，思维容易沿着练习过的老路走。" },
{ t:"mode", c:"第2章", q:"什么是发散模式（diffuse mode）？", a:"放松注意力、任思维漫游时启动的模式。它“弥散”于整个大脑、视野开阔，能把相距甚远的想法连接起来，为新概念和难题提供灵感——但无法进行精确复杂的思考。" },
{ t:"mode", c:"第2章", q:"什么是定式效应（Einstellung）？如何破除？", a:"脑中已有的或最初的想法会阻碍你找到更好的解法——思维小球总在熟悉路径里打转，而真正的答案在“大脑另一边”。破法：放下问题，切换到发散模式，换个视角再回来。" },
{ t:"mode", c:"第2章", q:"学习新章节前，为什么先花一两分钟快速浏览？", a:"先看小节标题、图表、小结和章末问题，能为思维“加力”——预先创造出小小的神经挂钩，之后深度阅读时概念更容易挂靠上去，把握概念更轻松。" },
{ t:"mode", c:"第3章", q:"爱迪生和达利用什么技巧捕捉发散模式的灵感？", a:"手握小球打盹：入睡瞬间球落进盘子把他们惊醒，正好抓住似睡非睡时发散模式留下的思维碎片，乘势寻找新的解决方案。" },
{ t:"mode", c:"第3章", q:"激发发散模式的“3B方法”是什么？", a:"睡觉（bed）、洗澡（bath）、坐公交（bus），三者任一即可。只要放下工作、转移注意力，发散模式就会乘虚而入，高屋建瓴地搜寻方案——独自散步也是许多名作家的万能灵药。" },
{ t:"mode", c:"第3章", q:"工作记忆和长期记忆有什么区别？", a:"工作记忆像同时抛4个球的杂耍演员——容量仅约4个组块，需持续供能维持；长期记忆像幽深广阔的仓库，可容纳数十亿条信息，但包裹埋得太深难寻踪迹，需要定期回访。" },
{ t:"mode", c:"第3章", q:"什么是间隔重复（spaced repetition）？", a:"把重复分散到多天：连续重复几天为一个阶段，阶段间休息一天，多来几轮。一晚重复20次，不如每天重复几次、坚持几周——就像砌砖墙要给泥浆留出干燥时间。" },
{ t:"mode", c:"第3章", q:"睡眠如何促进学习？", a:"睡眠中脑细胞收缩、间隙变大，脑脊液冲走清醒时积攒的毒素；大脑还会排演知识难点、加固神经模型，清除琐碎记忆、增强重要部分。考前通宵会让一切准备付之东流。" },

// ---------- 组块构建（第4、7章） ----------
{ t:"chunk", c:"第4章", q:"什么是组块（chunk）？", a:"根据意义把信息碎片组成的集合——如 p、o、p 组成单词 pop。像把一堆文件压缩成 .zip：一旦形成组块，它只占用工作记忆的一个位置，思路如丝带般流畅，腾出的空间可处理新信息。" },
{ t:"chunk", c:"第4章", q:"构建组块的三个基本步骤是什么？", a:"① 专注——把注意力集中在信息上，一走神“注意力章鱼”的触手就抓不紧；② 理解——领会基本概念，理解力像强力胶把记忆痕迹黏合；③ 练习获取背景——知道何时该用、何时派不上用场，把组块放进宏观图景。" },
{ t:"chunk", c:"第4章", q:"什么是能力错觉？有哪些典型表现？", a:"误以为自己已经学会。典型表现：反复被动重读、满书划重点、瞟一眼答案就说“我懂了”。看着书和答案产生的“理解”并不属于你——概念根本没有被编织进神经回路。" },
{ t:"chunk", c:"第4章", q:"为什么“回想”比重读有效得多？", a:"提取练习（合上书回忆要点）本身会强化神经模型、加深学习并促进组块形成。《科学》期刊的研究显示：相同时间内，练习＋回想的效果远超重复阅读或画概念图。" },
{ t:"chunk", c:"第4章", q:"划重点的正确姿势是什么？", a:"先训练自己找到主要观点，再把标记降到最少——一句话，最多一个自然段；更好的做法是在页边空白写下关键概念。手在动，不等于脑在记。" },
{ t:"chunk", c:"第4章", q:"穿插学习法为什么优于过度学习？", a:"已经掌握还反复练同类题是“过度学习”，浪费时间，还会让人像只会用锤子的学徒——看什么都是钉子。把不同解题技巧的题目混着练，才能学会“何时用哪种方法”，这正是考试真正考的能力。" },
{ t:"chunk", c:"第7章", q:"搭建强大组块的七步法是什么？", a:"① 在纸上全程解一道重难题（不看答案）；② 重做一次，格外注意关键步骤；③ 休息，让发散模式消化；④ 睡前再过一遍；⑤ 第二天再做，刻意练习最难的部分；⑥ 再添一道新题，重复1–5步；⑦ 走路锻炼时在脑中“主动重复”关键步骤。" },
{ t:"chunk", c:"第7章", q:"什么是“测试效应”？", a:"测试本身就是强效的学习经历：它能改造已有知识体系、显著提升记忆，即使成绩不理想或没有反馈也同样有效——因为测试巩固了大脑中相关的神经模型。所以要时常给自己来场小测验。" },
{ t:"chunk", c:"第7章", q:"什么是“知识坍塌”？遇到了该怎么办？", a:"学习中理解突然“倒退”，之前明白的东西变得扑朔迷离。这其实是大脑在重组知识、为构建更坚固的基础推敲材料，是自然的必经阶段——挺过困扰期，知识基础就会迈上一大步。" },

// ---------- 对抗拖延（第5、6、8、9章） ----------
{ t:"delay", c:"第5章", q:"为什么说拖延像“服用微量砒霜”？", a:"一次拖延看似无害，临阵磨枪的小成功甚至让人心存侥幸；但日积月累会打不牢神经基础、蚕食自信，最终泥足深陷。拖延是一点一点服下的毒，等察觉时悔之晚矣。" },
{ t:"delay", c:"第5章", q:"拖延的痛苦到底来自哪里？", a:"来自“预感”本身：想到不喜欢的事就会激活大脑的痛觉中枢，于是逃向更愉快的事。而一旦真正开始做，痛苦就消失了——对任务的恐惧比任务本身消耗更多的时间和能量。" },
{ t:"delay", c:"第6章", q:"习惯的四个组成部分是什么？", a:"① 信号——触发出窍状态的导火索（地点、时间、感受、他人反应、刚发生的事）；② 反应程序——接到信号后的惯性反应；③ 奖励机制——习惯因迅速带来愉悦而延续；④ 信念——“我改不掉”的自我认定反过来支撑着习惯。" },
{ t:"delay", c:"第6章", q:"改掉拖延，哪个环节才真正需要意志力？", a:"只有“改变对信号的反应”这一个压力点需要意志力。其余都可借力：移除诱惑（手机交给家人保管）、制订新计划、给自己新奖励、与抱有“我能行”信念的同伴相处——不要把意志力浪费在硬扛上。" },
{ t:"delay", c:"第6章", q:"番茄工作法怎么用？为什么有效？", a:"25分钟计时、期间屏蔽一切干扰、到点就停下来奖励自己。它有效是因为把关注点从令人痛苦的“结果”（做完作业）转移到轻松跟随的“过程”（专注25分钟）；轻度时间压力还能训练考试时的抗压能力。" },
{ t:"delay", c:"第6章", q:"什么是“心理对照”？", a:"把现在的状态（甚至不堪回首的过去）与期望达成的理想状态做对比，并在工作空间贴上梦想图景提醒自己。这种对比能为发散模式蓄力——你能从眼前的现实出发，改变现实。" },
{ t:"delay", c:"第8章", q:"行动日志怎么用？为什么睡前写第二天的清单？", a:"每周写一次关键任务清单，每晚基于它写出次日5–10项合理任务，完成一项划掉一项。睡前写计划能让潜意识提前“加工”任务；写下来的待办也会从工作记忆的4个入口里释放出来。" },
{ t:"delay", c:"第8章", q:"为什么“最困难的事要最先做”？", a:"清晨是脑力和意志力最充沛的时刻。先啃下最困难、最厌烦的任务，效率最高，也避免它被拖到深夜变成压力源——睁开眼的第一件事就做完它。" },
{ t:"delay", c:"第9章", q:"专家和解题新手最大的差别是什么？", a:"研究显示：数学专家解题前平均先用45秒判断问题背后的基本物理原理，而新手30秒就凭表面表象匆匆动笔，结果常常出错。“驻足与回顾”给了大脑检索组块资料库、把问题与宏观层面联系起来的时间。" },

// ---------- 记忆与创造力（第10–14章） ----------
{ t:"memory", c:"第10章", q:"什么是记忆宫殿法？", a:"回想一个熟悉的空间（自己家、上学的路），把要记的概念变成夸张的形象“存放”在其中的各个位置。它调用大脑天生的视觉空间记忆系统——熟练后能记住四五十项清单中95%以上的内容。" },
{ t:"memory", c:"第10章", q:"为什么视觉图像和助记形象特别有效？", a:"图像与右脑视觉中枢直接相连，画面越滑稽夸张越好记。学习时调动视觉、听觉、触觉等多个脑区，能织出更密的记忆之网，即使在考试压力下也不易遗忘。" },
{ t:"memory", c:"第11章", q:"怎样用比喻或类比理解难懂的概念？", a:"为概念量身打造形象类比：电流像水流、电压像压力、极限像永远差一步撞线的运动员。类比把新概念挂到已有神经结构上——哪怕不完美，也能当脚手架，随理解加深再修改甚至抛弃。" },
{ t:"memory", c:"第11章", q:"记忆卡片（如 Anki）的正确用法是什么？", a:"手写写下问题与答案（手写比打字构建的神经结构更坚实），看着正面回忆背面，想得起就放到一边；隔天再来，记忆加深后逐步拉长间隔——从几天到几个月。忘记的内容会被“代谢吸血鬼”吸走。" },
{ t:"memory", c:"第11章", q:"体育锻炼对学习有什么额外好处？", a:"规律锻炼能实质性提升记忆力和学习能力——促进与记忆相关脑区中新生神经元的形成，并生成新的信号通路。有氧运动和力量训练都有效。" },
{ t:"memory", c:"第12章", q:"为什么工作记忆小反而可能有利于创造力？", a:"工作记忆小的人更难把原有思路“锁死”，大脑其他部分（感觉皮层、梦与创意的源头）更容易向它输入信息，新旧知识更易创意结合。不少象棋精英玩家智商平平，靠多练超越了更高智商的对手。" },
{ t:"memory", c:"第13章", q:"诺奖得主卡哈尔的成长经历说明了什么？", a:"这位曾被锁进牢房的“问题少年”并非天才：记不住、反应慢、措辞不清。他成功的关键是毅力、灵活应变和谦虚认错——“努力可以弥补欠缺的天赋，甚至创造天才”。大脑可以通过改变思维方式被后天塑造。" },
{ t:"memory", c:"第14章", q:"什么是费曼技巧？", a:"用10岁小孩能听懂的语言和简单类比去解释复杂概念，并大声说出来或写下来。有趣的是：理解常常是解释的产物，而非前提——这也是老师“第一次真正理解教材，是在教学生的时候”的原因。" },
{ t:"memory", c:"第14章", q:"什么是迁移（transfer）？", a:"把所学从一个知识背景应用到别处的能力——像学会一门外语后，第二门外语更轻松。围绕抽象概念的组块精髓学数学（而非绑定单一应用场景），才更容易把知识迁移到新领域。" },
{ t:"memory", c:"第14章", q:"爱因斯坦、麦克林托克共同使用的“秘技”是什么？", a:"拟人化与自导自演：爱因斯坦想象自己是光子，并追问第二个光子会看到什么；麦克林托克把染色体当成朋友。给抽象概念赋予生命，能让仅靠公式无法获得的直觉浮现出来。" },

// ---------- 自学与协作（第15、16章） ----------
{ t:"coop", c:"第15章", q:"为什么说自学是一种最深入的学习方式？", a:"研究显示，只有学生主动参与课题、亲手剖析材料，学习效果才最好；以老师为中心会让学习者产生“无助感”，把失败归咎于老师。而且在学习中，毅力往往比智力更重要。" },
{ t:"coop", c:"第16章", q:"中风病人“弗雷德”的案例揭示了什么？", a:"右脑负责质疑现状、从全局“代入现实情境”检查错误；左脑则坚持事物原本的样子、解释并维护自己的结论。一口气做完试卷从不回头检查，等于放弃了使用一部分大脑——“万分肯定没问题”可能正是左脑的过度自信。" },
{ t:"coop", c:"第16章", q:"为什么波尔总在会面前单独找费曼讨论？", a:"因为在几百名杰出物理学家中，只有费曼不被波尔的权威吓倒，敢指出他想法的愚蠢之处。好学习小组需要批判性的伙伴——对事不对人的坦诚批评，比一团和气的“安全环境”更能激发创造力。" },

// ---------- 考试与总结（第17、18章） ----------
{ t:"exam", c:"第17章", q:"什么是“由难入简”考试法？", a:"发卷后先浏览全卷，从看起来最难的题入手；一旦一两分钟没有进展，立刻抽身转做简单题。难题已被装进大脑，发散模式在后台运转——回头再攻难题时思路常已豁然开朗，还能有效防止思维定式。" },
{ t:"exam", c:"第17章", q:"考试焦虑发作时怎么办？", a:"① 换一种解读：把“我好怕这次考试”改成“这次考试让我很兴奋，我要做到最好”；② 腹式深呼吸——手放腹部慢慢吸气让手被顶起，提前几周每天练一两分钟；③ 考前写下焦虑的想法，能释放负面思绪、减少干扰。" },
{ t:"exam", c:"第17章", q:"备考检查清单里如果只能保住一项，是什么？", a:"考前一晚的合理睡眠。睡眠不足时毒素在脑中堆积、破坏神经连接，大脑无法完成正常的思维联结——之前的一切准备都可能因此付之东流。" },
{ t:"exam", c:"第18章", q:"10个好学习法则是什么？", a:"运用回想；自我测试；对问题进行组块；间隔开重复；交替使用不同解题技巧并回顾错题；注意休息；用解释性提问和简单类比；25分钟专注；困难的事最先做；心理对照。" },
{ t:"exam", c:"第18章", q:"10个坏学习法则是什么？", a:"被动重复阅读；满眼重点标记；瞟一眼解法就觉得会了；火烧眉毛才开始学；已会仍反复做同一题型；小组学习变闲聊；做题前不读课本；有疑问却不去求助；时常分心；睡眠不足。" }
];

const deck = document.getElementById("deck");
const stats = document.getElementById("stats");
let currentTheme = "all";
let deckCards = CARDS.slice();
let flipAllOn = false;

function render() {
  deck.innerHTML = "";
  let shown = 0;
  deckCards.forEach((card, i) => {
    if (currentTheme !== "all" && card.t !== currentTheme) return;
    shown++;
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="card-inner">
        <div class="face face-front">
          <div class="meta"><span class="chap">${card.c}</span><span class="theme">${THEMES[card.t]}</span></div>
          <div class="q">${card.q}</div>
          <div class="hint"><span>点击翻面查看答案</span><span>${shown}</span></div>
        </div>
        <div class="face face-back">
          <div class="meta"><span class="chap">答案</span><span class="theme">${card.c} · ${THEMES[card.t]}</span></div>
          <div class="a">${card.a}</div>
          <div class="hint"><span>点击返回问题</span></div>
        </div>
      </div>`;
    if (flipAllOn) el.classList.add("flipped");
    el.addEventListener("click", () => {
      el.classList.toggle("flipped");
      updateStats();
    });
    deck.appendChild(el);
  });
  updateStats();
}

function updateStats() {
  const total = deck.children.length;
  const flipped = deck.querySelectorAll(".card.flipped").length;
  stats.textContent = `共 ${total} 张卡片 · 已翻 ${flipped} 张`;
}

document.getElementById("toolbar").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  chip.classList.add("on");
  currentTheme = chip.dataset.theme;
  render();
});

document.getElementById("flipAll").addEventListener("click", e => {
  flipAllOn = !flipAllOn;
  e.target.textContent = flipAllOn ? "全部收起" : "全部翻开";
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("flipped", flipAllOn));
  updateStats();
});

document.getElementById("shuffle").addEventListener("click", () => {
  for (let i = deckCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deckCards[i], deckCards[j]] = [deckCards[j], deckCards[i]];
  }
  render();
});

render();
</script>
