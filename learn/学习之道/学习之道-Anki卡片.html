<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习之道 · Anki 精华卡片</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f4f1ea;
    background-image: radial-gradient(#e5e0d3 0.8px, transparent 0.8px);
    background-size: 22px 22px;
    color: #2d2a24;
    padding: 40px 28px 80px;
  }
  .container { max-width: 1180px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 34px; }
  .book-badge {
    display: inline-block; background: #2d2a24; color: #f4f1ea;
    font-size: 12px; letter-spacing: 3px; padding: 6px 16px;
    border-radius: 999px; margin-bottom: 16px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: 2px; }
  h1 span { color: #b5541c; }
  .subtitle { margin-top: 10px; color: #6f6a5e; font-size: 15px; line-height: 1.7; }
  .stats { margin-top: 14px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .stat {
    background: #fff; border: 1px solid #e2dccd; border-radius: 10px;
    padding: 8px 18px; font-size: 13px; color: #55503f;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .stat b { color: #b5541c; font-size: 16px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; justify-content: center; align-items: center;
    gap: 10px; flex-wrap: wrap; margin-bottom: 30px;
  }
  .toolbar button {
    border: 1.5px solid #cfc8b6; background: #fff; color: #4a463c;
    padding: 8px 18px; border-radius: 999px; font-size: 13.5px;
    cursor: pointer; transition: all .18s ease; font-family: inherit;
  }
  .toolbar button:hover { border-color: #b5541c; color: #b5541c; }
  .toolbar button.active { background: #2d2a24; color: #f4f1ea; border-color: #2d2a24; }
  .toolbar .flip-all { background: #b5541c; border-color: #b5541c; color: #fff; }
  .toolbar .flip-all:hover { background: #9a4616; color: #fff; }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } body { padding: 24px 14px 60px; } }

  /* ---------- Flip Card ---------- */
  .card-wrap { perspective: 1400px; }
  .card {
    position: relative; width: 100%; min-height: 280px;
    cursor: pointer; transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.4,.1,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 16px; padding: 26px 28px;
    display: flex; flex-direction: column;
    box-shadow: 0 2px 10px rgba(60,50,30,.09), 0 12px 28px rgba(60,50,30,.06);
    overflow: hidden;
  }
  .face::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px;
  }
  .front { background: #fff; }
  .back {
    background: #fdfbf6; transform: rotateY(180deg);
    border: 1.5px solid #e6dfcd;
  }
  .cat-chip {
    align-self: flex-start; font-size: 11.5px; font-weight: 700;
    letter-spacing: 1.5px; padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
    background: #f1ece0; color: #6f6a5e;
  }
  .q-label, .a-label {
    font-size: 11px; letter-spacing: 2.5px; color: #b3ac9a;
    font-weight: 700; margin-bottom: 10px;
  }
  .front h3 {
    font-size: 21px; line-height: 1.55; font-weight: 800; color: #26231d;
    flex: 0 0 auto;
  }
  .front .hint {
    margin-top: auto; font-size: 12px; color: #b9b29e;
    display: flex; align-items: center; gap: 6px;
  }
  .front .hint .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #d8d1bd;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  .back .answer { font-size: 15px; line-height: 1.95; color: #3b382f; }
  .back .answer b { color: #b5541c; }
  .back .answer ul { margin: 6px 0 0 0; padding-left: 1.2em; }
  .back .answer li { margin: 3px 0; line-height: 1.75; }
  .back .tip {
    margin-top: auto; padding-top: 12px; border-top: 1px dashed #ddd5c0;
    font-size: 12.5px; color: #8d8776; line-height: 1.7;
  }
  .back .tip b { color: #6f6a5e; }

  /* category accent colors */
  .c-mode .face::before { background: linear-gradient(90deg,#e8843c,#f2b56b); }
  .c-chunk .face::before { background: linear-gradient(90deg,#3f8f7b,#7cc4ae); }
  .c-illusion .face::before { background: linear-gradient(90deg,#b5541c,#d98e4a); }
  .c-procrast .face::before { background: linear-gradient(90deg,#8a5aa8,#c1a0dc); }
  .c-memory .face::before { background: linear-gradient(90deg,#3a7bbf,#83b6e8); }
  .c-exam .face::before { background: linear-gradient(90deg,#c04a4a,#e79a9a); }
  .c-rules .face::before { background: linear-gradient(90deg,#5d7a3a,#a3c47c); }
  .c-mode .cat-chip { color:#e8843c; } .c-chunk .cat-chip { color:#3f8f7b; }
  .c-illusion .cat-chip { color:#b5541c; } .c-procrast .cat-chip { color:#8a5aa8; }
  .c-memory .cat-chip { color:#3a7bbf; } .c-exam .cat-chip { color:#c04a4a; }
  .c-rules .cat-chip { color:#5d7a3a; }

  .hidden { display: none; }

  footer { text-align: center; margin-top: 46px; color: #9a937e; font-size: 12.5px; line-height: 1.8; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="book-badge">ANKI 精华卡片集</div>
    <h1>学习之道 <span>·</span> 精华 30 卡</h1>
    <div class="subtitle">A Mind for Numbers — 芭芭拉·奥克利<br>基于全书 18 章提炼的核心知识点,点击卡片翻面查看答案</div>
    <div class="stats">
      <div class="stat">共 <b id="total"></b> 张卡片</div>
      <div class="stat">7 大主题分类</div>
      <div class="stat" id="progressStat">已翻看 <b>0</b> 张</div>
    </div>
  </header>

  <div class="toolbar" id="filters">
    <button data-cat="all" class="active">全部</button>
    <button data-cat="c-mode">思维模式</button>
    <button data-cat="c-chunk">组块</button>
    <button data-cat="c-illusion">能力错觉</button>
    <button data-cat="c-procrast">拖延习惯</button>
    <button data-cat="c-memory">记忆</button>
    <button data-cat="c-exam">考试</button>
    <button data-cat="c-rules">法则清单</button>
    <button class="flip-all" id="flipAll">全部翻面</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    内容提炼自《学习之道》(A Mind for Numbers)全书正文 · 适用于 Anki 间隔重复复习<br>
    提示:先回忆,再翻面 —— 这正是本书推荐的"回想"学习法
  </footer>
</div>

let flippedCount = 0;
const grid = document.getElementById("grid");
document.getElementById("total").textContent = cards.length;

cards.forEach((c, i) => {
  const wrap = document.createElement("div");
  wrap.className = "card-wrap " + c.cat;
  wrap.dataset.cat = c.cat;
  wrap.innerHTML = `
    <div class="card">
      <div class="face front">
        <span class="cat-chip">${c.chip}</span>
        <div class="q-label">QUESTION · ${String(i+1).padStart(2,"0")}</div>
        <h3>${c.front}</h3>
        <div class="hint"><span class="dot"></span>点击卡片翻面查看答案</div>
      </div>
      <div class="face back">
        <span class="cat-chip">${c.chip}</span>
        <div class="a-label">ANSWER · ${String(i+1).padStart(2,"0")}</div>
        <div class="answer">${c.back}</div>
        <div class="tip"><b>💡 要点</b> — ${c.tip}</div>
      </div>
    </div>`;
  wrap.querySelector(".card").addEventListener("click", function(){
    this.classList.toggle("flipped");
    if (this.classList.contains("flipped")) { flippedCount++; document.getElementById("progressStat").innerHTML = `已翻看 <b>${flippedCount}</b> 张`; }
  });
  grid.appendChild(wrap);
});

// filters
document.getElementById("filters").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON" || e.target.id === "flipAll") return;
  document.querySelectorAll("#filters button[data-cat]").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  const cat = e.target.dataset.cat;
  document.querySelectorAll(".card-wrap").forEach(w => {
    w.classList.toggle("hidden", cat !== "all" && w.dataset.cat !== cat);
  });
});

// flip all / unflip all
const flipAllBtn = document.getElementById("flipAll");
flipAllBtn.addEventListener("click", () => {
  const visible = [...document.querySelectorAll(".card-wrap:not(.hidden)")].map(w => w.querySelector(".card"));
  const shouldFlip = visible.some(c => !c.classList.contains("flipped"));
  visible.forEach(c => c.classList.toggle("flipped", shouldFlip));
  flipAllBtn.textContent = shouldFlip ? "全部翻回" : "全部翻面";
});
</script>
