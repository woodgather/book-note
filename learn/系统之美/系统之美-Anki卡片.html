<script>
const CARDS = [{"front": "阿克夫认为,管理者面对的问题有什么特点?因此管理者应该做什么?", "back": "管理者遇到的问题通常不是彼此孤立的,而是相互影响、动态变化的,尤其在由一系列复杂系统构成的动态情境之中•因此管理者不能只是解决问题,而应善于管理混乱的局势", "tag": "引言"}, {"front": "“机灵鬼”玩具实验说明了系统理论的哪个核心观点?", "back": "人们往往只注意到外部事件(手的动作),而忽视系统的内在结构•实际上是弹簧自身的结构使它做出弹跳等相应举动•一旦看清结构和行为之间的关系,就能理解系统如何运作、问题为何出现、如何让系统转向预期行为", "tag": "引言"}, {"front": "书中对“系统”的定义是什么?", "back": "系统是一组相互连接的事物,在一定时间内以特定的行为模式相互影响,例如人、细胞、分子等•系统可能受外力触发、驱动、冲击或限制•系统对外力影响的反馈方式就是系统的特征", "tag": "引言"}, {"front": "为什么同一个外部事件,发生在不同系统上会产生迥异的结果?", "back": "因为在很大程度上,系统自身就能产生一系列相关的行为•外部事件只是可能引发某些行为•如机灵鬼原理简单,但换成一个人、一家公司、一座城市或一个经济体,系统自身产生行为的能力就使结果因系统而异", "tag": "引言"}, {"front": "书中用“经济繁荣或衰退不由某个政治领导人左右”等例子说明什么?", "back": "说明行为源于系统内在结构,而非外部事件或个人•经济上下波动是市场经济内在的结构•市场份额丧失至少部分归因于公司自身的业务政策•油价上涨也与进口国脆弱的石油依赖有关•是否患流感取决于自身身体状况是否适合病毒生长", "tag": "引言"}, {"front": "书中如何看待“吸毒上瘾是因为吸毒者软弱”这种说法?", "back": "不对•不管多么坚强或有多少人关爱,没有任何人可以治愈毒瘾,连上瘾者自己也不能•只有理解上瘾是更大的社会性问题的一部分,会受其他多个因素相互影响,人们才能开始应对这一问题", "tag": "引言"}, {"front": "作者说上述系统观点让人“心神不宁”或“是常识”,对应哪两种截然不同的做法?", "back": "一种是顺应系统,另一种是与其对抗•它们源自人们不同的生活体验•这些论述对一些人是心神不宁,对另一些人则是纯粹常识", "tag": "引言"}, {"front": "为什么说人类在接受现代理性分析教育之前,早已擅长与复杂系统打交道?", "back": "人体自身就是典型的复杂系统——由各器官组成的整体,器官间相互连接、协调运作、自我调节和成长•每个组织、动物、花园、树木、森林都是复杂系统•人们凭直觉建立了系统如何运作、如何和谐相处的认知,无须分析,往往不需要语言表述", "tag": "引言"}, {"front": "作者对现代系统理论的术语化倾向持什么态度?", "back": "现代系统理论常和计算机、方程式联系,搞出高深莫测的术语行话•但“大道至简”,系统理论表达的真理常是为人所共知的常识•完全可以摒弃繁杂术语,直接回归传统智慧", "tag": "引言"}, {"front": "“一针不补,十针难缝”“千里之堤,溃于蚁穴”对应系统的什么特性?", "back": "复杂系统中存在反馈延迟•经过一段时间之后,问题会变得更加严重,而且更加难以解决•因此要及早修补,勿以问题小而拖延", "tag": "引言"}, {"front": "“盖有者,将予之;无者,并其所有亦夺之”对应系统的什么原理?", "back": "竞争排斥原理•如果一个增强回路使一位参与者取得胜利、占据竞争优势,它将在未来竞争中继续获胜,甚至消灭几乎所有竞争者•即“富者愈富,贫者愈贫”", "tag": "引言"}, {"front": "“不要把所有的鸡蛋都放到同一个篮子里”对应系统的什么性质?", "back": "在受到外力冲击或影响时,通路和冗余众多的多样化系统,往往比几乎没有差异的单一化系统表现得更加稳健•多样化带来稳健性", "tag": "引言"}, {"front": "什么是“归罪于外”的思维习惯?它带来了什么问题?", "back": "工业革命以来西方主流思维演变为科学、逻辑及还原论•我们倾向于认为问题原因在“那儿(外部)”而非“在这儿(内在)”•这几乎不可避免地让人责备怪罪他人、推脱责任,迷恋于寻找摆脱问题的“控制按钮”、药丸、产品或技术支持", "tag": "引言"}, {"front": "为什么专注于外部因素的“解决方案”有时会激化问题?", "back": "专注外部因素确实解决过一些严重问题,如预防天花、增加农作物产量、大件货物运输•但这些问题都是更大系统中不可分割的一部分•因此一些“解决方案”产生了明显的副作用,并进一步激化了问题", "tag": "引言"}, {"front": "为什么饥荒、贫困、环境退化、经济波动、失业等顽疾难以根除?", "back": "尽管人们做出大量努力、改进分析方法、取得技术进步,也没人故意制造这些问题,但它们依然存在•因为它们本质上是系统性问题——系统的内在结构决定了我们所不愿看到的行为特征•只有认识到系统自身恰恰是问题根源,重塑系统结构,才能真正解决", "tag": "引言"}, {"front": "为什么作者说讨论系统问题时“图表胜于文字”?必须只靠文字会产生什么问题?", "back": "字、词、句子必须以线性方式按逻辑顺序一个个蹦出来;而系统是一个整体,同时发生和并存,不只是单向线性关系,而是同时存在多个方向上的多种连接•图表一眼可见全部构成部分及其相互连接,因此需要一种“新语言”来完整呈现系统特性", "tag": "引言"}, {"front": "什么是“系统基模”?作者为什么最终称之为“系统的陷阱与对策”?", "back": "系统思考研究者将常见的、会引发特定行为的系统结构称为系统基模,如公地悲剧、目标侵蚀、政策阻力、上瘾•这些基本模型既是顽固、棘手、潜在危害极大的问题的根源,也是实现有效行为改变的“杠杆点”•懂得系统原理就能在恰当地方施加干预,获得期望转变", "tag": "引言"}, {"front": "书中列举了系统的哪些“怪异”表现?(为什么善意行动加总得到差结果等)", "back": "每个要素都忠实、理性地运作,善意行动加起来却经常得到很差的结果•系统整体发展变化的速度快于或慢于每个成员的想象•过去一直奏效的做法现在突然失效•系统会毫无征兆地呈现从未见过的行为", "tag": "引言"}, {"front": "作者认为系统思考与还原论是什么关系?", "back": "作者不认为系统思考的观察方式比还原主义更优秀,认为二者互补、相互借鉴•如同用眼睛、显微镜或望远镜观察不同事物•系统理论是人类观察世界的一个透镜,不同透镜看到不同且真实的景象•观察方式越多,面对复杂混乱局面效果越好", "tag": "引言"}, {"front": "“盲人摸象”寓言揭示了系统思考的哪个核心真理?", "back": "每个盲人都真切感知到大象的一部分,但理解都是片面的•启示:不能只通过了解系统的各个构成部分来认识系统整体的行为", "tag": "引言"}, {"front": "《系统之美》中,系统的定义是什么?系统包括哪三种构成要件?", "back": "系统是由一组相互连接的要素构成的、能够实现某个目标的整体。• 三要件:要素、连接、功能或目标。例如消化系统的要素是牙齿、酶、胃、肠,连接是血液流动和化学反应,功能是把食物转化为营养成分并输送入血流。", "tag": "第1章 系统之基础"}, {"front": "如何理解\"总体大于部分之和\"这句话?", "back": "系统不是事物的简单集合。• 只知道各个\"一\"还不够,还必须理解两个\"一\"之间的关系。• 系统具有整体性,部分整合在一起产生的影响不同于各部分单独作用的影响之和。• 系统有适应性、动态性、目的性,可自组织、自我保护与演进。", "tag": "第1章 系统之基础"}, {"front": "判断你观察的对象是不是一个系统,可以用哪几个问题来检验?", "back": "①你能识别出各个部分吗?• ②这些部分相互之间有联系吗?• ③部分单独作用的影响与整合在一起的影响有所不同吗?• ④这些影响和长期行为在各种环境中都固定不变吗?", "tag": "第1章 系统之基础"}, {"front": "为什么说\"随机散落在路上的一堆沙子\"不是系统?", "back": "因为沙粒之间没有任何稳定的内在连接,也没有特定的功能。• 你可以任意添加或取走一些沙子,它们仍旧只是一堆沙子。• 没有内在连接或功能的随机组合体不是系统。", "tag": "第1章 系统之基础"}, {"front": "系统的三类构成要件中,改变哪一个对系统的影响最小?为什么?", "back": "改变要素对系统的影响通常最小。• 只要不触动内在连接和总目标,即使替换掉所有要素,系统也基本保持不变(如换掉球队所有球员,它仍是一支球队)。• 但若某要素的改变能导致连接或目标的改变(如换国家最高领导人),影响也可能很大。", "tag": "第1章 系统之基础"}, {"front": "为什么说改变系统的\"内在连接\"会让系统发生巨大变化?试举例。", "back": "内在连接是把要素整合在一起的关系。• 改变球队成员间的配合关系,还是那些球员,球队可能耳目一新;• 改变比赛规则会看到全新的比赛;• 大学里若改成学生给教授打分,那就不再是大学了。", "tag": "第1章 系统之基础"}, {"front": "系统的功能或目标有什么特点?如何推断一个系统的目标?", "back": "功能或目标是系统中最不明显的部分,却常常是系统行为最关键的决定因素。• 最好的方法是仔细观察系统一段时间的行为,而不是只听其言辞或标榜的目标。• 如政府宣称保护环境却投入很少,其实际目标就并非保护环境。", "tag": "第1章 系统之基础"}, {"front": "\"功能\"与\"目标\"两个词在用法上有什么区别?几乎每个系统都有的一个重要目标是什么?", "back": "\"功能\"一词常用于非人类系统,\"目标\"一词则用于人类系统,但区分并不绝对。• 几乎每一个系统都有一个重要目标:确保自我永存。• 系统的目标不一定符合人们的初衷或系统中某个个体的意愿。", "tag": "第1章 系统之基础"}, {"front": "系统中各要素的目标不一致会带来什么后果?成功的系统应做到什么?", "back": "各要素的目标都会或多或少影响系统整体行为,结果可能事与愿违、谁都不满意(如社会系统中各角色意愿汇总造成吸毒和犯罪蔓延)。• 一个成功的系统,应该能够实现个体目标和系统总目标的一致性。", "tag": "第1章 系统之基础"}, {"front": "系统中的连接有哪些类型?它们如何运作?", "back": "有些连接是实实在在的物质流(如树干中的水分、学生在大学中的改变);• 更多的是信息流,即系统中影响决策和行动的各种信号。• 信息使系统整合在一起,并对系统的运作产生重要影响。", "tag": "第1章 系统之基础"}, {"front": "为什么研究系统的要素比研究其内在连接简单?罗列所有要素会遇到什么困难?", "back": "要素多数是可见、有形的事物,较容易发现;而连接(尤其是信息流)和目标很难被察觉。• 要素可以不断分解为子要素、子子要素,想罗列出所有要素几乎不可能,会\"见树不见林\"。• 因此应从细究要素转向探寻系统内在的连接关系。", "tag": "第1章 系统之基础"}, {"front": "什么是存量(stock)?它一定是物质的吗?请举例。", "back": "存量是所有系统的基础,指在任何时刻都能观察、感知、计数和测量的系统要素,是储存量、数量或物料、信息在一段时间内的积累量。• 如浴缸中的水、人口数量、书店的书、银行里的钱。• 不一定是物质的:你的自信、朋友圈中的良好口碑、对世界的美好希冀都可以是存量。", "tag": "第1章 系统之基础"}, {"front": "什么是流量(flow)?请举出存量与流量对应的例子。", "back": "流量是一段时间内改变存量的状况,即流入量与流出量。• 如浴缸注入或流出的水量、出生或死亡的人数、买入或卖出、存入或取出。• 森林木料蓄积是存量,流入量是树木生长,流出量包括自然死亡和砍伐。", "tag": "第1章 系统之基础"}, {"front": "\"存量是对系统中变化量的一种历史记录\"如何理解?", "back": "存量的水平是流入量和流出量长期累积(历史作用)的结果。• 它记录了过去所有流入与流出的净效果,• 因此从存量可以读出系统的历史,如大气中累积的污染物是数十年人类活动的记录。", "tag": "第1章 系统之基础"}, {"front": "关于存量的水平与流入量、流出量,有哪三条重要原则?", "back": "①只要流入量总和超过流出量总和,存量水平就会上升;• ②只要流出量总和超过流入量总和,存量水平就会下降;• ③二者相等时,存量水平保持不变,系统处于动态平衡(dynamic equilibrium)状态。", "tag": "第1章 系统之基础"}, {"front": "如何使存量增加?以浴缸和公司为例说明。", "back": "既可以通过提高流入速率,也可以通过降低流出速率。• 灌满浴缸不是只有一种方式。• 公司可通过招聘更多人扩大规模,也可降低离职率;• 石油经济可加大勘探找新油田,也可提高能效、减少消耗,效果一样,但获利者不同。", "tag": "第1章 系统之基础"}, {"front": "人们观察存量与流量时,普遍的认知偏差是什么?", "back": "人类大脑更容易关注存量而不是流量;• 关注流量时,更容易关注流入量而不是流出量。• 因此人们容易忽视:要灌满浴缸,不能只提高流入速率,还需降低流出速率(如只想到发现新油田,想不到减少消耗)。", "tag": "第1章 系统之基础"}, {"front": "为什么说\"存量的变化需要时间\"是理解系统行为的一把钥匙?", "back": "流量可以突然调整,但存量只能逐步增加或释放。• 因为存量变化缓慢,它可能表现为延迟、欠货、缓存、压舱物以及系统动量的源泉。• 人们经常低估存量的内在动量,如人口、森林蓄积、基础设施、依赖石油的经济体都不可能迅速改变。", "tag": "第1章 系统之基础"}, {"front": "存量变化缓慢所造成的时间延迟,对系统有什么好处和坏处?", "back": "坏处:可能导致一些问题(如污染物清除需数十年甚至数百年)。• 好处:它是系统稳定性的根源,让人们有余地去调整、尝试做法,并根据反馈修订不奏效的政策。• 认知正确就不会\"拔苗助长\",也不会过早放弃。", "tag": "第1章 系统之基础"}, {"front": "存量在系统中一个更重要的原则是什么?没有它,很多事情为何难以想象?", "back": "由于存量的存在,流入量和流出量可以相互分离、相互独立,并在一定时期内暂时失衡。• 否则炼油厂生产汽油的速度必须与全社会消费速度完全一致,几乎不可能。• 正是油罐、库存等存量,使生活保持确定性、连续性和可预测性。", "tag": "第1章 系统之基础"}, {"front": "人类发明了哪些\"存量维持机制\"来使流入量和流出量相互独立?", "back": "①水库:使居民和农民不必担心江河来水波动导致旱涝不均;• ②银行:使你花钱的速度不必等于赚钱的速度;• ③供应链各环节的库存:使生产不受需求波动影响,消费者也能及时买到商品。", "tag": "第1章 系统之基础"}, {"front": "存量水平的变化如何引发决策与行动?为什么说世界可以被视为\"反馈过程\"的组合?", "back": "人们不断监控存量的变化,根据其状况和特定规则制定决策、采取行动,使存量保持在可接受范围内(如库存过高就降价促销;食物储量不足就去采购)。• 这些决策累加起来对相关系统造成复杂影响。• 因此世界可视为各种存量的组合,围绕存量存在各种调节机制(即流量),也就是各种反馈过程。", "tag": "第1章 系统之基础"}, {"front": "什么是反馈回路(feedback loop)?请给出书中的定义。", "back": "反馈回路是一条闭合的因果关系链:从某一存量出发,根据存量当时的状况,经过一系列决策、规则、物理法则或行动,影响到与存量相关的流量,继而又反过来改变了存量。• 如复利:账户余额影响利息,利息又使余额增加。", "tag": "第1章 系统之基础"}, {"front": "发现反馈回路存在的首要线索是什么?什么情况下系统中不存在反馈回路?", "back": "长期保持一致的行为模式是反馈回路存在的首要线索——如果存量被维持在特定范围内或持续增长/下降,就一定存在起作用的控制机制。• 并非所有系统都有反馈回路:一些简单的、两端开放的存量-流量链条,其存量水平并不影响流量。", "tag": "第1章 系统之基础"}, {"front": "什么是调节回路(balancing loop)?它使系统行为呈现什么特征?图中如何标注?", "back": "调节回路是使存量水平保持稳定、趋向一个目标进行调节或校正的反馈回路,图中标注字母\"B\"。• 面对各种变化,它会采取措施消除影响,使存量保持在目标值或可接受范围内。• 系统行为因此表现出\"寻的\"或\"动态平衡\"的特征。", "tag": "第1章 系统之基础"}, {"front": "以一杯热咖啡冷却为例,说明调节回路的行为特征。", "back": "咖啡冷却速度取决于咖啡温度与室温的差距:差距越大凉得越快。• 不管存量初始值怎样、高于或低于目标,调节回路都会将其引导至目标状态。• 一开始变化很快,后来逐渐趋缓,直到差距消失——这就是\"自动寻的\"行为。类似:放射性衰变、导弹制导、血糖调节。", "tag": "第1章 系统之基础"}, {"front": "为什么说调节回路既是稳定性的根源,又是抵制变革的根源?", "back": "调节回路保持平衡或达到特定目标,面对变化总会把存量拉回预期状态,这既带来稳定,也使系统抵制变革。• 注意:反馈机制存在不等于能很好起作用——信息可能太晚、不清晰或不完整,行动可能太弱、太滞后、受资源限制或无效。", "tag": "第1章 系统之基础"}, {"front": "什么是增强回路(reinforcing loop)?它对系统行为有什么影响?", "back": "增强回路是不断放大、增强原有发展态势、自我复制的反馈回路,图中标注字母\"R\"。• 存量越大,流入量越多,存量进一步更大,反之亦然。• 它是良性或恶性循环,会强化系统原有的变化态势,导致指数级增长或加速崩溃。", "tag": "第1章 系统之基础"}, {"front": "请举出书中至少四个增强回路(恶性循环或良性循环)的例子。", "back": "①小孩子打架:一拳引发一脚,冲突不断升级;• ②工资-物价螺旋:物价高→涨工资→成本高→物价更高;• ③野兔繁殖:兔越多→兔妈妈越多→兔宝宝越多;• ④土壤流失与植被稀少互相强化;• ⑤练琴越多技术越好、越爱练;• ⑥复利存款。", "tag": "第1章 系统之基础"}, {"front": "增强回路下的增长是什么曲线?它一定是好事吗?", "back": "是指数曲线(exponential growth),不是线性增长:余额越大,增加得越多。• 好坏取决于什么在增长:存款利息增长是好消息,高利贷利息、艾滋感染人数、害虫、军备增长就是坏消息。• 当存量具有自我强化或复制能力时,就能找到推动增长的增强回路。", "tag": "第1章 系统之基础"}, {"front": "指数级增长的速算诀窍:存量翻倍所需时间如何估算?举例说明。", "back": "翻倍时间约等于70除以增长率(以百分数表示)。• 例:年利率7%,70/7=10,约10年翻一倍;• 年利率5%,则需要14年翻倍。", "tag": "第1章 系统之基础"}, {"front": "为什么说\"资本再投资\"是任何经济体系增长的核心引擎?请用增强回路描述。", "back": "工厂和机器设备(资本)越多→产出的产品和服务越多→销售后赚的钱越多→能投资建设更多工厂和设备。• \"做得越大,赚得越多,就能做得更大\"——这是一个增强回路。", "tag": "第1章 系统之基础"}, {"front": "现实系统中的反馈回路是单一的吗?这对系统行为意味着什么?", "back": "不是。同一系统中存在很多不同类型的反馈回路,以异常复杂的方式相互联系。• 单一存量可能同时受多个增强回路和调节回路影响,力度不同、方向迥异。• 因此复杂系统的行为复杂多变、难以预测和驾驭,绝不只是保持稳定、趋向目标、指数增长或加速衰败这样简单。", "tag": "第1章 系统之基础"}, {"front": "系统思考者的\"危险处境\"是什么?看到一个因果关系后应追问什么?", "back": "一旦你发现反馈回路无处不在,就已成系统思考者。• 不只看到A如何影响B,还要探究B是否以某种方式影响A,以及A是否会增强它自身或相反。• 如听到\"人口增长导致贫困\",也应问:贫穷是否会导致人口增长?由此你看到的世界由静态变为动态,开始探寻\"系统究竟是怎样的\"。", "tag": "第1章 系统之基础"}, {"front": "阅读行为模式图时应关注什么?横轴代表什么?", "back": "行为模式图展示系统行为随时间变化的趋势或模式,帮助我们关注趋势而非个别事件,判断系统是否趋向某个目标或极限,以及变化速度。• 应重点关注变化模式——线条的形状和方向,具体数字并不重要。• 横轴是时间轴,促使你关注研究问题的时间范围。", "tag": "第1章 系统之基础"}, {"front": "第2章用哪种日常设备作为'一个存量、两个相互制衡的调节回路'系统的典型例子?这两个回路分别是什么?", "back": "居室温度调节器(thermostat)系统。•回路一:火炉制热,目标是把室温推向设定温度;•回路二:热量向室外散失,目标是使室内外温度一致。两回路方向相反、同时作用于'室温'这一个存量。", "tag": "第2章 系统大观园"}, {"front": "在温度调节器系统中,若两个回路同时运作,为什么均衡室温会略低于设定值(如18℃)?", "back": "因为热量持续向室外散失,火炉即使持续加热,补充的热量与流出的热量只在低于设定值处达到均衡。•要维持18℃就必须把设定温度定得略高于期望值,以补偿散失。•保温好的房间比保温差但配大火炉的房间更舒适。", "tag": "第2章 系统大观园"}, {"front": "'由反馈回路传递的信息能立即修正系统当前的行为吗?'书中由此得出的系统基本原则是什么?", "back": "不能。•反馈信息只能影响未来的行为,不能立即改变系统当前的行为,因为信息经反馈回路传递需要时间。•决策只能影响未来;延迟长短取决于具体系统情境(浴缸很短,经济系统很长)。", "tag": "第2章 系统大观园"}, {"front": "在一个由存量维持的调节回路中设定目标时应注意什么(书中原则)?", "back": "必须适当考虑补偿对存量有重要影响的流入和流出过程,否则反馈过程将超出或低于存量的目标值。•例如:想室温18℃要设得略高;想还清信用卡欠款要考虑利息和开支;想增加员工要考虑招聘期间的离职。", "tag": "第2章 系统大观园"}, {"front": "书中用什么比喻说明'目标因存在流出而难以达成'?同结构系统还有哪些例子?", "back": "像往一个底下有漏洞的水桶里装水,一切尝试都是徒劳;水越多水压越大,漏得越快。•同结构例子:商店库存维持特定水平、公司保持现金收支平衡、水库保持蓄水量、化工厂保持反应装置中的药品浓度。", "tag": "第2章 系统大观园"}, {"front": "什么是反馈回路的'主导地位'(dominance)?在温度调节器系统中如何体现?", "back": "当多个回路同时运作时,只有居于主导地位的回路才决定系统行为。•每个回路都有转折点,此时其他回路会取代它居于主导地位,使存量偏离目标。•如室外很冷、保温差时,制冷回路取代制热回路居于主导,室温显著下降。", "tag": "第2章 系统大观园"}, {"front": "人口系统(系统1.2)由哪两个回路构成?各自的角色是什么?", "back": "•增强回路(reinforcing loop):出生人数,受出生率影响,推动人口增长;•调节回路(balancing loop):死亡人数,受死亡率影响,使人口减少。这是最常见、最重要的系统结构之一。", "tag": "第2章 系统大观园"}, {"front": "当出生率和死亡率为常数时,人口系统会呈现什么行为?由什么决定方向?", "back": "以指数方式增长或减少。•方向取决于增强回路(出生)与调节回路(死亡)谁的效果更强:如2007年全球出生率21‰高于死亡率9‰,人口指数级增长;若死亡率升到30‰高于出生率21‰,则人口指数级减少。", "tag": "第2章 系统大观园"}, {"front": "若全球出生率稳步回落、到2035年与死亡率持平,人口系统会出现什么行为?这属于什么现象?", "back": "达到动态平衡:每年新出生人数刚好等于死亡人数,总人口保持稳定。•这是反馈回路之间'主导地位转换'的例子——增长回路影响力弱化到与调节回路势均力敌。", "tag": "第2章 系统大观园"}, {"front": "只有一个增强回路和一个调节回路的简单系统,存量有哪几种可能的行为模式?", "back": "•增强回路主导:指数级增长;•调节回路主导:逐渐衰退(趋向一个目标);•两回路势均力敌:维持在一个特定水平;•若两回路相对优势随时间变化'轮流坐庄':系统会波动。", "tag": "第2章 系统大观园"}, {"front": "经济系统的'增强回路+调节回路'结构与人口系统如何对应?", "back": "•增强回路:资本存量越大、生产效率越高→产量越大→投资越多→资本存量越大,投资系数相当于'出生率';•调节回路:折旧与磨损消耗资本,资本平均寿命相当于'死亡率'(生命周期越长,每年淘汰比例越小)。", "tag": "第2章 系统大观园"}, {"front": "在投资系数和资本效率稳定的前提下,资本平均生命周期长短如何决定资本存量的走势?", "back": "•生命周期相对短:消耗快于更新,再投资抵不上折旧,经济慢慢衰落;•折旧与投资持平:动态平衡;•生命周期长:资本存量指数级增长,且生命周期越长增长越快。", "tag": "第2章 系统大观园"}, {"front": "书中说'具有相似反馈结构的系统,也将产生相似的动态行为',举了哪些例子?", "back": "人口与工业经济表面差异巨大,但都自我更新、指数级增长、逐渐老化衰亡,因为结构相似(一个存量+增强回路+调节回路)。•咖啡冷却、房间降温、放射性衰变、人口或经济的老化衰亡,都是调节回路作用的结果。", "tag": "第2章 系统大观园"}, {"front": "汽车经销商库存系统(系统1.3)中,两个方向相反的调节回路分别是什么?为什么要有额外库存?", "back": "•流出回路:销售使库存减少;•流入回路:向工厂订货交付使库存增加(补足销售减少的库存)。•额外库存是缓冲,以防供应商偶尔交货延迟或其他意外,因为每日到货与销售不可能完美匹配。", "tag": "第2章 系统大观园"}, {"front": "库存系统中的三个时间延迟分别是什么?各自含义?", "back": "•感知延迟(perception delay):对销量变化不做即时反应,用过去一段时间的平均销量判断趋势是否真实;•反应延迟(response delay):即使趋势明确,也只在每笔订单中部分增加,分几天逐步调整;•交货延迟(delivery delay):从工厂收单、生产到交付要5天。", "tag": "第2章 系统大观园"}, {"front": "当顾客需求增加10%且系统存在三个时间延迟时,库存量会出现什么行为?为什么?", "back": "剧烈振荡,围绕新的预期库存量上下波动。•销量上升→库存先降→经销商感知后加大订货→但交货延迟期间库存继续下降、订单进一步加大→大量到货推高库存→意识到订多了又过度削减→库存再过低,循环往复。", "tag": "第2章 系统大观园"}, {"front": "书中的重要结论:调节回路上的时间延迟会导致什么?振荡的根源是决策者愚蠢吗?", "back": "调节回路上的时间延迟很可能导致系统振荡。•不是因为经销商愚蠢,而是他们置身于缺乏及时信息反馈的系统之中:信息不对称与物理延迟普遍存在,无法实时了解自己行为对库存的影响。", "tag": "第2章 系统大观园"}, {"front": "为抑制库存振荡,经销商缩短感知延迟或缩短反应延迟的效果如何?正确的做法是什么?", "back": "缩短感知延迟基本无效,振荡甚至略有恶化;缩短反应延迟使振荡更恶化——问题不是反应太慢而是太快、反应过度。•把反应延迟从3天延长到6天,振荡明显减缓,系统更快找到新的均衡。", "tag": "第2章 系统大观园"}, {"front": "为什么说一看到系统中存在时间延迟就要非常警觉?", "back": "时间延迟普遍存在且对系统行为有很强影响;改变延迟长短可能使系统行为发生很大变化(也可能不会),取决于延迟类型及与其他延迟的相对长短。•若不知道延迟在哪、多长,就不可能真正理解系统的动态行为;延迟可能是强有力的政策杠杆。", "tag": "第2章 系统大观园"}, {"front": "书中如何从经销商库存推广到商业周期的形成?", "back": "全美汽车库存订单会影响整车厂、零部件、钢铁、橡胶、玻璃、发电厂等,到处存在感知、生产、交货、建设周期延迟;•产量与就业、股票投机等增强回路相互推动;•不同工业部门经各种延迟相互影响,被乘数效应和投机放大——这是商业周期形成的主要原因,周期并非源自总统。", "tag": "第2章 系统大观园"}, {"front": "'成长上限'(limits-to-growth)系统基模的基本内容是什么?", "back": "任何物理的、成长的系统或早或晚都会受到某种形式的制约。•指数级成长的实体系统中必然存在至少一个驱动成长的增强回路,也必然存在至少一个限制成长的调节回路。•限制因素通常以调节回路形式出现,在特定条件下取代增强回路成为主导,阻碍进一步成长。", "tag": "第2章 系统大观园"}, {"front": "可再生性资源与非可再生性资源对系统的限制有何根本区别?", "back": "区别不在于成长能否永远持续,而在于成长以何种方式终止。•不可再生性资源主要受限于存量:存量一次到位、只出不进,开采越快生命周期越短;•可再生性资源主要受限于流量:只要开发速度等于再生速度,就可被无限开采;开发快于再生,存量可能跌破关键转折点而变成'不可再生'。", "tag": "第2章 系统大观园"}, {"front": "石油经济(系统2.1)中,资本系统的增强回路与折旧回路分别是什么?新出现的限制回路如何运作?", "back": "•增强回路:更多资本→更快开采→更多利润→再投资提高资本存量;•调节回路:折旧(按20年提5%);•新限制回路:资本越多开采越快→石油储量(只流出无流入)下降越快→单位资本的资源收益降低、利润减少→再投资减少,最终限制资本增长。", "tag": "第2章 系统大观园"}, {"front": "石油经济模型中,按最初设计可开采200年的油田,实际表现如何?为什么?", "back": "实际开采量约在第40年达到顶峰,之后迅速衰竭。•指数增长效应:资本存量14年翻一番,28年变4倍;到第50年资本维持成本超过开采收入,利润不足以支持投资,投资小于折旧,资本衰减、运营停止,最昂贵的剩余资源被留在地下。", "tag": "第2章 系统大观园"}, {"front": "若石油储量被证实是原估计的2倍或4倍,对开发时间影响多大?由此得出什么原则?", "back": "在每年10%再投资率、5%资本增长率下,资源每翻一番只能使开采高峰期延长约14年。•原则:当一个变量以指数级逼近一项约束时,其接近限制的时间会出乎意料地短;资本增长得越高越快,下跌就可能越深越快。", "tag": "第2章 系统大观园"}, {"front": "资本预期增长率(1%/3%/5%/7%)与不可再生资源开采高峰有什么关系?这背后是怎样的抉择?", "back": "再投资比例越高,开采高峰期到来得越快:7%的增长率使设计200年的油田40年内达到高峰。•对不可再生性资源管理,真正要抉择的是快速致富、'过把瘾就死',还是不那么富有但可持续时间更长。", "tag": "第2章 系统大观园"}, {"front": "若石油日渐稀缺导致价格快速上涨,结果与价格固定时有何不同?技术进步降低运营成本呢?", "back": "价格上涨提高利润、刺激投资,资本存量更大、开采时间更长,但结果是资源存量被更快耗尽——价格上涨不能避免最终崩溃,只是积累更多资本。•技术进步降低运营成本(如先进油井回收技术、从尾矿提取贵金属)会导致相同结果。", "tag": "第2章 系统大观园"}, {"front": "依靠不可再生性资源的经济体系有什么动态特征(系统提示)?", "back": "初级资源存量越大、新发现越多,增强回路相对于限制回路的影响力越强,资本存量越高、开发速率越快;•然而一旦生产高峰过去,经济衰退开始得更早、速度更快、幅度更大。", "tag": "第2章 系统大观园"}, {"front": "渔业经济(系统2.2)中,鱼群的再生率如何随密度变化?为什么是非线性的?", "back": "鱼再生率不是固定常数,取决于鱼群分布密度。•密度大时受食物和栖息地限制,再生率接近零;密度降低,再生加快;•但超过某点后鱼群数量再减少,繁殖速度反而越来越慢(每条鱼难找到同类,或被其他物种侵入领地)——再生率在某点达到最高峰。", "tag": "第2章 系统大观园"}, {"front": "渔业经济模型受哪三种非线性关系影响?", "back": "•价格:越稀少的鱼价格越高;•再生率:取决于鱼群密度,密度过低或过高繁殖率都低;•单位资本的收益:取决于捕鱼技术和方法的效率。", "tag": "第2章 系统大观园"}, {"front": "渔业经济中捕捞技术稍微提高(如更好的声纳)会导致什么后果?技术大幅提高呢?", "back": "单位资本收益稍微提高,就会使系统围绕捕捞量、资本存量和资源存量的稳定状态出现过度开发和振荡(又一个'高杠杆效应,但方向错误'的案例)。•若技术提高到能在鱼群密度很低时经济地捕捞,鱼和捕鱼业将接近彻底消亡,海洋变成荒漠,鱼变成事实上的不可再生性资源。", "tag": "第2章 系统大观园"}, {"front": "可再生性资源系统的行为有哪三种可能性?取决于哪两个因素?", "back": "三种可能:•过度开发后逐渐适应、调整至相对稳定的平衡并长期保持;•过度开发超出均衡后上下振荡;•过度开发后资源枯竭、产业崩溃。•取决于:(1)关键转折点是否被突破——一旦突破,种群再生能力被破坏;(2)资源衰减过程中抑制投资增长的调节回路的力度——快而有效则平滑均衡,较慢则振荡,很弱则崩溃。", "tag": "第2章 系统大观园"}, {"front": "为什么可再生性资源在过度开发后未必能'劫后余生'?书中的哪些脆弱性例子?", "back": "取决于资源严重衰竭那段时间里发生的情况。•鱼群很少时非常脆弱:一次污染、一场龙卷风或缺乏基因多样性都可能使其彻底灭绝;•森林草场的裸露土壤易被风化流失;•生态环境中的竞争者可能乘虚而入占领小生境。", "tag": "第2章 系统大观园"}, {"front": "书中提到哪些可再生性资源 examples(有生命的/无生命的)?感冒病毒和日用品销售为何也算同类结构?", "back": "•有生命的可再生资源:鱼、树木、草,经增强回路自我再生;•无生命的可再生资源:阳光、风、河水,无再生增强回路但有稳定补给输入。•病毒感染中易感人群、日用品销售中的潜在消费者也是可再生性存量,与虫害只部分损害作物一样,存量可恢复但可被更快消耗。", "tag": "第2章 系统大观园"}, {"front": "判断复杂系统未来行为走势的'诀窍'是什么?", "back": "了解什么样的系统结构包含哪些可能的行为,以及什么状况或条件可以触发这些行为。•如有可能,可以调整系统结构和相关条件,减少破坏性行为发生的概率,增加有利行为出现的概率。", "tag": "第2章 系统大观园"}, {"front": "测试一个模型(或预测)价值的三类问题是什么?哪类最科学?", "back": "•1)各种驱动因素会不会以这种方式发挥作用(对未来猜测,最难回答);•2)如果驱动因素这样发挥作用,系统将以何种方式应对(更科学,取决于模型质量);•3)影响各种驱动因素的又是什么(涉及系统边界)。•模型的价值不取决于驱动情景是否真实,而取决于它能否反映真实的行为模式。", "tag": "第2章 系统大观园"}, {"front": "形容一个系统时，\"适应力\"指的是什么？它的反面是什么？", "back": "适应力指系统在多变的环境中保持自身的存在和运作的能力。与适应力相对的是脆弱性或刚性。（形容物体时指被按压或拉伸后恢复原状的能力；形容人时指快速恢复力量、精神、幽默感等的能力。）", "tag": "第3章 系统的3大特征"}, {"front": "系统为什么会有适应力？其来源是什么？", "back": "因为系统内部结构存在很多相互影响的反馈回路，这些回路相互支撑，即使系统遭受巨大扰动，仍能以多种不同的方式使系统恢复至原有状态。", "tag": "第3章 系统的3大特征"}, {"front": "多个调节回路的系统为何比单一回路的系统更有适应力？", "back": "•单一调节回路只驱动存量到达预定状态•多个回路以不同的传导机制起作用，有不同的时间周期•存在一定冗余——如果其中一种机制失效了，另外一种就可以补位", "tag": "第3章 系统的3大特征"}, {"front": "什么是\"元适应力\"（meta-resilience）？", "back": "如果有一组反馈回路，可以修复或重建反馈回路，系统的适应力就比较强，这称为\"元适应力\"。由具有更高适应力的反馈回路组成的\"元元适应力\"（metameta-resilience）结构更复杂、复原能力更强，可以学习、创造、设计和进化。", "tag": "第3章 系统的3大特征"}, {"front": "适应力与\"一直保持恒定\"是什么关系？", "back": "两者不同：有适应力的系统可能经常动态变化，短期的振荡、阶段性的发作、周期性的兴衰、高潮与崩溃都是正常状况，适应力可以使其复原；相反，一直保持恒定的系统恰恰是不具备适应力的。", "tag": "第3章 系统的3大特征"}, {"front": "为什么说静态的稳定容易观察，而适应力很难被观察到？", "back": "静态的稳定以一定周期内系统状况的变动来衡量，很容易被观察；而适应力很难被观察——除非超出了限度、调节回路受到冲击或破坏、系统结构被分解，否则你很难了解适应力如何产生和运作。没有完整的系统视角，人们看到的只是表面的动态或静态。", "tag": "第3章 系统的3大特征"}, {"front": "书中用哪三个例子说明人们为稳定或生产率牺牲了系统适应力？", "back": "•给奶牛注射转基因延缓生长激素可增产，但降低了奶牛适应力，健康恶化、寿命缩短•\"及时生产\"（Just-in-time）模式降低库存成本，却使生产系统更脆弱，易受燃料、交通、计算机瘫痪等影响•欧洲数百年的严格森林管理把原生林换成单一树龄、树种的人工林，产出纸浆木材多，但土壤贫瘠、易受病虫和空气污染危害", "tag": "第3章 系统的3大特征"}, {"front": "人体、生态系统、大型组织的适应力丧失各表现为什么？", "back": "•人体：癌症、心脏病等慢性疾病源自适应力机制崩溃（修复DNA、保持血管弹性、控制细胞分裂的机制失效）•生态系统：物种消失、土壤生化机制破坏、毒素积累等生态灾难源于适应力丧失•大型组织：对环境的感知和响应机制、反馈过程过于冗长低效，层级太多、时间延迟长或信息失真", "tag": "第3章 系统的3大特征"}, {"front": "书中如何用\"平台与墙\"的比喻描述适应力？", "back": "适应力是系统运作的基础，有适应力的系统就像一个大平台，系统可在其中自由驰骋，接近危险边缘时会遇到一堵柔软有弹力的\"墙\"将其反弹回来。适应力下降时平台变小、墙变矮变硬，系统如同运行在刀尖上，一点震动就可能坠落。适应力的丧失看似突然，实则系统早已千疮百孔。", "tag": "第3章 系统的3大特征"}, {"front": "书中的哪些做法体现了\"保持或增强系统自身康复能力\"的认识？", "back": "•生态系统：让捕食者有效控制害虫数量•养生保健：不只等有病再治疗，而是增强人体自身免疫力•救援项目：不简单提供食物或金钱，而是创造条件让人们自给自足——\"授之以鱼，不如授之以渔\"", "tag": "第3章 系统的3大特征"}, {"front": "什么是系统的\"自组织\"（self-organization）？", "back": "自组织是系统使其自身结构更为复杂化的能力，即系统具有塑造自身结构、生成新结构、学习、多样化和复杂化的能力。它是复杂系统最令人称奇的特征之一。", "tag": "第3章 系统的3大特征"}, {"front": "书中举了哪些自组织的例子（简单与复杂各举几例）？", "back": "•简单的自组织：雪花、窗户上的冰晶、过饱和溶液的结晶体•更复杂的自组织：一颗种子生根发芽（长成大树般复杂的有机体）、一个孩子学会讲话、一个社区的居民自发联合起来反对有害垃圾倾倒•人类社会从刀耕火种进化到蒸汽机、流水线、摩天大楼和全球通信网络", "tag": "第3章 系统的3大特征"}, {"front": "自组织特性会带来什么？为什么人们常压制它？", "back": "自组织会产生异质性和不可预测性：系统可能演变成全新的结构、发展出全新的行为模式。它需要自由和试验，也需要一定程度的混乱。这些状况可能令人恐慌或威胁现有权力结构，因此教育体系常限制儿童创造力、经济政策偏向现有大企业、政府倾向于管制人民而非允许自发组织。", "tag": "第3章 系统的3大特征"}, {"front": "书中用\"科赫雪花\"说明什么道理？", "back": "即使像科赫雪花这样精美、复杂的图形，也可以从一组简单的组织原则或决策规则演化而成。由此说明：即使是非常复杂的自组织形式，也有可能产生于相对简单的组织规则。（肺部细胞按分形规则排列，在有限空间内极大扩展与空气的接触面积。）", "tag": "第3章 系统的3大特征"}, {"front": "书中有哪些\"简单规则产生复杂系统\"的其他例证？", "back": "•所有生命都基于DNA、RNA和蛋白质分子等遗传机制中的基本组织规则繁衍生息，从病毒到红树林、从变形虫到大象均是如此•农业发展始于一个简单创意：人类可以定居、拥有土地并选择培育作物•中世纪欧洲人以\"大地中心—城堡中心—教堂中心\"作为社会和物理结构的组织原则", "tag": "第3章 系统的3大特征"}, {"front": "什么是系统的\"层次性\"（hierarchy）？", "back": "一个大系统中包含很多子系统，一些子系统又可以分解成更多、更小的子系统（如细胞→器官→人体→家庭/组织→城镇→国家）。系统和子系统的这种包含和生成关系，被称为层次性。", "tag": "第3章 系统的3大特征"}, {"front": "为什么说层次性是系统的伟大发明？它有什么好处？", "back": "•层次性使系统更加稳定和有适应力•它减少了信息量，使系统各部分更容易记录和跟进•如果各层次内部和层次之间的信息连接设计合理，反馈延迟会大大减小，没有哪个层次会产生信息过载，系统的运作效率和适应力得以提高", "tag": "第3章 系统的3大特征"}, {"front": "层次性系统中，子系统内部与子系统之间的联系有何特点？", "back": "各个子系统内部的联系要多于并强于子系统之间的联系。例如同一院系或年级的人更熟悉、交流更多；组成肝脏的细胞彼此联系密切，与心脏细胞的联系较少。虽然每件事物都和其他事物存在联系，但不同联系的强度并不一样。", "tag": "第3章 系统的3大特征"}, {"front": "两个钟表匠的寓言（霍拉与坦帕斯）说明了什么？", "back": "霍拉和坦帕斯都组装由近百个零件组成的手表。坦帕斯依次组装，一旦被打断（如接电话）半成品就散成一堆零件，只好从头再来；霍拉先把约十个零件组装成稳定部件，再组成更大集合，被打断只影响一小部分工作。说明：只有存在稳定的媒介形式，简单系统才能进化成复杂系统，这样形成的复杂系统天然具有层次性。", "tag": "第3章 系统的3大特征"}, {"front": "为什么说层级系统在某种程度上是可以被拆解的？拆解研究有何利与弊？", "back": "由于各子系统内部存在较紧密的信息流、自身有一定功能，被拆开后至少可以部分地像系统一样发挥作用，因此可以分别对细胞、器官等进行深入研究（还原论的贡献）。但不能忽视子系统之间的重要联系——正是它们把子系统联系成更高层级，并可能在更高层级上生成意想不到的行为。", "tag": "第3章 系统的3大特征"}, {"front": "什么是\"次优化\"（suboptimization）？书中举了哪些例子？", "back": "当某个子系统的目标而非整个系统的目标占了上风，并牺牲整个系统的运作成本去实现某个子系统的目标，其结果称为\"次优化\"。例：•团队成员过分追求个人荣誉，忽视团队整体目标•身体里一些细胞打破层次应有的功能快速繁殖，形成癌症•学生追求高分而非知识，出现考试作弊•公司为自己的利益向政府行贿，损害市场竞争秩序和公共福利", "tag": "第3章 系统的3大特征"}, {"front": "为什么说\"太多的中央控制\"与次优化同样有害？", "back": "•如果大脑直接控制身体每一个细胞，细胞不能自我维持其功能，整个有机体就会死亡•如果大学领导直接决定每位师生的专业或研究方向，大学使命就不复存在•如果运动员完全听从教练指挥而不顾场上感觉，团队难有胜算•历史上当权者对公司或国家经济的过度控制曾引发一次次大灾难", "tag": "第3章 系统的3大特征"}, {"front": "要让系统高效运作，层次结构应如何平衡？层次性进化的方向是什么？", "back": "层次结构必须平衡整体系统和各子系统的福利、自由与责任：既要有足够的中央控制以协调整体目标的实现，又要让各子系统有足够的自主权以维持其活力、功能和自组织。层次是从最底层开始向上进化的：从局部到整体，从细胞到器官和有机体，从个人到团队；上一层级的目的是服务于较低层级的目的。", "tag": "第3章 系统的3大特征"}, {"front": "系统的3大特征是什么？它们对系统运作的意义何在？", "back": "适应力、自组织和层次性是动态系统有效运作的三个原因。促进或精心管理这三种特性，可以增强系统长期保持有效运作的能力，保持稳定。（利奥波德：如果生物圈建立了我们喜欢但不了解的东西，只有傻瓜才会丢弃那些看似无用的部件。）", "tag": "第3章 系统的3大特征"}, {"front": "系统思考者遇到一个问题时,要做的第一件事是什么?为什么?", "back": "寻找数据,了解系统的历史情况以及行为随时间变化的趋势图。• 因为系统行为的长期趋势为理解潜在的系统结构提供线索,而结构是理解系统会发生什么、为什么发生的关键,使人不仅\"知其然\",更\"知其所以然\"。", "tag": "第4章 系统的6大障碍"}, {"front": "事件、行为模式、系统结构三者是什么关系?(以\"机灵鬼\"玩具为例)", "back": "系统结构是行为的根源,系统行为体现为随时间发生的一系列事件。• 例如手从\"机灵鬼\"上移开(事件),它弹起并来回振荡(行为),这一行为由其弹簧结构引起。• 结构决定系统可能存在哪些行为,如调节回路趋于目标、增强回路引发指数增长、有延迟则可能振荡。", "tag": "第4章 系统的6大障碍"}, {"front": "为什么基于行为层面的计量经济学模型擅长短期预测,却做不好长期预测、也找不到改善对策?", "back": "这类模型试图发现各流量之间的统计关系,但任何流量与其他流量之间都没有稳定的关系——流量受存量而非其他流量的影响。• 一旦系统结构变化(如打开窗户、调整火炉、忘了加油),流量间关联就会改变。• 因此必须深入发掘系统的结构。", "tag": "第4章 系统的6大障碍"}, {"front": "停留在事件层面的分析(如每晚就事论事的股评)有什么局限?", "back": "它不能预测明天会发生什么,也不能改变系统的行为(如让股市更少波动、让公司更健康)。• 只有看到事件如何积累形成行为模式,再深入到决定行为的系统结构,才能理解并影响系统。", "tag": "第4章 系统的6大障碍"}, {"front": "我们为什么容易被系统中接连发生的事件迷惑、经常感到惊讶?", "back": "事件就像冰山浮在水面之上的一小部分,壮观而不同,源源不断吸引注意力;但我们看待世界的方式几乎没有预见性,也不揭示内在原因。• 若能看到相关事件如何积累形成动态行为模式,就不会太惊讶。", "tag": "第4章 系统的6大障碍"}, {"front": "什么是线性关系与非线性关系?各举一例。", "back": "线性关系有固定比例,可用一条直线表示,如施10磅肥料多收2斗谷物、施20磅多收4斗;• 非线性关系是因果之间不存在固定比例,只能用曲线或不规则线表示,如施100磅肥料增产10斗,施200磅不再增产,施300磅反而减产——土壤有机质被破坏,庄稼被\"烧\"死了。", "tag": "第4章 系统的6大障碍"}, {"front": "除了有悖于直觉预期,理解非线性为什么对系统分析尤为重要?", "back": "非线性改变了反馈回路之间的相对力量对比,可能使系统从一种行为模式跳转到另一种。• 它是\"主导地位转换\"的主要原因,例如从指数级增长突然转为衰退,就是系统由增强回路占主导转变为调节回路占主导。", "tag": "第4章 系统的6大障碍"}, {"front": "云杉色卷蛾案例中,哪些非线性关系导致虫害突然大爆发、一发不可收拾?", "back": "• 冷杉数量越多,虫害爆发的可能性迅速增加(非线性);• 色卷蛾繁殖速度远超食物供给的增长;• 害虫数量超过某个点后,捕食者不能再加速繁殖,控制失效;• 冷杉被大量吃掉后,色卷蛾饿死的调节回路取代其繁殖的增强回路,数量又迅速减少。", "tag": "第4章 系统的6大障碍"}, {"front": "喷洒杀虫剂为什么反而使云杉色卷蛾虫害长期反复爆发、陷入\"欲罢不能\"的境地?", "back": "杀虫剂不只杀死害虫,还杀死其天敌(鸟类、蜘蛛、寄生蜂),削弱了大自然控制害虫的反馈回路;• 使冷杉密度一直保持较高水平,色卷蛾数量难以降到快速下降的临界点,虫害每年爆发;• 继续用药只能勉强维持,停药则反扑空前强大,深陷\"亚爆发状态\"。", "tag": "第4章 系统的6大障碍"}, {"front": "系统结构图中的\"云\"代表什么?为什么说它是系统让我们感到意外的主要来源之一?", "back": "云表示流量的源头和终点,是为便于讨论而暂时简化和忽略的存量。• 它标记着系统图的边界,但很少是系统真正的边界;• 如果被简化为云的存量(如原材料、顾客需求)发生短缺或重大变化而未被划入边界,系统就会出现意想不到的事件。", "tag": "第4章 系统的6大障碍"}, {"front": "系统的边界是客观存在、清晰明确的吗?应如何理解?", "back": "不是。万物皆有联系,系统很少有真正的边界。• 边界是人为的区分,是人们出于观察、思考、理解、表达、交流等需要,在心理上设定或社会上一般公认的虚拟边界。• 如何划定取决于你的分析目的,即想问的问题是什么。", "tag": "第4章 系统的6大障碍"}, {"front": "系统边界划定得太窄会带来什么问题?举两个例子。", "back": "一些对系统行为有显著影响的因素未被认真分析和对待,系统就可能产生意想不到的行为。• 如只靠建快速路治拥堵,不考虑居住生活模式,结果沿线地产开发带来更多车流,高速路也拥堵;• 治理河水污染若只划在所居城镇,上游污染不治,努力就是徒劳。", "tag": "第4章 系统的6大障碍"}, {"front": "把系统边界划得过宽有什么弊端?", "back": "分析过于庞杂,堆积大量信息,反而遮掩了问题的真实答案。• 如模拟全球气候时堆砌所有细节、列举各种原因,反而让人迷失,无法发现减少二氧化碳排放、控制气候变化的关键。• \"我的模型比你的大\"只是一个浅薄的想法。", "tag": "第4章 系统的6大障碍"}, {"front": "关于划定系统边界,作者给出的操作性建议是什么?", "back": "划定边界需要较高的艺术性。• 面对每一个新任务,都应忘掉上一次任务中行之有效的边界划分,根据当前问题的需要,创造性地划定最合适的边界。• 边界是自己划定的,对新问题应重新考虑,不能让\"云\"阻止思考。", "tag": "第4章 系统的6大障碍"}, {"front": "什么是李比希的\"最小因子定律\"?", "back": "作物生长需要阳光、水、氮、磷、钾、微生物等要素,缺少其中任一项,即使其他要素再多都不管用。• 如缺磷,加再多其他养分无用;缺钾时,施再多磷也毫无意义。• 俗话即\"巧妇难为无米之炊\"——没有酵母,再多的面粉也做不出面包。", "tag": "第4章 系统的6大障碍"}, {"front": "为什么发达国家向欠发达国家转移资本和技术往往效果不佳?", "back": "经济发展也受多重限制因素制约,不只是资本和技术,甚至它们可能根本不是受援助国最主要的限制因素。• 资本和劳动力\"瓶颈\"突破后,限制因素会转变为清洁的水源、空气、垃圾填埋场、能源以及原材料供应等,只盯传统因素就事倍功半。", "tag": "第4章 系统的6大障碍"}, {"front": "福瑞斯特的公司成长模型中,限制因素是如何随公司成长不断变化的?", "back": "• 销售人员增加→订单激增超出工厂产能,产能成为主要限制;• 投资建厂,但员工雇用培训慢于设备到位,质量问题致客户流失,员工技能成为限制;• 质量改善后新订单又大增,订单执行和跟踪系统又出现拥堵。• 限制因素随成长动态变换,须持续识别和应对。", "tag": "第4章 系统的6大障碍"}, {"front": "关于成长与限制,作者的根本结论是什么?", "back": "任何成长都存在限制,有些是自发的,有些是系统施加的,没有任何物质实体可以永远成长。• 关键不是追求持续成长,而是选择在哪些因素的限制之下维持生存;• 若公司管理者、政府当局、社会人口不自觉地对成长加以选择和控制,环境也会做出选择并施加限制。", "tag": "第4章 系统的6大障碍"}, {"front": "福瑞斯特建议的估计系统中时间延迟的方法是什么?", "back": "先去问一问系统里的每一个人,他们认为时间延迟有多长,对其进行分析、做出最精准的预测,然后再扩大三倍。• 因为我们经常对事物发展需要多少时间感到出乎意料。(作者发现这一修正方式对估计写书所需时间同样适用。)", "tag": "第4章 系统的6大障碍"}, {"front": "系统中存在哪些重要的时间延迟?举出至少四个例子。", "back": "每一个存量都是延迟,大部分流量也有延迟。• 病毒感染到症状发作的\"潜伏期\",几天到几年;• 污染发生到造成危害之间;• 猪的周期4年、奶牛7年、可可树11年;• 改变家庭规模观念至少需一代人;• 设计新车上市需3~8年,在路上平均行驶10~15年。", "tag": "第4章 系统的6大障碍"}, {"front": "反馈回路中存在较长时间延迟时,为什么预见性必不可少?行动太快或太慢各有什么后果?", "back": "如果缺乏预见性,等到问题已很明显才采取行动,将错过解决问题的重要时机。• 若采取行动太快,可能因过度反应而放大短期波动,产生不必要的振荡。• 时间延迟决定了系统的反应速度、达成目标的准确性和信息传递的及时性;矫枉过正、振荡和崩溃常由延迟引起。", "tag": "第4章 系统的6大障碍"}, {"front": "时间延迟如何帮助我们理解戈尔巴乔夫改革与东西德合并的困难?", "back": "戈尔巴乔夫几乎可以一夜之间改变苏联的信息系统,却不能改变实体经济——那需要数十年;• 东西德合并后,社会经历的痛苦期也远长于政治制度的变革。• 因为改变信息流快,而改变资本存量、基础设施、观念等慢。", "tag": "第4章 系统的6大障碍"}, {"front": "判断一项时间延迟是否显著、是否需要纳入考虑,取决于什么?", "back": "取决于你试图理解的频率处于哪一档(所关心波动的时间尺度)。• 若关心数周内的波动,可不必考虑数分钟或数年的延迟;• 若做数十年的人口规划、经济预测,通常可忽略为期数周的振荡。• 与划定边界一样,取决于讨论的目的。", "tag": "第4章 系统的6大障碍"}, {"front": "什么是赫伯特·西蒙所说的\"有限理性\"(bounded rationality)?", "back": "人们会基于其掌握的信息制定理性的决策,但由于所掌握的信息通常是有限的、不完整的,尤其是对于系统中相隔较远或不熟悉的部分,由此导致决策往往并非整体最优。• 每个人理性地从自己短期最大利益出发,行为汇集的结果却是所有人都不愿看到的(戴利称之为\"看不见的脚\")。", "tag": "第4章 系统的6大障碍"}, {"front": "用有限理性解释:渔夫为什么会在不了解鱼群状况的情况下过度捕捞?", "back": "渔夫不知道哪里有多少鱼,也不了解同一天其他渔夫多捕或少捕了多少。• 他只能基于自己有限的、有延迟的信息理性思考,在自己有限的视野内从几种明显的选择中抉择,不会考虑整体长期最优方案。• 处于此位置的人行为是合理的,换成另一个人结果仍相同。", "tag": "第4章 系统的6大障碍"}, {"front": "亚当·斯密\"看不见的手\"理论建立在哪两个假设之上?为什么站不住脚?", "back": "• 假设每个市场主体都是基于完备信息、完全理性行动的\"经济人\";• 假设各主体按此规则行动时,行动累加会产生对每个人都是最优的结果。• 长期证据表明这两个假设都无法成立;市场决策本身并不能纠正整体系统的垄断倾向和外部性(如对穷人的歧视、产能波动)。", "tag": "第4章 系统的6大障碍"}, {"front": "行为科学家发现,我们甚至不能正确解读自己掌握的有限信息,表现在哪些方面?", "back": "• 对风险做出错误估计,高估一些危害、轻视另一些危险;• 过度夸大当下状况的重要性,轻视过去;• 更关注当前事件,对长期行为不关心,并按自己的价值判断对未来价值打折扣;• 不能正确评估信号的重要性,排斥不喜欢或不符合心智模式的信息。", "tag": "第4章 系统的6大障碍"}, {"front": "为什么说责备个人无助于改变有限理性导致的行为?真正的对策是什么?", "back": "处于系统特定位置上的人,所见所知有限,其行为是合理的;即使换一个人,结果仍相同。• 对策是跳出所在系统中固有的位置,力求看到系统整体状况,从一个更广阔的视角重构信息流、目标、激励或限制因素,使分割的、有限的理性行动累加起来产生整体期望的结果。", "tag": "第4章 系统的6大障碍"}, {"front": "荷兰房屋电表的故事说明了什么道理?", "back": "同样的房子、同样的电价,电表装在前厅(走过就能看到小圆盘转动、提醒电费增加)的家庭比装在地下室的家庭用电少1/3。• 说明只要稍微强化有限理性——更好、更及时地提供更多、更完备的信息,行为的转变可以很快、很容易。", "tag": "第4章 系统的6大障碍"}, {"front": "在什么情况下,系统即使存在个体有限理性,也无须治理机构和政策就能正常运转?", "back": "只要系统的结构设计得精致,在合适的时间、合适的地点做出合适的反馈,就能维持适当的功能。• 如肝脏只得到必要的信息去完成其任务;• 在未受扰动的生态系统和传统文化中,每个个体以自己的方式服从并服务于系统整体,保持整体稳定。", "tag": "第4章 系统的6大障碍"}, {"front": "应对系统性问题的基模(\"陷阱\"),为什么指责参与者和用\"标准\"政策手段难以奏效?", "back": "基模造成的破坏常被归咎于某些参与者或事件,但其实是系统结构使然。指责、惩罚、调整政策等\"标准\"方式难以修正结构性问题,如同对破镜子修修补补。需要预先识别陷阱,改变其结构:重设目标,增强、减弱或改变反馈回路,增加新的反馈回路。", "tag": "第5章 系统的8大陷阱"}, {"front": "作者为什么把这些基模既称为\"陷阱\"又称为\"机会\"?", "back": "基模(如公地悲剧、目标侵蚀、竞争升级)非常常见,结构方式注定产生问题,让人陷入巨大麻烦,且难以用标准手段修正,故称\"陷阱\"。但陷阱可以避开:预先识别出来,不触发它们,或改变其结构——重设目标、增减或改变反馈回路、增加新回路,故也称\"机会\"。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是\"政策阻力\"(治标不不治本)?其识别特征是什么?", "back": "系统中多个参与者目标不同,各自把同一存量往不同方向拉。特征:任何新政策(尤其是恰好管用的)都会让存量远离其他参与者的目标,招致额外抵抗;一方努力的成果被反方向力量抵消,系统维持在谁也不希望看到的状态。", "tag": "第5章 系统的8大陷阱"}, {"front": "书中用哪些日常例子说明\"政策阻力/治标不治本\"?", "back": "•农产品过剩:年复一年采取措施仍依旧•毒品泛滥:各种禁止打击依旧•市场不景气时出台投资税收贷款等刺激政策几乎无效•在美国不要指望任何单一政策能降低医疗成本•美国政府几十年\"创造就业\",失业率长期居高不下。", "tag": "第5章 系统的8大陷阱"}, {"front": "政策阻力源于什么?为什么\"棘轮\"式僵持难以缓解?", "back": "源于各参与者的有限理性:人人监控重要变量并与自身目标对比,差距越大行动压力越大。系统如棘轮:一方增强努力,其他各方也加倍;一方让步,别人就把系统拉向更靠近自己目标的方向。缓解需要大量信任和沟通,而有些沟通(如贩毒各方)很难做到。", "tag": "第5章 系统的8大陷阱"}, {"front": "罗马尼亚1967年禁止流产的政策说明了什么?", "back": "罗马尼亚禁止流产以增加人口,出生率一度增两倍,随即遭政策阻力报复:出生率回落到接近政策前水平,育龄妇女死亡率增两倍,孤儿大量增加。齐奥塞斯库靠权力压制反抗,政府倒台后他和家人被处死;新政府第一部法律就是废除流产和避孕禁令。", "tag": "第5章 系统的8大陷阱"}, {"front": "应对政策阻力的三种方式(从最差到最好)是什么?", "back": "•压制:靠权力镇压,招致怨恨,权力一放松可能爆炸式反弹•放弃、废止无效政策,将资源用于更具建设性的目标(如美国1933年终止禁酒令)•最有效:设立更大的总体目标,协调各子系统目标一致,让所有参与者突破有限理性(如战时经济动员、灾后重建)。", "tag": "第5章 系统的8大陷阱"}, {"front": "同样是应对低出生率,瑞典政策为何优于罗马尼亚和匈牙利?", "back": "罗马尼亚靠压制,酿成灾难;匈牙利发现住房影响生育,出台多子女家庭可获更大房屋的奖励,有效但有限。瑞典与国民达成共识:关键不在人口数量而在育儿质量——每个孩子都应被渴望、珍视。政策含自由避孕流产、性教育、免费产科护理、加大教育保健投资。", "tag": "第5章 系统的8大陷阱"}, {"front": "政策阻力陷阱的官方\"对策\"是什么?", "back": "放弃压制或实现单方面的目标。化阻力为动力,将所有参与者召集起来,用先前用于维持政策阻力的精力,去寻找如何实现所有人的目标、实现\"皆大欢喜\",或重新定义一个更大、更重要的总体目标,让大家愿意齐心协力去实现它。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是\"公地悲剧\"?哈丁草场例子中牧民的账怎么算?", "back": "对所有人免费开放的有限共享资源,每个使用者从使用中直接获利:多养一头牲畜的收益接近+1,全归自己;过度放牧的成本由大家分担,单个牧民只承担若干分之一。于是每个\"理性\"牧民都不断扩大牧群,最终资源耗竭,个人追求最大利益的结局是集体毁灭。", "tag": "第5章 系统的8大陷阱"}, {"front": "公地悲剧产生的关键系统原因是什么?", "back": "资源消耗与使用者数量增长之间的反馈缺失或延迟太长,使用者得不到\"接近极限\"的反馈。且超过一定限度后资源会加速衰竭:草越少,牲畜越易连根吃掉,草根没了土壤被冲走,草更难长——形成加速枯竭的恶性增强回路。", "tag": "第5章 系统的8大陷阱"}, {"front": "除草场外,书中还举了哪些公地悲剧的例子?", "back": "•国家公园不限流,很快人满为患,美景被毁•使用不可再生的化石燃料人人受益,尽管引发温室效应仍一如既往•生几个孩子自己决定,教育医疗环保费用由社会负担,新生儿很快超过社会承载力•企业向河流下游直排污水,自己承担的代价只是污染结果的一小部分。", "tag": "第5章 系统的8大陷阱"}, {"front": "防止公地悲剧的三种方式是什么?各自的原理?", "back": "•教育劝诫:让人看到滥用后果,以道德、舆论或惩罚威慑违规者,使使用低于承载限度•私有化:分割给个人,让使用者对后果直接负责,建立直接反馈•管制(\"达成共识,强制执行\"):禁止、配额、许可、税收等,必须有强制监管和惩罚才能奏效。", "tag": "第5章 系统的8大陷阱"}, {"front": "哪些资源无法私有化?书中\"达成共识,强制执行\"有哪些日常例子?", "back": "大气和海洋等资源无法分割、私有,只剩\"达成共识,强制执行\"一条路。例:•繁忙路口的交通信号灯(轮流放行)•闹市区计时收费停车位•银行的保安、保险柜(物理屏障+严厉惩罚)•无线电频段须申请许可•按垃圾数量收费,修复使用与后果的联系。", "tag": "第5章 系统的8大陷阱"}, {"front": "哈丁为什么不相信仅靠教育劝诫就能防止公地悲剧?", "back": "如果公共资源只靠传统或\"信用\"系统保护,反而可能让那些不尊重传统、不按常理出牌或不讲信用的人钻空子、占便宜,使资源遭破坏。虽然一些\"原始\"文化靠教育劝诫世代有效管理公共资源,但哈丁不认为这总是有效;私有化更有效,不能私有化的只能靠管制。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是\"目标侵蚀\"(温水煮青蛙效应)?其恶性回路如何运转?", "back": "绩效标准受过去绩效影响,尤其当人们过于关注坏消息——把最好的结果当偏差忽略、记住最坏结果时,感知比实际更糟。感知下滑→期望下调→与现状差距变小→修正行为更少→系统状态更差。这个向下增强回路掩盖了本应维持绩效的调节回路,变化渐进、令人麻痹。", "tag": "第5章 系统的8大陷阱"}, {"front": "目标侵蚀的典型表现有哪些?", "back": "•企业市场份额逐渐下滑•医院服务品质不断下降•河水或空气质量持续恶化•定期节食但体重依然增长•美国公立学校日渐衰落•作者自己坚持的慢跑越来越懈怠•英国经济衰退中自我预期不断下调(\"至少不能比去年做得更差吧\")。", "tag": "第5章 系统的8大陷阱"}, {"front": "目标侵蚀有哪两个对策?", "back": "•不管绩效如何,都保持一个绝对的绩效标准•不断将目标与过去的最佳标准相对照,而不是和最差表现相比。把最佳结果作为标准、视最差结果为临时性挫折,同一结构就能变成向上增强回路——\"事情越好,我就越努力把事情做得更好\"。", "tag": "第5章 系统的8大陷阱"}, {"front": "如何区分\"目标侵蚀\"与\"竞争升级\"?", "back": "目标侵蚀:绩效标准受自身过去绩效影响,是随感知状态下调的绝对值,是\"感知—期望\"间的向下回路,绩效渐进下滑。竞争升级:各方的目标是相对的——取决于其他参与者的状况(比对方高一寸),互相超越,竞争指数级激化,最终一方被击倒或两败俱伤。", "tag": "第5章 系统的8大陷阱"}, {"front": "竞争升级的识别特征和决策规则是什么?", "back": "源自增强回路:参与者都试图超越对方、占据上风,连并驾齐驱都不行;目标不是绝对值而是相对值(不管室温多少,我都要比另一房间高一度)。决策规则是\"以眼还眼,以牙还牙\"。各方都有高估对方敌意、夸大对方实力的倾向;增强回路使竞争以指数级激化。", "tag": "第5章 系统的8大陷阱"}, {"front": "书中举了哪些竞争升级的例子?", "back": "•美苏军备竞赛:竞相夸大对方实力,自己造的武器触发多米诺效应•竞选负面宣传互相诽谤•价格战轮番压价,可能一方破产或两败俱伤•广告战、鸡尾酒会越说越大声、豪华车越造越长•医院竞相引进昂贵诊断设备•建筑从巴洛克到洛可可再到媚俗。", "tag": "第5章 系统的8大陷阱"}, {"front": "竞争升级一定是坏事吗?", "back": "不一定。若争夺的是符合人们预期的目标,如研发更快的计算机、治疗艾滋病,它能加速系统进步。但若驱动恶性对抗、暴力、争吵或愤怒,就是危险的陷阱。即使朝好的方向发展(效率、精妙、质量)也可能有问题——它不容易停下来,超过限度便适得其反。", "tag": "第5章 系统的8大陷阱"}, {"front": "应对竞争升级陷阱的两种方式是什么?", "back": "最佳方式是避免陷入这一结构。若已深陷:•单方面裁军——一方主动让步、降低自身状态,引导对手随之下降,切断增强回路;前提是有真决心且未被击倒•谈判达成裁军协定——引入新的调节回路限制竞争,如父母调解孩子争吵、对广告出台规定、部署维和部队。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是\"富者愈富\"(竞争排斥)?其系统结构是什么?", "back": "利用积累的财富、权力、渠道或信息可创造更多财富、权力、渠道和信息,形成增强回路,参与者迅速分化为赢家和输家:前者越好,后者越差。若在有限环境中,输家最终破产、离开或饿死。生态学称\"竞争排斥法则\":争夺相同资源的两个物种不能共生于同一小生境。", "tag": "第5章 系统的8大陷阱"}, {"front": "书中举了哪些\"富者愈富\"的例子?", "back": "•大富翁:先购地产者收租再买旅馆,直至通吃•街区灯饰评比:连赢者灯饰愈发华丽•市场竞争:优势公司收入更多,再投入扩张研发,差距越拉越大•美国汽车公司减至三大巨头•穷人孩子受差教育、缺乏抵押资产贷不到款•佃农永远买不起土地。", "tag": "第5章 系统的8大陷阱"}, {"front": "规避\"富者愈富\"陷阱有哪些对策?", "back": "•多元化:落败者退出、开启新博弈(物种开发新资源,公司创造新产品/服务)•反垄断法:限制赢家最大份额•修正竞赛规则,定期\"校正\"竞技场:对弱者特别关照,如累进税、慈善、公共福利、工会、全民义务教育与医疗、遗产税、\"冬节\"式馈赠。", "tag": "第5章 系统的8大陷阱"}, {"front": "\"转嫁负担/上瘾\"陷阱的结构是什么?", "back": "系统有一个存量(如农作物产量或幸福感)由参与者按预设目标调节。当目标与现实差距巨大而自身缺乏缩小差距的办法时,人们选择简便、快速见效的干预来缓解症状——但它不解决根本问题:毒品改变感知而非处境,补贴不改变竞争力,化肥当季见效而土壤依旧贫瘠。", "tag": "第5章 系统的8大陷阱"}, {"front": "书中举了哪些\"转嫁负担/上瘾\"的例子?", "back": "•养老从家庭转为社保养老院•高速公路取代铁路公交•计算器使孩子心算能力下降•抗生素使自身免疫力下降•健康责任转嫁给医生药物•企业靠补贴、农民靠化肥、西方经济靠廉价石油•杀虫剂越用越多•70年代油价危机中美苏控制油价,假装无事,加剧枯竭。", "tag": "第5章 系统的8大陷阱"}, {"front": "转嫁负担何时是好事,何时变成陷阱?", "back": "有时是有意的好事,如接种天花疫苗完全实现免疫——有些系统真的需要干预者。变成陷阱的条件:若干预削弱了系统自身维持状态的能力,自我调节能力萎缩,就需要更多外部干预,又进一步削弱系统能力,形成破坏性增强回路,最终耗尽干预者的能力。", "tag": "第5章 系统的8大陷阱"}, {"front": "如何戒除和预防\"上瘾\"结构?", "back": "戒除是痛苦的:拒绝快速见效但有副作用的措施,直面系统真实状态,采取根本解;可先采用非上瘾性政策,以最小扰动让系统恢复自我调适能力,有时只能休克疗法。更理想是提前预防:干预时以增强系统自身能力为要,从提问开始——为什么自然纠正机制不奏效?", "tag": "第5章 系统的8大陷阱"}, {"front": "如果你是干预者或依赖者,应对转嫁负担陷阱的要点是什么?", "back": "最好提前预防;只缓解症状的政策不能真正解决问题,应把关注点从短期救济转向长期结构性重建。干预者:恢复或增强系统自身解决问题的能力,然后择机抽身退出——最睿智的干预。依赖者:先建立自身内在能力再摆脱干预;已上瘾则马上行动,拖得越久戒除越难。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是\"规避规则\"?它和违反规则有何不同?", "back": "指采取迂回或变通措施,名义上遵守或不违反规则条文,但本质上规避了规则的原本意图——遵守的是\"法律上的条文\"而非立法本义(如附近有警车才遵守限速)。\"上有政策,下有对策\"。若规避行为导致系统严重扭曲,一旦失控,破坏性强大。", "tag": "第5章 系统的8大陷阱"}, {"front": "书中举了哪些\"规避规则\"的案例?", "back": "•政府部门、大学、公司年末突击消费,因不花完预算明年会被砍•佛蒙特州《250法案》只对10英亩及以下开发设复杂审批,结果大量项目恰好比10英亩大一点•欧洲限制饲料进口漏了木薯,进口商改进口木薯•土地主发现濒危物种后将其猎杀,以便开发土地。", "tag": "第5章 系统的8大陷阱"}, {"front": "应对规避规则的两种方式是什么?", "back": "规避规则通常是下级对刻板、有害、不切实际或不明确的规则的反应。•强化规则去扑灭:会激起系统更大变形,越陷越深•(更好)把规避行为看做有用的反馈:修订、改善、废除规则或给予更好解释;设计规则时尽可能预见其对各子系统的影响及可能的规避行为。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是\"目标错位\"?为什么目标如此关键?", "back": "调整目标是影响系统行为最有力的方式之一:目标设定方向、定义需校正的差距。若目标定义不当、测错了东西,系统就不可能产出期望结果——它只会产出你要求的结果。例:把国家安全定义为军费开支,就是军备竞赛;把计划生育定义为放环数量,医生便乱放环。", "tag": "第5章 系统的8大陷阱"}, {"front": "书中如何批评以GNP(国民生产总值)作为国家目标?", "back": "GNP只衡量当期产出的货币流量,而非房屋、汽车等真正的财富。•好坏混算:交通事故推高账单却抬高GNP•只算被交易的产品•不反映分配公平•节能灯省电耐用,推广反而拉低GNP•为刺激GNP砍伐森林,威胁长期发展。", "tag": "第5章 系统的8大陷阱"}, {"front": "如何区分\"目标错位\"与\"规避规则\"?如何恰当地设定目标?", "back": "与规避规则相反:规避规则是系统设法逃避规则而表面遵守(发现\"有办法绕过规则\"而办蠢事);目标错位是系统忠实执行规则却产出并非人们想要的结果(发现\"因为这是规则\"而办蠢事)。对策:恰当设定目标与指标,反映系统真正的福利;勿把努力与结果混淆。", "tag": "第5章 系统的8大陷阱"}, {"front": "系统寓言\"帆船设计的目标\"说明了什么道理?", "back": "人们最初用日常的钓鱼船、货船比赛。为使比赛公平,规则按长度、受风面积等给船只分级。很快出现专为比赛设计的帆船,围绕现有规则被极度优化——快而灵活,却奇形怪状、几乎不适于航海;规则稍有变化就变成废物。对狭隘指标的过度优化会牺牲适应力。", "tag": "第5章 系统的8大陷阱"}, {"front": "8大系统陷阱分别是什么?", "back": "①政策阻力:目标不一致互相抵消②公地悲剧:共享资源被过度耗竭③目标侵蚀:标准随感知绩效下滑而下调④竞争升级:以超过对方为目标⑤富者愈富:赢家强化获胜手段⑥转嫁负担:症状解侵蚀自我调适能力⑦规避规则:守条文歪本义⑧目标错位:如以GNP论成败。", "tag": "第5章 系统的8大陷阱"}, {"front": "什么是系统的\"杠杆点\"(leverage points)?", "back": "指在系统中的某处施加一个小的变化,就能导致系统行为发生显著转变的点。这一概念根植于日常生活和神话故事,如\"银弹\"\"命门\"、特效疗法、魔法口诀等。杠杆点就是权柄,人们不仅愿意相信它存在,还想知道它在哪里、如何运用。", "tag": "第6章 杠杆点"}, {"front": "为什么身处系统之中的人常常选错杠杆点,朝错误方向推动系统?", "back": "因为复杂系统的特征之一是\"违反直觉的\"。福瑞斯特指出,人们通常凭直觉能大致猜到去哪里寻找杠杆点,但多半是往错误的方向推动。例如世界模型分析发现\"增长\"是杠杆点,需要的更慢的增长,而各国领导人却全力推动经济增长;城市动力学模型显示减少低收入住房补贴反而更好。", "tag": "第6章 杠杆点"}, {"front": "在福瑞斯特的世界模型中,被找出的明确杠杆点是什么?人们实际推动的方向为何是错的?", "back": "杠杆点是\"增长\"——人口和经济的增长。增长在带来好处的同时也有成本,如贫穷、饥荒、环境破坏、资源枯竭等,研究清单上的所有问题都与增长有关。我们真正需要的是更慢的、完全不同的增长模式,有些情况下甚至不增长或负增长,而各国领导人却都在全力推动增长这个错误方向。", "tag": "第6章 杠杆点"}, {"front": "作者对自己开出的12个杠杆点清单做了哪些提醒?应如何对待它?", "back": "• 它不是\"成品\"或定论,而是\"在制品\"• 不是寻找杠杆点的\"处方\",而是一个邀请,帮助大家更广阔地思考系统的变化• 复杂系统进行一般化归纳十分危险,每一项都有很多例外,顺序也可灵活调整• 清单基于作者几十年对多种系统的严谨分析,并包含其他智者的成果", "tag": "第6章 杠杆点"}, {"front": "杠杆点12——\"数字(常数和参数)\"指的是什么?有哪些例子?", "back": "指存量和流量的大小及变化快慢等可调参数,是对水龙头阀门的调节。例如:每年允许砍伐的森林面积、最低工资、政府在艾滋病研究或隐形轰炸机上的投入、银行服务费、工资率、产品价格、空气质量标准等。国家财政赤字争论中的税率、开支也都是参数。", "tag": "第6章 杠杆点"}, {"front": "为什么调整数字(参数)是效力最低的杠杆点?", "back": "• 参数无法改变系统基本结构,只是调整细枝末节,像对泰坦尼克号甲板上的座椅重新布置• 旧阀门、旧信息、旧目标和规则下转动阀门,系统行为不会有大的变化• 参数变化极少能改变系统整体行为:滞涨不会暴涨,波动不会稳定,增长失控也不会减缓• 大多数人却把90%的注意力集中在参数上", "tag": "第6章 杠杆点"}, {"front": "参数在什么情况下仍然重要?什么参数是例外?", "back": "短期内,或对直接受流量影响的个体而言参数很重要,如受税收、最低工资直接影响的人群。例外是:当参数本身就是系统目标时,这类关键数字绝非平凡之辈,大多数系统都受其影响。作者声明:只有实在找不到其他11个因素时,才把参数当杠杆点。", "tag": "第6章 杠杆点"}, {"front": "杠杆点11——\"缓冲器\"是什么?为什么它比流量力量更大、更稳定?", "back": "缓冲器指相对于流量更大、更稳定的存量,具有保持稳定的力量。如湖泊相对于河流:湖泊存量相对其流量更大,所以不像河流那样容易泛滥;人们把钱存入银行而非钱包;商家保持库存;保护濒危物种需使种群数量高于最低繁殖数量。提高缓冲器容量通常能使系统稳定。", "tag": "第6章 杠杆点"}, {"front": "为什么缓冲器没有在杠杆点清单中排得很靠前?", "back": "• 缓冲器过大时系统缺乏弹性,对变化反应过于缓慢• 建立、扩大或维护缓冲器需耗费巨大时间和资金(如水库、仓库),一些企业因此发明零库存的\"及时生产\"模式,换取更大灵活性• 缓冲器通常是物理实体,不太容易改变,如水库大坝蓄水能力固定不变、美国东部土壤的钙存量无法改变", "tag": "第6章 杠杆点"}, {"front": "杠杆点10——\"存量—流量结构\"指什么?匈牙利道路系统说明了什么?", "back": "指物理连接起来的存量、流量及其交叉节点的结构。匈牙利道路以布达佩斯为中心呈辐射状,所有车辆须穿市中心,致严重污染和拥堵,装信号灯、限速都无效,根因是结构设计不良,只能重建。洛温斯通过取直、加宽管道等改造,取得惊人节能效果。", "tag": "第6章 杠杆点"}, {"front": "为什么实体系统的存量—流量结构很少成为杠杆点?", "back": "• 实体系统的重建通常是最慢、最昂贵的改变方式,有的结构甚至不可改变(如生育高峰对教育、就业、养老的冲击)• 恰当的杠杆点需要从一开始就被设计好• 结构建立后,只能理解系统的限制和瓶颈,发挥其最大效率,避免波动或扩张超出承受能力", "tag": "第6章 杠杆点"}, {"front": "杠杆点9——\"时间延迟\"指什么?它对系统行为有什么影响?", "back": "指系统对变化做出反应所需的时间,是造成振荡的主因。若调节存量时接收的信息有延迟,或反应速度有延迟,都会导致矫枉过正或未达目标。如发电厂建设需数年、寿命超30年,导致供电与需求反复振荡;延迟太短会反应过度、放大振荡,太长则反应迟钝,对有临界值的系统可造成不可逆转的伤害。", "tag": "第6章 杠杆点"}, {"front": "时间延迟为什么难以改变?更可行的做法是什么?", "back": "• 事物发展有其内在规律,该多久就多久:不能一夜积累资本、孩子不能一夜长大、拔苗助长无效• 更可行的是放慢系统变化或增长速度,使技术和价格与增长保持一致,这样反馈延迟虽不可避免,也不至于造成大麻烦• 改变可变延迟须小心方向,如金融市场上减少延迟反而加剧风暴。", "tag": "第6章 杠杆点"}, {"front": "杠杆点8——\"调节回路\"是什么?它有哪三项要素?", "back": "调节回路是试图修正外界影响、把存量维持在预定目标附近的反馈力量,是自我修正的。三要素:• 一个预定的目标(如设定的室温)• 一套检测达到或偏离目标的监测设备(如温度计)• 一个反应机制(如加热器、空调器、风扇等)。复杂系统内部有大量调节回路,因而具有较强的自我纠正能力。", "tag": "第6章 杠杆点"}, {"front": "为什么不能随意扔掉系统中\"应急\"的调节回路?", "back": "一些调节回路在某段时间可能不起作用,如核电厂应急冷却系统、人体流汗打寒战机制,但对系统的长期价值至关重要。扔掉它们短期似乎没影响,长期会大大降低系统对不同状况的适应力。令人心痛的例子:人类侵占濒危物种栖息地;很多人把时间用于工作赚钱,忽视休息、娱乐、社交和思考。", "tag": "第6章 杠杆点"}, {"front": "如何通过调节回路这一杠杆点改善系统的自我校正能力?关键原则是什么?", "back": "原则:调节回路的力量须与要校正的影响大小相对应。增强做法:• 预防医学、锻炼和营养提高抗病力• 综合治理,鼓励自然捕食者控虫• 信息公开法案限制政府舞弊• 环境破坏监督报告• 保护举报者• 排污费、污染税、履约保证金。", "tag": "第6章 杠杆点"}, {"front": "调节回路的杠杆与市场、民主有什么关系?真正的杠杆是什么?", "back": "市场是调节型反馈系统,价格机制越清晰、透明、及时、准确,运作越顺畅;补贴、税赋等调节扭曲市场信息,真正杠杆是顺其自然、不干预。民主在人民与政府间设置自我纠正反馈,有赖信息自由、完整、准确;若让扭曲市场信号者影响政府,市场和民主都将受侵蚀。", "tag": "第6章 杠杆点"}, {"front": "杠杆点7——\"增强回路\"是什么?举几个例子。", "back": "增强回路是自我强化的反馈力量,每运作一次就获得更大的强化自身方向的力量,使系统行为越转越快。例:越多的人患流感就有更多人被传染;存款越多利息越多;土壤流失越严重植被越少、流失更多;存款利息;\"富者愈富\"。它是系统中增长、爆发、腐蚀和崩溃的根源,不受抑制最终会摧毁系统。", "tag": "第6章 杠杆点"}, {"front": "为什么说减少增强回路的产出(放缓增长)可能比增大调节回路更有力?", "back": "• 不受抑制的增强回路最终会摧毁系统,放缓增长能让技术、市场等调节回路有时间发挥作用(它们都有局限和延迟)• 开快车时,降低车速比依赖刹车响应更有效• 面对\"富者愈富\"的增强回路,反贫穷项目等调节回路软弱无力;累进税、遗产税、公共义务教育等弱化增强回路的做法可能有效得多", "tag": "第6章 杠杆点"}, {"front": "杠杆点6——\"信息流\"指什么?荷兰电表的故事说明了什么?", "back": "信息流指\"谁能获得信息\"的结构。荷兰住房开发中,电表装在前厅的家庭比装在地下室的家庭耗电低30%,房间并无其他区别。这说明信息结构是高杠杆点:它不调整参数,也不是强化或弱化现有回路,而是建立新回路,让人们在之前得不到信息的地方获得反馈。", "tag": "第6章 杠杆点"}, {"front": "为什么增加或恢复信息流是强有力的干预?\"公地悲剧\"的渔业例子说明了什么?", "back": "信息流的缺失是系统功能不良最常见的原因之一;增加或恢复信息通常比重建物理基础设施更容易、成本低。渔业崩溃因鱼类存量和捕捞投资决策间几乎没有反馈:鱼越稀缺价格越高,捕鱼人反而更积极捕捞。真正需要的不是价格信息,而是剩余鱼群数量的信息。", "tag": "第6章 杠杆点"}, {"front": "关于信息流杠杆,有哪些强制性反馈的例子?为什么人们常常缺失反馈?", "back": "• 纳税人可获政府详细信息公开,了解税款用途• 取水管放到同一条河下游,马上看到自己排污的情况• 想建核电厂的人得在自家草坪堆放核废料• 鼓吹宣战的政客得自己上前线。人性中存在系统性倾向:人们避免对自己的决策承担责任,所以很多反馈缺失;这类杠杆受大众欢迎、不受权势者欢迎。", "tag": "第6章 杠杆点"}, {"front": "杠杆点5——\"系统规则\"指什么?有哪些例子?", "back": "规则定义了系统的范围、边界和自由度,包括激励、惩罚和限制条件。如\"不可杀人\"、宪法言论自由、总统任期4年且连任不超两届、\"合同具有法律效力\"、棒球三击出局、抢劫银行坐牢。物理定律是绝对规则;法律、处罚、激励及非正式社会约定是人为规则,强度依次降低。", "tag": "第6章 杠杆点"}, {"front": "为什么规则是高杠杆点?从什么迹象可以看出规则的力量?", "back": "规则一变,行为随之大变。说客云集首都争夺立法;解释和制定宪法的特别法院甚至比国会权力还大,因为宪法是制定规则的规则。要了解系统功能失调最深刻的原因,就要特别留意规则以及什么人拥有控制规则的权力。改变大学规则(学生评价老师等),情况将大不相同。", "tag": "第6章 杠杆点"}, {"front": "杠杆点4——\"自组织\"指什么?为什么说它是系统最高适应力的表现形式?", "back": "自组织是系统结构增加、变化或进化的力量,即系统通过创造全新的结构和行为彻底改变自身:生物界称进化,社会称技术进步或社会革命。能自我进化的系统可改变自身适应变化、维持生存,可增加新结构、新回路或新规则,如免疫系统应对陌生伤害、大脑冒出新想法。", "tag": "第6章 杠杆点"}, {"front": "为什么鼓励多样性和实验是自组织层面的杠杆点?单一化会带来什么后果?", "back": "自组织需要原材料(如DNA、科研机构和知识存量)、变异来源(基因突变、人的创造力)和测试机制(环境选择、市场竞争)。DNA的巨大多样性是无限进化潜能的来源;单一文化关闭学习大门、削弱适应力——任何系统(生物、经济、社会)若限制实验、不允许差异和多样性,消除了创新的原材料,从长期看注定灭亡。", "tag": "第6章 杠杆点"}, {"front": "杠杆点3——\"目标\"为什么是比自组织更高一级的杠杆点?", "back": "因为推动人们控制、消除多样性的动因正是系统的目标。若目标是把世界置于中央计划控制之下,存量流量、反馈、信息流甚至自组织都可被转化为实现目标的手段。公司真正目标可能不是赢利(那只是规则),而是成长、扩张控制,类似癌症;需更高层次回路加以限制。", "tag": "第6章 杠杆点"}, {"front": "里根的例子如何说明\"改变系统目标\"的杠杆力量?", "back": "里根入主白宫前,美国主流观念是不要问政府能为你做什么,要问你能为政府做什么;里根一再表示目标应是让政府减少干预。他清晰地设定、阐述、重复、支持并坚持了新目标,此后美国的公共政策乃至全球舆论被完全改变。系统中某参与者若有权力设定新目标,就能把千百万人带往新方向。", "tag": "第6章 杠杆点"}, {"front": "杠杆点2——\"社会范式\"指什么?有哪些例子?", "back": "范式是社会公认的观念、潜在基本假设和关于世界如何运作的一系列信念,是人们普遍相信却无须申明的世界观。如:金钱可衡量事物真实价值;成长是好事;大自然是为人服务的资源宝藏;个人可以\"拥有\"土地。古埃及人因相信来世而建金字塔;我们因相信市中心寸土寸金而建摩天大楼。", "tag": "第6章 杠杆点"}, {"front": "为什么说范式是比其他杠杆点力量更大的杠杆?改变范式难在哪、又容易在哪?", "back": "范式是系统之所以成为系统的根源,系统的目标、结构、规则、延迟和参数都受范式直接影响,凡在范式层面推动变革者都产生巨大杠杆效应。它看似最难改变,但范式变革没有物理变化、无需昂贵代价、也无时间延迟,对个人可在毫秒间发生(头脑一闪念);只是社会抵制范式转变远甚于其他变化。", "tag": "第6章 杠杆点"}, {"front": "托马斯·库恩指出可以通过哪些方式改变范式?", "back": "• 持续留意旧范式的异常和失效之处;对新范式不停地宣讲和行动• 加入新范式已占主导地位的环境,切身体验它• 不与反对改革者浪费时间,与积极的变革代理人合作,置身心胸开阔、接纳新事物的人群中• 通过建构系统模型改变范式——建模让人跳出系统、把系统视为整体。", "tag": "第6章 杠杆点"}, {"front": "杠杆点1——\"超越范式\"是什么意思?", "back": "比改变范式更高的杠杆点,是使自己摆脱任何范式的控制,保持灵活性,意识到没有范式才是\"真实\"的。世界太大太复杂,远超人类理解力。人常受范式控制而偏执一端;在超越范式的自主空间里不执著于某一信念,为实现目标可选择任何合适的手段。", "tag": "第6章 杠杆点"}, {"front": "什么是\"空\"(not-knowing)的境界?它与杠杆点有什么关系?", "back": "在自己内心认识到各种范式的存在,并把这一点也视为一种范式,以赤子之心对待整体现实,进入\"空\"的状态。在\"空\"的境界里没有权力与控制,没有决断,内心不执著于某一信念。看似无为,却可能是最根本性、战略性、有效的杠杆点;看似疯狂、放下一切,却能优雅地与系统共舞。", "tag": "第6章 杠杆点"}, {"front": "关于12个杠杆点的整体规律是什么?作者在\"进入谦卑的空\"中给出什么告诫?", "back": "杠杆点编号越小(从12数字到1超越范式),杠杆作用越大,但系统抵制变化的力量也越强——社会甚至会排斥或消灭真正开悟的人。系统高度复杂、特异且动态变化,干预没有一定之规;即使知道杠杆点在哪、往哪个方向推动,也很难理解其效力。必须审慎分析系统、抛弃自己的范式,进入谦卑的\"空\"。", "tag": "第6章 杠杆点"}, {"front": "系统思考者最初常犯的严重错误观念是什么?", "back": "以为借助系统分析和计算机的威力,可以认清系统中的相互联系和复杂纠葛,最终找到预测和控制系统的钥匙。这源于工业时代根深蒂固的心智模式——相信存在一把预测和控制的钥匙。后来作者发现这是错误的,系统思考要用与以往不同的方式。", "tag": "第7章 与系统共舞"}, {"front": "作者从实践中认识到的两个关键问题是什么?", "back": "•理解如何修补一个系统和实际动手去修补它,完全是两码事:连系统思考者自己也不采纳自己的建议,如明知上瘾结构却戒不掉咖啡•系统洞察力会让你产生更多的问题:理解的事情越多,新出现的问题也越多。", "tag": "第7章 与系统共舞"}, {"front": "关于预测与控制,'系统之思'如何概括我们仍然拥有的作为空间?", "back": "未来不可预测,但可以被想象,并在脑海中栩栩如生;系统不可被控制,但可以被设计和重构。放弃控制的错觉后,我们可以预料各种意外、从中学习甚至获益;可以聆听系统的声音,顺应系统特性,使价值观与之匹配,创造出仅靠意志无法实现的事情。", "tag": "第7章 与系统共舞"}, {"front": "要成功地在这个系统的世界里生存,除了计算能力还需要什么?", "back": "需要奉献出全部的人性,包括理性分析、识别真理和谬误的能力、直觉、同理心、对未来的期许以及道德的力量。正如漂流、园艺、演奏音乐和滑雪那样:保持完全清醒、高度关注、竭尽全力,并对各种反馈做出快速响应。", "tag": "第7章 与系统共舞"}, {"front": "生存法则之一'跟上系统的节拍'要求你在干预系统前先做什么?", "back": "首先要观察系统是如何运作的:研究它的历史,询问长期关注它的人,寻找或制作显示系统实际数据时间变化态势的图表(人们的记忆并不可靠)。从系统的行为开始,强迫自己关注事实而非理论,防止快速陷入自己的信念和误解之中。", "tag": "第7章 与系统共舞"}, {"front": "为什么'跟上系统的节拍'要从系统的历史行为数据开始?", "back": "•把思想引导到动态分析:不只问'哪儿出了问题',还问'怎么弄成这样的''继续下去会怎样'•观察真实发生的状况而非人们的解释,规避因果假设•根据系统真实行为定义问题,不被假想趋势分散注意力。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'把你的心智模式展现在阳光下'是什么意思?", "back": "画出系统结构图、写出变量关系方程式,会强迫你把内心隐藏的假设精准地投射、表述出来,且必须完整、符合逻辑、前后一致。不必非用图或方程,用语言、列表、图片、箭头表达想法也可以。表达得越多,想法越清晰,承认不确定性并修正错误的速度就越快。", "tag": "第7章 与系统共舞"}, {"front": "把心智模式放到阳光下时,应如何对待自己和别人的假设?", "back": "牢记你所知道的每一件事都只是一个模型。把模型拿出来,邀请他人挑战你的假设,并补充他们自己的假设——目的不是选出最好的模型,而是尽可能多地收集各种可能的解释,把它们都当合理的,除非有证据可排除。同时警惕自己因情绪或偏好而选择性看待证据。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'相信、尊重并分享信息'的核心主张是什么?", "back": "系统中的大多数错误都是由于信息的偏差、延迟或缺失所致。不能歪曲、延迟或隐瞒信息:扰乱信息流,系统运作就会混乱或疯狂;使信息更及时、准确、完整,系统就运行得更好。信息就是权力,为自身利益过滤引导信息流,是社会系统失控的重要原因之一。", "tag": "第7章 与系统共舞"}, {"front": "美国《有害气体排放法案》如何证明信息公开的力量?", "back": "该法案要求所有公司每年报告排放的有害气体总量,公众可依《信息自由法案》获取。虽然报告的排放并不违法,没有诉讼、强制指标和罚金,但公开本身带来压力:两年内全美化学排放量减少40%,一些公司甚至计划减排90%——只因原本内部保密的信息被公开了。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'谨慎地使用语言,并用系统的概念去丰富语言'包含哪两层?", "back": "•尊重信息首先要避免语言污染,尽可能清晰、准确地使用语言•其次要扩展语言,以便更有效地谈论复杂性。语言不只是描述,它从根本上塑造成员的感知和行动:我们只能看到我们能够讨论的东西,因此语言比战略、组织结构或文化更为根本。", "tag": "第7章 与系统共舞"}, {"front": "书中用哪些例子说明语言退化如何影响社会系统的行为?", "back": "•总谈'生产力'而难用'适应力',社会会更有生产力但适应力降低•不懂'承载能力',社会将很快超过承载能力•'创造利润'的使命会轻视员工在价值创造中的角色•'附带损害'等说法掩盖真实后果。伴随语言退化,个人和社区的衰变也会加剧。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'关注重要的,而不只是容易衡量的'针对什么文化倾向?", "back": "人们对数字着迷,倾向于认为可测量的东西比不能测量的更重要,使数量比质量更受重视。如果某件事难以量化,我们往往视而不见或忽略它,导致模型不完善,并掉进围绕易测量之物设定目标的系统陷阱。上帝赋予人类的不只是数数的能力,也包括评估品质的能力。", "tag": "第7章 与系统共舞"}, {"front": "对正义、民主、自由、爱等无法定义和测量的价值观,应持什么态度?", "back": "没人能定义或测量正义、民主、自由、真理或爱,但人们都离不开它们。不要让'不能定义和测量就不必关注'的说教限制手脚:如果不谈论、不检查它们是否达标、设计系统时不设法实现,它们将不复存在。丑陋、俗气、不可持续、有损人格的东西,就不要让其通过。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'为反馈系统制定带有反馈功能的政策'主张什么?", "back": "对动态的、自我调节的反馈系统,不能用静止的、刚性的政策管制。好的政策必须能随系统状态的变化及时灵活调整;最好的政策不仅要包含反馈回路,还要包含调整回路的回路这一机制,适时改变、纠正或扩大——本质上是把学习功能融入管理过程。", "tag": "第7章 与系统共舞"}, {"front": "吉米·卡特总统曾提出哪两个体现反馈思想的政策?结果如何?", "back": "•石油进口飙升时对汽油征税:进口继续增加则税进一步提高,直到抑制需求;进口降到零则税也为零•与其在边境投入人力物力阻止墨西哥非法移民,不如投资帮墨西哥发展经济,差距缩小后移民潮早晚会停止。两者都因国会和公众不理解反馈而未通过。", "tag": "第7章 与系统共舞"}, {"front": "《蒙特利尔议定书》为什么是'带有反馈功能的政策'的范例?", "back": "1987年签署时,人们对臭氧层破坏的速度、危害性都不确定,议定书因此规定:持续监测臭氧层变化,根据实际破坏状况与预期的差距,重新召开国际会议,调整淘汰危险化学品的时间表。结果1990年议定书被重新调整,加快减排速度并增加了更多化学物质。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'追求整体利益'的核心要求是什么?", "back": "层级组织存在的目的是服务于最底层,而非最顶层。不能放大部分或子系统的重要性,使其凌驾于系统整体之上,犯'一叶障目,不见泰山'的错误。要瞄准能增强系统整体性能的要素:增长、稳定性、多样性、适应力和可持续性,不管它们是否容易衡量。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'聆听系统的智慧'要求干预者怎样做?", "back": "帮助并鼓励那些有助于系统自我运行的力量和结构(注意其中多数位于层级底部);不要做粗鲁莽撞的干预者,破坏系统内在的自我调节能力;介入前先关注已有的价值。如危地马拉当地中小企业本已高效创造就业,需要的是小额贷款等内部支持而非外部投资者。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'界定系统的职责'所说的'增强内在责任'指什么?", "back": "在设计系统时,在决策及其结果之间建立反馈回路,让决策者直接、快速、强制性地看到其行为的后果,就像飞行员位于飞机前部、面对所有仪表,能直接了解每个决策的后果。只责怪或控制外部影响,会忽视系统内部职责;系统内部总有较简单的办法可增强自身职责。", "tag": "第7章 与系统共舞"}, {"front": "书中列举了哪些'让参与者承担内在责任'的设计?", "back": "•城镇或公司把取水口设在下游、排水口设在上游,废水不达标马上可见并自担后果•吸烟致病、不戴头盔、不系安全带造成的医疗费用,保险或社保不予赔付•国会立法不得包含自身免责的豁免条款•统治者可以宣战却无须亲征,很大一部分责任就失去了。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'保持谦逊,做一名学习者'主张面对未知怎么办?", "back": "每个人的心智模式都不完整,而世界如此复杂,我们永远有很多不知道的东西。发现自己不知道时,不要虚张声势或回避,而是学习——通过试验和'试错'来学习。应采取幅度小而稳妥的措施,持续监控,认真观察系统方向,愿意顺势而为、改变路线。", "tag": "第7章 与系统共舞"}, {"front": "什么是心理学家唐·迈克尔所说的'拥抱失误'?", "back": "就是在系统世界里承认并接受犯错:搜索、使用和分享'我们到底在什么地方失误了'的信息。拥抱失误需要很大勇气,它和承受高度不确定性会强化个人和社会的脆弱性,但拥抱失误正是学习的条件;假装一切尽在掌握,只会降低可信度,无法从失败中学习。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'庆祝复杂性'为什么主张拥抱混乱而非消除它?", "back": "大千世界是非线性的、动态变化、自组织的,始终处于进化之中,同时演化出多样化和统一性——正因如此世界才异彩纷呈。大脑偏爱直线、整数和确定无疑,但大自然的设计是分形的:哥特式大教堂、波斯地毯、交响曲都是复杂性的展现,应欢庆自组织、无序和变异。", "tag": "第7章 与系统共舞"}, {"front": "利奥波德的'土地伦理'提出了什么对错标准?", "back": "当某件事倾向于保护生物群落的一致性、稳定性和自然之美时,它就是对的,否则就是错的。这被书中作为把'欢庆复杂性'上升为道德准则的例子,说明人们可以把自组织、无序、变异和多样性作为值得遵循的价值。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'扩展时间的范围'为何把利息称为人类最糟糕的发明之一?", "back": "由利息产生了回收期、贴现率等概念,它们都为人们忽略长期利益提供了借口。工业社会企业和政府考虑的时间范围只限于回收期或任期,远小于家庭的时间范围,而很多美洲原住民文化的决策考虑长达未来七代。考虑的时间范围越长,生存的机会就会越好。", "tag": "第7章 与系统共舞"}, {"front": "按照系统理论,'长期'与'短期'是什么关系?我们该如何兼顾?", "back": "严格来讲没有长期和短期的区分,不同时间范围的现象彼此相互嵌套和依托:此刻的行动除即刻效果外,也可能在未来很久仍有影响;我们此刻都正经历着他人昨年乃至数百年前行动的影响。就像走崎岖小路,既要关注长期(前方路况),又要留意短期(脚下状况)。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'打破各种清规戒律'主张如何对待学科与专家?", "back": "不要盲从专业、教科书或专家的说法,放弃所有规则,紧紧遵从系统的指引。必须向生态学家、化学家、心理学家、神学家等学习,取其精华、去其糟粕,整合融会贯通。跨领域要奏效,须有真实待解决的问题,各方真心参与、进入学习模式,并愿向系统学习。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'扩大关切的范围'在系统思考上为何必不可少?", "back": "真正的系统是相互连接的,人类任何一部分都与他人及整个地球生态系统不可分割。如肺不工作心脏无法跳动、员工不干公司无法运作、洛杉矶穷人不在富人也不复存在、全球环境被破坏经济将难以为继。在这个问题上,道德规范与系统思考的原则是一致的。", "tag": "第7章 与系统共舞"}, {"front": "生存法则'不要降低善的标准'针对的是哪个系统基模?其危险实例是什么?", "back": "针对'目标侵蚀'基模,最危险的实例是现代工业文明正慢慢侵蚀人们的美德表现。若把不良行为视为稀疏平常,期望就会降低,被确认为理想的行为更少,舆论充满愤世嫉俗,讲理想反遭嘲笑。应对之道:不过度关注坏消息,保持客观标准,不能降低。", "tag": "第7章 与系统共舞"}, {"front": "全书结语:系统思考与'知''行'之间鸿沟的关系是什么?", "back": "系统思考只能告诉我们该做什么,但它本身不会去做。知易行难,系统思考虽然不能填补知与行之间的鸿沟,但可以引领我们来到鸿沟的边缘,让我们更好地进行分析,继而找到突破点——从人类精神的角度,告诉我们能做什么,以及必须做什么。", "tag": "第7章 与系统共舞"}];
const grid = document.getElementById('grid');
let activeTag = '', kw = '';

function render() {
  grid.innerHTML = '';
  let shown = 0;
  CARDS.forEach((c, i) => {
    if (activeTag && c.tag !== activeTag) return;
    if (kw && !(c.front + c.back + c.tag).toLowerCase().includes(kw)) return;
    shown++;
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="inner">
        <div class="face front">
          <div class="tagline"><span class="tagpill">${c.tag}</span><span class="num">#${i+1}</span></div>
          <div class="q">${c.front}</div>
          <div class="hint">点击翻面 ▸</div>
        </div>
        <div class="face back">
          <div class="tagline"><span class="tagpill">${c.tag}</span><span class="num">#${i+1}</span></div>
          <div class="a">${c.back}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => el.classList.toggle('flipped'));
    grid.appendChild(el);
  });
  document.getElementById('meta').textContent = `当前显示 ${shown} 张`;
}
document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  ch.classList.add('active');
  activeTag = ch.dataset.tag;
  render();
}));
document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});
render();
</script>
