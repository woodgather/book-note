<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《打造第二大脑》· Anki 记忆卡片</title>
<style>
  :root {
    color-scheme: light;
    --paper: #F4F5F1;
    --card: #FFFFFF;
    --ink: #22313C;
    --ink-2: #3C4C58;
    --ink-soft: #74838D;
    --rule: #DDE1D9;
    --rule-2: #E9ECE5;
    --stamp-red: #A8432F;
    --c0: #2F6BBF;  /* 总览·CODE */
    --c1: #2E8B62;  /* 抓取 */
    --c2: #B0722A;  /* 组织·PARA */
    --c3: #7A5CC4;  /* 提炼 */
    --c4: #C64B78;  /* 表达 */
    --c5: #23817A;  /* 创作策略 */
    --c6: #5661B8;  /* 习惯与心法 */
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: min(860px, 94vw); padding: 44px 0 72px; }

  /* ---------- 页头 ---------- */
  header.masthead { margin-bottom: 8px; }
  .masthead h1 {
    font-family: var(--serif);
    font-size: clamp(26px, 4.4vw, 36px);
    font-weight: 700;
    letter-spacing: .05em;
    line-height: 1.35;
  }
  .masthead .sub {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.8;
    max-width: 46em;
  }
  .masthead .sub b { color: var(--stamp-red); font-weight: 600; }

  /* ---------- 分类筛选 ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 4px; }
  .chip {
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink-2);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .chip:hover { border-color: var(--ink-soft); }
  .chip.on { border-color: var(--ink); background: var(--ink); color: #fff; }
  .chip.on .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.55); }
  .chip .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; vertical-align: 1px;
  }
  .chip .n { opacity: .6; margin-left: 3px; font-variant-numeric: tabular-nums; }

  /* ---------- 工具行 ---------- */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin: 20px 0 14px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap;
  }
  .toolbar .mode { display: flex; gap: 6px; }
  .tbtn {
    border: 1.5px solid var(--rule); background: var(--card); color: var(--ink-2);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
    transition: all .15s ease;
  }
  .tbtn:hover { border-color: var(--ink); color: var(--ink); }
  .tbtn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .known-stat { font-variant-numeric: tabular-nums; }

  .progress-track { height: 3px; background: var(--rule); border-radius: 2px; margin-bottom: 26px; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--ink); border-radius: 2px; transition: width .25s ease; }

  /* ---------- 翻卡（网格堆叠：高度随内容自适应，长答案不溢出） ---------- */
  .stage { perspective: 1800px; }
  .flashcard {
    position: relative;
    display: grid;
    width: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.25,.7,.25,1);
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 26px clamp(22px, 4.5vw, 44px) 58px;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 2px rgba(34,49,60,.05), 0 14px 34px -18px rgba(34,49,60,.28);
  }
  .face--back { transform: rotateY(180deg); }
  /* 索引卡双线 */
  .face::before {
    content: "";
    position: absolute; left: clamp(18px, 4vw, 36px); right: clamp(18px, 4vw, 36px); top: 66px;
    border-top: 1.5px solid currentColor;
    border-bottom: 1px solid currentColor;
    height: 4px; opacity: .38;
  }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 30px; }
  .cat-tag { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); letter-spacing: .04em; }
  .cat-tag .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .card-no {
    font-size: 12px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--rule); border-radius: 5px; padding: 3px 9px;
    white-space: nowrap;
  }
  .card-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 4px; }

  /* 问题：衬线体，大字号，作为页面主角 */
  .q-text {
    font-family: var(--serif);
    font-size: clamp(21px, 3.1vw, 27px);
    font-weight: 700;
    line-height: 1.75;
    letter-spacing: .015em;
    max-width: 24em;
    text-wrap: balance;
  }
  /* 答案：为长时间阅读优化的正文排版 */
  .a-text {
    font-size: 16px;
    line-height: 2.0;
    color: var(--ink-2);
    max-width: 40em;
    letter-spacing: .012em;
  }
  .a-text p + p { margin-top: .7em; }
  .a-text .lead { color: var(--ink); font-weight: 650; }
  .a-text .num { color: var(--accent, var(--ink-soft)); font-weight: 600; margin-right: 2px; }
  .a-text ul.pts { list-style: none; margin-top: 4px; }
  .a-text ul.pts li {
    position: relative;
    padding-left: 1.35em;
    margin-top: .55em;
  }
  .a-text ul.pts li::before {
    content: "";
    position: absolute; left: .1em; top: 1.05em;
    width: .55em; height: 2px;
    background: var(--accent, var(--ink-soft));
    opacity: .75; border-radius: 1px;
  }
  .a-text b, .a-text strong { color: var(--ink); font-weight: 650; }
  .a-text .hl {
    color: var(--accent, var(--ink));
    font-weight: 650;
  }

  .hint {
    position: absolute; bottom: 20px; left: clamp(22px, 4.5vw, 44px);
    font-size: 12px; color: var(--ink-soft); letter-spacing: .06em;
  }
  .src {
    position: absolute; bottom: 20px; right: clamp(22px, 4.5vw, 44px);
    font-size: 12px; color: var(--ink-soft); letter-spacing: .03em;
  }
  /* 分类印章 */
  .seal {
    position: absolute; top: 18px; right: 22px;
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid; opacity: .5;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-weight: 700; font-size: 17px;
    transform: rotate(7deg);
    pointer-events: none;
  }

  /* ---------- 卡下操作 ---------- */
  .nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  .nav button {
    border: 1.5px solid var(--rule); background: var(--card); color: var(--ink);
    border-radius: 9px; padding: 10px 20px; font-size: 14px; cursor: pointer; font-family: inherit;
    transition: all .15s ease;
  }
  .nav button:hover { border-color: var(--ink); }
  .nav button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .nav button.primary:hover { opacity: .88; }
  .nav button.ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .nav button.ghost:hover { color: var(--ink); }
  .nav button.ghost.is-known { color: var(--c1); }
  .nav .flip-btn { border-color: var(--ink); font-weight: 600; letter-spacing: .08em; }
  .counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); margin-top: 16px; text-align: center; }
  .counter .known-flag { color: var(--c1); }

  kbd {
    font-family: inherit; font-size: 11px; border: 1px solid var(--rule);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--card); color: var(--ink-soft);
  }

  /* ---------- 浏览模式 ---------- */
  .browse { display: none; flex-direction: column; gap: 10px; }
  .browse.on { display: flex; }
  .stage.hide, .nav.browse-only { display: none; }
  .bcard {
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 18px 24px; cursor: pointer;
    transition: border-color .15s ease;
  }
  .bcard:hover { border-color: var(--ink-soft); }
  .bcard .bq { font-family: var(--serif); font-weight: 700; font-size: 16.5px; line-height: 1.7; display: flex; gap: 11px; align-items: baseline; }
  .bcard .bq .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; position: relative; top: -2px; }
  .bcard .ba {
    display: none; margin-top: 12px; padding-top: 14px;
    border-top: 1px dashed var(--rule);
    font-size: 15px; line-height: 1.95; color: var(--ink-2);
  }
  .bcard .ba ul.pts { list-style: none; margin-top: 4px; }
  .bcard .ba ul.pts li { position: relative; padding-left: 1.35em; margin-top: .5em; }
  .bcard .ba ul.pts li::before {
    content: ""; position: absolute; left: .1em; top: 1.02em;
    width: .55em; height: 2px; background: var(--ink-soft); opacity: .7; border-radius: 1px;
  }
  .bcard .ba b, .bcard .ba strong { color: var(--ink); }
  .bcard.open .ba { display: block; }
  .bcard .bsrc { display: block; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }

  footer { margin-top: 40px; font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.9; }

  @media (max-width: 600px) {
    .wrap { padding-top: 30px; }
    .card-top { margin-bottom: 24px; }
    .face::before { top: 58px; }
    .seal { width: 36px; height: 36px; font-size: 14px; }
    .a-text { font-size: 15px; line-height: 1.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flashcard { transition: none; }
    .flashcard.flipped { transform: none; }
    .flashcard.flipped .face--front { visibility: hidden; }
    .flashcard.flipped .face--back { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>《打造第二大脑》记忆卡片</h1>
    <p class="sub">蒂亚戈·福特 · <b>信管法则 CODE</b>（抓取 — 组织 — 提炼 — 表达）· 共 <span id="total"></span> 张 · 点击卡片或按 <kbd>空格</kbd> 翻面，<kbd>←</kbd><kbd>→</kbd> 切换，<kbd>K</kbd> 标记掌握</p>
    <div class="chips" id="chips"></div>
  </header>

  <div class="toolbar">
    <div class="mode">
      <button class="tbtn on" id="mStudy">学习模式</button>
      <button class="tbtn" id="mBrowse">浏览全部</button>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="known-stat" id="knownCount"></span>
      <button class="tbtn" id="btnShuffle">打乱顺序</button>
      <button class="tbtn" id="btnReset">重置</button>
    </div>
  </div>
  <div class="progress-track"><div class="progress-bar" id="pbar"></div></div>

  <div class="stage" id="stage">
    <div class="flashcard" id="card">
      <div class="face face--front" id="faceF">
        <div class="card-top"><span class="cat-tag" id="tagF"></span><span class="card-no" id="noF"></span></div>
        <div class="seal" id="sealF"></div>
        <div class="card-body"><p class="q-text" id="qText"></p></div>
        <span class="hint">点击卡片，查看答案 ↓</span>
        <span class="src" id="srcF"></span>
      </div>
      <div class="face face--back" id="faceB">
        <div class="card-top"><span class="cat-tag" id="tagB"></span><span class="card-no" id="noB"></span></div>
        <div class="seal" id="sealB"></div>
        <div class="card-body"><div class="a-text" id="aText"></div></div>
        <span class="hint">点击卡片，返回问题 ↑</span>
        <span class="src" id="srcB"></span>
      </div>
    </div>
    <div class="nav">
      <button id="prevBtn">← 上一张</button>
      <button class="flip-btn primary" id="flipBtn">翻 面</button>
      <button id="nextBtn">下一张 →</button>
      <button class="ghost" id="knownBtn" title="标记为已掌握（K）">✓ 已掌握</button>
    </div>
    <p class="counter" id="counter"></p>
  </div>

  <div class="browse" id="browse"></div>

  <footer>卡片依据《打造第二大脑》（民主与建设出版社·后浪，2023）正文提炼 · 七大类别 · 适合日常自测与间隔重复复习</footer>
</div>

<script>
const CATS = [
  { name: "总览 · CODE",  color: "var(--c0)", seal: "总" },
  { name: "抓取 Capture", color: "var(--c1)", seal: "抓" },
  { name: "组织 PARA",    color: "var(--c2)", seal: "组" },
  { name: "提炼 Distill", color: "var(--c3)", seal: "炼" },
  { name: "表达 Express", color: "var(--c4)", seal: "达" },
  { name: "创作策略",     color: "var(--c5)", seal: "创" },
  { name: "习惯与心法",   color: "var(--c6)", seal: "心" },
];

/* 答案排版约定：<p> 段落；<ul class="pts"> 要点列表；
   <span class="hl"> 类别色强调；<b> 关键词加重；<i class="num"> 序号 */
const CARDS = [
 /* ———— 总览 · CODE ———— */
 { c:0, q:"什么是“第二大脑”？",
   a:`<p>一套<span class="hl">数字档案系统</span>，用于存储你最宝贵的记忆、想法和知识，帮助你更轻松地完成工作、经营业务和管理生活，<b>无须耗费大量脑力记忆烦琐信息</b>。</p>
      <p>它好比装在口袋里的个人图书馆；又如乔布斯所说的“心灵单车”——技术作为思考工具，能放大人的认知能力。</p>`,
   s:"序 / 第二章" },
 { c:0, q:"第二大脑的四大“超能力”是什么？",
   a:`<ul class="pts">
      <li>推动抽象思维的<span class="hl">具象化</span>——如沃森、克里克借助折纸模型发现 DNA 双螺旋；</li>
      <li>促进不同思想间的<span class="hl">融会贯通</span>；</li>
      <li>辅助<span class="hl">长期决策规划</span>，摆脱“近期偏差”；</li>
      <li>形成<span class="hl">鲜明而独到的观点</span>。</li>
      </ul>`,
   s:"第三章" },
 { c:0, q:"“信管法则（CODE）”的四大步骤是？",
   a:`<ul class="pts">
      <li><span class="hl">C</span>apture 抓取——只记录真正打动你的信息；</li>
      <li><span class="hl">O</span>rganize 组织——以行动为导向归置笔记；</li>
      <li><span class="hl">D</span>istill 提炼——层层萃取笔记的精华；</li>
      <li><span class="hl">E</span>xpress 表达——将知识转化为成果分享。</li>
      </ul>
      <p>它既是入门方法又是长期策略，兼具灵活性和普适性，不受专业、职业和笔记工具的限制。</p>`,
   s:"第三章" },
 { c:0, q:"个人知识管理的三个阶段（第二大脑的层层进阶用途）？",
   a:`<ul class="pts">
      <li><span class="hl">识记</span>：作为记忆辅助工具，保存易忘的事件与想法；</li>
      <li><span class="hl">联结</span>：串联不同想法，从记忆工具进化为思维工具；</li>
      <li><span class="hl">创新</span>：以积累的资料开拓创造——这是第二大脑的终极用途。</li>
      </ul>`,
   s:"第三章 / 第七章" },
 { c:0, q:"数字笔记应用成为理想第二大脑的四大特质？",
   a:`<ul class="pts">
      <li><span class="hl">多媒体</span>：文字、图像、音频皆可安放；</li>
      <li><span class="hl">非正式</span>：包容杂乱，利于捕捉灵感；</li>
      <li><span class="hl">开放性</span>：淡化目的性，鼓励自由探索；</li>
      <li><span class="hl">行为导向</span>：捕获稍纵即逝的闪念，让人专注手头工作。</li>
      </ul>`,
   s:"第三章" },
 { c:0, q:"什么是“近期偏差”？第二大脑如何对抗它？",
   a:`<p><span class="hl">近期偏差</span>：人们对某种设想或方案的偏好，往往取决于<b>时间维度上的邻近程度</b>，而非对象本身的优劣。</p>
      <p>第二大脑以“<span class="hl">文火慢焙</span>”对抗——把日常点滴灵感登记在案，让创意循序渐进地积累，而非仓促临场发挥。</p>`,
   s:"第三章" },

 /* ———— 抓取 ———— */
 { c:1, q:"“知识资本”来自哪两类渠道？各包含哪些形式？",
   a:`<ul class="pts">
      <li><span class="hl">外部</span>：亮点（书中段落）、引文、书签与收藏夹、语音备忘、会议笔记、图像、启示；</li>
      <li><span class="hl">内部</span>：故事、见解、记忆、反思、冥想（浴室灵感）。</li>
      </ul>
      <p>两类皆是可从生活阅历中淘出的“金砂”。</p>`,
   s:"第四章" },
 { c:1, q:"哪四类内容不适合存入数字笔记？",
   a:`<ul class="pts">
      <li><span class="hl">敏感或涉密信息</span>：税务记录、密码、健康记录等；</li>
      <li>需要<span class="hl">专门应用打开</span>的特殊格式：如 PSD、视频片段；</li>
      <li><span class="hl">容量巨大</span>的文件：会影响笔记应用运行效率；</li>
      <li>需要<span class="hl">协同编辑</span>的信息：应选用专业协作平台。</li>
      </ul>`,
   s:"第四章" },
 { c:1, q:"费曼的“十二个兴趣问题”是怎样一种信息抓取法？",
   a:`<p>在脑海中常备<span class="hl">一打开放式</span>的兴趣问题，每当接触新发现、新技术，就用这十二个问题逐一测试，看能否带来新启发——在保持好奇心的同时，把看似无关的事物<b>建立联系</b>。</p>
      <ul class="pts">
      <li>使用开放式措辞，不求唯一答案；</li>
      <li>不必凑满十二个，数量并非重点；</li>
      <li>清单不须完美，可随人生阶段不断改进。</li>
      </ul>`,
   s:"第四章" },
 { c:1, q:"判断一条信息是否值得抓取的四大标准？",
   a:`<ul class="pts">
      <li><span class="hl">启发性</span>：灵感可遇不可求，值得珍藏；</li>
      <li><span class="hl">实用性</span>：如木匠的边角料，日后可能派上大用；</li>
      <li><span class="hl">个性</span>：个人观点、反思与记忆，最具保存价值；</li>
      <li><span class="hl">新奇性</span>：让你耳目一新的东西（香农对信息的定义），而非确认既有信念。</li>
      </ul>`,
   s:"第四章" },
 { c:1, q:"信息抓取的终极标准是什么？",
   a:`<p>是否让你<span class="hl">为之共鸣</span>——让笔记“走心”。</p>
      <p>情感会引导而非扰乱理性：<b>心跳漏了一拍、世界一时静止</b>，就是直觉在提醒你记下来。无须深究原因，只须遵从内心的快感、好奇与悸动。</p>`,
   s:"第四章" },
 { c:1, q:"抓取摘录的篇幅应控制在什么比例？为什么？",
   a:`<p><span class="hl">至多不超过原文的 10%</span>。超过这一比例，会大大增加日后重温的难度。</p>
      <p>要像博物馆长一样挑剔：只摘精选段落、精彩桥段、有趣片段，并保留原文链接，以便日后跳转溯源。</p>`,
   s:"第四章" },
 { c:1, q:"什么是“生成效应”（Generation Effect）？",
   a:`<p>相比单纯阅读，当人们通过<b>读或写主动生成</b>词语时，更多脑区会被激活，信息更易记忆。</p>
      <p>将头脑中的想法写下来本身就是有效的“复习”；写作既来源于思考，又有助于思考。</p>`,
   s:"第四章" },
 { c:1, q:"为什么说抓取信息要有“管理者视角”？",
   a:`<p>信息会源源不断地涌来，我们必须扮演信息流的<span class="hl">评价者、编辑者和诠释者</span>，掌控信息流而非随波逐流。</p>
      <p>抓取时越经济有效，日后组织、提取和传播时就<b>越省时省力</b>。</p>`,
   s:"第四章" },

 /* ———— 组织 · PARA ———— */
 { c:2, q:"PARA 系统的四大类别分别是什么？",
   a:`<ul class="pts">
      <li><span class="hl">P</span>roject 项目：正在进行的短期活动；</li>
      <li><span class="hl">A</span>rea 领域：长期履行的责任；</li>
      <li><span class="hl">R</span>esource 资源：具有潜在利用价值的课题或兴趣；</li>
      <li><span class="hl">A</span>rchive 存档：前三类之外的休眠信息。</li>
      </ul>`,
   s:"第五章" },
 { c:2, q:"“项目”与“领域”的核心区别是什么？",
   a:`<ul class="pts">
      <li><span class="hl">项目</span>有始有终：经特定周期后，以明确结果宣告终结（定案、发布、出版）；</li>
      <li><span class="hl">领域</span>没有结束日期（如理财、健康）：没有具体目标，但有需要长期坚持的<b>标准</b>（按时付账、每周锻炼若干次）。</li>
      </ul>`,
   s:"第五章" },
 { c:2, q:"一条笔记如何用 PARA 速查表决定归宿？",
   a:`<ul class="pts">
      <li>它对哪个<span class="hl">项目</span>最有帮助？</li>
      <li>若无——对哪个<span class="hl">领域</span>最有帮助？</li>
      <li>若无——它属于哪种<span class="hl">资源</span>？</li>
      <li>都不是——归入<span class="hl">存档</span>。</li>
      </ul>`,
   s:"第五章" },
 { c:2, q:"为什么信息组织要“以行动为导向”而非按主题分类？",
   a:`<p>主题分类（如“心理学”）过于宽泛，数月后极难定位。按项目保存，只需回答：“这条信息放在<span class="hl">哪个项目里最管用</span>？”</p>
      <p>这还天然过滤了冗余信息——兼具可行性和相关性的信息，本来就不多。</p>`,
   s:"第五章" },
 { c:2, q:"PARA 的厨房比喻是什么？",
   a:`<ul class="pts">
      <li>项目＝<span class="hl">炉子上的锅</span>：烹饪进行时；</li>
      <li>领域＝<span class="hl">冰箱</span>：近期使用、频繁查找；</li>
      <li>资源＝<span class="hl">食品柜</span>：不碍事但随时可用；</li>
      <li>存档＝<span class="hl">冰柜</span>：冷冻备日后。</li>
      </ul>
      <p>按食材的“用途”而非“种类”摆放。</p>`,
   s:"第五章" },
 { c:2, q:"为什么信息的抓取和组织必须分为两个独立步骤？",
   a:`<p>初次接触信息时，既<b>没时间判断</b>其性质与最终用途；边记录边归类，还会增加心理负担、降低抓取积极性。</p>
      <p>应先存入“收件箱”或“每日一记”中转，之后再（如每周小结时）<span class="hl">批量分类</span>。</p>`,
   s:"第五章" },
 { c:2, q:"单条笔记在 PARA 四类之间应如何流动？",
   a:`<p>笔记<span class="hl">没有固定归宿</span>。例如一份培训笔记：</p>
      <ul class="pts">
      <li>参加培训时 → 存入“培训课程”<b>项目</b>文件夹；</li>
      <li>成为经理后 → 移入“下属”<b>领域</b>文件夹；</li>
      <li>离职后 → 归入<b>资源</b>；失去热情 → 转入<b>存档</b>；</li>
      <li>重操旧业 → 再度激活，回归<b>项目</b>。</li>
      </ul>
      <p>PARA 是动态系统，随人生季节变迁。</p>`,
   s:"第五章" },
 { c:2, q:"什么是“大教堂效应”？",
   a:`<p>研究发现，环境会影响思维模式：身处<span class="hl">开阔空间</span>（如宏伟教堂）时思维格局明显打开，处于逼仄空间时思考更具体。</p>
      <p>数字环境同理——第二大脑不只是工具，更是需要精心营造的<b>思考环境</b>。</p>`,
   s:"第五章" },

 /* ———— 提炼 ———— */
 { c:3, q:"“渐进式归纳法”的四个层级是什么？",
   a:`<ul class="pts">
      <li><i class="num">①</i> 原始摘录：只保留最好、最重要、最相关的文字；</li>
      <li><i class="num">②</i> <span class="hl">黑色加粗</span>主要内容；</li>
      <li><i class="num">③</i> <span class="hl">黄色高亮</span>最精华的部分；</li>
      <li><i class="num">④</i> 在顶部<span class="hl">用自己的语言写纲要</span>（项目符号式）。</li>
      </ul>
      <p>四层级比喻：土壤 → 原油 → 黄金 → 宝石。</p>`,
   s:"第六章" },
 { c:3, q:"渐进式归纳法每层标记的篇幅原则是什么？",
   a:`<p>每一层级的重点，<span class="hl">不应超过上一层级内容的 10%～20%</span>。</p>
      <p>例如 500 字摘录：第二层级加粗不超过 100 字，第三层级高亮不超过 20 字——见好就收。“什么都想要，最后什么都得不到。”</p>`,
   s:"第六章" },
 { c:3, q:"笔记的“可见性”指什么？为什么重要？",
   a:`<p>指信息内涵与用途的<span class="hl">易见度、易搜寻度</span>。笔记的体量与可见性成<b>反比</b>——越翔实，越难重温。</p>
      <p>把未来的自己想象成一位忙碌、挑剔、缺乏耐心的客户：你的笔记，是他 30 秒内读得懂的“期货”。</p>`,
   s:"第六章" },
 { c:3, q:"应该什么时候对笔记做提炼？",
   a:`<p>在<span class="hl">准备创作时</span>——如写博客前、与律师通话前，对相关笔记画重点，作为正式工作的“热身”。</p>
      <p>无目标的地毯式提炼是亏本生意：<b>惊人的时间投入，换来不确定的回报</b>。</p>`,
   s:"第六章" },
 { c:3, q:"笔记新手标记重点的三个常见错误？",
   a:`<ul class="pts">
      <li><span class="hl">过度标记</span>：整章画重点，只会加重日后的重温负担；</li>
      <li><span class="hl">缺乏明确目标</span>：不为提炼而提炼；</li>
      <li><span class="hl">故作高深</span>：不必费时分析归类，听从直觉——打动你的就是重点。</li>
      </ul>`,
   s:"第六章" },
 { c:3, q:"信息管理的铁律：“接触信息”与“改善信息”的关系？",
   a:`<p>二者必须<span class="hl">同步进行</span>：每接触一次笔记，就让它更好一点（画重点、加标题、加注释），形成“访问越频繁、发掘越深入”的循环。</p>
      <p>这一原则被称为“信息协同”（stigmergy），源自蚁群沿途留下信息素的策略。</p>`,
   s:"第六章" },
 { c:3, q:"毕加索《公牛》与肯·伯恩斯纪录片的案例共同说明什么？",
   a:`<p>提炼之道＝<span class="hl">断舍离</span>。</p>
      <ul class="pts">
      <li>毕加索用 11 幅石版画逐步剥离公牛细节——先予后取；</li>
      <li>伯恩斯的纪录片原始镜头采用率高达 <span class="hl">40～50 : 1</span>。</li>
      </ul>
      <p>结果之“简”掩盖了过程之“繁”——有舍才能有得。</p>`,
   s:"第六章" },

 /* ———— 表达 ———— */
 { c:4, q:"什么是“半熟素材”（Intermediate Packets）？",
   a:`<p>构建最终作品所必需的、<span class="hl">个别的、具体的创作元素</span>：会议纪要、研究成果、头脑风暴、幻灯片、行动清单等。</p>
      <p>任何一则笔记都可能在更高级别的项目中扮演半熟素材。它们是你的<b>知识资产</b>，可反复利用，让创作不再“从零开始”。</p>`,
   s:"第七章" },
 { c:4, q:"五种易于创建和再利用的半熟素材？",
   a:`<ul class="pts">
      <li><span class="hl">干货笔记</span>：通读提炼后的精要梗概；</li>
      <li><span class="hl">落选素材</span>：被历史项目弃用但有潜力的材料；</li>
      <li><span class="hl">过程性文件</span>：文档、图片、日程、计划等；</li>
      <li><span class="hl">最终成果</span>：可复用的交付物；</li>
      <li><span class="hl">他山之石</span>：他人创造的可借鉴资产（须标明出处）。</li>
      </ul>`,
   s:"第七章" },
 { c:4, q:"检索半熟素材的四种方法？各自的适用场景？",
   a:`<ul class="pts">
      <li><span class="hl">搜索</span>（首选）：知道目标关键词时，几秒钟内定位；</li>
      <li><span class="hl">浏览</span>：按 PARA 文件夹层层定位，更符合人类的空间思维；</li>
      <li><span class="hl">标签</span>：跨分类批量聚合笔记（如“常见问答”）；</li>
      <li><span class="hl">随缘</span>：为机缘巧合创造条件——多元素材集中存放、图文并茂、与人分享。</li>
      </ul>`,
   s:"第七章" },
 { c:4, q:"使用“标签”的建议原则是什么？",
   a:`<p>不作为<span class="hl">首选</span>管理手段——打标签极耗精力。</p>
      <p>它适用于特殊情况：需要干净利落地<b>自动收集、关联</b>大量笔记，而搜索和浏览难以奏效时。不必移动笔记原位，打上标签即可一网打尽。</p>`,
   s:"第七章" },
 { c:4, q:"“只启动那些已经完成了 80% 的项目”是什么意思？",
   a:`<p>只从事已具备大部分前期工作（信息抓取、组织、提炼）的项目，确保自己<span class="hl">永远不会启动一项无法完成的工程</span>。</p>
      <p>看似悖论，实则让开工只剩“拼装”环节，毫无压力。</p>`,
   s:"第七章" },
 { c:4, q:"“信管法则”创造力理论的核心：混搭（Kitbashing）指什么？",
   a:`<p>创造力源自<span class="hl">对既有事物的混搭重组</span>——《星球大战》特效用预制军事模型配件拼装新模型，即“配件混搭”。</p>
      <p>没有谁能够无中生有；借鉴闪光部分并<b>标明出处</b>，非但不淡化你的贡献，反而更加彰显它。</p>`,
   s:"第七章" },

 /* ———— 创作策略 ———— */
 { c:5, q:"“发散与聚合”模型与 CODE 如何对应？",
   a:`<ul class="pts">
      <li><span class="hl">发散</span>＝抓取＋组织：研究、探索、萌发创意，放飞想象；</li>
      <li><span class="hl">聚合</span>＝提炼＋表达：停止吸纳，筛选淘汰，朝最终方案冲刺。</li>
      </ul>
      <p>二者<b>循环往复</b>，而非线性顺序——完成一轮聚合后，带着经验进入新的发散周期。</p>`,
   s:"第八章" },
 { c:5, q:"成就创造性工作的三大策略是什么？",
   a:`<ul class="pts">
      <li><span class="hl">思想群岛</span>：创作的立足点；</li>
      <li><span class="hl">海明威之桥</span>：以今日思路为明日蓄力；</li>
      <li><span class="hl">压缩范围</span>：力求小而具体，砍掉无关部分保交付。</li>
      </ul>`,
   s:"第八章" },
 { c:5, q:"什么是“思想群岛”？",
   a:`<p>新项目开工前，把收集的想法、素材、观点摆成星罗棋布的“岛屿”（数字大纲），创作只是<span class="hl">在岛屿间搭桥</span>。</p>
      <p>关键在于把“<b>选择想法</b>”（发散）与“<b>逻辑排序</b>”（聚合）拆成两步，对抗从零开始的茫然与拖延。</p>`,
   s:"第八章" },
 { c:5, q:"数字大纲相比纸质大纲有哪些优点？",
   a:`<ul class="pts">
      <li>更具<span class="hl">延展性</span>：自由增删、重排、加粗、高亮；</li>
      <li>可<span class="hl">链接</span>细节：要点简明，细节一键跳转；</li>
      <li><span class="hl">交互式</span>：可嵌入图像、动图、附件、复选框；</li>
      <li>易于<span class="hl">搜索</span>，且访问与编辑<span class="hl">不受空间局限</span>（跨设备同步）。</li>
      </ul>`,
   s:"第八章" },
 { c:5, q:"什么是“海明威之桥”？",
   a:`<p>海明威在明确后续思路时<span class="hl">立刻停下</span>当前章节——不等文思耗尽。用今天的精力为明天搭桥。</p>
      <p>落地方法：阶段结束前在笔记中写下——</p>
      <ul class="pts">
      <li>下一步的想法；</li>
      <li>当前状态与最大挑战；</li>
      <li>易被遗忘的重要信息；</li>
      <li>下一阶段的工作目标。</li>
      </ul>
      <p>如此，潜意识会在后台持续为你工作。</p>`,
   s:"第八章" },
 { c:5, q:"什么是“压缩范围”策略？被删掉的材料去哪儿了？",
   a:`<p>源自软件开发的“范围”概念：临近交付时，优先砍掉或推迟<span class="hl">难度最大、成本最高、与核心无关</span>的部分——像热气球抛下重物才能起飞。</p>
      <p>被删材料存入第二大脑：演示中剪掉的页面可能变成社交媒体帖子——它们<span class="hl">永远不会付诸东流</span>。</p>`,
   s:"第八章" },

 /* ———— 习惯与心法 ———— */
 { c:6, q:"数字信息管理者的三大必备习惯？",
   a:`<ul class="pts">
      <li><span class="hl">项目清单</span>：项目启动清单＋完成清单，保证从启动到收尾的一致性；</li>
      <li><span class="hl">每周和月度小结</span>：定期回顾并批量处理笔记；</li>
      <li><span class="hl">处处留意</span>：随时提升笔记的价值与可见性。</li>
      </ul>`,
   s:"第九章" },
 { c:6, q:"项目启动清单的五步是什么？",
   a:`<ul class="pts">
      <li><i class="num">①</i> 记录有关项目的<span class="hl">现实想法</span>（头脑风暴）；</li>
      <li><i class="num">②</i> 检视可能相关的<span class="hl">文件夹 / 标签</span>；</li>
      <li><i class="num">③</i> <span class="hl">全盘搜索</span>相关术语；</li>
      <li><i class="num">④</i> <span class="hl">移动 / 标记</span>相关笔记至项目文件夹；</li>
      <li><i class="num">⑤</i> 撰写<span class="hl">笔记大纲和项目方案</span>。</li>
      </ul>
      <p>初检用时约 20～30 分钟，重在把握项目的处理逻辑。</p>`,
   s:"第九章" },
 { c:6, q:"项目完成清单的五步是什么？",
   a:`<ul class="pts">
      <li><i class="num">①</i> 在任务管理器中<span class="hl">标记完成</span>；</li>
      <li><i class="num">②</i> 划除目标，移入“已完成”列表；</li>
      <li><i class="num">③</i> <span class="hl">重温半熟素材</span>，移至其他文件夹；</li>
      <li><i class="num">④</i> 项目文件<span class="hl">归档</span>（跨平台同步）；</li>
      <li><i class="num">⑤</i> 搁置项目：归档前添加一条<span class="hl">“当前状态”笔记</span>。</li>
      </ul>`,
   s:"第九章" },
 { c:6, q:"每周小结的五个步骤？",
   a:`<ul class="pts">
      <li><i class="num">①</i> 清理<span class="hl">电子邮件收件箱</span>；</li>
      <li><i class="num">②</i> 检查<span class="hl">日历</span>；</li>
      <li><i class="num">③</i> 清理<span class="hl">电脑桌面</span>；</li>
      <li><i class="num">④</i> 清理<span class="hl">笔记收件箱</span>：为每条笔记加提示性标题、归入 PARA 文件夹；</li>
      <li><i class="num">⑤</i> 确定<span class="hl">下周优先事项</span>。</li>
      </ul>`,
   s:"第九章" },
 { c:6, q:"月度小结与每周小结的侧重有何不同？",
   a:`<p>每周小结重在<span class="hl">定期清理</span>、防止过载；月度小结重在<span class="hl">反思和整体评估</span>。</p>

/* ============ 状态 ============ */
let order = CARDS.map((_, i) => i);
let filtered = order.slice();
let pos = 0;
let knownSet = new Set();
let activeCat = -1; // -1 = 全部

const $ = id => document.getElementById(id);

function tagHTML(cat) {
  return `<span class="dot" style="background:${cat.color}"></span>${cat.name}`;
}

function render() {
  const idx = filtered[pos];
  const card = CARDS[idx];
  const cat = CATS[card.c];
  $('card').classList.remove('flipped');

  $('qText').innerHTML = card.q;
  $('aText').innerHTML = card.a;
  $('tagF').innerHTML = tagHTML(cat);
  $('tagB').innerHTML = tagHTML(cat);
  $('srcF').textContent = '出处：' + card.s;
  $('srcB').textContent = '出处：' + card.s;
  $('noF').textContent = 'No. ' + (order.indexOf(idx) + 1) + ' / ' + CARDS.length;
  $('noB').textContent = 'No. ' + (order.indexOf(idx) + 1) + ' / ' + CARDS.length;
  $('sealF').textContent = cat.seal;
  $('sealB').textContent = cat.seal;
  for (const el of [$('sealF'), $('sealB')]) { el.style.color = cat.color; el.style.borderColor = cat.color; }
  // 类别色作为强调色注入正反面（索引卡双线、要点短线、hl 强调词）
  for (const el of [$('faceF'), $('faceB')]) el.style.setProperty('--accent', cat.color);

  const isKnown = knownSet.has(idx);
  $('counter').innerHTML = `第 <b>${pos + 1}</b> / ${filtered.length} 张 · ${cat.name}` +
    (isKnown ? ` · <span class="known-flag">已掌握</span>` : '');
  $('knownBtn').textContent = isKnown ? '✕ 取消掌握' : '✓ 已掌握';
  $('knownBtn').classList.toggle('is-known', isKnown);
  $('pbar').style.width = ((pos + 1) / filtered.length * 100) + '%';
  $('knownCount').textContent = `已掌握 ${knownSet.size} / ${filtered.length}`;
}

function move(d) {
  if (!filtered.length) return;
  pos = (pos + d + filtered.length) % filtered.length;
  render();
}
function flip() { $('card').classList.toggle('flipped'); }
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

/* 分类 chips */
const chipsEl = $('chips');
const allChip = document.createElement('button');
allChip.className = 'chip on';
allChip.innerHTML = `全部<span class="n">${CARDS.length}</span>`;
allChip.onclick = () => { activeCat = -1; setChip(allChip); applyFilter(); };
chipsEl.appendChild(allChip);
CATS.forEach((c, i) => {
  const n = CARDS.filter(x => x.c === i).length;
  const b = document.createElement('button');
  b.className = 'chip';
  b.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.name}<span class="n">${n}</span>`;
  b.onclick = () => { activeCat = i; setChip(b); applyFilter(); };
  chipsEl.appendChild(b);
});
function setChip(el) {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
}
function applyFilter() {
  filtered = activeCat === -1 ? order.slice() : order.filter(i => CARDS[i].c === activeCat);
  pos = 0;
  render();
  if ($('browse').classList.contains('on')) renderBrowse();
}

/* 模式切换 */
$('mStudy').onclick = () => {
  $('mStudy').classList.add('on'); $('mBrowse').classList.remove('on');
  $('stage').classList.remove('hide');
  $('stage').querySelector('.nav').style.display = 'flex';
  $('browse').classList.remove('on');
};
$('mBrowse').onclick = () => {
  $('mBrowse').classList.add('on'); $('mStudy').classList.remove('on');
  $('stage').classList.add('hide');
  $('stage').querySelector('.nav').style.display = 'none';
  $('browse').classList.add('on');
  renderBrowse();
};
function renderBrowse() {
  const box = $('browse');
  box.innerHTML = '';
  filtered.forEach(idx => {
    const card = CARDS[idx];
    const cat = CATS[card.c];
    const div = document.createElement('div');
    div.className = 'bcard';
    div.innerHTML = `
      <div class="bq"><span class="dot" style="background:${cat.color}"></span>${card.q}</div>
      <div class="ba">${card.a}<span class="bsrc">出处：${card.s} · ${cat.name}</span></div>`;
    div.onclick = () => div.classList.toggle('open');
    box.appendChild(div);
  });
}

/* 事件 */
$('card').onclick = flip;
$('flipBtn').onclick = flip;
$('prevBtn').onclick = () => move(-1);
$('nextBtn').onclick = () => move(1);
$('knownBtn').onclick = () => {
  const id = filtered[pos];
  knownSet.has(id) ? knownSet.delete(id) : knownSet.add(id);
  render();
};
$('btnShuffle').onclick = () => { shuffleArr(order); applyFilter(); };
$('btnReset').onclick = () => {
  knownSet.clear();
  order = CARDS.map((_, i) => i);
  activeCat = -1;
  document.querySelectorAll('.chip').forEach((x, i) => x.classList.toggle('on', i === 0));
  applyFilter();
};
document.addEventListener('keydown', e => {
  if ($('browse').classList.contains('on')) return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key.toLowerCase() === 'k') $('knownBtn').click();
});

$('total').textContent = CARDS.length;
render();
</script>
</body>
