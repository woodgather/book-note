<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《打造第二大脑》Anki 记忆卡片 | Tiago Forte</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --ink2:#4b5563; --ink3:#9ca3af;
    --line:#e5e7eb; --accent:#2563eb;
    --c0:#0f766e; --c1:#2563eb; --c2:#059669; --c3:#d97706; --c4:#7c3aed;
    --radius:12px;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 4px 16px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px}

  .topbar{position:sticky;top:0;height:60px;background:#0f172a;color:#f8fafc;
          display:flex;align-items:center;gap:14px;padding:0 20px;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .topbar .brand{font-weight:700;font-size:17px;letter-spacing:.5px}
  .topbar .brand small{font-weight:400;color:#94a3b8;margin-left:8px;font-size:12px}
  .topbar .spacer{flex:1}
  .topbar .prog{font-size:12.5px;color:#94a3b8}
  .topbar .prog b{color:#fbbf24}

  .layout{max-width:980px;margin:0 auto;padding:26px 20px 90px}

  /* 筛选区 */
  .deckbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}
  .dchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 16px;
         font-size:13.5px;cursor:pointer;transition:.15s;color:var(--ink2);box-shadow:var(--shadow)}
  .dchip:hover{transform:translateY(-1px)}
  .dchip.active{color:#fff;border-color:transparent}
  .dchip .n{opacity:.75;font-size:12px;margin-left:4px}

  /* 卡片区 */
  .stage{max-width:680px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
        padding:28px 38px 34px;min-height:320px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .card .tag{position:absolute;top:0;left:0;height:5px;width:100%}
  .card .deck{font-size:12px;color:var(--ink3);letter-spacing:1px;margin-bottom:18px}
  .card .q{font-size:18px;font-weight:700;color:var(--ink)}
  .card .q::before{content:"Q";display:inline-flex;width:26px;height:26px;border-radius:8px;margin-right:10px;
        align-items:center;justify-content:center;color:#fff;font-size:14px;vertical-align:2px}
  .card .a{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line);
        font-size:15px;color:var(--ink2);animation:fade .3s}
  .card .a b{color:var(--ink)}
  .card .a::before{content:"A";display:inline-flex;width:24px;height:24px;border-radius:7px;margin-right:10px;
        align-items:center;justify-content:center;color:#fff;font-size:13px;vertical-align:1px}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .flip-hint{text-align:center;margin:18px 0 8px}
  .btn{border:none;border-radius:10px;padding:10px 26px;font-size:14.5px;cursor:pointer;transition:.15s;color:#fff}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .btn-show{background:var(--accent)}
  .gradebar{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .g-again{background:#dc2626}.g-hard{background:#d97706}.g-good{background:#059669}.g-easy{background:#2563eb}
  .gradebar .btn small{display:block;font-size:11px;opacity:.85;font-weight:400}

  .empty{max-width:520px;margin:40px auto;text-align:center;background:var(--panel);border:1px solid var(--line);
        border-radius:18px;box-shadow:var(--shadow);padding:40px 30px}
  .empty h3{font-size:19px;margin-bottom:10px}
  .empty p{color:var(--ink2);font-size:14px;margin-bottom:18px}

  .legend{max-width:680px;margin:26px auto 0;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
        font-size:12.5px;color:var(--ink3)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  kbd{background:#eef2f7;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
      padding:0 6px;font-size:11.5px;font-family:inherit;color:var(--ink2)}

  /* 列表模式 */
  .listwrap{max-width:820px;margin:26px auto 0;display:none}
  .listwrap.show{display:block}
  .listwrap h3{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .listwrap h3 .bar{width:5px;height:18px;border-radius:3px;display:inline-block}
  .qa{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
      padding:14px 20px;margin-bottom:10px}
  .qa .qq{font-weight:700;font-size:14.5px}
  .qa .aa{color:var(--ink2);font-size:13.5px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
  .qa .no{color:var(--ink3);font-size:12px;margin-right:8px}

  .foot{color:var(--ink3);font-size:12.5px;text-align:center;margin-top:50px}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🧠 打造第二大脑 · Anki 记忆卡片<small>Building a Second Brain — 间隔自测复习</small></div>
  <div class="spacer"></div>
  <div class="prog">已掌握 <b id="mCount">0</b> / <span id="tCount">0</span> 　剩余 <span id="rCount">0</span></div>
</div>

<div class="layout">
  <div class="deckbar" id="deckbar"></div>

  <div class="stage" id="stage"></div>

  <div class="flip-hint" id="hint">按 <kbd>空格</kbd> 翻面　·　评分 <kbd>1</kbd> 不会 <kbd>2</kbd> 模糊 <kbd>3</kbd> 良好 <kbd>4</kbd> 掌握</div>

  <div class="gradebar" id="gradebar" style="display:none">
    <button class="btn g-again" data-g="again">再来 <small>1</small></button>
    <button class="btn g-hard" data-g="hard">模糊 <small>2</small></button>
    <button class="btn g-good" data-g="good">良好 <small>3</small></button>
    <button class="btn g-easy" data-g="easy">简单 <small>4</small></button>
  </div>

  <div class="legend">
    <span><i style="background:var(--c0)"></i>总览与理念</span>
    <span><i style="background:var(--c1)"></i>第一部分 · 认知基础</span>
    <span><i style="background:var(--c2)"></i>第二部分 · CODE 四步</span>
    <span><i style="background:var(--c3)"></i>第三部分 · 进阶实战</span>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button class="dchip" id="listBtn">📖 浏览全部卡片</button>
    <button class="dchip" id="resetBtn">🔄 重置学习进度</button>
  </div>

  <div class="listwrap" id="listwrap"></div>

  <div class="foot">— 共 <span id="tCount2">0</span> 张卡片，依据《打造第二大脑》全书内容编写 —</div>
</div>

<script>
/* ================= 卡片数据 ================= */
const CARDS = [
/* ---------- 总览与理念 ---------- */
{d:"总览与理念", c:"var(--c0)", q:"「信管法则（CODE）」的四个步骤分别是什么？",
 a:"<b>抓取 Capture</b>——只保存与你内心产生共鸣的信息；<b>组织 Organize</b>——以行动为导向安置信息；<b>提炼 Distill</b>——层层萃取笔记精华；<b>表达 Express</b>——将知识转化为成果与他人分享。"},
{d:"总览与理念", c:"var(--c0)", q:"什么是「第二大脑」？",
 a:"一套<b>数字档案系统</b>，用以存储你最宝贵的记忆、想法和知识，帮助你更轻松地完成工作、经营业务和管理生活，而无须耗费大量脑力记忆烦琐信息——好比一座装在口袋里的个人图书馆。"},
{d:"总览与理念", c:"var(--c0)", q:"「PARA 系统」的四个类别是什么？",
 a:"<b>项目 Project</b>（正在从事的短期活动）、<b>领域 Area</b>（长期履行的责任）、<b>资源 Resource</b>（具有潜在参考价值的主题）、<b>存档 Archive</b>（完结或搁置的休眠信息）。"},
{d:"总览与理念", c:"var(--c0)", q:"第二大脑系统还有哪些别称？",
 a:"「Zettelkasten」卡片盒（社会学家卢曼提出）、「记忆扩展器 Memex」（万尼瓦尔·布什提出）、「数字花园」（安妮—劳尔·勒库纳夫提出）、「个人云」「外部大脑」等。"},
{d:"总览与理念", c:"var(--c0)", q:"书中把技术比喻成什么？出自谁？",
 a:"「<b>心灵单车</b>」——由史蒂夫·乔布斯首创，用于形容个人计算机的广阔前景：善加运用，认知能力可获得显著增强，成功步伐空前加快。"},
{d:"总览与理念", c:"var(--c0)", q:"为什么说信息需要「延迟利用」？",
 a:"只有一部分信息事关当下，大多数信息需经历一定时间的酝酿发酵，直到未来某一时刻才体现价值。因此要学会将其<b>妥善打包并适时交付给未来的自己</b>——从一次简单的记录行为开始。"},

/* ---------- 第一章 ---------- */
{d:"第一章 · 梦开始的地方", c:"var(--c1)", q:"作者蒂亚戈·福特的笔记系统起源于什么经历？",
 a:"大学三年级起罹患无法确诊的<b>慢性咽喉痛</b>，后因药物副作用出现严重短期记忆丧失（24 岁时大脑机能仅相当于 8 岁孩童）。他开始用文字记录病史、将数百页病历电子化，最终查明「功能性发声障碍」的真凶并显著改善病情。"},
{d:"第一章 · 梦开始的地方", c:"var(--c1)", q:"作者在被病痛困扰时，通过记录病历采取了哪些具体行动？",
 a:"以第一人称记录所思所感、罗列各治疗方案的疗效与个人偏好；将病历扫描为可搜索、重组、注释、共享的电子文本，成为自己病情的「经纪人」——记录每句诊断、整理问题清单供复诊讨论。"},
{d:"第一章 · 梦开始的地方", c:"var(--c1)", q:"作者在乌克兰乡村支教时，笔记系统发挥了什么作用？",
 a:"在资源匮乏的环境中成为「指路明灯」：跨媒介保存课程与练习案例、用英文短语设计文字游戏激发学生热情、向高年级学生传授时间管理与学习规划技能。"},
{d:"第一章 · 梦开始的地方", c:"var(--c1)", q:"「二次蜕变」指的是什么？",
 a:"作者发现自己的笔记不仅自用，还可成为<b>商业资产</b>——从与同事午餐分享心得，到兴趣小组、工作坊，最终发展为面向公众的付费课程，见证了分享的力量。"},
{d:"第一章 · 梦开始的地方", c:"var(--c1)", q:"「打造第二大脑」在线课程创立于何时？规模如何？",
 a:"<b>2017 年初</b>。此后数年培训了来自全球一百多个国家、各行各业的数千名毕业生，并催生出充满活力的知识社区，持续打磨完善该系统。"},

/* ---------- 第二章 ---------- */
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"书中列举了哪些信息过载的数据？",
 a:"每人每天处理信息约 <b>34GB</b>（相当于 174 份报纸，比 1986 年高 5 倍）；美国员工平均每年花 <b>76 小时</b>寻找无序信息；脑力劳动者日常 <b>26%</b> 的时间用于搜寻拼凑信息，成功率仅 <b>56%</b>。"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"赫伯特·西蒙关于信息与专注力的名言是什么？",
 a:"「信息会消耗接收者的专注力。因此，<b>信息越丰富，专注力就越匮乏</b>。」"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"什么是「札记本」（Commonplace Book）？",
 a:"知识分子随身携带、摘录有趣灵感的笔记本。从达·芬奇、约翰·洛克到伍尔芙、奥克塔维亚·巴特勒都使用；工业革命时期（信息超载早期）尤为盛行——它是追随世界变化、厘清自身定位的学习工具。"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"近代早期欧洲人的阅读方式有何特点？",
 a:"呈<b>碎片化和跳跃性</b>：将文字分解成片段摘录至笔记本不同页面、重组为新篇章，再通过新增摘录进行再创作——「读」与「写」紧密交织，成为构建理解能力的不竭源泉。"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"数字笔记应用（电子札记本）具备哪四大特质？",
 a:"<b>多媒体</b>（不限文字形式）、<b>非正式</b>（包容杂乱、利于创新）、<b>开放性</b>（鼓励自由探索）、<b>行为导向</b>（捕获稍纵即逝的闪念，不追求全面精确）。"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"什么是「知识模块」？",
 a:"现代化、专业化的笔记：带有鲜明个人色彩、<b>无须依赖大脑记忆的独立信息元素</b>。长度和格式无关紧要，重要的是折射你的独到观点、个人品位与生活经历——如同乐高积木，可搜寻、移动、组装、重组。"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"「尼娜的黑色星期一」对比场景说明了什么？",
 a:"没有第二大脑时：清晨思绪翻腾、被邮件吞没、疲于奔命后无力推进自己的计划；有第二大脑时：灵感随想随记、会前已备好多维分析的系统笔记——<b>第二大脑如镜子，帮助你认识自我并筛选真正值得跟进的想法</b>。"},
{d:"第二章 · 何谓第二大脑", c:"var(--c1)", q:"哪项研究证明外部工具已成为思维的延伸？",
 a:"科学家马拉维塔和入来笃史 2004 年的研究：灵长类动物不断使用工具扩大能力范围时，大脑中的某些神经网络会<b>将该工具视为身体的一部分</b>。"},

/* ---------- 第三章 ---------- */
{d:"第三章 · 运作机理", c:"var(--c1)", q:"第二大脑的「四大超能力」是什么？",
 a:"① 推动抽象思维的<b>具象化</b>；② 促进不同思想间的<b>融会贯通</b>；③ 辅助<b>长期决策规划</b>；④ 形成<b>鲜明而独到的观点</b>。"},
{d:"第三章 · 运作机理", c:"var(--c1)", q:"沃森与克里克发现 DNA 双螺旋的故事说明了什么？",
 a:"即使是熟稔抽象思维的顶尖科学家，在关键时刻仍求助最基本的媒介工具——<b>物理模型</b>（借鉴鲍林的经验，用折纸反复摆弄拼出双螺旋）。数字笔记同理：把模糊概念转化为可观察、重组、编辑的有形实体。"},
{d:"第三章 · 运作机理", c:"var(--c1)", q:"什么是「近期偏差」？如何破除？",
 a:"人们对某种设想的偏好取决于<b>时间维度上的邻近程度</b>，而非对象本身的优劣——只能依赖手头现成信息做即时反应。破除之道是「<b>文火慢焙</b>」：像细焰慢炖食材一样循序渐进地积累创意，让时光成为创意源泉。"},
{d:"第三章 · 运作机理", c:"var(--c1)", q:"普林斯顿大学的研究认为哪类工作最难被自动化取代？",
 a:"与<b>传播信息和解读信息</b>相关的工作——未来最硬核的是思想领域的弄潮儿：提出观点、营销思想观点的能力比技术岗位更「抗替代」。"},
{d:"第三章 · 运作机理", c:"var(--c1)", q:"塞巴斯蒂安·荣格尔认为「文思易断」的真正原因是什么？",
 a:"「不是我找不到合适的词汇，而是我的<b>知识库根本就空空如也</b>」——瓶颈不是能力或创意问题，而是可用素材匮乏，需要案例、图示、故事、数据等源头活水。"},
{d:"第三章 · 运作机理", c:"var(--c1)", q:"个人知识管理的三个阶段是什么？（各举一例）",
 a:"<b>识记</b>（记忆辅助：设计师卡米尔将研究报告 PDF 导入笔记自由注释）→ <b>联结</b>（思维工具：肿瘤学家费尔南多串联知识与患者需求）→ <b>创新</b>（奶爸特雷尔借第二大脑开辟育儿 YouTube 频道）。"},
{d:"第三章 · 运作机理", c:"var(--c1)", q:"莫泽夫妇的「网格法则」研究与第二大脑有何关联？",
 a:"该神经生理学研究发现，大脑用参与空间推理的「网格法则」（某种坐标系统）记忆信息、实现海量信息的高效表达——为用外部系统组织信息提供了科学注脚。"},

/* ---------- 第四章 抓取 ---------- */
{d:"第四章 · 抓取", c:"var(--c2)", q:"泰勒·斯威夫特的案例说明了什么？",
 a:"即使最成功、最高产的创作者也需要系统：她随时用手机记录一闪而过的歌词旋律（金曲《空位》就是所有灵感巧思的集大成），并能与制作人即时同步——<b>再多的天赋，不加以引导和培育也只能昙花一现</b>。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"「知识资本」的外部来源有哪些？",
 a:"亮点（书中富见地的段落）、引文（播客中令人印象深刻的内容）、书签与收藏夹、语音备忘、会议笔记、图像、启示（课程/会议/演出的收获）。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"「知识资本」的内部来源有哪些？",
 a:"故事（奇闻逸事）、见解（对话题的认识领悟）、记忆（难忘经历）、反思（日记思考）、冥想（「浴室灵感」）。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"哪四类内容不建议存入第二大脑？",
 a:"① <b>敏感或涉密信息</b>（税务、密码、健康记录）；② <b>需专门应用打开的特殊格式</b>（如 Photoshop 文件）；③ <b>容量巨大的信息</b>（拖慢运行）；④ <b>需协同编辑的信息</b>（应交给专业协作平台）。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"「十二个兴趣问题」出自谁？方法是什么？",
 a:"物理学家<b>理查德·费曼</b>：随身常备一打开放式问题，每当新知出现就逐个测试它能否为这些问题提供新启发——跨学科联结让看似无关的发现带来突破（如餐盘旋转与摇摆频率 2:1 的顿悟最终通向诺贝尔奖）。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"笔记篇幅的量化上限是多少？为什么？",
 a:"至多不超过原文的 <b>10%</b>——超过后日后重温难度大增。价值在内容中分布不均，只提取最具显著性、相关性和营养性的部分，像博物馆长一样挑剔，并保存链接以便跳回原文。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"信息抓取的四大标准是什么？",
 a:"① <b>启发性</b>（灵感无法搜索，需平时收集）；② <b>实用性</b>（像木匠收藏边角料）；③ <b>个性</b>（个人观点、反思、记忆最具保存价值）；④ <b>新奇性</b>（香农：信息是「让你耳目一新的东西」——对抗确认偏误）。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"抓取的终极标准是什么？其依据是什么？",
 a:"<b>是否让你为之共鸣</b>。神经科学表明「情感能够引导而非扰乱理性思维」；扑克牌实验证明潜意识可先于理性做出反应——共鸣信号（心跳漏拍、世界静止）是直觉在提醒你记录。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"常见的七类信息抓取工具有哪些？",
 a:"电子书应用（批量导出重点）、稍后读应用、记事本应用、社交媒体收藏、剪藏应用、影音转录应用（语音转文字）、第三方服务与集成插件。"},
{d:"第四章 · 抓取", c:"var(--c2)", q:"「生成效应」和「逸出增益」分别指什么？",
 a:"<b>生成效应</b>：主动生成词语（读/写）比单纯阅读激活更多脑区、更易记忆；<b>逸出增益</b>：通过读写将内心思想具象化，能取得独特优势、发现新的可能性——写作既来源于思考，又有助于思考。"},

/* ---------- 第五章 组织 ---------- */
{d:"第五章 · 组织", c:"var(--c2)", q:"特怀拉·萨普的「文件盒」方法是什么？",
 a:"传奇编舞家每启动一个项目就拿一个可折叠文件盒、写上项目名（宣告开工），并放进<b>写在便笺上的初始目标</b>作第一份材料；所有相关素材统统入盒。文件盒是她的百宝箱、指南针和反思渠道。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"什么是「大教堂效应」？",
 a:"研究发现<b>环境会对思维模式产生重大影响</b>：身处开阔宏伟的空间时思维格局明显打开，逼仄空间里思考则更具体。启示：数字环境同样需要精心打理——第二大脑是「思想上的大教堂」。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"PARA 中「项目」的定义与特点？",
 a:"<b>工作或生活中正在从事的短期活动</b>：有始有终、以明确结果收尾（定案、许可、发动、出版）。例：网页设计、度假攻略、博客发布。同时参与的项目一般 5–15 个。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"PARA 中「领域」与「项目」的关键区别？",
 a:"领域是<b>没有结束日期、需长期履行的责任</b>（理财、健康、家庭、产品开发）。项目有目标，领域则无目标但有需要坚持的<b>标准</b>（如按时付账、每周锻炼 N 次、周末家庭之夜）。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"PARA 中「资源」和「存档」分别指什么？",
 a:"<b>资源</b>：感兴趣但不属于项目或领域的主题（兴趣话题、研究课题、参考信息、爱好）；<b>存档</b>：前三种分类中目前处于闲置状态的信息（完结项目、不再介入的领域）——数字世界可永久保存，需要时几秒唤醒。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"PARA 的三层级结构是什么？",
 a:"顶层 PARA 四大类别 → 各类别下的<b>子文件夹</b>（具体项目/领域/资源）→ 最底层的<b>具体笔记</b>。仅三层即可囊括数千份笔记。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"笔记归类的「速查表」顺序是什么？",
 a:"依次自问：① 这条笔记对哪个<b>项目</b>最有帮助？② 若无——对哪个<b>领域</b>最有帮助？③ 若无——属于哪种<b>资源</b>？④ 若无——归入<b>存档</b>。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"为什么抓取和组织必须分成两个独立步骤？",
 a:"记录笔记的第一时间往往不是确定其性质的最佳时机：既没时间考虑最终用途，又会增加心理负担、降低记录积极性。应先暂存「收件箱」保持专注，归类留待每周小结等专门时间。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"PARA 与厨房管理的对应关系？",
 a:"<b>存档=冰柜</b>（冷冻备用）、<b>资源=食品柜</b>（不碍事但随取）、<b>领域=冰箱</b>（近期常用）、<b>项目=炉上的锅</b>（烹饪进行时）——按「信息归宿」而非「信息来源」组织。"},
{d:"第五章 · 组织", c:"var(--c2)", q:"作者在苹果店兼职悟出了什么道理？",
 a:"客户要的不是整理得井井有条的电脑，而是为创作目标（纪念视频、蛋糕店网站、乐队唱片）服务。把历史文件统统移入「存档+日期」文件夹后客户创作频出——<b>历史项目是第二大脑的活力之源，创作本身才是重中之重</b>。"},

/* ---------- 第六章 提炼 ---------- */
{d:"第六章 · 提炼", c:"var(--c2)", q:"科波拉用「提词本」做了什么？",
 a:"执导《教父》时用三环活页夹剪贴原著、写满注释：先通读记录第一印象，再按五个维度分解每个场景——<b>场景大纲、历史语境、「观感」格调、核心主旨、需要避免的误区</b>，「提词本就是我的剧本」。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"为什么说记录笔记是「时光旅行」？",
 a:"现学现用的概率很低：装修知识可能等搬家时才用上、时间管理文章等孩子出生、客户洞察等来年采购——笔记是<b>向未来的自己传递信息</b>，须经打磨提纯才能经受时间考验。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"「可见性」指什么？它与笔记体量的关系？",
 a:"目标内容在文档/系统中的<b>易见易寻度</b>。笔记体量与可见性成<b>反比</b>：越翔实重温越费力——要把未来的自己当成极度挑剔、忙碌、缺乏耐心的客户。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"「渐进式归纳法」的四个层级是什么？",
 a:"① 原始摘录（<b>土壤</b>）——只留最好最相关的文字；② 黑色加粗（<b>原油</b>）——抓住粗体即可掌握核心；③ 黄色高亮（<b>黄金</b>）——百里挑一、浓缩为一两句梗概；④ 纲要（<b>宝石</b>）——用自己的语言在顶部写概括要点。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"渐进式归纳法每层级的篇幅比例建议？",
 a:"每一层级的重点不应超过上一层级内容的 <b>10%～20%</b>。例如从书中摘抄 500 字，第二层级加粗不超过 100 字，第三层级高亮不超过 20 字。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"渐进式归纳法的四个应用案例？",
 a:"<b>维基百科</b>（鲍莫尔成本病：十秒调取应对座谈）、<b>在线文章</b>（谷歌结构化面试：两年后成招聘指南）、<b>播客</b>（梅根·特普纳访谈：启发课程定价与导师机制）、<b>会议记录</b>（工作室改造：加粗变购物清单）。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"毕加索《公牛》与肯·伯恩斯的纪录片说明了什么？",
 a:"<b>提炼的核心逻辑是「断舍离」而非「滴水不漏」</b>：《公牛》11 幅石版画由繁到简层层解构；伯恩斯原始镜头采用率低至 40:1～50:1——结果之「简」掩盖了过程之「繁」，千淘万漉虽辛苦，吹尽狂沙始到金。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"笔记新手最常犯的三个错误？",
 a:"① <b>过度标记重点</b>（什么都想要最后什么都得不到）；② <b>缺乏明确目标</b>（应在准备创作时才提炼，遵循「信息协同 stigmergy」——像蚁群留信息素，每次接触信息都让它更便于取用）；③ <b>故作高深</b>（无须分析分类，听从直觉）。"},
{d:"第六章 · 提炼", c:"var(--c2)", q:"如何检验笔记的可见性是否合格？",
 a:"把笔记搁置一段时间，等细节忘得七七八八时重新回顾——给自己 <b>30 秒</b>，看能否通过高亮文字迅速重拾记忆，即可判断重点画得太多还是太少。"},

/* ---------- 第七章 表达 ---------- */
{d:"第七章 · 表达", c:"var(--c2)", q:"奥克塔维亚·巴特勒的创业期三条规则？",
 a:"① 每次出门必带笔记本、便笺或其他可写作的东西；② 无论走到哪里都眼观六路、耳听八方；③ 不为错过或遗憾找借口，多思考如何「逢山开路、遇水架桥」。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"奥克塔维亚·巴特勒留下了多少资料？",
 a:"她把一切（日志、札记、草稿、借阅单等）都记录下来，逝后共 <b>9062 项、装满 386 个文件盒</b>，捐给亨廷顿图书馆——笔记和写作是她对抗恐惧与自卑的武器。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"什么是「半熟素材」（Intermediate Packets）？",
 a:"构建最终作品所必需的、个别的、<b>具体的创作元素</b>：会议纪要、研究列表、头脑风暴、幻灯片等（缩写 IP 恰是知识产权——它们是你的知识资产）。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"五种易于创建和复用的半熟素材？",
 a:"① <b>干货笔记</b>（提炼后的精要）；② <b>落选素材</b>（被删但日后可用）；③ <b>过程性文件</b>（模板、日程）；④ <b>最终成果</b>（历史项目的交付物）；⑤ <b>他山之石</b>（团队成员、客户创造的资产——借用须注明出处）。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"运用半熟素材的四大益处？",
 a:"① <b>专注力强化</b>（一次只管一个小库）；② <b>时间更灵活</b>（碎片时间即可推进）；③ <b>质量提高</b>（反馈越早越具建设性）；④ <b>拼凑即成大项目</b>——「从零开始」从此从创作字典里消失。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"检索笔记的四种方法是什么？",
 a:"① <b>搜索</b>（首选，秒级检索）；② <b>浏览</b>（空间思维优于抽象思维，层层剥茧）；③ <b>标签</b>（跨文件夹建立关联，作撒手锏）；④ <b>随缘</b>（集中存放多样素材=打造创新基因池，让机缘巧合发生）。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"「只启动那些已经完成了80%的项目」是什么意思？",
 a:"牧师帕特里克的案例：只从事前期工作（抓取、组织、提炼）已大部分完成的项目——素材归整到位后任务已完成 80%，<b>确保永远不会启动一项无法完成的工程</b>，且能专注倾听而不必心有旁骛。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"电影特效中的「配件混搭」（Kitbashing）说明了什么？",
 a:"《星球大战》等影片购买二战高射炮、坦克等预制模型重组为新场景——<b>创造力源自对既有事物的混搭</b>，没有谁能「无中生有」。借鉴≠照抄：务必标明出处，给予荣誉反而彰显自己的贡献。"},
{d:"第七章 · 表达", c:"var(--c2)", q:"为什么说「无合作，不创新」？",
 a:"看似最独立的写作也充满社交元素（作者与编辑）；反馈等于解锁<b>第三人称视角</b>，跳出「当局者迷」。半熟素材以更小的切口鼓励更多共享——让反馈环节尽可能早、频率尽可能高。"},

/* ---------- 第八章 创新套路 ---------- */
{d:"第八章 · 创新套路", c:"var(--c3)", q:"作者父亲（职业画家）的创作习惯说明了什么？",
 a:"布道时涂鸦草图（演变为 2.4–3 米全尺寸作品）、逛超市收藏「蔬果模特」、看电视时观察墙上未完成品——<b>不能指望第一时间迸发奇思妙想，须先收集整理原材料</b>，用常规做法系统转化创意。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"「发散与聚合」模型是什么？",
 a:"创作总是在此二者间往复交替（源自斯坦福设计学院、经 IDEO 推广的设计思维）：<b>发散</b>=为可能性打开空间、收集灵感；<b>聚合</b>=淘汰选择、朝最终方案靠拢。CODE 的前两步（抓取/组织）=发散，后两步（提炼/表达）=聚合。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"「思想群岛」策略是什么？",
 a:"得名于史蒂文·约翰逊（「素材如星罗棋布的群岛围绕着我，我只须在岛屿之间搭建桥梁」）：发散阶段收集足量素材后，在笔记中编制<b>数字大纲</b>——把「选择想法」与「逻辑排序」拆分为两个步骤，对抗拖延、告别白纸恐惧。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"数字大纲相比纸质大纲的五大优点？",
 a:"① 延展灵活（自由增删重排）；② 可链接更富细节的内容（跳转笔记而非原文）；③ 交互式多媒体（图像、附件、复选框）；④ 易于搜索；⑤ 跨设备同步访问。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"「海明威之桥」策略是什么？",
 a:"海明威一旦明确后续章节思路就立即停笔——<b>用今天的思路和精力为明天的写作注入动力</b>（「以始为终」）。停笔前在笔记中写下：下一步的想法、当前的状态、易被遗忘的重要信息、下一阶段的工作目标。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"「压缩范围」策略是什么？",
 a:"源自软件开发：临近发布时砍掉难度最大、成本最高、与核心无关的功能。<b>不要坐等所有交通灯同时变绿才发动汽车</b>——被裁剪的材料存入第二大脑日后复用；递减示例：写书→系列文章→社媒帖子。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"车库改建工作室案例完整走了哪几步？",
 a:"① 思想群岛：15 分钟列纲要（简介/成本/设想/阶段等）；② 发散补充：Pinterest 照片、谈话记录、YouTube 教程；③ 海明威之桥：碎片时间推进并记录进度；④ 压缩范围：剔除不切实际想法、设定预算与时限。"},
{d:"第八章 · 创新套路", c:"var(--c3)", q:"限时练笔练习的具体规则？",
 a:"选一个项目→编制行动大纲→移入相关笔记和半熟素材→<b>限时 15～20 分钟</b>，不联网、不开浏览器，仅凭现有素材完成第一道工序（计划/日程/提案/图表）——警惕「错失恐惧症」（FOMO）。"},

/* ---------- 第九章 习惯 ---------- */
{d:"第九章 · 必备习惯", c:"var(--c3)", q:"「餐前准备」（mise en place）是什么？对脑力工作者的意义？",
 a:"起源 19 世纪末法国的厨师哲学：边烹饪边保持整洁（工具定位、刀具随用随擦、配料按序），把机械环节自动化、专注创造性工序。<b>脑力工作者同样只能在执行常规的间隙维护系统</b>——守序是一种习惯而非性格特质。"},
{d:"第九章 · 必备习惯", c:"var(--c3)", q:"项目启动清单的五步是什么？",

/* ================= 状态与渲染 ================= */
let deck = "全部";
let order = CARDS.map((_,i)=>i);
let idx = 0;              // 当前队列位置
let flipped = false;
let stats = {again:0, hard:0, good:0, easy:0};
let done = new Set();     // 已评分（本会话）
let current = null;

const $ = s=>document.querySelector(s);

function filtered(){
  return order.filter(i=>deck==="全部"||CARDS[i].d===deck);
}
function queue(){
  return filtered().filter(i=>!done.has(i));
}

function renderDeckbar(){
  const bar = $("#deckbar"); bar.innerHTML="";
  const decks = ["全部", ...new Set(CARDS.map(c=>c.d))];
  decks.forEach(d=>{
    const n = CARDS.filter(c=>d==="全部"||c.d===d).length;
    const b=document.createElement("button");
    b.className="dchip"+(d===deck?" active":"");
    b.innerHTML=`${d}<span class="n">${n}</span>`;
    const color = d==="全部"?"var(--accent)":CARDS.find(c=>c.d===d).c;
    b.style.background = d===deck?color:"";
    b.onclick=()=>{deck=d; idx=0; render();};
    bar.appendChild(b);
  });
}

function render(){
  renderDeckbar();
  $("#tCount").textContent=CARDS.length;
  $("#tCount2").textContent=CARDS.length;
  const mastered = stats.good+stats.easy;
  $("#mCount").textContent=mastered;
  const q=queue();
  $("#rCount").textContent=q.length;
  $("#listwrap").classList.remove("show");
  $("#listBtn").textContent="📖 浏览全部卡片";
  const stage=$("#stage"), grade=$("#gradebar");
  if(q.length===0){
    grade.style.display="none";
    $("#hint").style.visibility="hidden";
    stage.innerHTML=`<div class="empty"><h3>🎉 ${deck==="全部"?"本轮全部卡片":"「"+deck+"」卡片"}已复习完毕！</h3>
      <p>再来 ${stats.again} · 模糊 ${stats.hard} · 良好 ${stats.good} · 掌握 ${stats.easy}</p>
      <button class="btn btn-show" onclick="location.reload()">再来一轮</button></div>`;
    return;
  }
  $("#hint").style.visibility="visible";
  current = q[Math.min(idx,q.length-1)];
  const c = CARDS[current];
  stage.innerHTML=`<div class="card">
      <div class="tag" style="background:${c.c}"></div>
      <div class="deck">${c.d}　·　第 ${filtered().indexOf(current)+1} / ${filtered().length} 张</div>
      <div class="q" >${c.q}</div>
      ${flipped?`<div class="a" style="border-left:4px solid ${c.c}">${c.a}</div>`:""}
    </div>`;
  grade.style.display = flipped?"flex":"none";
  if(!flipped){
    const h=document.createElement("div");h.style.textAlign="center";h.style.marginTop="18px";
    h.innerHTML=`<button class="btn btn-show" onclick="flip()">显示答案</button>`;
    stage.appendChild(h);
  }
}
window.flip = ()=>{flipped=true;render();};

function grade(g){
  stats[g]++;
  if(g==="again"||g==="hard"){ order.push(current); }   // 不会/模糊的卡片排到队尾重现
  else { done.add(current); }
  flipped=false; idx=0; render();
}
document.querySelectorAll(".gradebar .btn").forEach(b=>{
  b.addEventListener("click",()=>grade(b.dataset.g));
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault(); if(!flipped)flip(); return;}
  if(flipped){
    if(e.key==="1")grade("again");
    if(e.key==="2")grade("hard");
    if(e.key==="3")grade("good");
    if(e.key==="4")grade("easy");
  }
});

/* 全部卡片列表 */
function renderList(){
  const w=$("#listwrap");
  const decks = [...new Set(CARDS.map(c=>c.d))];
  w.innerHTML = decks.map((d,di)=>{
    const color = CARDS.find(c=>c.d===d).c;
    return `<h3><span class="bar" style="background:${color}"></span>${d}</h3>`+
      CARDS.map((c,i)=>({c,i})).filter(x=>x.c.d===d)
      .map(x=>`<div class="qa" style="border-left:4px solid ${color}">
        <div class="qq"><span class="no">#${x.i+1}</span>${x.c.q}</div>
        <div class="aa">${x.c.a}</div></div>`).join("");
  }).join("");
}
$("#listBtn").addEventListener("click",()=>{
  const w=$("#listwrap");
  const show=!w.classList.contains("show");
  w.classList.toggle("show",show);
  $("#listBtn").textContent=show?"🙈 收起卡片列表":"📖 浏览全部卡片";
  if(show) w.scrollIntoView({behavior:"smooth"});
});
$("#resetBtn").addEventListener("click",()=>{
  stats={again:0,hard:0,good:0,easy:0}; done=new Set(); order=CARDS.map((_,i)=>i);
  idx=0; flipped=false; render();
});

render();
renderList();
</script>
