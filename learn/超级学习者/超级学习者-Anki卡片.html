<script>
var CARDS = [{"front": "《超级学习者》作者斯科特·H.扬在2012年的成名事迹是什么?", "back": "他用了不到一年时间自学完麻省理工学院(MIT)计算机科学本科四年的全部课程,并通过了所有期末测试。", "ch": "序言", "tag": "00"}, {"front": "2013-2014年,斯科特·H.扬做过一个什么语言学习项目?", "back": "他计划整整一年不讲英语,先后去了西班牙、巴西、中国和韩国,一路上全程用当地语言与人沟通。", "ch": "序言", "tag": "00"}, {"front": "本书序言作者是谁?他与斯科特·H.扬是什么关系?", "back": "詹姆斯·克利尔(James Clear),畅销书《掌控习惯》的作者。他因研究习惯养成而结识斯科特,并为《超级学习者》作序。", "ch": "序言", "tag": "00"}, {"front": "什么是\"直接学习\"(超级学习原则3)?", "back": "直接学习指通过直接实践来学习你想学的东西——通过主动练习而非被动学习来达成目的。例如:想学写作就通过写作来学,想获得客户就去打销售电话,而不是只读相关书籍。", "ch": "序言", "tag": "00"}, {"front": "被动学习与主动练习的核心区别是什么?(序言中的金句)", "back": "被动学习积累知识,主动练习创建技能。吸收新知识与发展新技能可能脱节——你可能了解某专业的全部知识,却因缺乏实践而不具备现实所需的专业技术。", "ch": "序言", "tag": "00"}, {"front": "\"理论上,理论和实践没有区别,但在实践中,区别确实存在\"这句俗语说明了什么?", "back": "许多想法只是纸上谈兵,理论上很高明,却被现实击败。它强调知行合一、直接参与实践的重要性,这也是斯科特·扬备受欣赏的特质——他是自己思想的实践者。", "ch": "序言", "tag": "00"}, {"front": "序言作者詹姆斯·克利尔的第一个超级学习项目是什么?他是怎么学的?", "back": "摄影。2009年底他搬到苏格兰后迷上摄影,没上过摄影班也没读过摄影书,只是不断拍摄——第一年就拍了10万多张照片。几个月后他拍到北极光照片,并闯入年度旅行摄影师比赛决赛。", "ch": "序言", "tag": "00"}, {"front": "詹姆斯·克利尔如何把超级学习原则运用到写作事业上?(举例至少三条原则)", "back": "• 元学习:研究其他受欢迎的博主和作家,制定成为成功作家的蓝图\n• 专注:几乎从一开始就全职投入写作\n• 直接:通过写作学写作,每周一和周四各写一篇文章,头两年写了150多篇\n• 训练:把写作分解为标题、开头句、过渡句等要素,逐项提升\n• 反馈:亲自给前一万名订阅者发邮件请求反馈", "ch": "序言", "tag": "00"}, {"front": "序言中提到的超级学习三大理由是什么?", "back": "• 让生活有目标感:拥有擅长的技能令人开心,向自己证明有能力提高自己\n• 回报丰厚:大多数人不会认真研究你感兴趣的领域,专注几个月就能脱颖而出,带来更好的工作、薪水、自由和人脉\n• 完全有可能实现:保罗·格雷厄姆说\"在许多领域,专注学习一年就足够了\"", "ch": "序言", "tag": "00"}, {"front": "保罗·格雷厄姆(Paul Graham)关于学习有一句什么名言被序言引用?", "back": "\"在许多领域,专注学习一年就足够了。\"意即几个月到一年的高强度专注自学,其成果会令大多数人惊讶,超级学习对普通人是可行的。", "ch": "序言", "tag": "00"}, {"front": "关于快速学会有价值的技能,序言的核心结论是什么?", "back": "快速学会有价值的技能,并不只有天才才能做到,这是任何人都可以享受的学习过程——只是大多数人从未尝试,因为从来没有一本书告诉他们该怎么做。", "ch": "序言", "tag": "00"}, {"front": "MIT挑战是什么？斯科特·杨做了什么，结果如何？", "back": "• 作者斯科特·杨利用MIT的免费开放课程，在不到12个月的时间里自学完成MIT计算机科学专业本科的全部课程（共33门课），通过各门期末考试并完成编程项目\n• 他在加拿大温哥华家中自学，从未去过MIT\n• 启示：利用互联网开放课程+高强度自学+以考试为检验标准，可以以极低成本和短时间达到接近名校毕业生的学习水平", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "斯科特·杨在MIT挑战中如何应对课程资料缺失的问题（如“计算结构”课没有视频和教科书）？", "back": "他放弃了完全复刻MIT上课方式的思路，转而抓住学位的骨架：以期末考试和课程编程项目作为学习与检验的核心标准，缺资料的课程靠自行解读幻灯片等材料想办法通过考试", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "斯科特·杨在MIT挑战中用了哪些加速学习的策略？", "back": "• 以2倍速观看课程视频\n• 边学边即时检测，一次只测一道题，快速从错误中学习\n• 初期几天速成一门课；后期改为一个月同时修3-4门课，避免快速遗忘\n• 高峰期每周学习60小时，后调整为每周35-40小时", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "MIT挑战完成后，作者在Reddit上引发争论的焦点是什么？", "back": "• 有雇主是否认可这种学习（一种观点认为雇主不把它当学位；一位软件公司研发主管则说“这才是我想要的那种人，我不在乎你有没有学位”）\n• 他是否真的学完了课程、能否找到程序员工作\n• 为什么要在一年内完成", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "本尼·刘易斯（Benny Lewis）的超级学习案例是什么？给我们什么启示？", "back": "• 爱尔兰语言学习者，放弃工程师职业周游世界学语言，每三个月挑战学一门语言\n• 从第一天就开口说外语，不害怕和陌生人交谈，先用常用语手册，正式学习留到以后，使用视觉助记法记词汇\n• 已精通西班牙语、意大利语、法语、葡萄牙语、世界语等多门语言，后又学了阿拉伯语、汉语、泰国语、美国手语甚至克林贡语\n• 德语挑战：3个月冲击CEFR最高等级C2，通过考试五项标准中的四项（仅听力未过），歌德学院建议C2至少需要750小时教学\n• 启示：勇敢无畏、直接开口实践比方法本身更重要；明确高标准挑战能极大提升学习效果", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "欧洲共同语言参考框架（CEFR）的等级体系是怎样的？B2和C2分别代表什么水平？", "back": "• CEFR将语言能力分为A1、A2、B1、B2、C1、C2六个等级，由低到高\n• B2为中上等：能以相当流利、自然的方式与母语人士交流，双方都不感到紧张（本尼·刘易斯通常三个月挑战达到的水平）\n• C2为最高级：轻松理解几乎所有听到/读到的内容，自发、流利、准确地表达自己，在复杂情况下也能区分细微差别", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者刚到法国做交换生时学习法语为何失败？后来他悟出的关键教训是什么？", "back": "• 他一到法国就加入了一个“不必说法语”的社交圈，朋友们（包括法国朋友）都用英语和他交谈，一年下来法语进步有限\n• 关键教训：如果想获得足够练习机会，就不要给自己留退路；环境若允许你回避目标语言，学习就会受阻", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "“不讲英语的一年”（The Year Without English）项目是什么？结果如何？", "back": "• 作者和室友约定：去四个国家各待三个月，从第一天起彼此之间和对外都不说英语，只学当地语言\n• 西班牙学西班牙语：两个月即可交流，进步超过作者在法国一整年的水平\n• 之后去巴西学葡萄牙语、中国学普通话、韩国学韩语\n• 发现亚洲语言难学得多，普通话和韩语未达同等水平，但已够结交朋友、旅行、谈论各种话题\n• 年底时两人共掌握了四种新语言\n• 启示：切断退路的完全浸入式学习效果远超预期", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者“不讲英语的一年”项目在西班牙的第一站遇到了什么趣事？", "back": "刚在瓦伦西亚机场着陆，两个英国女孩向他们问路，他们装作不会英语、笨拙地挤出仅会的西班牙语，女孩们以为他们真不会英语，沮丧地走开了——此后他们的西班牙语进步飞快", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "罗杰·克雷格（Roger Craig）的超级学习案例是什么？给我们什么启示？", "back": "• 计算机科学家，用数据分析法备战智力节目《危险边缘》（Jeopardy）\n• 下载节目历年的成千上万道题目自测；用文本挖掘软件按主题分类问题，用数据可视化工具（圆圈位置=掌握程度、大小=出现频率）找出自己的弱点（如时尚类）并集中补强\n• 用间隔重复软件（基于波兰研究员沃兹尼亚克20世纪80年代开发的算法）高效记忆海量知识\n• 结果：以单日77000美元创下当时《危险边缘》单日最高奖金纪录，累计赢近20万美元，创五连胜纪录\n• 启示：练习可以“随意”也可以“有效”，重新思考获取知识的方式、用数据分析优化学习，能战胜看似不可能的任务", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "罗杰·克雷格从《危险边缘》节目中分析出了哪些隐藏模式？", "back": "• “双倍积（扣）分制”线索虽看似随机放置，但可分析其在节目档案中大致出现的区域，可跨类别专项训练\n• 节目面向大众娱乐，问题大概率针对某主题最著名的例子，所以只需重点研究每类最知名的内容，无需深钻所有方向", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "间隔重复软件的原理是什么？由谁开发？", "back": "• 由波兰研究员彼得·沃兹尼亚克（Piotr Wozniak）在20世纪80年代开发的记忆卡算法\n• 通过计算每个知识点最佳的复习时间，安排复习间隔：既不浪费精力过度复习已掌握的内容，也不至于遗忘，从而以最高效率记住海量知识", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "埃里克·巴隆（Eric Barone）的超级学习案例是什么？给我们什么启示？", "back": "• 计算机科学毕业生，为独立开发游戏《星露谷物语》，花近5年时间自学掌握游戏编程、像素艺术、音乐作曲、声音设计、故事编写等多种技能\n• 期间在剧院当引座员拿最低工资维持生计\n• 学习方法：直接练习想要在游戏中使用的图像；把自己的作品与欣赏的作品对比，科学地分解“为什么喜欢/不喜欢”；读理论书和课程填补空白；不满意的作品重做3-5遍，人物肖像做了至少10次\n• 结果：2016年2月发布的《星露谷物语》大获成功，第一年卖出300多万份，他从最低工资打工者变成登上《福布斯》“30 Under 30”榜单的百万富翁\n• 启示：一个人也能通过高强度直接练习+反馈+重做，掌握多领域技能并达到专业水准", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "埃里克·巴隆是如何攻克自己最弱的像素艺术的？", "back": "• 完全从零学起，直接练习游戏中要用的图像，而非泛泛画画\n• 将作品与欣赏的艺术家作品对比，问自己“为什么喜欢/不喜欢”，科学分解\n• 遇到具体问题（如颜色沉闷）就针对性研究色彩理论并分析其他艺术家的用色\n• 不达标就重做：大部分作品重复3-5遍，人物肖像至少10次", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "《星露谷物语》的销量成绩如何？", "back": "2016年2月发布后迅速大受欢迎，在Steam上销量超过许多大工作室的游戏，第一年（多平台）卖出300多万份，作者埃里克·巴隆从拿最低工资的设计师变为百万富翁并登上《福布斯》游戏开发“30 Under 30”榜单", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者用一个月学肖像素描时用了什么快速反馈方法？", "back": "照着图片画素描后，用手机拍下画作，将原始照片调成半透明覆盖在自己的画上对比，立刻看出头部宽窄、五官位置等偏差；如此练习数百次，短期内画像水平明显提高——即把MIT挑战中的快速反馈策略用于艺术学习", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "关于画人脸的一个常见错误是什么？", "back": "大多数人把眼睛画得过高——以为眼睛位于头部上方2/3处，实际上眼睛一般位于头顶到下巴的正中间", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "什么是超级学习？它的共同主线是什么？", "back": "作者对一类学习方式的总称：追求极致、自学自主，并使用相似策略高效达成宏大学习目标。共同特点：\n• 通常独立学习，刻苦钻研数月甚至数年\n• 始于兴趣，逐渐趋于痴迷\n• 积极优化学习策略（如交错练习、关键词记忆术等）\n• 由强烈动机驱动，常不求学位、不被传统体系认可\n• 该词最早由卡尔·纽波特（Cal Newport）使用", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "史蒂夫·帕夫林纳（Steve Pavlina）的超级学习案例是什么？", "back": "通过优化大学课程安排，每学期选修三倍于标准的课程，在三个学期内获得计算机科学学位（就读于北岭加州州立大学，共获得计算机科学和数学两个学位）。他的挑战早于MIT挑战，是最先启发作者压缩学习时间的人", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "戴安娜·詹塞卡雷（Diana Jaunzeikare）的超级学习案例是什么？", "back": "为不放弃在谷歌的工作，她自学达到卡内基-梅隆大学计算语言学博士项目的培养目标（既上课又做原创研究），代替全日制读博——用超级学习填补正规教育与个人生活方式不匹配造成的缺口", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "中文论坛网友塔姆（Tamu）的超级学习案例是什么？", "back": "在Chinese-forums.com上详细记录从零开始学中文的过程：四个多月里每周学习70-80小时，最终通过了汉语水平考试HSK 5级（第二高的级别）", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "特伦特·福勒（Trent Fowler）的“STEM朋克计划”是什么？", "back": "从2016年初开始为期一年的项目，目标是精通工程和数学、掌握STEM领域（科学、技术、工程、数学）及复古未来主义蒸汽朋克美学。他把项目分成计算机、机器人、人工智能、工程学等模块，由实践项目驱动学习，而非照搬常规在校课程", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者为什么没选择回学校读第二个学位，而开启了MIT挑战？", "back": "他本科读商科后发现选错了专业，想学计算机科学去创业；但再读一个学位意味着申请学生贷款、花近五年重复大学的官僚流程，他相信一定有更好的学习方式——恰逢他发现MIT的免费公开课程质量甚至超过他花几千美元上的多数大学课程", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者观察到的时代背景：为什么现在更需要超级学习？", "back": "科技让随时随地学习前所未有地便捷，但学费却与日俱增；学位曾是有体面工作的保证，如今几乎只是一小步。各职业（程序员、经理、企业家、设计师、医生等）对知识技能的要求迅速提高，许多人跟不上，因此需要更高效的掌握技能的方法", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者在MIT挑战中的最终进度安排经历了怎样的调整？", "back": "最初计划一周速成一门课、一年学完32门课；实际执行中改为一个月同时完成3-4门课以避免快速遗忘；进展显著时放慢速度，从每周60小时调整为每周35-40小时；最终在2012年9月、开始后不到12个月完成全部课程", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "MIT挑战给作者带来的心态转变是什么？", "back": "他意识到“深度学习的唯一方法就是努力完成学业”这一假设是错的：这个项目是他自己的愿景和设计，虽然充满挑战却让他充满活力而非痛苦。他第一次感到，只要有正确的计划加上努力，他可以学会任何想学的东西", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "超级学习有什么代价和回报？", "back": "• 代价：并非易事，一开始困难重重、令人沮丧，需要跨出舒适区\n• 回报：能取得的卓越成就完全值得付出努力；普通人即使不做完整的超级学习项目，也可以在认知科学研究指导下借鉴超级学习者的经验来改进自己的学习方法", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "本尼·刘易斯曾被巴西联邦警察局拘留，原因是什么？", "back": "一名移民官员不相信他能在这么短时间内把葡萄牙语说得如此流利，怀疑他要非法移民而拒签；他随后在外面用葡萄牙语咒骂这名移民官，恰好被她听到而被拘留——这从侧面证明了他语言学习的惊人成效", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "本尼·刘易斯给作者的几句关键建议/口头禅是什么？", "back": "“心里永远都要有挑战。”——持续给自己设置雄心勃勃的学习挑战，是他无畏学习态度的核心", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "作者学完MIT课程后收到的哪些邀约？他做这个项目的真正目的是什么？", "back": "• 微软员工安排工作面试、一家新创公司邀请他加入、中国一家出版社签订出书协议\n• 但他的目的不是找工作（作为在线作家他已有收入支撑），而是“看看我还能做什么”——探索自身学习的可能性", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "书中提到的超级多语言者群体说明了什么？", "back": "刘易斯的成就并不罕见：作者遇到过会说40多种语言的超级多语言者、接触几小时就能说一门新语言的人类学家，以及靠一个又一个旅游签证不断掌握新语言的旅行者——且积极自学的惊人成果不止局限于语言领域", "ch": "第1章 不去MIT，也能接受MIT的教育", "tag": "01"}, {"front": "书中对\"超级学习\"的定义是什么？", "back": "一种获取技能和知识的策略，既是自主自发的，又是紧迫激烈的。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "超级学习的定义包含哪两个核心特征？", "back": "• 自主自发：自己决定学什么、为什么学，关键在于项目中什么处于主导地位，而非在哪里学习\n• 紧迫激烈：采取不同寻常的方法最大限度提高学习效率，进行艰苦的脑力劳动，深入且有效地学习是重中之重", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "为什么说超级学习是\"策略\"而非\"命令\"？", "back": "策略不是给定问题的唯一解决方案，但可能是很好的解决方法；策略适合特定情况而非所有情况，使用它是一种选择而非命令。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "超级学习的高强度可能带来的心理状态是什么？与之相反的低强度学习是什么样的？", "back": "• 高强度学习可能让人进入愉悦的心流状态——专注于挑战的体验，甚至忘记时间\n• 相反的是为乐趣和便利而学习：随意玩玩而非认真练习", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "作者认为应该进行超级学习项目的两大个人理由是什么？", "back": "• 加速职业成长：快速掌握硬技能，用于换职业、接受新挑战或加速成长\n• 丰富个人生活：掌握梦想中的技能（乐器、外语、写作等），收获极大的满足感和自信，相信自己的潜力", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "泰勒·考恩（Tyler Cowen）关于经济趋势的核心论断是什么？", "back": "\"平均时代已经终结\"——由于电脑化、自动化、外包和区域化的普及，世界呈现优者愈优、强者愈强的局面。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "什么是\"技能极化\"？", "back": "中等技能岗位（文员、旅行社代理、簿记员、工厂工人等）被新技术取代后，劳动力被挤向两端：要么上升为高技能工作（工程师、程序员、经理、设计师），要么下沉为低技能工作（零售、清洁、客服）。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "MIT经济学家戴维·奥托尔（David Autor）对美国收入不平等有什么发现？", "back": "不平等并非全面上升，而是两种不同表现：顶层的不平等程度上升，底层的不平等程度下降。技术进步是这种两极分化的推动力。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "全球化和区域化如何强化技能两极分化？", "back": "• 外包：中等技能工作外包给发展中国家；高技能工作因需与管理、市场协调而难以转移（如iPhone\"加州设计，中国制造\"）\n• 低技能工作因需面对面接触和文化语言能力而可能保留\n• 区域化：香港、纽约、旧金山等\"超级明星城市\"聚集公司和人才，对经济产生主导作用", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "面对\"平均时代终结\"的经济趋势，作者提出的应对态度是什么？", "back": "经济形势的变化不受个人控制，但可以通过积极学习所需的硬技能、未雨绸缪来应对；掌握快速有效学习新技能的能力能让你在新环境中更有竞争力。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "教育趋势方面，大学教育面临什么问题？", "back": "• 学费增长速度远快于通货膨胀，毕业生可能背负几十年债务，若教育不能转化为大幅增长的薪水就不值得\n• 最好的学校也未必教授高技能工作所需的核心职业技能，高等教育目标与毕业生的经济现实脱节\n• 专业日新月异，专业人士需不断学习，重返校园对多数人不现实", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "为什么超级学习是应对教育问题的好选择？", "back": "完全由学习者主导，时间灵活，以不变应万变，能准确定位你需要学习的东西，既不浪费时间也不浪费精力。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "超级学习能取代高等教育吗？作者如何看待？", "back": "能否取代并不重要。许多职业（医生、律师、工程师）中学位是硬性要求；但这些专业人士离开学校后仍需不断学习，自学新科目和新技能的能力依然是不可或缺的。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "技术趋势如何使自学变得前所未有的容易？", "back": "• 任何人有设备和互联网就能免费获取海量信息，比亚历山大图书馆更丰富\n• 哈佛、MIT、耶鲁等顶尖大学在网上免费发布最好的课程\n• 在线论坛让人足不出户参与小组学习\n• 软件加速学习：如学中文有间隔重复系统、一键翻译的文档阅读器、播客库、翻译应用", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "作者对技术与超级学习关系的结论是什么？", "back": "超级学习不需要新技术（这种做法历史悠久，许多名人都曾用过），但技术为学习创新提供了不可思议的机会，还有很多学习方法有待探索；富有进取心和效率意识的超级学习者将是第一批掌握它们的人。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "超级学习适用于个人职业发展的哪三种情况？", "back": "• 加速现有职业成长\n• 转到新的职业\n• 在竞争激烈的世界中获得潜在优势", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "科尔比·杜兰特（Colby Durant）的案例说明了什么？", "back": "大学毕业后在网络开发公司工作，通过超级学习项目学网页文案写作，向老板展示能力后获得晋升——说明选择一项有价值的技能攻克并精通，可以加速职业发展。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "维夏尔·麦尼（Vishal Maini）的案例说明了什么？", "back": "他原在科技领域做营销，想转入人工智能开发研究但缺乏精深技术技能；通过为期6个月的精心超级学习项目获得足够技能，成功转换职业领域，在梦寐以求的领域找到工作——说明技能欠缺是职业转换的主要障碍，超级学习可以填补。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "戴安娜·芬森菲尔德（Diana Fehsenfeld）的案例说明了什么？", "back": "新西兰图书管理员，面对经费削减和行业快速科技化，参加两个超级学习项目（统计学+编程语言R、数据可视化），结合图书管理员背景使职业生涯柳暗花明——说明超级学习可提升已有职业的技能储备。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "书中提到哪些超级学习者的动机例子？作者由此得出什么结论？", "back": "• 埃里克·巴隆：为从打拼完全符合自己愿景的事业中获得满足感，而非为当百万富翁\n• 罗杰·克雷格：参加《危险边缘》智力竞赛是因为从小就喜欢看这个节目\n• 本尼·刘易斯：学语言不是为了当翻译或博主，而是热爱旅行、乐于与人攀谈\n结论：最厉害的超级学习者是把学习技能的实用性与激发自身灵感结合在一起的人，驱动力是好奇心和挑战本身。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "超级学习超越学到的硬技能本身的额外利好是什么？", "back": "成功做成难事（尤其需要学习新东西的事）可以扩展一个人的自我定义，给你信心：你可以做以前不可能做到的事情；学习的核心是拓宽视野、发掘自身未被发现的潜能。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "陶哲轩是谁？为什么他对超级学习的普适性构成挑战？", "back": "当今最优秀的数学家之一：2岁学会阅读，7岁上高中数学课，17岁完成硕士论文，获普林斯顿博士和菲尔兹奖。他称自己没有特别费力也没有独特学习策略，博士前靠\"最后一刻集中学习\"，说明他的成就源于超高智商——这挑战了超级学习：如果天才无需主动学习方法也能成功，超级学习可能只是有趣领域而非可复制的方法。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "陶哲轩的成就与多数顶尖数学家有何不同？", "back": "许多数学家如罕见兰花，只在数学树的某一特定分支上茁壮成长；陶哲轩则经常与数学家合作，并在跨专业领域做出重要贡献，同事比作\"一个卓越的英语小说家突然写出了权威的俄罗斯小说\"。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "心理学家K.安德斯·艾利克森（K. Anders Ericsson）关于天赋的观点是什么？", "back": "只要进行特定类型的训练，就可以练就成为专业表演者所必需的大多数特质，只有身高和体型等无法改变的先天特征除外。（与之相反，许多研究人员认为智力大部分由基因决定。）", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "作者对\"天赋 vs 策略\"之争持什么立场？", "back": "倾向于折中主义：天赋确实存在并影响结果（尤其在陶哲轩这样的极端层面），但策略和方法也很重要。无论迟钝或聪明，只要运用得当，书中的每一条原则都能使你成为更有效的学习者。书的目的是区分哪些是可以采纳的最实际有用的方法，而非确定某人成功的唯一原因。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "没有大块完整时间，进行超级学习的三种方式是什么？", "back": "• 新的业余学习项目：核心是强度和优先考虑效率的意愿，全日制或每周几小时皆可；分散安排时间对长期记忆甚至可能更有效\n• 假期/空档期学习：在暂时失业、职业转型或休假期间突击学习\n• 重新设想现有的学习项目：把超级学习原则融入已经投入的学习时间和精力中", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "作者认为超级学习时间安排的关键是什么？", "back": "重要的是高强度、主动性和对有效学习的坚持，而不是时间表上的细节；不要让个别极端例子（如全日制严苛日程）妨碍你应用同样的原则，一切都可以定制或融入现有生活。", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "第2章结尾提出的关键问题是什么？", "back": "超级学习可能有价值，但它是可学习的吗？——\"超级学习\"只是对那些具有异乎寻常禀赋的人的描述，还是以前不是超级学习者的人也可能变成超级学习者？", "ch": "第2章 为什么超级学习很重要", "tag": "02"}, {"front": "第3章中,作者为什么之前只对超级学习者做\"观察\"是不够的?", "back": "因为作者见到的超级学习者都是在学有所成之后才接触的,只是对成功者的观察而非催生成功的实验。筛选足够多的人总能找到成功者(\"过滤鹅卵石也能找到金子\"),无法证明超级学习法本身的有效性和可行性。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "作者为验证超级学习法做了什么实验?", "back": "招募了约12人小组(大部分是博客读者),亲身参与并指导他们的超级学习项目,追踪学习过程而非只看结果。特里斯坦·德·蒙特贝洛就是其中之一。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "特里斯坦·德·蒙特贝洛在第3章中选择了什么超级学习项目?为什么不是钢琴?", "back": "公共演讲。他虽有音乐背景(弹吉他、乐队主唱),学钢琴看似是安全选择,但音乐家学另一种乐器不是研究超级学习广泛适用性的理想案例——那在他舒适区内。公共演讲对他几乎是从零开始,且有实用价值。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "德·蒙特贝洛为什么认为\"公共演讲是一种元技能\"?", "back": "因为公共演讲能帮助提升其他多种技能:自信、叙事、写作、创造力、面试技巧、销售技巧等,涉及很多不同领域。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "德·蒙特贝洛的演讲项目开始后遇到了哪两件\"幸运的事\"?", "back": "• 遇到经验丰富的演讲大师迈克尔·詹德勒,愿意在他的学习项目过程中提供指导\n• 恰好在世界公共演讲锦标赛截止日期前十天出现在赛场,赶上了参赛机会", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "德·蒙特贝洛在7个月里从零基础到进入世界演讲锦标赛前10名,他用了哪些高强度练习方法?", "back": "• 有时一天练习两次,每次演讲都录音并着魔似地分析瑕疵\n• 每次演讲都寻求大量反馈\n• 参加即兴表演课程训练即兴演讲\n• 请好莱坞导演用愤怒、单调、尖叫、说唱等方式做几十次变形演讲,摆脱\"恐怖谷\"的不自然感\n• 向戏剧背景的朋友学登台技巧,用肢体动作传递信息\n• 去中学给七年级学生演讲,获取最真实的反馈\n• 上台前先与观众交谈,建立联系", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "教练詹德勒给德·蒙特贝洛的两条关键指导是什么?", "back": "• 面临\"完善现有演讲稿还是从零写新稿\"的选择时,詹德勒的回答是:做对他来说最可怕的事(把他赶出舒适区)\n• \"你首先得让我在乎你。我理解为什么这对你很重要,但观众并不关心你。你得让我在乎你。\"", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "德·蒙特贝洛演讲项目带来了哪些超出预期的收获?", "back": "• 进入约3万人参赛的世界演讲锦标赛前10名(从零开始仅7个月)\n• 额外收获:善于叙事、更加自信、乐于沟通\n• 与詹德勒共同创办培训公司\"超级演讲\",首单客户费用两万美元,最终全职转行", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "德·蒙特贝洛与众不同的关键是什么(作者认为的启示)?", "back": "不是他相信自己能在6个月内从菜鸟进入世界锦标赛决赛,而是他执着的学习精神——他的目标不是达到某个既定目标,而是看看自己能走多远。这说明成为成功的超级学习者不是特殊才能者的必然结果,普通人坚持走完过程也能学好新技能。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "为什么作者认为超级学习无法被\"瓶装\"或标准化?", "back": "每个超级学习项目都是独特的,所需方法也各不相同。如果超级学习能被标准化,它就只是一种高强度的结构化教育形式。正是这种独特性让超级学习有趣,也使其难以归纳为循规蹈矩的模式。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "相比机械地照搬食谱或程序,遵循\"原则\"学习有什么优势?", "back": "原则可以让你解决以前从未遇到过的新问题(如真正理解物理学原则后可逆向思考解决新题)。原则虽然不能明确告诉你面对具体挑战该怎么做,但能提供好的指导、帮助你更好地理解世界。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "作者是如何归纳出超级学习9条原则的?", "back": "• 先观察超级学习者:如果每个超级学习者都以某种方式做成某件事,说明可能发现了普遍原则\n• 再与认知科学文献对比:寻找支持的机制和发现,尤其是比较不同学习方法的对照实验\n• 科学研究证实了超级学习者运用的许多学习策略,说明他们可能找到了学习的普遍原则", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "超级学习九大原则的前三条是什么?", "back": "• 元学习:首先绘制导图——先研究如何学习你要学的主题或技能,做好调查,利用过去的能力更轻松地学习新技能\n• 专注:磨刀不误砍柴工——培养集中注意力的能力,留出大块时间集中精力学习\n• 直接:勇往直前——针对想擅长的技能边做边学,不因贪图方便舒适而换成间接任务", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "超级学习九大原则的第四到六条是什么?", "back": "• 训练:攻克薄弱环节——毫不留情地改进弱项,把复杂技能分解成小单元逐一掌握,再合并起来\n• 检索:以测促学——考试不只是评估知识,更是创造知识;感到有信心前先自我测试,积极检索而非被动复习\n• 反馈:不要回避负面评价——不让自尊阻碍前进,从各种反馈中提取信号,知道该注意什么、忽略什么", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "超级学习九大原则的后三条是什么?", "back": "• 记忆:别往漏水的桶里加水——弄清自己忘记了什么、为什么忘记,目标是永远记住而非现在记住\n• 直觉:在形成直觉前要深入思考——通过运用和探索概念来培养直觉,不靠简单记忆技巧,要深刻理解本质\n• 试验:跨出舒适区去探索——原则只是起点,真正的精通还来自探索他人从未想象过的可能性", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "\"检索\"原则的核心主张是什么?", "back": "考试不仅仅是评估知识的方式,更是创造知识的方式。在学习效果感到有信心之前,先自我测试,督促自己积极地检索信息,而不是被动地复习。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "\"记忆\"原则为什么叫\"别往漏水的桶里加水\"?", "back": "强调要弄清自己忘记了什么、为什么忘记,针对性地解决遗忘问题。学会记住知识或技能,不是要现在记住,而是要永远记住——否则往\"漏水的桶\"里不断添加新知识也是徒劳。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "除9条原则外,书中还提到的更宽泛的\"超级学习精神\"是什么?", "back": "对自己的学习负责:决定你想学什么、你想怎么学,并制订自己的计划来学习你需要的东西。你是负责人,是最终为自己的结果负责的人。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "应该以什么态度对待超级学习的9条原则?", "back": "把它们当作灵活的指导方针,而不是严格的、非用不可的教条。学得好不只是遵循一套处方,还需要亲自尝试、认真思考所面临学习挑战的本质,并测试应对方案。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "德·蒙特贝洛参加的世界公共演讲锦标赛是怎样一项比赛?", "back": "国际演讲会每年举办的比赛,采用淘汰制:从演讲俱乐部开始选拔,晋级到越来越大的组织单位,最后选出少数人进入决赛。每年约有3万人参加。", "ch": "第3章 怎样成为超级学习者", "tag": "03"}, {"front": "《超级学习者》中\"元学习\"的含义是什么？", "back": "学习\"关于学习的知识\"：不是学习对象本身（如单词和短语），而是学习如何在这门学科中构建和获得知识，即学习如何去学习。", "ch": "原则1 元学习", "tag": "04"}, {"front": "前缀 meta（元）源自哪个希腊词？通常表示什么含义？", "back": "源自希腊单词 μετά，意思是\"超越\"，通常表示处理\"关于\"某物自身或更高层次的抽象概念。", "ch": "原则1 元学习", "tag": "04"}, {"front": "书中用\"学中文汉字\"举了什么元学习的例子？", "back": "学习汉字\"火\"本身是常规学习；而了解到汉字通常有偏旁、偏旁表示汉字描述的事物（如\"灶\"有火字旁，表明与火有关），这是元学习。", "ch": "原则1 元学习", "tag": "04"}, {"front": "语言学家丹·埃弗里特在演示中用了什么方法，30分钟内开始解码一门陌生语言？", "back": "「单语田野调查」法：由其老师肯尼斯·派克为学习土著语言开发。列出一系列对象和动作（树枝、石头、水果等），请说话者描述，从中拼凑出词汇、语法和发音，并不断造句测试验证。", "ch": "原则1 元学习", "tag": "04"}, {"front": "埃弗里特快速解码语言所依赖的两样\"宝库\"是什么？", "back": "• 一幅关于语言如何运作的详尽图表（基于多年经验的理论和假设，如判断出SVO结构）• 一种提供语言表达流畅途径的方法（单语田野调查法）", "ch": "原则1 元学习", "tag": "04"}, {"front": "得克萨斯州的研究如何证明元学习（元语言意识）的价值？", "back": "在学习法语时，西班牙语/英语双语者比单语者表现更好；而且上过西班牙语课程的双语者表现更好——上课有助于形成\"元语言意识\"，仅非正式地会一门语言并不能形成这种意识。", "ch": "原则1 元学习", "tag": "04"}, {"front": "为什么语言领域更容易观察到元学习与常规学习的区别？", "back": "因为两种不相关语言间的内容（词汇和语法）往往不同：学法语词汇对学汉语词汇帮助不大，但\"理解法语词汇的方式\"对学汉语很有帮助，两者区分更清晰。", "ch": "原则1 元学习", "tag": "04"}, {"front": "元学习研究的短期方式和长期收益分别是什么？", "back": "• 短期：在项目启动之前和期间集中研究，根据自身需要调整学习，规避风险、找到突破点 • 长期：项目越多，掌握的一般元学习技能越多，更自信、更享受学习、更少挫折，优势可能超过短期利益且容易被误认为天赋", "ch": "原则1 元学习", "tag": "04"}, {"front": "绘制元学习导图要回答的三个问题是什么？", "back": "• 为什么而学（学习动机）• 学什么（需要获得的知识和能力）• 如何学（利用的资源、环境和方法）", "ch": "原则1 元学习", "tag": "04"}, {"front": "超级学习项目的两大动机是什么？", "back": "• 工具型动机：以获得学习之外的 结果为目的（如图书管理员学统计和可视化数据以保住工作）• 内在动机：纯粹为了学习本身而学习（如一直想说流利法语）", "ch": "原则1 元学习", "tag": "04"}, {"front": "如果学习项目是出于工具型动机，开始前应该做什么？", "back": "做额外的研究，确定学习该技能或相关内容是否真能帮助你实现目标。否则可能像很多人读MBA后发现文凭并未带来更好的工作机会，白白花费时间和金钱。", "ch": "原则1 元学习", "tag": "04"}, {"front": "书中\"专家访谈法\"的具体做法是什么？", "back": "访谈那些已经取得你想要达到的成就的人（如想当建筑师就去访谈成功的建筑师），确认你的学习项目是否真正有助于实现目标。若对方认为你的项目没用或不重要，说明动机与项目不一致，应及时调整。", "ch": "原则1 元学习", "tag": "04"}, {"front": "给专家写第一封联系邮件的建议是什么？", "back": "• 简洁明了地说明你为什么联系他们 • 请求抽出15分钟回答一些简单问题 • 语言简洁、态度谦卑柔和 • 切忌要求超过15分钟的指导", "ch": "原则1 元学习", "tag": "04"}, {"front": "书中建议通过哪些渠道找到可以访谈的专家？", "back": "• 职业相关：找从事心仪职业的人，通过工作场所、会议、研讨会、Twitter或LinkedIn联系 • 其他目标：在相关主题的在线论坛上追踪频繁发帖的人并发邮件", "ch": "原则1 元学习", "tag": "04"}, {"front": "为什么作者更建议用电话而非电子邮件访谈专家？", "back": "文本通常不能很好地传达语气，你无法确切知道对方对项目的真实看法——稍微有兴趣的\"这是个好主意\"和满腔热情说出来的效果截然不同。", "ch": "原则1 元学习", "tag": "04"}, {"front": "内在动机的学习项目还需要问\"为什么\"吗？", "back": "需要。大多数可效仿的学习计划基于课程设计者认为重要的内容，若与你的目标不一致，你会花很多时间学不重要的东西或低估真正重要的内容。问\"为什么\"帮你评估学习计划是否符合预期目标。", "ch": "原则1 元学习", "tag": "04"}, {"front": "回答\"学什么\"时，作者建议用哪三栏来分类头脑风暴？", "back": "在一张纸上写三栏：\"概念\"\"事实\"\"程序\"，对所有需要学习的东西进行头脑风暴。此阶段列表不必完整准确，可随时修改调整。", "ch": "原则1 元学习", "tag": "04"}, {"front": "元学习三栏分类中，\"概念\"指什么？典型学科例子？", "back": "所有需要理解的东西（需灵活理解才能运用得当，而不仅仅是记忆）。如数学和物理是典型的概念型学科；法律跨越概念/事实界限（既有法律原则需理解，又有细节需记住）。", "ch": "原则1 元学习", "tag": "04"}, {"front": "元学习三栏分类中，\"事实\"指什么？典型例子？", "back": "所有需要识记的东西，只需记住、能在适当场合回忆即可，不需深入理解。如语言中的词汇、发音、语法；学微积分时三角恒等式记住足矣。", "ch": "原则1 元学习", "tag": "04"}, {"front": "元学习三栏分类中，\"程序\"指什么？典型例子？", "back": "所有需要练习的东西——必须采取的行动，可能几乎不涉及有意识思考。如骑自行车几乎全是程序性的；语言学习中发音需要练习（而新词汇需要记忆）。", "ch": "原则1 元学习", "tag": "04"}, {"front": "三栏头脑风暴完成后，下一步该做什么？", "back": "在最具挑战性的概念、事实和程序上做重点标记，了解学习瓶颈，然后寻找方法和资源来克服。例如医学需大量记忆→购买间隔重复软件；数学概念理解困难→通过向他人解释来检验是否真正理解。", "ch": "原则1 元学习", "tag": "04"}, {"front": "作者学人物肖像时如何利用元学习分析？", "back": "判断出成功关键在于准确确定面部特征的大小和位置（人对面部偏差极敏感），于是画大量素描并与参考照片反复对比，快速判断错误而无需猜测。", "ch": "原则1 元学习", "tag": "04"}, {"front": "回答\"如何学\"的两种方法是什么？", "back": "• 基准测试：找到人们学习该技能/学科的通用方法作为起点 • 强调/排除法：修改常规课程，强调与目标一致的部分，忽略或推迟不一致的部分", "ch": "原则1 元学习", "tag": "04"}, {"front": "\"基准测试\"的具体做法有哪些？", "back": "• 学术学科：查看大学的课程设置、教学大纲、课程列表或推荐教科书清单（如MIT、哈佛、耶鲁、斯坦福等网站）• 非学术技能：网上搜索已学会该技能的人的方法，或用专家访谈法掌握可用资源", "ch": "原则1 元学习", "tag": "04"}, {"front": "举一个书中\"强调/排除法\"的例子。", "back": "学法语是为去巴黎两周、在商店餐馆说法语→重点放在发音而非正确拼写；学编程只为做自己的应用→关注应用开发的内部原理而非计算理论。语言学家维克多·梅尔提倡学中文时先集中学说、再认汉字。", "ch": "原则1 元学习", "tag": "04"}, {"front": "什么是\"10%法则\"？", "back": "开始学习前，应投入约10%的预期学习时间做调查研究。如计划6个月、每周4小时（约100小时），就该花约10小时（约2周）做研究。项目规模越大百分比可下降（500-1000小时约5%）。目的是避免盲目抓住第一个资源或完全不考虑其他选择。", "ch": "原则1 元学习", "tag": "04"}, {"front": "做元学习研究时最大的风险是什么？", "back": "研究可能演变成拖延：在学习方法让人不适时，多做研究可能变成逃避学习的无奈之举，即\"分析性停滞\"。要在调查不足与分析性停滞之间找平衡——一旦察觉自己在拖延，就赶紧开始学习。", "ch": "原则1 元学习", "tag": "04"}, {"front": "为什么元学习研究不是一次性活动？何时应继续研究？", "back": "开始前你不清楚项目的进展速度和可能遇到的障碍，学习过程中需持续重新评估。例如作者画肖像进行到一半发现素描比对法收益递减，于是做第二轮研究，找到维特鲁威工作室的课程，系统学习技巧后大幅提高精确度。", "ch": "原则1 元学习", "tag": "04"}, {"front": "如何用\"边际收益\"判断该继续研究还是开始学习？", "back": "花几小时做更多研究（采访专家、搜索资源、搜索新方法），再用选择的方式花几小时学习，然后评估两者的相对价值：若觉得研究更有价值就继续研究；若额外研究帮助不大就坚持之前的计划。依据是收益递减定律——调查越接近理想方法，好处越少。", "ch": "原则1 元学习", "tag": "04"}, {"front": "书中提到收益递减定律下的调查研究回报有何特点？", "back": "回报往往起伏不定：可能花几小时一无所获，也可能碰巧发现完美的学习资源。收益递减定律和10%法则可以很好地估算需要做多少调查研究以及什么时候做。", "ch": "原则1 元学习", "tag": "04"}, {"front": "MIT挑战开始前，作者做了多长时间的元学习研究？", "back": "约6个月，用业余时间梳理了所有课程材料（了解常用的学习方法、大众接受的资源和工具及其优缺点）。", "ch": "原则1 元学习", "tag": "04"}, {"front": "元学习的\"真正好处\"是什么？", "back": "长期而非短期的：每个超级学习项目都会提升整体元学习能力（新学习方法、资源渠道、时间与动力管理），一个项目的成功让你有信心执行下一个，形成良性循环，最终获得实现雄心勃勃目标的自信和能力。这种优势常被误认为智力或天赋。", "ch": "原则1 元学习", "tag": "04"}, {"front": "为什么第一个学习项目并不能彰显超级学习的所有好处？", "back": "因为进行第一个项目时，你的元学习能力最低。每个项目都为下一个打基础，从而开始良性循环。超级学习者真正的收获是明白了掌握硬技能的学习过程，从而敢于挑战以前不敢想的目标。", "ch": "原则1 元学习", "tag": "04"}, {"front": "电影《降临》中语言学家破译外星语言用的是什么方法？", "back": "「单语田野调查」法——现实中由肯尼斯·派克为学习土著语言开发的方法，通过列出对象和动作来拼凑一门语言。", "ch": "原则1 元学习", "tag": "04"}, {"front": "为什么说通过元学习研究可以\"规避风险\"？", "back": "超级学习自我主导、强度大，学习者有更多调整空间，但不明智的选择也可能导致更糟的结果；通过元学习研究可以规避风险、找到突破点，并根据自身需要调整，避免学校\"一刀切\"教学（如浸入式语言学习、编码训练营可比正规学习更快）。", "ch": "原则1 元学习", "tag": "04"}, {"front": "人们与专注力的斗争通常有哪三种类型?", "back": "• 如何开始专注(拖延)\n• 如何持续专注(分心)\n• 如何优化专注的质量(找到合适的专注点)", "ch": "原则2 专注", "tag": "05"}, {"front": "玛丽·萨默维尔在家务缠身、不断被打扰的情况下,靠什么完成了翻译拉普拉斯《天体力学》这样的深奥学习?", "back": "• 特殊的专注力:能随时激活注意力\n• 有意识的自学习惯:忙里偷闲,特意留出时间研究特定主题\n• 能把一道难题\"留下\",回来后马上接着想,像在书上做记号一样", "ch": "原则2 专注", "tag": "05"}, {"front": "我们为什么会拖延?书中给出的简单答案是什么?", "back": "两种冲动之一(或兼有):\n• 有一种渴望驱使你去做别的事情\n• 有一种厌恶使你不想做手头这项任务", "ch": "原则2 专注", "tag": "05"}, {"front": "克服拖延的第一步是什么?", "back": "意识到你什么时候在拖延。拖延大多是无意识的,常被\"休息一下\"\"享受生活\"等念头掩盖。要用心感知:是避开任务的冲动更强,还是做其他活动的冲动更强。", "ch": "原则2 专注", "tag": "05"}, {"front": "对抗拖延的第一个\"心理拐杖\"(精神拐杖)是什么?", "back": "5分钟规则:告诉自己只需花5分钟试一试这项工作,再决定是否停下。因为不愉快的冲动持续不久,开始几分钟焦虑就会消退;一旦开始,可能就停不下来了。", "ch": "原则2 专注", "tag": "05"}, {"front": "5分钟规则失效、问题从\"开始难\"变成\"常停滞\"时,该换用什么方法?", "back": "番茄工作法:专注25分钟,然后休息5分钟。由意大利管理顾问弗兰西斯科·西里洛提出,因其计时器形似番茄(pomodoro)得名。", "ch": "原则2 专注", "tag": "05"}, {"front": "使用\"拐杖\"工具(如5分钟规则)时要遵循什么升级原则?", "back": "当仍被先前的问题(如无法开始)困扰时,不要转向要求更高的\"拐杖\"。应先解决当前问题,等你对项目有积极行动、拖延不再是问题时,拐杖就可以更换或扔掉。", "ch": "原则2 专注", "tag": "05"}, {"front": "作者学汉字卡片时用什么规则克服\"记不住就想放弃\"的冲动?", "back": "只有正确记住最近的一张卡片,才能退出。因为通常只需多坚持二三十秒就能记住,这条规则极大提高了记卡片的耐心。", "ch": "原则2 专注", "tag": "05"}, {"front": "没有重度拖延症的人,如何用日历帮助专注?", "back": "在日历中提前划出特定时间来完成学习项目。但只有真正遵循日程安排才有效;如果总做计划却不执行,就应回到5分钟规则和番茄工作法从头开始。", "ch": "原则2 专注", "tag": "05"}, {"front": "心流是什么?由谁提出?", "back": "心理学家米哈里·契克森米哈赖提出的全神贯注的精神状态:不再分心,大脑完全投入任务,感觉不到时间流逝。当任务既不太难也不太容易时出现,是介于无聊和安逸之间的愉快状态。", "ch": "原则2 专注", "tag": "05"}, {"front": "为什么艾利克森认为心流与刻意练习不兼容?", "back": "心流的特征与刻意练习的要求不一致:刻意练习需要对明确目标进行监控、反馈并寻找机会纠错,而心流中恰恰缺失这种自我意识。", "ch": "原则2 专注", "tag": "05"}, {"front": "书中对超级学习与心流关系的最终建议是什么?", "back": "• 不要抗拒心流,有些任务容易进入心流就顺其自然\n• 心流没有自然产生时也不要内疚\n• 高难度学习阶段往往令人沮丧,难以进入心流;现在倾注的心血会让日后熟练的实践更愉快", "ch": "原则2 专注", "tag": "05"}, {"front": "关于注意力持续时间,研究对\"集中长时间学习\"的建议是什么?", "back": "研究表明分散练习(把学习内容安排在不同时间段)比挤在一起练习记得更多;交织学习也表明从不同角度学习更高效。有几个小时时,最好学几个科目而非只专注一个,但代价是学习变得更困难。", "ch": "原则2 专注", "tag": "05"}, {"front": "书中建议的单次学习时长一般是多少?", "back": "50分钟到一个小时比较合适。若只有每周一次几小时的大块时间,可在每个小时结束时休息几分钟,把时间分散到科目的不同方面。最终要结合记忆效果、时间表和个性找到最适合自己的时长。", "ch": "原则2 专注", "tag": "05"}, {"front": "导致注意力下降和分散的三种干扰源是什么?", "back": "• 环境:手机、网络、电视、噪声、工具未备好等\n• 任务:学习任务本身认知要求低,难以让人投入\n• 大脑:负面情绪、烦躁不安、做白日梦", "ch": "原则2 专注", "tag": "05"}, {"front": "关于\"听音乐帮助专注\",书中的真实看法是什么?", "back": "现实可能是你不想做指定任务,音乐是一种低层次、有趣的分散注意力方法。应测试了解最适合自己的工作环境:开电视是真完成更多工作,还是只是让工作更好忍受?", "ch": "原则2 专注", "tag": "05"}, {"front": "为什么多任务处理不适合超级学习者?", "back": "多任务可能让人感觉有趣,但超级学习需要全神贯注于手头任务。与其放任这种无效学习的坏习惯,不如改掉它。", "ch": "原则2 专注", "tag": "05"}, {"front": "如何通过改变任务本身来提高专注力?", "back": "选择认知要求更高的学习方式:解决难题、制作手工、边做笔记边大声解释观点等,大脑\"分身乏术\"就更不容易分心。如阅读难以专注时,可努力记笔记以重新理解难概念,避免\"梦游式阅读\"。", "ch": "原则2 专注", "tag": "05"}, {"front": "突然涌起的负面情绪干扰学习时,正确的处理方法是什么?", "back": "接纳这种情绪:感知它,然后轻轻地把注意力转移到任务上,让情绪自行过去。不要试图抑制分心的念头(\"让它出现,感知它,然后释放它\")。若完全停下任务回应情绪,未来情绪会更易劫持你。", "ch": "原则2 专注", "tag": "05"}, {"front": "被消极情绪困扰仍坚持学习看起来没完成多少任务,为什么说不算浪费时间?", "back": "每次抗拒分心的冲动,分心的影响就会减弱;长期强化\"在情绪中坚持任务\"的能力大有裨益,未来遇到类似情况时继续专注会变得更容易。", "ch": "原则2 专注", "tag": "05"}, {"front": "什么是兴奋度(arousal)?它高时有什么心理特征?", "back": "对自身体能或警觉性的整体感觉(困倦时低,锻炼时高),由交感神经系统激活产生(心率加快、血压升高、瞳孔扩张、出汗)。高兴奋度产生敏锐的警觉性:注意力范围狭窄、可能难以持久。", "ch": "原则2 专注", "tag": "05"}, {"front": "兴奋度与任务复杂度如何匹配才能达到最佳专注?", "back": "• 高兴奋度:适于简单但需精准的任务(如投飞镖、投篮)\n• 低兴奋度(更轻松、注意范围更大的状态):适于复杂任务(如解数学题、写文章),需要心气平和\n太兴奋(如咖啡因过量)反而难以保持专注。", "ch": "原则2 专注", "tag": "05"}, {"front": "为什么做创造性任务卡住时,\"不专注\"反而有益?", "back": "休息抽身后关注点更宽泛,之前没意识到的东西会汇聚到思维中,可能在闲暇或睡梦中\"灵光一现\"。但前提是把注意力放在问题上足够久,头脑中留有残留思绪;完全不学习不能造就创新,只是休息能带来新视角。", "ch": "原则2 专注", "tag": "05"}, {"front": "睡眠不足实验中,嘈杂背景音对表现的影响说明了什么?", "back": "噪声提高了兴奋度:对兴奋度低的昏昏欲睡者有利(表现更好),对休息良好的高兴奋者不利(表现更差)。说明可以调节兴奋度来匹配任务,达到理想的专注水平。", "ch": "原则2 专注", "tag": "05"}, {"front": "根据兴奋度匹配原则,学习环境(如安静房间 vs 咖啡馆)应如何选择?", "back": "较低的兴奋度适于复杂任务:安静房间适合解数学题;更嘈杂的环境(如咖啡店)适于更简单的任务。应通过自我测试找出最适合自己的组合。", "ch": "原则2 专注", "tag": "05"}, {"front": "书中建议如何训练和提高专注力?", "back": "认清你所处的位置,从小事做起:如果一分钟都坐不住,先试着静坐半分钟,逐步延长(半分钟→1分钟→2分钟)。在一件事上自律不会自动让其他事自律,但每抗拒一次分心冲动,分心影响就会减弱;耐心坚持,几分钟的坚持也能成就伟大事业。", "ch": "原则2 专注", "tag": "05"}, {"front": "书中提到哪些科学家的极端专注轶事?", "back": "• 爱因斯坦阐述广义相对论时过于投入,后来得了胃病\n• 数学家保罗·埃尔德大量服用安非他命增强专注;停药打赌期间,数学工作被推迟约一个月\n• 欧拉右眼失明后说\"现在我可以更加专注了\"", "ch": "原则2 专注", "tag": "05"}, {"front": "超级学习原则3\"直接\"的定义是什么?", "back": "将学习与实际的使用情境或环境紧密联系起来:总是把要学的技能与其最终运用的环境相联系,在用中学。", "ch": "原则3 直接", "tag": "06"}, {"front": "瓦兹欧·贾斯瓦尔毕业后找不到建筑工作时,采用了什么策略最终获得工作?", "back": "• 在印刷建筑蓝图的印刷店打工,实地研究真实建筑图纸• 自学目标公司使用的Revit设计软件• 结合两者制作一个专注单一建筑的新作品集,证明自己从第一天就能上手工作", "ch": "原则3 直接", "tag": "06"}, {"front": "贾斯瓦尔的作品集为何比大学作品集更受公司青睐?", "back": "大学课程集中在设计与理论,与实际建筑规范、建筑成本和软件运用脱节;新作品集用的是公司实际使用的软件和实际风格的图纸,公司无需再对他进行漫长培训。", "ch": "原则3 直接", "tag": "06"}, {"front": "书中列举了哪些\"想学A却用间接方式学习\"的典型例子?", "back": "• 想学会一门语言,却只玩语言应用,不与人真正交流• 想做协作/专业开发的程序设计,却独自写代码脚本• 想成为演讲者,却只读沟通的书,不当众练习演讲", "ch": "原则3 直接", "tag": "06"}, {"front": "为什么人们普遍陷入间接学习的陷阱?", "back": "因为直接学习让人感觉不适、无聊或沮丧,所以人们满足于图书、讲座或有趣的应用程序,寄希望于它们最终能让技能自动形成。", "ch": "原则3 直接", "tag": "06"}, {"front": "书中间接学习在传统课堂中的典型表现有哪些?", "back": "• 还没弄明白要解决什么问题就先掌握公式• 记外语单词不是因为需要运用,而是因为单词表上有• 花大量时间解答高度理想化、毕业后再也不会碰到的问题", "ch": "原则3 直接", "tag": "06"}, {"front": "从认知角度看,多邻国式的\"从词库选词翻译\"与真实对话有什么本质区别?", "back": "真实对话必须从记忆中主动检索要用的单词(不会就找替代词),而应用只是从高度有限的词库中挑出匹配译文,两者是完全不同的认知过程,前者难得多。", "ch": "原则3 直接", "tag": "06"}, {"front": "在MIT挑战中,作者认为最有价值的资源是什么?为什么?", "back": "习题集(而非讲座录音)。因为只有大量做与期末考试基本相似的习题,在要习得的技能上实践,才能真正学懂悟透;大多数学生却把听讲座当主要方式。", "ch": "原则3 直接", "tag": "06"}, {"front": "什么是\"迁移\"?为什么被称为\"教育的圣杯\"?", "back": "迁移指将在一种环境(如教室)中学到的东西应用到另一种环境(如现实生活)。这体现了我们对几乎所有学习的期望,达不到这一标准的行为很难被称为学习,所以被视为教育的圣杯。", "ch": "原则3 直接", "tag": "06"}, {"front": "心理学家罗伯特·哈斯克尔对近90年学习迁移研究的总结是什么?", "back": "过去90年的研究清楚地表明,无论作为个体还是教育机构,我们都没有实现任何显著水平上的学习迁移;他称之为\"一桩教育丑闻\"。", "ch": "原则3 直接", "tag": "06"}, {"front": "书中有哪些迁移失败的研究证据?", "back": "• 上过高中心理学课的大学生,大学心理学成绩并不比没上过的高,有些甚至更差• 上过经济学课的大学毕业生与没上过的人答题表现无差别• 大学物理课程成绩优异的学生,也常无法解决形式稍有变化的基本问题", "ch": "原则3 直接", "tag": "06"}, {"front": "1901年桑代克和伍德沃斯的研究攻击了什么教育理论?", "back": "\"正统学科理论\"——认为大脑类似肌肉,训练记忆、注意力、推理等任何\"肌肉\"都能带来整体性提高(拉丁语和几何学普及教学背后的理论)。他们的论文证明迁移能力比人们想象的差得多。", "ch": "原则3 直接", "tag": "06"}, {"front": "桑代克的研究结论对今天哪些流行观点仍有警示意义?", "back": "• 建议人人学编程或批判性思维以提高智力的说法• \"大脑训练\"游戏宣称训练一组认知任务能深化日常推理——这类正统学科理论的新形式早在一百多年前就已被证伪。", "ch": "原则3 直接", "tag": "06"}, {"front": "威尔伯特·麦基奇如何看待迁移的矛盾性?", "back": "\"迁移是自相矛盾的:当我们想要它时,我们得不到,但它时时刻刻都在发生。\"如使用类比、会滑冰再学滑旱冰都是迁移;若迁移真的不可能,我们将无法正常工作。", "ch": "原则3 直接", "tag": "06"}, {"front": "哈斯克尔如何解释\"教育中迁移难\"与\"生活中迁移处处发生\"的脱节?", "back": "当我们的知识有限时,迁移往往更难;在某个领域学会更多知识和技能后,我们会变得更灵活,更容易将知识应用到狭义环境之外的广阔天地。", "ch": "原则3 直接", "tag": "06"}, {"front": "作者对迁移问题补充了什么自己的假设?", "back": "正因为大多数正规学习都是间接性的,所以迁移很难发生;在真实环境中学习,才能学到课堂抽象环境中无法共享的无数微妙细节。", "ch": "原则3 直接", "tag": "06"}, {"front": "直接学习从哪两个方面解决迁移问题?", "back": "• 学习与最终运用的领域直接联系,大大减少远距离迁移的需求• 在真实环境中学习,掌握隐藏的细节和技能,使知识更容易迁移到新的学习环境", "ch": "原则3 直接", "tag": "06"}, {"front": "作者在\"不准说英语\"项目中发现的、课堂上很少教的重要技能是什么?", "back": "快速使用手机词典或翻译应用在交谈中弥补语言不足——这类现实中成千上万的微小技能,只有通过在真实环境中实践才能学到。", "ch": "原则3 直接", "tag": "06"}, {"front": "书中\"精算师朋友赌博\"的例子说明了什么?", "back": "学统计学多年的精算师在赌场上并未把课堂知识与\"无法打败赌场\"联系起来——说明学到的知识往往停留在学习环境中,不经直接联系就难以应用到真实场景。", "ch": "原则3 直接", "tag": "06"}, {"front": "最简单的直接学习法是什么?", "back": "在你想学有所成的领域多加实践(做中学):想学语言就直接对话,想做游戏就直接做游戏,想通过考试就直接做习题集。把大部分学习时间花在你想做得更好的事情上。", "ch": "原则3 直接", "tag": "06"}, {"front": "当真实场景无法模拟或进入时,如何坚持直接学习?", "back": "人为创建与目标认知特征基本相似的项目或环境:如贾斯瓦尔无法被建筑公司雇用,就学目标公司用的同一款软件、按实际图纸类型设计作品集;克雷格用往届真实竞赛题模拟训练。", "ch": "原则3 直接", "tag": "06"}, {"front": "克雷格训练《危险边缘》时,为什么用往届真题比\"环境细节\"更重要?", "back": "对迁移重要的是认知特征而非环境外观:真实往届题能训练节目特有的答题与检索技能;背景颜色等信息不改变答题方式,无关紧要;若改用其他游戏或随机读维基百科,提问方式、主题难度和检索技能都会偏离。", "ch": "原则3 直接", "tag": "06"}, {"front": "对于\"深入理解某学科\"这类目标(如维夏尔·麦尼学机器学习),如何做到直接学习?", "back": "明确知识的应用场合(如与人交流、清晰表达和讨论概念),并据此设定产出——麦尼制作了一个解释机器学习基础的迷你课程,使学习直接指向目标。", "ch": "原则3 直接", "tag": "06"}, {"front": "为什么精通某一领域的超级学习者往往是迁移大师?", "back": "因为知识深度使迁移更容易:知识架构随投入的时间和精力变得灵活,可被更广泛应用;如丹·埃弗里特因语言掌握深度,学新语言比只学过一门外语的人容易得多。", "ch": "原则3 直接", "tag": "06"}, {"front": "什么是基于项目的学习?它为什么有效?", "back": "以产出成果的项目(而非课程)来组织学习。如果学习的目的是制造,做项目就能保证至少学会如何制造;而按部就班上课会花大量时间记笔记和阅读,仍达不到目标。如通过做自己的电脑游戏学编程。", "ch": "原则3 直接", "tag": "06"}, {"front": "书中学军事史的超级学习者是如何设计项目的?", "back": "以撰写一篇原创论文为项目,因为他的最终目标是能就军事史进行有见地的交谈;单纯阅读大量图书而不动笔,远不如写论文直接有效。", "ch": "原则3 直接", "tag": "06"}, {"front": "沉浸式学习指什么?它带来哪两大好处?", "back": "把自己置身于可以练习目标技能的环境中。好处:• 被迫做比平时多得多的练习(别无选择)• 接触技能更广泛多样的运用场景,不得不学新单词和短语来应对", "ch": "原则3 直接", "tag": "06"}, {"front": "沉浸式学习除语言外还有哪些应用形式?", "back": "加入学习社团也能产生类似效果,因为它鼓励人不断接触新想法和挑战;例如新手程序员加入开源项目,让自己面对新的编码挑战。", "ch": "原则3 直接", "tag": "06"}, {"front": "当技能无法直接实践(如驾驶飞机、做手术)时,模拟法为何仍然有效?", "back": "对迁移重要的不是环境的外观特征(房间、衣着等),而是认知特征——在情境中做决定并提取脑中储存的知识。只要模拟遵循任务的认知要素(如飞行模拟器让飞行员充分运用辨别和决策能力),不必追求更好的图像声音,就能像真实环境一样有效。", "ch": "原则3 直接", "tag": "06"}, {"front": "什么是\"撒手锏\"策略?特里斯坦·德·蒙特贝洛是如何使用的?", "back": "把自己放进要求非常高的环境,使所需技能水平完全包含在目标中,从而不错过任何重要反馈。蒙特贝洛备战世界演讲锦标赛时去中学演讲,因为中学生冷酷无情,笑话不好笑或表达无聊会立刻写在脸上,而演讲俱乐部的反馈要么温和要么敷衍。", "ch": "原则3 直接", "tag": "06"}, {"front": "书中举例的\"撒手锏\"式挑战有哪些?", "back": "• 本尼·刘易斯参加最高水平的德语考试,以此推动学习• 一位朋友预先决定公开展示摄影作品,迫使自己不断精进• 进入严格环境时觉得\"没准备好\"的恐惧通常只是暂时的,一旦开始就会适应", "ch": "原则3 直接", "tag": "06"}, {"front": "每学新知识时应自问哪两个问题,以避免迁移问题?", "back": "• 我要将这个知识应用到哪里、如何应用?• 我是否采取了实际行动,把所学知识与它的应用环境联系起来?若没有,迁移问题可能已出现苗头。", "ch": "原则3 直接", "tag": "06"}, {"front": "超级学习原则4\"训练\"的核心定义是什么?", "back": "在学习中确定一个限速步骤(薄弱环节),将它分离出来并进行专门训练,因为它支配着你在该技能上的整体能力。", "ch": "原则4 训练", "tag": "07"}, {"front": "什么是化学反应中的\"限速步骤\"?它如何类比学习?", "back": "多步骤化学反应中最慢的一步会形成瓶颈,决定整个反应的速率。学习类似:复杂技能中的某个薄弱部分会形成瓶颈,决定你掌握整体技能的速度。", "ch": "原则4 训练", "tag": "07"}, {"front": "书中举了哪些\"限速步骤\"的例子?", "back": "• 数学学习:算术和代数是基础,若薄弱则即使掌握概念也会解错\n• 外语学习:词汇量决定流利程度,词汇太少则表达受限", "ch": "原则4 训练", "tag": "07"}, {"front": "除了短板瓶颈,支持训练的另一个理由是什么?", "back": "认知负荷问题:练习复杂技能时,注意力、记忆等认知资源必须分散到任务的多个方面,导致无法在某一特定方面投入足够精力去改进。", "ch": "原则4 训练", "tag": "07"}, {"front": "只根据整体任务表现评价自己,为什么会让进步变慢?", "back": "为提高某一方面,你可能在该方面投入太多注意力,导致其他方面表现下降;整体表现变差,而某一特定部分实际上变好了——整体评价会掩盖这种局部进步。", "ch": "原则4 训练", "tag": "07"}, {"front": "训练如何解决认知负荷问题?", "back": "通过简化技能,把认知资源集中到一个方面上。例如富兰克林专注于重构文章逻辑顺序时,无需担心用词、语法和论点内容。", "ch": "原则4 训练", "tag": "07"}, {"front": "直接学习(原则3)与训练(原则4)表面上的矛盾是什么?", "back": "直接学习关乎整个技能在现实中的最终运用,而训练只练孤立的部分,看似会把学习引向错误方向。", "ch": "原则4 训练", "tag": "07"}, {"front": "如何化解直接学习与训练的矛盾?", "back": "把两者看作一个更大学习周期中交替出现的阶段,即\"先直接学习后反复训练\"的方法。", "ch": "原则4 训练", "tag": "07"}, {"front": "\"先直接学习后反复训练\"方法的第一步是什么?", "back": "直接练习该技能:弄清技能将在何处、如何使用,练习时尽可能接近真实使用情境(如通过说来学语言、通过写软件学编程),确保迁移不出问题。", "ch": "原则4 训练", "tag": "07"}, {"front": "\"先直接学习后反复训练\"的第二步是什么?", "back": "分析直接练习中的表现,分离出限速步骤,或因需同时关注太多方面而难以改进的子技能,然后单独训练直到熟练掌握。", "ch": "原则4 训练", "tag": "07"}, {"front": "\"先直接学习后反复训练\"第三步(回到直接学习)有哪两个目的?", "back": "• 整合:解决孤立训练技能迁移到复杂环境中的小问题,像结缔组织连接单独增强的肌肉\n• 检验训练设计:反馈能帮你发现训练是否触及项目核心难点,避免在与最终目标无关的东西上浪费时间", "ch": "原则4 训练", "tag": "07"}, {"front": "学习阶段不同,直接练习与训练的循环节奏应如何变化?", "back": "越早进入该过程,循环应越快(初学者可在小段时间内交替);接近精通时,时间可能集中在训练上,因为拆解技能越精准、提升单项子技能越难,需要更长训练周期。", "ch": "原则4 训练", "tag": "07"}, {"front": "应用训练原则有哪三个主要难点?", "back": "• 弄清楚什么时候训练什么(识别限速步骤)\n• 设计出能提高目标子技能、又不人为去除实际困难的训练项目\n• 训练艰难且令人不快(练短板需要勇气,练已擅长的更愉快)", "ch": "原则4 训练", "tag": "07"}, {"front": "难以判断该训练什么时,书中建议的关键做法是什么?", "back": "实验:先对阻碍你的因素做一个假设,针对它训练,再用\"先直接后训练\"循环快速获得反馈,验证假设对错。", "ch": "原则4 训练", "tag": "07"}, {"front": "训练设计策略1\"时间切段\"是什么?", "back": "在较长的动作序列中确定一个时间段来单独训练。如音乐家找出曲目中最难的乐段逐一练到完美再融入整曲;运动员专练上篮、罚球;语言学习者反复操练关键短语。", "ch": "原则4 训练", "tag": "07"}, {"front": "训练设计策略2\"认知成分\"是什么?", "back": "当技能由语法、发音、词汇等必须同时管理的认知成分构成时,设计只需练习其中一部分的练习。如学普通话时用不同声调朗读单词并录音,专练声调而不分心记词义或组句。", "ch": "原则4 训练", "tag": "07"}, {"front": "训练设计策略3\"模仿\"是什么?", "back": "当不写完整作品就无法单独训练某方面时,抄写别人(或自己过去)的作品中你不想训练的部分,从而专注训练你想提高的部分;既省时间又降低认知负担。", "ch": "原则4 训练", "tag": "07"}, {"front": "作者学画画时如何运用\"模仿\"策略?", "back": "不仅照着图片画,还照着别人的画作练习,把注意力集中在写实画法技巧上,只需决定如何框景、包含哪些细节。", "ch": "原则4 训练", "tag": "07"}, {"front": "训练设计策略4\"放大镜法\"是什么?", "back": "当必须创建新内容且无法剪辑分离时,在某项子技能上花远超常比例的时间。如作者写论文时花十倍于平时的时间做研究,以此培养研究新习惯、掌握新技巧。", "ch": "原则4 训练", "tag": "07"}, {"front": "训练设计策略5\"前提条件\"是什么?", "back": "从完全不具备预备知识的技能直接开始尝试;做得不好时后退一步,学习最基本的内容再重复练习。如埃里克·巴隆直接做游戏学像素艺术,遇到颜色问题就回头学颜色理论。", "ch": "原则4 训练", "tag": "07"}, {"front": "\"前提条件\"策略有什么好处?", "back": "省去大量时间,不必学习那些对整体表现没有多大推动作用的子技能,只补真正必要的预备课程。", "ch": "原则4 训练", "tag": "07"}, {"front": "为什么很多人觉得做功课式的反复训练是浪费时间?", "back": "因为他们不知道所做事情背后的驱动力,也不知道如何运用到更广泛的场景中;在没有场景预设的情况下,反复训练会让人头脑麻木。", "ch": "原则4 训练", "tag": "07"}, {"front": "超级学习中训练与传统训练有何不同?", "back": "超级学习由学习者自我主导而非外部因素驱动:你自己找到方法,通过攻克最困难的项目来加速学习;精心设计的训练激发创造力和想象力,而非毫无意义的苦差事。", "ch": "原则4 训练", "tag": "07"}, {"front": "富兰克林为提高写作做过哪些具体训练?", "back": "• 对《旁观者》文章做笔记,过几天凭记忆重构,再与原文对比找差距\n• 把散文改成韵文,用同义词替换字词以扩充词汇\n• 打乱笔记顺序,重写时自己确定论点的正确排序\n• 学苏格拉底问答法后,用\"谦卑的探寻者\"风格写作,避免直接冲突和激烈争辩", "ch": "原则4 训练", "tag": "07"}, {"front": "整章反复出现的学习模式是什么?", "back": "脑力劳动比简单劳动对学习更有好处——训练的难度和实用性呈正相关;下一原则\"检索\"中,困难本身可能就是更有效学习的关键。", "ch": "原则4 训练", "tag": "07"}, {"front": "孤立训练出的子技能迁移回整体时,作者用什么比喻?", "back": "像建立结缔组织来连接你单独增强的肌肉——即使精心设计的训练也会有小的迁移问题,需要回到直接学习中整合。", "ch": "原则4 训练", "tag": "07"}, {"front": "超级学习原则5“检索”是什么意思?", "back": "以测促学:合上书,主动尝试从记忆中唤起(检索)所学内容,而不是被动地反复复习。从记忆中提取知识的行为本身就是强大的学习工具。", "ch": "原则5 检索", "tag": "08"}, {"front": "卡皮克和布朗特比较了哪四种学习策略?", "back": "• 一次性复习课文\n• 反复复习课文\n• 自由回忆(不看课本尽量回忆)\n• 概念图", "ch": "原则5 检索", "tag": "08"}, {"front": "卡皮克和布朗特的实验中,哪种学习策略的实际测试效果最好?", "back": "自由回忆(自我检索)明显优于其他所有策略,在根据课文提问的测试中,自由回忆组比其他组多记住近50%的内容。", "ch": "原则5 检索", "tag": "08"}, {"front": "实验中学生对各学习策略效果的预测,与实际结果有何差异?", "back": "• 重复复习组预测自己分数最高\n• 自由回忆组预测自己表现最差\n• 实际结果恰恰相反:自由回忆组最好,说明人们无法凭感觉准确判断什么方法有效", "ch": "原则5 检索", "tag": "08"}, {"front": "如何反驳“检索练习好只是因为和考试形式相似”的说法?", "back": "卡皮克和布朗特做了另一个实验,最终测试改为生成概念图(与概念图学习法任务极接近),结果自由回忆组仍然胜出,说明检索的优势不是因为与测试形式相似。", "ch": "原则5 检索", "tag": "08"}, {"front": "如何反驳“检索练习好只是因为带来了反馈”的说法?", "back": "在实验中,学生做自由回忆时,对漏掉或做错的项目并没有收到任何反馈,但检索组仍胜出。说明提取行为本身就是学习工具,不仅仅是因为反馈。", "ch": "原则5 检索", "tag": "08"}, {"front": "拉马努金是如何学习的?他用的书有什么特点?", "back": "• 用的书是卡尔《纯数学与应用数学初等结果概要》,书中定理大多没有解释或证明\n• 他没有答案可查,只能自己推理、从脑海中检索\n• 无意中练习了最有效的学习方法之一:检索练习", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是学习判断(JOL)?", "back": "JOL(Judgments of Learning):人无法确切知道自己学得多好,只能根据学习经验的线索(如处理任务是否流畅轻松)来判断自己学得如何。感觉轻松=以为学会了,但这个感觉常误导人。", "ch": "原则5 检索", "tag": "08"}, {"front": "为什么学生会误以为被动复习比检索更有效?", "back": "• 学习判断基于流畅度:重读材料很流畅,感觉学得多;检索困难,感觉没学会\n• 刚学完几分钟内,被动复习组表现确实更好\n• 但几天后再测,检索练习远胜被动复习——被动学习的短期收益不能转化为长期记忆(流利度错觉)", "ch": "原则5 检索", "tag": "08"}, {"front": "成绩较差的学生在学习策略选择上有什么典型误区?", "back": "他们倾向先反复复习材料,直到觉得“准备好了”才去练习测试。但实验干预强迫他们更早练习检索后,他们学到更多。检索不需要“准备好”才做。", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是“可取的困难”?谁提出的?", "back": "心理学家R.A.比约克(R.A. Bjork)提出:只要检索方向正确,检索越艰难,学习效果越好。困难不是检索学习的障碍,反而是有益的。", "ch": "原则5 检索", "tag": "08"}, {"front": "按难度排序:自由回忆、线索回忆、识别(选择题)哪种检索最难、效果最好?", "back": "难度与效果排序:自由回忆(无提示)>线索回忆(有提示)>识别测试(如选择题,只需认出答案)。越艰难的检索学习效果越好。", "ch": "原则5 检索", "tag": "08"}, {"front": "学习后立即测试和延迟测试,哪个效果更好?", "back": "延迟测试(延迟到足以让人有点遗忘)比立即测试更能提高记忆效果。但注意:延迟太久会完全忘记内容,需找平衡——间隔足够长以加深记忆,又不长到什么都记不住。", "ch": "原则5 检索", "tag": "08"}, {"front": "本尼·刘易斯到国外第一天就开口讲当地语言,这体现了什么原理?", "back": "“可取的困难”+检索:困难环境中,每次检索回忆一个单词或短语,记忆都比在教室里同样检索深刻得多,更远胜只看词汇表。", "ch": "原则5 检索", "tag": "08"}, {"front": "如果检索难度太大完全做不出来怎么办?", "back": "• 不要等完全有储备才检索,但首次测试可稍作推迟,比学完马上测更好\n• 也不要拖太久以免全忘\n• 可以通过减少线索和提示来增加难度,前提是稍后能获得反馈", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是前向测试效应?", "back": "对以前学过的信息定期测试,能使学习新信息变得更容易。即使当下没有东西可检索(如开课前先考试),检索行为本身也能提高未来的学习效果。", "ch": "原则5 检索", "tag": "08"}, {"front": "对前向测试效应有哪两种机制解释?", "back": "• 搜索机制:尝试寻找还没学会的知识,会预先建立“搜索路径”,一旦遇到相应知识就能立即调取(像先铺一条通往未建大楼的路)\n• 注意力机制:面对不会的问题,大脑会自动调整注意力资源,留意看起来像解答方案的信息", "ch": "原则5 检索", "tag": "08"}, {"front": "应该把检索时间花在什么内容上?", "back": "没有人有时间掌握一切,应选择掌握与目标直接相关、使用频率高的内容;其余内容会查即可。作者在MIT挑战中重点检索与编程直接相关的概念,模态逻辑只需记住“是做什么的、何时有用”。", "ch": "原则5 检索", "tag": "08"}, {"front": "如何用“直接法”决定该检索什么?", "back": "直接实践会自动引导你检索使用过程中高频出现的知识点:经常用的东西自然被反复检索而记牢,很少使用或易查到的东西不会被检索——而这些往往无关紧要。", "ch": "原则5 检索", "tag": "08"}, {"front": "完全依赖直接实践来检索有什么局限?", "back": "• 头脑中不存在的知识无法帮你识别问题(不知道有某函数,连查都无从查起)\n• 会忽略“有用但非必需”的知识:如程序员只知方案B就能解决问题,便不再检索更优的方案A\n• 需要多接触不同情况和方法(哪怕被动接触)来弥补", "ch": "原则5 检索", "tag": "08"}, {"front": "互联网时代能随时查资料,为什么还需要把知识记在脑中?", "back": "如果头脑中没有一定的知识储备,就无法识别问题、无从查起;查找只能辅助已有知识的人。检索式记忆仍是解决问题的基础。", "ch": "原则5 检索", "tag": "08"}, {"front": "检索练习的五种具体策略是什么?", "back": "• 记忆卡(问题-答案配对)\n• 自由回忆(读后凭记忆写出所有内容)\n• 问题集(把笔记改写成问题)\n• 自创挑战(记下实际应用的问题日后解答)\n• 闭卷学习(切断查阅提示的可能)", "ch": "原则5 检索", "tag": "08"}, {"front": "记忆卡适合什么类型的学习内容?", "back": "适合“特定线索+特定答案”配对型知识:外语词汇、地图、解剖图、定义、方程式等。缺点:不适合应用环境多变的知识(如编程中实时应用的概念),现在多被间隔重复软件(原则7)取代。", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是自由回忆检索法?作者如何使用它?", "back": "读完书的一部分或听完一节课后,把能记住的所有东西写在一张白纸上。方法很难但正因困难才特别有效。作者写本书做研究时,每读完一篇期刊文章就做一次快速自由回忆练习。", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是问题集法?怎么做?", "back": "把笔记内容重新表述成问题而非答案:不写“《大宪章》是1215年签署的”,而写“《大宪章》是什么时候签署的”,并标注答案位置。这样笔记就成了日后练习检索的材料。", "ch": "原则5 检索", "tag": "08"}, {"front": "用问题集法记笔记时,作者犯过什么错误?有什么改进规则?", "back": "错误:问太多细节问题(如某神经回路放电速率、谁提出的理论)——这是惰性,只需懒洋洋复述事实。改进:重申一章或每部分的主旨;规则是文章每个部分只限问一个问题,迫使自己确认主要观点。", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是自创挑战检索法?适合什么场景?", "back": "学习应用型技能(而非记忆信息)时,被动浏览材料时创建一些挑战性问题记下来,日后实际解答。例如学到新编程技巧,记下一个演示该技巧的实际例子。", "ch": "原则5 检索", "tag": "08"}, {"front": "什么是闭卷学习?", "back": "切断查阅资料的可能,让几乎任何学习活动变成检索:如合上书自己生成概念图(效果远好于照书画图)、直接练习时不查参考手册,迫使信息储存在大脑而非手册中。", "ch": "原则5 检索", "tag": "08"}, {"front": "哪些超级学习者/名人使用了检索练习?", "back": "• 拉马努金:对着无解答的定理书自行推导\n• 富兰克林:凭记忆重构文章的逻辑顺序练写作\n• 玛丽·萨默维尔:没蜡烛夜读时在脑中检索解答问题\n• 罗杰·克雷格:不看答案练习回答百科小问题", "ch": "原则5 检索", "tag": "08"}, {"front": "检索练习要真正有效,还需什么配套条件?", "back": "必须知道自己挖出的答案是否正确——即需要反馈。这也是下一原则(反馈)的主题:人们常回避评估信息,但处理这些信息虽然不易,却很重要。", "ch": "原则5 检索", "tag": "08"}, {"front": "超级学习原则6是什么?", "back": "反馈:不要回避负面评价。主动获取反馈(尤其是负面反馈)是超级学习者加速学习的关键策略。", "ch": "原则6 反馈", "tag": "09"}, {"front": "超级学习策略与传统方法在反馈上的核心区别是什么?", "back": "区别在于反馈的即时性、准确性和强度。超级学习者使用的反馈往往更快、更准、更强。", "ch": "原则6 反馈", "tag": "09"}, {"front": "艾利克森的刻意练习研究中,反馈对达到专家水平有何作用?", "back": "获取即时反馈的能力是达到专家水平的重要因素。没有反馈会长期停滞不前,甚至导致能力下降(如医生随经验增加诊疗水平反而变差)。", "ch": "原则6 反馈", "tag": "09"}, {"front": "克鲁格和德尼西的大型元分析发现反馈的效果如何?", "back": "反馈总体效果是积极的,但在超过38%的案例中反馈实际上产生了负面影响——关键在于反馈的类型。", "ch": "原则6 反馈", "tag": "09"}, {"front": "反馈在什么情况下会适得其反?", "back": "当反馈针对的是人的自尊心时(如\"你真聪明\"或\"你很懒\"这类对个人的评价),通常对学习有害。表扬这种常见反馈通常对进一步学习也无益。", "ch": "原则6 反馈", "tag": "09"}, {"front": "除了反馈针对自尊心之外,还有哪些导致反馈产生负面效果的原因?", "back": "• 受试者没有建设性地使用反馈\n• 拒绝了反馈\n• 降低了对自己的期望\n• 完全放弃了学习任务", "ch": "原则6 反馈", "tag": "09"}, {"front": "对反馈应采取什么筛选态度?", "back": "对真正能带来改进的具体信息要敏感,而忽略(不采取行动)没有具体改进价值的反馈。不要对每个反馈都反应过度。", "ch": "原则6 反馈", "tag": "09"}, {"front": "阻碍人们进步的是负面反馈本身吗?", "back": "不是。对听到批评的恐惧通常比体验反馈本身更让人不适,阻碍进步的是对反馈的恐惧,而非负面反馈太多。", "ch": "原则6 反馈", "tag": "09"}, {"front": "面对令人恐惧的反馈,书中建议的行动是什么?", "back": "直接处理最困难的情况。即使最初反馈很消极,也有助于减少开始项目的恐惧;若后续证明过于苛刻无所助益,还可以调整。", "ch": "原则6 反馈", "tag": "09"}, {"front": "书中提出的三种反馈类型是什么?按强度从弱到强排序。", "back": "• 结果反馈(最常见、影响最小):只告诉你整体做得如何\n• 信息反馈:告诉你做错了什么\n• 纠正性反馈(最好):还告诉你如何改正", "ch": "原则6 反馈", "tag": "09"}, {"front": "什么是结果反馈?举例说明。", "back": "只告诉你总体上做得如何,不告诉你哪些方面好哪些差的反馈。如考试分数、通过/不通过、演讲后的掌声或嘘声、产品上市后的整体销售情况。", "ch": "原则6 反馈", "tag": "09"}, {"front": "结果反馈有哪两个学习上的好处?", "back": "• 提供激励基准,让你更新自己的进度\n• 展示你尝试的不同方法的相对优点,判断何时该改变学习方法", "ch": "原则6 反馈", "tag": "09"}, {"front": "什么是信息反馈?举例说明。", "back": "告诉你做错了什么、但不一定告诉你如何改正的反馈。如异国用当地语言交流时对方困惑的眼神、演讲时观众分心的反应、程序运行的错误信息、画画时自己看画判断笔触效果。", "ch": "原则6 反馈", "tag": "09"}, {"front": "信息反馈通常如何获得?与哪个原则相关?", "back": "通过你与环境的直接互动获得(包括自我反馈),通常与原则3\"直接\"相匹配。", "ch": "原则6 反馈", "tag": "09"}, {"front": "什么是纠正性反馈?为什么说它最好?", "back": "不仅告诉你做错了什么,还告诉你如何改正的反馈。它胜过结果反馈(不能指出改什么)和信息反馈(不能指出怎么改),可最大程度加速学习。", "ch": "原则6 反馈", "tag": "09"}, {"front": "纠正性反馈通常从哪里获得?还有哪些自动获得的方式?", "back": "通常需要教练、导师或老师。但正确的学习材料也能自动提供:如练习册的作业与解答切换、记忆卡和主动回忆答题后展示正确答案。", "ch": "原则6 反馈", "tag": "09"}, {"front": "纠正性反馈有什么局限或风险?", "back": "• 需要找到老师、专家或指导者\n• 可能不太可靠:不同人可能给出相互矛盾的建议(如有人说放慢语速有人说加快)\n• 需要存在\"正确\"答案或公认专家,否则可能给出错误的更改建议", "ch": "原则6 反馈", "tag": "09"}, {"front": "试图把反馈\"升级\"为更强形式时要注意什么?", "back": "• 结果反馈升为信息反馈:需按每个具体事项分别获得反馈;若反馈本质是整体评估,强行细化可能适得其反(如游戏试玩家只作整体评估)\n• 信息反馈升为纠正性反馈:需有正确答案或公认专家,否则错误的修改建议反而有害", "ch": "原则6 反馈", "tag": "09"}, {"front": "关于反馈速度,课堂与实验室研究分别怎么说?", "back": "真实课堂环境下即时反馈比延迟更有效(库利克等)。实验室研究似显示延迟反馈更有效,但最简单的解释是再次呈现问题和回答提供了间隔后的第二次接触。作者建议:更快的反馈。", "ch": "原则6 反馈", "tag": "09"}, {"front": "反馈太快有什么风险?", "back": "在还没尽全力回答之前就看到正确答案,会把检索练习变成被动复习(效果不好)。对难题建议设计时器,鼓励认真思考而不是放弃去查答案。", "ch": "原则6 反馈", "tag": "09"}, {"front": "改进反馈的策略1\"消除噪声\"是什么意思?", "back": "反馈中有信号(有用信息)和噪声(随机因素造成的无用信息)。不要基于一个数据改变整个方法;可通过修改和选择关注的反馈流来减少噪声,或寻找代理信号(如用\"读到文章末尾的读者百分比\"替代原始数据)。", "ch": "原则6 反馈", "tag": "09"}, {"front": "改进反馈的策略2\"达到最佳难度点\"是什么?", "back": "只有当结果难以预测时,反馈才提供更多信息。调整任务难度:失败太多就简化问题;成功太多(总是顺遂)就加大难度或提高标准。要避免总让你对自己表现感觉良好(或不好)的情况。", "ch": "原则6 反馈", "tag": "09"}, {"front": "什么是元反馈?", "back": "不是关于表现的反馈,而是评估你学习策略整体成功程度的反馈。其重要形式是学习速度(如跟踪Elo等级分增长、模拟考进步、词汇量和错误数)。", "ch": "原则6 反馈", "tag": "09"}, {"front": "元反馈的两种使用方法是什么?", "back": "• 判断何时继续当前策略、何时换方法:学习速度像涓涓细流说明当前方法回报递减\n• 比较两种学习方法哪种效果更好(如MIT挑战中拆分考题尝试不同方法并监测学习速度)", "ch": "原则6 反馈", "tag": "09"}, {"front": "改进反馈的策略4\"高强度、快速反馈\"指什么?", "back": "反馈意见越丰富、次数越多越好,尤其在默认学习模式几乎没有反馈时。如蒙特贝洛比一般演讲者更频繁登台、刘易斯的语言浸入式学习。", "ch": "原则6 反馈", "tag": "09"}, {"front": "高强度快速反馈除了信息优势外还有什么优势?", "back": "情绪优势:能更快克服最初的厌恶感;知道结果将被评估是难以置信的动力,会让你竭尽全力做到最好。其激励优势最终甚至超过信息优势。", "ch": "原则6 反馈", "tag": "09"}, {"front": "为什么克里斯·洛克在成名后仍去小喜剧俱乐部表演?", "back": "在大演出中他做的每件事都让听众觉得有趣,却无法知道是什么让一个笑话真正好笑。在小俱乐部实验新素材,当他\"不想搞笑\"时,能从观众真实反应中获得哪些内容有效的信息反馈,同时无视名气带来的自动积极反馈。", "ch": "原则6 反馈", "tag": "09"}, {"front": "为什么人们往往没有充分寻求反馈?", "back": "因为反馈令人不适,甚至残酷、令人沮丧(如台下尴尬的沉默、用新语言说话时沟通能力急剧下降的痛苦)。人们选择避开重大打击性反馈,也因此失去了快速学习的机会。", "ch": "原则6 反馈", "tag": "09"}, {"front": "长期大量接触反馈会带来什么改变?", "back": "养成接受反馈的习惯后,处理反馈变得更容易,不会在情绪上过度反应。最好早点进入状态接受打击,短期压力换来长期的心理适应。", "ch": "原则6 反馈", "tag": "09"}, {"front": "《超级学习者》原则7的完整表述是什么?", "back": "原则7 记忆:别往漏水的桶里加水。核心是:有策略地记忆,防止学到的东西从头脑中溜出去。", "ch": "原则7 记忆", "tag": "10"}, {"front": "奈杰尔·理查兹在2015年前后创造了什么拼词比赛奇迹?", "back": "他不会说法语,却仅用9个星期准备,就赢得了法语版世界拼词比赛冠军。法语词条约386000种有效形式,几乎是英语(约20万)的两倍。", "ch": "原则7 记忆", "tag": "10"}, {"front": "为什么不会法语也能赢法语拼词比赛?", "back": "• 口语中单词的意思、发音、语感都重要;拼词游戏中这些都不重要• 拼词里的单词只是字母组合,记忆拼词单词与记忆母语单词是不同的记忆技巧• 泰国也有两位前世界冠军英语并不流利", "ch": "原则7 记忆", "tag": "10"}, {"front": "奈杰尔·理查兹记忆拼词单词的方法是什么?", "back": "• 阅读单词表,从两个字母的单词开始逐级向上,只关注字母组合,忽略定义、时态和复数• 骑自行车时在脑海中一遍遍回顾单词列表(积极回忆和排练)• 他自述:没有特殊秘密,只是记忆单词的问题,需要学习的献身精神", "ch": "原则7 记忆", "tag": "10"}, {"front": "书中说哪些职业都离不开记忆?举例说明。", "back": "• 程序员:代码命令的语法• 会计师:比率、规则和规章制度• 律师:先例和法规• 医生:成千上万的医学知识(解剖学到药物相互作用)", "ch": "原则7 记忆", "tag": "10"}, {"front": "关于医生执业年数与医疗质量的研究发现了什么?", "back": "医生执业年数与护理质量之间存在反向关系:工作时间越长,医疗服务越差,因为从医学院学到的知识逐渐被遗忘,即使全职在岗。", "ch": "原则7 记忆", "tag": "10"}, {"front": "艾宾浩斯的遗忘曲线发现了什么规律?", "back": "学习新知识后会以难以置信的速度遗忘,知识呈指数衰减,刚学完忘得最快;随后遗忘逐渐减慢。大脑像漏水的桶,但大多数洞在顶部附近,底部的水漏得较慢。", "ch": "原则7 记忆", "tag": "10"}, {"front": "心理学家解释遗忘的三种主要理论是什么?", "back": "• 衰退:记忆随时间流逝而衰退• 干扰:新旧记忆相互竞争、覆盖• 遗忘的线索(检索失败):记忆还在,只是难以获取", "ch": "原则7 记忆", "tag": "10"}, {"front": "衰退理论的缺陷是什么?", "back": "它把时间当作遗忘的唯一原因,过于偏颇:人能清晰回忆童年早期的事,却不记得上周二早餐吃了什么。生动、有意义的事比平庸、任意的事更容易被记住,与学习时长的间隔没有直接关系。", "ch": "原则7 记忆", "tag": "10"}, {"front": "什么是前摄干扰和后摄干扰?", "back": "• 前摄干扰:先前学到的信息使获取新知识更困难(存储空间已被占用),如已有联想妨碍记住新定义• 后摄干扰:学习新东西会抑制旧记忆,如学法语后想再说西班牙语时法语单词跳出来", "ch": "原则7 记忆", "tag": "10"}, {"front": "举一个前摄干扰的学习例子(书中'负强化')。", "back": "心理学中'负强化'的'负'意为'缺席'(移除痛苦刺激以鼓励某行为),而非'坏的'。但'负'早已在头脑中有了'坏'的含义,导致很难记住负强化的定义,易与惩罚混淆。", "ch": "原则7 记忆", "tag": "10"}, {"front": "遗忘的第三种理论('被遗忘的线索')如何解释遗忘?", "back": "许多记忆并没有真正被遗忘,只是难以获取:检索链中的一个环节被切断,使整段记忆无法访问。恢复线索或找到另一条路径就能记起。这解释了话到嘴边说不出,也解释了再学习比初学快(修复比新建容易)。", "ch": "原则7 记忆", "tag": "10"}, {"front": "线索遗忘理论存在什么问题?", "back": "回忆是创造性的重建过程,不是被动过程:记忆在回忆中经常被修改、增强或操纵,通过新线索找回的'失去的记忆'可能是捏造的,如目击者对创伤事件的'恢复'记忆。", "ch": "原则7 记忆", "tag": "10"}, {"front": "书中应对遗忘的四种记忆机制是什么?", "back": "• 间隔:分小段时间学习,插入间隔• 程序化:把知识变成自动化技能• 精益求精(过度学习):掌握后继续练习• 助记法:把抽象信息转换为生动图像或空间地图", "ch": "原则7 记忆", "tag": "10"}, {"front": "为什么想建立长期记忆就不应死记硬背?", "back": "把学习时间分成小段并插入间隔,短期内因有机会遗忘而表现稍差,但长期表现更好。10小时分成10天每天1小时,优于一天学10小时。", "ch": "原则7 记忆", "tag": "10"}, {"front": "使用间隔学习时,间隔过长有什么风险?", "back": "间隔太近效率低,隔得太远会忘记已学内容。极端例子:用10年的间隔学习,很可能在进入第二阶段前就完全忘掉之前学的。", "ch": "原则7 记忆", "tag": "10"}, {"front": "SRS(间隔-重复学习系统)是什么?适合学什么?", "back": "用算法安排复习时机的系统,以最少努力记住最多知识。适合以一问一答呈现的事实、冷知识、词汇、定义;难以应用依赖复杂关联、只能通过实际操作建立的知识。代表工具:Anki、皮姆斯勒法、忆术家、多邻国。", "ch": "原则7 记忆", "tag": "10"}, {"front": "书中举了哪些不依赖软件的简单间隔复习方法?", "back": "• 理查兹:打印单词表看一遍,骑车时在脑海中过一遍• 语言:每周/每月一次30分钟Skype对话练习保持口语• MIT挑战后:每周半小时写代码复习• 原则:不苛求完美,足够好就行,总比完全放弃好", "ch": "原则7 记忆", "tag": "10"}, {"front": "程序性知识与陈述性知识在记忆持久性上有何差异?", "back": "程序性技能(如骑自行车,知道'怎么做')比需要外显回忆检索的陈述性知识(如勾股定理,知道'什么')更不容易被遗忘。", "ch": "原则7 记忆", "tag": "10"}, {"front": "打字如何体现从陈述性到程序性知识的转换?", "back": "初学时需回忆每个字母键的位置并低头看;练习多了就不需思考手指移动,能整个单词一次打出。此时外显记忆反而消失:要说出W键位置,必须想象把手放在键盘上假装按一下——知识已编码进运动动作。", "ch": "原则7 记忆", "tag": "10"}, {"front": "如何利用'程序化持久'来对抗遗忘?", "back": "• 不均衡分配练习,反复强调一组核心信息使其程序化,存储更久• 确保在实践结束前把一定数量的核心知识完全程序化• 把某些技能程序化,作为其他知识的线索或访问点", "ch": "原则7 记忆", "tag": "10"}, {"front": "作者认为MIT挑战中最大的记忆失误是什么?", "back": "未能有意识地把核心知识(应用计算机科学最基本的技能)完全程序化——被程序化的内容是不经意的。他在之后的语言学习和肖像画项目中加以改进。", "ch": "原则7 记忆", "tag": "10"}, {"front": "精益求精(过度学习)指什么?典型实验怎么做的?", "back": "掌握了任务(能正确完成)之后继续额外练习,成绩不再提高,但能延长记忆储存时间。实验:先练习到能一次性正确完成(学习阶段),再进行不同程度的额外练习。", "ch": "原则7 记忆", "tag": "10"}, {"front": "精益求精的效应持续多久?最适合什么场景?", "back": "在典型实验中效应较短,多练一次只增加一到两周的记忆,是短期现象。最适合急救、应急方案等很少练习但需保持敏感度的技能。若与间隔、程序化结合于长期项目中,可能产生更持久的影响。", "ch": "原则7 记忆", "tag": "10"}, {"front": "书中提到的两种精益求精方法是什么?", "back": "• 核心练习:不断练习完善技能的核心部分,常与沉浸式或粗泛式学习结合• 高级实践:把技能提高到更高一级,在更难领域中应用低级技能的核心,从而实现精益求精", "ch": "原则7 记忆", "tag": "10"}, {"front": "代数学习研究说明了什么防止遗忘的道理?", "back": "数年后重考,学过代数的学生大多遗忘严重,好学生和差学生的遗忘率相同;但学过微积分的学生遗忘没那么剧烈——提升到更高级的技能水平能不断强化早期技能,防止遗忘。", "ch": "原则7 记忆", "tag": "10"}, {"front": "学校语言学习者 vs 沉浸式学习者,谁更能保持口语?为什么?", "back": "学校学习者词汇量更大、语法理解更深,却会在基本短语上犯错,因为他们平均分配练习覆盖整个大纲;而沉浸式不断重复一组核心短语和模式,这些核心模式被程序化,多年不忘,能维持对话。", "ch": "原则7 记忆", "tag": "10"}, {"front": "助记法的两个共同特征是什么?", "back": "• 超特定化:为记住非常特定的信息模式而设计• 将抽象或任意的信息转换为生动的图片或空间地图", "ch": "原则7 记忆", "tag": "10"}, {"front": "关键字法的操作步骤是什么(以法语chavirer为例)?", "back": "1. 把外语单词转成母语近音词:chavirer→'shave an ear(切耳)'2. 创造结合发音与词义的奇异生动意象(如倾覆的船上立着一只刮胡须的巨大耳朵)3. 需要时顺着联想链条回忆。难点联想被拆成几个易记的链接。练习后每次只需15~20秒。", "ch": "原则7 记忆", "tag": "10"}, {"front": "助记法有哪两个主要缺点?", "back": "• 前期投入大:即使最令人印象深刻的系统(记π数千位)需大量投入,而记忆数字本身用处不大,社会已用票据和电脑代替• 回忆不如直接记忆自动:助记的外语单词太慢,无法流畅造句——助记法只是记忆困难信息的桥梁,不是建立持久记忆的最后一步", "ch": "原则7 记忆", "tag": "10"}, {"front": "什么情况下值得使用助记法?", "back": "• 需要以非常具体的形式记忆高度密集的信息,且将在几周或几个月内使用• 作为中间策略,帮助顺利获取密集的初始信息(如语言和术语学习),与SRS配合形成从'不可能记住'到'不可能忘记'的桥梁", "ch": "原则7 记忆", "tag": "10"}, {"front": "作者对助记法的总体评价是什么?", "back": "在纸张、电脑等外在记忆出现之前,记忆术曾是主流,但现代社会已发展出应对机制(票据、电脑)。作者认为助记法更像很酷的技巧,不应作为学习活动的基础,尽管部分超级学习者坚定地使用它们。", "ch": "原则7 记忆", "tag": "10"}, {"front": "理查兹等记忆密集型超级学习者的共同特征可归纳为什么?", "back": "• 积极回忆• 间隔排练• 对高强度练习的偏执投入(如骑车时在脑中复习单词表)• 而非依赖什么独一无二的天才方法", "ch": "原则7 记忆", "tag": "10"}, {"front": "拼词比赛中优秀玩家的记忆要求是什么?", "back": "要记住几乎所有短单词以及大量7字母、8字母单词(一次用完7张牌可得50分奖励'bingo');还需快速从打乱的字母块中'找出'有效单词并计算最高得分,如理查兹用CDHLRN+空格拼出CHLORODYNE而非显而易见的CHILDREN。", "ch": "原则7 记忆", "tag": "10"}, {"front": "作者在选择记忆方法上的建议是什么?", "back": "选择既能达到目标、又简单易行易于坚持的方法:语言高强度阶段用SRS;口语靠定期对话保持;其他科目只要持续练习并有能力再学习,允许一定程度遗忘。理论上不够理想的方法,可能因更易坚持而实际效果更好。", "ch": "原则7 记忆", "tag": "10"}, {"front": "《超级学习者》原则8(直觉原则)的完整表述是什么?", "back": "直觉:在形成直觉前要深入思考。理解一个观点的意思后,再来问它是否正确(数学家埃里特·毕夏普)。", "ch": "原则8 直觉", "tag": "11"}, {"front": "书中用哪位物理学家作为\"直觉\"的典型案例?", "back": "理查德·费曼——诺贝尔奖得主、物理学家,能一眼看出别人处理几个月的问题的解决方案。", "ch": "原则8 直觉", "tag": "11"}, {"front": "数学家马克·卡克把天才分为哪两类?费曼属于哪一类?", "back": "• 普通天才:一旦理解了他们的所作所为,我们会确信自己也能做到\n• 魔术师:即使理解了他们做了什么,对过程也一无所知\n卡克认为费曼是\"最高水准的魔术师\"。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼在普特南数学竞赛中的表现如何?", "back": "该竞赛极难(一些考试中值为零),费曼却早早走出考场,分数最高获得第一名,且与后四名选手差距巨大。", "ch": "原则8 直觉", "tag": "11"}, {"front": "曼哈顿计划期间,玻尔为什么坚持先与费曼单独交流?", "back": "玻尔说:\"他是唯一一个不怕我的人。如果他有一个疯狂的想法,他就会说出来。\"", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼能快速算出1729.03的立方根,他自己的解释是什么?", "back": "他恰好知道1立方英尺=1728立方英寸,所以答案比12略多一点;多余的1.03约为1/2000,而小分数的立方根余数是该余数的1/3。这靠的是对运算结果的超强记忆和数字直觉的插补运算,而非魔法。", "ch": "原则8 直觉", "tag": "11"}, {"front": "哪些事实说明费曼并非全知的\"天才\",他的能力有局限?", "back": "• 大学历史成绩班里倒数第5,文学倒数第6,美术比93%同学差\n• 智商测试125分,只比大学毕业生平均(115)稍高\n• 面对数学中挑战物理直觉的反定式定理(如物体可切成无限碎片的抽象设定),他的直觉会失灵\n• 人类学等人文领域表现糟糕。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼自己如何解释他对物理学的\"神奇直觉\"?", "back": "\"我有一个思考方案——我一直在编造例子。\"他不是遵循等式,而是想象等式描述的情况,用自造的例子推演,信息越充分推演越准确,因此别人出错他一眼能看出来。", "ch": "原则8 直觉", "tag": "11"}, {"front": "心理学研究中,物理专家和新手给物理问题分类时的核心区别是什么?", "back": "• 新手:按表面特征分类(如滑轮、斜面)\n• 专家:按深层原理分类(如\"这是能量守恒问题\")\n专家能直接用正确途径解题,新手则需更多试错。", "ch": "原则8 直觉", "tag": "11"}, {"front": "为什么学生不直接从原理出发思考问题?", "back": "因为他们没有能力抓住本质。只有不断解决问题、积累足够经验,才能建立深层思维模型。直觉听起来神奇,其实是\"有条理地处理了大量问题后的经验产物\"。", "ch": "原则8 直觉", "tag": "11"}, {"front": "国际象棋大师与新手的记忆差异实验说明了什么?", "back": "给大师和新手看真实棋局再复现,大师记得更多,因为他们记住的是有可识别模式的更大\"组块\";新手只能一个一个记棋子。区别不在预计算更多步棋,而在于长期经验积累的巨大心理表征库(约5万个组块)。", "ch": "原则8 直觉", "tag": "11"}, {"front": "在随机摆放的棋盘实验中,国际象棋大师的优势为何消失了?", "back": "随机棋局不是真实对局产生的,没有可供调用的记忆模式库,大师只能像初学者一样一个棋子一个棋子地记,不再有显著优势——说明专家能力依赖真实经验中积累的模式。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼用\"云尺\"骗学生的故事说明了什么学习问题?", "back": "云尺任何握法底部都与水平线相切,这其实是微积分基本事实(任何光滑形状都如此),学生却信以为真。说明许多学生只记住特定问题的答案,却没真正思考所学知识在课本之外如何应用——学习经不起事实检验。", "ch": "原则8 直觉", "tag": "11"}, {"front": "培养直觉的规则1是什么?如何操作?", "back": "规则1:不要轻易放弃难题。可使用\"奋斗计时器\":想放弃时,把计时器再设定10分钟,让自己再努力一点。好处:(1)给自己足够思考时间,可能真的解决问题;(2)即使失败,之后再找到解决方案时也更容易记住这个方法。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼\"不懂李政道和杨振宁的理论\"故事的启示是什么?", "back": "妹妹点出问题不在不能理解,而在于他没有\"发明问题\"。费曼一丝不苟通读论文后发现理论其实不难,他只是害怕查阅资料。启示:他的\"理解\"标准更高——不是边读边点头赞同,而是要能自己重新推理、证明结果。", "ch": "原则8 直觉", "tag": "11"}, {"front": "培养直觉的规则2是什么?爱因斯坦的对应做法是什么?", "back": "规则2:通过证明来理解。不直接接受他人的推导结论,而是先自己深入思考、在心里重新推理结果。爱因斯坦小时候就以相似三角形为基础证明勾股定理,通过证明数学和物理命题来建立直觉能力。", "ch": "原则8 直觉", "tag": "11"}, {"front": "什么是\"解释性深度错觉\"?谁提出的?", "back": "研究人员丽贝卡·劳森提出:人们以为自己理解了某事物,细究起来其实并没有真正弄懂。因为我们通常通过各种信号评估是否\"知道\"事实,却很少被要求实际检验\"是否理解\"。", "ch": "原则8 直觉", "tag": "11"}, {"front": "丽贝卡·劳森的\"画自行车\"实验说明了什么?", "back": "要求参与者画出自行车草图(座位、把手、轮胎、踏板、链条放对位置),结果大多数人画不出来,尽管他们天天使用自行车并自认为很了解。说明\"以为理解了\"的错觉是学习深层知识的障碍——不经实际测试,人容易高估自己的理解。", "ch": "原则8 直觉", "tag": "11"}, {"front": "培养直觉的规则3是什么?其心理学依据是什么?", "back": "规则3:总是从具体的例子开始。依据:(1)迁移研究表明,人是在接触许多具体例子后才学会抽象的一般规则;(2)\"处理水平效应\"——决定记忆的不是花多少时间,而是处理信息时思考的深度。", "ch": "原则8 直觉", "tag": "11"}, {"front": "\"处理水平效应\"实验的结果是什么?", "back": "复习单词时,被告知要考试(有动机)与只被要求复习,对记忆没有影响;但记忆技巧有影响:注意词义褒贬(深层处理)的人记住的单词,几乎是只注意是否含字母e(简单处理)的人的两倍。", "ch": "原则8 直觉", "tag": "11"}, {"front": "为问题构思具体例子除了加深理解还有什么额外好处?", "back": "• 提供反馈:如果无法想出合适的例子,说明理解得不够好,可先回顾材料再继续\n• 深层处理提高以后的记忆能力\n这是费曼学习风格的特点:利用丰富的反馈过程测试自己是否真正理解。", "ch": "原则8 直觉", "tag": "11"}, {"front": "培养直觉的规则4是什么?", "back": "规则4:不要欺骗自己。费曼名言:\"你自己是最容易被欺骗的人。\"他对自己的理解力深表怀疑,为\"知道\"树立了严格标准,甚至预警了心理学的复制危机。", "ch": "原则8 直觉", "tag": "11"}, {"front": "什么是邓宁-克鲁格效应?", "back": "当一个人对某门学科不太了解,却认为自己比真正了解该学科的人掌握的知识更多时发生的现象。因为缺乏某学科知识时,往往也不能正确评估自己的能力。了解越多,问题越多;问题越少,了解越少。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼用什么方法避免自欺欺人?巴西讲课事件揭示了什么?", "back": "方法:问很多\"愚蠢\"的问题(如阴极是正的还是负的)。巴西讲课事件:学生抱怨他不讲课只问简单问题,费曼后来意识到——学生其实不知道答案,只是不想承认,并错误地以为只有自己不知道。清楚解释、敢于问\"愚蠢\"问题可以防止自欺。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼技巧的三个步骤是什么?", "back": "(1)在一张纸顶部写下你想理解的概念或问题;\n(2)在下面解释这个想法,像必须说服他人理解一样——概念则讲给从未听过的人,问题则解释如何解答及如何理解解答步骤;\n(3)陷入困境(理解无法给出明确答案)时,转向书、笔记、老师或参考资料找答案。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼技巧的关键作用机制是什么?", "back": "消除\"解释性深度错觉\"。它强迫你说出想理解的细节,像画自行车能确认是否掌握各部分组装一样,快速显示你对学科的真实了解,让理解漏洞变得明显。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼技巧的三种应用方式分别是什么?", "back": "• 应用1:完全不理解的东西——拿着书,在自己的解释和书中解释之间来回切换验证\n• 应用2:似乎不能解决的问题——一步一步分析解释问题,而非简单总结(总结会跳过核心难点)\n• 应用3:扩展对重要概念的直觉——生成说明性例子、类比或可视化,让学得比你少的人也能理解。", "ch": "原则8 直觉", "tag": "11"}, {"front": "费曼技巧应用3的要点是什么?书中用什么类比理解电压?", "back": "不要只解释细节或原始材料,而是生成例子、类比和可视化。作者用\"水的类比\"理解电压:电线像不同高度的水槽,电池像把水往上抽的水泵,电阻像带水管的水龙头——这帮助他形成视觉图像并应对新情况。", "ch": "原则8 直觉", "tag": "11"}, {"front": "作者用费曼技巧攻克MIT《机器视觉》课程的哪个概念?如何做?", "back": "摄影测量学(基于不同光照条件下拍摄的2D照片确定物体三维形状)。他把课本放在身边,写了几页笔记,勾勒概念的大致框架,抓住主旨和要点以深入理解。", "ch": "原则8 直觉", "tag": "11"}, {"front": "为什么说费曼的直觉是\"经验产物\"而非纯粹天赋?", "back": "• 心算靠记住大量数学模式(如1立方英尺=1728立方英寸、ln2≈0.69315)\n• 开锁靠反复练习:半小时尝试400种组合,平均4小时打开保险箱\n• 刚上大学就和朋友反复读量子力学早期图书,领先同学\n• 还制定了详细时间表分配兴趣爱好时间。", "ch": "原则8 直觉", "tag": "11"}, {"front": "仅仅花大量时间学习为什么不一定产生深刻直觉?", "back": "费曼的经历证明:很多学生花大量时间却只记住特定问题的答案,不知道答案在课本之外如何应用(如云尺骗局)。没有包治百病的良方,但添加\"经验和智慧\"一剂肯定有帮助——即运用不放弃难题、通过证明理解、从具体例子开始、不自欺等规则。", "ch": "原则8 直觉", "tag": "11"}, {"front": "书中最后总结费曼最大的天赋是什么?", "back": "将执着钻研和玩耍结合在一起的能力。他开锁时的热情与解开量子电动力学秘密时一样;作者毫不怀疑他有天赋,但人们往往只归因于天生禀赋而忽略他的大量努力。", "ch": "原则8 直觉", "tag": "11"}, {"front": "超级学习原则9是什么?其核心主张是什么?", "back": "试验:跨出舒适区去探索。核心主张是随着技能提升,仅靠效仿他人不够,需要主动尝试不同的资源、方法和风格,找到适合自己的独特发展道路。", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高成为伟大画家的起点有什么不利之处?", "back": "• 26岁才开始学绘画,起步太晚(艺术大师通常幼年展露天赋)\n• 被认为没有明显绘画天赋,素描技法粗糙幼稚\n• 人格障碍和坏脾气,与导师、同伴不断冲突,难以接受正规教育", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高应对绘画学习挑战的总体模式是什么?", "back": "确定一种学习资源、方法或风格 → 投入极大精力和时间创作大量作品 → 找出仍存在的不足 → 转向新的资源、方法或风格重新开始。这类似科学家的模式:假设、实验、结果、重复。", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高早期的自学绘画资源和方法有哪些?", "back": "• 使用查尔斯·巴格《炭笔练习》《绘画课程》和卡萨格《绘画入门指南》逐级练习\n• 大量临摹,如反复临摹米勒的《播种者》\n• 画素描,尤其是画模特写生", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高接受他人建议的试验(如莫夫、高更的建议)结果如何?说明了什么?", "back": "尝试芦苇笔、不同媒介(木炭、粉笔、水彩、蜡笔)、凭记忆作画等都失败了。说明试验不一定要成功才有价值——过程中获得了尝试新技法的机会,为后来的突破积累经验。", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高在色彩和艺术理念上经历了怎样的转变?", "back": "早期倾向柔和、灰暗的深沉色调(如《吃土豆的人》),认为自然中只有色调和阴影;后来转向完全相反的风格——明亮、互补的色彩,常常是强加在场景上而非从自然提取;立场也从偏好传统绘画转向前卫派。", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高试验成功的两个关键因素是什么?", "back": "• 方法和理念的多样性:广泛尝试多种方法、理念和资源,取长补短,最终找到适合自己的风格\n• 学习强度:异常执着,坚持不懈,有时每天创作一幅新画,不理会负面反馈", "ch": "原则9 试验", "tag": "12"}, {"front": "为什么随着技能提升,试验变得越来越重要?(原因一:教学资源)", "back": "学习的早期阶段最容易上手、得到最佳支持(大家都从同一起点开始)。随着技能提升,能教你的人越来越少,能保持同步的同学越来越少,你开始与学习榜样分道扬镳,提升变得日益个性化。", "ch": "原则9 试验", "tag": "12"}, {"front": "为什么'越精进越意味着需要遗忘'?", "back": "因为精进不仅是学会解决以前不能解决的问题,还必须忘记陈旧无效的旧方法。新手和大师的差别常在于大师知道用最有效、最干净、没有后患的最佳方法。当精进变成'忘却'而非积累的过程,试验就成了学习的同义词。", "ch": "原则9 试验", "tag": "12"}, {"front": "为什么说试验对高手至关重要?(原因二、三:停滞期与独创性)", "back": "• 掌握基本技能后,能力容易进入停滞期,需要走出舒适区尝试新事物才能突破\n• 许多技能不仅奖励熟练程度,还奖励独创性——伟大的数学家解决别人不能解决的问题,成功的商业领袖发现别人不能发现的商机", "ch": "原则9 试验", "tag": "12"}, {"front": "书中提到哪三种类型的试验?", "back": "• 资源试验:试验学习方法、材料和资源\n• 技能试验:选择接下来应该学习什么方向\n• 风格试验:决定培养什么样的个人风格", "ch": "原则9 试验", "tag": "12"}, {"front": "什么是资源试验?如何做好它?", "back": "试验不同的学习资源、媒介、材料和学习技巧(如凡·高尝试自学课程、观摩同行、写生等),以找到最适合自己的指导资源。关键:试验冲动必须有相当的付出——选定一种资源后,在预定时间内严格应用并大量练习,再评估效果。", "ch": "原则9 试验", "tag": "12"}, {"front": "什么是技能试验?以语言学习为例说明。", "back": "当'如何学'不再问题时,'接下来学什么'的选择越来越多,需要试验不同方向。如语言学习者需选择:学文学阅读?练口语到流利谈专业话题?看漫画?谈生意?每个领域的词汇和文化知识成倍增加,应选一个小方向积极学习后评估,决定继续还是换方向。", "ch": "原则9 试验", "tag": "12"}, {"front": "什么是风格试验?如何进行?", "back": "当资源和方向都确定后,关键是培养什么风格。写作、设计、音乐、艺术等领域有多种风格,各有优劣。做法:• 了解现行的所有不同风格(凡·高大量研究、讨论其他艺术家的作品)• 找到研究领域的大师,分析其成功之处,看是否可模仿并整合到自己方法中。逐步了解自己优劣,找到适合自己的风格。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验的心态与卡罗尔·德韦克的成长型思维模式有何关系?", "back": "两者相似:固定思维认为特性是天生的、无法改变;成长型思维认为学习能力可以积极提高。试验基于'你能改进学习方法'的信念,若认为学习风格固定不变,就不会尝试不同方法。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验型思维模式与成长型思维模式有何区别?", "back": "成长型思维鼓励你看到改进的机会和潜力;试验型思维则是其延伸——不仅假设成长可能,还创造积极的策略,主动探索所有可能的方法来实现成长。需相信自己能力可提高,且明白有许多路径可以做到。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验策略1'模仿,然后创造'为什么有效?", "back": "• 简化选择:可能性如繁星,从模仿某个具体对象出发,以此为立足点再向自己的方向探索\n• 解构理解:模仿时必须拆解其运作原理,发现别人做得特别好的方面,消除幻想(意识到某些方面其实并不重要)", "ch": "原则9 试验", "tag": "12"}, {"front": "试验策略2'平行比较各种方法'(分割测试)如何操作?有何好处?", "back": "同时用两种方法解决问题,只改变一个变量,比较效果(像科学实验控制条件)。好处:• 结果更可靠,能快速找到最有效的方法及适合自己的风格 • 增加专业知识广度,强迫自己走出舒适区。", "ch": "原则9 试验", "tag": "12"}, {"front": "作者在法语词汇学习中如何用平行试验验证助记法的效果?", "back": "一个月内每天找50个新词:一半只查字典看翻译,另一半用视觉助记符联系词义,之后随机测试对比记忆量。结果:用助记法记住的单词几乎是没用助记法的两倍,证明创建助记符多花的时间是值得的。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验策略3'引入新的约束'为何有效?", "back": "学习的最终挑战在于你认为自己已经知道该做什么,因而习惯性重复旧方法。引入新的约束条件使旧方法失效,能强有力地摆脱惯性思维。设计公理也印证:给设计师无限自由,方案常一团糟;适当限制反而激励探索不熟悉的选项、磨炼潜在技能。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验策略4'在不相关的技能中寻找你的超能力'是什么?举例说明。", "back": "把两种不一定重叠的技能结合起来,获得专攻单一技能者不具备的优势。例如:擅长公开演讲的工程师,可能成为在公司会议上展示工程主题的最佳人选;斯科特·亚当斯(呆伯特作者)结合工程师背景+MBA+漫画家;作者用MIT挑战所学的编程技能自动生成中文单词卡。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验策略5'探索极端'为什么往往优于坚持中庸?", "back": "高维球体的大部分体积位于表面附近(十维空间中约3/4质量在最外层)。技能越复杂(维度越多),应用范围越大,且跨越某维度的可能性本身多为极端。因此把技能的某些方面发挥到极致,即使最后回到中等水平,也能有效搜索可能性空间、获得更广泛经验。", "ch": "原则9 试验", "tag": "12"}, {"front": "凡·高的风格在哪些方面是'极端'的?", "back": "• 颜料厚重,与文艺复兴大师的薄层釉相去甚远\n• 笔触粗犷热烈,比精细笔触迅猛得多\n• 色彩大胆,既夸张又鲜明,而非谨慎微妙", "ch": "原则9 试验", "tag": "12"}, {"front": "为什么说学习本身就是两种方式的试验过程?", "back": "• 学习行为本身是试错实验:直接练习、获得反馈、调整头脑中的知识和技能以适应现实\n• 尝试学习方法也是试验:尝试不同方法,找到最适合自己的\n书中的原则只是指导方针和起点,不是铁律,需通过试验找到各原则之间的正确取舍。", "ch": "原则9 试验", "tag": "12"}, {"front": "作者如何用亲身经历说明试验的原则?", "back": "• MIT挑战后从注重关联转向实践为基础\n• 法语学习马虎后,第二轮外语尝试走向另一个极端\n• 中文学习失败:用助记系统、颜色表声调记汉字,彻底失败\n• 肖像绘画挑战大量试错:进展变慢就更快画素描以获得更多反馈,再学习另一种画法交叉使用提高准确度", "ch": "原则9 试验", "tag": "12"}, {"front": "试验在'探索'与'专注精通'之间的冲突是什么?如何化解?", "back": "每个层次的试验中,选择范围呈指数级扩大,存在'花时间尝试新方法'与'集中精力精通一种方法'的张力。随着不断探索、深入学习新方法,这种紧张感通常会自行缓解。", "ch": "原则9 试验", "tag": "12"}, {"front": "试验原则在整个超级学习体系中扮演什么角色?", "back": "试验是将所有其他因素联系在一起考虑的原则。它让你尝试新事物、认真思考如何迎接具体学习挑战,并大胆抛弃不起作用的方法;帮助你在不同原则间找到正确取舍(如直接学习 vs 训练弱项、记忆 vs 直觉),还能在现实中检验学习成果,消除坏习惯和盲从迷信。", "ch": "原则9 试验", "tag": "12"}, {"front": "启动第一个超级学习项目的最大障碍是什么?", "back": "超级学习的最大障碍说来简单:大多数人都不太关注自己的自学能力,因此推迟了自己想学的东西。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么第一个超级学习项目最需要周密思考和认真规划?", "back": "• 一个可靠、研究充分、执行良好的计划能给你信心面对未来更艰巨的挑战\n• 一个成功的项目往往会引出其他项目\n• 一次失败的尝试虽非灾难,但可能使你不愿再做类似项目", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "超级学习项目的五步法是什么?", "back": "• 第一步:做好调查(元学习研究)\n• 第二步:安排好时间\n• 第三步:执行计划\n• 第四步:回顾结果\n• 第五步:选择保持还是精通所学", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "超级学习第一步'做好调查'的筹划清单包括哪些内容?", "back": "• 要学习的主题和大致范围\n• 要使用的主要资源\n• 其他人成功学习该技能的基准\n• 直接的实践活动\n• 备份材料和训练", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "确定学习范围时,书中建议从大范围还是小范围开始?举例说明。", "back": "建议从小范围开始,在继续进行的过程中再适当扩展。例如'学习足够的普通话来就简单话题进行15分钟的对话'比'学汉语'范围更窄,后者还包括阅读、写作、研究历史等。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "调查'其他人如何成功学习该技能的基准'有什么作用?", "back": "不需要完全跟随他们的脚步,但可以防止你完全错过一些重要的东西。几乎所有流行技能都有在线论坛分享学习方法,专家访谈法(第4章)是很好的操作方法。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么要提前考虑'直接的实践活动'?", "back": "每项技能最终都会在某个地方被使用,考虑如何使用这项技能可以让你尽早找到机会练习;即使无法直接实践,也应抓住模拟练习的机会,明确使用该技能的心理需求。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么要提前安排学习时间,而不是寄希望于以后找时间?", "back": "• 提前决定会让你的学习项目排在其他事情之前,并写在日历上\n• 学习过程往往令人沮丧,而刷社交媒体、看剧轻而易举,不预先留出时间就很难有动力去学习", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "安排学习时间时要做的三个决定是什么?", "back": "• 投入多少时间(由时间表决定)\n• 何时开始学习(选最轻松的时间段)\n• 项目的时长(决定总跨度)", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么建议制作固定的学习时间表(每周相同)?", "back": "坚持固定时间表能培养好习惯,习惯成自然;临时找时间学习则需要更强的自律。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "短时间块和长时间块分别适合什么类型的学习?", "back": "• 短期、间隔更短的时间块更利于记忆,适合能快速进入状态的任务\n• 写作、编程等准备时间长的任务需要较长的不间断时间段\n• 多多实践才能找到最适合自己的方法", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么作者更喜欢短期的超级学习项目?", "back": "短期投入(如持续一个月的高强度项目)更容易坚持,很少受到生活干扰或学习动机变化的影响。大目标应拆分成多个小目标,几个月完成一个。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "提前把学习时间记在日历上有哪两方面好处?", "back": "• 逻辑上:提早发现假期、工作或家庭事件可能产生的冲突\n• 心理上:帮助记住并执行最初的计划,并表明你对项目的认真态度", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "对6个月或更长时间的项目,作者强烈建议的额外步骤是什么?", "back": "做一周的尝试时间表:在付诸行动之前先测试一周的日程安排,切身体会项目难度,避免过度自信。如果第一周后已精疲力竭,应调整计划使其更适应生活——调整比中途放弃好得多。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "执行计划时,如果发现学习方法与超级学习原则不一致怎么办?", "back": "没关系,完美学习方法根本不存在。能敏感感受到不一致是好事,借此发现需要做出的改变(如更换资源、改变练习类型、寻找新学习环境),在前进路上做微妙调整。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "作者建议用多长时间做项目前的元学习调查?", "back": "大约总时间的10%用于项目准备(元学习:研究典型方法、采访成功学习者、推荐资源等)。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "执行计划后,作者建议自问的九类检查问题分别对应哪些原则?", "back": "元学习、专注、直接、训练、检索、反馈、记忆、直觉、试验——用这九大原则逐一检查自己是否偏离航向。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "检查问题中关于'反馈'的自问有哪些?", "back": "• 是否在项目早期就获知关于表现的真实反馈,还是在逃避打击和批评\n• 是否知道自己哪些方面学得好、哪些不好\n• 是否正确使用了反馈,或对嘈杂(干扰)数据反应过度", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "项目结束后回顾结果时,成功项目和失败项目各自的价值是什么?", "back": "• 失败项目:问题往往可追溯到学习理念,得到经验教训仍然有价值\n• 成功项目:更能说明问题,一定有成功的原因,这正是你希望在未来保留和模仿的地方", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "作者举例说明项目失败的原因常不在意志力而在什么?", "back": "学习理念。如他每周5小时学韩语的项目失败,是因为一开始没有投入足够时间做沉浸式直接语言实践,过度依赖课本练习,无法迁移到现实生活。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "项目完成后,除了'精通'外的选择有哪些?", "back": "• 保持:投入足够练习维持技能,无具体目标或新水平要求\n• 再学习:之后需要时再重新激活,通常比初次学习容易\n• 精通:深入挖掘,持续练习或启动下一个项目", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "保持技能的两种具体做法是什么?", "back": "• 养成定期练习的习惯,哪怕很微小(如作者旅行后第一年每周30分钟、第二年每月30分钟练每种语言)\n• 把技能融入生活(如用Python脚本处理工作任务来保持编程能力)", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "艾宾浩斯遗忘曲线的发现对'保持练习'有何启示?", "back": "遗忘曲线呈指数下降:持续记忆越久,记忆越难遗忘。因此保持练习可减缓记忆衰减速度——一开始养成认真练习的习惯,即使一两年后减少练习时间,仍能保留大部分知识。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么'再学习'常常比持续保持更划算?", "back": "• 学到的东西可能比实际需要的多,不用的知识会选择性消失\n• 考试成绩急剧下降是因为知识难以提取而非完全遗忘,复习或练习即可快速重新激活\n• 认识到某领域知识有助于解决某类问题,比记住细节更重要", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "通往'精通'之路的特点是什么?", "back": "• 难度远超单个学习项目\n• 开头令人沮丧,须付出努力跨过阈值,之后转为大量知识积累,可更有耐心地进行\n• 有些项目需抛掉以前所学、适度清零,才能走出困境取得进步", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "超级学习的两种主要替代策略是什么?", "back": "• 低强度习惯:自发学习,挫败感低时自然有收获\n• 正规的系统教育:把学校当作资源,自我主导地对待它(如为获取证书、获得有益的学习环境)", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "低强度学习习惯在什么情况下效果最佳?", "back": "当学习过程主要是积累、增加新技能和知识时(如积累外语词汇、读已掌握基础的主题的书)。若需要摒弃无效行为或技能(如改善发音要忘记旧习惯),超级学习和有针对性的努力更适合。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "接受正规教育而非超级学习的两个主要原因是什么?", "back": "• 获取证书:如果证书对工作是必要或推荐的,需在学习方式上做出牺牲\n• 有益的学习环境:如设计和艺术学校的学徒制、难以独立启动的团队项目、学术社区的浸入式学习", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "超级学习中'自我主导'是什么意思?", "back": "指由谁做决定,而不论其他人参与与否。在学校进行超级学习并不矛盾——无论在什么地方学习,你都应该掌控自己的学习,把正规教育也当作一种资源。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "为什么说追求超级学习项目往往是享受学习更保险的方式?", "back": "快乐往往来自擅长某事。快乐学习与高效学习短期内可能冲突,但超级学习更有可能让你达到一个境界——学习自然而然变得有趣起来。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "终身学习的目标是什么?", "back": "超级学习的目标是增加可利用的学习机会,而不是减少机会;它为学习创设新途径,推动你积极努力,而不是在一旁胆怯地等待。", "ch": "第13章 你的第一个超级学习项目", "tag": "13"}, {"front": "朱迪特·波尔加在国际象棋界的标志性成就是什么？", "back": "• 7岁时蒙眼战胜国际象棋大师\n• 15岁成为史上最年轻国际象棋大师（比鲍比·菲舍尔还小一个月）\n• 巅峰时期世界排名第8\n• 是迄今唯一参加过世界象棋锦标赛的女性", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "前世界冠军卡斯帕罗夫曾如何评价朱迪特·波尔加？", "back": "他虽承认她有惊人的国际象棋天赋，但持性别偏见，认为“她毕竟是一个女人……没有一个女人能忍受一场持久战”，不看好她。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "17岁的波尔加与卡斯帕罗夫第一场比赛中发生了什么争议事件？", "back": "卡斯帕罗夫走完第34步棋后改变主意，把已放好的“骑士”移到更好的方格。按规则棋子一放手即落定，不许更改。裁判没有质疑这位大师，波尔加因担心引起不快和被扣时间未当场投诉，阵脚大乱最终输掉比赛。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛·波尔加的核心信念是什么？", "back": "“天才不是天生的，而是经过教育和训练养成的。”他研究了数百位伟大知识分子的传记，发现共同点是都在很小的时候就开始刻苦学习，因此决心亲自培养天才孩子。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加三姐妹各自的成就如何？", "back": "• 苏珊（老大）：国际象棋大师，还学了8门外语\n• 索菲娅：达到国际象棋大师水平，后退出象棋转向艺术和家庭管理\n• 朱迪特（最小）：最著名、最具竞争力，史上最年轻国际象棋大师", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加夫妇为什么最终选择国际象棋作为女儿们的专攻领域？", "back": "• 象棋成绩客观、进步容易衡量\n• 当时社会主义国家的国际象棋水平世界领先\n• 现实原因：同时专攻多个学科的资源和时间超出家庭承受范围", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加三姐妹接受的教育除了国际象棋还包括什么？", "back": "教育很广泛：三人都学外语（苏珊学了8门），还学数学、乒乓球、游泳等项目，并非只学象棋。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛·波尔加如何对抗匈牙利国际象棋界的性别歧视？", "back": "当时匈牙利棋联规定女子只能参加女子比赛。拉斯洛坚决反对，认为“在智力竞赛中，女性能够取得与男性相似的成就”，坚持让女儿们与男性同台对弈。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "2002年朱迪特再战卡斯帕罗夫的比赛结果如何？", "back": "在莫斯科“俄罗斯对世界其他国家”比赛中，一场每方25分钟的快棋赛。朱迪特以西班牙开局（Ruy Lopez），逐步积累中场优势，最终卡斯帕罗夫两兵被吃、面临被将军而认输。这是朱迪特的胜利。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "输给朱迪特后，卡斯帕罗夫如何修正自己的观点？", "back": "他承认“波尔加一家的研究表明，人类的天赋并没有与生俱来的局限”，并说直到被一个12岁扎马尾辫的女孩毫不留情地击倒，很多男性棋手才接受这一观点。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "作为科学实验，波尔加培养天才的实验有哪些漏洞？", "back": "• 没有对照组（没有按正常方式上学的第四个姐妹作对比）\n• 实验对象没有随机化（教的是自己的孩子而非随机收养）\n• 基因影响不容忽视，成功可能来自遗传\n• 一家人清楚自己肩负特殊使命\n因此它暗示了非常规教育的作用，但远非决定性证明。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加三姐妹的心理和通识发展状况如何？", "back": "她们没有受到伤害：自信、快乐，成长为成功的、情绪稳定的成年人，都拥有自己幸福的小家庭。拉斯洛反驳“被剥夺童年”的质疑，认为普通平庸的教育才往往导致不幸。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "作者对“超级学习能否成为整个教育系统的参考”持什么态度？", "back": "持怀疑态度。超级学习要求高强度和投入，孩子们已在繁重学习环境中挣扎，增加强度只会加重压力和焦虑；外力强加的目标是许多痛苦（抑郁、焦虑甚至自杀）的根源。超级学习是自我驱动的追求，作者不清楚它是否可被培养。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "心理学家区分的内在目标与外在目标有何差异？", "back": "内在目标：基于自己的兴趣、决定和目标而追求；外在目标：由专横的父母、繁重课程或苛刻雇主推动，动机来自外部社会压力，是许多痛苦的根源。超级学习属于自我驱动，因而不会有外在强加的巨大压力。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加夫妇与典型“虎爸虎妈”的关键区别是什么？", "back": "他们通过游戏和积极反馈激励女儿提升象棋水平，不施加家长权威和惩罚。所以对国际象棋的痴迷是培养出来的，而不是被强加的——这发现了“强迫别人拼命学习必然导致痛苦”这一普遍看法的漏洞。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛培养天才的第一步是什么？", "back": "尽早开始：孩子教育不迟于3岁，专业化不迟于6岁。音乐和语言领域的证据表明儿童大脑在年轻时更具可塑性和灵活性。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛培养天才第二步“专业化”的两个作用是什么？", "back": "• 利用小孩子学习新科目的灵活性\n• 通过专攻一门学科，孩子可在更小年龄就精通它，战胜年长对手从而建立自信心和竞争精神，形成“想更多练习”的正循环。若兴趣铺得太广，可能培养不出这种自信。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛如何理解“把练习变成游戏”？", "back": "• 所有科目都以游戏形式介绍，不惩罚分心，而是鼓励发挥想象力找解决方案\n• “游戏不是学习的对立面”，孩子不需要把游戏与学习分开\n• 轻松有趣是培养动力和自信的关键，为日后刻苦努力提供支柱\n• 游戏和工作结合，两者没有严格界限", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛如何用正强化建立积极的反馈循环？", "back": "• 认为“失败、痛苦和恐惧会降低成就”，连续失败可能出现破坏性的抑制情结\n• 与女儿下棋时调整棋路，保持适度挑战又让她们体会乐趣\n• “我们有时应该让她们赢，这样她们就会有自信”\n• 初期最重要的是激发兴趣，让孩子喜欢所做的事，达到近乎痴迷的程度", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "拉斯洛对强制学习持什么态度？", "back": "完全反对。他认为“通过强制手段，一个人永远不可能取得重大的教学成果，尤其是在高水平上”；自律、激励和承诺必须来自孩子自己；“自学是最重要的教育任务之一”。女儿棋艺超过父亲后，正靠自学能力继续成为大师。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加夫妇为女儿们的象棋成长提供了哪些资源和机会？", "back": "• 建立包含20多万场比赛的数据库\n• 购买能找到的所有国际象棋教科书\n• 招募国际象棋教师\n• 家中墙上挂象棋位置图，把家变成专门练习象棋的殿堂\n• 父母全职抚养并在家教育", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加教育法如何体现“元学习”和“专注”原则？", "back": "• 元学习：拉斯洛深入研究人们如何学象棋及女儿在什么条件下能出类拔萃，建立巨大的棋局/策略库，制定循序渐进的计划（先学棋盘方块名，再学棋子走法）\n• 专注：他把“应对单调乏味、保持兴趣和持续注意力的能力”视为要灌输的重要能力，让女孩们在15岁、9岁、8岁时两次参加24小时国际象棋马拉松（完成100场比赛）", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加教育法如何体现“直接”和“训练”原则？", "back": "• 直接：女儿4岁就带去与年长男棋手实战，使用象棋计时器，在接近真实锦标赛的环境中训练，学会应对时间压力和心理不安\n• 训练：从记方块名、记关键棋子走法开始分项练习；墙上棋题当家庭作业；闪电战和蒙眼比赛训练更快思考和心象模拟", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加教育法如何体现“检索”和“反馈”原则？", "back": "• 检索：用苏格拉底式教学法提问而非直接告知（“我们应该试着让孩子说点什么”）；蒙眼下棋培养脑中追踪棋子的能力，利于长期记忆棋模式和模拟对手走法\n• 反馈：谨慎选择旗鼓相当的搭档，坚持让女孩参加男子棋赛以提供足够挑战，同时随时调整难度避免挑战过大，早期重点培养积极反馈", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "波尔加教育法如何体现“记忆”“直觉”“试验”原则？", "back": "• 记忆：凭记忆回忆棋模式、加快下棋速度，用间隔练习、闪电战和蒙眼棋强化\n• 直觉：仿费曼技巧鼓励女儿写象棋文章（“写一篇文章比无目标思考或交谈更深入”），鼓励创造性解题、探索新策略\n• 试验：超越父亲后，每人发展独特风格——朱迪特专注技巧和战术，认为这是她擅长中局的原因", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "培养超级学习能力的建议1“制定鼓舞人心的目标”是什么？", "back": "最好让学习者自己设计学习目标来自我激励。激励是超级学习的起点：可能是职业回报（编程训练营一周80小时但回报是高薪工作），也可能是浓厚兴趣（作者的MIT挑战、罗杰·克雷格的《危险边缘》、埃里克·巴隆的游戏改良）。要激发本就存在的兴趣火花，而不是强加你认为有益的主题。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "建议2“谨慎竞争”的核心是什么？", "back": "• 早期自信能激发持续学习的热情；关键是相信“你可以学得很好”\n• 觉得缺乏潜力或永远落后于别人时，就失去动力\n• 对有天赋者：竞争有益，直接比较能激发提升决心\n• 对能力一般或起步晚者：让项目独树一帜，与过去的自己比较而非与他人竞争；等树立信心后再进入更具竞争性的环境", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "为什么参照群体会影响学习的动力？", "back": "人们通过与参照群体隐性比较获得激励效应。若在有天赋、易胜出的群体中比较，会更有动力训练；若处处露怯、突显短板，可能连练习的动力都没有。波尔加姐妹起步极早、总被视作神童，竞争环境增强了她们的动机；若起步晚或进普通学校，未必有这么大动力。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "建议3“学习优先”在职场中如何应用？", "back": "• 常规做法：把任务交给最适合的人；学习驱动法：把项目分配给尚不能完成该任务的人\n• 让员工把大部分时间花在能力范围内/接近水平的项目上，小部分时间花在超越现有能力的项目上\n• 好处：创造“乐意尝试解决未知问题”的学习文化；提供可应对的挑战以发现人才\n• 最高层次：让学习者掌握别人做不到的特殊技能", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "作者写《超级学习者》这本书本身就是一项什么样的超级学习项目？", "back": "写一本关于超级学习的书本身就是元学习项目：研究阶段阅读成千上万页期刊文章、几十本绝版专著、无数名人传记（常从500页传记中搜寻几段学习方法细节）；写作上则从博客写作拓展到出书的研究和写作新技能。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "全书结论中，作者强调学习完成后应有的心态是什么？", "back": "既拥有自信，同时心怀深深的谦卑：完成项目时的感受不是“我完成了”，而是“我创造了另一种可能性”——视野打开，看到所有有待学习的地方。知道得越多，越明白自己的无知。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "学习与其他人生追求有何本质不同？", "back": "许多追求都有饱和点（如饥饿的人只能吃这么多食物，孤独的人只需要那么多陪伴），过了饱和点渴望会减弱。而学习不同：一个人学得越多，就越想学得更多；做得越好，越能意识到自己可以做得更好。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "作者对读者读完本书的最大希望是什么？", "back": "希望读者受到鼓舞去尝试自己的超级学习项目；不仅期待项目成功，更希望项目的完成之时是你另一个全新的开始——在所有可能可知的事物中打开一条小缝，透过它窥探更远大的世界。", "ch": "第14章 非常规教育", "tag": "14"}, {"front": "超级学习项目训练手册分为哪三个部分?", "back": "• 规划(开始前的准备)• 执行(项目进行中的每周检查)• 评估(项目结束后的复盘)", "ch": "附录 训练手册", "tag": "15"}, {"front": "为什么说规划对超级学习项目特别重要?", "back": "规划不只包含制定时间表、筹备学习材料,更能激发学习动力。糟糕的规划,比其他任何东西对学习积极性的阻碍都更大。", "ch": "附录 训练手册", "tag": "15"}, {"front": "规划阶段应把想学的项目分为哪两类?为什么要这样划分?", "back": "• 工具型项目:为达到特定目的而学(如学编程语言以获得晋升)• 内在动机型项目:没有特定目的、为提升内在而学(如学法语)。划分两者大有裨益,因为后续的审查步骤只针对工具型项目。", "ch": "附录 训练手册", "tag": "15"}, {"front": "审查工具型学习项目的最佳方法是什么?", "back": "专家访谈法:联系那些已经实现了你想达成目标的人,询问你选择的学习项目是否有帮助。若对方认为方向不对,可追问什么知识或技能更重要。许多人在工具型项目上一错再错,就是因为从没和明白人交谈过。", "ch": "附录 训练手册", "tag": "15"}, {"front": "好的超级学习项目在限定范围时应具备哪两点?", "back": "• 一个具体的出发点(见直接原则)• 为学习预留出时间(见专注原则)", "ch": "附录 训练手册", "tag": "15"}, {"front": "为什么学习目标要一开始就具体而精准,而不是宽泛?", "back": "具体精准的目标可以防止项目与实践脱钩,而且中途扩大目标范围比之后缩小范围要容易得多。好例子如\"学Python写脚本使会计工作自动化\";坏例子如\"学习编程\"这种宽泛目标。", "ch": "附录 训练手册", "tag": "15"}, {"front": "为什么要把学习时间表提前记在日历上?", "back": "把时间规划好并记录在日历上,是从心理上投入学习的必要(尽管不是充分的)步骤。如果你不愿把它记在日历上,到时你也必定不愿进行项目学习。坏的时间表如\"只要我有时间就投入学习\"。", "ch": "附录 训练手册", "tag": "15"}, {"front": "面对众多学习材料,如何开始选择和检验资源?", "back": "• 先搜索学习科目,把找到的所有资源链接记入电子表格备用• 从一个资源开始,用超级学习的9项原则衡量它与理想材料的偏差(如是否直接、是否有反馈)• 不好就替换或采取补救措施• 试验是关键,很难一开始就全面判断材料优劣", "ch": "附录 训练手册", "tag": "15"}, {"front": "对书籍、视频这类静态学习资源,除了被动吸收还应注意什么?", "back": "应经常安排实践活动。若学习材料本身提供实践(如作业、小测验)就直接利用;没有现成的实践,就要自己创设。", "ch": "附录 训练手册", "tag": "15"}, {"front": "项目开始前如何判断自己的准备状态是否合适?", "back": "好的项目设计应让你感到有点兴奋和紧张——既不觉得难如登天,也不觉得易如反掌。太难就选更容易的出发点,太容易就提高难度。", "ch": "附录 训练手册", "tag": "15"}, {"front": "项目预计持续三个月以上时,规划阶段有什么特别建议?", "back": "先做一周的试验,测验学习计划是否适应目前的生活。一周后感觉顺利就继续;如果第一周都无法按计划进行,就要退一步重新设计。", "ch": "附录 训练手册", "tag": "15"}, {"front": "\"迎接小挑战,方能实现大梦想\"对项目启动有何指导?", "back": "如果自己通常在这类项目上表现不好,应从更小、更聚焦的项目开始。最好的情况是:先成功完成一系列持续一个月的项目,再进行长达一年的全日制项目。", "ch": "附录 训练手册", "tag": "15"}, {"front": "项目执行阶段每周应检查哪些问题?", "back": "• 这周我完成计划了吗?没完成的话下周怎么办?• 应继续目前的方法还是尝试其他方法(不同材料、训练、实践环境或技巧)?• 我是否在一步步实现目标?没有的话可以做些什么改变?", "ch": "附录 训练手册", "tag": "15"}, {"front": "每周检查方法时,应对照超级学习的哪些原则自问?", "back": "• 直接:我与最终使用技能的情境之间是否有联系?• 训练:是否专注于最薄弱或最重要的内容?• 反馈:是否获得反馈并筛选出真正能控制的方面?• 记忆与检索:是否设置了间隔重复?是在检索还是被动复习?• 直觉:是真的理解了,还是只在死记硬背?", "ch": "附录 训练手册", "tag": "15"}, {"front": "项目结束后的评估阶段,应复盘哪两方面的内容?", "back": "• 哪些地方做得好:与上次相比整体方法有哪些改进?未来会重复哪些方面?• 哪些地方本可以做得更好:在哪里被无效方法牵着鼻子走?应该怎么做?", "ch": "附录 训练手册", "tag": "15"}, {"front": "完成学习项目后,对所学内容有哪三种处理选择?", "back": "• 精通:开展新的超级学习项目,达到技能的下一个层次• 保持:在没有明确目标的情况下保持所学知识• 重新学习:不制定保持计划,需要时再重新学习", "ch": "附录 训练手册", "tag": "15"}, {"front": "制定所学技能的保持计划时,最重要的原则是什么?", "back": "坚持不懈比数量累积更重要。任何保持计划只要坚持足够长的时间,都比纸上谈兵的绝佳计划好。好例子:每月用学过的语言做30分钟Skype对话、每月做一个编程项目、订阅相关博客。", "ch": "附录 训练手册", "tag": "15"}];
var grid = document.getElementById('grid');
var sel = document.getElementById('chapter');
var chipsBox = document.getElementById('chips');
var searchEl = document.getElementById('search');
var countEl = document.getElementById('count');

// 章节
var chapters = [];
var seen = {};
CARDS.forEach(function(c){ if(!seen[c.ch]){ seen[c.ch]=true; chapters.push(c.ch);} });
chapters.forEach(function(ch){
  var o = document.createElement('option');
  o.value = ch; o.textContent = ch; sel.appendChild(o);
});

// 统计 chips
var chapterCount = {};
CARDS.forEach(function(c){ chapterCount[c.ch] = (chapterCount[c.ch]||0)+1; });
chapters.forEach(function(ch){
  var n = CARDS.filter(function(c){return c.ch===ch;}).length;
  var chip = document.createElement('span');
  chip.className = 'chip'; chip.textContent = ch + ' (' + n + ')';
  chip.onclick = function(){
    if(sel.value === ch){ sel.value=''; } else { sel.value = ch; }
    syncChips(); render();
  };
  chip.dataset.ch = ch;
  chipsBox.appendChild(chip);
});
function syncChips(){
  Array.prototype.forEach.call(chipsBox.children, function(ch){
    ch.classList.toggle('active', ch.dataset.ch === sel.value);
  });
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderBack(t){
  var lines = t.split('\n').filter(function(l){return l.trim();});
  return lines.map(function(l){
    l = esc(l);
    if(l.indexOf('• ')===0) return '<span class="bline">•&nbsp;' + l.slice(2) + '</span>';
    return '<span class="bline">' + l + '</span>';
  }).join('<br>');
}

var els = [];
function render(){
  var kw = searchEl.value.trim().toLowerCase();
  var ch = sel.value;
  grid.innerHTML = '';
  els = [];
  var shown = 0;
  CARDS.forEach(function(c, i){
    if(ch && c.ch !== ch) return;
    if(kw && (c.front+c.back).toLowerCase().indexOf(kw) === -1) return;
    shown++;
    var w = document.createElement('div');
    w.className = 'cardwrap';
    w.innerHTML =
      '<div class="card" data-i="'+i+'">' +
        '<div class="face front"><div class="label"><span>Q '+c.ch+'</span><span class="hint">点击翻面 ↻</span></div>' +
          '<div class="text">'+esc(c.front)+'</div></div>' +
        '<div class="face back"><div class="label"><span class="chbadge">'+c.ch+'</span><span class="hint">点击翻回 ↺</span></div>' +
          '<div class="text">'+renderBack(c.back)+'</div></div>' +
      '</div>';
    var card = w.querySelector('.card');
    card.addEventListener('click', function(){ card.classList.toggle('flipped'); });
    grid.appendChild(w);
    els.push(w);
  });
  if(!shown){ grid.innerHTML = '<div class="noresult">没有匹配的卡片</div>'; }
  countEl.textContent = '共 ' + shown + ' 张';
}
sel.addEventListener('change', function(){ syncChips(); render(); });
searchEl.addEventListener('input', render);
render();
</script>
</body>
</html>
