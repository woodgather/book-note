<script>
const cards = [
// ────────── 第1篇 表达的逻辑 ──────────
{ c:"表达", q:"什么是金字塔原理？它的基本结构是什么？",
  a:"金字塔原理是一种<b>重点突出、逻辑清晰、主次分明</b>的思考与表达方式。基本结构：<b>结论先行，以上统下，归类分组，逻辑递进</b>——先重要后次要，先总结后具体，先框架后细节，先结论后原因，先论点后论据。" },
{ c:"表达", q:"金字塔原理的 4 个基本原则是什么？",
  a:"<b>结论先行</b>：每篇文章只有一个中心思想，放在最前面。<div class='li'><b>以上统下</b>：每一层次的思想必须是对下一层次思想的总结概括。</div><div class='li'><b>归类分组</b>：每组思想必须属于同一逻辑范畴。</div><div class='li'><b>逻辑递进</b>：每组思想必须按逻辑顺序排列。</div>" },
{ c:"表达", q:"为什么文章要组织成金字塔结构？（人类思维的基本规律）",
  a:"大脑会自动将信息<b>归类分组</b>以便理解和记忆；预先归纳成金字塔结构的沟通内容，更容易被人理解和记忆。受众最容易理解的顺序是：先了解主要的、抽象的思想，再了解次要的、起支持作用的思想。" },
{ c:"表达", q:"什么是“奇妙的数字 7”？对表达有什么启示？",
  a:"乔治·米勒提出：大脑短期记忆一次无法容纳约 <b>7 个以上</b>的记忆项目（最易记住 3 个，最好 1 个）。项目一多，大脑就会自动归类。启示：每组思想最好<b>不超过 4～5 个</b>，超过就要归类分组、提高抽象层次。" },
{ c:"表达", q:"为什么必须“自上而下表达，结论先行”？",
  a:"受众只能逐句理解，会自动猜测思想间的逻辑关系。如果不预先告知结构，读者会自行寻找（可能找错）共同点，增加阅读负担。最有效的表达是<b>先提出总概念，再列具体项目</b>，让读者按你希望的框架理解。" },
{ c:"表达", q:"金字塔中思想之间有哪三种关联方式？",
  a:"<b>向上</b>：下层思想是对上层思想的解释与支持；<b>向下</b>：上层思想是对下层思想的概括；<b>横向</b>：同组思想按演绎或归纳关系并列排列。" },
{ c:"表达", q:"纵向的“疑问/回答式对话”如何吸引读者？",
  a:"每个“思想”都是<b>向受众发出新信息并引发其疑问的语句</b>（为什么会这样？怎样才能这样？）。作者必须在下一层次横向回答这些疑问，回答又引发新疑问，如此推进，直到读者无疑可问。注意：<b>引起疑问之前，不要先给出答案</b>。" },
{ c:"表达", q:"序言（SCQA）的结构是什么？为什么必须用讲故事的形式？",
  a:"<b>背景 S（Situation）→ 冲突 C（Complication）→ 疑问 Q（Question）→ 回答 A（Answer）</b>。用讲故事的形式，是为了让读者抛开头脑中杂乱的思想、专注于你的话题——先传递读者肯定会认可的信息，再引出他要的答案。" },
{ c:"表达", q:"序言 SCQA 的顺序可以怎样变化？各是什么文风？",
  a:"<b>标准式</b>：背景—冲突—答案；<b>开门见山式</b>：答案—背景—冲突；<b>突出忧虑式</b>：冲突—背景—答案；<b>突出信心式</b>：疑问—背景—冲突—答案。顺序不同，文风不同，但三要素缺一不可。" },
{ c:"表达", q:"序言应当写多长？写作时要注意什么？",
  a:"序言长度<b>取决于读者的需要</b>而非正文长短，通常 2～3 段（背景＋冲突最多 3～4 段）。原则：序言的目的是<b>“提示”读者已知信息，而不是“告诉”新信息</b>；只写读者不会质疑其真实性的内容；从“背景”开始构思。" },
{ c:"表达", q:"序言的 4 种常见模式对应哪 4 类疑问？",
  a:"<b>发出指示式</b>（我们应该做什么/如何做）、<b>请求支持式</b>（是否应该这样做）、<b>解释做法式</b>（我们应该如何做）、<b>比较选择式</b>（我们应该做什么/选哪种方案）。多数商务文章都在回答这 4 类问题之一。" },
{ c:"表达", q:"“关键句要点”是什么？为什么要先列出它？",
  a:"关键句要点是回答由主题思想引发的新疑问的一级论点，同时<b>呈现文章的框架结构</b>。先列出它，读者能在<b>最初 30 秒内了解全部思路</b>，并自行决定继续细读还是接受结论。要点必须是完整的思想（完整句子），不能用“背景”“介绍”这类名词做标题。" },
{ c:"表达", q:"演绎推理的 3 个步骤是什么？",
  a:"① 阐述世界上已存在的某种情况；② 阐述同时存在的相关情况（第二个表述针对第一个的主语或谓语）；③ 说明这两种情况同时存在时的隐含意义。经典形式：所有人都会死 → 苏格拉底是人 → <b>因此苏格拉底会死</b>。" },
{ c:"表达", q:"归纳推理的关键是什么？需要哪两项主要技能？",
  a:"将具有共同点的事实、思想归类分组，并<b>用一个单一名词</b>概括其共性（如“原因”“步骤”“问题”）。两项技能：① <b>正确定义该组思想</b>（找到表示共同点的名词）；② <b>识别并剔除组内不相称的思想</b>。" },
{ c:"表达", q:"如何快速区分一句话是演绎关系还是归纳关系？",
  a:"演绎：第二个思想是对<b>第一个思想的主语或谓语的评述</b>，并推出结论。归纳：同组思想具有<b>类似的主语或谓语</b>，可用一个单一名词概括。如“日本商人增加对华投资”＋“美国商人增加对华投资”→ 归纳；“……必将促进日商行动”→ 演绎。" },
{ c:"表达", q:"为什么在关键句层次上更宜用归纳法而非演绎法？",
  a:"演绎法用于写作显得<b>繁琐笨拙</b>：读者要费尽周折在问题、原因、措施之间反复穿梭。归纳法把同一主题的信息集中在一起，界限明确、直接回答疑问。例外：当结论出乎读者意料（读者更关心“为什么”）或必须先解释方法时，才在关键句层次用演绎法。" },
{ c:"表达", q:"自上而下构建金字塔的 5 个步骤是什么？",
  a:"① <b>提出主题思想</b>；② <b>设想受众的主要疑问</b>；③ 写序言：背景—冲突—疑问—回答；④ 与受众进行<b>疑问/回答式对话</b>；⑤ 对新疑问重复疑问/回答式对话。先尝试自上而下法，因为它更容易。" },
{ c:"表达", q:"自下而上思考的 3 个步骤是什么？何时使用？",
  a:"当你还没想清楚主题、疑问或答案时：① <b>列出所有想表达的要点</b>；② <b>找出各要点之间的逻辑关系</b>（如因果关系）；③ <b>得出结论</b>，再倒推出序言。" },
{ c:"表达", q:"组织思想的 4 种逻辑顺序是什么？",
  a:"<b>演绎顺序</b>：大前提、小前提、结论；<b>时间（步骤）顺序</b>：第一、第二、第三；<b>结构（空间）顺序</b>：波士顿、纽约、华盛顿；<b>程度（重要性）顺序</b>：最重要、次重要……这对应大脑仅有的 4 种分析活动：演绎推理、发现因果关系、化整为零、归纳总结。" },
{ c:"表达", q:"初学者使用金字塔原理有哪些注意事项？",
  a:"① 一定<b>先搭结构</b>，先尝试自上而下法，不要急着落笔；② 序言先写“背景”作为起点；③ <b>先多花时间思考序言</b>，不要省略；④ 历史背景放在序言而非正文；⑤ 序言只写读者不会质疑的内容；⑥ 关键句层次上优先用归纳法。" },
// ────────── 第2篇 思考的逻辑 ──────────
{ c:"思考", q:"什么是“冷静思考”（Hard-Headed Thinking）？",
  a:"写作前的深入思考过程：找出各组思想之间的<b>逻辑框架与逻辑顺序</b>，并概括出其<b>隐含意义</b>（归纳跃进，inductive leap）。仅罗列思想而不提炼，说明你并没有真正把握自己思想的核心。" },
{ c:"思考", q:"归纳分组只有哪 3 种逻辑顺序？各对应什么分析活动？",
  a:"① <b>时间顺序</b>：确定前因后果关系（设想流程、采取行动）；② <b>结构顺序</b>：将整体分割为部分或部分组成整体（评论某结构）；③ <b>程度顺序</b>：将类似事物按重要性归类分组。若一组思想找不到任何一种顺序，说明分组有问题或思考不周全。" },
{ c:"思考", q:"应用时间顺序时最常见的问题是什么？如何检查？",
  a:"<b>无法区分原因和结果</b>——把行动与行动产生的结果混在一组、把不同抽象层次的步骤并列。检查方法：<b>假设自己亲自采取每项行动，并想象其结果</b>，即可判断行动是先后关系还是因果关系，从而发现遗漏、理顺层次。" },
{ c:"思考", q:"什么是 MECE 原则？",
  a:"将整体划分为部分时须满足：<b>各部分相互独立（Mutually Exclusive），没有重叠、相互排斥</b>；<b>所有部分完全穷尽（Collectively Exhaustive），没有遗漏</b>。这是结构化分组与问题分析的基本准则。" },
{ c:"思考", q:"程度（重要性）顺序如何排序？",
  a:"先明确指明每组中所有问题（思想）的<b>共同特性</b>，确保把所有具有该特性的项目都列入组内；再按各项目具有该特性的<b>程度高低排序——最重要的排第一</b>（先强后弱、先重要后次要）。" },
{ c:"思考", q:"什么是“缺乏思想”的句子？为什么要避免？",
  a:"如“该公司存在 3 个问题”“我们建议进行 5 项改革”——只说明将讨论的思想属于哪一类，<b>没有概括下一层次思想的精华</b>。它会掩盖思考不完整的事实，让读者乏味、无法获得观点，也让你错失继续深入思考的机会。" },
{ c:"思考", q:"如何概括行动性思想？",
  a:"行动性语句（步骤、措施、建议、流程）告诉读者<b>做什么</b>。概括时应说明<b>采取行动后取得的结果/目标</b>。技巧：① 用明确的语句描述各行动；② 找出因果关系，每组控制在 5 个以内；③ 直接从行动总结出结果、目标。措辞必须明确具体——“提高利润”不如“明年1月15日前将利润提高10个百分点”。" },
{ c:"思考", q:"如何概括描述性思想？",
  a:"描述性语句（背景、信息、观点）告诉读者<b>关于某些事的情况</b>。概括时应说明这些思想的<b>共同点的含义</b>（共性隐含的意义）。找共性：各组思想是否针对同一类主语、同一类谓语（动作或对象）、包含同一类隐含判断。" },
{ c:"思考", q:"如何区分行动步骤的层次？",
  a:"如果你希望读者<b>采取下一项行动之前</b>先采取某项行动 → 两者属同一层次；如果采取前一项行动是<b>为了产生</b>后一项行动 → 前者是后者的下一个层次。行动无法按“任务/目标/利益”分类，唯一合理的分组方法是根据其<b>产生的结果</b>归类。" },
{ c:"思考", q:"什么是“归纳跃进”？如何完成？",
  a:"从一组有共性的句子中，揭示其<b>隐含的意义</b>、得出更高层次的推论。三步：① 找出各思想<b>结构上的共性</b>（同类主语/谓语/隐含思想）；② 寻找它们之间<b>更密切的联系</b>（进一步分类）；③ <b>完成归纳跃进</b>，概括出主题思想。可借助想象图形（如画圆圈）作“跳板”。" },
{ c:"思考", q:"分组时必问自己的一个问题是什么？",
  a:"<b>“为什么我只列出了这些思想，而不列出其他思想？”</b>答案只有两种：① 这些思想具有某种共性，且是以这种方式关联的仅有的一些思想 → 概括其共性隐含的意义；② 这些是为实现某一结果必须同时采取的行动 → 概括采取行动后的直接结果。" },

const grid = document.getElementById('grid');
let current = cards.slice();

function render(list){
  grid.innerHTML = '';
  list.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="inner">
        <div class="face front">
          <div class="tag-row"><span class="tag">${c.c}的逻辑</span><span class="num">No.${String(i+1).padStart(2,'0')}</span></div>
          <div class="q">${c.q}</div>
          <div class="hint">点击翻面</div>
        </div>
        <div class="face back">
          <div class="tag-row"><span class="tag">答案</span><span class="num">No.${String(i+1).padStart(2,'0')}</span></div>
          <div class="a">${c.a}</div>
          <div class="hint">点击返回问题</div>
        </div>
      </div>`;
    el.addEventListener('click', () => {
      el.classList.toggle('flipped');
      updateProgress();
    });
    grid.appendChild(el);
  });
  updateProgress();
}

function updateProgress(){
  const all = grid.querySelectorAll('.card');
  const flipped = grid.querySelectorAll('.card.flipped').length;
  document.getElementById('progress').textContent =
    `已翻开 ${flipped} / ${all.length} 张 · 共 ${cards.length} 张精华卡片`;
}

function flipAll(v){
  grid.querySelectorAll('.card').forEach(c => c.classList.toggle('flipped', v));
  updateProgress();
}

function shuffleCards(){
  current = cards.slice();
  for (let i = current.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [current[i], current[j]] = [current[j], current[i]];
  }
  render(current);
}

document.getElementById('chips').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  const f = e.target.dataset.f;
  current = f === 'all' ? cards.slice() : cards.filter(c => c.c === f);
  render(current);
});

document.getElementById('total').textContent = cards.length;
render(cards);
</script>
