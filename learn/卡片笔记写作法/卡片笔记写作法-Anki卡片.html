<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《卡片笔记写作法》精华 Anki 卡片</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f2ec;
    --card-front: #fffdf8;
    --card-back: #1f2937;
    --ink: #2d2a26;
    --accent: #b4552d;
    --accent-soft: #f3e0d3;
    --border: #e3ddd0;
    --tag-1: #7c6f5a;
    --tag-2: #3e6b5c;
    --tag-3: #8a5a83;
    --tag-4: #3f5e8c;
    --tag-5: #a08430;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header.book {
    text-align: center;
    margin-bottom: 34px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  header.book h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  header.book .sub { font-size: 14px; color: #8a8375; letter-spacing: 1px; }
  header.book .quote {
    margin: 18px auto 0;
    max-width: 620px;
    font-size: 15px;
    color: var(--accent);
    font-style: italic;
  }
  header.book .quote span { display: block; margin-top: 6px; font-size: 13px; color: #9a9284; font-style: normal; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
  }
  .toolbar button {
    font-family: inherit;
    font-size: 13.5px;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    color: #6b6558;
    cursor: pointer;
    transition: all .18s ease;
  }
  .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .toolbar .hint { font-size: 12.5px; color: #a09a8c; margin-left: 6px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
  }
  @media (max-width: 780px) {
    .grid { grid-template-columns: 1fr; }
    header.book h1 { font-size: 24px; }
  }

  .card { perspective: 1600px; cursor: pointer; }
  .card-inner {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.15,.2,1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    padding: 26px 26px 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 6px rgba(60,50,30,.08), 0 12px 28px rgba(60,50,30,.07);
  }
  .face.front {
    background: var(--card-front);
    border: 1px solid var(--border);
  }
  .face.back {
    background: var(--card-back);
    color: #ece7dc;
    transform: rotateY(180deg);
    border: 1px solid #141b28;
  }

  .face .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .num {
    font-size: 12px;
    color: #b3ac9c;
    font-family: Georgia, serif;
  }
  .tag {
    font-size: 11.5px;
    padding: 2px 10px;
    border-radius: 999px;
    letter-spacing: 1px;
    color: #fff;
    opacity: .92;
  }
  .tag.t1 { background: var(--tag-1); }
  .tag.t2 { background: var(--tag-2); }
  .tag.t3 { background: var(--tag-3); }
  .tag.t4 { background: var(--tag-4); }
  .tag.t5 { background: var(--tag-5); }

  .q-label, .a-label {
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .face.front .q-label { color: var(--accent); }
  .face.back .a-label { color: #d8a37e; }
  .q-text {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.65;
    flex: 1;
  }
  .a-text {
    font-size: 14.5px;
    line-height: 1.85;
    flex: 1;
    overflow-wrap: anywhere;
  }
  .a-text b { color: #f0c99a; font-weight: 700; }
  .a-text .src {
    display: block;
    margin-top: 12px;
    font-size: 12.5px;
    color: #9aa3b2;
    font-style: italic;
  }

  .face .flip-hint {
    margin-top: 14px;
    font-size: 12px;
    color: #b0a894;
    text-align: right;
    letter-spacing: 1px;
  }
  .face.back .flip-hint { color: #7e8898; }

  footer {
    margin-top: 46px;
    text-align: center;
    font-size: 13px;
    color: #a09a8c;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="book">
    <h1>卡片笔记写作法 · 精华 Anki 卡片</h1>
    <div class="sub">《How to Take Smart Notes》〔德〕申克·阿伦斯 著 · 卢曼卡片盒笔记法 · 55 张精华卡片</div>
    <div class="quote">"我并不是什么事都自己想。它们主要是在卡片盒里发生的。" —— 尼克拉斯·卢曼
      <span>点击卡片即可翻面查看答案 · 可按章节筛选</span>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button data-f="all" class="active">全部</button>
    <button data-f="1">卢曼与卡片盒</button>
    <button data-f="2">有效写作四原则</button>
    <button data-f="3">六个步骤 · 方法</button>
    <button data-f="4">六个步骤 · 认知科学</button>
    <button data-f="5">思维与创造</button>
    <span class="hint" id="count"></span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>依据《卡片笔记写作法：如何实现从阅读到写作》（人民邮电出版社，2021）整理 · 每张卡片：正面为问题，点击翻面看答案</footer>
</div>

<script>
const cards = [
// ============ 1 卢曼与卡片盒 ============

{ t:1, q:"卢曼有两类卡片盒，分别装什么？",
  a:"① <b>文献卡片盒</b>：一面写书目信息，另一面是对文献内容的简要说明；② <b>主卡片盒</b>：针对所读内容收集和产生的想法，每个想法一张卡片、只写一面，不必拿出盒子即可阅读。",
  s:"第一章 绪论" },
{ t:1, q:"卢曼如何给卡片编号并建立联系？",
  a:"直接相关的笔记接在后面：已有 22 号，新笔记编 23；若 23 已存在，则编 <b>21a</b>。数字与字母交替，可无限分支（如 21/3d7a6 → 21/3d7a7）。同时在相关笔记间添加链接，类似超链接但不相同。",

{ t:1, q:"卢曼如何处理读到的重要内容？照抄吗？",

{ t:1, q:"为什么把卡片盒当作“个人维基”或档案馆是误导？",
  a:"卡片盒<b>不是存取笔记的档案馆，而是辅助思考的工具箱</b>。它不只是提供你想要的东西，还会提醒你忘记已久的想法、触发意想不到的新想法——这只会发生在相互联系的笔记之间。",

{ t:1, q:"为什么卢曼卡片盒公开三十多年，却很少有人成功复制？",

{ t:1, q:"写论文为什么不需要“精灵”帮忙？",

{ t:1, q:"使用卡片盒需要哪些工具？（仅四种）",

// ============ 2 四原则 ============
{ t:2, q:"原则一：为什么说“写作是唯一重要的事情”？",
  a:"写作不是学习研究之后的事，而是<b>这些工作的媒介</b>。带着写作的目的去阅读、听讲座、讨论，你会更投入、更专注、更能区分“听起来好的论点”与“实际上好的论点”。即使永不发表，把写作当作最重要的事也会提升一切技能。",

{ t:2, q:"“卡片盒是学术界的集装箱”是什么意思？",
  a:"麦克莱恩用标准化集装箱重塑了全球贸易；卡片盒同理：<b>所有内容标准化成相同格式，存进同一个卡片盒</b>，不必按主题分开存放。标准化消除了格式和存放位置的选择负担，才能建立群聚效应，越积累越有价值（而非越乱）。",

{ t:2, q:"传统笔记系统与卡片盒的核心问题有何不同？",
  a:"传统系统问：“这条笔记存放在哪个主题下？”（档案思维）<br>卡片盒问：<b>“我想在哪个主题下再见到它？”</b>（写作者思维）。传统系统让大脑疲于回忆，卡片盒则呈现你已忘记的想法，让大脑专注思考。",
  s:"第二章 原则二" },
{ t:2, q:"三类笔记分别是什么？各自的归宿？",
  a:"① <b>闪念笔记</b>：捕捉想法的提醒，一两天内处理完就扔；② <b>永久笔记</b>：以永久可理解的方式写就，永不丢弃，存于卡片盒；③ <b>项目笔记</b>：只与特定项目相关（大纲、草稿、待办），项目结束即归档或丢弃。混淆这三类是写不出作品的主要原因之一。",
  s:"第二章 原则二" },
{ t:2, q:"记笔记的三个典型错误是什么？",
  a:"① 把所有笔记都当<b>永久笔记</b>——好笔记被淹没，永远无法形成群聚效应；② 只收集与<b>特定项目</b>相关的笔记——每个项目完成后从零开始；③ 把所有笔记都当<b>闪念笔记</b>——陷入混乱。共同后果：笔记越多越难用。",
  s:"第二章 原则二" },
{ t:2, q:"在书上画线、写空白评论，算是做笔记吗？",
  a:"只是<b>闪念笔记</b>，对阐述文本毫无作用。除非一两天内进一步处理，否则很快失效。卢曼从不在书上画线——他只把引起注意的观点记在另一张纸上，再转化为永久笔记。闪念笔记只是提醒你“还有一个想法没来得及阐述”。",

{ t:2, q:"为什么说“没有人完全从零开始写作”？",

  s:"第二章 原则四" },
{ t:2, q:"德韦克的“成长型思维”在本书中如何体现？",

{ t:2, q:"卡片盒的价值随规模如何增长？",

  s:"第二章 原则四" },

// ============ 3 六步骤·方法 ============

{ t:3, q:"“做专家，不做计划制订者”是什么意思？",

  s:"第三章 步骤一" },
{ t:3, q:"如何减少写作中的决策消耗？",
  a:"意志力是有限资源（自我损耗），决策最消耗它。对策：<b>标准化一切常规</b>——总是用同样的方式记闪念、提取观点、写成同一格式的永久笔记，让组织性决定一劳永逸，把心力留给内容。如比尔·盖茨只穿两种颜色的西装。",
  s:"第三章 步骤一" },
{ t:3, q:"写文稿时大纲应该怎么用？",
  a:"把大纲打印出来<b>一直放在眼前</b>，这样就不必同时考虑结构，可以专注琢磨正确的词语；并搞清楚眼下哪些内容不必写。目录只是参考指南而非执行准则——文章的结构会在写作过程中不断变化。",
  s:"第三章 · 完稿和修订" },
{ t:3, q:"如何面对“必须删掉心爱内容”的修改痛苦？",
  a:"把不适用的内容转移到另一个文档（如“XX剩余部分.doc”），告诉自己以后再用——虽然几乎从不会再看。这是心理学上的聪明“欺骗”。牢记：<b>草稿只是草稿</b>，修改最重要的任务是删除对论点没用的东西。",
  s:"第三章 · 完稿和修订" },

// ============ 4 六步骤·认知科学 ============
{ t:4, q:"人类短期记忆的容量上限是多少？",
  a:"经典说法是 <b>7±2</b> 件事（Miller），新研究认为更可能只有 <b>4 个</b>（Cowan）。而且信息不会像文件一样存放在短期记忆里，它们会在脑海中游荡、抢占注意力，直到被遗忘或转移。",
  s:"第三章 步骤一" },
{ t:4, q:"什么是蔡格尼克效应？如何为我所用？",
  a:"<b>未完成的任务会一直占据短期记忆</b>，直到被完成——或被写下来（大脑并不区分“真的完成”与“记下来推迟”）。反向利用：刻意让未解决的问题在脑海“游走”，散步、洗澡时常能灵光乍现地找到答案。",
  s:"第三章 步骤一" },
{ t:4, q:"为什么必须“用自己的话”记笔记？",
  a:"不转述就无法检验理解——重复阅读会因<b>曝光效应</b>制造“已理解”的错觉。塞尔的检验标准：“<b>如果你说不清楚，就表示你自己也不明白。</b>”写下来是检验是否真正理解的最简单方法。",
  s:"第三章 步骤二" },
{ t:4, q:"费曼如何看待他的笔记本？",
  a:"访客称赞那是“费曼思维过程的精彩记录”，费曼纠正：<b>“这不是我思维过程的记录，这就是我的思维过程——实际上我的思维活动都是在纸上进行的。”</b>思考不是纯粹的内部过程，纸是思考的发生地。",
  s:"第三章 · 大脑之外思考" },
{ t:4, q:"手写笔记和电脑录入，哪个更好？",
  a:"研究（Mueller & Oppenheimer）：记忆<b>数量</b>上无差别，但手写笔记的<b>理解水平</b>显著更好，且一周后仍明显。原因：手写得慢，必须先理解才能抓住重点；电脑逐字录入“绕过了大脑，从耳朵直接传到手指”。",
  s:"第三章 步骤二" },
{ t:4, q:"什么是确认偏差？达尔文如何对抗它？",
  a:"大脑会自动搜索支持已有观点的证据。达尔文的金科玉律：<b>“每当遇到与自己结论相反的事实、观察或思想，立即记下来”</b>——因为这类内容更容易从记忆中溜走。卡片盒则从系统层面化解：只以“相关/不相关”为标准，而非“支持/反对”。",
  s:"第三章 步骤二" },
{ t:4, q:"卢曼平均每天写几条笔记？",
  a:"卡片盒共约 <b>9 万条</b>笔记，从开始使用到去世约 30 年——平均<b>每天 6 条</b>。不必畏惧宏大目标：每天记 3~6 条笔记，比“每天写一页”更实际，且每条笔记都能一次性完成。",
  s:"第三章 · 坚持每天记几条笔记" },
{ t:4, q:"“存储强度”与“提取强度”有何区别？（比约克）",
  a:"存储强度终生只增不减；真正重要的是<b>提取强度</b>——通过“线索”触发记忆的能力。死记硬背追求存储，徒劳无功；应把信息与尽可能多的<b>有意义的上下文</b>联系起来，让笔记互为线索、相互提示——这正是卡片盒的做法。",
  s:"第三章 · 告别死记硬背" },
{ t:4, q:"记忆大师舍列舍夫斯基的故事说明了什么？",
  a:"他能记住几乎所有事情，却<b>很难忘记任何东西</b>：细节淹没要点，无法区分主次，几乎无法抽象思考，读《罗密欧与朱丽叶》只见字句不见悲剧。<b>遗忘（主动抑制）不是记忆的丧失，而是学习的前提</b>——记住一切反而是沉重的负担。",
  s:"第三章 · 告别死记硬背" },
{ t:4, q:"为什么说重复阅读几乎完全无用？",
  a:"反复阅读、画线是最流行的学习方法，也是被反复证明<b>几乎无效</b>的方法（Karpicke 等）。它制造“学会了”的感觉却不产生提取。有效的是：测试自己、详细阐释、建立联系——选择“真的变聪明”而非“感觉变聪明”。",
  s:"第三章 步骤二" },
{ t:4, q:"大脑和卡片盒如何分工？",
  a:"<b>卡片盒</b>负责细节和参考资料，存储长期记忆资源，保持信息客观；<b>大脑</b>专注于要点、深层次理解和学科大图景，更具创造力。各自做最擅长的事——我们需要“一个不受干扰的大脑 + 一个可靠的笔记系统，其他都是多余的”。",
  s:"第三章 步骤二" },

// ============ 5 思维与创造 ============
{ t:5, q:"索引的作用是什么？关键词该怎么选？",
  a:"索引只是<b>进入思路的入口</b>，每个关键词精选一两条切入笔记即可。选关键词时不要问“哪个最合适”（档案管理员思维），而问<b>“以后忘记它时，我会在什么情况下偶然发现它？”</b>（写作者思维）。好关键词往往不在笔记原文中出现。",
  s:"第三章 · 构建主题" },
{ t:5, q:"笔记间的“弱连接”为什么珍贵？",
  a:"笔记到笔记的普通链接就像社会关系中的弱连接（格兰诺维特）：<b>虽非首选求助对象，却常带来全新而有建设性的观点</b>。卢曼正是靠跨领域链接，发现金钱、权力、爱情、真理都是“促进沟通的媒介”这类惊人洞见。",
  s:"第三章 · 建立智能链接" },
{ t:5, q:"使用卡片盒后，为什么会“重复发明”已有的想法？",
  a:"因为大脑会忘掉曾想过的想法，再想起时仍像第一次一样兴奋。<b>卡片盒让幻想破灭，但也让思考真正前进</b>——你能把新笔记与旧笔记对比，发现差异、矛盾与对立（构建对立面是产生新思想最可靠的方式，Rothenberg）。",
  s:"第三章 · 比较、纠正和区分" },
{ t:5, q:"为什么闪卡（flashcard）不如卡片盒？",
  a:"闪卡的信息<b>孤立、缺乏上下文</b>，未嵌入理论框架、经验和思维模型的网格，因此更难学习和理解意义。卡片盒笔记则是相互联系网络中的元素——“每条笔记的质量取决于它所在的网格”（卢曼）。",
  s:"第三章 · 将卡片盒作为思考工具箱" },
{ t:5, q:"卢曼如何用卡片盒进行“头脑风暴”？",
  a:"用“卡片盒风暴”取代头脑风暴：头脑风暴只是凭记忆预测哪些想法值得写（大脑偏爱最近的、生动的、押韵的想法，且人越多好点子越少）；卡片盒则<b>真切地呈现值得写的内容</b>——看哪里已形成笔记集群即可。",
  s:"第三章 · 分享你的洞见" },
{ t:5, q:"什么是“特征存在效应”？卡片盒如何破解？",
  a:"人倾向高估<b>容易获得</b>的信息（最近的、记得住的），忽略已遗忘的信息。没有外力帮助，我们只会考虑自己知道的东西。卡片盒会不断提醒你早已遗忘的想法——对抗这一偏差。",
  s:"第三章 · 比较、纠正和区分" },
{ t:5, q:"为什么限制和标准化反而促进创造力？",
  a:"研究表明<b>思考与创造力在受限条件下更活跃</b>：俳句形式极简却流传千年；26 个字母写出一切；二进制只有 0 和 1。每张卡片只写一个想法、不超过一屏——放弃选择就是自由，把资源留给内容本身。",
  s:"第三章 · 通过设限来促进创造力" },
{ t:5, q:"“幸存者偏差”的瓦尔德故事讲了什么？",
  a:"二战统计学家瓦尔德建议：装甲不要加在返航飞机的弹孔上，而加在<b>没有弹孔的地方</b>——因为那些部位中弹的飞机没能飞回来。启示：要养成“问自己缺了什么”的习惯，真正看到你看到的，而非期望看到的。",
  s:"第三章 · 在卡片盒内思考" },
{ t:5, q:"为什么应该同时写多个项目？",
  a:"像化工业的“一体化”：一条生产线的副产品是另一条的原料。写作的副产品可服务其他项目，<b>卡顿时就切换项目</b>——卢曼：“被某个项目困住时？嗯，写其他的书。这样我从来不会遇到任何心理障碍。”",
  s:"第三章 · 完稿和修订" },
{ t:5, q:"什么是“规划谬误”？学生实验揭示了什么？",
  a:"比勒实验：学生“实事求是”估计的用时 ≈ 他们“一切顺利”时的估计；实际用时甚至<b>超过最坏情况的估计</b>。对策：不依赖计划，把任务拆小、每天记笔记，用一年数百次的即时反馈校准自己的真实效率。",
  s:"第三章 · 放弃做计划才能成为专家" },
{ t:5, q:"如何养成记卡片笔记的习惯？",
  a:"不要与旧习惯决裂，也不靠意志力硬逼，而是<b>让新习惯有策略地取代旧习惯</b>：阅读时拿起纸笔记录→转化为永久笔记→建立联系。怀特海：文明的进步，在于不断增加我们能够不假思索地做事情的数目。",
  s:"第三章 · 养成习惯" },
{ t:5, q:"把卡片盒当“档案库”用，会怎样？",
  a:"会失望。如果只是想存储信息，根本不必用卡片盒。它的价值在于<b>改变工作流程</b>：让阅读、思考、写作在笔记间循环生长。学习不是为了积累知识，而是让自己成为具有不同思维方式的人。",
  s:"后记" }
];

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const names = {1:'卢曼与卡片盒', 2:'四原则', 3:'六步骤·方法', 4:'六步骤·认知', 5:'思维与创造'};

function render(filter) {
  grid.innerHTML = '';
  const list = cards.filter(c => filter === 'all' || c.t === filter);
  list.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          <div class="meta">
            <span class="num">No.${String(i+1).padStart(2,'0')}</span>
            <span class="tag t${c.t}">${names[c.t]}</span>
          </div>
          <div class="q-label">Q · 问</div>
          <div class="q-text">${c.q}</div>
          <div class="flip-hint">点击翻面 ⟳</div>
        </div>
        <div class="face back">
          <div class="meta">
            <span class="num">No.${String(i+1).padStart(2,'0')}</span>
            <span class="tag t${c.t}">${names[c.t]}</span>
          </div>
          <div class="a-label">A · 答</div>
          <div class="a-text">${c.a}<span class="src">—— ${c.s}</span></div>
          <div class="flip-hint">点击返回问题 ⟳</div>
        </div>
      </div>`;
    el.addEventListener('click', () => el.classList.toggle('flipped'));
    grid.appendChild(el);
  });
  countEl.textContent = `共 ${list.length} 张`;
}
render('all');

document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.f);
});
</script>
