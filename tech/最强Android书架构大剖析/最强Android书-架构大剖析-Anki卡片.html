<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《最强Android书：架构大剖析》Anki 闪卡</title>
<style>
  :root {
    color-scheme: light;
    --green: #2BA05F;
    --green-deep: #17663B;
    --accent-bg: #E8F5EE;
    --bg: #F6F7F4;
    --ink: #1C221E;
    --ink-2: #4A554E;
    --ink-3: #7C867F;
    --line: #DDE2DA;
    --card-front-bg: #FFFFFF;
    --card-back-bg: #F0F7F2;
    --navy: #12324A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: .92em; background: var(--accent-bg); color: var(--green-deep); padding: 1px 5px; border-radius: 4px; }
  b { color: var(--green-deep); }
  .face.back b { color: #134E2E; }

  /* ---------- header ---------- */
  .hero { max-width: 1180px; margin: 0 auto; padding: 34px 24px 6px; }
  .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: .3px; }
  .hero h1 span { color: var(--green-deep); }
  .hero-sub { color: var(--ink-3); font-size: 13.5px; margin: 8px 0 14px; }
  .hero-stats { display: flex; gap: 28px; margin-bottom: 16px; }
  .hero-stats .st b { display: block; font-size: 24px; font-weight: 800; }
  .hero-stats .st span { font-size: 12.5px; color: var(--ink-3); }
  .hero-tip { font-size: 12.5px; color: var(--ink-3); background: #EFF4EF; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 4px; }

  /* ---------- toolbar ---------- */
  .toolbar { max-width: 1180px; margin: 0 auto; padding: 10px 24px 14px; position: sticky; top: 0; z-index: 50;
    background: rgba(246,247,244,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 13px; padding: 5px 13px; border-radius: 999px; cursor: pointer; transition: .15s; user-select: none; }
  .chip:hover { border-color: var(--green); color: var(--green-deep); }
  .chip.on { background: var(--green-deep); border-color: var(--green-deep); color: #fff; font-weight: 600; }
  .chip .cnt { opacity: .75; font-size: 11.5px; margin-left: 4px; }
  .tools { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  #search { flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 14px; background: #fff; outline: none; transition: .15s; }
  #search:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(43,160,95,.14); }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: .15s; }
  .btn:hover { border-color: var(--green); color: var(--green-deep); }
  #searchInfo { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

  /* ---------- grid & flip cards ---------- */
  .grid { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .card { perspective: 1600px; min-width: 0; }
  .card-inner {
    position: relative; width: 100%; min-height: 190px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.1,.2,1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; padding: 18px 20px; overflow: auto;
    box-shadow: 0 1px 3px rgba(20,40,30,.08), 0 4px 14px rgba(20,40,30,.05);
  }
  .face.front { background: var(--card-front-bg); border: 1px solid var(--line); }
  .face.back  { background: var(--card-back-bg); border: 1px solid #CBE3D3; transform: rotateY(180deg); }
  .card.hidden { display: none; }

  .c-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .c-ch { font-size: 11px; font-weight: 700; color: #fff; background: var(--ch,#2BA05F); border-radius: 6px; padding: 2px 8px; letter-spacing: .5px; flex-shrink: 0; }
  .c-no { font-size: 11.5px; color: var(--ink-3); font-family: Consolas, monospace; }
  .c-tags { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .c-tag { font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line); background: #FAFBF9; border-radius: 999px; padding: 1px 8px; }
  .c-q { font-size: 15px; font-weight: 600; line-height: 1.65; color: var(--ink); }
  .c-a { font-size: 13.8px; line-height: 1.75; color: #22322A; }
  .c-a ul { margin: 6px 0 2px 1.4em; }
  .c-a li { margin-bottom: 3px; }
  .flip-hint { position: absolute; right: 14px; bottom: 10px; font-size: 11px; color: #B4BDB6; pointer-events: none; }
  .face.back .flip-hint { color: #9DC1A9; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--ink-3); padding: 60px 0; font-size: 15px; }

  footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 40px; color: var(--ink-3); font-size: 12.5px; }
</style>
</head>
<body>

<div class="hero">
  <h1>《最强Android书：架构大剖析》<span>Anki 闪卡</span></h1>
  <div class="hero-sub">[美] Jonathan Levin 著 · 崔孝晨 等译 —— 全书 8 章 + 前言，按章节系统出题（概念 / 数据结构 / 流程 / 命令 / 设计原因）</div>
  <div class="hero-stats">
    <div class="st"><b id="stTotal">–</b><span>卡片总数</span></div>
    <div class="st"><b id="stCh">–</b><span>章节</span></div>
    <div class="st"><b id="stFlipped">0</b><span>已翻看</span></div>
  </div>
  <div class="hero-tip">点击卡片即可 3D 翻转查看答案；再次点击翻回。用上方章节筛选与搜索快速定位卡片；「显示答案 / 全部复位」可批量翻卡。</div>
</div>

<div class="toolbar">
  <div class="chips" id="chips"></div>
  <div class="tools">
    <input id="search" type="text" placeholder="搜索问题或答案，如：Binder、SELinux、Zygote、oom_adj…">
    <span id="searchInfo"></span>
    <button class="btn" id="btnFlipAll">显示答案</button>
    <button class="btn" id="btnReset">全部复位</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<footer>
  内容整理自《最强Android书：架构大剖析》（电子工业出版社），仅供个人学习交流使用。同目录附 Anki 可导入的 TSV 文本文件。
</footer>

<script>
const CARDS = [{"chapter":"前言","front":"《最强Android书》的作者是谁？他还有哪部代表作？","back":"作者是<b>Jonathan Levin</b>，代表作是《Mac OS X and iOS Internals》。本书是他Android Internals系列的第一本（Power User's View，面向高级用户/管理员视角），不涉及代码开发。","tags":"前言;作者;背景"},{"chapter":"前言","front":"本书（Android Internals系列第一本）的定位是什么？框架服务细节在系列第几本讨论？","back":"第一本是<b>Power User's View（高级用户视角）</b>，面向高级用户/管理员，不涉及代码开发；与system_server相关的框架服务细节在系列<b>第2本</b>讨论。","tags":"前言;作者;背景"},{"chapter":"前言","front":"本书推荐的阅读方式是怎样的？","back":"各章<b>独立成章</b>，可顺序阅读也可随机翻阅；电子版中主题引用以<b>超链接</b>形式给出，纸质版给出章节编号或URL。","tags":"前言;阅读方式"},{"chapter":"前言","front":"书中如何引用AOSP源码？如何下载Android源码？","back":"书中以<b>缩略形式的AOSP文件路径</b>标注所引用的源码文件；可从 <code>source.android.com</code> 使用 <code>git</code> 或 <code>repo</code> 命令下载最新Android源码。","tags":"前言;源码引用"},{"chapter":"前言","front":"本书的排版约定有哪些？","back":"<code>filename</code> 表示文件名；命令/系统调用标注man手册章节号，如 <code>command(1)</code>、<code>systemCall(2)</code>；命令输出中的提示符（<code>$</code> 或 <code>#</code>）可区分该操作是否需要root权限。","tags":"前言;排版约定"},{"chapter":"前言","front":"本书的配套官方网站是什么？中文版对应哪个Android版本？","back":"官方网站是 <b>NewAndroidBook.com</b>（提供进阶阅读、定制工具、勘误表）；中文版更新至Android <b>Nougat 7.1</b>（2016年11月底版本）。","tags":"前言;配套资源"},{"chapter":"前言","front":"本书为什么强调动手实践？“学习UNIX的唯一正确方式”指什么？","back":"书中实验改编自作者的Android培训课程，作者引用名言“<b>学习UNIX的唯一正确方式是用我们的手指</b>”，即强调亲自敲命令、动手实践而非只阅读。","tags":"前言;方法论"},{"chapter":"前言","front":"本书的核心方法论是什么？与传统Android书籍有何不同？","back":"通过在<b>ADB（Android调试桥）中执行各种命令</b>（而非阅读代码）直观揭示Android内部工作原理；与传统“程序员视角”的Android书籍不同，它<b>降低门槛</b>：面向取证人员、技术发烧友等非开发人群，同时不失深度。","tags":"前言;方法论;ADB"},{"chapter":"前言","front":"本书英文版曾发生过什么著名的泄露事件？","back":"英文版曾被<b>CIA私下盗版</b>用于特工内部培训，此事由CIA <b>Vault7</b> 文件泄露事件披露。","tags":"前言;背景"},{"chapter":"前言","front":"本书第1章讲什么？","back":"Android操作系统<b>总览</b>：版本演化史（Froyo至Nougat）、Android与Linux基础的<b>逐层比较</b>、Android衍生产品（含亚马逊FireOS）、未来发展方向。","tags":"前言;各章主题;第1章"},{"chapter":"前言","front":"本书第2章讲什么？","back":"<b>分区与文件系统</b>：EXT4与F2FS、系统目录内容（有电子取证价值）、受保护文件系统OBB和ASEC、Linux伪文件系统（cgroupfs、debugfs、procfs、sysfs等）。","tags":"前言;各章主题;第2章"},{"chapter":"前言","front":"本书第3章讲什么？","back":"Android的<b>启动过程</b>：启动镜像（boot.img，俗称“ROM”）、Boot Loader、内核/设备树/initramfs组件；实验演示<b>解包-修改-重打包</b>制作自制刷机包；以及OTA升级、备份、重置与关机。","tags":"前言;各章主题;第3章"},{"chapter":"前言","front":"本书第4章讲什么？","back":"<b>/init进程</b>：它是用户态启动系统的第一个进程（PID=1）；详解<b>init.rc语法</b>；init还负责维护系统属性，并以<b>ueventd</b>身份监视硬件变化。","tags":"前言;各章主题;第4章"},{"chapter":"前言","front":"本书第5章讲什么？","back":"<b>原生服务（守护进程）</b>：即init.rc中列出、由init启动的Linux二进制守护进程；与之相对的是system_server中以<b>线程</b>形式运行的框架服务（后者在第2本讨论）。","tags":"前言;各章主题;第5章"},{"chapter":"前言","front":"本书第6章讲什么？","back":"<b>框架服务架构</b>：<b>servicemanager</b>与<b>system_server</b>构成所有框架服务的基石；简要描述<b>Binder</b>（细节在第2本）。","tags":"前言;各章主题;第6章"},{"chapter":"前言","front":"本书第7章讲什么？","back":"<b>以Linux视角看Android</b>：通过/proc伪文件系统和Linux工具观察进程与应用；用户态内存管理与<b>OOM</b>；跟踪系统调用。","tags":"前言;各章主题;第7章"},{"chapter":"前言","front":"本书第8章讲什么？","back":"<b>安全</b>：涵盖Linux层与Dalvik层所有安全特性；并设<b>root专题</b>，区分“启动环节root”与“漏洞root”。","tags":"前言;各章主题;第8章"},{"chapter":"第1章","front":"Android系统升级的主要方式是什么？为什么说Android极少涉及内核级代码的修改？","back":"多数用户可见的特性通过<b>新增框架（framework）或添加API</b>来完成，极少涉及内核级代码。这体现了Android的分层架构：内核相对稳定，功能演进集中在框架层。","tags":"第1章;版本史;总体架构"},{"chapter":"第1章","front":"截至Android Nougat，7年间Android更新了多少个版本？API版本号达到了多少？命名规则是什么？","back":"7年更新了<b>12个版本</b>；API版本号截至Nougat达到<b>25</b>。命名规则：<b>API level</b>将内部API集与甜点食品代号（如Froyo、Lollipop）挂钩。Android进化速度极快，每隔几个月就出新版本，被称为移动OS的\"军备竞赛\"。","tags":"第1章;版本史"},{"chapter":"第1章","front":"列出Froyo到Nougat各版本对应的API level、内核版本，以及2016年11月的市场占有率（表1-1）。","back":"<ul><li>Froyo 2.2：API 8，内核2.6.32</li><li>Gingerbread 2.3：API 9/10，内核2.6.35</li><li>Honeycomb 3.0-3.2：API 11-13，内核2.6.36</li><li>ICS 4.0：API 14/15，内核3.0.1</li><li>JellyBean 4.1-4.3：API 16/17/18</li><li>KitKat 4.4：API 19/20</li><li>Lollipop 5.0-5.1.1：API 21/22，内核3.4/3.10</li><li>Marshmallow 6.0：API 23，内核3.4/3.10</li><li>Nougat 7.0：API 24（2016/8发布），内核3.14-3.18；7.1：API 25，内核4.1</li></ul>市场占有率（2016/11）：KitKat约25.2%、Lollipop约34.1%、Marshmallow约24.0%。注意：同一Android版本下各机型内核版本可能不同（厂商自行编译或迁移内核）。","tags":"第1章;版本史;数据对比"},{"chapter":"第1章","front":"Android Froyo（2.2）引入了哪些重要特性？","back":"<ul><li>第一个支持在<b>SD卡（扩展存储）上安装应用</b>的版本</li><li>引入<b>ASEC</b>（Android Secure Containers）安全存储容器</li><li>引入<b>USB tethering</b>（USB网络共享）</li><li>引入<b>JIT</b>（即时编译，用专门的线程完成），大幅提升Dalvik运行速度</li></ul>","tags":"第1章;版本史;Froyo"},{"chapter":"第1章","front":"什么是ASEC（Android Secure Containers）？它解决了什么问题？","back":"ASEC是Froyo引入的<b>安全存储容器</b>机制，用于保护FAT文件系统扩展存储（SD卡）上的应用<b>不被复制</b>，使应用能够安全地安装到外部存储上。","tags":"第1章;版本史;Froyo;概念"},{"chapter":"第1章","front":"Android Gingerbread（2.3）有哪些重要新特性？它有什么\"反面记录\"？","back":"<ul><li>第一个被<b>广泛采用</b>的Android版本</li><li>Dalvik引入<b>并发垃圾回收（GC）</b>，GC运行时无需暂停应用</li><li>传感器API完全更新；原生代码可访问声卡、显卡、存储设备甚至activity manager</li><li>首次引入<b>NFC</b>支持</li><li>用<b>Ext4</b>替代YAFFS作为默认文件系统</li></ul>反面记录：它是迄今<b>最不安全的Android版本</b>——短信应用bug加大量安全漏洞导致rootkit级恶意软件爆发。","tags":"第1章;版本史;Gingerbread"},{"chapter":"第1章","front":"什么是OBB（opaque binary blobs）？它解决了什么问题？","back":"OBB即\"<b>APK扩展文件</b>\"，是Gingerbread引入的解决APK包<b>50MB大小限制</b>的变通方案——大资源文件可放在OBB中与APK一起分发，且OBB<b>可以加密</b>。对应框架包为android.os.storage（API 9）。","tags":"第1章;版本史;Gingerbread;概念"},{"chapter":"第1章","front":"Android Honeycomb（3.0-3.2）为什么被称为特殊版本？它引入了哪些重要机制？","back":"Honeycomb是<b>平板电脑专用版本</b>，源码树从未完整发布，是<b>唯一未公开源码</b>的Android版本。重要机制：<ul><li>引入<b>fragment</b>机制（类似Windows MDI多文档接口）</li><li>硬件加速的OpenGL渲染2D；引入<b>RenderScript</b>（类GL/类OpenCL语言）</li><li>第一个支持底层<b>加密用户数据分区</b>的版本（由Linux device mapper完成）</li><li>引入<b>多核支持</b>：重新编译内核以支持SMP（可用uname或/proc/version检查）</li></ul>影响：使厂商意识到<b>Android虽免费但谷歌仍控制着系统</b>。","tags":"第1章;版本史;Honeycomb"},{"chapter":"第1章","front":"Android Ice Cream Sandwich（4.0）新增了哪些网络特性和内存管理回调？","back":"<ul><li>网络新特性：<b>VPN框架</b>、<b>Wi-Fi Direct</b>、<b>Android Beam</b></li><li>UI大量加强</li><li>新增<b>onTrimMemory()</b>回调：内存不足时按level参数提示应用释放内存（仅建议性，不强制）</li></ul>","tags":"第1章;版本史;ICS"},{"chapter":"第1章","front":"Android JellyBean（4.1-4.3）最突出的特性是什么？API 17和API 18分别新增了什么？","back":"最突出特性是<b>多用户账户</b>：同一设备多个用户，各自独立的UI/widget/应用/数据，但活跃登录用户只有一个。<ul><li>API 17：首次引入<b>SELinux</b>；修复ADB USB调试强制授权的漏洞</li><li>API 18：<b>OpenGL ES 3.0</b>、蓝牙低功耗（<b>BLE</b>）、App Ops权限调整服务（其UI在4.4.2中被移除）</li></ul>此外在ASEC基础上提供<b>应用加密与forward lock（预先锁定）</b>，防止SD卡盗版分享。","tags":"第1章;版本史;JellyBean"},{"chapter":"第1章","front":"Android KitKat（4.4）的核心目标是什么？为此引入了哪些配套机制？","back":"核心目标是\"<b>瘦身</b>\"：让Android在<b>512MB内存</b>的入门设备上流畅运行，以终结碎片化。配套机制：<ul><li>重写框架代码降低内存占用</li><li>服务按<b>串行顺序启动</b></li><li>新增<b>ActivityManager.isLowRamDevice()</b> API</li><li>新增<b>procstats</b>服务统计应用内存使用</li></ul>","tags":"第1章;版本史;KitKat"},{"chapter":"第1章","front":"KitKat跟风iOS 7.0引入了哪些特性？zRAM是什么？此外还有哪些新增（运行时/NFC等）？","back":"跟风iOS 7.0的特性：<ul><li>计步器（软件定义传感器）</li><li>timer coalescing（计时聚合）</li><li>sensor batching（传感器批处理）</li></ul>共同思想：<b>增大处理粒度以换取省电</b>。<br><b>zRAM</b>：针对内存富余设备，将未使用的内存页压缩后交换到内存指定位置（<code>/dev/block/zram0</code>，对应<code>/proc/swaps</code>），与iOS 7.0的压缩内存几乎同期。<br>其他新增：蓝牙MAP、红外遥控（ConsumerIR）API、打印框架、NFC <b>HCE</b>（主机卡模拟），以及以实验性质引入<b>ART</b>作为Dalvik的可选替代方案。","tags":"第1章;版本史;KitKat"},{"chapter":"第1章","front":"Android Lollipop（5.0）在UI和运行时方面有哪些重大变化？Project Volta是什么？","back":"<ul><li>UI引入<b>Material Design</b>（扁平化设计，元素带真实光影效果）</li><li>通知系统支持极大扩充</li><li>全面采用<b>ART</b>：用<b>AOT（Ahead Of Time预编译）</b>替代JIT，提前将Dalvik字节码编译成原生代码，并让App充分利用<b>64位处理器</b></li><li>OpenGL ES 3.1；传感器HAL支持复杂手势与心率传感器</li><li><b>Project Volta</b>：通过新作业调度API延长电池寿命，提供batterystats等电源监视工具</li></ul>","tags":"第1章;版本史;Lollipop;ART"},{"chapter":"第1章","front":"Android Marshmallow（6.0）革命性的变化是什么？gatekeeper服务是什么？","back":"革命性变化是<b>权限模型</b>：权限检查与授予移到<b>运行时（runtime）</b>，不再在安装时一揽子授权——大幅降低恶意软件窃取隐私的风险。<br><b>gatekeeper服务</b>：M版新增的安全服务，使用完全由<b>硬件实现</b>的口令/秘密信息存储器来提升安全性。M版还首次提供ARM64出厂镜像。","tags":"第1章;版本史;Marshmallow;权限"},{"chapter":"第1章","front":"Marshmallow的电源管理改进有哪些？","back":"<ul><li><b>Doze模式</b>：设备长期休眠中周期性唤醒应用同步数据</li><li><b>App idle detection</b>（应用空闲检测，类似iOS的App Nap）</li><li>加密扩展到整个存储分区</li></ul>其他：Direct Share、App Linking、音视频同步改进、MIDI支持、Android for Work增强。","tags":"第1章;版本史;Marshmallow;省电"},{"chapter":"第1章","front":"Android Nougat（7.0/7.1）有哪些重要新特性？","back":"<ul><li><b>多窗口（multi-window）</b>支持；force-touch重按手势（对应iOS 3D Touch）</li><li>绑定通知（bundle notification）、Doze改进、<b>Vulkan</b>新3D渲染API、平台支持VR应用</li><li>安全改进：<b>seccomp-bpf</b>限制无权限应用使用某些系统调用、限制第三方应用对<code>ioctl(2)</code>的访问、启动时验证/system分区未被修改</li><li>JVM改用<b>Oracle OpenJDK</b>：支持Java 8特性（如闭包），采用Jack编译器</li><li><b>direct-boot</b>启动模式：部分应用可在系统启动后即运行（不必等用户解锁）</li><li>7.1：基于文件的加密（类似iOS的cprotect机制）</li></ul>","tags":"第1章;版本史;Nougat"},{"chapter":"第1章","front":"列举Android的重要系统属性（表1-2）及查看方法。","back":"用<b>getprop</b>工具读取（属性存于<code>/system/build.prop</code>）。最有用的属性：<ul><li><code>ro.build.version.sdk</code>：API版本号</li><li><code>ro.build.fingerprint</code>：构建指纹（斜杠分隔，如generic/sdk_phone_armv7/generic:5.0/LRX09D/1504858:eng/test-keys）</li><li><code>ro.product.manufacturer</code>：厂商ID</li><li><code>ro.product.name</code>：设备代号（谷歌设备为鱼类名）</li><li><code>ro.build.version.release</code>：基本版本号</li><li><code>ro.build.id</code>：系统版本号</li><li><code>ro.build.type</code>：user=正式版 / eng=工程版</li><li><code>ro.build.tags</code>：release-keys=正式证书 / test-keys=开发测试</li></ul>GUI路径\"设置→关于手机\"对应AOSP的com.android.settings.DeviceInfoSettings类。","tags":"第1章;版本史;系统属性"},{"chapter":"第1章","front":"为什么说Android不是Linux发行版？对比两者的栈结构（图1-2）。","back":"发行版是公司把内核+二进制组件打包发布；而Android不是发行版，而是一个完整的\"<b>软件栈（stack）</b>\"：Linux内核 + shell二进制 + 完整GUI环境 + 丰富框架 + Java开发语言 = 真正的<b>RAD（快速应用开发）环境</b>。<br>栈结构对比：<ul><li>Android栈：应用 → 框架 → Linux内核 → 硬件</li><li>Linux栈：应用 → GNOME/KDE → X-Windows → 原生库（glibc）→ 内核</li></ul>","tags":"第1章;Android与Linux;概念"},{"chapter":"第1章","front":"什么是MADA（Mobile Application Distribution Agreement）？厂商签署的代价是什么？","back":"MADA是谷歌的<b>移动应用分发协议</b>：厂商签署后可以不受限制地整合谷歌App和服务；代价是<b>强制预装全套谷歌应用</b>。这是谷歌控制Android生态的重要手段。当时市场格局：Android约80%占有率，iOS约20%，Windows Mobile和黑莓几乎可忽略。","tags":"第1章;Android与Linux;概念;MADA"},{"chapter":"第1章","front":"Android内核与Linux主线内核的分合历史是怎样的？Android与Linux的相似度估算是多少？","back":"Android内核源码树约在<b>2.6.27</b>从主线分离，从<b>Android 3.3</b>开始回归主线；框架与AOSP运行时在独立代码仓库维护。相似度估算：内核层约<b>95%</b>相似，用户态约<b>65%</b>相似。","tags":"第1章;Android与Linux;数据对比"},{"chapter":"第1章","front":"什么是Androidisms？包括哪些主要内核特性？","back":"Androidisms是<b>Android特有的内核差异/特性</b>的统称（涉及IPC、内存、日志增强等），部分已合并回主线，部分放在<code>drivers/staging/android</code>目录。主要包括：<ul><li><b>ASHMem</b>（匿名共享内存）</li><li><b>Binder</b>（IPC）</li><li><b>Logger</b>（内核级ring buffer日志，日志由/dev/log承载，Lollipop新增logd守护进程）</li><li><b>ION内存管理器</b>（ICS引入，经/dev/ion分配内存，替换PMEM）</li><li><b>低内存进程终止器LMK</b>（改进自Linux OOM，Lollipop新增lmkd守护进程）</li><li>RAM Console（已弃用，改用pstore）</li><li>Sync driver（图形栈同步基元）</li><li>定时输出和GPIO（振动器经/sys/class/timed_output/vibrator/enable写入毫秒值）</li><li>wakelocks（阻止内核休眠，已逐步并入内核wakeup source机制）</li></ul>","tags":"第1章;Android与Linux;概念;Androidisms"},{"chapter":"第1章","front":"ASHMem和Binder分别是什么？Binder源自哪里？","back":"<b>ASHMem</b>（匿名共享内存）：Android的进程间共享内存机制，通过字符设备<code>/dev/ashmem</code>打开并map到进程内存。<br><b>Binder</b>：Android所有IPC的关键，<b>源自BeOS</b>；表现为字符设备<code>/dev/binder</code>，各服务在其上注册，客户端经<b>servicemanager</b>连接。","tags":"第1章;Android与Linux;Androidisms;概念"},{"chapter":"第1章","front":"Android用户态与Linux的主要分歧来源有哪些？巧用了Linux哪些已有特性？依赖哪些开源项目？","back":"用户态分歧来源：<b>Dalvik运行时、硬件抽象层（HAL）、Bionic替换glibc、定制版init</b>；但原生二进制、进程/线程行为与Linux一致，Linux调试/trace技法仍可用。<br>巧用的Linux特性：<b>control group（控制组）</b>、<b>OOM</b>（扩展为Android的内存不足进程清理器）、<b>权能（capabilities）</b>与<b>SELinux</b>。<br>依赖的开源项目（AOSP external/目录，多负责网络功能）：racoon（VPN）、mdns（服务发现）、dnsmasq、hostapd（tethering/Wi-Fi Direct）、wpa_supplicant（Wi-Fi）。","tags":"第1章;Android与Linux"},{"chapter":"第1章","front":"Android框架的包命名空间规则是什么？框架jar文件存放在哪里？","back":"命名空间：<code>android.*</code>（开发者可用）、<code>com.android.*</code>（系统内部）、<code>java.*</code>（标准Java运行时）。<br>打包位置：<code>/system/framework</code>目录下的<b>*.jar</b>文件（Lollipop起预编译进<code>boot.jar</code>）；可用<b>dexdump</b>分析jar中的classes.dex。","tags":"第1章;Android与Linux;框架"},{"chapter":"第1章","front":"Dalvik虚拟机是谁发明的？为什么说它不是Java虚拟机？\"Dalvik已死\"的说法错在哪里？","back":"Dalvik由<b>Dan Bornstein</b>发明，名字纪念冰岛北部小渔村Dalvik。它不是JVM：运行完全不同的字节码<b>DEX（Dalvik EXecutable）</b>，在执行效率和共享内存方面做了更多优化；核心类基础是<b>Apache Harmony</b>的子集（Oracle 2010年曾因此起诉谷歌）。<br>Dalvik并未消亡——只有<b>JIT部分被ART取代</b>，<b>DEX文件格式作为关键架构概念仍具生命力</b>：应用仍以classes.dex打包进APK，ART的编译发生在APK安装到设备之后。","tags":"第1章;Android与Linux;Dalvik;ART"},{"chapter":"第1章","front":"什么是JNI？为什么厂商既偏好纯Dalvik应用又常用JNI？x86设备如何运行ARM原生代码？","back":"JNI（Java Native Interface）允许应用调用<b>原生代码库（ELF共享库）</b>，通常在需要访问硬件或芯片集特有功能时使用。<br>厂商偏好\"纯\"Dalvik应用（可跨处理器体系结构无修改运行）；但虚拟机有<b>性能限制</b>且<b>易被反编译</b>，所以用JNI优化性能或对抗逆向工程很常见。谷歌提供<b>NDK</b>生成原生库；JNI库放在APK内<code>/lib/architecture</code>目录（如lib/armeabi、lib/x86等）。<br>x86兼容：Intel提供闭源<b>Houdini ARM模拟器</b>，使ARM原生代码运行在Intel处理器上。","tags":"第1章;Android与Linux;JNI;概念"},{"chapter":"第1章","front":"Android的原生二进制可执行文件是什么格式？存放在哪些目录？常见原生守护进程有哪些？","back":"所有可执行文件都是<b>ELF格式</b>；Android关键系统组件用C/C++编写，Dalvik虚拟机本身也是ELF二进制。存放位置：<code>/system/bin</code>和<code>/system/xbin</code>（重要文件也有在/sbin的）。<br>常见进程（ps可见）：vold、rild、audioserver、netd、debuggerd、mediaserver、installd、keystore、adbd等。分析工具：<b>readelf、objdump</b>等binutils工具集；NDK在toolchains/目录提供交叉编译工具集。","tags":"第1章;Android与Linux;原生二进制"},{"chapter":"第1章","front":"谷歌为什么用Bionic替换glibc？Bionic相比标准glibc去掉了哪些特性？","back":"动机：谷歌宣称因<b>简洁性</b>，实际上<b>合法性（规避GPL）占重要地位</b>——用GPL的GLibC则Android必须开源；Bionic采用<b>BSD授权+谷歌自有授权</b>的混合方式。<br>去掉的特性：<ul><li><b>精简系统调用支持</b>：stub由SYSCALLS.TXT自动生成，部分系统调用不导出</li><li>不支持<b>System V IPC</b>（sem/shm系列）：改用自己的IPC（Binder与ASHMem）</li><li><b>有限Pthread</b>：内置支持（无需单独libpthread.so），但<code>pthread_cancel()</code>不可用；mutex改用内核<code>futex(2)</code></li><li><b>有限C++支持</b>：不支持异常处理；STL不内置</li><li>不支持<b>本地化/宽字符</b>：Unicode可经libutils.so使用</li></ul>","tags":"第1章;Android与Linux;Bionic"},{"chapter":"第1章","front":"Bionic新增了哪些glibc没有的特性？","back":"<ul><li><b>系统属性</b>：Android特有的\"键/值\"式配置存储；实现于共享内存，所有进程只读，仅init有写权限</li><li><b>硬编码UID/GID</b>：不依赖passwd/group文件；每个应用分配独立uid/gid（从10000起，JellyBean起格式为uXX_aYYY）；1000-9999保留给Android子系统；AID定义在android_filesystem_config.h</li><li><b>内置DNS解析</b>：整合原libresolv.so功能，更安全（随机源端口和Query ID）；每进程可有独立DNS服务器列表（net.dns.&lt;pid&gt;属性）</li><li><b>硬编码服务和协议</b>：去掉/etc/protocols和/etc/services，用<code>res_get_static()</code>模拟<code>getservent(3)</code></li></ul>","tags":"第1章;Android与Linux;Bionic"},{"chapter":"第1章","front":"移植原生代码到Bionic有哪些已知问题和注意事项？","back":"Bionic是移植的<b>最主要障碍</b>；部分源码包只需NDK重新编译+调整configure脚本。<b>静态链接的二进制通常完全兼容</b>（同一CPU体系结构下），例如静态编译的ARM版BusyBox可直接复制到其他ARM嵌入式Linux运行。<br>Bionic遗留问题（记录在ABI-bugs.txt）：<code>time_t</code>为32位（<b>2038年问题</b>）、<code>off_t</code>为32位（大于4GB文件的bug）。","tags":"第1章;Android与Linux;Bionic"},{"chapter":"第1章","front":"Android的核心（core）原生库有哪些？各自的职责是什么？","back":"位于<code>system/core</code>目录：<ul><li><b>libcutils</b>：封装内核导出数据（/proc/cpuinfo等）、socket、ASHMem等Android特性</li><li><b>liblog</b>：封装/dev/log机制，快速高效的ring-buffer日志</li><li><b>libion</b>：封装ICS引入的ION Memory Allocator</li><li><b>libnl 2</b>：封装NetLink socket机制</li><li><b>libpixelflinger</b>：SurfaceFlinger核心部件使用（像素混合合成）</li><li><b>libsuspend</b>：休眠/挂起相关电源管理函数</li><li>次要库：libdiskconfig、libcorkscrew（栈分析与tombstone崩溃转储）、libmemtrack、libmincrypt（RSA与SHA签名）、libnetutils、libsysutils、libzipfile（apk本身就是zip文件）</li></ul>","tags":"第1章;Android与Linux;原生库"},{"chapter":"第1章","front":"支持Android框架的本地库有哪些（frameworks/目录）？","back":"<ul><li><code>frameworks/base/core/jni</code>：<b>libandroid_runtime.so</b>（Dalvik JNI底层支持）+ 超过85个框架类的JNI组件</li><li><code>frameworks/base/services/jni</code>：<b>libandroid_servers.so</b>（各Android服务的JNI支持）</li><li><code>frameworks/base/native/android</code>：<b>libandroid.so</b>（assets、存储管理器等的原生接口）</li><li><code>base/libs</code>：<b>libandroidfw.so</b>（zip解析、asset管理）、<b>libhwui.so</b>（经OpenGL和SKIA的硬件加速UI渲染）</li><li><code>av目录</code>：摄像头HAL库、DRM框架库、多媒体库（libmedia.so、libstagefright.so等）</li><li><code>native/libs</code>：libbinder、libgui、libinput、libui；native/opengl/存放EGL和OpenGL ES库</li></ul>","tags":"第1章;Android与Linux;原生库"},{"chapter":"第1章","front":"什么是HAL（硬件抽象层）？其机制和库文件位置是怎样的？","back":"HAL的目标是定义<b>转换层，使对不同硬件的操作标准化</b>——Android要运行在手机/平板/机顶盒等差异极大的设备上。<br>机制：厂商可在内核态自由使用自己的驱动，但必须提供<b>接口库（shim）</b>以Android（特别是Dalvik）预期的方式对接；接口库放在<code>/system/lib/hw</code>，由<b>libhardware.so</b>自动加载。HAL定义了Android视角下摄像头、GPS、传感器等硬件\"应该是什么样子\"，但不妨碍厂商扩展硬件功能。<br>例（Galaxy S5高通MSM8974）：camera.msm8974.so、gps.default.so、gralloc.msm8974.so（图形内存分配器）、hwcomposer.msm8974.so（硬件加速画面合成）等。","tags":"第1章;Android与Linux;HAL;概念"},{"chapter":"第1章","front":"AOSP部署后第三方原生库放在哪里？列举几个源自其他项目的重要原生库。","back":"AOSP源码树使用超过<b>150个</b>来自其他项目的原生库；部署后统一放<code>/system/lib</code>，厂商库按规定应在<code>/vendor/lib</code>。代表：<ul><li><b>bluetooth</b>（Bluedroid栈libbluedroid.so）</li><li><b>icu4c</b>（Unicode与国际化）</li><li><b>mdnsresponder</b>（苹果Bonjour多播DNS）</li><li><b>libselinux/libsepol</b>（SELinux，JellyBean起）</li><li><b>skia</b>（2D图形库）、<b>sqlite</b>（SQLite3数据库）</li><li><b>SVOX</b>（Pico文字转语音）、<b>tinyalsa</b>（ALSA声音库）</li><li><b>webkit</b>（WebView控件核心）、<b>zlib</b>（gzip压缩/解压）</li></ul>","tags":"第1章;Android与Linux;原生库"},{"chapter":"第1章","front":"Android Wear与手机/平板版Android有什么差异？","back":"<ul><li>专为可穿戴设备（手表）优化，fingerprint属性中标记为\"<b>clockwork</b>\"</li><li>核心代码一致，但home activity替换为简单接口：语音命令输入（重点）、通知和提示卡；部分设备支持圆形屏幕</li><li>精简：删除通话相关服务及print、appwidget、backup、usb、wallpaper、device_policy、drmManager；预装应用从180MB精简到12MB以内（16个包）</li><li>定位为手机/平板的<b>辅助设备</b>：唯一连接途径是蓝牙，多数框架只是stub，转发到手机端完整框架执行</li></ul>三星先在Galaxy Gear上采用，后因电池续航差转用自研Tizen系统。","tags":"第1章;衍生产品;Wear"},{"chapter":"第1章","front":"Android Auto对开发者的关键要求是什么？","back":"在苹果宣布CarPlay后不久宣布，重点是<b>语音命令和通知</b>（解放双手）。开发者要点：<ul><li>无需开发车载专用UI——内置系统UI以\"<b>drawers</b>\"菜单形式对接App功能；App只能替换图标/背景，<b>不能显示定制view</b></li><li>需声明XML文件（<b>automotiveApp</b>元素，当前只支持media和notification两种特性），在AndroidManifest.xml的<b>meta-data</b>元素中指定</li></ul>","tags":"第1章;衍生产品;Auto"},{"chapter":"第1章","front":"Android TV与普通Android有什么差异？TvProvider导出了哪些URI？","back":"谷歌第二次进军电视市场（第一次是逊于Apple TV的Google TV），与Lollipop一同宣布。差异：<ul><li>launcher换为<b>LeanbackLauncher.apk</b></li><li>内置TV应用（TV.apk）</li><li>TV Content provider（<b>TvProvider.apk</b>）</li></ul>TvProvider导出<b>android.media.tv</b>的URI到input（远程控制）、channel、program、watched_program（provider数据库中的三张表）。","tags":"第1章;衍生产品;TV"},{"chapter":"第1章","front":"什么是CTS（兼容性测试工具集）？谷歌如何用它控制Android生态？","back":"CTS位于AOSP的<code>cts/</code>子树。厂商改装Android系统<b>必须通过CTS</b>才能获得谷歌官方背书。进入生态系统的代价是<b>绑定预装全套谷歌应用</b>。常规定制还包括UI增强/精简（如HTC Sense、三星TouchWiz）和新设备类型（英伟达Shield console）；大幅修改的例子是小米——自建生态系统抛弃谷歌服务（谷歌因此损失至少一个亿用户）。","tags":"第1章;衍生产品;CTS;概念"},{"chapter":"第1章","front":"亚马逊FireOS对Android做了哪些激进修改？","back":"Kindle产品线从Kindle Fire起完全定制Android并改称\"FireOS\"：<ul><li>UI完全改装（\"旋转木马\"方式选App），launcher换成com.amazon.kindle.otter</li><li>Boot Loader加锁，只接受亚马逊指令</li><li>谷歌痕迹（搜索、Play商店、谷歌账号）被连根拔除：默认浏览器改为<b>Silk</b>（com.amazon.cloud9，基于WebKit重度优化，利用亚马逊EC2加速）；Play商店换成亚马逊App商店</li><li>强制OTA升级：com.amazon.dcp含一系列服务，从不询问用户直接安装更新；借鉴苹果做法：锁定OS防root、安装更新后阻止降级回旧版</li><li>还发布了Fire Phone和Fire TV</li></ul>","tags":"第1章;衍生产品;FireOS"},{"chapter":"第1章","front":"\"不带UI的Android\"是什么？它的历史意义是什么？","back":"去掉Dalvik及配套框架后的Android——一个无GUI、不进生态的<b>纯嵌入式Linux系统</b>（可直接跑在ARM和MIPS上）。历史意义：<b>打破了嵌入式Linux市场\"授权证书动辄几十万美元\"的格局</b>。现已成为传感器、智能家电等无GUI系统的基础，可能在物联网（IoT）革命中扮演主要角色。","tags":"第1章;衍生产品;嵌入式"},{"chapter":"第1章","front":"Android移植64位为什么是漫长过程？哪些设备坐实了64位的工业标准地位？","back":"背景是iPhone 5S首发64位移动处理器。64位主要优势（大于4GB寻址）在移动端起初有争议，但ARMv8原生64位指令集为效率完全重写且寄存器更宽更多，性能优势凸显（多核反而增加功耗，苹果A9双核仍碾压业界）。<br>Android的<b>核心部件（特别是Dalvik和Bionic）都为32位优化，需完全重写</b>（App不用重新编译就能跑在64位系统上）；且Linux内核<b>3.7才支持ARM64(AArch64)</b>。硬件时间线：Intel最快；HTC Nexus 9搭载第一块64位ARM处理器（英伟达Tegra K1）；高通晓龙810；谷歌<b>Nexus 5X和6P</b>坐实64位工业标准地位。","tags":"第1章;未来方向;64位"},{"chapter":"第1章","front":"ART出现的根本原因和方案是什么？实际效果如何评估？","back":"根本原因：Android电源管理逊于iOS——Linux为台式机/服务器设计不考虑电源，加上过细分层；Dalvik即使有JIT优化仍比直接执行原生代码多执行大量操作。<br>ART方案：通过<b>AOT（预编译）</b>得到媲美iOS的性能，KitKat中以\"实验版\"悄悄引入。<br>现实评估：早期ART相对Dalvik仅约<b>10%～20%</b>的电源及性能优势；从Lollipop起成为默认运行时，并在Android支持64位过程中发挥关键作用。","tags":"第1章;未来方向;ART"},{"chapter":"第1章","front":"Android多画面/多窗口的本质是什么？把Android用作台式机OS的可行性和障碍是什么？","back":"多画面支持同时运行多个activity并同屏显示。本质是<b>纯框架级特性</b>——从Linux角度看无实质变化：每个activity就是一个进程，进程天然可并发。它是把Android扩展为完整台式机OS的主要步骤。<br>台式机化：类比微软Windows 8统一台式机与移动，Android需反向转变。可行性：Dalvik开源可移植性很高，在Windows、OSX甚至iOS上都有实现。障碍：桌面应用构建在<b>X-Windows</b>上难以直接运行；需扩展支持<b>鼠标和多窗口</b>；最大障碍是<b>谷歌自家的ChromeOS</b>。","tags":"第1章;未来方向;多窗口;台式机"},{"chapter":"第1章","front":"什么是Project ARA（模块化手机）？它的结局如何？","back":"谷歌\"<b>完全模块化智能手机</b>\"项目：所有组件（CPU、显示屏、存储器）都可互换（类似PC装机）。<ul><li>来历：源自被收购的摩托罗拉移动的<b>ATAP</b>（高级技术和项目部门）</li><li>构想：设备=底架（骨架）+组件（模块），用电控永久磁铁吸合，理论上所有组件可热插拔；结合3D打印可能产生\"可打印手机\"</li><li>代价：需大改框架层、Linux层甚至内核；谷歌已与Linaro合作开发标准化模块</li><li>结局：<b>2016年9月路透社报道项目已被暂停</b></li></ul>","tags":"第1章;未来方向;ARA"},{"chapter":"第1章","front":"什么是Brillo？它与Weave的关系是什么？","back":"Brillo是谷歌进军物联网（IoT）世界的项目（谷歌通过收购<b>Nest</b>杀入该领域）。形态：免费的<b>嵌入式操作系统</b>，类似\"不带UI的Android\"概念；提供BSP（开发板支持套件）使其能跑在任何主板上。特点：开发环境与Android类似；简化OTA升级；专用通信层\"<b>Weave</b>\"把所有设备捆绑起来协同工作。","tags":"第1章;未来方向;Brillo;IoT"},{"chapter":"第2章","front":"为什么Android设备的广告容量与实际可用容量不符？","back":"两个原因：<b>①GB定义差异</b>——厂商按十进制1GB=10⁹字节计算，而二进制1GB=1,073,741,824字节，蒸发约7%；<b>②分区占用</b>——闪存被划分为大量分区（如Kindle Fire、Nexus 5有25个以上，HTC One M8多达48个），Android只使用其中约5个分区，剩余空间被\"吃掉\"。","tags":"第2章;分区"},{"chapter":"第2章","front":"用户在Android设备上唯一能写数据的分区是哪个？","back":"<b>/data分区</b>（userdata）。正常使用中大部分分区甚至不会被mount。","tags":"第2章;分区"},{"chapter":"第2章","front":"移动设备必须划分许多单独分区的核心需求是什么？","back":"设备必须总是<b>\"可修理的\"（repairable）</b>——必须支持recovery模式，能从一个已知\"安全\"的OS拷贝启动以还原或升级系统。有些设备甚至有多个内容完全相同的boot loader拷贝保证可启动性；modem等固件组件及boot loader本身也需要独立存储空间存放配置和镜像。","tags":"第2章;分区"},{"chapter":"第2章","front":"术语提示：GPT（GUID分区表）","back":"取代MBR的新一代分区表方案。<b>MBR并未完全抛弃</b>——磁盘第一个扇区仍有一个\"伪\"MBR，第二个扇区记录GPT头。Linux内核能识别GPT分区，并通过<b>/proc/partitions</b>导出到用户空间。GPT位于所有分区之外，用户态一般访问不到，需root后复制开头几个扇区分析。","tags":"第2章;概念;GPT"},{"chapter":"第2章","front":"adb通常只有shell权限，读取GPT所在扇区的三种方式是什么？各有什么风险？","back":"<b>①</b>以root权限运行adbd——手机落入坏人之手毫无抵抗；<b>②</b>以root运行dd把块设备复制到/data/local/tmp再chmod——if=/of=搞错会瞬间删除全部分区；<b>③</b>直接对块设备节点chmod——使恶意应用可访问受保护数据。作者推荐<b>第三种</b>：完全可逆、只提供读权限。","tags":"第2章;实验;GPT"},{"chapter":"第2章","front":"MTD与eMMC的关键区别是什么？","back":"<b>MTD（Memory Technology Devices）</b>是raw flash之上的抽象层；<b>MMC/eMMC</b>自带<b>FTL（Flash Translation Layer，闪存转换层）</b>，在内核中表现为块设备。新款设备多用MMC/eMMC，因为与基于块的文件系统（如ext4）配合更好。用户态映射分别通过/proc/mtd、/proc/emmc及标准的/proc/partitions。","tags":"第2章;概念;闪存"},{"chapter":"第2章","front":"Android设备上ext4的使用情况和特点？","back":"eMMC/MMC设备上普遍使用ext4（从<b>GingerBread</b>起替换旧的YAFFS）。ext4自Linux 2.6.27起是Linux默认文件系统，经过良好测试，但<b>并非专为闪存优化</b>。Android对文件系统无硬性规定。","tags":"第2章;文件系统"},{"chapter":"第2章","front":"术语提示：F2FS","back":"<b>Flash Friendly File System</b>，三星设计的<b>日志结构（log-structured）</b>文件系统，专为NAND闪存优化，随机写性能优于ext4。Moto X的data分区、Nexus设备默认采用；自<b>Linux 3.8</b>进入内核主线。","tags":"第2章;概念;文件系统"},{"chapter":"第2章","front":"文件系统损坏多发生于什么情况？各文件系统的修复工具是什么？","back":"多发生于<b>非正常关机</b>（没电、崩溃）或硬件出错。修复工具：<b>e2fsck</b>（ext）、<b>fsck_msdos</b>（vFAT）、<b>fsck.f2fs</b>，由<b>init或vold</b>在mount时自动执行。内核可识别的所有文件系统可由/proc/filesystems列出。","tags":"第2章;文件系统"},{"chapter":"第2章","front":"/proc/partitions中mmcblk0p1这样的名字及major/minor列的含义是什么？分区符号名称位于哪里？","back":"MMC/eMMC设备显示为<b>\"mmcblk#[p#]\"</b>格式：设备号从0起、分区号从1起；块大小512字节。<b>major</b>是内核块设备表中的驱动索引号，<b>minor</b>是逻辑设备索引号。分区符号名称（by-name/by-num）位于<b>/dev/block/platform/名称.#</b>目录，高通平台<b>msm_sdcc.1</b>即主存储器；NVIDIA/OMAP设备不遵循MSM约定。","tags":"第2章;实验;mount"},{"chapter":"第2章","front":"boot分区和recovery分区分别存放什么？为什么不能普通mount？","back":"<b>boot</b>：默认启动所需的<b>内核+initramfs</b>；<b>recovery</b>：启动到recovery模式所需的内核+initramfs。二者均用Android专用的<b>bootimg格式</b>格式化，属于设计上不可普通mount的分区（由boot ROM/加载器直接使用）。","tags":"第2章;分区"},{"chapter":"第2章","front":"cache分区的用途是什么？","back":"<b>/cache分区</b>（ext4），主要用于<b>系统升级</b>：OTA升级包下载至此；boot manager（尤其recovery/升级模式）使用；正常情况下为空。recovery二进制和系统（android.os.RecoverySystem类）通过此分区交换信息。","tags":"第2章;分区"},{"chapter":"第2章","front":"Android的mount表位于哪里？由谁在启动时加载？","back":"位于<b>/system/etc/vold.fstab</b>或更高版本的<b>/fstab.&lt;hardware&gt;</b>，由<b>vold（卷守护进程）</b>在启动时加载。标准Android分区硬编码到系统源码树各处，构成操作系统核心（core），基本都可mount。","tags":"第2章;分区;mount"},{"chapter":"第2章","front":"高通MSM芯片组的aboot、modem、modemst1/2、rpm、sbl1/2/3、tz分区分别是什么？","back":"<ul><li><b>aboot（bootldr）</b>：Application Processor Boot，含Android启动加载器，有些设备用定制的（如HTC的HBoot）替换</li><li><b>modem（MS-DOS格式）</b>：支持modem正常工作的ELF格式二进制和数据文件</li><li><b>modemst1/2（专用FS）</b>：modem的非易失数据</li><li><b>rpm（ELF 32位）</b>：Resource Power Management，提供第一阶段启动加载器</li><li><b>sbl1/2/3（专用FS）</b>：次级Boot Loader，由boot ROM加载后去加载Boot Loader</li><li><b>tz（ELF 32位）</b>：ARM TrustZone（可信区域）</li></ul>","tags":"第2章;分区"},{"chapter":"第2章","front":"列举几个厂商专用分区及其用途（表2-3）。","back":"<ul><li><b>hboot（HTC）</b>：HTC专用启动加载器，替换aboot</li><li><b>efs（三星）</b>：逻辑文件系统，含多个ini文件</li><li><b>ssd（三星）</b>：软件安全下载（Secure Software Download）</li><li><b>fota（三星）</b>：Firmware-Over-The-Air，手机升级时使用</li><li><b>grow（三星、LG）</b>：空分区，用于扩展分区容量</li><li><b>laf（LG G2/Nexus5）</b>：含刷机用的lafd（LG Advanced Flash Daemon）的bootimg</li><li><b>imgdata（LG）</b>：RLE格式的IMG DATA镜像</li></ul>XDA-Developers维护的\"El Grande Partition Table Reference\"收录各设备分区映射。","tags":"第2章;分区"},{"chapter":"第2章","front":"如何用df和mount命令观察已mount的分区？如何识别伪文件系统？","back":"<b>df</b>：显示各已mount分区的使用统计（如/system、/data、/cache、/mnt/asec、/mnt/obb等）；<b>mount</b>：显示更详细信息（含内存中的伪文件系统及mount参数）。<b>伪文件系统第一列不以/dev开头</b>，可借此识别。","tags":"第2章;实验;mount"},{"chapter":"第2章","front":"解释mount参数：ro、rw、nosuid、noatime、seclabel","back":"<b>ro</b>：只读；<b>rw</b>：读写；<b>nosuid</b>：忽略SetUID权限位；<b>noatime</b>：不记录访问时间（加速并降低写入）；<b>seclabel</b>：启用SELinux标签。另有acl（扩展访问控制列表）、relatime。","tags":"第2章;mount"},{"chapter":"第2章","front":"解释ext3/4的data=ordered与data=journal、errors=参数，以及f2fs的background_gc","back":"<b>data=ordered</b>：数据先写入再提交日志；<b>data=journal</b>：数据先提交日志再写入；<b>errors=</b>：出错时continue/remount-ro/panic三种策略；<b>background_gc（f2fs）</b>：内核线程回收已删除文件占用的空间。","tags":"第2章;mount"},{"chapter":"第2章","front":"Android的root文件系统从哪里来？与一般Linux有何不同？","back":"root文件系统（/）mount自<b>RAM Disk（initramfs）</b>：启动加载器从boot分区加载镜像到内存交给内核。<b>与一般Linux不同</b>：普通Linux用initramfs加载驱动后即丢弃，而Android的initramfs<b>常驻内存充当root文件系统</b>。其中含最重要的组件/init——能以root权限执行任何操作、控制系统启动过程，故root文件系统不可修改（除非刷机）。","tags":"第2章;root文件系统"},{"chapter":"第2章","front":"root文件系统（表2-5）中有哪些重要内容？","back":"<ul><li><b>init</b>：内核以PID 1执行的二进制</li><li><b>default.prop</b>：编译时默认属性，init据此加载其他属性文件（利于安全保护）</li><li><b>init[...].rc</b>：/init的配置文件，主文件init.rc，厂商可提供额外rc文件</li><li><b>sbin/</b>：含adbd、healthd、recovery等关键二进制（即使不能mount /system也能进recovery），为静态链接</li><li><b>file_contexts / property_contexts / seapp_contexts</b>（KitKat）：SE-Linux文件/属性/应用context</li><li><b>sepolicy</b>：SELinux策略编译结果</li><li><b>verity_key</b>（Android L）：认证/system分区的DM-Verity RSA密钥</li></ul>","tags":"第2章;root文件系统;SELinux"},{"chapter":"第2章","front":"/system分区的权限和mount方式是什么？只读mount的两大目的是什么？","back":"/system属<b>root:root，权限0755(rwxr-xr-x)</b>，以<b>只读</b>方式mount。两大目的：<b>①稳定性</b>——断电也不损坏，降低变砖风险；<b>②安全性</b>——防止系统组件被恶意修改（但重新mount成rw即可绕过）。HTC用闪存分区写保护（S-OFF的反面）保证只读；KitKat起谷歌改用内核<b>dm-verity</b>特性保护/system完整性。","tags":"第2章;system"},{"chapter":"第2章","front":"/system分区下的主要目录/文件有哪些？（表2-6）","back":"<ul><li><b>app/</b>：系统应用（谷歌预装+厂商/运营商App）</li><li><b>bin/</b>：二进制可执行文件</li><li><b>build.prop</b>：编译生成的属性文件，init启动时加载</li><li><b>etc/</b>：配置文件（是/etc的符号链接）</li><li><b>fonts/</b>：.ttf字体</li><li><b>framework/</b>：框架.jar文件（dex优化后存为同名.odex）</li><li><b>lib/</b>：运行时库（.so）</li><li><b>lost+found/</b>：fsck自动生成，通常为空</li><li><b>media/</b>：铃声/提示音/.ogg</li><li><b>priv-app/</b>：特权应用</li><li><b>usr/</b>：unicode映射、键盘布局等</li><li><b>vendor/</b>：厂商文件</li><li><b>xbin/</b>：特殊用途二进制，root程序的su也放这里</li></ul>","tags":"第2章;system"},{"chapter":"第2章","front":"/system/bin中的二进制可执行文件分为哪5类？","back":"<b>①服务类</b>：由init经rc文件调用；<b>②调试工具</b>：adb、dumpsys、logcat等；<b>③UNIX命令</b>：封装在<b>toolbox</b>中；<b>④调用Dalvik的脚本（upcall script）</b>：让shell与Dalvik框架交互；<b>⑤厂商定制二进制</b>：闭源，可能含漏洞（如qseecomd、HTC dmagent被WeakSauce利用）。","tags":"第2章;system"},{"chapter":"第2章","front":"解释服务类二进制：app_process、linker、vold、surfaceflinger、rild、debuggerd、sdcard、uncrypt","back":"<b>app_process</b>：用户App宿主，Zygote的实体；<b>linker</b>：运行时链接器，损坏即变砖；<b>vold</b>：mount/unmount文件系统+解密；<b>surfaceflinger</b>：绘制图形界面到framebuffer；<b>rild</b>：Radio Interface Layer，电话相关服务；<b>debuggerd</b>：崩溃时产生tombstone；<b>sdcard</b>：SD卡文件系统，FUSE模拟多用户权限；<b>uncrypt</b>：recovery前解密文件系统。其他：mediaserver（音视频）、keystore（密钥管理）、servicemanager（服务注册/查找）、netd（网卡/防火墙）、wpa_supplicant（Wi-Fi客户端）。","tags":"第2章;system"},{"chapter":"第2章","front":"什么是upcall script？举几个例子及其用途。","back":"<b>调用Dalvik的脚本</b>，让shell与Dalvik框架交互：内容基本同源，调用<b>app_process</b>加载/system/framework中同名JAR框架。例：<b>am</b>（ActivityManager，启动activity/intent）、<b>pm</b>（包管理：列出/安装/删除/权限）、<b>settings</b>（系统设置）、<b>wm</b>（WindowManager，改显示尺寸/分辨率）、<b>monkey</b>（随机输入测试APK）、<b>uiautomator</b>（UI自动化测试）。注意：app_process直接启动Dalvik比从Zygote fork慢得多。","tags":"第2章;system"},{"chapter":"第2章","front":"列举几个重要的调试类二进制及其用途。","back":"<b>dumpstate</b>：抓系统状态快照；<b>dumpsys</b>：连接各服务调用Dump()；<b>logcat</b>：打印日志（可adb logcat）；<b>screenrecord</b>：mp4录屏；<b>dex2oat</b>：DEX→ART编译，取代dexopt；<b>run-as</b>：以指定UID运行应用；<b>blkid</b>：显示分区GUID；<b>vdc/ndc</b>：分别与vold/netd交互；<b>e2fsck/fsck_msdos/fsck.f2fs</b>：文件系统修复。","tags":"第2章;system"},{"chapter":"第2章","front":"/system/xbin是什么？列举几个取证/逆向必备工具。","back":"类似UNIX的/sbin，含管理员有用工具，从AOSP的system/extras编译而来，是否出现取决于厂商。精选工具：<b>sqlite3</b>（调试与取证必备）、<b>strace</b>（ptrace系统调用跟踪，逆向利器）、<b>tcpdump</b>（配合Wireshark）、<b>procrank</b>（逐进程内存统计）、<b>su</b>（切换用户）、<b>rawbu</b>（底层备份/恢复/data）、<b>cpueater</b>（死循环吃满CPU）。可用adb pull/push在模拟器与真机间搬运工具（需同Android版本及补齐依赖库）。","tags":"第2章;system"},{"chapter":"第2章","front":"/system/lib[64]的结构特点？Intel设备的arm/子目录是干什么的？","back":"存放供bin和xbin使用的共享库（.so，ELF shared object），64位设备为lib64。常见子目录：<b>drm/</b>（DRM引擎）、<b>egl/</b>（Android版OpenGLES）、<b>hw/</b>（HAL模块）、<b>ssl/engines/</b>（libkeystore.so）。Intel设备的<b>arm/</b>子目录是ARM库拷贝，供<b>Houdini二进制转换层</b>运行ARM二进制。几乎所有Android二进制都是动态链接；例外：<b>/sbin中的二进制</b>（静态链接），故/system未mount时也能使用。","tags":"第2章;system"},{"chapter":"第2章","front":"/system/etc中有哪些重要配置文件？","back":"<b>apns-conf.xml</b>（运营商APN配置）、<b>media_codecs.xml</b>（StageFright支持的codec）、<b>media_profiles.xml</b>（编码profile）、<b>audio_effects.conf与audio_policy.conf</b>（音频HAL）、<b>security/</b>（cacerts/硬编码认证证书目录、otacerts.zip升级证书）、<b>permissions/</b>（各内置应用权限XML）、<b>wifi/</b>（WPA supplicant配置）、<b>hosts</b>、<b>gps.conf</b>、字体映射（fallback_fonts.xml、system_fonts.xml）。注意/etc是/system/etc的符号链接（保持AOSP外部项目兼容性）；高通MSM设备还有*.acdb（声音校准数据库）、thermal*.conf等。","tags":"第2章;system"},{"chapter":"第2章","front":"/data单独分区的三大好处是什么？为什么/data以nosuid mount？","back":"<b>①与OS低耦合</b>：升级/恢复只擦写/system不影响用户数据；格式化/data即快速重置设备（\"恢复出厂设置\"的实质）；<b>②可加密</b>：/data可整体加密，而/system设计上无敏感数据无需加密，规避加密读写延迟；<b>③可设为不可执行</b>（noexec mount或SELinux强制）：恶意软件失去\"可写又可执行\"的分区。<b>nosuid mount</b>：即使拿到root，su二进制也必须放进只读的/system——<b>纵深防御</b>的实例。/data目录权限为<b>chmod 771 system system</b>：目录可执行（可cd进入）但不可读（不能ls列举），KitKat起通过SELinux标签实现，遍历需root。","tags":"第2章;data"},{"chapter":"第2章","front":"/data分区下的重要目录及其用途（表2-14）？","back":"<ul><li><b>anr</b>：dumpstate记录失去响应应用的函数调用栈</li><li><b>app</b>：用户自装应用，.apk文件所在</li><li><b>app-asec</b>：asec容器（应用被加密入容器）</li><li><b>app-lib</b>：应用的JNI库</li><li><b>dalvik-cache</b>：优化过的classes.dex（文件名=apk路径以\"@\"替换分隔符）</li><li><b>data</b>：各应用数据目录（逆DNS格式命名）</li><li><b>local</b>：uid shell可读写的临时目录</li><li><b>media</b>：sdcard服务把SD卡mount到此（如/data/media/0）</li><li><b>misc</b>：各子系统杂项数据与配置</li><li><b>property</b>：持久性属性，每属性一个文件，文件名即属性名</li><li><b>system</b>：大量系统配置文件</li><li><b>tombstones</b>：debuggerd生成的崩溃报告</li><li><b>user</b>：多用户支持（/data/user/用户号/，单用户时/data/data指向/data/user/0）</li></ul>","tags":"第2章;data"},{"chapter":"第2章","front":"/data/data是什么？为什么是取证重点？权限如何？","back":"所有应用（系统+用户）<b>存储信息的唯一可写之处</b>；每应用一个逆DNS格式子目录。子目录权限<b>chmod 751</b>；文件级防护由应用自己完成。加上GPS定位、收发短信、打电话等应用普及，此目录是<b>电子取证的重点目标</b>。","tags":"第2章;data;取证"},{"chapter":"第2章","front":"列举取证中有价值的应用数据库文件（表2-15）。","back":"<ul><li><b>com.android.providers.contacts</b>：databases/contacts2.db（contacts联系人表、calls通话记录表；含头像thumbnail_photo_*.png）</li><li><b>com.android.providers.telephony</b>：databases/mmssms.db（彩信MMS/短信SMS）</li><li><b>com.android.providers.settings</b>：databases/settings.db（框架运行时设置，global和secure表）</li><li><b>com.android.providers.calendar</b>：databases/calendar.db</li><li><b>com.google.android.gm</b>：databases/mailstore.email.db（已下载邮件）</li><li><b>com.android.chrome</b>：History（urls表上网历史）、Login Data（logins表用户名-密码）、Cookies</li></ul>","tags":"第2章;data;取证"},{"chapter":"第2章","front":"不root/不解锁设备如何提取/data/data中应用的文件？","back":"利用<b>adb backup</b>发起备份：BackupManagerService以<b>system权限</b>读取/data/data任意文件，在电脑上生成<b>.ab文件</b>后可提取。root设备上则可用sqlite3直接查询。","tags":"第2章;取证;实验"},{"chapter":"第2章","front":"/data/misc中哪些文件在取证/安全上最重要？（表2-16）","back":"<ul><li><b>adb/</b>：Jelly Bean起存可信ADB连接电脑的公钥</li><li><b>keystore/</b>：每用户keystore数据</li><li><b>keychain/</b>：证书pin码和黑名单</li><li><b>systemkeys/</b>：打开ASEC容器的密钥AppsOnSD.sks</li><li><b>sms/</b>：短信codes数据库</li><li><b>wifi/</b>：wpa_supplicant.conf等配置</li><li><b>vpn/</b>：VPN状态配置；<b>dhcp/</b>：dhcpcd的PID文件与地址租约；<b>bluetooth/与bluedroid/</b>：蓝牙配置</li></ul>","tags":"第2章;data"},{"chapter":"第2章","front":"/data/system中有哪些维护设备状态的重要文件？（表2-17）","back":"访问权限限制为<b>system:system</b>（未root看不到）。重要文件：<b>gesture.key</b>（锁屏图案Hash）、<b>password.key</b>（锁屏PIN/口令Hash）、<b>locksettings.db</b>（锁屏策略）、<b>packages.list与packages.xml</b>（所有已安装包元数据）、<b>device_policies.xml</b>（DevicePolicyManagerService）、<b>entropy.dat</b>（系统熵存储）、<b>batterystats.bin</b>（电量统计）、<b>dropbox/</b>（DropBox服务）、<b>usagestats/</b>（使用统计）、<b>users/</b>（多用户支持）、<b>appops.xml</b>（AppOps权限控制）。","tags":"第2章;data"},{"chapter":"第2章","front":"recovery与系统通过/cache交换什么信息？（表2-18）","back":"<b>COMMAND_FILE=/cache/recovery/command</b>：传给recovery的命令行参数；<b>CACHE_LOG_DIR=/cache/recovery</b>：recovery专用目录；<b>LOG_FILE=log</b>：当前日志；<b>LAST_LOG_FILE=last_log</b>：上次日志；<b>INTENT_FILE=intent</b>：recovery完成后要发的intent；<b>LAST_LOCALE_FILE=last_locale</b>：重启时语言设置。","tags":"第2章;分区"},{"chapter":"第2章","front":"/vendor目录的作用是什么？系统组件如何使用它？","back":"存储<b>厂商对Android系统的修改</b>，便于升级时保留；系统组件会<b>先检查写死的/vendor路径，再查/system</b>（表2-19）：PackageManager查/vendor/app、共享库查/vendor/lib、DRM库查/vendor/lib/drm与mediadrm、EGL库查/vendor/lib/egl、框架查/vendor/overlay/framework、固件查/vendor/firmware、字体查/vendor/etc/fallback_fonts.xml。内容因厂商差异极大；也有厂商完全忽略/vendor直接改/system（预装App最常见），导致删除厂商预装软件困难。Android L（Nexus 9）暗示未来可能为/vendor提供单独分区。","tags":"第2章;system"},{"chapter":"第2章","front":"Android的SD卡支持如何解决vFAT无权限的问题？FUSE的原理和SD卡标准目录是什么？","back":"SD卡多格式化为vFAT/FAT32，<b>不支持权限概念</b>。Android通过<b>FUSE（用户态文件系统）</b>模拟SD卡，解决权限强制及多用户支持。FUSE原理：<b>F=File system、USE=user mode</b>——内核装小模块与VFS对接，真正文件系统在用户态进程<b>/system/bin/sdcard</b>中实现。mount点最新为/storage/ext_sd；无SD卡设备指向/data分区目录（一般是/data/media/0）。标准目录（android.os.Environment常量）：Alarms/、Android/、DCIM/、Documents/、Download/、Movies/、Music/、Notifications/、Pictures/、Playlists/、Podcasts/、Ringtones/。","tags":"第2章;文件系统;FUSE"},{"chapter":"第2章","front":"术语提示：OBB（Opaque Binary Blobs）","back":"谷歌商店限制APK最大50MB，OBB自<b>GingerBread（Android 2.3）</b>起支持，可把多个多媒体文件存入一个OBB文件（可选加密），为应用提供最多<b>2GB额外数据</b>。\"Opaque\"指数据格式由开发者决定；很多时候它就是个vFAT文件系统镜像，由vold调用内核<b>device mapper以loop参数</b>mount（把文件视为\"回环设备\"）。<b>元数据在文件尾部</b>（解析时先跳到尾部倒着解析），含魔数0x01509983等字段，支持代码在/system/lib/libandroidfw.so（ObbFile.cpp）。工具：AOSP的obbtool、SDK的jobb、ObbScanner类、vdc命令。应用发起mount的调用链：android.os.StorageManager.mountObb(rawPath, key, listener)→经Binder到system_server的MountService→通过/dev/socket/vold调vold→vold调内核device mapper。","tags":"第2章;概念;OBB"},{"chapter":"第2章","front":"术语提示：Asec（Android Secure Storage）","back":"提供应用安全安装机制，实现<b>forward-locking（预先锁定）</b>：合理前提下用户无法把应用拷到另一台设备；通过asec容器应用可安装到任何地方（含SD卡）。自<b>Froyo（Android 2.2）</b>起支持——第一个支持SD卡等扩展存储的Android版本。容器本质：由固定文件头<b>asec_superblock</b>起始的加密文件系统镜像（定义在system/vold/asec.h），头部含魔数<b>0xC0DEFO0D</b>、版本号、加密算法（1=TwoFish, 2=AES）、Chainmode、options（1=Ext4）。与OBB同源：都用device mapper及dm-crypt，asec可视为OBB的逻辑升级版（从加密存储应用的扩展文件升级到加密存储整个应用）。","tags":"第2章;概念;ASEC"},{"chapter":"第2章","front":"asec的密钥如何管理？为什么rooted设备上asec保护形同虚设？","back":"密钥存在系统keystore（<b>/data/system/misc/systemkeys</b>，即AppsOnSD.sks），采用<b>128位BlowFish</b>，<b>明文存放但仅root可读</b>——因此rooted设备上asec保护形同虚设。mount时vold用device mapper以loop参数mount，通过<b>DM_TABLE_LOAD ioctl</b>把密钥传给内核dm-crypt模块。可用df查看已mount的asec，vdc列详细信息。该机制可扩展到整个文件系统级（即Android全盘加密）。","tags":"第2章;ASEC;取证"},{"chapter":"第2章","front":"Linux伪文件系统的本质和共同特性是什么？","back":"<b>不存储在物理设备上，由内核回调函数维护</b>——访问文件/目录即调用对应内核处理函数，不占存储空间。特性：<b>①</b>每次访问都是实时最新数据；<b>②</b>ls -l看到的文件大小为0；<b>③</b>文件内容与内核版本及硬件紧密相关。大多只读（提供实时诊断信息）；有些可写——用户态可实时修改内核数据、立即生效且无需重启（Android init.rc脚本的重要功能之一）。","tags":"第2章;伪文件系统"},{"chapter":"第2章","front":"cgroupfs和cgroups在Android中如何使用？","back":"<b>cgroups（control groups）</b>是Linux资源控制机制：一个cgroup是可容纳一个或多个线程的组容器，把组内线程视为整体统一操作和设策略；对伪文件\"写\"即可把线程加入组。Android中用法非常受限：只用于<b>CPU使用记时和线程调度</b>。相关mount点（Nexus 5）：<b>/acct</b>（cpuacct）、<b>/sys/fs/cgroup</b>（tmpfs）、<b>/dev/cpuctl</b>（cpu），后者由init创建子目录：tasks（系统任务）、apps/tasks（前台应用）、apps/bg_non_interactive/tasks（后台应用）。每组分配cpu.shares（系统1024、前台1024、后台52）和cpu.rt_runtime_us/cpu.rt_period_us，配置在/init.rc中完成。","tags":"第2章;伪文件系统"},{"chapter":"第2章","front":"debugfs是什么？有哪些常见的文件/目录？","back":"用于输出<b>内核级调试信息</b>的伪文件系统，驱动及子系统可自由把调试信息转储其中。用<code>mount -t debugfs none /sys/kernel/debug</code>挂载（通常在/init.hardware.rc执行）。内容完全由内核版本及实现的debug特性决定。常见：<b>binder/</b>（Android IPC机制binder传递的大量数据）、<b>tracing/</b>（Linux ftrace机制产生的海量调试/跟踪信息）、<b>wakeup_sources</b>（内核级定时器，用于防止设备休眠）。","tags":"第2章;伪文件系统"},{"chapter":"第2章","front":"functionfs是什么？与sysfs是什么关系？","back":"USB功能常需按用户选择（USB调试、大容量存储等）动态重配置，由\"gadget\"驱动控制。Android L之前通过sysfs导出重配置参数——被认为臃肿。functionfs于2010年前后引入内核：通用文件系统让驱动<b>获取用户态发来的配置修改请求</b>——与sysfs互补（<b>sysfs向用户态输出内核信息，functionfs从用户态获取输入</b>）。Android中对应<b>/dev/usb-ffs/adb</b>；root可用mkdir(2)创建目录引发内核创建内核对象，再通过write(2)写目录中的伪文件予以初始化。","tags":"第2章;伪文件系统"},{"chapter":"第2章","front":"procfs（/proc）的来源和作用？哪些工具依赖它？","back":"提供<b>基于目录的进程观察方式</b>，想法源自<b>Plan 9 OS</b>，Linux吸收改造后提供进程、线程及全方位系统诊断信息。极为重要：<b>top、netstat、lsof、ifconfig</b>等Linux实用程序及<b>procrank、librank</b>等Android工具都依赖它作为诊断信息来源。","tags":"第2章;伪文件系统"},{"chapter":"第2章","front":"pstore（/sys/fs/pstore）是什么？如何抓取内核崩溃数据？如何实验观察？","back":"Linux内核特性（<b>3.5版</b>引入）：把部分物理内存（RAM）划为<b>persistent store</b>区。核心用途：抓取内核崩溃（panic）时的数据——UNIX通常转储到swap但Android无swap；<b>热重启后物理内存信息不丢</b>，重启时内核检查persistent store，遗留数据经/sys/fs/pstore暴露给用户态。旧版Android用\"RAM console\"（/proc/apanic_console写到/data/dontpanic），pstore到来后已放弃。实验（Android L/内核≥3.10）：最近崩溃/重启过则mount点下有<b>console-ramoops</b>文件（存最近一次dmesg输出），属主组为system:log，adb shell可读取；冷启动后可能为空，可用<b>adb reboot</b>或向/proc/sysrq-trigger写\"b\"（非常危险）。","tags":"第2章;伪文件系统;实验"},{"chapter":"第2章","front":"selinuxfs（/sys/fs/selinux）中最重要的文件有哪些？","back":"专供SELinux使用，存储与已安装策略相关的文件。最重要的：<b>policy</b>（加载编译后的二进制格式安全策略）和伪文件<b>enable</b>（切换策略是否强制执行；getenforce/setenforce工具即通过它实现）。实验：cat /sys/fs/selinux/enforce返回0/1；<code>setenforce 0/1</code>切换Permissive/Enforcing。","tags":"第2章;伪文件系统;SELinux"},{"chapter":"第2章","front":"sysfs（/sys）是什么？有哪些主要子目录？如何用它实验驱动振动器？","back":"Linux 2.6引入，作为procfs的补充：把与<b>硬件和模块相关</b>的配置从/proc移出，目录层次更清晰。主要子目录：<b>block/</b>（块I/O层）、<b>bus/</b>（设备按总线类型：i2c、mmc、soc）、<b>class/</b>（设备按类型：input、sound）、<b>dev/</b>（按读写方式）、<b>devices/</b>（按设备树类型）、<b>firmware/</b>、<b>fs/</b>（pstore/、selinux/等本身是伪文件系统mount点）、<b>kernel/</b>（debug/是debugfs mount点）、<b>module/</b>（每模块一个子目录）、<b>power/</b>（Android Wake Locks通过wake_lock和wake_unlock在此实现）。设备差异大，Android框架靠<b>HAL</b>封装成统一API。实验：向<b>/sys/class/timed_output/vibrator</b>的enable文件写入较大值（如5000）看系统振动反应。","tags":"第2章;伪文件系统;实验"},{"chapter":"第3章","front":"一份完整的Android系统镜像由哪些部分组成？各刷入哪个分区？","back":"完整系统镜像 = <b>Boot Loader</b> + <b>bootimg镜像</b>（内核+RAM disk）+ 多个<b>simg格式分区镜像</b>：<ul><li>Boot Loader→aboot分区（HTC称hboot）</li><li>boot镜像→boot分区</li><li>recovery镜像→recovery分区</li><li>/system分区镜像→完整Android系统（谷歌二进制/框架+厂商/运营商组件）</li><li>/data分区镜像→“出厂默认”数据文件</li></ul>","tags":"第3章;系统镜像"},{"chapter":"第3章","front":"Boot Loader的职责是什么？它内含什么特殊组件？","back":"Boot Loader是应用处理器启动阶段执行的代码，职责：<b>寻找/加载boot镜像、固件升级、引导进入recovery</b>。内含小型<b>USB stack</b>以支持fastboot协议。","tags":"第3章;系统镜像"},{"chapter":"第3章","front":"为什么说重置出厂状态本质上是刷写/data分区镜像？","back":"/data分区镜像保存的是<b>“出厂默认”数据文件</b>；将手机重置为出厂状态，就是用该镜像<b>刷写覆盖/data分区</b>。","tags":"第3章;系统镜像"},{"chapter":"第3章","front":"bootimg（boot镜像）的文件签名是什么？Boot Loader镜像和HTC的头部又是什么？","back":"<ul><li>boot镜像签名：<b>“ANDROID!”</b></li><li>Boot Loader镜像签名：<b>“BOOTLDR!”</b></li><li>HTC使用自己的头部，需<code>dd bs=0x100 skip=1</code>去除</li></ul>","tags":"第3章;系统镜像"},{"chapter":"第3章","front":"bootimg由哪些组件组成？对齐方式如何？","back":"由mkbootimg创建（格式定义于bootimg.h）：小头部 + <b>内核</b> + 内核命令行 + <b>RAM disk</b> + Hash（imgtool显示为ID）+ 可选二级启动加载器。所有组件按<b>闪存页边界（通常2KB）对齐</b>。布局：boot header占1页→kernel占n页→ramdisk占m页→second占o页（按页向上取整）；kernel和ramdisk必需，second可选。","tags":"第3章;系统镜像"},{"chapter":"第3章","front":"aboot镜像的私有头（表3-1）包含哪些字段？共多少字节？","back":"aboot私有头共<b>40字节</b>，字段包括：<ul><li>Magic = <b>0x00000005</b></li><li>版本（如3）</li><li>镜像加载基地址（如0x0f900000）</li><li>镜像大小、代码大小、最后指令地址</li><li>数字签名大小（通常0x100=256字节）</li><li>证书链大小</li></ul>头后是ARM可启动镜像，开头为异常向量表（第一条为reset处理函数）。","tags":"第3章;Boot Loader"},{"chapter":"第3章","front":"什么是LK（Little Kernel）？它与Linux内核有何关系？","back":"LK是大多数厂商选用的<b>启动加载器</b>（三星是著名例外）。它<b>不是</b>Android源码树的一部分，可从CodeAurora和googlesource下载；也<b>不是Linux内核</b>，而是一个可启动的ARM二进制镜像。","tags":"第3章;Boot Loader"},{"chapter":"第3章","front":"LK实现的最小功能集包括哪些部分？","back":"<ul><li><b>基本硬件支持</b>：dev/（帧缓存、按键、USB驱动）、platform/（SoC芯片组驱动）、target/（设备特定硬件驱动）</li><li><b>找到并启动内核</b>：由app/aboot完成，解析boot镜像的内核、ramdisk和设备树，传命令行后交出控制权</li><li><b>基本UI</b>：音量键选择、电源键确认（触摸屏不可用）</li><li><b>console支持</b>：lib/console、lib/gfxconsole</li><li><b>USB目标设备+fastboot协议</b>：app/aboot/fastboot.c</li><li><b>闪存分区支持</b>：lib/ff（擦除/重写分区）</li><li><b>数字签名支持</b>：lib/openssl集成OpenSSL验证SSL签名镜像</li></ul>","tags":"第3章;Boot Loader"},{"chapter":"第3章","front":"Boot Loader的信任链机制是如何工作的？","back":"<b>锁定的Boot Loader拒绝刷机或用未签名镜像启动</b>。厂商公钥存于ROM中，验证贯穿启动全程的组件链（<b>rpm→sbl→aboot</b>），各组件内含X.509v3证书与OpenSSL验证代码。","tags":"第3章;Boot Loader"},{"chapter":"第3章","front":"Android设备解锁Boot Loader有哪几种方式？","back":"<ul><li><b>直接解锁</b>：Nexus 5、NVIDIA Shield等，<code>fastboot oem unlock</code>即可（会擦除userdata和cache）</li><li><b>挑战/响应式</b>：设备给出密码学令牌（challenge），需特定响应才能解锁</li><li><b>同时销售加锁/未加锁机型</b>（三星）</li><li><b>Android L起</b>：设置→开发者选项中可开关，实现为设置某分区中一个bit位供Boot Loader读取</li></ul>注意：SIM锁限制的是运营商网络，而Boot Loader锁能否解锁由<b>厂商</b>决定。","tags":"第3章;Boot Loader"},{"chapter":"第3章","front":"解锁Boot Loader有什么安全风险？不可解锁时还能root吗？","back":"解锁后Boot Loader<b>完全控制/data</b>，攻击者可<b>刷绕过锁屏的恶意更新包</b>或<b>直接拷走数据</b>。即使Boot Loader不可解锁，<b>内核漏洞</b>（如GeoHot公开的TowelRoot）仍可能root设备。","tags":"第3章;Boot Loader"},{"chapter":"第3章","front":"zImage是什么？常用的压缩算法有哪些？","back":"zImage是Linux内核的<b>压缩镜像</b>，内含<b>自解压代码</b>；压缩算法由make config决定：<ul><li><b>GZip</b>：最常用，签名<code>\\x1f\\x8b\\x08</code></li><li><b>LZO</b>：解压更快但压缩率低10%~15%，三星使用</li></ul>反汇编解压后的内核时，加载基地址设为0xC0000000（32位）。","tags":"第3章;内核"},{"chapter":"第3章","front":"ARM设备树（Device Tree）的作用、形式和文件签名是什么？","back":"<b>作用</b>：向内核提供硬件设备定义（设备连接的层次关系），内核据此启动相应设备；是ARM特性而非Android特性。<br><b>形式</b>：二进制blob文件，通常附加在内核镜像尾部（有时单独分区）。<br><b>文件签名</b>：<code>0xd00dfeed</code>。可用dtc工具反编译为文本.dts（如model=\"LGE MSM 8974 HAMMERHEAD\"）。","tags":"第3章;内核"},{"chapter":"第3章","front":"RAM disk（initrd/initramfs）是什么？initramfs里为什么要有/init？","back":"RAM disk是启动时由Boot Loader与内核一起<b>预加载到RAM</b>的文件系统，直接访问无需驱动，作为最初根文件系统（/）。它提供<b>关键必备驱动</b>（解决“先有鸡还是先有蛋”问题）；内含<b>/init程序</b>，内核将其作为<b>PID=1的第一个进程</b>运行。","tags":"第3章;RAM disk"},{"chapter":"第3章","front":"Linux通常丢弃RAM disk，但Android为什么保留initramfs常驻内存作根文件系统？","back":"三个原因：<ul><li>文件<b>频繁访问</b>、体积小</li><li>boot镜像有<b>数字签名</b>保护，篡改initramfs更难</li><li>内核+RAM disk打包在同一分区，<b>一次签名同时保护两者</b></li></ul>改/init.rc即可root，但过不了签名验证就无能为力。","tags":"第3章;RAM disk"},{"chapter":"第3章","front":"boot镜像与recovery镜像的RAM disk有何差别？解压后包含哪些文件？","back":"绝大部分相同，差别在<b>init.rc</b>：recovery版的init.rc<b>删除标准服务，只留adbd和/sbin/recovery</b>。<br>ramdisk解压内容：<code>charger</code>、<code>init</code>、<code>init.rc</code>、<code>sbin/adbd</code>、<code>sbin/healthd</code>（KitKat起）、<code>sbin/recovery</code>。","tags":"第3章;RAM disk"},{"chapter":"第3章","front":"simg（sparse image）格式头部的magic签名是什么？头部还有哪些字段？","back":"simg头部共<b>28字节</b>：<ul><li>文件签名magic：<b>0xed26ff3a</b></li><li>版本（0x00000001）</li><li>头部大小（28）</li><li>数据块大小、簇大小（Ext4一般为0x1000=4KB）</li><li>簇个数、镜像中数据块个数</li><li>校验和</li></ul>处理代码在AOSP的system/core/libsparse；simg比raw节省空间（668M vs 1.0G），用simg2img转raw、img2simg反向转换。","tags":"第3章;系统镜像"},{"chapter":"第3章","front":"固件启动过程中boot ROM和sbl各负责什么？","back":"<ul><li><b>boot ROM</b>：相当于PC的BIOS/EFI，由芯片厂商固化在只读存储中，很小；只完成加电到加载sbl之前的初始化，然后加载sbl并交出控制权</li><li><b>sbl</b>（次级启动加载器）：软件实现，不受ROM容量限制，可执行更复杂初始化（如显示启动画面）</li></ul>","tags":"第3章;启动过程"},{"chapter":"第3章","front":"MSM芯片组的固件启动链是怎样的？","back":"boot ROM中的<b>PBL</b>（primary boot loader）→ <b>sbl</b>（本身分三阶段sbl1→sbl2→sbl3，各阶段加载并验证下一阶段代码，涉及rpm和tz/ARM TrustZone）→ 应用处理器执行<b>aboot</b>——至此Android的Boot Loader才正式登场。","tags":"第3章;启动过程"},{"chapter":"第3章","front":"高通骁龙SoC芯片组至少包含哪4个子处理器？","back":"手机处理器是完整芯片组（System-on-Chip），高通骁龙至少含4个子处理器：<ul><li><b>RPM</b>：资源/电源管理</li><li><b>Krait</b>：应用处理器</li><li><b>Adreno</b>：GPU图形</li><li><b>Hexagon</b>：DSP数字信号处理</li></ul>","tags":"第3章;启动过程"},{"chapter":"第3章","front":"fastboot协议有什么特点？“fast”指什么？","back":"fastboot是多数Android Boot Loader支持的<b>简单的基于文本的协议，运行在USB信道上</b>；同步、性能不快——“fast”指<b>实现简单快速</b>。协议版本0.4，细节在system/core/fastboot/fastboot_protocol.txt。","tags":"第3章;fastboot"},{"chapter":"第3章","front":"fastboot协议的交互流程是怎样的？设备有哪几种响应？","back":"主机发送ASCII命令（≤64字节）→设备以<b>INFO / OKAY / FAIL / DATA</b>响应→必要时发送<code>download:nnnnnnnn</code>请求→DATA响应→传输数据→<code>boot</code>或<code>flash:partition</code>执行。","tags":"第3章;fastboot"},{"chapter":"第3章","front":"列举fastboot的常用命令（表3-5）。","back":"<ul><li><code>flash &lt;partition&gt;</code>：刷分区</li><li><code>flash:raw boot</code>：创建bootimg刷入并启动</li><li><code>flashall</code>：一次刷boot+recovery+system</li><li><code>update</code>：用升级包刷</li><li><code>erase/format &lt;partition&gt;</code></li><li><code>getvar &lt;variable&gt;</code></li><li><code>boot &lt;kernel&gt;</code>：临时启动内核不写入</li><li><code>devices</code>、<code>continue</code>、<code>reboot</code>、<code>reboot-bootloader</code></li><li><code>oem [command]</code>：OEM扩展命令</li></ul>","tags":"第3章;fastboot"},{"chapter":"第3章","front":"zImage被加载后，内核启动的早期流程是怎样的（从解压到start_kernel）？","back":"<ul><li>Boot Loader把压缩的zImage和RAM disk加载进内存，控制权转到zImage入口（arch/&lt;arch&gt;/boot/compressed/head.S）</li><li>调用decompress_kernel()，输出“Uncompressing Linux... done, booting the kernel”</li><li>跳到体系结构相关的汇编入口</li><li>设置MMU和页表（切换虚地址）</li><li>交控制权给start_kernel()（init/main.c，体系结构无关，用各专门函数初始化framework→rest_init()→生成kernel_init线程）</li></ul>","tags":"第3章;内核"},{"chapter":"第3章","front":"initcall机制是什么？8个初始化级别各自的内容是什么？","back":"内核初始化由kernel_init通过do_basic_setup()的do_initcalls()依次调用8个级别（类似用户态init的runlevel），各子系统用level_initcall宏注册：<ul><li><b>0 early</b>：辅助线程（RCU、SoftIRQs、工作队列）</li><li><b>1 core</b>：binfmt、sockets</li><li><b>2 postcore</b>：bdi、kobjects</li><li><b>3 arch</b>：体系结构相关</li><li><b>4 subsys</b>：bio、crypto、sound</li><li><b>5 fs</b>：VFS文件系统层</li><li><b>6 device</b>：驱动和普通模块（module_init映射于此）</li><li><b>7 late</b>：高级内存管理、oops处理等</li></ul>","tags":"第3章;内核"},{"chapter":"第3章","front":"长按电源键后，关机/重启菜单的事件传递链是怎样的？","back":"物理按键产生<b>硬件中断</b>→内核捕获并转换为<b>EV_KEY/KEY_POWER/DOWN输入事件</b>→InputReader与InputDispatcher（均为system_server线程）→传给<b>WindowPolicy</b>对象。按住超过<b>GLOBAL_ACTIONS_KEY_TIMEOUT（500ms）</b>，默认WindowPolicy（PhoneWindowManager）拦截事件，调用GlobalActions.showDialog()弹出菜单；若不处理，事件经input channel分发给Window中的ViewRoot逐层向上传递。","tags":"第3章;关机重启"},{"chapter":"第3章","front":"正常关机与重启到安全模式如何区分？ShutdownThread流程依次做哪些事？","back":"正常点击“关机”=正常关机；<b>长按“关机”虚拟键=重启到安全模式（rebootSafeMode）</b>。ShutdownThread（com.android.server.power）流程：<ul><li>shutdownInner()执行前弹确认对话框（可配置不弹）</li><li>beginShutdownSequence()设置两个屏幕wakelock保持屏幕点亮</li><li>依次关闭ActivityManager/蓝牙/NFC/电话/Radio等服务</li><li>SystemProperties设置<b>sys.powerctl</b>属性</li><li>最后由/init在原生层执行</li></ul>","tags":"第3章;关机重启"},{"chapter":"第3章","front":"sys.powerctl属性在关机/重启中扮演什么角色？底层如何实现？","back":"/init负责系统属性：将<b>sys.powerctl</b>设为<b>shutdown</b>或<b>reboot,&lt;reason&gt;</b>（reason可以是recovery或bootloader；adb reboot同样设置该属性）→/init调用cutils的<b>android_reboot()</b>→实为内核<b>reboot()系统调用</b>的封装，reason作为参数传入。","tags":"第3章;关机重启"},{"chapter":"第3章","front":"BackupManagerService的备份流程（从dataChanged到写入）是怎样的？","back":"API level 8起提供，应用自行决定备份哪些数据。流程：数据变化时应用调用<b>dataChanged()</b>→加入队列→transport通知可备份→<b>performBackupTask</b>→<b>invokeNextAgent</b>→应用<b>onBackup()</b>回调，直接把数据写入transport的<b>文件描述符</b>。transport是透明的：数据可备份到本地或云端。","tags":"第3章;备份恢复"},{"chapter":"第3章","front":"Android备份有哪些常用transport（表3-7）？","back":"<ul><li><b>com.google.android.backup/.BackupTransportService</b>：谷歌云服务器，应用需提供API key</li><li><b>com.android.server.enterprise/.EdmBackupTransport</b>：企业备份，仅托管设备</li><li><b>android/com.android.internal.backup.LocalTransport</b>：手机本地备份</li></ul>","tags":"第3章;备份恢复"},{"chapter":"第3章","front":"bmgr工具有哪些常用命令？","back":"bmgr需<b>root</b>，经Java/Binder与BackupManagerService通信：<ul><li><code>backup package</code></li><li><code>enable 0|1</code> / <code>enabled</code></li><li><code>list transports</code>（默认transport标*）</li><li><code>list sets</code></li><li><code>transport &lt;name&gt;</code></li><li><code>restore &lt;set&gt; [App]</code></li><li><code>run</code></li><li><code>wipe &lt;transport&gt; &lt;package&gt;</code></li><li><code>fullbackup &lt;package&gt;</code></li></ul>","tags":"第3章;备份恢复"},{"chapter":"第3章","front":"bu工具有什么特点？backup的二级参数有哪些？","back":"bu是<b>无文档</b>工具，<b>adb backup实际就是调用bu</b>；仅接受backup/restore参数。backup的二级参数（与adb backup一致）：<code>-[no]apk</code>、<code>-[no]obb</code>、<code>-[no]shared</code>、<code>-[no]system</code>、<code>-[no]widgets</code>、<code>-[no]compress</code>（默认压缩）、<code>-all</code>。","tags":"第3章;备份恢复"},{"chapter":"第3章","front":"adb backup有哪些安全设计来防止攻击者窃取数据？","back":"<ul><li>必须<b>点亮屏幕并输入锁屏密码/图案</b>才能确认（防攻击者趁用户不备短暂拿到手机备份走数据）</li><li>用户可<b>取消</b>操作、设定备份文件<b>保护密码</b></li><li>开始备份后有<b>toast</b>显示当前正在备份的包名</li></ul>触发后bu调用BackupManagerService.fullBackup()，弹出可定制UI（activity写死在com.android.backupconfirm）。","tags":"第3章;备份恢复"},{"chapter":"第3章","front":"backup.ab备份文件的头部格式是什么？","back":"UTF-8文本头，行以\\n结尾：<ul><li>line1：<b>“ANDROID BACKUP”</b></li><li>line2：版本</li><li>line3：是否压缩（0/1）</li><li>line4：加密算法（“none”或“AES-256”）</li></ul>加密时追加：用户密码salt（hex）、master key checksum salt、PBKDF2轮数（如10000）、用户key的IV、master key blob（master key的IV+key+checksum hash）。master key checksum = key+salt经<b>1万轮PBKDF2</b>，用于验证用户密码正确性。","tags":"第3章;备份恢复"},{"chapter":"第3章","front":"进入recovery模式有哪些方式？/sbin/recovery为什么在系统崩溃后仍可靠？","back":"进入方式：系统图形界面操作、<code>adb reboot recovery</code>、fastboot。<br>可靠性：/sbin/recovery是<b>RAM disk的一部分</b>，与/system无关，因此/system完全无法启动时recovery仍可加载；内核初始化后recovery（或许还有adbd）是除/init外唯一执行的进程。","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"/sbin/recovery按什么顺序获取参数？什么是BCB？","back":"顺序：<b>自己的命令行</b>→<b>misc分区的BCB</b>（Boot Loader Control Block，Boot Loader控制块）→<b>/cache/recovery/command</b>文件。<br>Android运行时不直接与BCB交互，BCB留给/sbin/recovery保存参数，保证意外中断后重启仍进入recovery并重试之前的动作。参数传递：RecoverySystem把参数写入/cache/recovery/command→重启→传参给Boot Loader使其从recovery分区（而非boot分区）启动。","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"列出/sbin/recovery的主要参数（表3-11）。","back":"<ul><li><code>--wipe_cache</code>：擦cache并重启</li><li><code>--wipe_data</code>：擦除/data所有用户数据=恢复出厂设置</li><li><code>--update_package=&lt;path&gt;</code>：指定OTA升级包路径</li><li><code>--locale</code></li><li><code>--send_intent</code></li><li><code>--show_text</code>：显示文本界面</li><li><code>--just_exit</code></li></ul>recovery用<b>minui</b>库保持屏幕点亮并向用户输出信息。","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"OTA升级包的签名验证机制是什么？如何阻止Kindle强制升级？","back":"升级包必须被<b>/system/etc/security/otacerts.zip</b> keystore中的证书验证通过，才会被复制到<b>/cache分区</b>。<br>阻止升级实例（Amazon Kindle）：删除<b>otacerts.zip</b>即可；另一措施是把<b>/cache分区权限设为root/755</b>。","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"OTA升级包有什么特点？实质是什么格式？","back":"OTA（Over-The-Air）包通过无线网络推送，必须<b>尽量小</b>；按被升级系统的build版本提供不同<b>增量包</b>。实质是<b>数字签名的zip（更准确说是JAR，含META-INF/子目录）</b>，由<b>SignApk</b>签名。","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"OTA升级包内部包含哪些文件？","back":"<ul><li><b>bsdiff(1)格式补丁文件</b>：每个要修补的文件一条记录（偏移量、长度、插入/删除数据），命名=原文件名+\".p\"扩展名</li><li><b>update-binary</b>（META-INF/com/google/android/update-binary）：解析补丁并按脚本升级</li><li><b>updater-script</b>：逐个文件调用补丁函数，升级前后验证Hash</li><li><b>需新增的文件</b>：新文件，或修改太多导致补丁比原文件还大的文件</li><li><b>metadata</b>：记录post-build、post-timestamp、pre-build、pre-device属性</li><li><b>otacert</b>：PEM格式证书，可对照/导入otacerts.zip</li><li>另有META-INF/MANIFEST.MF、CERT.SF、CERT.RSA及recovery-from-boot.p、install-recovery.sh等</li></ul>","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"updater-script脚本可调用哪些函数？","back":"<ul><li>mount/unmount/is_mounted、format</li><li>show_progress/set_progress</li><li>delete/delete_recursive</li><li>package_extract_dir/file</li><li>symlink、set_metadata(_recursive)</li><li>getprop/file_getprop</li><li>write_raw_image、read_file、sha1_check、rename</li><li>apply_patch(_check/_space)、wipe_block_device、wipe_cache</li><li>ui_print、run_program</li></ul>L版新增：<b>block_image_update/range_sha1</b>（块级更新）、reboot_now、get_stage/set_stage、enable_reboot、tune2fs。","tags":"第3章;recovery与OTA"},{"chapter":"第3章","front":"自制ROM导致变砖时，风险按修改的分区如何分级？","back":"<ul><li>只改<b>/data</b>：最坏恢复出厂即可修复</li><li>改<b>/data+/system</b>：内核和ramdisk（boot分区）仍能启动，可进rescue模式</li><li>改<b>boot分区</b>（内核+initramfs）：可能无法启动，但Boot Loader还在，可用fastboot重写boot分区救回</li><li>改<b>Boot Loader本身</b>：可能永远变砖</li></ul>多数Boot Loader允许<code>fastboot boot</code>从另一镜像临时启动，提供安全测试环境。","tags":"第3章;自制ROM"},{"chapter":"第3章","front":"制作自制ROM有哪四种方法？各自风险如何？","back":"前提：Boot Loader必须已解锁。<ul><li><b>方法一：向已有文件系统添加文件</b>（需root）——remount可写→adb push到/data/local/tmp→cp复制到目标位置；操作最多但<b>最安全</b>，不覆盖已有文件时风险极小</li><li><b>方法二：修改initramfs</b>——针对/data和/system之外的文件；修改/init.rc插入指令是root手机的好方法；用cpio -o重打包+gzip→mkbootimg打包→fastboot flash写boot分区（勿与aboot/hboot分区搞混）</li><li><b>方法三：重刷整个分区</b>——dd提取分区镜像、mkextfs制作、dd/fastboot刷入；适合精简厂商软件或修改不能mount的分区（img2simg转simg）</li><li><b>方法四：AOSP/CyanogenMod等现成ROM</b>——比自己定制风险更低</li></ul>","tags":"第3章;自制ROM"},{"chapter":"第3章","front":"CyanogenMod是什么？它为什么可行？有什么特点？XDA-Developers又是什么？","back":"<b>XDA-Developers</b>是Android高级用户最重要的站点，root和recovery工具一般最先发布于此（近600万用户社区）。<br><b>CyanogenMod</b>是开源ROM项目（类似还有AOKP），通过修改厂商内核和系统镜像为市面各手机提供<b>一站式ROM</b>；不只root，还整合最新Android补丁和新功能，常比官方升级更快。<br>可行原因：<b>厂商必须提供Android内核源码 + AOSP开源</b>。<br>可删厂商捆绑应用或加入其他应用；甚至提供自己的Boot Loader，安装简化为点击几下鼠标。一加手机曾将其作为默认系统；获微软、Foxconn超一亿美元投资。","tags":"第3章;自制ROM"},{"chapter":"第3章","front":"TWRP（Team-Win Recovery Project）是什么？有哪些功能？","back":"定制recovery镜像（普通内核+功能完备的recovery程序RAM disk）。功能：<ul><li><b>个性化GUI</b>：改过的AOSP MinUI库libminui.so，支持触摸操作，由res/ui.xml控制（GitHub可下载修改）</li><li><b>备份/恢复</b></li><li>支持<b>ExFAT/F2FS/Ext系列</b>文件系统</li><li>内置Chainfire的<b>SuperSU</b>可root已解锁Boot Loader的设备</li><li>内置<b>busybox</b>二进制</li></ul>比标准/sbin/recovery大。","tags":"第3章;自制ROM"},{"chapter":"第4章","front":"init进程在Android系统中的角色定位是什么？","back":"init是内核启动完毕后用户态的第一个进程（PID=1），是系统中所有其他进程的祖先，负责启动整个系统。","tags":"第4章;init"},{"chapter":"第4章","front":"为什么/init是静态链接的二进制可执行文件？","back":"所有依赖库在编译时已合并进去，防止因缺少/损坏库文件导致系统无法启动。init刚被执行时只有RAM disk（root文件系统）被mount，系统中只有/和/sbin。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在配置文件上有何差异？","back":"Linux用/etc/inittab；Android用/init.rc及import导入的文件（如init.hardware.rc、init.usb.rc、init.hardware.usb.rc）。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在'多种配置'（运行级）上有何差异？","back":"Linux支持运行级（run-level，0停机/1单用户/2-3多用户等，各运行级对应/etc/rcN.d脚本）；Android无运行级概念，改用trigger（触发器）和属性实现多种配置。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在看门狗/守护进程重启机制上有何差异？","back":"Linux用respawn关键字让守护进程退出后重启；Android服务默认保持活跃，oneshot参数表示只启动一次，critical参数使服务无法重启时强制系统重启。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在收容孤儿进程上有何差异？","back":"Linux调用wait()获取孤儿进程返回码、避免僵尸进程；Android init安装SIGCHLD信号处理函数，默默调用wait(NULL)。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在系统属性上有何差异？","back":"Linux不支持'系统属性'概念；Android init通过共享内存区域让所有进程读取属性（getprop），通过property_service socket让有权限的进程写入属性（setprop）。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在分发Socket上有何差异？","back":"Linux的init不向子进程提供socket（该功能交给inetd）；Android init绑定一个UNIX domain socket（L版起为seq packet socket），子进程可通过android_get_control_socket函数获取。","tags":"第4章;init"},{"chapter":"第4章","front":"对比表4-1：传统Linux init与Android init在特殊触发操作和处理uevent事件上有何差异？","back":"特殊触发：Linux只支持ctrl-alt-del等少数触发；Android init可在任意系统属性被修改时执行trigger语句块中的指令。uevent：Linux依赖hotplug守护进程（通常是udevd）；Android init化身ueventd，用专门配置文件指导行为。","tags":"第4章;init"},{"chapter":"第4章","front":"什么是Android的系统属性（system property）？","back":"提供一个可全局访问的配置设置仓库，本质是key-value键值对，类似Windows注册表，功能类似用户态实现的sysctl(2)。它是init最重要的独有机制。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"系统属性文件的加载顺序是怎样的（表4-2）？","back":"<ul><li>/default.prop（PROP_PATH_RAMDISK_DEFAULT）：初始设置，属于initramfs，不在闪存分区上</li><li>/system/build.prop：编译Android过程中产生的设置</li><li>/system/default.prop：通常是厂商添加的设置</li><li>/data/local.prop：仅当编译时用了ALLOW_LOCAL_PROP_OVERRIDE且ro.debuggable=1时加载</li><li>/data/property/persist*（PERSISTENT_PROPERTY_DIR）：持久化属性，重启不丢失</li><li>/factory/factory.prop：已不再支持</li></ul>后加载的覆盖先加载的（除非标记只读ro）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"系统属性的共享内存机制是如何实现的？如何验证？","back":"init启动时调用property_init()→map_prop_area()，打开PROP_FILENAME（/dev/__properties__），用mmap(2)以读写权限映射到内存，再以O_RDONLY重新打开后unlink该文件。只读fd被子进程继承，所有进程通过mmap该fd即可只读访问属性——共享名为__system_property_area的物理内存，大小由PA_SIZE宏定义（默认128KB），写权限被init独揽。验证：查看/proc/各进程/maps，init中映射为rw-s（可写），其他用户态进程为r--s（只读）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"属性存储使用什么数据结构？","back":"混合使用单词查找树（trie/前缀树）与二叉树：属性名按\".\"分隔成token放入trie，同层兄弟节点存入二叉树。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"property_service是什么？如何实现属性写入？","back":"init打开的专用UNIX domain socket：/dev/socket/property_service，权限0666（任何人可连接写入）。init收到写请求后先基于UID/GID检查调用者权限（权限表写死在property_perms数组中，UID 0对所有属性有完全访问权限），有权限才设置属性。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"KitKat/L版本之后属性权限控制有何变化？","back":"属性namespace改用安全上下文（security context，定义在/property_contexts文件中）保护，这是SELinux增强版本的做法（详见第8章）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"AID_RADIO拥有哪些属性namespace的写权限（表4-3）？","back":"net.rmnet0/net.gprs/net.ppp/net.qmi/net.lte/net.cdma（rild的网络属性）、gsm（GSM设置）、persist.radio（重启后仍有效的radio设置）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"AID_SYSTEM拥有哪些属性namespace的写权限（表4-3）？","back":"net.dns（DNS resolver设置）、sys.usb.config（USB工作模式）、net（所有网络设置）、dev（所有硬件部件设置）、[persist.]sys（系统相关）、[persist.]service（启动/停止相应服务）、persist.security（安全相关）、wlan（Wi-Fi设置）、selinux（SELinux设置）、debug（调试设置）、dhcp（与AID_DHCP共享）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"AID_SHELL和AID_BLUETOOTH各拥有哪些属性namespace的写权限（表4-3）？","back":"AID_SHELL：log（日志设置）、service.adb.root（供root权限ADB使用）、service.adb.tcp.port（供TCP/IP连接ADB使用）、sys.powerctl（电源管理控制）。AID_BLUETOOTH：bluetooth、persist.service.dbroid（BlueDroid协议栈蓝牙设置）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"系统属性中persist伪前缀的作用是什么？","back":"persist前缀的属性重启后仍生效，保存在/data/property/目录的各文件中；文件owner必须是root:root且不能有链接。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"系统属性中ro伪前缀的作用是什么？","back":"只读属性，类似C常量，无论谁（包括拥有者）只能设置一次；应尽早设置（通常在厂商build文件中）。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"系统属性中ctl前缀的作用是什么？","back":"控制init管理的服务：设置ctl.start或ctl.stop属性值为服务名即可启停服务（toolbox的start/stop工具就是靠它控制zygote、surfaceflinger、netd）。ACL记录在control_perms数组中（KitKat添加了dumpstate[shell:log]和ril-daemon[radio:radio]）；Lollipop起由SELinux接管ACL。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"列出cutils提供的属性访问API及其作用。","back":"<ul><li>property_get(key, value, default_value)：读取属性，可设默认值</li><li>property_set(key, value)：设置属性，通过property_service socket发给init</li><li>property_list(propfn, cookie)：用回调函数逐一处理各属性</li><li>__system_property_wait_any(serial)：休眠直至某属性被修改（watchprops命令用到）</li></ul>框架层通过android.os.SystemProperties类经JNI调用这些API。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"watchprops命令的作用和局限是什么？","back":"watchprops实时监视属性变化，基于__system_property_wait_any实现。应尽早启动（adb wait-for-device后 adb shell watchprops）。局限：build.prop及之前加载的属性监视不到（当时adb自身还没启动），但仍能看到启动过程设置的重要属性。","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"启动过程中有哪些关键属性值及其设置者？","back":"<ul><li>persist.sys.dalvik.vm.lib.2=\"libart.so\"：Zygote决定用Dalvik还是ART</li><li>net.hostname：ConnectivityService设置</li><li>service.bootanim.exit=\"1\"：SurfaceFlinger设置，退出开机动画</li><li>sys.boot_completed=\"1\"：ActivityManagerService.finishBooting设置</li><li>init.svc.bootanim=\"Stopped\"：开机动画服务已停止</li><li>ro.runtime.firstboot、gsm.*（rild/libril设置）等</li></ul>","tags":"第4章;init;系统属性"},{"chapter":"第4章","front":"init.rc配置文件的传统结构是怎样的？","back":"传统两个配置文件：主配置文件/init.rc + 设备相关的/init.hardware.rc（hardware为内核参数androidboot.hardware或/proc/cpuinfo获取的字符串，如模拟器为\"goldfish\"）。设计初衷是所有设备共享/init.rc，设备特定配置由厂商写在/init.hardware.rc。从Jelly Bean起唯一硬编码的rc文件是/init.rc，其他rc文件用import指令显式导入（如/init.${ro.hardware}.rc和/init.usb.rc；另有/init.trace.rc启用内核ftrace调试）。","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init.rc文件由哪两类语句块构成？各自的格式是什么？","back":"由trigger语句块和service语句块构成。trigger块以关键字on开头，参数可为预定义启动阶段名或property关键字后跟\"属性名=属性值\"表达式，其中命令在触发条件满足时执行；service块以关键字service开头，后跟服务名及命令行，定义各守护进程。init执行action/command时会分别设置init.action和init.command属性为当前正在执行的名称（便于观察）。","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init.rc预定义启动阶段early-init、init、early-fs、fs各做什么（表4-4）？","back":"<ul><li>early-init：第一个阶段，设置SELinux和OOM</li><li>init：创建文件系统、mount点以及写内核变量</li><li>early-fs：文件系统被mount前需完成的工作</li><li>fs：专门用于加载各分区</li></ul>","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init.rc预定义启动阶段post-fs、post-fs-data、early-boot、boot、charger各做什么（表4-4）？","back":"<ul><li>post-fs：各文件系统（/data除外）mount完毕后执行的命令</li><li>post-fs-data：解密/data分区（如需要）并mount之</li><li>early-boot：属性服务初始化之后、启动剩余内容之前</li><li>boot：正常的启动命令</li><li>charger：手机处于充电模式时执行的命令</li></ul>","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init.rc中常用的COMMAND类关键字有哪些（表4-5）？","back":"<ul><li>文件/目录：chdir、chmod、chown、chroot、mkdir、mount fstype fs point、mount all（mount fstab.hardware中所有文件系统，fork子进程用fs_mgr执行）、rm/rmdir、symlink、wait file timeout、write file value（等价echo value > file）、copy</li><li>服务控制：class_start/class_stop/class_reset（批量操作某类服务）、start/stop、enable（L版，启动被disable的服务）、[re]start</li><li>属性/环境：setprop、export variable value、hostname、domainname、setrlimit、sysclktz、loglevel、load_all_props/load_persist_props</li><li>其他：insmod、ifup、import、trigger（激活trigger块）、restorecon[recursive]（重设SELinux上下文）、setcon、setenforce 0/1、setsebool、setkey、swapon_all、powerctl shutdown/reboot、verity_load_state/verity_update_state、bootchart_init</li></ul>","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init.rc中常用的OPTION类关键字有哪些（表4-6）？","back":"<ul><li>critical：关键服务，崩溃自动重启；若在240秒（CRITICAL_CRASH_WINDOW）内崩溃超过4次（CRITICAL_CRASH_THRESHOLD），系统自动重启到recovery模式</li><li>oneshot：启动后不管它（忽略SIGCHLD），只启动一次</li><li>disabled：不自动启动，之后可手工启动</li><li>class：把服务加入某service group，可用class [start|stop|reset]批量操作</li><li>user/group：以指定uid（setuid(2)）/gid（setgid(2)）运行</li><li>console：stdin/stdout/stderr链接到/dev/console</li><li>socket：让init打开UNIX domain socket并让服务进程继承</li><li>onrestart：列出该服务重启时要执行的命令</li><li>ioprio：指定I/O优先级；keycodes：指定触发该服务的组合键</li><li>seclabel：指定SELinux标签；setenv：fork+exec前设置环境变量（仅该服务可见，与export不同）</li><li>capability：支持Linux capabilities（将来才会支持）；writepid（M版）：把子进程PID写入指定文件用于cgroups</li></ul>","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init启动服务的流程是怎样的？","back":"fork()出子进程→setuid/setgid设置权限→配置socket、环境变量、I/O优先级、SELinux上下文；console服务连接/dev/console，其他服务则关闭stdio。所有准备完成后init才exec服务本身的二进制文件。","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"init如何维持与服务的父子链接？服务状态如何观察？","back":"服务启动后init维持父链接（parental link）：服务停止/崩溃时收到SIGCHLD信号，然后重启该服务。onrestart在服务间建立依赖关联。init为每个服务维持状态属性init.svc.服务名，取值为running/stopped/restarting。","tags":"第4章;init;init.rc"},{"chapter":"第4章","front":"什么是keychords（组合键）？init如何使用它？","back":"init可在用户同时按下多个键/按钮（组合键）时启动某些服务，每个键有对应ID（来自Linux evdev输入机制）。keycodes关键字后写的是键盘布局文件（/system/usr/keylayout）中的键位代码。依赖/dev/keychord设备节点（keychord内核驱动导出，内核需启用INPUT_KEYCHORD）。","tags":"第4章;init"},{"chapter":"第4章","front":"唯一默认绑定组合键的系统服务是什么？如何触发？","back":"bugreport。Nexus 5上同时按音量下+音量上+电源键触发。定义见/init.hammerhead.rc：服务bugreport执行dumpstate -d -p -B，配置为class main、disabled、oneshot、keycodes 114 115 116。dumpstate是AOSP二进制文件，逐一列举所有子系统和服务的诊断与实时使用信息。","tags":"第4章;init"},{"chapter":"第4章","front":"既然有vold卷管理守护进程，init为什么还要亲自mount文件系统？","back":"刚启动时只有root文件系统，必须至少mount上/system才能启动其上的守护进程（包括vold本身）。关键操作：mount失败时/init会把系统重启到recovery模式。","tags":"第4章;init"},{"chapter":"第4章","front":"init的mount all指令如何工作？与文件系统加密有何关系？","back":"mount all通常位于on fs语句块，'默认文件系统'规定在/fstab.hardware（AOSP build文件之一）。mount操作代码在fs_mgr（init和vold共用）；init fork子进程执行mount，避免mount问题影响init自身启动。子进程如需要会对文件系统做fsck（路径由fs_mgr规定：当前/system/bin/e2fsck，L版后/system/bin/fsck.f2fs）。mount子进程返回码决定init设置vold.decrypt属性的值，vold据此解密文件系统；若无加密文件系统，init执行\"nonencrypted\"trigger语句块。","tags":"第4章;init"},{"chapter":"第4章","front":"init初始化流程的前半部分（身份检查到SELinux）依次做了什么？","back":"<ul><li>检查二进制是否被当作ueventd或watchdogd（KK及以后）调用——是则转入相应守护进程主循环</li><li>创建并mount /dev、/proc、/sys目录</li><li>创建文件/dev/.booting（启动完毕后被check_startup清空）</li><li>调用open_devnull_stdio()完成'守护进程化'（stdin/stdout/stderr链接到/dev/null）</li><li>调用klog_init()创建/dev/__kmsg__（Major 1, Minor 11）后立即删除它</li><li>调用property_init()在内存中创建__system_property_area区域</li><li>调用get_hardware_name()：读取/proc/cpuinfo提取\"Hardware\"行作硬件名</li><li>调用process_kernel_cmdline()：读/proc/cmdline，把androidboot.XXX参数复制为ro.boot.XXX属性</li><li>JB及以后初始化SELinux（JB需HAVE_SELINUX宏定义才启用，KK起默认启用）；SELinux context放在/dev和/sys里</li></ul>","tags":"第4章;init"},{"chapter":"第4章","front":"init初始化的最后阶段如何处理充电模式与init.rc？","back":"检查\"androidboot\"内核参数判断是否处于充电模式：充电模式下跳过大部分初始化阶段，只加载\"charger\"类服务；否则加载/default.prop正常启动。然后调用init_parse_config_file()解析/init.rc脚本，把各on语句块的action（action_for_each_trigger()）和内置action（queue_builtin_action()）加入action_queue队列（early-init→init→early-fs→fs→post-fs→post-fs-data→early-boot→boot各阶段，穿插内置命令如wait_for_coldboot_done、mix_hwrng_into_linux_rng、keychord_init、console_init、property_service_init、signal_init、check_startup等）。","tags":"第4章;init"},{"chapter":"第4章","front":"init主循环中execute_one_command()和restart_processes()各做什么？","back":"execute_one_command()：从action_queue队首取一个action并执行；restart_processes()：逐个检查所有已注册服务，必要时重启。主循环执行完init.rc所有命令后，init大部分时间休眠，间或轮询文件描述符。","tags":"第4章;init"},{"chapter":"第4章","front":"init主循环轮询的三个socket fd分别是什么、各处理什么？","back":"<ul><li>property_set_fd（/dev/socket/property_service）：接收设置属性请求；用getsockopt(...SO_PEERCRED...)获取对端证书并检查权限；有权限则设值，并执行由此触发的trigger语句块或改变服务状态（如ctl.start/stop）；启用SELinux时还检查/property_contexts</li><li>keychord_fd（/dev/keychord，如存在）：处理启动服务的组合键</li><li>signal_recv_fd：socketpair一端，处理子进程死亡的SIGCHLD信号——sigchld_handler向signal_fd写数据，接收端收到后init调用wait_for_one_process(0)获取死亡子进程返回码（释放资源防止僵尸进程）；若死的是critical服务则重启</li></ul>","tags":"第4章;init"},{"chapter":"第4章","front":"init主循环的安全设计要点是什么？","back":"除三个socket fd外/init不接受任何输入——/init是以root运行且无任何限制的进程，唯一能修改其行为的方法是编辑/init.rc，而该文件位于与内核一起、有数字签名保护的隔离分区中，几乎不可能被修改（除非解锁Bootloader的设备）。","tags":"第4章;init"},{"chapter":"第4章","front":"查看/proc/1/fd可以看到init打开了哪些文件描述符？","back":"0/1/2指向/dev/__null__（stdio已关闭）、3为/dev/__kmsg__、4为/dev/__properties__（只读属性存储，供子进程继承）、5为property_set_fd、6/7为socketpair两端（signal_fd/signal_recv_fd）。","tags":"第4章;init"},{"chapter":"第4章","front":"init与USB的关系是什么？USB模式由哪个属性决定？","back":"Android设备没有专门守护进程处理USB角色切换，这一重任落在init肩上，由它与内核USB组件通信。设备用USB连电脑后表现为哪种设备由系统属性sys.usb.config决定；框架（特别是UsbDeviceManager及相关类）根据用户选择设置该属性。init收到修改请求后根据新值执行对应trigger语句块的指令，相关trigger块单独放在init.hardware.usb.rc中。","tags":"第4章;init;USB"},{"chapter":"第4章","front":"init如何与内核USB组件通信（android_usb伪文件）？USB切换为何先断开再连上？","back":"init向/sys/class/android_usb/android0目录的各伪文件写入数据，另一端是USB gadget driver——多功能驱动，根据用户态要求把Android模拟成各种USB设备。例如Nexus 5的init.hammerhead.usb.rc：on init写f_rndis/manufacturer、vendorID、wceis等；on boot写iSerial（$ro.serialno）、iManufacturer（$ro.product.manufacturer）、iProduct（$ro.product.model）；on property:sys.usb.config=mtp时停止adbd、write enable 0→依次写idVendor（18d1）、idProduct（4EE1）、bDeviceClass/bDeviceSubClass/bDeviceProtocol（0）、f_functions=mtp→enable 1→setprop sys.usb.state ${sys.usb.config}。生效机制：USB驱动要先禁用再启用——这正是开启USB调试或USB共享上网时电脑端看到手机先断开再连上的原因。","tags":"第4章;init;USB"},{"chapter":"第4章","front":"sys.usb.config可用的值有哪些？各代表什么USB模式（表4-7）？","back":"<ul><li>accessory：设备作为USB从机与其他设备相连——需实现AoA协议</li><li>acm：Abstract Control Model（USB modem）</li><li>adb：启用Android调试桥（adbd），创建/dev/android_adb设备节点</li><li>audio_source：把设备用作USB音源设备，提供PCM playback放音</li><li>mass_storage：把设备用作大容量存储设备（移动硬盘）</li><li>mtp：Media Transfer Protocol（多媒体传输协议），设备被认作数码相机，内核创建专门线程处理MTP请求，创建/dev/mtp_usb设备节点</li><li>rndis：USB Remote NDIS，即USB共享上网——电脑通过数据线使用手机连接的Wi-Fi上网</li></ul>","tags":"第4章;init;USB"},{"chapter":"第4章","front":"如何修改Android设备在电脑端显示的USB名称？能否持久化？","back":"/sys/class/android_usb/android0/下记录标识信息的文件包括iManufacturer（厂商字符串）、iProduct（产品ID字符串）、iSerial（串号，adb devices报告）、idProduct/idVendor、bDeviceClass等。修改iProduct可改变电脑端显示的设备名称（如Kindle HDX默认为\"Lab 126 Android\"）；修改iSerial改变adb devices输出的设备串号。这些修改重启后失效；若想持久化，写入/init.hardware.usb.rc即可。","tags":"第4章;init;USB"},{"chapter":"第4章","front":"init是如何'化身'ueventd和watchdogd的？","back":"通过符号链接方式加载，同一个二进制可执行文件扮演不同角色，代码执行路径完全不同。init启动时首先检查自己被当作什么调用（ueventd或watchdogd，KK及以后支持），是则转入相应守护进程主循环。","tags":"第4章;init;ueventd"},{"chapter":"第4章","front":"ueventd的职责是什么？使用什么配置文件？","back":"init作为ueventd运行时负责管理硬件设备：响应内核通知、管理/sys伪文件系统中与设备对应的文件、让各进程能通过/dev中的符号链接访问设备文件。使用/ueventd.rc和/ueventd.hardware.rc——与init的rc脚本不同，这些配置文件只记录文件路径及其应有的权限。ueventd逐行处理rc文件记录，调用set_device_permission()设置对应文件权限。","tags":"第4章;init;ueventd"},{"chapter":"第4章","front":"ueventd处理的uevent事件分为哪两大类？cold boot阶段如何处理？","back":"ueventd调用device_init()初始化NETLINK_KOBJECT_UEVENT socket；若设备还在cold boot过程中，会在/sys/class、/sys/block、/sys/devices三个目录中各添加一个uevent伪文件，让ueventd启动前已add的设备重新发一次通知。之后主循环不断轮询处理两类事件：<ul><li>设备事件（device event）：添加或删除设备时由各内核子系统生成；ueventd创建或删除/dev中对应节点（与传统Linux的udev类似）</li><li>固件事件（firmware event）：监听\"firmware\"类设备的\"add\"事件，收到后从/etc/firmware、/vendor/firmware和/firmware/image目录加载固件</li></ul>编译时用-DLOG_UEVENTS参数可把事件以INFO消息记入日志。","tags":"第4章;init;ueventd"},{"chapter":"第4章","front":"watchdogd是什么？它的工作机制和参数是什么？","back":"init的另一面：作为硬件watchdog定时器（/dev/watchdog，如存在）在用户态的接口。机制：设置timeout变量，每隔一段时间发送keepalive信号（一个NULL字节）；若超时未发，硬件watchdog发出中断要求内核重启。能让watchdogd无法及时发keepalive的唯一原因只有系统已挂机（hang）——此时系统很可能无法恢复，重启反而是较简单的解决方案。命令行参数只有interval和margin两个，初始值都是10（秒）；总超时timeout=两者之和（默认20秒）。","tags":"第4章;init;watchdogd"},{"chapter":"第5章","front":"Android守护进程大多定义在哪个文件中？core、main、late_start三个服务分类的启动顺序如何？core类服务有什么共同特点？","back":"定义在<b>/init.rc</b>的各个service语句块中，出现顺序不重要，影响启动顺序的是所属服务分类：<b>core类</b>最先启动，接着是<b>main类</b>，还可定义<b>late_start类</b>（供依赖/data分区的服务使用，默认服务没有一个属于该类）。core类服务特点：用户模式启动过程中<b>最先运行</b>，都<b>不需要访问/data分区</b>——无论该分区是否被mount都不影响运行。","tags":"第5章;init.rc"},{"chapter":"第5章","front":"原生守护进程与框架服务（framework service）有何区别？system_server扮演什么角色？","back":"守护进程是由init从init.rc的<b>service语句块fork出来</b>的原生（native）服务，完成事务性操作并提供对系统框架的底层支持；框架服务完全是另一回事——数量巨大，运行在Java层。<b>system_server是所有框架服务的容器</b>，还会从bootanimation那里接管UI。","tags":"第5章;init.rc"},{"chapter":"第5章","front":"adbd的作用是什么？它在init.rc中如何定义？","back":"adbd是<b>ADB调试桥守护进程</b>，是电脑与移动设备通信的媒介（可通过adb命令直接使用，或通过ddms间接使用）。init.rc定义（KitKat）：<code>service adbd /sbin/adbd</code>，class core，socket adbd stream 660 system system，<b>disabled</b>（由init.usb.rc在sys.usb.config属性含\"adb\"时启动，即USB调试选项），seclabel设置专属SELinux上下文。<br><b>连接通道</b>：通常为UNIX Domain socket <code>/dev/socket/adbd</code>；USB连接用/dev/android_adb（L版起改为functionfs的<code>/dev/usb-ffs/adb/ep#</code>，由USB Gadget驱动创建）；网络adb监听<b>service.adb.tcp.port</b>（或persist.adb.tcp.port）指定端口。协议记录在源码protocol.txt；trace用环境变量ADB_TRACE（all、adb、socket、packet、rwx、usb、sync、sysdeps、transport、jdwp），如ADB_TRACE=transport adb shell可观察host:version、host:transport-a、shell:等命令及OKAY应答。","tags":"第5章;adbd"},{"chapter":"第5章","front":"adbd的权限是如何设计的？量产版中能否获得root？","back":"默认以<b>uid root</b>启动，但会主动<b>降级为shell:shell</b>并附加多个组：AID_ADB（访问USB驱动）、AID_LOG（读日志）、AID_INPUT、AID_INET（网络诊断）、AID_GRAPHICS（framebuffer）、AID_NET_BT/NET_BT_ADMIN（蓝牙）、AID_SDCARD_R/RW（SD卡读写）、AID_MOUNT（重启前unmount SD卡）、AID_NET_BW_STATS（读qtaguid统计）。<code>adb root</code>通过设置<b>service.adb.root=1</b>实现；但<b>ro.debuggable=0</b>的量产版中adbd得不到root（\"adbd cannot run as root in production builds\"）。","tags":"第5章;adbd"},{"chapter":"第5章","front":"ADB的公钥认证机制（JellyBean起）是如何工作的？如何解决\"先有鸡还是先有蛋\"问题？","back":"ro.adb.secure=1时通过AUTH消息认证（shell uid虽非root但因属于log、graphics等组能力很强，可访问用户个人数据、上传任意App）。<b>AUTH_TOKEN流程</b>：设备生成20字节随机数，等待电脑端用私钥（$HOME/.android/adbkey）签名并返回<b>AUTH SIGNATURE</b>；验证通过后会话进入<b>online</b>状态。<b>公钥不可信时</b>：电脑端响应AUTH RSAPUBLICKEY，adbd把公钥传给system_server（UsbDebuggingManager），弹出UsbDebuggingActivity对话框要求用户确认
