公钥指纹（MD5 Hash）；信任后公钥加入/data/misc/adb/adb_keys（类似SSH的known_hosts，dumpsys usb可查看）。厂商也可重编译adbd删除此功能，只允许写死的厂商公钥。","tags":"第5章;adbd"},{"chapter":"第5章","front":"servicemanager的作用是什么？它在init.rc中如何定义？","back":"Android中<b>IPC机制的关键组件</b>，是<b>Binder服务的注册/查询中心</b>（具有服务映射器service mapper功能，类比RPC的portmapper、Windows的DCE endpoint mapper），没有它进程间通信将受很大影响。定义：<code>service servicemanager /system/bin/servicemanager</code>，class core，user system，group system，<b>critical</b>。onrestart触发：restart healthd、zygote、media、surfaceflinger、inputflinger（L版）、drm。","tags":"第5章;servicemanager"},{"chapter":"第5章","front":"为什么servicemanager重启时要强制重启zygote、media等服务？","back":"servicemanager重启后会回到<b>空白状态</b>，要求各服务重新注册；由于服务进程<b>无法检测</b>servicemanager是否挂掉，唯一方法是重启servicemanager时<b>强制重启这些服务</b>（通过onrestart触发语句）。详细讨论与system_server一起留待下一章。","tags":"第5章;servicemanager"},{"chapter":"第5章","front":"healthd的作用是什么？L版中充电模式（charger）与它的关系是怎样的？","back":"healthd（<b>健康度守护进程</b>，KitKat引入）周期性执行\"设备健康值\"检测任务（目前只有电池电量相关），注册为<b>BatteryPropertiesRegistrar</b>服务（L版为batterypropreg），从<b>sysfs</b>读取并更新电池电量信息，为BatteryStatsService等框架服务提供数据。L版前有独立charger守护进程（class_start charger启动）；L版中<b>charger合并进healthd</b>：<code>/sbin/charger</code>只是<code>/sbin/healthd</code>的<b>符号链接</b>，用<b>-c参数</b>启动，负责充电时以图形显示电量（miniUI库实现）。healthd是<b>critical</b>服务，且是少数位于root文件系统<b>/sbin</b>（而非/system/bin）中的守护进程。","tags":"第5章;healthd"},{"chapter":"第5章","front":"healthd主循环用epoll轮询哪3个文件描述符？各自作用是什么？","back":"<ul><li><b>wakealarm_fd</b>（TimerFD）：定时器每隔periodic_chores_interval秒唤醒进程执行periodic_chores；分fast（1分钟，充电时）和slow（10分钟，电池供电时）</li><li><b>event_fd</b>（NetLink）：读取内核通知事件，只关心power子系统（SUBSYSTEM=POWER）的电池电量和充电通知，触发battery_update()</li><li><b>binder_fd</b>（/dev/binder）：供框架listener（首先是BatteryStatsService）使用的接口，以batterypropreg服务身份让框架客户端更新信息</li></ul>L版起支持dumpsys battery（ac、usb、wireless、status、health、level、voltage、temp等），dumpsys通过binder传递fd给healthd输出。","tags":"第5章;healthd"},{"chapter":"第5章","front":"lmkd的作用是什么？它在init.rc中如何定义？初始化时做了哪些自我保护？","back":"lmkd（<b>低内存终止器守护进程</b>，Android L新增）为Android特有的LMK（Low Memory Killer）内核机制提供<b>用户态接口</b>，允许控制Linux的OOM机制。定义：<code>service lmkd /system/bin/lmkd</code>，class core，<b>critical</b>，<b>socket lmkd seqpacket</b> 0660 system system。初始化：mlockall(MCL_FUTURE)锁定所有内存页防止被换出；sched_setscheduler设置FIFO调度策略保证优先运行；从init获得/dev/socket/lmkd；设置epoll构建。","tags":"第5章;lmkd"},{"chapter":"第5章","front":"lmkd的两种操作模式分别是什么？如何选择？","back":"按是否检测到LMK特性决定：<ul><li>内核<b>有LMK</b>：只调整目标进程在/proc伪文件系统中的<b>oom_score_adj</b>（写/proc/pid/oom_score_adj），实际杀进程交给LMK模块</li><li>内核<b>无LMK</b>（找不到/sys/module/lowmemorykiller文件）：自己监听<b>/dev/memcg</b> cgroup获取内存压力事件，直接向被选进程发送<b>SIGKILL</b>，并维护进程Hash表快速查询所有进程的OOM分值</li></ul><br>处理内存压力事件时解析<b>/proc/zoneinfo</b>：<b>nr_free_pages</b>（空闲内存总数，4KB单位）、<b>nr_file_pages</b>（文件映射占用）、<b>nr_shmem</b>（共享内存，一页被n个进程共享减n-1次）、<b>nr_totalreserve_pages</b>（系统保留内存，应从空闲内存中减掉），然后不断杀掉被选进程直到空闲内存达标。lmkd不能移植到KitKat以前版本，因为必须依靠init创建的seqpacket socket。","tags":"第5章;lmkd"},{"chapter":"第5章","front":"lmkd协议有哪3种消息类型？客户端是谁？","back":"客户端唯一是<b>ActivityManagerService</b>（通过ProcessList类）通知lmkd调整进程OOM分值；消息长度可变（最多52字节），以消息类型开头：<ul><li><b>LMK_TARGET</b>（0x00000000）：写入/sys/module/lowmemorykiller/parameters/minfree的整型数组</li><li><b>LMK_PRIO</b>（0x00000001）：要调整OOM的进程PID及要设置的oom_score_adj值</li><li><b>LMK_PROCREMOVE</b>（0x00000002）：把进程移出监视名单的PID</li></ul>","tags":"第5章;lmkd"},{"chapter":"第5章","front":"logd的作用是什么？它在init.rc中定义了哪4个socket？","back":"logd（<b>日志守护进程</b>，Android L新增）提供<b>集中式用户态日志服务</b>，替代旧版/dev/log/下由内核ring buffer实现的日志机制（解决ring buffer太小且需常驻内存的缺点）；注册为<b>auditd</b>后可从内核（通过netlink）接收SELinux消息并记录到系统日志。4个socket：<ul><li><code>/dev/socket/logd</code>：stream 0666 logd logd，<b>控制接口</b>（CommandListener线程用）</li><li><code>/dev/socket/logdr</code>：seqpacket 0666 logd logd，读写socket，设计用于<b>读</b>（LogReader线程用）</li><li><code>/dev/socket/logdw</code>：dgram 0222（只写）logd logd，<b>写入日志</b>用（LogListener线程用）</li><li>auditd相关netlink：接收内核SELinux消息</li></ul>","tags":"第5章;logd"},{"chapter":"第5章","front":"logd识别哪些日志缓冲区？logd.auditd、persist.logd.size等属性有什么作用？日志修剪解决什么问题？","back":"缓冲区：main、radio、events、system四个传统buffer，L版新增<b>crash</b>，用log id（lid）编号0到5。属性：<b>logd.auditd</b>（默认true，启用SELinux audit daemon）、<b>logd.auditd.dmesg</b>（默认true，audit消息复制到dmesg）、<b>logd.statistics.dgram_qlen</b>（默认false，有性能开销，logcat -S查看）、<b>persist.logd.size</b>（默认256K，运行时用logcat -b all -G调整）。<b>日志修剪</b>（log pruning）：自动清理或保留指定uid的日志，解决某些进程日志过多\"淹没\"整个日志的问题；用logcat <b>-p</b>设置白名单/黑名单（uid或PID列表）。","tags":"第5章;logd"},{"chapter":"第5章","front":"logd控制协议有哪些命令？哪些需要root或log组权限？","back":"客户端（通常logcat）连/dev/socket/logd发送协议命令：clear lid（logcat -c清空buffer）、getLogSize（-g）、getLogSizeUsed、setLogSize（-G）、getStatistics（-S提取日志统计）、getPruneList/setPruneList（-p）、shutdown（强制退出，竟不需要权限认证）。灰色命令需<b>root权限</b>，或主组为root/system/log的GID，或次级组有log的GID（logd直接解析/proc/pid/status的\"Groups:\"行验证）。","tags":"第5章;logd"},{"chapter":"第5章","front":"logcat连接logd读取日志时向LogReader写入哪些参数？logger_entry_v3结构体头部包含哪些字段？","back":"客户端连/dev/socket/logdr，写入参数：<b>lid=value</b>（指定log id）、<b>start=value</b>（从指定时间开始，默认EPOCH）、<b>tail=value</b>（行数，类似tail(1)）、<b>pid=value</b>（指定pid）、<b>dumpAndClose</b>（获取后退出）。日志被顺序打包到logger_entry_v3再经socket传递：固定<b>24字节头部</b>，含len、hdr_size、pid（产生payload的进程）、tid（主线程与pid相同）、sec/nsec（自EPOCH起）、log ID（MAIN(0)、RADIO(1)、EVENT(2)、SYSTEM(3)、CRASH(4)），后接消息payload。","tags":"第5章;logd"},{"chapter":"第5章","front":"vold的作用是什么？它在init.rc中的定义有什么独特之处？","back":"vold是<b>卷管理守护进程</b>（volume-management daemon，概念源自Solaris）：内核检测到文件系统（卷）时由它自动mount；Honeycomb起支持文件系统加密。定义（KitKat）：<code>service vold /system/bin/vold</code>，class core，socket vold stream 0660 root mount，<b>ioprio be 2</b>（唯一用ioprio指定I/O优先级的守护进程）。","tags":"第5章;vold"},{"chapter":"第5章","front":"vold的fstab配置文件位于哪里？字段格式如何？fs_mgr支持哪些可选参数？","back":"Android 4.3以前为<code>/system/etc/vold.fstab</code>；4.3起挪到rootfs，命名为<code>/fstab.${ro.hardware}</code>，格式与经典UNIX fstab一致。vold与init用<b>fs_mgr</b>同一代码解析（fs_mgr静态编译进两个可执行文件，封装mount(2)等，也调用/system/bin/e2fsck）；init忽略带<b>voldmanaged</b>的行，只有vold关注它们。字段：<b>&lt;src&gt; &lt;mnt_point&gt; &lt;type&gt; &lt;mnt_flags and options&gt;</b>，mnt_flags一字不差传给mount(2)。可选参数：<b>wait</b>（mount前等20秒）、<b>check</b>（mount前检查）、<b>nonremovable</b>、<b>recoveryonly</b>、<b>noemulatedsd</b>、<b>verify</b>（KitKat起启用dm-verity校验完整性）、<b>zramsize=</b>、<b>swapprio=</b>、<b>length=</b>、<b>voldmanaged=lag:number|auto</b>、<b>encryptable=</b>（加密密钥存储位置）、<b>forceencrypt</b>（L版新增，首次boot即加密）。","tags":"第5章;vold"},{"chapter":"第5章","front":"vold的内部架构由哪三个组件构成？主要框架客户端是什么？vdc如何使用？","back":"<ul><li><b>VolumeManager</b>：维护卷状态并处理卷操作，提供所有面向框架的功能</li><li><b>NetlinkManager</b>：通过NetlinkHandler监听block子系统的内核Netlink事件并传给VolumeManager</li><li><b>CommandListener</b>：监听/dev/socket/vold，接收框架命令、传回执行结果</li></ul>主要客户端是<b>com.android.server.MountService</b>（应用不能直接调用，须用android.os.storage.StorageManager），用NativeDaemonConnector类连/dev/socket/vold。<b>vdc</b>是UNIX domain socket瘦客户端（需root），可直接发命令或用<code>vdc monitor</code>监听事件（如SD卡插入：605 Volume状态No-Media→Pending→Idle-Unmounted→Checking→Mounted）。","tags":"第5章;vold"},{"chapter":"第5章","front":"vold支持哪些主要命令？ASEC和OBB分别是什么？","back":"经vdc一字不差传递：<b>dump</b>、volume list/mount/unmount [force|and_revert]/format [wipe]/mkdirs/share ums、storage users path（列出使用某卷的进程PID，类似fuser）、storage mountall（调用fs_mgr mount fstab中所有文件系统）、<b>fstrim do[d]trim[bench]</b>（调用FITRIM ioctl让mmc驱动擦除未使用块，M版新增bench参数）。<b>ASEC</b>（Android Secure Storage）安全容器：list/create/destroy/finalize/fixperms/mount/unmount/path/rename/fspath。<b>OBB</b>（Opaque Binary Blob）：list/mount/unmount/path。L版起不再支持旧版YAFFS的xwarp命令。","tags":"第5章;vold"},{"chapter":"第5章","front":"vold的cryptfs子命令有哪些？各用于什么场景？","back":"<ul><li><b>cryptfs restart</b>：向init发信号重启框架</li><li><b>cryptfs cryptocomplete</b>：验证文件系统是否处于正常状态</li><li><b>cryptfs enablecrypto inplace|wipe password</b>：加密文件系统</li><li><b>changepw</b>：修改加密密码</li><li><b>checkpw passwd</b>：检查密码是否正确可mount</li><li><b>verifypw passwd</b>：供BackupManagerService使用</li><li><b>getfield/setfield name value</b>：获取/设置cryptfs元数据字段</li></ul>","tags":"第5章;cryptfs"},{"chapter":"第5章","front":"Android的文件系统加密基于什么机制？为什么系统分区不加密？","back":"基于扩展Linux的<b>dm-crypt</b>机制（也是asec机制的基础），可加密整个用户数据分区（Honeycomb起）。dm-crypt透明地对块设备做加/解密，需用户态程序提供口令；/data未mount时通过解锁屏幕操作获取口令/图形，用<b>com.android.settings.CryptKeeper</b> activity提示输入。<b>系统分区不加密</b>：各设备相同、不存用户数据，加密无意义。","tags":"第5章;cryptfs"},{"chapter":"第5章","front":"加密/data分区时，开机解锁流程中init、vold、CryptKeeper如何交互？","back":"<ul><li>init调用fs_mgr mount；若无加密文件系统，设<b>ro.crypto.state=unencrypted</b>，执行nonencrypted trigger（启动late_start类服务）</li><li>若有加密：fs_mgr先用<b>tmpfs</b>代替mount在规定位置并向init返回1；init设ro.crypto.state=encrypted、<b>vold.decrypt=1</b>；SystemServer此时只运行core类应用和服务</li><li>CryptKeeper注册为home screen并具高优先级，onCreate检查vold.decrypt为1则通过ValidationTask连MountService的getEncryptionState()，发送cryptfs cryptocomplete验证</li><li>密码正确后MountService发cryptfs restart：vold把vold.decrypt改为trigger_reset_main（休眠2秒停止main类服务并unmount tmpfs），重新mount解密后的/data，再依次改为load_persist_props（persist属性存放在/data）、trigger_post_fs_data、trigger_restart_framework，init重启框架</li></ul>","tags":"第5章;cryptfs"},{"chapter":"第5章","front":"cryptfs enablecrypto加密过程的流程是怎样的？进度如何展示？","back":"CryptKeeper生成UI，提示输入加密口令并确认设备<b>在充电</b>（防止加密中途没电）。MountManager.encryptStorage()发送<b>cryptfs enablecrypto wipe|inplace 口令</b>（wipe指加密前格式化/data）。vold验证后把vold.decrypt改为<b>trigger_shutdown_framework</b>（init停止除core类外所有服务），安全unmount /data；<b>vold.encrypt_progress</b>设为初始值0，vold.decrypt改回trigger_restart_min_framework。CryptKeeper把vold.encrypt_progress显示在进度条直到100%；失败时该属性被设为error字符串。L版提供可恢复加密（resumable encryption），恢复失败则只能恢复出厂设置。","tags":"第5章;cryptfs"},{"chapter":"第5章","front":"vold的Adopted Storage（Marshmallow新增）机制是怎样的？","back":"vold可加密扩展存储器中的文件系统，方法与/data一样用<b>dm-crypt</b>；解密密钥（随机生成的<b>128位密钥</b>）记录在<code>/data/misc/vold</code>目录，文件名<b>expand_GUID.key</b>（GUID为分区识别ID）。系统提示只能本机使用（\"use as internal storage\"），但root过的手机可复制密钥到另一台设备共用。实际格式化由<b>/system/bin/sgdisk</b>完成（--new、--change-name、--typecode=、--partition-guid）。分区表：<b>android_meta</b>（19A7D0A2-B3CA-11E4-B026-10604B889DCF，元数据分区，每物理存储设备一个）、<b>android_expand</b>（193D1EA4-B3CA-11E4-B075-10604B889DCF，加密分区）。可用sm upcall脚本查询（sm has-adoptable）或强行设置（sm set-force-adoptable）。","tags":"第5章;vold"},{"chapter":"第5章","front":"netd的作用是什么？它在init.rc中定义了哪4个socket？","back":"netd（<b>网络管理守护进程</b>）控制网络接口并管理配置；Tethering、防火墙、Wi-Fi热点、DNS查询等特性都依赖它。4个socket：<ul><li><b>netd</b> stream 0660 root system：主接口，供框架和ndc用</li><li><b>dnsproxyd</b> stream 0660 root inet：供Bionic做DNS解析的接口</li><li><b>mdns</b> stream 0660 root system：供NsdService、Neighbor Discovery用</li><li><b>fwmarkd</b> stream 0660 root inet：防火墙标记（Firewall Marking）接口</li></ul>","tags":"第5章;netd"},{"chapter":"第5章","front":"netd的CommandListener内部有哪些Controller类？它们如何实现功能？","back":"CommandListener监听/dev/socket/netd，接收框架（特别是NetworkManagementService）的命令并广播通知，把命令分发给各内部Controller类。Controller多数不实现功能，而是通过<b>fork()/exec(2)</b>调用相应守护进程或ip[6]tables：<ul><li>BandwidthController（bandwidth，ip[6]tables）：网络配额控制</li><li>ClatdController（clatd）：464XLAT（通过IPv6网络承载IPv4流量）</li><li>FirewallController（firewall，iptables）：防火墙</li><li>IdletimerController（idletimer）：网卡空闲计时器</li><li>InterfaceController（interface，net/*）：网卡</li><li>NatController（nat）：网络地址转换（NAT）</li><li>PppController（ppp，pppd）：VPN</li><li>SoftapController（softap，hostapd）：Wi-Fi tethering/P2P</li><li>TetherController（tether ipfwd，dnsmasq与/proc/sys/net/ipv4/ip_forward）：USB和Wi-Fi tethering</li></ul>","tags":"第5章;netd"},{"chapter":"第5章","front":"netd的DnsProxyListener提供哪些DNS代理命令？Bionic如何利用它？","back":"监听/dev/socket/dnsproxyd的FrameworkListener，命令：<ul><li><b>getaddrinfo</b> name service ai_flags ai_family ai_socktype ai_protocol iface：对指定网卡调用getaddrinfo(3)（比其他getXXXbyYYY函数更高级、向前兼容性更好）</li><li><b>gethostbyname</b> iface name af：正向DNS解析（A/AAAA）</li><li><b>gethostbyaddr</b> addrStr addrLen addrFamily iface：反向DNS解析（PTR）</li></ul>Bionic让所有进程都能通过库调用这些命令并连到dnsproxyd socket（无论原生还是Dalvik代码，DNS都被重定向到代理）；netd可根据发起调用进程的<b>uid</b>强制限定其DNS功能，实现按应用粒度的DNS控制。","tags":"第5章;netd"},{"chapter":"第5章","front":"mdnsd的作用是什么？它需要哪些权限组？在init.rc中如何定义？","back":"mdnsd是<b>组播DNS守护进程</b>：mDNS（Multicast DNS）是设备间相互发现协议（苹果Bonjour，标准RFC 6762，广泛用于AirPlay等Air协议族），通过向<b>224.0.0.253</b>（IPv6为FF02::fc）的UDP端口<b>5353</b>发广播相互发现；Android采用它作为\"WiFi Direct\"的基础（JellyBean起加入init.rc）。定义：<code>service mdnsd /system/bin/mdnsd</code>，class main，<b>user mdnsr</b>，<b>group inet net_raw</b>（inet为通用TCP/IP权限，net_raw为raw socket的\"高级\"权限），socket mdnsd stream 0660 mdnsr inet，<b>disabled，oneshot</b>。监听/dev/socket/mdnsd（MDNS_UDS_SERVERPATH宏定义），另用socket /dev/socket/mdns连向netd。框架封装为android.net.nsd（API level 16起）；实现代码在external/mdnsresponder，与开源mDNSResponder相似，Android特有修改放在#ifdef ANDROID代码块中。","tags":"第5章;mdnsd"},{"chapter":"第5章","front":"mtpd的作用是什么？它的名字与媒体传输协议有关吗？","back":"<b>无关，仅字面巧合</b>。mtpd是<b>VPN隧道守护进程</b>，负责提供<b>PPP和L2TP</b>（但不包括IPSec）功能。定义：<code>service mtpd /system/bin/mtpd</code>，class main，socket mtpd stream 600 system system，<b>user vpn</b>，<b>group vpn net_admin inet net_raw</b>（访问网络、配置网卡、使用IP隧道），disabled，<b>oneshot</b>——必须通过设置<b>ctl.start</b>系统属性手工启动（com.android.server.connectivity.vpn的startLegacy内部类就是这么干的）。系统没有提供操作VPN的编程接口，启动/停止只能通过GUI完成。","tags":"第5章;mtpd"},{"chapter":"第5章","front":"racoon守护进程的作用是什么？它的启动权限有何特殊之处？","back":"racoon是<b>IPSec/IKE VPN守护进程</b>，VPN守护进程事实上的标准，是外部项目（非Android一部分），在Android和iOS中被广泛使用。定义：socket racoon stream 600 system system，group vpn net_admin inet，disabled（由ConnectivityManager手工启动），oneshot。IKE使用UDP端口<b>500</b>：racoon以<b>root启动</b>以便绑定ISAKMP特权端口，绑定后<b>setuid降为vpn</b>，因此还需额外加入几个组以拥有建立网络连接的权能。从安全角度，使用权能（特别是CAP_NET_BIND_SERVICE）比root权限更好——racoon曾曝出可利用的漏洞（曾被用来对iOS 5越狱），这一改进尤为重要。","tags":"第5章;racoon"},{"chapter":"第5章","front":"rild的作用是什么？它如何与厂商RIL库协作？","back":"rild（<b>RIL Daemon，无线接口层守护进程</b>）通过与基带（baseband）交互提供所有与电话相关的功能（手机或带3G/LTE上网的平板上非常重要）。AOSP的rild只是<b>外壳</b>：解析参数后转去调用<b>厂商提供的RIL库</b>（位置由-l参数或rild.libpath系统属性确定）；动态加载时调用其初始化导出函数<b>RIL_Init</b>，获取并注册库中导出的各RIL事件处理函数，然后进入事件循环。底层通话控制仍使用与上世纪调制解调器一样的<b>\"AT\"命令集</b>；rild打开通话部件（基本是串口）产生命令，并监听基带产生的unsolicited command（如来电）。","tags":"第5章;rild"},{"chapter":"第5章","front":"rild在init.rc中定义了哪两个socket？各有什么用途？","back":"<code>service ril-daemon /system/bin/rild</code>，class main，user root，group radio cache inet misc audio log：<ul><li><b>socket rild</b> stream 660 root radio：用作与应用交互的接口，应用通过它向基带发送请求（dial拨号、answer接听、hangup挂断），rild也用它发出基带事件（收到短消息、来电）；应用不能直接用socket，它被封装为Java RIL实现（com.android.internal.telephony包）</li><li><b>socket rild-debug</b> stream 660 radio system：调试用，是libril中debugCallback的数据去处，可手工向RIL注入代码模拟各种电话业务请求</li></ul>调试工具：radio专用日志设备节点/dev/log/radio（logcat -b radio查看），某些版本会记下rild拨号及建立连接过程中使用的AT命令。","tags":"第5章;rild"},{"chapter":"第5章","front":"surfaceflinger的作用是什么？它在init.rc中的定义为何不需要socket？","back":"surfaceflinger居于<b>Android图形栈的中心</b>，\"flinger\"（有时称compositor排字工）指把一个或多个层（Layer）整合为一个层统一输出的角色；被整合的是图形\"surface\"（android.view.Surface实例）：可以是框架view的输出，也可以是开发者提供的raw或GL Surface。它通过<b>servicemanager查找服务</b>用binder通信，不需要socket，定义很简单：<code>service surfaceflinger /system/bin/surfaceflinger</code>，class main，user system，group graphics，onrestart restart zygote。架构：User Apps通过binder与system_server（WindowManager/SurfaceControl）交互，与SurfaceFlinger交互；其下是HW Composer（HWC）、framebuffer。","tags":"第5章;surfaceflinger"},{"chapter":"第5章","front":"bootanimation的作用是什么？启动后依次寻找哪3个zip包？厂商如何定制？","back":"bootanimation是/system/bin下很小的二进制文件，专门被<b>surfaceflinger</b>用作它（和其他media框架）加载时的<b>占位符</b>。定义：service bootanim，class main，user graphics，group graphics，disabled（由SurfaceFlinger用ctl.start启动），<b>oneshot</b>。启动后依次寻找：<ul><li><code>/system/media/bootanimation-encrypted.zip</code>：vold.decrypt=1（文件系统已加密）时使用</li><li><code>/data/local/bootanimation.zip</code>：用户可adb push自定义，存在则替代系统自带动画</li><li><code>/system/media/bootanimation.zip</code>：系统默认（通常厂商提供）</li></ul>三个都找不到时默认交替显示framework-res.apk的/assets/images下android-logo-mask.png和android-logo-shine.png。厂商定制：三星用/system/bin/samsungani和qmg属性；HTC One M8修改搜索路径到/system/customize/resource找hTC_bootup_one.zip；Kindle FireOS保留bootanimation二进制但改为显示Kindle Fire Logo。","tags":"第5章;bootanimation"},{"chapter":"第5章","front":"bootanimation如何实现不依赖框架的图形输出？开机动画zip的内容规格是什么？","back":"bootanimation具有<b>raw图形权能</b>：最先启动时框架未初始化，直接调用底层<b>OpenGL和SKIA</b>函数，需直接访问帧缓存<code>/dev/graphics/fb0</code>，故以<b>graphics uid</b>运行（fb0的所有者）。直接写帧缓存使其能在surfaceflinger运行时<b>完全覆盖其屏幕输出</b>。zip必须含<b>desc.txt</b>和多张循环显示的png图片，第一帧与ROM启动图重叠保证平滑过渡；desc.txt第一行依次为<b>宽度、高度、每秒帧数（fps）</b>（如1080 230 24），随后p 1 0 part0、p 0 0 part1定义循环；png必须严格符合规格（file命令验证如PNG image data, 1080 x 230）。","tags":"第5章;bootanimation"},{"chapter":"第5章","front":"mediaserver的作用是什么？它包含哪几个子服务？","back":"mediaserver是Android最重要的组件之一，<b>多媒体处理的中心节点</b>，控制录播功能。定义：service media /system/bin/mediaserver，class main，user media，group audio camera inet net_bt net_bt_admin net_bw_acct drmrpc mediadrm，<b>ioprio rt 4</b>；所属用户组反映需要访问声音、摄像头、网络服务及DRM框架的权限。它实际上只是各真正服务的<b>容器</b>（类似Windows的svchost.exe）：<ul><li><b>AudioFlinger</b>（media.audio_flinger）：音频播放，合并PCM音频流为混合流</li><li><b>AudioPolicyService</b>（media.audio_policy）：音频策略，告诉AudioFlinger音量大小及目标音频播放设备</li><li><b>CameraService</b>（media.camera）：摄像头服务，\"相机\"App的主要服务端</li><li><b>MediaPlayerService</b>（media.player）：播放视频和音频</li></ul>KitKat起通过registerExtensions()支持服务扩展（目前尚未定义扩展服务）。<br><b>media.log调试</b>：启动时检查<b>ro.test_harness</b>属性，为1则把mediaserver fork()成MediaLogService进程（media.log）的子进程，media.log可利用父进程权力获取mediaserver资源实时状态；操作：<code>setprop ro.test_harness 1</code>，kill mediaserver进程，之后可用<code>logcat | grep media.log</code>或<code>dumpsys media.log</code>查看资源使用。","tags":"第5章;mediaserver"},{"chapter":"第5章","front":"drmserver的作用是什么？其\"DRM框架\"名不副实体现在哪里？","back":"drmserver是DRM（Digital Rights Management，数字版权管理）请求的<b>中心节点</b>。定义：service drm /system/bin/drmserver，class main，user drm，group drm system inet drmrpc。\"框架\"名不副实：只定义了<b>API</b>，没有任何真正的内容验证逻辑；实际工作通过<b>插件架构</b>留给厂商——插件是动态链接库（so文件），存放在<code>/vendor/lib/drm</code>和<code>/system/lib/drm</code>目录，drmserver逐个加载。因此drmserver非常小，main()只有寥寥数行：在ServiceManager注册DrmManagerService（drm.drmManager），有DRM API调用时由DrmManager类找到对应插件处理。插件必须遵循<b>IDrmEngine.h</b>中定义的IDrmEngine接口标准。","tags":"第5章;drmserver"},{"chapter":"第5章","front":"installd的作用是什么？它在init.rc中如何定义？启动过程分哪几步？","back":"installd（<b>应用安装守护进程</b>）负责安装或卸载App包；无论从Google Play下载还是adb install，最终都调用installd。本身是<b>被动式</b>：监听init安装的socket，接收框架命令。定义：<code>service installd /system/bin/installd</code>，class main，socket installd <b>stream 600 system system</b>。启动过程：<b>initialize_globals</b>（读环境变量获知目录结构）→<b>initialize_directories</b>（安装目录结构支持多用户）→<b>drop_privileges</b>（放弃UID/GID 0特权但保留部分权能）→<b>android_get_control_socket</b>（从init获得socket）→<b>listen</b>（backlog为5）→<b>accept</b>（阻塞等连接，read一行读取请求，执行请求不提任何问题）。<br><b>JellyBean多用户目录改造</b>：创建/data/user目录（system:system，rwx-x-x）；创建符号链接/data/user/0指向/data/data；把/data/media升级为/data/media/0，旧文件移入；为其他用户创建/data/media/##目录；把/data/media/0/Android/obb中的OBB移到/data/media/obb（各用户共享并节省空间）；确保各用户media目录存在且为media:media rwxrwx---。","tags":"第5章;installd"},{"chapter":"第5章","front":"installd如何贯彻最小权限原则？它有哪些行为上的安全假设？","back":"JellyBean起启动即调用<b>drop_privileges()</b>，uid/gid设为AID_INSTALL；用Linux<b>权能</b>维护chown(2)、setuid(2)/setgid(2)和DAC（安装/卸载不同uid/gid的包时需要）。行为特点：同一时刻只处理一个客户端（连接关闭才处理下一个）；<b>从不验证socket中的\"call id\"</b>，靠socket被chmod为system:system保证安全，默认假设调用者是PackageManager；<b>也不验证APK签名</b>，假定调用者已完成验证。","tags":"第5章;installd"},{"chapter":"第5章","front":"installd支持哪些命令？命令通过什么类发出？","back":"命令经无文档说明的<b>com.android.server.pm.Installer</b>类（PackageManager的Dalvik级API）发出，命令以表示长度的2字节字符串为前缀经socket发送：<b>ping</b>（检查连接状态）、<b>install pkgname uid gid seinfo</b>（SELinux上下文由seinfo指定）、<b>dexopt pkg_path uid is_public</b>（产生.odex文件）、movedex/rmdex、remove、rename、fixuid、freecache、rmcache/rmcodecache、getsize（返回目录占用空间）、rmuserdata、movefiles（执行/system/etc/updatecmds中的脚本）、linklib（链接原生库）、mkuserdata/mkuserconfig/rmuser、idmap（运行/system/bin/idmap）、restorecondata（恢复SELinux上下文）、<b>patchoat</b>（L版新增，修补OTA文件并重新加载到内存）。","tags":"第5章;installd"},{"chapter":"第5章","front":"keystore守护进程的作用是什么？各用户的密钥如何存储？4.4版起通信方式有何重大变化？","back":"keystore提供<b>密钥存储服务</b>；设计初衷是存任意name-value对，实践中只用来存密钥。定义：<code>service keystore /system/bin/keystore /data/misc/keystore</code>，class main，user keystore，group keystore drmrpc（参数为keystore文件存储目录）。JellyBean起每个用户有自己的keystore目录，第一用户（primary user）用<code>/data/misc/keystore/0</code>；用户keystore口令存放在<b>.masterkey</b>文件（用根据用户屏幕解锁密码推出的密钥加密）；各App的keystore存放在名为<b>AID_xxxxx</b>的文件中。4.4版起<b>不再使用socket</b>（与其他守护进程不同）：只能通过<b>servicemanager</b>以名称<b>android.security.keystore</b>访问；框架客户端是<b>java.security.Keystore</b>类（部分public方法被有意忽略）；<b>keystore_cli</b>命令行工具可部分地以原生代码访问。","tags":"第5章;keystore"},{"chapter":"第5章","front":"keystore提供哪些主要命令？","back":"由java.security.Keystore导出：<b>test()</b>（测试守护进程是否活跃）、<b>get(name)</b>、<b>insert(name,val,uid,flags)</b>、del、exist、<b>saw(prefix,uid)</b>（列出前缀匹配的键）、<b>reset()</b>（擦除keystore）、password（修改口令）、lock/unlock、zero（检查是否为空）、<b>generate</b>（产生公钥/私钥对存储为\"密钥\"，可签名、验证或提取公钥）、import_key、<b>sign(name,data)</b>（签名但不真正提取）、verify、get_pubkey、del_key、<b>grant/ungrant</b>（授权/撤销uid访问某密钥）、getmtime（最后修改时间）、<b>duplicate</b>（复制密钥到另一uid的keystore）、is_hardware_backed（keyType是否已由硬件keystore支持）、clear_uid/reset_uid/sync_uid/password_uid。","tags":"第5章;keystore"},{"chapter":"第5章","front":"keystore的密钥访问权限如何管理？出错码有哪些？","back":"密钥访问由<b>uid</b>管理（每个应用有私有存储）；keystore在init中写死类似ACL的<b>user_perms</b>权限数组：<b>AID_SYSTEM</b>全局皆可访问、<b>AID_VPN和AID_WIFI</b>仅get/sign/verify时、<b>AID_ROOT</b>最受限制只允许get（但su到AID_SYSTEM轻而易举）。出错码（keystore.h定义，keystore_cli翻译为字符串）：1 NO_ERROR、2 LOCKED、3 UNINITIALIZED、4 SYSTEM_ERROR、5 PROTOCOL_ERROR、6 PERMISSION_DENIED、7 KEY_NOT_FOUND、8 VALUE_CORRUPTED、10-13 WRONG_PASSWORD_[0123]（错误尝试倒计数）、14 SIGNATURE_INVALID。","tags":"第5章;keystore"},{"chapter":"第5章","front":"debuggerd的作用是什么？Android linker自动为所有进程安装了哪些崩溃信号的处理句柄？","back":"debuggerd（<b>崩溃报告守护进程</b>）作用类似iOS的Crash Reporter：收集应用崩溃数据。桌面系统崩溃产生core dump，但移动设备存储空间有限、core dump动辄几百MB，保存和拷出都不现实。debuggerd平时休眠，应用崩溃时（根据socket中的事件）被唤醒。感谢Android的linker，所有进程都自动安装信号处理句柄处理：<ul><li><b>SIGILL</b>：非法指令（错误的机器码）</li><li><b>SIGTRAP</b>：调试陷阱（断点）</li><li><b>SIGABRT</b>：主动中断（断言失败）</li><li><b>SIGBUS</b>：总线错误（MMU出错）</li><li><b>SIGFPE</b>：浮点异常（除零错）</li><li><b>SIGSEGV</b>：段违规（使用NULL指针）</li><li><b>SIGPIPE</b>：管道破裂（pipe另一端进程突然中止）</li></ul>处理方式统一：调用debugger_signal_handler，通过socket连接debuggerd发消息唤醒它。","tags":"第5章;debuggerd"},{"chapter":"第5章","front":"debuggerd如何生成tombstone？tombstone保存在哪里？调试模式（debug.db.uid）如何工作？","back":"debuggerd用<b>ptrace(2)</b>附加（attach）到出错的进程，获取崩溃信号并查看进程内存数据；<b>不产生完整core dump</b>，而是抓到崩溃本质原因并做基本崩溃处理。tombstone（崩溃报告）保存到<b>/data/tombstones</b>目录；可能包含虚拟机级数据，以及ActivityManager的NativeCrashReporter通过<b>/data/system/ndebugsocket</b>输出给debuggerd的数据。64位系统还有<b>debuggerd64</b>程序，处理不同指令集、内存布局和ABI。调试模式：debug.db.uid设为崩溃进程的uid时，debuggerd把该进程<b>暂停在崩溃瞬间</b>，等待用户启动<b>gdbserver</b>（连5039端口）并用<code>gdbclient app_process:5039</code>连接；logcat输出I/DEBUG消息提示按HOME或VOLUME DOWN键让进程继续崩溃；用EV_*系列API等待实体按键，并点亮呼吸灯（红色）提醒。<br><b>重新启用core dump</b>：在代码中用signal()（或sigaction）注册信号处理函数替代默认处理（如signal(SIGSEGV, SIG_DFL)后制造空指针解引用）；必须在<b>JNI库</b>（如JNI_OnLoad）中做，不能在Java层完成；需先<b>ulimit -c unlimited</b>（默认限制为0）；程序不能在只读的根文件系统中运行；可用sysctl或/proc设置<b>kernel.core_pattern</b>（需root）调整输出文件名；在core_pattern第一个字符前加<b>管道符|</b>可在core dump产生时运行任意程序并把core作为其标准输入——debuggerd可以（且应该可以）用这种方式实现。","tags":"第5章;debuggerd"},{"chapter":"第5章","front":"gatekeeper（Android M新增）的作用是什么？利用TEE比直接存Hash更安全在哪里？","back":"gatekeeper通过<b>可信执行环境（TEE, Trusted Execution Environment）</b>增强存储passcode的安全性。TEE在ARM处理器中由<b>TrustZone</b>实现：在独立于主操作系统的环境中运行微型操作系统，独立性和代码完整性有保证；秘密信息只能单向存入不能提取。gatekeeper把passcode（图形锁、PIN码、口令）加密为TEE能\"接受\"的blob：生成过程需要<b>硬件中存储的密钥</b>参与，加密结果（实际仍是passcode的Hash）存放在<code>/data/misc/gatekeeper</code>。比直接把Hash存文件系统更安全：Hash被读出后可离线暴力/字典攻击（甚至分布式）；涉及硬件则强制<b>本机操作、限制请求频率和次数</b>，大幅减缓暴力攻击——接近iOS的硬件加密标准（2016年3月FBI与苹果之争中被证明）。","tags":"第5章;gatekeeper"},{"chapter":"第5章","front":"gatekeeper如何对外提供服务？其实现分层是怎样的？","back":"通过<b>Binder</b>对外提供服务，导出<b>android.service.gatekeeper.IGateKeeperService</b>接口；主要客户端是<b>LockSettingsService</b>；不向开发者提供API，被整合进keystore服务。具体实现留给设备制造商：谷歌只提供<b>HAL（硬件抽象层）模块</b>（把TrustZone作为其\"可以信赖的\"TEE OS一部分）；HAL上的接口有多层抽象：keystore→HAL→gatekeeper→TZ daemon（如qseecomd）→SVC instruction→TZ driver→SMC instruction→TZOS。","tags":"第5章;gatekeeper"},{"chapter":"第5章","front":"sdcard守护进程的作用是什么？FUSE机制的原理和优缺点是什么？","back":"sdcard在<b>用户态提供SD卡支持</b>，包括在不支持权限管理的FAT文件系统上强制使用权限管理。基于<b>FUSE</b>（File systems in USEr mode，用户态文件系统）机制：内核注册stub文件系统，把对该文件系统的所有调用传递给用户态进程（sdcard）处理。请求流程：客户端进程发起文件系统请求→system_call()→VFS层确定目标是FUSE→FUSE驱动把请求发给FUSE服务端（sdcard）→sdcard强制执行权限校验后把请求发给底层文件系统→数据原路返回。优点：比内核态实现更灵活、可靠，能抵御不可信（甚至恶意）代码对数据结构的破坏，适合使用不频繁的文件系统；缺点：内核态/用户态间数据往返导致很大开销，其他情况下性能极低。","tags":"第5章;sdcard"},{"chapter":"第5章","front":"sdcard的命令行参数有哪些？它如何挂载FUSE文件系统？","back":"<ul><li><b>-u uid</b>：以哪个用户ID运行，也是文件系统所有者，通常1023（AID_MEDIA_RW）</li><li><b>-g gid</b>：以哪个组ID运行，通常1023（AID_MEDIA_RW）</li><li><b>-l path</b>：文件系统真正的mount点</li><li><b>-t #</b>：线程数（默认2）</li><li><b>-w</b>：指定本次mount是模拟的（legacy/emulated）mount，设备并没真的装SD卡</li><li><b>-d</b>：从路径中继承权限；<b>-s</b>：为media、av等分割权限</li></ul>处理参数后打开设备节点<b>/dev/fuse</b>（与内核通信），调用mount(2) mount FUSE文件系统（参数写死：fd=/dev/fuse,rootmode=40000,default_permissions,allow_other,user_id=uid,group_id=gid），降权后调用ignite_fuse()进入消息循环处理/dev/fuse请求。","tags":"第5章;sdcard"},{"chapter":"第5章","front":"如何实时观察sdcard处理的FUSE请求？","back":"无论有无实体SD卡都会用sdcard：/data/media通过一个sdcard实例mount到/mnt/shell/emulated；实体SD卡mount会再多一个sdcard实例（mount | grep fuse可查；busybox ps -w或cat /proc/pid/cmdline看完整命令行）。直接trace主线程可能一无所获，sdcard中<b>任何线程都可服务FUSE请求</b>；须先查看<b>/proc/$SDCARD_PID/task</b>里的线程再逐个strace（-f参数没用，因为线程在attach前已创建）。经验：同时用两个adb会话——一个trace sdcard线程，另一个操作FUSE文件系统（如ls -l /storage/ext_sd）；可见客户端请求确实经sdcard代理转发（read从/dev/fuse读请求、stat64执行、write写回等）。","tags":"第5章;sdcard"},{"chapter":"第5章","front":"Zygote的作用是什么？它在init.rc中如何定义？\"真正的名字\"是什么？","back":"Zygote以提供一台<b>初始化完毕的空Dalvik虚拟机</b>（就差加载main类）的形式，对所有Android框架运行时服务提供核心支持。init.rc定义：<code>service zygote /system/bin/app_process -Xzygote /system/bin --zygote --start-system-server</code>，class main，<b>socket zygote stream 660 root system</b>，onrestart write /sys/android_power/request_state wake、write /sys/power/state on、restart media、restart netd。\"真正的名字\"是<b>app_process</b>；Zygote（生物学上\"受精卵\"之意）成了绰号：可加载任意给定的Dalvik类、把进程拥有者切换为任意用户，但这种演化是单向不可逆的（与受精卵相似）。","tags":"第5章;Zygote"},{"chapter":"第5章","front":"app_process的--zygote和--start-system-server参数分别做什么？App的启动机制和权限模型是怎样的？有哪些历史漏洞？","back":"--zygote和--start-system-server令虚拟机加载<b>Zygote类</b>，并fork()出一个被用作<b>system_server</b>的新进程；system_server继续加载所有Android运行时框架；Zygote绑定/dev/socket/zygote监听请求。<b>App启动机制</b>：请求中包含要求加载的类名，Zygote只需<b>fork()</b>出新进程并在新进程中加载指定类；从Linux角度看，所有App甚至Zygote本身都不过是<b>app_process的实例</b>，只是被重命名（ls -l /proc/pid/exe可验证）。<b>权限模型</b>：Zygote必须保留root权限和权能集中所有权能；fork()之前放弃所有权限，调用setuid(2)/setgid(2)把所有者设为目标App的AID，此操作在加载App代码之前完成，可认为是安全的。<b>历史漏洞</b>：Froyo的Zysploit（未检查setuid(2)的返回值）、2013年的fork-bomb拒绝服务攻击。推论：所有App都是Zygote的子进程，唯一例外是命令行直接调用app_process的情况。","tags":"第5章;Zygote"},{"chapter":"第5章","front":"Zygote孵化模型带来哪两大好处？其缺点是什么？","back":"两大好处：<ul><li><b>应用启动时间大大缩短</b>：实际开销主要在加载构成Android框架的大量运行时类上；Zygote让App像长跑赛临近终点才插进比赛，只跑最后冲刺</li><li><b>优化共享内存</b>：所有虚拟机从Zygote fork()而来，享受内核内存共享：大部分只读内存（类实现代码）物理内存中只保留一份共享；写读内存（类数据）只在绝对必要时分配页（<b>写时复制copy-on-write</b>）；大多数Android应用与其他应用（包括system_server，第一个真正的完整虚拟机实例）共享80%~90%的内存，使低内存设备也能塞进不少应用（可用procrank和librank查看实时内存使用）</li></ul>缺点：所有应用从同一进程fork()会有效破坏<b>ASLR（地址空间布局随机化）</b>——对性能的渴求压倒了安全需求；学术研究建议用<b>Morula</b>（受精卵卵裂后的桑葚胚）作为替代方案（仍影响ASLR但已有改进）；使用ART后Zygote更有效（所有预加载类已预编译），但32位和64位地址空间布局并不兼容。","tags":"第5章;Zygote"},{"chapter":"第5章","front":"64位系统上Zygote 32与Zygote 64如何共存？","back":"64位架构上保持32位兼容：现在有<b>两个版本</b>的Zygote。64位Zygote占用<b>zygote</b> socket，32位\"zygote_secondary\"需要另一个socket（init.zygote64_32.rc）：service zygote用<code>/system/bin/app_process</code>；service zygote_secondary用<code>/system/bin/app_process32 -Xzygote /system/bin --zygote --socket-name=zygote_secondary</code>，socket zygote_secondary stream 660 root system，onrestart restart zygote。对用户App<b>透明</b>：App不知道自己是哪个zygote的实例；不同Zygote加载不同的库，JNI也不同——32位用<b>/system/lib</b>，64位用<b>/system/lib64</b>（cat /proc/pid/maps可见内存使用差异）。","tags":"第5章;Zygote"},{"chapter":"第6章","front":"上一章的原生级(native-level)服务与本章的框架服务有何区别？","back":"上一章服务用<b>C/C++</b>实现、Java层无直接编程接口，属于支持操作系统自身的服务；框架服务由<b>Dalvik虚拟机级框架</b>提供、带Java接口，大多运行在<b>system_server</b>进程中，可在servicemanager帮助下被找到。servicemanager与system_server联手提供整个Android框架服务架构的支持和上下文环境。","tags":"第6章;框架服务"},{"chapter":"第6章","front":"servicemanager在Android框架服务架构中扮演什么角色？","back":"servicemanager扮演<b>端点映射器(endpoint mapper)</b>角色，即服务的<b>服务定位器/索引目录</b>：服务必须先注册才能被找到，客户端必须先到servicemanager<b>查询获得句柄(handle)</b>才能使用其他服务。若它挂掉，进程间通信(IPC)将无以为继。","tags":"第6章;servicemanager"},{"chapter":"第6章","front":"servicemanager在init中的地位如何？如果它崩溃会发生什么？","back":"servicemanager被init归类为<b>core类</b>服务，由<b>critical</b>关键字修饰。其他关键服务依赖它：它崩溃则这些服务必须重启；重启后再崩溃则init不断重启它；仍不能解决则<b>系统重启</b>或进入<b>recovery模式</b>。servicemanager重启后索引目录从零重建，所有服务必须重新注册。","tags":"第6章;servicemanager"},{"chapter":"第6章","front":"什么是context manager？它与Binder及servicemanager是什么关系？","back":"IPC由内核组件<b>binder</b>提供，用户态通过字符设备节点<code>/dev/binder</code>访问。同一时刻<b>只有一个用户态进程</b>可使用Binder中的context manager，它是系统中所有客户端/服务端进程的<b>汇接点</b>：服务须把服务名及接口注册在context manager中，客户端须通过检索context manager找到要用的服务。servicemanager就是使用context manager角色的那个用户态进程。","tags":"第6章;servicemanager;Binder"},{"chapter":"第6章","front":"servicemanager的实现由哪三大函数调用构成？各自的作用是什么？","back":"servicemanager是很小的二进制可执行文件，流程为：<ul><li><code>binder_open</code>：获取<code>/dev/binder</code>的文件描述符</li><li><code>binder_become_context_manager</code>：注册ServiceManager服务，handle索引值为<b>0</b></li><li><code>binder_loop</code>：进入无限循环，阻塞直到/dev/binder产生transaction，被唤醒后调用<b>svcmgr_handler</b>回调处理</li></ul>","tags":"第6章;servicemanager"},{"chapter":"第6章","front":"客户端C/C++代码如何获得IServiceManager接口？其请求码有哪些？","back":"调用<code>defaultServiceManager()</code>获得<code>sp&lt;IServiceManager&gt;</code>接口句柄（定义于IServiceManager.h）。导出的transaction请求码：<ul><li><b>SVCMGR_ADD_SERVICE</b>→addService(name, service, allowIsolated)：注册服务，allowIsolated决定是否允许沙箱中被隔离的进程连接</li><li><b>SVCMGR_GET_SERVICE / SVCMGR_CHECK_SERVICE</b>→checkService(name)：获得指定名称服务的句柄</li><li><b>SVCMGR_LIST_SERVICE</b>→listServices()：返回所有服务列表，供service list命令使用</li></ul>","tags":"第6章;servicemanager"},{"chapter":"第6章","front":"servicemanager没有删除服务的API，那服务是如何被自动删除的？","back":"进程死后<b>Binder检测到并向servicemanager发送BR_DEAD_BINDER</b>（进程死亡通知），服务被自动删除。","tags":"第6章;servicemanager;Binder"},{"chapter":"第6章","front":"addService的注册权限是如何控制的？哪些uid可以自由注册？","back":"addService很敏感：只有uid为<b>0(root)</b>或<b>1000(AID_SYSTEM)</b>的服务能自由注册。KitKat起由源码中写死的<b>allowed数组</b>限制（如AID_MEDIA→media.audio_flinger、media.camera；AID_DRM→drm.drmManager；AID_NFC→nfc；AID_BLUETOOTH→bluetooth等）；Lollipop后移到<b>SELinux的service_contexts文件</b>，对所有服务的注册和查找强制安全检查，制造商无需重新编译源码即可添加自己的服务。","tags":"第6章;servicemanager;安全"},{"chapter":"第6章","front":"Lollipop前后，servicemanager的服务注册权限控制机制有什么变化？","back":"KitKat时由源码中写死的<b>allowed数组</b>限制（service_manager.c）；Lollipop后移到<b>SELinux的/service_contexts文件</b>，system_server.c简化为调用<code>check_mac_perms()</code>→<code>selinux_check_access()</code>，对所有服务的注册和查找强制安全检查，制造商无需重新编译源码即可添加自己的服务。","tags":"第6章;servicemanager;SELinux"},{"chapter":"第6章","front":"Java层访问servicemanager的API是什么？Android为什么 discourage App直接使用？","back":"编程API打包在<code>android.os.ServiceManagerNative</code>中，由<code>android.os.ServiceManager</code>进一步封装。Android不鼓励App直接使用，希望开发者调用<b>Context.getSystemService()</b>查找系统服务、通过<b>intent</b>使用第三方服务。通信都通过binder消息完成，servicemanager只是服务目录。","tags":"第6章;servicemanager"},{"chapter":"第6章","front":"servicemanager内部如何实现服务的注册与查找（svcinfo结构体）？","back":"<b>注册</b>时servicemanager分配<b>svcinfo</b>结构体，填入服务名和引用，加入svclist链表；<b>查找</b>时遍历<b>svclist链表</b>匹配名称，返回<b>ptr字段</b>中的服务引用。","tags":"第6章;servicemanager"},{"chapter":"第6章","front":"service list命令的作用是什么？它显示什么信息？","back":"<code>service list</code>列出所有已注册服务及其<b>公开接口</b>（服务名后方括号内）。Nexus 5(Android L)共<b>93个</b>服务（模拟器87个、KitKat 75个）。L新增telecomm、trust、jobscheduler等；模拟器没有sip、nfc、ethernet、display.qservice等。不同设备结果有差异（如平板没有Phone服务，还有厂商服务）。","tags":"第6章;命令实验"},{"chapter":"第6章","front":"service check、dumpsys命令分别有什么用途？","back":"<code>service check 服务名</code>：检查给定服务能否被连上（是否存活）。<code>dumpsys</code>：Binder接口定义<b>dump()</b>方法供诊断；不带参数时枚举所有服务依次列出，带参数时输出各服务的检查结果；有些服务导出<b>checkin</b>方法，在<code>dumpsys -c</code>或<code>--checkin</code>时被调用。","tags":"第6章;命令实验"},{"chapter":"第6章","front":"IPC与RPC有什么区别？两者的关系如何？","back":"<b>IPC</b>泛指进程间任何通信：消息传递、共享资源（共享内存）、同步对象（mutex等）。<b>RPC</b>特指隐藏过程调用通信细节的IPC：客户端调用本地方法，本地方法把参数序列化打包进消息发给服务端，服务端解序列化(deserialize)后执行并同样方式返回结果。<b>任何RPC一定是IPC，反之不一定</b>。","tags":"第6章;RPC"},{"chapter":"第6章","front":"RPC机制通常有哪四个共同特性？UNIX、OSX/iOS、Android各自的RPC机制是什么？","back":"RPC共同特性：<b>作用范围</b>、<b>索引目录</b>（定位服务的查询程序）、<b>预处理模块</b>（生成序列化/解序列化代码的工具）、<b>通信信道</b>。<ul><li>UNIX：SunRPC（本地/远程），portmapper，rpcgen，UDP/TCP</li><li>OSX/iOS：Mach（本地），launchd(mach_init)，mig，Mach消息</li><li>Android：Binder（本地），servicemanager，aidl，/dev/binder</li></ul>","tags":"第6章;RPC"},{"chapter":"第6章","front":"Android的Binder RPC作用范围为何限于本地？如何扩展到远程？","back":"Binder设计本意限于<b>本地</b>。可安装<b>本地代理(proxy)进程</b>对TCP/UDP数据做序列化/解序列化来扩展作用范围，对<b>远程访问工具(RAT)</b>极其有用。","tags":"第6章;RPC;Binder"},{"chapter":"第6章","front":"描述框架服务的通用调用模式（从getSystemService到实际服务调用）。","back":"<ul><li>服务使用前由server进程（通常<b>system_server</b>）通过<code>android.os.ServiceManager</code>注册</li><li>用户代码调用<code>Context.getSystemService(name)</code>→返回含指向服务的<b>私有格式Binder句柄</b>的\"Manager\"类实例（句柄会被<b>缓存</b>）</li><li>服务调用由Manager类代理，使用<b>AIDL</b>对通过Binder传递的RPC参数<b>序列化</b></li></ul>","tags":"第6章;AIDL;服务调用"},{"chapter":"第6章","front":"框架服务RPC调用模式的优点和缺点分别是什么？","back":"<b>缺点</b>：通信开销大——序列化/解序列化和进程上下文切换，性能损失可观。<b>优点</b>：设计简洁、权限隔离、安全性高——客户端是不可信的用户App（沙箱中），无权限，任何操作都须依赖服务调用，不能直接访问设备或数据存储；服务进程可信，负责所有安全检查。","tags":"第6章;RPC;安全"},{"chapter":"第6章","front":"Android与iOS分别在什么层面实现App的权限/安全控制？","back":"iOS用嵌入代码签名的<b>entitlement</b>（缓存于内核空间），App被\"关在监狱里\"(jailed)——\"越狱\"术语由来；Android用<b>manifest中的权限声明</b>，权限由<b>PackageManager</b>维护。两者都在<b>安装时检验</b>且应用无法修改。","tags":"第6章;安全"},{"chapter":"第6章","front":"什么是Parcel？getSystemService()返回的对象内部结构如何？","back":"<code>getSystemService()</code>返回的是\"<b>代理(Proxy)</b>\"，内部记录通过binder获得的指向实际服务的<b>引用(reference)</b>。Proxy的方法多是stub容器，称为\"<b>Parcel</b>\"，存放被序列化打包进Binder消息的参数。Parcel也是Binder对消息的称呼。","tags":"第6章;AIDL;Parcel"},{"chapter":"第6章","front":"AIDL是什么？它在构建过程中如何使用？","back":"AIDL（Android Interface Definition Language）<b>不是真正的语言</b>，是aidl SDK程序能读懂的Java衍生语言。build过程中遇到<b>.aidl文件</b>就调用<b>aidl工具</b>，自动生成序列化/解序列化的Java<b>样板代码(boilerplate)</b>。.aidl文件类似头文件：只定义方法不给实现，方法注释中的数字即序列化及service call使用的方法序号。","tags":"第6章;AIDL"},{"chapter":"第6章","front":"service call命令如何使用？参数类型有哪些？","back":"<code>service call</code>指定<b>服务名</b>和<b>方法序号</b>（按方法在.aidl文件中的出现顺序分配的流水号），按需附加参数。参数类型：<b>i32</b>（int型，实际可传任何32位变量如float）和<b>s16</b>（unicode字符串，实际可传任意对象）。示例：<code>service call phone 2 s16 \"foo\" s16 \"555-1234\"</code>调用ITelephony.call()打电话。","tags":"第6章;命令实验;service call"},{"chapter":"第6章","front":"service call的返回结果Parcel包含什么内容？","back":"至少一个32位返回值：<b>0x00000000</b>表示成功，其他为出错码（序号超范围通常返回0xffffffff或0xffffffb6 \"not a data message\"）。32位数后按AIDL定义可能跟一个i32或二进制数据块（长度+数据，通常为unicode字符串）。service以<b>十六进制</b>显示Parcel内容（辅以ASCII）。","tags":"第6章;命令实验;Parcel"},{"chapter":"第6章","front":"为什么程序中不要写死service call的方法序号？service call可能被拒绝吗？","back":"方法序号在<b>不同版本可能变化</b>（如KitKat的IDisplayManager和IPowerManager），应使用对应版本.aidl在编译时自动生成。只有有<b>公开接口</b>的服务可被调用；不同服务安全策略不同，请求可能被拒绝——例如以shell用户调用需MODIFY_PHONE_STATE权限的方法会返回出错消息；<b>root可绕过大多数权限检查</b>，从而近乎无限地使用框架服务。","tags":"第6章;命令实验"},{"chapter":"第6章","front":"Binder的历史起源是什么？它如何进入Android？","back":"Binder源自<b>BeOS</b>的Binder（底层支持BeOS各框架互联）。BeOS被Palm收购，Palm被HP并购，其操作系统成为WebOS基石；Binder幸存于Palm OS和Cobalt体系结构，也被Linux吸收（openbinder.org）。最早一批Palm开发者加盟Android并带来Binder，领头人是<b>Dianne Hackborn</b>（Android主要设计师）。Android的Binder实现与OpenBinder区别很大，更像BeOS中用作所有框架支撑点的设计用途。","tags":"第6章;Binder"},{"chapter":"第6章","front":"Binder究竟是什么？它提供哪四大功能？","back":"Binder是一种<b>RPC机制</b>：应用间以程序调用方式通信，无须关心消息收发细节。四大功能：<ul><li><b>找到服务端进程</b>（端点映射）：由servicemanager完成，维护接口名→Binder句柄的映射；句柄只有Binder知道真正含义，记录服务端进程的PID</li><li><b>传递消息</b>：AIDL生成序列化/解序列化代码，跨进程传递由Binder完成</li><li><b>传递对象</b>：包括文件描述符（如UNIX Domain socket）</li><li><b>安全认证</b>：Binder获取使用者的PID和UID并安全嵌入消息，服务端可按安全级要求做认证</li></ul>","tags":"第6章;Binder"},{"chapter":"第6章","front":"客户端如何通过ioctl向Binder发送消息？","back":"客户端用<b>BINDER_WRITE_READ</b>参数调用<code>ioctl(2)</code>发送消息并<b>阻塞到服务端返回</b>（先写后读）。","tags":"第6章;Binder"},{"chapter":"第6章","front":"Binder传递对象的能力有什么安全用途？","back":"Binder能传递<b>文件描述符</b>（如UNIX Domain socket），使可信进程（<b>system_server</b>）可用native代码为不可信进程（App）打开设备或socket——前提是App在manifest中声明了权限。","tags":"第6章;Binder;安全"},{"chapter":"第6章","front":"使用Binder的代码分为哪三个层次？每层有哪些组件？","back":"<ul><li><b>Java层</b>：AIDL生成的Proxy类和Stub类，android.os.Binder / android.os.IBinder</li><li><b>原生层</b>：android_util_binder等JNI组件，android::BBinder（libbinder.so）</li><li><b>内核层</b>：内核binder模块（通过/dev/binder访问）</li></ul>","tags":"第6章;Binder"},{"chapter":"第6章","front":"如何用bindump实验找出某个Binder服务正在被哪些进程使用？","back":"bindump（本书官网提供）：先打开指定服务的句柄（类似\"service check\"），再查<code>/sys/kernel/debug/binder/proc</code>下各进程伪文件获取<b>node ref号</b>；<b>node开头</b>的记录即所用服务的node ref，找到则该文件名（PID）就是使用者。binder调试数据全局可读，<b>未root设备也能用</b>。例如wallpaper服务(node ref 2034)被com.htc.launcher、com.android.systemui、servicemanager使用，Owner为system_server。","tags":"第6章;命令实验;bindump"},{"chapter":"第6章","front":"system_server是什么？它与Windows的svchost.exe有何异同？","back":"system_server是大部分框架服务的<b>宿主进程</b>，服务多以<b>线程</b>形式承载其中，类似Windows的svchost.exe（空壳容器进程）。区别：<b>svchost.exe加载DLL而system_server加载Java类</b>。同进程运行各服务更利于保护资源；风险是任一服务出错会波及其他服务，但能进来的只有Android系统服务。","tags":"第6章;system_server"},{"chapter":"第6章","front":"system_server是如何被启动的？它以什么身份运行？","back":"<b>Zygote</b>以<code>--start-system-server</code>参数<b>fork()</b>出system_server，调用startSystemServer()并传事先写好的参数——权能、--setgroups组成员、易读名system_server、要加载的类<code>com.android.server.SystemServer</code>。fork后子进程先<b>降权</b>再加载该类。权限：不以root执行但差不多——uid:gid为<b>system:system</b>、增强的权能、大量高权限服务的宿主。","tags":"第6章;system_server;Zygote"},{"chapter":"第6章","front":"SystemServer的main()启动后经历哪些初始化步骤？所有服务创建完后main线程做什么？","back":"main()先做基本初始化：<b>提升虚拟机限制</b>、加载<b>libandroid_servers.so</b>执行JNI组件初始化。高层流程：enable samplingprofiler（若启用每小时采样一次）、设置VMRuntime参数、Ensure prereqs、Set up Loopers/threads、用JNI加载native services、通过ActivityThread创建<b>SystemContext</b>、创建Java服务管理组件/<b>Watchdog</b>、启动各种服务。所有服务创建完毕后main线程进入<b>无限循环</b>（退出会抛运行时异常导致系统停工），不断轮询文件描述符（特别是Binder句柄）获取消息并分发给对应服务。","tags":"第6章;system_server"},{"chapter":"第6章","front":"Android L将system_server中的服务归入哪三个大类？各包含哪些服务？","back":"<ul><li><b>引导服务(Bootstrap)</b>：Installer、ActivityManagerService、PowerManagerService、DisplayManagerService、PackageManagerService、UserManagerService；还检测/data分区是否已加密或正在加密</li><li><b>核心服务(Core)</b>：LightsService、BatteryService、UsageStatsService、WebViewUpdateService（L新增）</li><li><b>其他服务</b>：剩余所有服务，数十个（源码注释：容纳所有有待重新归类和组织的服务的超级大口袋）</li></ul>并非所有服务对App可见：如installer是内部服务，不出现在service list结果中。","tags":"第6章;system_server"},{"chapter":"第6章","front":"Watchdog在system_server中起什么作用？","back":"Watchdog是system_server启动时创建的<b>Java服务管理组件</b>之一（在SystemContext创建后、启动各种服务前创建），用于监控系统服务是否正常工作（如服务线程死锁/无响应），必要时重启system_server以恢复系统。","tags":"第6章;system_server;Watchdog"},{"chapter":"第6章","front":"ro.factorytest属性如何影响system_server的启动行为？","back":"<b>ro.factorytest</b>属性：<ul><li><b>0(default)</b>=FACTORY_TEST_NONE：正常启动</li><li><b>1</b>=FACTORY_TEST_HIGH_LEVEL：不启动bluetooth、input、accessibility、lock setting等服务</li><li><b>2</b>=FACTORY_TEST_LOW_LEVEL：以uid 0运行，便于App工厂测试</li></ul>另外<code>ro.headless=1</code>时禁用WallPaper（壁纸）服务和System UI服务。","tags":"第6章;system_server"},{"chapter":"第6章","front":"config系统属性可以禁用哪些服务？","back":"config系统属性按项禁用：<code>disable_storage</code>→MountService；<code>disable_media</code>→AudioService、WiredAccessoryManager、CommonTimeManagementService；<code>disable_bluetooth</code>→BluetoothManagerService；<code>disable_location</code>→LocationManagerService、CountryDetectorService；<code>disable_systemui</code>→StatusBarManagerService；<code>disable_noncore</code>→UpdateLockService、LockSettingsService、TextServicesManager、SearchManagerService、WallpaperManagerService等；<code>disable_network</code>→NetworkStatsService、NetworkPolicyManagerService、WifiService、ConnectivityService等（disable_telephony未使用）。","tags":"第6章;system_server"},{"chapter":"第6章","front":"如何枚举system_server中的各个线程？TID有什么规律？","back":"通过<code>/proc</code>伪文件系统：遍历进程目录的<b>task/子目录</b>（每个线程有对应文件夹），线程名可在线程目录的<b>status文件</b>中看到。Dalvik创建线程时可命名，需调用底层<b>prctl(2)</b>系统调用，名称限制<b>16字符</b>。TID一般不可预测，但system_server大部分线程紧邻启动、<b>TID大致顺序增长</b>，可借此了解框架服务的启动顺序。","tags":"第6章;system_server;命令实验"},{"chapter":"第6章","front":"本章涉及的三个关键源码文件分别是什么？","back":"<ul><li><code>frameworks/native/cmds/servicemanager/service_manager.c</code>：servicemanager源码</li><li><code>frameworks/native/cmds/servicemanager/binder.[ch]</code>：Binder接口</li><li><code>frameworks/base/services/java/com/android/server/SystemServer.java</code>：SystemServer类</li></ul>","tags":"第6章;源码文件"},{"chapter":"第7章","front":"/proc伪文件系统中，为什么说/proc下的文件“不是真正的文件”？","back":"这些文件仅在访问时临时出现，用<b>ls查看时大小都为0</b>，内核维护它们<b>零开销</b>。<br>/proc是强大的trace机制，使用方式是<b>轮询polling</b>：没有数据变化回调，间隔太长可能错过事件，但零开销且格式便于人工读取解析。越新的内核伪文件越多。","tags":"第7章;/proc"},{"chapter":"第7章","front":"为什么查看当前shell进程要用$$而不是/proc/self？","back":"因为<b>/proc/self指向的是正在执行命令的进程</b>（如ls进程本身），而不是当前shell。<br>$是shell中代表当前shell PID的变量，用<b>echo $$</b>或/proc/$$/才能正确指向当前shell进程。","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid目录下仅有的三个符号链接是什么？各指向什么？","back":"<ul><li><b>cwd</b>：进程当前工作目录</li><li><b>exe</b>：execve(2)加载的可执行文件全路径</li><li><b>root</b>：指向进程的根目录，调用过chroot(2)的进程一眼可辨</li></ul>它们是/proc中仅有的三个符号链接，指向真实文件/目录，提供进程最重要的高层状态信息。fuser和lsof内部就用cwd/root。","tags":"第7章;/proc"},{"chapter":"第7章","front":"进程可用什么手段骗过ps修改进程名？为什么exe符号链接仍能识别真实可执行文件？","back":"进程可用<b>prctl(PR_SET_NAME)</b>修改进程名骗过ps。<br>但exe符号链接记录的是<b>execve(2)加载的可执行文件全路径</b>，改进程名改不了exe，所以exe仍能识别真实可执行文件。","tags":"第7章;/proc"},{"chapter":"第7章","front":"如何通过/proc的exe符号链接区分32位/64位Android应用？","back":"Dalvik应用由Zygote fork而来，进程名被改成主类名，但真正的可执行文件是<b>/system/bin/app_process</b>。<br>Android L中：<b>32位应用对应app_process32</b>，<b>64位应用对应app_process64</b>。<br>脚本技巧：cd /proc后用正则[0-9]*遍历数字目录，grep分析exe符号链接（输出丢弃>/dev/null只看退出码）。结果示例：system_server、zygote64是64位，zygote、com.google.android.apps.maps是32位。","tags":"第7章;/proc"},{"chapter":"第7章","front":"取进程名时，为什么用cat cmdline取argv[0]比comm更好？","back":"因为<b>comm最多只有16字节</b>，进程名过长会被截短。<br>而<b>cmdline文件记录的是argv[0]</b>（完整命令行第一个参数），能取得完整进程名。","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/fd目录中的文件描述符是什么？socket的符号链接为什么显示为socket:[inode编号]？","back":"文件描述符是<b>内核对象的句柄</b>，是进程打开文件数组中的索引。文件、管道pipe、套接字socket都映射为数字描述符，默认的stdin/stdout/stderr对应<b>0、1、2</b>。<br>/proc/pid/fd/中每个描述符是符号链接，ls -l即可看到打开的文件；<b>socket没有对应文件</b>，所以符号链接显示为<b>socket:[inode编号]</b>。非所有者需root权限才能查看。","tags":"第7章;/proc"},{"chapter":"第7章","front":"UNIX domain socket、基于IP的socket、Netlink socket分别通过/proc/net下哪个文件查看信息？","back":"<ul><li><b>UNIX domain socket</b>：仅本地通信，信息在<code>/proc/net/unix</code>；named的在/dev/socket有文件名（只为保证唯一性），@开头的是abstract socket</li><li><b>基于IP的socket</b>：对应<code>tcp、udp、tcp6、udp6</code>四个文件</li><li><b>Netlink socket</b>：高效的用户态/内核态通知机制，支持多播，信息在<code>/proc/net/netlink</code></li></ul>解析格式中含inode编号，可用grep按inode匹配找到socket的真实指向。","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/fdinfo目录记录什么？其中pos字段为什么被称为\"真正的宝藏\"？","back":"fd/中每个描述符在fdinfo/有同名文件记录元数据，供驱动和文件系统向用户空间传递描述符状态。<br><ul><li><b>flags</b>：open(2)传入的flags参数，定义在&lt;fcntl.h&gt;</li><li><b>pos</b>：文件指针当前位置</li></ul>pos被称为\"真正的宝藏\"，因为通过监控它<b>可以知道进程运行到什么地方</b>（如监视脚本读fdinfo/$FD并grep pos，比较OFFSET决定是否触发操作）。缺点是轮询机制可能错过变化。","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/status文件的本质是什么？","back":"内核把进程控制块<b>PCB（task_struct结构体）</b>以便于人类阅读的形式dump出来。<br>status是进程信息的<b>一站式存储中心</b>，包含Name、State、Tgid/Pid/PPid、TracerPid、Uid/Gid、FDSize、Vm*内存字段、Threads、信号位掩码、capabilities等。","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/status中的Name、State字段分别对应什么信息？State的S、R、T、D各代表什么？","back":"<ul><li><b>Name</b>：进程名，同/proc/pid/comm</li><li><b>State</b>：进程状态，S(sleeping睡眠)、R(running运行)、T(stopped停止)、D(uninterruptible sleep不可中断睡眠)</li></ul>","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/status中Tgid、Pid、PPid、TracerPid分别是什么？","back":"<ul><li><b>Tgid</b>：Thread Group id，真正的进程ID</li><li><b>Pid</b>：线程ID</li><li><b>PPid</b>：父线程组ID</li><li><b>TracerPid</b>：ptrace(2)附加的调试进程（strace、gdb、debuggerd）的PID，没有被调试则为0</li></ul>","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/status中的Uid/Gid包含哪四个值？Threads字段表示什么？","back":"<b>Uid/Gid</b>包含四个值：<b>Real（真实）、Effective（有效）、Set（保存设置）、File-System（文件系统）</b>。<br><b>Threads</b>：线程数，大于1即为多线程进程（如system_server为82）。","tags":"第7章;/proc"},{"chapter":"第7章","front":"/proc/pid/status中SigPnd、ShdPnd、SigBlk、SigIgn、SigCgt各是什么信号位掩码？","back":"<ul><li><b>SigPnd</b>：线程待决信号</li><li><b>ShdPnd</b>：进程共享待决信号</li><li><b>SigBlk</b>：被阻塞的信号</li><li><b>SigIgn</b>：被忽略的信号</li><li><b>SigCgt</b>：被捕获的信号</li></ul>","tags":"第7章;/proc"},{"chapter":"第7章","front":"pid、tid、tgid三者有什么区别？","back":"现代Linux以<b>线程为调度单位</b>：<br><ul><li><b>pid</b>实为线程ID</li><li><b>tgid</b>（Thread Group id）才是进程ID</li><li>主线程的pid与tgid相同，子线程的pid改变而tgid不变</li></ul>Android的ps把tgid输出为pid以兼容旧概念；Linux的ps -L把pid显示为LWP。","tags":"第7章;进程"},{"chapter":"第7章","front":"status中的PPid为什么准确说是\"父线程组ID\"？父进程对子进程负有什么责任？","back":"因为进程=线程组，PPid指向的是父进程（父线程组）的tgid，所以准确说是<b>父线程组ID</b>。<br>父进程负责<b>收集子进程的返回码</b>（main()返回值或exit()参数）；杀进程树时子孙进程一起被杀。","tags":"第7章;进程"},{"chapter":"第7章","front":"在/proc中，同一进程的各个线程目录里哪些内容相同，哪些不同？","back":"线程目录在<code>/proc/tgid/task/</code>下（/proc/tgid/task/tgid与/proc/tgid是同一回事）。<br><ul><li><b>相同</b>：进程级属性如maps、fd等</li><li><b>不同</b>：syscall、wchan等每线程各自独立</li></ul>procfs在ls /proc时会过滤子线程目录，但用cd加有效TID仍可直接切换进去。Android为每线程命名，可从线程名推断其作用。","tags":"第7章;进程"},{"chapter":"第7章","front":"Linux线程状态：TASK_RUNNING、TASK_INTERRUPTIBLE、TASK_UNINTERRUPTIBLE对应的ps值和含义是什么？","back":"<ul><li><b>TASK_RUNNING(0)→R</b>：正在running或runnable（内核视角二者无区别）</li><li><b>TASK_INTERRUPTIBLE(1)→S</b>：sleeping，可用信号唤醒</li><li><b>TASK_UNINTERRUPTIBLE(2)→D</b>：sleeping，不可唤醒</li></ul>","tags":"第7章;进程"},{"chapter":"第7章","front":"Linux线程状态：TASK_STOPPED、TASK_TRACED、TASK_ZOMBIE、TASK_DEAD对应的ps值和含义是什么？","back":"<ul><li><b>TASK_STOPPED(4)→T</b>：收到SIGSTOP或SIGTSTP进入stopped</li><li><b>TASK_TRACED(8)</b>：进程可被单步调试</li><li><b>TASK_ZOMBIE(16)→Z</b>：已退出，等待资源回收</li><li><b>TASK_DEAD(32)</b>：已退出，即将被销毁</li></ul>","tags":"第7章;进程"},{"chapter":"第7章","front":"线程被踢出CPU的两种情形是什么？各自产生什么类型的上下文切换？","back":"<ul><li><b>优先权</b>：时间片到点或更高优先级线程变runnable，产生<b>非自愿式（nonvoluntary）上下文切换</b>。非自愿切换次数异常多，暗示需调高优先级或线程太占CPU</li><li><b>休眠/等待</b>：STOP信号（CTRL-Z或kill -STOP/kill -CONT）、终端驱动发TSTP、主动sleep(2)或等mutex、等慢速I/O，均为<b>自愿式切换</b></li></ul>进入TASK_INTERRUPTIBLE还是UNINTERRUPTIBLE由系统调用及完成它的驱动决定。","tags":"第7章;进程"},{"chapter":"第7章","front":"为什么说Zombie和Dead不是真正的线程状态？僵尸进程由谁收尸？","back":"Zombie和Dead只为<b>返回码</b>而存在，不是真正的运行状态。<br>父进程收到<b>SIGCHLD</b>后应调用<b>wait族</b>系统调用收尸；若父进程失职，子进程就成为僵尸，只占进程表一条记录；<b>父进程死后由init（PID 1）收尸</b>。","tags":"第7章;进程"},{"chapter":"第7章","front":"/proc/pid/status的内存字段：VmPeak、VmSize、VmHWM、VmRSS分别是什么？","back":"<ul><li><b>VmPeak</b>：虚拟内存峰值，进程生命周期中VmSize的最大值</li><li><b>VmSize</b>：当前虚拟内存大小</li><li><b>VmHWM</b>：常驻内存集峰值，VmRSS的最大值</li><li><b>VmRSS</b>：当前常驻内存集（有物理页的虚拟页总和）</li></ul>看VmRSS可快速诊断内存泄漏（memory hogging），深入分析需/proc/pid/smaps。","tags":"第7章;内存"},{"chapter":"第7章","front":"/proc/pid/status的内存字段：VmData、VmStk、VmExe、VmLib分别对应什么？","back":"<ul><li><b>VmData</b>：数据段，即堆的内存</li><li><b>VmStk</b>：各线程的栈</li><li><b>VmExe</b>：可执行文件</li><li><b>VmLib</b>：共享库(.so)</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"/proc/pid/status的内存字段：VmLck、VmPin、VmPTE、VmSwap分别是什么？","back":"<ul><li><b>VmLck</b>：mlock(2)锁定的内存，通常为0</li><li><b>VmPin</b>：pinned内存，通常为0</li><li><b>VmPTE</b>：只记录在页表项中、未实际分配的页总和</li><li><b>VmSwap</b>：被页交换出去的内存；<b>Android无swap</b>，除非用ZRAM否则总为0</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"内存页按名称来源分为哪两类？按是否修改分为哪两类？","back":"<ul><li><b>named(mmapped)页 vs 匿名页</b>：从文件加载数据的为mapped页（文件名即其名）；栈和堆等没有对应文件的是匿名页</li><li><b>脏页 vs 干净页</b>：未被修改的为clean，修改过的为dirty；处理活跃/非活跃页和决定共享时都需要区分</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"什么是活跃页和非活跃页？非活跃干净页、非活跃脏页分别如何处理？","back":"内核和MMU用<b>LRU机制</b>：被访问即active（活跃），久未访问为inactive（非活跃）。<br><ul><li><b>释放（purging）</b>：非活跃且干净的页可直接回收再分配</li><li><b>回写（writeback）</b>：把脏页写回存储设备，防止掉电丢数据；匿名页只能写到swap(ZRAM)；参数在/proc/sys/vm</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"私有页和共享页分别如何产生？什么是隐含共享和写时复制？","back":"<ul><li><b>私有页</b>：MAP_PRIVATE的mmap(2)或malloc/new分配匿名页产生</li><li><b>共享页</b>：MAP_SHARED的mmap(2)、shm* API或/dev/ashmem，属显式共享；同一物理页映射到不同虚拟地址，修改立即反映到所有进程</li><li><b>隐含共享（implicit sharing）</b>：内核即使对MAP_PRIVATE也以共享形式加载只读库和框架（如Bionic）</li><li><b>写时复制（copy-on-write）</b>：进程要修改隐含共享页时经page fault中断，复制一份可写页替换，其他进程仍用原页</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"内存页生命周期的各个状态是什么？","back":"<ul><li><b>Free</b>：尚未分配</li><li><b>Active Clean</b>：最近被使用但未修改</li><li><b>Active Dirty</b>：最近被使用且已修改</li><li><b>Inactive Dirty</b>：久未访问且已修改，应写回文件或swap</li><li><b>Laundered</b>：正在写回文件或swap</li><li><b>Inactive Clean</b>：已写回或从未修改，可重新使用或释放</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"/proc/pid/maps中可执行文件通常映射为哪三段？权限中的p和s分别表示什么？","back":"可执行文件通常映射为三段：<br><ul><li>代码(text)：<code>r-xp</code></li><li>数据只读：<code>r--p</code></li><li>数据可读写：<code>rw-p</code></li></ul>权限中<b>p表示MAP_PRIVATE</b>，<b>s表示MAP_SHARED</b>。<br>maps中还有匿名保留区、匿名堆[heap]、Bionic代码/常量/数据段、guard页（防栈溢出）、[stack]等。更细看smaps，系统级看/proc/meminfo。","tags":"第7章;内存"},{"chapter":"第7章","front":"/proc/meminfo中MemTotal、Buffers、Cached、Shmem分别表示什么？","back":"<ul><li><b>MemTotal</b>：物理RAM减去保留部分</li><li><b>Buffers</b>：块缓存</li><li><b>Cached</b>：文件页缓存</li><li><b>Shmem</b>：显式共享内存总量</li></ul>其他关键字段还有MemFree、SwapCached（也在swap中的匿名内存）、Active/Inactive（分anon和file）、Unevictable、Mlocked、SwapTotal/SwapFree（64位L的swap是压缩内存ZRAM）、Dirty、Writeback、AnonPages、Mapped等。","tags":"第7章;内存"},{"chapter":"第7章","front":"用户模式内存的基本公式是什么？VmFileMapped和VmLazy各是什么含义？","back":"基本公式：<b>VmSize = VmRSS + VmFileMapped + VmSwap + VmLazy</b><br><ul><li><b>VmRSS</b>：常驻内存集，细分私有的Unique和共享的Shared</li><li><b>VmFileMapped</b>：mmap(2)从文件提取、释放时可写回的页；干净页释放时直接丢弃即可；不直接反映在status，可用smaps推算</li><li><b>VmSwap</b>：匿名页无文件可备份需swap分区；Android无swap故几乎总为0，除非用ZRAM</li><li><b>VmLazy</b>：懒惰分配，只在纸面上分配并记录在页表项VmPTE，真正访问时由MMU抛缺页错才实际分配；省内存但轻微影响性能，最坏情况无页可回收时触发OOM</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"VSS、RSS、USS、PSS四个内存术语的区别是什么？","back":"<ul><li><b>VSS</b>：虚拟内存总大小（VmSize）</li><li><b>RSS</b>：常驻内存集，各进程直接相加会重复计算共享页</li><li><b>USS</b>（Unique Set Size）：进程独占的私有内存</li><li><b>PSS</b>（Proportional Set Size）：按比例分摊共享页</li></ul>PSS = USS + 各共享区域大小除以共享进程数之和；私有页1KB算1KB，被n个进程共享的页每KB只算1/n KB。所有进程PSS相加，每个共享段恰好只记一次，精确得到系统物理内存使用量。PSS可直接从/proc/pid/smaps读取。","tags":"第7章;内存"},{"chapter":"第7章","front":"实验：两个进程共享同一代码段时，各进程的RSS、USS、PSS如何变化？为什么r-xp的p不阻止共享？","back":"单实例ping：代码段r-xp，Size 36KB、RSS 32KB，全为私有干净活跃页，<b>USS=PSS=32KB</b>。<br>开第二实例：RSS不变但全变共享页<b>Shared_Clean 32KB</b>，Private变0，<b>PSS减半为16KB</b>；三实例约10.6KB，四实例8KB；杀实例后PSS回升。<br>悖论解释：<b>r-xp的p指mmap(2)的MAP_PRIVATE参数而非private</b>；两进程映射相同内容时内核保留隐含共享权力，直到写操作触发写时复制；s对应MAP_SHARED为显式共享。","tags":"第7章;内存"},{"chapter":"第7章","front":"procrank和librank工具有什么区别？procrank的排序参数-v、-p、-r、-u分别按什么排序？","back":"二者都是AOSP工具，都读各进程smaps（新版还读page map）。<br><ul><li><b>procrank</b>：按进程排序输出</li><li><b>librank</b>：按内存段RSS降序并列出共享进程</li></ul>procrank参数：<b>-v按vss排序（默认）、-p按PSS、-r按RSS、-u按USS</b>；-c只显示cached页，-C只显示non-cached页（cached=storage backed，non-cached=ram/swap backed）。<br>输出特点：约85%～90%的RSS是共享的，多为Zygote和Dalvik/ART；RSS减USS得共享内存大小，PSS减USS得共享内存加权平均，相除可估算共享进程数。","tags":"第7章;内存"},{"chapter":"第7章","front":"什么是KSM（Kernel Samepage Merging）？","back":"KSM是内核特性（<b>2.6.27起</b>，后被引入Android），通过<b>比较Hash自动合并内容相同的物理页</b>（引入写时复制限制），以节省物理内存。","tags":"第7章;内存"},{"chapter":"第7章","front":"Linux的OOM机制如何工作？如何读取进程的oom_score？","back":"物理内存和swap都<b>不足时触发OOM</b>，遍历进程选受害者，实际执行<b>kill -9</b>。<br>候选进程按<b>oom_score启发式评分</b>排序（算法随内核版本不断调整），可在只读文件<code>/proc/pid/oom_score</code>读取。<br>启发式不一定可靠会误杀无辜，且杀进程立即果断无从反抗；App只能用回调保存状态到android.os.Bundle，系统保证下次启动恢复（iOS的jetsam连tombstone都不留）。","tags":"第7章;内存"},{"chapter":"第7章","front":"/proc/pid/oom_adj和oom_score_adj如何修正被杀概率？Android系统进程如何自我保护？","back":"<ul><li><b>用户空间修正</b>：写/proc/pid/oom_adj或较新内核的/proc/pid/oom_score_adj，<b>加负值降低被杀概率，加正值提高</b></li><li><b>系统进程自我保护</b>：init和init.rc启动的进程设<b>oom_adj为-16或-17（OOM完全不杀）</b>；新内核设<b>oom_score_adj为-1000</b>使oom_score接近0</li><li><b>防滥用</b>：ActivityManager在应用生命周期不同阶段自动重置oom_adj/oom_score_adj；Android L起通过lmkd服务调整（文件仅root可写）</li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"什么是Low Memory Killer（lmk）？Android L前后由谁设置其参数？","back":"Low Memory Killer是<b>抢在真正OOM之前先杀进程</b>的Android技巧。<br><ul><li><b>早期版本</b>：init在启动时设置sysfs中module/目录下的各参数（含各oom_adj级别和minfree阈值）</li><li><b>Android L起</b>：init只确保sysfs伪文件权限正确，设置参数留给<b>lmkd守护进程</b></li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"实验：如何观察App切后台时oom_score修正值的变化？kill -STOP挂起lmkd会发生什么？","back":"打开App（如Chrome）并开adb shell：<b>ps找出PID后cat /proc/PID/oom_adj、oom_score_adj、oom_score</b>。<br><ul><li>前台时修正值小；<b>按Home切后台后修正值自动变大</b>，oom_score随之变大</li><li>Android L中可在lmkd上附加调试器（trace）观察ActivityManager发给lmkd的消息</li><li><b>用kill -STOP挂起lmkd会使所有调整oom_score修正值的行为失效</b></li></ul>","tags":"第7章;内存"},{"chapter":"第7章","front":"进入内核模式的系统调用指令：ARM和Intel分别用什么？系统调用号通过哪个寄存器传递？","back":"用户态线程做任何有意义操作（文件、socket、资源处理）都需请求内核服务即系统调用。<br><ul><li><b>ARM</b>：SVC指令（又名SWI）</li><li><b>Intel</b>：SYSENTER（或SYSCALL）指令</li></ul>这些指令把处理器改为<b>特权（privileged/supervisor）模式</b>，控制权转到内核入口点<b>system_call</b>。<br>系统调用号：<b>ARM用r12寄存器，Intel用EAX寄存器</b>传来，内核据此查内部地址表，跳转到对应服务函数。","tags":"第7章;系统调用"},{"chapter":"第7章","front":"toolbox ps中WCHAN列和PC列分别表示什么？","back":"<ul><li><b>WCHAN</b>：Wait Channel缩写，表示进程或内核线程当前在内核中执行到的地址；不能确定时记为0或ffffffff</li><li><b>PC</b>：用户态返回地址（64位设备上直到Android M仍有只当32位值的bug）</li></ul>除非用ps -t，ps每行表示一个内核线程或某进程的主线程。","tags":"第7章;系统调用"},{"chapter":"第7章","front":"如何手工解析WCHAN地址所属的内核函数？/proc/sys/kernel/kptr_restrict的作用是什么？","back":"用<code>/proc/kallsyms</code>解析：它<b>只记录函数起始地址</b>，而WCHAN一般是函数内部地址。<br>步骤：<br><ul><li>先禁用内核指针隐藏：<code>echo 0 &gt; /proc/sys/kernel/kptr_restrict</code>（0完全禁用，1仅root）</li><li>逐位去掉地址末位十六进制数字用grep搜前缀，如c0029d失败、c0029得多个结果、c0029c得do_sigtimedwait</li><li><b>最接近且在搜索地址之前</b>的结果即答案</li></ul>Android M预览版toolbox会自动查/proc/pid/wchan映射函数名。","tags":"第7章;系统调用"},{"chapter":"第7章","front":"/proc/pid/task/tid/下的wchan文件和syscall文件各记录什么？syscall文件的格式是什么？","back":"<ul><li><b>wchan文件</b>：记录线程休眠时在内核中执行到的地址（活跃时为0），已自动解析为最近的内核函数名，kallsyms受限时也能工作</li><li><b>syscall文件</b>：记录当前请求的系统调用号及相关参数。格式：<b>syscall号、Arg1～Arg5、Stack Pointer、Program Counter</b></li></ul>例：syscall 22在ARM64上即epoll_wait，可由wchan（sys_epoll_wait）印证。系统调用号与体系结构有关，32位和64位也不同；可查NDK中platforms/android-APIversion/arch-arch/usr/include/asm/unistd.h（arch为arm、arm64、x86或x86_64）。大多数内核还提供stack文件记录内核栈详细信息。","tags":"第7章;系统调用"},{"chapter":"第7章","front":"strace相比基于轮询的/proc方法有什么优势？","back":"/proc方法基于轮询，一次只能抓一个系统调用，适合诊断已挂起或失去响应的进程。<br><b>strace可隐蔽地附加进程并在每次系统调用执行时得到通知</b>，在理解系统调用参数时非常好用。<br>缺点：<b>无Android版也无ARM64兼容版</b>，本书官网提供strace的克隆版<b>jtrace</b>（修复了部分bug）。","tags":"第7章;系统调用"},{"chapter":"第7章","front":"strace的-p、-f、-o、-c参数分别是什么作用？","back":"<ul><li><b>-p pid</b>：附加到正在运行的进程</li><li><b>-f</b>：目标使用clone()时自动附加子进程/线程</li><li><b>-o file</b>：输出结果保存到指定文件</li><li><b>-c</b>：统计模式，汇总各系统调用次数与耗时</li></ul>","tags":"第7章;系统调用"},{"chapter":"第7章","front":"strace的-t/-tt/-ttt、-v/-vv、-e trace=…参数分别是什么作用？","back":"<ul><li><b>-t/-tt/-ttt</b>：以不同格式和精度在每行输出前加时间信息</li><li><b>-v/-vv</b>：输出所有系统调用参数的详细模式</li><li><b>-e trace=…</b>：按系统调用名过滤，只跟踪指定的系统调用</li></ul>","tags":"第7章;系统调用"},{"chapter":"第8章","front":"移动安全威胁建模中，攻击者的牟利方式发生了怎样的变化？","back":"从早期的<b>远程完全控制</b>（pwning，完全接管设备）转向只需<b>获取用户数据</b>并将其传往一直在线的接收端——不必控制设备，偷到数据即可牟利。移动设备高度便携、更私人化、易丢失被盗、记录大量隐私，因此成为比服务器和个人电脑更有利可图的目标。","tags":"第8章;威胁建模"},{"chapter":"第8章","front":"Android威胁模型中的四大攻击向量是什么？","back":"<ul><li><b>物理接触</b>：房间加锁、密钥卡等安保措施对移动设备无法实施</li><li><b>不靠谱的App</b>：主要攻击向量来自内部，典型是本地提权（local privilege escalation）攻击</li><li><b>不靠谱的用户</b>：手机易被偷，须在脱离掌控时保持安全</li><li><b>远程代码注入</b>：恶意短信/彩信、网页（HTML/CSS/JavaScript）、社工邮件等</li></ul>","tags":"第8章;威胁建模"},{"chapter":"第8章","front":"针对\"不靠谱的App\"，Android在设计上采取了哪些防护措施？","back":"<ul><li><b>默认最小权限集</b>：敏感权限（如网络访问）不在最小权限集中，需在AndroidManifest.xml中显式声明</li><li><b>每应用分配唯一uid</b>：应用无法以root运行</li><li><b>SELinux</b>：Jelly Bean 4.3引入，Lollipop扩展到包级限制</li></ul>应用还可能攻击系统中更高权限（尤其root）组件的漏洞完成提权。","tags":"第8章;威胁建模"},{"chapter":"第8章","front":"针对\"不靠谱的用户\"，Android采取了哪些防护设计？","back":"<ul><li><b>屏幕解锁密码</b>（PIN/图形/口令/人脸解锁，Lollipop起支持指纹与蓝牙穿戴设备解锁）作为第一道防线</li><li><b>启动安全</b>：Boot Loader默认加锁，一旦解锁立即擦除/data分区</li><li><b>数据加密</b>：Honeycomb起提供，Lollipop设为默认；密钥从屏幕解锁密码推导，不能存放于手机</li></ul>","tags":"第8章;威胁建模"},{"chapter":"第8章","front":"StageFright漏洞是怎么回事？","back":"2015年7月由Joshua Drake发现的漏洞（CVE-2015-3824，位于<b>mediaserver</b>）：恶意彩信中的视频可<b>零交互</b>触发远程代码执行。与KEEN team在BlackHat 2015公开的内核提权漏洞（IPPROTO_ICMP socket）配合可实现root，后者被用于<b>pingpong root</b>工具。","tags":"第8章;威胁建模;StageFright"},{"chapter":"第8章","front":"Android的受攻击面主要来自哪些方面？","back":"<ul><li>源自<b>Android</b>本身：AOSP框架、守护进程</li><li>源自<b>厂商</b>：闭源定制代码、预装App</li><li>源自<b>第三方</b>：wpa_supplicant、mdnsd、racoon等原生库</li><li>源自<b>Linux内核</b></li></ul>厂商常不再支持上市超两年的设备、补丁拖拉；结论：安全性必须在Linux与Android两个世界同时搞定。","tags":"第8章;威胁建模"},{"chapter":"第8章","front":"AID_ROOT、AID_SYSTEM、AID_RADIO、AID_SHELL的值分别是多少？","back":"<ul><li><code>AID_ROOT = 0</code>（uid 0无所不能）</li><li><code>AID_SYSTEM = 1000</code></li><li><code>AID_RADIO = 1001</code>（/dev/socket/rild、net.*radio.*属性）</li><li><code>AID_SHELL = 2000</code></li></ul>系统AID定义在<code>android_filesystem_config.h</code>中，1000~9999为系统保留区间。","tags":"第8章;Linux安全;AID"},{"chapter":"第8章","front":"Android应用的uid从什么数值开始分配？bionic如何显示？","back":"应用安装时PackageManager分配唯一应用ID，取值<b>10000~99999</b>。bionic将其映射为<code>u0_a123</code>等<code>uXX_aYYY</code>可读格式（XX为用户编号、YYY为应用编号）。Android的\"用户\"分配给应用而非人类；iOS则所有进程运行在mobile（501）同一uid下靠内核沙箱隔离。","tags":"第8章;Linux安全;AID"},{"chapter":"第8章","front":"列举几个关键AID及其对应资源（AID_GRAPHICS、AID_MOUNT、AID_WIFI、AID_INSTALL、AID_KEYSTORE、AID_NFC）。","back":"<ul><li><code>AID_GRAPHICS=1003</code>：/dev/graphics/fb0帧缓存</li><li><code>AID_MOUNT=1009</code>：/dev/socket/vold</li><li><code>AID_WIFI=1010</code>：/data/misc/wifi</li><li><code>AID_INSTALL=1012</code>：installd，应用数据目录拥有者</li><li><code>AID_KEYSTORE=1017</code>：/data/misc/keystore</li><li><code>AID_NFC=1027</code>：com.android.nfc</li></ul>系统AID多兼作GID，供system_server/adb/installd加入以获得设备与文件访问权。","tags":"第8章;Linux安全;AID"},{"chapter":"第8章","front":"Android的网络GID（3000~3999区间）是如何强制检查的？列举关键条目。","back":"内核配置<code>CONFIG_PARANOID_ANDROID</code>置1时，对3000~3999区间的GID在套接字代码中强制检查（netd因以root运行可撤销自身GID）。<ul><li><code>3001 AID_BT_ADMIN</code>：AF_BLUETOOTH套接字</li><li><code>3003 AID_NET_INET</code>：/dev/socket/dnsproxyd、AF_INET[6]</li><li><code>3004 AID_NET_RAW</code>：raw套接字</li><li><code>3005 AID_NET_ADMIN</code>：配置网卡路由表</li></ul>","tags":"第8章;Linux安全;AID"},{"chapter":"第8章","front":"什么是isolated service？其uid区间是多少？","back":"Jelly Bean 4.1引入的<b>独立uid进程</b>，uid区间<b>99000~99999</b>（AID_ISOLATED_START~END）。servicemanager拒绝其一切服务请求，只能处理内存中的数据。典型使用者为Chrome的浏览器渲染进程。","tags":"第8章;Linux安全"},{"chapter":"第8章","front":"Android中哪些进程仍必须以root运行？","back":"<ul><li><b>init</b>（pid 1，须启动其他进程）</li><li><b>ueventd</b></li><li><b>healthd</b></li><li><b>zygote</b>（fork后setuid改AID并为system_server保留权能）</li><li><b>debuggerd[64]</b>（生成tombstone需ptrace）</li><li><b>adbd</b>（ro.debuggable=1且ro.secure=0时adb shell直接获得root）</li><li><b>vold</b>（mount/unmount，历史上是root跳板重灾区）</li><li><b>netd</b>、<b>lmkd</b></li></ul>减少root进程是为了缩小受攻击面（installd从JellyBean起放弃root）。","tags":"第8章;Linux安全"},{"chapter":"第8章","front":"Linux权能（capabilities）的设计思想是什么？","back":"打破root\"要么全能要么无能\"的二元的模型，把root权限切成<b>bitmask中互不相交的子权限</b>，是最小权限原则的实现，可用来限制root本身。它解决了SetUID的固有问题：符号链接、竞争条件、代码注入（shellcode）等利用方式。代表项：CAP_CHOWN/CAP_DAC_OVERRIDE/CAP_SETUID/CAP_SETGID（installd）、CAP_KILL（system_server）、CAP_NET_BIND_SERVICE、CAP_NET_ADMIN、CAP_SYS_MODULE、CAP_SYSLOG（dumpstate）、CAP_MAC_OVERRIDE（system_server）。权能以四个bitmask记录：CapInh（可继承）、CapPrm（被授予）、CapEff（活跃有效）、CapBnd（bounding set，限制capset(2)作用范围，Linux 2.6.25引入）。","tags":"第8章;Linux安全;权能"},{"chapter":"第8章","front":"installd放弃了root后保留了哪些权能（capabilities）？","back":"installd保留<b>CAP_DAC_OVERRIDE、CAP_CHOWN、CAP_SETUID、CAP_SETGID</b>。实现方式：prctl(PR_SET_KEEPCAPS)后setgid/setuid降权，再用capset保留必需权能——这是init以root启动服务后服务自行降权的标准模式。","tags":"第8章;Linux安全;权能"},{"chapter":"第8章","front":"Jelly Bean 4.3起Zygote在权能方面做了什么防护？","back":"Zygote调用<code>prctl(PR_CAPSET_DROP)</code>与<code>prctl(PR_SET_NO_NEW_PRIVS)</code>，确保<b>不给子进程（应用）添加权能</b>，防止应用通过fork自zygote获得额外权限。","tags":"第8章;Linux安全;权能"},{"chapter":"第8章","front":"SELinux在Android（SEAndroid）中的引入历程是怎样的？","back":"SELinux由NSA开发后并入Linux内核主线。<ul><li><b>Jelly Bean 4.3</b>：引入，permissive（宽容）模式</li><li><b>KitKat 4.4</b>：对installd/netd/vold/zygote等服务启用enforcing（强制）模式</li><li><b>Lollipop</b>：全面强制（enforcing）</li></ul>SEAndroid由NSA的Smalley和Craig论文提出；三星在其KNOX安全平台（v2.0）上进一步扩展。","tags":"第8章;SELinux"},{"chapter":"第8章","front":"MAC（强制访问控制）与DAC（自主访问控制）有何区别？SELinux的基本方法是什么？","back":"DAC是传统UNIX的owner/group/other权限模型，由文件属主自主决定权限；<b>MAC是超越DAC的强制访问控制框架</b>，策略独立于ACL等其他权限层。SELinux的基本方法是\"<b>打标签</b>\"（labeling）：客体（资源）分配type类型，主体（进程）分配security domain安全域；同类标签进程等价。这是粒度比权能更细的最小权限实现，类似iOS基于TrustedBSD MAC框架的沙箱。","tags":"第8章;SELinux"},{"chapter":"第8章","front":"SELinux安全上下文的四段格式是什么？如何查看？","back":"格式为<code>user:role:type:level</code>四元组。SEAndroid只定义type，即形如<code>u:r:domain:s0</code>。查看方法：<code>ps -Z</code>查看进程上下文，<code>ls -Z</code>查看文件上下文。","tags":"第8章;SELinux"},{"chapter":"第8章","front":"Android 4.4中应用类对应的SELinux域有哪些？media/platform/shared/release等key定义在哪？","back":"<ul><li><code>u:r:kernel:s0</code>：内核线程，上帝模式</li><li><code>u:r:isolated_app:s0</code></li><li><code>u:r:media_app:s0</code>、<code>u:r:platform_app:s0</code>、<code>u:r:shared_app:s0</code>、<code>u:r:release_app:s0</code></li><li><code>u:r:untrusted_app:s0</code>：普通第三方应用</li></ul>media/platform/shared/release等key定义在<code>/system/etc/security/mac_permissions.txt</code>（MMAC中间件MAC），包管理器通过SELinuxMMAC.assignSeinfoValue在包扫描时打标签。","tags":"第8章;SELinux"},{"chapter":"第8章","front":"AOSP的SELinux策略文件有哪些类型？厂商如何自定义策略？","back":"AOSP <code>external/sepolicy</code>目录下的<code>.te</code>（type enforcement）文件为基线，所有xxx_app域继承domain域（只允许Binder、与Zygote通信、surfaceflinger等基本行为）。厂商通过BoardConfig.mk的四个变量自定义：<ul><li><code>BOARD_SEPOLICY_REPLACE</code>：替代.te文件</li><li><code>BOARD_SEPOLICY_UNION</code>：添加.te文件</li><li><code>BOARD_SEPOLICY_IGNORE</code>：忽略.te文件</li><li><code>BOARD_SEPOLICY_DIRS</code>：添加搜索路径</li></ul><code>mac_permissions.xml</code>模板经insertkeys.py从keys.conf取key生成。","tags":"第8章;SELinux"},{"chapter":"第8章","front":"/sepolicy是什么文件？init如何加载？如何反编译查看？","back":"<code>/sepolicy</code>是<b>编译整合后的二进制策略文件</b>，位于根文件系统（initramfs有数字签名保护故不可修改），init通过<code>libselinux.so</code>加载。实验：pull出/sepolicy后用checkpolicy包的<code>sedismod/sedispol</code>反编译，可见2 users/2 roles/287 types、84 classes/1333 rules等信息及allow语句。","tags":"第8章;SELinux"},{"chapter":"第8章","front":"seapp_contexts、file_contexts、property_contexts各自的用途是什么？","back":"<ul><li><code>/seapp_contexts</code>：记录应用<b>uid+seinfo到domain的映射</b>（seinfo由包管理器根据签名密钥与mac_permissions.xml填写）</li><li><code>/file_contexts</code>：记录<b>受保护文件的上下文</b></li><li><code>/property_contexts</code>与<code>/data/security/property_contexts</code>：<b>系统属性的上下文</b>；init从JellyBean起改用check_mac_perms()布尔函数控制，取代写死的property_perms数组，无须重编译/init</li></ul>","tags":"第8章;SELinux;策略文件"},{"chapter":"第8章","front":"处理SELinux denial的常规（良好工程）流程是什么？","back":"每个域先以<b>permissive（宽容）模式</b>运行并观察审计日志，确认无问题后再转为<b>enforcing（强制）模式</b>。可借助audit2allow从审计日志生成allow规则。","tags":"第8章;SELinux;audit2allow"},{"chapter":"第8章","front":"AT_SECURE是什么？它何时置位，作用是什么？","back":"AT_SECURE是内核ELF加载器辅助向量（/proc/pid/auxv）中的记录项，对<b>setuid/setgid程序、有权能的程序及引起SELinux域切换的程序</b>为非零值。Bionic linker（/system/bin/linker）据此屏蔽不安全环境变量（is_unsafe_environment_variable()硬编码），最重要的是<b>LD_LIBRARY_PATH与LD_PRELOAD</b>——它们常被用于库注入攻击。","tags":"第8章;进程防护"},{"chapter":"第8章","front":"什么是ASLR？Android的ASLR为何比Linux弱？如何控制？","back":"ASLR（地址空间布局随机化）通过随机化栈、堆等内存区域位置增加漏洞利用难度。由<code>/proc/sys/kernel/randomize_va_space</code>控制：0不随机化、1仅栈、<b>2栈+堆（默认）</b>。Android较弱的原因：<b>zygote fork出的所有应用共享同一内存布局</b>（fork非exec），各应用libc.so基地址相同。Linux 3.14起引入内核级ASLR（KASLR），但多数厂商（3.10/3.4内核）未采纳。","tags":"第8章;进程防护;ASLR"},{"chapter":"第8章","front":"栈保护（stack canary）的原理及其局限是什么？","back":"编译选项<code>gcc -fstack-protector</code>：在函数返回前校验返回地址前的随机数\"stack canary\"（金丝雀），若被改动即终止程序。局限：并非万能，<b>函数指针</b>（如C++虚方法表）仍可被覆盖从而劫持执行流。","tags":"第8章;进程防护"},{"chapter":"第8章","front":"NX/XN数据执行保护是什么？ROP如何绕过它？","back":"NX/XN把堆栈标记为<b>不可执行</b>，防止经典的trampoline技术（往栈上注入shellcode执行）。但<b>ROP</b>（Return-Oriented Programming，源于Solar Designer 1997年提出的Return-into-libc）通过拼接程序中<b>已有代码片段</b>（以ret结尾的gadget）来组合出攻击逻辑，从而绕过NX。","tags":"第8章;进程防护;ROP"},{"chapter":"第8章","front":"FORTIFY_SOURCE与seccomp-bpf分别是什么？","back":"<ul><li><b>FORTIFY_SOURCE</b>：编译时防护（配合-Wformat-security），检查内存拷贝函数（如strcpy/memcpy）的边界、防格式化字符串攻击；根本之道仍是防御性编程（输入验证与边界检查）</li><li><b>seccomp-bpf</b>（Nougat引入）：用prctl(PR_SET_SECCOMP)激活，以CBPF（Berkeley Packet Filter）状态机语法<b>过滤系统调用</b>，只放行\"安全的\"；注意futex(2)等人畜无害的系统调用历史上也出过漏洞</li></ul>","tags":"第8章;进程防护;seccomp-bpf"},{"chapter":"第8章","front":"protectionLevel有哪四级？各代表什么？","back":"<ul><li><b>0 normal</b>（PROTECTION_NORMAL）：自动授予</li><li><b>1 dangerous</b>（DANGEROUS）：敏感权限，需用户确认</li><li><b>2 signature</b>：仅与声明者同签名才授予</li><li><b>3 signatureOrSystem</b>：同签名或系统应用</li></ul>还可与PermissionInfo标志位异或：SYSTEM(0x10)、DEVELOPMENT(0x20)。系统权限定义于<code>/system/framework/framework-res.apk</code>，可用aapt dump查看。","tags":"第8章;Dalvik安全;权限"},{"chapter":"第8章","front":"Android权限数据库存在哪里？packages.xml的主要结构是什么？","back":"权限数据库实为包数据库<code>/data/system/packages.xml</code>的一部分：<ul><li><b>permission-trees</b>：权限命名空间</li><li><b>permissions</b>：item含name、package、protect（保护级别）</li><li><b>package</b>：name为逆DNS、userId为AID，<perms>子元素列出全部已授权限</li><li><b>shared-user</b>：共享AID的应用，权限赋予AID即赋予所有共享者</li></ul>","tags":"第8章;Dalvik安全;权限"},{"chapter":"第8章","front":"Marshmallow（6.0）之前的Android如何授予权限？","back":"<b>安装时授权模型</b>：权限在安装/加载时由用户一次性确认授予，被拒则抛安全异常。权限只是常量值，声明于AndroidManifest.xml的<code><uses-permission></code>元素（应用也可用<code><permission></code>自定义）。Marshmallow起改为<b>运行时权限</b>：dangerous权限在使用时动态请求。恶意开发者用JNI逃出虚拟机监控也无用——用户应用在Linux层无任何权限/权能，敏感操作必须经getSystemService()请求system_server中的服务。","tags":"第8章;Dalvik安全;权限"},{"chapter":"第8章","front":"pm命令与AppOps各能做什么？","back":"<b>pm命令</b>：<code>pm list permissions [-s|-g]</code>列出权限；<code>pm [grant|revoke] PACKAGE PERMISSION</code>授权/撤销；<code>pm set-permission-enforce PERMISSION [true|false]</code>强制启用。<br><b>AppOps服务</b>：提供细粒度权限使用追踪与调整（独立数据库/data/system/appops.xml）；KitKat 4.4.2\"安全升级\"移除了其GUI但服务仍在；Lollipop引入<code>appops set <PACKAGE> <OP> <allow|ignore|deny|default></code>脚本，默认仅支持少数操作，重编译AppOpsManager可支持全部48个操作。","tags":"第8章;Dalvik安全;AppOps"},{"chapter":"第8章","front":"platform.xml如何把Dalvik权限映射到Linux UID/GID？","back":"桥梁是<code>/system/etc/permissions/platform.xml</code>：<ul><li><code><permission name=\"...\"><group gid=\"...\"/></code>：把高级权限关联到gid（如BLUETOOTH_ADMIN→net_bt_admin）</li><li><code><assign-permission></code>：把权限赋予特定uid（如MODIFY_AUDIO_SETTINGS→media）</li><li><code><library></code>：声明可供链接的库</li></ul>同目录还有android.hardware.*与android.software.*等特性XML。","tags":"第8章;Dalvik安全;权限"},{"chapter":"第8章","front":"Master Key漏洞的原理是什么？","back":"2013年BlueBox发现，Saurik（Cydia作者）提出更巧妙的利用：APK（实为ZIP）中存在<b>多个同名文件</b>时Android不能正确处理——<b>签名验证的是其中一个文件，提取安装的却是另一个同名文件</b>（可包括classes.dex）。根因：验证签名与提取文件用的是<b>两个不同的库</b>（Java实现与Dalvik原生实现）。结果：任何人可向已签名APK添加同名文件绕过签名校验。","tags":"第8章;签名漏洞;MasterKey"},{"chapter":"第8章","front":"Fake ID漏洞的原理是什么？","back":"2014年BlueBox发现，在BlackHat大会上引起震动。利用<b>验证App签名证书的缺陷</b>：提供故意不正确的证书链，伪造签名证书，把恶意应用与真实的无关应用关联，恶意应用即可<b>继承可信应用的权限</b>（典型伪装成Adobe组件与WebKit插件）。自Eclair起存在近4年，影响当时市场上所有Android设备，Lollipop修补。签名密钥分级（media/platform/shared/release）导致的权限继承机制正是此类问题的温床。","tags":"第8章;签名漏洞;FakeID"},{"chapter":"第8章","front":"图形锁、PIN、口令三种锁屏方式的安全性如何比较？","back":"<ul><li><b>图形锁</b>：本质是3x3点阵上的\"PIN\"，安全性最低</li><li><b>PIN</b>：最多16个数字、可重复，安全性高于图形锁</li><li><b>口令</b>（大小写+数字）：安全性最高</li></ul>锁屏是防小偷与物理接触攻击者的第一道也是唯一真正防线，须在安全性与快速解锁间平衡。","tags":"第8章;用户层;锁屏"},{"chapter":"第8章","front":"锁屏的验证流程是怎样的？gesture.key与password.key分别存什么？","back":"锁屏是<code>com.android.keyguard</code>包中的activity；电源管理唤醒屏幕通知WindowPolicyManager，调用KeyguardServiceDelegate的onScreenTurnedOn()。实际解锁由LockPatternUtils完成，请求system_server中的<b>LockSettingsService</b>验证：<ul><li>图形锁Hash存于LOCK_PATTERN_FILE即<code>/data/system/gesture.key</code></li><li>PIN/口令Hash存于LOCK_PASSWORD_FILE即<code>/data/system/password.key</code></li></ul>只存<b>Hash</b>不存明文。DevicePolicyManager的lockNow()也可触发锁屏。","tags":"第8章;用户层;锁屏"},{"chapter":"第8章","front":"locksettings.db是什么？包含哪些关键键值？","back":"locksettings.db是SQLite数据库，存储锁屏相关设置，键包括：<code>lockedoutpermanently</code>（永久锁定）、<code>lockedoutattempteddeadline</code>、<code>patternneverchosen</code>、<code>password_type</code>、<code>password_type_alternate</code>、<code>password_salt</code>、<code>disabled</code>、<code>biometric_weak_fallback</code>、<code>power_button_instantly_locks</code>、<code>widgets_enabled</code>、<code>password_history</code>等。locksettings表含user字段（JellyBean引入支持多用户，通常0或1）。删改此文件重启system_server会以默认值重建（锁屏须重设）。","tags":"第8章;用户层;锁屏"},{"chapter":"第8章","front":"Android的人脸识别与指纹解锁发展史是怎样的？","back":"<ul><li><b>人脸识别</b>：Ice Cream Sandwich引入；识别成功率仅60%~90%，对<b>照片</b>的识别成功率甚至比对真人更高</li><li><b>指纹</b>：摩托罗拉Atrix 4G首款实现；苹果2012年收购AuthenTec后用于iPhone 5s；三星Galaxy S5跟进；<b>Lollipop内置fingerprint服务</b>使其成为标配。TrustManager（Lollipop新增）允许用事先配对的蓝牙设备（如Android Wear）解锁</li></ul>","tags":"第8章;用户层;锁屏"},{"chapter":"第8章","front":"Android多用户支持是如何实现的？应用ID格式有何变化？","back":"Jelly Bean 4.2引入（最初仅限平板）。AID空间划分出不重叠区域专供人类用户；应用ID由app_###改为<code>u##_a###</code>格式（##为用户编号）。每用户在<code>/data/user</code>下有专用目录，应用数据移至/data/user/##/；/data/data成为用户0目录（/data/user/0为其符号链接）。用户配置存于<code>/data/system/users</code>（0.xml、userlist.xml等）。实验：设系统属性<code>fw.max_users</code>大于1即可启用；<code>pm create-user/remove-user</code>增删用户；添加用户时强制要求设置锁屏。","tags":"第8章;用户层;多用户"},{"chapter":"第8章","front":"Android系统根证书存放在哪里？otacerts.zip有何用途？","back":"PKI依赖自认证的root certificate（根证书）硬编码于操作系统建立信任链。Android系统根证书存于<code>/system/etc/security/cacerts</code>（旧版为cacerts.bks），<b>PEM格式</b>（-----BEGIN CERTIFICATE-----/END分隔符、base64编码），可用openssl解码查看。<code>/system/etc/security/otacerts.zip</code>存放OTA升级验证证书（通常1个），RecoverySystem类用getTrustedCertificates()解析；FireOS等禁自动升级的系统可删除该文件防root失效。","tags":"第8章;用户层;证书"},{"chapter":"第8章","front":"证书pinning（证书锁）是什么？如何更新pins？","back":"Jelly Bean API 17引入：把目标主机<b>预期公钥预先写死为pin</b>，不匹配即禁止通信，防中间人攻击。pin记录在可修改的<code>/data/misc/keychain/pins</code>（系统证书在只读的/system/etc/security）。CertPinInstallerReceiver监听UPDATE_PINS广播，四项extra：<code>EXTRA_CONTENT_PATH</code>（新增主机-公钥记录）、<code>EXTRA_VERSION_NUMBER</code>（须大于当前版本）、<code>EXTRA_REQUIRED_HASH</code>（当前pin文件的Hash）、<code>EXTRA_SIGNATURE</code>（新pin文件签名）；验证通过后更新/data/misc/keychain/metadata/version。谷歌预置了大量自身证书锁。","tags":"第8章;用户层;证书;pinning"},{"chapter":"第8章","front":"keystore服务如何管理密钥？为何这种设计可用硬件实现？","back":"keystore服务按用户id把秘密存于<code>/data/misc/keystore/user_##</code>目录（权限0700，仅keystore为拥有者，应用/用户只能经keystore访问）。提供<b>generate、sign、verify</b>等接口但<b>不允许直接访问私钥</b>——正因应用从不接触私钥本身，此设计使keystore可用硬件实现。Android M扩展出<b>gatekeeper</b>服务（password替换为opaque handle）。证书黑名单由CertBlackliner监视pubkey_blacklist与serial_blacklist（/data/misc/keychain/下）。","tags":"第8章;用户层;keystore"},{"chapter":"第8章","front":"keymaster、TEE（TrustZone）、gatekeeper三者是什么关系？","back":"<ul><li><b>keymaster HAL</b>：统一加解密接口，可硬件实现也可softkeymaster软件实现</li><li><b>TEE（可信执行环境）</b>：基于ARM <b>TrustZone</b>，位于Android不能直接访问的独立内存镜像，只能经内核（Supervisor）模式的<b>SMC（Secure Monitor Call）</b>指令切入；启动时由厂商指定加载的代码，谷歌提供含keystore与gatekeeper接口的标准基本实现</li><li><b>gatekeeper</b>：Android M扩展出的服务，password替换为opaque handle</li></ul>JellyBean起提供硬件实现的secure storage。","tags":"第8章;用户层;TEE"},{"chapter":"第8章","front":"Android全盘加密基于什么机制？密钥存放在哪里？","back":"Honeycomb起引入（落后iOS 4），经<b>dm-crypt</b>（与OBB、ASEC相同机制）把加密扩展到文件系统层；所谓\"全盘加密\"实际通常只加密<b>/data</b>（/system无敏感数据且加密严重拖累性能）。关键区别：OBB/ASEC密钥明文藏于系统（仅root可读）；<b>/data加密密钥不能存放于手机</b>，须在启动时根据用户屏幕解锁密码推导，故需修改启动流程及init与vold交互。vold负责加密（用户触发、冗长操作）与解密（device mapper把加密文件系统作为块设备mount时自动执行）。","tags":"第8章;存储;dm-crypt"},{"chapter":"第8章","front":"全盘加密的128位主密钥如何生成与保护？暴力破解风险及对策？","back":"主密钥首次启动<b>随机生成</b>，用默认口令<code>\"default_password\"</code>外加存储的salt加密；用户更改PIN/口令后用<b>新凭据重新加密主密钥</b>（主密钥本身不变）。风险：反复调用vold的<code>cryptfs_check_passwd()</code>即可逐个验证口令，PIN/图形锁几分钟甚至几秒内可试遍。对策：<b>整合TEE</b>，存储在TEE中的次级密钥参与主密钥加解密，理论上把暴力攻击限定在本机。唯一真正管用的仍是长且不重复的混合口令。","tags":"第8章;存储;dm-crypt"},{"chapter":"第8章","front":"FBE（基于文件的加密）解决什么问题？如何实现？什么是CE/DE存储？","back":"全盘加密的问题：设备解锁后文件系统被mount，恶意App在再次锁屏后仍能访问敏感数据。FBE（Nougat 7.1引入）给<b>每个文件</b>分配由用户passcode推导的密钥，利用Linux内核<code>EXT4_FS_ENCRYPTION</code>特性辅以Keymaster与TrustZone硬件支持，锁屏后特定文件至下次解锁前不可访问——追平iOS的NSProtectionClass（cprotect）机制。<b>Direct Boot</b>区分两类存储：<ul><li><b>credential encrypted（CE）</b>：登录凭据加密数据，须用户解锁才可访问</li><li><b>device encrypted（DE）</b>：硬件存储密钥加密，加电即可访问但不安全</li></ul>App须声明处理LOCKED_BOOT_COMPLETED广播的receiver并将android:directBootAware设为true，才能在解锁前收发消息并访问DE数据。","tags":"第8章;存储;FBE;DirectBoot"},{"chapter":"第8章","front":"dm-verity的原理和作用是什么？systemless root如何削弱它？","back":"KitKat引入（源自Chromium OS，Linux 3.4起并入内核，Nougat默认强制启用），把可验证启动路径（verified boot path）信任链从ROM/Boot Loader/内核/root文件系统<b>延伸到/system</b>，防止有root权限的进程以读写方式重新mount /system做永久性修改。原理：对分区所有<b>4KB数据块计算SHA-256</b>构成<b>Merkle树</b>直至根Hash，根Hash用厂商私钥数字签名存于boot分区；读取时在内核页缓存校验，不通过则报I/O error（/dm/dm-verity.c实现仅约20KB）。副作用：阻止未经授权的永久性root。root阵营回应是<b>systemless root</b>（无须修改/system分区），使设备可被永久root且不留痕迹、不提示用户。","tags":"第8章;存储;dm-verity"},{"chapter":"第8章","front":"极简SU实现只需哪三行代码？","back":"<code>setuid(0);</code><br><code>setgid(0);</code><br><code>system(\"/system/bin/sh\");</code><br>即把自身提升为uid 0后启动shell（未强制SELinux的设备；AOSP的/system/extras/su/su.c为支持参数的类似例子）。多数root工具把su放入/system/bin或/system/xbin并<code>chmod 4755</code>设SetUID位。KitKat后因强制SELinux，shell被限制在u:r:shell:s0上下文，SU须与处于u:r:init:s0或u:r:kernel:s0不受限上下文的进程做一次IPC再fork出shell（如DaemonSu）。","tags":"第8章;root"},{"chapter":"第8章","front":"通过设备启动环节root有哪些方法？","back":"通过组合键或fastboot把启动流程转移到可选配置（recovery镜像、SD卡升级包、fastboot传入镜像）。Boot Loader可解锁的设备即可root；解锁时/data被格式化，且部分Boot Loader设置<b>永久性解锁标志位</b>（重新加锁也不撤销）。方法：<ul><li><b>修改镜像中的initramfs</b>（内存将其作为根文件系统mount并以root启动/init），换上改过的/init或/init.rc即可获取root</li><li>设置<code>ro.secure=0</code>让ADB保留root（新build中adb由ALLOW_ADB_ROOT条件编译控制）</li><li>把su放入/system/bin或/system/xbin并设SetUID位</li></ul>","tags":"第8章;root"},{"chapter":"第8章","front":"SuperSU与SuperUser应用生态是什么？","back":"SuperUser应用提供通过<b>permission和intent管理哪些App可获root</b>的GUI/API。Chainfire的<b>SuperSU</b>定义<code>android.permission.ACCESS_SUPERUSER</code>与<code>eu.chainfire.supersu.permission.NATIVE</code>权限，并可通过一系列巧妙操作绕过SELinux限制；其daemonsu守护进程运行在u:r:init:s0上下文，su为shell子进程但实际unshell由daemonsu生成，eu.chainfire.supersu是GUI管理应用。","tags":"第8章;root;SuperSU"},{"chapter":"第8章","front":"利用安全漏洞root（提权攻击）的典型手法与著名案例有哪些？","back":"特征：找到不安全配置或软件组件，让攻击者的shellcode被执行，从低权限应用→system→root逐级提权。典型手法：向root权限进程（<b>vold是黑客的真爱</b>）输入构造数据破坏内存（栈/堆溢出），覆盖函数指针或返回地址重定向执行流；ROP技巧可绕过ARM的XN bits数据执行保护。案例：<ul><li><b>Towelroot</b>（Geohot）：Linux内核futex处理fast mutexes的bug（CVE-2014-3153）</li><li><b>WeakSauce</b>（HTC One，无须代码注入）</li><li><b>CVE-2015-3636</b>（pingpong root）</li><li><b>DirtyCOW</b>（CVE-2016-5195）：Linux内核写时复制核心代码bug，存在超过十年，任何进程立即提权到root，2016年10月披露时补丁仍未落地</li></ul>0day可卖5万到50万美元。","tags":"第8章;root;提权"},{"chapter":"第8章","front":"启动环节root与漏洞root对安全的影响有何不同？","back":"<ul><li><b>启动环节root</b>：需用户干预连电脑，本身不算系统不安全因素，但给物理接触设备的攻击者可乘之机（熟练者十几分钟root一台手机、窃取数据并留后门）——这正是Boot Loader默认加锁、解锁即强制恢复出厂并擦除数据的原因</li><li><b>漏洞root</b>：无需用户干预即可完成，\"一键root\"工具便利背后是恶意软件可在不知不觉中root系统（木马App、浏览器漏洞经恶意网页/广告远程root）</li></ul>\"Android把应用当贼防，iOS把用户当贼防。\"","tags":"第8章;root"},{"chapter":"第8章","front":"root会给设备带来哪些安全风险？","back":"<ul><li>从不可信网站下载root工具本身危险：难以检测注入的恶意代码/后门</li><li>root过程中可能无意修改系统二进制或框架（如禁用Dalvik权限机制）</li><li>恶意软件可在内核注入<b>rootkit</b></li><li>SuperUser应用自身有漏洞（CVE-2013-6774），流氓应用可检测到自己位于已root设备并借Superuser提权</li><li>root使应用数据保护失效：OBB内容可被读取（root能取得ASEC密钥）、应用进程内存可经ptrace(2)读取、DRM机制中刀</li></ul>","tags":"第8章;root"},{"chapter":"第8章","front":"SafetyNet是什么？应用如何检测root？","back":"应用难以简单可靠地检测root。谷歌Play服务的<b>SafetyNet</b>机制在设备上执行多项运行时检测（CTS兼容性测试含root检测），供Android Pay等拒绝在已root设备上运行。但每种检测手段很快被绕过（如<b>systemless root不在文件系统留痕迹</b>）。iOS越狱同样使fairPlay与加密失效，但越狱只能靠漏洞且随版本升级愈发困难；大多数Android设备天然允许启动环节root，加之Dalvik字节码极易反编译，应用开发者须高度关注。","tags":"第8章;root;SafetyNet"}];
</script>
