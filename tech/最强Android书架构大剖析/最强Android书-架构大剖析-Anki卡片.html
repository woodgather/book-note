(function () {
  "use strict";
  var esc = function (s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  function plain(t) { return t.replace(/<[^>]+>/g, " ").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); }

  /* 章节顺序与配色 */
  var CH_ORDER = ["前言","第1章","第2章","第3章","第4章","第5章","第6章","第7章","第8章"];
  var CH_COLOR = { "前言":"#78716C","第1章":"#2BA05F","第2章":"#2563EB","第3章":"#EA580C",
                   "第4章":"#7C3AED","第5章":"#0891B2","第6章":"#DB2777","第7章":"#CA8A04","第8章":"#DC2626" };
  CARDS.forEach(function (c, i) { c.no = i + 1; c.chOrder = CH_ORDER.indexOf(c.chapter); if (c.chOrder < 0) c.chOrder = 99; });
  CARDS.sort(function (a, b) { return a.chOrder - b.chOrder || a.no - b.no; });

  var grid = document.getElementById("grid");
  var chipsBox = document.getElementById("chips");
  var search = document.getElementById("search");
  var searchInfo = document.getElementById("searchInfo");
  var curCh = "全部";
  var flippedCount = 0;

  /* ---------- 渲染卡片 ---------- */
  function buildCard(c) {
    var wrap = document.createElement("div");
    wrap.className = "card";
    wrap.dataset.no = c.no;
    var tags = (c.tags || "").split(";").filter(function (t) { return t && t !== c.chapter; })
      .map(function (t) { return '<span class="c-tag">' + esc(t) + "</span>"; }).join("");
    wrap.innerHTML =
      '<div class="card-inner">' +
        '<div class="face front"><div class="c-meta"><span class="c-ch">' + esc(c.chapter) + '</span>' +
          '<span class="c-no">#' + c.no + '</span><span class="c-tags">' + tags + "</span></div>" +
          '<div class="c-q">' + esc(c.front) + '</div><span class="flip-hint">点击翻面 ▸</span></div>' +
        '<div class="face back"><div class="c-meta"><span class="c-ch">' + esc(c.chapter) + '</span>' +
          '<span class="c-no">#' + c.no + " 答案</span></div>" +
          '<div class="c-a">' + c.back + '</div><span class="flip-hint">点击翻回 ▸</span></div>' +
      "</div>";
    wrap.querySelector(".card-inner").addEventListener("click", function () {
      wrap.classList.toggle("flipped");
      flippedCount += wrap.classList.contains("flipped") ? 1 : -1;
      document.getElementById("stFlipped").textContent = flippedCount;
    });
    return wrap;
  }

  CARDS.forEach(function (c) { grid.appendChild(buildCard(c)); });

  /* ---------- 章节筛选 chips ---------- */
  var chips = [{ label: "全部", ch: "全部", cnt: CARDS.length }];
  CH_ORDER.forEach(function (ch) {
    var n = CARDS.filter(function (c) { return c.chapter === ch; }).length;
    if (n) chips.push({ label: ch, ch: ch, cnt: n });
  });
  chips.forEach(function (x) {
    var b = document.createElement("span");
    b.className = "chip" + (x.ch === curCh ? " on" : "");
    b.innerHTML = x.label + '<span class="cnt">' + x.cnt + "</span>";
    b.addEventListener("click", function () {
      curCh = x.ch;
      chipsBox.querySelectorAll(".chip").forEach(function (el) { el.classList.remove("on"); });
      b.classList.add("on");
      applyFilter();
    });
    chipsBox.appendChild(b);
  });

  function applyFilter() {
    var q = search.value.trim().toLowerCase();
    var shown = 0;
    grid.querySelectorAll(".card").forEach(function (card) {
      var c = CARDS[card.dataset.no - 1];
      var okCh = (curCh === "全部" || c.chapter === curCh);
      var okQ = !q || (plain(c.front) + " " + plain(c.back) + " " + (c.tags || "")).toLowerCase().indexOf(q) >= 0;
      var ok = okCh && okQ;
      card.classList.toggle("hidden", !ok);
      if (ok) shown++;
    });
    searchInfo.textContent = q || curCh !== "全部" ? "显示 " + shown + " / " + CARDS.length + " 张" : "";
    if (!shown) {
      if (!grid.querySelector(".empty")) {
        var e = document.createElement("div"); e.className = "empty"; e.textContent = "没有匹配的卡片";
        grid.appendChild(e);
      }
    } else {
      var em = grid.querySelector(".empty"); if (em) em.remove();
    }
  }

  var deb;
  search.addEventListener("input", function () { clearTimeout(deb); deb = setTimeout(applyFilter, 160); });

  /* ---------- 批量翻卡 ---------- */
  document.getElementById("btnFlipAll").addEventListener("click", function () {
    var n = 0;
    grid.querySelectorAll(".card:not(.hidden)").forEach(function (card) {
      if (!card.classList.contains("flipped")) { card.classList.add("flipped"); n++; }
    });
    flippedCount += n;
    document.getElementById("stFlipped").textContent = flippedCount;
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    grid.querySelectorAll(".card.flipped").forEach(function (card) { card.classList.remove("flipped"); });
    flippedCount = 0;
    document.getElementById("stFlipped").textContent = "0";
  });

  /* ---------- 统计 ---------- */
  document.getElementById("stTotal").textContent = CARDS.length;
  var nCh = 0;
  CH_ORDER.forEach(function (ch) { if (CARDS.some(function (c) { return c.chapter === ch; })) nCh++; });
  document.getElementById("stCh").textContent = nCh;
})();
</script>
</body>
</html>
