 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Ashmem驱动程序主要使用哪三个结构体？各自的作用是什么？", "a": "ashmem_area描述一块匿名共享内存；ashmem_range描述一小块处于解锁状态的内存；ashmem_pin是IO控制命令ASHMEM_PIN和ASHMEM_UNPIN的参数，用offset和len描述即将被锁定或解锁的内存块。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "结构体ashmem_area的成员变量file和size分别表示什么？为什么匿名共享内存与tmpfs有关？", "a": "file指向临时文件系统tmpfs中的一个文件，size表示该文件的大小。每块匿名共享内存在tmpfs中都有一个对应的临时文件，文件大小即为匿名共享内存的大小，即Ashmem基于tmpfs实现。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "匿名共享内存的名称规则是什么？ASHMEM_NAME_PREFIX、ASHMEM_NAME_LEN和ASHMEM_FULL_NAME_LEN的含义？", "a": "名称以前缀ASHMEM_NAME_PREFIX（\"dev/ashmem\"）开头，应用程序指定的名称最大长度为ASHMEM_NAME_LEN（256字节），未指定时使用默认值ASHMEM_NAME_DEF。全名称=前缀+指定名称，最大长度ASHMEM_FULL_NAME_LEN=两者长度之和，形式如/dev/ashmem/<name>。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "ashmem_area的unpinned_list列表有什么特点？", "a": "它是匿名共享内存的解锁内存块列表，保存从该内存划分出的处于解锁状态的小块。列表中的内存块地址互不相交，并按地址值从大到小的顺序排列。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "结构体ashmem_range的成员变量unpinned、asma、lru、pgstart、pgend、purged分别是什么含义？", "a": "unpinned用于链入宿主匿名共享内存的unpinned_list；asma指向宿主ashmem_area；lru用于链入全局最近最少使用列表ashmem_lru_list；pgstart和pgend以页为单位描述解锁内存块的起止地址；purged表示该内存是否已被回收（ASHMEM_WAS_PURGED/ASHMEM_NOT_PURGED）。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "全局列表ashmem_lru_list的作用是什么？", "a": "它是最近最少使用（LRU）列表，保存所有处于解锁状态且尚未被回收的内存块。系统内存不足时，内存管理系统按最近最少使用原则从中回收内存块，全局变量lru_count维护其中可回收内存块的总大小（以页为单位）。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Ashmem驱动程序中结构体访问的并发保护机制是什么？", "a": "所有对ashmem_area结构体和ashmem_range结构体的访问都受互斥锁ashmem_mutex保护。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Ashmem驱动程序的初始化函数ashmem_init做了哪三件事？", "a": "1）调用kmem_cache_create创建两个slab缓冲区分配器ashmem_area_cachep和ashmem_range_cachep，分别用于分配ashmem_area和ashmem_range结构体；2）调用misc_register注册一个misc类型的字符设备，对应设备文件/dev/ashmem；3）调用register_shrinker注册内存回收函数ashmem_shrinker。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "设备文件/dev/ashmem的file_operations结构体ashmem_fops包含哪些操作函数？为什么没有读写函数？", "a": "文件打开、关闭、内存映射和IO控制函数分别为ashmem_open、ashmem_release、ashmem_mmap和ashmem_ioctl。因为匿名共享内存采用直接地址访问方式（先映射到进程地址空间再通过虚拟地址访问），所以不需要读写函数。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "register_shrinker注册的内存回收函数在何时被调用？", "a": "当系统内存不足时，内存管理系统通过页框回收算法（PFRA）回收内存，此时所有通过register_shrinker注册的内存回收函数都会被调用，以便它们向系统贡献空闲或相对空闲的内存。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "打开设备文件/dev/ashmem时，函数ashmem_open做了哪些工作？", "a": "1）调用nonseekable_open将设备文件设置为不可随机访问（它只是访问驱动的通道，本身无内容）；2）调用kmem_cache_zalloc从slab缓冲区ashmem_area_cachep分配一个ashmem_area结构体asma；3）初始化其unpinned_list，设置默认名称和访问保护位；4）将asma保存在file的private_data中。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "修改匿名共享内存的名称和大小分别用什么IO控制命令？有什么前提条件？", "a": "分别使用ASHMEM_SET_NAME和ASHMEM_SET_SIZE，由ashmem_ioctl处理。前提是Ashmem驱动程序尚未为该匿名共享内存创建tmpfs临时文件（asma的file为空）；创建临时文件后再修改名称或大小将被忽略，因为临时文件的名称就等于匿名共享内存的名称。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "mmap映射/dev/ashmem时，函数ashmem_mmap做了哪些检查和操作？", "a": "1）检查asma大小是否为0，为0则出错返回（应先用ASHMEM_SET_SIZE设置大小）；2）检查虚拟内存vma的访问保护权限是否超出asma的prot_mask，超出则出错；3）若尚未创建临时文件，则调用shmem_file_setup在tmpfs中创建（名称为asma的名称或默认/dev/ashmem）；4）若vma允许进程间共享，调用shmem_set_file设置其映射文件和内存操作方法表。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "虚拟内存vma首次访问发生缺页异常时，shmem_fault是如何处理的？", "a": "先在页面缓冲区中查找与缺页虚拟地址对应的物理页面，有则直接映射；否则检查页面换出设备中是否有对应换出页面，有则先加入页面缓冲区再映射；否则分配新物理页面，从vma的映射文件vm_file读入内容初始化，并加入页面缓冲区。这样同一物理页面可映射到不同进程，实现共享内存。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "如果mmap映射的虚拟内存vma不允许在不同进程间共享，ashmem_mmap如何处理？", "a": "只将创建的临时文件设置为vma的映射文件，而不设置其内存操作方法表（shmem_vm_ops）。这样访问发生缺页异常时，内核直接为新地址分配新物理页面，阻止了该虚拟内存的内容被其他进程共享。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "匿名共享内存的锁定与解锁分别用什么IO控制命令？由哪个函数统一处理？", "a": "分别使用ASHMEM_PIN和ASHMEM_UNPIN，参数均为ashmem_pin结构体（offset为偏移、len为长度，以字节为单位且对齐到页面边界）。二者都由ashmem_ioctl分发给函数ashmem_pin_unpin统一处理。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "函数ashmem_pin_unpin在处理前做了哪些合法性检查？len为0意味着什么？", "a": "检查：是否已创建临时文件；偏移和大小是否对齐到页面边界；末尾地址是否超出无符号整数范围；末尾地址是否超出匿名共享内存末尾。len等于0表示要锁定/解锁的内存块从offset开始直到匿名共享内存末尾。之后将以页为单位的相对地址pgstart、pgend分别传给ashmem_pin或ashmem_unpin。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "函数ashmem_unpin解锁内存块时的核心逻辑是什么？", "a": "遍历宿主匿名共享内存的unpinned_list，若发现已解锁内存块range与待解锁区间[pgstart,pgend]相交（图6-2的A、B、C情形），则合并（调整pgstart、pgend）并用range_del删除range后继续循环；若range完全包含待解锁区间（情形D）则直接返回；若不相交且range区间更小（情形E）则停止遍历，最后用range_alloc将区间插入unpinned_list中range之前。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Ashmem驱动程序用哪五个宏判断内存块位置关系？", "a": "page_range_subsumes_range（判断[start,end]是否包含range）、page_range_subsumed_by_range（判断range是否包含[start,end]）、page_in_range（判断地址page是否在range内）、page_range_in_range（判断两内存块是否互相包含或相交）、range_before_page（判断地址page是否大于range末尾）。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "函数range_del和range_alloc分别做什么？", "a": "range_del：用list_del将内存块从宿主的unpinned_list删除，若其purged为ASHMEM_NOT_PURGED（宏range_on_lru判断，即在ashmem_lru_list中）则用lru_del从全局LRU列表删除并减少lru_count，最后将ashmem_range交回slab缓冲区ashmem_range_cachep。range_alloc：从ashmem_range_cachep分配ashmem_range并初始化，用list_add_tail插入unpinned_list中prev_range之前，若未回收则lru_add加入全局LRU列表并增加lru_count。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "函数ashmem_pin锁定内存块时如何处理已解锁内存块与目标区间相交的各种情况？", "a": "遍历unpinned_list，对与[pgstart,pgend]包含或相交的range分四种情况：1）目标区间包含range：直接range_del删除；2）目标区间与range前半部分相交：修改range的pgstart为目标末尾的下一页；3）与range后半部分相交：修改range的pgend为目标开始的前一页；4）目标区间在range中间（挖洞）：用range_alloc新分出[pgend+1,range->pgend]，再用range_shrink将range缩小为[range->pgstart,pgstart-1]。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "内存回收函数ashmem_shrink的工作流程是什么？", "a": "参数nr_to_scan为0时表示查询可回收页数，返回lru_count；大于0时遍历全局列表ashmem_lru_list，逐一调用vmtruncate_range回收解锁内存块的物理页面，直到达到nr_to_scan或列表为空；回收后将该块从LRU列表删除并把purged设为ASHMEM_WAS_PURGED。此外若gfp_mask的__GFP_FS位为0（禁止文件系统操作，而tmpfs回收涉及文件系统）则直接返回。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "运行时库cutils提供了哪些匿名共享内存C接口？实现在哪个文件？", "a": "实现在ashmem-dev.c文件中，提供五个C接口：ashmem_create_region（创建匿名共享内存）、ashmem_pin_region（锁定内存块）、ashmem_unpin_region（解锁内存块）、ashmem_set_prot_region（修改访问保护位）、ashmem_get_size_region（获取内存大小）。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "函数ashmem_create_region创建一块匿名共享内存分哪三步？", "a": "第一步调用open打开设备文件/dev/ashmem（ASHMEM_DEVICE），触发ashmem_open创建ashmem_area并得到文件描述符；第二步用IO控制命令ASHMEM_SET_NAME设置名称（name为NULL时用默认名/dev/ashmem）；第三步用IO控制命令ASHMEM_SET_SIZE设置大小（驱动初始创建时大小为0）。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "函数ashmem_set_prot_region设置访问保护位有什么限制？READ_IMPLIES_EXEC是什么特殊情况？", "a": "驱动函数set_prot_mask处理ASHMEM_SET_PROT_MASK，创建时默认保护位为PROT_MASK（可执行、可读、可写），此后应用程序只能删除保护位，不能增加（prot超出asma允许范围则拒绝）。特殊情况：若当前进程personality属性的READ_IMPLIES_EXEC位为1，则设置PROT_READ时会隐含加上PROT_EXEC位。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "C++接口中MemoryHeapBase和MemoryBase分别适用于什么场景？二者关系如何？", "a": "MemoryHeapBase用于创建并共享一块完整的匿名共享内存；MemoryBase用于只共享一块匿名共享内存中的一部分，它在MemoryHeapBase基础上实现，内部通过强指针mHeap指向一个MemoryHeapBase服务，用mOffset和mSize描述该小块内存的偏移和大小。二者实例化后都是Service组件。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "接口IMemoryHeap定义了哪四个成员函数？各自作用？", "a": "getHeapID获取匿名共享内存块的文件描述符；getBase获取映射地址；getSize获取大小；getFlags获取访问保护位。BnMemoryHeap的onTransact处理Client发来的HEAP_ID请求，调用这三个函数将信息写入Parcel返回。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "MemoryHeapBase类的成员变量有哪些含义？其构造函数创建匿名共享内存的过程是什么？", "a": "成员变量mFD为文件描述符（打开/dev/ashmem得到），mSize、mBase、mFlags分别为大小、映射地址和访问保护位。构造过程：先调用getpagesize将参数size对齐到页面边界；再调用cutils的ashmem_create_region创建匿名共享内存得到fd；然后调用mapfd映射到进程地址空间；最后若为只读（READ_ONLY位）则用ashmem_set_prot_region设置保护位。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "MemoryHeapBase的成员函数mapfd中，DONT_MAP_LOCALLY标志起什么作用？", "a": "若mFlags的DONT_MAP_LOCALLY位为1，则不将该匿名共享内存映射到本进程地址空间，此时mBase设为0，mNeedUnmap设为false（销毁服务时无需撤销映射）；为0时调用mmap映射并将地址保存到mBase，mNeedUnmap设为true。映射时指定保护位PROT_READ|PROT_WRITE且内容可与其他进程共享。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "BpMemoryHeap代理对象何时将Server端的匿名共享内存映射到Client进程？", "a": "当其getHeapID、getBase、getSize、getFlags四个成员函数之一第一次被调用时，会触发assertMapped：若mHeapId等于-1（尚未映射），则通过find_heap在全局HeapCache强指针gHeapCache中查找是否有其他代理对象已映射同一服务对应的内存，然后调用assertReallyMapped向Server发送HEAP_ID请求获取文件描述符、大小和保护位，最后调用mmap映射到Client进程地址空间。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Client进程中的HeapCache类（gHeapCache）有什么作用？", "a": "Client进程中可能存在多个BpMemoryHeap代理对象引用同一个MemoryHeapBase服务（即引用同一个Binder代理对象）。HeapCache内部用KeyedVector列表mHeapCache以Binder代理对象的弱指针为关键字保存heap_info_t结构体。第一个代理对象完成映射后，其他代理对象可通过同一Binder代理对象在缓存中找到已映射内存的信息，避免重复映射。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "BpMemoryHeap的assertReallyMapped中为什么需要两次判断mHeapId是否等于-1？", "a": "第一次判断在函数入口。由于第8行发送HEAP_ID请求是同步的Binder进程间通信，当前线程可能睡眠；睡眠期间其他线程可能已调用assertReallyMapped完成映射。因此从Binder调用返回后需再次（第二次）判断mHeapId是否仍为-1，避免重复将匿名共享内存映射到Client进程地址空间。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "接口IMemory定义了哪些成员函数？pointer是如何得到小块内存地址的？", "a": "包含getMemory（纯虚函数，获取内部MemoryHeapBase服务及小块内存的偏移和大小）、pointer、size、offset。pointer先调用子类实现的getMemory获取MemoryHeapBase服务heap和偏移offset，再取得heap内部匿名共享内存的地址base，最后base+offset即为小块匿名共享内存的地址。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "BnMemory的onTransact处理什么请求？BpMemory的getMemory如何获取信息？", "a": "BnMemory的onTransact处理Client发来的GET_MEMORY请求：调用子类实现的getMemory获得MemoryHeapBase服务及小块内存的偏移和大小，写入Parcel返回。BpMemory的getMemory首次调用时（mHeap为0）通过内部Binder代理对象向Server端MemoryBase服务发送GET_MEMORY请求，获得MemoryHeapBase代理对象及小块内存偏移和大小并缓存到mHeap、mOffset、mSize。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "6.3.3节应用实例中，SharedBufferServer和SharedBufferClient如何验证共享了匿名共享内存？", "a": "SharedBufferServer启动时创建SharedBufferService（基于MemoryHeapBase和MemoryBase实现ISharedBuffer接口）并注册到Service Manager。SharedBufferClient通过Service Manager获得其代理对象，调用getBuffer取得MemoryBase代理对象，再调用pointer获得共享缓冲区地址，读取整数并加1写回。重复运行Client若打印值依次递增（0、1、2、3），说明两进程成功共享了缓冲区。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Java类MemoryFile的两个构造函数分别如何创建/使用匿名共享内存？", "a": "第一个构造函数（参数name、length）：先调用JNI方法native_open（内部用ashmem_create_region）创建匿名共享内存，再调用native_mmap将其映射到进程地址空间，地址保存到成员变量mAddress。第二个构造函数（参数fd、length、mode）：先用isMemoryFile验证fd指向匿名共享内存（非法则抛异常），再调用native_mmap将已存在的内存映射到本进程地址空间，用于Client端接收Server传来的fd。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "MemoryFile的isMemoryFile如何判断一个文件描述符是否指向匿名共享内存？", "a": "调用JNI方法native_get_size，它将Java层文件描述符转换为C++层fd后调用cutils的ashmem_get_size_region发出ASHMEM_GET_SIZE命令。若fd指向的不是匿名共享内存，则进入其他驱动程序，而其他驱动未实现该命令，会返回错误码ENOTTY；若返回的大小非负数，则说明fd指向一块匿名共享内存。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "MemoryFile的readBytes/writeBytes在mAllowPurging为true时如何处理？", "a": "成员变量mAllowPurging为true表示每次访问内部匿名共享内存后都将其解锁以便被回收。JNI方法native_read/native_write（对应android_os_MemoryFile_read/write）在访问前会调用ashmem_pin_region尝试锁定，若返回ASHMEM_WAS_PURGED说明内存已被回收，返回错误码-1；否则正常读写，访问结束后若unpinned为true再用ashmem_unpin_region解锁。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "6.4.2节应用实例中，应用程序Ashmem的两个进程如何共享内存？读写方式有何不同？", "a": "Server组件运行在独立进程（android:process=\"shy.luo.ashmem.server\"），其中的MemoryService用MemoryFile创建一块名称为Ashmem、大小为4字节的匿名共享内存，并注册到Service Manager（名称AnonymousSharedMemory）。Client通过IMemoryService代理调用getFileDescriptor获得ParcelFileDescriptor形式的fd，用第二个构造函数创建MemoryFile映射到本进程。点击Read时通过memoryFile.readBytes直接读本进程映射地址；点击Write时通过memoryService.setValue经Binder请求写入。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Linux中文件描述符、文件结构体（struct file）和文件三者是什么关系？", "a": "文件描述符是一个只在进程范围内有效的整数，每个文件描述符对应内核中一个文件结构体（打开文件时创建的内核对象）；不同的文件描述符可对应同一个文件结构体，不同的文件结构体也可以对应同一个文件。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "两个进程共享一块匿名共享内存的关键是什么？", "a": "关键是让两个进程中的文件描述符fd1和fd2指向同一个文件结构体file1（该结构体指向匿名共享内存asma）。两个进程各自将fd映射到自己的地址空间后，就把同一块匿名共享内存映射到了各自的地址空间，从而实现共享。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Binder驱动程序是如何在进程间传递文件描述符的（BINDER_TYPE_FD处理过程）？", "a": "在函数binder_transaction中：源进程将文件描述符封装为BINDER_TYPE_FD类型的flat_binder_object结构体；Binder驱动用fget取得该fd（只在源进程有效）对应的文件结构体file；再用task_get_unused_fd_flags在目标进程获得一个未使用的文件描述符target_fd，用task_fd_install将它与file关联；最后将flat_binder_object的handle改为target_fd返回给目标进程。这样两个进程的fd指向同一文件结构体，即同一块匿名共享内存。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Client组件获得Binder驱动传来的文件描述符后如何最终访问共享内存？", "a": "先将flat_binder_object封装成ParcelFileDescriptor对象，再转换成FileDescriptor对象，最后用这个FileDescriptor创建MemoryFile对象（第二个构造函数），即将MemoryService内部的匿名共享内存映射到Client所在进程的地址空间，从而实现跨进程共享同一块匿名共享内存。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Activity组件从应用程序角度分为哪两种类型？", "a": "分为根Activity和子Activity。根Activity以快捷图标形式显示在应用程序启动器（Launcher）中，它的启动过程就代表了一个Android应用程序的启动过程；子Activity由根Activity或其他子Activity启动，可能与启动者同进程，也可能在不同进程。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "显式启动和隐式启动Activity组件有什么区别？隐式启动有什么好处？", "a": "显式启动必须事先知道实现该Activity的类名称；隐式启动只需知道组件名称（如Action名称），不需要知道实现类。从软件工程角度看，隐式启动可以减少Android应用程序组件间的依赖。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Launcher组件的快捷图标及其对应的Activity信息是如何获得的？", "a": "系统启动时PackageManagerService安装应用程序并解析其AndroidManifest.xml得到组件信息；Launcher启动时向PackageManagerService查询所有Action为MAIN且Category为LAUNCHER的Activity组件，为每一个创建快捷图标并关联其信息。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "系统中已启动的Activity组件是如何组织的？任务（Task）是什么？", "a": "所有Activity组件保存在一个堆栈中（ActivityStack的mHistory），后启动的位于先启动的上面。用户操作涉及的一组相关Activity组件用一个任务（Task）来描述，同一任务的Activity在堆栈中是连在一起的。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Launcher启动根Activity（如MainActivity）的过程涉及哪三个进程？", "a": "Launcher组件所在进程、ActivityManagerService所在的系统进程System、用来运行根Activity的新创建的应用程序进程。这三个进程通过Binder进程间通信机制协作完成启动过程。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "根Activity组件启动过程的六个主要步骤是什么？", "a": "(1)Launcher向AMS发送启动请求；(2)AMS保存目标Activity信息后请求Launcher进入Paused状态；(3)Launcher进入Paused后通知AMS；(4)AMS发现目标进程不存在，先创建新的应用程序进程；(5)新进程启动完成后通知AMS；(6)AMS将保存的Activity信息发给新进程，由它启动该Activity。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Launcher.startActivitySafely为什么将启动标志位Intent.FLAG_ACTIVITY_NEW_TASK设置为1？", "a": "因为根Activity代表一个应用程序，需要在一个新的任务（Task）中启动。设置该标志后，AMS在startActivityUncheckedLocked中会为目标Activity创建专属任务（或加入已存在的taskAffinity任务）。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Activity类的成员变量mInstrumentation的作用是什么？", "a": "它的类型为Instrumentation，用来监控应用程序和系统之间的交互操作。启动Activity属于这类交互，因此Activity通过其execStartActivity函数代为执行启动操作，以便监控该过程。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Activity类的成员变量mMainThread和mToken分别指向什么？", "a": "mMainThread类型为ActivityThread，描述当前应用程序进程，其getApplicationThread可获取进程内的ApplicationThread Binder本地对象；mToken是一个Binder代理对象，指向AMS中与该Activity对应的ActivityRecord对象。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityRecord对象的作用是什么？", "a": "在ActivityManagerService中，每一个已启动的Activity组件都有一个对应的ActivityRecord对象，用来维护该Activity组件的运行状态和信息。应用进程内则用ActivityClientRecord与之对应。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerNative.getDefault的作用是什么？", "a": "第一次调用时通过Service Manager获得名称为\"activity\"的服务代理对象（即AMS的代理），封装成ActivityManagerProxy对象并保存在静态成员变量gDefault中；以后调用直接返回该AMS代理对象。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerProxy.startActivity发送的请求中有哪三个需要重点关注的参数？", "a": "caller：源进程（Launcher）的ApplicationThread对象，供AMS回调通知Paused状态；intent：包含即将启动的Activity组件的信息；resultTo：指向AMS内部描述源Activity的ActivityRecord对象。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "AMS处理START_ACTIVITY_TRANSACTION请求的入口流程是什么？", "a": "ActivityManagerService.startActivity处理该请求，调用其类型为ActivityStack的成员变量mMainStack的startActivityMayWait；后者到PackageManagerService解析intent获得ActivityInfo，再调用startActivityLocked继续执行。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ProcessRecord对象描述什么？在startActivityLocked中如何使用？", "a": "AMS中每一个应用程序进程都用一个ProcessRecord对象描述。startActivityLocked通过mService的getRecordForAppLocked根据参数caller（ApplicationThread对象）得到源Activity所在进程的ProcessRecord（callerApp）。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "在startActivityUncheckedLocked中，什么条件下会为目标Activity创建一个新任务？", "a": "当目标Activity的启动标志位FLAG_ACTIVITY_NEW_TASK被置1，且源Activity不需要知道其执行结果（resultTo为null）时，AMS会为目标Activity创建专属任务（addingToTask为false时）；否则目标Activity与源Activity运行在同一个任务中。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "Activity组件的android:taskAffinity属性有什么作用？", "a": "用来描述一个Activity的专属任务。当AMS决定将目标Activity运行在另一个任务中时，会检查其专属任务是否已存在：存在则直接将Activity加入其中，否则先创建该任务再加入。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "启动标志位Intent.FLAG_ACTIVITY_NO_USER_ACTION有什么含义？", "a": "置1表示目标Activity不是由用户手动启动的。若是用户手动启动（该位为0），ActivityStack的mUserLeaving为true，后续会向源Activity发送用户离开事件通知（onUserLeaveHint）。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityStack的mResumedActivity、mLastPausedActivity、mPausingActivity分别描述什么？", "a": "三者类型均为ActivityRecord，分别描述系统当前激活的Activity组件、上一次被中止的Activity组件，以及正在被中止的Activity组件。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "resumeTopActivityLocked在源Activity尚未进入Paused状态时会怎么做？", "a": "此时mResumedActivity不为null（指向Launcher等源Activity），它会调用startPausingLocked通知源Activity进入Paused状态，让其把焦点让给即将启动的目标Activity，等目标Activity收到activityPaused通知后再继续启动。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "AMS在startPausingLocked中如何防止源Activity无响应？", "a": "向AMS线程的消息队列发送类型为PAUSE_TIMEOUT_MSG的消息，指定在PAUSE_TIMEOUT毫秒后处理。若源Activity不能在该时限内回复已进入Paused状态，AMS就认为它没有响应。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "AMS通过什么向应用进程发送中止（Pause）通知？该请求是同步还是异步？", "a": "通过描述源Activity的ActivityRecord的成员变量app.thread（类型为ApplicationThreadProxy的Binder代理对象）发送SCHEDULE_PAUSE_ACTIVITY_TRANSACTION请求；该请求是异步的，AMS发送后立即返回。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ApplicationThread收到中止通知后，为什么不直接在当前线程执行中止操作，而是发送PAUSE_ACTIVITY消息到主线程？", "a": "一是因为当前线程是Binder线程，需要尽快返回Binder线程池处理其他进程间通信请求；二是因为中止Activity的过程可能涉及用户界面相关操作，必须在主线程中执行。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.handlePauseActivity在中止Activity时做了哪三件事情？", "a": "(1)调用performUserLeavingActivity发送用户离开事件通知（onUserLeaveHint）；(2)调用performPauseActivity发送中止事件通知（onPause）；(3)调用QueuedWork.waitToFinish等待完成之前的数据写入操作（如写磁盘），保证状态数据可恢复。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityClientRecord是什么？保存在哪里？", "a": "应用程序进程中每一个已启动的Activity组件都用一个ActivityClientRecord对象描述，它与AMS中的ActivityRecord对应，以token（指向AMS中ActivityRecord的Binder代理）为关键字保存在ActivityThread的成员变量mActivities中。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityStack.startSpecificActivityLocked如何决定在已有进程中启动还是创建新进程？", "a": "根据目标Activity的用户ID（安装时由PackageManagerService分配）和进程名称（由android:process属性决定）检查系统中是否存在对应的应用程序进程：存在则直接调用realStartActivityLocked启动，否则先调用startProcessLocked创建进程再启动。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "AMS创建新应用程序进程时（startProcessLocked）有什么超时保护机制？", "a": "以新进程的pid为关键字将ProcessRecord保存在mPidsSelfLocked中，并向AMS线程消息队列发送PROC_START_TIMEOUT_MSG消息。新进程必须在PROC_START_TIMEOUT毫秒内完成启动并通知AMS，否则视为启动超时。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "新的应用程序进程入口函数ActivityThread.main主要做哪两件事？", "a": "(1)创建一个ActivityThread对象（内部同时创建ApplicationThread Binder本地对象），并调用其attach函数向AMS发送启动完成通知；(2)调用Looper.prepareMainLooper创建消息循环，并在通知后进入消息循环。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "AMS的attachApplicationLocked如何处理新进程的启动完成通知？", "a": "根据pid从mPidsSelfLocked中取回ProcessRecord并初始化（将其thread设置为ApplicationThread代理对象），删除PROC_START_TIMEOUT_MSG消息；然后检查堆栈顶端ActivityRecord的用户ID和进程名称是否与新进程一致，一致则调用realStartActivityLocked启动该Activity。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "AMS与应用程序进程之间是如何进行双向Binder通信的？", "a": "进程内的ApplicationThread是Binder本地对象，通过attachApplication传给AMS；AMS将其封装在ProcessRecord的成员变量thread（ApplicationThreadProxy代理对象）中，通过它向应用进程发送调度请求（如schedulePauseActivity、scheduleLaunchActivity）。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "LoadedApk对象描述什么？在启动Activity时如何获得？", "a": "LoadedApk用来描述一个已加载到进程中的Apk文件，通过它可以访问应用资源。启动Activity时，ActivityThread通过getPackageInfoNoCheck获得对应的LoadedApk对象，保存在ActivityClientRecord的packageInfo中。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.performLaunchActivity启动一个Activity的主要步骤是什么？", "a": "(1)从ComponentName获得包名和类名，加载类并创建Activity实例；(2)创建并初始化ContextImpl对象作为运行上下文；(3)用ContextImpl和ActivityClientRecord初始化Activity；(4)调用mInstrumentation.callActivityOnCreate触发Activity的onCreate；(5)以token为关键字将ActivityClientRecord保存到mActivities。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.handleLaunchActivity做了哪两件事？", "a": "先调用performLaunchActivity将Activity组件启动起来（最终调用其onCreate），再调用handleResumeActivity将Activity的状态设置为Resumed，表示它是系统当前激活的Activity组件。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "ContextImpl对象的作用是什么？", "a": "用来描述Activity或Service组件的运行上下文环境，通过它可以访问特定应用程序的资源，以及启动其他应用程序组件。每个组件启动时由ActivityThread创建并初始化。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "子Activity在进程内启动时，它被放入任务（Task）的什么位置？", "a": "若源Activity未指定新任务且两者的taskAffinity相同，AMS将目标的task设为源Activity的task（同一任务）。插入位置通过自上而下搜索mHistory找到该任务，将任务最顶端Activity的位置加1得到addPos。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "决定一个Activity组件在已有进程中启动还是在新进程中启动的因素有哪些？", "a": "两个因素：一是该Activity所属应用程序的用户ID（由PackageManagerService在安装时分配）；二是该Activity的android:process属性。这也说明一个Android应用程序可以对应多个应用程序进程。"}, {"ch": "第7章 Activity组件的启动过程", "ci": 6, "part": "第3篇 Android应用程序框架", "q": "为什么说任务（Task）使Activity组件的重用性非常强？", "a": "任务是一个比进程更高级和抽象的概念，可以将运行在不同进程中的Activity组件整合在一起共同完成业务功能。例如其他应用可以直接启动Email应用的EmailSender组件并与其运行在同一任务中，用户感觉不到它们处于不同进程。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "Service组件的用途是什么？与Activity组件有什么不同？", "a": "Service是四大组件之一，主要用来处理与用户界面无关的业务逻辑。由于不直接与用户交互，其业务逻辑一般是计算型的，适合在后台运行；而Activity负责用户界面的展现与交互。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "Service组件的启动方式有哪几种？", "a": "与Activity类似，分为显式和隐式两种：隐式启动只需知道Service的组件名称；显式启动需要知道它的类名称。Service可被Activity或其他Service启动，可在同进程或新进程中启动。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "将Service组件与启动者绑定起来有什么好处？", "a": "绑定后启动者可以通过Service返回的Binder本地对象方便地获得它的访问接口，从而直接调用Service提供的服务（如CounterService的startCounter/stopCounter接口）。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "自定义Service组件的onCreate和onBind分别在什么时候被调用？", "a": "Service组件启动时它的onCreate被调用，用来执行初始化工作；Service组件被绑定时onBind被调用，它将内部的Binder本地对象（如CounterBinder）返回给绑定者，以便绑定者获得访问接口。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "AsyncTask的doInBackground、onProgressUpdate、onPostExecute分别在哪个线程执行？", "a": "只有doInBackground在后台线程中执行；onProgressUpdate和onPostExecute都在应用程序主线程中执行，因此后两者可以安全地更新用户界面。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "Counter组件绑定CounterService成功后如何获得其访问接口？", "a": "ServiceConnection的onServiceConnected被调用，参数service是CounterService内部的CounterBinder Binder本地对象；由于同进程，可以安全地将其转换为CounterBinder对象，再调用其getService函数获得ICounterService访问接口。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "绑定了Service的Activity销毁时需要做什么？会触发什么回调？", "a": "必须在onDestroy中调用父类ContextWrapper的unbindService解绑Service组件。解绑成功后，ServiceConnection的onServiceDisconnected会被调用，用来执行清理工作。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "Service组件在新进程中的启动过程（如Server组件）分为哪四个主要步骤？", "a": "(1)Client向AMS发送启动Server组件的进程间通信请求；(2)AMS保存Server组件信息并创建新的应用程序进程；(3)新进程启动完成后向AMS发送启动完成通知；(4)AMS将保存的Server组件信息发送给新进程，由它将Server组件启动起来。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ContextWrapper.startService实际是由谁执行的？", "a": "ContextWrapper的成员变量mBase实际指向一个ContextImpl对象（组件的运行上下文），因此startService实际调用ContextImpl.startService，后者通过ActivityManagerNative.getDefault获得AMS代理并发送启动请求。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ContextImpl.startService为什么要将ApplicationThread对象传递给AMS？", "a": "通过ActivityThread的getApplicationThread获得当前进程的ApplicationThread Binder本地对象并传给AMS，使AMS知道是谁请求启动Service，并且以后可以通过该对象对应的代理与该进程通信。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ServiceRecord是什么？如何获得？", "a": "AMS中每一个Service组件都用一个ServiceRecord对象描述（类似Activity组件的ActivityRecord）。startServiceLocked调用retrieveServiceLocked查找已有的ServiceRecord；不存在则到PackageManagerService获取组件信息并封装成ServiceRecord。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService.bringUpServiceLocked的逻辑是什么？", "a": "先取Service的android:process属性（appName）和用户ID，在AMS中查找对应的ProcessRecord：存在则直接调用realStartServiceLocked在该进程中启动Service；不存在则调用startProcessLocked创建进程，并将ServiceRecord保存在mPendingServices中等待启动。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "AMS的成员变量mPendingServices的作用是什么？", "a": "保存正在等待启动的Service组件（ServiceRecord），即其宿主进程尚不存在、已调用startProcessLocked创建的Service。新进程attach完成后，attachApplicationLocked会检查mPendingServices并对匹配的Service调用realStartServiceLocked。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "新进程启动完成后，attachApplicationLocked处理Activity和Service的优先顺序如何？为什么？", "a": "优先处理需要在该进程中启动或显示的Activity组件（调用realStartActivityLocked或ensureActivitiesVisibleLocked），然后再处理mPendingServices中的Service组件。因为Activity需要与用户交互，而Service不需要。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService.realStartServiceLocked做了哪些事？", "a": "将ServiceRecord的app设置为ProcessRecord，并将ServiceRecord添加到ProcessRecord的services列表，表示该Service在该进程中启动；然后通过app.thread（ApplicationThreadProxy）的scheduleCreateService请求进程创建该Service。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "SCHEDULE_CREATE_SERVICE_TRANSACTION请求在应用进程内的处理链是什么？", "a": "ApplicationThread.scheduleCreateService将Service信息封装成CreateServiceData对象，通过queueOrSendMessage向主线程发送CREATE_SERVICE消息；H.handleMessage处理该消息并调用ActivityThread.handleCreateService。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.handleCreateService启动Service的步骤是什么？", "a": "(1)通过getPackageInfoNoCheck获得LoadedApk对象；(2)用其类加载器加载Service类并创建实例；(3)创建ContextImpl作为运行上下文，创建Application对象并初始化Service；(4)调用Service的onCreate；(5)以token为关键字将Service保存到ActivityThread的mServices中。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "Service组件在进程内绑定过程的五个主要步骤是什么？", "a": "(1)Counter向AMS发送绑定CounterService的请求；(2)AMS发现目标进程即Counter所在进程，直接通知该进程启动CounterService；(3)Service启动后AMS请求它返回内部Binder本地对象；(4)AMS将该Binder对象发送给Counter；(5)Counter通过它获得Service访问接口，完成绑定。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "LoadedApk.getServiceDispatcher的作用是什么？ServiceDispatcher记录了哪些信息？", "a": "将绑定者的ServiceConnection封装成实现IServiceConnection接口的Binder本地对象（InnerConnection）。ServiceDispatcher的mContext指向Activity，mConnection指向ServiceConnection，mActivityThread指向主线程Handler（ActivityThread的mH）。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "LoadedApk中ServiceDispatcher对象是如何存储的？", "a": "保存在LoadedApk的成员变量mServices中：外层HashMap以Activity的Context为关键字，内层HashMap以ServiceConnection对象为关键字保存对应的ServiceDispatcher对象。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ServiceRecord、IntentBindRecord、AppBindRecord三者的关系是什么？", "a": "ServiceRecord描述一个Service，其bindings以FilterComparison为关键字保存IntentBindRecord，描述绑定该Service的若干应用程序进程；每个IntentBindRecord的apps中以ProcessRecord为关键字保存AppBindRecord，表示某进程绑定了该Service。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ConnectionRecord描述什么？如何存储？", "a": "描述一个Activity通过某个InnerConnection对象绑定了一个Service（封装AppBindRecord、ActivityRecord和connection）。使用相同InnerConnection的ConnectionRecord保存在同一列表中，以该InnerConnection代理的IBinder接口为关键字存于ServiceRecord的connections中。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "bindService的flags中Context.BIND_AUTO_CREATE置位有什么作用？", "a": "AMS的bindService处理BIND_SERVICE_TRANSACTION时，若该位置1，则在记录ConnectionRecord之后调用bringUpServiceLocked先将被绑定的Service组件启动起来，然后再将它与Activity组件绑定。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "requestServiceBindingLocked在什么条件下请求Service返回内部Binder本地对象？", "a": "当IntentBindRecord的requested为false（尚未请求过）且其描述的应用程序进程个数大于0时，通过ApplicationThreadProxy的scheduleBindService请求Service返回Binder本地对象，并将requested置为true避免重复请求。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.handleBindService如何获得Service内部的Binder本地对象？", "a": "以BindServiceData的token为关键字从mServices中取出对应的Service对象；若是首次绑定（rebind为false），调用该Service的onBind获得其内部Binder本地对象，再通过AMS代理的publishService将它传递给AMS。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "AMS的publishService函数做了什么？", "a": "根据token和intent找到ServiceRecord和IntentBindRecord，首次收到时将Binder本地对象保存到IntentBindRecord的binder中并置requested、received为true；然后遍历connections中的ConnectionRecord，调用其conn（InnerConnection代理）的connected将Binder对象传给绑定者。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "CounterService的Binder本地对象传回Counter组件的调用链是什么？", "a": "AMS调用InnerConnection.connected，转调ServiceDispatcher.connected；后者将RunConnection封装成消息发送到主线程消息队列；RunConnection.run调用ServiceDispatcher.doConnected，最终调用Counter内部ServiceConnection的onServiceConnected。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "ServiceDispatcher为什么不直接调用doConnected传递Binder本地对象，而是通过消息处理机制间接传递？", "a": "一是因为当前线程是Binder线程，需要尽快返回Binder线程池处理其他进程间通信请求，提高并发能力；二是因为绑定者接收Binder本地对象时可能需要执行与用户界面相关的操作，必须在主线程中执行。"}, {"ch": "第8章 Service组件的启动过程", "ci": 7, "part": "第3篇 Android应用程序框架", "q": "IntentBindRecord的成员变量requested和received分别表示什么？", "a": "requested表示AMS是否已向Service组件请求过返回其内部Binder本地对象；received表示该Service是否已将内部Binder本地对象传递给AMS。两者在publishService收到Binder对象后都置为true，避免重复请求。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "Android系统已经有了Binder进程间通信机制，为什么还需要广播机制？", "a": "Binder通信中Client必须先获得Service的代理对象，即事先要知道对方的存在；而广播发送者事先不需要知道广播接收者的存在，基于消息发布/订阅模型，降低了发送者与接收者的耦合度，提高系统的可扩展性和可维护性。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "广播机制中的注册中心由哪个组件担当？广播接收者订阅消息的表现形式是什么？", "a": "由ActivityManagerService（AMS）担当。广播接收者订阅消息的表现形式就是将自己注册到ActivityManagerService中，并指定要接收的广播类型；广播发送者先把广播发给AMS，再由AMS按类型找到接收者并转发。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "广播接收者有哪两种注册方式？各自如何实现？", "a": "静态注册：在AndroidManifest.xml中注明Broadcast Receiver组件感兴趣的广播类型；动态注册：在代码中调用Context接口的registerReceiver注册到AMS。同等情况下，动态注册的接收者优先接收到广播。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "有序广播和无序广播的转发方式有何区别？", "a": "有序广播：AMS先发给符合条件的优先级较高的接收者，处理完再发给优先级较低的，按优先级串行转发；无序广播：忽略优先级，并行地发送给所有符合条件的广播接收者。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "什么是黏性（Sticky）广播？如何发送？", "a": "黏性广播被发送到AMS后会一直保存在AMS中，直到下次接收到同类型黏性广播为止；组件注册接收某类型广播时，若AMS中恰好有该类型黏性广播，会将其返回给注册者，使其知道上一次广播的内容。通过ContextWrapper的sendStickyBroadcast发送。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "在广播接收者注册过程中，真正注册到ActivityManagerService的是BroadcastReceiver本身吗？", "a": "不是。应用程序进程先将BroadcastReceiver封装成实现了IIntentReceiver接口的Binder本地对象InnerReceiver，再将该InnerReceiver注册到AMS；AMS收到广播时根据类型找到对应的InnerReceiver，再通过它把广播发给真正的广播接收者。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "写出广播接收者动态注册的调用路径（从Activity到AMS）。", "a": "Activity.onResume → ContextWrapper.registerReceiver → ContextImpl.registerReceiver → ActivityManagerProxy.registerReceiver（发送REGISTER_RECEIVER_TRANSACTION进程间通信请求）→ ActivityManagerService.registerReceiver。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "LoadedApk类如何管理一个应用中注册的广播接收者？", "a": "每个注册了广播接收者的Activity组件对应一个ReceiverDispatcher对象，以广播接收者为关键字保存在HashMap中；这些HashMap又以注册它的Activity组件的Context接口为关键字，保存在LoadedApk的成员变量mReceivers中。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "ReceiverDispatcher类有哪几个关键成员变量？各自指向什么？", "a": "mReceiver指向被封装的广播接收者；mActivityThread指向关联Activity组件所在应用程序进程主线程的Handler对象（即ActivityThread的mH），用于向主线程消息队列发消息；mContext指向关联的Activity组件；mIIntentReceiver指向内部类型为InnerReceiver的Binder本地对象。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService用什么数据结构保存动态注册的广播接收者？", "a": "每个广播接收者用一个BroadcastFilter对象描述（由InnerReceiver、IntentFilter和permission创建）；使用相同InnerReceiver注册的接收者保存在一个ReceiverList列表中（以InnerReceiver为关键字），存放在AMS成员变量mRegisteredReceivers中；同时BroadcastFilter还加入mReceiverResolver用于查找。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "简述广播发送过程的四个阶段。", "a": "(1)发送者（Activity/Service组件）将广播发送给AMS；(2)AMS找到目标接收者，加入广播调度队列，并向自己所在线程的消息队列发送BROADCAST_INTENT_MSG消息，此时发送者即认为发送完成；(3)该消息被处理时，AMS从调度队列中取出广播转发给目标接收者所在的应用程序进程；(4)接收进程将广播封装成消息发到主线程消息队列，处理时才分发给广播接收者。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "AMS内部使用哪两个广播调度队列？分别存放什么？", "a": "无序广播调度队列mParallelBroadcasts：存放目标是动态注册接收者的无序广播转发任务，转发时并行直接发送；有序广播调度队列mOrderedBroadcasts：存放有序广播及无序广播的静态注册目标接收者，队列内目标接收者按优先级从高到低排列。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "AMS如何避免向消息队列重复发送BROADCAST_INTENT_MSG调度消息？", "a": "用成员变量mBroadcastsScheduled标记是否已发送该消息。scheduleBroadcastsLocked先检查它：若为true说明消息队列中已有该消息，直接返回；否则发送消息并将mBroadcastsScheduled置为true；processNextBroadcast处理消息时再将其复位为false。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "标志位FLAG_RECEIVER_REPLACE_PENDING的作用是什么？", "a": "当AMS还没来得及转发上一次接收的同类型广播，又接收到一个新广播时，若新广播带有FLAG_RECEIVER_REPLACE_PENDING标志，AMS就会用新广播替换调度队列中旧的广播，而不是新增一个广播转发任务。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "无序广播在processNextBroadcast中是如何被处理的？", "a": "processNextBroadcast先用while循环遍历无序广播调度队列mParallelBroadcasts，对每个BroadcastRecord调用deliverToRegisteredReceiverLocked并行地将广播直接发送给所有动态注册的目标接收者，不需要等待接收者处理完成。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "有序广播的目标接收者是静态注册且其所在进程未启动时，AMS如何处理？", "a": "AMS调用startProcessLocked先启动该接收者所在的应用程序进程，并将BroadcastRecord保存在mPendingBroadcast（及mPendingBroadcastRecvIndex）中等待；进程启动后AMS再通过processCurBroadcastLocked将广播发送给它。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "AMS对有序广播的超时机制是怎样的？", "a": "发送有序广播给某个接收者前，AMS通过setBroadcastTimeoutLocked向自己线程的消息队列发送一个BROADCAST_TIMEOUT_MSG消息；若接收者不能在BROADCAST_TIMEOUT毫秒内处理完成，即认为超时；整个广播转发任务的总时限为2*BROADCAST_TIMEOUT*numReceivers毫秒，超时则由broadcastTimeoutLocked强制结束。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "deliverToRegisteredReceiverLocked在转发广播前做什么权限检查？", "a": "双向权限检查：若BroadcastFilter的requiredPermission不为null则检查广播发送者的权限；若BroadcastRecord的requiredPermission不为null则检查广播接收者的权限；通过checkComponentPermission检查对方PID和UID是否符合要求，检查不通过则跳过（skip）该接收者。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "广播从AMS到达目标应用程序进程后，是如何一步步传递到BroadcastReceiver.onReceive的？", "a": "AMS调用performReceiveLocked → ApplicationThreadProxy.scheduleRegisteredReceiver（FLAG_ONEWAY异步）→ ApplicationThread.scheduleRegisteredReceiver → InnerReceiver.performReceive → ReceiverDispatcher.performReceive将广播封装成Args对象消息发送到主线程消息队列 → Args.run → 调用BroadcastReceiver.onReceive。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "为什么AMS发送给同一应用程序进程的多个广播能按发送顺序串行接收？", "a": "AMS向应用程序进程发送广播采用异步进程间通信（FLAG_ONEWAY），Binder驱动将发送给同一Binder实体对象的异步事务保存在一个异步事务队列中，同一时刻只有队列头部的异步事务得到处理，因此广播按发送顺序串行地被接收和处理。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "有序广播的目标接收者处理完广播后需要做什么？为什么？", "a": "需要调用ActivityManagerService代理对象的finishReceiver通知AMS该有序广播已处理完成，AMS才能继续将这个有序广播转发给下一个目标接收者（在Args.run中，当是有序广播且接收者已注册时执行）。"}, {"ch": "第9章 Android系统广播机制", "ci": 8, "part": "第3篇 Android应用程序框架", "q": "AMS的verifyBroadcastLocked在系统启动过程中对广播有什么限制？", "a": "系统启动过程中PackageManagerService可能尚未启动，AMS无法获得静态注册的广播接收者，因此会验证广播是否只发送给动态注册的广播接收者，即禁止将广播发送给静态注册的接收者；同时验证广播内容合法（如不携带文件描述符）。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider组件在Android系统中的作用是什么？", "a": "它除了作为数据访问接口外，还可以在不同应用程序之间进行数据共享。因为每个应用安装时分配不同的Linux用户ID，只能访问自己的数据；Content Provider通过Binder突破以应用程序为边界的权限控制，并以匿名共享内存作为传输媒介实现高效共享。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider传输大数据时为什么不直接使用Binder机制？它采用什么方案？", "a": "Binder传输大数据时效率会成为问题。Content Provider结合两种机制：用Binder进程间通信机制突破权限控制并传递控制信息，用匿名共享内存（Ashmem）作为大数据的传输媒介，跨进程只需传递一个文件描述符，因此能高效传输大数据。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider访问URI由哪四个组件构成？", "a": "A：协议名称，固定为content://；B：Content Provider的android:authority属性值，类似URL域名，需全局唯一（一般用包名）；C：资源相对路径，描述要访问的资源类型；D：资源ID，描述要访问的一个具体资源（可选，缺省表示该类型的全部实例）。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider返回数据的MIME类型有哪两个规定的大类？子类如何约定？", "a": "大类统一为vnd.android.cursor.dir（描述一个数据集合）和vnd.android.cursor.item（描述个体数据）；子类可自定义，一般约定为vnd.[company name].[resource type]，例如vnd.android.cursor.dir/vnd.shy.luo.article表示一个博客文章集合。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider的成员函数query和未公开的call有什么区别？各自适用什么场景？", "a": "query将数据保存在Cursor对象中传输，Cursor中的数据通过匿名共享内存传输，适合大数据量；call将数据保存在Bundle对象中直接用Binder传输。匿名共享内存的创建和映射有开销，数据量小时得不偿失，因此call适合快速获取少量数据（如用METHOD_GET_ITEM_COUNT获取条目总数）。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider组件的android:multiprocess属性含义是什么？", "a": "为true时，该组件可以在每一个访问它的应用程序进程中各创建一个实例；为false时，整个系统只能存在一个实例，运行在一个独立的应用程序进程中，其他应用程序只能通过Binder进程间通信机制访问它。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "简述MainActivity第一次访问ArticlesProvider组件时的整体流程（4步）。", "a": "(1)MainActivity通过Articles.CONTENT_URI访问ArticlesProvider；(2)其所在进程发现没有该Provider的代理对象，就请求AMS返回代理对象；(3)AMS发现Provider未启动，先创建新的应用程序进程并在其中启动该Provider；(4)Provider启动后将自身发布到AMS，AMS把它的代理对象返回给请求方。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "应用程序进程在哪些地方缓存Content Provider组件的代理对象？", "a": "ActivityThread的成员变量mProviderMap是一个HashMap，保存当前进程访问过的Content Provider代理对象（封装为ProviderClientRecord，以authority为关键字）；本地运行的Provider另存于mLocalProviders中。getProvider时先查缓存，没有才请求AMS。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "AMS用什么对象描述已启动的Content Provider组件？保存在哪些成员变量中？", "a": "用ContentProviderRecord对象描述，分别保存在mProvidersByName（以android:authorities属性值为关键字）和mProvidersByClass（以组件类名为关键字）两个HashMap中；正在启动的Provider记录在mLaunchingProviders中，其宿主进程记录在ContentProviderRecord的launchingApp中。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "AMS的getContentProviderImpl对android:multiprocess=true的组件如何处理？", "a": "直接将与该组件对应的ContentProviderRecord返回给请求方的应用程序进程，由请求方根据其中的信息在自己的进程中启动该Content Provider组件，而不由AMS在独立进程中启动。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "在独立进程中启动Content Provider时，AMS请求新进程启动组件的调用链是什么？", "a": "AMS.startProcessLocked创建新进程（入口为ActivityThread.main）→ 新进程ActivityManagerProxy.attachApplication（ATTACH_APPLICATION_TRANSACTION）→ AMS.attachApplicationLocked中generateApplicationProvidersLocked获得要在该进程启动的Provider列表 → ApplicationThreadProxy.bindApplication → 新进程handleBindApplication → installContentProviders启动它们。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.installProvider在宿主进程中启动一个Content Provider的过程是什么？", "a": "根据ProviderInfo中的类名反射创建ContentProvider实例，调用其getIContentProvider获得内部的IContentProvider接口（Transport Binder本地对象），再调用attachInfo初始化组件；然后为每个android:authorities值创建ProviderClientRecord保存到mProviderMap，本地Provider还保存到mLocalProviders。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "ContentProvider内部的Transport对象有什么作用？", "a": "Transport是ContentProvider内部的Binder本地对象，实现IContentProvider接口，负责接收和处理发给宿主Content Provider的进程间通信请求。它通过publishContentProviders发布到AMS，AMS将引用它的Binder代理对象封装成ContentProviderHolder返回给其他访问进程。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "AMS如何知道一个正在启动的Content Provider已经启动完成？", "a": "Provider启动完成后，宿主进程调用ActivityManagerProxy.publishContentProviders（PUBLISH_CONTENT_PROVIDERS_TRANSACTION）将包含IContentProvider接口的ContentProviderHolder发布到AMS；AMS将其保存在对应ContentProviderRecord的成员变量provider中，唤醒此前在while循环中等待的线程，把代理对象返回给请求方。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "ContentProvider.attachInfo做了哪些初始化？onCreate中应注意什么？", "a": "attachInfo将context保存到mContext，保存readPermission、writePermission、pathPermissions等访问权限信息，最后调用子类重写的onCreate执行业务初始化。onCreate在启动过程中被调用，应避免执行耗时操作（如IO），否则可能导致组件启动超时而被系统中止；打开数据库最好延迟到第一次使用时（SQLiteOpenHelper）。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider的数据共享模型中，客户端进程创建哪些对象？服务端创建哪些对象？", "a": "客户端（MainActivity）创建CursorWindow对象（内含匿名共享内存）和BulkCursorToCursorAdaptor对象（CursorWindow保存在其父类AbstractWindowedCursor的mWindow中）；服务端创建SQLiteCursor对象（关联同一CursorWindow）和CursorToBulkCursorAdaptor对象（Binder本地对象）；客户端将服务端返回的CursorToBulkCursorAdaptor代理保存在BulkCursorToCursorAdaptor的mBulkCursor中。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "SQLiteCursor类的继承/实现关系是什么？", "a": "SQLiteCursor继承AbstractWindowedCursor类，AbstractWindowedCursor继承AbstractCursor类；AbstractCursor实现了CrossProcessCursor接口，CrossProcessCursor又从Cursor接口继承。因此SQLiteCursor可以描述一个跨进程传输共享数据的游标。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "两侧的CursorWindow对象如何实现数据共享？关键点是什么？", "a": "客户端通过Binder把CursorWindow传递给服务端后，两侧的CursorWindow对象引用同一块匿名共享内存（左侧BulkCursorToCursorAdaptor的mBulkCursor引用右侧CursorToBulkCursorAdaptor）。服务端把查询到的数据写入这块内存，客户端即可直接读取，无需再经Binder传输数据本身。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Java层的CursorWindow如何在C++层创建匿名共享内存？", "a": "构造时通过JNI方法native_init创建关联的C++层CursorWindow对象（大小由MAX_WINDOW_SIZE指定，为1024*1024即1MB），其成员函数initBuffer先创建MemoryHeapBase对象（创建匿名共享内存），再封装成MemoryBase对象保存在mMemory中；跨进程传递时通过native_getBinder获得该MemoryBase对应的Binder对象写入Parcel。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider数据传输过程中，客户端如何发起查询请求？", "a": "ContentResolver.query先通过acquireProvider获得IContentProvider接口（ContentProviderProxy），再创建CursorWindow和BulkCursorToCursorAdaptor，调用bulkQueryInternal向服务端发送IContentProvider.QUERY_TRANSACTION请求，Parcel中携带CursorWindow（匿名共享内存信息）以及是否需要返回元数据（wantsCursorMetadata）的标志。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "服务端Transport.bulkQuery如何构建游标？", "a": "调用ContentProvider子类（如ArticlesProvider）的query，用SQLiteQueryBuilder构造SQL查询语句，经SQLiteDatabase.rawQueryWithFactory、SQLiteDirectCursorDriver.query创建SQLiteCursor（内含SQLiteQuery数据库查询计划），再调用AbstractWindowedCursor.setWindow把客户端传来的CursorWindow设置进去，封装成CursorToBulkCursorAdaptor返回。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "为什么说数据库查询计划是延迟执行的？何时真正执行？", "a": "创建SQLiteCursor时只是保存了SQL查询计划（SQLiteQuery的mCompiledSql），SQLiteCursor的mCount初始为NO_COUNT，尚未读取数据。当客户端第一次访问数据或请求元数据（如调用count→getCount→fillWindow）时，才执行SQLiteQuery.fillWindow（native_fill_window），把查询结果写入CursorWindow引用的匿名共享内存并返回总行数。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "AMS/服务端返回元数据时为何要查找名为“_id”的字段？", "a": "返回元数据包括条目总数（CursorToBulkCursorAdaptor.count）和字段名称集合；客户端通过BulkCursorToCursorAdaptor.findRowIdColumnIndex在字段名集合中定位“_id”字段的位置值。数据库表主键字段一般命名为“_id”，因为CursorAdapter等接口要通过它来标志一行数据。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "Content Provider的数据更新通知机制是怎样的模型？注册中心是谁？", "a": "它与广播机制类似，是消息发布/订阅的事件驱动模型：内容观察者（ContentObserver）负责接收数据更新通知，Content Provider负责发送通知。内容观察者先注册到ContentService并指定要监控的URI；数据更新时Provider将描述该数据的URI发给ContentService，由它找到对应观察者并发送通知。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "内容观察者注册到ContentService的调用路径是什么？真正注册的是什么对象？", "a": "MainActivity.onCreate创建ContentObserver子类（如ArticleObserver）→ ContentResolver.registerContentObserver → 调用observer的getContentObserver获得类型为Transport的Binder本地对象 → ContentService代理的registerContentObserver。真正注册的不是观察者本身，而是其内部Transport Binder本地对象，它代替观察者接收通知。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "ContentService用什么数据结构维护注册的内容观察者？", "a": "用一棵ObserverNode树：根节点为mRootNode；每个ObserverNode保存一组监控相同数据的观察者（封装成ObserverEntry存于mObservers），子节点存于mChildren。节点按URI的路径分段组织：URI被拆成authority和后续路径段，逐段沿树查找/创建对应名称的子节点，叶子节点上挂ObserverEntry。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "ObserverNode.collectMyObserversLocked收集观察者时依据哪些条件？", "a": "遍历当前节点的mObservers：(1)若该观察者正是触发数据更新的观察者且selfNotify为false，则跳过；(2)若当前正在收集的是URI叶子路径上的观察者，则收集；(3)若不是叶子路径，但该观察者注册时notifyForDescendents为true（还需监控以其URI为前缀的其他URI），也收集。收集结果封装为ObserverCall加入calls列表。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "简述数据更新通知从Provider到内容观察者的完整流程。", "a": "Provider插入/更新/删除数据后构造描述该数据的URI，调用内部ContentResolver的notifyChange → ContentService.notifyChange → mRootNode.collectObserverLocked收集目标观察者（Transport代理对象）→ 逐个调用Transport.onChange → ContentObserver.dispatchChange → 封装成NotificationRunnable消息发到指定线程消息队列 → NotificationRunnable.run → 子类重写的onChange被调用。"}, {"ch": "第10章 Content Provider组件的实现原理", "ci": 9, "part": "第3篇 Android应用程序框架", "q": "ContentObserver内部的Handler对象（mHandler）在接收数据更新通知时起什么作用？", "a": "mHandler为null时，接收线程直接调用onChange处理；否则将通知封装成NotificationRunnable消息发送到指定线程（一般是主线程）的消息队列。好处：一是让Binder接收线程尽快返回处理其他请求，二是使onChange中可以执行与界面相关的操作。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "Zygote进程为什么被称为进程孵化器？它采用什么方式创建System进程和应用程序进程？", "a": "因为Android系统中所有应用程序进程和System进程都由Zygote负责创建。它通过fork复制自身来创建子进程；由于Zygote启动时内部已创建了一个虚拟机实例，复制得到的子进程可以快速获得一个虚拟机实例拷贝。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "Zygote进程由哪个进程启动？init进程启动时读取什么脚本文件？", "a": "Zygote进程由系统的第一个进程init启动。init进程在内核加载完成后启动，启动过程中会读取根目录下的init.rc脚本文件，将需要开机启动的进程（以服务形式配置）一并启动。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "init.rc中Zygote服务的应用程序文件是什么？启动参数“--start-system-server”表示什么含义？", "a": "应用程序文件为/system/bin/app_process。“--start-system-server”表示Zygote进程启动完成后需要马上将System进程也启动起来，以便System进程启动系统的关键服务。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "Zygote进程启动时创建的名称为“zygote”的Socket有什么用途？其访问权限是多少？", "a": "用于进程间通信：运行在System进程中的ActivityManagerService通过这个Socket请求Zygote进程创建新的应用程序进程。访问权限为666，即所有用户都可以对它进行读和写。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "init进程通过函数create_socket为Zygote创建Socket后，会生成哪个设备文件？publish_socket又把它保存在哪个环境变量中？", "a": "create_socket创建AF_UNIX类型的Socket并bind到设备文件/dev/socket/zygote。publish_socket将文件描述符格式化为字符串，保存在名称为“ANDROID_SOCKET_zygote”的环境变量中，供Zygote进程启动时读取。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "app_process的入口函数main中如何判断当前是在Zygote进程中启动？启动Zygote使用哪个类的对象？", "a": "通过检查启动参数arg是否包含“--zygote”选项来判断。若包含，则调用set_process_name将进程名设为“zygote”，然后创建AppRuntime对象runtime，并调用其成员函数start（继承自AndroidRuntime）进一步启动Zygote进程。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "AndroidRuntime类的成员函数start的三个关键步骤是什么？", "a": "1）调用startVM在进程中创建一个虚拟机实例；2）调用startReg在虚拟机中注册一系列JNI方法；3）调用com.android.internal.os.ZygoteInit类的静态成员函数main继续启动Zygote进程。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ZygoteInit.main依次执行哪三个关键步骤？", "a": "1）调用registerZygoteSocket创建Server端Socket；2）调用startSystemServer启动System进程；3）调用runSelectLoopMode进入无限循环，等待ActivityManagerService请求创建新的应用程序进程。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ZygoteInit.registerZygoteSocket是如何创建Server端Socket的？创建结果保存在哪里？", "a": "它读取环境变量“ANDROID_SOCKET_zygote”的值并转换为文件描述符，再根据该文件描述符创建一个Server端Socket，保存在ZygoteInit的静态成员变量sServerSocket中。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ZygoteInit类的静态成员变量ZYGOTE_FORK_MODE为什么被设置为false？", "a": "若为true则调用runForkMode，每收到一个创建请求都会创建一个新进程来处理，浪费大量进程资源。设为false则调用runSelectLoopMode，让所有创建应用程序进程的请求都在同一个（Zygote）进程中处理。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ZygoteInit.startSystemServer通过哪个函数创建System进程？System进程的用户ID是多少？", "a": "通过Zygote类的静态成员函数forkSystemServer（内部使用fork）创建子进程即System进程。其用户ID和用户组ID均被设置为1000，并具有用户组1001～1010、1018以及3001～3003的权限。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "在ZygoteInit.runSelectLoopMode中，selectReadable返回值index等于0和大于0分别代表什么？分别如何处理？", "a": "index等于0表示ActivityManagerService通过sServerSocket与Zygote建立了新连接，此时将该连接加入peers列表、其文件描述符加入fds，等待后续请求；index大于0表示收到了创建应用程序进程的请求，调用对应ZygoteConnection连接的成员函数runOnce处理，处理完后从peers和fds中删除该连接。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "runSelectLoopMode创建的Socket文件描述符数组fdArray大小是多少？说明什么？", "a": "大小为4，表示Zygote进程最多能同时处理4个Socket连接。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ZygoteInit.handleSystemServerProcess中为什么要调用closeServerSocket关闭Socket？之后调用哪个函数继续启动System进程？", "a": "System进程复制了Zygote的地址空间，因而获得了Zygote创建的Server端Socket，但System进程不需要使用它，所以要关闭。随后调用RuntimeInit类的静态成员函数zygoteInit继续启动System进程。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "RuntimeInit.zygoteInit在System进程（及应用程序进程）启动过程中做了哪些事？", "a": "1）调用commonInit设置时区、键盘布局等通用信息；2）调用zygoteInitNative在进程中启动一个Binder线程池；3）通过invokeStaticMain以巧妙方式调用指定入口函数（如SystemServer.main或ActivityThread.main）。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "SystemServer.init1最终调用的函数system_init启动了哪些C++系统服务？GrimReaper类的作用是什么？", "a": "system_init启动了SurfaceFlinger（系统UI相关服务）和SensorService（传感器服务），随后调用SystemServer.init2启动Java服务。GrimReaper是死亡通知接收者，当Service Manager死亡时其binderDied被调用，System进程会调用kill杀死自己，因为此时系统服务无法正常工作。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "SystemServer.init2做了什么？ServerThread.run中如何建立消息循环？", "a": "init2创建并启动了一个ServerThread线程。其run函数先调用Looper.prepare创建消息循环，然后启动系统关键服务并注册到Service Manager，最后调用Looper.loop使线程进入消息循环。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService和WindowManagerService分别在什么线程中创建？AMS在什么时机注册到Service Manager？", "a": "AMS由其静态成员函数main在一个AThread线程中创建；WMS由其静态成员函数main在一个WMThread线程中创建。AMS创建时还未注册，等PackageManagerService启动并注册到Service Manager（名称“package”）之后，ServerThread线程才调用AMS.setSystemProcess将其以名称“activity”注册。"}, {"ch": "第11章 Zygote和System进程的启动过程", "ci": 10, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService、ContentService、WindowManagerService注册到Service Manager时分别使用什么服务名称？", "a": "AMS注册名称为“activity”；ContentService注册名称为ContentResolver.CONTENT_SERVICE_NAME即“content”；WMS注册名称为Context.WINDOW_SERVICE即“window”。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService发现应用程序进程未启动时，调用哪个函数向Zygote发送创建请求？为新进程指定的入口函数是什么？", "a": "调用ActivityManagerService类的成员函数startProcessLocked发送请求，并指定新进程的入口函数为android.app.ActivityThread类的静态成员函数main。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "Process.start中如何判断走哪条创建路径？", "a": "先调用静态成员函数supportsProcesses判断系统是否支持Binder进程间通信机制：支持则调用startViaZygote请求Zygote进程创建应用程序进程；否则创建一个线程来模拟应用程序进程。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "应用程序进程启动参数中的“--runtime-init”表示什么？", "a": "表示要在新创建的应用程序进程中初始化运行时库，以及启动一个Binder线程池。该参数使ZygoteConnection.handleChildProc中parsedArgs.runtimeInit为true，进而调用RuntimeInit.zygoteInit。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "Process.openZygoteSocketIfNeeded创建的LocalSocket是如何连接到Zygote进程的？", "a": "它创建一个LocalSocket对象（静态成员变量sZygoteSocket），连接到名称为“zygote”的Socket地址，即在/dev/socket目录下找到zygote设备文件并与之绑定，从而与Zygote进程中名称为“zygote”的Server端Socket建立连接，并获得对应的输入流和输出流。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "ZygoteConnection.runOnce处理创建请求时，先做什么、再调用什么函数创建进程？", "a": "先调用成员函数readArgumentList读取启动参数并封装到Arguments对象parsedArgs中，然后调用Zygote类的静态成员函数forkAndSpecialize（内部fork）创建应用程序进程；fork返回值为0时在子进程中调用成员函数handleChildProc启动子进程。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "ZygoteConnection.handleChildProc中，parsedArgs.runtimeInit为true时接下来做什么？", "a": "调用RuntimeInit类的静态成员函数zygoteInit，在新创建的应用程序进程中初始化运行时库、启动Binder线程池，最后通过invokeStaticMain进入指定的入口函数ActivityThread.main。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "RuntimeInit.zygoteInitNative是JNI方法，它最终调用哪个函数启动Binder线程池？gCurRuntime指向什么？", "a": "它由C++函数com_android_internal_os_RuntimeInit_zygoteInit实现，调用全局变量gCurRuntime的成员函数onZygoteInit启动Binder线程池（实际为AppRuntime重写的onZygoteInit）。gCurRuntime在AndroidRuntime构造函数中被初始化，指向Zygote启动时创建的AppRuntime对象，因应用程序进程复制了Zygote地址空间，每个进程都有该全局变量。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "ProcessState.startThreadPool如何保证Binder线程池只被启动一次？ProcessState对象在进程中的唯一性如何？", "a": "ProcessState的成员变量mThreadPoolStarted初始值为false，startThreadPool第一次被调用时启动Binder线程池并将其置为true，避免重复启动。每个支持Binder通信的进程内部都有一个唯一的ProcessState对象。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "RuntimeInit.invokeStaticMain为什么不直接调用ActivityThread.main，而是抛出一个MethodAndArgsCaller异常？", "a": "因为新进程复制了Zygote的调用堆栈，执行到invokeStaticMain时已执行了大量代码（如初始化运行时库、启动Binder线程池）。通过抛出MethodAndArgsCaller异常，沿调用路径返回到捕获该异常的ZygoteInit.main，再间接调用ActivityThread.main，可以巧妙利用Java异常处理机制清理前面的调用堆栈，使ActivityThread.main看起来就是进程的入口函数。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "MethodAndArgsCaller类的成员变量mMethod和mArgs分别指向什么？其run函数的作用是什么？", "a": "mMethod指向ActivityThread类的静态成员函数main（Method对象），mArgs指向新创建应用程序进程的启动参数。run函数通过mMethod反射调用ActivityThread.main，从而真正进入新进程的“入口函数”。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "ActivityThread.main中如何创建应用程序进程的消息循环？", "a": "先调用Looper类的静态成员函数prepareMainLooper在当前进程中创建消息循环，然后创建一个ActivityThread实例，最后调用Looper类的静态成员函数loop进入消息循环。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "一个新创建的应用程序进程启动完成后自动获得了哪三样运行基础？", "a": "1）一个虚拟机实例（复制自Zygote）；2）一个Binder线程池（zygoteInitNative/ProcessState.startThreadPool启动）；3）一个消息循环（ActivityThread.main中通过Looper创建）。"}, {"ch": "第12章 Android应用程序进程的启动过程", "ci": 11, "part": "第3篇 Android应用程序框架", "q": "Process.zygoteSendArgsAndGetPid向Zygote发送参数后，Zygote进程侧的处理入口是什么？最终返回什么给AMS？", "a": "请求由ZygoteInit.runSelectLoopMode监听到后，转交给ZygoteConnection类的成员函数runOnce处理；Zygote创建完新应用程序进程后，将新进程的PID通过Socket返回给ActivityManagerService。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Android消息处理机制主要由哪三个类实现？它们各自的职责是什么？", "a": "MessageQueue：描述消息队列；Looper：创建消息队列并进入消息循环；Handler：发送消息和处理消息。消息机制围绕消息队列实现，线程生命周期分为创建消息队列和进入消息循环两个阶段。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Looper.prepareMainLooper和Looper.prepare的区别是什么？", "a": "prepareMainLooper用来为应用程序主线程（UI线程）创建消息队列，并将Looper额外保存在静态成员变量mMainLooper中；prepare用来为其他子线程创建消息队列。主线程的Looper单独保存是为了让其他线程可通过getMainLooper访问它，往其消息队列发送UI相关消息。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Looper类的静态成员变量sThreadLocal的作用是什么？", "a": "它是一个ThreadLocal（线程局部变量），用来保存每个线程关联的Looper对象。prepare创建Looper后通过set与当前线程关联；通过get或myLooper可获得与当前线程关联的Looper。若当前线程已有Looper，prepare会抛出异常。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Java层的MessageQueue与C++层的NativeMessageQueue是如何关联起来的？", "a": "Java层每个MessageQueue对象有一个int型成员变量mPtr，通过JNI函数nativeInit创建C++层NativeMessageQueue对象后，将其地址值保存在mPtr中，从而将两者关联起来。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "C++层NativeMessageQueue、Looper对象和管道是如何层层创建的？", "a": "创建Java层MessageQueue时调用nativeInit创建NativeMessageQueue对象；NativeMessageQueue构造时通过C++层Looper.getForThread检查，若无则创建一个C++层Looper对象（保存在成员变量mLooper中）并与当前线程关联；C++层Looper构造时调用pipe创建一个管道。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "C++层Looper类中mWakeReadPipeFd和mWakeWritePipeFd分别描述什么？管道在消息机制中起什么作用？", "a": "分别描述管道的读端和写端文件描述符。当线程的消息队列没有消息可处理时，线程在管道读端上睡眠等待；当其他线程向该线程的消息队列发送消息后，通过管道写端写入数据将其唤醒，以便及时处理新消息。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "C++层Looper对象创建时如何使用epoll机制？epoll相比select有什么优点？", "a": "调用epoll_create创建epoll实例（mEpollFd），并将管道读端mWakeReadPipeFd注册进去监听IO写事件；以后还可通过addFd注册更多文件描述符。epoll是多路复用IO接口、select的增强版：当监听大量文件描述符但只有少量活跃时，能显著减少CPU使用率，提高并发处理能力。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Looper.loop的工作流程是怎样的？", "a": "先获得当前线程的MessageQueue，然后在while循环中不断调用MessageQueue.next取消息：取到消息（msg不等于null）则分发给msg.target处理；取不到时线程在next中睡眠等待，直到有新消息为止。若msg.target等于null则为退出消息，退出消息循环。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "MessageQueue.next中变量nextPollTimeoutMillis取0和-1分别表示什么？", "a": "等于0表示即使消息队列中没有新消息，线程也不进入睡眠等待状态；等于-1表示没有新消息时线程无限地处于睡眠等待状态，直到被其他线程唤醒为止。其他正值表示睡眠等待的时长（用于定时消息）。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "MessageQueue.next如何决定消息是否马上处理？消息队列中的消息按什么顺序排列？", "a": "取队头消息mMessages的处理时间与系统当前时间比较：小于等于当前时间则马上处理并让mMessages指向下一个消息；否则计算睡眠等待时间以便在指定时间点处理。消息按处理时间从小到大的顺序排列在消息队列中。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "IdleHandler是什么？线程在什么时机分发线程空闲消息？一次next调用最多发几个？", "a": "IdleHandler是空闲消息处理器，实现queueIdle接口，通过MessageQueue的addIdleHandler/removeIdleHandler注册注销。当线程消息队列为空或队头消息处理时间大于当前时间（即准备进入睡眠）时，先分发空闲消息。一次next调用中最多发出一个线程空闲消息（pendingIdleHandlerCount置0保证），但next会被反复调用，所以总体可多次发出。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "IdleHandler的queueIdle返回值有什么含义？", "a": "若queueIdle返回false，该IdleHandler会从MessageQueue的mIdleHandlers列表中移除，以后不再接收线程空闲消息；返回true则保留继续接收。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "MessageQueue.next在进入睡眠前为什么可能调用Binder.flushPendingCommands？", "a": "每次调用nativePollOnce之前，若nextPollTimeoutMillis不等于0（即线程将进入睡眠等待状态），就调用Binder类的静态成员函数flushPendingCommands，处理那些正在等待的Binder进程间通信请求，避免它们因线程睡眠而长时间得不到处理。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "nativePollOnce的调用链是什么？线程最终在哪个函数中睡眠？", "a": "MessageQueue.nativePollOnce（JNI）→ C++层NativeMessageQueue.pollOnce → C++层Looper.pollOnce（for循环反复调用pollInner）→ Looper.pollInner。pollInner中调用epoll_wait监听epoll实例，无IO事件时线程就在epoll_wait中进入睡眠等待。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Looper.pollInner中检测到管道发生EPOLLIN事件意味着什么？随后如何处理？", "a": "意味着其他线程向与当前线程关联的管道写入了新数据，即有新消息被发送到该线程的消息队列。pollInner随即调用成员函数awoken，通过read把管道中的数据读出来清理掉（不关心内容），以便下一次消息循环可重新在该管道上睡眠等待。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Handler类内部有哪些关键成员变量和成员函数？各自的作用是什么？", "a": "成员变量mLooper和mQueue分别指向与当前线程关联的Looper对象和MessageQueue对象；成员函数sendMessage（经sendMessageDelayed/sendMessageAtTime）向mQueue发送消息，handleMessage处理消息，且handleMessage在mLooper关联的线程中被调用。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Handler的sendMessage、sendMessageDelayed、sendMessageAtTime有什么区别？", "a": "sendMessage发送的消息处理时间为系统当前时间；sendMessageDelayed指定的处理时间是相对于现在的将来时间；sendMessageAtTime指定的处理时间是将来的一个绝对时间。三者最终都通过sendMessageAtTime发送，并将msg.target设置为当前Handler对象。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "MessageQueue.enqueueMessage中，哪些情况新消息要插到队列头部？消息处理时间等于0意味着什么？", "a": "目标队列为空、插入消息处理时间等于0、或插入消息处理时间小于队头消息处理时间这三种情况插到头部。处理时间等于0表示优先级最高的消息，需优先处理。否则通过while循环找到合适位置插入；处理时间相同时后插入的排在后面，保证先发送的先处理。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "消息插入队列后，什么时候需要唤醒目标线程？判断依据是什么？", "a": "只有当消息被插到队列头部（队头消息发生变化）且目标线程正处于睡眠等待状态时才需要唤醒；若消息插在队列中间则队头未变，无需唤醒。目标线程是否睡眠由MessageQueue的成员变量mBlocked记录（true表示正在睡眠），此时调用nativeWake唤醒。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "nativeWake的调用链是什么？最终如何唤醒目标线程？", "a": "MessageQueue.nativeWake（JNI）→ C++层NativeMessageQueue.wake → C++层Looper.wake。Looper.wake调用函数write向管道写端mWakeWritePipeFd写入一个“W”字符，管道发生IO写事件，正在epoll_wait中睡眠的目标线程即被唤醒。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Handler.dispatchMessage分发消息的优先顺序是怎样的？", "a": "1）若消息发送时指定了回调接口（msg.callback不为null，如post一个Runnable），调用handleCallback，即执行Runnable.run；2）否则若Handler的成员变量mCallback指向Callback接口，调用其handleMessage；3）若mCallback为null或其handleMessage返回false（希望消息继续向下处理），最后才调用Handler自己的handleMessage。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Handler.post发送Runnable对象时是如何处理的？", "a": "post先通过getPostMessage将Runnable对象封装成Message：创建空消息并把其成员变量callback设置为该Runnable对象（因为消息队列只接收Message类型），再发送到消息队列。处理时该消息通过handleCallback交给Runnable.run执行。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Handler.handleMessage为什么通常是空实现？一般如何使用？", "a": "Handler.handleMessage本身是空实现。一般不直接用Handler类发消息，而是使用其子类并重写handleMessage，创建子类对象发送消息，消息最终由子类对象重写的handleMessage处理。"}, {"ch": "第13章 Android应用程序的消息处理机制", "ci": 12, "part": "第3篇 Android应用程序框架", "q": "Looper.loop中如何识别退出消息？", "a": "取出的Message对象msg的成员变量target等于null时，说明这是一个退出消息，此时退出消息循环；否则将消息分发给msg.target（一个Handler对象）处理。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "键盘消息与普通消息的根本区别是什么？", "a": "键盘消息是由硬件中断触发的，由系统统一监控后再分发给当前激活的应用程序窗口；而普通消息是由应用程序自己产生的。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Android系统的键盘消息由哪个系统服务统一管理？它在启动时会创建什么组件？", "a": "由Window管理服务WindowManagerService统一管理。它在启动时会在内部创建一个输入管理器InputManager，用来监控系统的键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "应用程序窗口与InputManager之间的连接通过什么来描述？建立和断开连接分别称为什么过程？", "a": "通过一对输入通道（InputChannel）来描述。建立连接称为注册InputChannel的过程，断开连接称为注销InputChannel的过程。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Java层和C++层各有一个InputManager，它们如何关联？", "a": "Java层的InputManager通过C++层的NativeInputManager（全局变量gNativeInputManager）间接关联：NativeInputManager的成员变量mInputManager指向C++层的InputManager，Java层的InputManager通过它来监控键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "C++层InputManager有哪两个核心成员变量？各自的作用和运行方式是什么？", "a": "mInputDispatcher和mInputReader。前者用来分发键盘事件给系统当前激活的应用程序窗口，后者用来监控系统键盘事件，它们分别运行在各自独立的线程（InputDispatcherThread和InputReaderThread）中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher的成员变量mLooper和mFocusedWindow分别有什么作用？", "a": "mLooper指向一个Looper对象，用来与InputReader通信（睡眠等待和唤醒）；mFocusedWindow指向一个InputWindow对象，用来描述系统当前激活的应用程序窗口，是键盘事件的分发目标。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "系统当前激活的应用程序窗口是如何设置到InputDispatcher中的？", "a": "WindowManagerService调用Java层InputManager的setInputWindows，它依次调用NativeInputManager.setInputWindows和InputDispatcher.setInputWindows，最终将激活窗口保存在InputDispatcher的成员变量mFocusedWindow中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputReader如何监控键盘事件？真正监控系统键盘事件的类是什么？", "a": "InputReader通过成员变量mEventHub指向一个EventHub对象，EventHub才是真正用来监控系统键盘事件的。InputReader不断调用loopOnce，内部调用EventHub的getEvent获取键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "系统发生键盘事件时，InputReader如何唤醒InputDispatcher？", "a": "InputReader从EventHub.getEvent返回后，调用InputDispatcher的成员函数notifyKey；notifyKey实际上是通过InputDispatcher的成员变量mLooper的成员函数wake将InputDispatcher唤醒的。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "什么是Server端InputChannel和Client端InputChannel？它们分别注册在哪里？", "a": "Server端InputChannel注册在输入管理器InputManager（具体是InputDispatcher）中；Client端InputChannel注册在应用程序进程的主线程中。两者交叉连接，共同构成应用程序窗口与InputManager之间的连接。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "键盘事件发生和键盘事件处理完成的信号分别通过哪个管道传递？", "a": "InputDispatcher通过Server端InputChannel的前向管道（写端mSendPipeFd）通知应用程序接收键盘事件；应用程序处理完成后通过Client端InputChannel的反向管道（写端mSendPipeFd）向InputManager发送处理完成通知。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "C++层InputChannel包含哪三个文件描述符？各自的作用是什么？", "a": "mAshmemFd描述一块匿名共享内存，用于在应用程序窗口与InputManager之间传递键盘事件数据；mReceivPipeFd和mSendPipeFd分别描述两个不同管道的读端和写端，用于在两者之间建立交叉连接。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Java层InputChannel与C++层NativeInputChannel、InputChannel如何关联？", "a": "Java层InputChannel创建时会同时创建一个C++层NativeInputChannel对象，其地址保存在Java层InputChannel的成员变量mPtr中；NativeInputChannel的成员变量mInputChannel指向C++层的InputChannel对象。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputWindow对象的作用是什么？它如何与InputChannel关联？", "a": "InputWindow用来描述一个应用程序窗口，其成员变量inputChannel指向一个C++层InputChannel对象，从而将应用程序窗口与InputChannel关联起来，InputDispatcher通过mFocusedWindow找到对应的InputChannel来分发键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "WindowManagerService创建InputManager的过程分为哪几个主要步骤？", "a": "分为4步：Step1 WMThread.run创建WindowManagerService；Step2 InputManager.init调用nativeInit；Step3 InputManager.nativeInit（JNI函数android_server_InputManager_nativeInit）创建EventHub和C++层InputManager；Step4 InputManager.initialize创建InputReaderThread和InputDispatcherThread两个线程。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "C++层InputManager构造时会创建哪些对象？initialize做了什么？", "a": "构造时以EventHub为参数创建InputManager，内部创建InputDispatcher对象和InputReader对象（分别保存在mDispatcher和mReader中）；initialize以mReader和mDispatcher为参数创建InputReaderThread线程和InputDispatcherThread线程。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "启动InputManager的过程分为哪3步？", "a": "Step1：Java层InputManager.start调用nativeStart；Step2：InputManager.nativeStart（JNI函数android_server_InputManager_nativeStart）通过gNativeInputManager获得C++层InputManager并调用其start；Step3：C++层InputManager.start分别启动mDispatcherThread和mReaderThread两个线程。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcherThread和InputReaderThread的线程入口函数是什么？", "a": "两者都从Thread类继承，当成员函数run被调用时系统创建线程，并以它们的成员函数threadLoop作为线程入口函数。threadLoop中分别调用InputDispatcher.dispatchOnce和InputReader.loopOnce。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "重复键盘事件的两种产生方式是什么？keyRepeatTimeout和keyRepeatDelay的含义是什么？", "a": "一种由内核中的键盘驱动程序产生（此时InputDispatcher无需处理）；另一种由用户空间的InputDispatcher产生：若按键在keyRepeatTimeout时间内被连续按住，则InputDispatcher每隔keyRepeatDelay时间分发一个相同的键盘事件，直到按键松开。两者时间单位都是纳秒。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher.dispatchOnce在无键盘事件时如何进入睡眠？执行缓存命令有何意义？", "a": "通过mLooper的成员函数pollOnce进入睡眠，最长时间为timeoutMillis毫秒（由nextWakeupTime换算而来）。进入睡眠前会调用runCommandsLockedInterruptible执行缓存的命令；若有命令被执行则返回true，此时需将nextWakeupTime重置为LONG_LONG_MIN，表示不能进入睡眠。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputReader.loopOnce的执行流程是怎样的？", "a": "先调用mEventHub的getEvent获取一个键盘事件保存在RawEvent结构体rawEvent中，然后调用InputReader的成员函数process处理该键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "EventHub.getEvent中，结构体input_event的type、code、value成员对键盘事件分别表示什么？", "a": "type恒为EV_KEY，表示键盘输入事件；code等于键盘扫描码；value为0或1，0表示按下，1表示松开。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "扫描码和键盘码有什么区别？EventHub如何将扫描码转换为键盘码？", "a": "扫描码是键盘硬件产生的事件代码；键盘码是与键盘按键布局相关的参数。EventHub为每个键盘设备用一个KeyLayoutMap对象描述其按键布局（保存在device_t结构体的layoutMap中），通过其成员函数map将扫描码转换为键盘码。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "EventHub.openPlatformInput中打开的第一个虚拟输入设备是什么？有什么作用？", "a": "是一个虚拟输入设备。如果内核支持inotify机制，它用于实时监控/dev/input目录的变化（通过inotify_init和inotify_add_watch监听IN_CREATE和IN_DELETE事件），从而实时打开新增的输入设备、关闭被移除的输入设备；否则不起任何作用。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Android系统内建键盘设备的ID值是多少？EventHub如何识别内建键盘？", "a": "内建键盘设备的ID值恒为0，与打开顺序无关。EventHub打开输入设备时若发现是内建键盘，会将分配给它的ID值保存在成员变量mFirstKeyboardId中；getEvent处理事件时若设备ID等于mFirstKeyboardId，就将deviceId设为0。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "EventHub为键盘设备加载的键盘布局文件路径是如何确定的？找不到时用什么默认文件？", "a": "根据设备名称（空格替换为下划线）和环境变量ANDROID_ROOT（一般为/system）格式化为“%s/usr/keylayout/%s.kl”，如/system/usr/keylayout/abc.kl；若该文件不存在，则使用系统默认键盘布局文件/system/usr/keylayout/qwerty.kl。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Activity组件、PhoneWindow、DecorView和ViewRoot之间是什么关系？", "a": "每个Activity组件内部包含一个PhoneWindow对象（mWindow），PhoneWindow内部包含一个DecorView对象（mDecor），DecorView最终通过ViewRoot的setView被设置到ViewRoot的成员变量mView中。ViewRoot负责绘制窗口并接收InputDispatcher分发来的键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "键盘事件到达ViewRoot后的分发路径是什么？", "a": "ViewRoot.dispatchKey将键盘事件交给mView（DecorView）的dispatchKeyEvent处理；DecorView找到包含它的PhoneWindow，最终分发给包含该PhoneWindow的Activity组件的dispatchKeyEvent处理。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "ViewRoot.setView中调用sWindowSession.add向WindowManagerService添加窗口时，WMS完成哪三件事情？", "a": "第一，创建一对InputChannel（一个Server端一个Client端，Client端用于初始化ViewRoot中已创建的未初始化的InputChannel）；第二，将Server端InputChannel注册到InputManager中；第三，将该窗口作为系统当前激活的应用程序窗口注册到InputDispatcher中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "ViewRoot的静态成员变量sWindowSession是什么？如何获得的？", "a": "是一个Binder代理对象，引用运行在WindowManagerService中的一个Session类型的Binder本地对象。通过ServiceManager.getService获得WindowManagerService代理对象，再调用其openSession获得Session代理对象并保存在sWindowSession中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "C++层InputChannel.openInputChannelPair是如何创建一对交叉连接的InputChannel的？", "a": "先用ashmem_create_region创建一块大小为16KB（DEFAULT_MESSAGE_BUFFER_SIZE=16384）的匿名共享内存；再用pipe创建一个前向管道和一个反向管道；Server端InputChannel以(serverAshmemFd, reverse[0]读端, forward[1]写端)创建，Client端以(clientAshmemFd, forward[0]读端, reverse[1]写端)创建，两者交叉连接并共享同一块匿名共享内存。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "注册Server端InputChannel的过程经过哪些函数？", "a": "InputManager.registerInputChannel → InputManager.nativeRegisterInputChannel（JNI函数android_server_InputManager_nativeRegisterInputChannel）→ NativeInputManager.registerInputChannel → InputDispatcher.registerInputChannel。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher.registerInputChannel中，Server端InputChannel被封装成什么？以什么为关键字保存在哪里？", "a": "被封装成一个Connection对象，然后以该Server端InputChannel内部反向管道的读端文件描述符为关键字，保存在InputDispatcher的成员变量mConnectionsByReceiveFd中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher注册Server端InputChannel后，如何监控反向管道的IO写事件？回调函数是什么？", "a": "调用mLooper的成员函数addFd，将Server端InputChannel内部反向管道的读端文件描述符注册到Looper中；当反向管道被写入新数据（发生IO写事件）时，InputDispatcher的静态成员函数handleReceiveCallback被调用。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Connection对象内部的InputPublisher有什么作用？initialize时做了什么？", "a": "InputPublisher用来分发键盘事件给系统当前激活的应用程序窗口。initialize时通过getAshmemFd和ashmem_get_size_region获得匿名共享内存大小（mAshmemSize），并用mmap将其映射到InputDispatcher所在进程地址空间，结构化为InputMessage结构体保存在mSharedMessage中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "注册系统当前激活的应用程序窗口到InputDispatcher的过程经过哪些函数？", "a": "WindowManagerService.finishUpdateFocusedWindowAfterAssignLayersLocked → InputMonitor.setInputFocusLw → InputMonitor.updateInputWindowsLw → InputManager.setInputWindows → InputManager.nativeSetInputWindows → NativeInputManager.setInputWindows → InputDispatcher.setInputWindows。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputMonitor.updateInputWindowsLw如何标识系统当前激活的应用程序窗口？", "a": "它将mWindows中需要接收键盘事件的窗口分别封装成InputWindow对象，只有封装系统当前激活的应用程序窗口的InputWindow对象的成员变量hasFocus才会被设置为true，这样InputDispatcher就能识别当前激活窗口。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher的成员变量mWindows和mFocusedWindow分别保存什么？", "a": "mWindows保存系统中所有需要接收键盘事件的应用程序窗口；mFocusedWindow保存系统当前激活的应用程序窗口。setInputWindows时会先清空再重新注册，并从新窗口列表中找到hasFocus为true的窗口保存到mFocusedWindow。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "注册Client端InputChannel时，InputQueue.registerInputChannel的三个参数分别是什么？", "a": "inputChannel描述Client端InputChannel；inputHandler指向ViewRoot的mInputHandler所描述的InputHandler对象，用来接收InputDispatcher分发来的键盘事件；messageQueue指向应用程序进程主线程的消息队列。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "NativeInputQueue.registerInputChannel中，Client端InputChannel被封装成什么？以什么为关键字保存？如何监控前向管道？", "a": "被封装成一个Connection对象（内部含InputConsumer对象），以Client端InputChannel内部前向管道的读端文件描述符为关键字保存在NativeInputQueue的mConnectionsByReceiveFd中；并通过主线程Looper对象的addFd监控前向管道的IO写事件，事件发生时调用NativeInputQueue的静态成员函数handleReceiveCallback。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputConsumer.initialize与InputPublisher.initialize有何异同？", "a": "相同点：都通过getAshmemFd和ashmem_get_size_region获得匿名共享内存大小，并用mmap映射到本进程地址空间结构化为InputMessage（mSharedMessage）。不同点：InputPublisher运行在InputDispatcher所在的System进程，InputConsumer运行在应用程序进程，其mChannel指向Client端InputChannel。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "键盘事件发生时的整体唤醒顺序是怎样的？", "a": "键盘事件发生 → InputReader先被唤醒并获得键盘事件 → InputReader调用InputDispatcher.notifyKey将InputDispatcher唤醒 → InputDispatcher分发键盘事件后再次进入睡眠 → 应用程序主线程接收键盘事件并封装成键盘消息 → 窗口处理完成后通过反向管道唤醒InputDispatcher。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "应用程序窗口是直接接收InputDispatcher分发的键盘事件吗？", "a": "不是。首先是应用程序进程的主线程接收到键盘事件，主线程将其封装成一个键盘消息发送到自己的消息队列中，然后这个键盘消息才被分发给系统当前激活的应用程序窗口处理。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputReader处理键盘事件的函数调用链是什么？", "a": "InputReader.process → InputReader.consumeEvent → InputDevice.process → KeyboardInputMapper.process → KeyboardInputMapper.processKey → InputDispatcher.notifyKey。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDevice.process中，不同类型的IO输入事件由什么处理？键盘事件由哪个类处理？", "a": "每种类型的IO输入事件由一个专门的InputMapper对象处理，保存在InputDevice的mMappers中。键盘输入事件由KeyboardInputMapper（书中亦称KeyboardKeyMapper）处理，轨迹球输入事件由TrackballInputMapper处理；各InputMapper会在内部忽略与自己无关的事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "KeyboardInputMapper.processKey为什么要根据屏幕方向调整键盘码？调用什么函数调整？", "a": "键盘码除与键盘布局有关外还与屏幕方向有关，例如DPAD方向键在不同屏幕方向下对应的键盘码不同。processKey通过InputReaderPolicyInterface接口（实际是NativeInputManager）的getDisplayInfo获得屏幕方向，再调用函数rotateKeyCode调整键盘码。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "系统当前的组合键状态（Alt/Shift）保存在哪里？如何更新？", "a": "保存在KeyboardInputMapper的mLocked的成员变量metaState中。按键按下或松开时，取出oldMetaState，调用函数updateMetaState得到新的组合键状态newMetaState，若两者不等（说明按下/松开的是Alt或Shift键）则更新metaState。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher.notifyKey中调用mPolicy的interceptKeyBeforeQueueing有什么作用？", "a": "在键盘事件入队前截获它，最终交给WindowManagerService和PowerManagerService处理，以便它们设置屏幕亮度、管理设备电源状态等。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher的待分发键盘事件队列叫什么？键盘事件以什么结构入队？", "a": "叫mInboundQueue。notifyKey中通过Allocator的obtainKeyEntry将键盘事件封装成KeyEntry结构体，再由enqueueInboundEventLocked添加到mInboundQueue中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "enqueueInboundEventLocked在哪两种情况下需要唤醒InputDispatcher？", "a": "第一种：将新键盘事件入队前mInboundQueue为空，说明InputDispatcher正处于睡眠状态，需要唤醒处理新事件；第二种：当前键盘事件与应用程序窗口切换相关（如Home键或Back键，由isAppSwitchKeyEventLocked检查），需在其松开时立即唤醒InputDispatcher，避免系统无法及时响应窗口切换。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "与应用程序窗口切换相关的键盘事件的最迟分发时间保存在哪个成员变量中？", "a": "保存在InputDispatcher的成员变量mAppSwitchDueTime中。dispatchOnceInnerLocked会检查该时间是否已到，到时需优先处理该窗口切换事件，并调用resetPendingAppSwitchLocked将mAppSwitchDueTime重置为LONG_LONG_MAX。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher.dispatchOnceInnerLocked中，mPendingEvent的作用是什么？重复键盘事件如何合成？", "a": "mPendingEvent指向上一个待分发的键盘事件，在成功分发出去之前一直保存在其中。当mInboundQueue为空且mKeyRepeatState.lastKeyEntry不为null时，若当前时间到达重复事件产生时间，则调用synthesizeKeyRepeatLocked合成一个重复键盘事件保存在mPendingEvent中。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher分发键盘事件时，findFocusedWindowTargetsLocked做了哪些合法性检查？", "a": "①检查激活窗口/激活应用是否已注册到InputDispatcher（未注册则分发失败）；②通过checkInjectionPermission检查应用程序注入的键盘事件是否有权限注入给当前激活窗口；③检查激活窗口是否处于Paused（无响应）状态；④通过isWindowFinishedWithPreviousInputLocked检查窗口是否已处理完上一个键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "findFocusedWindowTargetsLocked检查通过后如何构造分发目标？", "a": "调用addWindowTargetLocked将mFocusedWindow封装成一个InputTarget对象，保存在mCurrentInputTargets中，其中最重要的是初始化InputTarget的成员变量inputChannel（指向Server端InputChannel）。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher分发键盘事件的函数调用链（到写入管道前）是什么？", "a": "dispatchOnceInnerLocked → dispatchKeyLocked → findFocusedWindowTargetsLocked/addWindowTargetLocked → dispatchEventToCurrentInputTargetsLocked → prepareDispatchCycleLocked → startDispatchCycleLocked → InputPublisher.publishKeyEvent + sendDispatchSignal → InputChannel.sendSignal（向前向管道写入INPUT_SIGNAL_DISPATCH）。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Connection内部的outboundQueue队列有什么特点？prepareDispatchCycleLocked何时启动分发？", "a": "每个Connection对象有独立的outboundQueue，其中的键盘事件需依次分发，即上一个键盘事件被目标窗口处理完成后才能分发下一个。prepareDispatchCycleLocked将键盘事件封装成DispatchEntry加入队列末尾；若队列之前为空（说明前面的事件都已处理完），才调用startDispatchCycleLocked开始分发。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputPublisher.publishKeyEvent的作用是什么？写入前如何保护匿名共享内存？", "a": "将即将分发的键盘事件数据写入InputPublisher内部引用的匿名共享内存（通过mSharedMessage描述的InputMessage结构体）。写入前由publishInputEvent调用ashmem_pin_region锁定匿名共享内存，将mPinned设为true，并将InputMessage的consumed设为false表示数据尚未被读取。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher如何通知应用程序窗口接收键盘事件？", "a": "调用InputPublisher.sendDispatchSignal，它通过Server端InputChannel的成员函数sendSignal，使用mSendPipeFd（前向管道写端）向管道写入一个字符INPUT_SIGNAL_DISPATCH，唤醒应用程序主线程来接收键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "NativeInputQueue.handleReceiveCallback中，generateFinishedToken生成的令牌包含哪三个信息？", "a": "包含：前向管道的读端文件描述符receiveFd（高32位）、Connection对象的id（中间16位）和messageSeqNum（低16位）。窗口处理完成后可根据令牌找回对应的Connection对象，以便发送键盘事件处理完成通知。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "应用程序主线程接收键盘事件时，先确认信号再读取数据，分别调用哪些函数？", "a": "先调用InputConsumer.receiveDispatchSignal，其内部通过Client端InputChannel的receiveSignal从前向管道（mReceivePipeFd读端）读出字符，确认其值为INPUT_SIGNAL_DISPATCH；再调用InputConsumer.consume从匿名共享内存中读出键盘事件数据。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputConsumer.consume中，consumed标志有什么作用？", "a": "通过InputMessage的consumed成员检查匿名共享内存中的键盘事件数据是否已被读取：若已读取（consumed为true）则返回INVALID_OPERATION错误，因为内容可能已变化；读取前先将consumed设为true。consume与InputPublisher.publishKeyEvent的操作正好相反。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "主线程获得键盘事件后如何转成键盘消息交给ViewRoot处理？", "a": "handleReceiveCallback将键盘事件封装成Java层KeyEvent，调用InputQueue.dispatchKeyEvent，它创建FinishedCallback回调并调用InputHandler.handleKey，其中先调用ViewRoot.startInputEvent保存回调，再调用ViewRoot.dispatchKey将键盘事件封装成DISPATCH_KEY类型的键盘消息发送到主线程消息队列，最终由ViewRoot.deliverKeyEvent处理。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "ViewRoot.deliverKeyEvent中键盘事件被先后交给哪些对象处理？", "a": "首先调用mView（DecorView）的dispatchKeyEventPreIme处理（输入法预处理），若返回true则结束；若窗口支持输入法（mLastWasImTarget为true）则交给输入法管理器的dispatchKeyEvent处理，完成后通过mInputMethodCallback的finishedEvent回调再继续；否则直接调用deliverKeyE
