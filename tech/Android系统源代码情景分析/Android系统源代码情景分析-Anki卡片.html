ventToViewHierarchy处理。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "DecorView.dispatchKeyEvent如何将键盘事件分发给Activity组件？", "a": "当DecorView与应用程序窗口关联时（mFeatureId等于-1），通过外部类PhoneWindow（继承自Window）的getCallback获得回调接口。由于Activity启动时在attach中通过PolicyManager.makeNewWindow创建PhoneWindow并将自己实现的Window.Callback接口设置进去，所以该回调实际指向Activity组件，最终调用其dispatchKeyEvent。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Activity.dispatchKeyEvent的处理流程是什么？", "a": "先调用onUserInteraction通知窗口用户发生了键盘交互；再调用关联PhoneWindow的superDispatchKeyEvent处理；若其返回false，则调用KeyEvent的成员函数dispatch继续分发。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "自定义Activity处理键盘事件需要重写哪些函数？它们分别处理什么操作？", "a": "需要重写Activity的onKeyDown、onKeyUp和onKeyMultiple。KeyEvent.dispatch根据mAction分别调用它们处理按键按下（ACTION_DOWN）、松开（ACTION_UP）和重复按下松开（ACTION_MULTIPLE，重复次数在mRepeatCount中）的操作。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "窗口处理完键盘事件后，如何向InputDispatcher发送处理完成通知？", "a": "ViewRoot.finishInputEvent调用mFinishedCallback（FinishedCallback）的run，它以mFinishedToken为参数调用InputQueue.nativeFinished（JNI），再调用NativeInputQueue.finished解析令牌找到Connection对象，最后由InputConsumer.sendFinishedSignal通过Client端InputChannel的sendSignal向反向管道（mSendPipeFd写端）写入字符INPUT_SIGNAL_FINISHED。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher如何接收键盘事件处理完成通知？", "a": "反向管道被写入数据后，InputDispatcher的静态成员函数handleReceiveCallback被调用，它通过反向管道读端文件描述符在mConnectionsByReceiveFd中找到Connection对象，先由InputPublisher.receiveFinishedSignal确认信号为INPUT_SIGNAL_FINISHED，再调用finishDispatchCycleLocked准备分发下一个键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher.finishDispatchCycleLocked做了哪些事情？", "a": "①调用onDispatchCycleFinishedLocked通知其他系统组件窗口已处理完一个键盘事件；②调用Connection内部InputPublisher的reset重置其引用的匿名共享内存块，以便写入下一个键盘事件数据；③调用startNextDispatchCycleLocked从outboundQueue中取出（inProgress为true的已分发事件会被删除释放）并分发下一个键盘事件。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "应用程序窗口的销毁过程由谁发起？ActivityStack.activityIdleInternal如何收集待销毁的Activity？", "a": "由Activity管理服务ActivityManagerService发起：每次启动新Activity后，AMS向其线程消息队列发送IDLE_NOW_MSG消息，由ActivityStack.activityIdleInternal处理。它调用processStoppingActivitiesLocked收集处于Stopped状态且非等待可见（waitingVisible为false）的Activity到stops列表，其中finishing为true的由finishCurrentActivityLocked销毁。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "ActivityManagerService销毁Activity时如何通知应用程序进程？", "a": "ActivityStack.destroyActivityLocked通过描述该Activity所在进程的ProcessRecord的thread获得ApplicationThreadProxy Binder代理对象，调用其scheduleDestroyActivity向应用程序进程发送类型为SCHEDULE_FINISH_ACTIVITY_TRANSACTION的进程间通信请求。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "应用程序进程接收到Activity销毁请求后，内部处理流程是什么？", "a": "ApplicationThread.scheduleDestroyActivity通过ActivityThread.queueOrSendMessage向主线程消息队列发送DESTROY_ACTIVITY消息；H.handleMessage处理该消息调用ActivityThread.handleDestroyActivity，其中先调用performDestroyActivity（触发Activity的onDestroy），再通过窗口管理器wm的removeViewImmediate移除关联的DecorView描述的窗口，进而调用ViewRoot的die。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "ViewRoot.die的immediate参数为true和false时分别如何处理？", "a": "为true时直接调用doDie执行销毁；为false时向应用程序进程主线程消息队列发送一个DIE消息，等该消息被处理时再调用doDie销毁ViewRoot对象。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "ViewRoot.dispatchDetachedFromWindow在销毁时注销哪两个InputChannel？分别调用什么函数？", "a": "注销Client端InputChannel：调用InputQueue的静态成员函数unregisterInputChannel注销mInputChannel描述的Client端InputChannel；注销Server端InputChannel：调用sWindowSession的remove请求WindowManagerService移除窗口，WMS在移除过程中会注销与该窗口关联的Server端InputChannel。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "注销Client端InputChannel时，NativeInputQueue.unregisterInputChannel做了哪些清理工作？", "a": "①以Client端InputChannel内部前向管道的读端文件描述符为关键字，从mConnectionsByReceiveFd中移除对应的Connection对象；②将前向管道的读端文件描述符从Connection对象保存的Looper对象中移除；③删除Connection对象中inputHandlerObjGlobal对Java层InputHandler对象的全局引用并置为null，以便释放该对象。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "注销Server端InputChannel的函数调用链是什么？", "a": "Session.remove → WindowManagerService.removeWindow → removeWindowLocked（先调用WindowState.disposeInputChannel注销Server端InputChannel，再调用removeWindowInnerLocked从mWindowMap和mWindows中移除WindowState）→ InputManager.unregisterInputChannel → nativeUnregisterInputChannel → NativeInputManager.unregisterInputChannel → InputDispatcher.unregisterInputChannel。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "InputDispatcher.unregisterInputChannel做了哪些清理工作？", "a": "①以Server端InputChannel内部反向管道的读端文件描述符为关键字，从mConnectionsByReceiveFd中移除对应的Connection对象；②将该反向管道的读端文件描述符从InputDispatcher的成员变量mLooper描述的Looper对象中移除。"}, {"ch": "第14章 Android应用程序的键盘消息处理机制", "ci": 13, "part": "第3篇 Android应用程序框架", "q": "Server端和Client端InputChannel注册时的Connection对象分别以什么为关键字保存？监控什么IO事件？", "a": "Server端的Connection保存在InputDispatcher的mConnectionsByReceiveFd中，以反向管道读端文件描述符为关键字，监控反向管道的IO写事件（接收处理完成通知）；Client端的Connection保存在NativeInputQueue的mConnectionsByReceiveFd中，以前向管道读端文件描述符为关键字，监控前向管道的IO写事件（接收键盘事件分发信号）。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "Android应用程序线程分为主线程和子线程，主线程是由谁创建的？", "a": "主线程是由Activity管理服务ActivityManagerService请求Zygote进程创建的；子线程则由主线程或其他子线程创建。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "为什么执行不定期的后台任务时，更倾向于使用具有消息循环的子线程而不是每次新建线程？", "a": "每次条件满足就新建子线程、任务完成即销毁，不断创建和销毁线程有代价；而具有消息循环的子线程在无消息时因消息队列为空进入睡眠等待状态，可复用，避免了重复创建销毁的开销。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "Android应用程序线程有哪三种消息循环模型？分别用什么类实现？", "a": "①主线程消息循环模型——ActivityThread；②与界面无关的子线程消息循环模型——HandlerThread；③与界面相关的子线程消息循环模型——AsyncTask。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "Android应用程序主线程的入口函数是什么？它如何进入消息循环？", "a": "入口函数是ActivityThread类的静态成员函数main。它先调用Looper.prepareMainLooper在主线程中创建消息循环（含Looper对象和MessageQueue对象），再调用Looper.loop使主线程进入消息循环。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "Looper.prepareMainLooper有什么使用限制？为什么Looper要单独提供它？", "a": "它只能在应用程序主线程中调用，且只能被调用一次，重复调用会抛出运行时异常。单独提供它是因为创建的Looper对象除保存在线程局部变量外，还保存在Looper类的静态成员变量mMainLooper中，供子线程通过Looper.getMainLooper获取并向主线程发送界面消息。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "子线程为什么需要向主线程发送与界面相关的消息？", "a": "因为Android系统的界面操作是非线程安全的，规定只能在主线程中执行界面操作。子线程将界面操作封装成消息发送到主线程的消息队列，由主线程处理消息时执行界面操作。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "直接用Thread子类创建的子线程有消息循环吗？HandlerThread类的run方法做了什么？", "a": "没有。普通Thread子线程的run执行完后线程随之结束。HandlerThread也是Thread子类，但其run方法先调用Looper.prepare创建消息循环，再调用Looper.loop使线程进入消息循环。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "如何向HandlerThread创建的子线程提交任务？如何结束该子线程？", "a": "将实现了Runnable接口的任务对象封装成消息，通过Handler发送到该子线程的消息队列，消息被处理时执行任务的run方法。结束线程时调用HandlerThread的quit方法，它获取子线程的Looper并调用其quit，向消息队列发送target为null的Message使线程退出消息循环。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "执行异步任务的子线程并没有自己的消息循环，AsyncTask如何实现界面更新？", "a": "它利用主线程的消息循环：AsyncTask的静态成员变量sHandler指向InternalHandler对象，在主线程中创建。子线程执行异步任务时通过sHandler把消息发送到主线程的消息队列，主线程处理消息时调用onProgressUpdate、onPostExecute等执行界面操作。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask的三个泛型参数Params、Progress、Result分别表示什么？", "a": "分别描述一个异步任务的输入数据、过程数据和结果数据的类型。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask的静态成员变量sWorkQueue、sThreadFactory、sExecutor分别是什么？", "a": "sWorkQueue指向LinkedBlockingQueue工作任务队列；sThreadFactory指向线程创建工厂，用于创建执行队列中任务的线程；sExecutor指向ThreadPoolExecutor线程池，其中的线程由sThreadFactory创建。三者都是静态的，因此同一进程内所有AsyncTask共享同一线程池，避免重复创建线程池。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "简述ThreadPoolExecutor.execute的工作方式。", "a": "①线程数小于核心线程数corePoolSize时，创建新线程执行任务；②线程数介于核心与最大之间时，队列未满则任务入队等待，队列已满则创建新线程；③线程数达到最大线程数maximumPoolSize时，队列未满则任务入队，队列已满则拒绝执行任务。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask中的InternalHandler处理哪三种消息类型？各由什么方法处理？", "a": "①MESSAGE_POST_PROGRESS——onProgressUpdate处理，报告任务执行进度；②MESSAGE_POST_RESULT——finish/onPostExecute处理，通知任务执行完成；③MESSAGE_POST_CANCEL——onCancelled处理，通知任务被取消。这些消息都由子线程发送到主线程的消息队列。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask构造函数内部创建了哪两个对象来描述工作任务？各自的作用？", "a": "创建WorkerRunnable<Params,Result>对象（成员变量mWorker），实现了Callable接口，保存输入参数mParams，其call方法把具体任务交给doInBackground执行；再将其封装成FutureTask<Result>对象（成员变量mFuture），作为提交给线程池sExecutor的抽象工作任务。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask从execute启动到结果返回，任务是如何一步步执行的？", "a": "execute把输入数据存入mWorker，再把mFuture加入线程池sExecutor执行；FutureTask执行时调用内部Callable（即mWorker）的call方法，call转而调用doInBackground执行具体任务；完成后FutureTask的done方法通过sHandler发送MESSAGE_POST_RESULT消息，主线程中InternalHandler分发给finish/onPostExecute处理。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask中publishProgress的作用是什么？", "a": "在doInBackground中调用，将过程数据封装成AsyncTaskResult对象，再封装成MESSAGE_POST_PROGRESS类型消息，通过静态变量sHandler发送到主线程消息队列，最终在主线程中由onProgressUpdate处理，从而可以安全地更新界面。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask的任务结果是如何传递回主线程的？", "a": "任务执行完成后，FutureTask的done方法调用AsyncTask的get方法（内部调用mFuture.get）获得doInBackground的返回值，封装成AsyncTaskResult后发送MESSAGE_POST_RESULT消息到主线程消息队列，由finish/onPostExecute在主线程中处理。"}, {"ch": "第15章 Android应用程序线程的消息循环模型", "ci": 14, "part": "第3篇 Android应用程序框架", "q": "AsyncTask的任务被取消时会怎样？", "a": "获取执行结果时会抛出CancellationException异常，此时FutureTask的done方法通过sHandler发送MESSAGE_POST_CANCEL消息到主线程消息队列，最终在主线程中由onCancelled方法处理，子类重写该方法可在取消时执行界面操作。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService安装一个应用程序主要完成哪两件事情？", "a": "①解析应用程序的配置文件AndroidManifest.xml，获得其安装信息（尤其是组件信息）；②为应用程序分配Linux用户ID和Linux用户组ID，使其获得合适的运行权限。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService是在什么时候、由谁启动的？", "a": "System进程启动时会调用PackageManagerService类的静态成员函数main将它启动起来；main先启动该服务，再把它注册到Service Manager中，以便其他组件通过Service Manager获得其访问接口。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService扫描安装应用程序时涉及哪五个目录？各保存什么？", "a": "/system/framework——资源型应用程序（只打包资源、不含执行代码）；/system/app——系统自带应用程序；/vendor/app——设备厂商提供的应用程序；/data/app——用户自己安装的应用程序；/data/app-private——受DRM保护的私有应用程序。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService每次启动都重新安装一遍应用程序，为什么要用Settings类保存安装信息？", "a": "有些信息（如Linux用户ID）每次安装必须保持一致，否则应用在系统重启后表现可能不一致。因此每次安装完成后通过Settings.writeLP把安装信息保存到本地文件，下次启动时通过Settings.readLP恢复。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Settings.readLP从哪些文件恢复上一次的安装信息？这些文件的关系？", "a": "从/data/system/packages.xml和/data/system/packages-backup.xml恢复，后者是前者的备份。若备份文件存在则以备份内容为准，否则以packages.xml的内容为准。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "packages.xml中标签值为package和shared-user的xml元素分别描述什么？", "a": "package元素描述上一次安装的一个应用程序的信息，属性name为Package名称，userId和sharedUserId分别为其独立Linux用户ID和共享Linux用户ID（两者互斥）；shared-user元素描述上一次分配的一个共享Linux用户，属性name、userId、system分别表示名称、ID值及该ID是分配给系统类型还是用户类型应用程序。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "readPackageLP中为什么要创建PendingPackage对象？", "a": "如果应用指定了sharedUserId但该共享Linux用户信息还未解析完成，无法立即确认其共享Linux用户ID是否有效，于是将其封装成PendingPackage保存在Settings的mPendingPackages中；等共享Linux用户信息解析完成后，再验证并为其保留上次的Linux用户ID。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "系统中每个应用程序的安装信息用什么对象描述？保存在哪里？", "a": "用一个PackageSetting对象描述，保存在Settings类的成员变量mPackages所描述的HashMap中，以应用程序的Package名称为关键字。共享Linux用户则用SharedUserSetting对象描述，保存在mSharedUsers中，以共享用户名称为关键字。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Settings.addUserIdLP如何区分应用程序的Linux用户ID和特权用户的Linux用户ID？", "a": "大于等于FIRST_APPLICATION_UID（10000）且小于FIRST_APPLICATION_UID+MAX_APPLICATION_UIDS（1000个）的ID保留给应用程序，记录在ArrayList类型的mUserIds中；小于FIRST_APPLICATION_UID的ID保留给特权用户（如android.uid.system的1000），记录在SparseArray类型的mOtherUserIds中。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "应用程序如何与特权用户共享Linux用户ID？举例说明。", "a": "在配置文件AndroidManifest.xml的manifest标签中设置android:sharedUserId属性。例如想让应用修改系统时间，可将android:sharedUserId设置为android.uid.system，与应用共享Linux用户ID 1000。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService.scanDirLI如何安装一个目录中的应用程序？", "a": "遍历目录中的每个文件，若后缀为.apk则调用scanPackageLI解析；若解析发现不是真正的应用程序文件（返回null且mLastScanError为INSTALL_FAILED_INVALID_APK），且该目录不是系统目录（flags不含PARSE_IS_SYSTEM位），则将该文件删除，因此/data/app和/data/app-private中的无效apk会被删除。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "解析一个apk文件的本质是什么？由哪个类完成？", "a": "apk是以.apk为后缀的归档文件，内含配置文件AndroidManifest.xml，解析apk的过程就是解析其中AndroidManifest.xml的过程。由PackageParser类的parsePackage完成，解析成功返回一个Package对象。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageParser.parsePackage重点解析AndroidManifest.xml中的哪些标签？", "a": "manifest标签的android:sharedUserId属性（共享Linux用户ID）；uses-permission子标签（资源访问权限，其android:name保存到Package的requestedPermissions）；application子标签（由parseApplication解析，其中activity、receiver、service、provider标签描述四类组件配置信息）。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService重载版scanPackageLI主要完成哪6项工作？", "a": "①为应用程序分配Linux用户ID；②将Package对象保存到mPackages中；③将Content Provider组件信息保存到mProvidersByComponent；④将Service组件信息保存到mServices；⑤将Broadcast Receiver组件信息保存到mReceivers；⑥将Activity组件信息保存到mActivities。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Settings.newUserIdLP如何为一个新安装的应用程序分配Linux用户ID？", "a": "在mUserIds列表中从前往后查找值为null的位置，若第i个位置的Object为null，则分配值等于FIRST_APPLICATION_UID+i的ID；若无空闲且已分配数量未达到MAX_APPLICATION_UIDS，则分配FIRST_APPLICATION_UID+N（N为已分配数量）。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "PackageManagerService如何建立资源访问权限与Linux用户组ID的对应关系？", "a": "启动时调用readPermissions解析/system/etc/permissions/platform.xml，为其中每个permission标签创建BasePermission对象（内部gids数组保存对应的Linux用户组ID，通过getgrnam获得），以权限名称为关键字保存在Settings的mPermissions中；文件中的全局group标签描述的组ID保存在mGlobalGids中，所有应用默认具有。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "grantPermissionsLP如何判断一个资源访问权限是否合法？", "a": "根据BasePermission的保护级别判断：PROTECTION_NORMAL或PROTECTION_DANGEROUS直接合法；PROTECTION_SIGNATURE或PROTECTION_SIGNATURE_OR_SYSTEM需检查应用签名是否与要求的签名或平台Package（包名为android）匹配。不合法的权限会从应用的权限列表中移除，合法的则分配相应Linux用户组ID。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Settings.writeLP保存安装信息时如何防止写入出错导致信息丢失？", "a": "写入前先把/data/system/packages.xml重命名为备份文件/data/system/packages-backup.xml（若备份已存在则删除旧的packages.xml），再写入新的安装信息；写入成功后删除备份文件。一旦写入出错，可通过备份文件恢复上一次的安装信息。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "系统启动完成后动态安装应用程序（如从网络下载安装）的入口是什么？", "a": "调用PackageManager类的成员函数installPackage启动安装过程，它最终仍是通过PackageManagerService类的成员函数scanPackageLI完成应用程序的安装，与系统启动时的安装过程类似，只是入口不同。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Android如何利用Linux用户ID/用户组ID防止应用程序破坏其他应用数据或非法访问特权资源？", "a": "AMS请求Zygote创建应用程序进程时，把该应用的Linux用户ID和用户组ID通过参数传给Process.start，使应用运行在一个受限的进程中，从而防止它破坏其他应用程序的数据以及非法访问系统特权资源。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "系统启动后是如何触发Launcher启动的？", "a": "System进程中的ServerThread线程启动ActivityManagerService和PackageManagerService等关键服务后，调用ActivityManagerService的systemReady，它通过ActivityStack.resumeTopActivityLocked发现堆栈顶无Activity，进而调用startHomeActivityLocked启动Home应用程序Launcher。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "startHomeActivityLocked在非工厂测试模式下如何找到并启动Launcher？", "a": "从PackageManagerService中获取类型和Action名称分别等于Intent.CATEGORY_HOME和Intent.ACTION_MAIN的Activity组件信息（Launcher的Launcher组件即配置为这两个条件），检查其进程未启动后，通过mMainStack的startActivityLocked启动它，最终调用其onCreate。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Launcher为什么要用一个带有消息循环的HandlerThread来加载应用程序信息？", "a": "Launcher运行期间系统中应用会增删，需要不定期重新加载应用信息。为避免每次都重复创建线程，LauncherModel使用静态的HandlerThread（sWorkerThread）作为后台线程，每次通过sWorker（Handler）向其消息队列发送LoaderTask消息来执行加载；空闲时该线程因消息队列为空而睡眠。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Launcher通过什么条件请求PackageManagerService返回已安装应用的根Activity组件信息？", "a": "通过queryIntentActivities查询类型为Intent.CATEGORY_LAUNCHER、Action名称为Intent.ACTION_MAIN的Activity组件。根Activity组件的category被定义为CATEGORY_LAUNCHER、action被定义为ACTION_MAIN，返回结果保存在ResolveInfo列表中。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "LoaderTask.loadAllAppsByBatch如何分批加载并显示应用程序？", "a": "创建CATEGORY_LAUNCHER/ACTION_MAIN的Intent，通过PMS代理的queryIntentActivities获得全部根Activity信息；按显示名称排序后分批封装成ApplicationInfo加入AllAppsList的临时added列表，再通过主线程中的DeferredHandler（mHandler）把Runnable消息发到Launcher主线程，回调bindAllApplications（首批，先清空再显示）或bindAppsAdded（后续批，仅增加）。"}, {"ch": "第16章 Android应用程序的安装和显示过程", "ci": 15, "part": "第3篇 Android应用程序框架", "q": "Launcher中快捷图标最终是如何显示到屏幕上的？点击图标时发生什么？", "a": "Launcher.bindAllApplications调用AllApps2D的setApps，将ApplicationInfo通过binarySearch按显示名称顺序插入mAllAppsList，再由数据适配器mAppsAdapter调用notifyDataSetChanged更新GridView（mGrid）显示快捷图标。点击图标时onItemClick被调用，通过ApplicationInfo的intent调用Launcher的startActivitySafely启动对应应用的根Activity组件。"}];
const CHAPTERS = ["第1章 准备知识", "第2章 硬件抽象层", "第3章 智能指针", "第4章 Logger日志系统", "第5章 Binder进程间通信系统", "第6章 Ashmem匿名共享内存系统", "第7章 Activity组件的启动过程", "第8章 Service组件的启动过程", "第9章 Android系统广播机制", "第10章 Content Provider组件的实现原理", "第11章 Zygote和System进程的启动过程", "第12章 Android应用程序进程的启动过程", "第13章 Android应用程序的消息处理机制", "第14章 Android应用程序的键盘消息处理机制", "第15章 Android应用程序线程的消息循环模型", "第16章 Android应用程序的安装和显示过程"];
const COUNTS = {"第1章 准备知识": 27, "第2章 硬件抽象层": 32, "第3章 智能指针": 29, "第4章 Logger日志系统": 52, "第5章 Binder进程间通信系统": 111, "第6章 Ashmem匿名共享内存系统": 46, "第7章 Activity组件的启动过程": 36, "第8章 Service组件的启动过程": 29, "第9章 Android系统广播机制": 22, "第10章 Content Provider组件的实现原理": 29, "第11章 Zygote和System进程的启动过程": 19, "第12章 Android应用程序进程的启动过程": 13, "第13章 Android应用程序的消息处理机制": 24, "第14章 Android应用程序的键盘消息处理机制": 78, "第15章 Android应用程序线程的消息循环模型": 18, "第16章 Android应用程序的安装和显示过程": 26};
const PARTS = [{"name": "第1篇 初识Android系统", "chs": ["第1章 准备知识", "第2章 硬件抽象层", "第3章 智能指针"]}, {"name": "第2篇 Android专用驱动系统", "chs": ["第4章 Logger日志系统", "第5章 Binder进程间通信系统", "第6章 Ashmem匿名共享内存系统"]}, {"name": "第3篇 Android应用程序框架", "chs": ["第7章 Activity组件的启动过程", "第8章 Service组件的启动过程", "第9章 Android系统广播机制", "第10章 Content Provider组件的实现原理", "第11章 Zygote和System进程的启动过程", "第12章 Android应用程序进程的启动过程", "第13章 Android应用程序的消息处理机制", "第14章 Android应用程序的键盘消息处理机制", "第15章 Android应用程序线程的消息循环模型", "第16章 Android应用程序的安装和显示过程"]}];

const PART_COLOR = {"第1篇 初识Android系统":"#0F766E","第2篇 Android专用驱动系统":"#7C5CD6","第3篇 Android应用程序框架":"#C2571A"};

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function md(s){ // minimal inline-code styling
  return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
}

const grid = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const seen = new Set();
let curCh = -1, curQ = '', flipAll = false;

document.getElementById('statTotal').textContent = CARDS.length;
document.getElementById('totalN').textContent = CARDS.length;

// chapter select
const sel = document.getElementById('chapSelect');
PARTS.forEach(p=>{
  const g = document.createElement('optgroup'); g.label = p.name;
  p.chs.forEach(ch=>{
    const o = document.createElement('option'); o.value = CHAPTERS.indexOf(ch);
    o.textContent = ch + '（' + COUNTS[ch] + '）';
    g.appendChild(o);
  });
  sel.appendChild(g);
});

// chapter chips
const nav = document.getElementById('chapnav');
PARTS.forEach(p=>{
  const d = document.createElement('div'); d.className='part';
  d.innerHTML = '<div class="part-name">'+esc(p.name)+'</div>';
  const chips = document.createElement('div'); chips.className='chips';
  p.chs.forEach(ch=>{
    const i = CHAPTERS.indexOf(ch);
    const c = document.createElement('button'); c.className='chip'; c.dataset.i=i;
    c.innerHTML = esc(ch) + '<span class="n">'+COUNTS[ch]+'</span>';
    c.onclick = ()=>{
      curCh = (curCh===i ? -1 : i);
      sel.value = curCh;
      renderChips(); render();
    };
    chips.appendChild(c);
  });
  d.appendChild(chips); nav.appendChild(d);
});
function renderChips(){
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', +c.dataset.i===curCh));
}

sel.onchange = ()=>{ curCh = +sel.value; renderChips(); render(); };

document.getElementById('searchBox').addEventListener('input', e=>{ curQ = e.target.value.trim().toLowerCase(); render(); });

document.getElementById('flipAllBtn').onclick = function(){
  flipAll = !flipAll;
  this.textContent = flipAll ? '全部复原' : '全部翻面';
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('flipped', flipAll));
  if(flipAll) markAllSeen();
};

document.getElementById('resetBtn').onclick = ()=>{
  seen.clear(); document.getElementById('statSeen').textContent = 0;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('flipped','seen'));
  flipAll = false; document.getElementById('flipAllBtn').textContent = '全部翻面';
  render();
};

function markAllSeen(){
  document.querySelectorAll('.card').forEach(c=>{seen.add(+c.dataset.idx); c.classList.add('seen')});
  document.getElementById('statSeen').textContent = seen.size;
}

function render(){
  const list = CARDS.map((c,i)=>({c,i})).filter(({c})=>{
    if(curCh!==-1 && c.ci!==curCh) return false;
    if(curQ && !(c.q.toLowerCase().includes(curQ) || c.a.toLowerCase().includes(curQ))) return false;
    return true;
  });
  document.getElementById('shownN').textContent = list.length;
  grid.innerHTML = '';
  emptyEl.style.display = list.length ? 'none':'block';
  const frag = document.createDocumentFragment();
  list.forEach(({c,i})=>{
    const color = PART_COLOR[c.part];
    const el = document.createElement('div');
    el.className = 'card' + (seen.has(i)?' seen':'');
    el.dataset.idx = i;
    el.innerHTML =
      '<div class="card-inner">' +
        '<div class="face front">' +
          '<div class="meta"><span class="badge" style="background:'+color+'">Q'+(i+1)+' · '+esc(c.ch.replace(/^第/,'').replace(/ .*/,''))+'</span><span class="ch-name">'+esc(c.ch)+'</span></div>' +
          '<div class="q">'+md(c.q)+'</div>' +
          '<div class="hint"><span class="flip-ico">⟲ 点击翻面</span><span class="idx">'+(i+1)+' / '+CARDS.length+'</span></div>' +
        '</div>' +
        '<div class="face back">' +
          '<div class="meta"><span class="badge" style="background:'+color+'">A'+(i+1)+'</span><span class="ch-name">'+esc(c.ch)+'</span></div>' +
          '<div class="a">'+md(c.a)+'</div>' +
          '<div class="hint"><span class="flip-ico">⟲ 点击返回问题</span><span class="idx">'+(i+1)+' / '+CARDS.length+'</span></div>' +
        '</div>' +
      '</div>';
    el.addEventListener('click', ()=>{
      el.classList.toggle('flipped');
      if(el.classList.contains('flipped') && !seen.has(i)){
        seen.add(i); el.classList.add('seen');
        document.getElementById('statSeen').textContent = seen.size;
      }
    });
    frag.appendChild(el);
  });
  grid.appendChild(frag);
}
render();
</script>
</body>
</html>
