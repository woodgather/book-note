<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android系统源代码情景分析 · Anki卡片集</title>
<style>
:root{
  color-scheme: light;
  --bg:#F6F7F4;
  --surface:#FFFFFF;
  --ink:#1C2B26;
  --ink-2:#5A6B64;
  --line:#DDE4DF;
  --green:#1E8E5A;
  --green-deep:#0E5A38;
  --green-soft:#E4F3EB;
  --p1:#0F766E; --p2:#7C5CD6; --p3:#C2571A;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.75;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px}

/* ---------- header ---------- */
header.hero{padding:52px 0 26px}
.hero .book-tag{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:12.5px;color:var(--green-deep);
  background:var(--green-soft);border:1px solid #CBE7D8;border-radius:999px;
  padding:3px 14px;margin-bottom:18px;
}
.hero .book-tag .dot{width:8px;height:8px;border-radius:2px;background:var(--green)}
h1{font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1.3}
h1 .vol{font-weight:400;color:var(--ink-2);font-size:22px}
.hero p.sub{color:var(--ink-2);margin-top:8px;max-width:64ch}
.stats{display:flex;gap:36px;margin-top:26px;flex-wrap:wrap}
.stat b{font-size:26px;font-weight:700;color:var(--green-deep);font-family:var(--mono)}
.stat span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:50;
  background:rgba(246,247,244,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  margin:0 -24px;padding:12px 24px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.search{position:relative;flex:1;min-width:220px}
.search input{
  width:100%;padding:9px 14px 9px 38px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-family:var(--sans);color:var(--ink);outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,142,90,.13)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
select{
  padding:9px 34px 9px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:14px;color:var(--ink);
  font-family:var(--sans);outline:none;cursor:pointer;max-width:340px;
  appearance:auto;
}
.btn{
  padding:9px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:13.5px;color:var(--ink);cursor:pointer;
  font-family:var(--sans);transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--green);color:var(--green-deep)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-deep);color:#fff}
.counter{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.counter b{color:var(--green-deep)}

/* ---------- chapter nav ---------- */
.chapnav{margin:26px 0 6px}
.chapnav .part{margin-bottom:14px}
.chapnav .part-name{
  font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
  margin-bottom:8px;display:flex;align-items:center;gap:10px;
}
.chapnav .part-name::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;color:var(--ink-2);
  cursor:pointer;transition:all .15s;font-family:var(--sans);
}
.chip:hover{border-color:var(--green);color:var(--green-deep)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.65}

/* ---------- cards grid ---------- */
.grid{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;
  margin-top:24px;
}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

.card{perspective:1600px;min-height:230px}
.card-inner{
  position:relative;width:100%;height:100%;min-height:230px;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.7,.3,1);
  cursor:pointer;
}
.card.flipped .card-inner{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){
  .card-inner{transition:none}
}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;display:flex;flex-direction:column;overflow:hidden;
}
.face.back{
  transform:rotateY(180deg);
  background:var(--green-soft);border-color:#C4E3D2;
}
.face .meta{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-shrink:0;
}
.badge{
  font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:6px;
  color:#fff;flex-shrink:0;
}
.ch-name{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face .q{
  font-size:15.5px;font-weight:600;line-height:1.65;flex:1;overflow:auto;
}
.face .a{font-size:14.5px;line-height:1.8;flex:1;overflow:auto;color:#173B2C;white-space:pre-wrap}
.face .a code, .face .q code{
  font-family:var(--mono);font-size:.88em;background:rgba(30,142,90,.10);
  padding:1px 5px;border-radius:4px;color:var(--green-deep);
}
.face .hint{
  flex-shrink:0;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:11.5px;color:var(--ink-2);font-family:var(--mono);
  display:flex;justify-content:space-between;align-items:center;
}
.face.back .hint{border-top-color:#B3D8C4}
.face .hint .idx{opacity:.7}
.flip-ico{
  display:inline-flex;align-items:center;gap:5px;
}
.card.seen .badge{outline:2px solid rgba(30,142,90,.35)}

/* code styling inside answers */
.empty{padding:80px 0;text-align:center;color:var(--ink-2);display:none}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);text-align:center}
</style>
</head>

<script>
const CARDS = [{"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "分析Android系统源代码时，经常会涉及哪些Linux内核基础知识？", "a": "管道（pipe）、套接字（socket）、虚拟文件系统（VFS）等，以及Android通过模块形式加入内核的专用驱动程序：Logger日志驱动、Binder进程间通信驱动、Ashmem匿名共享内存驱动。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "《Linux Kernel Development》一书的作者和定位是什么？", "a": "作者Robert Love（最新第3版），对Linux内核的设计原理和实现思路提供总览视图，适合初学者。从软件工程角度看，相当于Linux内核的概要设计文档。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "《Understanding the Linux Kernel》一书的作者和定位是什么？", "a": "作者Daniel P. Bovet和Marco Cesati（最新第3版），详细描述内核中各种重要数据结构、算法和编程技巧，适合中高级读者，相当于Linux内核的详细设计文档。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "《Linux Device Drivers》一书的作者和特点是什么？", "a": "作者Jonathan Corbet、Alessandro Rubini和Greg Kroah-Hartman（最新第3版）。注重实际操作，详细讲解Linux内核驱动程序的实现原理，对分析Android专用驱动模块帮助很大。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "Android应用程序的四大组件是什么？", "a": "Activity、Service、Broadcast Receiver和Content Provider。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "编译Android 2.3.x (Gingerbread)~5.x (Lollipop)源代码推荐使用哪个Ubuntu版本？", "a": "Ubuntu 12.04 (Precise)。而Android 6.0 (Marshmallow)~AOSP master要求Ubuntu 14.04 (Trusty)（需64位），Android 1.5~2.2.x对应Ubuntu 10.04 (Lucid)。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "编译Android 2.3.x~4.4.x (KitKat)源代码需要哪个JDK版本？", "a": "Java JDK 6。Android 5.x~6.0要求OpenJDK 7，AOSP master要求OpenJDK 8，Android 1.5~2.2.x要求Java JDK 5。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "Google提供的repo工具的本质是什么？", "a": "它是一个脚本文件，内部封装了下载Android源代码所需的git命令。主线代码用repo sync下载，用repo init -b可以指定下载某一稳定支线（如Android 2.3.1）的代码。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "在32位机器上编译主线Android源代码报错\"You are attempting to build on a 32-bit system\"，如何解决？", "a": "修改build/core/main.mk中的位数检查；并修改external/clearsilver下的cgi、cs、java-jni、util四个目录中的Android.mk。主线源码默认只能在64位机器上编译。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "Android源代码编译结果输出到哪个目录？", "a": "out/target/product/$(TARGET_PRODUCT)，其中TARGET_PRODUCT是环境变量，默认值为generic。编译成功后可用make sdk命令打包成SDK。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "启动Android模拟器需要哪四个文件？它们各是什么？", "a": "zImage（Linux内核镜像文件）、system.img、userdata.img和ramdisk.img（后三个为Android系统镜像文件）。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "不带参数运行emulator命令时，模拟器默认从哪里加载内核镜像和系统镜像？", "a": "内核zImage默认使用out/host/linux-x86/bin目录下的kernel-qemu文件；system.img、userdata.img和ramdisk.img默认从ANDROID_PRODUCT_OUT环境变量所指向的目录（编译结果输出目录）中加载。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "Android模拟器使用的Linux内核源代码叫什么名称？如何获取？", "a": "goldfish内核，位于~/Android/kernel/goldfish目录，使用android-goldfish-2.6.29支线。它通过git clone手动下载（没有repo脚本支持），下载后需git checkout指定支线。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "为Android模拟器编译Linux内核前，需要修改Makefile中的哪两个变量？", "a": "ARCH变量设为arm（目标CPU体系结构），CROSS_COMPILE变量设为arm-eabi-（交叉编译工具前缀，工具位于prebuilt/linux-x86/toolchain子目录中）。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "为Android模拟器编译内核分为哪三个步骤？编译产物在哪里？", "a": "第一步将交叉编译工具目录加入PATH环境变量；第二步修改硬件配置文件goldfish_defconfig；第三步执行make命令。得到的zImage位于内核源代码的arch/arm/boot子目录中。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "如何让Android模拟器使用自己编译的内核镜像？如何验证？", "a": "通过emulator的-kernel选项指定zImage文件（命令后加&后台运行）。用adb工具连接模拟器后，可通过cat /proc/cpuinfo或查看内核版本信息（编译主机名、时间）来验证。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "在Android源代码工程环境中，一个Android应用程序工程通常包含哪些内容？", "a": "一个源代码目录src、一个资源目录res、一个配置文件AndroidManifest.xml和一个编译脚本文件Android.mk。实验性质的应用通常放在packages/experimental目录下。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "mmm命令默认不可用，如何才能使用它？它有什么作用？", "a": "需先在终端执行Android源代码目录下的build/envsetup.sh脚本。mmm命令用于单独编译某一个模块（模块目录下必须存在Android.mk文件），避免重新执行make编译整个工程。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "make snod命令的作用是什么？", "a": "纯粹执行重新打包Android系统镜像文件system.img的操作。单独编译模块后必须执行它，否则模拟器启动后看不到新编译的应用程序。重新生成的system.img位于out/target/product/generic目录。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "不同类型模块的编译结果分别输出到/system下的哪些目录？", "a": "apk文件在out/target/product/generic/system/app；C可执行文件在system/bin；动态链接库在system/lib；硬件抽象层模块文件在system/lib/hw。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "ROM的组成层次是怎样的？", "a": "最底层是各种硬件设备，其上为Bootloader（最广泛使用的是uboot，编译为uboot.bin烧入特定分区）；再上是系统分区。正常模式下的系统包含System和Boot两个核心分区。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "Fastboot模式和Recovery模式分别是什么？如何进入？", "a": "Fastboot模式：Bootloader初始化硬件后不启动OS，停留等待用户输入命令（关机时同按音量下键+电源键进入），可用fastboot工具刷入recovery.img（刷Recovery）。Recovery模式：运行Recovery镜像包含的小型系统，可修改正常模式下的系统（关机时同按音量上键+电源键进入）。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "正常模式下系统的System分区和Boot分区分别包含什么内容？", "a": "System分区包含Android运行时框架、系统App以及预装的第三方App等；Boot分区包含内核和根文件系统。对应镜像分别为system.img和boot.img，通常打包压缩成zip（如update.zip）后在Recovery模式下刷入，即刷ROM。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "为真机编译ROM所需的源代码划分为哪三部分？", "a": "第一部分是Android源代码（可用官方AOSP或第三方如LineageOS，CyanogenMod已迁移到LineageOS）；第二部分是开源的设备相关代码（可从GitHub/LineageOS获取）；第三部分是闭源的设备私有文件（无法获取源码，可从手机提取库文件，GitHub上的TheMuppets项目提供了很多设备的私有文件）。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "LineageOS提供的breakfast和brunch命令分别有什么作用？", "a": "breakfast命令用于下载设备开源代码（需指定设备代号，如小米3联通版为cancro）；brunch命令用于为指定设备编译一个ROM，编译结果如lineage-13.0-<日期>-UNOFFICIAL-cancro.zip，可用adb push上传到手机SD卡后通过Recovery刷入。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "TWRP是什么？相比其他Recovery有什么特点？", "a": "TWRP是著名的第三方Recovery项目，支持大部分手机，且支持触摸屏操作（其他Recovery基本只能通过电源键和音量键操作）。可通过需要Root权限的TWRP App刷入手机。"}, {"ch": "第1章 准备知识", "ci": 0, "part": "第1篇 初识Android系统", "q": "Native内存泄漏与Java内存泄漏的排查有什么不同？为什么可能需要刷ROM？", "a": "Java内存泄漏在IDE（Android Studio）中有完备支持；Native内存泄漏需要系统支持，即要把系统中的libc库替换成带内存分配追踪功能的Debug版本。市面手机一般不带Debug版libc，因此需刷入带Debug版libc的自编译ROM。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "Android硬件抽象层（HAL）的作用是什么？运行在哪个空间？", "a": "HAL运行在用户空间中，向下屏蔽硬件驱动模块的实现细节，向上提供硬件访问服务。Android分两层支持硬件设备：用户空间（HAL模块）和内核空间（硬件驱动模块）。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "Android为什么把对硬件的支持划分为内核空间和用户空间两层来实现？", "a": "Linux内核遵循GPL协议，内核代码必须公开，完全在内核实现会暴露硬件实现细节和参数，损害移动设备厂商利益；而Android源代码遵循Apache License，允许不公开。因此内核只提供简单的硬件访问通道，HAL在用户空间封装硬件实现细节和参数。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "本书为讲解HAL而开发的虚拟硬件设备freg是什么？", "a": "一个虚拟的字符硬件设备\"fake register\"，只有一个大小为4字节、可读可写的寄存器。驱动程序名为freg，由freg.h、freg.c、Kconfig和Makefile四个文件组成。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "驱动程序freg向用户空间提供了哪三个访问接口？", "a": "第一个是proc文件系统接口（freg_proc_read/freg_proc_write，创建/proc/freg文件）；第二个是传统的设备文件系统接口（freg_open、freg_release、freg_read、freg_write，访问/dev/freg）；第三个是devfs文件系统接口（freg_val_show和freg_val_store，访问/sys/class/freg/freg/val属性文件）。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "结构体fake_reg_dev中有哪些重要成员变量？各自的作用是什么？", "a": "val（int类型）描述虚拟寄存器；sem是信号量，用来同步对寄存器val的访问；dev是标准的Linux字符设备结构体变量，标志freg为字符设备类型。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "驱动程序freg的Kconfig文件定义了哪三种编译方式？默认是哪种？", "a": "第一种直接内建在内核中（对应$(CONFIG_FREG)=y）；第二种编译成内核模块（=m）；第三种不编译到内核中（=n）。默认编译方式为n，编译前需通过make menuconfig修改。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "内核make menuconfig时如何让编译系统找到新驱动freg的Kconfig文件？", "a": "修改arch/$(ARCH)（如arch/arm）目录下的Kconfig文件，在其中添加source \"drivers/freg/Kconfig\"。arm架构没有包含drivers/Kconfig，而是把其内容复制进自身Kconfig，因此为兼容起见最好同时在drivers/Kconfig中也添加此行。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "内核编译时如何让编译系统找到驱动freg的Makefile文件？", "a": "在drivers/Makefile文件中添加一行：obj-$(CONFIG_FREG) += freg/，这样执行make编译内核时就会编译驱动freg。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "如何验证驱动程序freg的proc和devfs接口是否正确？", "a": "用编译好的zImage启动Android模拟器，用adb连接后，用cat和echo命令读写/proc/freg文件或/sys/class/freg/freg/val文件的内容，若读出的内容与上次写入的内容相同，则说明接口正确。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件抽象层模块文件的命名规范是什么？", "a": "定义在hardware/libhardware/hardware.c中，命名规范为\"<MODULE_ID>.variant.so\"，其中variant是四个系统属性ro.hardware、ro.product.board、ro.board.platform、ro.arch之一的值；若这些属性都不存在或对应文件都不存在，则使用\"<MODULE_ID>.default.so\"。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "系统属性ro.hardware是如何设置的？", "a": "系统启动时由init进程设置：先读取/proc/cmdline，检查是否有androidboot.hardware属性，有则以其值为ro.hardware的值；否则读取/proc/cpuinfo，将其中Hardware字段的内容作为ro.hardware的值（如Android模拟器中为goldfish）。ro.product.board、ro.board.platform、ro.arch则从/system/build.prop文件读取。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件抽象层模块和硬件设备分别用什么结构体描述？", "a": "每一个硬件模块对应一个动态链接库文件，模块用结构体hw_module_t描述，硬件设备用结构体hw_device_t描述，均定义在hardware/libhardware/include/hardware/hardware.h中。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "结构体hw_module_t有哪些编写规范上的要点？", "a": "(1)每个模块必须自定义模块结构体，且第一个成员变量类型必须为hw_module_t；(2)必须存在导出符号HAL_MODULE_INFO_SYM（即\"HMI\"），指向自定义模块结构体；(3)成员tag必须为HARDWARE_MODULE_TAG；(4)成员dso保存加载模块（dlopen）得到的句柄，供dlclose卸载时使用；(5)成员methods定义操作方法列表。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "结构体hw_module_methods_t的内容是什么？", "a": "只有一个函数指针成员open，用来打开硬件抽象层模块中的硬件设备。参数module表示设备所在模块，id表示要打开的设备ID（因为一个模块可能包含多个设备），device是输出参数，描述已打开的硬件设备。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "结构体hw_device_t有哪些编写规范上的要点？", "a": "(1)每个硬件设备必须自定义设备结构体，且第一个成员变量类型必须为hw_device_t；(2)成员tag必须设置为HARDWARE_DEVICE_TAG；(3)成员close是函数指针，用来关闭硬件设备。注意：设备由其所在模块提供接口打开，而关闭由设备自身提供接口完成。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件抽象层模块freg的自定义结构体freg_device_t有哪些成员变量？", "a": "第一个成员common的类型为hw_device_t；fd是文件描述符，描述打开的设备文件/dev/freg；set_val和get_val是函数指针，分别用来写和读虚拟寄存器val的内容。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件抽象层模块与内核驱动程序是什么关系？如何通信？", "a": "每一个硬件抽象层模块在内核中都对应有一个驱动程序，硬件抽象层模块就是通过这些驱动程序来访问硬件设备的，它们通过读写设备文件（如/dev/freg）来进行通信。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "负责加载硬件抽象层模块的函数hw_get_module的原型和参数含义是什么？", "a": "原型：int hw_get_module(const char *id, struct hw_module_t **module)。id是输入参数，表示要加载的模块ID；module是输出参数，加载成功时指向自定义的模块结构体。返回值等于0表示加载成功，小于0表示失败。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "hw_get_module查找模块文件时使用哪两个目录？", "a": "宏HAL_LIBRARY_PATH1定义为/system/lib/hw（保存系统编译的模块文件），宏HAL_LIBRARY_PATH2定义为/vendor/lib/hw（保存设备厂商提供的硬件抽象层模块文件）。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "简述hw_get_module加载模块freg的查找过程。", "a": "在for循环中依次用property_get取variant_keys中的系统属性值（如模拟器中ro.hardware为goldfish），拼出如/system/lib/hw/freg.goldfish.so的路径，用access函数检查文件是否存在；再检查/vendor/lib/hw下的对应文件；都不存在则继续下一个属性；最后若所有variant都失败，则检查/system/lib/hw/freg.default.so；找到后调用load函数加载。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "load函数加载硬件抽象层模块的过程是怎样的？", "a": "先调用dlopen将模块so文件加载到内存；再用dlsym获得符号HAL_MODULE_INFO_SYM_AS_STR（值为\"HMI\"），并将其安全转换为hw_module_t结构体指针；然后用strcmp验证模块ID与请求加载的ID一致（不一致返回-EINVAL）；最后将dlopen的句柄保存在hmi的dso成员中并返回。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件抽象层模块中打开设备文件权限不足的原因和解决方案是什么？", "a": "默认只有root用户才能访问系统设备文件，普通应用程序调用open打开/dev/freg会失败。Android没有实现Linux的udev机制，改用uevent机制：在system/core/rootdir/ueventd.rc中添加一行如/dev/freg 0666，即可在系统启动时由init进程解析并修改设备文件访问权限。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "如何不重新编译Android源代码而修改ueventd.rc？", "a": "修改ramdisk.img镜像文件：先把ramdisk.img改名并gunzip解压（它是gzip文件），再用cpio命令解除归档；修改其中的ueventd.rc；然后按相反过程先用cpio归档再用gzip压缩，重新打包成ramdisk.img。系统启动时init会解析其中ueventd.rc并修改设备文件权限。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "为什么硬件访问服务必须通过JNI来调用硬件抽象层模块？", "a": "硬件抽象层模块用C++语言开发，而应用程序框架层中的硬件访问服务用Java语言开发，因此必须通过Java本地接口（JNI）来调用硬件抽象层模块的接口。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件访问服务通常运行在哪个进程中？应用程序如何访问它？", "a": "通常运行在系统进程System中（由Zygote孵化启动，实现开机自动启动）。而应用程序运行在另外的进程中，需通过Binder进程间通信机制来访问这些服务。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "AIDL是什么？用什么定义硬件访问服务接口IFregService？", "a": "AIDL即Android接口描述语言（Android Interface Definition Language），用于定义具有跨进程访问能力的服务接口，文件以aidl为后缀，编译时被转换成Java文件。接口IFregService定义在frameworks/base/core/java/android/os目录中，包含setVal和getVal两个成员函数。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "AIDL接口编译后会生成哪些类？Stub和Proxy各自的作用是什么？", "a": "生成的IFregService接口继承android.os.IInterface。接口内部定义了Binder本地对象类Stub（实现IFregService并继承android.os.Binder，在Server进程中等待Client的进程间通信请求），以及Stub内部的Binder代理对象类Proxy（同样实现IFregService，Client通过它向Server发送请求）。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件访问服务FregService如何实现？mPtr的作用是什么？", "a": "FregService位于frameworks/base/services/java/com/android/server目录，继承IFregService.Stub并实现setVal和getVal（分别调用JNI方法setVal_native和getVal_native）。启动时通过JNI方法init_native打开硬件设备并得到句柄，保存在成员变量mPtr中（失败为0）；该句柄实际指向HAL中的设备对象，供JNI知道访问哪个硬件设备。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "FregService的JNI方法freg_init的实现流程是什么？", "a": "首先调用hw_get_module加载模块ID为FREG_HARDWARE_MODULE_ID的HAL模块，得到hw_module_t接口（实际指向freg_module_t对象）；接着通过其操作方法列表中的open函数（即freg_device_open）打开设备ID为FREG_HARDWARE_DEVICE_ID的设备，得到freg_device_t接口；最后将该接口转换成整型句柄值返回给调用者。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "FregService的JNI方法表是如何注册到Java虚拟机的？", "a": "在com_android_server_FregService.cpp中定义JNI方法表method_table，将freg_init、freg_setVal、freg_getVal分别注册为init_native、setVal_native、getVal_native；调用jniRegisterNativeMethods函数完成注册。还需修改onload.cpp，增加register_android_server_FregService的声明和调用——系统加载libandroid_servers模块时JNI_OnLoad会被调用，从而注册这三个方法。编译得到libandroid_servers.so。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "硬件访问服务FregService是如何启动的？", "a": "系统进程System启动时会创建ServerThread线程来启动系统中的关键服务。在SystemServer.java的ServerThread类的run函数中，先创建FregService实例，然后把它注册到Service Manager中（注册时有一个名称如\"freg\"）。Service Manager是Binder机制的重要角色，负责管理系统中的服务对象。"}, {"ch": "第2章 硬件抽象层", "ci": 1, "part": "第1篇 初识Android系统", "q": "应用程序Freg如何获得并使用硬件访问服务FregService？", "a": "在Activity组件Freg的onCreate中，通过Service Manager按名称\"freg\"获得服务的Binder代理对象接口，将它转换为FregService代理对象接口（IFregService.Stub.Proxy），保存在成员变量fregService中；之后就可以通过调用它的setVal和getVal成员函数来读写虚拟寄存器val的值。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "Android应用程序框架层为什么使用C++开发？由此引入了什么问题？", "a": "出于性能考虑，不得不使用C++。而C++指针使用不当（忘记释放内存或使用无效指针），轻则内存泄漏，重则逻辑错误甚至系统崩溃，因此Android提供了C++智能指针来避免指针使用不当的问题。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "智能指针的本质是什么？它如何自动维护对象的引用计数？", "a": "智能指针是一个对象而不是指针，但它引用了实际使用的对象。它在构造时增加所引用对象的引用计数，在析构时减少引用计数。由于构造和析构是自动的，因此实现了自动的引用计数维护。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "简单的引用计数技术有什么缺陷？", "a": "当两个对象相互引用时（如A引用B，B也引用A），A和B的引用计数都不为0，谁也无法释放，互相等待。这也是垃圾收集系统的经典问题之一，因为它一次只能收集一个对象占用的内存。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "强引用计数与弱引用计数方案是如何解决相互引用问题的？", "a": "对象的生命周期只受强引用计数控制。将有关联的对象划分为\"父-子\"和\"子-父\"关系：父对象通过强引用计数引用子对象，子对象通过弱引用计数引用父对象。这样父对象（A）的生命周期不受子对象（B）的弱引用影响，可安全释放；释放A时同时释放对B的强引用，B随后也可释放。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "使用弱引用的对象在使用目标对象前必须做什么？为什么？", "a": "必须先成功地将弱引用计数升级为强引用计数，然后才能使用目标对象。因为对象的生命周期不受弱引用计数控制，弱引用指向的对象可能已被释放；若升级失败，说明对象已被释放，不能再使用。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "Android系统提供了哪三种C++智能指针？分别采用什么计数技术？", "a": "轻量级指针（Light Pointer）、强指针（Strong Pointer）和弱指针（Weak Pointer）。轻量级指针使用简单的引用计数技术；强指针和弱指针使用强引用计数和弱引用计数技术，需配合使用。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "Android智能指针的实现原理的共同点是什么？", "a": "需要对象提供引用计数器，但由智能指针负责维护这个引用计数器。引用计数器被定义为一个公共类，所有支持智能指针的对象类都必须从这个公共类继承。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "LightRefBase类的结构是怎样的？", "a": "它是一个模板类（模板参数T为实际对象类型，必须继承自LightRefBase），只有一个成员变量mCount记录引用计数值，并提供成员函数incStrong和decStrong来增加和减少引用计数。decStrong中若计数减为0，则释放对象占用的内存。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "sp类如何实现轻量级指针？", "a": "sp也是模板类，成员变量m_ptr指向实际引用的对象。构造函数（普通构造和拷贝构造）先初始化m_ptr，再调用其incStrong增加引用计数；析构函数调用m_ptr所指向对象的decStrong减少引用计数（实际调用LightRefBase的incStrong/decStrong）。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "一个类的对象要支持使用轻量级指针，必须满足什么条件？", "a": "必须从LightRefBase类继承下来，因为LightRefBase提供了简单的引用计数器（成员变量mCount及incStrong/decStrong函数）。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "RefBase类与LightRefBase类在引用计数实现上的关键区别是什么？", "a": "RefBase不是直接用一个整数维护引用计数，而是使用一个weakref_impl对象（成员变量mRefs）来描述对象的引用计数，同时提供强引用计数和弱引用计数。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "weakref_type类和weakref_impl类是什么关系？各自提供什么？", "a": "weakref_type定义在RefBase类内部，只定义引用计数维护接口（incWeak、decWeak、attemptIncStrong、attemptIncWeak）；weakref_impl继承weakref_type并提供具体实现，成员变量mStrong和mWeak分别描述对象的强、弱引用计数，mBase指向被引用对象的地址。每个RefBase对象内部都包含一个weakref_impl对象。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "weakref_impl的成员变量mFlags有哪几种取值？各表示什么？", "a": "取值为0、OBJECT_LIFETIME_WEAK或OBJECT_LIFETIME_FOREVER：0表示对象生命周期只受强引用计数影响；OBJECT_LIFETIME_WEAK表示同时受强、弱引用计数影响；OBJECT_LIFETIME_FOREVER表示完全不受强、弱引用计数影响。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "RefBase类的成员函数incStrong主要做了哪三件事？", "a": "(1)通过mRefs的incWeak增加对象的弱引用计数；(2)通过android_atomic_inc增加对象的强引用计数；(3)若发现对象是第一次被强指针引用，则调用对象的onFirstRef函数通知对象，以便执行业务相关逻辑（onFirstRef为空实现，子类需重写）。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "INITIAL_STRONG_VALUE是什么？incStrong为什么要对强引用计数做调整？", "a": "INITIAL_STRONG_VALUE是对象强引用计数的初始值（一个特殊宏值）。因为初始值加1后不等于1，而理论上对象第一次被强指针引用时强引用计数应等于1，所以incStrong需要将它调整为1。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "为什么说一个对象的弱引用计数一定大于或等于它的强引用计数？", "a": "因为强指针sp的构造函数调用RefBase::incStrong时，在增加对象强引用计数的同时也会增加对象的弱引用计数（每增加一次强引用必同时增加弱引用），所以弱引用计数始终大于等于强引用计数。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "RefBase::decStrong在强引用计数减为0时会做什么？", "a": "调用android_atomic_dec减少强引用计数，若原值（减1前）为1，说明没有强指针引用了，先调用对象的onLastStrongRef让对象执行业务逻辑；然后检查mFlags的OBJECT_LIFETIME_WEAK位，若对象生命周期不受弱引用计数影响，则释放对象占用的内存（触发RefBase析构）。最后再减少对象的弱引用计数。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "RefBase对象被释放时，其内部的weakref_impl对象何时被释放？", "a": "在RefBase析构函数中，若对象的弱引用计数值为0，才把引用计数对象mRefs（weakref_impl）一起释放。若弱引用计数大于0（还有其他弱指针通过它引用对象），只能释放RefBase对象本身，不能释放weakref_impl。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "weakref_type::decWeak在弱引用计数减为0时，对只受强引用计数控制的对象如何处理？", "a": "若对象从未被强指针引用过（强计数为INITIAL_STRONG_VALUE），则必须释放该对象，否则它以后得不到释放（只被弱指针引用的、只受强计数控制的对象会出现这种情况）；若对象曾被强指针引用过，则对象已在decStrong中被释放，此时只负责释放其内部的weakref_impl对象。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "weakref_type::decWeak在对象生命周期受弱引用计数控制时如何处理？", "a": "先调用对象的onLastWeakRef让对象执行业务逻辑；然后检查mFlags的OBJECT_LIFETIME_FOREVER位，若不等于1（即不是完全不受引用计数控制），则释放对象所占用的内存。若为FOREVER，则系统不自动释放。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "对象的三种生命周期控制方式分别是什么？", "a": "(1)标志值为0：只要强引用计数值为0，系统就自动释放对象；(2)OBJECT_LIFETIME_WEAK：只有强引用计数和弱引用计数都为0时才自动释放；(3)OBJECT_LIFETIME_FOREVER：系统永远不会自动释放对象，需开发人员手动释放（此时智能指针退化成普通C++指针）。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "wp类（弱指针）有哪些成员变量？与sp类有什么不同？", "a": "wp类也有成员变量m_ptr指向所引用的对象，但额外使用一个类型为weakref_type*的成员变量m_refs来维护对象的弱引用计数。其构造函数调用RefBase::createWeak增加对象的弱引用计数并返回weakref_impl对象，析构函数通过m_refs调用decWeak减少弱引用计数。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "为什么弱指针不能直接操作它所引用的对象？如何才能操作？", "a": "因为弱指针引用的对象生命周期不受弱引用计数控制，可能已无效。秘密在于wp类没有重载*和->操作符，因此不能直接操作对象。必须调用wp的成员函数promote将弱指针升级为强指针，升级成功说明对象还存在，才能正常使用。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "weakref_type::attemptIncStrong处理的第一种情况是什么？", "a": "当对象同时正被其他强指针引用（强引用计数大于0且不等于INITIAL_STRONG_VALUE）时，对象一定存在，可安全升级：通过while循环调用android_atomic_cmpxchg原子性地将强引用计数加1。用cmpxchg是因为在某些提供特殊指令的CPU体系结构上它比android_atomic_inc效率更高。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "函数android_atomic_cmpxchg的工作原理是什么？", "a": "它是一个宏，实际指向android_atomic_release_cas（compare-and-swap）：如果地址addr的内容等于参数oldvalue，则将其修改为newvalue并返回0表示成功；否则什么也不做，返回1。若失败（其他线程已修改强引用计数），则while循环重新执行加1操作。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "attemptIncStrong处理的第二种情况（对象未被任何强指针引用）下，如何判断升级是否成功？", "a": "若强引用计数等于INITIAL_STRONG_VALUE（从未被强指针引用过）：对象生命周期只受强计数控制则必然存在，可升级；受弱计数控制则调用对象的onIncStrongAttempted进一步确认是否允许强指针引用。若强引用计数小于等于0（曾被强指针引用过）：要求生命周期受弱计数影响（否则对象已释放），并需onIncStrongAttempted返回true。allow为false则先decWeak再返回失败。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "attemptIncStrong在开始时为什么要先调用incWeak？升级失败时怎么处理？", "a": "因为增加强引用计数的同时也会增加弱引用计数，所以函数开始先调用incWeak增加对象的弱引用计数；如果后面增加强引用计数失败，则在返回false之前调用decWeak把弱引用计数减回去，保持计数一致。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "在应用实例weightpointer中，TestStrongClass的预期结果是什么？", "a": "StrongClass生命周期只受强引用计数影响。赋给弱指针wpOut后强/弱计数为0/1；赋给强指针spInner后为1/2；超出spInner作用域后为0/1，此时对象被自动释放。之后试图将wpOut升级为强指针会失败（获得的强指针spOut所引用对象地址为0），因为对象已被释放。"}, {"ch": "第3章 智能指针", "ci": 2, "part": "第1篇 初识Android系统", "q": "在应用实例weightpointer中，TestWeakClass和TestForeverClass的预期结果分别是什么？", "a": "TestWeakClass：WeakClass生命周期同时受强、弱计数影响，spInner析构后强/弱计数为0/1但对象不释放，wpOut能成功升级为强指针（地址不为0），函数返回时强、弱计数都减为0，对象被释放。TestForeverClass：ForeverClass不受引用计数影响，虽然强、弱计数都减为0，但对象不会被自动释放，需要开发人员手动释放。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Android的Logger日志系统基于什么实现？日志记录保存在哪里？有什么特点？", "a": "基于内核中的Logger日志驱动程序实现，日志记录保存在内核空间中。驱动内部使用环形缓冲区保存日志，缓冲区满后新日志会覆盖旧日志。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logger日志分为哪四种类型？分别通过哪些设备文件访问？", "a": "分为main、system、radio、events四种类型，分别通过/dev/log/main、/dev/log/system、/dev/log/radio、/dev/log/events四个设备文件访问。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logger系统为什么要按类型对日志分类保存？", "a": "因为环形缓冲区中新日志会覆盖旧日志。系统级（system）日志比应用级（main）重要，分开记录可避免被覆盖；radio日志（无线设备相关）数据量大，单独记录可避免覆盖其他日志；events日志专门用于诊断系统问题，应用程序不应使用。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "类型为main、system和radio的日志记录由哪三个字段组成？各是什么类型？", "a": "由priority（日志优先级，整数）、tag（日志标签，字符串）、msg（日志内容，字符串）三个字段组成。优先级和标签可在显示日志时作过滤字段使用。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "日志优先级按照重要程度划分为哪几种？", "a": "分为VERBOSE、DEBUG、INFO、WARN、ERROR和FATAL六种。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "类型为events的日志格式与main类日志有何区别？其内容由什么组成？", "a": "events日志的tag是整数（而非字符串），msg是一块二进制数据，格式由写入者决定。内容一般由一个或多个值组成，每个值前面有一个类型描述字段：整数（int）、长整数（long）、字符串（string）、列表（list）分别用数字1、2、3、4表示。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "设备上的日志标签文件/system/etc/event-log-tags有什么作用？", "a": "用来描述events日志的整数值标签的含义及日志内容的值格式。Logcat显示events日志时，根据它把整数标签值转换为可读的字符串描述。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "/system/etc/event-log-tags文件中每一行由哪三个字段组成？", "a": "（1）tag number：日志标签值，取值0～2147483648；（2）tag name：标签对应的字符串描述，由字母、数字或下画线组成；（3）值格式描述：由值的name、data type（1～4对应int/long/string/list）、data unit（1～6对应对象数量/字节数/毫秒数/分配额/ID/百分比）组成。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logger日志驱动程序主要使用哪三个结构体？各自描述什么？", "a": "（1）logger_entry：描述一条日志记录；（2）logger_log：描述一个日志缓冲区，每种类型日志对应一个缓冲区；（3）logger_reader：描述一个正在读取某日志缓冲区日志记录的进程。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "结构体logger_entry包含哪些关键字段？一条日志记录最大多大？", "a": "len表示有效负载实际长度；__pad用于将pid对齐到4字节边界；pid和tid记录写入进程的TGID和PID；sec和nsec记录写入时间（Epoch标准基准时间）；msg为可变长的日志内容。每条日志记录最大长度为4K。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "结构体logger_log有哪些关键字段？各自的含义是什么？", "a": "buffer指向循环使用的内核缓冲区，大小由size决定；misc描述一个misc日志设备；wq是等待新日志的进程等待队列；readers记录正在读取的进程列表；mutex保护并发访问；w_off表示下一条写入位置；head表示新进程开始读取的位置。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "结构体logger_reader有哪些成员？各是什么含义？", "a": "log指向要读取的日志缓冲区结构体；list是列表项，用于连接所有读取同一种类型日志的进程；r_off表示当前进程下一条要读取的日志记录在缓冲区中的位置。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logger驱动中定义了几个日志缓冲区？分别对应哪些日志类型？大小是多少？", "a": "定义了三个：log_main（main和system类型共用，64K）、log_radio（64K）、log_events（256K）。它们通过宏DEFINE_LOGGER_DEVICE定义，参数为变量名、设备文件路径和缓冲区大小。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logger日志设备的初始化过程是怎样的？从设备号如何分配？", "a": "入口函数logger_init分别调用init_log，后者调用misc_register将三个日志设备注册到系统。从设备号设置为MISC_DYNAMIC_MINOR由系统动态分配（misc从设备号共64个，用misc_minors数组按位管理），避免静态指定导致冲突。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "驱动注册的设备名为log_main等，为什么用户看到的是/dev/log/main？", "a": "注册misc设备时内核发出uevent事件，由init进程的handle_device_event函数处理：发现misc设备名以“log_”开头时，先在/dev目录创建log目录，去掉名称前四个字符“log_”，再用新名称在/dev/log下创建设备文件。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "日志设备文件的打开函数logger_open做了哪些事情？读写模式有何不同？", "a": "先调用nonseekable_open将设备文件设置为不可随机访问（不能lseek），再通过get_log_from_minor按从设备号找到日志缓冲区log。写模式只是把log保存在file的private_data中；读模式还要创建logger_reader结构体，指定从log->head位置开始读取，也存入private_data。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "logger_read在日志缓冲区中没有新日志可读时如何处理？", "a": "在while循环中调用prepare_to_wait将等待项加入log->wq，当w_off等于r_off时说明无新日志。若设备以非阻塞模式打开则直接返回；若有信号待处理（signal_pending）也不睡眠，让进程立即返回处理信号；否则调用schedule进入睡眠，等待写入新日志后被唤醒。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数get_entry_len如何得到下一条日志记录的长度？为什么要考虑缓冲区首尾？", "a": "logger_entry的第一个成员len是__u16类型，与其起始地址相同，读取前两个字节即得有效负载长度，再加上结构体大小就是总长度。由于缓冲区循环使用，长度值的两个字节可能分别位于缓冲区尾字节和首字节，此时需分别读出再组合。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数do_read_log_to_user读取日志记录时要注意什么？读完如何更新位置？", "a": "日志记录可能同时位于缓冲区末尾和开头（地址不连续），需分两次调用copy_to_user复制到用户空间缓冲区（不能用memcpy，因用户地址可能无效）。读完后将reader的r_off加上记录长度，再用宏logger_offset调整：缓冲区大小是2的N次方，减1后按位与即可绕回缓冲区前面。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "logger_aio_write的参数iov是如何组织要写入的日志内容的？", "a": "main/system/radio类型日志分三个iovec：iov[0]为priority、iov[1]为tag、iov[2]为msg，nr_segs为3；events类型只有tag和msg两个字段，nr_segs为2。日志总长度保存在参数iocb的成员ki_left中。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "写入日志前函数fix_up_readers的作用是什么？为什么要在写入前做？", "a": "日志缓冲区循环使用，新记录会覆盖旧记录，可能覆盖某些进程的下一条读取位置（r_off）及新读者的起始位置（head）。fix_up_readers用clock_interval判断位置是否落在old与new之间，若是则用get_next_entry将其修正到下一条有效日志记录。在写入前修正是为了保证写入部分失败时不会破坏整个缓冲区内容。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "logger_aio_write写入一条日志记录分哪两步？各使用什么复制函数？最后做什么？", "a": "第一步调用do_write_log写入日志记录结构体header（内容在内核空间，用memcpy）；第二步调用do_write_log_from_user写入有效负载（内容在用户空间，必须用copy_from_user）。两者都可能分两次写（尾部+头部）。写入后更新w_off，并调用wake_up_interruptible唤醒睡眠在wq中的读取进程。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "运行时库层日志库liblog的写入函数可分为哪三类？", "a": "（1）__android_log_assert、__android_log_vprint、__android_log_print：写main类型日志；（2）__android_log_bwrite、__android_log_btwrite：写events类型日志；（3）__android_log_buf_print：可写任意类型日志。__android_log_write和__android_log_buf_write在标签以“RIL”开头或等于HTC_RIL、AT、GSM、STK、CDMA、PHONE、SMS时转为radio类型。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "liblog中函数指针write_to_log的重定向机制是怎样的？", "a": "write_to_log初始指向__write_to_log_init，第一次调用时执行初始化：打开/dev/log/main、radio、events、system四个设备文件，描述符存入全局数组log_fds。若main/radio/events都打开成功则重定向到__write_to_log_kernel（调用writev写入），否则指向空实现__write_to_log_null。若system打开失败，则log_fds[LOG_ID_SYSTEM]复用main的描述符。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "liblog写入日志时为什么把tag和msg后面的字符串结束符'\\0'也写入？", "a": "因为日志的标签和内容都是字符串，把结束符'\\0'一起写入Logger驱动后，读取日志时就可以通过字符串结束符方便地把日志记录的标签字段和内容字段解析出来。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数__android_log_bwrite和__android_log_btwrite有什么区别？", "a": "两者都写events类型日志。__android_log_bwrite写入的日志内容可以由多个值组成；__android_log_btwrite写入的内容只有一个值，并通过第二个参数type指定该值的类型，将值类型作为独立字段写入，方便读取时解析。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Android提供了哪三组C/C++日志写入宏？各写什么类型日志？定义在哪个头文件？", "a": "（1）LOGV、LOGD、LOGI、LOGW、LOGE：写main类型日志；（2）SLOGV、SLOGD、SLOGI、SLOGW、SLOGE：写system类型日志；（3）LOG_EVENT_INT、LOG_EVENT_LONG、LOG_EVENT_STRING：写events类型日志。这些宏定义在运行时库层头文件log.h中。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "宏LOG_NDEBUG和LOG_TAG的作用是什么？", "a": "LOG_NDEBUG用于区分程序版本：发布版本定义为1，调试版本定义为0；宏LOGV和SLOGV等只有在调试版本中才有效，发布版本中是空定义，从而避免发布版本输出日志。LOG_TAG是当前编译单元的默认日志标签，默认为NULL，模块可用#define自定义。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "宏LOG系列和SLOG系列展开后分别调用liblog的哪个函数？", "a": "LOG系列（LOGV/LOGD/LOGI/LOGW/LOGE）通过宏LOG展开为LOG_PRI，优先级参数加上“ANDROID_”前缀变成android_LogPriority枚举值，最终调用__android_log_print；SLOG系列最终调用__android_log_buf_print；LOG_EVENT_INT和LOG_EVENT_LONG最终调用__android_log_btwrite。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "宏LOG_EVENT_STRING目前的实现状况如何？需要写字符串或列表类型的events日志怎么办？", "a": "LOG_EVENT_STRING目前只是一个空定义，系统也没有定义写列表内容的宏。若要写入内容为字符串或列表的events日志，必须直接使用liblog提供的函数__android_log_bwrite或__android_log_btwrite。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "应用程序框架层提供了哪三个Java日志写入接口？分别写什么类型的日志？", "a": "android.util.Log写main类型、android.util.Slog写system类型、android.util.EventLog写events类型。Slog带有“@hide”标记，是只在系统内部使用的隐藏接口。它们都通过JNI方法调用liblog的函数实现写日志。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "android.util.Log的成员函数v、d、i、w、e通过什么JNI方法写日志？该JNI方法做了哪些检查？最终调用什么函数？", "a": "通过JNI方法println_native（实现在android_util_Log_println_native中）。它先检查日志内容msgObj是否为null，再检查日志类型值是否位于0到LOG_ID_MAX之间（0/1/2/3分别对应main/radio/events/system），通过检查后调用liblog的__android_log_buf_write写入日志。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "EventLog写入整数和长整数类型日志时使用什么宏和函数？", "a": "使用宏android_btWriteLog，它指向liblog的__android_log_btwrite。写整数时type参数为EVENT_TYPE_INT，写长整数时为EVENT_TYPE_LONG。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "EventLog写入字符串类型日志时，日志内容的内存布局是怎样的？", "a": "共四个字段：（1）内容类型值EVENT_TYPE_STRING；（2）字符串长度；（3）字符串内容；（4）特殊字符'\\n'作为日志结束标志。通过宏android_bWriteLog（指向__android_log_bwrite）写入。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "EventLog写入列表类型日志有哪些限制？其内存布局如何组织？", "a": "列表元素只能为整数、长整数或字符串，最多包含255个元素（超出的被忽略）。布局为：第一个字节EVENT_TYPE_LIST，第二个字节为元素个数，随后依次是各元素（类型值+值，字符串前还有长度），最后一个字节为'\\n'结束符，通过__android_log_bwrite写入。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat工具的两个核心数据结构queued_entry_t和log_device_t分别描述什么？", "a": "queued_entry_t描述日志记录队列中的一个节点：通过联合体既可把记录当缓冲区也可当logger_entry处理，next连接形成按写入时间排序的队列。log_device_t描述一个日志设备：device为设备文件名，label为标号，binary表示内容是否为二进制格式，fd为打开设备得到的文件描述符，queue保存日志记录，next连接成设备列表。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat中四个日志设备的label标号分别是什么？哪种设备的日志是二进制格式？", "a": "/dev/log/main、/dev/log/system、/dev/log/radio、/dev/log/events对应的标号分别为'm'、's'、'r'、'e'。只有events设备的日志内容是二进制格式（binary为true），其余设备均为文本格式。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat工具的日志记录队列是如何排序的？", "a": "log_device_t的成员函数enqueue每次把日志记录按写入时间插入队列的合适位置。两条记录的时间比较由函数cmp实现：先比较秒数（sec），相等再比较毫秒数（nsec），返回值大于0表示a比b晚，小于0表示a比b早。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat工具初始化（main函数）主要完成哪些工作？", "a": "（1）调用android_log_format_new创建全局输出格式/过滤器对象g_logformat（默认FORMAT_BRIEF，默认优先级ANDROID_LOG_VERBOSE）；（2）用getopt解析命令行选项d、t、b、B、f、r、n、v；（3）打开日志设备（未用b时默认打开/dev/log/main，system存在也一起打开）；（4）若打开events设备则调用android_openEventTagMap解析event-log-tags文件；（5）调用readLogLines开始读取日志。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat启动选项d、t、b、B、f、r、n、v分别是什么含义？", "a": "d：非阻塞，无日志可读时直接退出；t：只输出最新的指定条数日志；b：指定要打开的日志缓冲区（main/radio/events，默认main）；B：以二进制格式输出日志；f：指定日志输出文件；r：指定每个输出文件的最大容量；n：指定输出文件的最大个数；v：指定日志输出格式。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat未用v选项指定输出格式时，可通过什么环境变量设置？日志过滤器还可来自哪里？", "a": "输出格式可由环境变量ANDROID_PRINTF_LOG设置。过滤器方面：可用不公开选项Q读取/proc/cmdline中的过滤器；未指定Q且命令行无额外参数时，使用环境变量ANDROID_LOG_TAGS的值作为过滤器；命令行的额外参数也可作为过滤表达式。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat的日志输出过滤表达式的格式是什么？优先级字符如何对应？", "a": "格式为“<tag>[:priority]”，tag为标签字符串，priority是字符：v、d、i、w、e、f、s、*分别对应VERBOSE、DEBUG、INFO、WARN、ERROR、FATAL、SILENT、DEFAULT；字符0到7依次对应UNKNOWN到FATAL。tag为“*”表示设置全局过滤优先级。多个表达式以空格、制表符或逗号分隔，由android_log_addFilterString逐条调用android_log_addFilterRule解析。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数android_openEventTagMap解析event-log-tags文件的过程是怎样的？", "a": "创建EventTagMap结构体，打开/system/etc/event-log-tags文件，将内容映射到内存（mapAddr），然后由processFile解析：countMapLines按换行符统计行数（忽略空白行和注释行），parseMapLines把每行解析为EventTag（tagIndex为标签号，tagStr为描述字符串），最后sortTags用qsort按标签号从小到大排序，并检查是否有重复标签号。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数readLogLines如何同时监控多个日志设备并读取日志？", "a": "用select同时监控所有已打开日志设备的文件描述符（等待时间为5毫秒）。select返回大于0表示有设备可读，为每个可读设备分配queued_entry_t并read一条记录，enqueue后queued_lines加1。read出错时：errno为EINTR（被信号打断）则重新执行select循环；errno为EAGAIN（非阻塞模式）则跳出for循环。select超时返回0则输出已读取的日志。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "readLogLines中chooseFirst、printNextEntry、skipNextEntry三个函数各起什么作用？", "a": "chooseFirst比较各设备日志队列中第一条记录的写入时间，找到包含最早未输出日志的设备；printNextEntry输出该设备队列中的下一条日志；skipNextEntry将已输出的日志记录从队列中删除。三者配合实现按时间顺序合并输出多个设备的日志。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "指定了t选项（限定输出条数）时，Logcat如何处理已读取的日志？", "a": "需统计所有设备中未输出日志的条数。若select超时且未输出条数超过g_tail_lines，则丢弃最早的一部分日志；若select返回大于0且限定了条数，则删除最早的日志直到数量不大于限定值，并继续读取剩余日志，直到所有设备都无新日志可读时才输出。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "printNextEntry输出日志时分哪两种情况处理？", "a": "若全局变量g_printBinary为1（启动时用了B选项），调用printBinary，不做解析，直接用write输出原始日志记录；否则调用processBuffer，先将日志内容解析为AndroidLogEntry结构体，过滤后再以文本格式输出。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数processBuffer输出日志的流程是怎样的？", "a": "先把logger_entry中的二进制数据解析为AndroidLogEntry：文本格式日志调用android_log_processLogBuffer，events二进制日志调用android_log_processBinaryLogBuffer；然后调用android_log_shouldPrintLine根据g_logformat中的过滤器判断是否输出；若输出则调用android_log_printLogLine，并将字节数累加到g_outByteCount，超过g_logRotateSizeKBytes时调用rotateLogs切换输出文件。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数android_log_processLogBuffer如何解析main/system/radio类型日志？", "a": "优先级占1字节，为msg缓冲区的第一个字节；标签从第二个字节开始到'\\0'为止（可用strlen计算长度）；剩余字节为内容字段，其长度等于缓冲区总长减去标签长度、1字节优先级和2个'\\0'（分别属于标签和内容字段）。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "函数android_log_processBinaryLogBuffer如何解析events类型日志？", "a": "优先级统一设为ANDROID_LOG_INFO（events日志本身无优先级字段）。用get4LE取msg前4字节作为标签值tagIndex，通过android_lookupEventTag在EventTagMap的tagArray中用二分法查找对应的描述字符串（找不到则直接用标签值）；再调用android_log_printBinaryEvent解析内容（列表类型通过递归遍历），最后在messageBuf末尾补'\\0'作为字符串输出。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat的选项v支持哪些输出格式？对应的枚举值是什么？", "a": "支持brief、process、tag、thread、raw、time、threadtime、long八种，对应枚举AndroidLogPrintFormat中的FORMAT_BRIEF、FORMAT_PROCESS、FORMAT_TAG、FORMAT_THREAD、FORMAT_RAW、FORMAT_TIME、FORMAT_THREADTIME、FORMAT_LONG。例如FORMAT_BRIEF的前缀为“<priority>/<tag>(<pid>)：”，后缀为换行符。"}, {"ch": "第4章 Logger日志系统", "ci": 3, "part": "第2篇 Android专用驱动系统", "q": "Logcat的日志输出文件轮转机制是怎样的？", "a": "选项f指定输出文件名，r指定单个文件最大容量（g_logRotateSizeKBytes，默认0表示不限制），n指定文件最大个数。文件满后切换到下一个文件，命名为logfile、logfile.1、logfile.2……达到最大个数且都写满后循环使用，即擦除旧内容重新写入。切换由函数rotateLogs完成。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Android为什么没有采用Linux内核传统的进程间通信机制（管道、消息队列、共享内存等），而采用Binder？", "a": "Binder在进程间传输数据时只需执行一次复制操作，而传统方式（除共享内存外）通常需要两次复制。因此Binder不仅提高了效率，还节省了内存空间。Binder是基于OpenBinder实现的，采用CS通信方式。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder进程间通信机制包含哪四个角色？它们分别运行在用户空间还是内核空间？", "a": "四个角色：Client、Service、Service Manager和Binder驱动程序。前三者运行在用户空间，Binder驱动程序运行在内核空间。Service Manager和Binder驱动程序由系统提供，Client和Service组件由应用程序实现。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "用户空间的Client、Service和Service Manager通过什么方式访问设备文件/dev/binder与Binder驱动程序交互？", "a": "通过系统调用open、mmap和ioctl访问设备文件/dev/binder，从而间接实现进程间通信。Service Manager是Binder进程间通信机制的上下文管理者（Context Manager），同时也是一个特殊的Service组件。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_work在Binder驱动程序中的作用是什么？", "a": "用来描述待处理的工作项。成员变量entry用于将binder_work嵌入宿主结构中，成员变量type描述工作项类型，Binder驱动程序根据type判断该工作项嵌入在什么类型的宿主结构（如binder_node、binder_transaction、binder_ref_death）中。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_node（Binder实体对象）与Service组件的关系是什么？", "a": "每一个Service组件在Binder驱动程序中都对应一个Binder实体对象，用来描述它在内核中的状态。binder_node通过强引用计数和弱引用计数技术维护生命周期，成员变量proc指向宿主进程（binder_proc），ptr和cookie分别指向用户空间中Service组件内部的引用计数对象（weakref_impl）地址和Service组件本身的地址。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder实体对象的宿主进程死亡后，该实体对象保存在哪里？", "a": "保存在一个全局的hash列表中，通过binder_node的成员变量dead_node挂接。宿主进程存活时，实体对象则通过rb_node保存在宿主进程的红黑树（binder_proc的nodes）中。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_node中internal_strong_refs、local_strong_refs、local_weak_refs三个引用计数分别表示什么？", "a": "local_strong_refs和local_weak_refs是内部强/弱引用计数，相对于实体对象所在的Server进程；internal_strong_refs是外部强引用计数，表示有多少个Binder引用对象通过强引用方式引用该实体对象。外部弱引用计数由refs列表大小隐含表示，不需要额外变量。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "什么是异步事务？Binder驱动程序如何处理同一Binder实体对象的多个异步事务？", "a": "异步事务是单向的、不需要等待应答的进程间通信请求。Binder驱动程序认为异步事务优先级低于同步事务：同一时刻一个Binder实体对象至多只有一个异步事务得到处理，其余的保存在该实体对象的异步事务队列（async_todo）中串行等待，同步事务则没有此限制。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_node的成员变量min_priority和accept_fds的作用分别是什么？", "a": "min_priority表示处理来自Client进程的请求时，Server进程处理线程应具备的最小线程优先级（注册Service组件时可指定）；accept_fds表示是否允许接收包含文件描述符的通信数据。基于安全性考虑，禁止时Binder驱动程序不会在目标进程中为数据里的文件描述符打开相同文件。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_ref_death的作用是什么？其work成员有哪些取值？", "a": "描述一个Service组件的死亡接收通知，cookie保存负责接收死亡通知的对象地址。work取值有三种：BINDER_WORK_DEAD_BINDER（Service组件死亡或注册时已死亡）、BINDER_WORK_CLEAR_DEATH_NOTIFICATION（注销通知时组件未死亡）、BINDER_WORK_DEAD_BINDER_AND_CLEAR（注销通知时组件已死亡）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_ref（Binder引用对象）中成员变量desc的含义是什么？有什么重要特性？", "a": "desc是句柄值（描述符），用来在Client进程用户空间描述一个Binder引用对象。Client进程访问Service组件时只需指定句柄值，驱动程序即可通过句柄找到引用对象，再通过node找到实体对象和Service组件。句柄值在进程范围内唯一，不同进程中同一句柄值可能代表不同的Service组件。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_proc用哪两个红黑树组织进程内的Binder引用对象？关键字分别是什么？", "a": "用refs_by_desc和refs_by_node两个红黑树：refs_by_desc以Binder引用对象的句柄值desc作为关键字；refs_by_node以它所引用的Binder实体对象node的地址作为关键字。对应的binder_ref成员变量是rb_node_desc和rb_node_node。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_buffer（内核缓冲区）的数据缓冲区中，普通数据与Binder对象是如何组织的？", "a": "普通数据和Binder对象混合保存在data指向的数据缓冲区中，没有固定顺序。数据缓冲区后面有一个偏移数组，记录每个Binder对象在数据缓冲区中的位置；偏移数组大小由offsets_size描述，数据缓冲区大小由data_size描述。驱动程序据此找到Binder对象以维护实体对象和引用对象的生命周期。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder驱动程序为什么限制分配给异步事务的内核缓冲区大小？", "a": "为了保证同步事务可以优先得到内核缓冲区，从而能被快速处理。与内核缓冲区关联的是异步事务时，binder_buffer的async_transaction成员被置为1。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_proc描述什么？进程何时被创建该结构体？它保存在哪里？", "a": "binder_proc描述一个正在使用Binder进程间通信机制的进程。当进程调用open打开设备文件/dev/binder时，驱动程序为它创建binder_proc，并加入全局hash队列binder_procs（成员变量proc_node是队列节点），因此遍历该队列可知当前有多少进程在使用Binder。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_proc中buffer和vma两个成员变量分别保存什么？user_buffer_offset的作用是什么？", "a": "buffer保存内核缓冲区的内核空间虚拟地址（驱动程序内部使用），vma描述该缓冲区映射到进程的用户空间地址。两者起始地址相差一个固定值，保存在user_buffer_offset中，因此知道任一地址即可计算出另一个地址。物理页面保存在pages数组（struct page*数组）中。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_proc如何组织内核缓冲区？buffers、allocated_buffers、free_buffers分别是什么？", "a": "驱动程序将大的内核缓冲区划分为若干小块（binder_buffer），按地址从小到大保存在buffers列表中；正在使用（已分配物理页面）的小块以内核地址为关键字保存在红黑树allocated_buffers中；空闲的小块以大小为关键字保存在红黑树free_buffers中。buffer_free记录空闲缓冲区总大小。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_proc的成员变量max_threads表示线程池最大线程数吗？", "a": "不是。max_threads只是Binder驱动程序可以主动请求进程注册的线程数量上限；进程本身可以主动注册任意数目的线程。驱动程序每次主动请求时requested_threads加1，进程响应后减1并将requested_threads_started加1。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_proc的延迟工作项（deferred_work）有哪三种类型？分别对应什么操作？", "a": "（1）BINDER_DEFERRED_PUT_FILES：关闭为内核缓冲区创建的文件描述符并释放内核缓冲区；（2）BINDER_DEFERRED_FLUSH：唤醒Binder线程池中的空闲线程（由flush函数触发）；（3）BINDER_DEFERRED_RELEASE：进程关闭/dev/binder后释放binder_proc、binder_node、binder_ref等资源。这些都是耗时操作，故延迟执行。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_thread中成员变量looper有哪些状态取值？含义是什么？", "a": "BINDER_LOOPER_STATE_NEED_RETURN（注册时或flush后需马上返回用户空间）、BINDER_LOOPER_STATE_REGISTERED（驱动请求创建的线程通过BC_REGISTER_LOOPER注册）、BINDER_LOOPER_STATE_ENTERED（应用主动通过BC_ENTER_LOOPER注册）、BINDER_LOOPER_STATE_WAITING（空闲）、BINDER_LOOPER_STATE_EXITED（通过BC_EXIT_LOOPER退出）、BINDER_LOOPER_STATE_INVALID（异常状态）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_transaction描述什么？need_reply、from、to_proc、to_thread分别表示什么？", "a": "binder_transaction描述一次进程间通信过程（事务）。need_reply为1表示同步事务（需等待回复）；from指向发起事务的源线程；to_proc和to_thread分别指向负责处理该事务的目标进程和目标线程。事务会被封装成BINDER_WORK_TRANSACTION工作项加入目标todo队列。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_transaction的成员变量saved_priority的作用是什么？", "a": "Binder驱动程序在修改目标线程优先级之前，将它原来的优先级保存在saved_priority中，以便事务处理完成后恢复。目标线程的优先级设置为源线程优先级与目标Service组件要求的最小优先级二者中的较大值。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_transaction中from_parent和to_parent分别描述什么依赖关系？", "a": "from_parent描述一个事务所依赖的另一个事务（沿源线程方向遍历可发现哪些线程正在等待本事务的结果）；to_parent描述目标线程下一个需要处理的事务（事务被临时插入目标线程事务堆栈时使用，处理完可恢复原堆栈顶事务）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "IO控制命令BINDER_WRITE_READ后面跟的binder_write_read结构体中，输入数据和输出数据分别由哪些成员描述？", "a": "输入数据（用户空间传给驱动程序）由write_size、write_consumed、write_buffer描述；输出数据（驱动程序返回给用户空间的通信结果）由read_size、read_consumed、read_buffer描述。write_buffer中用命令协议（BinderDriverCommandProtocol），read_buffer中用返回协议（BinderDriverReturnProtocol），每个元素由协议代码+通信数据组成。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "命令协议BC_TRANSACTION和BC_REPLY的作用是什么？", "a": "BC_TRANSACTION用于源进程请求Binder驱动程序将通信数据传递到目标进程；BC_REPLY用于目标进程处理完成后请求驱动程序将结果数据传回源进程。两者后面跟的通信数据都用结构体binder_transaction_data描述。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "命令协议BC_INCREFS、BC_ACQUIRE、BC_RELEASE、BC_DECREFS分别起什么作用？", "a": "它们后面的通信数据是一个Binder引用对象的句柄值：BC_INCREFS和BC_DECREFS分别增加和减少引用对象的弱引用计数；BC_ACQUIRE和BC_RELEASE分别增加和减少引用对象的强引用计数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "返回协议BR_TRANSACTION和BR_REPLY分别用于什么场景？", "a": "Client进程向Server进程发出通信请求时，驱动程序用BR_TRANSACTION通知Server进程处理该请求（内容为binder_transaction_data）；Server进程处理完成后，驱动程序用BR_REPLY将结果数据返回给Client进程。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "返回协议BR_SPAWN_LOOPER什么时候被驱动程序发送？BR_DEAD_REPLY和BR_FAILED_REPLY分别表示什么？", "a": "驱动程序发现进程没有足够空闲Binder线程处理请求时，发送BR_SPAWN_LOOPER通知进程增加新线程到线程池。BR_DEAD_REPLY表示目标进程或目标线程已死亡；BR_FAILED_REPLY表示驱动程序处理BC_TRANSACTION时发生异常。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "结构体binder_transaction_data中target联合体的两种含义是什么？cookie何时有意义？", "a": "若描述目标Binder实体对象，target.ptr指向该实体对象对应Service组件内部弱引用计数对象（weakref_impl）的地址；若描述目标Binder引用对象，target.handle是该引用对象的句柄值。cookie仅在驱动程序用BR_TRANSACTION通知Server进程时才有实际意义，指向目标Service组件的地址。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_transaction_data的flags中TF_ONE_WAY、TF_STATUS_CODE、TF_ACCEPT_FDS三个标志分别表示什么？", "a": "TF_ONE_WAY为1表示异步（单向）进程间通信；TF_STATUS_CODE为1表示data描述的数据缓冲区内容是一个4字节状态码；TF_ACCEPT_FDS为0表示源进程不允许目标进程返回的结果数据中包含文件描述符。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "flat_binder_object结构体可以描述哪三种对象？type如何区分？", "a": "可描述Binder实体对象、Binder引用对象和文件描述符。BINDER_TYPE_BINDER/BINDER_TYPE_WEAK_BINDER描述强/弱Binder实体对象；BINDER_TYPE_HANDLE/BINDER_TYPE_WEAK_HANDLE描述强/弱Binder引用对象；BINDER_TYPE_FD描述文件描述符。描述实体对象时用binder+cookie，描述引用对象时用handle。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder设备的初始化函数binder_init做了哪些事情？", "a": "在/proc/binder/proc目录下创建目录（每个使用Binder的进程对应一个以PID命名的文件），在/proc/binder目录下创建state、stats、transactions、transaction_log、failed_transaction_log五个文件用于读取驱动程序运行状况；并调用misc_register创建misc类型字符设备/dev/binder，其操作方法列表由binder_fops指定（open/mmap/ioctl分别对应binder_open、binder_mmap、binder_ioctl）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_open的主要工作是什么？", "a": "（1）为进程创建并初始化binder_proc结构体（用current、task_nice(current)、进程组ID初始化tsk、default_priority、pid）；（2）将它加入全局hash队列binder_procs；（3）保存在打开文件结构体filp的private_data中，以便后续mmap/ioctl时通过private_data取回；（4）在/proc/binder/proc下创建以进程ID命名的只读文件。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "进程mmap设备文件/dev/binder的真正目的是什么？最多可映射多大？", "a": "目的不是关心设备内容，而是请求Binder驱动程序为进程分配内核缓冲区以便传输通信数据。驱动程序最多为进程分配4M内核缓冲区（超过4M会被截断）；映射的用户地址空间必须只读不可写（FORBIDDEN_MMAP_FLAGS），并设置VM_DONTCOPY、清除VM_MAYWRITE，且不允许重复mmap。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Linux内核中vm_area_struct和vm_struct分别描述什么地址空间？", "a": "vm_area_struct描述进程的用户地址空间（0～3G）；vm_struct描述进程的内核地址空间（3G～4G中的(3G+896M+8M)～4G部分）。其中3G～(3G+896M)的896M空间线性映射物理内存前896M，(3G+896M)～(3G+896M+8M)的8M空间是检测非法指针的安全保护区。两者描述的虚拟地址空间连续，但对应物理页面可不连续。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_mmap为进程分配内核缓冲区的过程是怎样的？", "a": "先调用get_vm_area在内核地址空间分配一段空间（起始地址与大小存入proc->buffer和proc->buffer_size），计算并保存user_buffer_offset；然后创建pages物理页面指针数组，调用binder_update_page_range分配第一个物理页面；用binder_buffer描述它并加入buffers列表和空闲红黑树free_buffers；最后将最大异步事务缓冲区设为总大小的一半。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_update_page_range的作用是什么？分配物理页面时映射内核地址空间为什么映射两个页面大小？", "a": "为指定的内核地址空间start～end分配（allocate=1）或释放（allocate=0）物理页面，并分别映射到内核地址空间和用户地址空间（用户地址=内核地址+user_buffer_offset）。映射内核空间时映射两个页面是因为内核规定(3G+896M+8M)～4G范围内的地址空间后面必须保留一页安全保护区检测非法指针。释放时用zap_page_range、unmap_kernel_range解除映射，再__free_page释放。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "一个binder_buffer描述的内核缓冲区大小指的是什么？如何计算位于列表末尾的缓冲区大小？", "a": "大小指其有效数据块（保存事务数据部分）的大小，不含描述它的元数据块（binder_buffer结构体本身）。若是buffers列表最后一个元素，大小等于为进程分配的整个内核地址空间末尾地址减去其data成员地址；否则等于下一个缓冲区起始地址减去它的data地址。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder驱动程序的内核缓冲区管理采用什么总体策略？", "a": "按需分配物理页面：开始只为进程分配一个物理页面，不够用时再分配，但最多4M。物理页面以页面（4K）为单位分配，进程一次使用的内存却不是页面大小，因此驱动程序维护一个内核缓冲区池：空闲缓冲区在free_buffers红黑树（按大小组织），已分配的缓冲区在allocated_buffers红黑树（按内核地址组织）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_alloc_buf分配内核缓冲区时使用什么算法？找不到大小刚合适的空闲缓冲区时怎么处理？", "a": "使用最佳适配算法在空闲缓冲区红黑树free_buffers中查找最合适的空闲缓冲区。若只找到较大的缓冲区，就进行裁剪：分配所需部分，剩余部分（大于4字节）封装成新的空闲缓冲区放回free_buffers；若剩余部分小于等于4字节则全部分配。异步事务还需检查大小（加上binder_buffer结构体大小）不超过free_async_space。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_alloc_buf中为什么有时要将end_page_addr修正为has_page_addr？", "a": "end_page_addr是要分配缓冲区结束地址对齐到页面边界后的地址，has_page_addr是原空闲缓冲区结束地址所在页面的起始地址。当二者在同一段且end_page_addr大于has_page_addr时，必须将end_page_addr修正为has_page_addr，因为该页面上肯定已分配物理页面，否则会造成无效访问。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "进程如何通知驱动程序释放内核缓冲区？驱动程序的binder_free_buf做了哪些事？", "a": "进程处理完BR_TRANSACTION或BR_REPLY后，用命令协议BC_FREE_BUFFER通知驱动程序释放。binder_free_buf计算缓冲区大小；若是异步事务缓冲区则归还free_async_space；调用binder_update_page_range释放物理页面；从allocated_buffers红黑树删除；与前后相邻的空闲缓冲区合并；最后加入free_buffers红黑树。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "从内核缓冲区列表删除一个空闲缓冲区时，释放binder_buffer结构体所占物理页面为什么复杂？", "a": "因为描述缓冲区的binder_buffer结构体可能横跨两个虚拟地址页面。驱动程序用buffer_start_page和buffer_end_page计算它横跨的第一、第二个页面地址，并根据与前一个（prev）和后一个（next）缓冲区的页面重叠关系调整free_page_start和free_page_end，只有没有其他结构体共用的页面才调用binder_update_page_range释放物理页面。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_buffer_lookup的作用是什么？如何根据用户空间地址找到内核缓冲区？", "a": "根据进程提供的缓冲区数据区用户空间地址（指向binder_buffer的data成员）查找对应的内核缓冲区。方法是用user_ptr减去data成员的偏移得到binder_buffer的用户地址，再减去user_buffer_offset得到内核地址，最后在allocated_buffers红黑树（以内核地址为关键字）中验证并返回该binder_buffer。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder库中模板类BnInterface和BpInterface分别描述什么？与驱动程序中哪种对象对应？", "a": "BnInterface描述Service组件侧的Binder本地对象，BpInterface描述Client组件侧的Binder代理对象。它们分别对应Binder驱动程序中的Binder实体对象（binder_node）和Binder引用对象（binder_ref）。模板参数INTERFACE是自定义的Service组件接口。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "BBinder类的成员函数transact和onTransact的分工是什么？", "a": "当Binder代理对象通过驱动程序向Binder本地对象发出通信请求时，驱动程序调用BBinder的transact处理请求；onTransact由Binder本地对象类（BBinder子类）实现，负责分发与业务相关的请求给Service组件类（Bn类的子类）处理，如BnFregService把请求分发给子类FregService。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "BpRefBase类中成员变量mRemote指向什么？BpBinder如何借助它实现通信？", "a": "mRemote指向一个BpBinder对象，可通过remote()获取。BpBinder的成员变量mHandle保存Client组件的句柄值，其transact函数将mHandle和通信数据发送给驱动程序，驱动程序据此找到引用对象，再找到实体对象，最后将数据发送给对应Service组件。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "IPCThreadState类和ProcessState类各自的职责是什么？", "a": "每个Binder线程内部都有一个IPCThreadState对象（通过静态函数self获取），其transact/talkWithDriver函数负责与驱动程序收发协议；每个进程内部有一个唯一的ProcessState对象（单例），负责初始化Binder设备：open打开/dev/binder、mmap映射分配内核缓冲区（默认1016KB，存于mVMStart），使线程池中每个线程都能借此与驱动程序建立连接。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "使用Binder库实现进程间通信需要实现哪四个类？", "a": "（1）服务接口IXXXXXX（如IFregService），Service和Client组件都要实现；（2）Binder本地对象类BnXXXXXX（继承BnInterface）；（3）Binder代理对象类BpXXXXXX（继承BpInterface）；（4）Service组件类XXXXXX（继承Bn类）。例如FregService实例中的IFregService、BnFregService、BpFregService和FregService。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "宏DECLARE_META_INTERFACE和IMPLEMENT_META_INTERFACE为接口类提供了什么？", "a": "DECLARE_META_INTERFACE声明静态成员变量descriptor（接口描述符）、成员函数getInterfaceDescriptor和asInterface（将IBinder对象转换为接口）；IMPLEMENT_META_INTERFACE实现它们：设置descriptor值，asInterface对本地对象直接调用queryLocalInterface返回接口，对BpBinder代理对象则将其封装成Bp类代理对象返回。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "FregServer进程main函数启动Service组件的三步是什么？", "a": "（1）调用FregService的静态成员函数instantiate，通过defaultServiceManager获得Service Manager代理对象并调用addService将FregService注册到Service Manager；（2）调用ProcessState的startThreadPool启动Binder线程池；（3）调用主线程IPCThreadState的joinThreadPool将主线程加入Binder线程池等待处理Client请求。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder进程间通信涉及哪四种对象？它们的依赖链是怎样的？", "a": "四种对象：Binder驱动程序中的Binder实体对象（binder_node）和Binder引用对象（binder_ref），Binder库中的Binder本地对象（BBinder）和Binder代理对象（BpBinder）。依赖链：Binder代理对象依赖引用对象，引用对象依赖实体对象，实体对象依赖本地对象。因此必须用引用计数保证不销毁还被依赖的对象。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder驱动程序通过哪四个返回协议维护Binder本地对象（BBinder）的引用计数？", "a": "BR_INCREFS和BR_ACQUIRE用于请求Server进程增加Binder本地对象的弱/强引用计数；BR_DECREFS和BR_RELEASE用于请求减少弱/强引用计数。相关实现在驱动程序函数binder_thread_read中，Server进程侧在IPCThreadState的executeCommand中处理。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Server进程处理BR_RELEASE和BR_DECREFS协议时为什么不立即执行？", "a": "因为减少引用计数不紧急，至多延迟对象销毁，所以被缓存在IPCThreadState的mPendingStrongDerefs和mPendingWeakDerefs中，等下次通过BINDER_WRITE_READ进入驱动程序前再处理；而增加引用计数（BR_ACQUIRE、BR_INCREFS）必须马上处理，否则对象可能提前销毁。这样可以让Server进程优先处理更重要的事情。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_inc_node的四个参数分别表示什么？", "a": "node是要操作的Binder实体对象；strong为1表示操作强引用计数，为0表示弱引用计数；internal区分内部计数（local_strong_refs/local_weak_refs，由驱动程序自身使用）和外部计数（internal_strong_refs，由Client进程的引用对象引起）；target_list指向目标进程或线程的todo队列，不为NULL时表示增加计数后要相应增加对应Binder本地对象的引用计数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "一个Binder实体对象的外部强引用计数internal_strong_refs与对应Binder本地对象的引用计数是什么关系？这样设计有什么好处？", "a": "是多对一关系：多个Binder引用对象的强引用计数变化最终只对应实体对象增加一次本地对象的强引用计数和一次弱引用计数（如3个强引用为1的引用对象使internal_strong_refs=3，但本地对象强引用计数只加1）。好处是减少驱动程序与Server进程之间BR_INCREFS、BR_ACQUIRE、BR_DECREFS、BR_RELEASE协议的交互次数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_dec_node减少引用计数后何时会销毁Binder实体对象？", "a": "当实体对象的强、弱引用计数均变为0，且has_strong_ref和has_weak_ref均为0（即不再需要本地对象增加计数）时销毁：若宿主进程proc为NULL，则从全局死亡实体对象hash列表中删除；否则从宿主进程的nodes红黑树中删除，最后调用kfree释放。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程通过哪四个命令协议维护Binder引用对象的引用计数？句柄值为0有什么特殊性？", "a": "BC_ACQUIRE/BC_RELEASE增加/减少强引用计数，BC_INCREFS/BC_DECREFS增加/减少弱引用计数，相关实现在驱动程序函数binder_thread_write中。句柄值0特殊：它描述与Service Manager关联的引用对象，允许先有句柄值再有引用对象（通过binder_get_ref_for_node创建）；其他句柄必须先创建引用对象再分配句柄。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_delete_ref销毁Binder引用对象时做了哪些清理工作？", "a": "（1）从宿主进程的refs_by_desc和refs_by_node两个红黑树中移除；（2）从所引用实体对象的refs引用列表中移除；（3）若被强行销毁（强引用计数仍大于0）则调用binder_dec_node减少实体对象的外部强引用计数；（4）调用binder_dec_node检查是否需减少对应Binder本地对象的弱引用计数；（5）若注册了死亡接收通知则删除销毁；（6）kfree释放内存。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder代理对象（BpBinder）的生命周期如何受Client进程和驱动程序共同维护？", "a": "Client进程内其他对象通过智能指针（强/弱指针）引用BpBinder；同时Client进程通过BC_ACQUIRE、BC_INCREFS、BC_RELEASE、BC_DECREFS四个协议维护驱动程序中对应引用对象的计数。BpBinder创建时（构造函数）通过incWeakHandle增加引用对象弱引用计数；第一次被强指针引用时（onFirstRef）通过incStrongHandle增加强引用计数；不再被强指针引用时（onLastStrongRef）通过decStrongHandle减少；销毁时通过decWeakHandle减少。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程如何用handle_entry列表管理Binder代理对象？为什么？", "a": "Client进程内部维护一个handle_entry类型的代理对象列表（ProcessState的mHandleToObject），以句柄值作为关键字（索引）。收到句柄值时先查找对应handle_entry，已存在则复用其中的BpBinder对象，否则创建新的并保存。好处是避免为同一个引用对象创建重复的代理对象，因为每个代理对象创建时都会增加引用对象的引用计数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder代理对象、Binder引用对象和Binder实体对象的引用计数各是什么多对一关系？", "a": "Binder代理对象与引用对象是多对一（多个代理对象可共享一个引用对象，引用对象计数只加1）；Binder引用对象与实体对象的外部强引用计数是多对一（多个引用对象强计数之和大于实体对象的internal_strong_refs）；Binder实体对象与Binder本地对象的引用计数也是多对一。目的都是减少内核与用户空间之间的协议交互。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder死亡通知机制解决什么问题？基本流程是什么？", "a": "解决Client进程和Server进程意外崩溃导致Binder本地对象死亡、引用它的代理对象失效的问题。流程：Client进程的Binder代理对象先将死亡通知接收者（继承DeathRecipient并重写binderDied）通过linkToDeath注册到驱动程序；驱动程序监控到Binder本地对象死亡后向代理对象发送死亡通知；不需要时可通过unlinkToDeath注销。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder代理对象的linkToDeath函数内部做了什么？重复注册会怎样？", "a": "它将死亡通知接收者封装成Obituary对象加入内部讣告列表mObituaries；第一次注册时调用IPCThreadState的requestDeathNotification，通过BC_REQUEST_DEATH_NOTIFICATION协议（参数为代理对象句柄值和地址值）向驱动程序注册，并用flushCommands立即执行。若成员变量mObitsSent为1（已收到过死亡通知），则直接返回DEAD_OBJECT。驱动程序不允许为同一引用对象重复注册。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder驱动程序如何感知Server进程退出并发现死亡的Binder本地对象？", "a": "驱动程序将/dev/binder的释放操作方法设为binder_release。Server进程正常退出调用close或异常退出时由内核关闭设备，都会触发binder_release；它通过binder_defer_work添加BINDER_DEFERRED_RELEASE延迟操作，最终由binder_deferred_release遍历该进程所有实体对象的引用列表，对注册过死亡通知（death不为NULL）的引用对象，向对应Client进程的todo队列添加BINDER_WORK_DEAD_BINDER工作项并唤醒其Binder线程。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序如何判断一个Binder实体对象所对应的Binder本地对象已死亡？", "a": "检查该实体对象的成员变量proc（宿主进程）是否为NULL。宿主进程结构体为NULL说明其所在进程已不存在，即Binder本地对象已死亡；此时实体对象会通过dead_node保存在全局死亡实体对象列表中。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程收到BR_DEAD_BINDER协议后如何处理？sendObituary做了什么？", "a": "IPCThreadState的executeCommand处理BR_DEAD_BINDER：根据cookie找到对应的Binder代理对象，调用其sendObituary，最后用BC_DEAD_BINDER_DONE通知驱动程序已处理完。sendObituary将mObitsSent置1，注销之前注册的死亡接收通知，然后遍历讣告列表mObituaries，通过reportOneDeath将Obituary中的弱指针recipient升级为强指针并调用死亡通知接收者的binderDied函数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程注销死亡接收通知时，驱动程序返回哪两种结果？何时合并为一个工作项？", "a": "若对应Service组件未死亡，返回BINDER_WORK_CLEAR_DEATH_NOTIFICATION（告知注销成功）；若组件已死亡（对应工作项还在队列中），返回BINDER_WORK_DEAD_BINDER_AND_CLEAR（将死亡通知发送与注销结果合并），这样可减少内核与用户空间的交互。进程处理BINDER_WORK_DEAD_BINDER类工作项后其所在队列由delivered_death记录，处理完用BC_DEAD_BINDER_DONE确认。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager由谁启动？其init.rc启动脚本有什么特点？", "a": "由init进程在系统启动时启动，以service形式运行/system/bin/servicemanager，进程名servicemanager；以user关键字指定system用户身份运行；critical关键字表明它是关键服务（退出会被重启，但4分钟内退出超过4次则系统重启进入恢复模式）；onrestart表示它重启时需重启zygote和media进程。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager启动的三个步骤是什么？", "a": "（1）调用binder_open打开设备文件/dev/binder并mmap映射到本进程地址空间（请求128K内核缓冲区），结果保存在binder_state结构体（fd、mapsize、mapped）；（2）调用binder_become_context_manager通过IO控制命令BINDER_SET_CONTEXT_MGR将自己注册为Binder上下文管理者；（3）调用binder_loop循环等待和处理Client进程的通信请求（处理函数为svcmgr_handler）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager对应的Binder本地对象有什么特殊之处？", "a": "它是一个虚拟的Binder本地对象：地址值等于0（宏BINDER_SERVICE_MANAGER，svcmgr_handle），在驱动程序中引用它的Binder引用对象的句柄值也等于0。驱动程序为Service Manager创建的实体对象binder_context_mgr_node的ptr和cookie均为NULL，且其local_weak_refs和local_strong_refs被初始化为1、has_strong_ref和has_weak_ref置为1，因为Service Manager在系统运行期间始终存在，驱动程序不需要真正请求它增减引用计数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_become_context_manager和binder_new_node在注册上下文管理者时做了什么检查和初始化？", "a": "binder_become_context_manager用ioctl发送BINDER_SET_CONTEXT_MGR（参数为0）。驱动程序binder_ioctl中先通过binder_get_thread获取/创建当前线程的binder_thread；检查binder_context_mgr_node是否已存在（不允许重复注册），检查binder_context_mgr_uid（同一进程可重复注册，如上次创建实体失败的情况）；再调用binder_new_node创建实体对象（以ptr为关键字查重），初始化引用计数防止被释放。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数binder_get_thread如何工作？新建线程的初始状态是什么？", "a": "它以当前线程PID为关键字，在宿主进程binder_proc的threads红黑树中查找是否已存在对应binder_thread；存在则直接返回，不存在则创建并初始化后加入红黑树。新建线程状态初始化为BINDER_LOOPER_STATE_NEED_RETURN，表示完成当前操作后要马上返回用户空间做准备工作，不能处理通信请求。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager主线程如何注册为Binder线程？binder_loop的循环逻辑是什么？", "a": "主线程主动注册，因此在binder_loop开头将BC_ENTER_LOOPER协议写入readbuf，通过binder_write（ioctl的BINDER_WRITE_READ，read_buffer长度为0）发送，驱动程序在binder_thread_write中将线程状态置为BINDER_LOOPER_STATE_ENTERED。然后for循环不断以write_size=0、read_size=128调用BINDER_WRITE_READ进入驱动程序：有请求则由binder_parse处理（调用svcmgr_handler），无请求则睡眠等待。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_thread_read中wait_for_proc_work何时为1？其含义是什么？", "a": "当线程的事务堆栈transaction_stack为NULL且自己的todo队列为空时为1，表示线程接下来检查所属进程的todo队列（进程级工作项），否则优先处理自己的事务或工作项。此时线程状态置为BINDER_LOOPER_STATE_WAITING，进程空闲线程数ready_threads加1，并可能将线程优先级设置为所属进程的优先级。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序何时向进程发送BR_SPAWN_LOOPER请求增加线程？需满足哪四个条件？", "a": "在binder_thread_read返回前检查：（1）进程空闲线程数ready_threads等于0；（2）当前没有正在请求该进程增加线程（requested_threads=0）；（3）已请求创建的线程数requested_threads_started小于max_threads；（4）当前线程是已注册的Binder线程（状态为REGISTERED或ENTERED），因为它才会处理BR_SPAWN_LOOPER协议。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_write_read的输入/输出缓冲区长度分别大于0时，驱动程序分别调用什么函数处理？", "a": "输入缓冲区（write_buffer）长度大于0时调用binder_thread_write处理其中的命令协议；输出缓冲区（read_buffer）长度大于0时调用binder_thread_read将待处理工作项对应的返回协议写入输出缓冲区返回给进程。binder_ioctl是统一入口，先用binder_get_thread获取线程结构体。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder库的defaultServiceManager函数如何创建Service Manager代理对象？体现了什么设计模式？", "a": "它检查全局强指针gDefaultServiceManager（配互斥锁gDefaultServiceManagerLock保证唯一），为空则三步创建：（1）ProcessState::self获取进程唯一ProcessState对象；（2）调用其getContextObject创建句柄值为0的Binder代理对象（BpBinder）；（3）调用interface_cast<IServiceManager>（内部是IServiceManager::asInterface）将其封装成BpServiceManager对象并保存。这是单例设计模式的经典实现。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "ProcessState构造函数中open_driver做了什么？BINDER_VM_SIZE是多少？", "a": "open_driver调用open打开/dev/binder；用BINDER_VERSION命令检查驱动版本；用BINDER_SET_MAX_THREADS通知驱动程序最多可请求进程创建15个Binder线程。之后构造函数调用mmap映射设备文件，映射大小为BINDER_VM_SIZE，即1016KB的内核缓冲区，起始地址存于mVMStart。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "ProcessState的getStrongProxyForHandle如何根据句柄获取或创建Binder代理对象？", "a": "它先通过lookupHandleLocked在代理对象列表mHandleToObject中按句柄值（作为索引）获取handle_entry结构体；若其binder成员为NULL则创建新BpBinder对象保存其中；若已存在则调用其弱引用计数对象的attemptIncWeak尝试增加弱引用计数验证其有效性，成功则返回已有对象（返回前减回计数），失败（对象已销毁）则重新创建。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程与Server进程的一次进程间通信过程可分为哪五个步骤？", "a": "（1）Client将通信数据封装成Parcel对象；（2）Client发送BC_TRANSACTION，驱动程序找到目标进程后向Client返回BR_TRANSACTION_COMPLETE（表示请求已接受），Client再进入驱动程序等待结果；（3）驱动程序同时向Server进程发送BR_TRANSACTION请求处理；（4）Server处理完后发送BC_REPLY，驱动程序向Server返回BR_TRANSACTION_COMPLETE；（5）驱动程序同时向Client发送BR_REPLY返回通信结果。BR_TRANSACTION_COMPLETE的意义是让Client/Server有机会返回用户空间做其他事情，增加并发处理能力。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder进程间通信请求头由什么组成？writeInterfaceToken写入哪些内容？", "a": "由两部分组成：一个整数（Strict Mode Policy）和一个字符串（所请求服务的接口描述符）。Strict Mode Policy用于线程违规策略检查，Server线程违反时警告由STRICT_MODE_PENALTY_GATHER收集后统一发送给Client线程。Server端用宏CHECK_INTERFACE验证描述符是否与自己实现的接口一致，不一致则认为是非法请求。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Parcel类内部如何组织数据？mData和mObjects各存什么？", "a": "Parcel内部有两个缓冲区：mData是数据缓冲区，内容可包含整数、字符串或Binder对象（flat_binder_object结构体）；mObjects是偏移数组，保存数据缓冲区中所有Binder对象的位置。Binder驱动程序通过偏移数组找到通信数据中的Binder对象，以便对它们进行特殊处理（维护引用计数等）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Parcel的writeStrongBinder如何将一个Service组件封装成flat_binder_object？", "a": "通过flatten_binder：对Binder本地对象（localBinder返回非NULL），将flat_binder_object类型设为BINDER_TYPE_BINDER，cookie设为Binder本地对象地址，binder设为其内部弱引用计数对象地址；flags设为0x7f|FLAT_BINDER_FLAG_ACCEPTS_FDS（最低线程优先级0x7f，允许接收文件描述符）。对BpBinder则设为BINDER_TYPE_HANDLE并用句柄值。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "IPCThreadState的writeTransactionData和waitForResponse的职责分别是什么？", "a": "writeTransactionData将通信数据（Parcel data）写入binder_transaction_data结构体tr（设置target.handle、code、flags），连同命令协议号（BC_TRANSACTION）一起写入命令协议缓冲区mOut。waitForResponse通过while循环不断调用talkWithDriver与驱动程序交互：发送mOut中的命令协议，解析mIn中的返回协议（如BR_TRANSACTION_COMPLETE、BR_REPLY）并做相应处理，直到通信完成。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "IPCThreadState的talkWithDriver如何组织BINDER_WRITE_READ交互？", "a": "它用binder_write_read结构体指定输入/输出缓冲区：命令协议缓冲区mOut对应write_buffer（发送给驱动程序的命令协议），返回协议缓冲区mIn对应read_buffer（接收驱动程序的返回协议）。通过while循环调用ioctl(BINDER_WRITE_READ)交互，返回后将已处理命令从mOut移除、将返回协议保存到mIn。若mOut和mIn都为空（write_size和read_size均为0）则不进入驱动程序。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序处理BC_TRANSACTION时，如何根据binder_transaction_data中的目标找到目标实体对象？", "a": "若target.handle（目标引用对象句柄值）等于0，则直接将目标实体对象指向引用Service Manager的binder_context_mgr_node；否则先调用binder_get_ref根据句柄值找到引用对象，再通过其node成员找到目标实体对象，进而通过实体对象的proc找到目标进程。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序分发事务时如何在目标进程中挑选最优的目标线程？", "a": "对于同步请求（TF_ONE_WAY=0），驱动程序沿正在等待其他事务结果的空闲线程查找：检查目标进程中处于等待状态（睡眠在自己wait队列中）的线程的事务堆栈transaction_stack，沿from_parent遍历，若发现某个待完成事务的源线程属于本进程（即该线程正在等待本次请求的结果），就选择该线程作为目标线程，让它顺便处理本事务，提高并发性。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_transaction处理BC_TRANSACTION时创建的两个工作项t和tcomplete分别起什么作用？", "a": "binder_transaction结构体t被封装成BINDER_WORK_TRANSACTION工作项加入目标进程或目标线程的todo队列（唤醒目标处理通信请求）；binder_work结构体tcomplete被封装成BINDER_WORK_TRANSACTION_COMPLETE工作项加入源线程的todo队列（源线程返回用户空间前处理它，对应驱动程序发送BR_TRANSACTION_COMPLETE协议）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_transaction如何处理通信数据中的Binder对象（如注册Service时的flat_binder_object）？", "a": "遍历内核缓冲区中的偏移数组处理每个Binder对象。第一次遇到BINDER_TYPE_BINDER类型对象（Service本地组件）时：调用binder_new_node在源进程创建实体对象；调用binder_get_ref_for_node在目标进程创建引用它的引用对象并分配句柄值（从1开始找最小未使用值，Service Manager的固定为0）；将flat_binder_object类型改为BINDER_TYPE_HANDLE并填入句柄；调用binder_inc_ref增加引用对象计数。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "异步事务在binder_transaction中如何入队？与同步事务有何不同？", "a": "同步事务设置need_reply=1并将事务压入源线程的transaction_stack。异步事务若目标实体对象正在处理异步事务（has_async_transaction=1），则事务被封装成工作项加入该实体对象的async_todo异步事务队列（target_wait为NULL，不唤醒目标）；否则加入目标进程/线程todo队列并置has_async_transaction=1。这保证同一实体对象的异步事务串行执行，同步事务优先。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_thread_read处理BINDER_WORK_TRANSACTION工作项并发送BR_TRANSACTION时做了哪些事？", "a": "取出工作项对应的binder_transaction结构体t；将目标实体对象信息复制到binder_transaction_data；调整目标线程优先级（先保存到saved_priority，取源线程优先级与实体对象min_priority的较大者）；设置sender_pid/sender_euid；关键是数据缓冲区并不真正复制——由于内核缓冲区同时映射到内核和用户空间，只需将tr中的地址加上user_buffer_offset换算为用户空间地址；最后发送BR_TRANSACTION协议，将t压入目标线程事务堆栈（同步时）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Binder驱动程序为进程分配的内核缓冲区为什么能减少一次数据复制？", "a": "该缓冲区的物理页面同时映射到进程的内核地址空间和用户地址空间（地址相差user_buffer_offset）。数据从源进程用户空间复制到目标进程的内核缓冲区后，驱动程序只需将缓冲区的用户空间地址告知目标进程，目标进程即可直接访问数据，无需再从内核空间复制到用户空间。因此Binder进程间传输数据只需一次复制。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager的svcmgr_handler如何处理ADD_SERVICE_TRANSACTION请求？", "a": "（1）检查目标Binder本地对象是否为svcmgr_handle（虚拟对象，地址0）；（2）验证通信请求头中的接口描述符是否等于svcmgr_id；（3）取出要注册的服务名称，通过bio_get_ref取得引用该Service组件的引用对象句柄值；（4）调用do_add_service注册：先用svc_can_register做权限检查（数组allowed定义uid与服务名对应关系，uid为0或AID_SYSTEM的进程不受限），再检查名称是否已被使用，最后创建svcinfo结构体加入全局列表svclist；（5）调用binder_acquire增加引用对象计数、binder_link_to_death注册死亡通知。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager中已注册的Service组件用什么结构描述？保存在哪里？", "a": "用svcinfo结构体描述，保存在全局队列svclist中。svcinfo成员：next指向下一个节点，ptr是引用该Service组件的引用对象句柄值，name和len是服务名称及长度，death指向binder_death结构体（描述死亡接收通知，func是组件死亡时的回调函数）。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Service Manager处理完请求后，binder_send_reply如何将结果返回给驱动程序？", "a": "它构造一个包含BC_FREE_BUFFER和BC_REPLY两个命令协议的缓冲区，通过binder_write（ioctl的BINDER_WRITE_READ，read_buffer为0）发送。BC_FREE_BUFFER带要释放的内核缓冲区用户空间地址；BC_REPLY带binder_txn（binder_transaction_data）：若status非0（出错）则返回错误码，否则带上binder_io结构体reply中的结果数据。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序处理BC_FREE_BUFFER命令协议时做了哪些事？", "a": "（1）用binder_buffer_lookup根据用户空间地址找到内核缓冲区，检查allow_user_free为1；（2）清空buffer与transaction的关联；（3）若是异步事务缓冲区，处理目标实体对象的async_todo队列：队列为空则置has_async_transaction=0，否则将下一个异步事务移到目标线程todo队列（保证异步事务串行）；（4）调用binder_transaction_buffer_release减少缓冲区中Binder对象及target_node的引用计数；（5）调用binder_free_buf释放缓冲区。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序处理BC_REPLY时如何找到应返回结果的目标线程？binder_pop_transaction做什么？", "a": "从当前线程（Server端处理线程）的transaction_stack顶取出binder_transaction结构体in_reply_to，其成员from指向之前发起请求的源线程即为目标线程；同时调用binder_set_nice恢复当前线程原优先级（saved_priority），并通过to_parent将下一个待处理事务放回堆栈顶。binder_pop_transaction验证目标事务位于目标线程堆栈顶且由该线程发起，然后将堆栈中下一个事务移到顶端并释放该事务结构体内存。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "binder_thread_read发送BR_REPLY与BR_TRANSACTION有什么区别？", "a": "返回通信结果时内核缓冲区的target_node为NULL（不需要指定目标实体对象），据此可知应发送BR_REPLY。区别：发送BR_TRANSACTION后同步事务要压入目标线程事务堆栈；发送BR_REPLY后驱动程序可立即释放binder_transaction结构体（不需要等待回复），但其内核缓冲区不能释放，要等Client进程处理完并用BC_FREE_BUFFER释放。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程收到BR_REPLY后如何处理内核缓冲区的释放？", "a": "IPCThreadState的waitForResponse将结果数据通过Parcel的ipcSetDataReference封装到reply对象中，该函数将Parcel的数据缓冲区指向驱动程序分配的内核缓冲区（用户空间地址），并设置mOwner/mOwnerCookie指向IPCThreadState的freeBuffer。当Parcel析构时会调用freeBuffer，通过BC_FREE_BUFFER命令协议通知驱动程序释放内核缓冲区。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "ProcessState的startThreadPool如何启动Binder线程池？joinThreadPool中线程生命周期的三个阶段是什么？", "a": "startThreadPool将mThreadPoolStarted置true防止重复启动，然后spawnPooledThread创建PoolThread对象（isMain=true，表示进程主动创建）并run启动，PoolThread的threadLoop调用IPCThreadState的joinThreadPool。joinThreadPool三阶段：（1）注册：根据isMain发送BC_ENTER_LOOPER或BC_REGISTER_LOOPER；（2）循环：不断talkWithDriver等待并executeCommand处理通信请求；（3）退出：非主线程（isMain=false）超时（TIMED_OUT）后发送BC_EXIT_LOOPER退出线程池。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程如何通过Service Manager获取Service组件代理对象？ getService的容错机制是什么？", "a": "调用Service Manager代理对象（BpServiceManager）的getService，它最多尝试5次（每次失败睡眠1毫秒后重试），内部调用checkService：通过句柄值为0的BpBinder向Service Manager发送CHECK_SERVICE_TRANSACTION操作请求。Service Manager在svclist中查找svcinfo，将其句柄值用bio_put_ref封装成BINDER_TYPE_HANDLE类型的Binder对象返回；驱动程序为Client进程创建新的引用对象并改写句柄值后经BR_REPLY返回。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "驱动程序处理CHECK_SERVICE_TRANSACTION的返回结果时如何为Client进程创建引用对象？", "a": "Service Manager返回的数据包含BINDER_TYPE_HANDLE类型的flat_binder_object（句柄值属于Service Manager进程的引用对象）。驱动程序先根据该句柄在Service Manager进程中找到引用对象ref，再调用binder_get_ref_for_node在目标Client进程中查找/创建引用同一实体对象（ref->node）的新引用对象new_ref，将flat_binder_object的句柄值改为new_ref的句柄值，并调用binder_inc_ref增加其计数后返回给Client进程。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Client进程拿到句柄后如何封装成Service代理对象？", "a": "Parcel的readStrongBinder通过unflatten_binder取出BINDER_TYPE_HANDLE类型的flat_binder_object，调用ProcessState的getStrongProxyForHandle根据句柄值查找/创建BpBinder代理对象；再调用IFregService的asInterface（IMPLEMENT_META_INTERFACE生成）：因BpBinder的queryLocalInterface返回NULL，故将BpBinder封装成BpFregService对象并返回IFregService接口。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Java层通过什么机制使用Binder？Service Manager的Java代理对象是如何创建的？", "a": "Java通过JNI方法调用Binder库的C/C++接口。ServiceManager类的getIServiceManager：先通过BinderInternal.getContextObject（JNI方法android_os_BinderInternal_getContextObject）调用C++层ProcessState::getContextObject获得句柄值为0的BpBinder，再用javaObjectForIBinder创建对应的Java服务代理对象BinderProxy（mObject指向C++层BpBinder），最后通过ServiceManagerNative.asInterface将其封装成ServiceManagerProxy对象保存在静态变量sServiceManager中。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "函数javaObjectForIBinder如何保证一个Binder代理对象只对应一个BinderProxy？", "a": "先调用BpBinder的findObject（以gBinderProxyOffsets地址为关键字在ObjectManager中查找）检查是否已创建过对应的BinderProxy；若找到弱引用对象则升级为强引用验证有效性，有效直接返回，无效则detachObject解除关联。否则创建新BinderProxy，将其mObject设为BpBinder地址，增加BpBinder强引用计数，并通过BpBinder的attachObject以gBinderProxyOffsets为关键字将BinderProxy的全局弱引用（mSelf）与BpBinder关联。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "AIDL文件编译后生成什么Java类？各自作用是什么？", "a": "以IFregService.aidl为例生成IFregService.java，包含：（1）接口IFregService；（2）抽象类IFregService.Stub（继承Binder、实现IFregService），描述Java服务，其asInterface将代理对象封装成Stub.Proxy，onTransact接收分发TRANSACTION_setVal/TRANSACTION_getVal请求；（3）类IFregService.Stub.Proxy（内部mRemote指向BinderProxy），实现接口方法并向Java服务发送进程间通信请求。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Java服务（如硬件访问服务FregService）在C++层的对应物是什么？创建过程如何？", "a": "Java服务继承IFregService.Stub（继承Binder类）。Binder构造函数调用JNI方法init：在C++层创建JavaBBinderHolder对象，将其地址保存到Java层Binder的成员变量mObject中；JavaBBinderHolder保存Java服务对象（mObject），并通过成员变量mBinder（JavaBBinder弱指针）持有一个JavaBBinder对象（继承BBinder，即C++层Binder本地对象，其mObject指向Java服务）。JavaBBinderHolder的get函数在mBinder失效时创建新的JavaBBinder。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "注册Java服务时，Java层的服务对象如何转换成C++层的Binder本地对象写入Parcel？", "a": "Java层Parcel的writeStrongBinder是JNI方法（android_os_Parcel_writeStrongBinder）：先用parcelForJavaObject找到对应的C++层Parcel对象；再调用ibinderForJavaObject转换参数——若obj是Java服务代理对象（BinderProxy），直接取其mObject得到C++层BpBinder；若是Java服务，则将obj.mObject（JavaBBinderHolder）取出，调用其get函数获得JavaBBinder（C++层Binder本地对象），最后写入Parcel。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Java服务的通信请求最终如何分发回Java层处理？", "a": "Binder驱动程序将请求分发给注册时对应的JavaBBinder本地对象的onTransact；JavaBBinder.onTransact调用其mObject指向的Java服务（继承Binder）的execTransact；Binder.execTransact将C++层Parcel转为Java层Parcel后调用子类重写的onTransact（即IFregService.Stub.onTransact）；Stub.onTransact根据请求类型（TRANSACTION_getVal等）分发给FregService实现的getVal/setVal。"}, {"ch": "第5章 Binder进程间通信系统", "ci": 4, "part": "第2篇 Android专用驱动系统", "q": "Java层获取Java服务代理对象的流程与C++层有何对应关系？", "a": "ServiceManager.getService先查静态缓存sCache（以服务名称为关键字），未命中则通过getIServiceManager获得ServiceManagerProxy，调用其getService（通过句柄值0的BinderProxy发送GET_SERVICE_TRANSACTION请求）；返回结果经Java层Parcel.readStrongBinder（JNI调用C++层readStrongBinder+javaObjectForIBinder）转成BinderProxy；最后IFregService.Stub.asInterface将其封装成IFregService.Stub.Proxy（queryLocalInterface返回null时）。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Ashmem匿名共享内存系统与传统Linux共享内存的相同点和不同点是什么？", "a": "两者都基于内核的临时文件系统tmpfs实现。但Ashmem对内存块进行了更精细化管理：应用程序可动态将一块共享内存划分为若干小块，不再使用的小块可被内存管理系统回收，适应小内存移动设备环境。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Ashmem匿名共享内存系统的架构分为哪几层？各层提供什么接口？", "a": "底层是Ashmem驱动程序（内核空间），负责分配和管理所有匿名共享内存；中间是运行时库cutils，提供C接口（ashmem_create_region、ashmem_pin_region、ashmem_unpin_region等）；上层是应用程序框架层，提供C++类MemoryBase、MemoryHeapBase和Java类MemoryFile。"}, {"ch": "第6章 Ashmem匿名共享内存系统", "ci": 5, "part": "第2篇 Android专用驱动系统", "q": "Android使用什么标识一块匿名共享内存？相比传统Linux用整数标识有何两个好处？", "a": "Android使用一个文件描述符来标识一块匿名共享内存。好处：一是方便将它映射到进程地址空间直接访问内容；二是可以通过Binder进程间通信机制传输该文件描述符，实现跨进程共享同一块匿名内存。"}, {"ch": "第6章
