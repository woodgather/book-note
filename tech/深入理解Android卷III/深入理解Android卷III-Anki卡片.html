<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深入理解Android 卷III · Anki 卡片</title>
<style>
:root{
  --bg:#f6f8f7;
  --surface:#ffffff;
  --ink:#1c2b2a;
  --ink-soft:#5c6b6a;
  --line:#dde5e2;
  --green:#0f9d58;
  --green-deep:#0b7a44;
  --green-tint:#e7f4ed;
  --radius:14px;
  color-scheme: light;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:15px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
code,.mono{
  font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;
  font-size:.92em;
  background:#eef2f1;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;
  word-break:break-all;
}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(246,248,247,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 24px 12px}
.htop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;font-weight:700;letter-spacing:.5px}
h1 .vol{color:var(--green-deep)}
.hmeta{font-size:13px;color:var(--ink-soft)}
.hmeta b{color:var(--green-deep);font-weight:700}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.search{
  flex:1;min-width:200px;
  padding:7px 12px;font-size:14px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);outline:none;transition:border-color .15s;
}
.search:focus{border-color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--surface);
  color:var(--ink-soft);font-size:12.5px;
  padding:4px 11px;border-radius:99px;cursor:pointer;
  transition:all .15s;font-family:inherit;
}
.chip:hover{border-color:var(--green);color:var(--green-deep)}
.chip.on{background:var(--green-tint);border-color:var(--green);color:var(--green-deep);font-weight:600}
.chip .n{opacity:.65;font-size:11.5px;margin-left:3px}
.tools{display:flex;gap:6px;margin-left:auto}
.tbtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  font-size:12.5px;padding:4px 11px;border-radius:8px;cursor:pointer;transition:all .15s;font-family:inherit;
}
.tbtn:hover{border-color:var(--green);color:var(--green-deep)}

/* ---------- grid ---------- */
main{max-width:1180px;margin:0 auto;padding:22px 24px 80px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  align-items:start;
}
@media (max-width:760px){.grid{grid-template-columns:1fr}}

/* ---------- card ---------- */
.card{perspective:1600px;min-height:150px;scroll-margin-top:130px}
.card.hidden{display:none}
.inner{
  position:relative;width:100%;min-height:150px;
  transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,.2,.2,1);
  cursor:pointer;
}
.card.flip .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 18px 14px;
  display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(28,43,42,.05);
  overflow:auto;
}
.face.back{
  transform:rotateY(180deg);
  background:#fbfdfc;
  border-color:#cfe5d9;
}
/* chapter tab */
.face::before{
  content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:4px;
  border-radius:0 3px 3px 0;
  background:var(--c,#999);
}
.chead{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
  font-size:11.5px;flex-wrap:wrap;
}
.ctag{
  color:var(--green-deep);background:var(--green-tint);
  padding:1px 8px;border-radius:99px;font-weight:600;white-space:nowrap;
}
.topic{color:var(--ink-soft)}
.topic::before{content:"#";opacity:.6;margin-right:1px}
.qnum{margin-left:auto;color:#aab6b4;font-variant-numeric:tabular-nums;font-size:11px}
.qtext{font-size:15.5px;font-weight:600;line-height:1.65;flex:1}
.atext{font-size:14px;line-height:1.85;flex:1}
.atext p{margin:0 0 6px}
.atext p:last-child{margin:0}
.hint{
  margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:11.5px;color:#9fb0ad;display:flex;align-items:center;gap:5px;
}
.face.back .hint{border-top-color:#dbeae2}
.flipicon{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}

/* focus */
.card input.fo{position:absolute;opacity:0;pointer-events:none}
.inner:focus-visible{outline:2.5px solid var(--green);outline-offset:3px;border-radius:var(--radius)}

/* footer */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);
}
.fwrap{max-width:1180px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--ink-soft)}
.progress{flex:1;height:5px;background:#e6ece9;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--green),#37c47f);border-radius:99px;transition:width .3s}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#fff;font-size:11px;font-family:inherit}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:60px 0;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="htop">
      <h1>深入理解Android <span class="vol">卷III</span> · Anki 卡片</h1>
      <span class="hmeta">共 <b>163</b> 张 · 覆盖全书 8 章 · 点击卡片翻面</span>
    </div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="搜索关键词，如 Binder、音量、addWindow…">
      <div class="chips" id="chips"></div>
      <div class="tools">
        <button class="tbtn" id="flipAll">翻开全部</button>
        <button class="tbtn" id="resetAll">重置</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="fwrap">
    <span>学习进度 <b id="doneN">0</b>/<b id="totalN">0</b></span>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <span class="kbd">Tab</span> 切换卡片 · <span class="kbd">Enter</span>/<span class="kbd">空格</span> 翻面
  </div>
</footer>

<script>
const DATA = [{"id": 1, "ch": 1, "chName": "开发环境部署", "topic": "开发环境", "front": "编译 Android 4.0 源码对操作系统和 JDK 有什么要求?为什么?", "back": "Android 2.3 以后官方要求使用 64 位操作系统编译源码(书中推荐 Ubuntu 10.04 X86-64),JDK 必须使用 JDK 1.6。安装 JDK 后还需在 ~/.bashrc 中配置 JAVA_HOME 等环境变量并重新登录生效。"}, {"id": 2, "ch": 1, "chName": "开发环境部署", "topic": "开发环境", "front": "编译 Android 源码的三个基本步骤是什么?choosecombo 如何选择?", "back": "(1) 执行 source build/envsetup.sh 导入 Android 编译环境;(2) 执行 choosecombo(它是 envsetup.sh 中定义的函数),依次选择 release、generic、eng;(3) 执行 make 编译整个系统。编译时间取决于机器配置,书中 4 核 4GB 机器约需 2 小时。"}, {"id": 3, "ch": 1, "chName": "开发环境部署", "topic": "调试SystemServer", "front": "利用 Eclipse 调试 SystemServer 进程的关键配置是什么?", "back": "在 Debug Configurations 中新建 Remote Java Application:Host 设为 localhost,调试端口号设为 8600(这是 SystemServer 进程的调试端口)。Eclipse 连接该端口后通过 JDWP 协议调试 SystemServer,即可对 startActivity 等框架流程下断点调试。"}, {"id": 4, "ch": 1, "chName": "开发环境部署", "topic": "源码导入", "front": "将 Android 源码导入 Eclipse 有哪些必要步骤和注意事项?", "back": "前提是已完整编译过整个系统。步骤:复制 /development/ide/eclipse/.classpath 到源码根目录,并注释掉非 Framework 模块以加快导入;New Java Project 时 Location 指向源码根目录。注意事项:导入前必须关闭 Eclipse 自动编译(Project→Build Project Automatically);导入后千万不要 clean 工程,否则会删除源码编译生成的文件,导致需要重新编译整个 Android 系统。"}, {"id": 5, "ch": 1, "chName": "开发环境部署", "topic": "工具插件", "front": "Coffee Bytes Java 插件的作用是什么?为什么阅读 Framework 源码时推荐它?", "back": "Coffee Bytes Java 是 Eclipse 的代码折叠插件,折叠功能远强于 Eclipse 自带的折叠。阅读源码时可以把不关心的分支(如 else if)折叠起来,帮助开发者集中精力研究所关心的代码,对研究大段框架代码非常有用。"}, {"id": 6, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "Java层的Binder架构与Native层Binder架构是什么关系?", "back": "Java层的Binder架构是Native层Binder架构的一个镜像(Mirror),采用同样的C/S架构,类的命名也尽量与Native层保持一致。但这个镜像必须借助Native层Binder系统才能开展工作,Java层的Binder通信最终依赖Native层的Binder实现。"}, {"id": 7, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "Java层Binder架构中,代表服务端Bn端和客户端Bp端的类分别是什么?系统中还定义了哪些相关类?", "back": "服务端Bn端的代表是Binder类,客户端Bp端的代表是BinderProxy类,二者都实现了IBinder接口。此外还有仅供Binder框架内部使用的BinderInternal类(内部有处理Binder相关垃圾回收的GcWatcher类),以及承载通信数据的Parcel类。"}, {"id": 8, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "IBinder接口中FLAG_ONEWAY标志的含义是什么?使用这种调用的程序在设计上有什么典型特点?", "back": "普通跨进程Binder调用时,客户端会阻塞直到服务端返回结果;指明FLAG_ONEWAY后,客户端只要把请求发送到Binder驱动即可返回,不等待服务端结果,是一种非阻塞方式(Native层调用基本都是阻塞的,Java层framework中FLAG_ONEWAY使用很多)。设计特点:客户端发出请求后无法确定服务端是否处理,因此一般会向服务端注册一个回调(同样是跨进程Binder调用),服务端处理完请求后通过回调通知客户端结果,回调本身也大多采用FLAG_ONEWAY。"}, {"id": 9, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "Java层Binder框架初始化时,register_android_os_Binder函数完成了哪三个类的初始化?为什么要提前获取MethodID/fieldID?", "back": "完成了3个类与Native层关系的初始化:①Binder类(int_register_android_os_Binder);②BinderInternal类(int_register_android_os_BinderInternal);③BinderProxy类(int_register_android_os_BinderProxy,还获取了WeakReference和Error类的信息,BinderProxy生命周期委托WeakReference管理)。提前把MethodID/fieldID(如execTransact、mObject)保存到gBinderOffsets等全局静态对象中,可节省每次使用时重复获取的时间,当Binder调用频繁时节省可观;registerNativeMethods则为Java层调用JNI层打通道路。"}, {"id": 10, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "javaObjectForIBinder()函数做了哪些关键工作?BinderInternal.getContextObject()是如何得到返回对象的?", "back": "getContextObject()是native函数:先通过ProcessState::self()->getContextObject(NULL)得到Native的BpProxy(BpBinder)对象(NULL指定目的端为ServiceManager),再由javaObjectForIBinder()封装成Java对象。javaObjectForIBinder()的工作:①通过BpBinder的ObjectManager的findObject检查是否已有旧的Java BinderProxy对象,有则删除;②创建新的Java BinderProxy对象,并把Native BpBinder的指针保存到其mObject成员中(两者联系的纽带);③将新BinderProxy对象attach到BpBinder的ObjectManager中,注册回收函数proxy_cleanup;④设置保存死亡通知的DeathRecipientList(mOrgue);⑤创建的Proxy对象超过200个时调用incRefsCreated触发BinderInternal的forceBinderGc做垃圾回收。"}, {"id": 11, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "Java层中与Native层interface_cast宏作用类似的函数是什么?以ServiceManager为例说明其用法。", "back": "是asInterface()函数。ServiceManager.getIServiceManager()中调用ServiceManagerNative.asInterface(BinderInternal.getContextObject()),以获得的BinderProxy(BpProxy)为参数构造业务相关的ServiceManagerProxy对象。ServiceManagerProxy的各业务函数把请求打包后交给其mRemote(BinderProxy),最终由BpProxy发送给Binder驱动完成通信(真正与驱动交互的是IPCThreadState)。"}, {"id": 12, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "简述ServiceManagerProxy.addService()向ServiceManager注册服务的流程。", "back": "先通过Parcel.obtain()创建data和reply两个Parcel;向data中writeInterfaceToken、writeString(服务名)、writeStrongBinder(服务对象);然后调用mRemote.transact(ADD_SERVICE_TRANSACTION, data, reply, 0)——mRemote就是BinderProxy,其transact是native函数;最后回收两个Parcel。BinderProxy.transact的JNI实现会取出Native的Parcel和BpBinder对象,通过target->transact()把请求发送给ServiceManager。"}, {"id": 13, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构", "front": "从通信角度看,Binder的目的和架构分别是什么?ServiceManager为什么不使用这些架构?", "back": "Binder的通信目的很简单:向binder驱动发送请求和接收回复。而架构(IBinder接口、Binder/BinderProxy等封装类)是复杂的,是为软件灵活性和可扩展性而搭建的。完全可以不使用架构直接与binder交互——ServiceManager作为Binder核心程序,就是直接读取/dev/binder设备获取并处理请求的。研究源码要先搞清目的,实现只是达到目的的手段。"}, {"id": 14, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "JavaBBinder", "front": "Java层的Binder对象在Native层对应什么对象?它是通过哪个成员变量关联的?", "back": "Java Binder对象在Native层对应一个JavaBBinderHolder对象:Binder构造函数调用native的init(),创建JavaBBinderHolder并保存到Java Binder对象的mObject成员中。JavaBBinderHolder仅从RefBase派生,不属于Binder家族,其get()函数会创建真正从BnBinder派生的JavaBBinder对象(以弱引用wp<mBinder>保存)。这种间接设计估计与垃圾回收(内存管理)有关。"}, {"id": 15, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "JavaBBinder", "front": "writeStrongBinder()真正写入Parcel的是什么?Java Binder、JavaBBinderHolder、JavaBBinder三者是如何互相指向的?", "back": "writeStrongBinder通过ibinderForJavaObject()做转换:若Java对象是Binder类实例,取出其mObject中的JavaBBinderHolder并调用get()返回JavaBBinder;若是BinderProxy类实例,直接返回其mObject中保存的Native BpBinder。所以真正写入Parcel并传递到Binder驱动的是JavaBBinder对象。三层关系:①Java Binder通过mObject指向Native的JavaBBinderHolder;②JavaBBinderHolder通过mBinder(wp弱引用)指向Native的JavaBBinder;③JavaBBinder又通过mObject指向Java层的Binder对象。每个Java Binder对象对应不同的JavaBBinder对象。"}, {"id": 16, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "JavaBBinder", "front": "JavaBBinder与业务完全无关,它如何把客户端请求传递到正确的Java Binder服务?请描述AMS响应请求的调用链。", "back": "JavaBBinder只是一个传声筒:收到请求时,它的onTransact()通过JNI调用其所绑定Java Binder对象的execTransact()方法(对AMS而言mObject即AMS);Binder.execTransact()再调用onTransact();由Binder的子类(如ActivityManagerNative,它继承Binder并实现IActivityManager)实现onTransact(),根据code值switch分发,最终派发给业务子类AMS实现具体业务函数(如startActivity)。多层继承逐级派发,请求就到达了正确的Java Binder对象。"}, {"id": 17, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "AIDL", "front": "一个AIDL文件被aidl工具解析后会产生哪三个物件?各自的作用是什么?", "back": "以IMyServer.aidl为例产生:①IMyServer接口——继承android.os.IInterface,仅用来声明AIDL文件中定义的接口(如foo());②IMyServer.Stub抽象类——继承android.os.Binder并实现IMyServer接口,实现了Bn端通过onTransact()接收Bp端请求的代码,业务方法(foo())在Stub中是抽象的,因为aidl工具不知道其具体功能;③IMyServer.Stub.Proxy类——实现Bp端代码,将参数写入Parcel、调用mRemote.transact()发送请求、从reply读取返回值。"}, {"id": 18, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "AIDL", "front": "AIDL生成的Stub类中,onTransact()如何根据code分发请求?TRANSACTION_foo常量是怎么定义的?", "back": "onTransact()中通过switch(code)分发:case TRANSACTION_foo时从data中读取参数_arg0,调用Stub子类实现的this.foo(_arg0),再把结果写入reply并返回true;不匹配的code则交给super.onTransact()。TRANSACTION_foo定义为(android.os.IBinder.FIRST_CALL_TRANSACTION + 0),即每个业务方法对应一个递增的事务code。"}, {"id": 19, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "AIDL", "front": "实现一个AIDL定义的Bn端服务,开发者需要做什么?常见的服务发布方式有哪些?", "back": "开发者只需继承IMyServer.Stub类并实现其抽象方法(如foo()),每个实例就具有了作为Bn端的能力。典型做法:①通过ServiceManager.addService()注册为系统服务;②在Android标准Service的onBind()方法中将其作为返回值,使其他进程可访问;③也可通过Binder调用将其传递给另一个进程,使之成为跨进程的回调对象。"}, {"id": 20, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "AIDL", "front": "Bp端如何获得并使用一个AIDL服务(如IMyServer)的代理对象?", "back": "先通过ServiceManager.getService()、onServiceConnected()或其他方式获取IMyServer的BinderProxy,然后调用IMyServer.Stub.asInterface(binderProxy)——其实现是new IMyServer.Stub.Proxy(obj),obj会被保存为Proxy的mRemote成员。之后即可直接调用remote.foo(\"Hello AIDL!\"),Proxy内部将参数写入Parcel并transact发给Bn端,再从reply读取返回值。"}, {"id": 21, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "Binder架构总结", "front": "总结Java层Binder架构:Java BinderProxy和Java Binder在Native层分别对应什么对象?", "back": "①客户端侧:Java层的BinderProxy在Native层对应一个BpBinder对象,Java层发出的请求先传到BpBinder,再由BpBinder发送到Binder驱动;②服务端侧:Java层的Binder在Native层对应一个JavaBBinder对象,所有Java Binder在Native层都对应JavaBBinder,它仅起中转作用,把客户端请求从Native层传递到Java层;③系统中依然只有一个Native的ServiceManager。"}, {"id": 22, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "为什么说从Android 2.3开始MessageQueue是\"心系两界\"的?它的构造过程涉及哪些Native对象?", "back": "Android 2.3以前只有Java层能向MessageQueue添加消息;2.3后MessageQueue核心逻辑下移到Native层,Native层也能利用消息循环处理消息,所以它同时服务Java和Native两个世界。构造时Java层MessageQueue()调用nativeInit(),在Native层创建对应的NativeMessageQueue对象并保存到Java层(mPtr);NativeMessageQueue构造函数先调用Looper::getForThread()从线程本地存储(TLS)取Looper对象,若无则new Looper(false)创建并通过Looper::setForThread()存入TLS——一种以线程为单位的单例模式。Native的Looper与Java层Looper类同名但毫无关系。"}, {"id": 23, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "MessageQueue.next()的基本流程是什么?当队首消息尚未到执行时间或队列为空时,nextPollTimeoutMillis如何设置?", "back": "next()在无限循环中:先调用nativePollOnce(mPtr, nextPollTimeoutMillis)等待(超时时间-1表示无限等待,0表示立即返回),然后检查mMessages队首消息:若now >= msg.when,则将消息从队列摘除(mMessages = msg.next)、markInUse并返回给Looper派发处理;若未到时间,nextPollTimeoutMillis = Math.min(when - now, Integer.MAX_VALUE);若队列为空则nextPollTimeoutMillis = -1。当队列中无Message时,Looper会调用IdleHandler做些工作(如垃圾回收)。"}, {"id": 24, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "MessageQueue.enqueueMessage()如何将消息插入队列?什么情况下会调用nativeWake?", "back": "按执行时间(when)排序插入:若队列为空(p==null)、when==0或when小于队首消息时间,则msg成为新的队首,needWake = mBlocked;否则遍历找到插入位置插到队尾,needWake = false(队列中还有剩余消息,无需唤醒)。插入后若needWake为true则调用nativeWake(mPtr),触发Native层pollOnce结束等待。mBlocked标志体现了多线程细节上的优化。"}, {"id": 25, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "nativeWake()最终做了什么操作来唤醒等待?为什么这样能唤醒?", "back": "调用链是:android_os_MessageQueue_nativeWake() → NativeMessageQueue::wake() → mLooper->wake()。Native Looper的wake()只是向管道的写端(mWakeWritePipeFd)写入一个字符'W'(用do-while处理EINTR重写),管道读端因有数据可读而从等待状态中醒来,从而触发epoll_wait返回。"}, {"id": 26, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "epoll", "front": "epoll的基本使用流程分哪几步?支持哪四类事件?它为什么比select效率高?", "back": "流程:①epoll_create(10)创建epoll句柄(2.6.8以后内核参数10无实际意义,缓存可动态拓展);②定义struct epoll_event,设置events和data(上下文数据),通过epoll_ctl(epollHandle, EPOLL_CTL_ADD, fd, &event)把要监听的fd加入;③循环调用epoll_wait等待事件,返回值nfds>0表示有事件发生,==0表示超时,<0表示出错;④遍历resultEvents,通过event.data取得上下文数据判断是哪个句柄发生了事件。四类事件:EPOLLIN(可读)、EPOLLOUT(可写)、EPOLLERR(错误,系统默认会加入)、EPOLLHUP(断开)。比select高效的原因:①每次调用select都要把感兴趣的事件复制到内核,而epoll只在epoll_ctl加入时复制一次;②epoll用红黑树保存事件、查找快,select用数组、句柄个数有限且查找慢;少量句柄时相差不大,但仍推荐epoll。"}, {"id": 27, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "Looper::pollOnce(int, int*, int*, void**)的四个参数和返回值各有什么含义?", "back": "参数:timeoutMillis为超时时间(-1无限等待,0立即返回);outFd存储发生事件的文件描述符;outEvents存储发生的事件(可读、可写、错误、中断4种,由epoll事件转化而来);outData存储添加监听句柄时传入的上下文数据(作用类似pthread_create最后的param参数)。返回值:ALOOPER_POLL_WAKE表示由wake函数(管道写事件)触发;ALOOPER_POLL_TIMEOUT表示超时;ALOOPER_POLL_ERROR表示出错;ALOOPER_POLL_CALLBACK表示某个被监听句柄被触发(此时outFd/outEvents有有效值)。"}, {"id": 28, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "Looper::pollInner()的关键流程是什么?对于没有callback的Response,pollOnce如何处理?", "back": "①先根据Native Message信息(mNextMessageUptime)计算真正需要等待的时间;②调用epoll_wait等待;③返回后分三种情况:出错(ALOOPER_POLL_ERROR)、超时(ALOOPER_POLL_TIMEOUT)、监测到事件。若有事件:管道读端(mWakeReadPipeFd)可读则调用awoken()读取并清空管道数据;其他fd发生事件则从mRequests中取出对应Request,把epoll事件转换为ALOOPER事件后pushResponse构造Response。④Done之后:先处理Native Message(调用MessageHandler的handleMessage),再处理mResponses中带callback的Response(callback返回0则removeFd移除该监听)。另外pollOnce外层循环会先处理mResponses中无callback的Response:因没有callback,系统不知道如何处理,所以只把其ident、fd、events、data通过outFd/outEvents/outData返回并直接return这个ident。"}, {"id": 29, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "Looper.addFd()的作用和参数含义是什么?mRequests中已存在相同fd时会怎样?", "back": "addFd(fd, ident, events, callback, data)用于添加监控请求,内部调用epoll_ctl注册fd:fd为监听的文件句柄,ident为其id,events为监听事件(如ALOOPER_EVENT_INPUT,内部转换为EPOLLIN等),callback为事件发生时Looper回调的函数,data为回调参数。若callback为空且Looper不允许非回调模式(mAllowNonCallbacks为false)则返回-1。若mRequests(fd为key)中已存在该fd,则用epoll_ctl的EPOLL_CTL_MOD修改监听信息并replaceValueAt更新Request;否则EPOLL_CTL_ADD新增并保存到mRequests。"}, {"id": 30, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "Native层如何添加消息?Looper::sendMessageAtTime()的关键逻辑是什么?", "back": "从Android 4.0开始Native层也支持sendMessage()。Native的sendMessage必须同时传递一个MessageHandler,内部调用sendMessageAtTime(now, handler, message)。sendMessageAtTime按uptime对mMessageEnvelopes排序插入正确位置;若当前正处于mSendingMessage状态则直接返回(类似Java层的mBlocked,是小小的优化措施);插入位置为队首(i==0)时调用wake()唤醒epoll_wait处理消息。"}, {"id": 31, "ch": 2, "chName": "Java Binder 与 MessageQueue", "topic": "MessageQueue", "front": "总结消息处理家族:Java层和Native层各自有哪些成员?MessageQueue处理三类事件的优先顺序是什么?", "back": "Java层:Looper类(循环处理消息)、MessageQueue类(消息队列及插入/删除/提取接口)、Handler、Message。Native层:NativeMessageQueue(通过Java层mPtr持有)保存一个从ALooper派生的native Looper(提供pollOnce、addFd等),并有自己的Message类和MessageHandler抽象类(常用派生类为WeakMessageHandler)。MessageQueue核心下移后:①继续支持Java层Message+Handler方式;②支持Native层Message和MessageHandler处理;③处理通过addFd添加的Request(监控文件句柄,输入系统中大量使用)。处理顺序:先是Native的Message,然后是Native的Request,最后才是Java的Message。"}, {"id": 32, "ch": 3, "chName": "AudioService", "topic": "概述与架构", "front": "在分析Android音频系统时,习惯将其实现分为哪两个部分?各自包含哪些关键模块?", "back": "分为数据流和策略两部分。数据流描述音频数据从数据源流向目的地的过程,Native层的AudioTrack、AudioRecord、AudioFlinger属于数据流范畴;策略负责管理和控制数据流的路径与呈现,AudioPolicy相关内容属于策略范畴。Java层的AudioService基本上不参与数据流,主要承担策略工作。"}, {"id": 33, "ch": 3, "chName": "AudioService", "topic": "概述与架构", "front": "为什么说AudioService是音频系统的\"大本营\"?它与AudioManager、AudioSystem的关系是什么?", "back": "AudioService继承自IAudioService.Stub(由IAudioService.aidl生成),位于Bn端,包含或使用了几乎所有的音频相关内容,功能非常多且彼此耦合性不大。AudioManager拥有AudioService的Bp端,是其客户端代理,几乎所有客户端请求最终都交给AudioService实现。AudioService的功能实现依赖AudioSystem类——它无法实例化,是Java层到Native层的代理,通过它与AudioPolicyService及AudioFlinger交互。"}, {"id": 34, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "为什么说\"离开流类型谈音量是没有意义的\"?Android中音量与流类型是什么关系?", "back": "在Android中音量的控制与流类型密不可分:每种流类型都独立拥有自己的音量设置,绝大部分情况下互不干扰,例如音乐音量与通话音量相互独立。因此音量这个概念一定是描述某一种流类型的音量,调整音量时必须指定(或推断出)流类型。"}, {"id": 35, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "应用如何指定音量键所控制的流类型?(提示:Activity中的哪个函数,最终改变了哪个变量?)", "back": "调用Activity.setVolumeControlStream(int streamType),其实现只有一行:getWindow().setVolumeControlStream(streamType)。它改变的是承载该Activity的PhoneWindow中的mVolumeControlStreamType变量,该变量会在onKeyDown()中作为参数传给AudioManager.handleKeyDown(),从而决定音量键调整哪种流类型的音量。该设置绑定在Activity的Window上,Activity切换时随Window切换,应用无需在生命周期中手动切换。"}, {"id": 36, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "从按下音量键到AudioService开始处理,事件经过哪些环节?为什么相机应用可以把音量键用作拍照?", "back": "音量键按下后,Android输入系统将事件派发给Activity;若无人截获消费,承载当前Activity显示的PhoneWindow的onKeyDown()/onKeyUp()会处理它,对VOLUME_UP/DOWN/MUTE直接调用getAudioManager().handleKeyDown(event, mVolumeControlStreamType)。按照输入事件派发策略,Window对象排在派发队列队尾(Activity之后),所以应用可以重写onKeyDown()截获音量键实现其他功能,如相机应用中拍照。"}, {"id": 37, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "AudioManager.handleKeyDown()为音量键设置了哪些flags?FLAG_PLAY_SOUND为什么\"只是有时候\"生效?", "back": "handleKeyDown()设置了FLAG_SHOW_UI(要求弹出音量控制面板)和FLAG_VIBRATE;handleKeyUp()设置了FLAG_PLAY_SOUND(松开音量键后播放提示音)。在AudioService.adjustSuggestedStreamVolume()中,只有特定流类型且不处于锁屏状态时才保留FLAG_PLAY_SOUND,否则该flag会被清除(flags &= ~FLAG_PLAY_SOUND),所以提示音只是有时候响起。"}, {"id": 38, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "adjustSuggestedStreamVolume()中,最终要调整的流类型是如何确定的?mVolumeControlStream有什么特殊权力?", "back": "首先判断成员变量mVolumeControlStream是否为-1:只要它不是-1,就以它为要调整的流类型(优先级高于传入参数);否则调用getActiveStreamType(suggestedStreamType),根据建议的流类型与AudioService的实际情况返回最终流类型。mVolumeControlStream由VolumePanel通过forceVolumeControlStream()设置:音量提示框显示期间强制后续音量键固定调节促使它显示的那个流类型,提示框关闭时重新置为-1取消强制。"}, {"id": 39, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "AudioService用什么数据结构实现\"铃声音量用作通知音量\"这类流音量映射?相关代码中常见哪句转换?", "back": "使用整型数组mStreamVolumeAlias描述源流类型到目标流类型的映射(而非HashMap)。例如mStreamVolumeAlias[AudioSystem.STREAM_MUSIC] = AudioSystem.STREAM_RING即实现以铃声音量控制音乐。由于对A流操作实际是在操作B流,很多与流相关的函数都会先执行streamType = mStreamVolumeAlias[streamType]的转换。"}, {"id": 40, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "请概述adjustStreamVolume()的主要流程(按音量键路径)。", "back": "1) 通过mStreamVolumeAlias得到streamTypeAlias,取出对应VolumeStreamState,并用getDeviceForStream()获取设备;2) 用rescaleIndex(10, streamType, streamTypeAlias)计算音量步进(内部音量值为实际值的10倍);3) 满足条件时调用checkForRingerModeChange()检查是否要改变情景模式,其返回值adjustVolume决定是否继续设置音量;4) 流未被静音且adjustIndex()返回true(音量确实变化)时,发送MSG_SET_DEVICE_VOLUME消息给mAudioHandler;5) 最后调用sendVolumeUpdate()通知外界音量变化。"}, {"id": 41, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "VolumeStreamState类的作用是什么?AudioService如何组织它的实例?", "back": "VolumeStreamState保存了一个流类型所有音量相关的信息(每个设备的音量值、静音计数、lastAudible音量等),是音量管理的核心。AudioService为每一种流类型分配一个VolumeStreamState对象,以流类型的值为索引保存在数组mStreamStates中。它还包含内部类VolumeDeathHandler用于静音控制,并提供adjustIndex()/setIndex()/applyDeviceVolume()等方法。"}, {"id": 42, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "VolumeStreamState中保存的音量值为什么是实际值的10倍(步进值为10)?", "back": "这是为了在不同流类型之间进行音量转换(rescaleIndex())时保证一定精度,可理解为转换过程中保留小数点后一位的精度。因为不同流类型的音量调节范围(刻度)不一样,用整数乘10的方式近似保留了小数,代价是实现略显奇怪(直接用float保存其实更简单)。对外广播音量时用(x+5)/10还原并实现四舍五入。"}, {"id": 43, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "Android 4.1中VolumeStreamState保存音量与之前版本相比有什么重要变化?", "back": "4.1开始音量值与设备相关联:VolumeStreamState用一个HashMap(mIndex)以设备为键保存音量,同一流类型在不同的音频设备下可以拥有不同的音量值。setIndex()保存新值的同时,会按lastAudible参数把值存入mLastAudibleIndex(用于静音恢复),并把音量变化同步设置到所有映射到当前流类型的其他流。"}, {"id": 44, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "MSG_SET_DEVICE_VOLUME消息的处理函数setDeviceVolume()做了哪些事?音量最终被设置到哪里?", "back": "它调用streamState.applyDeviceVolume(device),内部即调用AudioSystem.setStreamVolumeIndex(),音量由此被设置到底层的AudioFlinger;然后像setIndex()一样处理流音量映射(同步其他映射流);最后发送MSG_PERSIST_VOLUME消息(带PERSIST_CURRENT|PERSIST_LAST_AUDIBLE和PERSIST_DELAY),其处理函数调用persistVolume()把音量设置存储到SettingsProvider中——AudioService初始化时会从SettingsProvider读取音量设置。"}, {"id": 45, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "adjustStreamVolume()发送MSG_SET_DEVICE_VOLUME采用sendMsg()异步方式,这隐含什么风险?", "back": "sendMsg()是异步操作:adjustIndex()更新音量信息后adjustStreamVolume()立即返回,音量并未立刻设置到底层。由于AudioHandler处理多个消息是串行的,若Handler正在处理某个消息时发生阻塞,此时按音量键,虽然调用立即返回、界面上和getStreamVolume()获取的值都正常,但手机实际发声的音量大小并没有改变。"}, {"id": 46, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "sendVolumeUpdate()如何向外界通知音量变化?mVoiceCapable的作用是什么?", "back": "它一方面调用mVolumePanel.postVolumeChanged(streamType, flags)通知音量提示框;另一方面发送广播AudioManager.VOLUME_CHANGED_ACTION,携带EXTRA_VOLUME_STREAM_TYPE、EXTRA_VOLUME_STREAM_VALUE(新音量)和EXTRA_PREV_VOLUME_STREAM_VALUE(旧音量),广播前用(x+5)/10把内部10倍音量还原(加5实现四舍五入)。若设备没有通话能力(mVoiceCapable为false,从SettingsProvider读取),STREAM_RING会被替换为STREAM_NOTIFICATION,是一种语义层面的保护。"}, {"id": 47, "ch": 3, "chName": "AudioService", "topic": "VolumePanel", "front": "VolumePanel是什么?它位于哪个包?其中的StreamResources和StreamControl分别起什么作用?", "back": "VolumePanel是按下音量键后弹出的音量调节提示框的实现,位于android.view包下但未在API中提供(只被AudioService使用,开发者在注释中对此颇有不满)。它是Handler的子类。StreamResources是枚举,每个元素保存一种流类型通知框所需资源(流类型、描述文字、图标、静音图标、是否显示等),组成STREAMS数组;StreamControl保存一种流类型通知框所需控件(ViewGroup、ImageView、SeekBar等),每个流类型人手一份,保存在以流类型值为键的Hashtable mStreamControls中,与StreamResources一一对应。"}, {"id": 48, "ch": 3, "chName": "AudioService", "topic": "VolumePanel", "front": "VolumePanel显示音量提示框的完整流程是怎样的?mDialog与StreamControl是什么关系?", "back": "入口是postVolumeChanged(),它发送MSG_VOLUME_CHANGED消息,在handleMessage中调用onVolumeChanged()(通过消息把操作转到控件所属线程,因为Android要求只能在创建控件的线程操作控件)。onVolumeChanged()在flags含FLAG_SHOW_UI时,reorderSliders(streamType)把对应StreamControl装入mDialog,再由onShowVolumeChanged()填充音量/图标并mDialog.show()显示;随后延时发送MSG_TIMEOUT,超时关闭提示框,并安排MSG_FREE_RESOURCES回收资源。mDialog是承载通知框的Dialog实例,StreamControl是它的\"配件\",随需拆卸——每次音量变化时mDialog内容被替换为对应流类型的StreamControl控件。"}, {"id": 49, "ch": 3, "chName": "AudioService", "topic": "VolumePanel", "front": "为什么VolumePanel要在onShowVolumeChanged()中调用forceVolumeControlStream()?", "back": "一旦通知框被显示,mAudioManager.forceVolumeControlStream(streamType)会把mVolumeControlStream设置为当前流类型,使之后按下的音量键都只能调节当前流类型的音量;直到通知框关闭时重新调用forceVolumeControlStream()并传-1取消强制。这保证弹框期间连续按音量键调整的是同一种流类型,避免流类型跳变。"}, {"id": 50, "ch": 3, "chName": "AudioService", "topic": "音量管理", "front": "setStreamVolume()与音量键路径(adjustStreamVolume)有何异同?setStreamVolumeInt()做哪两件事?", "back": "setStreamVolume()是SDK API,为特定流类型设置范围内任意音量:它先ensureValidStreamType()校验流类型,取VolumeStreamState、getDeviceForStream()取设备,用rescaleIndex(index*10,...)把音量映射到目标流刻度,然后调用setStreamVolumeInt(),最后sendVolumeUpdate()广播通知。setStreamVolumeInt()只做两件事:调用streamState.setIndex()保存音量;根据setIndex()返回值或force参数决定是否发送MSG_SET_DEVICE_VOLUME设置到底层。它与adjustStreamVolume()内容出奇相似(作者感叹4.1源码仍不够精致)。"}, {"id": 51, "ch": 3, "chName": "AudioService", "topic": "静音控制", "front": "AudioService的静音控制为什么采用引用计数?如何防止应用异常退出导致流被永远静音?", "back": "因为每个应用都可能进行静音操作,为防止状态紊乱,静音按计数进行:多次静音需要多次取消静音才能恢复。若某应用静音(计数加1)后崩溃,没人替它取消静音,流将被永远静音。解决办法是VolumeStreamState定义了继承自IBinder.DeathRecipient的内部类VolumeDeathHandler,为每个执行静音操作的客户端(进程)创建一个实例,保存该客户端自己的静音计数(mMuteCount)并通过linkToDeath监控其存活;进程死亡时binderDied()把mMuteCount置为1再调用mute(false),即替它完成未完成的取消静音,从总计数中消除其影响。"}, {"id": 52, "ch": 3, "chName": "AudioService", "topic": "静音控制", "front": "AudioManager.setStreamMute()传入的mICallBack(一个裸Binder对象)有什么用途?这体现了什么IPC技巧?", "back": "mICallBack是private final IBinder mICallBack = new Binder()生成的原始IBinder对象,本身无交互能力,但充当Bp端(AudioManager客户端)在Bn端(AudioService)的唯一标识。AudioService拿到它后可通过linkToDeath(DeathRecipient机制)获得客户端异常退出的回调,这是维持静音状态正常变迁的基石。这种\"服务端以客户端传入的Binder对象作为客户端唯一标识\"是Android系统服务实现中的常见技巧(例如以它为键建Hashtable保存各客户端信息);若传入AIDL定义的IBinder,服务端还能反向回调客户端(AudioFocus机制中会遇到)。"}, {"id": 53, "ch": 3, "chName": "AudioService", "topic": "静音控制", "front": "VolumeDeathHandler.mute(true)在什么条件下linkToDeath、什么条件下真正把音量设为0?取消静音时如何恢复?", "back": "静音时:无论什么条件mMuteCount都加1;若mMuteCount原本为0(该客户端第一次静音),则linkToDeath(mICallback非空时)开始监控客户端并把自己加入VolumeStreamState的mDeathHandlers列表;若全局muteCount()为0(该流第一次被静音),才把流音量设为0——这才是真正的静音动作。取消静音时:mMuteCount减1;减到0时从mDeathHandlers移除自己并unlinkToDeath;若此时全局muteCount()也为0,则把音量恢复为静音前的值(lastAudibleIndex)。另外setStreamMute()只对isStreamAffectedByMute()为真的流类型生效,并非所有流都可静音,且此处不做mStreamVolumeAlias映射(出于操作语义考虑)。"}, {"id": 54, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "Android中的\"窗口(Window)\"本质是什么?为什么说WindowManagerService叫SurfaceManagerService也说得通?", "back": "窗口的本质是进行绘制所使用的画布Surface——一块独自占有的显示区域,显示在屏幕上即为用户看到的窗口。客户端向WMS添加窗口的过程,本质就是WMS为其分配一块Surface的过程,一块块Surface在WMS管理下有序排布在屏幕上,因此从原理上讲WMS被称作SurfaceManagerService也说得通。"}, {"id": 55, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "WindowManagerService有哪两大基础子系统?各自负责什么?", "back": "布局系统(Layout System):计算与管理窗口的位置、层次(Z序);动画系统(Animation System):根据布局系统计算的窗口位置与层次渲染窗口动画。此外WMS还为所有窗口分配Surface、掌管Surface的显示顺序和位置尺寸,并且是输入系统的重要中转站。"}, {"id": 56, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "SampleWindow示例演示的客户端创建一个窗口的完整步骤是什么?", "back": "①获取IWindowSession和WMS实例(IWindowSession是客户端向WMS请求窗口操作的进程唯一中间代理);②创建并初始化WindowManager.LayoutParams(type属性是ZOrder排序的依据);③向WMS添加窗口令牌WindowToken(wms.addWindowToken());④通过IWindowSession.add()向WMS添加窗口;⑤通过IWindowSession.relayout()申请重新布局,获得WMS分配的Surface。"}, {"id": 57, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "在SampleWindow例子中,IWindow(如MyWindow)是窗口本身吗?它在WMS一侧起什么作用?", "back": "不完全是。IWindow继承自Binder,其Bn端(IWindow.Stub实现)位于应用程序一侧,因此在WMS一侧只能作为一个回调以及起到窗口Id的作用。真正的窗口本质是Surface。WindowState被保存到mWindowMap中,键值为IWindow的Bp端。"}, {"id": 58, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "Android显示系统按对Surface的操作类型可分为哪三个层次?", "back": "①UI框架层:在Surface上绘制UI元素以及响应输入事件;②WMS:管理Surface的分配、层级顺序等;③SurfaceFlinger:将多个Surface按Z-order混合并输出到FrameBuffer。"}, {"id": 59, "ch": 4, "chName": "WindowManagerService", "topic": "启动流程", "front": "WMS的启动分为哪三个阶段?分别在SystemServer的哪里触发?", "back": "①创建WMS实例:在ServerThread.run()中调用WindowManagerService.main()创建实例,并ServiceManager.addService()注册;②初始化显示信息:调用wm.displayReady(),完成后WMS会要求AMS进行第一次Configuration更新;③处理systemReady通知:调用wm.systemReady(),WMS本身不做操作,直接调用mPolicy的systemReady()。"}, {"id": 60, "ch": 4, "chName": "WindowManagerService", "topic": "启动流程", "front": "WindowManagerService.main()是如何创建WMS实例的?用到了Android 4.2新增的哪个Handler API?WMS的Handler/Choreographer运行在哪个线程?", "back": "main()通过wmHandler.runWithScissors()在名为\"WindowManager\"的HandlerThread上创建WindowManagerService实例。runWithScissors()会在Handler所在线程执行传入的Runnable,同时阻塞调用线程直到run()执行完毕。WMS中所有需要的Looper对象(Handler、Choreographer等)都运行在\"WindowManager\"线程中。"}, {"id": 61, "ch": 4, "chName": "WindowManagerService", "topic": "启动流程", "front": "WMS构造函数中创建了哪些重要成员?各自的作用是什么?", "back": "①mInputManager:InputManagerService实例,管理窗口的InputChannel并派发输入事件;②mAnimator:WindowAnimator实例,所有窗口动画的总管;③mPolicy:WindowManagerPolicy(实现类PhoneWindowManager),WMS的首席顾问,提供ZOrder值、矫正窗口属性、监听屏幕旋转、预处理HOME/BACK等系统按键;④mDisplayContents:DisplayContent列表,一个DisplayContent指代一块屏幕(Android 4.2为支持Wi-Fi Display多屏幕引入);⑤mChoreographer:从显示子系统获取VSYNC,驱动窗口动画、屏幕旋转动画、墙纸动画的渲染。"}, {"id": 62, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "WMS中mTokenMap与mWindowMap两个HashMap分别保存什么?键是什么?有哪些衍生子集?", "back": "mTokenMap保存所有显示令牌WindowToken,键是客户端声明Token的IBinder;衍生子集有mAppTokens(所有AppWindowToken,有序,与AMS的mHistory顺序一致)和mExitingTokens等。mWindowMap保存所有窗口状态WindowState,键是IWindow的Bp端;衍生子集有mPendingRemove、mLosingFocus等。此外mSessions列表保存Session(IWindowSession的Bn端),Session进程唯一。"}, {"id": 63, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "WMS的addWindow()流程前半部分做了哪些关键事情?", "back": "①mPolicy.checkAddPermission(attrs)检查权限;②通过displayId获取目标DisplayContent(无效则返回ADD_INVALID_DISPLAY);③子窗口要求父窗口已存在且层级最多两层,否则返回ADD_BAD_SUBWINDOW_TOKEN;④根据attrs.token从mTokenMap取出WindowToken并校验类型(应用窗口/输入法/壁纸/Dream必须有有效token);⑤创建WindowState;⑥mPolicy.adjustWindowParamsLw()矫正LayoutParams、prepareAddWindowLw()做添加前检查;⑦将WindowState放入mWindowMap,隐式创建的token放入mTokenMap。"}, {"id": 64, "ch": 4, "chName": "WindowManagerService", "topic": "窗口令牌", "front": "WindowToken的意义是什么?它如何规范应用组件的行为?", "back": "WindowToken将属于同一个应用组件(Activity、InputMethod、Wallpaper、Dream)的窗口组织在一起,ZOrder排序时同属一个WindowToken的窗口被安排在一起,其属性影响所有属于它的窗口。它是WMS对应用组件行为进行规范管理的令牌手段:组件创建窗口时必须出示Token表明身份,且窗口类型必须与Token类型一致。"}, {"id": 65, "ch": 4, "chName": "WindowManagerService", "topic": "窗口令牌", "front": "客户端一侧的Token与WMS一侧的WindowToken有什么区别?隐式与显式创建的WindowToken有何不同?", "back": "对客户端而言,Token只是任意一个Binder实例,仅是创建窗口的凭证;对WMS而言,WindowToken是WindowToken类的实例,保存客户端的Binder并以它为键存于mTokenMap中,是否已声明取决于对应WindowToken是否在mTokenMap里。隐式创建的WindowToken(WMS在addWindow()中为系统窗口自动创建)在最后一个窗口被移除后会一并移除;显式创建的(addWindowToken())只能通过removeWindowToken()显式移除。"}, {"id": 66, "ch": 4, "chName": "WindowManagerService", "topic": "窗口令牌", "front": "为什么系统类型窗口不提供Token也可能添加成功?这会不会带来安全问题?", "back": "因为addWindow()中若token为null且窗口类型不属于应用窗口/TYPE_INPUT_METHOD/TYPE_WALLPAPER/TYPE_DREAM,WMS会隐式创建一个WindowToken。但这不会导致安全问题,因为addWindow()开头的mPolicy.checkAddPermission()要求客户端必须拥有SYSTEM_ALERT_WINDOW或INTERNAL_SYSTEM_WINDOW权限才能创建系统类型的窗口。"}, {"id": 67, "ch": 4, "chName": "WindowManagerService", "topic": "窗口令牌", "front": "Wallpaper、InputMethod、Activity的WindowToken分别由谁在哪里声明和取消?", "back": "Wallpaper:WallpaperManagerService在bindWallpaperComponentLocked()中通过addWindowToken()声明类型为TYPE_WALLPAPER的Token,detachWallpaperLocked()中removeWindowToken()取消,以此限制Wallpaper只能创建TYPE_WALLPAPER窗口并控制其显示生命周期。InputMethod:InputMethodManagerService在startInputInnerLocked()声明、unbindCurrentMethodLocked()取消。Activity:AMS的ActivityStack在startActivityLocked()中addAppToken()声明,removeActivityFromHistoryLocked()取消,Token在ActivityRecord构造函数中创建。"}, {"id": 68, "ch": 4, "chName": "WindowManagerService", "topic": "窗口令牌", "front": "Activity的appToken为什么不是普通Binder?IApplicationToken.Stub定义了哪些通知回调?它如何粘结AMS与WMS?", "back": "appToken类型是IApplicationToken.Stub,定义了窗口相关回调:windowsDrawn()(初次绘制完成)、windowsVisible()(窗口可见)、windowsGone()(不可见)、keyDispatchingTimeout()(输入处理超时导致ANR)、getKeyDispatchingTimeout()(从AMS获取ANR时间界定)。WMS为每个appToken创建唯一的AppWindowToken,使AMS可通过appToken找到AppWindowToken并操纵窗口(如setAppVisibility()隐藏Activity的所有窗口)。AMS调整mHistory顺序时同步调整WMS的mAppTokens顺序,保证两者一致。"}, {"id": 69, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "WindowState是什么?它与显示组件一侧的什么类型对应?", "back": "WindowState维护一个窗口的所有状态信息,是WMS中事实上的窗口,在addWindow()时创建并存入mWindowMap(键为IWindow的Bp端),mWindowMap是整个系统所有窗口的全集。它在显示组件一侧对应IWindow.Stub,后者提供尺寸变化、焦点变化等窗口管理相关通知回调。"}, {"id": 70, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "DisplayContent是什么概念?它有什么隔离特性?", "back": "DisplayContent根据窗口的显示位置将窗口分组,隶属于同一DisplayContent的窗口显示在同一屏幕中,每个DisplayContent有唯一ID,添加窗口时通过displayId指定。不同DisplayContent的两个窗口在布局、显示顺序、动画处理上互不耦合,像一个孤岛,原本WMS全局性的操作变成DisplayContent内部的操作。"}, {"id": 71, "ch": 4, "chName": "WindowManagerService", "topic": "Z序与Surface", "front": "窗口的主序mBaseLayer和子序mSubLayer分别由哪两个函数计算?各描述什么?子窗口与父窗口的主序/子序关系如何?", "back": "主序由WindowManagerPolicy.windowTypeToLayerLw()计算,乘以TYPE_LAYER_MULTIPLIER再加TYPE_LAYER_OFFSET;子序由subWindowTypeToLayerLw()计算。主序描述窗口及其子窗口在所有窗口中的显示位置(越大越靠前);子序描述子窗口在兄弟窗口中的位置(越大越靠前)。父窗口主序取决于类型、子序为0;子窗口主序与父窗口相同、子序取决于其类型。"}, {"id": 72, "ch": 4, "chName": "WindowManagerService", "topic": "Z序与Surface", "front": "为什么TYPE_APPLICATION_MEDIA和TYPE_APPLICATION_MEDIA_OVERLAY的子序是负值?它们由什么控件创建?", "back": "这两个子窗口由SurfaceView控件创建(如视频回放、相机预览、游戏绘制),子序为负表示显示次序位于父窗口之后,这样才不会覆盖住父窗口中承载的其他控件(如播放器控制按钮)。作为对比,TYPE_APPLICATION_PANEL和TYPE_APPLICATION_ATTACHED_DIALOG子序为1,TYPE_APPLICATION_SUB_PANEL为2。"}, {"id": 73, "ch": 4, "chName": "WindowManagerService", "topic": "Z序与Surface", "front": "addWindowToListInOrderLocked()对子窗口、应用窗口、非应用窗口的排序规则分别是什么?", "back": "子窗口:相对父窗口按子序排序,负子序在父窗口之后、正子序在父窗口之前;子序相同时正子序的新窗口在前、负子序的新窗口在后。应用窗口:所有应用窗口初始主序都是21000,需与本应用其他窗口相邻,新窗口插到本应用其他窗口之前(STARTING_WINDOW永远最前,BASE_APPLICATION最后);若是第一个窗口则参照相邻应用窗口插入;无参照时按主序插入。非应用窗口:按主序排序,主序相同时新窗口在前。注意mWindows列表按显示顺序降序存储(列表靠前=显示靠后)。"}, {"id": 74, "ch": 4, "chName": "WindowManagerService", "topic": "Z序与Surface", "front": "assignLayersLocked()如何为窗口分配最终显示次序mLayer?同主序窗口如何处理?", "back": "遍历mWindows列表:若窗口主序唯一,则主序就是最终显示次序mLayer(curBaseLayer=curLayer=mBaseLayer);若若干窗口主序相同(经排序后必相邻),则第i个窗口的mLayer为主序基础上累加WINDOW_LAYER_MULTIPLIER偏移(如11000、11005、21000、21005...)。次序变化后会调用scheduleNotifyWindowLayersChangedIfNeededLocked()通知监听者。"}, {"id": 75, "ch": 4, "chName": "WindowManagerService", "topic": "Z序与Surface", "front": "mAnimLayer与mLayer的区别是什么?动画Z序矫正值如何计算?存在什么隐藏bug?", "back": "mLayer属于窗口管理体系(WindowState),偏向窗口管理;mAnimLayer属于动画体系(WindowStateAnimator/AppWindowAnimator),是Surface的实际显示次序。普通窗口mAnimLayer=mLayer;窗口附属Activity时加上AppWindowAnimator.animLayerAdjustment矫正:Animation.getZAdjustment()为ZORDER_TOP时+TYPE_LAYER_OFFSET(1000),ZORDER_BOTTOM时-1000,动画结束后mAnimLayer重新赋值为mLayer。隐藏bug:同主序窗口超过200个时mLayer可能超过22000,矫正后无法保证动画窗口位于同主序窗口之上。"}, {"id": 76, "ch": 4, "chName": "WindowManagerService", "topic": "Z序与Surface", "front": "addWindow()后窗口并没有Surface,最终显示次序是如何设置到Surface上的?", "back": "新建的窗口在addWindow()时仅完成注册和mLayer/mAnimLayer计算,尚无Surface。只有客户端执行session.relayout()后,WMS才为窗口创建Surface;将显示次序设置到Surface的代码位于WindowStateAnimator.prepareSurfaceLocked()函数中,通过Surface.setLayer()完成,最终由SurfaceFlinger按此次序混合输出。"}, {"id": 77, "ch": 4, "chName": "WindowManagerService", "topic": "窗口管理", "front": "为什么WALLPAPER类型窗口的主序与应用窗口相同(21000)?输入法窗口排序又有什么特殊性?", "back": "因为有的Activity指定android:windowShowWallpaper为true,要求以当前壁纸作为背景,WMS的做法是将WALLPAPER窗口放置到紧邻拥有此式样的窗口的下方,所以壁纸需要在所有APPLICATION窗口之间跳来跳去,为保证主序决定窗口顺序的原则,WALLPAPER使用了与APPLICATION相同的主序。输入法窗口则选择输入目标窗口并将自己放置于其上,本章不讨论这两个特殊例子(壁纸排序在第7章介绍)。"}, {"id": 78, "ch": 5, "chName": "Android 输入系统", "topic": "输入系统架构", "front": "Android输入系统的整体工作流程是什么?请按顺序说出从输入事件源头到终点的各个参与者。", "back": "Linux内核接收输入设备中断,将原始事件写入/dev/input/下的设备节点;InputReader通过EventHub从设备节点取出原始事件并翻译加工为Android输入事件,交给InputDispatcher;InputDispatcher根据WMS提供的窗口信息将事件派发给合适的窗口;窗口的ViewRootImpl再沿控件树将事件派发给感兴趣的控件。整个过程以InputManagerService(IMS)为核心。"}, {"id": 79, "ch": 5, "chName": "Android 输入系统", "topic": "输入系统架构", "front": "InputManagerService(IMS)分为哪两部分?各自负责什么?", "back": "IMS分为Java层和Native层两部分。Java层负责与WMS的通信;Native层则是InputReader和InputDispatcher两个输入系统关键组件的运行容器。"}, {"id": 80, "ch": 5, "chName": "Android 输入系统", "topic": "输入系统架构", "front": "EventHub在输入系统中的职责是什么?", "back": "EventHub直接访问所有设备节点,通过getEvents()函数将所有输入系统相关的待处理底层事件返回给使用者,包括原始输入事件和设备节点的增删事件。它是输入系统最底层的组件,隐藏了INotify、Epoll以及设备节点读取等底层操作。"}, {"id": 81, "ch": 5, "chName": "Android 输入系统", "topic": "输入系统架构", "front": "InputReaderPolicy和InputDispatcherPolicy的作用是什么?由哪个类实现其接口?", "back": "InputReaderPolicy为InputReader的事件加工提供策略配置(如键盘布局信息);InputDispatcherPolicy为派发过程提供策略控制,例如截取特定事件——典型例子是HOME键被截取到PhoneWindowManager中处理,阻止窗口收到HOME键按下事件。两者的接口(InputReaderPolicyInterface与InputDispatcherPolicyInterface)由Native层的NativeInputManager实现,但NativeInputManager通过JNI回调Java层IMS完成实际决策。"}, {"id": 82, "ch": 5, "chName": "Android 输入系统", "topic": "输入系统架构", "front": "WMS虽然不是输入系统的一员,但它对InputDispatcher的正常工作起了什么关键作用?", "back": "当新建窗口时,WMS为新窗口和IMS创建了事件传递所用的通道;同时WMS还将所有窗口的信息(包括可点击区域、焦点窗口等)实时更新到InputDispatcher中,使InputDispatcher能够正确地将事件派发到指定窗口。"}, {"id": 83, "ch": 5, "chName": "Android 输入系统", "topic": "输入系统架构", "front": "为什么书中把InputReader线程、InputDispatcher线程和窗口Looper线程比作\"三台水泵\"?", "back": "InputReader在其线程循环中不断从EventHub抽取原始输入事件,加工后放入InputDispatcher的派发队列;InputDispatcher在其线程循环中从派发队列取出事件,查找合适窗口并写入窗口的事件接收管道;窗口事件接收线程的Looper从管道中取出事件交给事件处理函数。三个线程首尾相接,像三台水泵一样一层层地将事件交付给事件处理函数。IMS.start()的作用就是按下Reader和Dispatcher这两台水泵的开关。"}, {"id": 84, "ch": 5, "chName": "Android 输入系统", "topic": "getevent与sendevent", "front": "getevent工具的作用是什么?它输出的一条原始事件包含哪几项信息?", "back": "getevent监听输入设备节点,当输入事件被写入节点时将其读出并打印,输出的是内核提供的最原始的事件(不做任何加工)。每条输出包含五项:时间戳、设备节点路径、事件类型、事件代码、事件值,且以十六进制输出。例如\"0001 0074 00000001\"中类型0x01表示按键事件,代码0x74是电源键扫描码,值0x01表示按下。"}, {"id": 85, "ch": 5, "chName": "Android 输入系统", "topic": "getevent与sendevent", "front": "sendevent工具的作用是什么?如何用它模拟一次电源键点击?执行两条命令的时间间隔有什么意义?", "back": "sendevent将原始事件写入设备节点以模拟用户输入,其参数(十进制)与getevent的输出对应。例如:adb shell sendevent /dev/input/event0 1 116 1(按下)和 adb shell sendevent /dev/input/event0 1 116 0(抬起),即可模拟点击电源键。两条命令的时间间隔即用户按住电源键的时长,若迟迟不执行第二条命令则会产生长按效果(出现关机对话框)。这一可读可写特性为自动化测试提供了高效途径。"}, {"id": 86, "ch": 5, "chName": "Android 输入系统", "topic": "IMS的构成", "front": "IMS在SystemServer中的启动分为哪两个阶段?启动过程中还做了哪些相关配置?", "back": "IMS的诞生分两个阶段:(1)创建新的IMS对象(new InputManagerService(context, wmHandler));(2)调用inputManager.start()完成启动。此外还在ServiceManager中发布IMS(Context.INPUT_SERVICE)、通过setWindowManagerCallbacks(wm.getInputMonitor())设置向WMS发起回调的callback对象,并通过display.setInputManager(inputManager)让DisplayManagerService把屏幕信息发送给输入系统作为事件加工依据。"}, {"id": 87, "ch": 5, "chName": "Android 输入系统", "topic": "IMS的构成", "front": "IMS的nativeInit()函数创建了什么对象?它的作用是什么?它实现了哪两个接口?", "back": "nativeInit()创建了NativeInputManager对象,其指针返回给Java层IMS保存在mPtr成员变量中。NativeInputManager是Native层组件与Java层IMS通信的桥梁,并实现了InputReaderPolicyInterface与InputDispatcherPolicyInterface两个接口(仅为策略提供接口实现,实际决策通过JNI回调Java层IMS完成)。"}, {"id": 88, "ch": 5, "chName": "Android 输入系统", "topic": "IMS的构成", "front": "NativeInputManager的构造函数和InputManager的构造函数分别创建了哪些关键对象?", "back": "NativeInputManager构造函数创建了EventHub和Native层的InputManager。InputManager构造函数创建了InputDispatcher和InputReader,其initialize()函数又创建了供二者运行的线程InputReaderThread与InputDispatcherThread。注意InputManager构造函数的readerPolicy与dispatcherPolicy参数都是NativeInputManager。"}, {"id": 89, "ch": 5, "chName": "Android 输入系统", "topic": "IMS的构成", "front": "InputManagerService.start()函数做了什么?为什么创建IMS后线程还未开始工作?", "back": "InputManager的创建过程只为InputReader与InputDispatcher创建了承载运行的线程,并未启动线程,各组件处于待命状态。start()函数的作用就是启动这两个线程,使InputReader与InputDispatcher开始工作。而窗口的Looper这台\"水泵\"在窗口创建时便已处于运行状态。"}, {"id": 90, "ch": 5, "chName": "Android 输入系统", "topic": "INotify", "front": "INotify机制的用途是什么?它有哪两个基本对象?各自如何创建和使用?", "back": "INotify是Linux内核提供的文件系统变化通知机制,可监控文件的新建、删除、读写等变化。它有两个基本对象(都用文件描述符表示):(1)inotify对象,对应一个队列,通过inotify_init()创建,当被监听事件发生时可通过read()读取事件信息;(2)watch对象,是一个二元组(监听目标路径+事件掩码),通过inotify_add_watch()添加,如inotify_add_watch(inotifyFd, \"/dev/input\", IN_CREATE | IN_DELETE)。事件信息用inotify_event结构体描述。"}, {"id": 91, "ch": 5, "chName": "Android 输入系统", "topic": "Epoll", "front": "Epoll机制解决了什么问题?它的三个接口函数分别是什么?", "back": "Epoll解决的是大量文件描述符偶发事件的监听问题:避免不断轮询或为每个描述符创建独立线程阻塞读取造成资源浪费,同时能对到来的事件快速响应。三个接口:(1)epoll_create(max_fds)创建epoll对象描述符;(2)epoll_ctl(epfd, op, fd, event)管理注册事件(op为EPOLL_CTL_ADD/DEL/MOD);(3)epoll_wait(epfd, events, maxevents, timeout)等待事件到来,返回时events数组中包含产生事件的描述符信息。"}, {"id": 92, "ch": 5, "chName": "Android 输入系统", "topic": "InputReader流程", "front": "C++层的Thread类与Java层的Thread类在用法上有什么显著不同?InputReader.loopOnce()的函数名由此如何而来?", "back": "C++的Thread类封装了pthread,内建了线程循环,并提供了threadLoop()纯虚函数:线程运行后内建循环会不断调用threadLoop(),只要它返回true就继续被调用,返回false才退出循环。而Java层Thread的run()是整个线程的全部,退出即线程完结。InputReaderThread仅重写threadLoop()并调用mReader->loopOnce(),因为loopOnce()会被内建循环反复调用而得名。"}, {"id": 93, "ch": 5, "chName": "Android 输入系统", "topic": "InputReader流程", "front": "InputReader.loopOnce()一次循环做了哪三步工作?", "back": "(1)通过EventHub的getEvents()抽取事件列表(存入mEventBuffer,返回事件个数;无事件时阻塞等待),事件分为原始输入事件和设备可用性变化事件(设备事件)两类;(2)若有事件,调用processEventsLocked()加工处理:对设备事件加载或移除设备配置信息,对原始输入事件进行转译、封装与加工后暂存到mQueuedListener;(3)调用mQueuedListener->flush()将暂存的所有输入事件一次性交付给InputDispatcher。"}, {"id": 94, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "EventHub的构造函数完成了哪些初始化工作?其中创建的wakeFds匿名管道有什么用途?", "back": "构造函数中:(1)用epoll_create()创建epoll对象(mEpollFd)监听设备节点可读;(2)用inotify_init()创建inotify对象(mINotifyFd),并inotify_add_watch()监听/dev/input下节点的IN_CREATE与IN_DELETE事件;(3)将mINotifyFd的可读事件注册进epoll(epoll_event.data.u32设为EPOLL_ID_INOTIFY)。同时创建了wakeFds匿名管道并把读取端可读事件注册进epoll:当InputReader阻塞在epoll_wait()时,向wakeFds写入端写任意数据即可唤醒InputReader线程处理请求。"}, {"id": 95, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "EventHub用RawEvent结构体表示事件,它包含哪些字段?EventHub定义了哪三个特殊事件类型来表示设备增删事件?", "back": "RawEvent包含五个字段:when(时间戳)、deviceId(EventHub自行分配的设备Id)、type(事件类型)、code(事件代码)、value(事件值),与getevent的输出四要素一致。设备增删事件用三个特殊类型表示:DEVICE_ADDED、DEVICE_REMOVED和FINISHED_DEVICE_SCAN(标志设备增删事件上报结束)。"}, {"id": 96, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "EventHub::getEvents()的本质是什么?什么是EventHub的\"监听周期\"?为什么需要事件池(mPendingEventItems)机制?", "back": "getEvents()的本质是通过epoll_wait()获取Epoll事件到事件池(mPendingEventItems数组),再对事件池中的事件进行消费的过程。从epoll_wait()调用开始到事件池中最后一个事件被消费完毕称为一个监听周期;由于buffer容量限制,一个监听周期可能包含多次getEvents()调用。事件池的根本原因是buffer容量限制:一次epoll_wait()可能返回多个设备节点的事件,一段时间内原始输入事件数量可能超过buffer容量,需要事件池缓存无法处理的epoll事件,下次调用时优先处理。"}, {"id": 97, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "EventHub::Device结构体描述一个输入设备,它存储哪几类信息?", "back": "主要包括:(1)设备节点信息——文件描述符fd、路径path、在输入系统中唯一标识设备的id;(2)厂商信息(identifier)——供应商、型号等,决定了配置文件与键盘映射表的加载路径;(3)设备特性信息——类别classes(可同时属于多个类别,如键盘、触控)及各类事件位掩码(keyBitmask等),直接影响InputReader加工事件的方式;(4)配置信息——configurationFile/configuration及键盘映射表(keyMap等)。另外还存储了力反馈相关的少量数据。所有Device对象保存在以设备Id为键的mDevices字典中。"}, {"id": 98, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "EventHub::openDeviceLocked()加载输入设备时做了哪些关键步骤?", "back": "(1)open()打开设备节点的文件描述符;(2)通过ioctl()获取设备厂商信息(identifier);(3)分配设备Id并创建Device结构体;(4)loadConfigurationLocked()加载配置信息;(5)通过ioctl(EVIOCGBIT等)获取事件位掩码,并据此为设备分配类别(classes);(6)用epoll_ctl将节点描述符的EPOLLIN可读事件注册进Epoll(data.u32设为设备Id而非fd);(7)addDeviceLocked()将Device加入mDevices字典,同时加入mOpeningDevices链表(保存已加载但尚未向InputReader发送DEVICE_ADDED事件的设备)。"}, {"id": 99, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "设备增删事件DEVICE_REMOVED、DEVICE_ADDED、FINISHED_DEVICE_SCAN的优先级顺序如何?它们是如何生成的?", "back": "优先级为DEVICE_REMOVED最高,DEVICE_ADDED次之,FINISHED_DEVICE_SCAN最低;getEvents()完成当前高优先级事件的生成之前不会生成低优先级事件,也不会处理Epoll事件(不生成原始输入事件)。生成方式:addDeviceLocked()/closeDeviceLocked()把设备放入mOpeningDevices/mClosingDevices链表,getEvents()根据这两个链表生成DEVICE_ADDED/DEVICE_REMOVED事件,全部生成完毕后再生成FINISHED_DEVICE_SCAN标志序列结束。卸载设备(closeDeviceLocked)的过程为:从Epoll注销监听、关闭描述符、从mDevices字典删除Device对象、加入mClosingDevices链表。受buffer容量限制,完整序列可能需要多次getEvents()调用才能返回。"}, {"id": 100, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "getEvents()如何通过INotify动态加载与卸载设备?为什么发现mINotifyFd可读时不立刻处理INotify事件?", "back": "流程:(1)遍历Epoll事件池,若某事件data.u32等于EPOLL_ID_INOTIFY且EPOLLIN,则设置mPendingINotify=true标记待处理;(2)待所有Epoll事件处理完毕后,调用readNotifyLocked()从mINotifyFd读取INotify事件,根据事件mask是IN_CREATE则openDeviceLocked()加载设备,否则closeDeviceByPathLocked()卸载设备;(3)deviceChanged置位后重新执行循环体,生成设备增删事件。不立刻处理的原因:此时进行设备加载/卸载不安全,因为其他Epoll事件可能包含来自即将被卸载设备的输入事件,必须等现有事件都处理完毕。"}, {"id": 101, "ch": 5, "chName": "Android 输入系统", "topic": "EventHub", "front": "getEvents()如何读取一个设备节点的原始输入事件?遇到EPOLLHUP如何处理?buffer满时如何保证下次继续读?", "back": "通过Epoll事件的data.u32字段在mDevices中找到对应Device,若事件为EPOLLIN则从设备fd中read()出input_event结构体数组,逐一将type/code/value转存为RawEvent放入buffer。若事件为EPOLLHUP(描述符被挂起)则调用closeDeviceLocked()卸载此设备。若buffer已满则立刻返回调用者,并将mPendingEventIndex减1,使下次getEvents()调用能继续处理这个未完成的Epoll事件,读取该设备剩余的输入事件。注意同一监听周期中,读完一个设备的所有输入事件之前不会读取其他设备的事件。"}, {"id": 102, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "控件系统概述", "front": "在直接使用Canvas+InputEventReceiver创建窗口时，开发者需要亲历亲为哪些繁琐的工作？控件系统如何解决这些问题？", "back": "需要：测量各UI元素的显示尺寸与位置、进行布局计算与绘制、内容变化时保证重绘区域尽可能小、分析InputEventReceiver接收的事件类型并确定响应的UI元素、处理来自WMS的窗口状态回调。控件系统（View与WindowManager两大组成部分）托管了绘制过程，把输入事件封装为可读的回调，并用WindowManager掩盖了客户端与WMS交互的复杂性。"}, {"id": 103, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "WindowManager体系", "front": "WindowManager、ViewManager、ViewGroup三者是什么关系？为什么要这样设计？", "back": "WindowManager是一个继承自ViewManager的接口；ViewManager定义了添加/删除控件和更新控件布局三个函数。ViewGroup是ViewManager的另一个实现者，是容器类控件的基类。可以这样类比：WindowManager相当于一个区域为整个屏幕的ViewGroup，其中各个窗口就是一个个View，二者都依据LayoutParams进行布局，核心工作一致，因此都继承自ViewManager。"}, {"id": 104, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "WindowManager体系", "front": "WindowManager体系中的四个层次（ViewManager、WindowManager、WindowManagerImpl、WindowManagerGlobal）各自的作用是什么？", "back": "ViewManager：最基本的接口，说明WindowManager与ViewGroup本质一致。WindowManager：继承ViewManager并增加getDefaultDisplay()（得知窗口添加到哪个屏幕）和removeViewImmediate()（要求调用返回前完成所有销毁工作）两个接口。WindowManagerImpl：接口实现者，自身无实际逻辑，工作委托给WindowManagerGlobal，但保存了mDisplay和mParentWindow两个只读成员决定窗口归属，实例可有多个。WindowManagerGlobal：最终实现者，维护进程中所有窗口信息，进程内单例。"}, {"id": 105, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "WindowManager体系", "front": "通过Context.getSystemService(Context.WINDOW_SERVICE)获取的WindowManager实例的真实类型是什么？其构造依赖什么对象？", "back": "真实类型是WindowManagerImpl。ContextImpl在静态构造函数中为WINDOW_SERVICE注册了ServiceFetcher，getService()时先获取Context中的Display对象（若无则通过DisplayManager获取主屏幕Display.DEFAULT_DISPLAY），再以该Display为参数创建WindowManagerImpl。Display对象与WMS中DisplayContent意义相同，都表示一块屏幕。"}, {"id": 106, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "窗口管理(WindowManagerGlobal)", "front": "在控件系统中，一个\"窗口\"由哪三个元素组成？WindowManagerGlobal如何存储它们？", "back": "窗口是控件(View)、布局参数(LayoutParams)与ViewRootImpl对象构成的三元组。WindowManagerGlobal将三者以相同的索引值分别保存在mViews、mParams、mRoots三个数组中，数组容量随进程内窗口数量变化（addView/removeView伴随数组的重建与拷贝）。作者认为用统一的WindowRecord类或ArrayList是更好的设计。"}, {"id": 107, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "窗口管理(WindowManagerGlobal)", "front": "WindowManagerGlobal.addView()的主要流程是什么？", "back": "1) 参数检查，若指定了parentWindow则先由父窗口调用adjustLayoutParamsForSubWindow()修改LayoutParams（仅token和mTitle两个属性）；2) 通过findViewLocked()保证同一View不会被添加两次；3) 创建ViewRootImpl对象；4) 将view、wparams、root以相同索引存入mViews/mParams/mRoots三个数组；5) 调用root.setView(view, wparams, panelParentView)，由ViewRootImpl向WMS添加窗口、申请Surface并触发重绘——这才是真正完成窗口的添加。"}, {"id": 108, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "窗口管理(WindowManagerGlobal)", "front": "addView()中父窗口修改新窗口LayoutParams.token的原则是什么？什么情况下parentWindow并非严格意义上的父窗口？", "back": "若新窗口类型为子窗口（类型在FIRST_SUB_WINDOW与LAST_SUB_WINDOW之间，如上下文菜单、弹出式菜单、游标），token被设为父窗口的ID（IWindow.asBinder()的返回值）；否则token被修改为父窗口所属Activity的ID（AppToken），这对TYPE_APPLICATION类型的窗口很重要。例如对话框窗口类型为TYPE_APPLICATION，并非子窗口，只是借用parentWindow的AppToken作令牌，此时parentWindow便不是严格意义上的父窗口。"}, {"id": 109, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "窗口管理(WindowManagerGlobal)", "front": "更新窗口布局和删除窗口分别由WindowManagerGlobal的哪些方法完成？核心动作是什么？由此可得出关于ViewRootImpl生命周期的什么结论？", "back": "更新布局由updateViewLayout()完成：保存新LayoutParams到控件和mParams数组，然后调用ViewRootImpl.setLayoutParams()使新参数生效（最终通知WMS调整Surface并重绘）。删除窗口则从mViews/mParams/mRoots三个数组中删除对应元素，并调用ViewRootImpl.die()要求其从WMS中删除窗口(IWindow)并释放资源。由此可得结论：ViewRootImpl的生命从setView()开始，到die()结束。另外，若Activity在destroy之前未销毁其附属窗口（对话框、弹出菜单等），会在WindowManagerGlobal中产生WindowLeaked异常。"}, {"id": 110, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "ViewRootImpl", "front": "ViewRootImpl的职责是什么？为什么说它是控件系统最关键的组件？", "back": "ViewRootImpl实现了ViewParent接口，作为控件树的根：它负责与WMS直接通信、管理Surface、触发控件的测量与布局、触发控件的绘制，同时也是输入事件的中转站。它还是WindowManagerGlobal工作的实际实现者，需处理来自WMS的事件（如窗口尺寸改变）。控件树的测量、布局、绘制及输入事件派发都由它触发，是整个控件系统正常运转的动力。"}, {"id": 111, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "ViewRootImpl", "front": "ViewRootImpl构造函数中初始化了哪些重要成员？各自的作用是什么？", "back": "mWindowSession：从WindowManagerGlobal获取的IWindowSession实例，是与WMS通信的代理；mDisplay：窗口要添加到的屏幕；mThread：保存当前线程，处理请求时校验线程一致性（不符则抛异常），体现了创建线程如何成为UI主线程；mDirty：收集无效区域（待重绘区域）的Rect；mWinFrame：与WMS中WindowState.mFrame保持一致的窗口位置尺寸；mWindow：W类型（IWindow.Stub子类），在WMS中作为窗口ID并接收WMS回调；mAttachInfo：存储控件树所贴附窗口的信息并派发给每个控件；mFallbackEventHandler：处理无人消费的输入事件（PhoneFallbackEventHandler）；mChoreographer：依附主线程、利用VSYNC安排重绘。"}, {"id": 112, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "ViewRootImpl", "front": "ViewRootImpl中mHandler(ViewRootHandler)与mChoreographer同时存在，二者如何分工？", "back": "mChoreographer处理消息具有VSYNC特性，主要用于处理与重绘相关的操作，但需等待VSYNC垂直同步事件触发，及时性稍逊。mHandler则用于把发生在其他线程的事件安排到主线程执行——典型的是WMS通过mWindow(IWindow.Stub的Bn端)引发的回调，这些回调发生在Binder线程池中，但会影响控件系统的重新测量、布局与绘制，因此需要mHandler将它们安排到主线程。mHandler与mThread都是为单线程模型服务的，目的是降低系统复杂度并减少锁开销。"}, {"id": 113, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "ViewRootImpl", "front": "mWinFrame与mWidth/mHeight有什么区别？ViewRootImpl如何借助二者的差异感知窗口尺寸变化？", "back": "mWinFrame记录窗口在WMS中的最新尺寸（与WindowState.mFrame同步），而mWidth/mHeight记录窗口在ViewRootImpl中的尺寸，二者绝大多数情况下相同。当窗口在WMS中被重新布局导致尺寸变化时，WMS会回调IWindow.Stub.resize()立即更新mWinFrame，此时mWinFrame与mWidth/mHeight产生差异，ViewRootImpl据此得知需对控件树重新布局；布局完成后mWidth/mHeight被赋值为mWinFrame的宽高，二者重新统一。窗口的Left/Top及ContentInsets/VisibleInsets则保存在mAttachInfo中供控件树查询。"}, {"id": 114, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "setView流程", "front": "ViewRootImpl.setView()完成了哪些关键工作？", "back": "1) 将控件树根保存到mView；2) 将LayoutParams拷贝到mWindowAttributes；3) 在添加窗口之前先调用requestLayout()在主线程安排一次\"遍历\"（performTraversals），保证执行顺序为：添加窗口->初次遍历->处理WMS回调；4) 创建mInputChannel（除非inputFeatures含INPUT_FEATURE_NO_INPUT_CHANNEL，此时窗口无法接受输入）；5) 通过mWindowSession.addToDisplay()将窗口添加到WMS（此后尚无有效Surface，需relayout）；6) 创建WindowInputEventReceiver（传入Looper.myLooper()，在主线程读取输入事件并触发onInputEvent()，这是onTouch()等回调中可直接进行UI操作的根本原因）；7) 调用view.assignParent(this)使ViewRootImpl成为控件树中所有控件的parent。"}, {"id": 115, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "performTraversals", "front": "为什么说performTraversals()是控件系统的\"心跳\"？它可分为哪五个工作阶段？", "back": "ViewRootImpl接收到的各种变化（WMS的窗口属性变化、控件树的尺寸变化、重绘请求等）都引发performTraversals()调用并在其中处理，onMeasure()/onLayout()/onDraw()等回调都在其执行过程中直接或间接引发；一旦它无法正常执行，整个控件树将处于僵死状态，故称心跳。五个阶段：预测量阶段、布局窗口阶段（通过IWindowSession.relayout()请求WMS调整窗口）、最终测量阶段（以WMS给出的实际窗口尺寸重新测量）、布局控件树阶段、绘制阶段。作者认为不宜简单划分为\"测量、布局、绘制\"三阶段，因为那隐藏了WMS的地位及控件树与WMS就窗口尺寸进行协商的过程。"}, {"id": 116, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量与MeasureSpec", "front": "MeasureSpec是什么？它的两个分量及三种SPEC_MODE分别是什么含义？", "back": "MeasureSpec是一个复合整型变量，用于传达父控件对子控件测量的指示：1~30位是SPEC_SIZE（父控件建议尺寸），31、32位是SPEC_MODE。SPEC_MODE取决于控件的LayoutParams.width/height：UNSPECIFIED(0)表示控件可无视SPEC_SIZE取任意尺寸；EXACTLY(1)表示子控件必须为SPEC_SIZE指定尺寸（对应确定值或MATCH_PARENT）；AT_MOST(2)表示子控件可取期望尺寸但不得大于SPEC_SIZE（对应WRAP_CONTENT）。MeasureSpec类用于组合与分离这两个分量。"}, {"id": 117, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量与MeasureSpec", "front": "performTraversals()预测量时，SPEC_SIZE的候选desiredWindowWidth/Height按什么原则取值？", "back": "1) 第一次\"遍历\"（mFirst为true，窗口尚未relayout、mWinFrame中无有效尺寸）时，使用应用可用的最大尺寸（DisplayMetrics的widthPixels/heightPixels）；2) 窗口为悬浮窗口（LayoutParams.width/height之一为WRAP_CONTENT）时，因测量结果可能需要更大空间以完整显示内容，也使用应用可用的最大尺寸；3) 其他情况使用窗口的最新尺寸（mWinFrame的宽高）。随后通过measureHierarchy()进行预测量。"}, {"id": 118, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量协商", "front": "measureHierarchy()针对WRAP_CONTENT的悬浮窗口进行\"测量协商\"的流程是怎样的？最不利情况下onMeasure()会被调用几次？", "back": "第一次协商：使用系统资源config_prefDialogWidth定义的期望宽度限制（baseSize）合成MeasureSpec并performMeasure()，若测量结果不含View.MEASURED_STATE_TOO_SMALL位则满意完成；第二次协商：若控件树认为宽度太小，取baseSize与desiredWindowWidth的中间值放宽限制再次测量；若仍不满意则放弃所有限制，用desiredWindowWidth/Height做最终测量（不再检查是否满意）。因此最不利情况下每个View.onMeasure()可能被连续调用三次，所以onMeasure()对性能的影响比onLayout()大。对MATCH_PARENT的非悬浮窗口则无协商过程。"}, {"id": 119, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量协商", "front": "控件树如何向父控件表达\"测量结果太小、内容无法完整显示\"？ViewRootImpl又是从哪里读取这个信息的？", "back": "测量结果不仅是尺寸，还是尺寸与状态的复合整型变量：0~30位表示尺寸，31、32位表示控件对结果是否满意。不满意时，控件以View.MEASURED_STATE_TOO_SMALL | measuredSize作为参数调用setMeasuredDimension()保存，父控件可通过子控件的getMeasuredWidthAndState()/getMeasuredHeightAndState()读取该状态位，从而调整给予的MeasureSpec并重新测量；若父控件无调整余地，也应将MEASURED_STATE_TOO_SMALL加入自己的测量结果交给它的父控件尝试。ViewRootImpl在measureHierarchy()中正是通过host.getMeasuredWidthAndState()检查该位来决定是否继续协商。"}, {"id": 120, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量原理", "front": "View.measure()方法本身实现了什么测量算法？它做了哪些检查和标记操作？", "back": "View.measure()没有实现任何测量算法，它的作用是引发onMeasure()调用并检查其行为的正确性。具体：仅当传入的MeasureSpec与上次（mOldWidthMeasureSpec/mOldHeightMeasureSpec）不同、或带PFLAG_FORCE_LAYOUT标记（强制重新布局）时才执行；先清除PFLAG_MEASURED_DIMENSION_SET标记，调用onMeasure()；然后检查onMeasure()是否调用了setMeasuredDimension()（否则抛IllegalStateException，因为开发者实现\"不可信\"）；最后加入PFLAG_LAYOUT_REQUIRED标记为随后的布局放行，并记录本次MeasureSpec。"}, {"id": 121, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量原理", "front": "\"强制重新布局\"（PFLAG_FORCE_LAYOUT）的机制是为了解决什么问题？", "back": "当子控件内容发生变化需要重新测量布局时，其父控件（及祖先）给予的MeasureSpec与上次相同，导致沿途父控件的measure()因条件不满足而直接跳过，子控件无法重新测量。解决办法是：从子控件沿控件树回溯到ViewRootImpl，依次调用沿途父控件的requestLayout()，该方法会在mPrivateFlags中加入PFLAG_FORCE_LAYOUT标记，使这些父控件的measure()得以执行，进而子控件有机会重新测量与布局。"}, {"id": 122, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量原理", "front": "onMeasure()的实现有哪些重要原则（针对View和ViewGroup）？", "back": "1) 控件测量时需把Padding计算在内；2) ViewGroup测量时需把子控件的Margin计算在内（Margin是父控件尺寸的一部分）；3) ViewGroup为子控件准备MeasureSpec时，SPEC_MODE取决于子控件LayoutParams（确定值或MATCH_PARENT用EXACTLY，WRAP_CONTENT用AT_MOST），SPEC_SIZE是ViewGroup所允许子控件的最大尺寸且需扣除Margin；4) 子控件的位置决定了其可用剩余尺寸及父控件尺寸（WRAP_CONTENT时），测量前必须先考虑；5) 添加MEASURED_STATE_TOO_SMALL要实事求是（如可先尝试文字换行），因为可能引发重新测量降低效率；6) 父控件应尽量响应子控件的TOO_SMALL标记调整MeasureSpec重测；7) 必须调用子控件的measure()而非直接调用onMeasure()，否则PFLAG_LAYOUT_REQUIRED不会加入，子控件将无法布局。"}, {"id": 123, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "测量原理", "front": "View.post()/postDelayed()为什么对未加入控件树的控件也能生效？其原理是什么？", "back": "View.post()的原理是把Runnable发送到ViewRootImpl的mHandler执行：控件已在控件树中时可通过mAttachInfo获取该Handler；控件不在控件树中、没有mAttachInfo可用时，Runnable会被添加到RunQueue队列。RunQueue是ViewRootImpl的静态成员（进程唯一、任何位置可访问），performTraversals()开始时会通过getRunQueue().executeActions()把RunQueue中的Runnable发送到mHandler执行。因此只要进程中有处于活动状态的ViewRootImpl，View.post()就可用。"}, {"id": 124, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "窗口尺寸调整", "front": "performTraversals()中判断\"窗口确实需要改变尺寸\"(windowShouldResize)需要满足哪些条件？为什么ViewRootImpl对此判断非常小心？", "back": "必要条件：layoutRequested为true（即requestLayout()被调用过；若仅是invalidate()重绘请求则走scheduleTraversals()，layoutRequested为false）；以及windowSizeMayChange为true（WMS单方面改变窗口尺寸且与测量结果有差异，或当前是悬浮窗口其尺寸由测量结果决定）。在此基础上满足其一：测量结果与mWidth/mHeight有差异；或悬浮窗口的测量结果与窗口最新尺寸（frame）有差异。之所以小心，是因为调整窗口尺寸必须调用WMS的performLayoutAndPlaceSurfacesLocked()，会导致WMS对系统中所有窗口重新布局并引发至少一个动画帧渲染，计算开销相当大，因此ViewRootImpl仅在必要时才\"惊动\"WMS。"}, {"id": 125, "ch": 6, "chName": "控件(ViewRoot)系统", "topic": "窗口尺寸调整", "front": "View.requestLayout()与View.invalidate()引发的遍历路径有何不同？", "back": "当控件内容变化需要调整尺寸时，调用requestLayout()，它会沿控件树向根部回溯，最终调用ViewRootImpl.requestLayout()，引发一次带测量与布局的performTraversals()调用（layoutRequested为true）。而当控件仅需重绘不需重新布局时（如背景色/前景色变化），会通过invalidate()回溯到ViewRootImpl，此时不通过requestLayout()而是通过scheduleTraversals()触发遍历，layoutRequested为false，表示窗口尺寸不需变化。invalidate()收集的无效区域最终存入ViewRootImpl的mDirty中。"}, {"id": 126, "ch": 7, "chName": "SystemUI", "topic": "SystemUI概述", "front": "SystemUI是什么?它包含哪些主要功能组件?", "back": "SystemUI是为用户提供系统级别信息显示与交互的一套UI组件,以普通APK形式存在于系统中。它包括屏幕顶端的状态栏、底部的导航栏、图片壁纸(ImageWallpaper)、RecentPanel(近期使用的APP列表),以及TakeScreenshotService(截屏)、PowerUI(低电警告)和RingtonePlayer(依托AudioService提供铃声播放)等服务。"}, {"id": 127, "ch": 7, "chName": "SystemUI", "topic": "SystemUI启动流程", "front": "SystemUIService是在什么时机、由谁、通过什么方法启动的?", "back": "在SystemServer的ServerThread中,核心系统服务启动完成后调用ActivityManagerService.systemReady()并传入goingCallback Runnable;AMS处理完systemReady()后回调该run()方法,其中调用startSystemUi()。startSystemUi()通过Context.startServiceAsUser()以ComponentName(\"com.android.systemui\", \"com.android.systemui.SystemUIService\")为目标启动SystemUIService,使用UserHandle.OWNER。"}, {"id": 128, "ch": 7, "chName": "SystemUI", "topic": "SystemUIService结构", "front": "SystemUIService的本质角色是什么?其onCreate()中做了什么?", "back": "SystemUIService本质是一个容器。onCreate()中遍历SERVICES数组,依次实例化其中定义的继承自SystemUI抽象类的子服务,设置mContext后调用其start()方法,之后便不再干预,任由子服务自行运行。SERVICES[0]存储的是字符串资源号,即状态栏/导航栏实现类的类名,另包含PowerUI和RingtonePlayer两个子服务。"}, {"id": 129, "ch": 7, "chName": "SystemUI", "topic": "状态栏/导航栏实现选择", "front": "SystemUIService如何为状态栏/导航栏选择不同的实现类?依据是什么?", "back": "onCreate()中根据IWindowManager.hasSystemNavBar()的返回值选择:为true时用R.string.config_systemBarComponent(集成布局,实现者为TabletStatusBar),为false时用R.string.config_statusBarComponent(分离布局,实现者为PhoneStatusBar)。其目的是在小屏幕上让状态栏与导航栏分离以占用更多垂直空间,在大屏幕(平板)上将二者集成为系统栏以节省垂直空间。"}, {"id": 130, "ch": 7, "chName": "SystemUI", "topic": "布局方案判定", "front": "PhoneWindowManager.setInitialDisplaySize()中,mHasSystemNavBar的取值策略是怎样的?", "back": "先计算屏幕短边的DP宽度shortSizeDp:当shortSizeDp小于600时,mHasSystemNavBar=false且mNavigationBarCanMove=true;当shortSizeDp在600到720之间时,mHasSystemNavBar=false且mNavigationBarCanMove=false。即较小的设备采用状态栏与导航栏分离的布局方案。"}, {"id": 131, "ch": 7, "chName": "SystemUI", "topic": "类继承结构", "front": "PhoneStatusBar与TabletStatusBar是什么关系?它们的共同父类是谁?", "back": "PhoneStatusBar(分离布局)与TabletStatusBar(集成布局)的本质功能一致——提供虚拟按键、显示通知信息等,区别仅在于布局及衍生出的定制行为。二者共同继承自BaseStatusBar抽象类,状态栏与导航栏的启动由PhoneStatusBar.start()完成。"}, {"id": 132, "ch": 7, "chName": "SystemUI", "topic": "BaseStatusBar.start()流程", "front": "BaseStatusBar.start()的启动流程可以分为哪几个关键步骤?", "back": "分为四步:(1)获取IStatusBarService(即StatusBarManagerService)的实例;(2)创建继承自IStatusBar.Stub的CommandQueue实例,通过mBarService.registerStatusBar()注册到IStatusBarService并取回信息副本(图标列表、通知、switches杂项等);(3)调用子类的createAndAddWindows()完成状态栏与导航栏的控件树及窗口创建;(4)应用取回的信息副本,如disable()、setSystemUiVisibility()、setImeWindowStatus()、添加图标和通知等。"}, {"id": 133, "ch": 7, "chName": "SystemUI", "topic": "IStatusBarService作用", "front": "IStatusBarService(即StatusBarManagerService)在SystemUI架构中扮演什么角色?为什么它要保存信息副本?", "back": "StatusBarManagerService是状态栏/导航栏向外界提供服务的前端接口,运行于system_server进程中,是SystemUI中状态栏在system_server中的代理。它保存所有需要状态栏显示的信息的副本,用于在SystemUI意外终止并重启后,在新的BaseStatusBar注册时将副本传回并恢复显示,避免信息丢失。"}, {"id": 134, "ch": 7, "chName": "SystemUI", "topic": "CommandQueue/IStatusBar", "front": "CommandQueue在SystemUI体系结构中起什么作用?", "back": "CommandQueue继承自IStatusBar.Stub,是IStatusBar的Bn端,位于BaseStatusBar中。通过registerStatusBar()注册后,其Bp端保存在StatusBarManagerService的mBar成员中,因此CommandQueue是StatusBarManagerService与BaseStatusBar之间进行通信的桥梁。"}, {"id": 135, "ch": 7, "chName": "SystemUI", "topic": "StatusBarManagerService权限", "front": "StatusBarManagerService.registerStatusBar()和setIcon()分别要求什么权限?为什么?", "back": "registerStatusBar()要求签名级权限android.permission.STATUS_BAR_SERVICE,以防止其他应用偷梁换柱、冒充状态栏实现者;setIcon()要求系统级权限android.permission.STATUS_BAR,因为修改系统状态区图标不允许普通应用进行(而添加通知等其他操作不需要此权限)。"}, {"id": 136, "ch": 7, "chName": "SystemUI", "topic": "StatusBarManagerService工作模式", "front": "以setIcon()为例,说明StatusBarManagerService处理状态栏操作请求的通用模式。", "back": "先进行权限检查,然后将请求信息保存到自己的副本中(如mIcons.setIcon()),再通过mBar(即CommandQueue的Bp端)将请求转发给BaseStatusBar由其真正完成显示。registerStatusBar()时同样先保存mBar,再把各类信息副本填充到出参中返回。"}, {"id": 137, "ch": 7, "chName": "SystemUI", "topic": "状态栏信息分类", "front": "状态栏需要显示的信息分为哪五大类?各由哪些类维护?", "back": "(1)通知信息——通过StatusBarManagerService接口由外界添加/移除;(2)时间信息——由继承自TextView的Clock控件显示,监听ACTION_TIME_TICK等广播;(3)电量信息——由BatteryController管理,监听BATTERY_CHANGED广播的ImageView;(4)信号信息——由NetworkController维护,监听WIFI_STATE_CHANGED_ACTION、ACTION_SIM_STATE_CHANGED等广播;(5)系统状态图标区——通过StatusBarManagerService.setIcon()接口修改,但对图标数量和意图有严格限制。"}, {"id": 138, "ch": 7, "chName": "SystemUI", "topic": "状态栏窗口创建", "front": "PhoneStatusBar.addStatusBarWindow()创建状态栏窗口时使用了哪些关键的WindowManager.LayoutParams参数?", "back": "宽为MATCH_PARENT,高来自getStatusBarHeight()(资源com.android.internal.R.dimen.status_bar_height,默认25dip);类型为TYPE_STATUS_BAR(使PhoneWindowManager分配较大layer值显示在其他窗口之上);flags含FLAG_NOT_FOCUSABLE(不接受按键)、FLAG_TOUCHABLE_WHEN_WAKING、FLAG_SPLIT_TOUCH,并添加FLAG_HARDWARE_ACCELERATED;像素格式为PixelFormat.TRANSLUCENT。创建流程是先makeStatusBarView()构建控件树,再mWindowManager.addView()。"}, {"id": 139, "ch": 7, "chName": "SystemUI", "topic": "卷帘与窗口参数变化", "front": "用户下拉状态栏卷帘时,状态栏窗口的LayoutParams会发生什么变化?为什么?", "back": "PhoneStatusBar通过WindowManager.updateViewLayout()将窗口高度由25dip改为MATCH_PARENT以充满屏幕,使卷帘可以满屏显示;同时移除FLAG_NOT_FOCUSABLE,使PhoneStatusBar能监听BACK键以收回卷帘。这说明了窗口创建后其LayoutParams是会动态变化的。"}, {"id": 140, "ch": 7, "chName": "SystemUI", "topic": "状态栏控件树", "front": "描述状态栏控件树的第一层结构:super_status_bar.xml的根控件及其子控件。", "back": "根控件是继承自FrameLayout的StatusBarWindowView,保存为mStatusBarWindow。它有两个直接子控件:(1)@layout/status_bar描述的布局,即用户平时所见的状态栏;(2)PanelHolder(继承自FrameLayout),即状态栏的卷帘,其下有@layout/status_bar_expanded(通知列表面板)和@layout/quick_settings(快速设定面板)两个子控件。"}, {"id": 141, "ch": 7, "chName": "SystemUI", "topic": "PanelHolder切换原理", "front": "PanelHolder如何在通知列表面板与快速设定面板之间切换显示?", "back": "利用ViewGroup.getChildDrawingOrder()方法:该方法的返回值影响子控件的绘制顺序和接收触摸事件的优先级。想显示status_bar_expanded面板时,将其绘制顺序放在最后,使其覆盖quick_settings并优先接收触摸;反之则把quick_settings的绘制顺序放到最后。"}, {"id": 142, "ch": 7, "chName": "SystemUI", "topic": "StatusBarView与三种状态", "front": "status_bar.xml的根控件StatusBarView有哪三个直接子控件?分别对应状态栏的什么工作状态?", "back": "(1)@id/notification_lights_out——ImageView,对应低辨识度模式:当应用在SystemUIVisibility中设置SYSTEM_UI_FLAG_LOW_PROFILE时,状态栏不显示信息,只在黑色背景中显示一个灰色圆点;(2)@id/status_bar_contents——LinearLayout,常态下各种信息的显示场所;(3)@id/ticker——含ImageSwitcher和TickerView,实现Ticker功能,新通知到来时以动画逐行显示通知内容。三棵子控件树随工作状态切换交替显示。"}, {"id": 143, "ch": 7, "chName": "SystemUI", "topic": "通知图标区与IconMerger", "front": "IconMerger与普通LinearLayout的区别是什么?moreIcon的作用是什么?", "back": "通知图标以StatusBarIconView的形式存放在IconMerger(继承自LinearLayout,保存为mNotificationIcons)中。IconMerger的特殊之处在于:若在onLayout()过程中发现内部StatusBarIconView的总宽度超过自身宽度,则将@id/moreIcon设为可见,告知用户有部分通知图标因空间不足被隐藏。这是因为system_icon_area宽度为WRAP_CONTENT优先占用空间,而notification_icon_area的weight为1只占剩余空间。"}, {"id": 144, "ch": 7, "chName": "SystemUI", "topic": "Notification关键字段", "front": "Notification类中tickerText与fullScreenIntent有何异同?各适合什么场景?", "back": "二者目的相同——让用户在第一时间了解通知内容。tickerText是通知添加时状态栏上逐行显示的文本,干扰性小;fullScreenIntent是通知添加时直接执行的PendingIntent(通常是启动Activity显示详情),它会打断用户当前正在进行的工作,强制性强得多,因此只应用于非常重要或紧急的事件(如来电、闹钟)。指定了fullScreenIntent时,状态栏会忽略tickerText。"}, {"id": 145, "ch": 7, "chName": "SystemUI", "topic": "通知的意图与notify流程", "front": "NotificationManager.notify()如何确定一条通知的意图?简述其提交流程。", "back": "notify(tag, id, notification)中,tag(String)与id(int)共同确定通知意图;当状态栏中已有相同意图的通知时会被新通知替换。流程:获取INotificationManager的Bp端代理,取发送者包名,调用service.enqueueNotificationWithTag(pkg, tag, id, notification, idOut, userId)提交给NotificationManagerService处理。对NMS而言,确定通知意图还需加上发送者包名,使不同应用的相同tag/id不冲突,同时也是出于信息安全考虑。移除通知用NotificationManager.cancel(tag, id)。"}, {"id": 146, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸系统架构", "front": "Android壁纸分为静态和动态两种,它们的本质区别与共同点是什么?", "back": "静态壁纸是一张图片,动态壁纸以动画为表现形式或可对用户操作作出反应。但二者本质统一:都以一个Service的形式运行在系统后台,并在类型为TYPE_WALLPAPER的窗口上绘制内容。静态壁纸是一种特殊的动态壁纸——它仅在窗口上渲染一张图片,不响应用户操作。"}, {"id": 147, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸系统架构", "front": "Android壁纸的实现与管理分为哪三个层次?各自负责什么?", "back": "1) WallpaperService与Engine:壁纸作为服务运行,Engine(内部类)负责壁纸窗口的创建与Surface维护,并提供生命周期、Surface状态、输入事件等回调,是壁纸实现的核心;2) WallpaperManagerService:系统服务,管理壁纸的运行与切换,通过WallpaperManager向外界提供接口,并提供创建壁纸窗口所需的窗口令牌;3) WindowManagerService:计算壁纸窗口的Z序、可见性并应用窗口动画。"}, {"id": 148, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸系统架构", "front": "Engine类在壁纸实现中的角色是什么?壁纸开发者如何使用它?", "back": "Engine是WallpaperService的内部类,实现了壁纸窗口的创建以及Surface的维护工作。它提供一系列可供子类重写的回调,用于通知壁纸的生命周期、Surface状态变化以及响应用户输入事件。开发者需要继承WallpaperService并重写onCreateEngine()返回自定义的Engine子类,通过重写这些回调完成壁纸开发。"}, {"id": 149, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸窗口与WMS", "front": "壁纸窗口(TYPE_WALLPAPER)的Z序计算与普通窗口有何不同?", "back": "其他窗口依照类型有固定的mBaseLayer和mSubLayer,并结合所属Activity的顺序或创建顺序计算Z序,因此相对固定。而壁纸窗口的Z序会根据其它窗口LayoutParams.flags中是否存在FLAG_SHOW_WALLPAPER标记而不断被调整。"}, {"id": 150, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸设置流程", "front": "设置动态壁纸的入口方法是什么?为什么第三方应用无法设置动态壁纸?", "back": "通过WallpaperManager.getIWallpaperManager().setWallpaperComponent()完成,参数为目标壁纸WallpaperService的ComponentName。getIWallpaperManager()返回WallpaperManagerService的Bp端,因此真正实现在WallpaperManagerService中:先获取当前用户的WallpaperData(mWallpaperMap为每个用户保存一个实例,用户切换时可据此恢复壁纸),再调用bindWallpaperComponentLocked()启动新壁纸服务。该方法要求签名级系统权限SET_WALLPAPER_COMPONENT,且getIWallpaperManager()未包含在SDK中,所以第三方应用无法设置动态壁纸。"}, {"id": 151, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸服务验证", "front": "bindWallpaperComponentLocked()对目标Service执行了哪三项验证?一个服务被当作壁纸必须满足什么条件?", "back": "1) Service必须声明android.permission.BIND_WALLPAPER作为其访问权限(签名级系统权限,防止被第三方应用随意启动);2) 必须能处理android.service.wallpaper.WallpaperService这个Action(即WallpaperService.SERVICE_INTERFACE,通过queryIntentServices查询确认);3) 必须在AndroidManifest.xml中提供名为android.service.wallpaper的meta-data,包含开发者、缩略图、描述文字及设置Activity等信息。"}, {"id": 152, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸服务验证", "front": "componentName参数为null时,bindWallpaperComponentLocked()如何确定默认壁纸?", "back": "先尝试从com.android.internal.R.string.default_wallpaper_component资源(位于res/values/config.xml,可定制)中获取默认壁纸的componentName;若该值为@null未指定,则使用IMAGE_WALLPAPER(ImageWallpaper,即静态壁纸)作为默认壁纸。"}, {"id": 153, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸服务绑定", "front": "bindWallpaperComponentLocked()在验证通过后做了哪些关键操作?", "back": "1) 创建WallpaperConnection(实现ServiceConnection和IWallpaperConnection.Stub,监听连接状态并支持跨进程通信);2) 通过Context.bindService()启动壁纸服务;3) 若当前用户未变,调用detachWallpaperLocked()销毁旧壁纸服务;4) 将componentName、connection、lastDiedTime(启动时间戳)保存到WallpaperData;5) 调用mIWindowManager.addWindowToken()向WMS注册TYPE_WALLPAPER类型的窗口令牌(保存在newConn.mToken中)。"}, {"id": 154, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸服务绑定", "front": "WallpaperService.onBind()返回什么对象?它有什么作用?", "back": "onBind()返回一个IWallpaperServiceWrapper实例。该类继承自IWallpaperService.Stub,保存了WallpaperService的实例,并实现唯一的接口attach()。当这个Binder对象传回WallpaperManagerService后,后者会调用attach()传递显示壁纸所需的一系列参数(包括窗口令牌)。"}, {"id": 155, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸服务绑定", "front": "WallpaperConnection.onServiceConnected()中做了哪三件事?", "back": "1) 将壁纸服务传回的IWallpaperService接口保存为mService(IWallpaperService.Stub.asInterface(service));2) 调用attachServiceLocked(),后者通过IWallpaperService.attach()把创建壁纸窗口所需的信息(conn、mToken、TYPE_WALLPAPER、isPreview、width、height)传给壁纸服务;3) 调用saveSettingsLocked()把当前壁纸运行状态保存到文件系统,以便系统重启或用户切换时恢复。"}, {"id": 156, "ch": 8, "chName": "Android 壁纸", "topic": "跨进程通信对象", "front": "壁纸创建过程中,WallpaperManagerService与壁纸服务之间存在哪三个跨Binder通信对象?各自职责是什么?", "back": "1) IWallpaperService(壁纸服务进程):唯一方法attach()用于在壁纸服务启动后接收窗口创建所需信息、完成初始化;2) WallpaperConnection(WMS侧,随IWallpaperService.attach()传递给壁纸服务):壁纸服务通过attachEngine()把IWallpaperEngineWrapper交给WMS保存,通过engineShown()通知壁纸显示完成;3) IWallpaperEngineWrapper(壁纸进程):Engine的封装者,是WMS对Engine进行请求与设置的唯一接口。前两者主要服务于创建阶段,后者用于运行阶段对Engine操作。"}, {"id": 157, "ch": 8, "chName": "Android 壁纸", "topic": "Engine创建", "front": "IWallpaperServiceWrapper.attach()收到参数后如何创建Engine?DO_ATTACH消息处理做了哪四步?", "back": "attach()创建IWallpaperEngineWrapper实例,其构造函数中创建HandlerCaller并发送DO_ATTACH消息。executeMessage()处理DO_ATTACH时:1) 调用mConnection.attachEngine(this)把IWallpaperEngineWrapper交给WallpaperConnection保存(此后WMS可通过它与Engine通信);2) 调用onCreateEngine()创建Engine(抽象方法,由开发者返回自定义子类);3) 将Engine加入WallpaperService.mActiveEngines列表;4) 调用engine.attach()完成窗口创建与第一帧绘制。"}, {"id": 158, "ch": 8, "chName": "Android 壁纸", "topic": "Engine创建", "front": "为什么一个WallpaperService中可能同时存在多个Engine?这说明了什么?", "back": "因为壁纸预览:当壁纸A已被设为当前壁纸时,系统中有一个对应的WallpaperService和一个Engine;此时LivePicker等工具预览壁纸A时,WallpaperService仍只有一个,但内部会变成两个Engine(实际壁纸与预览各一个)。这说明WallpaperService只是提供壁纸运行的场所,Engine才是真正的壁纸实现。"}, {"id": 159, "ch": 8, "chName": "Android 壁纸", "topic": "壁纸预览", "front": "LivePicker预览动态壁纸时,与正式设置壁纸在窗口类型上有何区别?", "back": "LivePicker不真的把壁纸交给WallpaperManagerService,而是自行启动对应壁纸服务,并要求其用TYPE_APPLICATION_MEDIA_OVERLAY类型创建窗口(而非TYPE_WALLPAPER),使壁纸窗口以子窗口形式衬在LivePicker窗口之下实现预览。此时isPreview参数为true,壁纸服务可根据该值调整行为。"}, {"id": 160, "ch": 8, "chName": "Android 壁纸", "topic": "Engine创建", "front": "Engine.attach()完成了哪些初始化工作?壁纸最终在哪一步显示出来?", "back": "Engine.attach()保存wrapper传递的信息,定制mSurfaceHolder(如setSizeFromLayout),通过WindowManagerGlobal.getWindowSession()获取与WMS通信的WindowSession(mWindow.setSession()),监听ACTION_SCREEN_ON/OFF以便屏幕关闭后停止动画渲染省电,调用onCreate(mSurfaceHolder)让子类修改SurfaceHolder属性(此时窗口尚未创建,属性在创建窗口时生效),最后调用updateSurface()根据SurfaceHolder属性创建窗口和Surface并进行第一次绘制——updateSurface()结束后新壁纸便显示出来,壁纸启动工作完成。"}, {"id": 161, "ch": 8, "chName": "Android 壁纸", "topic": "关键数据结构", "front": "WallpaperManagerService中有哪些重要数据结构?WallpaperData为何'只更新不新建'?", "back": "1) WallpaperInfo:存储壁纸的开发者、缩略图与描述信息;2) WallpaperConnection:壁纸服务与WMS的通信渠道,保存IWallpaperService、IWallpaperEngineWrapper、WallpaperInfo及窗口令牌等运行时信息;3) WallpaperData:保存壁纸的所有运行信息(ComponentName、WallpaperConnection、启动时间等),存于SparseArray类型的mWallpaperMap中,每个用户一个固定实例。切换壁纸时是更新当前用户的WallpaperData内容而非新建实例,以便用户切换后恢复壁纸。"}, {"id": 162, "ch": 8, "chName": "Android 壁纸", "topic": "工作线程", "front": "壁纸的工作线程由什么决定?为什么提供mCallbackLooper机制,后来为何又废除?", "back": "IWallpaperEngineWrapper构造时创建HandlerCaller(Handler的封装,额外提供executeOrSendMessage()方法),所有壁纸相关操作以消息形式发给mCaller,在executeMessage()中处理,因此mCaller所在线程即壁纸工作线程。默认运行在壁纸服务主线程(getMainLooper()),若WallpaperService.mCallbackLooper不为null则运行在其线程——这是为ImageWallpaper(SystemUI一部分,主线程要忙于状态栏/导航栏)减轻负担而设;但因可能带来同步问题,Android 4.4及以后版本已废除。"}, {"id": 163, "ch": 8, "chName": "Android 壁纸", "topic": "可靠性机制", "front": "WallpaperData.lastDiedTime的作用是什么?壁纸服务意外断开且存活时间很短时会怎样?", "back": "lastDiedTime与其说是死亡时间戳,不如说是启动时间戳(onServiceConnected时会更新)。当壁纸服务意外断开(非正常停止)时,系统用它检查此壁纸服务的存活时间;若存活时间小于特定时长,则认为该壁纸软件质量不可靠,选择改用默认壁纸而不是重启壁纸服务。"}];

const FLIP_SVG = '<svg class="flipicon" viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3M20 15a8 8 0 0 1-14 3" stroke-linecap="round"/><path d="M18 2v4h-4M6 22v-4h4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
let curCh = 0, query = '';

/* chapter chip list */
const chapters = [...new Set(DATA.map(c=>c.ch))];
chipsEl.innerHTML = `<button class="chip on" data-ch="0">全部 <span class="n">${DATA.length}</span></button>` +
  chapters.map(n=>{
    const cnt = DATA.filter(c=>c.ch===n).length;
    const name = DATA.find(c=>c.ch===n).chName;
    return `<button class="chip" data-ch="${n}">第${n}章 ${name} <span class="n">${cnt}</span></button>`;
  }).join('');

chipsEl.addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  curCh = +b.dataset.ch;
  chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b));
  render();
});

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* highlight code identifiers  裸英文标识符 → code 样式 */
function fmt(s){
  s = esc(s);
  s = s.replace(/([A-Za-z_][A-Za-z0-9_.]*\(\)|[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_][A-Za-z0-9_]*|m[A-Z][A-Za-z0-9_]*|[A-Z]{2,}[A-Za-z0-9_]*|FLAG_[A-Z_]+)/g, '<code>$1</code>');
  return s;
}

function render(){
  const q = query.trim().toLowerCase();
  const list = DATA.filter(c =>
    (curCh===0 || c.ch===curCh) &&
    (!q || (c.front+' '+c.back+' '+c.topic).toLowerCase().includes(q))
  );
  grid.innerHTML = list.length ? list.map(c=>`
    <div class="card" id="card-${c.id}">
      <div class="inner" tabindex="0" role="button" aria-label="第${c.ch}章卡片，按回车翻面">
        <div class="face front" style="--c:var(--c${c.ch})">
          <div class="chead">
            <span class="ctag">第${c.ch}章</span>
            <span class="topic">${esc(c.topic)}</span>
            <span class="qnum">#${String(c.id).padStart(3,'0')}</span>
          </div>
          <div class="qtext">${fmt(c.front)}</div>
          <div class="hint">${FLIP_SVG} 点击翻面看答案</div>
        </div>
        <div class="face back" style="--c:var(--c${c.ch})">
          <div class="chead">
            <span class="ctag">第${c.ch}章</span>
            <span class="topic">${esc(c.topic)}</span>
            <span class="qnum">答</span>
          </div>
          <div class="atext">${fmt(c.back)}</div>
          <div class="hint">${FLIP_SVG} 点击返回问题</div>
        </div>
      </div>
    </div>`).join('')
    : '<div class="empty">没有匹配的卡片，换个关键词试试</div>';
  document.getElementById('totalN').textContent = list.length;
  updateProgress();
}

/* flip interactions — 事件委托 */
grid.addEventListener('click', e=>{
  const inner = e.target.closest('.inner'); if(!inner) return;
  if (getSelection().toString()) return;   /* 复制文本时不翻面 */
  inner.closest('.card').classList.toggle('flip');
  updateProgress();
});
grid.addEventListener('keydown', e=>{
  const inner = e.target.closest('.inner'); if(!inner) return;
  if(e.key==='Enter' || e.key===' '){
    e.preventDefault();
    inner.closest('.card').classList.toggle('flip');
    updateProgress();
  }
});

function updateProgress(){
  const vis = [...grid.querySelectorAll('.card:not(.hidden)')];
  const flipped = vis.filter(c=>c.classList.contains('flip')).length;
  document.getElementById('doneN').textContent = flipped;
  document.getElementById('bar').style.width = vis.length ? (flipped/vis.length*100)+'%' : '0%';
}

/* search */
let st;
document.getElementById('search').addEventListener('input', e=>{
  clearTimeout(st);
  st = setTimeout(()=>{ query = e.target.value; render(); }, 200);
});

/* tools */
document.getElementById('flipAll').addEventListener('click', ()=>{
  grid.querySelectorAll('.card:not(.hidden)').forEach(c=>c.classList.add('flip'));
  updateProgress();
});
document.getElementById('resetAll').addEventListener('click', ()=>{
  document.getElementById('search').value=''; query='';
  curCh = 0;
  chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x.dataset.ch==='0'));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* chapter colors */
const hues = {1:'#8b7355',2:'#0f9d58',3:'#c05a2e',4:'#2f6db5',5:'#7a4fb0',6:'#b03a68',7:'#2e8b8b',8:'#6a7a20'};
let css='';
for(let i=1;i<=8;i++) css += `:root{--c${i}:${hues[i]}}`;
document.head.appendChild(Object.assign(document.createElement('style'),{textContent:css}));

render();
</script>
</body>
