题栏、菜单按钮等控件（在setContentView()时并没有在layout中放置它们）。除此之外，Window类还保存了窗口相关的重要信息，例如窗口ID（IWindow.asBinder()的返回值）以及窗口所属Activity的ID（即AppToken）。", "t": ["ViewRoot"]}, {"i": 235, "ch": 6, "sec": "6.2.1", "f": "WindowManagerImpl.addView()的实际工作委托给了谁？这个对象有什么特点？", "b": "委托给成员mGlobal，其类型为WindowManagerGlobal，通过WindowManagerGlobal.getInstance()获取。WindowManagerGlobal是单例模式——一个进程中最多仅有一个WindowManagerGlobal实例，所有WindowManagerImpl都是这个进程唯一实例的代理。", "t": ["ViewRoot"]}, {"i": 236, "ch": 6, "sec": "6.2.1", "f": "请描述WindowManager体系结构中四层（ViewManager、WindowManager、WindowManagerImpl、WindowManagerGlobal）各自的职责。", "b": "①ViewManager接口：最基本接口，定义添加/删除控件及更新布局三个函数，WindowManager继承它说明其与ViewGroup本质一致；②WindowManager接口：继承ViewManager的同时增加两个接口——getDefaultDisplay()（得知实例会把窗口添加到哪个屏幕）和removeViewImmediate()（要求在调用返回之前完成所有销毁工作）；③WindowManagerImpl类：接口实现者，自身无实际逻辑，工作交由WindowManagerGlobal完成，但保存了mDisplay与mParentWindow两个只读成员，实例在进程中可能有多个；④WindowManagerGlobal类：不继承上述任何接口，但它是WindowManager的最终实现者，维护当前进程中所有已添加窗口的信息，一个进程中仅有一个实例。", "t": ["ViewRoot"]}, {"i": 237, "ch": 6, "sec": "6.2.2", "f": "WindowManagerGlobal.addView()中，父窗口会通过adjustLayoutParamsForSubWindow()修改新窗口的哪些布局参数？目的是什么？", "b": "可能修改的只有LayoutParams.token和LayoutParams.mTitle两个属性。mTitle仅用于调试；修改token的目的是减少开发者负担——开发者不需要关心token应被设置为什么值，每个新窗口必须通过LayoutParams.token向WMS出示相应的令牌才可以被添加。", "t": ["ViewRoot"]}, {"i": 238, "ch": 6, "sec": "6.2.2", "f": "adjustLayoutParamsForSubWindow()中，父窗口为新窗口设置token的原则是什么？", "b": "如果新窗口的类型为子窗口（类型大于等于FIRST_SUB_WINDOW且小于等于LAST_SUB_WINDOW），则LayoutParams.token为其父窗口的ID（即IWindow.asBinder()的返回值）；否则token将被修改为父窗口所属Activity的ID（即AppToken），这对类型为TYPE_APPLICATION的新窗口非常重要（如对话框窗口）。", "t": ["ViewRoot"]}, {"i": 239, "ch": 6, "sec": "6.2.2", "f": "当且仅当什么情况下，addView()的parentWindow参数才是\"真正意义上的父窗口\"？举例说明。", "b": "当且仅当新窗口的类型为子窗口时。这类子窗口有上下文菜单、弹出式菜单、游标等，在WMS中它们对应的WindowState所保存的mAttachedWindow即是parentWindow所对应的WindowState。而另外一些窗口（如对话框窗口）类型为TYPE_APPLICATION，并不属于子窗口，但需要AppToken作为令牌，parentWindow只是将自己的AppToken赋予新窗口的LayoutParams.token，此时parentWindow并不是严格意义上的父窗口。", "t": ["ViewRoot"]}, {"i": 240, "ch": 6, "sec": "6.2.2", "f": "ViewRootImpl这个类名的含义是什么？它承担了哪些职责？", "b": "ViewRootImpl实现了一个控件树的根。它负责与WMS进行直接的通讯，负责管理Surface，负责触发控件的测量与布局，负责触发控件的绘制，同时也是输入事件的中转站。总之它是整个控件系统正常运转的动力所在，是本章最关键的组件。", "t": ["ViewRoot"]}, {"i": 241, "ch": 6, "sec": "6.2.2", "f": "WindowManagerGlobal用哪三个数组管理窗口信息？三者的关系是什么？作者对这种设计有何评价？", "b": "mViews、mParams、mRoots三个数组，以相同的索引值分别保存作为窗口的控件、布局参数以及ViewRootImpl。控件、布局参数与ViewRootImpl三者共同组成客户端的一个窗口——控件系统中的窗口就是这三者的三元组。作者不认同分别存储在三个数组中的设计，认为创建一个WindowManagerRecord（WindowRecord）类统一保存三元组可省去很多麻烦；同时由于数组容量随窗口数量变化，addView/removeView伴随数组新建、拷贝操作，作者认为ArrayList或CopyOnWriteArrayList是更好的选择。", "t": ["ViewRoot"]}, {"i": 242, "ch": 6, "sec": "6.2.2", "f": "WindowManagerGlobal.addView()的完整流程有哪几个关键步骤？哪一步才是\"真正意义上完成窗口的添加\"？", "b": "①参数检查后，若parentWindow不为null则调用parentWindow.adjustLayoutParamsForSubWindow(wparams)让父窗口修改子窗口的布局参数；②检查不允许同一个View被添加两次（findViewLocked），然后创建一个ViewRootImpl对象并调用view.setLayoutParams(wparams)；③将控件、布局参数、ViewRootImpl以相同索引保存在mViews、mParams、mRoots三个数组中——到此为止只是完成了窗口信息的添加；④调用root.setView(view, wparams, panelParentView)将控件设置给ViewRootImpl，这将导致ViewRootImpl向WMS添加新窗口、申请Surface以及托管控件在Surface上的重绘——这才是真正意义上完成了窗口的添加操作，也是控件能作为窗口显示在屏幕上的根本原因。", "t": ["ViewRoot"]}, {"i": 243, "ch": 6, "sec": "6.2.3", "f": "WindowManagerGlobal.updateViewLayout()更新窗口布局的流程是怎样的？", "b": "①将新的布局参数通过view.setLayoutParams(wparams)保存到控件中；②在mLock同步下通过findViewLocked(view, true)获取窗口在三个数组中的索引；③更新mParams[index]为新参数；④调用ViewRootImpl的setLayoutParams(wparams, false)使新的布局参数生效。布局参数变化（如width从100变为200）需通知WMS调整Surface的大小并让窗口重绘。", "t": ["ViewRoot"]}, {"i": 244, "ch": 6, "sec": "6.2.3", "f": "删除窗口需要做哪些工作？通过哪个函数要求ViewRootImpl删除窗口？由此可得出什么结论？", "b": "①从mViews、mParams、mRoots三个数组中删除此窗口对应的元素（控件、布局参数、ViewRootImpl）；②要求ViewRootImpl从WMS中删除对应的窗口(IWindow)并释放一切需要回收的资源。要求ViewRootImpl删除窗口并释放资源的方法是调用ViewRootImpl.die()函数。结论：ViewRootImpl的生命从setView()开始，到die()结束。", "t": ["ViewRoot"]}, {"i": 245, "ch": 6, "sec": "6.2.4", "f": "关于WindowManager的实现，书中有哪几条总结性结论？", "b": "①鉴于窗口布局和控件布局的一致性，WindowManager继承并实现了ViewManager接口；②通过getSystemService(WINDOW_SERVICE)获取的实例真实类型是WindowManagerImpl，它一旦被创建就确定了通过它创建的窗口属于哪块屏幕、哪个父窗口；③WindowManagerImpl除保存屏幕与父窗口外没有任何实质性工作，窗口管理都交由WindowManagerGlobal完成；④WindowManagerGlobal在一个进程中只有一个实例，在3个数组中统一管理进程中所有窗口的信息（控件、布局参数、ViewRootImpl三元素）；⑤除管理三元素外，WindowManagerGlobal将窗口的创建、销毁与布局更新等任务交付给ViewRootImpl完成。总之WindowManager的实现很轻量，窗口的创建、销毁与布局更新都指向ViewRootImpl。", "t": ["ViewRoot"]}, {"i": 246, "ch": 6, "sec": "6.2.4", "f": "WindowLeaked异常发生在哪里？其原因是什么？", "b": "WindowLeaked异常发生在WindowManagerGlobal中，其原因是Activity在destroy之前没有销毁其附属窗口（如对话框、弹出菜单等）。", "t": ["ViewRoot"]}, {"i": 247, "ch": 6, "sec": "6.3", "f": "ViewRootImpl的两重身份（实现了ViewParent接口）分别是什么？", "b": "①它实现了ViewParent接口，作为整个控件树的根部，是控件树正常运作的动力所在——控件的测量、布局、绘制以及输入事件的派发处理都由ViewRootImpl触发；②它是WindowManagerGlobal工作的实际实现者，因此还负责与WMS交互通信以调整窗口的位置大小，并对来自WMS的事件（如窗口尺寸改变等）作出相应的处理。", "t": ["ViewRoot"]}, {"i": 248, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl在哪里被创建？创建它的线程有什么特殊意义？", "b": "ViewRootImpl创建于WindowManagerGlobal的addView()方法中，而调用addView()方法的线程即是此ViewRootImpl所掌控的控件树的UI线程。构造函数中将当前线程保存到mThread，当ViewRootImpl处理来自控件树的请求（如请求重新布局、请求重绘、改变焦点等）时会检查发起请求的线程与mThread是否相同，不同则拒绝请求并抛出异常——这体现了创建ViewRootImpl的线程如何成为UI主线程。", "t": ["ViewRoot"]}, {"i": 249, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl构造函数中的mWindowSession是什么？从哪里获取？", "b": "mWindowSession是从WindowManagerGlobal.getWindowSession(context.getMainLooper())中获取的一个IWindowSession实例，它是ViewRootImpl和WMS进行通信的代理。", "t": ["ViewRoot"]}, {"i": 250, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl中的mDirty变量是什么？举例说明它的工作方式。", "b": "mDirty（一个Rect）用于收集窗口中的无效区域。无效区域是指由于数据或状态发生改变而需要重绘的区域。例如当应用程序修改了一个TextView的文字时，TextView会将自己的区域标记为无效区域，并通过invalidate()方法将这块区域收集到mDirty中，下次绘制时TextView便可将新的文字绘制在这块区域上。", "t": ["ViewRoot"]}, {"i": 251, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl中的W类型成员mWindow是什么？有什么作用？", "b": "mWindow = new W(this)，W是IWindow.Stub的子类。它将在WMS中作为新窗口的ID，并接收来自WMS的回调。", "t": ["ViewRoot"]}, {"i": 252, "ch": 6, "sec": "6.3.1", "f": "mAttachInfo为什么是控件系统中很重要的对象？它保存了哪些信息？如何派发？", "b": "mAttachInfo存储了当前控件树所贴附的窗口的各种有用信息，并且会派发给控件树中的每一个控件，这些控件将它保存在自己的mAttachInfo变量中。保存的信息有：WindowSession、窗口的实例（mWindow）、ViewRootImpl实例、窗口所属的Display、窗口的Surface以及窗口在屏幕上的位置等。当需要在一个View中查询与当前窗口相关的信息时，非常值得在mAttachInfo中搜索。", "t": ["ViewRoot"]}, {"i": 253, "ch": 6, "sec": "6.3.1", "f": "FallbackEventHandler是什么？其实现在哪个包中？", "b": "FallbackEventHandler是一个处理未经任何人消费的输入事件的场所。它如同PhoneWindowManager一样定义在android.policy包中，其实现为PhoneFallbackEventHandler，通过PolicyManager.makeNewFallbackEventHandler(context)创建。", "t": ["ViewRoot"]}, {"i": 254, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl中mHandler（ViewRootHandler）与mChoreographer分工有何不同？为什么两者同时存在并不重复？", "b": "mChoreographer依附于主线程，处理消息具有VSYNC特性，主要用于处理与重绘相关的操作；但由于它需要等待VSYNC垂直同步事件来触发对下一条消息的处理，及时性稍逊于mHandler。mHandler的作用是将发生在其他线程中的事件安排在主线程上执行——特指来自WMS、由mWindow（IWindow.Stub的Bn端）引发的回调（发生在Binder线程池中），这些回调会影响控件系统的重新测量、布局与绘制，因此需要mHandler将回调安排到主线程。mHandler与mThread两个成员都是为了单线程模型而存在的——Android的UI操作不是线程安全的，而且很多操作也是建立在单线程的假设之上（如scheduleTraversals()），采用单线程模型的目的是降低系统的复杂度，并降低锁的开销。", "t": ["ViewRoot"]}, {"i": 255, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl的mSurface成员在构造后是什么状态？何时才能实用？", "b": "mSurface是采用无参构造函数创建的一个Surface实例，此时是一个没有任何内容的空壳子，在WMS通过relayoutWindow()为其分配一块Surface之前尚不能实用。", "t": ["ViewRoot"]}, {"i": 256, "ch": 6, "sec": "6.3.1", "f": "mWinFrame与mWidth/mHeight都记录窗口尺寸，二者有何区别？二者不一致意味着什么？", "b": "mWinFrame（连同mPendingContentInsets、mPendingVisibleInsets）记录窗口在WMS中的最新状态，与WMS中的Frame保持同步——它既是relayoutWindow()的传出参数，也会在收到IWindow.Stub.resize()回调时立即更新；而mWidth/mHeight记录窗口在ViewRootImpl中的尺寸。二者在绝大多数情况下相同。当窗口在WMS中被重新布局导致尺寸变化时，mWinFrame会先被resize()回调更新，从而与mWidth/mHeight产生差异，此时ViewRootImpl即可得知需要对控件树进行重新布局以适应新的窗口变化；布局完成后mWidth/mHeight会被赋值为mWinFrame中的宽高，二者重新统一。另外，与mWidth/mHeight类似，窗口的位置信息Left/Top以及ContentInsets/VisibleInsets这四项信息也被保存在mAttachInfo中供控件树查询。", "t": ["ViewRoot"]}, {"i": 257, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl的创建过程由哪两个环节构成？各自完成什么？", "b": "由构造函数和setView()方法两个环节构成。构造函数主要进行重要成员的初始化（mWindowSession、mDisplay、mThread、mDirty、mWinFrame、mWindow、mAttachInfo、mFallbackEventHandler、mChoreographer等）；setView()则是创建窗口、建立输入事件接收机制的场所。", "t": ["ViewRoot"]}, {"i": 258, "ch": 6, "sec": "6.3.1", "f": "ViewRootImpl.setView()在添加窗口之前为什么要先调用requestLayout()？", "b": "requestLayout()会在主线程上安排一次\"遍历\"（即performTraversals()）。由于此遍历操作对初次遍历做了特殊处理，而来自WMS通过mWindow发生的回调会导致一些属性发生变化（如窗口尺寸、Insets以及窗口焦点等），有可能使初次遍历的现场遭到破坏，因此需要在添加窗口之前先发送一个遍历消息到主线程。这样在主线程上向主线程Handler发消息可以实现执行顺序：添加窗口→初次遍历→处理来自WMS的回调。", "t": ["ViewRoot"]}, {"i": 259, "ch": 6, "sec": "6.3.1", "f": "setView()中mInputChannel在什么条件下不会被创建？后果是什么？", "b": "仅当窗口的属性inputFeatures不含有INPUT_FEATURE_NO_INPUT_CHANNEL时才会创建mInputChannel；否则mInputChannel为空，从而导致此窗口无法接受任何输入事件。InputChannel是窗口接受来自InputDispatcher的输入事件的管道。", "t": ["ViewRoot"]}, {"i": 260, "ch": 6, "sec": "6.3.1", "f": "setView()中通过mWindowSession.addToDisplay()完成什么？此时窗口还缺什么？", "b": "将窗口添加到WMS中。完成之后mWindow已被添加到指定的Display上去，且mInputChannel（如果不为空）已准备好接受事件；只是由于这个窗口还没有进行过relayout()，因此它还没有有效的Surface可以进行绘制。添加失败的原因通常是权限问题、重复添加或token无效。随后setView()还调用view.assignParent(this)，ViewRootImpl将作为参数view的parent，因此ViewRootImpl可以从控件树中任何一个控件开始，通过回溯getParent()的方法得到。", "t": ["ViewRoot"]}, {"i": 261, "ch": 6, "sec": "6.3.1", "f": "WindowInputEventReceiver在哪个线程上触发输入事件的读取与onInputEvent()？这带来了什么重要效果？", "b": "创建WindowInputEventReceiver时第二个参数传递Looper.myLooper()，即mInputEventReceiver将在主线程上触发输入事件的读取与onInputEvent()。这是应用程序可以在onTouch()等事件响应中直接进行UI操作的根本原因。", "t": ["ViewRoot"]}, {"i": 262, "ch": 6, "sec": "6.3.2", "f": "为什么说performTraversals()是控件系统的心跳？", "b": "ViewRootImpl接收到的各种变化，如来自WMS的窗口属性变化、来自控件树的尺寸变化、重绘请求等都会引发performTraversals()的调用并在其中完成处理；View类及其子类的onMeasure()、onLayout()、onDraw()等回调也都是在performTraversals()的执行过程中直接或间接引发的。一次次的performTraversals()调用驱动着控件树有条不紊地工作，一旦此方法无法正常执行，整个控件树都将处于僵死状态。", "t": ["ViewRoot"]}, {"i": 263, "ch": 6, "sec": "6.3.2", "f": "书中将performTraversals()划分为哪五个工作阶段？各阶段做什么？", "b": "①预测量阶段：对控件树进行第一次测量（结果可通过mView.getMeasuredWidth()/Height()获得），计算出控件树显示其内容所需的尺寸即期望的窗口尺寸，onMeasure()沿控件树依次回调；②布局窗口阶段：根据预测量结果通过IWindowSession.relayout()向WMS请求调整窗口尺寸等属性，引发WMS重新布局并返回结果；③最终测量阶段：以窗口的实际尺寸对控件树进行最终测量（onMeasure()再次沿控件树回调）；④布局控件树阶段：确定控件的位置（测量确定尺寸，布局确定位置），onLayout()被回调；⑤绘制阶段：onDraw()被回调，对控件树进行绘制。", "t": ["ViewRoot"]}, {"i": 264, "ch": 6, "sec": "6.3.2", "f": "很多文章把performTraversals()划分为测量、布局、绘制三阶段，作者为什么反对这种划分？", "b": "因为这种划分隐藏了WMS在这个过程中的地位，并且没能体现出控件树对窗口尺寸的期望、WMS对窗口尺寸做最终的确定，最后以WMS给出的结果为准再次进行测量的协商过程。这个协商过程充分体现了ViewRootImpl作为WMS与控件树的中间人的角色。", "t": ["ViewRoot"]}, {"i": 265, "ch": 6, "sec": "6.3.2", "f": "MeasureSpec是什么？它由哪两个分量组成？SPEC_MODE的三个取值及其含义分别是什么？", "b": "MeasureSpec是一个复合整型变量，用于指导控件对自身进行测量，由父控件传达给onMeasure()的widthSpec/heightSpec参数。其1到30位为父控件建议尺寸（SPEC_SIZE），影响依SPEC_MODE不同而不同：①UNSPECIFIED(0)：控件测量时可无视SPEC_SIZE，可以是它所期望的任意尺寸；②EXACTLY(1)：子控件必须为SPEC_SIZE指定的尺寸，当LayoutParams.width/height为确定值或MATCH_PARENT时使用；③AT_MOST(2)：子控件可以是它期望的尺寸但不得大于SPEC_SIZE，当LayoutParams.width/height为WRAP_CONTENT时使用。Android提供MeasureSpec类用于组合/分离这两个分量。", "t": ["ViewRoot"]}, {"i": 266, "ch": 6, "sec": "6.3.2", "f": "performTraversals()预测量时，desiredWindowWidth/Height（SPEC_SIZE候选）按什么原则取值？", "b": "①第一次\"遍历\"（mFirst为true，窗口刚被添加到WMS、尚未relayout，mWinFrame中没有有效的窗口尺寸）时，使用应用可以使用的最大尺寸（DisplayMetrics的widthPixels/heightPixels）作为SPEC_SIZE候选；②窗口是悬浮窗口，即LayoutParams.width或height其中之一被指定为WRAP_CONTENT时，同样使用应用可用的最大尺寸作为候选；③在其他情况下，使用窗口的最新尺寸（mWinFrame的宽高）作为SPEC_SIZE候选。最后通过measureHierarchy()方法进行测量。悬浮窗口需要用最大尺寸候选的原因：MeasureSpec（AT_MOST）要求测量结果不得大于SPEC_SIZE，若取窗口当前尺寸，当悬浮窗口需要更大尺寸以完整显示其内容时（如为AlertDialog设置了更长的消息内容），将无法得到足够大的测量结果，导致内容无法完整显示。", "t": ["ViewRoot"]}, {"i": 267, "ch": 6, "sec": "6.3.2", "f": "非第一次遍历时，如果窗口最新尺寸与ViewRootImpl现有尺寸（mWidth/mHeight）不同，会产生哪三个结果？", "b": "①mFullRedrawNeeded = true，需要进行完整的重绘以适应新的窗口尺寸；②mLayoutRequested = true，需要对控件树进行重新布局；③windowSizeMayChange = true，因为控件树有可能拒绝接受新的窗口尺寸（如随后的预测量给出不同于窗口尺寸的测量结果），这时需要在窗口布局阶段尝试设置新的窗口尺寸。", "t": ["ViewRoot"]}, {"i": 268, "ch": 6, "sec": "6.3.2", "f": "RunQueue是什么？它如何保证View.post()/postDelayed()在控件未加入控件树时也可用？", "b": "RunQueue是ViewRootImpl的一个静态成员，即进程唯一，可以在进程的任何位置访问。View.post()/postDelayed()的原理是将Runnable发送到ViewRootImpl的mHandler；当控件已加入控件树时可通过AttachInfo轻易获取这个Handler，而控件不在控件树中没有mAttachInfo时，Runnable会被添加到RunQueue队列中。performTraversals()中会通过getRunQueue().executeActions(attachInfo.mHandler)把RunQueue中的Runnable发送到mHandler进而得到执行。所以无论控件是否显示在控件树中，View.post()/postDelayed()都可用，除非当前进程中没有任何处于活动状态的ViewRootImpl。", "t": ["ViewRoot"]}, {"i": 269, "ch": 6, "sec": "6.3.2", "f": "WMS单方面改变ContentInsets与VisibleInsets时，ViewRootImpl的处理有何差异？为什么？", "b": "ContentInsets描述了控件在布局时必须预留的空间，会影响控件树的布局，因此将其对应的insetsChanged标记为true，作为是否进行控件布局的条件之一；而VisibleInsets描述的是被遮挡的空间，ViewRootImpl在进行绘制时需要调整绘制位置以保证关键控件或区域（如正在进行输入的TextView）不被遮挡，VisibleInsets的变化并不会导致重新布局，所以仅仅将其保存到mAttachInfo中以便绘制时使用。", "t": ["ViewRoot"]}, {"i": 270, "ch": 6, "sec": "6.3.2", "f": "measureHierarchy()的\"测量协商\"是如何进行的？其目的是什么？", "b": "针对LayoutParams.width为WRAP_CONTENT的悬浮窗口：①第一次协商使用measureHierarchy()最期望的宽度限制（系统资源config_prefDialogWidth，定义于frameworks/base/core/res/res/values/config.xml）构造MeasureSpec并performMeasure()；②检查host.getMeasuredWidthAndState()是否带有View.MEASURED_STATE_TOO_SMALL位，若没有则控件树满意，测量完成；③否则第二次协商，使用最大宽度与期望宽度的中间值(baseSize+desiredWindowWidth)/2作为宽度限制再次测量并检查；④若仍不满意则放弃所有限制，以desiredWindowWidth/Height做最终测量（不再检查控件树是否满意）。目的是既避免AlertDialog等将长消息单行显示导致充满整个屏幕宽度的丑陋布局（横屏尤甚），又不至于在控件树真正需要足够横向空间（如悬浮窗口尽量大地显示照片）时限制过当。", "t": ["ViewRoot"]}, {"i": 271, "ch": 6, "sec": "6.3.2", "f": "最不利情况下，一次\"遍历\"中控件树的onMeasure()可能被调用多少次？这带来什么性能影响？", "b": "对于悬浮窗口，measureHierarchy()可以连续进行两次让步，因而最不利的情况下，在ViewRootImpl的一次\"遍历\"中控件树需要进行三次测量，即每个View的onMeasure()会被连续调用三次之多。所以相对于onLayout()，onMeasure()方法对性能的影响比较大。注意：对于非悬浮窗口（LayoutParams.width为MATCH_PARENT），不存在协商过程，直接使用给定的desiredWindowWidth/Height测量即可。performMeasure()的实现非常简单，直接调用mView.measure()方法，把measureHierarchy()给予的widthSpec与heightSpec交给mView；在最终测量后，若测量结果与ViewRootImpl当前窗口尺寸（mWidth/mHeight）不一致，则windowSizeMayChange置为true并作为measureHierarchy()的返回值。", "t": ["ViewRoot"]}, {"i": 272, "ch": 6, "sec": "6.3.2", "f": "View.measure()是final方法且不含测量算法，它究竟做了什么？在什么条件下才会真正执行测量？", "b": "View.measure()的作用在于引发onMeasure()的调用，并对onMeasure()行为的正确性进行检查。执行条件：①mPrivateFlags中含有PFLAG_FORCE_LAYOUT（强制重新布局），或②传入的widthMeasureSpec/heightMeasureSpec与上次记录的mOldWidthMeasureSpec/mOldHeightMeasureSpec不同。执行时：清除PFLAG_MEASURED_DIMENSION_SET标记→调用onMeasure(widthMeasureSpec, heightMeasureSpec)→检查onMeasure()是否调用了setMeasuredDimension()（否则抛IllegalStateException，因为onMeasure()的实现可能由开发者完成，而Android认为开发者是不可信的）→将PFLAG_LAYOUT_REQUIRED标记加入mPrivateFlags以便随后的布局操作放行→最后记录本次MeasureSpec。", "t": ["ViewRoot"]}, {"i": 273, "ch": 6, "sec": "6.3.2", "f": "什么是\"强制重新布局\"（PFLAG_FORCE_LAYOUT）？为什么需要它？", "b": "当控件树中一个子控件的内容发生变化需要重新测量和布局时，其父控件（以及更上层的父控件）所提供的MeasureSpec必定与上次测量时相同，导致从ViewRootImpl到这个控件的路径上的父控件measure()方法无法得到执行，进而子控件无法重新测量与布局。因此当子控件因内容变化时，会从子控件沿控件树回溯到ViewRootImpl，依次调用沿途父控件的requestLayout()方法，在requestLayout()中向mPrivateFlags加入PFLAG_FORCE_LAYOUT标记，使这些父控件的measure()方法得以顺利执行，进而该子控件有机会进行重新测量与布局。", "t": ["ViewRoot"]}, {"i": 274, "ch": 6, "sec": "6.3.2", "f": "setMeasuredDimension()如何保存测量结果？测量结果整数的31、32位有什么含义？", "b": "setMeasuredDimension()将测量结果保存在成员变量mMeasuredWidth与mMeasuredHeight中，并向mPrivateFlags添加PFLAG_MEASURED_DIMENSION_SET标记以证明onMeasure()保存了测量结果。测量结果与MeasureSpec类似，是测量状态与尺寸的复合整型变量：0至30位表示测量结果的尺寸，31、32位表示控件对测量结果是否满意（即父控件给予的MeasureSpec是否能使控件完整显示其内容）。满意时直接传递尺寸并保证31、32位为0；不满意时用View.MEASURED_STATE_TOO_SMALL | measuredSize作为参数传递，以告知父控件对MeasureSpec进行可能的调整。结果可通过getMeasuredWidthAndState()/getMeasuredHeightAndState()获得。", "t": ["ViewRoot"]}, {"i": 275, "ch": 6, "sec": "6.3.2", "f": "View.onMeasure()中View类的默认实现依据什么给出测量结果？ViewGroup类型控件的onMeasure()为什么复杂得多？", "b": "View类的onMeasure()仅仅根据背景Drawable或style中设置的最小尺寸作为测量结果。对于非ViewGroup的控件，实现相对简单，只要按照MeasureSpec的原则如实计算所需尺寸即可。而ViewGroup类型的控件不仅拥有自身需要显示的内容（如背景），它的子控件也是需要测量的内容，因此它不仅需要计算自身显示内容所需的尺寸，还要考虑其一系列子控件的测量结果——为此必须为每一个子控件准备MeasureSpec并调用每一个子控件的measure()函数。测量控件树的实质是测量控件树的根控件，完成控件树的测量之后，ViewRootImpl便得知了控件树对窗口尺寸的需求。", "t": ["ViewRoot"]}, {"i": 276, "ch": 6, "sec": "6.3.2", "f": "书中总结了onMeasure()实现应遵循哪些原则？", "b": "①控件测量时需将Padding尺寸计算在内，因为Padding是其尺寸的一部分；②ViewGroup测量时需将子控件的Margin尺寸计算在内，因为子控件的Margin是父控件尺寸的一部分；③ViewGroup为子控件准备MeasureSpec时，SPEC_MODE取决于子控件LayoutParams.width/height：MATCH_PARENT或确定尺寸时为EXACTLY，WRAP_CONTENT时为AT_MOST；SPEC_SIZE应理解为ViewGroup按其实现意图所允许子控件获得的最大尺寸，并且需扣除子控件的Margin；④虽然测量目的在于确定尺寸与位置无关，但子控件的位置是ViewGroup测量时必须首先考虑的——它既决定了子控件可用的剩余尺寸，也决定了父控件的尺寸（当父控件width/height为WRAP_CONTENT时）；⑤添加MEASURED_STATE_TOO_SMALL要实事求是，当一个方向空间不足时应考虑利用另一个方向的空间（如文字换行），因为添加该标记可能导致父控件重新测量从而降低效率；⑥当子控件测量结果包含MEASURED_STATE_TOO_SMALL时，只要有可能父控件就应调整MeasureSpec并重新测量；没有调整余地时也应将该标记加入自己的测量结果让上层尝试调整；⑦ViewGroup测量子控件必须调用子控件的measure()方法而不能直接调用onMeasure()——直接调用onMeasure()的最严重后果是子控件的PFLAG_LAYOUT_REQUIRED标记无法加入mPrivateFlags，导致子控件无法进行布局。", "t": ["ViewRoot"]}, {"i": 277, "ch": 6, "sec": "6.3.2", "f": "performTraversals()中确定窗口尺寸确实需要改变（windowShouldResize）需要满足哪些条件？", "b": "必要条件有两个：①layoutRequested为true，即ViewRootImpl.requestLayout()被调用过（View.requestLayout()会沿控件树向根部回溯最终调用到ViewRootImpl.requestLayout()从而引发一次performTraversals()）；②windowSizeMayChange为true（WMS单方面改变了窗口尺寸而控件树测量结果与该尺寸有差异，或当前窗口为悬浮窗口其测量结果将决定窗口的新尺寸）。在满足上述两个条件的情况下，以下条件满足其一：a)测量结果与ViewRootImpl保存的当前尺寸（mWidth/mHeight）有差异；b)悬浮窗口的测量结果与窗口的最新尺寸（frame）有差异。之所以layoutRequested是必要条件，是因为当控件仅需要重绘而不需要重新布局时（例如背景色或前景色发生变化），会通过invalidate()方法回溯到ViewRootImpl，此时不会通过requestLayout()而是通过scheduleTraversals()触发performTraversals()，layoutRequested为false即表示窗口尺寸不需要发生变化。", "t": ["ViewRoot"]}, {"i": 278, "ch": 6, "sec": "6.3.2", "f": "ViewRootImpl在判断是否需要调整窗口尺寸时为什么非常小心？", "b": "因为调整窗口尺寸所必须调用的WMS端函数performLayoutAndPlaceSurfacesLocked()会导致WMS对系统中的所有窗口进行重新布局，而且会引发至少一个动画帧渲染，其计算开销相当之大，因此ViewRootImpl仅在必要时才会惊动WMS。", "t": ["ViewRoot"]}, {"i": 279, "ch": 6, "sec": "6.3.2", "f": "预测量阶段除了为后续阶段做参数准备外，还准备了哪些重要参数？", "b": "①viewVisibilityChanged：View的可见性是否发生变化。由于mView是窗口的内容，mView的可见性即是窗口的可见性，当这一属性变化时需要通过WMS改变窗口的可见性；②LayoutParams：预测量阶段需要收集应用到LayoutParams的改动——一方面来自WindowManager.updateViewLayout()，另一方面来自控件树（例如View.setSystemUIVisibility()修改的SystemUIVisibility设置保存在控件自己的成员变量里），预测量阶段会通过ViewRootImpl.collectViewAttributes()方法遍历控件树中的所有控件收集这些设置，然后更新LayoutParams。", "t": ["ViewRoot"]}, {"i": 280, "ch": 7, "sec": "7.1", "f": "SystemUI是什么？它包含哪些功能组件？", "b": "SystemUI是为用户提供系统级别的信息显示与交互的一套UI组件。功能包括：屏幕顶端的状态栏、底部的导航栏、图片壁纸(ImageWallpaper)、RecentPanel(近期使用的APP列表)、TakeScreenshotService(音量下键+电源键截屏，由PhoneWindowManager监听组合键后发起请求)、PowerUI(监控剩余电量并显示低电警告)以及RingtonePlayer(依托AudioService为其他应用提供播放铃声的功能)。", "t": ["SystemUI"]}, {"i": 281, "ch": 7, "sec": "7.1.1", "f": "SystemUI以什么形式存在于系统中？它与普通Android应用有何异同？", "b": "SystemUI以一个APK的形式存在，与普通Android应用没有本质区别，同样通过Activity、Service、BroadcastReceiver这三大组件接受外界请求并执行操作，只不过它接受到的请求主要来自各个系统服务。", "t": ["SystemUI"]}, {"i": 282, "ch": 7, "sec": "7.1.1", "f": "SystemUIService在什么时机、由谁启动？", "b": "在负责启动各种系统服务的ServerThread中，核心系统服务启动完成后，ServerThread调用ActivityManagerService.systemReady()并传入一个名为goingCallback的Runnable；AMS处理完systemReady()后回调该Runnable的run()方法，其中调用startSystemUi()，通过Context.startServiceAsUser()以UserHandle.OWNER启动SystemUIService。", "t": ["SystemUI"]}, {"i": 283, "ch": 7, "sec": "7.1.1", "f": "SystemUIService的本质角色是什么？它如何组织内部功能？", "b": "SystemUIService是一个容器。其onCreate()中定义了SERVICES数组作为运行于其中的子服务列表：0号元素是一个字符串资源号(存储实现了状态栏/导航栏的类名)、PowerUI.class、RingtonePlayer.class。onCreate()依次实例化这些继承自SystemUI抽象类的子服务，设置Context并调用其start()方法，之后便不再做任何事，任由各子服务自行运行。", "t": ["SystemUI"]}, {"i": 284, "ch": 7, "sec": "7.1.1", "f": "SystemUIService的onCreate()根据什么为状态栏/导航栏选择实现类？", "b": "根据IWindowManager.hasSystemNavBar()的返回值选择：为true时选用R.string.config_systemBarComponent(集成布局)，为false时选用R.string.config_statusBarComponent(分离布局)。", "t": ["SystemUI"]}, {"i": 285, "ch": 7, "sec": "7.1.1", "f": "为什么Android要区分\"状态栏与导航栏分离\"和\"集成(系统栏)\"两种布局方案？", "b": "为了在大尺寸设备中更有效地利用屏幕空间。小屏幕设备(如手机)屏幕宽度有限，采用分离布局，让导航栏与状态栏占用更多垂直空间，保证导航栏虚拟按键足够大、状态栏信息量足够多；大屏幕设备(如平板)屏幕宽度大，足以在一条屏幕宽度内同时显示足够大的虚拟按键和足够多的状态栏信息，可将二者集成为系统栏以节省垂直空间占用。", "t": ["SystemUI"]}, {"i": 286, "ch": 7, "sec": "7.1.1", "f": "hasSystemNavBar()的返回值由什么决定？在哪个方法中体现选择策略？", "b": "取决于PhoneWindowManager.mHasSystemNavBar成员的取值。选择策略体现在PhoneWindowManager.setInitialDisplaySize()中：先计算屏幕短边的DP宽度shortSizeDp；shortSizeDp<600时mHasSystemNavBar=false且mNavigationBarCanMove=true；shortSizeDp<720时mHasSystemNavBar=false且mNavigationBarCanMove=false。", "t": ["SystemUI"]}, {"i": 287, "ch": 7, "sec": "7.1.1", "f": "分离布局与集成布局的状态栏实现者分别是谁？它们有何关系与异同？", "b": "分离布局的实现者是PhoneStatusBar，集成布局的实现者是TabletStatusBar。二者本质功能一致(提供虚拟按键、显示通知信息等)，区别仅在于布局不同及由此衍生的定制行为。它们继承自同一个父类BaseStatusBar。", "t": ["SystemUI"]}, {"i": 288, "ch": 7, "sec": "7.1.2", "f": "PhoneStatusBar.start()做了哪几件事？", "b": "①调用父类BaseStatusBar的start()方法进行初始化；②创建导航栏的窗口addNavigationBar()；③创建PhoneStatusBarPolicy(mIconPolicy)，它定义了系统通知图标的设置策略。", "t": ["SystemUI"]}, {"i": 289, "ch": 7, "sec": "7.1.2", "f": "BaseStatusBar.start()中mProvisioningObserver的作用是什么？", "b": "它是一个ContentObserver，监听Settings.Global.DEVICE_PROVISIONED设置的变化。该设置表示设备是否已归属于某一个用户(如新设备在初始化设置向导完成前为false)。当设备未归属于用户时，状态栏会禁用一些功能以避免信息泄露，mProvisioningObserver即用于监听归属状态变化以禁用/启用某些功能。", "t": ["SystemUI"]}, {"i": 290, "ch": 7, "sec": "7.1.2", "f": "IStatusBarService是什么？对SystemUI而言它的角色是什么？", "b": "IStatusBarService是一个由ServerThread启动、常驻system_server进程中的系统服务，为那些对状态栏感兴趣的其他系统服务定义了一系列API。但对SystemUI而言它更像一个客户端，因为IStatusBarService会将操作状态栏的请求发送给SystemUI并由后者完成请求。", "t": ["SystemUI"]}, {"i": 291, "ch": 7, "sec": "7.1.2", "f": "BaseStatusBar为什么要把自己注册到IStatusBarService中？信息副本机制解决了什么问题？", "b": "注册以声明本实例才是状态栏的真正实现者，IStatusBarService会将收到的请求转发给它。由于状态栏显示的信息并不属于状态栏自己，而是属于其他应用或系统服务，SystemUI可能意外终止；因此IStatusBarService保存了所有需要状态栏显示的信息的副本，新的状态栏实例启动并注册时，这些副本会伴随注册过程传递给状态栏并显示，从而避免信息丢失。", "t": ["SystemUI"]}, {"i": 292, "ch": 7, "sec": "7.1.2", "f": "CommandQueue在SystemUI通信体系中扮演什么角色？", "b": "CommandQueue继承自IStatusBar.Stub，是IStatusBar的Bn端。它被注册到IStatusBarService后，其Bp端保存在IStatusBarService的mBar成员中，因此它是IStatusBarService(StatusBarManagerService)与BaseStatusBar之间进行通信的桥梁。", "t": ["SystemUI"]}, {"i": 293, "ch": 7, "sec": "7.1.2", "f": "BaseStatusBar注册时从IStatusBarService取回哪些信息副本？", "b": "①StatusBarIconList iconList：系统状态区的状态图标列表(注册后由IStatusBarService填充状态名称字符串数组与StatusBarIcon图标资源数组)；②notificationKeys与notifications：通知区通知信息，前者存储用Binder表示的通知发送者ID列表，后者存储通知列表，二者通过索引号一一对应；③switches[7]：禁用功能列表、SystemUIVisibility、是否在导航栏显示虚拟菜单键、输入法窗口是否可见、输入法窗口是否消费BACK键、是否接入实体键盘、实体键盘是否启用；④binders。", "t": ["SystemUI"]}, {"i": 294, "ch": 7, "sec": "7.1.2", "f": "简述状态栏与导航栏启动的四个主要过程。", "b": "①获取IStatusBarService(运行于system_server的系统服务，接受操作状态栏/导航栏的请求并转发给BaseStatusBar，且保存信息副本)；②将继承自IStatusBar.Stub的CommandQueue实例注册到IStatusBarService以建立通信，并取回信息副本；③调用子类的createAndAddWindows()完成状态栏与导航栏的控件树及窗口的创建与显示；④使用从IStatusBarService取回的信息副本(disable、setSystemUiVisibility、topAppWindowChanged、setImeWindowStatus、setHardKeyboardStatus、添加状态图标与通知等)。", "t": ["SystemUI"]}, {"i": 295, "ch": 7, "sec": "7.1.3", "f": "IStatusBarService的实现者是谁？它在何时何地被创建？", "b": "实现者是StatusBarManagerService。与WindowManagerService、InputManagerService等系统服务一样，它在ServerThread中创建：new StatusBarManagerService(context, wm)后通过ServiceManager.addService(Context.STATUS_BAR_SERVICE, statusBar)注册为系统服务。", "t": ["SystemUI"]}, {"i": 296, "ch": 7, "sec": "7.1.3", "f": "StatusBarManagerService的构造函数做了哪些事？", "b": "①保存context与WindowManagerService；②通过mWindowManager.setOnHardKeyboardStatusChangeListener(this)监听实体键盘的状态变化；③用mIcons.defineSlots(res.getStringArray(R.array.config_statusBarIcons))初始化状态栏系统状态区的状态图标列表。", "t": ["SystemUI"]}, {"i": 297, "ch": 7, "sec": "7.1.3", "f": "StatusBarManagerService.registerStatusBar()做了什么？需要什么权限？", "b": "①enforceStatusBarService()进行权限检查，要求调用者具有签名级权限android.permission.STATUS_BAR_SERVICE，防止其他应用对状态栏与导航栏偷梁换柱；②将bar参数(CommandQueue的Bp端)保存到mBar成员中，此后通过mBar与BaseStatusBar通信；③依次为调用者返回信息副本：iconList.copyFrom(mIcons)、遍历mNotifications填充notificationKeys与notifications、填充switches杂项等。", "t": ["SystemUI"]}, {"i": 298, "ch": 7, "sec": "7.1.3", "f": "以setIcon()为例，说明StatusBarManagerService处理请求的工作方式。", "b": "setIcon()先通过enforceStatusBar()进行权限检查(要求系统级权限android.permission.STATUS_BAR，因为设置系统状态区图标不允许普通应用进行)，然后①将图标信息保存在副本mIcons中(mIcons.setIcon(index, icon))，②若mBar不为null则通过mBar.setIcon()将设置请求转发给BaseStatusBar。其他方法与此类似：先存副本、再经mBar转发。", "t": ["SystemUI"]}, {"i": 299, "ch": 7, "sec": "7.1.3", "f": "总结StatusBarManagerService的作用与工作原理。", "b": "①它是SystemUI中的状态栏与导航栏在system_server中的代理，所有对状态栏或导航栏有需求的对象都可通过获取其实例或Bp端达到目的，但使用者必须拥有完成操作的相应权限；②它保存了状态栏/导航栏所需的信息副本，用于SystemUI意外退出后的恢复；③工作方式：接到操作请求时先把请求信息保存到副本中，再通过mBar将请求发送给BaseStatusBar执行。", "t": ["SystemUI"]}, {"i": 300, "ch": 7, "sec": "7.1.4", "f": "画出/描述SystemUI的体系结构中各组成及职责。", "b": "①SystemUIService：一个普通的Android服务，以容器角色运行于SystemUI进程中，内部运行多个继承SystemUI抽象类的子服务；②IStatusBarService(即StatusBarManagerService)：状态栏导航栏向外界提供服务的前端接口，运行于system_server进程；③BaseStatusBar及其子类(PhoneStatusBar/TabletStatusBar)：状态栏与导航栏的实际实现者，运行于SystemUIService中；④IStatusBar(即SystemUI中的CommandQueue)：联系StatusBarManagerService与BaseStatusBar的桥梁；⑤SystemUI中还包含ImageWallpaper、RecentPanel、TakeScreenshotService等互相独立的Service/Activity等标准组件，可通过startService()/startActivity()启动。", "t": ["SystemUI"]}, {"i": 301, "ch": 7, "sec": "7.2", "f": "状态栏将需要显示的信息分为哪五类？", "b": "①通知信息：状态栏左侧显示图标并在下拉卷帘中显示详细信息，对信息种类与来源无限制，通过StatusBarManagerService的接口添加/移除；②时间信息：最右侧的数字时钟；③电量信息：数字时钟左侧的电池图标；④信号信息：电量信息左侧的一系列ImageView(Wifi、手机信号、飞行模式等)；⑤系统状态图标区：信号信息左侧、与通知信息隔岸相望的一列图标，通过StatusBarManagerService.setIcon()修改，但对显示内容有很强限制。", "t": ["SystemUI", "状态栏"]}, {"i": 302, "ch": 7, "sec": "7.2", "f": "状态栏的时间信息是如何实现的？", "b": "由一个名为Clock的继承自TextView的控件显示在状态栏最右侧。它监听ACTION_TIME_TICK、ACTION_TIME_CHANGED、ACTION_TIMEZONE_CHANGED以及ACTION_CONFIGURATION_CHANGED几个广播，广播到来时从Calendar类获取当前系统时间，字符串格式化后显示。时间信息的维护在状态栏内部完成，外界无法通过API修改其显示或行为。", "t": ["SystemUI", "状态栏"]}, {"i": 303, "ch": 7, "sec": "7.2", "f": "状态栏的电量信息与信号信息分别由哪些类维护？通过什么机制获取信息？", "b": "电量信息：被BatteryController类管理的一个电池图标ImageView，BatteryController监听android.intent.action.BATTERY_CHANGED广播从BatteryService获取电量信息并选择合适的电池图标。信号信息：被NetworkController类维护的一系列ImageView(Wifi图标、手机信号图标、飞行模式图标等)，NetworkController监听WIFI_STATE_CHANGED_ACTION、ACTION_SIM_STATE_CHANGED、ACTION_AIRPLANE_MODE_CHANGED等广播，在广播到来时显示、更改或移除相关ImageView。两者均在状态栏内部维护，外界无法干预。", "t": ["SystemUI", "状态栏"]}, {"i": 304, "ch": 7, "sec": "7.2.1", "f": "PhoneStatusBar.addStatusBarWindow()创建状态栏窗口的关键步骤是什么？", "b": "①通过getStatusBarHeight()获取状态栏高度(来自资源com.android.internal.R.dimen.status_bar_height，默认25dip)；②创建WindowManager.LayoutParams：宽度MATCH_PARENT、类型TYPE_STATUS_BAR、flags为FLAG_NOT_FOCUSABLE|FLAG_TOUCHABLE_WHEN_WAKING|FLAG_SPLIT_TOUCH，像素格式PixelFormat.TRANSLUCENT，并添加FLAG_HARDWARE_ACCELERATED启用硬件加速；③makeStatusBarView()创建状态栏控件树；④mWindowManager.addView(mStatusBarWindow, lp)创建窗口。", "t": ["SystemUI", "状态栏"]}, {"i": 305, "ch": 7, "sec": "7.2.1", "f": "从状态栏窗口的LayoutParams可以推断出哪些窗口行为？窗口创建后其LayoutParams会变化吗？", "b": "TYPE_STATUS_BAR类型使PhoneWindowManager为状态栏分配较大的layer值，使其可显示在其他应用窗口之上；FLAG_NOT_FOCUSABLE、FLAG_TOUCHABLE_WHEN_WAKING、FLAG_SPLIT_TOUCH定义了状态栏对输入事件的响应行为。通过窗口创建所用的LayoutParams推断窗口行为是分析需要创建窗口的模块的重要切入点。LayoutParams会变化：创建时高度为25dip且flags为不可接收按键事件；当用户按下状态栏导致卷帘下拉时，PhoneStatusBar会通过WindowManager.updateViewLayout()把窗口高度改为MATCH_PARENT(充满整个屏幕以使卷帘满屏显示)，并移除FLAG_NOT_FOCUSABLE，使PhoneStatusBar可以监听BACK键以收回卷帘。", "t": ["SystemUI", "状态栏"]}, {"i": 306, "ch": 7, "sec": "7.2.1", "f": "状态栏控件树第一层的结构是怎样的？", "b": "根控件是StatusBarWindowView(继承自FrameLayout)，其下有两个直接子控件：①@layout/status_bar描述的布局——用户平时所见的状态栏；②PanelHolder(继承自FrameLayout)——状态栏的卷帘，其下两个直接子控件@layout/status_bar_expanded(通知列表面板)和@layout/quick_settings(快速设定面板)。正常情况下只有status_bar可见且窗口高度为25dip。", "t": ["SystemUI", "状态栏"]}, {"i": 307, "ch": 7, "sec": "7.2.1", "f": "卷帘下拉效果是如何实现的？PanelHolder如何在两个面板间切换显示？", "b": "下拉：当StatusBarWindowView截获ACTION_DOWN触摸事件后，修改窗口高度为MATCH_PARENT，将PanelHolder设为可见并跟随用户触摸轨迹，实现卷帘下拉。切换：PanelHolder利用ViewGroup.getChildDrawingOrder()方法——该方法的返回值影响子控件的绘制顺序和接收触摸事件的优先级；希望显示status_bar_expanded面板时，把它的绘制顺序放在最后使其覆盖quick_settings并优先接受触摸事件，反之则将quick_settings的绘制顺序放在最后。", "t": ["SystemUI", "状态栏"]}, {"i": 308, "ch": 7, "sec": "7.2.1", "f": "status_bar.xml根控件StatusBarView有哪三个直接子控件？各对应什么工作状态？", "b": "①@id/notification_lights_out：一个ImageView，一般不可见，对应低辨识度模式——当应用在SystemUIVisibility中添加SYSTEM_UI_FLAG_LOW_PROFILE标记时，状态栏进入低辨识度模式，不显示任何信息，仅在黑色背景中显示一个灰色圆点；②@id/status_bar_contents：一个LinearLayout，状态栏上各种信息的显示场所(常态)；③@id/ticker：一个LinearLayout，包含一个ImageSwitcher和一个TickerView，对应Ticker状态——新通知到来时以动画方式逐行显示通知内容，使用户无需下拉卷帘即可了解内容。三棵子控件树随三种工作状态交替显示。", "t": ["SystemUI", "状态栏"]}, {"i": 309, "ch": 7, "sec": "7.2.1", "f": "@id/status_bar_contents包含哪些子控件？分别显示哪类信息？", "b": "通知信息显示在@id/notification_icon_area(LinearLayout)中：包含类型为StatusBarIconView的@id/moreIcon和类型为IconMerger(继承自LinearLayout)的@id/notificationIcons(保存为成员mNotificationIcons)。其余四种信息显示在@id/system_icon_area(LinearLayout)中：时间信息的@id/clock、电量信息的@id/battery、信号信息的@id/signal_cluster，以及容纳系统状态区图标的LinearLayout @id/statusIcons(保存为mStatusIcons)。", "t": ["SystemUI", "状态栏"]}, {"i": 310, "ch": 7, "sec": "7.2.1", "f": "IconMerger与普通LinearLayout的区别是什么？@id/moreIcon何时可见？", "b": "IconMerger继承自LinearLayout，通知图标以StatusBarIconView的形式存储在其中。区别在于：如果IconMerger在onLayout()过程中发现其内部容纳的StatusBarIconView总宽度超过了自身宽度，则会设置@id/moreIcon为可见，告知用户有部分通知图标因显示空间不够而被隐藏。", "t": ["SystemUI", "状态栏"]}, {"i": 311, "ch": 7, "sec": "7.2.1", "f": "为什么@id/system_icon_area宽度为WRAP_CONTENT而@id/notification_icon_area的weight为1？", "b": "这样system_icon_area将在状态栏右侧根据所显示图标的个数调整尺寸，而notification_icon_area占用状态栏左侧的剩余空间。这说明系统图标区将优先占用状态栏的空间进行信息显示——这也正是IconMerger类和@id/moreIcon存在的原因(通知图标空间不足时以moreIcon提示)。", "t": ["SystemUI", "状态栏"]}, {"i": 312, "ch": 7, "sec": "7.2.1", "f": "mPile是什么控件？作用是什么？", "b": "mPile是@layout/status_bar_expanded中类型为NotificationRowLayout的控件@id/latestItems，位于下拉卷帘中，是通知信息列表的容器。因此一条通知除把图标添加到mNotificationIcons(IconMerger)外，还需把详细信息(标题、描述等)添加到mPile中，使用户在下拉卷帘中可以看到它。", "t": ["SystemUI", "状态栏"]}, {"i": 313, "ch": 7, "sec": "7.2.1", "f": "状态栏控件树中makeStatusBarView()保存的几个重要成员变量及其职责分别是什么？", "b": "①mStatusBarWindow：整个状态栏的根控件，包含常态状态栏与下拉卷帘两棵子控件树；②mStatusBarView：常态下的状态栏，其三棵子树对应低辨识度模式、Ticker、常态三种工作状态；③mNotificationIcons：IconMerger实例，容纳通知图标，空间不足时显示moreIcon；④mTickerView：实现新通知到来时的逐行动画显示；⑤mStatusIcons：LinearLayout，即系统状态图标区；⑥mPile：NotificationRowLayout，下拉卷帘中通知列表的容器。", "t": ["SystemUI", "状态栏"]}, {"i": 314, "ch": 7, "sec": "7.2.2", "f": "Notification类中与图标、数目、点击/删除动作相关的关键字段有哪些？", "b": "①icon：图标资源id，显示在状态栏上，每条通知必须提供有效图标否则被忽略；②iconLevel：图标资源存在level时告知状态栏显示哪一个level；③number：int型，表示通知数目(如3条新短信只用一条通知并把number设为3，数字显示在图标上)；④contentIntent：PendingIntent，告知在下拉卷帘中点击本条通知时应执行的动作(常用于启动Activity查看详情)；⑤deleteIntent：PendingIntent，告知用户从下拉卷帘删除本条通知时应执行的动作(常用于终止后台工作)；⑥tickerText：通知被添加时状态栏逐行显示的文本。", "t": ["SystemUI", "通知"]}, {"i": 315, "ch": 7, "sec": "7.2.2", "f": "fullScreenIntent与tickerText是什么关系？使用fullScreenIntent应注意什么？", "b": "fullScreenIntent是一个PendingIntent，告知状态栏此信息被添加时应执行的动作(一般是启动Activity显示详细信息)。它是tickerText的替代设置：当Notification中指定了fullScreenIntent时，状态栏将忽略tickerText，因为二者目的都是让用户第一时间了解通知内容。但fullScreenIntent强制性明显更强，会打断用户当前正在进行的工作，因此应仅用于通知非常重要或紧急的事件，如来电或闹钟。", "t": ["SystemUI", "通知"]}, {"i": 316, "ch": 7, "sec": "7.2.2", "f": "Notification中声音、震动、LED相关字段、defaults以及contentView/bigContentView的含义是什么？", "b": "①sound与audioStreamType：指定播放通知声音的Uri及其音频流类型，默认为STREAM_NOTIFICATION；②vibrate：float数组，描述震动方式；③ledARGB/ledOnMS/ledOffMS：指定通知被添加到状态栏时LED指示灯的颜色、亮灯与熄灯时长(需硬件支持)；④defaults：指示声音、震动以及LED指示灯是否使用系统的默认行为；⑤contentView/bigContentView：RemoteView实例，用于定制通知在下拉卷帘中的显示形式，bigContentView可占用更多空间显示更详细内容，状态栏会根据自己的判断选择使用哪一个。", "t": ["SystemUI", "通知"]}, {"i": 317, "ch": 7, "sec": "7.2.2", "f": "Notification的flags字段可包含哪些标记？各是什么含义？", "b": "FLAG_SHOW_LIGHTS(要求使用LED指示灯)、FLAG_ONGOING_EVENT(通知描述一个正在进行的后台工作)、FLAG_INSISTENT(通知声音持续播放直到通知被移除或被用户查看)、FLAG_ONLY_ALERT_ONCE(任何时候通知被加入状态栏时只播放一次通知声音)、FLAG_AUTO_CANCEL(用户在下拉卷帘中点击通知时自动将其移出)、FLAG_FOREGROUND_SERVICE(此通知表示一个正以foreground形式运行的服务)。", "t": ["SystemUI", "通知"]}, {"i": 318, "ch": 7, "sec": "7.2.2", "f": "通知的priority字段有哪些级别？低优先级有什么影响？", "b": "priority描述通知的重要性级别，从低到高分为MIN(-2)、LOW(-1)、DEFAULT(0)、HIGH(1)四级。低优先级的通知信息有可能不会被显示给用户，或显示在通知列表中靠下的位置。", "t": ["SystemUI", "通知"]}, {"i": 319, "ch": 7, "sec": "7.2.2", "f": "描述NotificationManager.notify()的内部流程，其中tag、id、包名各起什么作用？如何移除一条通知？", "b": "流程：①getService()获取NotificationManagerService的Bp端代理(INotificationManager)；②mContext.getPackageName()获取信息发送者的包名；③调用service.enqueueNotificationWithTag(pkg, tag, id, notification, idOut, UserHandle.myUserId())提交给NotificationManagerService。tag(字符串)与id(int)对发送者而言一并确定通知的意图，相同意图的新通知会替换旧通知；对NMS而言，因为它要接受来自各个应用的通知，意图还需加上发送者包名——包名不同则相同tag与id的通知不会冲突，且出于信息安全考虑。移除通知：使用NotificationManager.cancel()方法，接受tag与id作为参数指明希望移除的通知的意图。", "t": ["SystemUI", "通知"]}, {"i": 320, "ch": 8, "sec": "8.1", "f": "Android壁纸分为哪几种？它们之间有什么本质联系？", "b": "壁纸分为静态与动态两种：静态壁纸是一张图片，动态壁纸以动画为表现形式或可对用户操作作出反应。二者本质统一：都以一个Service的形式运行在系统后台，并在一个类型为TYPE_WALLPAPER的窗口上绘制内容。静态壁纸是一种特殊的动态壁纸——仅在窗口上渲染一张图片且不对用户操作作出反应。", "t": ["壁纸"]}, {"i": 321, "ch": 8, "sec": "8.1", "f": "Android壁纸的实现与管理分为哪三个层次？各体现什么原理？", "b": "①WallpaperService与Engine：壁纸运行在一个Android服务(WallpaperService)中，Engine是其内部类，实现壁纸窗口的创建与Surface维护并提供生命周期等回调，是壁纸实现的核心——体现壁纸的实现原理；②WallpaperManagerService：系统服务，管理壁纸的运行与切换，通过WallpaperManager向外界提供操作壁纸的接口，并提供Engine创建窗口所用的窗口令牌——体现Android对壁纸的管理方式；③WindowManagerService：计算壁纸窗口的Z序、可见性以及为壁纸应用窗口动画——体现Android对壁纸窗口的管理方式。", "t": ["壁纸"]}, {"i": 322, "ch": 8, "sec": "8.1", "f": "WallpaperManagerService的主要职责有哪些？", "b": "用于管理壁纸的运行与切换，并通过WallpaperManager类向外界提供操作壁纸的接口。当通过WallpaperManager的接口进行壁纸切换时，WallpaperManagerService会取消当前壁纸的WallpaperService的绑定并启动新壁纸的WallpaperService；另外，Engine类进行窗口创建时所使用的窗口令牌也由WallpaperManagerService提供。", "t": ["壁纸"]}, {"i": 323, "ch": 8, "sec": "8.1", "f": "壁纸窗口(TYPE_WALLPAPER)的Z序计算与普通窗口有何不同？", "b": "普通窗口依照其类型有固定的mBaseLayer与mSubLayer，并结合其所属Activity的顺序或创建顺序计算Z序，因此Z序相对固定；而壁纸窗口的Z序会根据FLAG_SHOW_WALLPAPER标记在其他窗口LayoutParams.flags中的存在情况而不断地被调整。", "t": ["壁纸", "WMS"]}, {"i": 324, "ch": 8, "sec": "8.2.1", "f": "启动动态壁纸的方法是什么？有何权限与SDK限制？", "b": "通过调用WallpaperManager.getIWallpaperManager().setWallpaperComponent()完成，传入一个ComponentName参数告知WallpaperManagerService希望启动的壁纸的WallpaperService。getIWallpaperManager()返回WallpaperManagerService的Bp端。设置动态壁纸需要调用者拥有签名级系统权限android.permission.SET_WALLPAPER_COMPONENT。注意getIWallpaperManager()并没有作为SDK的一部分提供给开发者，因此第三方应用无法进行动态壁纸的设置。", "t": ["壁纸"]}, {"i": 325, "ch": 8, "sec": "8.2.1", "f": "setWallpaperComponent()中WallpaperData和mWallpaperMap的作用是什么？", "b": "WallpaperManagerService支持多用户，mWallpaperMap(SparseArray)中为每一个用户保存一个WallpaperData实例，保存与壁纸运行状态相关的信息，如WallpaperService的ComponentName、到WallpaperService的ServiceConnection等。发生用户切换时，可从中获取新用户的WallpaperData并通过其中的ComponentName重新启动该用户设置的壁纸。因此设置新壁纸时需获取当前用户的WallpaperData并更新其内容(而非新建实例)。", "t": ["壁纸"]}, {"i": 326, "ch": 8, "sec": "8.2.2", "f": "bindWallpaperComponentLocked()中componentName为null时如何确定壁纸？", "b": "表示使用默认壁纸：首先尝试从资源com.android.internal.R.string.default_wallpaper_component(位于res/values/config.xml，开发者可修改)获取默认壁纸的componentName；若该值未指定(为@null)，则使用ImageWallpaper作为默认壁纸，ImageWallpaper即静态壁纸。", "t": ["壁纸"]}, {"i": 327, "ch": 8, "sec": "8.2.2", "f": "一个Android服务可以被当作壁纸必须满足哪三个条件？", "b": "①该服务必须以android.permission.BIND_WALLPAPER作为其访问权限(签名级系统权限，防止壁纸服务被第三方应用意外启动)；②该服务必须被声明为可以处理android.service.wallpaper.WallpaperService这个Action(WallpaperManagerService会用这个Action进行绑定，绑定前会通过queryIntentServices查询所有能处理该Action的服务并确认目标服务在结果之中)；③该服务必须在其AndroidManifest.xml中提供一个名为android.service.wallpaper的meta-data，提供动态壁纸的开发者、缩略图与描述文字等信息。", "t": ["壁纸"]}, {"i": 328, "ch": 8, "sec": "8.2.2", "f": "WallpaperInfo是什么？包含哪些内容？信息来源是什么？", "b": "WallpaperInfo用于解析并存储壁纸服务的描述信息，内容包括壁纸的开发者、缩略图、简单的描述文字以及用于对该壁纸进行参数设置的Activity的名字等。其内容来自壁纸所在应用AndroidManifest.xml中名为android.service.wallpaper的meta-data所指向的xml文件，创建于WallpaperManagerService.bindWallpaperComponentLocked()方法中。", "t": ["壁纸"]}, {"i": 329, "ch": 8, "sec": "8.2.2", "f": "WallpaperConnection是什么？有什么特点与作用？", "b": "WallpaperConnection创建于bindWallpaperComponentLocked()中。它不仅实现了ServiceConnection接口用于监听WallpaperManagerService与壁纸服务之间的连接状态，还实现了IWallpaperConnection.Stub(支持跨进程通信)。服务绑定成功后的onServiceConnected()中，其实例会被发送给WallpaperService，作为WallpaperService向WallpaperManagerService通信的桥梁。它只定义了两个接口：attachEngine()与engineShown()，同时它还保存IWallpaperService、IWallpaperEngineWrapper、WallpaperInfo以及窗口令牌等运行时信息。", "t": ["壁纸"]}, {"i": 330, "ch": 8, "sec": "8.2.2", "f": "bindWallpaperComponentLocked()在验证通过后主要做了哪些事情？", "b": "①创建WallpaperConnection；②通过Context.bindService()(flags为Context.BIND_AUTO_CREATE)启动指定壁纸服务；③若壁纸属于当前用户且存在旧壁纸，调用detachWallpaperLocked(mLastWallpaper)销毁旧壁纸服务；④将新壁纸服务的componentName、connection及启动时间戳保存到WallpaperData中(wallpaper.lastDiedTime=SystemClock.uptimeMillis())；⑤若为当前用户，向WMS调用mIWindowManager.addWindowToken(newConn.mToken, TYPE_WALLPAPER)注册一个WALLPAPER类型的窗口令牌(令牌保存在WallpaperConnection.mToken中，随其创建而创建)，并设置mLastWallpaper。", "t": ["壁纸"]}, {"i": 331, "ch": 8, "sec": "8.2.2", "f": "WallpaperData.lastDiedTime的作用是什么？", "b": "与其说是壁纸的死亡时间戳，不如说是启动时间戳。它用于在壁纸服务意外断开(非正常停止)时检查此壁纸服务的存活时间：当存活时间小于一个特定时长时，会认为这个壁纸的软件质量不可靠，从而选择使用默认壁纸而不是重启这个壁纸服务。", "t": ["壁纸"]}, {"i": 332, "ch": 8, "sec": "8.2.2", "f": "WallpaperService.onBind()返回什么？为什么需要它？", "b": "返回一个新建的IWallpaperServiceWrapper实例。它继承自IWallpaperService.Stub，保存了WallpaperService的实例，且只实现唯一接口attach()。WallpaperManagerService拿到这个Binder对象后，会调用attach()把显示壁纸所必需的包括窗口令牌在内的一系列参数传递给壁纸服务，以完成壁纸的初始化。", "t": ["壁纸"]}, {"i": 333, "ch": 8, "sec": "8.2.2", "f": "WallpaperConnection.onServiceConnected()回调中做了哪三件事？", "b": "①更新壁纸的启动时间戳mWallpaper.lastDiedTime；②mService=IWallpaperService.Stub.asInterface(service)保存壁纸服务传回的IWallpaperService接口，然后调用attachServiceLocked(this, mWallpaper)——它进而调用IWallpaperService.attach()将壁纸服务创建窗口所需的信息传递过去；③saveSettingsLocked(mWallpaper)将当前壁纸的运行状态保存到文件系统中，以便在系统重启或用户切换时恢复。", "t": ["壁纸"]}, {"i": 334, "ch": 8, "sec": "8.2.2", "f": "IWallpaperService.attach()的参数有哪些？各是什么含义？", "b": "attach(conn, conn.mToken, WindowManager.LayoutParams.TYPE_WALLPAPER, false, wallpaper.width, wallpaper.height)：①conn为WallpaperConnection，壁纸服务通过它向WallpaperManagerService通信；②conn.mToken是bindWallpaperComponentLocked()中向WMS注册过的窗口令牌，是壁纸服务有权添加壁纸窗口的凭证；③TYPE_WALLPAPER指明需添加的窗口类型(例外：LivePicker预览时要求使用TYPE_APPLICATION_MEDIA_OVERLAY)；④false为isPreview，指示启动壁纸服务的意图(实际用作壁纸为false，预览为true)，壁纸服务可据此调整行为；⑤⑥为壁纸宽度与高度。", "t": ["壁纸"]}, {"i": 335, "ch": 8, "sec": "8.2.2", "f": "为什么WallpaperConnection单独定义attachEngine()和engineShown()接口，而不放在WallpaperManager中？", "b": "因为attachEngine()与engineShown()是只有WallpaperService才需要用到的、它与WallpaperManagerService之间比较底层且私密的交流，放在通用的接口WallpaperManager中并不合适。其中attachEngine()尤为重要：Engine才是壁纸实现的核心而WallpaperService只是承载容器，WallpaperManagerService更关心Engine，因此WallpaperService完成Engine创建后会通过attachEngine()把Engine对象的引用交给WallpaperManagerService。", "t": ["壁纸"]}, {"i": 336, "ch": 8, "sec": "8.2.2", "f": "壁纸窗口类型为TYPE_WALLPAPER有什么例外？动态壁纸预览是如何实现的？", "b": "例外是壁纸预览：在LivePicker应用中选择动态壁纸时会先进行预览。预览并不是真的把壁纸设置给WallpaperManagerService，而是LivePicker自行启动对应的壁纸服务，并要求壁纸服务使用TYPE_APPLICATION_MEDIA_OVERLAY类型创建窗口，这样壁纸服务创建的窗口会以子窗口的形式衬在LivePicker的窗口之下，从而实现动态壁纸的预览(此时attach()的isPreview参数为true)。", "t": ["壁纸"]}, {"i": 337, "ch": 8, "sec": "8.2.2", "f": "IWallpaperServiceWrapper.attach()做了什么？由此创建了哪个对象？", "b": "它使用WallpaperManagerService提供的参数(conn、windowToken、windowType、isPreview、reqWidth、reqHeight)构造一个IWallpaperEngineWrapper实例。IWallpaperEngineWrapper继承自IWallpaperEngine.Stub(支持跨Binder调用)，它将创建并封装Engine实例，并作为WallpaperManagerService与Engine进行通信的桥梁。", "t": ["壁纸"]}, {"i": 338, "ch": 8, "sec": "8.2.2", "f": "IWallpaperEngineWrapper实例在attach()中创建后没有被任何成员变量引用，为什么不会被垃圾回收？", "b": "其构造函数中创建了HandlerCaller并保存自身引用，随后发送DO_ATTACH消息。sendMessage()使Message被目标线程的MessageQueue引用，Message引用对应的Handler，Handler是HandlerCaller的内部类而隐式持有HandlerCaller的引用，HandlerCaller中又保存着IWallpaperEngineWrapper的引用——因此IWallpaperEngineWrapper间接被HandlerCaller所在线程的MessageQueue引用，在DO_ATTACH消息处理完成前不会被回收。这是建立在对Java引用与Handler工作原理深刻理解上的精妙实现，但已接近危险的边缘。", "t": ["壁纸"]}, {"i": 339, "ch": 8, "sec": "8.2.2", "f": "IWallpaperEngineWrapper中的mCaller(HandlerCaller)有什么重要作用？它运行在哪个线程？", "b": "mCaller是一个重要的线程调度器：所有壁纸相关的操作都会以消息的形式发送给mCaller，在IWallpaperEngineWrapper的executeMessage()中得到处理，使这些操作转移到mCaller所在的线程上执行(如壁纸绘制、事件处理)，可以说mCaller的线程就是壁纸的工作线程。默认运行在壁纸服务的主线程(context.getMainLooper())；当WallpaperService.mCallbackLooper不为null时运行在mCallbackLooper所在线程——这是为了让ImageWallpaper等把壁纸工作从繁忙的SystemUI主线程转移到其他线程，但该机制可能带来同步问题，在Android 4.4及后续版本中被废除。", "t": ["壁纸"]}, {"i": 340, "ch": 8, "sec": "8.2.2", "f": "DO_ATTACH消息的处理包括哪四个步骤？", "b": "①调用mConnection.attachEngine(this)把IWallpaperEngineWrapper实例传递给WallpaperConnection保存(保存在WallpaperConnection.mEngine中)，此后WallpaperManagerService可通过它与Engine通信；②通过onCreateEngine()创建一个Engine——它是WallpaperService中定义的抽象方法，由实现者返回自定义的Engine子类；③将新建的Engine添加到WallpaperService.mActiveEngines列表中；④调用engine.attach(this)完成窗口的创建、第一帧的绘制等工作。", "t": ["壁纸"]}, {"i": 341, "ch": 8, "sec": "8.2.2", "f": "为什么WallpaperService中可能同时存在多个Engine(mActiveEngines是一个列表)？", "b": "这是壁纸预览引入的：当壁纸A已被设置为当前壁纸时，系统中存在一个它对应的WallpaperService及一个Engine；此时若LivePicker等壁纸管理工具预览壁纸A，其对应的WallpaperService仍然只有一个，但内部会变成两个Engine。这说明WallpaperService仅是提供壁纸运行的场所，而Engine才是真正的壁纸实现。", "t": ["壁纸"]}, {"i": 342, "ch": 8, "sec": "8.2.2", "f": "壁纸创建过程中出现哪三个跨Binder通信对象？各自职责与所处进程是什么？", "b": "①IWallpaperService：实现在壁纸服务进程中，唯一方法attach()用于在壁纸服务启动后接收窗口创建所需的信息(完成壁纸初始化)，主要服务于壁纸的创建阶段；②WallpaperConnection：实现在WallpaperManagerService中，通过IWallpaperService.attach()传递给IWallpaperEngineWrapper；壁纸服务通过其attachEngine()把IWallpaperEngineWrapper交给WallpaperManagerService保存，还通过其engineShown()把壁纸显示完成的事件通知给WallpaperManagerService；③IWallpaperEngineWrapper：实现在壁纸进程中，作为Engine的封装者，是WallpaperManagerService对Engine进行请求或设置的唯一接口，用于壁纸运行阶段的操作与设置。", "t": ["壁纸"]}, {"i": 343, "ch": 8, "sec": "8.2.2", "f": "既然有IWallpaperService，为什么还需要IWallpaperEngineWrapper？", "b": "IWallpaperService在WallpaperManagerService看来表示的是WallpaperService，IWallpaperEngineWrapper表示的是Engine。WallpaperService是Engine运行的容器，其唯一方法attach()用来在WallpaperService中创建新的Engine实例(通过创建IWallpaperEngineWrapper完成)；Engine是壁纸的具体实现，IWallpaperEngineWrapper的方法用于对壁纸进行操作与设置。而且WallpaperService中可同时运行多个Engine实例，WallpaperManagerService或LivePicker只关心某一个Engine而非所有Engine——直接操作IWallpaperEngineWrapper比通过IWallpaperService接口并在参数中指明目标Engine更简洁直接。", "t": ["壁纸"]}, {"i": 344, "ch": 8, "sec": "8.2.2", "f": "Engine.attach()完成了哪些初始化工作？壁纸启动何时算完成？", "b": "①保存必要信息(mIWallpaperEngine、mCaller、mConnection、mWindowToken)；②mSurfaceHolder是一个Engine定制的BaseSurfaceHolder实例，调用setSizeFromLayout()，开发者可通过它定制所需Surface类型；③获取WindowSession(mSession=WindowManagerGlobal.getWindowSession())用于与WMS通信，mWindow.setSession(mSession)(mWindow是IWindow实现，窗口创建后接收WMS回调)；④注册监听ACTION_SCREEN_ON/ACTION_SCREEN_OFF广播查询屏幕状态，以保证屏幕关闭后动态壁纸可停止动画渲染以节省电量；⑤调用Engine.onCreate(mSurfaceHolder)——子类常重写它修改mSurfaceHolder属性(如像素格式、尺寸)，此时窗口尚未创建，设置的属性在创建窗口时生效；⑥最后updateSurface()根据SurfaceHolder的属性创建窗口与Surface并进行壁纸的第一次绘制。Engine.attach()执行的结束标志着壁纸启动工作的完成。", "t": ["壁纸"]}, {"i": 345, "ch": 8, "sec": "8.2.2", "f": "为什么Engine要监听屏幕开/关广播？", "b": "Engine需要监听屏幕状态(通过PowerManager.isScreenOn()获取初始状态，并注册ACTION_SCREEN_ON/ACTION_SCREEN_OFF广播)，这是为了保证在屏幕关闭之后，动态壁纸可以停止动画的渲染以节省电量。", "t": ["壁纸"]}, {"i": 346, "ch": 8, "sec": "8.2.2", "f": "总结壁纸的完整创建流程(从壁纸管理程序到壁纸显示)。", "b": "①壁纸管理程序(如LivePicker)调用IWallpaperManager.setWallpaperComponent()要求WallpaperManagerService设置指定壁纸；②WallpaperManagerService调用bindWallpaperComponentLocked()将给定壁纸服务启动起来(验证三个条件、bindService)，同时旧有的壁纸服务被终止(detachWallpaperLocked)；③WallpaperManagerService成功连接壁纸服务后(onServiceConnected)，调用壁纸服务的attach()方法将窗口令牌等参数交给壁纸服务；④壁纸服务响应attach()的调用，创建一个Engine；⑤Engine的updateSurface()方法创建壁纸窗口及Surface，并进行壁纸的绘制。", "t": ["壁纸"]}, {"i": 347, "ch": 8, "sec": "8.2.2", "f": "WallpaperManagerService中三个重要的数据结构是什么？各自保存什么信息？", "b": "①WallpaperInfo：存储动态壁纸的开发者、缩略图与描述信息，创建于bindWallpaperComponentLocked()，内容来自AndroidManifest.xml中android.service.wallpaper的meta-data；②WallpaperConnection：既是壁纸服务与WallpaperManagerService通信的渠道，也保存壁纸相关的重要运行时信息(IWallpaperService、IWallpaperEngineWrapper、WallpaperInfo、窗口令牌)，创建于bindWallpaperComponentLocked()；③WallpaperData：保存一个壁纸在WallpaperManagerService中可能用到的所有信息(壁纸服务的ComponentName、WallpaperConnection、启动时间等，也包含静态壁纸相关信息)，保存在名为mWallpaperMap的SparseArray中，每个用户拥有固定的WallpaperData实例，切换壁纸时原地更新而不新建实例。", "t": ["壁纸"]}, {"i": 348, "ch": 8, "sec": "8.1", "f": "关于壁纸的角色划分，书中给出的总结性结论是什么？", "b": "WallpaperService只是一个用于承载壁纸运行的容器(通过onCreateEngine()可同时创建多个Engine，如被设置为当前壁纸又同时被预览时)；Engine类才是壁纸实现的核心所在，负责壁纸窗口的创建与Surface的维护，开发者需继承Engine并重写其回调完成壁纸开发；WallpaperManagerService负责壁纸的管理(运行、切换、提供窗口令牌)；WMS负责壁纸窗口的Z序、可见性与窗口动画。", "t": ["壁纸"]}];
const CH_COLORS = {"1": "#5B8DEF", "2": "#3DDC84", "3": "#E5A13D", "4": "#D46A6A", "5": "#9B7EDE", "6": "#3FB8C4", "7": "#E5793F", "8": "#7FA650"};
const CH_NAMES = {"1": "\u7b2c1\u7ae0 \u5f00\u53d1\u73af\u5883\u90e8\u7f72", "2": "\u7b2c2\u7ae0 \u6df1\u5165\u7406\u89e3Java Binder\u548cMessageQueue", "3": "\u7b2c3\u7ae0 \u6df1\u5165\u7406\u89e3AudioService", "4": "\u7b2c4\u7ae0 \u6df1\u5165\u7406\u89e3WindowManagerService", "5": "\u7b2c5\u7ae0 \u6df1\u5165\u7406\u89e3Android\u8f93\u5165\u7cfb\u7edf", "6": "\u7b2c6\u7ae0 \u6df1\u5165\u7406\u89e3\u63a7\u4ef6\uff08ViewRoot\uff09\u7cfb\u7edf", "7": "\u7b2c7\u7ae0 \u6df1\u5165\u7406\u89e3SystemUI", "8": "\u7b2c8\u7ae0 \u6df1\u5165\u7406\u89e3Android\u58c1\u7eb8"};
let curCh = 0, curQ = '';

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');

function cardHTML(c) {
  const color = CH_COLORS[c.ch] || '#2FA36B';
  const chName = CH_NAMES[c.ch] || '';
  const tags = c.t.map(t => '<span class="tag">' + esc(t) + '</span>').join(' ');
  return `
  <div class="card" data-i="${c.i}" style="--cc:${color}">
    <div class="card-inner">
      <div class="face front">
        <div class="spinebar"><div class="spine"></div></div>
        <div class="badges"><span class="sec">${esc(c.sec)}</span>${tags}
          <span class="chname">${chName}</span></div>
        <div class="body"><div class="q">${esc(c.f)}</div></div>
        <div class="qmark">点击翻面 ↻</div>
      </div>
      <div class="face back">
        <div class="spinebar"><div class="spine"></div></div>
        <div class="badges"><span class="sec">${esc(c.sec)}</span><span class="tag">答案</span>
          <span class="chname">${chName}</span></div>
        <div class="body"><div class="a">${esc(c.b)}</div></div>
        <div class="flipicon">点击翻回 ↺</div>
      </div>
    </div>
  </div>`;
}

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  const q = curQ.trim().toLowerCase();
  const list = DATA.filter(c =>
    (curCh === 0 || c.ch === curCh) &&
    (!q || (c.f + ' ' + c.b + ' ' + c.t.join(' ')).toLowerCase().includes(q)));
  grid.innerHTML = list.map(cardHTML).join('');
  countEl.textContent = `显示 ${list.length} / ${DATA.length} 张卡片` +
    (curCh ? `（第${curCh}章）` : '') + (q ? ` · 搜索“${curQ}”` : '');
  grid.querySelectorAll('.card').forEach(el =>
    el.addEventListener('click', () => el.classList.toggle('flipped')));
}

document.querySelectorAll('.chip').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    curCh = parseInt(b.dataset.ch, 10);
    render();
  }));

document.getElementById('q').addEventListener('input', e => {
  curQ = e.target.value;
  render();
});

render();
</script>
</body>
</html>
