* { box-sizing:border-box; margin:0; padding:0; }
body {

/* ---------- header ---------- */
header {
  background:linear-gradient(180deg,#141E28 0%,#1C2A36 100%);

}
.wrap { max-width:1240px; margin:0 auto; padding:0 28px; }
.kicker { color:#7FD9A8; font-size:14px; letter-spacing:.12em; margin-bottom:10px; }

/* ---------- toolbar ---------- */

  backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:14px 0;
}
.chips { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  border:1px solid var(--line); background:#fff; color:var(--ink2);

}

.chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
.chip.on[data-ch]:not([data-ch="0"]) { background:var(--cc); border-color:var(--cc); }
.search { margin-left:auto; }
.search input {
  width:230px; padding:7px 14px; border:1px solid var(--line); border-radius:999px;
  font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink); outline:none;
}
.search input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(47,163,107,.15); }
/* ---------- grid ---------- */
.grid {
  display:grid; grid-template-columns:repeat(2, minmax(0,1fr));
  gap:18px; padding:28px 0 70px;
}
@media (max-width:860px) { .grid { grid-template-columns:1fr; } }
.count-line { color:var(--ink2); font-size:13px; padding-top:22px; }
/* ---------- card ---------- */
.card { perspective:1600px; height:300px; }

  position:relative; width:100%; height:100%; cursor:pointer;
  transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.15,.2,1);
}
.card.flipped .card-inner { transform:rotateY(180deg); }
.face {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 1px 2px rgba(28,38,48,.05);
}
.face.back { transform:rotateY(180deg); background:#FBFCFB; }
.spine { width:5px; align-self:stretch; flex:none; }
.spinebar { display:flex; flex:none; }
.spinebar .spine { background:var(--cc,#2FA36B); }
.badges {
  display:flex; gap:8px; align-items:center; padding:12px 16px 0 18px; flex:none;
}
.sec { font-size:11.5px; color:var(--ink2); background:var(--paper);
  border:1px solid var(--line); border-radius:4px; padding:1px 7px; }
.tag { font-size:11.5px; color:var(--cc,#2FA36B); }
.chname { font-size:11.5px; color:var(--ink2); margin-left:auto; }
.body { flex:1; overflow-y:auto; padding:12px 18px 16px; }
.body::-webkit-scrollbar { width:6px; }
.body::-webkit-scrollbar-thumb { background:#CBD3D0; border-radius:3px; }
.q { font-size:16.5px; font-weight:600; line-height:1.55; }
.a { font-size:14.5px; line-height:1.75; white-space:pre-line; }
.qmark {
  position:absolute; right:14px; bottom:10px; font-size:11px; color:#A9B4AE;
  letter-spacing:.05em;
}
.flipicon { position:absolute; right:14px; bottom:10px; font-size:12px; color:#A9B4AE; }
/* footer note */
footer { color:var(--ink2); font-size:12.5px; padding:0 0 40px; }
@media (prefers-reduced-motion: reduce) {

<script>
const DATA = [{"i": 0, "ch": 1, "sec": "1.2.1", "f": "Android 2.3以后编译源码对操作系统有什么要求？推荐什么系统？应下载哪个Android版本？", "b": "Android 2.3以后，Google官方推荐使用64位操作系统编译源码。书作者推荐Ubuntu 10.04 X86-64版。下载代码时应选择Android 4.0.1，虽然4.0.3版本号变化不大，但实际代码有较大变化。", "t": ["开发环境", "源码下载"]}, {"i": 1, "ch": 1, "sec": "1.2.2", "f": "编译Android源码需要哪个版本的JDK？如何部署Java环境？", "b": "Android 2.3及以后版本编译需要JDK1.6（如jdk-6u27-linux-x64.bin）。执行该bin文件（其作用是解压），然后在~/.bashrc文件末尾添加Java环境相关配置，重新登录系统后Java环境即生效。", "t": ["开发环境", "JDK"]}, {"i": 2, "ch": 1, "sec": "1.2.2", "f": "编译整个Android系统的步骤是什么？choosecombo中选择哪些项？", "b": "三步：1）执行source build/envsetup.sh导入Android编译环境；2）执行choosecombo（它是envsetup.sh中定义的一个函数），依次选择release、generic、eng；3）执行make编译整个系统。编译时间由机器配置决定（作者4核4GB机器约2小时）。本书要求必须先编译整个系统。", "t": ["开发环境", "源码编译"]}, {"i": 3, "ch": 1, "sec": "1.2.3", "f": "用Eclipse调试SystemServer前，Eclipse环境需要做哪些配置？", "b": "1）下载Android SDK并解压；2）为Eclipse安装ADT插件（Android Development Tools，地址https://dl-ssl.google.com/android/eclipse/）；3）在Preferences->Android的SDK Location中填入SDK解压目录；4）通过Window->Android SDK Manager下载Tools和对应版本的SDK文档、镜像文件、开发包等。", "t": ["调试", "Eclipse"]}, {"i": 4, "ch": 1, "sec": "1.2.3", "f": "Coffee Bytes Java插件的作用是什么？", "b": "它是Eclipse的一个代码折叠插件，折叠功能比Eclipse自带的强大，代码中几乎所有分支都可以折叠，帮助开发人员集中精力关注自己关心的分支（如折叠不关心的else if分支）。安装后在Preference中搜索Folding，打开Enable folding并选择CoffeeBytes Java Folding。", "t": ["调试", "Eclipse"]}, {"i": 5, "ch": 1, "sec": "1.2.3", "f": "向Eclipse导入Android源码的前提条件和步骤是什么？.classpath文件起什么作用？", "b": "前提是必须编译完整个Android源码。步骤：1）复制源码目录/development/ide/eclipse/.classpath到源码根目录；2）编辑.classpath，把非Framework模块的目录注释掉（可加快导入速度，且不必要的模块会导致Eclipse中编译失败）；3）New->Java Project，Location设为Android 4.0源码路径。.classpath文件是供Eclipse使用的，保存源码中各模块的路径。导入约需10几分钟。", "t": ["调试", "Eclipse"]}, {"i": 6, "ch": 1, "sec": "1.2.3", "f": "导入Android源码时有哪两条重要注意事项？", "b": "1）导入源码前一定要取消Eclipse的自动编译选项（Project->Build Project Automatically）；2）源码导入完毕后千万不要清理（clean）这个工程，清理会删除之前源码编译所生成的文件，导致后续得重新编译Android系统。", "t": ["调试", "Eclipse"]}, {"i": 7, "ch": 1, "sec": "1.2.3", "f": "如何用Eclipse调试SystemServer进程？使用什么端口和协议？", "b": "在Android源码工程上右键Debug As->Debug Configurations，找到Remote Java Application并新建配置，选择调试端口号8600、Host为localhost（8600是SystemServer进程的调试端口号）。Eclipse连接该端口后即可通过JDWP协议调试SystemServer。配置完成后单击Debug按钮即可启动调试（如调试startActivity流程）。", "t": ["调试", "SystemServer"]}, {"i": 8, "ch": 1, "sec": "1.2.3", "f": "在Eclipse中编译Android源码工程出现错误，最可能的原因是什么？", "b": "大部分原因是.classpath文件将不需要的模块包含了进来，可根据Eclipse的提示做相应处理（注释掉不需要的模块）。编译过程中有很多警告是正常的。", "t": ["调试", "Eclipse"]}, {"i": 9, "ch": 2, "sec": "2.2.1", "f": "Java层的Binder架构与Native层Binder架构是什么关系？", "b": "Java层Binder也是一个C/S架构，类的命名尽量与Native层保持一致，可认为Java层Binder架构是Native层Binder架构的一个镜像（Mirror）。但这个Mirror仍需借助Native层Binder来开展工作，通信最终依赖Native Binder。", "t": ["Binder", "架构"]}, {"i": 10, "ch": 2, "sec": "2.2.1", "f": "Java层Binder家族中有哪些核心成员？各自的作用是什么？", "b": "1）IBinder接口类和DeathRecipient接口；2）Binder类实现IBinder，作为服务端Bn端的代表；BinderProxy类实现IBinder，作为客户端Bp端的代表；3）BinderInternal类，仅供Binder框架内部使用，内部有一个GcWatcher类专门处理和Binder相关的垃圾回收；4）Java层的Parcel类，用于承载通信数据。", "t": ["Binder", "架构"]}, {"i": 11, "ch": 2, "sec": "2.2.1", "f": "IBinder接口中FLAG_ONEWAY标志的含义是什么？", "b": "当客户端发起跨进程Binder调用时，若未指明FLAG_ONEWAY，调用方（客户端）一般会阻塞直到服务端返回结果（类似普通函数调用）；指明FLAG_ONEWAY后，调用方只要把请求发送到Binder驱动即可返回，不用等待服务端结果，即非阻塞方式。Native层Binder调用基本都是阻塞的，而Java层framework中使用FLAG_ONEWAY的情况非常多。", "t": ["Binder", "FLAG_ONEWAY"]}, {"i": 12, "ch": 2, "sec": "2.2.1", "f": "使用FLAG_ONEWAY进行Binder调用的程序在设计上有什么特点？", "b": "客户端仅发出请求但不确定服务端是否处理了该请求，所以客户端一般会向服务端注册一个回调（同样是跨进程的Binder调用），服务端处理完该请求后调用此回调通知客户端处理结果，且回调函数大多也采用FLAG_ONEWAY方式。", "t": ["Binder", "FLAG_ONEWAY"]}, {"i": 13, "ch": 2, "sec": "2.2.2", "f": "Java层Binder框架的初始化由哪个JNI函数完成？它初始化了哪三个类？", "b": "由register_android_os_Binder函数（android_util_Binder.cpp中）完成，在Java初创时期系统会提前注册该JNI函数。它依次调用三个函数初始化：int_register_android_os_Binder（初始化Binder类）、int_register_android_os_BinderInternal（初始化BinderInternal类）、int_register_android_os_BinderProxy（初始化BinderProxy类）与Native层的关系。", "t": ["Binder", "JNI", "初始化"]}, {"i": 14, "ch": 2, "sec": "2.2.2", "f": "int_register_android_os_Binder做了什么？gBinderOffsets保存了哪些信息？", "b": "它通过FindClass找到Java层Binder类（全路径名android/os/Binder），将类及关键信息保存到静态对象gBinderOffsets中：mClass（类的全局引用）、mExecTransact（execTransact方法的MethodID，签名(IIII)Z）、mObject（成员变量mObject的fieldID）；最后调用registerNativeMethods注册Binder类中native函数的实现。", "t": ["Binder", "JNI", "初始化"]}, {"i": 15, "ch": 2, "sec": "2.2.2", "f": "Binder框架初始化时为什么要提前获取MethodID和fieldID？这项初始化工作的本质是什么？", "b": "框架初始化就是提前获取JNI层使用的信息（如成员函数的MethodID、成员变量的fieldID），能节省每次使用时获取这些信息的时间，当Binder调用频繁时累积时间不容小觑。本质：几个全局静态对象（gBinderOffsets、gBinderInternalOffsets、gBinderProxyOffsets）为JNI层访问Java层提供依据，而各初始化函数中的registerNativeMethods()为Java层访问JNI层打通道路，即通过JNI建立起Native Binder与Java Binder互相通信的桥梁。", "t": ["Binder", "JNI", "初始化"]}, {"i": 16, "ch": 2, "sec": "2.2.2", "f": "int_register_android_os_BinderProxy初始化时除BinderProxy外还获取了哪些类的信息？这说明什么？", "b": "还获取了java/lang/ref/WeakReference（其get函数的MethodID）、java/lang/Error和java/lang/Class（getName函数）的信息。这说明BinderProxy对象的生命周期会委托WeakReference来管理，所以JNI层要获取WeakReference的get函数MethodID。", "t": ["Binder", "JNI", "BinderProxy"]}, {"i": 17, "ch": 2, "sec": "2.2.3", "f": "ActivityManagerService是如何把自己注册到ServiceManager的？成为Service的首要条件是什么？", "b": "AMS在setSystemProcess中调用ServiceManager.addService(\"activity\", m)将自己注册到ServiceManager。整个Android系统中有一个Native的ServiceManager（SM）进程统筹管理系统上所有Service，成为一个Service的首要条件是先在SM中注册。", "t": ["Binder", "ServiceManager", "AMS"]}, {"i": 18, "ch": 2, "sec": "2.2.3", "f": "ServiceManager.getIServiceManager()返回的是什么对象？它是怎么得到的？", "b": "返回ServiceManagerProxy对象（保存于静态变量sServiceManager）。得到过程：调用ServiceManagerNative.asInterface(BinderInternal.getContextObject())——先通过getContextObject得到一个封装了Native BpProxy的Java对象（即BinderProxy），再由asInterface以它为参数创建ServiceManagerProxy。", "t": ["Binder", "ServiceManager"]}, {"i": 19, "ch": 2, "sec": "2.2.3", "f": "BinderInternal.getContextObject()这个native函数做了什么？", "b": "它先调用ProcessState::self()->getContextObject(NULL)得到一个Native的BpProxy对象（参数NULL即0用于标识目的端，指定通信目的端是ServiceManager）；由于Java层不能直接使用该BpProxy，再通过javaObjectForIBinder()创建一个封装了此BpProxy的Java对象（BinderProxy）返回。即：创建Java层BinderProxy对象，并通过JNI使其与一个通信目标为ServiceManager的Native BpProxy挂钩。", "t": ["Binder", "JNI", "ServiceManager"]}, {"i": 20, "ch": 2, "sec": "2.2.3", "f": "javaObjectForIBinder()的主要工作流程是什么？", "b": "1）先通过BpBinder的ObjectManager的findObject检查是否已存在旧Java对象，有则通过WeakReference取回、detachObject并删除全局引用；2）创建新的BinderProxy对象，把Native BpProxy的指针保存到其mObject字段（这是二者联系的纽带）；3）将该对象attach到BpBinder的ObjectManager中并注册回收函数proxy_cleanup；4）创建DeathRecipientList（保存死亡通知的list）并设置到mOrgue字段；5）调用incRefsCreated做垃圾回收——创建的Proxy对象超过200个时调用BinderInternal的forceBinderGc做一次垃圾回收。", "t": ["Binder", "JNI", "BinderProxy"]}, {"i": 21, "ch": 2, "sec": "2.2.3", "f": "ServiceManagerNative.asInterface()的作用是什么？它与Native层的哪个设施非常类似？", "b": "它以一个IBinder（BinderProxy）对象为参数创建ServiceManagerProxy对象并返回。它与Native层著名的interface_cast宏非常类似：都是以BpProxy为参数构造一个和业务相关的Proxy对象，Proxy的各业务函数将请求打包后交给BpProxy（实际再经IPCThreadState与Binder驱动交互），最终由BpProxy发送给Binder驱动完成通信。", "t": ["Binder", "ServiceManager", "Proxy"]}, {"i": 22, "ch": 2, "sec": "2.2.3", "f": "ServiceManagerProxy.addService的流程是怎样的？", "b": "1）通过Parcel.obtain()创建data和reply两个Parcel对象；2）data.writeInterfaceToken写入描述符，writeString写入服务名；3）调用data.writeStrongBinder(service)写入服务对应的Binder对象；4）调用mRemote.transact(ADD_SERVICE_TRANSACTION, data, reply, 0)——mRemote就是BinderProxy对象，由它把封装好的请求发送出去；5）回收两个Parcel。", "t": ["Binder", "ServiceManager", "Parcel"]}, {"i": 23, "ch": 2, "sec": "2.2.3", "f": "BinderProxy的transact（native函数android_os_BinderProxy_transact）的实现流程是什么？", "b": "1）用parcelForJavaObject从Java的Parcel对象得到Native的Parcel对象（参数data和reply）；2）从Java的BinderProxy对象的mObject字段中得到之前创建好的Native BpBinder对象；3）调用target->transact(code, *data, reply, flags)通过Native BpBinder将请求发送给ServiceManager；4）出错时用signalExceptionForError处理。可见Java层的Binder最终还是要借助Native的Binder进行通信。", "t": ["Binder", "JNI", "BinderProxy"]}, {"i": 24, "ch": 2, "sec": "2.2.3", "f": "从架构角度看Java Binder框架搭了一整套类，但从通信角度看其本质目的是什么？书中举了哪个反例？", "b": "不论架构用Native还是Java编写，通信的目的就是把请求传递到Binder驱动、接收回复。在这个目的之上考虑软件灵活性和可扩展性才编写了各种接口类和封装类。反例：ServiceManager作为Binder的核心程序，没有使用任何架构，而是直接读取/dev/binder设备获取并处理请求。研究源码要先搞清目的，实现只是达到目的的手段。", "t": ["Binder", "架构"]}, {"i": 25, "ch": 2, "sec": "2.2.3", "f": "ActivityManagerNative类的继承关系是什么？其构造函数做了什么？", "b": "ActivityManagerNative extends Binder并implements IActivityManager（AMS从它派生）。其构造函数调用attachInterface(this, descriptor)；父类Binder的构造函数则调用native的init()函数。", "t": ["Binder", "AMS"]}, {"i": 26, "ch": 2, "sec": "2.2.3", "f": "Java层Binder对象的native init()函数（android_os_Binder_init）做了什么？", "b": "创建一个Native层的JavaBBinderHolder对象，对其增加强引用后，通过SetIntField把这个JavaBBinderHolder对象保存到Java Binder对象的mObject成员中。即Java的Binder对象和一个Native的JavaBBinderHolder对象相关联。", "t": ["Binder", "JNI", "JavaBBinderHolder"]}, {"i": 27, "ch": 2, "sec": "2.2.3", "f": "JavaBBinderHolder是什么类？它的get()函数做什么？它为什么用wp保存mBinder？", "b": "JavaBBinderHolder仅从RefBase派生，不属于Binder家族。它的get()函数在mBinder弱引用promote为空时创建一个JavaBBinder对象（构造参数obj是Java层的Binder对象）并保存到mBinder，然后返回该JavaBBinder。mBinder定义为弱引用wp，从实现上分析估计与垃圾回收（内存管理）有关。", "t": ["Binder", "JavaBBinderHolder"]}, {"i": 28, "ch": 2, "sec": "2.2.3", "f": "writeStrongBinder特别在哪里？ibinderForJavaObject的处理逻辑是什么？", "b": "writeStrongBinder的真正参数是ibinderForJavaObject()的返回值。ibinderForJavaObject逻辑：若Java对象是Binder类实例，则从其mObject取得JavaBBinderHolder，调用其get()返回一个JavaBBinder；若是BinderProxy类实例，则返回其mObject中保存的Native BpBinder对象；否则返回NULL。", "t": ["Binder", "Parcel", "JNI"]}, {"i": 29, "ch": 2, "sec": "2.2.3", "f": "addService实际添加到Parcel并最终传递到Binder驱动的是什么对象？", "b": "不是AMS（Java Binder对象）本身，而是一个叫JavaBBinder的Native对象。Java层中所有Binder对应的都是JavaBBinder，不同的Binder对象对应不同的JavaBBinder对象。", "t": ["Binder", "JavaBBinder"]}, {"i": 30, "ch": 2, "sec": "2.2.3", "f": "Java Binder、JavaBBinderHolder和JavaBBinder三者之间的指向关系是什么？", "b": "1）Java层的Binder通过成员mObject指向Native层的JavaBBinderHolder对象；2）JavaBBinderHolder通过成员mBinder（弱引用）指向Native的JavaBBinder对象；3）JavaBBinder又通过mObject变量指向Java层的Binder对象。书中推测不直接让Java Binder指向JavaBBinder的原因与垃圾回收（内存管理）有关。", "t": ["Binder", "JavaBBinder"]}, {"i": 31, "ch": 2, "sec": "2.2.3", "f": "JavaBBinder收到客户端请求时如何处理？它的onTransact做了什么？", "b": "JavaBBinder是和业务完全无关的对象。它的onTransact被调用时，通过env->CallBooleanMethod(mObject, gBinderOffsets.mExecTransact, code, &data, reply, flags)调用它所绑定的Java层Binder对象（本例为AMS）的execTransact函数，然后根据返回值返回NO_ERROR或UNKNOWN_TRANSACTION。", "t": ["Binder", "JavaBBinder"]}, {"i": 32, "ch": 2, "sec": "2.2.3", "f": "Java层Binder类的execTransact()函数做了什么？", "b": "它根据传入的int参数用Parcel.obtain取得data和reply两个Parcel对象，然后调用onTransact(code, data, reply, flags)——该函数由派生类重写以完成业务功能——最后回收两个Parcel并返回结果。", "t": ["Binder", "Binder类"]}, {"i": 33, "ch": 2, "sec": "2.2.3", "f": "ActivityManagerNative的onTransact()函数是如何处理请求的？", "b": "它根据code用switch分发：如START_ACTIVITY_TRANSACTION时，先data.enforceInterface校验描述符，readStrongBinder读取参数，然后调用业务函数startActivity（由其子类ActivityManagerService实现），最后通过reply.writeNoException()和reply.writeInt(result)把结果写回。其他请求由对应的case处理。", "t": ["Binder", "AMS"]}, {"i": 34, "ch": 2, "sec": "2.2.3", "f": "为什么说JavaBBinder仅是一个\"传声筒\"？来自客户端的请求如何传递到正确的Java Binder对象？", "b": "因为JavaBBinder本身不实现任何业务函数。它收到请求时只简单地调用所绑定Java层Binder对象的execTransact；该Binder对象的execTransact调用其子类实现的onTransact；子类的onTransact再把业务派发给其子类（如AMS的startActivity）完成——务必注意其中的多层继承关系。通过这种方式请求就能传递到正确的Java Binder对象。", "t": ["Binder", "JavaBBinder"]}, {"i": 35, "ch": 2, "sec": "2.2.4", "f": "为什么需要AIDL？它解决了什么问题？", "b": "虽然Java层Binder架构清晰（Bp端通过BinderProxy的transact发请求，Bn端继承Binder并重写onTransact处理请求），但实现起来颇为繁琐。于是Android提供了AIDL语言及AIDL解释器，自动生成服务的Bn端和Bp端用于处理Binder通信的代码。AIDL的语法与定义Java接口的语法非常相似。", "t": ["AIDL", "Binder"]}, {"i": 36, "ch": 2, "sec": "2.2.4", "f": "一个AIDL文件被aidl工具解析后会产生哪三个物件？", "b": "以IMyServer.aidl为例生成IMyServer.java，包含：1）IMyServer接口——继承android.os.IInterface，仅用来声明aidl中定义的接口（如foo）；2）IMyServer.Stub类——继承Binder并实现IMyServer的抽象类，实现了Bn端通过onTransact接收请求的代码；3）IMyServer.Stub.Proxy类——实现IMyServer接口，是Bp端的实现。", "t": ["AIDL", "Binder"]}, {"i": 37, "ch": 2, "sec": "2.2.4", "f": "AIDL生成的Stub类为什么是抽象类？其onTransact如何工作？", "b": "因为aidl工具不知道foo()方法是做什么的，只能在onTransact()中得知Bp端希望调用foo()，业务实现必须留给开发者，所以foo()在Stub中定义为抽象方法，Stub是抽象类。其onTransact根据code的值（如TRANSACTION_foo）从data中读取参数，调用this.foo(_arg0)，把返回值写入reply，最后未匹配时调用super.onTransact。", "t": ["AIDL", "Stub"]}, {"i": 38, "ch": 2, "sec": "2.2.4", "f": "AIDL生成的Stub.Proxy类的作用是什么？为什么它能实现具体业务方法？", "b": "Proxy是Bp端的实现。与Stub不同，它实现了接口方法（如foo），因为Bp端的实现是确定的：将参数存储到Parcel中，调用mRemote.transact(TRANSACTION_foo, _data, _reply, 0)把请求发送给Bn端（mRemote就是指向Bn端的BinderProxy），然后从reply中读取返回值返回给调用者。", "t": ["AIDL", "Proxy"]}, {"i": 39, "ch": 2, "sec": "2.2.4", "f": "如何实现一个AIDL服务的Bn端？Bn端实例有哪些典型的使用（注册）方式？", "b": "开发者继承IMyServer.Stub类并实现其抽象方法（如foo），每个该类实例都具有Bn端能力。典型使用方式：1）通过ServiceManager.addService()注册为系统服务；2）在Android标准Service的onBind()方法中作为返回值，使之可被其他进程访问；3）通过Binder调用把实例传递给另一个进程，使之成为跨进程的回调对象。", "t": ["AIDL", "Binder"]}, {"i": 40, "ch": 2, "sec": "2.2.4", "f": "Bp端进程如何获得AIDL服务的代理对象并调用它？Stub.asInterface做了什么？", "b": "Bp端先通过ServiceManager.getService()、onServiceConnected()或其他方式获取IMyServer的BinderProxy，然后调用IMyServer.Stub.asInterface(binderProxy)——它内部创建一个IMyServer.Stub.Proxy对象并返回（参数obj被保存为Proxy的mRemote成员）——之后即可直接调用remote.foo(\"Hello AIDL!\")。每个接口方法都有对应的code常量（如TRANSACTION_foo = android.os.IBinder.FIRST_CALL_TRANSACTION + 0），用于transact/onTransact中标识调用哪个方法。", "t": ["AIDL", "Proxy"]}, {"i": 41, "ch": 2, "sec": "2.2.5", "f": "总结Java层Binder架构的要点（客户端、服务端、ServiceManager）。", "b": "1）客户端：Java层的BinderProxy在Native层对应一个BpBinder对象，凡从Java层发出的请求，先从BinderProxy传到Native的BpBinder，再由BpBinder发送到Binder驱动；2）服务端：Java层的Binder在Native层对应一个JavaBBinder对象，JavaBBinder仅起中转作用，把来自客户端的请求从Native层传递到Java层；3）系统中依然只有一个Native的ServiceManager。总体上，Java层Binder非常依赖Native层的Binder。", "t": ["Binder", "架构", "总结"]}, {"i": 42, "ch": 2, "sec": "2.3", "f": "为什么说Android 2.3以后的MessageQueue\"心系两界\"？", "b": "Android 2.3以前，只有Java世界的居民有资格向MessageQueue添加消息；从Android 2.3开始，MessageQueue的核心部分下移至Native层，让Native世界的居民也能利用消息循环处理他们所在世界的事情。因此现在的MessageQueue同时支持Java层和Native层的消息与事件。", "t": ["MessageQueue", "Native"]}, {"i": 43, "ch": 2, "sec": "2.3.1", "f": "Java层MessageQueue是如何创建的？nativeInit做了什么？", "b": "MessageQueue的构造函数中调用nativeInit()。其Native实现android_os_MessageQueue_nativeInit在Native层创建一个与MessageQueue对应的NativeMessageQueue对象（MessageQueue在Native层的代表），并通过android_os_MessageQueue_setNativeMessageQueue将这个对象设置保存到Java层。", "t": ["MessageQueue", "NativeMessageQueue"]}, {"i": 44, "ch": 2, "sec": "2.3.1", "f": "NativeMessageQueue的构造函数做了什么？体现了什么设计模式？", "b": "它先调用Looper::getForThread()取得保存在线程本地存储空间（TLS）中的Looper对象；如果为NULL（第一次进来），则先创建一个Looper（new Looper(false)），再通过Looper::setForThread保存到TLS中。这是很常见的以线程为单位的单例模式。", "t": ["MessageQueue", "Looper"]}, {"i": 45, "ch": 2, "sec": "2.3.1", "f": "Native层的Looper类和Java层的Looper类是什么关系？", "b": "虽然类名一样，但二者其实并无任何关系。Native的Looper是Native世界中参与消息循环的重要角色，从ALooper派生，提供pollOnce、addFd等函数。", "t": ["Looper", "Native"]}, {"i": 46, "ch": 2, "sec": "2.3.2", "f": "MessageQueue.next()方法的大致流程是什么？", "b": "在一个for(;;)循环中：1）调用nativePollOnce(mPtr, nextPollTimeoutMillis)进行等待；2）检查mMessages，若队首消息的when已到（now >= when），则将其从链表摘除（mMessages = msg.next）并返回给Looper派发处理；3）若消息未到时间，计算nextPollTimeoutMillis = min(when-now, Integer.MAX_VALUE)；4）若队列无消息则nextPollTimeoutMillis = -1；5）处理注册的IdleHandler（队列无消息时Looper会调用IdleHandler做些工作，例如垃圾回收等）。", "t": ["MessageQueue", "next"]}, {"i": 47, "ch": 2, "sec": "2.3.2", "f": "MessageQueue中mPtr和mMessages两个变量分别保存什么？", "b": "mPtr保存Native层的NativeMessageQueue对象的指针，供nativePollOnce、nativeWake等native函数使用；mMessages保存来自Java层的Message消息（按when排序的链表头）。", "t": ["MessageQueue", "成员变量"]}, {"i": 48, "ch": 2, "sec": "2.3.2", "f": "MessageQueue.enqueueMessage的核心逻辑是什么？", "b": "1）若mQuiting为真返回false；若msg.target为null则置mQuiting为true；2）将message按执行时间when排序插入消息链表：若队列为空（p==null）或when==0或when小于队首消息的when，则插到队首；否则遍历找到合适位置插入队中/队尾；3）根据needWake的值决定是否调用nativeWake(mPtr)，以触发nativePollOnce结束等待。", "t": ["MessageQueue", "enqueueMessage"]}, {"i": 49, "ch": 2, "sec": "2.3.2", "f": "enqueueMessage中needWake何时为true？插入到非队首位置时为什么不用唤醒？", "b": "当消息插到队首（队列为空、when==0或when早于原队首）时，needWake = mBlocked，即取决于目标线程是否正阻塞在nativePollOnce；若队列中原本还有剩余消息（插入到队中/队尾），则needWake = false，不用调用nativeWake——因为消息队列之前还剩余有消息，说明等的时间未到或已在处理。", "t": ["MessageQueue", "mBlocked"]}, {"i": 50, "ch": 2, "sec": "2.3.2", "f": "nativeWake的完整调用链是什么？Native的Looper::wake是如何实现唤醒的？", "b": "调用链：android_os_MessageQueue_nativeWake → NativeMessageQueue::wake() → mLooper->wake()。Looper::wake的实现非常简单：向管道的写端（mWakeWritePipeFd）写入一个字符\"W\"（循环处理EINTR），这样管道的读端就会因为有数据可读而从等待状态中醒来。", "t": ["MessageQueue", "nativeWake", "pipe"]}, {"i": 51, "ch": 2, "sec": "2.3.3", "f": "nativePollOnce的完整调用链是什么？", "b": "android_os_MessageQueue_nativePollOnce取出ptr对应的NativeMessageQueue对象并调用其pollOnce(timeoutMillis) → NativeMessageQueue::pollOnce把任务传递给mLooper->pollOnce → Looper的无参pollOnce再调用带4个参数的pollOnce(timeoutMillis, outFd, outEvents, outData) → 最终调用pollInner()。", "t": ["MessageQueue", "nativePollOnce"]}, {"i": 52, "ch": 2, "sec": "2.3.3", "f": "Looper::pollOnce(timeoutMillis, outFd, outEvents, outData)的四个参数分别是什么含义？返回值有哪些含义？", "b": "参数：timeoutMillis为超时等待时间（-1表示无限等待直到事件发生，0表示无需等待立即返回）；outFd存储发生事件的文件描述符；outEvents存储发生了哪些事件（可读、可写、错误、中断，由epoll事件转化而来）；outData存储用户添加监听句柄时传递的上下文数据（作用类似pthread_create最后的param）。返回值：ALOOPER_POLL_WAKE表示由wake（管道写端写事件）触发；ALOOPER_POLL_TIMEOUT表示等待超时；ALOOPER_POLL_ERROR表示等待中发生错误；ALOOPER_POLL_CALLBACK表示某个被监听句柄被触发（此时outFd/outEvents有效）。", "t": ["Looper", "pollOnce"]}, {"i": 53, "ch": 2, "sec": "2.3.3", "f": "epoll使用的四个关键步骤（函数）是什么？", "b": "1）epoll_create创建epoll句柄（参数对2.6.8以后内核无实际作用，内核支持动态拓展缓存）；2）epoll_ctl把需要监听的文件句柄加入epoll句柄：EPOLL_CTL_ADD添加、EPOLL_CTL_DEL移除、EPOLL_CTL_MOD修改监听事件，需用struct epoll_event指定fd和等待的事件，其data联合体用于存储上下文数据；3）epoll_wait等待事件：返回值nfds大于0表示有事件发生，等于0表示超时，小于0表示出错，发生的事件通过resultEvents数组返回；4）遍历resultEvents，通过event.data取得上下文数据判断是哪个句柄发生了事件。epoll支持四类事件：EPOLLIN（句柄可读）、EPOLLOUT（句柄可写）、EPOLLERR（句柄错误）、EPOLLHUP（句柄断），系统默认会将EPOLLERR加入到事件集合中。", "t": ["epoll", "Looper"]}, {"i": 54, "ch": 2, "sec": "2.3.3", "f": "epoll为什么比select高效？", "b": "1）调用方式：每次调用select都需把感兴趣的事件复制到内核中，而epoll只在epoll_ctl加入时复制一次；2）数据结构：epoll内部用红黑树保存事件，查找速度快；select用数组保存，一次能等待的句柄个数有限且查找慢。当然只等待少量文件句柄时二者效率相差不大，但仍推荐使用epoll。另外epoll等待事件有两种触发条件：水平触发（EPOLLLEVEL）和边缘触发（EPOLLET，ET为Edge Trigger之意），二者区别非常重要，可通过man epoll查阅详细机制。", "t": ["epoll", "select"]}, {"i": 55, "ch": 2, "sec": "2.3.3", "f": "Looper带4个参数的pollOnce()函数的处理流程是什么？", "b": "在一个for(;;)无限循环中：1）先处理mResponses中那些没有callback的Response——因为没有callback系统不知道如何处理，pollOnce只是返回它的ident（同时通过outFd/outEvents/outData带出信息）；2）若result不为0则直接返回result；3）否则调用pollInner(timeoutMillis)进行真正的等待与处理。", "t": ["Looper", "pollOnce"]}, {"i": 56, "ch": 2, "sec": "2.3.3", "f": "Looper::pollInner()的关键流程有哪些步骤？", "b": "1）根据Native Message的信息计算真正需要等待的时间；2）调用epoll_wait等待；3）epoll_wait返回后有三种情况：出错（errno==EINTR则直接Done，否则result为ALOOPER_POLL_ERROR）、超时（result为ALOOPER_POLL_TIMEOUT）、有事件发生；4）有事件时逐个处理：若是管道读端（mWakeReadPipeFd）有可读事件则调用awoken()读取并清空管道数据；若是其他fd，则根据mRequests中对应的Request将epoll事件转换为ALOOPER事件后构造Response并push到mResponses；5）Done之后：先处理Native的Message（调用Native Handler的handleMessage），再处理mResponses中带callback的事件（callback返回0则removeFd移除对该句柄的监视），result为ALOOPER_POLL_CALLBACK。", "t": ["Looper", "pollInner"]}, {"i": 57, "ch": 2, "sec": "2.3.3", "f": "pollInner中如何处理Native的Message？Native Message和Java层的Message有什么关系？", "b": "pollInner遍历mMessageEnvelopes，若队首消息的uptime <= now，则取出其handler和message，从队列移除后调用handler->handleMessage(message)处理，result置为ALOOPER_POLL_CALLBACK；若未到时间则记录mNextMessageUptime并break。Native的Message和Java层的Message没有任何关系，是两套独立的体系。", "t": ["Looper", "Native Message"]}, {"i": 58, "ch": 2, "sec": "2.3.3", "f": "在Looper的处理逻辑中，Native Message和监控FD的事件（Response）谁优先？如何体现？", "b": "Native Message的优先级高于监控FD的优先级。体现在：pollInner中epoll_wait返回的事件并不单独处理，而是先收集为Response（pushResponse）保存到mResponse数组，等Native Message全部处理完之后再统一处理带callback的Response。", "t": ["Looper", "优先级"]}, {"i": 59, "ch": 2, "sec": "2.3.3", "f": "Looper::addFd()的作用和流程是什么？什么时候会返回-1？", "b": "addFd用于添加监控请求（相当于调用epoll_ctl增加监听句柄），参数为fd、ident、监听事件、回调函数callback和用户数据data。流程：1）若callback为空且该Looper不支持non-callback（mAllowNonCallbacks为false），返回-1，因为Looper不知道如何处理该句柄上发生的事情；2）将ALOOPER事件转换为epoll事件；3）创建Request对象（保存fd、ident、callback、data）；4）若mRequests中不存在该fd（mRequests以fd为key的KeyedVector），调用epoll_ctl(EPOLL_CTL_ADD)并mRequests.add；若已存在，调用EPOLL_CTL_MOD并replaceValueAt。", "t": ["Looper", "addFd", "Request"]}, {"i": 60, "ch": 2, "sec": "2.3.3", "f": "Native层的sendMessage/sendMessageAtTime的流程是什么？与Java层相比有什么要求？", "b": "Android 2.2中只有Java层可以往MessageQueue添加消息，从4.0开始Native层也支持sendMessage。Native的sendMessage必须同时传递一个MessageHandler。sendMessageAtTime：在mLock保护下按uptime时间排序，将MessageEnvelope(uptime, handler, message)插入mMessageEnvelopes的正确位置；mSendingMessage与Java层的mBlocked一样是一个小小的优化措施（正在发送消息时直接返回不唤醒）；若插入位置i==0（成为新的队首）则调用wake()唤醒epoll_wait去处理消息。", "t": ["Looper", "sendMessage"]}, {"i": 61, "ch": 2, "sec": "2.3.4", "f": "消息处理的大家族中，Java层和Native层各有哪些成员？", "b": "Java层：Looper类（提供循环处理消息的机制）、MessageQueue类（提供消息队列及插入、删除、提取消息的接口）、Handler类、Message类。Native层：NativeMessageQueue（Java MessageQueue的代表，通过Java层的mPtr保存）、Native的Looper（从ALooper派生，提供pollOnce和addFd等函数）、Native的Message类和MessageHandler抽象类（编码时一般使用其派生类WeakMessageHandler）。注意：include/media/stagefright/foundation目录下也有一个ALooper类，是供stagefright使用的类似Java消息循环的一套基础类，与此处无关。", "t": ["MessageQueue", "总结"]}, {"i": 62, "ch": 2, "sec": "2.3.4", "f": "MessageQueue核心逻辑下移到Native层后，从处理逻辑上看，Java Message、Native Message、Native Request（addFd监控的fd事件）三者的处理优先级顺序是什么？", "b": "先处理Native的Message，然后是Native的Request（监控fd的事件Response），最后才是Java的Message。", "t": ["MessageQueue", "总结", "优先级"]}, {"i": 63, "ch": 2, "sec": "2.3.4", "f": "MessageQueue在Native层的代表是什么？Java层如何与它关联？", "b": "Native层的代表是NativeMessageQueue，Java层MessageQueue内部通过mPtr变量保存该NativeMessageQueue对象的指针。NativeMessageQueue内部保存一个native的Looper对象，由它完成epoll等待、wake、处理Native Message和Request等工作。", "t": ["MessageQueue", "NativeMessageQueue"]}, {"i": 64, "ch": 3, "sec": "3.1", "f": "Android音频系统的实现习惯上分为哪两个部分？分别包含哪些内容？", "b": "分为数据流和策略两部分。数据流描述音频数据从数据源流向目的地的过程；策略负责管理及控制数据流的路径与呈现。Native层中AudioTrack、AudioRecord和AudioFlinger属于数据流范畴，AudioPolicy相关内容属于策略范畴。", "t": ["AudioService"]}, {"i": 65, "ch": 3, "sec": "3.1", "f": "为什么说AudioService是音频系统的\"大本营\"？Java层音频系统是否参与数据流？", "b": "Java层基本上不参与数据流（AudioTrack/AudioRecord只是Native层同名类的Java封装）。AudioService包含或使用了几乎所有的音频相关内容，功能非常多，因此被称为音频系统的大本营。本章从音量控制、音频IO设备管理、AudioFocus机制三个方面探讨它。", "t": ["AudioService"]}, {"i": 66, "ch": 3, "sec": "3.1", "f": "AudioService、AudioManager、AudioSystem三者的关系是什么？", "b": "AudioService继承自IAudioService.Stub（由IAudioService.aidl生成），位于Bn端；AudioManager拥有AudioService的Bp端，是AudioService在客户端的代理，几乎所有对AudioManager的请求最终都交由AudioService实现；AudioSystem无法实例化，是Java层到Native层的代理，AudioService通过它与AudioPolicyService以及AudioFlinger交互。", "t": ["AudioService"]}, {"i": 67, "ch": 3, "sec": "3.2", "f": "Android上改变系统音量有哪几种方式？它们都通过谁实现？", "b": "三种方式：1) 通过手机音量键调整音量；2) 从设置界面调整某一类型音频的音量；3) 应用随时将某种类型的音频静音。它们都是通过AudioService进行的。", "t": ["AudioService"]}, {"i": 68, "ch": 3, "sec": "3.2.1", "f": "为什么说\"离开流类型谈音量是没有意义的\"？", "b": "在Android中音量的控制与流类型密不可分，每种流类型都独立拥有自己的音量设置，绝大部分情况下互不干扰（如音乐音量、通话音量相互独立）。音量这个概念一定是描述某一种流类型的音量。", "t": ["AudioService"]}, {"i": 69, "ch": 3, "sec": "3.2.1", "f": "音量键按下后，事件是如何进入音量调整处理流程的？", "b": "Android输入系统将事件派发给Activity，若无人截获并消费，承载当前Activity显示的PhoneWindow的onKeyDown()/onKeyUp()会处理它：识别KEYCODE_VOLUME_UP/DOWN/MUTE后，直接调用getAudioManager().handleKeyDown(event, mVolumeControlStreamType)，从而开始音量调整流程。", "t": ["AudioService"]}, {"i": 70, "ch": 3, "sec": "3.2.1", "f": "为什么应用程序可以用音量键实现拍照而不是调音量？", "b": "按照Android输入事件派发策略，Window对象在事件派发队列中排在Activity后面（队尾），所以应用可以重写自己的onKeyDown()优先消费音量键事件，例如相机应用中按下音量键执行拍照动作。", "t": ["AudioService"]}, {"i": 71, "ch": 3, "sec": "3.2.1", "f": "Activity.setVolumeControlStream(int streamType)的原理是什么？为什么应用不需要考虑生命周期中流类型的切换？", "b": "该函数只有一行：getWindow().setVolumeControlStream(streamType)，即改变PhoneWindow的mVolumeControlStreamType，从而改变按下音量键后传入AudioManager.handleKeyDown()的参数。这个设置绑定在Activity的Window上，不同Activity切换时接收按键事件的Window也随之切换，因此应用无需自己处理切换问题。", "t": ["AudioService"]}, {"i": 72, "ch": 3, "sec": "3.2.1", "f": "AudioManager.handleKeyDown()/handleKeyUp()分别设置了哪些flags？各有什么含义？", "b": "handleKeyDown()设置了FLAG_SHOW_UI（告诉AudioService需要弹出音量控制面板）和FLAG_VIBRATE；handleKeyUp()设置了FLAG_PLAY_SOUND（松开音量键后\"有时候\"会有提示音），但由于AudioService内部的条件判断，该flag只是有时候才生效。", "t": ["AudioService"]}, {"i": 73, "ch": 3, "sec": "3.2.1", "f": "AudioService.adjustSuggestedStreamVolume()主要做了哪三件事？", "b": "1) 确定要调整音量的流类型：若mVolumeControlStream不为-1则直接使用它，否则通过getActiveStreamType(suggestedStreamType)根据建议流类型与AudioService的实际情况决定；2) 在特定条件下屏蔽FLAG_PLAY_SOUND（只有特定流类型且未处于锁屏状态时才播放声音）；3) 调用adjustStreamVolume()（若为STREAM_REMOTE_MUSIC则走远程播放分支）。", "t": ["AudioService"]}, {"i": 74, "ch": 3, "sec": "3.2.1", "f": "AudioService中的mVolumeControlStream变量有什么特殊之处？它由谁设置？", "b": "只要mVolumeControlStream不等于-1，要调整音量的流类型就是它，比suggestedStreamType优先级更高。它是VolumePanel通过forceVolumeControlStream()设置的：音量提示框显示时会强制后续的音量键操作固定为促使它显示的那个流类型，关闭时取消该强制设置（置为-1）。", "t": ["AudioService"]}, {"i": 75, "ch": 3, "sec": "3.2.1", "f": "mStreamVolumeAlias数组的作用是什么？如何实现\"以铃声音量用作音乐音量\"？", "b": "mStreamVolumeAlias是一个整型数组，用于描述流类型之间的音量映射关系（如A→B，对A流进行音量操作时实际操作的是B流），满足\"将铃声音量用作通知音量\"这类需求。要实现\"以铃声音量用作音乐音量\"，只需设置mStreamVolumeAlias[AudioSystem.STREAM_MUSIC] = AudioSystem.STREAM_RING。", "t": ["AudioService"]}, {"i": 76, "ch": 3, "sec": "3.2.1", "f": "为什么Android中很多与流相关的函数开头都执行 streamType = mStreamVolumeAlias[streamType]？", "b": "因为流音量映射要求对源流A的音量操作实际作用于目标流B，所以在处理音量前先做流类型转换，得到真正承载音量信息的目标流类型。分析时可忽略这种转换，不影响对音量控制原理的理解，但它确实给AudioService的实现增加了不小复杂度。", "t": ["AudioService"]}, {"i": 77, "ch": 3, "sec": "3.2.1", "f": "AudioService.adjustStreamVolume()的主要执行步骤有哪些？", "b": "1) 获取streamTypeAlias = mStreamVolumeAlias[streamType]，取得对应的VolumeStreamState和设备device；2) 通过getIndex获取当前音量（若被静音则取静音前音量）；3) rescaleIndex(10, streamType, streamTypeAlias)计算音量步进值；4) 满足条件时调用checkForRingerModeChange()，其返回值adjustVolume决定是否继续设置音量值（某些情况下音量键用于改变情景模式而非音量）；5) 流未静音且adjustIndex返回true时发送MSG_SET_DEVICE_VOLUME消息；6) 调用sendVolumeUpdate()通知外界音量变化。", "t": ["AudioService"]}, {"i": 78, "ch": 3, "sec": "3.2.1", "f": "VolumeStreamState类的功能是什么？AudioService如何管理它的实例？", "b": "VolumeStreamState保存了一个流类型所有音量相关的信息（包括音量调节范围）。AudioService为每一种流类型都分配一个VolumeStreamState对象，并以流类型的值为索引保存在数组mStreamStates中。adjustIndex()只改变其中存储的音量值，并不会把变化设置到底层。", "t": ["AudioService"]}, {"i": 79, "ch": 3, "sec": "3.2.1", "f": "为什么VolumeStreamState中保存的音量值是实际值的10倍？按下音量键的步进值是多少？", "b": "步进值是10（rescaleIndex(10, streamType, streamTypeAlias)）。保存实际值10倍是为了在不同流类型之间进行音量转换（rescaleIndex）时保证一定精度，相当于转换过程中保留小数点后一位的精度。", "t": ["AudioService"]}, {"i": 80, "ch": 3, "sec": "3.2.1", "f": "adjustStreamVolume()中checkForRingerModeChange()的返回值有什么作用？", "b": "返回布尔值adjustVolume，表示是否有必要继续设置音量值。因为在一些情况下，音量键被用来改变情景模式，而不是设置音量值。该函数在flags含FLAG_ALLOW_RINGER_MODES或流类型为主流类型时被调用。", "t": ["AudioService"]}, {"i": 81, "ch": 3, "sec": "3.2.1", "f": "VolumeStreamState.setIndex()做了哪三件工作？", "b": "1) 将音量值经getValidIndex校验后保存到HashMap mIndex（以设备device为键），4.1之前音量与设备无关，之后音量值与设备相关联，同一种流类型在不同音频设备下拥有不同音量值；2) 根据lastAudible参数将音量保存到mLastAudibleIndex（保存静音前的音量，取消静音时恢复到这里）；3) 处理流映射：设置B的音量时同时改变所有映射到当前流的其他流的音量。返回值表示音量是否发生了变化。", "t": ["AudioService"]}, {"i": 82, "ch": 3, "sec": "3.2.1", "f": "adjustStreamVolume()中为什么还要判断streamState.adjustIndex()的返回值？", "b": "因为如果音量值在adjust之后并没有发生变化（比如说达到了最大值），就不需要继续后面的操作（发送MSG_SET_DEVICE_VOLUME消息）。", "t": ["AudioService"]}, {"i": 83, "ch": 3, "sec": "3.2.1", "f": "MSG_SET_DEVICE_VOLUME消息的处理函数setDeviceVolume()做了什么？", "b": "1) 调用streamState.applyDeviceVolume(device)，其内部调用AudioSystem.setStreamVolumeIndex()，音量由此设置到底层的AudioFlinger；2) 遍历处理流音量映射，同步设置映射到该流的其他流；3) 发送MSG_PERSIST_VOLUME消息（携带PERSIST_CURRENT|PERSIST_LAST_AUDIBLE和PERSIST_DELAY），处理函数调用persistVolume()把音量设置存储到SettingsProvider中。", "t": ["AudioService"]}, {"i": 84, "ch": 3, "sec": "3.2.1", "f": "音量的运行时保存与最终生效分别在哪里完成？音量设置因此要做哪两件事？", "b": "VolumeStreamState保存运行时的音量信息，而音量的生效是在底层AudioFlinger完成的。所以音量设置需要做两件事：更新VolumeStreamState存储的音量值（setIndex/adjustIndex）；通过MSG_SET_DEVICE_VOLUME将音量设置到底层系统（applyDeviceVolume→AudioSystem.setStreamVolumeIndex()）。", "t": ["AudioService"]}, {"i": 85, "ch": 3, "sec": "3.2.1", "f": "MSG_PERSIST_VOLUME消息的作用是什么？音量的持久化数据在什么时候被读取？", "b": "其处理函数调用persistVolume()将音量设置信息存储到SettingsProvider中；AudioService在初始化时会从SettingsProvider中把音量设置读取出来并进行设置。", "t": ["AudioService"]}, {"i": 86, "ch": 3, "sec": "3.2.1", "f": "sendMsg()是异步操作，这给音量调整隐含了什么风险？", "b": "adjustIndex()更新音量信息后adjustStreamVolume()就返回了，但音量并没有立刻被设置到底层。由于Handler处理多个消息是串行的，若Handler正在处理某一消息时发生阻塞，则按音量键时adjustStreamVolume()虽能立刻返回、界面上或getStreamVolume()获取的音量值都正常，但手机实际发出声音的音量大小并没有改变。", "t": ["AudioService"]}, {"i": 87, "ch": 3, "sec": "3.2.1", "f": "AudioService.sendVolumeUpdate()做了哪些事情？", "b": "1) 若设备没有通话能力（mVoiceCapable为false，从SettingsProvider取出）且streamType为STREAM_RING，则改为STREAM_NOTIFICATION（语义保护，无通话能力的设备RING流无意义）；2) 调用mVolumePanel.postVolumeChanged(streamType, flags)显示音量提示框；3) 将oldIndex和index做(oldIndex+5)/10（+5是为了四舍五入）后，通过VOLUME_CHANGED_ACTION广播携带流类型、新音量、旧音量通知外界。", "t": ["AudioService"]}, {"i": 88, "ch": 3, "sec": "3.2.1", "f": "结合序列图总结音量键调整音量的处理流程中各角色的职责。", "b": "音量键处理流程的发起者是PhoneWindow；AudioManager仅起代理作用；AudioService接受AudioManager的调用请求，操作VolumeStreamState的实例进行音量设置；VolumeStreamState负责保存音量设置，并提供将音量设置到底层的方法；AudioService负责将设置结果以广播的形式通知外界。", "t": ["AudioService"]}, {"i": 89, "ch": 3, "sec": "3.2.1", "f": "VolumePanel是什么？它位于哪个包？为什么没有在SDK API中提供？", "b": "VolumePanel是按下音量键后弹出的音量条提示框，是一个Handler的子类，承接音量变化的UI/声音的通知工作。它位于android.view包下，但因为只能被AudioService使用（放在和AudioService一个包下更合理），所以没有在API中提供。其类注释中谷歌开发人员对它被放在android.view下表达过极大不满（What A Mess!）。", "t": ["AudioService"]}, {"i": 90, "ch": 3, "sec": "3.2.1", "f": "VolumePanel的两个重要子类型StreamResources和StreamControl分别保存什么？", "b": "StreamResources是一个枚举，每个元素保存一个流类型的通知框所需的各种资源：streamType（流类型）、descRes（描述信息）、iconRes（图标）、iconMuteRes（静音图标）、show（是否显示），所有可用元素组成数组STREAMS；StreamControl保存一个流类型的通知框所需显示的控件：streamType、group（ViewGroup）、icon（ImageView）、seekbarView（SeekBar）、iconRes、iconMuteRes。", "t": ["AudioService"]}, {"i": 91, "ch": 3, "sec": "3.2.1", "f": "VolumePanel中StreamControl实例是每个流类型一份还是只有一个？保存在哪里？何时初始化？", "b": "出于运行效率的考虑，StreamControl实例每个流类型人手一份，与StreamResources一一对应，保存在以流类型值为键的Hashtable（mStreamControls）中。初始化在createSliders()中完成，且不在构造函数中进行，而是在postVolumeChanged()函数里处理（第一次被要求弹出时初始化控件资源）。", "t": ["AudioService"]}, {"i": 92, "ch": 3, "sec": "3.2.1", "f": "VolumePanel中的mDialog扮演什么角色？音量提示框如何关闭？", "b": "mDialog是VolumePanel保存的一个Dialog实例，即通知框的\"本尊\"。每当有新的音量变化到来时，mDialog的内容被替换为指定流类型对应的StreamControl中保存的控件，根据音量变化设置音量条位置后调用mDialog.show()显示，同时发送延时消息MSG_TIMEOUT，该消息生效时关闭提示框。StreamControl可以说是mDialog的配件，随需拆卸。", "t": ["AudioService"]}, {"i": 93, "ch": 3, "sec": "3.2.1", "f": "VolumePanel.postVolumeChanged()为什么不直接调用onVolumeChanged()，而是发送MSG_VOLUME_CHANGED消息？", "b": "因为Android要求只能在创建控件的线程中对控件进行操作，而postVolumeChanged()是回调性质的函数，不能要求调用者位于哪个线程中，所以必须通过向Handler发送消息的方式，将后续操作转移到指定线程中。这种实现方式对设计具有UI Controller功能的类有很好的参考意义。", "t": ["AudioService"]}, {"i": 94, "ch": 3, "sec": "3.2.1", "f": "VolumePanel.onVolumeChanged()如何根据flags进行不同处理？", "b": "1) flags含FLAG_SHOW_UI时：若mActiveStreamType != streamType则调用reorderSliders(streamType)在Dialog里装载需要的StreamControl，然后调用onShowVolumeChanged()负责最终显示；2) flags含FLAG_PLAY_SOUND且!mRingIsSilent时延时发送MSG_PLAY_SOUND；3) flags含FLAG_REMOVE_SOUND_AND_VIBRATE时移除MSG_PLAY_SOUND和MSG_VIBRATE消息并调用onStopSounds()；4) 移除并延时发送MSG_FREE_RESOURCES回收资源；5) 调用resetTimeout()重置音量框超时关闭的时间。", "t": ["AudioService"]}, {"i": 95, "ch": 3, "sec": "3.2.1", "f": "onShowVolumeChanged()做了哪些事情？forceVolumeControlStream()在什么时机被调用？", "b": "1) 获取音量值index和最大值max（用于设置进度条）；2) 按流类型做特殊调整，例如STREAM_MUSIC需每次更新图标：若当前使用蓝牙A2DP设备则设为蓝牙图标ic_audio_bt，否则为普通图标；3) 从mStreamControls取出对应StreamControl，设置其SeekBar的进度；4) 若mDialog未显示，则调用mAudioManager.forceVolumeControlStream(streamType)（此后音量键只能调节当前流类型，直到通知框关闭时重新调用并置streamType为-1）、mDialog.setContentView(mView)并mDialog.show()显示对话框。", "t": ["AudioService"]}, {"i": 96, "ch": 3, "sec": "3.2.1", "f": "总结VolumePanel显示音量提示框的工作过程。", "b": "1) postVolumeChanged()是VolumePanel显示的入口；2) 检查flags中是否有FLAG_SHOW_UI；3) VolumePanel在第一次被要求弹出时初始化其控件资源；4) mDialog加载指定流类型对应的StreamControl（控件）；5) 显示对话框并开始超时计时；6) 超时计时到达，关闭对话框。", "t": ["AudioService"]}, {"i": 97, "ch": 3, "sec": "3.2.2", "f": "setStreamVolume()与音量键调音量有什么区别？它是谁使用的接口？", "b": "AudioManager.setStreamVolume()是SDK提供给应用的API，是系统设置界面中调整音量所使用的接口，作用是为特定流类型设置范围内允许的任意音量；而音量键是按步进值调整。两者最终都通过AudioService实现。", "t": ["AudioService"]}, {"i": 98, "ch": 3, "sec": "3.2.2", "f": "AudioService.setStreamVolume()的主要工作流程是什么？", "b": "1) ensureValidStreamType()校验流类型；2) 取mStreamStates[mStreamVolumeAlias[streamType]]对应的VolumeStreamState；3) getDeviceForStream()获取将使用的音频设备（最终会调用到AudioPolicyService）；4) 获取旧音量oldIndex；5) rescaleIndex(index*10, streamType, alias)将音量值从原流类型刻度映射到目标流类型刻度（不同流类型刻度不一样）；6) 按flags要求修改情景模式；7) 调用setStreamVolumeInt()；8) 取回设置结果后调用sendVolumeUpdate()广播通知。", "t": ["AudioService"]}, {"i": 99, "ch": 3, "sec": "3.2.2", "f": "setStreamVolumeInt()做了哪两件事？force参数的意义是什么？", "b": "1) 调用streamState.setIndex()更新音量值；2) 根据setIndex()的返回值和force参数决定是否发送MSG_SET_DEVICE_VOLUME消息把音量设置到底层。只有当setIndex返回true（音量确实变化）或force为true时才发送消息。流被静音时只更新静音前的音量而不设置到底层。", "t": ["AudioService"]}, {"i": 100, "ch": 3, "sec": "3.2.2", "f": "书作者对setStreamVolume()与adjustStreamVolume()的实现有什么评价？", "b": "把setStreamVolumeInt()的内容替换进setStreamVolume()后与adjustStreamVolume()比较，会发现它们的内容出奇地相似。Android在其他地方也有这样的情况出现，说明发展到4.1版本的Android源码仍然尚不够精致。", "t": ["AudioService"]}, {"i": 101, "ch": 3, "sec": "3.2.3", "f": "为什么静音控制需要引用计数？", "b": "因为每个应用都有可能进行静音操作，为防止状态发生紊乱，需要为静音操作进行计数，多次静音后需要多次取消静音才能恢复。", "t": ["AudioService"]}, {"i": 102, "ch": 3, "sec": "3.2.3", "f": "如果执行了静音操作的应用异常退出，静音计数无法归零怎么办？AudioService如何解决？", "b": "AudioService记录每个应用自己的静音计数，当应用崩溃时，在总的静音计数中减去崩溃应用自己的静音计数，即替该应用完成它没能完成的取消静音操作。为此VolumeStreamState定义了继承自DeathRecipient的内部类VolumeDeathHandler，为每个进行静音操作的进程创建一个实例，保存对应进程的静音计数，并在进程死亡时进行计数清零操作。", "t": ["AudioService"]}, {"i": 103, "ch": 3, "sec": "3.2.3", "f": "AudioManager.setStreamMute()为什么要把mICallBack传给AudioService？这个Binder对象有什么用途？", "b": "mICallBack是直接从Binder类实例化的一个原始IBinder对象（private final IBinder mICallBack = new Binder()），它充当Bp端在Bn端的唯一标识。AudioService拿到该标识后，可以通过DeathRecipient机制获取到Bp端异常退出的回调，这是AudioService维持静音状态正常变迁的基石。服务端以客户端传入的Binder为键保存客户端相关信息（如用Hashtable）是Android系统服务实现中很常见的用法。若传AIDL定义的IBinder，则服务端还可通过它向客户端回调（如AudioFocus机制中）。", "t": ["AudioService"]}, {"i": 104, "ch": 3, "sec": "3.2.3", "f": "AudioService.setStreamMute()的实现要点是什么？为什么这里没有做流类型的映射转换？", "b": "先通过isStreamAffectedByMute(streamType)判断该流类型是否可以静音（并非所有流都可以被静音），然后直接调用mStreamStates[streamType].mute(cb, state)。这里没有做mStreamVolumeAlias的映射转换，是出于操作语义上的原因。", "t": ["AudioService"]}, {"i": 105, "ch": 3, "sec": "3.2.3", "f": "VolumeDeathHandler类有哪些成员变量和成员函数？它在静音机制中的角色是什么？", "b": "成员变量：mICallBack（保存客户端传来的标识）和mMuteCount（保存当前客户端执行静音操作的引用计数）；继承自IBinder.DeathRecipient，因此拥有监听客户端生命状态的能力。成员函数只有mute()和binderDied()。它是实现静音功能的核心对象，一个实例对应在一个流类型上执行了静音操作的一个客户端，VolumeStreamState通过getDeathHandler(cb, state)取得与cb一一对应的handler来执行静音操作（也许叫MuteHandler更合适）。", "t": ["AudioService"]}, {"i": 106, "ch": 3, "sec": "3.2.3", "f": "VolumeDeathHandler.mute(true)（静音操作）要做哪三个任务？", "b": "1) 无论什么条件下，执行该函数后静音引用计数mMuteCount都会加1；2) 若是客户端第一次执行静音（mMuteCount==0），则通过mICallback.linkToDeath(this, 0)开始监控其生命状态，并把自己加入VolumeStreamState的mDeathHandlers列表；3) 若这是该流类型第一次被静音（全局muteCount()==0），则设置流的音量为0，这才是真正的静音动作。", "t": ["AudioService"]}, {"i": 107, "ch": 3, "sec": "3.2.3", "f": "为什么VolumeDeathHandler只在mMuteCount==0（第一次静音）时才调用linkToDeath？", "b": "为了避免非静音状态下对Binder资源的额外占用。只有在客户端执行过静音操作后，才对其生命状态感兴趣，才有保存其VolumeDeathHandler的必要。另外mICallback可能为空（AudioManager自己也可能会调用mute()，此时mICallback为null），所以linkToDeath前要判空。", "t": ["AudioService"]}, {"i": 108, "ch": 3, "sec": "3.2.3", "f": "VolumeDeathHandler.mute(false)（取消静音）的处理逻辑是什么？", "b": "若mMuteCount==0则打印错误日志（unexpected unmute）；否则先将mMuteCount减1；若减到0（这是客户端最后一次有效的取消静音），则把自己从mDeathHandlers中移除、调用mICallback.unlinkToDeath(this, 0)解除死亡监听；并且如果此时全局muteCount()==0（该流类型不再被任何客户端静音），则将流的音量值设置回静音前的音量，即lastAudibleIndex。", "t": ["AudioService"]}, {"i": 109, "ch": 3, "sec": "3.2.3", "f": "VolumeDeathHandler.binderDied()是如何消除意外退出客户端遗留影响的？", "b": "实现为：若mMuteCount不为0，则先置mMuteCount = 1，然后调用mute(false)。这样相当于替已崩溃的客户端执行了一次有效的取消静音，使其静音计数从1减到0，从而完成移除handler、unlinkToDeath、并在全局计数归零时恢复音量等清理工作，消除该客户端遗留的静音影响。", "t": ["AudioService"]}, {"i": 110, "ch": 3, "sec": "3.2.4", "f": "总结：AudioService音量管理的核心类有哪些？各自的职责是什么？", "b": "1) VolumeStreamState：AudioService音量管理的核心，保存了一个流类型所有的音量信息（运行时音量，含mIndex和mLastAudibleIndex两个按设备索引的HashMap）；2) 音量的生效在底层AudioFlinger完成，所以音量设置要做两件事：更新VolumeStreamState存储的音量值，以及把音量设置到底层系统；3) VolumeDeathHandler是VolumeStreamState的内部类，一个实例对应在一个流类型上执行了静音操作的一个客户端，是实现静音功能的核心对象。", "t": ["AudioService"]}, {"i": 111, "ch": 3, "sec": "3.2.1", "f": "对比：adjustSuggestedStreamVolume()与setStreamVolume()在确定流类型和音量处理上的主要区别？", "b": "adjustSuggestedStreamVolume()（音量键路径）：流类型只是\"建议\"，实际由mVolumeControlStream或getActiveStreamType()决定，按步进值（rescaleIndex(10,...)）调整音量；setStreamVolume()（设置界面路径）：流类型由调用者显式指定（ensureValidStreamType校验），可将音量设置为范围内任意值，需先用rescaleIndex把音量从源流刻度映射到目标流刻度。两者最终都会走setIndex + MSG_SET_DEVICE_VOLUME + sendVolumeUpdate()的相似流程。", "t": ["AudioService"]}, {"i": 112, "ch": 3, "sec": "3.2.1", "f": "对比：mIndex与mLastAudibleIndex这两个HashMap的区别是什么？", "b": "都在VolumeStreamState中、以设备为键保存音量值。mIndex保存当前生效的音量设置；mLastAudibleIndex保存静音前最后一次可听到的音量（在setIndex且lastAudible为true时更新），取消静音时AudioService恢复到这里保存的音量。", "t": ["AudioService"]}, {"i": 113, "ch": 4, "sec": "4.1", "f": "Android系统中的窗口（Window）是什么？窗口的本质是什么？", "b": "窗口是屏幕上一块用于绘制各种UI元素并可以响应用户输入的矩形区域。从原理上讲，窗口的概念是独自占有一个Surface实例的显示区域。窗口的本质是进行绘制所使用的画布Surface，当一块Surface显示在屏幕上时，就是用户所看到的窗口。Dialog、Activity的界面、壁纸、状态栏、Toast等都是窗口。", "t": ["WMS"]}, {"i": 114, "ch": 4, "sec": "4.1", "f": "WMS（WindowManagerService）的主要职责有哪些？", "b": "WMS为所有窗口分配Surface，掌管Surface的显示顺序（Z-order）以及位置尺寸，控制窗口动画，并且还是输入系统的一个重要的中转站。它存在的必要性在于：每个窗口都有一块Surface供自己涂鸦，必然需要一个角色对所有窗口的Surface进行协调管理。", "t": ["WMS"]}, {"i": 115, "ch": 4, "sec": "4.1", "f": "根据对Surface的操作类型，Android显示系统可以分为哪三个层次？", "b": "（1）UI框架层：在Surface上绘制UI元素以及响应输入事件；（2）WMS：管理Surface的分配、层级顺序等；（3）SurfaceFlinger：将多个Surface按特定顺序（Z-order）混合并输出到FrameBuffer。", "t": ["WMS"]}, {"i": 116, "ch": 4, "sec": "4.1", "f": "本章分析的WMS两个基础子系统是什么？各自负责什么？", "b": "（1）布局系统（Layout System）：计算与管理窗口的位置、层次；（2）动画系统（Animation System）：根据布局系统计算的窗口位置与层次渲染窗口动画。", "t": ["WMS"]}, {"i": 117, "ch": 4, "sec": "4.1.1", "f": "SampleWindow示例中，IWindowSession和IWindow分别是什么角色？", "b": "IWindowSession是客户端向WMS请求窗口操作的中间代理，并且是进程唯一的（通过WindowManagerGlobal.getWindowSession()获取），客户端通过它向WMS发送add/relayout/remove等请求。IWindow继承自IWindow.Stub（Bn端位于应用程序一侧），在WMS一侧只能作为一个回调，并起到窗口Id的作用。", "t": ["WMS"]}, {"i": 118, "ch": 4, "sec": "4.1.1", "f": "在客户端创建一个窗口的步骤有哪些（以SampleWindow为例）？", "b": "（1）获取IWindowSession和WMS实例；（2）创建并初始化WindowManager.LayoutParams（最重要的是type属性，它是WMS对窗口进行ZOrder排序的依据）；（3）向WMS添加一个窗口令牌WindowToken（wms.addWindowToken()）；（4）向WMS添加一个窗口（mSession.add()，需在LayoutParams.token中指明所属令牌）；（5）向WMS申请对窗口进行重新布局（mSession.relayout()），此后窗口才拥有WMS分配的Surface画布。", "t": ["WMS"]}, {"i": 119, "ch": 4, "sec": "4.1.1", "f": "为什么SampleWindow没有向WMS声明WindowToken也能成功添加窗口？", "b": "因为其窗口类型被设为TYPE_SYSTEM_ALERT，属于系统窗口。对于系统窗口，WMS会自动（隐式）为其创建显示令牌，无需客户端操心。而应用窗口（APPLICATION类型）等则必须事先提供有效的WindowToken，否则添加失败。", "t": ["WMS"]}, {"i": 120, "ch": 4, "sec": "4.1.1", "f": "IWindowSession.relayout()的作用是什么？", "b": "根据窗口新的属性去调整其Surface相关的属性，或者重新创建一个Surface（例如窗口尺寸变化导致之前的Surface不满足要求）。向WMS添加窗口后仅仅是在WMS中注册，只有经过relayout之后，窗口才拥有WMS为其分配的画布（Surface通过参数返回给客户端），并被放置到LayoutParams指定的位置。", "t": ["WMS"]}, {"i": 121, "ch": 4, "sec": "4.1.1", "f": "客户端通过Surface在窗口上绘图的标准过程是怎样的？", "b": "（1）通过Surface.lockCanvas()（Surface.lock()）获取可以在其上作画的Canvas实例；（2）使用Canvas实例进行作画；（3）通过Surface.unlockCanvasAndPost()提交绘制结果；（4）随后调用mSession.finishDrawing()通知WMS绘制完成。也可以通过OpenGL作画。", "t": ["WMS"]}, {"i": 122, "ch": 4, "sec": "4.1.1", "f": "Choreographer是什么？SampleWindow和WMS分别用它做什么？", "b": "Choreographer意为编舞指导，是Jelly Bean新增的工具类。它拥有从显示子系统获取VSYNC同步事件的能力，总是在VSYNC同步时回调，可在合适的时机通知渲染动作，避免渲染过程中因屏幕重绘导致画面撕裂。SampleWindow用它安排动画帧（postCallback）；WMS用它负责驱动所有窗口动画、屏幕旋转动画、墙纸动画的渲染。", "t": ["WMS"]}, {"i": 123, "ch": 4, "sec": "4.1.1", "f": "SampleWindow中卸载（销毁）窗口需要做哪两件事？", "b": "（1）mSession.remove(mWindow)：从WMS处卸载窗口；（2）wms.removeWindowToken(mToken)：从WMS处移除之前添加的显示令牌。", "t": ["WMS"]}, {"i": 124, "ch": 4, "sec": "4.1.1", "f": "SampleWindow是如何被启动的？app_process与zygote有什么关系？", "b": "samplewindow.jar不是可执行程序，需借助Android的app_process工具加载执行（通过sw.sh脚本设置CLASSPATH后以app_process启动指定类的main函数）。app_process其实就是大名鼎鼎的zygote，不过只有使用--zygote参数启动时它才会改名为zygote，否则就像java -jar一样运行指定类的main静态函数。", "t": ["WMS"]}, {"i": 125, "ch": 4, "sec": "4.1.2", "f": "WMS的创建（启动）分为哪三个阶段？分别由SystemServer中的哪些调用完成？", "b": "（1）创建WMS实例：在SystemServer.java的ServerThread.run()中调用WindowManagerService.main()创建实例，并通过ServiceManager.addService(Context.WINDOW_SERVICE, wm)注册；（2）初始化显示信息：调用wm.displayReady()；（3）处理systemReady通知：调用wm.systemReady()。", "t": ["WMS"]}, {"i": 126, "ch": 4, "sec": "4.1.2", "f": "WindowManagerService.main()是如何创建WMS实例的？runWithScissors()有什么特点？", "b": "main()通过wmHandler.runWithScissors()在SystemServer专为WMS创建的名为“WindowManager”的HandlerThread线程上新建WindowManagerService实例，WMS所需的Looper对象（Handler、Choreographer等）都运行在该线程。runWithScissors()是Android 4.2新增的Handler API：它会在Handler所在线程中执行传入的Runnable，同时阻塞调用线程的执行，直到Runnable的run()执行完毕。", "t": ["WMS"]}, {"i": 127, "ch": 4, "sec": "4.1.2", "f": "WMS构造函数中完成了哪些重要初始化工作？", "b": "（1）初始化DisplayContent列表：对每个Display调用createDisplayContentLocked()（DisplayContent是Android 4.2为支持多屏幕输出引入的概念，指代一块屏幕）；（2）保存InputManagerService到mInputManager；（3）创建mAnimator（WindowAnimator），管理所有窗口的动画；（4）在“UI”线程中通过initPolicy(uiHandler)初始化mPolicy（WindowManagerPolicy）；（5）将自己加入Watchdog监控。", "t": ["WMS"]}, {"i": 128, "ch": 4, "sec": "4.1.2", "f": "WMS启动的displayReady()和systemReady()阶段分别做了什么？", "b": "displayReady()主要初始化显示尺寸信息；完成后WMS会要求ActivityManagerService进行第一次Configuration的更新。systemReady()阶段WMS本身不再做任何操作，直接调用mPolicy的systemReady()函数。", "t": ["WMS"]}, {"i": 129, "ch": 4, "sec": "4.1.2", "f": "WMS的重要成员mInputManager、mChoreographer、mAnimator分别是什么？", "b": "mInputManager：InputManagerService实例，管理每个窗口的输入事件通道（InputChannel）并向通道派发事件；mChoreographer：编舞指导，从显示子系统获取VSYNC同步事件，WMS用它驱动所有窗口动画、屏幕旋转动画、墙纸动画的渲染；mAnimator：WindowAnimator实例，是所有窗口动画的总管（窗口动画是WindowStateAnimator对象），在Choreographer驱动下逐个渲染所有动画。", "t": ["WMS"]}, {"i": 130, "ch": 4, "sec": "4.1.2", "f": "mPolicy是什么？它为WMS承担了哪些职责？", "b": "mPolicy是WindowManagerPolicy的一个实现，目前只有PhoneWindowManager一个实现类，是WMS的“首席顾问”。职责包括：告诉WMS某一类型窗口的ZOrder值是多少（windowTypeToLayerLw等）；帮助WMS矫正不合理的窗口属性（adjustWindowParamsLw）；监听屏幕旋转状态；预处理一些系统按键事件（HOME、BACK键等的默认行为在这里实现）；添加窗口时进行权限检查checkAddPermission()。它是WMS中最重要的成员之一。", "t": ["WMS"]}, {"i": 131, "ch": 4, "sec": "4.1.2", "f": "什么是DisplayContent？它由谁管理？默认屏幕的ID是什么？", "b": "DisplayContent是Android 4.2为支持多屏幕输出（如基于Wi-Fi Display技术的虚拟屏幕）引入的概念，一个DisplayContent描述一块可以绘制窗口的屏幕。每个DisplayContent用一个整型变量作为ID，手机默认屏幕的ID由Display.DEFAULT_DISPLAY常量指定。DisplayContent的管理由DisplayManagerService完成。", "t": ["WMS"]}, {"i": 132, "ch": 4, "sec": "4.1.2", "f": "WMS的mTokenMap保存什么？它有哪些衍生子集？其中mAppTokens有什么特殊性质？", "b": "mTokenMap是一个HashMap，保存了所有的显示令牌（类型为WindowToken），用于窗口管理，键为客户端声明Token的Binder实例。衍生子集：mAppTokens保存所有属于Activity的显示令牌（WindowToken的子类AppWindowToken），mExitingTokens保存正在退出过程中的显示令牌。mAppTokens列表是有序的，它与AMS中的mHistory列表的顺序保持一致，反映了系统中Activity的顺序。", "t": ["WMS"]}, {"i": 133, "ch": 4, "sec": "4.1.2", "f": "WMS的mWindowMap保存什么？有哪些衍生子集？DisplayContent中的windows列表有何特点？", "b": "mWindowMap是一个HashMap，保存所有窗口的状态信息（类型为WindowState），键值为IWindow的Bp端，它是整个系统所有窗口的一个全集。衍生子集：mPendingRemove保存退出动画播放完成并即将被移除的窗口，mLosingFocus保存失去了输入焦点的窗口。每个DisplayContent中也有一个windows列表，存储显示在该DisplayContent中的窗口且是有序的，窗口在此列表中的位置决定了其最终显示时的Z序。", "t": ["WMS"]}, {"i": 134, "ch": 4, "sec": "4.1.2", "f": "WMS的mSessions和mRotation分别保存什么？", "b": "mSessions是一个List，元素类型为Session。Session是IWindowSession的Bn端，因此mSessions保存了当前所有向WMS寻求窗口管理服务的客户端，Session是进程唯一的。mRotation是一个int型变量，保存当前手机的旋转状态。", "t": ["WMS"]}, {"i": 135, "ch": 4, "sec": "4.2", "f": "WMS的addWindow()函数前半部分的大致流程是什么？涉及哪三个重要概念？", "b": "流程：（1）mPolicy.checkAddPermission()检查权限；（2）通过displayId获取窗口要添加到的DisplayContent（未指定则Session选择DEFAULT_DISPLAY）；（3）若是子窗口则要求父窗口已存在；（4）根据attrs.token从mTokenMap取出WindowToken并验证类型一致性（必要时隐式创建Token）；（5）创建WindowState对象；（6）mPolicy.adjustWindowParamsLw()矫正属性、prepareAddWindowLw()检查；（7）将Token（若隐式创建）放入mTokenMap、WindowState放入mWindowMap。三个重要概念：WindowToken、WindowState、DisplayContent。", "t": ["WMS"]}, {"i": 136, "ch": 4, "sec": "4.2", "f": "addWindow()对子窗口的添加有哪些限制？", "b": "（1）添加子窗口时要求其父窗口必须已经存在，否则返回ADD_BAD_SUBWINDOW_TOKEN；（2）WMS要求窗口的层级关系最多为两层，即子窗口的父窗口不能再是子窗口（否则同样返回ADD_BAD_SUBWINDOW_TOKEN）。对于子窗口，attrs.token表示其父窗口。", "t": ["WMS"]}, {"i": 137, "ch": 4, "sec": "4.2", "f": "哪些类型的窗口必须事先向WMS声明WindowToken才能添加？否则结果如何？", "b": "应用窗口（type在FIRST_APPLICATION_WINDOW与LAST_APPLICATION_WINDOW之间）、TYPE_INPUT_METHOD、TYPE_WALLPAPER、TYPE_DREAM。若未通过LayoutParams.token指定已添加至WMS的有效Token，添加将失败（返回ADD_BAD_APP_TOKEN）。其他类型的窗口则不需要，WMS会隐式创建一个WindowToken。", "t": ["WMS"]}, {"i": 138, "ch": 4, "sec": "4.2", "f": "对于APPLICATION类型的窗口，addWindow()对其WindowToken有什么额外要求？", "b": "要求对应的WindowToken的类型也为APPLICATION，且必须是WindowToken的子类AppWindowToken（token.appWindowToken不为null），否则返回ADD_NOT_APP_TOKEN；若atoken.removed为true则返回ADD_APP_EXITING；若是TYPE_APPLICATION_STARTING类型且该Activity已绘制过第一个窗口（firstWindowDrawn），则返回ADD_STARTING_NOT_NEEDED。对于INPUT_METHOD/WALLPAPER/DREAM类型，窗口类型必须与WindowToken的windowType一致。", "t": ["WMS"]}, {"i": 139, "ch": 4, "sec": "4.2.1", "f": "WindowToken的意义是什么？", "b": "WindowToken将属于同一个应用组件（可以是Activity、InputMethod、Wallpaper、Dream）的窗口组织在一起，在WMS管理中用WindowToken指代一个应用组件。例如ZOrder排序时，属于同一WindowToken的窗口会被安排在一起，其定义的属性会影响所有属于此Token的窗口。WindowToken具有令牌的作用，是对应用组件行为进行规范管理的手段：它由应用组件或其管理者向WMS声明并持有，应用组件需要新窗口时必须出示Token表明身份，且窗口类型必须与Token类型一致。", "t": ["WMS"]}, {"i": 140, "ch": 4, "sec": "4.2.1", "f": "创建系统类型的窗口不需要提供Token，Android如何保证安全性？", "b": "addWindow()函数一开始会调用mPolicy.checkAddPermission()，要求客户端必须拥有SYSTEM_ALERT_WINDOW或INTERNAL_SYSTEM_WINDOW权限才能创建系统类型的窗口。因此虽然WMS会为系统窗口隐式创建Token，但并非谁都可以添加系统级窗口。", "t": ["WMS"]}, {"i": 141, "ch": 4, "sec": "4.2.1", "f": "如何向WMS声明一个WindowToken？声明者需要什么权限？", "b": "调用WMS的addWindowToken(IBinder token, int type)函数：它会创建一个WindowToken实例并放入mTokenMap，键值为客户端用于声明Token的Binder实例。调用者必须拥有android.Manifest.permission.MANAGE_APP_TOKENS权限，否则抛出SecurityException。只要是一个Binder对象（随便一个），都可以作为Token声明；对客户端而言Token仅仅是一个Binder对象。", "t": ["WMS"]}, {"i": 142, "ch": 4, "sec": "4.2.1", "f": "显式声明与隐式创建的WindowToken有什么区别？", "b": "隐式创建的WindowToken（addWindow()中new WindowToken(..., false)）：当其最后一个窗口被移除后，该WindowToken会被一并从mTokenMap中移除。显式声明的WindowToken（addWindowToken()中new WindowToken(..., true)）：只能通过removeWindowToken()显式地移除。", "t": ["WMS"]}, {"i": 143, "ch": 4, "sec": "4.2.1", "f": "WindowToken的两层含义是什么（客户端一侧与WMS一侧）？", "b": "（1）对于显示组件（客户端）而言，Token是任意一个Binder的实例，仅仅是创建窗口的令牌，没有其他含义；（2）对于WMS而言，WindowToken是一个WindowToken类的实例，保存了对应客户端一侧的Token（Binder实例），并以这个Token为键存储于mTokenMap中。客户端一侧的Token是否已被声明，取决于其对应的WindowToken是否位于mTokenMap中。一般称客户端一侧的Binder实例为Token，称WMS一侧的对象为WindowToken。", "t": ["WMS"]}, {"i": 144, "ch": 4, "sec": "4.2.1", "f": "Wallpaper的Token由谁在何处声明和取消？它对Wallpaper形成了哪些限制？", "b": "Wallpaper的Token声明在WallpaperManagerService的bindWallpaperComponentLocked()函数中（调用mIWindowManager.addWindowToken(newConn.mToken, TYPE_WALLPAPER)），取消声明在detachWallpaperLocked()中（removeWindowToken）。限制：（1）Wallpaper只能创建TYPE_WALLPAPER类型的窗口；（2）Wallpaper显示的生命周期由WallpaperManagerService牢牢控制，仅有当前的Wallpaper才能创建窗口并显示内容，其他Wallpaper因没有有效Token而无法创建窗口。", "t": ["WMS"]}, {"i": 145, "ch": 4, "sec": "4.2.1", "f": "InputMethod的Token在何处声明与取消？作用是什么？", "b": "InputMethod的Token声明位于InputMethodManagerService的startInputInnerLocked()函数中，取消声明位于InputMethodManagerService的unbindCurrentMethodLocked()函数。InputMethodManagerService通过Token限制着每一个InputMethod的窗口类型以及显示生命周期。", "t": ["WMS"]}, {"i": 146, "ch": 4, "sec": "4.2.1", "f": "Activity的Token由谁在何处声明？如何交付给Activity？在何处取消？", "b": "WMS专为Activity实现了WindowToken的子类AppWindowToken。声明在ActivityManagerService一侧的ActivityStack.startActivityLocked()中（调用addAppToken(addPos, r.appToken, ...)）；r.appToken在ActivityRecord的构造函数中创建。随后在realStartActivityLocked()中通过app.thread.scheduleLaunchActivity()将Token交付给即将启动的Activity，启动后的Activity即可用它创建TYPE_APPLICATION类型的窗口。取消声明位于ActivityStack.removeActivityFromHistoryLocked()。", "t": ["WMS"]}, {"i": 147, "ch": 4, "sec": "4.2.1", "f": "Activity的Token（IApplicationToken）定义了哪些回调？其中哪个可能导致ANR？", "b": "（1）windowsDrawn()：窗口完成首次绘制后通知AMS；（2）windowsVisible()：窗口可见时通知AMS；（3）windowsGone()：窗口不可见时通知AMS；（4）keyDispatchingTimeout()：窗口没能按时完成输入事件的处理，这个回调将导致ANR；（5）getKeyDispatchingTimeout()：从AMS处获取判定ANR的时间。因此Activity的Token不只是简单的Binder实例。", "t": ["WMS"]}, {"i": 148, "ch": 4, "sec": "4.2.1", "f": "appToken如何粘结AMS的ActivityRecord与WMS的AppWindowToken？AMS借此能做什么？", "b": "AMS通过ActivityRecord表示一个Activity，ActivityRecord的appToken在其构造函数中被创建；WMS接受AMS对Token的声明后为其创建唯一的AppWindowToken。类型为IApplicationToken的Binder对象appToken粘结了两者：给定一个ActivityRecord，即可通过appToken在WMS中找到对应的AppWindowToken。例如AMS认为某Activity需要隐藏时，以其appToken为参数调用WMS的setAppVisibility()，该函数通过appToken找到AppWindowToken，将属于此Token的所有窗口隐藏。", "t": ["WMS"]}, {"i": 149, "ch": 4, "sec": "4.2.1", "f": "AMS调整ActivityRecord在mHistory中的顺序时，WMS侧需要做什么？为什么？", "b": "每当AMS因某些原因（如启动/结束一个Activity、将Task移到前台或后台）调整ActivityRecord在mHistory中的顺序时，都会调用WMS相关的接口移动AppWindowToken在mAppTokens中的顺序，以保证两者顺序一致。因为AppWindowToken在mAppTokens中的顺序就是Activity的顺序，它对窗口的显示顺序影响非常大。", "t": ["WMS"]}, {"i": 150, "ch": 4, "sec": "4.2.2", "f": "WindowState是什么？它在WMS和客户端两侧的对应物分别是什么？", "b": "向WMS添加窗口时，WMS会为其创建一个WindowState。WindowState表示一个窗口的所有属性，是WMS中事实上的窗口。在显示组件一侧它对应的类型是IWindow.Stub（Bn端在应用侧），提供了很多与窗口管理相关的通知回调，例如尺寸变化、焦点变化等。新的WindowState被保存到mWindowMap中，键值为IWindow的Bp端。", "t": ["WMS"]}, {"i": 151, "ch": 4, "sec": "4.2.2", "f": "对比mTokenMap与mWindowMap：两者保存什么数据？键有什么区别？", "b": "这两个HashMap维护了WMS中最重要的两类数据，键都是IBinder。区别：mTokenMap的键可能是IAppWindowToken的Bp端（使用addAppToken()声明，对应Activity的Token），或者是其他任意一个Binder的Bp端（使用addWindowToken()声明）；而mWindowMap的键一定是IWindow的Bp端，值为WindowState。", "t": ["WMS"]}, {"i": 152, "ch": 4, "sec": "4.2.3", "f": "DisplayContent是按什么对窗口分组的？它最重要的特性是什么？", "b": "如果说WindowToken按照窗口之间的逻辑关系将其分组，那么DisplayContent则根据窗口的显示位置将其分组：隶属于同一个DisplayContent的窗口将被显示在同一个屏幕中，添加窗口时通过指定其唯一ID决定窗口显示在哪个屏幕。DisplayContent具有很强的隔离性：处于不同DisplayContent的两个窗口在布局、显示顺序以及动画处理上不会产生任何耦合，就像一个孤岛，所有这些操作都可以在其内部独立执行，原本WMS全局性的操作变成了DisplayContent内部的操作。", "t": ["WMS"]}, {"i": 153, "ch": 4, "sec": "4.3", "f": "窗口的Z序（Z order）是如何定义的？", "b": "手机屏幕是以左上角为原点、向右为X轴、向下为Y轴的二维空间。为了方便管理窗口的显示次序，屏幕被扩展为三维空间，多定义了一个Z轴，方向为垂直于屏幕表面指向屏幕外。多个窗口依照其前后顺序排布在这个虚拟的Z轴上，因此窗口的显示次序又被称为Z序（Z order）。", "t": ["WMS"]}, {"i": 154, "ch": 4, "sec": "4.3.1", "f": "WindowState用什么两个字段描述窗口的显示次序？它们的含义和取值规则是什么？", "b": "主序mBaseLayer和子序mSubLayer。主序描述窗口及其子窗口在所有窗口中的显示位置，主序越大位置越靠前（显示在越上层）；子序描述子窗口在其兄弟窗口中的显示位置，子序越大越靠前。对于父窗口，主序取决于其类型，子序保持为0；子窗口的主序与其父窗口一样，子序取决于其自身类型。", "t": ["WMS"]}, {"i": 155, "ch": 4, "sec": "4.3.1", "f": "主序与子序分别由WindowManagerPolicy的哪两个函数分配？计算公式是什么？", "b": "普通窗口：mBaseLayer = mPolicy.windowTypeToLayerLw(类型) * WindowManagerService.TYPE_LAYER_MULTIPLIER + WindowManagerService.TYPE_LAYER_OFFSET，mSubLayer = 0；子窗口：主序按其父窗口（attachedWindow）的类型用windowTypeToLayerLw()计算，子序由mPolicy.subWindowTypeToLayerLw(自身类型)计算。这些在WindowState的构造函数中完成。", "t": ["WMS"]}, {"i": 156, "ch": 4, "sec": "4.3.1", "f": "为什么WALLPAPER类型窗口的主序与应用窗口相同（都是21000）？", "b": "看似不合常理（壁纸应在所有Activity之下），其实WALLPAPER窗口是一个“很不安分的角色”，需要在所有APPLICATION窗口之间跳来跳去。因为有的Activity指定了android:windowShowWallpaper为true，表示要求将当前壁纸作为其窗口背景；对WMS来说最简单的办法就是将WALLPAPER窗口放置到紧邻拥有此样式的窗口的下方。为保证主序决定窗口顺序的原则，WALLPAPER使用了与APPLICATION相同的主序。", "t": ["WMS"]}, {"i": 157, "ch": 4, "sec": "4.3.1", "f": "MEDIA和MEDIA_OVERLAY类型子窗口的子序为什么是负值？它们由什么控件创建？", "b": "子序为负表明它们的显示次序位于其父窗口的后面。这两个类型的子窗口由SurfaceView控件创建：SurfaceView被实例化后会向WMS添加一个类型为MEDIA的子窗口，父窗口即承载SurfaceView控件的窗口。该子窗口的Surface用于视频回放、相机预览或游戏绘制，它必须位于父窗口的后面，以免遮挡父窗口中承载的其他控件（如播放/暂停按钮等）。", "t": ["WMS"]}, {"i": 158, "ch": 4, "sec": "4.3.2", "f": "addWindow()后半部分确定窗口显示次序的两个关键函数是什么？各自的作用？", "b": "（1）addWindowToListInOrderLocked(win, true)：将新建的WindowState按照一定的顺序插入到当前DisplayContent的mWindows列表中（该列表严格按显示顺序存储所有窗口的WindowState）；（2）assignLayersLocked(displayContent.getWindowList())：根据mWindows的存储顺序对DisplayContent中所有WindowState的主序和子序进行调整，分配最终的显示次序。", "t": ["WMS"]}, {"i": 159, "ch": 4, "sec": "4.3.2", "f": "DisplayContent的mWindows列表的存储顺序与显示顺序是什么关系？", "b": "mWindows列表是按照主序与子序的升序进行排序的，所以显示靠后的窗口放在列表靠前的位置，显示靠前的窗口位于列表的后面，即列表顺序与显示顺序是相反的。阅读代码时要牢记这一点；书中叙述的“前后”如非特别强调，都指显示顺序而不是列表存储顺序。", "t": ["WMS"]}, {"i": 160, "ch": 4, "sec": "4.3.2", "f": "addWindowToListInOrderLocked()中子窗口的排序规则是什么？", "b": "子窗口的位置计算是相对父窗口的，并根据其子序排序。由于父窗口的子序为0，所以子序为负数的窗口放置在父窗口的后面，子序为正数的窗口放置在父窗口的前面。如果新窗口与现有窗口子序相等：正数子序的新窗口位于现有窗口的前面，负数子序的新窗口位于现有窗口的后面（即正子序越新越靠前，负子序越新越靠后）。", "t": ["WMS"]}, {"i": 161, "ch": 4, "sec": "4.3.2", "f": "addWindowToListInOrderLocked()中非应用窗口的排序规则是什么？", "b": "非应用窗口依照主序进行排序：主序高者排在前面；当现有窗口的主序与新窗口相同时，新窗口位于现有窗口的前面。", "t": ["WMS"]}, {"i": 162, "ch": 4, "sec": "4.3.2", "f": "addWindowToListInOrderLocked()中应用窗口的排序规则是什么？为什么需要区别于非应用窗口？", "b": "所有应用窗口的初始主序都是21000，且同应用的窗口显示位置必须相邻，仅靠主序无法实现，需依赖Activity的顺序（AppWindowToken在mAppTokens中的顺序）。规则：（1）若当前应用已有窗口在显示（存储于WindowState.appWindowToken.windows中），新窗口插入到其所属应用其他窗口的前面，但保证STARTING_WINDOW永远位于最前方、TYPE_BASE_APPLICATION永远位于最后方；（2）若是该应用的第一个窗口，则参照其他应用的窗口顺序，插入到位于前面的最后一个应用的最后一个窗口的后方，或位于后面的第一个应用的最前一个窗口的前方；（3）若没有任何窗口可以参照，则直接根据主序插入。", "t": ["WMS"]}, {"i": 163, "ch": 4, "sec": "4.3.2", "f": "assignLayersLocked()如何为窗口分配最终的显示次序mLayer？", "b": "遍历mWindows列表逐个分配：若窗口的主序与当前记录的curBaseLayer相同（或是输入法窗口、壁纸窗口），则curLayer += WINDOW_LAYER_MULTIPLIER，并将curLayer作为其显示次序（即第i个相同主序的窗口的显示次序为主序基础上增加偏移）；若主序不同，则直接将主序作为其显示次序并更新curBaseLayer和curLayer。经过addWindowToListInOrderLocked()处理后，拥有相同主序的窗口在列表中都是相邻的。若某窗口的mLayer发生变化会进行标记，并在有变化时通知DisplayContent的监听者。", "t": ["WMS"]}, {"i": 164, "ch": 4, "sec": "4.3.2", "f": "WindowState的mLayer与WindowStateAnimator的mAnimLayer有什么区别与联系？", "b": "mLayer属于窗口管理体系的WindowState，意义偏向窗口管理；mAnimLayer属于动画体系的WindowStateAnimator/AppWindowAnimator，意义偏向动画，由于动画系统维护着窗口的Surface，因此mAnimLayer是Surface的实际显示次序。绝大多数窗口mAnimLayer = mLayer；当窗口附属为一个Activity（或输入法窗口指定了mTargetAppToken）时，mAnimLayer = mLayer + mAppToken.mAppAnimator.animLayerAdjustment，即加入AppWindowAnimator的矫正值。没有动画时两者相等。", "t": ["WMS"]}, {"i": 165, "ch": 4, "sec": "4.3.2", "f": "动画的Z序矫正值animLayerAdjustment是如何确定的？动画结束后会怎样？", "b": "矫正值来自AppWindowAnimator所使用的Animation。当Animation.getZAdjustment()返回Animation.ZORDER_TOP（要求动画对象的ZOrder位于其他对象之上）时，矫正为+WindowManagerService.TYPE_LAYER_OFFSET（1000），窗口在动画过程中会显示在其他同主序窗口之上；返回ZORDER_BOTTOM时矫正为-1000，窗口显示在其他同主序窗口之下。动画完结后，mAnimLayer会被重新赋值为WindowState.mLayer，使窗口回到其应有的位置。", "t": ["WMS"]}, {"i": 166, "ch": 4, "sec": "4.3.2", "f": "assignLayersLocked()相关的Z序矫正中存在什么隐藏bug？", "b": "矫正值为常数1000（TYPE_LAYER_OFFSET）。当同主序的窗口数量大于200时，应用窗口的mLayer值可能超过22000，此时对mLayer值为21000的窗口应用矫正后，仍无法保证动画窗口位于同主序窗口之上。不过超过200个应用窗口的情况非常少见，且bug仅在动画过程中出现，Google貌似也懒得解决这个问题。", "t": ["WMS"]}, {"i": 167, "ch": 4, "sec": "4.3.3", "f": "最终的显示次序是通过哪个函数、什么调用设置到Surface上的？为什么addWindow()中没有相关代码？", "b": "设置显示次序到Surface的代码位于WindowStateAnimator.prepareSurfaceLocked()函数中，通过Surface.setLayer()完成，将显示次序设置进SurfaceFlinger。addWindow()中看不到相关代码是因为新建的窗口此时尚无Surface——只有执行session.relayout()之后WMS才为新窗口分配Surface，之后才能为新窗口的Surface设置新的显示次序。", "t": ["WMS"]}, {"i": 168, "ch": 4, "sec": "4.3.4", "f": "总结：WMS确定并应用窗口显示次序的完整流程是什么？", "b": "（1）窗口根据自己的类型得出主序mBaseLayer及子序mSubLayer（WindowState构造函数中由WindowManagerPolicy的windowTypeToLayerLw()/subWindowTypeToLayerLw()分配）；（2）addWindowToListInOrderLocked()根据主序、子序以及所属Activity的顺序（mAppTokens），按升序将WindowState排列在DisplayContent的mWindows列表中；（3）assignLayersLocked()为mWindows中的所有窗口分配最终的显示次序mLayer（及动画系统的mAnimLayer）；（4）WMS的动画系统在WindowStateAnimator.prepareSurfaceLocked()中通过Surface.setLayer()将最终显示次序设置进SurfaceFlinger。", "t": ["WMS"]}, {"i": 169, "ch": 5, "sec": "5.1", "f": "当输入设备可用或不可用时，Linux内核在/dev/input/下会做什么？用户操作设备后原始事件如何产生？用户空间如何获取设备信息与事件数据？", "b": "输入设备可用时，内核在/dev/input/下创建名为event0~n或其他名称的设备节点；设备不可用时删除对应节点。用户操作输入设备时，内核接收到硬件中断，将中断加工成原始的输入事件数据写入其对应的设备节点中。用户空间可通过ioctl从设备节点获取输入设备的类型、厂商、描述等信息，通过read()读出事件数据。", "t": ["输入系统"]}, {"i": 170, "ch": 5, "sec": "5.1.1", "f": "getevent工具的作用是什么？它输出的内容有何特点？", "b": "getevent用于监听输入设备节点的内容，当输入事件被写入节点时将其读出并打印在屏幕上。由于它不会对事件数据做任何加工，其输出是由内核提供的最原始的事件。用法：adb shell getevent [-选项] [device_path]，device_path可选，省略则监听所有设备节点；-t参数表示打印事件的时间戳。", "t": ["输入系统"]}, {"i": 171, "ch": 5, "sec": "5.1.1", "f": "getevent的一条输出（如 [1262.443489] /dev/input/event0: 0001 0074 00000001）包含哪五项信息？原始事件的四项基本元素是什么？", "b": "五项信息：产生事件时的时间戳、产生事件的设备节点、事件类型、事件代码、事件的值（输出为十六进制）。时间戳、类型、代码、值便是原始事件的四项基本元素；除时间戳外，其他三项的实际意义依照设备类型及厂商的不同而有所区别。", "t": ["输入系统"]}, {"i": 172, "ch": 5, "sec": "5.1.1", "f": "以电源键为例，原始事件中类型0x01、代码0x74、值0x01/0x00分别表示什么？这些原始数据最终变成什么？", "b": "类型0x01表示此事件为一条按键事件；代码0x74表示电源键的扫描码；值0x01表示按下，0x00表示抬起。这两条原始数据被输入系统包装成两个KeyEvent对象，作为两个按键事件派发给Framework中感兴趣的模块或应用程序。", "t": ["输入系统"]}, {"i": 173, "ch": 5, "sec": "5.1.1", "f": "为什么触摸屏点击/滑动这类Android API输入事件包含XY坐标、触摸点索引等丰富信息，而一条原始事件信息量有限？", "b": "一条原始事件所包含的信息量比较有限，触摸屏点击/滑动等输入事件其实是输入系统整合了多个原始事件后的结果（翻译、组装、封装的过程）。", "t": ["输入系统"]}, {"i": 174, "ch": 5, "sec": "5.1.1", "f": "sendevent工具的作用、用法是什么？如何用它产生长按电源键（关机对话框）的效果？", "b": "sendevent用于将原始事件写入输入设备节点以模拟用户输入。用法：sendevent <节点路径> <类型><代码> <值>，参数与getevent的输出相对应，但为十进制（如电源键代码0x74即116）。执行\"sendevent /dev/input/event0 1 116 1\"（按下）与\"1 116 0\"（抬起）即模拟点击；两条命令执行的时间间隔便是按住电源键的保持时间，迟迟不执行第二条就产生长按效果。输入设备节点在用户空间可读可写的特性为自动化测试提供了高效途径。", "t": ["输入系统"]}, {"i": 175, "ch": 5, "sec": "5.1.2", "f": "Android输入系统的起点和终点分别是什么？最初与最终的事件形式分别是什么？", "b": "起点是位于/dev/input/下的设备节点（内核生成的原始事件），终点是由WMS管理的某个窗口。最初的输入事件为内核生成的原始事件，最终交付给窗口的则是KeyEvent或MotionEvent对象。", "t": ["输入系统"]}, {"i": 176, "ch": 5, "sec": "5.1.2", "f": "列出Android输入系统的基本参与者（图5-1）。", "b": "Linux内核（接受中断并写入设备节点）、设备节点（内核与IMS的桥梁）、InputManagerService、EventHub、InputReader、InputReaderPolicy、InputDispatcher、InputDispatcherPolicy、WMS、ViewRootImpl。", "t": ["输入系统"]}, {"i": 177, "ch": 5, "sec": "5.1.2", "f": "InputManagerService分为Java层和Native层两部分，各自负责什么？", "b": "Java层负责与WMS的通信；Native层则是InputReader和InputDispatcher两个输入系统关键组件的运行容器。", "t": ["输入系统"]}, {"i": 178, "ch": 5, "sec": "5.1.2", "f": "EventHub的职责是什么？它通过哪个函数向使用者返回事件？返回的事件包括哪些？", "b": "EventHub（事件集线器）直接访问所有的设备节点，通过一个名为getEvents()的函数将所有输入系统相关的待处理的底层事件返回给使用者，这些事件包括原始输入事件、设备节点的增删等。", "t": ["输入系统"]}, {"i": 179, "ch": 5, "sec": "5.1.2", "f": "InputReader的职责是什么？它如何从EventHub获取事件并对两类事件分别处理？", "b": "InputReader运行于一个独立的线程中，负责管理输入设备的列表与配置，以及进行输入事件的加工处理。它通过其线程循环不断地通过getEvents()从EventHub中取出事件：对于设备节点的增删事件，更新输入设备列表与配置；对于原始输入事件，对其进行翻译、组装、封装为包含更多信息、更具可读性的输入事件，然后交给InputDispatcher进行派发。", "t": ["输入系统"]}, {"i": 180, "ch": 5, "sec": "5.1.2", "f": "InputDispatcher的职责是什么？它的窗口信息从何而来？", "b": "InputDispatcher也运行于一个独立的线程中，是IMS的另一个关键组件。它保管了来自WMS的所有窗口的信息，收到来自InputReader的输入事件后，会在其保管的窗口中寻找合适的窗口，并将事件派发给此窗口。", "t": ["输入系统"]}, {"i": 181, "ch": 5, "sec": "5.1.2", "f": "InputReaderPolicy和InputDispatcherPolicy分别提供什么？举一个InputDispatcherPolicy截取事件的典型例子。", "b": "InputReaderPolicy为InputReader的事件加工处理提供策略配置（例如键盘布局信息）；InputDispatcherPolicy为InputDispatcher的派发过程提供策略控制，例如截取某些特定输入事件用作特殊用途，或阻止将某些事件派发给目标窗口。典型例子：HOME键被InputDispatcherPolicy截取到PhoneWindowManager中进行处理，并阻止窗口收到HOME键按下的事件。", "t": ["输入系统"]}, {"i": 182, "ch": 5, "sec": "5.1.2", "f": "WMS虽然不是输入系统的一员，但它对InputDispatcher的正常工作起了哪些至关重要的作用？", "b": "一是当新建窗口时，WMS为新窗口和IMS创建了事件传递所用的通道；二是WMS将所有窗口的信息（包括窗口的可点击区域、焦点窗口等）实时地更新到IMS的InputDispatcher中，使InputDispatcher可以正确地将事件派发到指定的窗口。", "t": ["输入系统"]}, {"i": 183, "ch": 5, "sec": "5.1.2", "f": "输入事件派发的终点一定是控件（View）吗？哪些窗口是例外？ViewRootImpl的角色是什么？", "b": "不全是。对于壁纸窗口、SurfaceView的窗口来说，窗口即是输入事件派发的终点；而对于Activity、对话框等使用了Android控件系统的窗口，输入事件的终点是控件（View）。ViewRootImpl将窗口所接收到的输入事件沿着控件树将事件派发给感兴趣的控件。", "t": ["输入系统"]}, {"i": 184, "ch": 5, "sec": "5.1.2", "f": "简述一个输入事件从内核到控件（View）的完整流转路径。", "b": "内核将原始事件写入设备节点 → InputReader不断地通过EventHub将原始事件取出并翻译加工成Android输入事件，交给InputDispatcher → InputDispatcher根据WMS提供的窗口信息将事件交给合适的窗口 → 窗口的ViewRootImpl对象沿着控件树将事件派发给感兴趣的控件 → 控件对收到的事件作出响应，更新画面、执行特定动作。所有参与者以IMS为核心构建输入体系。", "t": ["输入系统"]}, {"i": 185, "ch": 5, "sec": "5.1.3", "f": "IMS在哪个线程中启动？其诞生分为哪两个阶段？传入的wmHandler参数意味着什么？", "b": "IMS同其他系统服务一样在SystemServer的ServerThread线程中启动。诞生分两个阶段：①创建新的IMS对象（new InputManagerService(context, wmHandler)），随后ServiceManager.addService(Context.INPUT_SERVICE, ...)发布，并setWindowManagerCallbacks(wm.getInputMonitor())设置回调；②调用IMS的start()函数完成启动。wmHandler说明IMS的一部分功能可能会在WMS的线程中完成：IMS用wmHandler的Looper新建InputManagerHandler，因此它运行在WMS的主线程中。", "t": ["输入系统"]}, {"i": 186, "ch": 5, "sec": "5.1.3", "f": "IMS构造函数中nativeInit()创建了什么对象？返回值保存在哪里？该对象的作用是什么？", "b": "nativeInit()创建了一个NativeInputManager对象，并将其指针以jint形式返回给Java层的IMS，IMS将其保存在mPtr成员变量中。NativeInputManager是Native层组件与Java层IMS进行通信的桥梁。", "t": ["输入系统"]}, {"i": 187, "ch": 5, "sec": "5.1.3", "f": "NativeInputManager实现了哪两个接口？两个策略的实际决策由谁完成？", "b": "它实现了InputReaderPolicyInterface与InputDispatcherPolicyInterface两个接口，即InputReaderPolicy和InputDispatcherPolicy由NativeInputManager提供接口实现。但它仅仅为两个策略提供接口实现，并不是策略的实际实现者——NativeInputManager通过JNI回调Java层的IMS，由IMS完成决策。", "t": ["输入系统"]}, {"i": 188, "ch": 5, "sec": "5.1.3", "f": "NativeInputManager的构造函数创建了哪两个关键对象？InputManager的构造参数有何特点？", "b": "创建了EventHub（其复杂的构造函数使其在创建后便拥有监听设备节点的能力）和Native层的InputManager：mInputManager = new InputManager(eventHub, this, this)，其中readerPolicy与dispatcherPolicy两个参数都是NativeInputManager自身。", "t": ["输入系统"]}, {"i": 189, "ch": 5, "sec": "5.1.3", "f": "Native层InputManager的构造函数和initialize()分别创建了哪些对象？", "b": "构造函数创建了InputDispatcher（new InputDispatcher(dispatcherPolicy)）和InputReader（new InputReader(eventHub, readerPolicy, mDispatcher)）；initialize()创建了供InputReader运行的线程InputReaderThread和供InputDispatcher运行的线程InputDispatcherThread。", "t": ["输入系统"]}, {"i": 190, "ch": 5, "sec": "5.1.3", "f": "IMS创建完成后各组件处于什么状态？IMS.start()的作用是什么？", "b": "InputManager的创建过程虽为InputReader与InputDispatcher创建了承载运行的线程，但并未启动它们，IMS的各员大将仍处于待命状态。start()函数的作用就是启动这两个线程，使InputReader与InputDispatcher开始工作（InputReader在其线程循环中从EventHub抽取事件加工后放入InputDispatcher的派发队列）。", "t": ["输入系统"]}, {"i": 191, "ch": 5, "sec": "5.1.3", "f": "书中用\"三个线程，三台水泵\"形容输入事件的交付过程，这三个线程分别是什么？各自\"泵\"什么？", "b": "①InputReader线程：在线程循环中不断从EventHub中抽取原始输入事件，加工后放入InputDispatcher的派发队列；②InputDispatcher线程：在线程循环中将派发队列中的事件取出，查找合适的窗口，将事件写入窗口的事件接收管道；③窗口事件接收线程的Looper：从管道中将事件取出，交由事件处理函数进行事件响应。三个线程首尾相接，像三台水泵一层层地将事件交付给事件处理函数。start()相当于为Reader、Dispatcher两台水泵按下开关，而Looper这台水泵在窗口创建时便已运行。", "t": ["输入系统"]}, {"i": 192, "ch": 5, "sec": "5.1.3", "f": "IMS内部在抽象方面有什么值得注意的设计（EventHub、InputReader、InputDispatcher的继承关系）？", "b": "IMS内部做了很多抽象工作：EventHub、InputReader以及InputDispatcher等实际上都继承自相应的名为XXXInterface的接口，并且仅通过接口进行相互之间的引用。由于这些接口各自仅有唯一的实现，书中叙述时省略了接口，但实际学习研究时需要注意这一点。", "t": ["输入系统"]}, {"i": 193, "ch": 5, "sec": "5.2", "f": "Reader子系统的输入端和输出端分别是什么？它需要处理哪两种类型的对象？", "b": "输入端是设备节点，输出端是Dispatcher子系统的派发队列。设备节点拥有两个概念：设备与原始事件，因此Reader子系统需要处理输入设备以及原始事件两种类型的对象：设备节点的新建与删除需要加载或删除对应设备的配置信息；节点中有新原始事件到来时需要开始加工并放置到派发队列中。", "t": ["输入系统"]}, {"i": 194, "ch": 5, "sec": "5.2.1", "f": "为什么Reader子系统监控设备节点不采用轮询？Android用什么机制解决了设备监听问题？", "b": "在线程循环中不断轮询会导致效率非常低下，且电量会在无谓的轮询中消耗；而设备节点和inotify对象中的事件都是偶发的，既不想轮询也不想为每个描述符创建独立线程阻塞读取（资源浪费极大）。Android使用由Linux提供的INotify与Epoll两套机制优雅地解决了监控设备节点新建/删除动作以及确定节点是否有内容可读的问题，以最小开销获得较快的响应速度，它们是Reader子系统运行的基石。", "t": ["输入系统"]}, {"i": 195, "ch": 5, "sec": "5.2.1", "f": "INotify是什么机制？它的两个基本对象是什么？watch对象的二元组包含哪两个元素？", "b": "INotify是Linux内核提供的一种文件系统变化通知机制，可监控文件系统的变化（如文件的新建、删除、读写等）。它有两个基本对象（都用文件描述符表示）：inotify对象对应一个队列，可向其添加多个监听，事件发生时通过read()读取事件信息；watch对象描述文件系统变化事件的监听，是二元组：监听目标（文件系统的一个路径，可以是文件或文件夹）和事件掩码（掩码的每一位代表一种事件，如IN_CREATE、IN_DELETE）。", "t": ["输入系统"]}, {"i": 196, "ch": 5, "sec": "5.2.1", "f": "总结INotify机制的使用过程，并指出INotify机制的一个局限。", "b": "①通过inotify_init()创建一个inotify对象；②通过inotify_add_watch将一个或多个监听添加到inotify对象中；③通过read()函数从inotify对象中读取监听事件（无新事件时inotify对象中无可读数据）。局限：INotify并不是通过回调的方式通知事件，需要使用者主动从inotify对象中读取事件，何时读取最佳需要借助Epoll机制。", "t": ["输入系统"]}, {"i": 197, "ch": 5, "sec": "5.2.1", "f": "INotify读取到的事件信息用什么结构体描述？其关键字段有哪些？", "b": "使用struct inotify_event描述：wd（事件对应的Watch对象的描述符）、mask（事件类型，如文件被删除时值为IN_DELETE）、cookie、len（name字段的长度）、name（可变长字段，用于存储产生此事件的文件路径）。", "t": ["输入系统"]}, {"i": 198, "ch": 5, "sec": "5.2.1", "f": "Epoll机制的三个接口函数是什么？各自的作用是什么？", "b": "①epoll_create(int max_fds)：创建一个epoll对象的描述符，之后对epoll的操作均使用这个描述符完成，max_fds表示可监听的描述符最大数量；②epoll_ctl(int epfd, int op, int fd, struct epoll_event *event)：管理注册事件，op为EPOLL_CTL_ADD/DEL/MOD，分别表示增加/删除/修改注册事件；③epoll_wait(int epfd, struct epoll_event *events, int maxevents, int timeout)：使调用者陷入等待，直到注册的事件之一发生才返回，事件信息填充到events数组，返回值表示获取了多少个事件。", "t": ["输入系统"]}, {"i": 199, "ch": 5, "sec": "5.2.1", "f": "epoll_event结构体的events字段和data字段分别是什么含义？常用的事件有哪些？", "b": "events是事件掩码，指明需要监听的事件种类，掩码每一位代表一种事件，常用EPOLLIN（可读）、EPOLLOUT（可写）、EPOLLERR（描述符发生错误）、EPOLLHUP（描述符被挂起）；data是使用者自定义的数据（epoll_data_t联合体，含ptr/fd/u32/u64，同一时间只能使用一个字段），事件发生时该数据将原封不动地返回给使用者。实际使用中常设置data.fd为被监听的文件描述符，事件发生时据此得知引发事件的描述符，也可设置为其他便于识别的数据。", "t": ["输入系统"]}, {"i": 200, "ch": 5, "sec": "5.2.1", "f": "总结Epoll机制的使用步骤。", "b": "①通过epoll_create()创建一个epoll对象；②为需要监听的描述符填充epoll_event结构体，并使用epoll_ctl()注册到epoll对象中；③使用epoll_wait()等待事件的发生；④根据epoll_wait()返回的epoll_event结构体数组的events字段与data字段判断事件的类型与来源并进行处理；⑤继续使用epoll_wait()等待新事件的发生。", "t": ["输入系统"]}, {"i": 201, "ch": 5, "sec": "5.2.2", "f": "C++层的Thread类与Java层的Thread类有一个显著区别是什么？threadLoop()的返回值意味着什么？", "b": "C++的Thread类封装了pthread线程工具，内建了线程循环：线程开始运行后不断调用threadLoop()，只要返回true，threadLoop()就会不断被内建循环调用，返回false则退出线程循环结束线程。而Java层Thread类的run()函数是整个线程的全部，一旦退出，线程也便完结。这也是InputReader.loopOnce()函数名称的由来。", "t": ["输入系统"]}, {"i": 202, "ch": 5, "sec": "5.2.2", "f": "InputReader如何在InputReaderThread中运行？InputReaderThread::threadLoop()做了什么？", "b": "InputReaderThread继承自C++的Thread类，仅重写了threadLoop()函数：执行mReader->loopOnce()并返回true。因此InputReaderThread启动后，线程循环将不断地执行InputReader.loopOnce()函数，loopOnce()作为循环体包含了InputReader的所有工作。", "t": ["输入系统"]}, {"i": 203, "ch": 5, "sec": "5.2.2", "f": "InputReader.loopOnce()一次循环的三步工作是什么？", "b": "①通过mEventHub->getEvents(timeoutMillis, mEventBuffer, EVENT_BUFFER_SIZE)抽取事件列表（返回值为事件个数，无事件时该调用会阻塞直到事件到来或超时）；②如果抽得事件（count>0），调用processEventsLocked()对事件进行加工处理；③调用mQueuedListener->flush()将加工后暂存在mQueuedListener中的所有事件一次性地交付给InputDispatcher。", "t": ["输入系统"]}, {"i": 204, "ch": 5, "sec": "5.2.2", "f": "InputReader从EventHub中抽取的事件分为哪两类？processEventsLocked()对它们分别如何处理？", "b": "分为两类：一类是从设备节点中读取的原始输入事件，另一类是输入设备可用性变化事件（简称设备事件）。对于设备事件，processEventsLocked()根据设备的可用性加载或移除设备对应的配置信息；对于原始输入事件，则在进行转译、封装与加工后将结果暂存到mQueuedListener中。", "t": ["输入系统"]}, {"i": 205, "ch": 5, "sec": "5.2.3", "f": "EventHub的构造函数做了哪些初始化工作（Epoll、INotify、唤醒管道）？", "b": "①用epoll_create(EPOLL_SIZE_HINT)创建epoll对象（EPOLL_SIZE_HINT指定最大监听个数为8），用于监听设备节点是否有数据可读；②用inotify_init()创建inotify对象mINotifyFd，并通过inotify_add_watch(mINotifyFd, DEVICE_PATH, IN_DELETE | IN_CREATE)监听/dev/input下设备节点的增删；③将mINotifyFd的可读事件注册到epoll中（epoll_event.data.u32使用自定义值EPOLL_ID_INOTIFY而非fd）；④创建名为wakeFds的匿名管道并将读取端描述符的可读事件注册到epoll中。", "t": ["输入系统"]}, {"i": 206, "ch": 5, "sec": "5.2.3", "f": "EventHub构造函数中创建的wakeFds匿名管道有什么作用？", "b": "InputReader执行getEvents()时会因无事件而阻塞在epoll_wait()的调用里，但有时希望立刻唤醒InputReader线程使其处理一些请求。此时只需向wakeFds管道的写入端写入任意数据，读取端便有数据可读，使epoll_wait()得以返回，从而达到唤醒InputReader线程的目的。", "t": ["输入系统"]}, {"i": 207, "ch": 5, "sec": "5.2.3", "f": "RawEvent结构体包含哪些字段？它与getevent输出有何关系？它如何表示设备增删事件？", "b": "RawEvent包含五个字段：when（事件时间戳）、deviceId（产生事件的设备Id，由EventHub自行分配，InputReader可根据它从EventHub中获取设备详细信息）、type（事件类型）、code（事件代码）、value（事件值）。它与getevent工具的输出十分一致，包含原始输入事件的四个基本元素。RawEvent也用来表示设备增删事件，EventHub为此定义了三个特殊事件类型：DEVICE_ADD、DEVICE_REMOVED和FINISHED_DEVICE_SCAN。", "t": ["输入系统"]}, {"i": 208, "ch": 5, "sec": "5.2.3", "f": "EventHub::getEvents()函数的本质是什么？其主要循环做了哪几类工作？", "b": "getEvents()的本质就是读取并处理Epoll事件与INotify事件，将结果封装为RawEvent放入buffer返回给InputReader；它几乎包含了EventHub的所有工作，可理解为EventHub的\"一次心跳\"。循环主体：①进行与设备相关的工作（如第一次调用时扫描/dev/input打开所有设备节点，设备增删时生成设备事件）；②处理事件池mPendingEventItems中未处理的Epoll事件（设备节点可读则读取原始事件放入buffer，mINotifyFd可读则设置mPendingINotify标记，wakeFds可读则设置awoke标志）；③若有INotify待处理且Epoll事件已处理完，调用readNotifyLocked()进行设备加载/卸载，deviceChanged为true时重新循环生成设备增删事件；④若本次调用未获取任何事件且未被唤醒，则调用epoll_wait()等待新事件注入事件池。返回event - buffer即读取的事件数量。", "t": ["输入系统"]}, {"i": 209, "ch": 5, "sec": "5.2.3", "f": "什么是EventHub的\"监听周期\"？一个监听周期与getEvents()调用次数的关系？", "b": "getEvents()使用epoll_wait()产生的事件池mPendingEventItems，优先消费池中的Epoll事件；事件池枯竭导致无法获得事件时才调用epoll_wait()重新注满事件池。从epoll_wait()的调用开始，到事件池中最后一个事件被消费完毕的过程称为EventHub的一个监听周期。由于buffer参数的容量限制，一个监听周期可能包含一次或多次getEvents()调用：周期中的第一次调用一定会因事件池枯竭而直接进入epoll_wait()，周期中的最后一次调用一定会将事件池中的最后一条事件消费完毕并返回给调用者。书中讨论的事件优先级都是在同一监听周期内而言的。", "t": ["输入系统"]}, {"i": 210, "ch": 5, "sec": "5.2.3", "f": "getEvents()为什么需要事件池（mPendingEventItems）机制？", "b": "根本原因是buffer的容量限制。一次epoll_wait()可能返回多个设备节点的可读事件，每个设备节点又可能读取多条原始输入事件，一段时间内原始输入事件的数量可能大于buffer的容量，因此需要一个事件池以缓存因buffer容量不够而无法处理的epoll事件，以便下次调用时优先处理。这是缓冲区操作的一个常用技巧。", "t": ["输入系统"]}, {"i": 211, "ch": 5, "sec": "5.2.3", "f": "EventHub::Device结构体存储哪几方面的信息（各举代表性字段）？EventHub用什么结构保存打开的设备？", "b": "①设备节点信息：fd（设备节点描述符）、path（节点路径）、id（输入系统内唯一标识设备，由EventHub在加载时分配）；②厂商信息：identifier（供应商、型号、名称等），决定了加载配置文件与键盘映射表的路径；③设备特性信息：classes（设备类别，一个设备可同时属于多个类别，决定了InputReader的加工方式）、keyBitmask等事件位掩码（描述设备能产生的事件类型）；④配置信息：configurationFile、configuration（键值对配置）、键盘映射表（virtualKeyMap、KeyMap等）；另有力反馈数据（ffEffectPlaying、ffEffectId）。Device还是单链表（next指针）。EventHub用名为mDevices的字典保存当前打开设备的Device结构体，键为设备Id。", "t": ["输入系统"]}, {"i": 212, "ch": 5, "sec": "5.2.3", "f": "EventHub何时完成系统中现有输入设备的加载？由哪个函数完成？VIRTUAL_KEYBOARD是什么？", "b": "EventHub在创建后第一次调用getEvents()函数时完成加载：构造函数中mNeedToScanDevices被设为true，第一次getEvents()时执行scanDevicesLocked()，它调用scanDirLocked(DEVICE_PATH)遍历/dev/input下所有设备节点并逐一openDeviceLocked()打开。此外还会打开一个名为VIRTUAL_KEYBOARD的虚拟输入设备：它没有对应的输入节点，时刻处于打开状态。", "t": ["输入系统"]}, {"i": 213, "ch": 5, "sec": "5.2.3", "f": "openDeviceLocked()的完整工作流程是什么？向Epoll注册设备节点时epoll_event的自定义数据为什么用设备Id而不是fd？", "b": "①open(devicePath, O_RDWR | O_CLOEXEC)打开设备节点的文件描述符；②通过ioctl()从设备节点获取输入设备的厂商信息（identifier）；③分配设备Id（mNextDeviceId++）并创建Device结构体；④loadConfigurationLocked()加载配置信息；⑤通过ioctl（EVIOCGBIT、EVIOCGPROP）获取设备的事件位掩码，并据此为设备分配类别（classes）；⑥将设备节点描述符的可读事件注册到Epoll，epoll_event.data.u32设置为设备Id而非fd，getEvents()处理Epoll事件时便可通过data.u32在mDevices字典中查找对应的Device；⑦addDeviceLocked()将Device添加到mDevices字典，同时添加到mOpeningDevices链表中。", "t": ["输入系统"]}, {"i": 214, "ch": 5, "sec": "5.2.3", "f": "closeDeviceLocked()卸载设备的流程有哪四步？", "b": "①从Epoll中注销对描述符的监听；②关闭设备节点的描述符；③从mDevices字典中删除对应的Device对象；④将Device对象添加到mClosingDevices链表中。卸载流程与openDeviceLocked()正好相反。", "t": ["输入系统"]}, {"i": 215, "ch": 5, "sec": "5.2.3", "f": "mOpeningDevices与mClosingDevices两个链表的作用是什么？", "b": "它们分别保存刚刚被加载/卸载、但尚未通过getEvents()函数向InputReader发送DEVICE_ADDED/DEVICE_REMOVED事件的设备，是getEvents()函数向InputReader发送设备增删事件的依据。生成DEVICE_REMOVED事件后，相应的Device对象就不再需要而被delete。", "t": ["输入系统"]}, {"i": 216, "ch": 5, "sec": "5.2.3", "f": "EventHub可以产生的设备增删事件有哪三种？它们的优先级顺序如何？事件中包含哪些信息？生成原理是什么？", "b": "三种：DEVICE_REMOVED（优先级最高）、DEVICE_ADDED（次之）、FINISHED_DEVICE_SCAN（最低，标志设备增删事件序列的结束）。getEvents()完成当前高优先级事件的生成之前不会进行低优先级事件的生成。设备增删事件的RawEvent包含三个信息：时间戳、设备Id和事件类型；FINISHED_DEVICE_SCAN仅包括时间戳与事件类型。生成原理：①设备增删时addDeviceLocked()/closeDeviceLocked()将设备放入mOpeningDevices和mClosingDevices链表；②getEvents()遍历这两个链表生成DEVICE_ADDED/DEVICE_REMOVED事件（生成时设置mNeedToSendFinishedDeviceScan为true）；③两者都生成完毕后生成FINISHED_DEVICE_SCAN事件。由于buffer容量限制，整个序列可能需要多次getEvents()调用才能完整返回。", "t": ["输入系统"]}, {"i": 217, "ch": 5, "sec": "5.2.3", "f": "EventHub如何通过INotify动态地加载与卸载设备？getEvents()中与INotify相关的三处代码分别是什么？", "b": "①识别表示mINotifyFd可读的Epoll事件（data.u32 == EPOLL_ID_INOTIFY且events含EPOLLIN），设置mPendingINotify为true标记待处理，并不立刻处理；②当epoll_wait()返回的所有Epoll事件都处理完毕后（mPendingEventIndex >= mPendingEventCount），调用readNotifyLocked()读取mINotifyFd中的事件并进行设备的加载与卸载；③设置deviceChanged为true并continue返回循环开始处，以便生成设备增删事件。readNotifyLocked()中：read()读取inotify_event列表，事件mask含IN_CREATE则openDeviceLocked()加载对应设备，否则closeDeviceByPathLocked()卸载对应设备。", "t": ["输入系统"]}, {"i": 218, "ch": 5, "sec": "5.2.3", "f": "为什么getEvents()要把INotify事件（设备加载/卸载）的处理推迟到所有Epoll事件处理完毕之后？", "b": "因为此时立刻进行设备的加载与卸载是不安全的：其他Epoll事件可能包含了来自即将被卸载的设备的输入事件，而现有的输入事件可能来自需要被卸载的输入设备，InputReader处理这些事件依赖于对应的设备信息，所以必须在InputReader将现有输入事件读取并处理完毕后才能进行设备加载/卸载操作。", "t": ["输入系统"]}, {"i": 219, "ch": 5, "sec": "5.2.3", "f": "getEvents()如何处理表示设备节点可读（EPOLLIN）与被挂起（EPOLLHUP）的Epoll事件？读取的原始事件存储在什么结构体中？", "b": "先通过Epoll事件的data.u32字段（设备Id）在mDevices中查找Device对象，找不到则忽略。若eventItem.events含EPOLLIN，则read(device->fd, readBuffer, sizeof(struct input_event) * capacity)从描述符读取原始事件，结果作为input_event结构体存储在readBuffer中；然后逐一将每个input_event的type/code/value转存到RawEvent（填入when、deviceId）并放入buffer返回给调用者，读取个数受capacity限制。若含EPOLLHUP（描述符被挂起，设备不可用），则设置deviceChanged为true并调用closeDeviceLocked(device)卸载此设备。", "t": ["输入系统"]}, {"i": 220, "ch": 5, "sec": "5.2.3", "f": "getEvents()读取一个设备节点的事件时若buffer已满，为什么要执行mPendingEventIndex -= 1？", "b": "因为buffer容量限制，可能无法完全读取设备节点中存储的原始事件。一旦buffer满则需要立刻返回给调用者，设备节点中剩余的输入事件将在下次getEvents()调用时继续读取，也就是说当前的Epoll事件并未处理完毕。mPendingEventIndex -= 1的目的是使下次getEvents()调用能够继续处理这个Epoll事件。", "t": ["输入系统"]}, {"i": 221, "ch": 5, "sec": "5.2.3", "f": "关于原始输入事件的时间戳，书中指出了什么细节？如何获得更精确的时间？", "b": "书中简化代码使用了调用getEvents()的时间作为输入事件的时间戳，由于调用getEvents()的时机与用户操作之间存在时间差，此时间戳与事件的真实时间有所偏差。从设备节点中读取的input_event中也包含一个时间戳，它消除了getEvents()调用带来的时间差，可以通过打开HAVE_POSIX_CLOCKS宏来使用input_event中的时间而不是getEvents()调用的时间。", "t": ["输入系统"]}, {"i": 222, "ch": 5, "sec": "5.2.3", "f": "在一个监听周期内，getEvents()读取多个设备节点事件的顺序有何特点？返回的事件列表有何顺序特征？", "b": "在一个监听周期中，getEvents()在将一个设备节点中的所有原始输入事件读取完毕之前，不会读取其他设备节点中的事件。getEvents()返回的事件列表依照事件的优先级拥有特定的顺序（设备增删事件优先于Epoll事件/原始输入事件），并且在一个监听周期中，同一输入设备的输入事件在列表中是相邻的。", "t": ["输入系统"]}, {"i": 223, "ch": 5, "sec": "5.2.3", "f": "对比区分EventHub涉及的四类事件及其对应结构体：原始输入事件、设备增删事件、Epoll事件、INotify事件。", "b": "原始输入事件：内核写入设备节点的事件，内核中为input_event结构体（四个字段存储时间戳、类型、代码与值），EventHub将其转存封装为RawEvent返回给InputReader；设备增删事件：EventHub生成的DEVICE_ADDED/DEVICE_REMOVED/FINISHED_DEVICE_SCAN事件，也用RawEvent表示；Epoll事件：epoll_wait()返回的struct epoll_event（events掩码+data自定义数据），存于事件池mPendingEventItems；INotify事件：设备节点增删通知，结构体为struct inotify_event，从mINotifyFd中read()读取。EventHub隐藏了INotify、Epoll及设备节点读取等底层操作，通过getEvents()一个简单接口对外提供事件。", "t": ["输入系统"]}, {"i": 224, "ch": 5, "sec": "5.2.3", "f": "为什么可以把一次getEvents()调用理解为EventHub的\"一次心跳\"？总结EventHub设备管理的要点。", "b": "如果没有getEvents()的调用，EventHub将对输入事件、设备节点增删事件置若罔闻；getEvents()包含了原始输入事件读取、输入设备加载/卸载等操作，几乎是EventHub的全部工作，因此其核心功能都会在一次getEvents()调用（一次心跳）中完成。设备管理要点：①EventHub通过Device结构体描述输入设备的各种信息；②设备的加载与卸载在getEvents()中进行，分为按需加载/卸载（如首次全量扫描）以及通过INotify动态加载/卸载特定设备两种方式；③加载/卸载后会生成DEVICE_ADDED、DEVICE_REMOVED及FINISHED_DEVICE_SCAN三种设备增删事件，且设备增删事件拥有高于Epoll事件（原始输入事件）的优先级。", "t": ["输入系统"]}, {"i": 225, "ch": 6, "sec": "6.1", "f": "如果没有控件系统，直接使用Canvas绘制界面并用InputEventReceiver处理输入，开发者需要亲历亲为哪些复杂工作？", "b": "①测量各个UI元素的显示尺寸与位置；②对各个UI元素进行布局计算与绘制；③当显示内容变化时进行重绘，且出于效率考虑必须保证重绘区域尽可能小；④分析InputEventReceiver接收的事件类型并确定应由哪个UI元素响应；⑤处理来自WMS的很多与窗口状态相关的回调。控件系统使得这些事情不需要开发者亲历亲为。", "t": ["ViewRoot"]}, {"i": 226, "ch": 6, "sec": "6.1", "f": "作者认为\"控件\"比\"View\"更贴切地称呼UI元素，理由是什么？", "b": "因为UI元素不仅仅是为了向用户显示一些内容，更重要的是它们响应用户的输入并进行相应的工作。在Android中一个UI元素被称为一个视图（View），但作者认为\"控件\"才是更贴切的名字，本书后续以控件来称呼UI元素(View)。", "t": ["ViewRoot"]}, {"i": 227, "ch": 6, "sec": "6.1", "f": "Android中控件系统支撑了哪些常见界面形态？它在本 书体系中的地位如何？", "b": "读者熟知的Activity、各种对话框、弹出菜单、状态栏与导航栏等都是基于控件系统实现的。控件系统是继WMS与IMS两大系统服务之后又一个需要攻克的目标。", "t": ["ViewRoot"]}, {"i": 228, "ch": 6, "sec": "6.1.1", "f": "书中\"另一种创建窗口的方法\"的悬浮按钮示例，通过哪几个关键步骤把一个Button作为窗口添加到系统中？", "b": "①通过getSystemService(Context.WINDOW_SERVICE)获取一个WindowManager实例；②新建一个Button控件并设置文本；③生成一个WindowManager.LayoutParams描述窗口的类型与位置（type=TYPE_PHONE、gravity=CENTER、width/height=WRAP_CONTENT、flags含FLAG_NOT_FOCUSABLE|FLAG_NOT_TOUCH_MODAL）；④通过WindowManager.addView(btn, lp)将按钮作为一个窗口添加到系统中；⑤点击时调用wm.removeView(btn)删除窗口。此外需在AndroidManifest.xml中声明权限android.permission.SYSTEM_ALERT_WINDOW。", "t": ["ViewRoot"]}, {"i": 229, "ch": 6, "sec": "6.1.1", "f": "与第4章直接操作WMS的SampleWindow例子相比，使用控件系统添加窗口有哪些优势？", "b": "无论从最终效果、代码量、API复杂度还是可读性上都有很大优势：控件（如Button）托管了窗口的绘制过程，并将输入事件封装为更具可读性的回调；WindowManager实例掩盖了客户端与WMS交互的复杂性；更重要的是所用接口都来自公开API，可以脱离Android源码编译，带来更方便的开发过程和更好的程序兼容性。除非需要很底层的窗口控制，这是向系统添加窗口的最优选择。", "t": ["ViewRoot"]}, {"i": 230, "ch": 6, "sec": "6.1.2", "f": "Android控件系统由哪两大部分组成？", "b": "①继承自View类的一系列控件类（Button只是控件的一种，任何一个继承自View类的控件都可以作为一个窗口添加到系统中）；②WindowManager——一个继承自ViewManager的接口，提供添加/删除窗口、更新窗口布局的API，可看作WMS在客户端的代理类。WindowManager的接口与WMS的接口相差很大，几乎无法通过WindowManager看到WMS的模样，这说明它为精简WMS的接口做过大量的工作。", "t": ["ViewRoot"]}, {"i": 231, "ch": 6, "sec": "6.2.1", "f": "WindowManager和ViewManager、ViewGroup三者是什么关系？", "b": "WindowManager是一个继承自ViewManager的接口。ViewManager定义了三个函数：添加一个控件、删除一个控件、更新控件的布局。ViewManager接口的另一个实现者是ViewGroup——容器类控件的基类，用于将一组子控件容纳到自身区域中并根据其LayoutParams进行布局。可以把WindowManager类比为一个区域为整个屏幕的ViewGroup，其中的各个窗口就是一个个View，二者核心工作一致，因此都继承自ViewManager。", "t": ["ViewRoot"]}, {"i": 232, "ch": 6, "sec": "6.2.1", "f": "通过Context.getSystemService(Context.WINDOW_SERVICE)获取的WindowManager实例的真实类型是什么？它的构造依赖什么对象？", "b": "真实类型是WindowManagerImpl。ContextImpl在静态构造函数中注册了WINDOW_SERVICE对应的ServiceFetcher，其getService()中：①获取Context中保存的Display对象；②若没有则通过DisplayManager获取系统主屏幕（Display.DEFAULT_DISPLAY）对应的Display对象；③以该Display为参数new一个WindowManagerImpl返回。Display对象与WMS中DisplayContent的意义一样，都表示一块屏幕。", "t": ["ViewRoot"]}, {"i": 233, "ch": 6, "sec": "6.2.1", "f": "WindowManagerImpl的构造函数做了什么？它的两个成员变量有什么意义？", "b": "构造函数非常简单，只初始化mDisplay与mParentWindow两个成员变量。它们决定了通过这个WindowManagerImpl实例所添加的窗口的归属：显示在哪块屏幕上（mDisplay），以及将作为哪个窗口的子窗口（mParentWindow）。", "t": ["ViewRoot"]}, {"i": 234, "ch": 6, "sec": "6.2.1", "f": "Window类是什么？以Activity为例说明它的作用。", "b": "Window类会预先准备好窗口装饰——例如Activity显示时包含的标
