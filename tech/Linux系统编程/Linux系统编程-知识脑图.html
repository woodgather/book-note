<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《Linux系统编程(第2版)》知识脑图 - Robert Love</title>
<style>
:root {
  color-scheme: light;
  --bg-primary: #f7f8fc;
  --bg-card: #ffffff;
  --bg-sidebar: #1e293b;
  --bg-sidebar-hover: #334155;
  --bg-sidebar-active: #3b82f6;
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --text-sidebar: #cbd5e1;
  --text-sidebar-active: #ffffff;
  --accent-1: #3b82f6;
  --accent-2: #8b5cf6;
  --accent-3: #ec4899;
  --accent-4: #f59e0b;
  --accent-5: #10b981;
  --accent-6: #06b6d4;
  --accent-7: #ef4444;
  --accent-8: #6366f1;
  --border: #e2e8f0;
  --code-bg: #f1f5f9;
  --code-text: #0f172a;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.12);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", Roboto, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.7;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* ============== LAYOUT ============== */
.app {
  display: flex;
  min-height: 100vh;
}

/* ============== SIDEBAR ============== */
.sidebar {
  width: 320px;
  background: var(--bg-sidebar);
  color: var(--text-sidebar);
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  z-index: 100;
  transition: var(--transition);
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky;
  top: 0;
  background: var(--bg-sidebar);
  z-index: 2;
}

.sidebar-title {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.sidebar-subtitle {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 14px;
}

.sidebar-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.sidebar-actions button {
  flex: 1;
  min-width: 60px;
  padding: 6px 8px;
  font-size: 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-sidebar);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
}

.sidebar-actions button:hover {
  background: var(--bg-sidebar-hover);
  color: #fff;
}

/* ============== NAV TREE ============== */
.nav {
  padding: 12px 8px 24px;
}

.nav-list, .nav-sub-list {
  list-style: none;
}

.nav-item {
  margin: 2px 0;
}

.nav-link {
  display: flex;
  align-items: center;
  padding: 8px 12px;
  color: var(--text-sidebar);
  text-decoration: none;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  transition: var(--transition);
  cursor: pointer;
  user-select: none;
  border-left: 3px solid transparent;
}

.nav-link:hover {
  background: var(--bg-sidebar-hover);
  color: #fff;
}

.nav-link.active {
  background: var(--bg-sidebar-active);
  color: var(--text-sidebar-active);
  border-left-color: #fbbf24;
  font-weight: 600;
}

.nav-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  margin-right: 6px;
  font-size: 10px;
  transition: transform 0.2s;
  color: var(--text-tertiary);
  flex-shrink: 0;
}

.nav-toggle.expanded {
  transform: rotate(90deg);
}

.nav-toggle::before {
  content: "▶";
}

.nav-toggle.empty::before {
  content: "•";
  font-size: 8px;
  opacity: 0.5;
}

.nav-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-sub-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
  padding-left: 18px;
}

.nav-sub-list.expanded {
  max-height: 4000px;
}

/* ============== MAIN CONTENT ============== */
.main {
  flex: 1;
  margin-left: 320px;
  padding: 40px 48px 80px;
  max-width: 1100px;
}

/* ============== HERO ============== */
.hero {
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #8b5cf6 100%);
  color: #fff;
  padding: 48px 40px;
  border-radius: var(--radius-lg);
  margin-bottom: 40px;
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}

.hero-tag {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 1px;
  position: relative;
}

.hero h1 {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
  position: relative;
}

.hero-subtitle {
  font-size: 17px;
  opacity: 0.92;
  margin-bottom: 24px;
  position: relative;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  position: relative;
}

.hero-meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  opacity: 0.95;
}

.hero-meta-item strong {
  font-weight: 600;
}

/* ============== SECTION ============== */
.section {
  margin-bottom: 48px;
  scroll-margin-top: 24px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--border);
}

.section-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  border-radius: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  padding: 0 10px;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.section-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.section-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 2px;
}

.section-intro {
  background: var(--bg-card);
  border-left: 4px solid var(--accent-1);
  padding: 16px 20px;
  border-radius: var(--radius-sm);
  margin-bottom: 24px;
  color: var(--text-secondary);
  font-size: 14.5px;
  line-height: 1.75;
  box-shadow: var(--shadow-sm);
}

/* ============== CARD ============== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
  margin-bottom: 24px;
}

.card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--card-accent, var(--accent-1));
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--card-accent, var(--accent-1));
}

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
}

.card-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  background: var(--card-accent, var(--accent-1));
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.4;
  flex: 1;
}

.card-body {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.7;
}

.card-desc {
  margin-bottom: 10px;
}

.card ul {
  list-style: none;
  padding: 0;
  margin-top: 8px;
}

.card li {
  position: relative;
  padding-left: 18px;
  margin: 6px 0;
  font-size: 13.5px;
  color: var(--text-secondary);
}

.card li::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 9px;
  width: 6px;
  height: 6px;
  background: var(--card-accent, var(--accent-1));
  border-radius: 50%;
}

/* ============== TAGS ============== */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.tag {
  display: inline-block;
  padding: 3px 10px;
  background: var(--code-bg);
  color: var(--text-primary);
  font-size: 12px;
  border-radius: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  font-family: "SF Mono", Menlo, Consolas, monospace;
}

/* ============== CODE ============== */
.code {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  color: var(--code-text);
  margin: 10px 0;
  overflow-x: auto;
  line-height: 1.6;
}

/* ============== HIGHLIGHT ============== */
.highlight {
  background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
  padding: 1px 4px;
  border-radius: 3px;
  font-weight: 600;
  color: #78350f;
}

.note {
  background: #eff6ff;
  border-left: 3px solid var(--accent-1);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin: 12px 0;
  font-size: 13.5px;
  color: #1e40af;
}

.warning {
  background: #fef2f2;
  border-left: 3px solid var(--accent-7);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin: 12px 0;
  font-size: 13.5px;
  color: #991b1b;
}

/* ============== INFO BAR ============== */
.info-bar {
  position: fixed;
  top: 16px;
  right: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  box-shadow: var(--shadow-sm);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 6px;
}

.info-bar .dot {
  width: 8px;
  height: 8px;
  background: var(--accent-5);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ============== FOOTER ============== */
.footer {
  margin-top: 60px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--text-tertiary);
  font-size: 13px;
}

/* ============== SCROLLBAR ============== */
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
.sidebar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

/* ============== RESPONSIVE ============== */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 24px 20px; }
  .hero { padding: 32px 24px; }
  .hero h1 { font-size: 26px; }
  .menu-toggle { display: flex; }
}

.menu-toggle {
  display: none;
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 200;
  width: 42px;
  height: 42px;
  background: var(--bg-sidebar);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 18px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-md);
}

/* ============== TOC TOP-LEVEL COLORS ============== */
.toc-ch1 { --card-accent: #3b82f6; }
.toc-ch2 { --card-accent: #8b5cf6; }
.toc-ch3 { --card-accent: #ec4899; }
.toc-ch4 { --card-accent: #f59e0b; }
.toc-ch5 { --card-accent: #10b981; }
.toc-ch6 { --card-accent: #06b6d4; }
.toc-ch7 { --card-accent: #6366f1; }
.toc-ch8 { --card-accent: #ef4444; }
.toc-ch9 { --card-accent: #14b8a6; }
.toc-ch10 { --card-accent: #f97316; }
.toc-ch11 { --card-accent: #a855f7; }
.toc-apx { --card-accent: #64748b; }
</style>
</head>

<script>
// ============== 知识脑图数据 ==============
const data = [
  {
    id: "ch1", cls: "toc-ch1", num: "第1章", title: "入门和基本概念",
    intro: "本书的概述章节，介绍系统编程的定义、API/ABI、标准以及 Linux 编程的基础概念。理解 Linux 系统编程的三大基石：系统调用、C 库、C 编译器。",
    sections: [
      { id: "ch1-1", num: "1.1", title: "系统编程",
        desc: "系统编程是为编写系统软件（Shell、编辑器、编译器、守护进程等）所使用的编程方式，与内核和系统核心库直接交互。",
        points: [
          "系统编程 vs 应用编程：系统程序必须深入了解硬件与操作系统",
          "系统编程的 3 大基石：<span class='highlight'>系统调用</span>、<span class='highlight'>C 库 (glibc)</span>、<span class='highlight'>C 编译器 (gcc)</span>",
          "Linux 系统调用远少于 Windows（x86-64 约 300 个），但 90% 以上跨体系结构通用",
          "用户空间通过 int 0x80（i386）或 syscall 指令进入内核",
          "参数通过寄存器传递（i386 上 eax=调用号，ebx/ecx/edx/esi/edi 传参）"
        ],
        tags: ["系统调用", "glibc", "gcc", "用户/内核空间"] },
      { id: "ch1-2", num: "1.2", title: "API 和 ABI",
        desc: "API 定义源码级接口，ABI 定义二进制级接口。",
        points: [
          "<span class='highlight'>API</span>：源代码兼容，例如 C 标准库函数接口",
          "<span class='highlight'>ABI</span>：二进制兼容，包括调用约定、字节序、寄存器使用、目标格式",
          "Linux 为每种体系结构（x86-64、ARM、PowerPC 等）定义独立 ABI",
          "工具链（编译器、链接器）负责实现 ABI"
        ],
        tags: ["API", "ABI", "调用约定", "二进制兼容"] },
      { id: "ch1-3", num: "1.3", title: "标准",
        desc: "Linux 致力于与 POSIX 和单一 UNIX 规范（SUS）兼容。",
        points: [
          "<span class='highlight'>POSIX</span>（IEEE 1003.1）：Portable Operating System Interface，可移植操作系统接口",
          "<span class='highlight'>SUS</span>（Single UNIX Specification）：The Open Group 维护，合并并扩展 POSIX",
          "C 语言标准：K&R C → ANSI C → ISO C90/C95/C99/C11",
          "C++ 标准：ISO C++98/C++03/C++11",
          "<span class='highlight'>LSB</span>（Linux Standard Base）：跨 Linux 发行版的二进制标准"
        ],
        tags: ["POSIX", "SUS", "C99", "C11", "LSB"] },
      { id: "ch1-4", num: "1.4", title: "Linux 编程的概念",
        desc: "Linux 系统提供的核心抽象：文件、进程、线程、信号等。",
        points: [
          "<span class='highlight'>一切皆文件</span>：设备、管道、socket 都通过文件描述符访问",
          "普通文件：以字节流组织，无内置结构，文件位置（偏移量）从 0 开始",
          "inode（索引节点）：存储文件元数据，不含文件名",
          "硬链接共享同一个 inode，符号链接是特殊文件",

  {

      { id: "ch2-1", num: "2.1", title: "打开文件：open()",

          "<span class='highlight'>open(path, flags, mode)</span>：成功返回文件描述符，失败返回 -1",

          "可选 flags：O_CREAT、O_EXCL、O_TRUNC、O_APPEND、O_NONBLOCK、O_CLOEXEC 等",

// ============== 渲染导航 ==============
const navRoot = document.getElementById('nav-root');
data.forEach(ch => {
  const li = document.createElement('li');
  li.className = 'nav-item';
  const hasSub = ch.sections && ch.sections.length > 0;
  const toggleCls = hasSub ? '' : 'empty';
  const expanded = false;
  li.innerHTML = `
    <div class="nav-link" data-target="${ch.id}">
      <span class="nav-toggle ${toggleCls}"></span>
      <span class="nav-text"><strong>${ch.num}</strong> · ${ch.title}</span>
    </div>
    ${hasSub ? `<ul class="nav-sub-list" data-parent="${ch.id}">
      ${ch.sections.map(s => `<li class="nav-item">
        <div class="nav-link" data-target="${s.id}">
          <span class="nav-toggle empty"></span>
          <span class="nav-text">${s.num} ${s.title}</span>
        </div>
      </li>`).join('')}
    </ul>` : ''}
  `;
  navRoot.appendChild(li);
});

// 事件委托
document.getElementById('nav').addEventListener('click', (e) => {
  const link = e.target.closest('.nav-link');
  if (!link) return;
  const target = link.dataset.target;
  if (!target) return;

  // 如果点击的是带 toggle 的，切换子列表
  const toggle = link.querySelector('.nav-toggle');
  if (toggle && !toggle.classList.contains('empty')) {
    const subList = link.parentElement.querySelector(`.nav-sub-list[data-parent="${target}"]`);
    if (subList) {
      subList.classList.toggle('expanded');
      toggle.classList.toggle('expanded');
    }
  }

  // 高亮当前
  document.querySelectorAll('.nav-link.active').forEach(el => el.classList.remove('active'));
  link.classList.add('active');

  // 平滑滚动
  const el = document.getElementById(target);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function expandAll() {
  document.querySelectorAll('.nav-sub-list').forEach(el => el.classList.add('expanded'));
  document.querySelectorAll('.nav-toggle').forEach(el => el.classList.add('expanded'));
}
function collapseAll() {
  document.querySelectorAll('.nav-sub-list').forEach(el => el.classList.remove('expanded'));
  document.querySelectorAll('.nav-toggle').forEach(el => el.classList.remove('expanded'));
  document.querySelectorAll('.nav-link.active').forEach(el => el.classList.remove('active'));
}
function scrollTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
