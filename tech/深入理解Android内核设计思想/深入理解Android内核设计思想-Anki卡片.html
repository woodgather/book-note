<script>
const DATA = {"chapters":["第1章 Android系统简介","第2章 Android源码下载及编译","第3章 Android编译系统","第4章 操作系统基础","第5章 Android进程/线程和程序内存优化","第6章 进程间通信——Binder","第7章 Android启动过程","第8章 ActivityManagerService","第9章 GUI系统——SurfaceFlinger","第10章 GUI系统之“窗口管理员”——WMS","第11章 View体系","第12章 InputManagerService与输入事件","第13章 音频系统","第14章 Intent的匹配规则","第15章 APK应用程序的资源适配","第16章 Android字符编码格式","第17章 Android和OpenGL ES","第18章 SystemUI","第19章 Widget机制","第20章 Android应用程序的编译和打包","第21章 Android虚拟机","第22章 Android安全机制透析","第23章 IDE和Gradle","第24章 软件版本管理","第25章 系统调试辅助工具"],"cards":[{"q":"Android一词的来源及最初命名方式是什么？后来为何改变？","a":"Android来源于法国作家Auguste Villiers de l'Isle-Adam的科幻小说《L'ève future》（未来夏娃），意为机器人。最初各版本以全球著名机器人为名（如AstroBoy），后因版权问题改为以食物（甜品）命名（如Cupcake、Donut），但Logo仍保持机器人形象。","ch":"第1章 Android系统简介"},{"q":"Android发展史上的几个关键时间点是什么？","a":"①2003年10月Andy Rubin在加州成立Android公司；②2005年4月Google收购Android；③2007年11月成立OHA（Open Handset Alliance）开放手机联盟（成员含Google、HTC、Intel、Qualcomm、Samsung等）并发布Beta版和第一个SDK；④2008年9月Android 1.0正式发布。","ch":"第1章 Android系统简介"},{"q":"什么是AOSP？其宗旨是什么？","a":"AOSP即Android Open Source Project（Android开源工程），2007年11月由Google成立，标志着Android首次公开面向全球开发者与使用者。宗旨是\"create a successful real-world product that improves the mobile experience for end users\"，任何人都可以参与贡献，相关说明见source.android.com。","ch":"第1章 Android系统简介"},{"q":"Android遵循什么开源许可证？与Linux内核所遵循的有何区别？","a":"Android开源项目基于Apache开源软件许可证，跨越许可证范畴的行为被禁止。而Linux内核遵循GPL协议，要求其下的驱动都开源。这种协议差异正是Android引入HAL来规避部分厂商不愿开源驱动问题的关键原因。","ch":"第1章 Android系统简介"},{"q":"Android系统的五大分层架构分别是什么？各层用什么语言实现？","a":"五层为：内核层（Linux Kernel）、硬件抽象层（HAL）、系统运行库层、应用程序框架层、应用程序层。系统运行库层多为C/C++实现，被称为\"C库层\"（含WebKit、OpenGL、SQLite等开源库）；应用程序框架层多用Java编写，被称为\"Java库层\"，为上层应用提供API并实现系统级服务进程。","ch":"第1章 Android系统简介"},{"q":"HAL是什么？由谁在什么场合提出？其核心定义是什么？","a":"HAL即Hardware Abstraction Layer（硬件抽象层），2008年Google I/O大会上由Google员工Patrick Brady在演讲《Anatomy & Physiology of an Android》中提出。定义：①User space C/C++ library layer（用户空间C/C++库层）；②定义Android要求硬件\"驱动\"实现的接口；③将Android平台逻辑与硬件接口分离，降低系统与硬件的耦合度。","ch":"第1章 Android系统简介"},{"q":"Android为什么选择在Linux内核之上搭建自己的平台？","a":"两个好处：①Linux擅长与硬件直接打交道，且本身开源，避免Android重复造轮子；②Linux的驱动开发可扩展性很强，这对硬件各异的嵌入式系统极为重要，否则系统移植将是无止境的噩梦。注意：Android工程项目中并不包含内核源码，需另行下载。","ch":"第1章 Android系统简介"},{"q":"Android的四大应用程序组件是什么？","a":"Activity、Service、Broadcast Receiver和Content Provider。SDK通过总结应用开发规律提供这四大组件，并像MFC一样提供人性化的向导模式帮助开发者快速生成工程原型，为项目开发节约大量时间。","ch":"第1章 Android系统简介"},{"q":"Android系统的主要优点有哪些？","a":"①开放与扩展性：几乎所有源码可免费下载，遵循Apache协议，厂商可低成本对系统做UI\"二次包装\"定制；②合理的分层架构：隐藏底层复杂性，提供方便的上层API；③易用强大的SDK：基于Java，有垃圾回收、隐藏指针，提供四大组件；④不断改进的交互界面；⑤逐步完善的生态系统。","ch":"第1章 Android系统简介"},{"q":"Android系统存在哪些缺点或不足？","a":"①阵营良莠不齐：开源使准入门槛降低，出现\"人人都可以做手机\"的局面，各厂商随意改造易造成阵营分裂；②系统运行速度有待改善：平均开机时间超过1分钟，甚至达5分钟以上；③兼容性问题：设备形态五花八门，开发一款成熟应用需适配200款以上不同厂商手机（iOS则只面向固定机型）。","ch":"第1章 Android系统简介"},{"q":"生态系统的概念源自哪里？Android生态系统包含哪些类比角色？","a":"Ecosystem原是生态学概念，指一定时空内能量的可循环平衡流动，由无机环境、生产者、消费者、分解者组成。类比到Android：Android系统提供底层基础平台；开发者研发产品/服务获取利润（生产者）；消费者使用产品满足需求（消费者）；Market应用市场提供开发者与消费者间资金支付与交易平台，加快\"能量\"流动。","ch":"第1章 Android系统简介"},{"q":"Android软件开发分为哪两个方向？应用开发者为什么要了解系统底层？","a":"分为系统移植与应用程序开发两个方向。对应用开发者而言，理解底层框架虽非必需，但可以极大提高分析问题的能力，并在产品性能优化方面产生积极作用，也有助于理解系统的设计思想和设计者初衷。","ch":"第1章 Android系统简介"},{"q":"什么是Repo？为什么Android不用Git直接管理源码？Repo下的提交流程是什么？","a":"Repo是Google提供的专门用于下载管理Android源码的Python脚本。AOSP由众多独立子项目组成，且Git上手难、不支持断点续传，故用Repo统一管理；本地开发仍以原生Git为主，差异在与远程仓库的交互。流程：repo start建分支（不建议在master操作）→修改文件→git add暂存→git commit提交→repo sync后repo upload上传代码服务器。","ch":"第2章 Android源码下载及编译"},{"q":"Repo有哪些常用命令？","a":"同步：repo sync（可指定某项目）；分支：repo start <BRANCH_NAME>创建、repo branches或git branch查看、git checkout切换；查询：repo status查当前状态、repo diff查未提交修改；版本管理：git add暂存、git commit提交，上传前先repo sync再repo upload。","ch":"第2章 Android源码下载及编译"},{"q":"Android官方建议的编译环境要求有哪些？","a":"①Linux或Mac系统（Google内部多用Ubuntu LTS 14.04）；②虚拟机编译至少需16GB RAM/Swap；③Gingerbread(2.3.x)及以上必须64位环境；④至少100GB磁盘空间（仅源码就近10GB）；⑤Python 2.6-2.7、GNU Make 3.81-3.82、Git 1.7以上；⑥编译Android N需Java 8（OpenJDK）。","ch":"第2章 Android源码下载及编译"},{"q":"什么是交叉编译？涉及哪三个对象？常见的交叉编译器有哪些？","a":"若目标平台无法安装编译器或资源有限无法编译，需另一平台辅助生成可执行文件，即交叉编译。三对象：①宿主机（Host）：开发和编译代码所在平台（如X86 PC）；②目标机（Target）：编译产物运行的目标平台（如Arm）；③交叉编译器（Cross Compiler）：运行于宿主机、产生目标机可执行文件的编译器（如armcc、arm-elf-gcc、arm-linux-gcc）。","ch":"第2章 Android源码下载及编译"},{"q":"不同Android版本对JDK的要求是什么？为何切换到OpenJDK？ccache如何配置？","a":"JDK 5对应Cupcake~Froyo，JDK 6对应Gingerbread~Kitkat，最新工程改用OpenJDK 8及以上（基于Oracle版权纠纷考虑），安装openjdk-8-jdk后用update-alternatives --config java/javac配置，版本错误时make会提示。ccache作为编译缓冲加快重编译：.bashrc中export USE_CCACHE=1，非本地home需设CCACHE_DIR，源码下载后执行prebuilt/linux-x86/ccache/ccache -M 50G（推荐50-100GB）。","ch":"第2章 Android源码下载及编译"},{"q":"Android源码下载的完整流程是什么？-b选项和.repo目录的作用是什么？","a":"①下载Repo：curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo，chmod a+x；②配置：mkdir source后repo init -u https://android.googlesource.com/platform/manifest，-b选项可指定非master分支（如android-4.0.1_r1），生成.repo目录；③repo sync下载。国内可用清华TUNA镜像（aosp.tuna.tsinghua.edu.cn）替换remote的fetch。.repo/manifests本身是Git项目，其default.xml以project标签管理所有子项目并记录分支版本。","ch":"第2章 Android源码下载及编译"},{"q":"编译目标BUILD和BUILDTYPE各代表什么？有哪些取值？如何选择？","a":"BUILD描述目标设备：full（模拟器全编译，含所有语言、应用、输入法）、full_maguro（Galaxy Nexus）、full_panda（PandaBoard）。BUILDTYPE描述编译场景：user（权限受限，发布上市版本）、userdebug（有root权限，调试用）、eng（engineering工程版本）。命令：lunch BUILD-BUILDTYPE，如lunch full-eng即生成运行于模拟器的工程版系统；直接输入lunch列出所有已配置产品。","ch":"第2章 Android源码下载及编译"},{"q":"编译原生态Android系统的步骤是什么？如何加速编译和打版本号？","a":"①source ./build/envsetup.sh（或用点号. ./代替），加载lunch、m、mm等函数；②lunch选择编译目标；③make编译（2.3以下需3小时+，JellyBean以上5小时+），可用make -jN加速（N取决于CPU数、每CPU核心数、每核心线程数）。技巧：make前export BUILD_NUMBER=${USER}-'date +%Y%m%d-%H%M%S'打上Build Number标签，注意避免$、&、:、/、\\等符号。","ch":"第2章 Android源码下载及编译"},{"q":"如何编译SDK？Linux和Windows下有何区别？","a":"Mac/Linux：下载源码→执行envsetup.sh→lunch sdk-eng→make sdk（可-j4加速）。Windows：只能基于Linux（不支持MacOS）的编译结果：先编译Linux版SDK，再sudo apt-get install mingw32 tofrodos，然后envsetup.sh、lunch sdk-eng、make win_sdk。面向Host的产物在out/host（如out/host/darwin-x86/sdk/...zip），Target产物在out/target；用emulator [OPTIONS]启动模拟器。","ch":"第2章 Android源码下载及编译"},{"q":"定制新设备时配置文件按层级分为哪四类？构建顺序是什么？","a":"①芯片架构层（Architecture）：硬件架构如ARM、X86；②核心板层（Board）：硬件电路核心板配置（如三星S5PV210）；③设备层（Device）：外围设备配置（如键盘、触摸屏）；④产品层（Product）：最终系统包含的软件模块与配置（如默认语言、是否带相机应用）。构建顺序从底层往上：芯片架构→核心板→设备→产品。规范做法是在device目录下建厂商文件夹和产品子目录。","ch":"第2章 Android源码下载及编译"},{"q":"vendorsetup.sh的作用是什么？何时被调用？扫描哪些路径？","a":"vendorsetup.sh通过add_lunch_combo（函数定义在envsetup.sh中）将产品组合（如full_toro-userdebug）添加到系统相关变量，lunch的选单即基于这些变量产生。调用时机：envsetup.sh末尾通过for循环find扫描device和vendor目录（maxdepth 4）下所有vendorsetup.sh并执行。注：Android 4.3后已无vendor目录，建议产品统一放device下。类比超市：扫描仓库→上架（add_lunch_combo）→消费者挑选（lunch）。","ch":"第2章 Android源码下载及编译"},{"q":"AndroidProducts.mk和产品专用makefile（如full_toro.mk）如何编写？","a":"AndroidProducts.mk每款产品通用，通常只做\"转向\"：PRODUCT_MAKEFILES := $(LOCAL_DIR)/full_toro.mk等指向产品专用mk。产品mk中：PRODUCT_COPY_FILES将配置文件复制到系统指定目录；$(call inherit-product,...)继承其他mk；PRODUCT_NAME/PRODUCT_DEVICE/PRODUCT_BRAND/PRODUCT_MANUFACTURER/PRODUCT_MODEL定义产品信息；PRODUCT_PACKAGES指定预装程序；PRODUCT_LOCALES支持语言（格式如en_GB de_DE）；PRODUCT_PROPERTY_OVERRIDES重载系统属性（key=value，最终写入/system/build.prop）。","ch":"第2章 Android源码下载及编译"},{"q":"BoardConfig.mk的作用是什么？Android.mk与产品mk有何区别？build.prop由哪些部分组成？","a":"BoardConfig.mk填写目标架构、硬件属性、编译条件标志、分区布局（BOARD_SYSTEMIMAGE_PARTITION_SIZE等）、boot地址、ramdisk大小，变量多以TARGET_/BOARD_开头（TARGET_CPU_ABI、BOARD_KERNEL_CMDLINE等），技巧是复制架构相近的厂商样本修改。Android.mk是编译单个模块（\"零件\"）的标准makefile，区别于决定产品属性的配置文件。/system/build.prop由/build/core/Makefile控制生成，来自build/tools/buildinfo.sh、TARGET_DEVICE_DIR下的system.prop、ADDITIONAL_BUILD_PROPERTIES，post_process_props.py负责清理黑名单项。","ch":"第2章 Android源码下载及编译"},{"q":"Google提供了哪些Linux内核版本仓库？Panda设备如何下载并编译内核？","a":"内核仓库：exynos（Samsung Exynos芯片）、goldfish（模拟平台）、msm（ADP1/ADP2、Nexus One、Qualcomm MSM）、omap（PandaBoard、Galaxy Nexus、TI OMAP）、samsung（Nexus S、Hummingbird）、tegra（Xoom、NVIDIA Tegra）、common（通用）。Panda匹配omap.git。步骤：git log --max-count=1 kernel获取提交值→git clone kernel/omap后git checkout该值→下载platform/prebuilt并加入PATH→export ARCH=arm、SUBARCH=arm、CROSS_COMPILE=arm-eabi-→make panda_defconfig→make。","ch":"第2章 Android源码下载及编译"},{"q":"常见的系统烧录方式有哪些？Bootloader的主要作用是什么？","a":"①SD卡工厂烧录：不需PC、操作简便，广泛用于工厂生产；②USB方式：需PC配合客户端程序；③专用烧写工具：如J-Tag；④网络连接方式：少见，要求设备能联网；⑤Bootloader+fastboot模式（\"线刷\"）：前提是设备已有可用Bootloader，不适用于工厂首次烧录；⑥Recovery模式：同样不适用首次烧录，是普通消费者升级首选。Bootloader作用：①提供下载模式，将各Image写入永久存储介质；②开机引导系统启动。完整烧录包至少含Boot Loader、Linux Kernel、Android System三部分。","ch":"第2章 Android源码下载及编译"},{"q":"Multilib Build需满足什么条件？平台层和单模块分别如何配置？","a":"条件：支持64/32位（四种场景：只编64、只编32、64优先、32优先）且对现有编译系统改动不大。平台配置（BoardConfig.mk）：Primary Arch用TARGET_ARCH（arm64）、TARGET_ARCH_VARIANT、TARGET_CPU_VARIANT、TARGET_CPU_ABI；Secondary用TARGET_2ND_ARCH、TARGET_2ND_ARCH_VARIANT、TARGET_2ND_CPU_ABI等；TARGET_PREFER_32_BIT:=true默认编32位。单模块（Android.mk）：LOCAL_MULTILIB取\"first\"（只Primary）、\"both\"（32和64都编）、\"32\"、\"64\"或默认\"\"。","ch":"第2章 Android源码下载及编译"},{"q":"TARGET_SUPPORTS_32/64_BIT_APPS的规则和make指定目标的位数规则是什么？","a":"①TARGET_SUPPORTS_32_BIT_APPS与64_BIT_APPS同时设置：编译64位应用程序，除非设TARGET_PREFER_32_BIT或在Android.mk中重载；②只设一个：只编对应位数的应用；③都未设置：默认只编32位应用。注意：make命令直接指定的目标只产生64位编译，如lunch aosp_arm64-eng后make libc只编64位libc，编32位需make libc_32。架构相关变量：LOCAL_MODULE_TARGET_ARCH（白名单）、LOCAL_MODULE_UNSUPPORTED_TARGET_ARCH（黑名单）、带_WARN后缀则被忽略时打warning；编译标志可加arch后缀如LOCAL_CFLAGS_arm64。","ch":"第2章 Android源码下载及编译"},{"q":"Multilib下Zygote如何同时支持32/64位应用？init.rc有何变化？","a":"Multilib编译产生Zygote64和Zygote32两个版本。Lollipop之前Zygote启动脚本直接写在init.rc中，之后改为import /init.${ro.hardware}.rc和import /init.${ro.zygote}.rc，根据系统属性ro.zygote加载不同脚本。如zygote64_32时，init.zygote64_32.rc启动两个Service：app_process64（主zygote，带--start-system-server）和app_process32（zygote_secondary）。app_process的Android.mk中LOCAL_MULTILIB:=both，LOCAL_MODULE_STEM_32/64分别指定两个程序名，是Multilib模块的范例。","ch":"第2章 Android源码下载及编译"},{"q":"Android编译生成的常见image文件各自的功能是什么？","a":"boot.img：包含内核启动参数、内核等多个元素；ramdisk.img：小型根文件系统，是系统启动的关键；system.img：系统运行程序包（framework所在），挂载到/system节点；userdata.img：各程序数据存储，挂载到/data；recovery.img：进入恢复模式所需映像；misc.img：各种杂项资源；cache.img：缓冲区，挂载到/cache。产物位于out/target/product/[产品名]/目录。","ch":"第2章 Android源码下载及编译"},{"q":"mkbootimg工具的参数有哪些？boot.img的文件结构如何？","a":"mkbootimg（源码system/core/mkbootimg）参数：--kernel（如zImage）、--ramdisk、--second（第二阶段文件，可选）、--cmdline（内核启动参数）、--board、--base（启动基地址）、--pagesize、-o输出；BoardConfig中BOARD_KERNEL_CMDLINE→--cmdline，BOARD_KERNEL_BASE→--base。boot.img结构：boot header（1 page=4KB，对应结构体boot_img_hdr，起始8字节为\"ANDROID!\"即BOOT_MAGIC）→kernel→ramdisk→second stage（可选），各元素页对齐：pages=(size+page_size-1)/page_size。Verified Boot下还用boot_signer（system/extras/verity）在尾部附加签名段。","ch":"第2章 Android源码下载及编译"},{"q":"如何解压ramdisk.img和system.img？","a":"ramdisk.img是gzip压缩的cpio归档：file显示gzip data→改名ramdisk.img.gz后gzip -d解压得ASCII cpio archive（SVR4 with no CRC）→cpio -i -F ramdisk.img解出文件。内容含system目录、data目录及init程序（启动时运行的第一个程序），即root根目录镜像（out/target/product/[产品]/root）。system.img用mount法：先simg2img（产物在out/host/linux-x86/bin，源码system/extras/ext4_utils）将sparse转raw：./simg2img system.img system.img.step1，再sudo mount -o loop挂载到目录，得到/system节点内容。","ch":"第2章 Android源码下载及编译"},{"q":"Verified Boot是什么？涉及哪些关键术语？Boot State如何判定？","a":"Verified Boot是Android 4.4结合Kernel dm-verity驱动实现的安全特性，保护系统免受恶意程序侵害。术语：dm-verity（运行时按Hash Tree和Signed metadata验证文件系统分区完整性的内核驱动）、Boot State（保护等级GREEN/YELLOW/ORANGE/RED）、Device State（LOCKED/UNLOCKED）、Keystore（公钥集合）、OEM key。LOCKED设备先经OEM KEY Verification，通过为GREEN，否则Signature Verification决定YELLOW/RED；UNLOCKED不校验但会警示用户。校验链：Bootloader验boot和recovery分区，Boot分区保证system等后续分区安全，大块分区（System Image）用dm-verity。Device State切换时data分区会被擦除。","ch":"第2章 Android源码下载及编译"},{"q":"如何使Android设备进入Bootloader模式？","a":"两种最常见的方法：①执行\"fastboot reboot-bootloader\"命令重启设备并进入Bootloader模式；②在关机状态下同时按住设备的\"音量减\"和电源键。注意：使用Bootloader+fastboot\"线刷\"的前提是设备中已存在可用的Bootloader，因此不能用于工厂首次烧录（此时设备中尚无有效系统程序）。","ch":"第2章 Android源码下载及编译"},{"q":"什么是ODEX？它有哪些优势？","a":"ODEX即Optimized Dalvik Executable（优化的Dalvik可执行文件）。编译链：Java→class→dx工具转dex→与资源压缩成zip格式的APK。ODEX是预先将DEX提取出来并针对当前具体设备优化后的产物。优势：①提高加载/运行速度（无需解压APK提取dex）；②加大破解难度（需提供匹配的core.jar、ext.jar、framework.jar、services.jar等环境文件）；③节省存储空间（只有一份且比dex更小，不像原做法在APK和/data/dalvik-cache各存一份dex）。","ch":"第2章 Android源码下载及编译"},{"q":"OTA升级分为哪三个阶段？如何生成完整包和差分包？获取方式有哪些？","a":"三阶段：生成升级包→获取升级包→执行升级。完整包：make otapackage（前提已生成system.img等映像），产物out/target/product/[产品]/[产品]-ota-eng.[UID].zip。差分包：调用build/tools/releasetools/ota_from_target_files脚本并带-i参数：ota_from_target_files -i old.zip new.zip；不带-i则生成完整包。其他Flags：-k签名key（默认META/misc_info.txt或testkey）、-w擦除user data、-n忽略时间戳、-e附加脚本。获取渠道：在线升级（服务器存放管理OTA包，如HTC、MIUI）和本地升级（update.zip放SD卡根目录手动升级）。","ch":"第2章 Android源码下载及编译"},{"q":"设备何时进入Recovery模式？Recovery通过哪些文件与主系统沟通？常用CommandLine参数有哪些？","a":"两种情况：①开机过程中检测到RecoveryKey按下（通常为电源+Volume+组合键）；②系统主动指定进入（如OTA包下载完成后重启刷写）。Recovery程序源码/bootable/recovery/recovery.cpp，通过三个文件与主系统沟通：/cache/recovery/command（INPUT，Android发送的命令）、/cache/recovery/log（OUTPUT，日志）、/cache/recovery/intent（OUTPUT，传回intent）。常用参数：--update_package=path（安装OTA包）、--wipe_data（擦user data后重启）、--wipe_cache、--send_intent、--just_exit等。Recovery既是OTA升级（\"卡刷\"）的执行者，也是恢复出厂设置的实际执行者。","ch":"第2章 Android源码下载及编译"},{"q":"恢复出厂设置和OTA安装在Recovery中的处理流程是什么？什么是BCB？","a":"wipe_data流程：设置中选择恢复出厂→Android在command写入--wipe_data→重启进入recovery→get_args()在BCB写入boot-recovery和--wipe_data（保证重启后仍进erase流程）→erase_volume格式化/data和/cache→finish_recovery擦除BCB→reboot。OTA流程：写入--update_package=[路径]→重启进recovery→get_args写BCB→install_package安装→finish_recovery→失败时prompt_and_wait显示错误等待用户。BCB（bootloader control block）是recovery与bootloader间通信的flash块，对应结构体bootloader_message（command[32]、status[32]、recovery[1024]），存于misc分区。","ch":"第2章 Android源码下载及编译"},{"q":"Android反编译的一般流程和工具链是什么？有何正当用途？","a":"流程：①获取dex/odex（APK用Zip解出classes.dex；系统包如framework在system.img中需先还原）；②odex→smali：baksmali（java -jar baksmali-x.x.x.jar -a <api_level> -x <odex> -d <framework目录>，需core.jar等包）；③smali→dex：smali工具（java -jar smali-x.x.x.jar out/ -o xx.dex）；④dex→jar：dex2jar.sh；⑤jd-gui图形工具阅读Java代码。正当用途：验证修改是否被编译进目标文件、确认机器运行版本是否正确，反编译不等于破解。代码混淆可保护知识产权、防篡改，但使反编译结果与源码有差距。","ch":"第2章 Android源码下载及编译"},{"q":"什么是NDK？Application.mk有哪些核心变量？ndk-build如何使用？","a":"NDK（Native Development Kit）支持Android下C/C++开发，好处：①提高程序运行效率（JVM比C/C++更耗资源）；②复用已有C/C++库。Java与C/C++混合编程需JNI：Java类声明native方法，C/C++实现并编译成so库。Application.mk核心变量：APP_PROJECT_PATH（程序根目录）、APP_OPTIM（release/debug，优先级高于debuggable）、APP_CFLAGS（全体module编译标志）、APP_LDFLAGS（仅对动态库和可执行程序有效）、APP_ABI（默认armeabi，可选armeabi-v7a、arm64-v8a、x86、x86_64、mips、mips64、all）。编译：cd <project>后执行<ndk>/ndk-build（等价于GNUMAKE -f build/core/build-local.mk），支持clean、-B（强制完整编译）、NDK_LOG=1等选项。","ch":"第2章 Android源码下载及编译"},{"q":"第三方ROM（CyanogenMod）移植的主要步骤是什么？","a":"①前期准备：获取设备Product Name、Code Name、Platform Architecture、内存/存储等信息（root后从/system/build.prop获取）、收集内核源码（GPL协议要求厂商公布）、获取分区信息；②建立三个核心文件夹：device/[vendor]/[codename]（设备配置与代码）、vendor/[vendor]/[codename]（从原始设备拉取的无源码二进制文件）、kernel/[vendor]/[codename]（内核源码），可用mkvendor.sh（build/tools/device/mkvendor.sh）创建雏形，再修改BoardConfig.mk、device_[codename].mk、cm.mk、recovery.fstab等；③make recoveryimage编译测试recovery（按键失灵可改recovery_ui.cpp的GPIO配置）；④为device目录建立github仓库；⑤填充vendor目录（参考extract-files.sh和setup-makefiles.sh）；⑥编译ROM升级包并用recovery刷入，反复调试。","ch":"第2章 Android源码下载及编译"},{"q":"Makefile基础规则的结构是什么？各部分含义是什么？","a":"规则格式为 TARGET: PREREQUISITES 加 COMMANDS。TARGET是需要生成的目标文件，PREREQUISITES是目标所依赖的文件，当任一依赖比TARGET新时触发COMMANDS执行。每个COMMAND前必须有一个TAB制表符。Makefile是脚本，由make程序解析（Android采用GNU make），不限于编译用途。","ch":"第3章 Android编译系统"},{"q":"什么是Makefile的Target-Specific Variable？为什么Android编译系统需要它？","a":"局部作用域变量，只对特定目标生效，如 $(built_odex): PRIVATE_DEX_FILE := $(built_dex)。因为package_internal.mk是APK编译模板内部实现，会被多次调用，全局变量$(built_dex)的值不断变化，执行COMMANDS时可能已“物是人非”导致不可预期的错误；私有变量保证在定义它的目标规则中值不变，确保编译执行阶段的准确性。","ch":"第3章 Android编译系统"},{"q":"Makefile的Static Pattern Rules语法格式及工作原理？","a":"格式为 TARGETS...: TARGET-PATTERN: DEP-PATTERNS...（带两个冒号），常用于多目标场景。例如 foo.o tcc.o bar.o : %.o : %.c：TARGET-PATTERN中的%与TARGETS匹配得到词干（STEM）foo/tcc/bar，词干再与DEP-PATTERNS中的%组合生成依赖对象foo.c/tcc.c/bar.c。","ch":"第3章 Android编译系统"},{"q":"2006年Android编译系统重构的核心目标和主要设计原则是什么？","a":"核心目标：让依赖关系分析更可靠（正确判断需编译模块）；准确判断不必要编译的模块以提高效率。设计原则：(1)同一套代码支持编译出不同构建目标（设备端软件包、Host工具）；(2)Non-Recursive Make（受1997年论文《Recursive Make Considered Harmful》影响，采用唯一Makefile组织编译）；(3)可对任意模块单独编译验证；(4)中间过程文件、编译结果与源代码存储目录分离。","ch":"第3章 Android编译系统"},{"q":"Make程序解析Makefile的三大步骤是什么？","a":"(1)变量赋值、环境检测等初始化操作；(2)按照规则生成所有依赖树；(3)根据用户选择的依赖树，从叶到根逐步生成目标文件。不带参数的make会以第一个符合要求的目标作为默认依赖树根节点，所以Target的书写顺序很重要（clean等目标不能放开头）。","ch":"第3章 Android编译系统"},{"q":"Android编译系统依赖树的根节点droid是如何定义的？它依赖什么？","a":"droid在build/core/main.mk中定义为伪目标：.PHONY: droid 且 DEFAULT_GOAL := droid，必须是第一个声明的target（空规则占位）。真正规则根据TARGET_BUILD_APPS分两支：非空时droid只依赖apps_only（只编译APP）；否则（编译整个系统）droid依赖droidcore和dist_files两个PREREQUISITES。","ch":"第3章 Android编译系统"},{"q":"main.mk的主要职责有哪些？","a":"(1)编译环境检测（Java版本、make版本等，不通过则终止编译）；(2)前期处理（工程清理、工具安装）；(3)引用其他Makefile（config.mk、cleanbuild.mk等）；(4)设置全局变量；(5)各种函数实现（如print-vars、my-dir）。它还负责把所有Android.mk收集进subdir_makefiles变量并一次性include进编译系统。","ch":"第3章 Android编译系统"},{"q":"Android编译系统中主要Makefile文件的作用？","a":"main.mk：编译系统主导文件；config.mk：产品配置主导文件（管BoardConfig.mk、AndroidProducts.mk、javac.mk、envsetup.mk，赋值BUILD系列变量）；base_rules.mk：基础规则，ALL_MODULES变量将各Android.mk的LOCAL_MODULE加入全局依赖树；clear_vars.mk：清空LOCAL开头变量；definitions.mk：大量实用函数；envsetup.mk：编译环境变量（区别于envsetup.sh）；version_defaults.mk：版本信息（BUILD_NUMBER格式eng.$(USER).日期）。","ch":"第3章 Android编译系统"},{"q":"droidcore有哪些prerequisites？分别生成什么？","a":"依赖：files（先决条件集合，无实际意义）、systemimage（生成system.img）、INSTALLED_BOOTIMAGE_TARGET（boot.img）、INSTALLED_RECOVERYIMAGE_TARGET（recovery.img）、INSTALLED_USERDATAIMAGE_TARGET（userdata.img）、INSTALLED_CACHEIMAGE_TARGET（cache.img）、INSTALLED_VENDORIMAGE_TARGET（vendor.img）、INSTALLED_FILES_FILE（installed-files.txt，记录预装程序/库）。droidcore负责生成系统所有可运行程序包。","ch":"第3章 Android编译系统"},{"q":"files节点包含哪些部分？tags_to_install机制如何工作？","a":"files包括prebuilt（伪目标，依赖已废弃的ALL_PREBUILT，现用PRODUCT_COPY_FILES替代）、modules_to_install、INSTALLED_ANDROID_INFO_TXT_TARGET等。模块可打编译标志（user/debug/eng/tests），编译时指定eng标志则无关模块被排除。eng_MODULES由函数get-tagged-modules填充，它综合考虑“可接受”和“拒绝”标签——同时有两类标签的对象仍被淘汰；查找由modules-for-tag-list实现。","ch":"第3章 Android编译系统"},{"q":"dist_files节点的作用是什么？","a":"根节点droid的另一个依赖，在整个编译项目中只出现一次。当它起作用时会在out目录下产生专门的dist文件夹，用于存储多种分发包；通常情况下不做任何工作，也不影响理解编译系统。dist-for-goals函数用于记录goal所需的src:dst对并复制分发文件。","ch":"第3章 Android编译系统"},{"q":"为Android添加定制设备需要哪些脚本文件？各自何时被调用？","a":"涉及vendorsetup.sh（在envsetup.sh中被调用，通过add_lunch_combo为lunch添加加载项）、AndroidProducts.mk、BoardConfig.mk、Android.mk。调用时序上Android.mk最后被main.mk调用：前面的步骤决定选择“什么产品”及产品属性，最后才考虑产品的“零件”组成——每个零件由一个Android.mk描述。","ch":"第3章 Android编译系统"},{"q":"Java库编译的典型依赖链是什么（java.mk中变量环环相扣的顺序）？","a":"built_dex → built_dex_intermediate → full_classes_proguard_jar → full_classes_jar → full_classes_emma_jar → full_classes_jarjar_jar → full_classes_compiled_jar → java_sources+java_resource_sources+full_java_lib_deps+jar_manifest_file。各中间产物依次为classes.dex ← no-local/with-local classes.dex ← proguard.classes.jar ← classes.jar ← lib/classes-jarjar.jar ← classes-jarjar.jar ← classes-no-debug-var.jar。","ch":"第3章 Android编译系统"},{"q":"Jack编译器与传统Java编译链的区别是什么？","a":"Jack（Java Android Compiler Kit）从6.0开始引入，取代javac、ProGuard、jarjar、dx等工具，直接将Java源文件编译成Dex字节码。优势：加快编译速度、内建shrinking/obfuscation/repackaging/multidex、完全开源。区别：Jack不输出中间状态的jar文件（如classes.jar），直接得到最终dex产物（Static Java Library还生成.jack文件），这也是Jacoco等分析工具失效的原因。与Jack配合的转换工具是Jill（Jack Intermediate Library Linker）。","ch":"第3章 Android编译系统"},{"q":"Jack Server的配置文件$HOME/.jack包含哪些重要配置项？","a":"SERVER=true（启用Server，默认打开）；SERVER_PORT_SERVICE=8072（编译功能端口）；SERVER_PORT_ADMIN=8073（管理功能端口）；SERVER_NB_COMPILE=4（并行编译最大数量）；SERVER_TIMEOUT=60（无任务多长时间后自动关闭）；SERVER_LOG（Log路径）；JACK_VM_COMMAND=java（启动JVM的默认命令）。编译失败的常见原因：端口被占用（改用高位端口）、JVM堆内存不足（如申请2560m超过机器配置）。","ch":"第3章 Android编译系统"},{"q":"如何在Android.mk中禁用Jack编译？","a":"在Android.mk中添加语句：LOCAL_JACK_ENABLED := disabled。适用于确实由Jack引发问题且暂时无法解决的情况（Jack是experimental特性，存在bug），但并非所有情况都适用，比如存在其他依赖关系时。","ch":"第3章 Android编译系统"},{"q":"编写Android.mk的基本顺序和结构是什么？","a":"顺序：LOCAL_PATH（用$(call my-dir)确定源码目录，须放在CLEAR_VARS之前且只需定义一次）→ include $(CLEAR_VARS)（清空LOCAL_开头变量，模块开始标志）→ LOCAL_SRC_FILES → LOCAL_CFLAGS（可选）→ LOCAL_MODULE（全局唯一、不含空格）→ LOCAL_STATIC_LIBRARIES（可选）→ include $(BUILD_XXX)（编译模板，模块结束）。每个Android.mk可包含多个模块，每个模块以CLEAR_VARS开始、BUILD_XXX结束。","ch":"第3章 Android编译系统"},{"q":"Android.mk中常用的重要变量有哪些？","a":"LOCAL_PATH（源码目录）、CLEAR_VARS（清空LOCAL_变量）、LOCAL_MODULE（模块名）、LOCAL_MODULE_PATH（输出路径）、LOCAL_SRC_FILES（源文件）、LOCAL_CC/LOCAL_CXX（指定C/C++编译器）、LOCAL_CPP_EXTENSION（特殊C++后缀）、LOCAL_CFLAGS/CXXFLAGS（编译选项）、LOCAL_C_INCLUDES（额外头文件）、LOCAL_STATIC_LIBRARIES/LOCAL_SHARED_LIBRARIES（静态/共享库）、LOCAL_JAVA_LIBRARIES、LOCAL_LDLIBS（链接选项）、LOCAL_COPY_HEADERS与LOCAL_COPY_HEADERS_TO（复制头文件及目的地）。","ch":"第3章 Android编译系统"},{"q":"BUILD_JAVA_LIBRARY和BUILD_STATIC_JAVA_LIBRARY的区别？","a":"BUILD_STATIC_JAVA_LIBRARY生成的Java库既不会被安装，也不会被放到Java的Classpath中；BUILD_JAVA_LIBRARY得到的Java库具有“共享”性质，可为多个程序共用，会被复制到/system/framework中。其他常用编译模板包括BUILD_EXECUTABLE、BUILD_HOST_EXECUTABLE、BUILD_STATIC_LIBRARY、BUILD_SHARED_LIBRARY、BUILD_PACKAGE、BUILD_PREBUILT、BUILD_DROIDDOC等。","ch":"第3章 Android编译系统"},{"q":"envsetup.sh提供哪些常用函数？","a":"croot（回到AOSP根目录）、m（从树根执行make）、mm（编译当前目录模块，不含依赖）、mmm（编译指定目录模块，不含依赖）、mma/mmma（同上但包含依赖）；grep类：cgrep（C/C++文件）、ggrep（gradle）、jgrep（Java）、resgrep（res/*.xml）、mangrep（AndroidManifest.xml）、sepgrep（sepolicy）、sgrep（所有源码）；godir（转到包含指定文件的目录）。envsetup.sh最后会扫描device和vendor目录（深度4）下所有vendorsetup.sh并加载。","ch":"第3章 Android编译系统"},{"q":"lunch命令如何验证product的合法性？","a":"lunch解析product-variant参数后调用check_product，后者通过get_build_var TARGET_DEVICE实现：回到工程根目录，设置TARGET_PRODUCT等变量，执行make -f build/core/config.mk dumpvar-TARGET_DEVICE。config.mk会include envsetup.mk、javac.mk、dumpvar.mk；envsetup.mk引用product_config.mk，后者读取AndroidProducts.mk中的PRODUCT_MAKEFILES，通过get-product-makefiles/import-products/import-nodes解析产品定义并对PRODUCTS、DEVICES赋值，最后TARGET_DEVICE := $(PRODUCTS.$(INTERNAL_PRODUCT).PRODUCT_DEVICE)。出错时$(error)终止脚本，$?非0则lunch报错。","ch":"第3章 Android编译系统"},{"q":"lunch如何验证variant的合法性？合法的variant有哪些？","a":"通过check_variant函数，将参数与VARIANT_CHOICES数组逐一比较（只有user、userdebug、eng三种），匹配则返回0，否则返回1；lunch中通过$? -ne 0判断并报错“Invalid variant”。验证通过后lunch导出TARGET_PRODUCT、TARGET_BUILD_VARIANT、TARGET_BUILD_TYPE=release等全局变量。","ch":"第3章 Android编译系统"},{"q":"make sdk时main.mk中如何判断和处理sdk编译？","a":"通过MAKECMDGOALS判断：ifneq ($(filter sdk win_sdk sdk_addon,$(MAKECMDGOALS)),)则is_sdk_build := true。SDK编译时tags_to_install := debug eng。sdk目标定义为 .PHONY: sdk; sdk: $(ALL_SDK_TARGETS)，而ALL_SDK_TARGETS即$(INTERNAL_SDK_TARGET)。同时调用dist-for-goals记录sdk/win_sdk所需的dist文件。make sdk不能与其他target同时指定。","ch":"第3章 Android编译系统"},{"q":"dist-for-goals函数的工作流程是什么？","a":"定义在distdir.mk，参数$(1)是goal集合（如sdk win_sdk），$(2)是dist文件列表。流程：将file中的冒号替换为空格（subst+eval），前半为src后半为dst；若dst为空则取src的文件名（$(if)函数保证默认值）；用filter判断src:dst组合是否已在_all_dist_src_dst_pairs中——已存在则只调用add-dependency添加依赖，否则调用copy-one-dist-file复制文件。eval函数参数会被扩展两次（eval函数一次，作为makefile语法解析时再一次）。","ch":"第3章 Android编译系统"},{"q":"INTERNAL_SDK_TARGET是如何定义的？其deps包含哪些内容？","a":"INTERNAL_SDK_TARGET := $(sdk_dir)/$(sdk_name).zip，sdk_dir为$(HOST_OUT)/sdk/$(TARGET_PRODUCT)，sdk_name为android-sdk_$(FILE_NAME_TAG)（如android-sdk_12345_linux-x86），典型值为out/host/linux-x86/sdk/sdk/android-sdk_eng.s_linux-x86.zip。deps包括target_notice_file_txt、tools_notice_file_txt、offline-sdk-timestamp、SYMBOLS_ZIP、INSTALLED_SYSTEMIMAGE、INSTALLED_USERDATAIMAGE_TARGET、INSTALLED_RAMDISK_TARGET、build prop、ATREE_FILES、sdk_atree_files、atree工具、line_endings、SDK_FONT_DEPS。打包使用atree工具并最终zip压缩。","ch":"第3章 Android编译系统"},{"q":"atree工具的作用和主要参数选项是什么？","a":"atree解析atree格式的SDK产物描述文件（左列为source，右列为destination），完成文件复制。参数：-f FILELIST（记录待复制文件名的文件列表）、-I INPUTDIR（基准目录）、-o OUTPUTDIR（复制目标路径）、-l（使用硬链接而非复制）、-m DEPENDENCY（输出make格式文件）、-v VAR=VAL（读取输入文件时将$VAR替换为VAL）、-d（调试模式）。如sdk.atree中将android.jar复制到platforms/${PLATFORM_NAME}/下。","ch":"第3章 Android编译系统"},{"q":"SDK中的android.jar是如何生成的？它包含什么内容？","a":"android.jar是SDK中供应用链接的“超级jar”，内容与framework组成基本一致，但只是“空壳”Stub（桩），所有函数体只抛出异常，不含实现体。生成流程：frameworks/base/Android.mk中用BUILD_DROIDDOC（droiddoc.mk）调用javadoc工具（-stubs选项）生成stub源码到android_stubs_current_intermediates/src；再由development/build/build_android_stubs.mk用javac编译这些源码并解压framework-res.apk取res和resources.arsc，最后jar -cf打包成classes.jar（即android.jar），通过ACP复制到PACKAGING/android_jar_intermediates目录。","ch":"第3章 Android编译系统"},{"q":"ACP是什么工具？","a":"ACP是Android编译系统提供的专门用于跨平台复制文件的工具，源码路径/build/tools/acp，用法：acp [OPTION] SOURCE DEST。在java.mk和SDK打包（android.jar复制）等场景中大量使用，如$(ACP) -fp $< $@。","ch":"第3章 Android编译系统"},{"q":"Android中gdbclient调试的完整流程是什么（以surfaceflinger为例）？","a":"gdbserver端（设备/system/bin/gdbserver）两种场景：attach已运行进程（gdbserver --attach :5039 [PID]，先用ps查PID）或从头启动被调试对象（gdbserver :5039 /system/bin/surfaceflinger）。客户端：在工程根目录source build/envsetup.sh后执行gdbclient surfaceflinger :5039 [PID]（端口和PID须与gdbserver一致）。gdbclient函数会根据TARGET_ARCH选择GDB客户端（arm用arm-linux-androideabi-gdb），生成gdbclient.cmds（含solib路径、dalvik.gdb、target remote），通过adb forward做端口映射。","ch":"第3章 Android编译系统"},{"q":"冯·诺依曼结构的核心观点是什么？","a":"起源于1945年冯·诺依曼关于EDVAC的论文，两大观点：(1)采用二进制，抛弃十进制——极大简化计算机设备的逻辑线路；(2)程序存储（stored-program）——程序指令和数据都存放在同一内存储器中，宽度一样，程序与数据共享同一总线（这也成为制约冯诺依曼机器的瓶颈）。结构包含运算器、控制器、输入输出设备等元素，又称普林斯顿结构。","ch":"第4章 操作系统基础"},{"q":"哈佛结构是什么？它与冯·诺依曼结构的区别和优缺点？","a":"哈佛结构（Harvard Architecture）也属于stored-program类型体系，并非冯诺依曼结构的对立面，而是其改进：指令与数据保存在不同存储器中。优点：指令与数据可以有不同数据宽度；执行速度更快（可预读下一条指令，提高吞吐量）。缺点：构架复杂且需要两个存储器，通常用于对速度有特殊需求且成本预算较高的场合。采用哈佛结构的芯片：ARM9、ARM11、ATMEL的AVR系列。","ch":"第4章 操作系统基础"},{"q":"计算机体系结构简化后包含哪些基本元素？","a":"CPU（中央处理器）、内存储器、输入设备、输出设备。输入输出设备一般统称I/O设备（外存储器也归于这一类），因此可简化为三部分：中央处理器、内存储器、I/O设备。任何操作系统（Windows、Linux、Android等）都建构在计算机体系结构之上。","ch":"第4章 操作系统基础"},{"q":"操作系统的定义和两大职责是什么？","a":"定义：计算机操作系统是负责管理系统硬件，并为上层应用提供稳定编程接口和人机交互界面的软件集合。两大重任：面向下层——管理硬件（CPU、内存、Flash、各种I/O设备等所有硬件元素）；面向上层——为用户提供人机交互界面，并为第三方程序研发提供便捷、可靠、高效的API，使上层应用无需直接面向硬件。核心工作是硬件管理与抽象。","ch":"第4章 操作系统基础"},{"q":"Android为什么采用Linux内核？（Patrick Brady《Android Anatomy and Physiology》2008）","a":"原因：Great memory and process management（优秀的内存和进程管理）；Permissions-based security model（基于权限的安全模型）；Proven driver model（成熟的驱动模型）；Support for shared libraries（支持共享库）；It's already open source（已经开源）。操作系统的难点（进程/内存管理、硬件驱动支持）正是Linux的长处。","ch":"第4章 操作系统基础"},{"q":"操作系统的常见分类角度有哪些？","a":"按应用领域：桌面型、服务器型、嵌入式操作系统；按支持用户数：单用户（DOS）、多用户（Windows、UNIX）；按实时性：实时操作系统（RTOS、VRTX）、分时系统（UNIX、Mac OS）；按指令长度：8/16/32/64 bit；按分布性：分布式操作系统、网络操作系统；按源码开放程度：开源（Linux、Android）、闭源（Windows、Mac OS）；按UNIX系列：UNIX-like（Minix、UNIX、Xinu）、Non-UNIX-like（Windows）；按POSIX兼容性：兼容（Linux）与不兼容。","ch":"第4章 操作系统基础"},{"q":"什么是IPC（进程间通信）？有哪些简单实现方式？","a":"广义上IPC指运行在不同进程（不论是否在同一台机器）中的若干线程间的数据交换。跨机器的进程通信通常由网络连接（RPC），增加实现难度。简单实现方式：文件共享（需注意多进程访问的同步问题）、操作系统公共信息机制（如Windows注册表）。经典高效机制：共享内存、管道、UNIX Domain Socket等。","ch":"第4章 操作系统基础"},{"q":"Linux共享内存（Shared Memory）的实现步骤和相关函数？","a":"Step1 创建共享区：shmget(key, size, shmflg)，key为IPC_PRIVATE或指定IPC_CREAT时创建新区域，返回区域id；Step2 映射：shmat(shmid, shmaddr, shmflag)，返回内存区起始地址；Step3 其他进程用同一key通过shmget+shmat映射访问；Step4 通信（共享内存本身无同步机制，需进程自己协商）；Step5 撤销映射：shmdt(shmaddr)；Step6 删除共享区：shmctl(shmid, cmd, buf)（cmd可为IPC_STAT/IPC_SET/IPC_RMID）。Linux下分配大小为页的整数倍。","ch":"第4章 操作系统基础"},{"q":"管道（Pipe）的特点和使用方法是什么？","a":"管道是单向的（进程既读又写需两根管道）；一根管道有read end和write end（pipefd[0]读、pipefd[1]写）；有容量限制——满时写阻塞、空时读阻塞（2.6.11前容量等于page size，之后为65536字节）。Linux用pipe()创建，配合fork使用：子进程返回值0，父子进程共享管道文件描述符。无关系的进程无法使用匿名管道，由此发展出Named Pipe（FIFO），它是system-persistent的，生命周期不随进程结束，不用时需主动删除。","ch":"第4章 操作系统基础"},{"q":"UNIX Domain Socket（UDS）与Network Socket的区别？","a":"UDS（IPC Socket）专为单机内进程间通信设计；Network Socket基于TCP/IP协议栈，需要分包、重组等操作，用于单机通信效率不高。UDS是本机内的“安全可靠操作”，实现机制不依赖TCP/IP协议。使用上流程一致：socket(AF_UNIX, SOCK_STREAM, 0)（domain用AF_UNIX而非AF_INET）、bind（sockaddr_un，sun_path设路径名）、listen、accept、connect、send/recv。UDS还提供socketpair()简化通信双方工作。Android中使用最多的IPC是Binder，其次就是UDS。","ch":"第4章 操作系统基础"},{"q":"RPC（Remote Procedure Calls）的完整通信步骤是什么？","a":"(1)客户端进程调用Stub接口；(2)Stub根据操作系统要求打包并执行相应系统调用；(3)内核完成与服务器端的具体交互，将客户端数据包发给服务器端内核；(4)服务器端Stub解包并调用与数据包匹配的进程；(5)进程执行操作；(6)服务器以上述步骤的逆向过程将结果返回客户端。RPC对开发人员提供“透明性”，无需关心中间传输过程。","ch":"第4章 操作系统基础"},{"q":"信号量与PV原语的定义和执行过程？","a":"信号量与PV原语由Dijkstra发明。元素：Semaphore S（指示共享资源可用数量）、P操作（proberen=test，也表达为wait()，减小S）、V操作（verhogen=increment，也表达为signal()，增加S），都是原子操作。P过程：S自减1，若S≥0则直接返回开始操作共享资源，否则加入等待队列等待唤醒。V过程：S自增1，若S>0直接返回（无等待者），否则唤醒等待队列中的相关对象。","ch":"第4章 操作系统基础"},{"q":"Mutex与Semaphore的关系和区别？","a":"Semaphore中允许多个对象同时访问的称为Counting Semaphores；只允许取值0或1（locked/unlocked）的叫Binary Semaphore。Binary Semaphore与Mutex性质相同——Mutex是对某一排他资源的共享控制（要么locked要么unlocked）。很多操作系统中二者无本质差异；Mutex相较于Semaphore实现更简单。","ch":"第4章 操作系统基础"},{"q":"什么是管程（Monitor）？为什么需要它？","a":"管程由C.A.R.Hoare和Per Brinch Hansen提出，在Hansen's Concurrent Pascal Language中实现，是对Semaphore机制的延伸和改善。动机：Semaphore要求成对使用P/V，程序易读性差、信号量管理分散，可能引发死锁、进程饿死等问题。定义：管程是可以被多个进程/线程安全访问的对象或模块，其方法都受mutual exclusion保护（同一时刻只允许一个访问者）。属性：安全性、互斥性、共享性。Java、Python、C#、Delphi、Ruby等语言都实现了管程。","ch":"第4章 操作系统基础"},{"q":"Futex是什么？为什么快？它在ART中如何应用？","a":"Futex（Fast Userspace muTEXes）由Hubertus Franke等人发明，首现于Linux 2.5.7，2.6.x成为内核主基线一部分。“快”在于：大多数同步场景在应用程序空间就能应对，只有需要仲裁时才进入内核空间，节省系统调用和上下文切换时间。ART中若开启ART_USE_FUTEXES宏，Mutex::ExclusiveLock用state_（AtomicInteger）做原子CompareExchangeWeakAcquire获取锁，失败则调用futex(FUTEX_WAIT)挂起；futex由bionic提供，内部用SYS_futex系统调用。参数uaddr指向futex word（4字节integer，对应state_），op支持FUTEX_WAIT和FUTEX_WAKE。","ch":"第4章 操作系统基础"},{"q":"生产者-消费者问题如何用信号量解决？","a":"需要3个Semaphore：S_emptyCount（生产者获取可用缓冲区空间，初始N）、S_fillCount（消费者获取可用数据大小，初始0）、S_mutex（操作缓冲区，初始1）。生产者：Produce_item → P(S_emptyCount) → P(S_mutex) → Put_item_to_buffer → V(S_mutex) → V(S_fillCount)。消费者：P(S_fillCount) → P(S_mutex) → Read_item_from_buffer → V(S_mutex) → V(S_emptyCount) → Consume。缓冲区满禁止生产、空时消费者等待。Android中AudioTrack和AudioFlinger的数据交互即应用此模型。","ch":"第4章 操作系统基础"},{"q":"Android封装的同步类有哪些？分别在哪些文件？","a":"(1)Mutex：frameworks/native/include/utils/Mutex.h，对pthread API的简单再封装，内含AutoLock嵌套类；(2)Condition：frameworks/native/include/utils/Condition.h，条件变量实现类，依赖Mutex完成；(3)Barrier：frameworks/native/services/surfaceflinger/Barrier.h，同时基于Mutex和Condition实现的模型，专为SurfaceFlinger设计。三者都支持PRIVATE（进程内）和SHARED（跨进程）两种类型。","ch":"第4章 操作系统基础"},{"q":"Android的Mutex类提供了哪些接口？如何支持跨进程同步？","a":"三个重要接口：lock()（获取资源锁，资源不可用时阻塞等待）、unlock()（释放锁并唤醒等待者）、tryLock()（试探性查询，不可用也立即返回，返回值非0）。实现直接调用pthread：pthread_mutex_lock/unlock/trylock。enum定义PRIVATE=0（同进程同步）、SHARED=1（跨进程同步）；构造为SHARED时调用pthread_mutexattr_setpshared设置PTHREAD_PROCESS_SHARED属性。应用实例：AudioTrack与AudioFlinger跨进程，audio_track_cblk_t中lock(Mutex::SHARED)。","ch":"第4章 操作系统基础"},{"q":"Condition（条件变量）为什么需要与Mutex配合？pthread_cond_wait的语义是什么？","a":"Condition是“半成品”，不关心具体条件内容，只提供通用等待/通知机制（wait/waitRelative/signal/broadcast）。wait需传入Mutex：wait()内部调用pthread_cond_wait(&mCond, &mutex.mMutex)，其语义为：Step1释放锁mutex；Step2进入休眠等待；Step3唤醒后再获取mutex锁。必须先释放锁，否则open()/close()无法访问条件变量（如state），程序会陷入互相等待的死锁。判断条件用while循环（while(state==CLOSED) cv.wait(lock)），因为被唤醒不代表条件真正满足（如close末尾加broadcast也会唤醒wait）。","ch":"第4章 操作系统基础"},{"q":"Barrier类如何实现wait/open/close？它说明了什么？","a":"Barrier是填充了具体条件（state==OPENED）的Condition实例，用于SurfaceFlinger。wait()：先获取Mutex::Autolock _l(lock)，while(state==CLOSED)时cv.wait(lock)等待；open()：加锁后将state=OPENED并cv.broadcast()唤醒所有等待者；close()：加锁后state=CLOSED。state的访问必须有互斥锁保护，否则会出现“检查后睡眠前条件已改变导致永远不被唤醒”的竞态。wait()返回时Autolock析构会自动释放锁。Barrier常用于判断某线程是否初始化完成（不可逆场景）。","ch":"第4章 操作系统基础"},{"q":"Autolock是如何实现加解锁自动化的？","a":"Autolock是Mutex的嵌套类，利用变量生命周期：构造函数中调用mLock.lock()获取锁，析构函数中调用mLock.unlock()释放锁。若Autolock对象是局部变量（如Mutex::Autolock _l(lock)），生命周期结束时自动解锁。应用示例：AudioTrack的framesAvailable()函数开头声明Mutex::Autolock _l(lock)，函数结束时自动unlock。可有效防止开发人员未配套使用lock/unlock造成问题。","ch":"第4章 操作系统基础"},{"q":"ReaderWriterMutex（读写锁）的特点和三种状态？","a":"ART虚拟机实现的特殊mutex。Exclusive代表Write权限，Shared代表Read权限——允许多个对象共享Read锁，但只能有唯一一个对象拥有Write锁。三种状态：Free（未被任何对象持有）、Exclusive（被唯一对象持有）、Shared（被多个对象持有）。状态转换：Free下ExclusiveLock进入Exclusive、SharedLock进入Shared(1)；Exclusive下ExclusiveUnlock回Free；Shared(n)下SharedLock得Shared(n+1)、SharedUnlock得Shared(n-1)或Free；冲突操作会Block或error。基础仍是普通mutex，根据是否启用Futex实现不同。","ch":"第4章 操作系统基础"},{"q":"虚拟内存的基本思想是什么？","a":"(1)将外存储器的部分空间作为内存扩展（如从硬盘划分4GB）；(2)内存资源不足时，系统按算法自动挑选优先级低的数据块存储到硬盘中；(3)需要用到时产生“缺页”指令，把数据块交换回内存；(4)这些操作由内核自动完成，对上层应用“完全透明”。虚拟内存为大体积程序的运行提供了可能。","ch":"第4章 操作系统基础"},{"q":"逻辑地址的组成和段选择子格式是什么？段寄存器有哪些？","a":"逻辑地址（相对地址）由Segment Selector（段选择子，16bit）和Offset（段内偏移，32bit）组成。段选择子含TI（Table Indicator，0表示GDT、1表示LDT）和RPL（Request Privilege Level）及INDEX字段；GDT/LDT记录段描述符，表地址由GDTR/LDTR寄存器保存。段寄存器：CS（代码段）、DS（全局与静态数据段）、SS（堆栈段）、ES（附加数据段）、FS/GS（通用段寄存器）。","ch":"第4章 操作系统基础"},{"q":"逻辑地址到线性地址的转换过程（分段机制）？","a":"(1)根据段选择子中的TI字段得知段描述符存储在GDT还是LDT；(2)通过GDTR/LDTR获得GDT/LDT的存储地址；(3)根据INDEX字段查找到对应的段描述符；(4)根据段描述符获得此段的基地址；(5)由基地址+段内偏移值得到线性地址。开启段页式管理的机器需两次变换（分段+分页）才得到物理地址。Linux内核理论上是段页式，但实际只实现了分页机制（分段只用到部分功能）。机器开机处于实模式，系统准备好后切换到保护模式。","ch":"第4章 操作系统基础"},{"q":"线性地址到物理地址的转换（分页机制）中，页和页框的概念及缺页处理？","a":"页：分页机制操作的固定大小内存块，一般为4KB；页框：物理内存的最小操作单位，大小与页一致（4KB）。线性地址=页基址+页内偏移量，物理地址=页框基址+页内偏移量。与物理内存没有映射关系的页访问时产生缺页中断，操作系统自动介入：用一定算法将当前不常用的页调出内存，为“缺失页”腾出位置，再从外存储器取回缺失页，最后返回中断点继续。这些对访问者透明，保证上层程序稳定运行。","ch":"第4章 操作系统基础"},{"q":"Linux Kernel内存管理面对的核心问题有哪些？","a":"(1)保证硬件无关性——物理内存型号、大小、架构差异不能体现在应用程序上，向上“透明”；(2)动态分配内存和回收——内存区域划分、分配粒度（最小单位）、已使用/未使用内存的管理与区别、回收再利用；(3)内存碎片——程序申请释放后产生不连续的未使用内存单元；(4)兼顾分配合理性与整体机制高效性（分配回收非常频繁）。Android中内存分配回收分Native层（malloc/free、new/delete）和Java层两个方向。","ch":"第4章 操作系统基础"},{"q":"mmap函数的原型、参数和用途是什么？","a":"mmap（Memory Map）将设备或文件映射到进程内存空间，访问内存即相当于读写设备/文件，也可通过映射同一物理内存实现进程间通信（减少数据复制、提高效率）。原型：void *mmap(void *addr, size_t len, int prot, int flags, int fd, off_t offset)。addr为映射起始地址（空则内核决定）；len为映射大小；prot指定权限（PROT_READ/WRITE/EXEC/SEM/NONE）；flags指定影响（MAP_SHARED修改保存到文件、MAP_PRIVATE局部有效、MAP_FIXED用指定地址、MAP_ANONYMOUS匿名映射不关联文件且fd=-1）；fd为文件描述符（open()返回）；offset为映射起点（一般0）。上层应用使用Binder驱动前必须先mmap。","ch":"第4章 操作系统基础"},{"q":"COW（Copy on Write）技术的基本思想是什么？","a":"多个对象在起始时共享某些资源（如代码段、数据段），直到某个对象需要修改该资源时才拥有自己的一份拷贝。应用：fork()生成子进程时，内核并不马上为其分配物理内存，而是共享父进程的固有资源，使“分家”过程很快（理论上只需注册一个“门户”）；若子进程要修改才分配自己的空间。子进程fork后很快exec（概率很大）载入迥异映像时，COW可避免不必要的资源操作，提升运行速度。","ch":"第4章 操作系统基础"},{"q":"Linux Kernel的OOM Killer核心思想是什么？涉及哪些因素？","a":"核心思想：按照优先级顺序，从低到高逐步杀掉进程，回收内存。进程的oom权重存储在/proc/<PID>/oom_adj，系统据此实时给每个进程评分（存储在/proc/<PID>/oom_score），oom_score越低被杀概率越小/越晚。合理策略至少综合：进程消耗的内存、进程占用的CPU时间、oom_adj（OOM权重）。核心进程优先级高，同时希望尽可能多地释放无用内存。","ch":"第4章 操作系统基础"},{"q":"Android Low Memory Killer（LMK）的实现原理？","a":"LMK是Android开发的专门驱动（drivers/staging/android/lowmemorykiller.c），实现“不同梯级”的Killer（Linux OOM Killer要到资源濒临绝境才生效）。驱动加载时向内核线程kswapd注册shrinker监听回调（register_shrinker(&lowmem_shrinker)），系统空闲页面低于阈值时回调执行。两个数组：lowmem_adj（各内存层级对应清理的adj值，如0,1,6,12）、lowmem_minfree（层级阈值，以页为单位，如3*512即6MB）。可用内存小于某阈值时清理对应adj值以下的进程；adj取值范围-17～15，数字越小进程级别越高。","ch":"第4章 操作系统基础"},{"q":"如何定制LMK的adj和minfree阈值？","a":"通过写文件：/sys/module/lowmemorykiller/parameters/adj 和 /sys/module/lowmemorykiller/parameters/minfree。例如在init.rc中加入：write /sys/module/lowmemorykiller/parameters/adj 0,8 和 write /sys/module/lowmemorykiller/parameters/minfree 1024,4096。ActivityManagerService中的updateOomLevels函数内部也是通过写这两个文件实现，且AMS运行时会根据系统当前配置自动修正adj和minfree以适配不同硬件。","ch":"第4章 操作系统基础"},{"q":"Android进程的ADJ等级划分有哪些？","a":"FOREGROUND_APP_ADJ=0（前台交互进程）、VISIBLE_APP_ADJ=1（有前台可见Activity）、PERCEPTIBLE_APP_ADJ=2（可感知不可见，如后台音乐播放器）、HEAVY_WEIGHT_APP_ADJ=3、BACKUP_APP_ADJ=4、SERVICE_ADJ=5（运行application service）、HOME_APP_ADJ=6（Launcher）、PREVIOUS_APP_ADJ=7（前一次交互进程）、SERVICE_B_ADJ=8（B list Service，黏合度小）、HIDDEN_APP_MIN_ADJ=9到HIDDEN_APP_MAX_ADJ=15（只运行不可见Activity）、PERSISTENT_PROC_ADJ=-12（Persistent进程如telephony）、SYSTEM_ADJ=-16（系统进程）。","ch":"第4章 操作系统基础"},{"q":"如何修改进程的oom_adj值防止被杀？","a":"方法一：写文件/proc/<PID>/oom_adj，如init.rc中“on early-init”阶段 write /proc/1/oom_adj -16（PID 1是init进程，保证不被杀死）。方法二：在应用AndroidManifest.xml的application标签添加android:persistent=true属性使应用常驻内存。注意：设置常驻内存要慎重，若应用本身不完善而系统又不能正常回收，可能导致意想不到的问题。","ch":"第4章 操作系统基础"},{"q":"Ashmem（匿名共享内存）设备是什么类型的设备？何时创建设备节点？","a":"Ashmem是Android特有的内存共享机制，将指定物理内存分别映射到各进程的虚拟地址空间。核心源码：common/mm/ashmem.c和common/include/linux/ashmem.h。它是misc设备（主设备号10），通过misc_register(&ashmem_misc)注册，节点/dev/ashmem。系统启动时init解析init.rc启动ueventd，ueventd解析ueventd.rc和ueventd.<hardware>.rc加载设备节点信息（/dev/ashmem 0666 root root，还有binder等）。","ch":"第4章 操作系统基础"},{"q":"ashmem驱动初始化和关键操作函数做了什么？","a":"ashmem_init通过kmem_cache_create创建ashmem_area_cachep和ashmem_range_cachep两个kmem_cache（进程间匿名共享内存从这里分配），然后misc_register注册。ashmem_open：从ashmem_area_cachep分配ashmem_area（asma），初始化名称、权限（prot_mask=PROT_MASK），记录在file->private_data。ashmem_mmap：检查asma->size（须先ioctl设置），首次访问时用shmem_file_setup在tmpfs中创建临时文件作为backing file，后续进程直接shmem_set_file做映射。ashmem_ioctl：处理ASHMEM_SET_NAME/GET_NAME/SET_SIZE等命令。","ch":"第4章 操作系统基础"},{"q":"多个进程如何通过ashmem共享同一块内存？","a":"关键在于共享同一个tmpfs临时文件（asma->file）。第一个访问的进程在mmap时asma->file为空，ashmem调用shmem_file_setup在tmpfs创建临时文件并记录在asma->file中；第二个进程mmap时asma->file不为空，不再创建新文件而是直接shmem_set_file完成映射。只要共享的进程拥有同一个tmpfs临时文件的fd描述符，即可共享同一内存。ashmem实际是借用并扩展了Linux Kernel的内存共享机制。","ch":"第4章 操作系统基础"},{"q":"MemoryDealer的构成和作用是什么（以AudioFlinger为例）？","a":"MemoryDealer是对ashmem的封装（frameworks/native/libs/binder），AudioFlinger通过它（new MemoryDealer(1024*1024, ...)）与AudioTrack实现跨进程音频数据传递。两个重要成员：mHeap（内存承载体，MemoryHeapBase对象，类比餐厅座位）和mAllocator（内存分配器，类比服务员）。MemoryHeapBase构造时ashmem_create_region打开/dev/ashmem并ioctl设置名称大小，再mapfd用mmap(0,size,PROT_READ|PROT_WRITE,MAP_SHARED,fd,offset)映射。allocate()通过allocator分配offset并返回Allocation（继承MemoryBase/IMemory）。","ch":"第4章 操作系统基础"},{"q":"AudioTrack如何获得AudioFlinger创建的共享内存？","a":"AudioTrack通过track->getCblk()获得IMemory对象（实际是BpMemory，Client端对应BpMemory）。mCblkMemory由AudioFlinger端TrackBase构造时client->heap()->allocate(size)申请。cblk->pointer()调用IMemory::pointer()：先BpMemory::getMemory得到BpMemoryHeap，其assertMapped/assertReallyMapped通过remote()->transact(HEAP_ID)向Server请求，BnMemoryHeap回复writeFileDescriptor(getHeapID())返回ashmem的fd；客户端reply.readFileDescriptor取得fd后dup()，再mmap将共享内存映射到AudioTrack进程空间，返回base+offset的虚拟地址。两进程共享是因为使用了同一个ashmem文件描述符（通过Binder传递）。","ch":"第4章 操作系统基础"},{"q":"什么是JNI？哪些情况下需要用到它？","a":"JNI（Java Native Interface）是允许运行于JVM的Java程序调用本地代码（反之亦然）的编程框架，本地代码通常用C、C++及汇编编写，会破坏Java可移植性。需要JNI的三种情况：(1)应用需要平台相关的feature而Java无法满足；(2)兼容以前其他语言书写的代码库，实现代码复用；(3)应用程序某些关键操作对运行速度要求高，可用底层语言编写再通过JNI提供接口。Android系统中大量使用JNI调用本地层实现库。","ch":"第4章 操作系统基础"},{"q":"创建可供Java调用的本地函数的完整步骤？","a":"(1)Java方法加native声明；(2)javac编译Java类；(3)javah生成.h头文件；(4)本地代码中实现native方法；(5)编译本地方法生成动态链接库；(6)Java类中加载动态链接库（static块中System.loadLibrary(\"testJniLib\")）；(7)Java代码正常调用native方法。用NDK编译时：将jni源码放<project>/jni/，编写Android.mk（LOCAL_MODULE、LOCAL_SRC_FILES，include $(BUILD_SHARED_LIBRARY)），可选Application.mk，执行<ndk>/ndk-build。","ch":"第4章 操作系统基础"},{"q":"JNIEnv和jobject是什么？JNI函数参数有何特点？","a":"本地函数第一个参数JNIEnv代表JNI interface pointer，本质是指向函数列表的指针：typedef const struct JNINativeInterface *JNIEnv，JNINativeInterface包含大量实用函数；采用函数指针（类似C++虚函数）而非硬编码是为了运行时动态决定调用目标，带来灵活性。jobject代表本地方法对应的Java类实例（类似this指针）。函数最后参数才是真正入参，且类型为JNI的typedef类型：jint（signed 32 bits）、jboolean（unsigned 8 bits）、jlong（signed 64 bits）、jstring、jclass、jarray等。","ch":"第4章 操作系统基础"},{"q":"Type Signature是什么？举例说明。","a":"Type Signature是数据类型的标签，用于JNI中描述域和方法。基础类型：boolean→Z、byte→B、char→C、short→S、int→I、long→J、float→F、double→D；类→L fully-qualified-class;；数组→[type；方法→(arg-types)ret-type。例如long aMethod(int n, String s, int[] arr)表示为(ILjava/lang/String;[I)J，括号内是参数、尾部是返回值。可用字符串形式表达，简洁且在JNI中使用广泛。","ch":"第4章 操作系统基础"},{"q":"本地代码如何通过JNIEnv访问Java类的方法和域？","a":"通过名称和Type Signatures访问。域：GetFieldID(env, clazz, name, sig)取得field ID，再用Get<type>Field/Set<type>Field读写（type如Object/Boolean/Byte等）。方法：GetMethodID(env, clazz, name, sig)取得method ID，再用Call<type>Method调用，三种传参方式：Call<type>Method（参数直接放method ID后）、Call<type>MethodA（数组传参）、Call<type>MethodV（va_list传参）。静态方法和域有专门的访问方式。另有GetVersion、FindClass（用“/”分隔的完整包名）及异常处理、引用、字符串、数组、反射等接口。","ch":"第4章 操作系统基础"},{"q":"Java反射机制是什么？Class.forName在Android中如何实现？","a":"反射机制使程序能在运行过程中动态创建对象、检查和修正运行时行为，适用于编译期无法确定Class类型的情况（对比new关键字编译期确定类型、效率最好）。用法：Class.forName(\"android.media.MediaMetadataRetriever\")→clazz.newInstance()→clazz.getMethod(\"setDataSource\", String.class)→method.invoke(instance, filePath)。实现：Class.forName通过native函数classForName调用到本地层（ART中art/runtime/native/java_lang_Class.cc），最终通过Runtime::Current()->GetClassLinker()的ClassLinker::FindClass找到目标类对象，由虚拟机统一管理。","ch":"第4章 操作系统基础"},{"q":"学习Android系统的两条线索是什么？","a":"主线：操作系统的体系结构、硬件组成；辅线：在主线基础上，以Android系统的5层框架为辅，逐一解析各层框架中的重要元素。本书内容编排是立体的——平面（各子系统）+高度（每个元素在5层结构上都有体现），这也是Android系统本身的设计线索。例如“进程管理”在每个层次都有对应体现。","ch":"第4章 操作系统基础"},{"q":"进程和线程的基本概念是什么？多任务如何在单核CPU上实现？","a":"进程（Process）是程序的一个运行实例，区别于'程序'这一静态概念；线程（Thread）是CPU调度的基本单位。单核CPU上的'同时'运行是假象：操作系统采用分时方法，为多个任务分配单独的CPU时间片。例如5个任务、时间片10ms、平均分配时，各任务每隔40ms执行一次，用户感觉上如同并行运行。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Android四大组件（Activity/Service等）与进程是什么关系？","a":"四大组件并不是进程的全部，只是'application'的'零件'。AndroidManifest.xml中Activity等组件都定义在<application>标签内，说明它们只是应用程序的组成部分，不能算完整的进程实例。认为'四大组件就是进程载体'是常见误区。应用程序启动后由系统创建ActivityThread作为主线程。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"通过Debug实验观察，一个Activity程序启动后至少包含哪些线程？","a":"一个最简单的Activity程序至少有3个线程：1个主线程（main thread）和2个Binder线程。主线程由ZygoteInit启动，经一系列调用后执行Activity的onCreate()；Zygote为Activity创建的主线程就是ActivityThread。Service程序也一样：Service寄存于ActivityThread中，启动流程与Activity基本一致，同样需要两个Binder线程。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"如何证明同一个包中的两个Activity运行于同一个进程？","a":"利用共享内存原理：在ActivityThreadTest中定义static变量TestForCoexist（初值-1），onCreate中在startActivity前将其改为2；第二个Activity中读取该static变量，若得到2（而非初始值）则证明二者在同一进程空间（否则修改对其不可见）。同时二者PID和TID相同。结论：默认同一AndroidManifest.xml中的四大组件运行于同一进程、由主线程处理事件。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"如何让不同包的组件运行在同一个进程中？","a":"通过android:process属性，分两种情况：1）针对个别组件：在<activity>、<service>、<receiver>、<provider>标签中加android:process属性，指定该组件运行的进程空间；2）针对整个程序包：在<application>标签中加android:process属性。好处是组件间可方便地共享资源，避免费时费力的进程间通信。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Handler、MessageQueue、Looper、Message/Runnable之间的关系是什么？","a":"一句话概括：Looper不断从MessageQueue中取出Message，然后由Handler来处理。Runnable和Message可被压入MessageQueue形成消息集合；Looper循环地从队列取消息（队列为空则休眠）；Handler是真正'处理事情'的地方。类比CPU：Looper像CPU，MessageQueue像内存，Message像指令，Handler执行指令产生结果。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Thread、Looper、MessageQueue、Handler的数量对应关系如何？","a":"每个Thread只对应一个Looper；每个Looper只对应一个MessageQueue（Looper构造函数中new MessageQueue，Looper创建时消息队列同时创建）；每个MessageQueue中有N个Message；每个Message最多指定一个Handler处理。由此推出Thread与Handler是一对多的关系。Looper通过static final ThreadLocal<Looper> sThreadLocal实现每线程独立。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Handler的两方面作用是什么？消息派发（dispatchMessage）的默认流程是什么？","a":"作用：1）处理Message（dispatchMessage分发、handleMessage处理）；2）将Message压入MessageQueue（Post/Send系列）。默认派发流程：先看Message.callback（Runnable对象）是否为空，不为空优先用callback处理；再看Handler.mCallback是否为空，不为空调用mCallback.handleMessage；前两者都不存在才调用Handler.handleMessage。子类可重载dispatchMessage或handleMessage改变默认行为。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Handler的Post系列和Send系列函数有什么共同点和区别？post(Runnable)内部如何处理？","a":"共同点：都负责将消息压入MessageQueue。区别：Send系列参数直接是Message，Post系列参数是Runnable等，需先转换成Message再调用Send系列。post(r)内部调用sendMessageDelayed(getPostMessage(r), 0)：getPostMessage通过Message.obtain()（系统维护全局Message池，避免资源浪费）获得Message并将Runnable设为其callback；sendMessageDelayed再根据当前时间+延时算出发送时间点调用sendMessageAtTime，最终enqueueMessage入队。这样设计的目的是保证'有序性'。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"MessageQueue提供哪些队列操作？","a":"包括：新建队列（构造函数和本地方法nativeInit，后者在本地创建NativeMessageQueue对象赋给成员变量）；元素入队enqueueMessage(Message msg, long when)；元素出队next()；删除元素removeMessages(Handler h, int what, Object object)和removeMessages(Handler h, Runnable r, Object object)；销毁队列（本地函数nativeDestroy）。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Looper.prepare()做了什么？为什么要用ThreadLocal（sThreadLocal）？","a":"prepare(boolean quitAllowed)检查sThreadLocal.get()是否已有Looper，有则抛出'Only one Looper may be created per thread'异常，否则sThreadLocal.set(new Looper(quitAllowed))。sThreadLocal是static final ThreadLocal<Looper>，是只限于本线程可见的'全局变量'，保证每个线程的Looper独立、外界线程无法访问。prepare保证一个Thread只有一个Looper实例。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Handler构造函数如何与Looper、MessageQueue建立联系？","a":"Handler构造函数中通过mLooper = Looper.myLooper()（内部调用sThreadLocal.get()）获取当前线程的Looper实例，然后mQueue = mLooper.mQueue（mQueue是Looper与Handler之间沟通的桥梁）。之后Handler执行Post/Send系列函数时把消息投递到mLooper.mQueue，Looper处理到该消息时又调用Handler来处理。Handler有多个构造函数：Handler()、Handler(Callback)、Handler(Looper)、Handler(Looper, Callback)。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"ActivityThread.main()的流程是什么？与普通线程的LooperThread有何区别？","a":"main()流程：Looper.prepareMainLooper()→new ActivityThread()→thread.attach(false)（与WindowManagerService建立联系）→设置sMainThreadHandler=thread.getHandler()→AsyncTask.init()→Looper.loop()。与LooperThread的区别：1）主线程用prepareMainLooper而普通线程用prepare；2）主线程Handler是thread.getHandler()返回的内部H对象（mH），普通线程自建Handler。prepareMainLooper内部先prepare(false)（false表示不允许退出），再将myLooper()赋给sMainLooper，其他线程可通过getMainLooper()获取主线程Looper。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Looper.loop()的工作流程是怎样的？","a":"loop()中：final Looper me = myLooper()取出prepare创建的Looper；final MessageQueue queue = me.mQueue；进入for(;;)死循环：queue.next()取消息（可能阻塞，返回null则退出循环结束程序）；msg.target.dispatchMessage(msg)分派消息（target是Handler）；msg.recycle()回收消息。队列空时进入睡眠让出CPU。处理过程中程序可post新事件，其他进程也可通过IPC投递事件（如触摸、按键），这是APK应用能'动起来'的根本原因。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Thread类如何实现和使用？start()的原理是什么？","a":"Thread实现了Runnable接口（唯一方法run()）。两种用法：1）继承Thread重写run，然后new MyThread().start()；2）new Thread(Runnable target).start()。start()是synchronized的，内部调用VMThread.create(this, stackSize)——这才是真正创建CPU线程的地方，真正在新线程中运行的只有run方法。Thread类本质是'中介'，负责启动线程运行用户指定的Runnable。线程状态枚举State：NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"wait/notify/notifyAll的机制是什么？成为object的monitor有哪3种途径？","a":"wait()使调用线程等待直到另一线程调用该object的notify()或notifyAll()。等待请求以waiting list记录在object中；notify唤醒一个等待线程，notifyAll唤醒所有。典型实例：WindowManagerService.main中runWithScissors→BlockingRunnable.postAndWait（post投递Runnable后wait()无限等待，timeout为0）；Runnable执行完run后在finally中mDone=true并notifyAll()唤醒等待者。调用wait前必须成为object的monitor，3种途径：执行该object的synchronized方法；执行基于该object同步的synchronized代码块；object是Class类时执行其synchronized static方法。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"interrupt、join、sleep各有什么作用和特点？","a":"interrupt是'被迫'中断：若线程blocked在wait/join/sleep上则被唤醒、清除中断状态并收到InterruptedException；若blocked在InterruptibleChannel的I/O上则置位中断状态、收到ClosedByInterruptException且channel被关闭；若blocked在Selector中则置位中断状态并立即返回，无异常。join()保证线程顺序执行：t1.join()后只有t1执行完才继续；带时间参数的join防止无限等待。sleep与wait都是'自愿'行为，区别是wait等待某个object，sleep等待时间，时间到自动唤醒。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"SeekBar控制音效实例中，如何用Thread+Handler+Looper解决实时性与系统稳定的矛盾？","a":"要求：UI流畅、实时反映音效变化、系统稳定；但发送音效命令耗时（500ms）且频繁发送会死机。方案：启动独立BusinessThread（run中Looper.prepare()→创建BusinessThreadHandler→Looper.loop()），耗时操作在工作线程执行。关键在BusinessThreadHandler重写sendMessage：先removeMessages(what)清空队列中未处理的旧请求，再super.sendMessage(obtainMessage(...))入队。这样降低了请求频率、保证UI流畅，且最后入队的请求总被处理，用户最终选择的音效值能实时体现。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Android利用CPU多核能力的三种常见并行编程方式是什么？","a":"1）Java线程：继承Thread或实现Runnable，缺点是与主线程通信需通过Message Queue（只有主线程能处理UI事务）；2）AsyncTask：Android专门简化多线程的Helper类，后台操作并发布结果到UI线程而无需操作threads/handlers，适合较短时间的后台操作，长时间任务建议用java.util.concurrent包的Executor、ThreadPoolExecutor、FutureTask；3）IntentService：Service的子类，只需实现onHandleIntent即可简洁地做后台处理。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Android应用程序的两种启动方式和典型启动流程是什么？","a":"两种方式：1）在Launcher中点击应用图标（用户发起）；2）源码内通过startActivity（如Activity1启动Activity2）。流程基本一致，最终都调用AMS的startActivity（AMS内部由一系列startActivity开头的函数处理）。新Activity启动前，原先resumed的Activity会被pause——通过该进程ApplicationThread.schedulePauseActivity完成（ApplicationThread是应用进程提供给AMS的Binder通道）；ActivityThread主线程执行onPause并通知WindowManagerService，再通知AMS完成pause。若目标进程不存在，AMS通过Process.start启动（第一参数'android.app.ActivityThread'即入口类）；ActivityThread初始化后调用attachApplication通知AMS，AMS再通过ApplicationThread.scheduleLaunchActivity请求启动Activity，之后应用自己创建Window、ViewRootImpl、遍历View Tree等。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Android对应用内存有哪些限制？largeHeap是什么？","a":"单进程Heap Size上限由系统属性dalvik.vm.heapsize决定，超过阈值引发OutOfMemory（OOM）——这通常只说明个体'违规'而非设备真无内存。可在AndroidManifest.xml的<application>中设android:largeHeap=true获得更大Heap Size，具体值通过getLargeMemoryClass()取得；只适用于确实需要大内存的程序（如图像处理），切忌OOM时偷懒使用。用dumpsys命令可查看进程内存，Heap分Native（本地代码）和Dalvik（虚拟机堆）两类。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"PSS、Private Dirty RAM、Private Clean RAM分别是什么？","a":"PSS（Proportional Set Size）=进程独占的内存页+按比例分摊的与其他进程共享的内存页，例如2个内存页被2个进程共享则各进程PSS各加1。Private RAM是进程独占的内存，程序销毁后被系统回收，分为：Private Dirty RAM（必须常驻内存的页面）和Private Clean RAM（长时间不用时可被paged out的页面）。另有各种mmap内存（.so、.dex、.oat）指映射这些对象消耗的空间，实际值可能比meminfo中看到的更大。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Dalvik下Logcat中GC日志的格式和常见GC Reason有哪些？","a":"格式：D/dalvikvm: <GC_Reason> <Amount_freed>, <Heap_stats>, <External_memory_stats>, <Pause_time>。GC Reason：GC_CONCURRENT（堆超过阈值时的并行GC）、GC_FOR_MALLOC（堆无法满足分配需暂停程序回收）、GC_HPROF_DUMP_HEAP（处理HPROF请求）、GC_EXPLICIT（主动请求如调用gc()）、GC_EXTERNAL_ALLOC（仅API 10及以下）。Amount_freed为本次释放量；Heap_stats为剩余堆占比；Pause_time为暂停时间，Concurrent类型含开始和临近结束两部分（如'paused 2ms+2ms'）。ART只在主动请求GC或暂停/总时间超上限时才打logcat。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Memory Monitor、Heap Viewer、Allocation Tracker三种内存工具的用途和典型定位流程是什么？","a":"Memory Monitor：Android Studio中启动，跟踪已分配/剩余内存，可手动触发GC，快速定位GC是否导致响应缓慢或宕机与内存不足的关系。Heap Viewer：抓取Heap Status，展示Heap Size、Allocated Size、Free Size及各类型对象占用分析和图形化分布。Allocation Tracker：获取对象分配的时间顺序、线程号、创建时调用堆栈等。典型流程：先用Memory Monitor观察是否经常发生GC（问题是否存在）→再用Heap Viewer甄别可疑对象类型（是什么）→最后用Allocation Tracker定位代码位置（如何产生）。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"MAT（Memory Analyzer Tool）的核心功能和特点是什么？","a":"MAT是Eclipse社区贡献的著名Java内存分析工具（通用Java Heap Analyzer，不限Android），支持HPROF格式；DDMS提供Dump HPROF功能，导出的Android HPROF需用SDK platform-tools下的hprof-conv转换成标准J2SE HPROF。核心功能：Overview页含堆中对象统计和饼状图（排名靠前的大对象）；Histogram View列出所有class及实例数（如Activity通常只应有一个实例，数量异常可能有问题）；Dominator tree中Shallow Heap是对象本身占用的内存，Retained Heap是对象本身及其引用的其他对象（可能无法被GC回收）所占空间之和；还提供Memory Leak Report（饼图+可疑对象逐一分析和Details）。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"init.rc中的HandlerThread/runWithScissors示例体现了什么？","a":"SystemServer中：new HandlerThread('WindowManager')并start()，用wmHandlerThread.getLooper()构造wmHandler，post Runnable设置线程优先级（THREAD_PRIORITY_DISPLAY）等。WindowManagerService.main中wmHandler.runWithScissors(new Runnable(){...创建WMS...}, 0)：runWithScissors是Handler的方法但未在SDK提供；若当前线程Looper与Handler所属Looper相同则直接r.run()；否则包装为BlockingRunnable，postAndWait先post再wait()等待（timeout=0为无限期等待），Runnable执行完run后在finally中mDone=true并notifyAll()唤醒等待线程——体现了wait/notify的跨线程同步协作。","ch":"第5章 Android进程/线程和程序内存优化"},{"q":"Android为什么要创造Binder这种新的IPC机制？Binder的本质目标是什么？","a":"传统IPC（信号量、管道、Socket）不能满足Android需求。Binder是Android使用最广泛的IPC机制，本质目标是让两个跨进程的Client（进程1）与Server（进程2）互访。由于进程间无法直接访问对方内存空间（虚拟地址独立），必须借助Binder驱动作为'路由器'正确投递请求，参与通信的进程需持有Binder颁发的唯一标志（类似IP地址）。Binder是Android系统的'黏合剂'。","ch":"第6章 进程间通信——Binder"},{"q":"Binder架构与TCP/IP网络的对应关系是什么？Service Manager的'IP地址'是什么？","a":"对应关系：Binder驱动→路由器（Router，负责投递数据包）；Service Manager→DNS（管理'域名'与Binder标志的对应关系并提供查询）；Binder Client→客户端；Binder Server→服务器。特别规定：ServiceManager在Binder通信中的唯一标志（句柄/IP地址）永远为0，因此Client可直接通过handle=0访问它，无需查询。","ch":"第6章 进程间通信——Binder"},{"q":"C/C++中常见的指针问题有哪些？智能指针如何解决？","a":"三大问题：①指针没有初始化；②new了对象后没有及时delete（内存泄露，导致偶发性宕机）；③野指针（delete后未置空或多个指针指向同一对象时一方释放导致另一方访问失败）。智能指针的解决方案：创建时置null；通过引用计数（计数器由object自身持有，继承统一父类如LightRefBase）记录'被需要'的个数，计数减为0时自动delete自身，避免野指针。","ch":"第6章 进程间通信——Binder"},{"q":"Android强指针sp的关键实现要点有哪些？","a":"sp是StrongPointer的缩写，位于frameworks/native/include/utils/StrongPointer.h。要点：构造函数将m_ptr置null；重载'='运算符——先对other调用incStrong()增计数，若m_ptr不为空先对旧对象decStrong()，再赋新值；析构时调用decStrong()；重载*和->运算符；提供get()方法。若目标对象继承RefBase，incStrong会同时增加强、弱引用计数。","ch":"第6章 进程间通信——Binder"},{"q":"弱指针wp的作用和实现特点是什么？使用wp有什么强制规定？","a":"wp（WeakPointer）的主要使命是解决循环引用问题（如父对象指向子对象、子对象又指向父对象，导致引用计数均不为0形成类似死锁的恶性循环）。实现特点：①除m_ptr外还有m_refs指针（类型为weakref_type）；②不重载->和*运算符；③有promote()方法将wp升级为sp；④目标对象父类是RefBase而非LightRefBase；构造时调用createWeak()只增加弱引用计数。强制规定：弱指针必须先升级（promote）为强指针才能访问目标对象，否则可能访问已释放对象导致野指针问题。","ch":"第6章 进程间通信——Binder"},{"q":"RefBase::incStrong的执行流程是什么？为什么要减去INITIAL_STRONG_VALUE？","a":"incStrong先调用refs->incWeak()增加弱引用计数，再android_atomic_inc(&refs->mStrong)增加强引用计数。因c取的是增加之前的值，若c==INITIAL_STRONG_VALUE(1<<28)说明是第一次被引用：①回调mBase->onFirstRef()通知对象自己被引用；②执行android_atomic_add(-INITIAL_STRONG_VALUE,&refs->mStrong)把1<<28+1调整为1。注意增加强引用时会同时增加弱引用，所以弱引用值恒大于等于强引用值。","ch":"第6章 进程间通信——Binder"},{"q":"RefBase的decStrong/decWeak中对象释放规则是什么？OBJECT_LIFETIME标志有何作用？","a":"decStrong减少mStrong，若减为0则回调onLastStrongRef，且当(mFlags&OBJECT_LIFETIME_MASK)==OBJECT_LIFETIME_STRONG时delete this，最后还要decWeak()。decWeak中若mWeak减为0：默认（强引用控制）时若mStrong==INITIAL_STRONG_VALUE说明从未被强引用过，直接delete impl->mBase；否则只delete impl（计数器），对象由decStrong释放。OBJECT_LIFETIME_WEAK标志可通过extendObjectLifetime()设置，表示对象生命周期受弱引用控制，弱引用为0也可delete自己。","ch":"第6章 进程间通信——Binder"},{"q":"Parcel是什么？为什么跨进程不能直接传递对象内存地址？","a":"Parcel（'打包'）是进程间数据传递的载体，用于承载希望通过IBinder发送的信息（数据和对象引用）。由于虚拟内存机制，两个进程有独立的内存地址空间，跨进程传递的地址值是无效的。Parcel的思路是：把对象在进程A中占据的内存数据打包，寄送到进程B，由B在自己的空间中按协议'复现'对象——即具备打包和重组能力。类似集装箱：货物无关性、不同货物需不同打包方案、支持远程运输且负责还原。","ch":"第6章 进程间通信——Binder"},{"q":"Parcel的Java层如何创建？与native层的关系是什么？","a":"通过Parcel.obtain()获取对象——系统预先产生了一个大小为6的Parcel池（sOwnedPool），从池中取出可用对象，池空则new Parcel(0)。构造函数调用init(nativePtr)，nativePtr为0时执行mNativePtr=nativeCreate()创建本地层Parcel(C++)对象。Parcel.java只是简单中介，最终所有类型的读写操作都通过frameworks/base/core/jni/android_os_Parcel.cpp中的本地代码实现。","ch":"第6章 进程间通信——Binder"},{"q":"Parcel(C++)中存储数据的关键成员变量有哪些？内存申请原则是什么？","a":"关键变量：mError（错误码）、mData（uint8_t*指针，指向存储的数据）、mDataSize（已存储数据大小）、mDataCapacity（最大存储能力）、mDataPos（数据指针/游标）。初始化只赋初值不分配内存——Parcel遵循'动态扩展'原则，需要时才申请内存避免资源浪费。写入超出存储能力时自动申请所需空间并扩展dataCapacity，每次写入从dataPosition()开始。","ch":"第6章 进程间通信——Binder"},{"q":"Parcel::writeString16的写入步骤是什么？写入方与读取方需遵循什么准则？","a":"步骤：①writeInt32(len)先写入数据长度（4字节）；②writeInplace(len)计算目标地址——PAD_SIZE宏(((s)+3)&~3)按4字节对齐计算空间，容量不足时growData扩展，并做尾部padding（最多3字节填充）；③memcpy复制数据本身；④写入字符串结束符0。核心准则：写入方和读取方所使用的协议必须完全一致（如ServiceManagerProxy写入interface token和name，Service_manager.c的svcmgr_handler用bio_get_uint32/bio_get_string16按相同顺序读取）。","ch":"第6章 进程间通信——Binder"},{"q":"Parcel的Active Objects是什么？包括哪两类？","a":"Active Objects写入Parcel的是它们的特殊标志引用而非对象内容，读取时得到的不是重新创建的对象实例，而是原来被写入的实例（或其代理）。目前主要两类：①Binder对象——通过writeStrongBinder/writeStrongInterface写入、readStrongBinder读取，读取时得到原始Binder对象或其代理实现，是IPC核心；②FileDescriptor——通过writeFileDescriptor/readFileDescriptor传递，因传递后仍基于相同文件流操作，故视为Active Object。","ch":"第6章 进程间通信——Binder"},{"q":"Binder驱动是如何注册的？它是什么类型的设备？提供哪些文件操作接口？","a":"Binder驱动是标准Linux驱动，注册为misc device（杂项设备，主设备号10），提供/dev/binder节点，但不对应真实硬件（基于内存的'伪硬件'）。通过misc_register(&binder_miscdev)注册（misc驱动比字符设备简单，不需alloc_chrdev_region/cdev_init系列操作），minor为MISC_DYNAMIC_MINOR动态分配。file_operations（binder_fops）提供6个接口：open、poll、unlocked_ioctl、mmap、flush、release——没有read/write，因其功能可由ioctl()和mmap()完全代替且更灵活。入口用device_initcall(binder_init)而非module_init。","ch":"第6章 进程间通信——Binder"},{"q":"binder_open做了哪些工作？binder_proc结构体的作用是什么？","a":"binder_open处理打开/dev/binder的操作：①kzalloc分配binder_proc空间；②初始化：get_task_struct记录current进程、INIT_LIST_HEAD(&proc->todo)初始化todo链表、init_waitqueue_head(&proc->wait)初始化wait等待队列、记录default_priority；③加锁后将proc加入全局binder_procs队列头部，设置pid，并将filp->private_data=proc关联起来（之后通过filp就能找到proc）。binder_proc是驱动为每个进程分配的数据结构，记录进程相关的所有信息（内存分配、线程管理等），也是/proc/binder下的管理数据记录体。","ch":"第6章 进程间通信——Binder"},{"q":"Binder使用mmap的目的是什么？如何实现'只需一次复制'的数据传递？","a":"mmap将Binder驱动的内存块直接映射到应用程序内存空间，实现共享物理内存。原理：进程B执行mmap后，应用程序的虚拟地址（经vma描述）与Binder驱动中binder_proc->buffer指向的虚拟地址经页表映射后指向同一块物理内存，两者共享。当进程A向B发送数据时，Binder驱动只需copy_from_user()把A的数据复制到binder_proc->buffer指向的内存，因该内存与B共享，B可直接访问——即仅一次复制就实现了跨进程数据共享（传统IPC需两次复制）。","ch":"第6章 进程间通信——Binder"},{"q":"binder_mmap的处理流程和内存限制是什么？mmap时实际分配了多少物理内存？","a":"流程：①限制申请大小最多4MB（超过则只满足刚好4MB）；②检查禁止标志和重复映射（proc->buffer不为空则报EBUSY）；③get_vm_area()为Binder获取虚拟内存区（此时未分配物理内存）；④proc->buffer指向该区起始地址，计算user_buffer_offset=vma->vm_start-proc->buffer；⑤分配pages数组管理物理页；⑥调用binder_update_page_range(allocate=1)真正申请物理页并建立映射。mmap时实际只分配一页物理内存（无数据传输没必要一次分配4MB），free_async_space为buffer_size/2。binder_proc用buffers链表、free_buffers红黑树（空闲内存）、allocated_buffers红黑树（已分配内存）三条链管理内存。","ch":"第6章 进程间通信——Binder"},{"q":"binder_ioctl支持哪些命令？各自的作用是什么？","a":"五大命令：①BINDER_WRITE_READ——读写操作，承载Binder大部分业务；②BINDER_SET_MAX_THREADS——设置最大线程数，超限时告知Server停止启动新线程；③BINDER_SET_CONTEXT_MGR——ServiceManager专用，将自己设置为'Binder大管家'（系统只能有一个）；④BINDER_THREAD_EXIT——线程退出时通知驱动释放资源，否则内存泄露；⑤BINDER_VERSION——获取版本号。binder_ioctl是Binder接口中工作量最大的函数，承担驱动大部分业务，可完全替代read/write。","ch":"第6章 进程间通信——Binder"},{"q":"BINDER_WRITE_READ命令包含哪些子命令？最关键的是哪两个？","a":"子命令分组：①BC_INCREFS/BC_ACQUIRE/BC_RELEASE/BC_DECREFS——操作引用计数，BC_INCREFS_DONE/BC_ACQUIRE_DONE在其结束时发送；②BC_ATTEMPT_ACQUIRE/BC_ACQUIRE_RESULT——未实现，返回-EINVAL；③BC_FREE_BUFFER——buffer管理；④BC_TRANSACTION/BC_REPLY——最关键的两个，客户与服务器的交互基本靠它们完成；⑤BC_REGISTER_LOOPER/BC_ENTER_LOOPER/BC_EXIT_LOOPER——设置looper状态（共6种可叠加状态，如BINDER_LOOPER_STATE_ENTERED，用|=叠加）；⑥BC_REQUEST_DEATH_NOTIFICATION/BC_CLEAR_DEATH_NOTIFICATION/BC_DEAD_BINDER_DONE——死亡通知相关。","ch":"第6章 进程间通信——Binder"},{"q":"ServiceManager是什么时候、如何启动的？其main函数做了哪几件事？","a":"SM由init程序解析init.rc时启动（service servicemanager /system/bin/servicemanager，critical属性，onrestart会连带重启zygote/media/surfaceflinger/drm）。源码在frameworks/native/cmds/servicemanager（service_manager.c和binder.c）。main函数做三件事：①binder_open(128*1024)——打开/dev/binder并mmap映射128KB只读私有内存，得到binder_state；②binder_become_context_manager()——通过ioctl(bs->fd,BINDER_SET_CONTEXT_MGR,0)将自己注册为Binder大管家（系统唯一，第二个调用会失败）；③binder_loop(bs,svcmgr_handler)——进入主循环等待客户请求。","ch":"第6章 进程间通信——Binder"},{"q":"ServiceManager的binder_loop循环是如何工作的？","a":"binder_loop是SM处理请求的主循环：①进入循环前先向驱动发送BC_ENTER_LOOPER命令告知进入循环状态；②for死循环中填充binder_write_read结构：write_size=0、read_size=sizeof(readbuf)（32个unsigned），即只读不写；③调用ioctl(bs->fd,BINDER_WRITE_READ,&bwr)从驱动读取消息；④调用binder_parse(bs,0,readbuf,bwr.read_consumed,func)解析处理，func即svcmgr_handler；⑤不断循环永不主动退出（除非致命错误）。当无新消息时在驱动的read操作中进入睡眠等待。","ch":"第6章 进程间通信——Binder"},{"q":"ServiceManager的svcmgr_handler提供哪些服务？内部如何组织数据？","a":"svcmgr_handler是SM的核心处理函数。先校验：txn->target必须是svcmgr_handle（0），并检查interface是否为'android.os.IServiceManager'（svcmgr_id）。业务码（enum）：SVC_MGR_GET_SERVICE(1)/SVC_MGR_CHECK_SERVICE——按名称查找Server的handle值（do_find_service）；SVC_MGR_ADD_SERVICE——注册Binder Server（do_add_service）；SVC_MGR_LIST_SERVICES——列出Server。内部维护全局svclist链表保存所有Server注册信息（数据结构为svcinfo），查询和注册都基于此表。处理完成后通过binder_send_reply将结果（BC_REPLY）返回驱动。","ch":"第6章 进程间通信——Binder"},{"q":"SM中binder_io结构体的作用和关键成员是什么？","a":"binder_io是ServiceManager内部用于存储binder object的数据结构（类似Native的Parcel），划分两个区域：data区和offs区，每个区有起始地址和当前地址，共4个指针——data/data0（数据区当前/起始地址）、offs/offs0（offset区当前/起始地址），另有data_avail/offs_avail（剩余空间）和flags。bio_init时offset区在前（4个uint32_t共16字节），data区在后（256字节）。bio_get_string16/bio_get_uint32/bio_put_ref等bio_XX系列函数提供数据存取便利。","ch":"第6章 进程间通信——Binder"},{"q":"Binder object有哪些类型？BINDER_TYPE_BINDER和BINDER_TYPE_HANDLE如何转换？","a":"五种类型（Binder.h）：BINDER_TYPE_BINDER、BINDER_TYPE_WEAK_BINDER（只能用于同进程场景，代表内存地址）；BINDER_TYPE_HANDLE、BINDER_TYPE_WEAK_HANDLE（传递Binder句柄，跨进程无限制）；BINDER_TYPE_FD（文件描述符）。转换由Binder驱动在binder_transaction中完成：addService时object起初是BINDER_TYPE_BINDER，经过驱动后变成BINDER_TYPE_HANDLE并设置handle=ref->desc（驱动中的id号）；而SM通过BC_REPLY返回结果给Client时，若是跨进程则HANDLE重新转换，同进程才可直接用内存地址（BINDER_TYPE_BINDER）。","ch":"第6章 进程间通信——Binder"},{"q":"设计Binder Client时，为什么需要ProcessState和IPCThreadState两个类？各自职责是什么？","a":"每个进程只允许打开一次Binder设备、只做一次mmap，所有线程共享——这个'进程级单实例'管理Binder操作的类就是ProcessState。又因binder_proc中有threads结构管理进程内所有线程的IPC业务，且基于Binder的IPC是阻塞的（避免个别线程通信卡死整个应用），进程内每个线程都应能与Binder驱动自由沟通——这就需要'线程级单实例'的IPCThreadState。分工：ProcessState负责打开/dev/binder节点（open_driver）和mmap（BINDER_VM_SIZE约1M）等准备工作；IPCThreadState负责与Binder驱动进行具体的命令交互（transact、talkWithDriver）。","ch":"第6章 进程间通信——Binder"},{"q":"Java层获取SM服务的完整调用链是什么？ServiceManagerProxy.getService做了什么？","a":"调用链：ServiceManager.getService(name)（静态方法，先查sCache缓存）→getIServiceManager()→ServiceManagerNative.asInterface(BinderInternal.getContextObject())→创建ServiceManagerProxy(mRemote=IBinder)。getService实现三步：①准备数据——Parcel.obtain()两个Parcel（data/reply），data.writeInterfaceToken('android.os.IServiceManager')、data.writeString(name)；②mRemote.transact(GET_SERVICE_TRANSACTION(=1),data,reply,0)——阻塞式调用，线程被挂起直到结果返回；③IBinder binder=reply.readStrongBinder()获取结果，最后recycle两个Parcel。","ch":"第6章 进程间通信——Binder"},{"q":"BpBinder是什么？Java层的BinderProxy与之关系如何？transact如何层层下传？","a":"BpBinder是Native层的Binder代理类（Bp=Binder proxy），继承自IBinder（IBinder: public virtual RefBase），构造时记录mHandle（SM为0）并设置extendObjectLifetime(OBJECT_LIFETIME_WEAK)，调用IPCThreadState::self()->incWeakHandle(handle)（发送BC_INCREFS）。Java层的对应类是BinderProxy（Binder.java中，implements IBinder，transact是native方法）。转化关系：ProcessState::getContextObject→getStrongProxyForHandle(0)创建BpBinder→javaObjectForIBinder()通过JNI NewObject创建BinderProxy并保存BpBinder地址于mObject字段。调用链：transact@ServiceManagerProxy→transact@BinderProxy(JNI)→transact@BpBinder→IPCThreadState::self()->transact(mHandle,code,...)，若返回DEAD_OBJECT则mAlive=0。","ch":"第6章 进程间通信——Binder"},{"q":"IPCThreadState::transact的执行流程是什么？Transaction有哪4种flag？","a":"流程：①data.errorCheck()检查数据有效性；②flags|=TF_ACCEPT_FDS；③writeTransactionData(BC_TRANSACTION,flags,handle,code,data,NULL)——只是按Binder协议格式整理数据存入mOut（mOut.writeInt32(cmd)+mOut.write(&tr,sizeof(tr))，tr为binder_transaction_data），并未发送；④若非TF_ONE_WAY则waitForResponse(reply)（异步则waitForResponse(NULL,NULL)），其内部循环调用talkWithDriver真正与驱动交互。4种flag：TF_ONE_WAY（异步，不需等待回复）、TF_ROOT_OBJECT（内容为根对象）、TF_STATUS_CODE（内容是32-bit状态值）、TF_ACCEPT_FDS=0x10（允许回复中包含文件描述符）。","ch":"第6章 进程间通信——Binder"},{"q":"talkWithDriver如何与Binder驱动通信？bwr读写后如何善后？","a":"talkWithDriver构造binder_write_read结构：write_size/write_buffer填mOut的数据大小和地址，doReceive且needRead时read_size/read_buffer填mIn.dataCapacity()和mIn.data()地址；两者都为0则直接返回。核心一句：ioctl(mProcess->mDriverFD,BINDER_WRITE_READ,&bwr)。善后：write_consumed>0说明驱动消耗了mOut数据——若小于mOut总数据量则remove(0,consumed)移除，否则setDataSize(0)；read_consumed>0说明驱动成功读取数据并写入mIn.data()指向的内存——设置mIn的dataSize和dataPosition(0)。","ch":"第6章 进程间通信——Binder"},{"q":"Binder驱动中binder_transaction处理BC_TRANSACTION的关键步骤有哪些？","a":"①取得target_node：handle为0直接用全局binder_context_mgr_node，否则binder_get_ref(proc,handle)查ref->node；②由target_node->proc得target_proc，遍历thread->transaction_stack找target_thread；③得target_list（todo队列）和target_wait（等待队列）；④kzalloc生成binder_transaction变量t（描述本次transaction）；⑤kzalloc生成binder_work变量tcomplete（表示调用者线程有一个未完成的操作）；⑥填写t：from（发起者）、to_proc/to_thread（目标）、code（请求码）、buffer=binder_alloc_buf()申请mmap管理的内存等；⑦copy_from_user把数据复制到t->buffer（因与目标共享物理内存，一次复制即完成跨进程传递）；⑧t加入target_list，tcomplete加入本线程todo，wake_up_interruptible(target_wait)唤醒目标（如SM）。","ch":"第6章 进程间通信——Binder"},{"q":"SM被唤醒后如何处理getService请求并回复？BC_REPLY时驱动如何找到目标？","a":"SM在驱动的binder_thread_read中睡眠，被唤醒后其todo队列中有BINDER_WORK_TRANSACTION事项，取出binder_transaction t，组装binder_transaction_data（含BR_TRANSACTION命令和共享内存数据地址）copy_to_user返回。用户态SM执行binder_parse→BR_TRANSACTION分支：bio_init初始化reply（binder_io）→func即svcmgr_handler处理（do_find_service查svclist得句柄ptr，bio_put_ref写入reply，类型BINDER_TYPE_HANDLE）→binder_send_reply填BC_REPLY命令和txn数据→binder_write经ioctl发送。驱动处理BC_REPLY时：in_reply_to=thread->transaction_stack找到发起者，target_thread=in_reply_to->from，target_proc=target_thread->proc，将t加入Client线程的todo并唤醒它。","ch":"第6章 进程间通信——Binder"},{"q":"Client收到SM回复后如何得到最终IBinder？readStrongBinder如何处理？","a":"Client被唤醒后binder_thread_read从todo取出BINDER_WORK_TRANSACTION，组装BR_REPLY命令和数据copy_to_user；waitForResponse中读BR_REPLY，调用reply->ipcSetDataReference()把mIn中的数据（data区、dataSize、objects区、objectsCount）填入reply Parcel（mOwner=freeBuffer释放函数）。回到Java层后reply.readStrongBinder()：native实现unflatten_binder——从Parcel读出flat_binder_object，若类型是BINDER_TYPE_HANDLE则调用proc->getStrongProxyForHandle(flat->handle)为新handle生成一个BpBinder（封装成IBinder返回）；同进程BINDER_TYPE_BINDER则直接用flat->cookie。最终ServiceManager.getService的调用者得到IBinder，再经asInterface包装成IServiceManager（ServiceManagerProxy）。","ch":"第6章 进程间通信——Binder"},{"q":"bindService的内部流程有哪几个步骤？涉及哪些进程间通信？","a":"四步：①应用程序填写Intent调用bindService（实际由ContextWrapper.mBase即ContextImpl的bindServiceAsUser实现）；②通过ActivityManagerNative.getDefault()（单例gDefault：先ServiceManager.getService(\"activity\")获得AMS的IBinder，再asInterface转成ActivityManagerProxy）与AMS通信——这是第一次IPC；③AMS按'最优匹配策略'从内部存储的服务组件资料中找到与Intent最匹配的Service，向其发送绑定请求（第二次IPC），目标进程不存在时AMS还负责启动它；④被绑定的服务进程响应绑定并执行，成功后通知AMS，由AMS回调发起请求的应用（回调接口ServiceConnection）。Activity/Service/Broadcast等组件的跨进程能力都由Context（应用'全局而天生的能力'）提供。","ch":"第6章 进程间通信——Binder"},{"q":"构建一个Binder Server需要做哪些核心工作？两种可被Client访问的方式是什么？","a":"核心工作四点：①启动时机（如SM由init.rc在开机时启动）；②提供一致的服务接口——客户端和服务端使用完全一致的接口（如IServiceManager）；③与Binder驱动的交互方式——除open/mmap初始化外，通过不断ioctl循环读写数据（如SM的binder_loop死循环）；④可被外界访问。两种访问方式：①实名Server——在ServiceManager中addService注册（如AMS、WMS），Client通过ServiceManager.getService获取；②匿名Server——不在SM注册，通过其他'实名'Server作中介获取（如IWindowSession靠WMS的openSession获得），好处是安全系数提高。","ch":"第6章 进程间通信——Binder"},{"q":"AIDL生成的Java文件包含哪三个重要部分？各自的面向对象是谁？","a":"*.aidl文件经工具转化为Java接口文件（如IWindowManager.java），包含三个重要类：①IWindowManager——以I开头表示Interface，继承android.os.IInterface，声明服务的接口方法原型；②IWindowManager.Stub——'桩'，作用类似ServiceManagerNative，同时面向服务端和客户端：继承android.os.Binder并实现IXX接口，含asInterface、asBinder、onTransact（根据业务码switch分发）等方法；服务实现类继承Stub（如WindowManagerService extends IWindowManager.Stub）；③IWindowManager.Stub.Proxy——'代理'，面向Binder Client，持有mRemote(IBinder)，实现IXX接口，用于构造Server的本地代理。业务码自动分配：TRANSACTION_openSession=IBinder.FIRST_CALL_TRANSACTION+3。三者保证Client和Server在完全一致的接口上通信。","ch":"第6章 进程间通信——Binder"},{"q":"基于AIDL的系统服务如何与Binder驱动交互？（startThreadPool/joinThreadPool）","a":"在System_init.cpp的system_init()中有两句关键代码：ProcessState::self()->startThreadPool()和IPCThreadState::self()->joinThreadPool()。startThreadPool通过mThreadPoolStarted标志保证只启动一次，spawnPooledThread(true)创建PoolThread（Thread子类）并run，其threadLoop中也调用joinThreadPool(mIsMain=true)。joinThreadPool类似SM的binder_loop：先向驱动写BC_ENTER_LOOPER（非主线程写BC_REGISTER_LOOPER），do-while主循环不断talkWithDriver→读mIn→executeCommand(cmd)，退出时写BC_EXIT_LOOPER。因此SystemServer进程中的所有系统服务共享这一循环，无需单独与驱动交互。","ch":"第6章 进程间通信——Binder"},{"q":"IPCThreadState::executeCommand处理BR_TRANSACTION时如何把请求分发给正确的Binder Server？","a":"BR_TRANSACTION处理：从mIn读取binder_transaction_data tr，用buffer.ipcSetDataReference()填充成Parcel数据，然后分两种情况：①tr.target.ptr不为null（通常情况）——将tr.cookie强制转换成BBinder（sp<BBinder> b((BBinder*)tr.cookie)），调用b->transact(tr.code,buffer,&reply,tr.flags)；②tr.target.ptr为null——使用默认的the_context_object处理。cookie记录的就是目标BBinder对象的内存地址（在addService路过驱动时由驱动记录在binder_node的cookie中），因此即使进程中有多个Binder Server（如SystemServer中的WMS、AMS），请求也能准确投递。","ch":"第6章 进程间通信——Binder"},{"q":"Java层Binder对象与Native层BBinder的关系是什么？（JavaBBinderHolder/JavaBBinder）","a":"AIDL的Stub继承android.os.Binder，Binder构造函数调用native的init()：new一个JavaBBinderHolder对象，增加强引用计数，并通过JNI将其指针保存到Binder的mObject字段。JavaBBinderHolder是BBinder的载体，内部持有JavaBBinder（继承自BBinder）的弱引用，其get()方法在第一次被调用时才new JavaBBinder（懒创建）。addService时writeStrongBinder→ibinderForJavaObject(env,obj)：若obj是Binder类实例则取出mObject中的JavaBBinderHolder并调用get()获得JavaBBinder强指针，再flatten_binder打包（localBinder()非空则type=BINDER_TYPE_BINDER，cookie=local即BBinder地址）。传递链：Java请求→JavaBBinder.onTransact通过JNI调用Binder.execTransact→Java层onTransact→Stub.onTransact分发给具体业务方法。","ch":"第6章 进程间通信——Binder"},{"q":"binder_node和binder_ref结构体的关键字段及两棵红黑树的作用是什么？","a":"binder_node：rb_node/dead_node（红黑树节点或死亡节点链）、proc（所属进程）、ptr（对应fp->binder）、cookie（额外信息，如BBinder内存地址）。凡'路过'驱动的Binder对象，驱动会先binder_get_node在proc->nodes树查找，没有则binder_new_node创建并加入nodes树。binder_ref：proc、node（指向的binder_node）、desc（ref编号，逐渐递增保证唯一性）。含两个红黑树节点：rb_node_desc使ref加入proc->refs_by_desc树，rb_node_node加入refs_by_node树——两种排序方法在不同场合提高检索效率。addService时proc是系统服务进程，target_proc是SM（SM持有指向WMS的binder_node的binder_ref），故getService时SM能准确定位Server。","ch":"第6章 进程间通信——Binder"},{"q":"匿名Binder Server是什么？与实名Server的差异及典型例子？","a":"匿名Binder Server不在ServiceManager中注册，需借助其他'实名'Server作中介被Client访问，好处是安全系数提高（不面向公众开放）。典型例子IWindowSession：客户端通过WindowManagerGlobal.getWindowSession()先经ServiceManager.getService(\"window\")获取实名Server WMS的代理，再调用其openSession接口获得IWindowSession（此时Session对象才真正被创建，构造时传入WMS的this指针以便转发请求）。驱动层面差异：实名Server在addService第一次'路过'驱动时被记录到binder_node并在SM的进程信息中添加binder_ref；匿名Server（IWindowSession）在openSession作为reply结果第一次路过驱动时被记录到系统服务进程的proc->nodes，同时target_proc（ViewRootImpl所在进程）获得指向该binder_node的binder_ref。","ch":"第6章 进程间通信——Binder"},{"q":"binder_transaction_data结构在Binder协议中的作用是什么？Binder基于什么实现同步阻塞通信？","a":"binder_transaction_data是BC_TRANSACTION/BC_REPLY命令携带的标准数据格式（SM用户态对应binder_txn），关键字段：target（handle/ptr）、cookie、code（业务请求码）、flags（如TF_ONE_WAY）、data_size/offsets_size、data.ptr.buffer（数据区）、data.ptr.offsets（Binder Object偏移区）。协议格式为'cmd+binder_transaction_data'。同步阻塞实现：Binder不采用回调机制，而是让调用者进程暂时挂起——驱动中用wait_event_interruptible/wait_event_freezable等宏将线程置为TASK_INTERRUPTIBLE可中断挂起状态并schedule，直到目标进程（如SM）返回结果后被wake_up_interruptible唤醒，使调用者可像进程内函数调用一样编写程序。","ch":"第6章 进程间通信——Binder"},{"q":"Android设备启动经历哪3个阶段？init进程的地位和作用是什么？","a":"3个阶段：Boot Loader→Linux Kernel→Android系统服务。Android系统实际是运行于Linux内核之上的一系列'服务进程'，不算完整意义上的操作系统。init是Android中第一个被启动的进程（PID为0），是所有服务进程的'老祖宗'。它通过解析init.rc脚本构建系统的初始运行形态，其他系统服务大多在rc脚本中描述并被相继启动；init.rc语法简单、纯文本、可读性高。","ch":"第7章 Android启动过程"},{"q":"init.rc脚本由哪4种声明组成？通用语法规则有哪些？","a":"4种类型：Action（动作）、Commands（命令）、Services（服务）、Options（选项）。语法规则：注释以#开头；关键字和参数以空格分隔、每语句一行；反斜杠'\\'可转义、行尾反斜杠表示续行；字符串含空格需用双引号；Actions和Services暗示新语句的开始，其后的commands/options属于该语句；Actions和Services名字唯一，重名将被当错误忽略。统一形式可理解为：on <SOMETHING-HAPPENED> <WHAT-TO-DO>。","ch":"第7章 Android启动过程"},{"q":"init.rc中Action的格式和执行机制是什么？常见触发事件有哪些？","a":"格式：on <trigger> 后跟若干command，即触发事件产生时依次执行多个命令。机制：事件发生后系统对init.rc中各<trigger>进行匹配，符合条件的Action被加入'命令执行队列'尾部（已存在则不重复加入），再按顺序执行命令。常见Trigger：boot（init启动后触发的第一个事件）、<name>=<value>（属性满足特定值时触发）、device-added-<path>/device-removed-<path>（设备节点添加/删除时）、service-exited-<name>（指定服务退出时）。","ch":"第7章 Android启动过程"},{"q":"init.rc中常见Commands有哪些？","a":"exec <path>（fork并执行程序，阻塞直到启动完成）、export（设置全局环境变量）、ifup（连接网络接口）、import（解析另一配置文件）、hostname/domainname（设主机名/域名）、chdir/chmod/chown/chroot（目录、权限、所有者、根目录操作）、mkdir/mount（建目录/挂载设备）、class_start/class_stop <serviceclass>（启动/停止某class的所有服务）、insmod（安装模块）、setprop（设系统属性）、setrlimit（资源限制，cur软限制/max硬限制）、start/stop <service>（启动/停止服务）、symlink（创建链接）、sysclktz（基准时间）、trigger（触发事件）、write（打开文件写入字符串）。","ch":"第7章 Android启动过程"},{"q":"init.rc中Service的格式和常用Options有哪些？","a":"格式：service <name> <pathname> [<argument>]* 后跟option，其中name为服务名，pathname为可执行文件路径，argument为启动参数。Options：critical（关键服务，4分钟内退出超过4次则设备重启进入恢复模式）、disabled（不自动启动，需显式调用启动）、setenv（设环境变量）、socket <name><type><perm>（创建/dev/socket/<name>的unix domain socket并传fd，type包括dgram/stream/seqpacket）、user/group（启动前切换用户/组，默认root）、oneshot（退出后不重启）、class <name>（指定class名，同class服务同时启动/停止，默认'default'）、onrestart（服务重启时执行命令）。","ch":"第7章 Android启动过程"},{"q":"init.rc实例中boot事件做了哪些事？adbd、zygote等服务如何声明？","a":"on boot中：export PATH和LD_LIBRARY_PATH设置环境变量；mkdir创建/dev、/proc、/sys等目录；mount tmpfs/devpts/proc/sysfs等文件系统；write /proc/cpu/alignment 4；ifup lo建立lo网络；hostname/domainname localhost；import /system/etc/init.conf；class_start default启动所有default类服务。服务声明如：service adbd /sbin/adbd（user/group adb，adbd即android debug bridge daemon）；service zygote /system/bin/app_process -Xzygote /system/bin --zygote（socket zygote 666）。akmd服务用disabled选项，等/dev/compass节点添加（on device-added-/dev/compass）时才start。","ch":"第7章 Android启动过程"},{"q":"ServiceManager是什么？它的init.rc声明有何特点？","a":"ServiceManager是Binder机制中的'DNS服务器'，负责域名（Binder服务注册时提供的名称）到IP地址（底层Binder驱动分配的值）的解析。声明：service servicemanager /system/bin/servicemanager，class core，user/group system，critical，onrestart restart healthd/zygote/media/surfaceflinger/drm。特点：class是core（同类有ueventd、console(/system/bin/sh)、adbd，同class进程同时启动或停止）；critical表示4分钟内异常退出超过4次设备将重启进入还原模式；每次重启时其他关键进程（Zygote、media、surfaceflinger等）也被restart。源码在/frameworks/native/cmds/servicemanager。","ch":"第7章 Android启动过程"},{"q":"Zygote是什么？其init.rc启动声明如何体现32/64位区分？","a":"Zygote意为'受精卵'，Android中大多数应用进程和系统进程都由它生成。init.rc中通过import /init.${ro.zygote}.rc按系统属性加载不同脚本，取值有zygote32、zygote64（单架构）及zygote32_64、zygote64_32（Primary/Secondary Arch组合）。如init.zygote64.rc：service zygote /system/bin/app_process64 -Xzygote /system/bin --zygote --start-system-server，class main，socket zygote stream 660 root system，onrestart写/sys/power/state、restart media/netd等。class为main（同类有netd、debuggerd、rild），非core。","ch":"第7章 Android启动过程"},{"q":"app_process程序的作用是什么？main函数如何处理参数？","a":"app_process是'壳'程序（源码/frameworks/base/cmds/app_process，编译出app_process32/64，Android.mk中LOCAL_MULTILIB可选32/64/both/空）。main()创建AppRuntime runtime（Android运行时环境），解析参数：--zygote（承载zygote）、--start-system-server（启动system server）、--application（独立程序模式）、--nice-name（进程别名）。若zygote为真则runtime.start('com.android.internal.os.ZygoteInit', args)，否则有className时start('com.android.internal.os.RuntimeInit')。AndroidRuntime::start内部调用startVm启动Java虚拟机，使ZygoteInit得以运行于VM上。","ch":"第7章 Android启动过程"},{"q":"ZygoteInit.main()主要完成哪几项工作？","a":"1）解析参数：识别start-system-server、abiList（ABI_LIST_ARG，为null则抛异常）、socketName（默认'zygote'）；2）registerZygoteSocket(socketName)注册Socket（完整名ANDROID_SOCKET_zygote），新程序需运行时系统通过它第一时间通知Zygote孵化进程；3）preload()预加载资源：preloadClasses()（加载framework.jar中preloaded-classes记录的数千个常用类，该文件由frameworks/base/tools/preload/WritePreloadedClassFile.java自动生成）、preloadResources()、preloadOpenGL()、preloadSharedLibraries()；4）若带start-system-server则startSystemServer()；5）runSelectLoop(abiList)进入死循环作为守护进程。","ch":"第7章 Android启动过程"},{"q":"startSystemServer如何fork出SystemServer？fork后Zygote自己做什么？","a":"startSystemServer构造硬编码参数数组（--setuid=1000、--setgid=1000、--setgroups=1001,...、--capabilities、--runtime-init、--nice-name=system_server、com.android.server.SystemServer），经ZygoteConnection.Arguments解析、applyDebuggerSystemProperty等处理后调用Zygote.forkSystemServer(...)利用UNIX fork机制创建新进程。pid==0的子进程分支中（若hasSecondZygote则先waitForSecondaryZygote）调用handleSystemServerProcess启动各System Server。父进程没有专门分支，return true回到main后执行runSelectLoop(abiList)——一个while(true)死循环守护体，每循环GC_LOOP_COUNT（10）次才调用一次gc()。","ch":"第7章 Android启动过程"},{"q":"runSelectLoop死循环中，selectReadable返回值如何处理？","a":"循环内将fds（ArrayList<FileDescriptor>）转为fdArray，调用selectReadable(fdArray)判断哪个fd可读，返回index为该fd在队列中的序号。index==0表示 fds中第一个元素（registerZygoteSocket创建的Server Socket）有新连接请求，调用acceptCommandPeer接受连接、创建新ZygoteConnection并加入peers和fds（peers初始化时添加null以保持与fds序列号一致，对应监听的Server Socket）；index>0表示已建立的连接有客户端数据，调用peers.get(index).runOnce()处理，若返回done则从peers/fds中移除该连接。出错（index<0）抛RuntimeException。","ch":"第7章 Android启动过程"},{"q":"ZygoteConnection.runOnce()的两个关键点是什么？forkAndSpecialize分哪几个阶段？","a":"关键点：1）创建承载应用的新进程——不直接用fork而是调用Zygote.forkAndSpecialize（'Specialize'即专门化，孵化同时转为Android应用进程），子进程中由handleChildProc执行应用代码；2）父进程扫尾：将子进程加入进程组、正确关闭文件、向调用方返回结果值。forkAndSpecialize分3阶段：VM_HOOKS.preFork()（ART的ZygoteHooks_nativePreFork，runtime->PreZygoteFork间接调用Heap::PreZygoteFork完成堆空间初始操作）、nativeForkAndSpecialize()（native方法，最终调用ForkAndSpecializeCommon：SetSigChldHandler后真正fork()，pid==0子进程分支CallStaticVoidMethod执行Zygote.callPostForkChildHooks）、VM_HOOKS.postForkCommon()。","ch":"第7章 Android启动过程"},{"q":"handleChildProc的核心任务是什么？className是如何确定为ActivityThread的？","a":"核心任务一句话：找到并执行目标进程的入口函数。处理中parsedArgs.niceName非空则Process.setArgV0设别名；非runtimeInit情况下取parsedArgs.remainingArgs[0]为className，构造ClassLoader（classpath非空用PathClassLoader），调用ZygoteInit.invokeStaticMain(cloader, className, mainArgs)执行main函数。className来源于AMS的startProcessLocked：if (entryPoint == null) entryPoint = 'android.app.ActivityThread'，AMS通过Process.start(entryPoint,...)发起请求，参数被Arguments.parseArgs解析（--setuid=对应uid等，剩余参数为remainingArgs）。注意Zygote的fork不执行exec()（与内核fork+exec不同），因此无法用valgrind检测内存泄露，Android提供Wrapper实现（parsedArgs.invokeWith控制）。","ch":"第7章 Android启动过程"},{"q":"RuntimeInit.zygoteInit的三方面初始化是什么？SystemServer入口如何到达？","a":"handleSystemServerProcess末尾调用RuntimeInit.zygoteInit(targetSdkVersion, argv, classLoader)，包含：1）commonInit——通用初始化：设置默认uncaught exception handler（RuntimeInit的UncaughtHandler）、为HttpURLConnection设置默认HTTP User-Agent、emulator下开启trace模式；2）nativeZygoteInit——本地初始化（重点）；3）applicationInit——程序运行'起点'，从argv解析出startClass和startArgs，startClass即com.android.server.SystemServer，最终调用main@SystemServer：public static void main(String[] args){ new SystemServer().run(); }。","ch":"第7章 Android启动过程"},{"q":"nativeZygoteInit是如何启动Binder线程池的？","a":"nativeZygoteInit执行com_android_internal_os_RuntimeInit_nativeZygoteInit@AndroidRuntime.cpp，内部gCurRuntime->onZygoteInit()。gCurRuntime是AndroidRuntime对象（父类），真正实现在App_main.cpp的AppRuntime（构造AppRuntime时父类构造函数为其赋值）。onZygoteInit中：sp<ProcessState> proc = ProcessState::self(); proc->startThreadPool();——startThreadPool开启Binder线程池，保证其他进程可访问Zygote提供的服务。Zygote通过JNI和回调巧妙关联了本地层和Java层、SystemServer与app_process。","ch":"第7章 Android启动过程"},{"q":"SystemServer.run()做了哪些初始化？Java层服务如何启动？","a":"run()流程：SystemProperties.set('persist.sys.dalvik.vm.lib.2',...)记录VM版本；设置线程优先级THREAD_PRIORITY_FOREGROUND、Process.setCanSelfBackground(false)；Looper.prepareMainLooper()准备主循环；System.loadLibrary('android_servers')加载本地服务库；nativeInit()本地服务初始化；createSystemContext()初始化系统Context；new SystemServiceManager(mSystemContext)并addService到LocalServices；依次调用startBootstrapServices()、startCoreServices()、startOtherServices()；最后Looper.loop()进入死循环直到关机。","ch":"第7章 Android启动过程"},{"q":"SystemServer的nativeInit本地服务还剩什么？Java层System Service分哪3类？","a":"最新Android版本中本地层只留Sensor服务：android_server_SystemServer_nativeInit读取属性system_init.startsensorservice，为'1'时调用SensorService::instantiate()启动传感器服务（光线、陀螺仪、重力感应等）。Java层服务分3类：1）Bootstrap Services——最核心、相互依赖强，对应startBootstrapServices；2）Core Services——优先级略低，如LED和背光管理器、电池电量管理器、Usage Status管理器；3）Other Services——优先级最低但数量最多，如AccountManagerService、VibratorService、MountService、NetworkManagementService、ConnectivityService、WindowManagerService、UsbService、AudioService等。","ch":"第7章 Android启动过程"},{"q":"startBootstrapServices的启动顺序和服务管理方式是什么？","a":"现在所有System Service统一由SystemServiceManager管理（mSystemServiceManager.startService，区别于旧版'各自为政'）。顺序：先启动Installer（优先初始化并创建/data/user等关键目录，是其他服务启动的先决条件）→ActivityManagerService（经ActivityManagerService.Lifecycle.class启动，setSystemServiceManager，initPowerManagement）→PowerManagerService→DisplayManagerService（startBootPhase(PHASE_WAIT_FOR_DEFAULT_DISPLAY)）→检查vold.decrypt加密状态决定mOnlyCore→PackageManagerService.main启动PMS→ServiceManager.addService添加UserManagerService→AttributeCache.init→mActivityManagerService.setSystemProcess()添加meminfo、gfxinfo、dbinfo、cpuinfo等进程相关服务。","ch":"第7章 Android启动过程"},{"q":"Android中Internal Storage和External Storage如何定义？External Storage的物理类型和Android 6.0的Adoptable Storage是什么？","a":"Internal Storage代表/data存储目录（很多文件管理器混淆了此概念）；External Storage是除此以外的所有可存储区域。物理上分为：Emulated Storage（从Internal Storage如Flash中划出一定区域如1GB作外部存储）和SDCARD/USB Devices（卡槽或USB扩展）。Android 6.0前的External Storage又称Traditional Storage，细分为emulated和portable storage（未与系统绑定、可随时移除，不适合存敏感数据）。Android 6.0引入Adoptable Storage：让外部设备像内部设备一样处理，被'adopted'的设备需格式化并加密；插入新外部设备时系统先询问是否变为adoptable。","ch":"第7章 Android启动过程"},{"q":"Vold如何启动和工作？fstab配置的语法是什么？","a":"外部存储由Vold和MountService统一管理。Vold（源码AOSP/system/vold）由init.rc的on post-fs-data中start vold启动；FUSE services不再放init.rc统一加载，改由vold动态决定启动。Vold启动后通过NETLINK与内核联系，根据内核event构建存储设备管理。配置文件从vold.fstab变为/fstab.<ro.hardware>，语法：<src> <mnt_point> <type> <mnt_flags> <fs_mgr_flags>；src为sysfs下设备节点路径，mnt_flags被新版vold忽略，fs_mgr_flags中不含'voldmanaged='的一律被忽略（voldmanaged表示可被vold管理）。典型配置：Emulated primary only、Physical primary only、Emulated primary+physical secondary（primary/secondary）。","ch":"第7章 Android启动过程"},{"q":"Vold启动后如何处理fstab和内核事件？Emulated Storage对应什么路径？","a":"Vold通过process_config处理fstab配置并存入VolumeManager全局变量；收到内核NetlinkEvent(add)时，VolumeManager在handleBlockEvent中判断事件是否与fstab配置匹配，匹配则创建Disk对象加入mDisks。Emulated Storage空间来自data分区（
