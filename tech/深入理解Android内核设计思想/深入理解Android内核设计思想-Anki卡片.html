policy。构造函数5步：Step1 hw_get_module(AUDIO_POLICY_HARDWARE_MODULE_ID)加载Policy库；Step2 audio_policy_dev_open打开Policy设备（Policy被虚拟成设备，增加厂商灵活性）；Step3 create_audio_policy生成Policy（默认legacy实现），创建AudioPolicyManagerDefault；Step4 init_check初始化检查；Step5加载音频效果配置文件（/vendor/etc/audio_effects.conf或/system/etc/audio_effects.conf）。","ch":"第13章 音频系统"},{"q":"audio_policy.conf的作用是什么？路径在哪？","a":"用于描述产品中包含的具体音频设备，为厂商定制提供便利。路径为/vendor/etc/audio_policy.conf或/system/etc/audio_policy.conf，都不存在时使用defaultAudioPolicyConfig默认配置。内容描述：有哪些audio interface（primary/a2dp/usb）及各自属性（sampling_rates、formats、支持的device等），由AudioPolicyManagerBase构造函数解析并存储到HwModule->mOutputProfiles。","ch":"第13章 音频系统"},{"q":"AudioPolicyManagerBase如何通过AudioFlinger加载和打开音频设备？","a":"构造函数中先loadAudioPolicyConfig解析配置文件，然后遍历mHwModules：调用mpClientInterface->loadHwModule加载各Audio Interface；对每个interface的outputProfiles调用mpClientInterface->openOutput打开所有Output。mpClientInterface是AudioPolicyCompatClient，封装了AudioPolicyService提供的aps_ops函数指针（如aps_load_hw_module、aps_open_output），内部通过AudioSystem::get_audio_flinger()获取AudioFlinger代理调用其接口。","ch":"第13章 音频系统"},{"q":"AudioTrack的数据传送方式和数据模式有哪些？","a":"传送方式：push——调用write(byte[],int,int)主动推送数据；pull——数据接收方主动索取。数据模式：static静态模式数据一次性交付，简单高效但只适用于铃声、系统提醒等小数据量场景（仅支持16bit）；streaming流模式数据不断传递，适用于大文件、高采样率/深度、实时产生的音频数据。","ch":"第13章 音频系统"},{"q":"AudioTrack.getMinBufferSize如何计算最小缓冲区？","a":"最小buffer大小取决于采样率、声道数和采样深度。支持声道数为1（MONO）或2（STEREO），采样深度仅8bit/16bit，采样率范围4kHz~48kHz。Native层公式：最小缓冲区大小=frameCount*nbChannels*(PCM16?2:1)，即至少需要的帧数乘以每帧数据量（声道数*每声道字节数）。实际使用建议取比MinBufferSize更大的值（如2倍）。","ch":"第13章 音频系统"},{"q":"AudioTrack::set中各项默认值是什么？有哪些约束？","a":"streamType未指定时默认AUDIO_STREAM_MUSIC；format默认AUDIO_FORMAT_PCM_16_BIT；channelMask默认AUDIO_CHANNEL_OUT_STEREO（立体声）；左右声道初始音量均为1.0f。约束：STATIC模式（sharedBuffer!=0）只支持16bit，8bit数据在共享内存中不支持会报BAD_VALUE。set中还会调用AudioSystem::getOutput找合适输出，并启动AudioTrackThread。","ch":"第13章 音频系统"},{"q":"AudioTrack为什么要经过AudioSystem/AudioService访问底层服务？","a":"降低使用者与底层服务（AudioPolicyService、AudioFlinger）间的耦合。AudioSystem同时提供Java和Native两层接口，AudioService只有Native层实现。不同版本Android音频系统改动大，但只要AudioSystem/AudioService向上接口不变，AudioTrack就无需修改。","ch":"第13章 音频系统"},{"q":"AudioTrack的AudioTrackThread有什么作用？callback_t有哪些事件？","a":"两个核心功能：承担AudioTrack与AudioFlinger间的数据传输（客户端也需工作线程不断传送数据）；报告数据传输状态（通过mCbf回调）。callback_t事件：EVENT_MORE_DATA请求写入更多数据、EVENT_UNDERRUN发生underrun、EVENT_LOOP_END到达loop end、EVENT_MARKER到达指定位置、EVENT_NEW_POS到新位置、EVENT_BUFFER_END到达buffer末尾。","ch":"第13章 音频系统"},{"q":"AudioTrack::createTrack_l与AudioFlinger::createTrack做了什么？","a":"AudioTrack侧：通过AudioSystem::get_audio_flinger()获取AudioFlinger代理（服务名media.audio_flinger），调用createTrack获得IAudioTrack跨进程通道，再通过getCblk()获取共享内存cblk。AudioFlinger侧：checkPlaybackThread_l根据output（audio_io_handle_t，mPlaybackThreads的key）找到匹配的PlaybackThread；thread->createTrack_l创建PlaybackThread::Track对象（由mTracks管理）；最后new TrackHandle(track)（即IAudioTrack的Server实现）返回。","ch":"第13章 音频系统"},{"q":"AudioPolicyManagerBase::getOutput的路由三步骤是什么？","a":"Step1：getStrategy获取stream类型对应的路由策略（如TTS/MUSIC/SYSTEM/Default都对应STRATEGY_MEDIA），再getDeviceForStrategy按优先级匹配最佳设备（STRATEGY_MEDIA优先级：蓝牙A2DP→wired headphone→wired headset→usb accessory→usb device→…→默认设备）；Step2：getOutputsForDevice遍历mOutputs找出所有支持该device的output；Step3：selectOutput选择最合适的output。","ch":"第13章 音频系统"},{"q":"selectOutput如何选择最合适的Output？","a":"output为0个返回0，仅1个直接返回。否则遍历计算maxCommonFlags——用popCount(outputDesc->mProfile->mFlags & flags)计算output的flags与请求flags的相似度（flags包括DIRECT=0x1无混音、PRIMARY=0x2系统唯一必须存在、FAST=0x4、DEEP_BUFFER=0x8）。最终优先级：flags相似度最高的output→primary output→默认返回第一个output。","ch":"第13章 音频系统"},{"q":"MODE_STREAM下音频数据缓冲区是如何分配的？","a":"由AudioFlinger在创建Track时分配。TrackBase构造函数中计算size=sizeof(audio_track_cblk_t)+bufferSize（STREAM模式），通过client->heap()->allocate(size)申请；client由AudioFlinger::createTrack中registerPid_l(pid)生成，每个AudioTrack所在进程有且仅有一个Client实体，Client默认申请1MB内存（够32路Track，每路8个buffer，每个4KB），内部集成MemoryDealer。AudioTrack通过IAudioTrack::getCblk获取该跨进程共享空间。","ch":"第13章 音频系统"},{"q":"audio_track_cblk_t中的user和server指针分别代表什么？framesAvailable如何计算？","a":"user是生产者指针（AudioTrack写入侧），server是消费者指针（AudioFlinger读取侧）。回放（isOut=true）时framesAvailable=limit+frameCount-u（limit通常为s），即剩余可用空间=总空间-已用+已回收。framesReady用于消费者判断是否有可读数据。缓冲区头部audio_track_cblk_t相当于TCP/IP中的<head>，bufferSize是<body>。","ch":"第13章 音频系统"},{"q":"AudioTrack的环形缓冲区是如何通过userBase实现的？","a":"缓冲区逻辑上是环形的但memcpy只能单向前进，故用userBase（每次以frameCount为单位增加）模拟环绕。buffer()计算地址为buffers+(offset-userBase)*frameSize；stepUser中推进user后，若u>=frameCount且u-frameCount>=userBase则userBase+=frameCount，使生产者绕环一圈后从缓冲区开头重新写入。bufferEnd=userBase+mFrameCount，实际可用空间为bufferEnd-u。","ch":"第13章 音频系统"},{"q":"AudioTrack与AudioFlinger如何互斥共享缓冲区？跨进程内存靠什么机制？","a":"互斥：audio_track_cblk_t内置Mutex，obtainBuffer中用AutoMutex和cblk->lock保护，framesAvailable返回0时在while循环等待，超时（bufferTimeoutMs）前会unlock后调用mAudioTrack->start()通知AudioFlinger再重新lock；写完后releaseBuffer调用stepUser更新user（非共享资源无需加锁）。跨进程共享：内存由MemoryDealer管理，其mHeap（MemoryHeapBase）基于Ashmem匿名共享内存机制创建，mAllocator（SimpleBestFitAllocator）负责分配回收策略。","ch":"第13章 音频系统"},{"q":"AudioMixer与Track是否共用同一块数据缓冲区？","a":"是同一个。AudioMixer的track_t中bufferProvider由prepareTracks_l调用mAudioMixer->setBufferProvider(name, track)设置；PlaybackThread::Track本身继承自ExtendedAudioBufferProvider即AudioBufferProvider，process__genericNoResampling中调用t.bufferProvider->getNextBuffer获取数据，其实现基于cblk的server指针计算地址——证明AudioMixer混音用的缓冲区与AudioTrack、AudioFlinger的数据区是同一块。","ch":"第13章 音频系统"},{"q":"音量按键（KEYCODE_VOLUME_UP）的处理流程是什么？","a":"AudioManager.handleKeyDown中根据UP/DOWN调用adjustSuggestedStreamVolume→Binder调用AudioService（服务名audio）的同名方法→getActiveStreamType确定当前活跃Stream类型→adjustStreamVolume。另一路径：PhoneWindowManager.interceptKeyBeforeQueueing对HOME、音量键等预处理，也调用AudioService.adjustStreamVolume。","ch":"第13章 音频系统"},{"q":"AudioService.adjustStreamVolume的处理步骤是什么？","a":"Step1：mStreamVolumeAlias数组为streamType寻找归类（如SYSTEM/RING/DTMF同属STREAM_RING组）；Step2：getDeviceForStream为alias找匹配device；Step3：VolumeStreamState的getIndex(device)获取音量index（mIndex数组按device记录）；Step4：rescaleIndex(10,...)计算步长；Step5：处理Ringer Mode（SILENT/VIBRATE/NORMAL）影响；Step6：ADJUST_RAISE时checkSafeMediaVolume检查安全音量（否则显示警告），streamState.adjustIndex调整后sendMsg投递MSG_SET_DEVICE_VOLUME给AudioHandler，最后sendVolumeUpdate显示音量条和提示音。","ch":"第13章 音频系统"},{"q":"音量调节最终如何生效到硬件？","a":"AudioHandler调用AudioPolicyService::setStreamVolumeIndex→mpAudioPolicy->set_stream_volume_index_for_device→AudioPolicyManagerBase::setStreamVolumeIndex遍历mOutputs找到匹配device，经checkAndSetVolume调用mpClientInterface->setStreamVolume→AudioFlinger::setStreamVolume：根据output找到PlaybackThread，更新mStreamTypes[stream].volume并调用thread->setStreamVolume记录。真正生效在prepareTracks_l中：masterVolume*typeVolume与track自身音量综合运算后通过setParameter传给AudioMixer。","ch":"第13章 音频系统"},{"q":"MediaPlayer的状态机有什么约束？","a":"MediaPlayer本质是状态机，依赖MediaPlayerService完成具体功能。状态包括MEDIA_PLAYER_STATE_ERROR/IDLE/INITIALIZED/PREPARING/PREPARED/STARTED/PAUSED/STOPPED/PLAYBACK_COMPLETE（位标志定义）。所有跨状态操作非法：必须先setDataSource再prepare/prepareAsync后才能start()；任何错误发生都会迁移到Error并回调OnErrorListener.onError()；任何时候调用release()进入End状态。虚线箭头表示状态迁移时的回调（如onPrepared）。","ch":"第13章 音频系统"},{"q":"MediaPlayer::setDataSource的Native层流程是什么？","a":"getMediaPlayerService()通过ServiceManager查找名为media.player的Binder服务得到IMediaPlayerService代理；service->create(getpid(), this, mAudioSessionId)由MediaPlayerService生成内部管理者Client并通过IMediaPlayer建立纽带（类似AudioTrack与AudioFlinger间的IAudioTrack）；player->setDataSource(source)设置播放源；attachNewPlayer关联player并做状态机合法性检查，成功后状态从IDLE跳到INITIALIZED。","ch":"第13章 音频系统"},{"q":"MediaRecorder的典型录制流程和涉及的硬件是什么？","a":"流程：Camera.open()获取Camera→mCamera.unlock()→mMediaRecorder.setCamera(mCamera)建立连接→setAudioSource/setVideoSource设置来源（视频仅CAMERA和DEFAULT，音频有CAMCORDER/MIC/VOICE_CALL/VOICE_UPLINK/DOWNLINK/VOICE_COMMUNICATION/VOICE_RECOGNITION等）→setProfile设置编码器/输出格式/比特率→setOutputFile→setPreviewDisplay→prepare()→start()。涉及硬件：Camera、Microphone、Screen、Storage、Codec。","ch":"第13章 音频系统"},{"q":"MediaRecorder的框架组成和源码结构是什么？","a":"组成：Media Application（需求制定者）→MediaRecorder（组织协调方）→MediaPlayerService（底层多媒体库代表，使StageFright取代OpenCore时上层保持不变）→StageFright（唯一多媒体库实现），还有VideoSource（Camera）、AudioSource（Mic）、Preview（SurfaceView，录制时强制要求有效Surface否则后台无法录制）。源码三部分：MediaRecorder.java、JNI层android_media_MediaRecorder.cpp、本地类MediaRecorder.cpp（持sp<IMediaRecorder>跨进程通信）。","ch":"第13章 音频系统"},{"q":"MediaRecorder的setPreviewDisplay如何传递到MediaPlayerService？","a":"Java层setPreviewDisplay仅保存mSurface成员；类加载时System.loadLibrary(\"media_jni\")并native_init()，JNI通过GetFieldID把fields.surface/mSurface/mNativeContext等域关联起来。应用调用prepare()时，JNI的android_media_MediaRecorder_prepare取出Surface，调用mr->setPreviewSurface(native_surface->getIGraphicBufferProducer())；MediaRecorder.cpp中mMediaRecorder（IMediaRecorder，由MPS的createMediaRecorder生成的MediaRecorderClient）将Surface跨进程传给MediaPlayerService。","ch":"第13章 音频系统"},{"q":"MediaPlayerService::create如何为MediaPlayer创建Client？","a":"create()中用IPCThreadState::getCallingPid/Uid获取调用者信息，new Client(...)（MediaPlayerService的嵌套类，负责回放，MediaRecorderClient负责录制）加入mClients后返回。setDataSource时Client通过getPlayerType按Source类型选择播放器（默认STAGEFRIGHT_PLAYER，可用属性media.stagefright.use-nuplayer强制NU_PLAYER），支持SONIVOX_PLAYER、STAGEFRIGHT_PLAYER、NU_PLAYER、TEST_PLAYER、PV_PLAYER，厂商可扩展，再经createPlayer()创建Player实体。","ch":"第13章 音频系统"},{"q":"Android支持哪些音频编解码器和格式？","a":"AAC LC（编码+解码，3GPP/MPEG-4/ADTS raw AAC）、HE-AACv1/v2（v2仅解码）、AAC ELD、AMR-NB（4.75~12.2kbps，8kHz）、AMR-WB（6.6~23.85kbps，16kHz）、FLAC（仅解码，3.1+）、MP3（仅解码，8~320kbps CBR和VBR）、MIDI（仅解码）、Vorbis（仅解码，Ogg/Matroska，开放无专利问题）、PCM/WAVE（8/16位线性PCM，编码4.1+）。","ch":"第13章 音频系统"},{"q":"什么是ID3？ID3v1和ID3v2有什么区别？","a":"ID3是存储在MP3等音频文件中的元数据（标题、演唱者、专辑等），由Eric Kemp于1996年首创，无国际统一规范。ID3v1：固定128字节，位于文件尾部（兼容旧播放器），以\"TAG\"开头，含Title/Artist/Album各30字节、Year 4字节、Comment 30字节、Genre 1字节。ID3v2（1998）：位于文件头部（便于网络流媒体）、可变长度存储、支持国际化文本编码，以\"ID3\"开头，Tag由一系列frames组成（最多84种，单Frame最大16MB，整个Tag最大256MB），编码默认ISO-8859-1，也可UTF-16/UTF-16BE/UTF-8。","ch":"第13章 音频系统"},{"q":"ID3v2的Header和Frame结构是怎样的？","a":"Header（10字节）：\"ID3\"标识（3字节）+版本号（2字节，主版本+修正版本，都不能是FF）+Flags（1字节，如Unsynchronisation/Extended Header/Experimental）+Size（4字节，每字节最高位置0，有效28bit，最大256MB，不含头部10字节）。Frame：Frame ID（4字符，A~Z0~9，X~Z可个人使用）+Size（4字节）+Flags（2字节：status messages如preserve/discard/readonly，编码说明如compressed/encrypted/group），Flags后第一个字节表示编码方式（0=ISO-8859-1，1=UTF-16）。","ch":"第13章 音频系统"},{"q":"Android多媒体文件管理由哪几部分组成？","a":"MediaScannerService（继承BroadcastReceiver+Service）：扫描内外存储的多媒体文件并提取信息（含ID3）；MediaProvider（继承ContentProvider）：存储扫描结果的\"仓库\"，运行于android.process.media进程（还承载DownloadProvider、DrmProvider），维护internal.db和external.db两个数据库；MediaStore：用户的查询入口（类似商店柜台），分为Files/Audio/Video/Image几类，Content URI格式为content://media/[volumeName]/[media_type]/[sub_type]。","ch":"第13章 音频系统"},{"q":"MediaScanner接收哪些广播？各自扫描什么？","a":"ACTION_BOOT_COMPLETED：开机时同时扫描内部存储（/system/media）和外部存储（mExternalStoragePaths）；ACTION_MEDIA_MOUNTED：媒体设备挂载时扫描外部存储（路径经StorageManager→MountService的getVolumeList，解析storage_list获得，当前仅/mnt/sdcard）；ACTION_MEDIA_UNMOUNTED：媒体卸载；ACTION_MEDIA_SCANNER_SCAN_FILE：应用程序主动请求扫描单个新文件（scanFile）。当前系统未处理多个外部存储设备的情况。","ch":"第13章 音频系统"},{"q":"MediaScannerService收到扫描请求后如何处理？","a":"并不是启动后直接处理请求：它会创建一个新线程，通过SendMessage把请求发给新线程处理（遵循主线程不做费时操作原则）。handleMessage中区分：有filepath参数则scanFile扫描单个文件并回调listener.scanCompleted；有volume参数（internal/external）则确定扫描目录后scan(directories, volume)整体扫描；处理完成后stopSelf退出service。","ch":"第13章 音频系统"},{"q":"MediaProvider的query流程和数据库结构是什么？","a":"维护internal.db和external.db两个数据库（attachVolume中创建，内部存储在onCreate时创建，external还需判断是否可移除存储并从路径提取volumeID命名如external-<id>.db；另有-shm等sqlite临时辅助文件）。query流程：URI_MATCHER.match(uri)匹配table→特例如VERSION返回数据库版本号→getDatabaseForUri选择数据库→getReadableDatabase获取可读实例→SQLiteQueryBuilder按table分支setTables（如\"audio\"、\"audio_genres\"）并appendWhere构造查询→qb.query执行并setNotificationUri。","ch":"第13章 音频系统"},{"q":"RTSP协议是什么？Android还支持哪些网络流媒体？","a":"RTSP（Real Time Streaming Protocol）实时流传输协议，基于TCP/UDP的应用层协议，流程类似电影院对话：Describe获取媒体描述→Setup/Play开始播放→Teardown终止。Android的MediaPlayer还支持HTTP/HTTPS progressive streaming和HTTP Live Streaming（只支持MPEG-2 TS媒体文件；Protocol version 3需Android 4.0+，version 2需Android 3.x，3.1以前不支持HTTPS）。","ch":"第13章 音频系统"},{"q":"Intent是什么？显性Intent和隐性Intent的区别？","a":"Intent即'意图'，承载组件间的调用意愿，可应用于Activity、Service、BroadcastReceiver三种组件（ContentProvider除外），是系统判断在哪些进程间建立Binder关联的考量因素。显性Intent（Explicit）：指定了目标ComponentName（如com.example.project.HelloActivity）及PackageName，系统直接发往该组件，无需匹配，多用于同一公司应用或同进程组件间；隐性Intent（Implicit）：不指定Component，系统按Intent-filter匹配，多目标时可择优或弹框让用户选择。","ch":"第14章 Intent的匹配规则"},{"q":"Intent有哪些属性？各自作用？","a":"1）ComponentName：显性指定目标组件；2）Category：'种类'，大方向归类（如CATEGORY_HOME、CATEGORY_LAUNCHER、CATEGORY_BROWSABLE），可自定义（addCategory(String)）；3）Action：表明要做什么或什么事件发生（广播如ACTION_BATTERY_LOW、ACTION_SCREEN_ON等面向Broadcast）；4）Data：Action的补充材料，格式类似scheme://uri（如ACTION_CALL需电话号码），面向Broadcast的Action通常不需要Data；5）Extras：键值对形式的附加数据（putXXX/getXXX，内部维护Bundle）；6）Flags：与launchMode功能基本相同，规定如何启动Activity（归属哪个Task等）。","ch":"第14章 Intent的匹配规则"},{"q":"Intent匹配流程的三大步骤是什么？","a":"步骤1组件注册：安装应用时扫描AndroidManifest得到<intent-filter>并按组件类型归类（Activity对应startActivity、Service对应startService、BroadcastReceiver对应sendBroadcast）；BroadcastReceiver还可动态注册（registerReceiver+IntentFilter对象）。步骤2发起方填写Intent并调用对应函数发起请求。步骤3系统将Intent与对应组件类型的所有intent-filter匹配寻找最佳结果——这是核心步骤，显性Intent直接按ComponentName启动（无需filter），隐性Intent按Category/Action/Data三项测试匹配。注意系统严格区分组件类别，startActivity绝不可能启动Service。","ch":"第14章 Intent的匹配规则"},{"q":"静态注册和动态注册BroadcastReceiver的区别？","a":"静态注册：事先将intent-filter写入AndroidManifest.xml（如receiver组件监听BOOT_COMPLETED），不在运行过程中执行；动态注册：在程序运行过程中通过new IntentFilter(\"action\")创建IntentFilter对象后调用registerReceiver(receiver, filter)注册，匹配成功时回调onReceive(Context, Intent)。系统对应用进程注册的filter个数没有限制。","ch":"第14章 Intent的匹配规则"},{"q":"Intent匹配的核心原则是什么？哪些属性参与匹配？","a":"影响匹配的只有3个关键因素：Category、Action、Data（URI和数据类型都要同时匹配）；Extras和Flags只在组件被选中运行后才起作用。一个组件可同时声明多个intent-filter，只要任何一个filter通过测试组件即被选中（与资源匹配不同——资源只能有一种标签且只有一个胜出者，Intent匹配可有多个结果）。匹配遵循'子集'原则：Intent中的3个关键因素至少要是组件某一intent-filter的子集（Data稍特殊），才能通过验证。","ch":"第14章 Intent的匹配规则"},{"q":"Category测试的规则是什么？为什么要加DEFAULT category？","a":"规则：Intent中的Category需在filter中找到完全匹配项才能通过；Intent不指定任何Category时理论上可通过，但系统会自动为其添加'android.intent.category.DEFAULT'，因此想接收隐性Intent的filter一般都要添加DEFAULT类型category——否则匹配必失败。例外：filter已带android.intent.action.MAIN和android.intent.category.LAUNCHER时可不用再写DEFAULT。","ch":"第14章 Intent的匹配规则"},{"q":"Action测试的三条规则是什么？","a":"1）如果filter没有任何action，所有intent都无法通过测试；2）如果filter中的action不为空，intent中不带action时可以通过这项属性测试；3）如果filter和intent中的action都为空（均不为空），intent的action必须是filter的子集才能通过。即filter无action则全拒，intent无action则放行，两者都有则要求子集关系。","ch":"第14章 Intent的匹配规则"},{"q":"Data测试中MIME Type的结构和常见约定？","a":"MIME（源自SMTP/RFC 2046电子邮件协议）由主类型type和子类型subtype组成，以'/'分隔，用于指明数据格式。常见类型：application/pdf、application/zip、audio/mpeg、video/mp4、text/html、text/plain、image/jpeg、image/png等。约定：以x-开头的是非标准格式（未向IANA注册，如application/x-latex）；以vnd开头的是厂商自定义（vendor-specific，如application/vnd.ms-excel）；Android也有自定义类型如vnd.android.cursor.dir/vnd.google.note。","ch":"第14章 Intent的匹配规则"},{"q":"URI的格式及各部分关系？","a":"URI（Uniform Resource Identifier）是资源的全球唯一定位标志。格式包含：scheme（如http网络协议、content表示本地ContentProvider数据）、host（主机名）和port（端口，合称Authority）、path（资源在host中的具体位置）。注意各部分不独立：scheme不指定则authority无意义；scheme和authority不指定则path无意义；host不存在时port被忽略。示例：content://com.google.provider.NotePad/notes、content://com.example.project:200/folder/subfolder/etc。","ch":"第14章 Intent的匹配规则"},{"q":"Data测试的4种组合情况分别是什么？","a":"与Category/Action的'Intent属性须是filter子集'不同，Data遵循'只有filter中存在的属性才需匹配'：（1）Intent无类型也无URI：filter也须同样为空才通过；（2）Intent无类型（且无法从URI推断）但有URI：filter须未指定类型且URI符合要求；（3）Intent只有类型无URI：filter须无URI且类型符合；（4）Intent同时有类型（或可从URI推断出）和URI：类型和URI都必须通过测试。特殊情况：filter默认支持content:和file:两种scheme，即使只填写了类型部分。","ch":"第14章 Intent的匹配规则"},{"q":"NotePad例子中Intent2（action=VIEW，data=content://com.google.provider.NotePad/notes）如何匹配？","a":"Category测试：Intent未指定Category，系统自动加DEFAULT，所有带DEFAULT的filter通过。Action测试：只有NotesList-filter-2（含VIEW/EDIT/PICK）和NoteEditor-filter-1（含VIEW/EDIT/EDIT_NOTE）通过。Data测试：表面上属第二种情况（只有URI无类型），但content scheme可推断出type——推断结果为vnd.android.cursor.dir/vnd.google.note，实属第四种情况，最终只有NotesList-filter-2（mimeType=vnd.android.cursor.dir/vnd.google.note）通过。","ch":"第14章 Intent的匹配规则"},{"q":"IntentFilter.match()函数的匹配流程是怎样的？","a":"match(action, type, scheme, data, categories, logTag)依次调用三个测试：1）matchAction(action)：action不为空且filter包含intent的action，否则返回NO_MATCH_ACTION，失败即终止；2）matchData(type, scheme, data)：最复杂的一环，返回值<0则失败（NO_MATCH_DATA/NO_MATCH_TYPE）；3）matchCategories(categories)：与其他测试不同，它是找'不匹配'的项。三轮全部通过后返回dataMatch结果。matchData内部逻辑：filter的type和scheme都为空时要求intent也空；scheme存在则依次匹配scheme→authority（matchDataAuthority）→path；filter无scheme时intent的scheme只允许为null、content或file；再匹配types（findMimeType）。","ch":"第14章 Intent的匹配规则"},{"q":"当Intent只有content URI时如何推断Type？推断流程是什么？","a":"推断在startActivity起始（execStartActivity中）执行：调用intent.resolveTypeIfNeeded(resolver)——若已指定ComponentName则直接返回mType；否则resolveType：已指定mType直接返回；mData为content scheme时调用resolver.getType(mData)。ContentResolver.getType核心两步：（1）根据URI的authority在AMS中找到对应ContentProvider（如com.google.provider.NotePad匹配NotePadProvider）；（2）调用provider.getType(url)解析——若无现成Provider则通过AMS的getProviderMimeType查找。设计上解析由应用自身的Provider完成（getType是ContentProvider的抽象方法），让应用可扩展Type解析能力。","ch":"第14章 Intent的匹配规则"},{"q":"NotePadProvider的getType()如何实现？dir与item类型的区别？","a":"通过sUriMatcher.match(uri)区分模式：uri为content://com.google.provider.NotePad/notes时返回CONTENT_TYPE=\"vnd.android.cursor.dir/vnd.google.note\"（dir表示集合/目录，对应多条记录）；uri为.../notes/ID时返回CONTENT_ITEM_TYPE=\"vnd.android.cursor.item/vnd.google.note\"（item表示单条记录）；不匹配则抛IllegalArgumentException。其中vnd表示用户自定义的MIME类型。","ch":"第14章 Intent的匹配规则"},{"q":"设备资源适配的通用流程包含哪几个环节？","a":"①未知设备：APK发布后无法预知运行设备的软硬件配置；②提取设备参数：总结出与资源匹配相关的设备属性（分辨率、语言、密度等）；③资源池：应用程序提供的全部可选资源；④最佳匹配规则：整个流程的核心与最终仲裁者，从资源池中遴选出当前设备最合适的资源。","ch":"第15章 APK应用程序的资源适配"},{"q":"Android支持哪些主要的资源类型？分别存放在哪些目录？","a":"统一放在res/目录下，目录名固定不可改：Tween动画在res/anim/，Frame动画在res/drawable/，状态颜色资源在res/color/，图形资源在res/drawable/，布局资源在res/layout/，菜单资源在res/menu/，字符串、样式、其他（bool/integer/color/dimension等）在res/values/，原始资源在res/raw/（通过Resources.openRawResource访问；assets/下资源无ID，用AssetManager访问）。","ch":"第15章 APK应用程序的资源适配"},{"q":"状态颜色资源（Color State List）的结构和注意事项是什么？","a":"由<selector>内嵌若干<item>组成，每个<item>描述View状态与颜色的对应关系，格式如android:state_pressed、state_focused、state_selected、state_checked、state_enabled等。颜色以#开头，支持#AARRGGBB、#RRGGBB、#ARGB、#RGB四种格式。关键注意点：系统只会选择第一个符合要求的<item>，而不是最合适的，因此编写时必须把默认值（不含状态的item）放在最后面。","ch":"第15章 APK应用程序的资源适配"},{"q":"Android图形资源（Drawable Resources）有哪些核心类型？","a":"Bitmap（png/jpg/gif位图）、Clip（图形随0~10000等级值变化被裁剪，如进度条）、Inset（插入另一图像中并可设位置）、Level List（按setLevel()/setImageLevel()传入的等级选择图像）、Layer List（层叠显示全部图像，按声明顺序绘制，最后元素在最上层）、Nine-patch（自定义PNG，仅指定拉伸区域被拉伸避免变形）、Scale（尺寸随等级变化）、Shape（rectangle/oval/line/ring等形状）、State List（视图不同状态切换背景图，新增state_hovered和state_activated）、Transition（最多两图互相切换，用startTransition()/reverseTransition()）。","ch":"第15章 APK应用程序的资源适配"},{"q":"字符串资源分为哪三类？如何定义？","a":"①普通字符串：<string name=\"xx\">，可用%1$s、%2$d等format格式配合String.format()使用，也支持简单HTML标记（仅<b>加粗、<i>斜体、<u>下画线三种）；②字符串数组：<string-array>内嵌多个<item>，可通过数组名一次性提取全部元素；③数量字符串（Quantity Strings）：<plurals>内嵌<item quantity=\"zero|one|two|few|many|other\">，通过getQuantityString(int id, int quantity)获取。注意zero/one等体现的是复数语法区分而非数值本身。","ch":"第15章 APK应用程序的资源适配"},{"q":"属性资源attrs.xml中<attr>的format有哪些类型？<declare-styleable>内外定义<attr>有何区别？","a":"format可以是string、dimension、boolean等常用单位，还可以是enum枚举或flag（可按位或运算组合的数值，如gravity中center_vertical=0x10、center_horizontal=0x01，或运算得0x11即center，这是enum不具备的特性）。区别：位于<declare-styleable>内的attr代表某种特定资源的属性；直接位于<resources>下的是共有属性，可被多个styleable引用（如TextView引用外围的gravity且不重新定义）。整个文件中的<attr>不允许重名。所有属性会被ADT工具自动生成到R.java中（android包），生成int[]数组和各属性的数组序号常量。","ch":"第15章 APK应用程序的资源适配"},{"q":"View构造函数中如何获取XML指定的属性？","a":"通过TypedArray a = context.obtainStyledAttributes(attrs, com.android.internal.R.styleable.View, defStyle, 0)，传入attrs.xml生成的View数组；然后遍历a.getIndexCount()，用a.getIndex(i)得到属性在数组中的序号（如View_background=12），通过switch匹配com.android.internal.R.styleable.View_background等常量，再用TypedArray的getDrawable()、getDimensionPixelSize()等方法（内部经AssetManager.STYLE_NUM_ENTRIES定位）从Resources加载资源。自定义属性推荐用declare-styleable，因为它在编译时做错误检查而非运行时crash。","ch":"第15章 APK应用程序的资源适配"},{"q":"同种资源的可选标签有哪些？各自的含义是什么？","a":"按优先级从高到低：MCC/MNC（运营商国家码/网络码，如mcc460-mnc00）；语言和地区（ISO 639-1两位语言码+ISO 3166-1-alpha-2地区码，地区前加r，如en-rUS）；最小宽度sw<N>dp（屏幕宽高中较小者，固定不变）；可用宽度w<N>dp和高度h<N>dp（随横竖屏变化，选最接近且不超过当前值的资源）；屏幕大小small/normal/large/xlarge；宽高比long/notlong；屏幕方向port/land；UI模式car/desk/television/appliance；夜间模式night/notnight；像素密度ldpi(120)/mdpi(160)/hdpi(240)/xhdpi(320)/nodpi/tvdpi(213)；触摸屏notouch/finger；键盘可用性keysexposed/keyshidden/keyssoft；文本输入nokeys/qwerty/12key；定位键navexposed/navhidden；非触摸定位nonav/dpad/trackball/wheel；平台版本v3/v4等。多数可通过Configuration类成员变量获取。","ch":"第15章 APK应用程序的资源适配"},{"q":"最佳资源匹配的两个阶段分别是什么？有什么特例？","a":"第一阶段（资格淘汰）：筛选掉与设备当前配置不相符的资源选项；资源中未显式写出的配置不作为评判标准，显式写出且不符合的直接淘汰。特例：density（密度）标签不在第一阶段淘汰范围内。第二阶段（选最优解）：按标签优先级从高到低逐一考察（MCC/MNC→语言地区→……），每个标签下不含该标签的选项被淘汰，重复直到只剩唯一选项。例如设备Locale=en-GB、port时，最终drawable-en-port胜出。若两轮后全部淘汰，则选择默认（无标签）资源。","ch":"第15章 APK应用程序的资源适配"},{"q":"DIP（设备独立像素）的概念和换算公式是什么？有何局限性？","a":"dip的值会随屏幕密度变化而调整，公式为Px = dp * (dpi / 160)，即160dpi设备上1dp=1px，240dpi设备上为1.5倍。好处：同一dp标注的控件在不同密度屏幕上保持相对尺寸一致，避免UI变形。理论结论：N dp物体在不同屏幕上的实际物理尺寸=N/160 inch，保持不变。局限：不同设备的物理屏幕Size不同，如160dp的View在1inch宽屏幕上占满全宽，在2inch宽屏幕上只占一半，因此只采用dp机制无法解决跨屏幕尺寸（非密度）的适配问题。","ch":"第15章 APK应用程序的资源适配"},{"q":"如何适配多屏幕？系统提供了哪些手段？","a":"①系统按最佳匹配流程自动选择资源，全部淘汰时退回默认资源，开发者应提供默认资源；②为不同屏幕尺寸提供多种layout（如layout-sw600dp）；③为不同屏幕方向（port/land）提供多种layout；④为不同屏幕密度提供相应图片资源，否则会被拉伸导致模糊；⑤在AndroidManifest中用<supports-screens>显式声明支持的屏幕类型（smallScreens/normalScreens/largeScreens/xlargeScreens/anyDensity/requiresSmallestWidthDp等），并控制屏幕兼容模式（compatibleWidthLimitDp为用户可选、largestWidthLimitDp为强制开启）；⑥用<compatible-screens>限制只支持特定屏幕组合（screenSize与screenDensity必须成对出现）；⑦布局时避免AbsoluteLayout（1.5起已废弃）和物理像素单位，用dip表示大小、sp表示字体。","ch":"第15章 APK应用程序的资源适配"},{"q":"横竖屏切换时系统的处理流程是怎样的？如何阻止系统默认行为？","a":"Step1：若系统设置关闭了屏幕旋转，系统不主动检测旋转事件（应用可自行向传感器注册以主动获取，如视频播放器）；若开启，则向Sensor注册监听（实现在WindowOrientationListener.java中）。Step2：系统判断应用设置的android:screenOrientation值，可选unspecified（默认，系统自定）、landscape、portrait、user、sensor、nosensor。Step3：若需响应切换，系统会重新启动Activity的生命周期流程；若要阻止，可设置android:configChanges属性，并重载onConfigurationChanged函数，由其全权接管配置变化处理。","ch":"第15章 APK应用程序的资源适配"},{"q":"ASCII和ANSI编码的关系及区别是什么？","a":"ASCII只需一个字节：128个常规字符（最高位为0，用于英文字母、数字、控制字符）加128个扩展ASCII。扩展部分没有统一国际标准，被各方利用形成ANSI编码。ANSI是各国对ASCII以外字符的扩展，通常占2个字节，如中国GB2312、日本JIS，各地编码互不兼容。由于ASCII占用0x00-0x7F范围，ANSI只能使用该范围以外的数值，且ANSI中的ASCII字符仍只占1字节。例如'我是第1'的ANSI编码是7字节：4个中文字符各占2字节，'1'只占1字节。","ch":"第16章 Android字符编码格式"},{"q":"中文简繁体相关的编码标准有哪些？如何演进？","a":"最初主要有3种：GB2312（1980年国家标准总局发布，又称GB2312-80，收录6763个汉字和682个非汉字，分94区94位，无法处理古汉语罕见字，且与台湾Big5不兼容）、Big5和HKSCS。1995年12月发布GBK，完全兼容GB2312，并包含ISO 10646（UCS）中全部中日韩汉字及Big5所有汉字。2000年和2005年又升级为GB18030系列，还纳入藏、蒙、傣等少数民族字符。国家颁发的这些字符集规范向下兼容。ISO 10646即UCS，兼容于Unicode。","ch":"第16章 Android字符编码格式"},{"q":"ISO/IEC 8859和ISO/IEC 10646（UCS）分别是什么？","a":"8859由ISO和IEC共同推出，共15部分（1~16但12被废弃），利用ASCII以外的编码空间表示以Latin为基础的欧洲语言字符，每个子集范围0xA0-0xFF即96个字母符号，表达能力有限，无法满足中文这类大字符集语言。Unicode出现后8859的15个子集都可在Unicode/UCS中找到对应项。10646是UCS（Universal multiple-octet coded character set），1993年正式颁布，结构为Group-Plane-Row-Cell各8bit，理论范围128*256*256*256，但实际不能超过21bit即0x000000-0x10FFFF（1114111）；第0组第0平面的0x0000-0xFFFD称为BMP（Basic Multilingual Plane，Plane 0）。2003年ISO 10646-1和10646-2合并为统一标准。","ch":"第16章 Android字符编码格式"},{"q":"UTF-8的编码规则是什么？为什么具有Self-Synchronizing特性？","a":"UTF-8是可变长度编码，分4个Zone：Zone1（0x000000-0x00007F）用0xxxxxxx单字节；Zone2（0x000080-0x0007FF）用110xxxxx 10xxxxxx两字节；Zone3（0x000800-0x00FFFF）用1110xxxx 10xxxxxx 10xxxxxx三字节；Zone4（0x010000-0x10FFFF）用11110xxx+3个10xxxxxx四字节。Leading Byte高位由多个1后跟0组成，1的个数等于该字符占用的字节数；后续Continuation Bytes都以10开头。由于各区域开头标志互不重叠、无歧义，解码时能准确判断字符的起始位置和字长，无需额外头信息即可正确解析，这种特性称为Self-Synchronizing（自同步）。RFC3629（2003年11月）将范围限制到0x10FFFF，移除了超过四字节的部分。","ch":"第16章 Android字符编码格式"},{"q":"BOM的作用是什么？各编码格式的文件头标志分别是什么？","a":"BOM（Byte Order Mark，字节序标记）用于解决多字节存储的字节序问题——不同机器可能采用大端（高位在前）或小端（低位在前），无规范约束会导致致命问题。各格式文件开头标志：ANSI无标志；Unicode（UTF-16LE小端）为0xFFFE；Unicode Big Endian（UTF-16BE大端）为0xFEFF；UTF-8为0xEFBBBF（只有UTF-8的标志头超过两个字节）。例如'你'的Unicode码是0x4F60，以Unicode编码保存为0xFFFE604F（含BOM），以UTF-8保存为0xEFBBBFE4BDA0。","ch":"第16章 Android字符编码格式"},{"q":"UTF-16如何解决UCS-2的缺陷？代理（Surrogate）机制是怎样的？","a":"UCS-2固定2字节表示字符，空间不足已被UTF-16取代（Windows中'Unicode'选项实为UTF-16）。UTF-16是变长的：编码范围0x0000-0xFFFF时占2字节；0x10000-0x10FFFF时占4字节。为区分两者，特别预留0xD800-0xDFFF作为代理区域：0xD800-0xDBFF为高代理，0xDC00-0xDFFF为低代理。解析时取高低代理各自的低10位，分别作为数值的高低10位，加上0x10000即得字符（可表示0x10000-0x10FFFF，正好覆盖Unicode范围）。由于代理范围与2字节字符不重复，可判断编码长度。因多字节存储，分为UTF-16LE和UTF-16BE两种字节序。","ch":"第16章 Android字符编码格式"},{"q":"Java/Android中String类的内部存储格式是什么？StringBuffer与StringBuilder有何区别？","a":"String是immutable（不可变）的字符序列，内部用UTF-16格式存储，核心是char数组全局变量private final char[] value。StringBuffer：可修改的字符串变量，所有访问都是synchronized的（线程安全），提供append、delete、insert、reverse等操作及toString()。StringBuilder：接口与StringBuffer几乎一样，但无同步机制，针对单线程设计的直接替代品，执行速度更快。官方解释需要同步的场景不多见，因此StringBuilder有取代StringBuffer的趋势；多线程环境建议使用StringBuffer，应根据项目实际需求选择。","ch":"第16章 Android字符编码格式"},{"q":"String(byte[], offset, byteCount, Charset)构造函数如何处理编码转换？","a":"Android内置Charset包括ISO-8859-1、US-ASCII、UTF-16、UTF-16BE、UTF-16LE、UTF-8。Charset用于Unicode字符与byte字节流间的转换：Decode（基础工作，必须支持）和Encode（部分支持，可用canEncode()查询）。构造函数先做合法性检查，然后按charset.name()分支：UTF-8、ISO-8859-1、US-ASCII三种直接进行专门转换处理；其他编码则调用charset.decode(ByteBuffer.wrap(...))解码到CharBuffer再复制到value数组。UTF-8处理最复杂：主循环中依据Leading Byte判断Zone（如(b0&0xf0)==0xe0为Zone3），utfCount记录Continuation Bytes个数，逐一校验（每个continuation byte须b&0xC0==0x80）并拼接val；非法数据写入REPLACEMENT_CHAR(0xfffd)；val>0x10FFFF丢弃；val>=0x10000时用代理编码：hi=0xd800|(w<<6)|(x>>10)，lo=0xdc00|(x&0x3ff)。最终若s==byteCount直接保存，否则重新申请空间复制。","ch":"第16章 Android字符编码格式"},{"q":"OpenGL与OpenGL ES的关系是什么？OpenGL ES在设计上需要考虑哪几点？","a":"OpenGL由SGI开发、Khronos管理；OpenGL ES（OpenGL for Embedded Systems）是面向嵌入式系统的OpenGL API子集。设计考虑：1）尽量精简实现方式（OpenGL中一个问题的N种解法，ES只允许固定一种）；2）保证兼容性（ES版本间及与OpenGL主版本间）；3）不断改进，随硬件升级完善自身。因其对CPU/内存/功耗要求更低，适合手机等嵌入式设备。","ch":"第17章 Android和OpenGL ES"},{"q":"Khronos组织旗下有哪些工作组？各自的作用是什么？","a":"Khronos是2000年由ATI、Intel、NVIDIA、SGI、SUN等发起的非营利联盟。工作组包括：OpenGL（跨平台计算接口）、OpenGL ES（嵌入式领域，本章主角）、OpenGL SC（安全需求高的ES市场）、EGL（Rendering API与本地窗口平台间的接口层）、OpenKODE（访问文件系统/网络等OS资源接口）、OpenGL VG（2D向量图加速）、OpenML（数字媒体捕获/传输/处理/显示/同步）、WebGL（浏览器中绑定的OpenGL ES的JavaScript脚本）、Vision（图形显示硬件加速）。","ch":"第17章 Android和OpenGL ES"},{"q":"Android支持哪些版本的OpenGL ES？1.X、2.X、3.X管线的主要区别是什么？","a":"Android支持ES 1.0/1.1（Android 1.0起）、2.0（Android 2.2，Level 8起）、3.0（Android 4.3，API 18起）。1.X面向固定功能硬件（fixed function hardware）；2.X面向可编程硬件（programmable hardware），管线模型更精简，加入OpenGL ES Shading Language（针对嵌入式优化），降低硬件成本与能耗；3.X加入着色语言完善、更多缓冲区对象、几何体实例化、统一纹理压缩格式等新特性。","ch":"第17章 Android和OpenGL ES"},{"q":"OpenGL ES支持哪3种基本几何元素？什么是图形管线（Graphics Pipeline）？","a":"3种基本几何元素：点（Point）、线段（Line）、三角形（Triangle）。图形管线（Rendering Pipeline）指图形硬件（GPU）支持的渲染流程：以3D数据（如游戏场景描述）为输入，最终输出2D光栅图形的流水线处理过程。因为绝大多数用户在2D终端屏上观看3D效果，所以必然存在3D→2D的转化过程。OpenGL和Direct3D各有自己定义的管线。","ch":"第17章 Android和OpenGL ES"},{"q":"OpenGL、EGL、Mesa 3D在Android中各扮演什么角色？代码分布在哪些路径？","a":"OpenGL本身只是协议规范而非源码库；EGL（Khronos Native Platform Graphics Interface）是本地窗口系统与Rendering API间的接口层，负责图形环境管理、surface/buffer绑定、渲染同步；Mesa 3D是兼容OpenGL协议的开源3D图形处理软件库（MIT License），好比遵循协议的'打印机厂商'。代码路径：frameworks/base/opengl（Java层SDK）、frameworks/base/core/jni（JNI）、frameworks/native/opengl（C++实现）、external/mesa3d（Mesa引擎库）。","ch":"第17章 Android和OpenGL ES"},{"q":"系统如何根据egl.cfg选择图形渲染方式？加载流程是什么？","a":"渲染方式（硬件/软件）在系统启动后动态确定。egl.cfg保存在/system/lib/egl/egl.cfg，格式为'<DisplayNumber> <HW/SW> <Lib_Name>'，如'0 1 mali'（显示屏编号必须为0，1=硬件库/0=软件库）。文件不存在则加载软件库libagl；存在则加载libhgl硬件库。库须放在/system/lib/egl或/vendor/lib/egl/，命名格式libEGL_<Lib_Name>.so、libGLESv1_CM_<Lib_Name>.so、libGLESv2_<Lib_Name>.so等，可配多个库且优先级随行序递减。调用流程：egl_init_drivers→egl_init_drivers_locked（Egl.cpp）→Loader::Loader（解析egl.cfg）→open→load_driver。","ch":"第17章 Android和OpenGL ES"},{"q":"EGL提供哪些主要功能？eglGetDisplay和eglInitialize的作用是什么？","a":"EGL功能：创建rendering surfaces（承载图形的'画纸'）、创建图形环境graphics context（OpenGL是状态机，context负责同步应用程序与本地渲染API、提供显示设备访问、渲染配置管理），保证OpenGL ES的平台独立性。eglGetDisplay(EGL_DEFAULT_DISPLAY)取得与平台无关的EGLDisplay对象（实为void*），任何EGL应用首先调用它，需检查返回值非EGL_NO_DISPLAY；eglInitialize对EGL内部数据初始化并返回版本号（major/minor），失败原因有EGL_BAD_DISPLAY、EGL_NOT_INITIALIZED。eglGetError用于获取具体错误码（多数EGL函数只返回EGL_TRUE/FALSE）。","ch":"第17章 Android和OpenGL ES"},{"q":"eglGetConfigs、eglGetConfigAttrib、eglChooseConfig各自的作用是什么？","a":"三者用于获取最佳Surface配置：eglGetConfigs——configs为NULL时返回系统中所有Surface配置的数量（numConfigs），否则按maxReturnConfigs填充configs；eglGetConfigAttrib——查看EGLConfig的具体属性项，如EGL_BUFFER_SIZE（颜色位数）、EGL_RED_SIZE/GREEN_SIZE/BLUE_SIZE（各颜色位数）、EGL_LUMINANCE_SIZE（亮度位数）等；eglChooseConfig——开发者提供需求清单（attrib_list），由EGL自动选择并返回最佳匹配的配置，类似按需求配置组装电脑。","ch":"第17章 Android和OpenGL ES"},{"q":"eglCreateWindowSurface与eglCreatePbufferSurface有什么区别？eglCreateContext和eglMakeCurrent的作用？","a":"eglCreateWindowSurface创建可用于终端屏幕显示的Surface，错误码包括EGL_BAD_MATCH（本地窗口与EGLConfig不符）、EGL_BAD_CONFIG、EGL_BAD_NATIVE_WINDOW（窗口句柄无效）、EGL_BAD_ALLOC；eglCreatePbufferSurface创建'离屏'（off-screen）渲染区，渲染方法相同但结果不通过swap buffer输出到屏幕。eglCreateContext创建Context（OpenGL状态机的运行环境，错误：EGL_NO_CONTEXT、EGL_BAD_CONFIG）；eglMakeCurrent(dpy, draw, read, ctx)在进程多个Context中选择当前处理对象，两个Surface参数'两个都是'当前Surface，通常设为同一个。","ch":"第17章 Android和OpenGL ES"},{"q":"SurfaceFlinger在readyToRun中搭建OpenGL ES环境的7个步骤是什么？","a":"源码在frameworks/native/services/surfaceflinger/SurfaceFlinger.cpp：Step1 eglGetDisplay(EGL_DEFAULT_DISPLAY)获取默认Display；Step2 eglInitialize初始化；Step3 selectEGLConfig取得最佳config；Step4 createGLContext创建EGL Context；Step5 eglGetConfigAttrib获取EGL_NATIVE_VISUAL_ID属性值；Step6 生成DisplayDevice（其构造函数中调用eglCreateWindowSurface）；Step7 DisplayDevice::makeCurrent设置当前Context环境。类似例子还有BootAnimation、GLSurfaceView。","ch":"第17章 Android和OpenGL ES"},{"q":"Java层使用OpenGL ES有哪两种方式？GLSurfaceView的主要特性是什么？","a":"方式一：直接使用SDK的Java类——EGL类（EGL10、EGL11、EGL14、EGL）和GLES类（GLES10、GLES11、GLES20、GLES30），通过JNI间接调用C/C++实现；方式二：GLSurfaceView（更简便）。GLSurfaceView继承自SurfaceView，特性：1）管理EGLDisplay（表示显示屏）；2）管理Surface（本质是一块内存区域）；3）创建新线程渲染，不阻塞UI主线程；4）可通过setRenderer()自定义渲染方式。它兼具View的事件接收能力和OpenGL ES的3D图形处理能力。","ch":"第17章 Android和OpenGL ES"},{"q":"使用GLSurfaceView开发的基本步骤有哪些？","a":"Step1 创建GLSurfaceView（可通过布局文件加入View树）；Step2 初始化OpenGL ES环境（默认已搭建好，可通过setEGLConfigChooser(boolean)、setGLWrapper、getHolder().setFormat(PixelFormat.TRANSLUCENT)、setDebugFlags(int)修改）；Step3 setRenderer()设置Renderer；Step4 setRenderMode设置渲染模式（默认连续渲染）；Step5 状态处理——Activity暂停时调用onPause()、恢复时调用onResume()，保证OpenGL ES内部线程正确判断状态。开发者主要工作就是实现Renderer。","ch":"第17章 Android和OpenGL ES"},{"q":"SurfaceHolder.Callback的3个方法与GLSurfaceView.Renderer的3个回调有什么区别？","a":"SurfaceHolder.Callback：surfaceCreated（成功申请到Surface时调用，一般只一次）、surfaceChanged（format/size变更时）、surfaceDestroyed（Surface销毁时）——这是Surface状态变化的回调。GLSurfaceView.Renderer：onSurfaceCreated(GL10, EGLConfig)、onSurfaceChanged(GL10, width, height)、onDrawFrame(GL10)——这是GLSurfaceView与APK应用程序间的回调。注意两者不要混淆；Surface销毁事件应用不需关心，故Renderer没有对应接口。GLSurfaceView在init()中通过getHolder().addCallback(this)注册自身。","ch":"第17章 Android和OpenGL ES"},{"q":"SurfaceView中的Surface与ViewRoot的Surface是同一个吗？SurfaceView如何申请自己的Surface？","a":"不是同一个，SurfaceView的Surface是另外分配的（名称由来）。申请流程：1）ViewRoot成功AttachToWindow后通过performTraversals告知View树所有成员（ViewGroup需重载dispatchAttachedToWindow传播消息）；2）SurfaceView收到消息后通过getWindowSession()向ViewRoot获取IWindowSession（ViewRoot与WMS的通信中介，直接复用）；3）updateWindow()时利用IWindowSession.relayout()重新申请Surface，WMS生成新Surface；4）SurfaceView将其Transfer到mSurface变量，并通知所有注册callback的对象（如GLSurfaceView）。","ch":"第17章 Android和OpenGL ES"},{"q":"GLThread的guardedRun()核心逻辑是什么？readyToDraw需满足哪些条件？","a":"guardedRun为内、外两层while循环：内循环中若EventQueue（mEventQueue）有事件则跳出内循环；否则根据状态判断是否释放EGL Surface（Activity暂停）、是否丢失Surface（mHasSurface/mWaitingForSurface）、是否需放弃EGL Context（mShouldReleaseEglContext）；若readyToDraw则跳出内循环执行渲染。外循环处理事件（event.run()）或渲染：必要时重建EglSurface/GL Object/EGL Context、尺寸变化时回调onSurfaceChanged，然后调用mRenderer.onDrawFrame(gl)渲染，最后EglHelper.swap()（eglSwapBuffers）显示到屏幕。不满足条件则sGLThreadManager.wait()等待唤醒。readyToDraw条件：不处于暂停状态、已获得Surface、有合适尺寸（长宽非0）、持续自动渲染模式或用户主动发起渲染请求。","ch":"第17章 Android和OpenGL ES"},{"q":"GLSurfaceView中使用EGL的完整步骤（EglHelper封装）是什么？","a":"EglHelper封装的步骤：1）EGLContext.getEGL()获取EGL实例；2）eglGetDisplay(EGL10.EGL_DEFAULT_DISPLAY)获取Display；3）eglInitialize(display, int[] major_minor)初始化并返回版本号；4）eglChooseConfig(display, attrib_list, configs, config_size, num_config)选取EGLConfig；5）eglCreateContext创建EGL Context；6）eglCreateWindowSurface创建EGL Surface；7）eglSwapBuffers(display, surface)通过swap将渲染内容显示到屏幕。EglHelper.start()中依次执行这些步骤（chooseConfig由mEGLConfigChooser、createContext由mEGLContextFactory完成）。","ch":"第17章 Android和OpenGL ES"},{"q":"GLTracer是什么？使用它有哪些条件和限制？","a":"GLTracer是Android提供的OpenGL分析工具，可捕捉OpenGL ES接口调用信息及每一帧图像，要求Android 4.1（API 16）以上，可从Android Device Monitor或IDE启动。限制：1）设备需USB连接且开启调试模式；2）被测应用必须是debuggable的（AndroidManifest.xml中android:debuggable=\"true\"），否则AMS的setOpenGlTraceApp抛出SecurityException（除非系统属性ro.debuggable为1）。使用流程：连接设备→打开Tracer for OpenGL ES窗口→选择设备、填Application Package和Activity to launch、选保存路径→单击Trace开始捕获。","ch":"第17章 Android和OpenGL ES"},{"q":"GLTracer的内部实现原理（Hook机制）是什么？","a":"PC端CollectTraceAction：1）Port Forwarding——将Unix Domain Socket名为'gltrace'的服务转发到6039端口（createForward@IDevice），实现PC与设备的TCP/IP通信；2）GLTraceOptionsDialog收集配置；3）startActivity通过/system/bin/am启动目标程序，命令'am start --opengl-trace ...'，携带ActivityManager.START_FLAG_OPENGL_TRACES标志；4）startTracing接收数据。设备端：AMS在resolveActivity检测到该标志后setOpenGlTraceApp记录目标程序；目标进程attach后bindApplication→handleBindApplication中调用GLUtils.setTracingLevel(1)→setGLDebugLevel→setEGLDebugLevel；eglSwapBuffers执行时检测Debug Level>0则GLTrace_start()启动监听Server（acceptClientConnection，属性debug.egl.debug_portname默认gltrace），并将egl/gl调用切换为GLTrace_egl/GLTrace带调试信息的Hook版本（在原实现头尾添加context id、函数名、开始时间等信息，不改变原运行属性），通过TCPStream与PC端通信，commandReceiveTask监听用户动态更改采集选项。","ch":"第17章 Android和OpenGL ES"},{"q":"System Bars分为哪三种？各有什么特点？","a":"①Status Bar（状态栏）：位于手机屏幕上方一直存在，大致分左右两部分——左边显示通知信息（从左到右扩展图标），右边显示全局设备状态如时间、电量、信号（从右到左扩展），向下拉可显示通知栏；②Navigation Bar：Android 4.0后加入，为无物理按键设备提供便利，提供Home、Back、Recents和Menu（长按Recents出现Menu）以满足旧版本应用需求；③Combined Bar：专为Tablet设计，因平板横屏时高度不够不适合同时显示两条Bar，而宽度较大，可利用宽度同时容纳导航和状态栏功能。","ch":"第18章 SystemUI"},{"q":"SystemUI包含哪些组成元素？","a":"①System Bars：Status Bar（状态栏）、Navigation Bar（导航栏，Android 4.0后加入）、Combined Bar（平板专用）；②Notifications（通知栏）：后期版本新特性包括通知信息格式可定制（不再强制两行）、支持手势操作（左右滑动条目删除）、支持更多常用功能（如截图完成后点击条目分享）；③其他系统功能：最近运行的应用程序、ScreenShot截屏（TakeScreenshotService运行在:screenshot独立进程）、壁纸（WallpaperService）等。SystemUI本身是一个标准APK应用程序，以应用形式统一管理系统UI界面。","ch":"第18章 SystemUI"},{"q":"SystemUIService是如何被启动的？onCreate做了什么？","a":"SystemUI代码分两部分：Service部分在frameworks/base/services/java/com/android/server，应用部分在frameworks/base/packages/SystemUI。SystemUIService由SystemServer启动：SystemServer在系统就绪时通知ActivityManagerService（systemReady），由startServiceAsUser启动SystemUIService。其onCreate中：通过WindowManagerGlobal.getWindowManagerService()获取WMS，调用hasSystemNavBar()决定SERVICES[0]用config_systemBarComponent还是config_statusBarComponent；然后遍历SERVICES数组（含PowerUI、RingtonePlayer、SettingsUI等），用chooseClass取得class并newInstance实例化，设置mContext后逐一调用start()。每个系统UI元素都必须继承SystemUI抽象类并重载start方法，便于灵活扩展或删除。","ch":"第18章 SystemUI"},{"q":"hasSystemNavBar如何判定设备类型？PhoneWindowManager的判决逻辑是什么？","a":"SystemUIService调用WMS的hasSystemNavBar()，其转调mPolicy.hasSystemNavBar()（Policy定义UI行为规范，如是否有Navigation Bar、WindowLayer排布等）。PhoneWindowManager中计算shortSizeDp = shortSize*DENSITY_DEFAULT/density（如800*480、ldpi时shortSizeDp=640），判决分3档：0-599dp为phone，带单独的StatusBar和NavigationBar（mHasSystemNavBar=false，mNavigationBarCanMove=true）；600-719dp为phone，可修正UI适应大屏幕（mNavigationBarCanMove=false）；720dp以上为tablet，带Combined Status&Navigation Bar。该场景中mHasSystemNavBar为false，SERVICES[0]对应PhoneStatusBar。","ch":"第18章 SystemUI"},{"q":"BaseStatusBar.start()做了什么？为什么需要StatusBarManagerService？","a":"BaseStatusBar.start()中：通过IStatusBarService.Stub.asInterface(ServiceManager.getService(STATUS_BAR_SERVICE))获取StatusBarManagerService代理；创建StatusBarIconList、notificationKeys、notifications、CommandQueue、switches等对象后调用mBarService.registerStatusBar(mCommandQueue, iconList, ...)向StatusBarService注册（跨进程，参数均继承自Parcelable）；最后调用createAndAddWindows()（抽象方法，由PhoneStatusBar实现）真正显示状态栏。StatusBarManagerService并非多余：它由SystemServer创建（new StatusBarManagerService(context, wm)）并addService注册；registerStatusBar一是为新启动的StatusBar赋予当前系统真实值（图标、通知列表，方向是从StatusBarManager到BaseStatusBar），二是通过mBar记录IStatusBar对象（即SystemUI侧的CommandQueue），供后续事件回调。","ch":"第18章 SystemUI"},{"q":"PhoneStatusBar.makeStatusBarView()的工作流程是什么？","a":"①通过View.inflate(context, R.layout.super_status_bar, null)得到mStatusBarWindow（StatusBarWindowView，本质是FrameLayout），设置mService和触摸监听（支持下拉手势，调用animateCollapsePanels()实现动画展开）；②findViewById得到mStatusBarView（PhoneStatusBarView，对应status_bar布局）和mNotificationPanel（NotificationPanelView，通知栏，下拉后才出现）；③根据mWindowManagerService.hasNavigationBar()决定是否inflate navigation_bar布局；④初始化status_bar中众多元素（按键、背景等）；⑤动态注册广播（ACTION_CONFIGURATION_CHANGED、ACTION_CLOSE_SYSTEM_DIALOGS等）；⑥返回mStatusBarView。之后在addStatusBarWindow()中通过WindowManager.addView(mStatusBarWindow, lp)将mStatusBarWindow（注意不是mStatusBarView）加入窗口系统，lp类型为TYPE_STATUS_BAR，高度默认25dip（R.dimen.status_bar_height），gravity为TOP|FILL_HORIZONTAL，带硬件加速flag。","ch":"第18章 SystemUI"},{"q":"status_bar.xml布局中的icons部分由哪些元素组成？","a":"icons是一个水平方向的LinearLayout容器，包含4种icon：①notification_icon_area（通知图标区，layout_weight=1可获更多剩余空间，初始宽度0）内含moreIcon（通知满时的指示，默认gone）和IconMerger（notificationIcons，扩展的LinearLayout，加入额外管理如计算通知空间是否已满以控制moreIcon显示）；②statusIcons（状态图标，wrap_content宽度）；③signal_battery_cluster（信号电池区，include signal_cluster_view集中显示2G/3G、WiFi、蓝牙等信号图标，battery为电池图标）；④Clock（时间闹钟显示）。另有ticker区域：用于提示信息临时显示（如SD卡插入），显示时占满整个状态栏并带出现消失动画，一定时间后自动消失。","ch":"第18章 SystemUI"},{"q":"Android壁纸机制的组成有哪些？壁纸分哪两类？","a":"壁纸分两类：静态图片（jpg/png，借助系统内部APK显示）和APK应用程序（动态壁纸通常以此提供，安装后使用）。壁纸管理系统包括：①WallpaperManagerService（WPMS）：壁纸机制大总管，静态动态壁纸统一调度，基于AIDL（接口IWallpaperManager含setWallpaper、setWallpaperComponent、getWallpaper等），在SystemServer中创建并addService注册；②WallpaperService（WPS）：继承标准Service，实现onCreate/onDestroy/onBind等，含重要嵌套类engine，是静态动态壁纸的基类；③ImageWallpaper（IWP）：静态壁纸实现类，继承自WPS。WPMS构造时调用loadSettingsLocked读取配置文件保存到WallpaperData结构；系统Ready后systemReady()回调switchWallpaper，开机默认wallpaperComponent为空时取nextWallpaperComponent即ImageWallpaper，通过bindWallpaperComponentLocked以bindService方式启动。","ch":"第18章 SystemUI"},{"q":"设置壁纸的流程及WPMS与WPS间的IPC通信是怎样的？","a":"setWallpaper(String name)流程：先checkPermission检查android.permission.SET_WALLPAPER权限（应用须在Manifest中声明）；从mWallpaperMap按userId取出WallpaperData；调用updateWallpaperBitmapLocked——getWallpaperDir得到/data/system/users/<userId>路径（WALLPAPER_BASE_DIR默认/data/system/users），目录不存在则mkdir并设权限，然后打开（MODE_CREATE|MODE_READ_WRITE）名为wallpaper的文件并返回ParcelFileDescriptor。IPC方面：WPMS通过bindService启动壁纸服务时传入WallpaperConnection（newConn的Binder对象）；ImageWallpaper在onBind中返回IWallpaperServiceWrapper；WPMS的onServiceConnected中调用attachServiceLocked保存壁纸并触发attach；WPS侧attach生成IWallpaperEngineWrapper并发送DO_ATTACH消息，由executeMessage处理：mConnection.attachEngine(this)回调、onCreateEngine()创建引擎（ImageWallpaper为DrawableEngine，各壁纸应用最核心的差异，必须重载）、加入mActiveEngines并调用engine.attach()。","ch":"第18章 SystemUI"},{"q":"WallpaperService.Engine中壁纸应用可有选择地实现哪些方法？updateSurface做了什么？","a":"Engine可选择性实现：onCreate（只调用一次，返回后开始创建Surface）、onDestroy（返回后Surface被destroyed）、onVisibilityChanged（要求壁纸只在visible时才占用CPU资源）、onTouchEvent（触摸事件）、onCommand（接收WallpaperManager的command）、onSurfaceChanged、onSurfaceRedrawNeeded、onSurfaceCreated、onSurfaceDestroyed（后几个与SurfaceHolder.Callback一致）。updateSurface：先判断forceRelayout||creating||surfaceCreating||formatChanged||sizeChanged||typeChanged||flagsChanged||redrawNeeded等条件是否有变动，无则直接返回；若mCreated为空则通过mSession.addToDisplay向WMS注册；Surface未创建则先生成可用Surface（流程与显示系统一致）；attach中还会注册ACTION_SCREEN_ON/OFF广播并调用updateSurface更新Surface。取得有效Surface和UI绘制环境后，ImageWallpaper将壁纸界面经SurfaceFlinger显示到屏幕。","ch":"第18章 SystemUI"},{"q":"Widget机制中的三个核心角色是什么？各承担什么职责？","a":"①AppWidgetProvider（功能的提供者）：如天气插件，本质上是一个BroadcastReceiver，通过Broadcast事件对Widget进行远程更新，向Host提供Widget的功能实现和UI描述；②AppWidgetHost（Widget容器/东道主）：如Launcher，提供空间供Widget展现UI界面，负责显示规划及与Provider通信；③AppWidgetService：全局Widget管理器（类似WindowManagerService、WallpaperManagerService的命名），负责Widget的注册、管理和事件分发。关键结论：Host把Widget看成View的一个变种——Host只需按要求显示View，具体功能由AppWidgetProvider完成；系统未规定谁才能充当容器，Launcher本质只是普通APK，任何应用理论上都可做Host或Provider。","ch":"第19章 Widget机制"},{"q":"一个有效的AppWidgetProvider需要提供哪些内容？如何声明？","a":"需提供三方面：①AppWidgetProviderInfo：XML描述Widget的信息（layout布局、刷新频率updatePeriodMillis等），tag为<appwidget-provider>，含minWidth/minHeight/previewImage/initialLayout等属性；②AppWidgetProvider：继承自BroadcastReceiver，借助Broadcast事件远程更新Widget；③View布局：initialLayout指定初始显示布局，注意Widget的Layout基于RemoteViews，并非所有View组件都可用。声明方式：在Manifest中声明<receiver>，intent-filter的action为android.appwidget.action.APPWIDGET_UPDATE（它要接收的唯一消息），并用<meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/xxx\">指明Info文件。AppWidgetProvider.onReceive将action分发给onUpdate（UPDATE事件）、onDeleted（DELETED）、onAppWidgetOptionsChanged（OPTIONS_CHANGED，处理尺寸变化，首次添加也调用）、onEnabled、onDisabled。一个Widget可有多个实例，用appWidgetId唯一标识。","ch":"第19章 Widget机制"},{"q":"Host_Application如何与Widget系统交互？回调事件有哪些？","a":"Host_Application（如Launcher）只与AppWidgetManager交互，不直接调用AppWidgetService接口（类似ServiceManager.java的作用），AppWidgetManager内部再间接调用AppWidgetService。每个Host_Application还持有AppWidgetHost作为代理。Host创建后需向AppWidgetService注册监听Widget事件并提供callback实现——该callback继承自IAppWidgetHost.Stub（基于AIDL的Binder Server），保证AppWidgetService在事件发生时能回调Host。回调事件包括：updateAppWidget→AppWidgetHost.updateAppWidgetView、providerChanged→onProviderChanged、viewDataChanged→viewDataChanged。updateAppWidgetView实现：从mViews（HashMap<Integer, AppWidgetHostView>，Host包含的所有Widget的View集合）按appWidgetId取出AppWidgetHostView，调用其updateAppWidget(views)。Provider更新显示时通过AppWidgetManager.updateAppWidget(appWidgetId, RemoteViews)发起请求。","ch":"第19章 Widget机制"},{"q":"在Launcher中添加Widget的操作流程是什么？","a":"①在主界面空白处长按弹出对话框，选择item类型中的Widgets；②程序以Intent.action=AppWidgetManager.ACTION_APPWIDGET_PICK发起StartActivityForResult，启动系统Widget选择界面；③用户选择结果通过Activity.onActivityResult返回给Host_Application；④Host_Application发起第二次StartActivityForResult，action为AppWidgetManager.ACTION_APPWIDGET_CONFIGURE，对该Widget做初始化配置（如天气插件指定城市、设置更新频率），若Provider提供了ConfigurationActivity此时被调用；⑤配置结束后通常询问用户给Widget分配多大显示空间（如2行2列或2行3列）；⑥一切就绪后Host_Application才真正把Widget添加到自己的显示界面。","ch":"第19章 Widget机制"},{"q":"AppWidgetHost.createView做了哪些工作？","a":"①调用onCreateView产生AppWidgetHostView（默认只是new一个对象；AppWidgetHostView是FrameLayout的扩展子类，可重载onCreateView定制）；②view.setUserId、setOnClickHandler；③view.setAppWidget(appWidgetId, appWidget)：将widgetId与该HostView关联，并设置Widget的padding值（可重载）；④把view放入mViews集合（按appWidgetId存储）；⑤通过sService.getAppWidgetViews(appWidgetId, userId)从AppWidgetService得到该Widget的RemoteViews（实际只填写了LayoutId和PackageName等，真正构造UI时才取图纸）；⑥调用view.updateAppWidget(views)通过RemoteViews搭建本地View。Host通过AppWidgetManager.getAppWidgetInfo先获取AppWidgetProviderInfo信息，createView生成的View对应布局由initialLayout指定，后续Provider通过RemoteViews实时更新。","ch":"第19章 Widget机制"},{"q":"RemoteViews的本质是什么？AppWidgetHostView.updateAppWidget如何构建Widget界面？","a":"RemoteViews本质：名称带Views但实际不含任何View，它继承自可跨进程传递的Parcelable和约束数据的Filter。它相当于Widget界面的图纸——在Provider进程定义布局描述，Host进程依葫芦画瓢还原，解决跨进程显示View的问题。updateAppWidget流程：①getRemoteContext得到Widget所属Context，remoteViews.getLayoutId()取得LayoutId（与主题换肤思想一致）；②调用remoteViews.apply(mContext, this, mOnClickHandler)创建View——apply内部通过prepareContext获取Context，再由LayoutInflater.inflate(rvToApply.getLayoutId(), parent, false)层层解析XML并递归生成ViewTree；③因为AppWidgetHostView是FrameLayout（ViewGroup），调用prepareView(content)后addView(content)将content作为子View添加，随整体View重绘时Widget界面呈现出来。最终与其他View一起经SurfaceFlinger显示到屏幕。","ch":"第19章 Widget机制"},{"q":"Android应用程序APK有哪几种编译方式？各有什么特点？","a":"1）借助系统编译：利用Android.mk将APK源码加入整个Android工程编译，但要求熟悉系统编译框架、需下载整个工程、编译耗时长，不多见；2）借助IDE工具：如Eclipse的ADT，可快速建立原型，辅助编写、编译、调试，是非系统级应用开发的常用方式；3）命令行编译：如Ant，能了解编译、打包、签名等基础过程细节。IDE的'傻瓜式'操作导致很多开发者对编译打包签名过程一知半解。","ch":"第20章 Android应用程序的编译和打包"},{"q":"Ant是什么？相比make有什么优势？常见命令有哪些？","a":"Ant（Another Neat Tool）由Apache开发，其开发者原供职于Sun，因make太依赖操作系统环境而设计。特点：用Java语言开发，以XML文件（默认build.xml）描述编译过程和依赖关系，比Makefile简洁易懂、更富扩展性，在Java工程中广泛应用。常见命令：ant release（编译release版）、ant debug（编译debug版）、ant installd/installr/installt（安装已编译的debug/release/测试包）、ant <target> install（编译并安装）、ant clean（清理项目）。Windows下注意JDK路径含空格问题：set JAVA_HOME=…Progra～1…或将JDK装到无空格路径。","ch":"第20章 Android应用程序的编译和打包"},{"q":"Ant的debug和release两种编译模式有什么区别？","a":"Debug模式：进入工程目录执行ant debug，在bin目录生成'-debug.apk'，已自动用debug key签名并经zipalign优化，但使用系统默认签名文件，安全性不足，不适合正式发布。Release模式：ant release生成'-unsigned.apk'，签名和zipalign需手工完成——先用Jarsigner等工具用私钥签名，再用zipalign优化。简化方法：在项目根目录ant.properties中加入key.store=path/to/my.keystore和key.alias=mykeystore，ant release时会主动要求输入密码，编译完成后即已签名。安装可用adb install（Eclipse的Run/Debug本质也是借助adb install）。","ch":"第20章 Android应用程序的编译和打包"},{"q":"一个典型APK包含哪些内容？各部分的作用是什么？","a":"APK是zip压缩包，包含：AndroidManifest.xml——应用的'封面'和'目录'，记载名称、权限声明、组件等（发布时已加密保护，直接解压无法打开）；classes.dex——APK核心，由.class经dex工具转化成的Dalvik字节码（第三方jar通常也包含其中）；resources.arsc——编译过后的资源文件；res目录——未编译的资源文件；META-INF——保存签名和校验信息（CERT.RSA、CERT.SF、MANIFEST.MF），打包时对包中所有内容做校验存于此，安装时再次校验比对以防恶意篡改。","ch":"第20章 Android应用程序的编译和打包"},{"q":"APK编译的完整流程涉及哪些工具和步骤？","a":"流程：1）aidl工具将.aidl（Android Interface Description Language）文件转换为Java接口文件；2）aapt（Asset Packaging Tool）处理资源文件生成resources.arsc和R.java；3）Java编译器将R.java、Java源码和接口文件统一编译成.class文件；4）dex工具将.class转化为Dalvik字节码（classes.dex），过程中加入依赖的第三方库；5）apkbuilder将dex、资源包及其他资源打包生成初始APK（未签名未优化）；6）Jarsigner等工具签名（debug用系统默认keystore，release用开发者私钥）；7）zipalign优化——对APK包中数据做边界对齐（zip+align名称由来），提高程序加载和运行速度。","ch":"第20章 Android应用程序的编译和打包"},{"q":"密码学与信息安全的4个基础目标是什么？各解决什么问题？","a":"1）Authentication（认证）：确认通信对方身份合法，防止冒充（如小黑假冒Bank Server骗取账号密码）；2）Confidentiality（机密性）：对通信内容加密，防止被监听窃取机密信息（如银行卡号、密码）；3）Data Integrity（数据完整性）：无法完全阻止篡改，但可让双方察觉数据被篡改；4）Non-repudiation（不可否认性）：保证任何一方的承诺无可抵赖（如数字签名，私钥唯一性使签名者无法抵赖）。此外还有第五类Availability（可用性），衡量服务的可访问性。","ch":"第20章 Android应用程序的编译和打包"},{"q":"对称算法和公钥（非对称）算法各是什么？DH算法如何完成密钥协商？","a":"对称算法（Symmetric）：加密解密用同一密钥（单钥体系），速度快、适合大数据量，常用DES、AES；缺点是不利于密钥传输（寄锁的盒子钥匙无法安全送达）。公钥算法（Public-key/非对称）：加密解密密钥不同，分公钥（所有人可获知）和私钥（个人保存），避免密钥传输难题，常用RSA、DSA；用接收方公钥加密可实现保密通信，用发送方私钥加密是数字签名的基础。DH（Diffie-Hellman）算法：双方约定公共值g、p，各自产生私密数a、b，计算Y1=g^a mod p、Y2=g^b mod p并互换，各自算出Key=g^(ab) mod p。网络只传输g、p、Y1、Y2，由Y值计算公式的不可逆性无法推导出a或b，密钥协商安全可靠。","ch":"第20章 Android应用程序的编译和打包"},{"q":"Hash算法的特点是什么？如何利用Hash验证数据完整性？","a":"Hash将任意长度的输入映射为固定长度的输出；不同输入可能发生碰撞（概率学上），算法好坏取决于能否最大限度降低冲突；要求随机性——输入即使仅有微小差异，输出也应'天壤之别'，防止通过不断推测获知明文。常见算法：MD5、SHA、SHA-1、SHA-256、SHA384、SHA-512。应用：查找、消息摘要、数字签名等。数据完整性验证流程：发送方对数据做Hash得到哈希值→将数据和哈希值加密传送→接收方解密后对数据做同样Hash→比较两个Hash值判断是否被篡改。","ch":"第20章 Android应用程序的编译和打包"},{"q":"Android应用程序签名有哪些特点？","a":"1）所有Android应用（debug和release）都必须签名；2）可采用自签名形式，不需要CA认证；3）系统只在安装过程中检查证书有效性，安装后证书过期不影响使用；4）可用Keytool和Jarsigner完成签名，再用zipalign优化；5）建议所有应用采用统一证书；6）升级时系统比较新旧版本证书，一致才能升级（否则失败，除非换包名当新应用安装）；7）相同签名的应用可被安排在同一进程运行；8）相同签名的应用间可根据特殊权限共享代码和数据。","ch":"第20章 Android应用程序的编译和打包"},{"q":"Debug模式签名的默认keystore信息是什么？debug证书过期怎么办？","a":"Debug签名由系统自动完成，使用JDK提供的Keytool和Jarsigner（需正确设置JAVA_HOME）。默认信息：Keystore name为'debug.keystore'；Keystore password为'android'；Key alias为'androiddebugkey'；Key password为'android'；CN为'CN=Android Debug,O=Android,C=US'。debug证书自生成之日起有效期为365天，过期会提示'Debug Certificate expired on …'。解决方法：删除debug.keystore文件，下次编译时自动生成新keystore。存放路径：Linux/OS X为~/.android/，Windows XP为C:\\Documents and Settings\\<user>.android\\，Windows 7为C:\\Users\\<user>.android\\。","ch":"第20章 Android应用程序的编译和打包"},{"q":"Release模式签名的步骤是什么？zipalign的用法和原理？","a":"步骤：1）用Keytool生成私人密钥（若发布到Google Play，证书过期时间必须在2333年10月22日以后）；2）编译release版应用；3）用Jarsigner等工具签名；4）用zipalign做对齐优化。zipalign语法：zipalign -v 4 App_name-unaligned.apk App_name.apk，-v开启verbose输出，4为对齐字节数（当前只允许4），后两个为输入输出APK，覆盖原APK需加-f标志。原理：保证所有数据按特定标准相对文件开头字节对齐，系统可用mmap()读取文件而非复制包中全部数据，提高运行速度。Eclipse下可用ADT的Export Wizard导出并签名（可用已有或新建keystore），导出时进行Lint检查（Security、Performance、Usability等），可在Preferences->Lint Error Checking关闭。","ch":"第20章 Android应用程序的编译和打包"},{"q":"APK签名后META-INF目录下的3个文件各是什么作用？","a":"1）CERT.RSA：开发者提供的证书，包含开发者公钥和身份信息（自签名，无需CA认证）；2）CERT.SF（Signature File）：签名文件，Android只对整个MANIFEST.MF的Hash值进行私钥加密生成——因为MANIFEST.MF包含了包中所有文件的Hash值，既可验证MANIFEST.MF完整可靠，也可验证私钥与公钥是否匹配；3）MANIFEST.MF：记录APK包中每个文件的SHA1-Digest（SHA-1摘要经BASE64编码，SHA-1输出160bit即20字节，BASE64按3字符变4字符、每6位前加2位0编码成28个可见字符）。签名前后APK的唯一差别就是META-INF文件夹；安装未签名APK时adb会报错。","ch":"第20章 Android应用程序的编译和打包"},{"q":"应用安装时签名校验涉及哪些关键类？PackageParser.collectCertificates的流程是什么？","a":"关键类：PackageParser——解析应用包并完成安全校验（对APK包中所有文件逐个校验，所以MANIFEST.MF为每个文件提供hash值）；JarFile——继承自ZipFile，每个APK只对应唯一JarFile；JarVerifier——各种校验数据的储存仓库，含VerifierEntry嵌套类；VerifierEntry——对每个文件做具体检查匹配（verify()）；JarFileInputStream——继承自InputStream，JarFile的嵌套类，读取时完善VerifierEntry数据。流程：collectCertificates(pkg, flags)创建JarFile实例；若flags含PARSE_IS_SYSTEM（来自system image，可信度高）只检查AndroidManifest.xml；否则遍历jarFile.entries()对所有文件逐一校验（跳过目录和META-INF/），AndroidManifest.xml会生成manifestDigest，关键是loadCertificates()通过JarFileInputStream.read()读数据写入VerifierEntry，读完后entry.verify()校验。任何文件Hash不匹配则安装终止，提示'Package *** has no certificates at entry **'。","ch":"第20章 Android应用程序的编译和打包"},{"q":"JarFileInputStream.read()和VerifierEntry.verify()的校验逻辑是什么？","a":"JarFileInputStream.read()：count>0时调用super.read()读数据并entry.write(r)写入VerifierEntry为校验做准备；读到-1（count=0）时置done=true并调用entry.verify()进入校验阶段。VerifierEntry.verify()（JarVerifier.java中，VerifierEntry实际是OutputStream）：计算digest.digest()得到摘要，与Base64.decode(hash)（MANIFEST.MF中的SHA-1值经BASE64编码存储，需先解码）通过MessageDigest.isEqual比较；不匹配则throw invalidDigest(JarFile.MANIFEST_NAME, name, jarName)抛异常；匹配则verifiedEntries.put(name, certificates)提交JarVerifier存储以备后期查询。verify是将CERT.SF解密后的数据与MANIFEST.MF比较以证明证书有效性，并非验证包中所有文件的完整性。","ch":"第20章 Android应用程序的编译和打包"},{"q":"如何对第三方APK重新签名（重签名实例）？其安全隐患是什么？","a":"步骤：1）解压APK文件（APK是zip包）；2）删除META-INF文件夹（保存公钥、签名、Hash值，重签名需全部更新）；3）重新打包为zip并将后缀改为apk（如YourUnsigned.apk）；4）用jarsigner重签名：JDK 7及以上加参数 -sigalg MD5withRSA -digestalg SHA1，如'jarsigner -keystore ~/.android/debug.keystore -storepass android -keypass android YourUnsigned.apk androiddebugkey'；再用'zipalign 4 YourUnsigned.apk Aligned.apk'优化。也可用GUI工具如re-sign.jar。隐患：因Android自签名机制，第三方应用可被重新签名后二次发布；但重签名APK的公钥信息与原APK不同，升级时系统可通过比对公钥判断是否出自同一开发商，一定程度上防止恶意程序破坏。","ch":"第20章 Android应用程序的编译和打包"},{"q":"JVM的核心目标是什么？它需要哪些子系统支撑？","a":"JVM核心目标是实现'Write once, Run anywhere'：将Java源码编译为中间状态字节码(Bytecode)，运行时再转译成目标平台机器码。JIT、Interpreter、内存分配回收、线程管理等子系统本质上都是为这一终极目标服务。分析JVM时应区分：抽象的JVM规范、具体的JVM实现(如HotSpot)、运行时态的JVM实例。","ch":"第21章 Android虚拟机"},{"q":"JVM中通常存在哪几种类加载器？各自职责是什么？","a":"①Bootstrap ClassLoader：C/C++编写，由VM自身管理，加载[JAVA_HOME]/lib或-Xbootclasspath指定的核心类(如java.*、javax.*)；②Extension ClassLoader：加载JRE扩展目录(如lib/ext)中的类；③System ClassLoader：应用程序类加载器，加载CLASSPATH中的类，可通过getSystemClassLoader()获取；④User ClassLoader：应用程序自定义，须继承java.lang.ClassLoader。","ch":"第21章 Android虚拟机"},{"q":"Java双亲委派模型的工作流程是什么？","a":"用户自定义ClassLoader先在Cache中查询目标类是否已加载(findLoadedClass)，若没有则优先委派parent(System ClassLoader)执行loadClass；System ClassLoader同样逐级向上委派直到Bootstrap ClassLoader；若所有上层都加载失败，才调用自身的findClass()加载。这样保证基础类(如Object)处于同一空间域，避免类关系混乱。任何一个类由ClassLoader+类名两者共同唯一确定。","ch":"第21章 Android虚拟机"},{"q":"类加载的完整职责分为哪几步？Linking又细分哪些子项？","a":"三步：①Loading：查找和加载目标类数据；②Linking：检验类是否合法有效，细分为Verification(检验数据合法正确)、Preparation(为类变量分配内存并初始化为默认值)、Resolution(将符号引用转换为直接引用，类似C/C++重定位)；③Initialization：为对象做初始化。只有完成这几步类对象才算真正加载完成。","ch":"第21章 Android虚拟机"},{"q":"符号引用与直接引用的区别是什么？","a":"符号引用与具体内存布局无关，遵循统一标准以便在不同硬件平台上正确运行；直接引用则是能指向目标对象的内存地址、偏移量或其他可代表目标实例的对象。Resolution(解析)过程的输入是符号引用，输出是直接引用，类似于C/C++中的重定位过程。","ch":"第21章 Android虚拟机"},{"q":"JVM运行时数据区包括哪些？各有什么特点？","a":"①Program Counter Register：多线程管理关键，每线程独立；执行native方法时PC未定义；②Stack：线程独立，存储本地变量和栈帧，随线程生灭；③Heap：所有线程共享，给类实例和数组分配动态内存，GC主要针对堆；④Method Area：线程共享，类似'代码段'，含运行时常量池、方法数据等；⑤Native Method Stacks：支撑native代码执行，非必需。","ch":"第21章 Android虚拟机"},{"q":"什么是栈帧(Stack Frame)？它包含哪些内容？","a":"栈帧与函数一一对应，用于存储数据和部分结果、执行动态链接、返回方法返回值和分发异常。内部包含本地变量数组、操作数栈以及对运行时常量池的引用等。JVM执行新函数前先创建并初始化栈帧压入栈中，函数结束后释放对应frame。它是解释器的重要组成部分。","ch":"第21章 Android虚拟机"},{"q":"JVM分代垃圾回收将内存划分为哪几代？","a":"①Young Generation(年轻代)：细分为eden、s0和s1，后两者又称from space和to space；②Old Generation(老年代)：又称Tenured Space；③Permanent Generation(永久代)：存储类、方法相关的Meta Data，不属于Heap范畴。不同代采用不同的垃圾回收算法区别管理。","ch":"第21章 Android虚拟机"},{"q":"分代GC中对象何时从Eden/Survivor晋升到Old Space？Full GC何时触发？","a":"所有内存申请首先从Eden分配，不足则触发Minor GC清理Eden及一个Survivor；Survivor至少一个始终为空(To Survivor)，清理后存活对象转移到另一个Survivor，From/To标记互换。晋升Old Space的两种情况：①Survivor已满；②对象存活次数达到阈值(MaxTenuringThreshold可调)。Old Space满则触发Full GC，若仍无法满足请求可能产生OutOfMemory。","ch":"第21章 Android虚拟机"},{"q":"JVM执行引擎有哪几种执行方式？","a":"①Java字节码解释执行；②JIT(Just In Time)：运行阶段根据算法将使用频率高的字节码编译成Native Code再执行；③AOT(Ahead of Time)：编译阶段就将字节码直接转换成机器码(如ART采用的方案)。字节码指令由单字节opcode及0个或多个操作数构成(理论上JVM是零操作数的)。","ch":"第21章 Android虚拟机"},{"q":"基于栈和基于寄存器的虚拟机各有什么优缺点？","a":"基于栈：单条指令更紧凑(无需显式指定源和目标寄存器，Code Size小)、可移植性更强(不考虑平台寄存器映射)；缺点是完成同一任务所需指令数更多，需更多内存读写。基于寄存器：执行速度有优势，指令数少但单条指令占空间更大，指令类似汇编。大多数JVM基于栈，而物理处理器基于寄存器；Dalvik是典型的基于寄存器的虚拟机。","ch":"第21章 Android虚拟机"},{"q":"LLVM是什么？Three-Phase编译器包含哪三部分？","a":"LLVM(Low Level Virtual Machine)是模块化、可重复使用的编译器和工具链技术集合，非传统意义虚拟机。Three-Phase：①Frontend：分析源码、检查错误，编译成抽象语法树(AST)；②Optimizer：多种优化手段提高运行效率，相对独立于语言和平台；③Backend(代码生成器)：将源码转化为目标平台指令集。支持新语言只需实现新Frontend。关键设计是IR(Intermediate Representation)。","ch":"第21章 Android虚拟机"},{"q":"LLVM的IR起什么作用？","a":"IR(Intermediate Representation)在Optimizer阶段以相对独立的方式表述各种源代码，剥离不同语言间的差异，实现前端与后端无缝对接和模块重用。IR设计既不能太复杂(否则前端生成IR繁琐)，也不能太简单(否则无法保证优化正常开展)。它有点类似低级RISC指令集，又尽量与具体机器语言保持距离。","ch":"第21章 Android虚拟机"},{"q":"Android(Dalvik/ART)采用什么垃圾回收算法？核心步骤是什么？","a":"以Mark-Sweep为根基演变。核心三步：①清空所有Objects的Mark Bit；②Mark阶段：从GC Root开始遍历所有对象，凡从根出发有路径可达的对象标记为'被引用'(记录在Mark Heap Bitmap中)；③Sweep阶段：线性遍历堆，回收未被标记的对象。相比引用计数无需频繁调整计数值，效率更高。","ch":"第21章 Android虚拟机"},{"q":"Android中GC的常见触发时机有哪些？","a":"①GC_FOR_MALLOC：堆内存已满而程序尝试分配新内存时，需暂停程序回收；②GC_CONCURRENT：堆内存超过特定阈值时触发的并行GC；③GC_HPROF_DUMP_HEAP：开发者主动请求创建HPROF文件分析堆时触发；④GC_EXPLICIT：显性GC，如程序调用gc()，应尽量避免。归纳为两类：程序主动请求，以及内存不足(或即将不足)时系统的主动响应。","ch":"第21章 Android虚拟机"},{"q":"Dalvik的GC Root包括哪些元素？","a":"①root classloader定义的System classes；②每个线程：Interpreted stack(到curFrame为止)、Dalvik寄存器(args+local vars)、JNI local references、VM local references(TrackedAlloc)、关联的Thread/VMThread对象、ThreadGroups、当前抛出的Exception；③JNI global references；④Interned string table；⑤Primitive classes；⑥Special objects；⑦debugger object registry中的对象。","ch":"第21章 Android虚拟机"},{"q":"Live Heap Bitmap和Mark Heap Bitmap在GC中各起什么作用？","a":"Mark Heap Bitmap(MHB)保存Mark阶段确定的本轮需要存活的对象；Live Heap Bitmap(LHB)记录已分配的对象。综合两个Bitmap的数据即可准确判断哪些对象是本轮Sweep的'牺牲品'(已分配但本轮未被标记存活的即垃圾)。","ch":"第21章 Android虚拟机"},{"q":"Dalvik相比标准JVM做了哪些针对移动设备的优化设计？","a":"①多个Class融合进一个Dex文件以节省存储空间；②Dex文件可在多个进程间共享；③字节码检验操作耗时长，在程序运行前预先完成；④字节码优化让程序运行更快、更省电；⑤为保证安全，多进程间共享的代码设为只读不可随意编辑。这些都是为内存小、处理器弱的移动环境所设计。","ch":"第21章 Android虚拟机"},{"q":"Dalvik与ART的核心区别是什么？","a":"Dalvik多数情况下通过解释器执行Dex字节码，虽有JIT但对热点代码编译作用有限；ART采用AOT(Ahead of Time)技术，提前将Java代码翻译成目标平台机器码，性能大幅提升(应用启动可快3倍)。ART从Android 4.4以与Dalvik共存形态引入(Preview)，在Android Lollipop正式取代Dalvik。ART是基于Dalvik的深入改造。","ch":"第21章 Android虚拟机"},{"q":"AOT与JIT的区别？第三方APK如何获得AOT加速？","a":"JIT在程序运行过程中才将部分热点代码编译成机器码，加重CPU负担；AOT提前将代码翻译成目标平台机器码，避开JIT不足，但增加编译时间。第三方APK发布时不知目标硬件平台，无法以AOT形式发布，因此在配备ART的设备上安装时，系统调用精简编译器dex2oat完成动态'翻译'，保证与预装应用同等运行效率。","ch":"第21章 Android虚拟机"},{"q":"Android虚拟机'黑盒化'设计是指什么？","a":"Google将虚拟机黑盒化以保证Dalvik/ART及未来新型虚拟机的无缝切换：虚拟机功能全部封装在一个.so库(如libart.so)中，对外只暴露JNI_GetDefaultJavaVMInitArgs、JNI_CreateJavaVM和JNI_GetCreatedJavaVMs三个接口。使用者(如Zygote)只需按统一接口标准即可控制和使用所有类型的Android虚拟机。","ch":"第21章 Android虚拟机"},{"q":"Android虚拟机由哪些核心子系统组成？","a":"包括Runtime(运行时'大总管')、ClassLoader System(含Boot/System/DexClassLoader，由ClassLinker统一管理)、Execution Engine System(执行引擎)、Heap Manager和GC系统、JIT、JNI环境等。JavaVM是对虚拟机的抽象，每进程最多一个实例；JNIEnv负责JNI机制且线程相关；另有DexCache机制实现类似ELF的动态延迟加载。","ch":"第21章 Android虚拟机"},{"q":"APK安装阶段Dalvik与ART的处理差异是什么？","a":"虚拟机类型对Package(打包)阶段100%透明，分水岭在安装阶段。Dalvik：用dexopt工具对Dex做Odex优化，预装APK在编译阶段完成优化并可剔除classes.dex；第三方APK优化结果存到/data/dalvik-cache。ART：安装时用dex2oat预处理，输出Linux标准ELF可执行文件(OAT)。Android N开始安装时不再统一dex2oat，改由运行情况决定。","ch":"第21章 Android虚拟机"},{"q":"Android N之后ART虚拟机的执行方式呈现什么格局？","a":"Android N之前ART主要靠AOT(M版本编译时机为ROM构建时和程序安装时)；由于'一股脑'在安装阶段将Dex转成OAT造成资源浪费，Android N开始安装时不再统一执行dex2oat，改由根据程序实际运行情况决定哪些部分编译成本地代码，形成Interpreter、JIT、OAT三分天下的局面。","ch":"第21章 Android虚拟机"},{"q":"AAPCS是什么？BL指令的作用？","a":"AAPCS(Procedure Call Standard for Arm Architecture)是ARM汇编中调用者(Calling Routine)与被调用者(Called Routine)之间的严格协议规范，是Subroutines独立编写编译并能协同工作的基础。BL指令将PC下一个值保存到链接寄存器LR中，并把跳转目标地址存入PC；Thumb状态下LR的Bit0置1，ARM状态置0。Android虚拟机并未完全遵循AAPCS，而是做了定制(如r9记录Thread信息)。","ch":"第21章 Android虚拟机"},{"q":"ATPCS中参数如何传递、返回值如何处理？","a":"参数：存入a1-a4，不足4个按序使用；超过4个则剩余参数逆序存入栈中(第1个存VAL(SP)，第2个存VAL(SP)+4，依次类推)。返回值：1-word值保存在a1中；2-4 words分别用a1-a2、a1-a3、a1-a4；更多words需通过额外的内存地址参数传递返回值。","ch":"第21章 Android虚拟机"},{"q":"C++11中unique_ptr的作用和关键成员函数？","a":"unique_ptr表示所管理对象只允许有一个引用，销毁时同步释放管理的对象以避免内存泄露(区别于shared_ptr)。主要成员：get()获取管理对象(返回可能为nullptr，且调用后unique_ptr仍拥有管理权，返回值不能用于构建另一个智能指针)；release()释放管理对象，unique_ptr失去管理权。auto_ptr在C++11中已被摒弃。","ch":"第21章 Android虚拟机"},{"q":"Dex文件格式的特点及其与Java Class文件的区别？","a":"Dex是Dalvik虚拟机的可执行字节码文件，Android不直接使用.class，而是先用dx工具将.class转换为.dex。区别：一个应用通常只含一个Dex文件(超限才分包)，Dx工具将各Class统一'糅合'进Dex；而标准Java的Jar包中存储若干个Class文件分别管理。Dex主要域包括header、string_ids、type_ids、proto_ids、field_ids、method_ids、class_defs、data、link_data，各列表均不允许重复项。","ch":"第21章 Android虚拟机"},{"q":"Dex文件头的magic和主要信息有哪些？","a":"Dex头记录Magic数('dex\\n035\\0')、checksum校验码、signature签名、file_size总文件大小、header_size(112字节)，以及各区段(string_ids、type_ids、proto_ids、field_ids、method_ids、class_defs、data等)所占空间大小size和起始地址偏移量off。string_ids区紧挨Header存储(偏移量等于header_size)。","ch":"第21章 Android虚拟机"},{"q":"Dex中method_id_item结构包含哪些字段？函数实现保存在哪里？","a":"method_id_item占4字节，含class_idx(函数所属Class，指向type_ids数组项)、proto_idx(函数原型，指向proto_ids)、name_idx(函数名称，指向string_ids)。函数的具体实现保存在class_defs中：class_def_item中class_data_off偏移量指向class_data_item，集中保存Class内部的各种函数和域。","ch":"第21章 Android虚拟机"},{"q":"Dalvik中函数有哪几种类型？对应什么调用指令？","a":"①Virtual：invoke-virtual，最常见，可被重载(除private、static、final及构造函数外)，需考虑VTable，效率稍低；②Super：invoke-super，调用父类的Virtual Method；③Direct：invoke-direct，不能被重载的非静态函数；④Static：invoke-static；⑤Interface：invoke-interface，接口函数。","ch":"第21章 Android虚拟机"},{"q":"VTable和ITable分别解决什么问题？子类VTable如何构建？","a":"VTable(Virtual Method Table)解决类的extends(继承)多态，ITable(IfTable)解决implements(接口)多态——因Java只能继承一个父类但可实现多个接口，VTable无法解决所有多态问题。子类构建VTable：先完整复制父类VTable，再替换被override的函数项、将新函数添加到表尾。如B重载A.Method1，则B的VTable第1项为B.Method1，未重载则仍是A.Method1。","ch":"第21章 Android虚拟机"},{"q":"ELF文件有哪几种形态？Section和Segment的区别？","a":"三种形态：可重定向文件(Relocatable，如.o中间文件)、可执行文件(Executable)、可共享对象文件(Shared Object，.so动态库)。Section存储的信息支撑程序的链接工作，面向Linker；Segment提供程序运行时所需数据，面向加载器Loader。以Segment方式加载还能节约存储空间：Section加载时页对齐会造成浪费，Segment由多个段组成且段间无间隔。","ch":"第21章 Android虚拟机"},{"q":"ELF Header中e_ident Magic区域的含义？","a":"共16字节：前4字节'7f 45 4c 46'是ELF魔数(ASCII '.ELF')；第5字节表示硬件平台位数(1为32位，2为64位)；第6字节表示数据大小端模式(1小端，2大端)；第7字节为ELF版本号(目前只能为1)；第8字节表示目标操作系统ABI(0x00 System V、0x03 Linux等)。其他字段还包括e_type、e_entry、e_phoff、e_shoff等。","ch":"第21章 Android虚拟机"},{"q":"ELF常见Section有哪些？.init/.fini起什么作用？","a":".text(代码区)、.data(已初始化变量)、.bss(未初始化变量)、.rel.text/.rel.data(重定位信息)、.rel.plt/.rel.dyn(动态链接重定位)、.got(Global Offset Table)、.debug(调试信息)、.strtab(符号名字符串)、.symtab(符号表)、.shstrtab(Section名称表)。.init/.init_array和.fini/.fini_array提供构造和析构函数：动态对象首次加载时调用构造、卸载时调用析构；.init优先级高于.init_array。","ch":"第21章 Android虚拟机"},{"q":"静态链接库与动态链接库的区别？","a":"静态库：编译链接阶段就完成函数和变量地址解析，成为可执行程序不可分割的一部分；缺点是程序体积随库增大，多程序共用同一库需各自打包，资源浪费。动态库：不需编译时打包，运行阶段才动态加载和重定位(Load Time Relocation)；支持进程内和进程间代码共享；核心优势是代码共享要求代码段不做进程定制修改，由此引出GOT机制。","ch":"第21章 Android虚拟机"},{"q":"Linux如何确定ELF程序的入口地址？","a":"内核通过do_execve调用load_elf_binary加载ELF文件，遍历所有Program Header查找PT_INTERP解释器段(.interp区段指示链接器路径)。若interpreter存在，入口地址是load_elf_interp的返回值(即解释器/Linker的入口)；否则使用ELF头中的e_entry。即：程序依赖动态库时入口在解释器中，否则用默认e_entry。","ch":"第21章 Android虚拟机"},{"q":"GOT和PLT机制如何配合实现动态链接？","a":"GOT(Global Offset Table)将'变'与'不变'隔离：通过中间层GOT保持代码段不变(便于共享)，变的部分放到GOT表。PLT实现Lazy Binding：函数首次被调用时，经PLT跳到GOT，此时真实地址未解析而绕回PLT，保存符号在rel.plt中的序号后跳转Plt[0]，进而调用GOT[2]保存的_dl_runtime_resolve解析真实地址并写入GOT；非首次调用则直接跳转到真实地址。","ch":"第21章 Android虚拟机"},{"q":"Android Linker的隐式链接流程及与Linux的差异？","a":"程序启动时load_elf_interp加载.interp指定的Linker(/system/bin/linker或linker64)，控制权交给Linker的_start->__linker_init完成自举(自举前不能访问外部变量否则segfault)，再经__linker_init_post_relocation按DT_RPATH、LD_LIBRARY_PATH、LD_PRELOAD、缺省目录优先级查找动态库，并递归(广度优先)解决依赖。差异：Linux采用Lazy Binding(PLT首次执行才解析)，Android则在开始时就直接将GOT中元素全部解析完成(RTLD_LAZY不支持)。","ch":"第21章 Android虚拟机"},{"q":"Android N的Namespace机制如何限制非法NDK访问？","a":"OpenNativeLibrary根据ClassLoader查找/创建关联Namespace，再通过android_dlopen_ext(ANDROID_DLEXT_USE_NAMESPACE)加载库。Namespace分public(公共库列表，来自/etc/public.libraries.txt)、default、anonymous、classloader四类。Classloader Namespace is_isolated为true，权限检查规则：非isolated可访问；库在ld路径、Default Library Paths或Permitted Paths中有权限；否则无权访问。加载非法库报UnsatisfiedLinkError。","ch":"第21章 Android虚拟机"},{"q":"System.loadLibrary与System.load的区别？加载流程？","a":"loadLibrary只需库名，系统在预设路径查找加载；load允许开发者用完整路径加载任意有权限访问的so。流程：System.loadLibrary→Runtime.loadLibrary0→doLoad→nativeLoad→JavaVMExt::LoadNativeLibrary：先查libraries_是否已加载(同一库不能被多个ClassLoader加载)；通过OpenNativeLibrary加载(失败可尝试NativeBridge)；创建SharedLibrary并加锁竞争处理；最后dlsym查找并执行JNI_OnLoad(非必需)。","ch":"第21章 Android虚拟机"},{"q":"JNI函数如何注册并建立Java与Native的映射？","a":"在JNI_OnLoad中通过register_XX函数调用AndroidRuntime::registerNativeMethods→jniRegisterNativeMethods→env->RegisterNatives。JNINativeMethod包含Java函数名、Signature(返回值和参数的字符串表述)和native函数指针。虚拟机通过FindMethod找到对应的ArtMethod，再调用其RegisterNative(fnPtr)，本质是用SetEntryPoint将Native函数地址设置为ArtMethod的JNI入口；调用时通过GetEntryPoint取得入口地址。","ch":"第21章 Android虚拟机"},{"q":"Art的fault_manager信号处理优先级是怎样的？","a":"SIGSEGV发生时kernel先调用静态函数art_fault_handler，转给fault_manager处理，优先级：①generated_code_handlers_；②other_handlers_(HandleFaultByOtherHandlers)；③用户自定义处理InvokeUserSignalHandler。fault_manager最多管理4种Handler(均继承FaultHandler)：SuspensionHandler(线程挂起检查)、StackOverflowHandler、NullPointerHandler、JavaStackTraceHandler。libsigchain通过截获sigaction/sigprocmask保证signal chain优先处理。","ch":"第21章 Android虚拟机"},{"q":"SuspensionHandler如何通过SIGSEGV实现线程挂起？","a":"SuspendAllInternal给各线程置位kSuspendRequest并将suspend_trigger置为nullptr；线程执行到Check Point访问该nullptr时引发SIGSEGV。SuspensionHandler::Action通过sigcontext检查出错指令是否为访问suspend_trigger的指令序列(ldr.w r0,[r9,#off]; ldr r0,[r0,#0])；确认后调用art_quick_implicit_suspend执行挂起(最终经artTestSuspendFromCode到TransitionFromRunnableToSuspended)，并RemoveSuspendTrigger防止重复触发。","ch":"第21章 Android虚拟机"},{"q":".art、.oat、.odex文件分别是什么？boot.art与boot.oat的关系？","a":".art(image)：dex2oat生成，包含预初始化类和对象，Zygote启动时加载boot.art加快启动(约10MB额外空间)；.oat：dex2oat产生，本质是ELF扩展文件；.odex：Dalvik中是优化后Dex，ART中实际也是.oat文件。boot.oat比作exe文件，boot.art则类似其运行时实例；两者可相互引用、内存中紧挨加载，boot.art中的Frameworks Image/Code可被OAT的Compiled Method直接调用，加快启动。","ch":"第21章 Android虚拟机"},{"q":"OAT文件格式与ELF的关系及内部关键符号？","a":"OAT遵循ELF规范并扩展了Oat Data Section(保存原Dex字节码数据)和Oat Exec Section(dex2oat翻译的机器码)。通过.dynsym中3个关键符号定位：oatdata指向Data Section起始；oatexec指向Exec Section起始；oatlastword指示Exec Section结束。[oatdata,oatexec]是Dex范围，[oatexec,oatlastword]是机器指令范围。OatFile::Dlopen用dlopen+两次dlsym获取oatdata/oatlastword。","ch":"第21章 Android虚拟机"},{"q":"OatFile::Setup如何解析OAT中的Dex？OAT为何保留原始Dex？","a":"Setup先检查OatHeader合法性(magic为'oat'、版本'039'、页对齐)，跳过OatHeader和KeyValueStore，按GetDexFileCount循环解析每个Dex：location_size、路径字符串、checksum、dex_file_offset(Dex在OAT中的偏移，起始地址=Begin()+offset)，并校验Dex魔数'Dex'和版本'035'，再跳过methods_offsets_pointer(class_defs_size_个)，创建OatDexFile统一管理。保留Dex的原因：①提供Class到Native Code对应关系加速执行；②调试时准确定位源码；③很多情况仍需interpreter解释字节码。","ch":"第21章 Android虚拟机"},{"q":"Android的dex预优化(DEXPREOPT)编译选项有哪些？","a":"①WITH_DEXPREOPT：预优化总开关，L之前user版本默认打开，之后需在BoardConfig.mk主动打开，表示system image所有对象都需预优化；②DONT_DEXPREOPT_PREBUILTS：Prebuilt程序不参加预优化；③WITH_DEXPREOPT_BOOT_IMG_ONLY：仅boot image参加预优化；④LOCAL_DEX_PREOPT：模块单独指定(true/false/nostripping，nostripping表示不把classes.dex从apk/jar剔除)。","ch":"第21章 Android虚拟机"},{"q":"dex2oat的两个编译时机是什么？为什么第三方APK不能自带OAT？","a":"①Android系统构建(ROM编译)过程：针对预装和系统应用，此时硬件平台确定；②第三方应用安装过程：由系统执行dex2oat。第三方APK发布前无法预测用户硬件平台(不同指令集)，且要兼容不同Android版本(4.4/6.0/2.3等)，故无法在开发构建阶段编译OAT，只能由目标设备在安装时执行dex2oat。","ch":"第21章 Android虚拟机"},{"q":"dex2oat的核心参数有哪些？","a":"输入：--dex-file(.dex/.jar/.apk)、--zip-fd、--zip-location；输出：--oat-file/--oat-fd/--oat-location/--oat-symbols、--image(生成image)、--image-classes(image包含的类)；其他：--boot-image、-j(线程数)、--base、--instruction-set(arm|arm64|mips|x86|x86_64)、--compiler-backend(Quick|Optimizing|Portable，默认Quick)、--compiler-filter(verify-none|interpret-only|space|balanced|speed|everything)、--runtime-arg。","ch":"第21章 Android虚拟机"},{"q":"第三方APK安装过程中dex2oat的调用链是怎样的？","a":"文件管理器startActivity→PackageInstallerActivity→InstallAppProgress→PackageManager(本地代理ApplicationPackageManager)→PackageManagerService(SystemServer启动，注册名'package')→mInstaller(Installer/InstallerConnection，通过Unix Domain Socket连接installd)→installd的execute按cmds数组分发到do_dexopt→dexopt()：根据persist.sys.dalvik.vm.lib.2判断虚拟机，fork子进程后libart则execv执行/system/bin/dex2oat(--zip-fd等参数)，父进程waitpid等待完成。","ch":"第21章 Android虚拟机"},{"q":"Android虚拟机典型启动的5个步骤是什么？","a":"AndroidRuntime::start：①JniInvocation.Init：dlopen虚拟机库(默认libart.so)，查找JNI_GetDefaultJavaVMInitArgs、JNI_CreateJavaVM、JNI_GetCreatedJavaVMs三个'门户入口'；②startVm：初始化VM参数(如-Xms/-Xmx来自系统属性)并调用JNI_CreateJavaVM；③onVmCreated：回调通知虚拟机创建成功；④startReg：注册native函数(androidSetCreateThreadFunc+register_jni_procs遍历gRegJNI)；⑤FindClass找到目标类(如ZygoteInit)的main并通过CallStaticVoidMethod执行。","ch":"第21章 Android虚拟机"},{"q":"JNI_CreateJavaVM内部做了什么？Runtime::Init的核心步骤？","a":"JNI_CreateJavaVM(Runtime单实例)调用Runtime::Create创建Runtime并Init，再Runtime::Start。Runtime::Init核心：①创建gc::Heap堆管理对象；②创建JavaVMExt；③Thread::Attach主线程(新建Thread、Init创建JNIEnvExt并注册到thread_list)；④new ClassLinker；⑤初始化ClassLinker：Heap含Boot Image则InitFromBootImage，否则OpenDexFiles后InitWithoutImage确定boot_class_path_。","ch":"第21章 Android虚拟机"},{"q":"Art中ImageSpace是什么？Image文件包含哪7个Section？","a":"ImageSpace继承自MemMapSpace→ContinuousSpace(连续空间，还有ZygoteSpace等；不连续空间继承DiscontinuousSpace)，是boot.art文件直接映射到内存的只读空间(kGcRetentionPolicyNeverCollect，无需GC)。Image分7个Section：kSectionObjects、kSectionArtFields、kSectionArtMethods、kSectionDexCacheArrays、kSectionInternedStrings、kSectionClassTable、kSectionImageBitmap(位于文件尾部，供GC使用)。通过mmap映射，优先按Image Header的image_begin_地址映射以减少重定位。","ch":"第21章 Android虚拟机"},{"q":"Image文件缺失时如何生成？Boot Class Path来源？","a":"ImageSpace::GenerateImage：解析Boot Class Path(冒号分隔)，Zygote进程先PruneDexCache清理缓存，然后构造参数(--image=目标、每个jar用--dex-file传递、--oat-file=由image路径改后缀得到)并通过fork+execv执行dex2oat生成Image和Oat，父进程waitpid等待。Boot Class Path来源：环境变量BOOTCLASSPATH(现由编译系统经PRODUCT_BOOTCLASSPATH生成init.environ.rc导出)或'-Xbootclasspath:'参数，后者优先级更高；有可用Boot Image时直接来源于它。","ch":"第21章 Android虚拟机"},{"q":"Art堆空间有哪些类型？内存布局顺序？","a":"Heap类持有continuous_spaces_、discontinuous_spaces_、alloc_spaces_、non_moving_space_、rosalloc_space_(kAllocatorTypeRosAlloc)、dlmalloc_space_(kAllocatorTypeDlMalloc)、main_space_、large_object_space_(大对象)。SpaceType枚举：ImageSpace、MallocSpace、ZygoteSpace、BumpPointerSpace、LargeObjectSpace。布局：ImageSpace(其后紧跟对应Oat文件)→Non moving space(若separate_non_moving_space，Zygote时起点为Zygote Space)→MainSpace(RosAlloc/DlMalloc)，kCollectorTypeCC对应Region Space。","ch":"第21章 Android虚拟机"},{"q":"Art中Java线程的创建流程？","a":"new Thread()最终调用create()但线程未真正创建，直到Thread.start()调用nativeCreate→Thread::CreateNativeThread：检查Runtime未shut down(StartThreadBirth/EndThreadBirth配套表示孵化中)，new Thread后通过pthread_create(标准OS线程，说明Java线程由操作系统线程承载)以Thread::CreateCallback为入口创建。CreateCallback中：self->Init注册到ThreadList并创建JNIEnvExt，通过WellKnownClasses缓存的java_lang_Thread_run调用Thread.run()，结束时Unregister。","ch":"第21章 Android虚拟机"},{"q":"Art如何实现SuspendAll？mutator_lock_起什么作用？","a":"ThreadList::SuspendAll通过SuspendAllInternal给所有线程置位kSuspendRequest并置suspend_trigger为nullptr触发SIGSEGV进入挂起(隐式挂起机制)，然后尝试获取mutator_lock_的ExclusiveLock(ExclusiveLockWithTimeout，超时30秒)。mutator_lock_是继承ReaderWriterMutex的MutatorMutex(读写锁)：所有线程挂起时会释放各自Shared Lock，全部释放(Free)后ExclusiveLock成功返回true；超时未获锁且long_suspend_不为true则fatal error('Thread suspend timeout')。","ch":"第21章 Android虚拟机"},{"q":"Art虚拟机面对哪三类代码执行环境？","a":"①Case1：Dex字节码在Interpreter中解释执行(也可能走JIT)；②Case2：Dex经dex2oat转化后的本地机器码执行；③Case3：C/C++编写的JNI本地函数(.so)执行。三者不是孤立的，存在互相调用(Java调Native、Native回调Java、字节码与机器码切换)，需要ArtMethod的EntryPoint和EntryPoints Jump Table机制衔接。","ch":"第21章 Android虚拟机"},{"q":"Interpreter中调用函数时DoInvoke如何选择执行方式？","a":"Interpreter遇invoke-XX时通过DoInvoke→FindMethodFromCode(ClassLinker.GetResolvedMethod查缓存，否则ResolveMethod：定位Dex→定位Class→定位Method)获取ArtMethod，再经DoCall/DoCallCommon执行：Runtime已启动时按ShouldUseInterpreterEntrypoint判断——需要解释器则走ArtInterpreterToInterpreterBridge(interpreter→interpreter)，否则走ArtInterpreterToCompiledCodeBridge(interpreter→compiled code)。","ch":"第21章 Android虚拟机"},{"q":"ClassLinker::LinkCode如何为ArtMethod设置入口？","a":"非dex2oat进程时：先oat_method.LinkMethod将OAT中GetQuickCode()(begin_+code_offset_)设为EntryPointFromQuickCompiledCode；然后按情况覆盖：①函数不可调用(如抽象函数)→EnsureThrowsInvocationError；②静态非构造函数→SetEntryPointFromQuickCompiledCode(GetQuickResolutionStub())，类初始化时经FixupStaticTrampolines重新调整；③Native且Quick Code不存在→GetQuickGenericJniStub；④需解释执行→GetQuickToInterpreterBridge；⑤最后Native函数UnregisterNative恢复dlsym查找stub。","ch":"第21章 Android虚拟机"},{"q":"art_quick_to_interpreter_bridge的作用与流程？","a":"它是帮助Quick Code环境中的Caller调用需要解释器执行的Callee的汇编bridge。流程：ArtMethod::invoke→art_quick_invoke_stub→quick_invoke_reg_setup→art_quick_invoke_stub_internal→经ldr ip,[r0,#Art_METHOD_QUICK_CODE_OFFSET_32]取入口调用本bridge→SETUP_REFS_AND_ARGS_CALLEE_SAVE_FRAME保存现场→调用C函数artQuickToInterpreterBridge(method, Thread::Current(r9), sp)。C函数创建ShadowFrame(解释器栈帧，含本地变量/寄存器)后由EnterInterpreterFromEntryPoint切入解释器Execute执行，结果经r0层层回传。","ch":"第21章 Android虚拟机"},{"q":"ShadowFrame是什么？由哪些信息构成？","a":"ShadowFrame是解释器的栈帧，类似标准JVM的Stack Frame，用于存储方法本地变量表、操作栈、方法出口等信息(Android虚拟机基于寄存器，结构与栈式VM有差别)。由ShadowFrame::Create(num_vregs, link, method, dex_pc, memory)创建：num_regs为函数所需寄存器数量(Dex编译时registers_size_记录)、link指向前一个ShadowFrame、method为目标ArtMethod、memory为寄存器内存。提供GetVReg/SetVReg等寄存器操作方法。","ch":"第21章 Android虚拟机"},{"q":"QuickEntryPoints(Jump Table)如何让OAT本地代码引用外部函数？","a":"Thread持有jni_entrypoints和quick_entrypoints两个结构(InitTlsEntryPoints初始化)。QuickEntryPoints涵盖Alloc、Cast、DexCache(InitializeStaticStorage/InitializeType/ResolveString)、Field访问、JNI(JniMethodStart/End)、Invocation(Resolution/IMT Conflict/ToInterpreter Bridge等Trampoline)入口。虚拟机调用约定用r9寄存器保存Current Thread，dex2oat生成的native code遵循此约定即可通过r9找到Jump Table回到Runtime，借助类加载系统查找和调用目标函数，无需动态链接(故名Quick)。","ch":"第21章 Android虚拟机"},{"q":"解释器有哪几种实现？各自的适用场景？","a":"①switch型：ExecuteSwitchImpl，结构清晰但每条指令需逐一匹配case，效率低；②Goto(Computed Goto)型：ExecuteGotoImpl，通过handlersTable二维数组(Main/Alternative两种Handler Table，后者用于Instrumentation)将指令与处理函数一对一关联，性能更好；③汇编(mterp)型：每个opcode一个.S文件(如op_aget.S)，效率最高但需按架构适配，支持arm/arm64/mips/x86等。由kInterpreterImplKind决定(默认kMterpImplKind)；汇编解释器无法支撑所有instrumentation和debugging场景时切换到switch/Goto。","ch":"第21章 Android虚拟机"},{"q":"JIT在Android虚拟机中的演进历程？","a":"Dalvik时代：JIT是保证运行效率的重要机制；ART(N版本之前)：JIT'退隐江湖'，全靠AOT；ART N版本开始：JIT'重出江湖'。N版重新引入JIT的原因：AOT导致安装慢、系统升级后需重新优化等待时间长；JIT+AOT融合可加快安装/更新、保证启动速度、避免JIT卡顿(独立线程编译且UI线程高优先级)、省电(只编译必要函数)、新GC策略控制内存。是否启用由系统属性dalvik.vm.usejit决定。","ch":"第21章 Android虚拟机"},{"q":"Profile Guided Compilation的工作流程？","a":"①应用第一次启动只通过解释器执行，JIT介入对hot methods优化；②同步输出Profile information按规律保存到文件(程序属主私有)；③重复执行不断完善Profile；④设备idle且充电时进入Profile guided compilation：以Profile文件为输入执行AOT编译(dex2oat加--profile-file参数)，输出机器码替换原应用相应部分；⑤后续启动可在AOT/JIT/Interpretion中择优。Profile记录Hot Methods和影响启动速度的Classes。","ch":"第21章 Android虚拟机"},{"q":"AOT Compilation Daemon的工作逻辑？","a":"设备同时处于idle和充电状态时被唤醒，遍历系统中所有应用程序决定是否AOT：①共享的应用执行完全编译；②否则查找应用是否有Profile文件，没有则放弃，有则进入Profile guided compilation(复用dex2oat改造)。由于参与AOT的函数只占代码一小部分，Android N的AOT结果占用空间远小于旧版本；同时安装时不再调用dex2oat，大幅加快安装速度。","ch":"第21章 Android虚拟机"},{"q":"Handle和StackHandleScope的作用？","a":"对于从Heap分配的对象，若GC移动了对象位置，指向老位置的变量会失效。Handle所包含的元素对GC可见，有利于GC自动调整引用关系(强指针无法胜任)。Handle由HandleScope分配：StackHandleScope<N>是模板栈对象(数字为Handle上限)，通过NewHandle生成MutableHandle(内部含StackReference指针)，SetReference标记被引用；栈对象生命周期结束后其管理的Handle被释放。","ch":"第21章 Android虚拟机"},{"q":"ClassLinker::FindClass的查找路径有哪几种情况？","a":"①LookupClass查已加载类(ClassTable/boot_class_table_)，找到则EnsureResolved返回；②数组类→CreateArrayClass；③class_loader为空→FindInClassPath在Boot Class Path的DexFile中查找；④UseCompileTimeClassPath(仅dex2oat进程，与-Ximage:有关)→搜寻编译时类路径；⑤否则FindClassInPathClassLoader(查boot_class_path_及PathClassLoader的DexPathList.dexElements)，最后调用class_loader的loadClass，仍失败返回null并报Class Not Found。","ch":"第21章 Android虚拟机"},{"q":"DexFile::FindClassDef如何定位一个类？","a":"通过三级索引：FindStringId在string_ids数组中匹配descriptor获得StringId(其string_data_off_指向字符串)→GetIndexForStringId取得序号→FindTypeId得到对应TypeId→GetIndexForTypeId得到type_idx(uint16_t类序号)→遍历class_defs(GetClassDef(i)，数组由class_defs_off_偏移得到，数量为class_defs_size_)比较class_def.class_idx_==type_idx返回ClassDef。返回ClassPathEntry(pair<const DexFile*, const ClassDef*>)。","ch":"第21章 Android虚拟机"},{"q":"mirror::Class有哪些关键状态？如何变迁？","a":"状态机：kStatusNotReady(0，分配Class对象)→kStatusIdx(1，从Dex读取信息填充、super_class_未填充，可插入ClassTable)→kStatusLoaded(2，ResolveClass完成，super_class_已处理)→kStatusResolving(3)→kStatusResolved(4，linking部分完成)→kStatusVerifying(5)→kStatusVerified(8)→kStatusInitializing(9)→kStatusInitialized(10，可用)。另有kStatusError(-1)、kStatusRetired(-2)、kStatusRetryVerificationAtRuntime(6)等。","ch":"第21章 Android虚拟机"},{"q":"ClassLinker::DefineClass的核心步骤？","a":"①AllocClass：从Runtime Heap分配Class空间(纳入GC管理)，状态迁移到kStatusNotReady；②RegisterDexFile并SetDexCache；③SetupClass初始化Class对象；④InsertClass插入已加载类表(已存在则EnsureResolved)；⑤LoadClass/LoadClassMembers：通过ClassDataItemIterator依次加载静态成员变量(sfields)、普通成员变量(ifields)、Direct方法(含static/private)和Virtual方法(每个方法LoadMethod+LinkCode)；⑥LinkClass：LinkMethods等建立类间关联(父子类重载、VTable/ITable处理)，失败置kStatusError。","ch":"第21章 Android虚拟机"},{"q":"LinkVirtualMethods如何构建子类VTable？","a":"当前类有SuperClass时：VTable(mirror::PointerArray)大小为num_virtual_methods+super_vtable_length，先从父类VTable复制各个entry完成初始化(父类无父类即Object则跳过)；然后按两个原则改造：①查询父类VTable中是否有被本类override的函数(替换为本类实现)；②与父类无直接关系的新虚函数添加到VTable末尾。这样运行时通过VTable可查出函数最终绑定实现，实现多态。","ch":"第21章 Android虚拟机"},{"q":"jmethodID与ArtMethod如何互相转换？","a":"JNI的jmethodID(jfieldID、jobject、jclass等类似，多为void*的typedef)通过ScopedObjectAccess(soa)的EncodeMethod/DecodeMethod编解码：Encode: ArtMethod→jmethodID；Decode: jmethodID→ArtMethod。并非简单强制类型转换，而是通过soa的编解码机制保证正确性。GetStaticMethodID经FindMethodID按继承链FindDirectMethod(静态)/FindInterfaceMethod(接口)/FindVirtualMethod(虚函数)查找后Encode返回。","ch":"第21章 Android虚拟机"},{"q":"ArtMethod::Invoke的分发逻辑？","a":"它是函数执行前的'分发器'：若Runtime未启动(!IsStarted)或调试需要解释器(Dbg::IsForcedInterpreterNeededForCalling)则走interpreter分支解释执行字节码；否则若有Quick Code(GetEntryPointFromQuickCompiledCode非空)，非静态用art_quick_invoke_stub、静态用art_quick_invoke_static_stub执行本地机器码(两者转调quick_invoke_reg_setup准备寄存器参数：core_reg_args[4]对应r0-r3、fp_reg_args[16]对应s0-s15，按shorty处理浮点参数)，再由art_quick_invoke_stub_internal汇编经blx跳到目标函数入口，结果通过[sp]指向的result回传。","ch":"第21章 Android虚拟机"},{"q":"quick_invoke_reg_setup中寄存器如何分配？shorty是什么？","a":"core_reg_args[4]对应r0-r3(gpr_index初始为1，r0预留给ArtMethod指针)，fp_reg_args[16]对应s0-s15(浮点寄存器)；非static时先复制对象参数，再遍历shorty(第0个元素是返回值故从序号1开始)分配参数，遇D/F用fp寄存器(软浮点时把D当J、F当I)。shorty是函数原型的'简写'：D=double、J=long、F=float、I=int、Z=boolean、C=char、B=byte、S=short、V=void、L=object、[=array。Art调用汇编并未严格遵循AAPCS。","ch":"第21章 Android虚拟机"},{"q":"artQuickResolutionTrampoline解决什么问题？如何区分首次调用？","a":"解决函数延迟解析(类似GOT/PLT)和多态绑定：①普通函数延迟解析：called是'伪目标'Runtime Method时(dex_method_index_==kDexNoIndex即IsRuntimeMethod为true)，从caller的字节码(invoke-XX指令带目标参数)解析出目标method index，经ClassLinker::ResolveMethod得到真实ArtMethod；②静态函数延迟解析：called的index已是目标索引，直接处理。之后virtual/interface类型按receiver->GetClass()经FindVirtualMethodForVirtual/Interface完成多态绑定，EnsureInitialized确保类已初始化，*sp=called并返回其入口地址。","ch":"第21章 Android虚拟机"},{"q":"Native Bridge是什么？解决什么问题？","a":"从Android 5.0开始Google官方提供的中间模块，解决平台指令集不匹配时运行非对应平台代码的问题(如x86平台运行ARM的so库)。它只起'框架'作用，具体填充内容由芯片厂商完成(如Intel的Houdini，闭源授权；另一方式是Qemu User Mode)。实现主体在/system/core/libnativebridge，native bridge库须暴露'NativeBridgeItf'接口(NativeBridgeCallbacks结构体，含isSupported、loadLibrary等)；开关是系统属性ro.dalvik.vm.native.bridge，通过-XX:NativeBridge=传给虚拟机。","ch":"第21章 Android虚拟机"},{"q":"Native Bridge的状态机与初始化流程？","a":"5个状态：kNotSetup→kOpened(dlopen native bridge库成功，dlsym找到NativeBridgeItf并版本校验)→kPreInitialized(PreInitializeNativeBridge，准备app code cache目录、bind-mount /proc/cpuinfo)→kInitialized(InitializeNativeBridge，在Runtime::Start的InitNonZygoteOrPostFork中执行)→kClosed(错误或关闭)。Zygote fork子进程时(ForkAndSpecializeCommon)判断：非system server、NativeBridgeAvailable、NeedsNativeBridge(指令集不匹配)、dataDir非空才需要，随后PreInitialize。加载库时dlopen失败且NativeBridgeIsSupported则用NativeBridgeLoadLibrary(callbacks->loadLibrary)。","ch":"第21章 Android虚拟机"},{"q":"JDWP调试体系中涉及哪些角色？","a":"①JDWP-Compliant Debugger：调试器，通常运行于PC端，借助JDWP Agent控制设备端目标程序；②JDWP Agent：与目标程序同运行于设备端虚拟机中，与调试器按JDWP规范传输数据；③目标程序：调试对象，受JDWP Agent控制；④ADBD：ADB在设备端的守护程序，负责开发平台与设备间通信。Java调试采用JDWP(Java Debug Wire Protocol)协议。","ch":"第21章 Android虚拟机"},{"q":"Android Java调试的完整连接过程？","a":"①ADBD启动时创建名为'\\0jdwp-control'的Unix Server Socket(init_jdwp/jdwp_control_init)，维护活跃JDWP进程列表_jdwp_list；②am start -D以调试状态启动应用，主动等待Debugger Attach；③Runtime在DidForkFromZygote中调用Dbg::StartJdwp(需gJdwpAllowed和IsJdwpConfigured两条件)创建JdwpState并pthread_create启动JDWP Thread，经JdwpAdbState::Accept连上jdwp-control并发送PID；④Debugger执行adb forward tcp:<port> jdwp:<pid>，ADBD用adb_socketpair建一对Socket，一个绑local socket、一个交给JDWP Thread；⑤Debugger与JDWP Thread握手(JDWP-Handshake)后按协议发送断点、单步等命令。","ch":"第21章 Android虚拟机"},{"q":"单步调试中Instrumentation和UpdateDebugger如何配合？","a":"调试时Art运行于解释器模式，解释器每执行一条字节码检查instrumentation->HasDexPcListeners，有则触发DexPcMovedEvent。Debugger初始化时通过Instrumentation::AddListener注册感兴趣的events(kMethodEntered/Exited、kDexPcMoved、kFieldRead/Written、kExceptionCaught等)。Dbg::UpdateDebugger判断是否命中'兴趣点'：IsBreakpoint查断点，SingleStepControl(线程相关)比较堆栈深度(GetStackDepth)和DexPc判断StepInto/Over/Out，命中则PostLocationEvent：向IDE发JDWP消息并按Suspend Policy决定是否挂起线程。","ch":"第21章 Android虚拟机"},{"q":"JDWP的transport/server/suspend/address配置含义？","a":"transport：dt_socket(TCP/IP，模拟器常用)或dt_android_adb(USB经ADB，真机)；server：y表示VM作为Server等待debugger连接，n则主动连接debugger；suspend：y表示VM执行程序代码前先挂起等待debugger连接；address：server=n时为hostname:port，server=y时可只有port，port为0则从8000开始尝试监听(失败依次8001等)。ADB transport实际都用server=y。","ch":"第21章 Android虚拟机"},{"q":"run-as在Native调试中起什么作用？","a":"Native调试靠ptrace，需要特殊权限。run-as如同'门卫'：让<command>以指定包名(package)的User ID运行，从而有权限访问应用私有目录。实现要点：①只有shell或root可调用；②通过capset赋予自身CAP_SETUID/CAP_SETGID能力，再setresgid/setresuid将uid/gid设为目标应用；③目标不能是System Package且必须android:debuggable=true；④chdir到应用data目录后execvp执行命令。调试时用它创建lldb目录、部署并启动lldb-server监听Unix Socket。","ch":"第21章 Android虚拟机"},{"q":"如何用GDB调试Art虚拟机？","a":"①准备GDB Client/Server、Symbols(位于prebuilts/gcc/linux-x86对应平台目录)；②将gdbserver推送到设备；③ps查找目标进程PID(被调试对象是加载libart.so的app_process)；④gdbserver :1234 --attach [PID]；⑤adb forward tcp:1234 tcp:1234端口映射；⑥Host端arm-eabi-gdb中file指定app_process、target remote :1234连接，并用set solib-absolute-prefix/solib-search-path设置带调试符号的库路径；⑦按文件行号(b art_method.cc:370)或带Namespace的函数名设断点调试，也可调试汇编。","ch":"第21章 Android虚拟机"},{"q":"Android系统主要从哪些角度保障安全性？","a":"①内核层：利用Linux Kernel安全机制，如DAC（UGO）、SELinux（SEAndroid）、进程隔离（Process isolation）、User-based Permission Model、可扩展安全IPC；②所有应用强制运行在自己的Sandbox中（每个应用有Unique UID）；③严格的进程间通信（IPC）安全控制；④应用程序签名；⑤Permission权限机制。此外Android Security Team每月提供安全更新包给Nexus及各设备厂商。","ch":"第22章 Android安全机制透析"},{"q":"什么是DAC？UGO模型和SUID/SGID权限位的作用是什么？","a":"DAC（Discretionary Access Control）即自主访问控制：客体属主可自主决定是否将访问权限授予其他主体；主体是进程/线程，客体是文件、端口、内存段等资源。UGO（User、Group、Others）是其典型表现，权限分r/w/x。SUID/SGID（Set User/Group ID）使执行该文件的进程的EUID/EGID被重设为文件属主的UID/GID，从而扩大权限——典型应用：su文件（-rwsr-sr-x）用于root提权；passwd属主为root且带SUID，使普通用户能修改/etc/shadow中的密码。","ch":"第22章 Android安全机制透析"},{"q":"什么是MAC？它与DAC的本质区别？","a":"MAC（Mandatory Access Control）强制访问控制：主体访问客体的权力取决于操作系统的具体控制规则，访问时由内核检验是否符合安全规则。与DAC的本质区别：MAC不允许用户制定或修改权限规则（无论有意或无意），所有权限策略由Security Policy Administrator统一控制。","ch":"第22章 Android安全机制透析"},{"q":"SELinux是什么？其架构核心和特点有哪些？","a":"SELinux（Security-Enhanced Linux）是负责安全管理的Linux内核模块，由美国国家安全局（NSA）开发，2000年12月发布首个GPL版本，Linux Kernel 2.6起合入主线。要点：①架构核心是MAC；②是对内核的一系列patch，渗透到内核各子系统形成保护网；③基于confidentiality（机密性）和integrity（完整性）建立信息隔离访问控制；④可配置、灵活。源码位于kernel/security/selinux。","ch":"第22章 Android安全机制透析"},{"q":"LSM（Linux Security Modules）是什么？基于它的安全项目有哪些？","a":"LSM是Linux 2.6内核标准的一部分（遵循GNU GPL），宗旨是帮助内核以灵活方式支持一系列第三方安全模块。基于LSM框架并获kernel官方批准的项目：①AppArmor（基于路径名的MAC，不需文件系统标签化）；②SMACK（Simplified Mandatory Access Control Kernel）；③Tomoyo（基于名称的MAC实现）；④SELinux。SELinux是Android采用的方案。","ch":"第22章 Android安全机制透析"},{"q":"SEAndroid在Android各版本中的发展历程？与DAC的关系（三重利剑）？","a":"历程：Android 4.3开始支持SELinux；4.4将SELinux变成强制（enforcing）模式；Lollipop（5.0）时所有服务和应用都得到SELinux全面保护。可用adb getenforce查看状态；内核参数带androidboot.selinux=permissive时违规只记log不禁止。关系：SEAndroid与DAC（UGO）是\"与\"的关系，任何核心资源访问需同时符合两者控制，构成两堵城墙；上层应用还受Permission机制约束，合称安全保护\"三重利剑\"。","ch":"第22章 Android安全机制透析"},{"q":"Android Permission机制如何运作？新权限如何兼容旧应用？","a":"应用默认运行在Sandbox中无权访问资源，需在AndroidManifest.xml中用<uses-permission>显式声明（如android.permission.INTERNET）。安装时PackageManagerService扫描APK提取声明并保存归类；未授权访问会抛Security
