Exception；运行过程中已申请权限不再询问用户（避免骚扰）。Android M后引入Runtime Permission，敏感权限需运行时动态请求。兼容性：当老应用targetSdkVersion低于该权限出现时的API等级，系统自动为其授权（如API 3以下无需WRITE_EXTERNAL_STORAGE）。","ch":"第22章 Android安全机制透析"},{"q":"以FileOutputStream写文件为例，Permission如何落实到内核层（SDCARD控制）？","a":"调用链：FileOutputStream.write→IoBridge.write→Libcore.os.write（Libcore.os是BlockGuardOs类型静态变量，包装Posix）→Posix.write→native函数writeBytes进入本地层。BlockGuardOs.write先调BlockGuard.getThreadPolicy().onWriteToDisk()做StrictMode检查（甄别磁盘读写、网络访问、性能问题）。Android 6.0之前：声明WRITE_EXTERNAL_STORAGE的应用其Groups含AID_SDCARD_RW(1015)从而获得SDCARD写能力（cat /proc/<pid>/status可查看）；6.0后由Runtime Permission决定。","ch":"第22章 Android安全机制透析"},{"q":"Android中进程的UID/GID如何分配？有哪些关键UID值？","a":"Android无用户登录概念，但主体仍是进程：进程的UID/GID由PackageManagerService分配，在APK安装之初确定，且每个APK被赋予不同UID（Android特色的Sandbox）。关键UID：ROOT_UID=0，SYSTEM_UID=1000，PHONE_UID=1001，BLUETOOTH_UID=1002，LOG_UID=1007，WIFI_UID=1010，MEDIA_UID=1013，VPN_UID=1016，DRM_UID=1019，NFC_UID=1027，SHELL_UID=2000；应用UID区域为FIRST_APPLICATION_UID(10000)~LAST_APPLICATION_UID(19999)。","ch":"第22章 Android安全机制透析"},{"q":"SEAndroid的安全标签（Label）格式是什么？各字段含义？","a":"格式：user:role:type:mls_level。①User：目前可选值只有\"u\"；②Role：主体为r，客体为object_r（\"role r types domain\"表示与domain关联）；③Type：超过130种，如device type、process type（又称domain）、file system type、network type、IPC type等；④Security level（MLS）：格式sensitivity[:category list][-sensitivity[:category list]]。4个属性中只有Type是决定安全策略执行结果的最重要参数，故SEAndroid又称Type Enforcement（.te文件后缀由来）。","ch":"第22章 Android安全机制透析"},{"q":"SEAndroid相关核心源码目录及关键策略文件有哪些？","a":"目录：/system/sepolicy（安全策略源文件，多为.te）、/system/sepolicy/tools（编译策略工具）、/external/libselinux（生成libselinux动态库）；厂商自定义te多在/device/[manufacturer]/device-name/sepolicy。关键文件：file_contexts（编译期及运行时为文件、设备节点、socket规划标签，新标签需重编image或restorecon生效）；genfs_contexts（为proc、vfat等不支持扩展属性的文件系统加标签）；property_contexts（系统属性标签，init启动或selinux.reload_policy=1时加载）；mac_permissions.xml（MMAC）；seapp_contexts。","ch":"第22章 Android安全机制透析"},{"q":"mac_permissions.xml和seapp_contexts的作用及读取时机？","a":"mac_permissions.xml：定义Middleware MAC policy（MMAC），根据应用签名及包名（可选）为其分配seinfo标识，在system_server启动时被加载。seapp_contexts：用于为App进程和/data/data文件夹指定标签，其中将seinfo作为key决定给某些App分配特殊标签。读取时机：①当一个App在zygote进程中被启动时；②当installd启动时；③当selinux.reload_policy属性被置为1时。","ch":"第22章 Android安全机制透析"},{"q":"SEAndroid策略（TE文件）的基本格式？attribute的作用？","a":"基本格式：allow domains types:classes permissions。①Domain：标识单一进程或一系列进程；②Type：标识客体（文件、Socket等）；③Class：被访问客体的具体种类（如chr_file、unix_stream_socket）；④Permission：被允许的操作（读、写等）。可用attribute（属性）指定domain或Type，系统自动将attribute解析成具体的domains和Types，如\"allow domain null_device:chr_file { open };\"（null_device标识/dev/null）。策略文件用M4语言，支持预定义宏（net_domain、binder_use、binder_call等）。","ch":"第22章 Android安全机制透析"},{"q":"如何在Android系统中自定义SEAndroid安全策略的典型步骤？","a":"Step1内核开启SELinux（CONFIG_SECURITY_SELINUX=y）；Step2内核启动参数加androidboot.selinux=permissive；Step3以permissive模式启动，用adb shell su -c dmesg | grep denied | audit2allow收集denials；Step4评估avc: denied日志；Step5鉴别需加Label的设备/新增文件；Step6用*_contexts文件为客体加标签；Step7为init启动的所有services分配独立domain（可从init.<device>.rc、dmesg警告、ps -Z | grep init排查）；Step8在BoardConfig.mk中为BOARD_SEPOLICY_*赋值；Step9检查mount的文件系统标签或context=mount选项；Step10书写安全策略。","ch":"第22章 Android安全机制透析"},{"q":"书写SEAndroid策略的注意事项及avc denied日志如何解读？","a":"注意事项：不删除已有策略文件只按需新增；为新daemons新增策略；尽量使用已定义domain；init启动的进程要有独立domain；Not to do：不创建不兼容策略、不允许终端用户/MDM自定义策略、不添加后门。avc日志示例：avc: denied { connectto } ... scontext=u:r:shell:s0 tcontext=u:r:netd:s0 tclass=unix_stream_socket——{ connectto }为发生的行为，scontext是主体安全上下文，tcontext是客体安全上下文，tclass是客体类，comm指明denial发生时执行的语句；所有SELinux log都含\"avc:\"字符串。","ch":"第22章 Android安全机制透析"},{"q":"adbd.te中noatsecure等规则的含义？","a":"①allow adbd shell:process noatsecure：不对shell环境做净化（sanitize）、不打开shell的fds——atsecure与ELF auxiliary vectors的AT_SECURE参数相关（告诉ELF动态链接器unset潜在威胁环境变量如LD_PRELOAD），noatsecure即关闭环境净化；②allow adbd self:capability { setuid setgid }：允许adbd对shell执行setuid/setgid；③net_domain(adbd)：创建并使用网络socket；④adb_device对应/dev/android_adb.*（file_contexts中定义）；⑤devpts允许虚拟tty；⑥shell_data_file对应/data/local/tmp的pull/push；⑦anr_data_file只读traces.txt；⑧binder_call(adbd, surfaceflinger)允许binder IPC；⑨adb_keys_file读取/data/misc/adb/adb_keys。","ch":"第22章 Android安全机制透析"},{"q":"init进程如何加载SELinux策略？其安全上下文如何关联（两阶段）？","a":"init的main调用selinux_initialize(is_first_stage)：先设置selinux_callback（union结构，含SELINUX_CB_LOG/AUDIT/VALIDATE/SETENFORCE/POLICYLOAD），此处设log和audit回调。策略加载：selinux_android_load_policy()先mount \"/sys/fs/selinux\"（set_selinuxmnt保存挂载点），打开sepolicy_file（N前为数组\"/sepolicy\"和\"/data/security/current/sepolicy\"，N后仅\"/sepolicy\"），fstat+mmap后由security_load_policy将策略写入selinux_mnt+/load节点送入内核；失败则security_failure()重启进recovery；N版本用load_successful禁止动态重加载。两阶段：Stage1运行在kernel domain加载策略，随后re-exec加\"--second-stage\"参数；Stage2运行于init domain，由restorecon(\"/init\")按file_contexts关联上下文u:object_r:init_exec:s0。","ch":"第22章 Android安全机制透析"},{"q":"应用程序文件（/data/data）如何关联SEAndroid安全上下文？","a":"由PackageManagerService和installd在安装过程中完成。PMS调用installer.java的install接口（参数含uuid、name、uid、gid、seinfo），seinfo由PMS根据mac_permissions.xml（应用签名与seinfo映射）获取。installd响应安装请求，调用selinux_android_setfilecon为应用data目录设置上下文：is_selinux_enabled()判断开启→getfilecon获取当前上下文（默认继承父目录）→seapp_context_lookup(SEAPP_TYPE,...)查找新Type→security_check_context校验→若新旧context不同（strcmp≠0）则setfilecon设置新环境。","ch":"第22章 Android安全机制透析"},{"q":"Root的名词与动词含义？adbd提权原理是什么？","a":"名词：Root是操作系统最高权限用户（Superuser），理论上对任何文件有\"生杀予夺\"大权（开启SEAndroid的设备上受限）。动词：指获取Root权限。adbd提权原理：adbd以root启动后调用should_drop_privileges判断是否降权——未定义ALLOW_ADBD_ROOT直接降权；ro.kernel.qemu=1（模拟器）返回0不降权（故模拟器默认root）；真机ro.secure=1则降权，但ro.debuggable=1且service.adb.root=1时例外。两条提权思路：①让真机上该函数返回0；②令降权操作失败——制造大量shell用户僵尸进程后强制结束adbd迫其重启，因内核限制用户进程数，切换shell身份失败，adbd保持root运行。","ch":"第22章 Android安全机制透析"},{"q":"获取Root权限后的典型操作？如何检测设备是否被Root？","a":"Root后步骤：Step1将su程序放置到/system/bin下；Step2将Superuser.apk（或其他管理程序）放到/system/app下；Step3管理权限申请（最著名的Root管家是Superuser，其他应用提权需其批准）。检测方法：①读取/system/bin/或/system/xbin目录下是否存在su程序；②直接执行su并观察结果：Runtime.getRuntime().exec(\"su\")。两种方法都可能缺陷，不能保证100%准确。其他Root手段：栈溢出、\"0地址\"特殊函数调用、带Root的ROM包（Android开源易制作）。","ch":"第22章 Android安全机制透析"},{"q":"APK加固需覆盖哪些场景？防止二次打包的典型逻辑？","a":"场景：防止二次打包、反编译、篡改、调试、窃取、注入（背景：Android只要求自签名不需权威认证，易被解析篡改后重打包）。防二次打包逻辑：Step1程序启动；Step2获取当前APK签名；Step3获取正确的（原始）签名；Step4判断二者是否有变化。原理：被篡改的APK必须重签名才能运行，故检测签名差异即可侦查篡改。细节需斟酌：验证逻辑在何处启动、如何获取正确签名、校验代码本身是否会被破解篡改。","ch":"第22章 Android安全机制透析"},{"q":"dex加密加壳的典型步骤？如何防调试/防模拟器？加固技术特点？","a":"加壳步骤：①将原classes.dex加密（encrypted.data）转移到assets或resource；②对程序加壳；③运行时先执行壳程序（通常通过JNI和so动态库实现）加载encrypted.data；④壳解密；⑤执行解密后的dex。防调试：从android:debuggable=\"true\"等条件入手并在代码中二次检查防篡改。防模拟器：利用差异检测——模拟器IMEI非真实设备号、/dev下有/dev/socket/qemud、build信息差异（BRAND为generic、HARDWARE为goldfish）。加固特点：都在应用进程内实现、受限于系统；常用反射做\"非法\"操作（N后收紧）；必须遵循标准应用生命周期，保证系统访问函数前已解密就绪。","ch":"第22章 Android安全机制透析"},{"q":"Gradle与Ant、Maven等前辈工具相比，吸收了哪些优势？","a":"Gradle在Ant、Maven、Ivy基础上发展：提供Ant式的灵活性，Ivy式的依赖管理，Maven式的智能默认约定，Git式的速度与hashing，以及Groovy元编程能力（best-of-breed组合）。但学习曲线被评价为“非常陡峭”，主要因为Groovy语言和DSL对初学者陌生，官方建议提供更多纯Java的API与示例来降低门槛。","ch":"第23章 IDE和Gradle"},{"q":"Groovy与Java的关系如何？Gradle脚本必须遵循什么准则？","a":"Groovy与Java语法类似，可达到二进制级别兼容——对JVM而言两者无区别，Groovy可直接使用Java的各类API并与之混合编程。核心准则：Gradle脚本是基于Groovy语言的，因而它一定需要遵循Groovy的语法。理解build.gradle中看似配置项的写法（如buildscript、allprojects）其实都是函数调用加闭包参数。","ch":"第23章 IDE和Gradle"},{"q":"Groovy闭包（Closure）的基础语法是什么？隐含参数it指什么？","a":"语法规则：{ [closureParameters -> ] statements }。闭包用一对“{}”把代码块框起来作为整体对象处理，closureParameters用“->”与代码实现分隔，为可选（[]表示可选）。无显式参数时Groovy提供隐含参数“it”，如{ println it }等价于{ it -> println it }。闭包可带多个参数（如{ String x, int y -> ...}）、包含多条语句或完全不使用参数。闭包可赋值给变量并像函数一样调用。","ch":"第23章 IDE和Gradle"},{"q":"什么是Groovy的Command Chains特性？有什么注意事项？","a":"Command Chains允许函数调用省略圆括号：如turn(\"left\")可写为turn left；连续调用间还可省略“.”，turn(\"left\").then(\"right\")可写为turn left then right。注意点：当链中某些函数无参数时会产生歧义，如select(all).unique().from(names)需写成select all unique() from names（无参函数需加括号），风格不统一易混乱，使用时要谨慎，避免得不偿失。","ch":"第23章 IDE和Gradle"},{"q":"Groovy的运算符重载在Gradle脚本中如何体现？举例说明。","a":"Groovy中不少运算符被映射为对象的常规函数调用：a+b 解释为 a.plus(b)；a-b 解释为 a.minus(b)；a[b]=c 解释为 a.putAt(b,c)。Gradle中“<<”即左移运算符被用于向task追加action，如 task helloWorld << { println 'hello, world' }；也可用多个<<为同一task添加多个action，执行gradle multiAction时依序执行所有action并打印“ This is multiAction”。","ch":"第23章 IDE和Gradle"},{"q":"Gradle的生命周期分为哪三个阶段？各阶段做什么？","a":"三阶段：(1) Initialization——定位需要处理的build文件，判断单工程还是多工程，找出相应build文件作为下阶段输入；(2) Configuration——解释执行build脚本（相当于一个小工程），目标产物是由task组成的DAG图（有向无环图，类似Make先决定Target依赖关系），并回调hook方法；(3) Execution——基于DAG严格按task依赖关系执行，所有build活动（编译源码、拷贝文件等task中的action）在此阶段执行，也可设置hook。因此Gradle编译过程本身不会很快。","ch":"第23章 IDE和Gradle"},{"q":"Gradle命令行语法及常用option有哪些？--daemon的优缺点是什么？","a":"语法：gradle [option...] [task...]。常用option：-h/--help打印帮助；-c/--settings-file指定settings文件；-b/--build-file指定build文件；-g/--gradle-user-home指定user home目录；-d/--debug调试模式；--daemon使用守护进程编译；--gui打开图形界面；--parallel多线程并行编译；-x/--exclude-task排除task。--daemon优点是非首次编译时加快速度，缺点是持续运行可能引发不可预期的编译问题（原理与Jack Server类似）。gradle task命令可查询工程所有可用任务。","ch":"第23章 IDE和Gradle"},{"q":"gradle.bat做了什么？Gradle的运行环境依赖什么？","a":"Gradle发行版bin目录下，Windows对应批处理文件gradle.bat。因为Gradle基于Groovy语言，其运行环境依赖JVM，所以gradle.bat的主要任务是初始化虚拟机，然后通过java命令启动核心类org.gradle.launcher.GradleMain来运行Gradle（带上CLASSPATH、JAVA_OPTS、GRADLE_OPTS等参数）。由此也可理解Gradle插件可用任何能编译成JVM字节码的语言编写（Groovy、Scala、Clojure等）。","ch":"第23章 IDE和Gradle"},{"q":"Gradle Wrapper是什么？为何要随工程check in到版本库？","a":"Wrapper是“包装纸”式的封装：调用者只见统一接口，内部实现由Wrapper决定，因此开发机器不必预先安装Gradle，Wrapper会按需连网下载Gradle版本完成编译。工程根目录含gradlew（Linux等平台）和gradlew.bat（Windows）。应随工程check in到version control的好处：(1)用户总能使用与工程最匹配的Gradle版本编译；(2)持续集成服务器上无需预先安装配置Gradle。IDE中若删除Gradle目录，Wrapper配置项会变为“not configured for the current project”。","ch":"第23章 IDE和Gradle"},{"q":"Gradle的cache机制是什么？IntelliJ中Offline work和Service directory path的含义？","a":"Gradle程序本身和脚本声明的依赖库在构建时需本地存在，缺失时会从开发者声明的jcenter、maven仓库下载；为避免重复下载，Gradle在本地建立cache保存这些文件。IntelliJ GUI中：Offline work让Gradle不连接网络——若依赖在本地齐全仍可编译，否则报错提示缺失文件；Service directory path是缓存文件保存目录（Windows下通常在用户目录）。把一台机器的Service directory path内容复制到另一台无网络机器的相应位置，后者也可正常构建。","ch":"第23章 IDE和Gradle"},{"q":"Gradle插件有哪几种编写方式？各自适用范围？","a":"三种方式：(1) Build Script——直接在build脚本中编写，Gradle自动加入classpath，缺点是只能在该脚本中使用，适合代码少且不需跨工程共用；(2) buildSrc工程——Gradle自动处理[Project_root]/buildSrc/src/main/groovy下的源码并加入classpath，本应用工程的所有build脚本可用，但仅限本工程范畴；(3) Standalone project——独立工程实现，插件以JAR包存在，支持一个包含多个插件，适合应用广泛的插件（如android plugin）。","ch":"第23章 IDE和Gradle"},{"q":"自定义Gradle插件需要实现什么接口？apply函数如何工作？","a":"用户自定义插件需实现Plugin接口（如class GreetingPlugin implements Plugin<Project>）。在build脚本中通过apply plugin: [PLUG_IN]引入后，Gradle会调用该插件的apply函数。apply函数的参数是工程对应的Project实例，这是插件参与到工程中的“桥梁”——例如在apply中通过project.task('hello') << { ... }添加名为hello的task。复杂插件都是在这一基础上构建的。","ch":"第23章 IDE和Gradle"},{"q":"Android Studio的Multi-project Gradle结构包含哪些文件？settings.gradle的作用？","a":"包含：Project级别的build.gradle（面向整个工程）、各module级别的build.gradle、以及settings.gradle。Project和Module是IntelliJ平台管理工程文件的两个概念，类似Eclipse的WorkSpace和Project（另有Facet、SDK等组成Project Structure）。settings.gradle用include包含所有要编译的子项目，如include ':app'，多个子项目以“,”分隔。Gradle在Configuration阶段会先处理Project Level的脚本，再处理各子项目。","ch":"第23章 IDE和Gradle"},{"q":"build.gradle中buildscript和allprojects脚本块的含义？对应的delegate是什么？","a":"build script由statements（函数调用、属性赋值、局部变量定义）+script blocks（以闭包为参数的函数调用，看起来像配置项以提高可读性）组成。buildscript实际等价于project.buildscript，属于org.gradle.api.Project的函数，其闭包以ScriptHandler对象为delegate，故其中可用repositories、dependencies（都是ScriptHandler定义的函数）；allprojects为本项目及所有子项目做配置，闭包的delegate是全局Project变量。Project级buildscript中classpath 'com.android.tools.build:gradle:1.0.0'指明android plugin的实现jar包，缺失则无法生成DAG而报错。","ch":"第23章 IDE和Gradle"},{"q":"Project的核心成员函数及其closure的delegate分别是什么？","a":"buildscript(closure)：配置编译脚本classpath，delegate为ScriptHandler；allprojects(closure)：为本项目和所有子项目配置，delegate为全局Project变量；ant(closure)：在build文件中执行ant任务，delegate为AntBuilder；artifacts(closure)：配置published artifacts，delegate为ArtifactHandler；configurations(closure)：配置dependency configuration，delegate为ConfigurationContainer；dependencies(closure)：配置依赖关系，delegate为DependencyHandler；repositories(closure)：配置仓库，delegate为RepositoryHandler。jcenter()、mavenCentral()是常用仓库函数。","ch":"第23章 IDE和Gradle"},{"q":"module级build.gradle中android块的关键配置项有哪些？插件如何引入？","a":"通过apply plugin: 'com.android.application'引入Android插件（对应jar为com.android.tools.build:gradle:1.0.0，apply是org.gradle.api.Project的函数）。android块中的配置项其实是函数调用：compileSdkVersion（如21）、buildToolsVersion（如\"21.1.1\"）、defaultConfig块（applicationId、minSdkVersion、targetSdkVersion、versionCode、versionName）、buildTypes块（release中minifyEnabled、proguardFiles与getDefaultProguardFile('proguard-android.txt')）。dependencies块用compile fileTree(dir: 'libs', include: ['*.jar'])和compile 'com.android.support:appcompat-v7:21.0.2'声明依赖。Android插件源码可通过repo init -b gradle_2.2.0 && repo sync获取。","ch":"第23章 IDE和Gradle"},{"q":"为什么需要软件版本管理系统？它要解决哪些问题？","a":"早期软件由个人或少数人开发，源码管理依赖个人素养、主观随意。随着软件复杂度与源码量指数级增长（Linux从0.11版的2万多行到2.6.0版近6百万行；Windows 7开发人员超2000人且分布世界各地），必须解决：项目分工、人员交互协调、快速集成个人工作成果、处理多人同时修改同一文件的冲突、文件历史追踪与回退、以及源文件/版本的信息记录。Android系统首选Git做版本管理，并额外提供Repo小工具简化使用。","ch":"第24章 软件版本管理"},{"q":"Git的起源背景？在Windows下如何安装？","a":"Git与Linux“系出同门”，都出自Linus Benedict Torvalds之手，起初用于取代Bitkeeper（2005年与Linux社区脱离关系，恩怨直接触发Git开发）来维护Linux Kernel，因此对Windows支持不佳，后借助msysgit等工具保证Windows下运行。Linux安装两种方式：源码编译安装（make prefix=/usr/local all && sudo make prefix=/usr/local install，依赖curl、zlib、openssl、expat、libiconv等）和包安装（yum install git-core或apt-get install git-core；Mac可用图形安装包或sudo port install git-core）。Windows安装：基于Cygwin，或直接安装msysGit（提供Bash和GUI两种界面）。","ch":"第24章 软件版本管理"},{"q":"git config的三个配置级别及优先级覆盖关系？","a":"三个级别：/etc/gitconfig系统级（对所有用户和项目有效，--system选项配置）；~/.gitconfig用户级（对当前用户有效，--global选项配置）；.git/config项目级（只对本项目有效，位于项目git目录中）。优先级类似C++继承关系：.git/config覆盖~/.gitconfig，后者又覆盖/etc/gitconfig。常用配置：git config --global user.name/email设置个人信息（鉴别提交者身份）；core.editor设置编辑器（如emacs）；merge.tool设置差异比较工具（如vimdiff，还支持kdiff3、tkdiff、meld、xxdiff等）；git config --list查看所有配置。","ch":"第24章 软件版本管理"},{"q":"集中式（CVCS）与分布式（DVCS）版本管理系统的本质区别？","a":"集中式（SVN、CVS）整个项目只有一个中央仓库，用户必须连上服务器才能提交，服务器故障可能导致开发停滞。分布式（Git）中每个开发者都拥有完整的本地仓库，提交可离线先提交到本地仓库，最后统一push到服务器，因此Git提交动作快、几乎瞬间完成。注意Git虽是分布式，但也可以以集中式方式工作（这也是常用工作流之一）；每个开发者还能将自己设为共享仓库成为“生产者”。不存在绝对优劣，应根据项目需求选择。","ch":"第24章 软件版本管理"},{"q":"git init后.git目录下各文件/目录的作用是什么？","a":".git目录结构：branches（新版本不再适用，一般空）；hooks（hooks脚本文件）；info（指定需要忽略的文件）；objects（存储Git的4个重要数据对象）；refs（分支指向的提交）；config（设置文件）；description（项目描述信息）；HEAD（指出当前在哪个分支）。新建本地仓库用git init；克隆已有仓库用git clone，如git clone git://android.git.kernel.org/kernel/common.git，支持git://、SSH、HTTP/S等多种传输协议。","ch":"第24章 软件版本管理"},{"q":"Git管理下的文件有哪几种状态？各自含义？","a":"四种状态：(1) untracked未跟踪——文件未纳入Git管理范畴；(2) unmodified未修改——已在Git管理下且相对上次提交无变化；(3) modified已修改——相对上次提交有变化且尚未暂存；(4) staged已暂存——只有stage后的文件才能在下一次commit中被提交，提交后又变回unmodified。后三种都属“已跟踪状态”。查询状态用git status；加入管理用git add（对目录会递归加入所有文件/子目录）；删除已add的文件用git rm（若只想解除管理关系而保留源文件，必须加--cached选项）。","ch":"第24章 软件版本管理"},{"q":".gitignore文件的作用和书写格式？","a":"项目常产生不需进入版本树的中间文件（如.o、log跟踪文件），但又不想每次git status都看到untracked提示。解决办法：在项目根目录创建名为“.gitignore”的文件记录不想被跟踪的文件。格式：以注释符号＃开头的行会被Git忽略；遵循标准的glob模式匹配。例如要忽略bin目录的所有文件，可写入“bin/”。再次执行git status后bin目录不再被追踪显示。","ch":"第24章 软件版本管理"},{"q":"git commit的关键点是什么？哪些文件会被提交？","a":"提交更新是把被修改的文件保存进本地仓库的重要动作，特别注意：只有被staged的文件才会被提交。命令格式git commit，可用-m <msg>直接给提交信息，否则Git会自动调用事先配置的文本编辑器（core.editor）让用户描述本次提交（为什么提交、有哪些更改等）。可用-a选项、--amend修补提交等。完成操作后Git提示最终提交结果。更多命令可通过man git或git --help学习。","ch":"第24章 软件版本管理"},{"q":"版本管理系统的抽象模型是什么？差异存储与全量存储各有什么优劣？","a":"核心任务是针对每个项目文件各个修改版本的统一有序管理。抽象图为三维立体图：x、y平面代表项目文件的构成及包含关系（目录/文件的树结构），z坐标代表每个文件的版本修改历史（v随每次修改递增），且是某一特定时刻的快照，随文件修改/新增/删除不断更新。存储策略：差异存储只保存版本间差异Δ=diff(v0.1,v0.2)，还原需再做差值运算，省空间但提取慢；全量存储完整记录每个版本（Git采用），提取指定版本快，但占存储空间——典型的“以空间换时间”，并带来Git分支管理的快速与便捷。","ch":"第24章 软件版本管理"},{"q":"Git的两种典型工作流：集成管理员工作流和司令与副官工作流？","a":"集成管理员工作流（Integration-Manager Workflow，常用于GitHub）：管理员维护公共主仓库；开发者克隆到本地并研发；将修改推送到自己的公共仓库；请管理员拉取；管理员获取修改、本地合并验证后推送到主仓库。司令与副官工作流（Dictator and Lieutenants Workflow）：多层级分而治之，只有司令员可向公共主仓库推送；普通开发者从主仓库获取代码并研发；副官将开发者修改合并入自己的分支；司令将副官分支合并入主分支并推送至主仓库。后者流程烦琐，适用于超大型项目（如Linux内核开发）。","ch":"第24章 软件版本管理"},{"q":"SHA-1是什么？Git利用它的哪些特性？","a":"SHA（Secure Hash Algorithm）是美国国家标准与技术研究院发布的安全散列算法系列，初始版本SHA-0于1993年诞生于美国国家安全局，因缺陷很快被SHA-1取代。SHA-1可从小于2^64位的信息产生160位摘要，用于数据完整性校验。理论特性：不可逆性（无法从摘要还原原始数据）；无碰撞性（理论上不发生碰撞，但数学概率上无法绝对避免）；摘要长度不变（输出恒为160位）。Git用SHA-1为对象产生唯一摘要值，对象的文件名即其内容的SHA-1散列值，而非项目中真正的文件名（真名存储在指向它的tree对象中）。","ch":"第24章 软件版本管理"},{"q":"Git的4个重要对象blob、tree、commit、tag分别是什么？","a":"(1) blob：存储文件内容，其文件名由内容做SHA-1运算得160位后，取前两个字符建子目录、剩余38个字符作文件名；Git保存整个修改后的文件内容而非版本差异。(2) tree：类似目录，通过SHA-1值指向blob和子tree，组织成无环树结构，是commit的基础。(3) commit：记录每次提交信息，包括指向的tree对象、author（修改者）、commiter（提交者，可与author不同，如管理员模式）、comment备注，非初次提交还有parent指向上一次提交，形成可追溯历史的链式结构，是Git分支管理快的本质保障。(4) tag：为冗长SHA-1提供便捷记忆（如域名之于IP），含object、type、tag名、tagger、message、signature信息，操作体现在.git/refs/tags中。查看命令：git cat-file -t/-p <OBJECT>、git show -s --pretty=raw。","ch":"第24章 软件版本管理"},{"q":"Git的三个区域是什么？分别对应什么物理存储？","a":"三区域：(1) 工作目录（Working Directory）——项目文件所在处，一般与.git目录同级，存放开发者可直接修改的文件；(2) 暂存区（Staging Area）——实为一个文件，对应.git目录下的index文件，记录下一次需要提交的文件信息，通过git add加入，使开发者能决定哪些文件提交、并可方便撤销；(3) 仓库（Repository）——本地仓库，即.git/objects下的对象文件，存储所有版本的项目文件内容。三者在物理上并非独立存储区域。objects下的松散对象可通过git gc打包压缩到/info和/pack目录，节省空间、提高处理效率、便于推送到远程。","ch":"第24章 软件版本管理"},{"q":"为什么说“Git中的分支只是一个指针”？HEAD文件的作用？","a":"Git分支的本质是一个指向某个commit对象的指针，这是Git分支的核心理念。默认项目处于master分支；分支是动态变化的指针，每次提交后指向当前分支的最后一个commit对象（其他分支的提交不受影响）。新建分支（git branch branch_basic）默认指向与master相同，只是复制了一个指针而非复制整个工程，故创建分支高效；git checkout branch_basic切换分支。当前工作分支由.git目录下的HEAD文件记录，内容如“ref: refs/heads/master”，带“*”号的分支即当前工作分支。删除分支git branch -d，重命名git branch -m。","ch":"第24章 软件版本管理"},{"q":"什么是“主干发布，分支开发”模式？","a":"业界广泛使用的分支管理方式，核心思想：将变化的部分（新特性、问题修复等）通过拉出分支的方式独立开发，保持主干稳定。好处：发布新版本时管理员只需从主干上取代码；新特性或问题修复在验证后合并到主分支。类似地还有“主干开发，分支发布”模式。两者各有优缺点，需根据不同项目诉求取舍。无论模式多复杂，版本管理系统的核心工作仍是“针对每个项目文件各个修改版本的统一有序管理”这一抽象模型。","ch":"第24章 软件版本管理"},{"q":"Android模拟器基于什么实现？QEMU有哪两种工作模式？","a":"Android模拟器基于QEMU（开源项目，作者Fabrice Bellard，另一知名项目是Ffmpeg）。两种工作模式：①全系统模式：模拟完整系统，包括若干处理器和外围设备（支持PC/x86、ISA PC、PREP、Sun4m/Sun4u等Sparc、MIPS Malta、ARM Integrator/CP等）；②用户模式：在一个CPU上运行针对另一CPU编译的程序（支持x86、PowerPC、ARM、MIPS、Sparc、Alpha、ColdFire、CRISv32、MicroBlaze等）。","ch":"第25章 系统调试辅助工具"},{"q":"VMM按运行环境如何分类？虚拟化支撑方法有哪几种？","a":"提供虚拟化技术的软件称Hypervisor或VMM（Virtual Machine Monitor），是Guest Software的控制监督者。按运行环境：①Native/Bare Metal型：直接运行在底层硬件上，不需要底层OS支持，如Oracle VM Server for SPARC、KVM、VMWare ESX/ESXi、Microsoft Hyper-V；②hosted型：安装于其他操作系统之上，如VirtualBox、VMWare Workstation、Bhyve。支撑方法：①全虚拟化：Guest OS无需修改，提供完整硬件模拟，难点是特权指令执行（Oracle VM、KVM、QEMU等）；②半虚拟化：需Guest OS按接口做部分修改，速度更快（Xen、Hyper-V）；③硬件辅助虚拟化：借助专门硬件支持改善前两者不足，主流产品均支持。","ch":"第25章 系统调试辅助工具"},{"q":"QEMU如何安装编译？常用标准选项和调试选项有哪些？","a":"安装：apt-get install qemu（Debian/Ubuntu）、yum install qemu（RedHat）、emerge qemu（Gentoo）；源码：git clone git://git.qemu.org/qemu.git后./configure、make、make install。标准选项：-machine选机器、-cpu选CPU、-smp设CPU数、-m设内存（默认128MB）、-hda~-hdd/-cdrom/-sd指定存储、-boot设启动顺序、-kernel指定内核映像、-initrd设置initial ram disk、-enable-kvm使能KVM。调试选项：-serial dev指定串口、-monitor dev转向monitor、-singlestep单步、-S不启动CPU、-gdb dev等待gdb连接、-s（=-gdb tcp::1234）、-d输出log到/tmp/qemu.log、-L/-bios设置BIOS、-no-reboot、-loadvm以保存状态启动。","ch":"第25章 系统调试辅助工具"},{"q":"Android模拟器命令行格式及关键选项？","a":"格式：emulator -avd <avd_name> [-<option> [<value>]] ... [-<qemu args>]，-avd必需。关键选项：磁盘类：-cache、-data、-ramdisk、-sdcard、-wipe-data、-nocache；系统类：-cpu-delay（0~1000）、-gps/-radio重定向字符设备、-nojni、-qemu（传参给QEMU，必须放最后）、-qemu -enable-kvm（KVM加速）、-gpu on（GPU图形加速）、-timezone；UI类：-dpi-device（默认165）、-no-window、-scale、-noskin；网络类：-dns-server、-http-proxy、-netdelay、-netspeed（默认full）、-netfast（即-netspeed full -netdelay none）；调试类：-logcat、-shell（root权限shell）、-show-kernel打印内核信息、-trace代码追踪、-verbose（等价-debug-init）。","ch":"第25章 系统调试辅助工具"},{"q":"Emulator Console是什么？如何连接？常用命令有哪些？","a":"每个模拟器占两个端口：一个与adb通信，另一个是控制台专用端口（故console端口号为偶数）。连接：telnet localhost <console_port>（端口可用adb devices查询），命令格式：命令<空格>子命令，如sms send 12345 content。常用命令：avd（name/status/start/stop/snapshot截屏）；event（send/types/codes发送硬件事件，自动化测试常用）；geo（fix发GPS经纬度、nmea发NMEA句子）；gsm（call模拟来电、accept/busy/cancel/hold、data/voice改GPRS状态）；network（status/speed/delay/capture抓包）；power（ac/status/health/capacity电池充电状态）；sms（send/pdu）；sensor（status/get/set管理加速度计、罗盘等传感器）；redir（list/add/del端口转向）；qemu monitor；kill关闭模拟器。","ch":"第25章 系统调试辅助工具"},{"q":"如何为Android模拟器添加串口功能？","a":"QEMU本身支持串口模拟但Android未继承，可通过-qemu传参实现：Step1启动带串口的模拟器，如Windows下：\"...emulator\" -avd Device_Android4.3 -qemu -serial COM1（也可用工具创建虚拟串口对COM3/COM4，emulator用COM3、串口分析工具用COM4实现通信调试）；Step2在/dev下找新串口名，按/dev/ttySN编号递增分配（如已有ttyS0、ttyS1则新串口为/dev/ttyS2），并chmod 777 /dev/ttyS2设置权限；Step3用应用程序或开源项目android-serialport-api测试，效果与真机串口操作无区别。","ch":"第25章 系统调试辅助工具"},{"q":"名为\"Android\"的命令行工具的主要功能和常见用法？","a":"三大功能：①管理AVD（Android Virtual Devices）；②管理Android项目；③管理Android SDK平台、插件、文档等。语法：android [global options] action [action options]。全局选项：-s（silent）、-h（帮助）、-v（verbose）。常见动作：create avd（-n名称、-t targetID、-c SD卡、-p路径、-s皮肤）、delete/move/update avd；create/update project（-a默认Activity名）、create/update-test-project、create/update-lib-project；avd启动AVD管理器、sdk启动SDK管理器。AVD硬件属性在config.ini中配置：hw.ramSize默认96M、hw.touchScreen/hw.keyboard/hw.gps默认yes、hw.camera默认no、hw.lcd.density默认160、disk.cachePartition.size默认66MB。","ch":"第25章 系统调试辅助工具"},{"q":"ADB是什么？通用命令格式和设备状态查询？常用命令？","a":"ADB（Android Debug Bridge）是快速建立与模拟器或真机通信渠道的命令行调试桥梁，位于SDK的platform-tools目录。通用格式：adb [-d|-e|-s <serialNumber>] <command>。因是多对多架构需指定目标：-d只发给唯一USB设备、-e只发给唯一模拟器实例、-s <serialNumber>发给指定设备。adb devices查询所有设备，格式[serialNumber][state]，state有offline（未连接或无响应）和device（正常连接）。常用命令：connect/disconnect（TCP/IP连接，默认端口5555）、logcat、bugreport（打印dumpsys/dumpstate/logcat）、jdwp、install、pull、push、get-serialno、get-state、wait-for-device（暂停直到设备可用，但对需设备完全启动才成功的命令可能无效）、start-server、kill-server、shell。","ch":"第25章 系统调试辅助工具"},{"q":"如何通过Wi-Fi（TCP/IP）实现ADB连接？","a":"前提：研发机与目标设备可网络互访（一般同一局域网）。步骤：①设备仍通过USB连接时执行adb tcpip <port>，将目标设备设为TCP/IP监听状态；②拔除USB连接；③执行adb connect <host>[:<port>]（host为目标机IP，port与tcpip设置的监听端口一致）。此后ADB Server与设备上的ADBD建立TCP/IP连接，DDMS中目标机显示online，后续操作与USB连接无差别。","ch":"第25章 系统调试辅助工具"},{"q":"ADB框架由哪三部分组成？为什么每个设备占两个端口号？","a":"①ADB Client：运行在研发机（PC）上，发送命令时启动；②ADB Server：也运行在研发机上（与普通C/S不同），任务：管理研发机与目标设备/模拟器的连接状态（多对多的管理者）、处理ADB Client的连接请求，绑定TCP 5037端口，并主动扫描有效设备（端口范围5555~5585的奇数号）；③ADB Daemon（adbd）：后台进程运行在目标设备/模拟器中，与ADB Server通信完成命令请求。端口：每个模拟器/设备需要两个端口号分别用于console和adb连接，例如下一个emulator分配5556（console）和5557（adb）。","ch":"第25章 系统调试辅助工具"},{"q":"ADB源码如何区分Host和Daemon？ADB Server如何被启动？","a":"源码在/system/core/adb/，三者未分开源文件而是用宏区分，高度复用。main函数通过ADB_HOST宏判断：为1时（LOCAL_CFLAGS含-DADB_HOST=1，产物adb）调用adb_commandline解析用户命令；为0时（产物adbd）处理recovery参数、start_device_log后调用adb_main(0, DEFAULT_ADB_PORT)。Server启动：argv[0]带\"server\"或\"fork-server\"参数（Client孵化Server的特殊标志）时is_daemon置1；Client调用launch_server——Windows用CreateProcess以\"adb fork-server server\"参数启动；Linux下fork子进程后execl(path,\"adb\",\"-P\",port,\"fork-server\",\"server\",NULL)复用adb主体，如同\"瑞士军刀\"。","ch":"第25章 系统调试辅助工具"},{"q":"adb_connect的处理流程是怎样的？","a":"①开始执行；②先查询ADB Server版本号（确认是否有Server运行及版本是否符合要求）；③~⑤若Server已运行但版本不符则强制结束并重启；⑥启动新ADB Server（Linux下fork子进程+execl复用adb主体）；⑦Server启动后Client开始连接；⑧socket_loopback_client(__adb_server_port, SOCK_STREAM)连接127.0.0.1的Server端口；⑨⑩判断连接成功与否；⑪先发送命令数据的字节数（4字节十六进制）再发送命令数据；⑬由adb_status判断：Server返回\"OKAY\"成功、\"FAIL\"失败。","ch":"第25章 系统调试辅助工具"},{"q":"adbd服务在init.rc中如何定义和启动？","a":"init.rc中定义：service adbd /sbin/adbd，class core，socket adbd stream 660 system system，带disabled选项（告诉系统不在此直接启动，由其他地方显式调用），seclabel u:r:adbd:s0。启动条件区分：模拟器情况下（on property:ro.kernel.qemu=1）直接start adbd；真机则通过init.<platform>.usb.rc中的property triggers控制。","ch":"第25章 系统调试辅助工具"},{"q":"ADB Client与ADB Server间的通信协议流程？","a":"Client发请求：①通过本机127.0.0.1的5037端口（可用ANDROID_ADB_SERVER_PORT自定义）建立连接；②先发送数据大小（4字节十六进制，如\"host:version\"为000C）；③发送真正的数据内容。Server响应：成功返回\"OKAY\"，错误返回\"FAIL\"；特殊情况：host:version直接返回4字节十六进制版本号。host:devices传完设备列表后终止连接，而host:track-devices保持连接并在设备变动（添加、删除）时主动推送通知。","ch":"第25章 系统调试辅助工具"},{"q":"ADB协议中Host Service有哪些重要请求？","a":"host:version查询版本号（直接返回4字节十六进制）；host:kill请求Server退出（如版本过老）；host:devices查询设备列表（传完终止连接）；host:track-devices升级版（保持连接，设备变动主动通知）；host:emulator:<port>新模拟器启动时通知Server；host:transport:<serial-number>实现-s选项；host:transport-usb实现-d；host:transport-local实现-e；host:transport-any未指定选项时默认，多设备则失败；host-serial/host-usb/host-local:<request>针对特定目标查询；<host-prefix>:get-serialno/get-state；<host-prefix>:forward:<local>:<remote>端口转发（格式可为tcp:<port>、local:<path>、jdwp:<pid>）。","ch":"第25章 系统调试辅助工具"},{"q":"ADB协议中的Local Service有哪些？transport有哪两种？","a":"Local Service：shell:command（执行命令返回结果，参数含空格加引号）；shell:（交互式shell）；remount:（可读写重挂载，adb sync/push前执行）；dev:<path>（打开设备文件调试）；tcp:<port>、local:<path>及变种localreserved/localabstract/localfilesystem；log:<name>（adb logcat，只读打开/dev/log/<name>）；framebuffer:（截屏，OKAY后传16字节结构体depth/size/width/height，depth=16）；recover:<size>（recovery模式下传送镜像，创建/tmp/update和/tmp/update.start）；jdwp:<pid>、track-jdwp；sync:（文件同步服务，是adb push/pull的实现前提）。transport两种：usb transport（Server经USB线与真机Daemon连接）；local transport（Server通过TCP端口与主机上模拟器连接，也可与真机TCP连接）。","ch":"第25章 系统调试辅助工具"},{"q":"Layoutlib是什么？它和Emulator的区别？","a":"Layoutlib是SDK系统工具集的重要组成部分，路径/frameworks/base/tools/layoutlib，是Android View框架的定制版本（custom version），设计运行在Eclipse/Android Studio内部，为IDE提供与设备渲染非常接近的UI布局预览（layout rendering）；其中com.android.*或android.*类不在设备上运行。与Emulator的区别：Emulator处于\"运行时状态\"，需借助系统Image呈现界面；Layoutlib产生界面是\"静态\"完成的，但同样会用到系统Image提供的元素（如View Framework），只是这些元素需做必要改造。","ch":"第25章 系统调试辅助工具"},{"q":"如何使用Debug.startMethodTracing做方法追踪？TraceView的两个面板？","a":"步骤：①在onCreate中Debug.startMethodTracing(\"TraceTest\")、onStop中Debug.stopMethodTracing()；trace文件默认名dmtrace.trace，最大8MB（超限提前结束录制）；②trace文件保存到外部存储，需WRITE_EXTERNAL_STORAGE权限；③adb pull拉取后用TraceView分析。TraceView两部分：Timeline Panel（上半部分，时间轴逐行展示各线程执行情况，颜色区分函数）；Profile Panel（下半部分，函数耗时统计）。时间统计两种：Exclusive time为本函数自身运行时间；Inclusive time为本函数及所调用函数的时间总和；调用与被调函数称parents（紫色）和children（黄色）。Dmtracedump可从trace生成图形化函数调用树，但速度较慢。","ch":"第25章 系统调试辅助工具"},{"q":"Android中trace机制有哪几种控制方式？","a":"①通过系统属性控制：AndroidRuntime启动虚拟机时解析系统参数，参数中带使能Trace选项后，Runtime::start()内部调用Trace::Start()启动trace，效果与Debug.startMethodTracing相同；②利用/system/bin/am控制：am是shell脚本，运行am.java并借助ActivityManagerService的服务开关trace，AMS将trace控制消息推送给各应用进程，应用在主线程处理（同样借助Debug.startMethodTracing/stopMethodTracing），参见ActivityThread的startProfiling/stopProfiling；③利用Debug.startMethodTracing/Debug.stopMethodTracing：需源代码配合、操作有局限，但可精确将trace范围控制在特定代码行。","ch":"第25章 系统调试辅助工具"},{"q":"Systrace是什么？如何启动？常用选项？分析要点？","a":"Systrace是SDK中分析应用UI运行性能的工具（platform-tools/systrace），由Python编写。应用需保证60帧/秒UI绘制速率才\"流畅\"。启动：IDE按键、Android Device Monitor或命令行python systrace.py [options] [category1]...。选项：-o指定HTML报告名；-t/--time跟踪时长（默认5秒）；-b/--buf-size缓冲大小（KB）；-k指定内核功能；-l列类别（gfx、input、view、wm等）；-a <APP_NAME>指定被跟踪应用包名（需代码中添加trace接口）；--from-file从文件生成报告；-e/--serial选设备。分析要点：注意绘制时间超过16ms的操作（可能导致掉帧、界面不流畅）；右上角Alert警示问题；红色图标F表示操作远超常规时间。","ch":"第25章 系统调试辅助工具"},{"q":"Android常用性能分析工具有哪些？内存分析\"最佳搭档\"如何配合？","a":"工具：Traceview（线程与函数执行时间）、Dmtracedump（图形化调用关系图）、Memory Monitor（按时间展示Heap占用）、Heap Viewer（对象详情：Class、线程、分配位置）、Allocation Tracker、MAT（Eclipse基金会通用JVM内存诊断器，非Android提供）、Hierarchy Viewer（分析UI框架冗余）、Systrace（可针对UI各绘制帧跟踪、检测掉帧并给出解决建议）、Tracer for OpenGL ES。内存三件套流程：先用Memory Monitor观察是否经常性GC（问题是否存在）→用Heap Viewer甄别可疑对象类型（是什么对象）→用Allocation Tracker确定问题代码位置（如何产生）。","ch":"第25章 系统调试辅助工具"},{"q":"代码覆盖率的两种工作模式？Android选择哪种？为什么？","a":"主流工具：Emma、Jacoco、Clover（Jacoco功能全面、社区活跃，是Java界最流行工具之一；Eclemma是Eclipse插件，早期用Emma后改用Jacoco）。两种模式：①On-the-fly：用工具自己的ClassLoader代替原加载器，运行时动态加入统计信息；局限：不支持Java Agents的环境、部署时无法配置JVM参数、需将字节码转为其他虚拟机码（如Dalvik VM）、与其他agents冲突、需被Boot Class Loader加载的类。②Offline instrumentation：事先对目标做插桩。Android选择Offline（早期Emma后Jacoco），典型命令：java -cp emma.jar emma instr -m overwrite -cp to_be_instrumented.jar，处理对象是$(full_classes_jarjar_jar)，且要求Java编译Debug版本以保证覆盖信息与源码正确关联。","ch":"第25章 系统调试辅助工具"},{"q":"Android编译脚本中EMMA相关变量及N版本覆盖率的变化？","a":"三变量（build/core/java_library.mk）：EMMA_INSTRUMENT_STATIC把Emma核心jar包加入所有开启Emma功能的模块；EMMA_INSTRUMENT只对libcore起作用；LOCAL_EMMA_INSTRUMENT是各模块使用Emma功能的本地控制开关。Android N变化：因Jack编译器直接生成dex产物，full_classes_emma_jar不复存在，改用Jacoco（LOCAL_STATIC_JAVA_LIBRARIES += jacocoagent），通过PRIVATE_JACK_COVERAGE_OPTIONS（jack.coverage=true、jack.coverage.metadata.file=coverage.em等）由jack工具链在java转dex时同步生成插桩信息。脚本仍沿用\"Emma\"名但内部实现已变；jack真正源码在toolchain/jack（clone需-b ub-jack分支）。","ch":"第25章 系统调试辅助工具"},{"q":"以Framework为例，Android M之前的代码覆盖率统计典型步骤？","a":"Step1在/frameworks/base/Android.mk中framework模块处添加EMMA_INSTRUMENT := true和LOCAL_EMMA_INSTRUMENT := true；Step2编译前export EMMA_INSTRUMENT_STATIC=true；Step3 make clean；Step4编译——$(full_classes_emma_jar)由$(full_classes_jarjar_jar)经transform-classes.jar-to-emma（definitions.mk定义，java -classpath $(EMMA_JAR) emma instr，-outfile指定coverage.em记录插桩内容，-d输出emma_out）生成；Step5刷机；Step6执行测试收集coverage.ec；Step7生成报告：java -cp emma.jar emma report -r html -in coverage.em -in coverage.ec。Jacoco生成报告方式：IDE的jacoco插件、Ant/Maven、或用Jacoco API自写工具（不支持命令行生成报告）。","ch":"第25章 系统调试辅助工具"},{"q":"Android中如何模拟GPS位置（Mock Location）？新旧版本有何差异？","a":"模拟器：可用DDMS专用Panel、Emulator Console发送命令等。真机：旧版本在开发者选项提供\"允许模拟位置\"开关，打开后借助专用程序模拟GPS；新版本（6.0后）控制粒度更细，需精确选择可做Mock Location的程序，且这些应用必须在AndroidManifest.xml中声明<uses-permission android:name=\"android.permission.ACCESS_MOCK_LOCATION\" />。检测：6.0之前用Settings.Secure.ALLOW_MOCK_LOCATION判断；6.0后该变量废弃，改用isFromMockProvider。设置坐标：通过LocationManager.setTestProviderLocation接口，构造Location对象setLatitude/setLongitude/setAltitude后传入。","ch":"第25章 系统调试辅助工具"}]};
const cards = DATA.cards;
const chapters = DATA.chapters;
const grid = document.getElementById('grid');
const sel = document.getElementById('chapter');
const search = document.getElementById('search');
const statEl = document.getElementById('stat');
const chnav = document.getElementById('chnav');
let marked = new Set();
try { marked = new Set(JSON.parse(localStorage.getItem('anki_marked') || '[]')); } catch(e) { marked = new Set(); }

// chapter select
sel.innerHTML = '<option value="">全部章节（' + cards.length + ' 张）</option>' +
  chapters.map(ch => {
    const n = cards.filter(c => c.ch === ch).length;
    return '<option value="' + ch + '">' + ch + '（' + n + '）</option>';
  }).join('');
// chapter chips
chnav.innerHTML = chapters.map(ch => {
  const short = ch.replace(/^(第\d+章)\s*/, (m,p)=>p).replace(/（.*?）|——.*/g,'');
  return '<button class="cbtn" data-ch="' + ch + '" title="' + ch + '">' + short + '</button>';
}).join('');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function visibleCards() {
  const ch = sel.value, kw = search.value.trim().toLowerCase();
  return cards.map((c,i)=>({c,i})).filter(({c}) => {
    if (ch && c.ch !== ch) return false;
    if (kw && !(c.q.toLowerCase().includes(kw) || c.a.toLowerCase().includes(kw))) return false;
    return true;
  });
}

function render() {
  const vis = visibleCards();
  grid.innerHTML = '';
  if (!vis.length) { grid.innerHTML = '<div class="noresult">没有匹配的卡片</div>'; }
  vis.forEach(({c,i}) => {
    const w = document.createElement('div');
    w.className = 'cardwrap';
    const short = c.ch.replace(/——.*/,'');
    w.innerHTML =
      '<div class="card" data-i="' + i + '">' +
        '<div class="face front"><span class="chip">' + esc(short) + '</span>' +
          '<div class="body"><span class="qnum">Q' + (i+1) + '.</span>' + esc(c.q) + '</div>' +
          '<div class="foot"><span>点击翻面看答案</span><span class="mark ' + (marked.has(i)?'on':'') + '" data-m="' + i + '">★</span></div>' +
        '</div>' +
        '<div class="face back"><span class="chip">' + esc(short) + ' · 答案</span>' +
          '<div class="body"><span class="qnum">A' + (i+1) + '.</span>' + esc(c.a) + '</div>' +
          '<div class="foot"><span>点击翻回问题</span></div>' +
        '</div>' +
      '</div>';
    grid.appendChild(w);
  });
  statEl.textContent = '当前显示 ' + vis.length + ' / ' + cards.length + ' 张 · 已掌握 ' + marked.size + ' 张';
}

grid.addEventListener('click', e => {
  const m = e.target.closest('.mark');
  if (m) {
    e.stopPropagation();
    const i = +m.dataset.m;
    if (marked.has(i)) marked.delete(i); else marked.add(i);
    m.classList.toggle('on', marked.has(i));
    localStorage.setItem('anki_marked', JSON.stringify([...marked]));
    statEl.textContent = '当前显示 ' + visibleCards().length + ' / ' + cards.length + ' 张 · 已掌握 ' + marked.size + ' 张';
    return;
  }
  const card = e.target.closest('.card');
  if (card) card.classList.toggle('flipped');
});
sel.addEventListener('change', () => {
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.toggle('active', b.dataset.ch===sel.value));
  render();
});
search.addEventListener('input', render);
chnav.addEventListener('click', e => {
  const b = e.target.closest('.cbtn'); if (!b) return;
  sel.value = (sel.value === b.dataset.ch) ? '' : b.dataset.ch;
  document.querySelectorAll('.cbtn').forEach(x=>x.classList.toggle('active', x.dataset.ch===sel.value));
  render();
});
document.getElementById('flipAll').addEventListener('click', () => {
  document.querySelectorAll('.card').forEach(c=>c.classList.add('flipped'));
});
document.getElementById('flipReset').addEventListener('click', () => {
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('flipped'));
});
render();
</script>
</body>
</html>
