共享存储区域），由VolumeManager管理：VolumeManager::start（被vold main调用）中创建mInternalEmulated = new EmulatedVolume('/data/media')并create()——即所有Android设备从Vold角度看都带Emulated Storage，路径为/data/media；是否mount由MountService决定。create()发送VolumeCreated消息并迁移到kUnmounted状态，MountService回应mount指令后vold调用doMount。","ch":"第7章 Android启动过程"},{"q":"doMount和sdcard daemon（FUSE）的工作原理是什么？","a":"doMount@EmulatedVolume.cpp中fork新进程，execl(kFusePath,...)启动/system/bin/sdcard（kFusePath），参数含-u/-g 1023（AID_MEDIA_RW）等。Sdcard daemon属于FUSE Service（Filesystem in Userspace，用户态文件系统）：用户访问请求经Kernel VFS传给FUSE驱动模块，再通知用户层fuse管控程序（sdcard），处理完将结果返回调用者；因处理层次多效率存在不足，但灵活性高。sdcard核心操作：1）将/dev/fuse挂载到3个目标路径：/mnt/runtime/default/%s、/mnt/runtime/read/%s、/mnt/runtime/write/%s（%s为Volume label，Emulated场景为'emulated'）；2）创建3个线程thread_default、thread_read、thread_write，各自进入for死循环，从fuse->fd读取FUSE模块消息（FUSE_READ/FUSE_WRITE/FUSE_OPEN等）并执行处理函数。","ch":"第7章 Android启动过程"},{"q":"Android 6.0的Runtime Permission是什么？与sdcard的3个mount point有何关系？","a":"Runtime Permission允许用户在程序运行到特定功能时动态决定是否授权（不同于Install Time Permissions的'一刀切'），只保护系统认为危险的权限，可用adb shell pm list permissions -g -d查看；用户拒绝并勾选'Never ask again'后系统将直接拒绝后续申请。这种权限需运行中动态调整且不重启应用。为此/dev/fuse挂载到3个'View' mount point：/mnt/runtime/default（无特殊权限的应用及adbd等root namespace）、/mnt/runtime/read（有READ_EXTERNAL_STORAGE权限的应用）、/mnt/runtime/write（有WRITE_EXTERNAL_STORAGE权限的应用）——不同View看到的Mount Tree不同，实现分权限管理。","ch":"第7章 Android启动过程"},{"q":"Runtime Permission动态变更（存储权限）如何在不重启应用的情况下生效？","a":"启动时：AMS在startProcessLocked中通过pm.getPackageGids获取gids，并由MountServiceInternal.getExternalStorageMountMode(uid, packageName)得到mountExternal（供Zygote bind mount参考）——该函数遍历所有ExternalStorageMountPolicy取最小MountMode，顺序为MOUNT_EXTERNAL_NONE、MOUNT_EXTERNAL_DEFAULT、MOUNT_EXTERNAL_READ、MOUNT_EXTERNAL_WRITE；具体值由PMS的checkUidPermission根据APP申请的WRITE_MEDIA_STORAGE、READ/WRITE_EXTERNAL_STORAGE等权限判断。孵化时：Zygote在MountEmulatedStorage中unshare(CLONE_NEWNS)（mount namespace），按mount_mode将/mnt/runtime/{default,read,write} bind mount（MS_BIND|MS_REC|MS_SLAVE）到/storage。动态变更：取得新权限后PMS通过MountService向Vold CommandListener发送'remount_uid'命令，Vold由VolumeManager::remountUid对进程重新调整'视角'，无需重启应用。","ch":"第7章 Android启动过程"},{"q":"Android多用户有哪些类型？各自特点和权限差异是什么？","a":"类型：1）Primary——设备的第一个也是首选用户，类似Windows Administrator，不可删除、一直运行，拥有特殊权限和设置项；2）Secondary——添加的其他用户，可被移除且不影响其他用户；3）Guest——临时性secondary user，系统同时只能有一个Guest。权限差异：只有primary user拥有对phone call和texts的完全控制权；secondary默认只能接听电话，无权拨打或操作短信（取决于Settings->Users的授权）。数据存储：所有用户安装的程序都在/data/app，Primary User数据在/data/data，其他用户数据在/data/user/<uid>/（/data/user/0与/data/data内容一致）。","ch":"第7章 Android启动过程"},{"q":"Android 5.0中如何开启默认关闭的多用户功能？","a":"修改frameworks/base/core/res/res/values/config.xml中两个配置项：<integer name='config_multiuserMaximumUsers'>1</integer>（支持的最大用户数，默认1即关闭）和<bool name='config_enableMultiUserUI'>false</bool>（是否显示多用户UI）。设备商根据需要修改这两个配置项后才能开启设备的多用户功能。多用户管理会影响存储管理、权限管理等模块的内部实现。","ch":"第7章 Android启动过程"},{"q":"ActivityManagerService（AMS）是什么？它寄存于哪里？","a":"AMS是Android用于管理Activity（及四大组件）运行状态的系统进程，是APK开发中最常用的系统服务。它和WMS一样寄存于systemServer中，系统启动时创建独立线程循环处理客户请求。AMS通过ActivityStack等数据结构记录、管理、查询系统中组件状态，类似'户籍登记处'。","ch":"第8章 ActivityManagerService"},{"q":"AMS的启动流程是什么？setSystemProcess注册了哪些服务？","a":"SystemServer.run()中先调用ActivityManagerService.main(factoryTest)启动AMS（内部创建AThread线程，SystemServer线程通过thr.wait()等待mService就绪后被notifyAll唤醒），再调用setSystemProcess()。setSystemProcess通过ServiceManager.addService注册一系列Binder Server：'activity'（AMS主业，由ActivityManagerService实现）、'meminfo'（MemBinder，内存信息）、'cpuinfo'等。","ch":"第8章 ActivityManagerService"},{"q":"IActivityManager接口中的函数可分为哪几类？","a":"分为4类：1）组件状态管理：所有四大组件的开启、关闭操作，如startActivity、startActivityAndWait、activityPaused、startService、stopService、removeContentProvider；2）组件状态查询：如getCallingActivity、getServices；3）Task相关：removeSubTask、removeTask、moveTaskBackwards、moveTaskToFront等；4）其他辅助功能：如getMemoryInfo、setDebugApp等系统运行时信息查询。","ch":"第8章 ActivityManagerService"},{"q":"ActivityState枚举包含哪些状态？","a":"共9个状态：INITIALIZING（正在初始化）、RESUMED（恢复）、PAUSING（正在暂停）、PAUSED（已暂停）、STOPPING（正在停止）、STOPPED（已停止）、FINISHING（正在完成）、DESTROYING（正在销毁）、DESTROYED（已销毁）。结合Activity回调可画出状态迁移图。","ch":"第8章 ActivityManagerService"},{"q":"ActivityStack中有哪些重要的ArrayList成员变量？各自作用是什么？","a":"元素都是ActivityRecord：mHistory记录所有Activity信息直到destroyed；mLRUActivities按最近使用排序的运行中Activity列表（队头是最近最少使用）；mStoppingActivities是可Stop但需等下一个Activity就绪的列表；mGoingToSleepActivities正在进入睡眠；mNoAnimActivities不考虑迁移动画；mFinishingActivities是可finished但需等上一个Activity就绪的列表。","ch":"第8章 ActivityManagerService"},{"q":"ActivityStack记录特殊状态Activity的变量有哪些？","a":"四个ActivityRecord变量：mPausingActivity（当前正在被暂停的Activity）、mLastPausedActivity（上一个被暂停的）、mResumedActivity（当前被恢复的，可为null）、mLastStartedActivity（最近一次被启动的）。这些与ArrayList成员共同构成ActivityStack主框架。","ch":"第8章 ActivityManagerService"},{"q":"AMS中5个'长相类似'的startActivity函数及其调用顺序是什么？","a":"调用链：startActivity@AMS→startActivityAsUser@AMS→startActivityMayWait@ActivityStack→startActivityLocked@ActivityStack→startActivityUncheckedLocked@ActivityStack。它们是5个执行步骤，任一步出错即中止流程。startActivityAsUser比startActivity多userId参数，通过Binder的getCallingUid获得。","ch":"第8章 ActivityManagerService"},{"q":"startActivityAsUser做了哪些权限检查？startActivityMayWait做了什么？","a":"startActivityAsUser做两项检查：enforceNotIsolatedCaller（调用者是否被隔离）、handleIncomingUser（调用者是否有权执行操作）。startActivityMayWait：显式Intent直接取目标，隐式则调用resolveActivity()查找；判断目标进程是否重量级（heavy-weight，涉及mHeavyWeightProcess）；调用startActivityLocked继续启动；处理outResult（可能wait）。","ch":"第8章 ActivityManagerService"},{"q":"FLAG_ACTIVITY_FORWARD_RESULT标志的作用是什么？","a":"它使result跨越式传递：Activity1启动Activity2，Activity2带此标志启动Activity3时，Activity3调用setResult的结果不会传给Activity2，而是直接传给最初的Activity1。实现上把Activity3的resultRecord设为sourceRecord.resultTo（即Activity1）。此时Activity2不能再通过startActivityForResult启动Activity3，否则返回START_FORWARD_AND_REQUEST_CONFLICT错误。","ch":"第8章 ActivityManagerService"},{"q":"startActivityLocked(1)的主要步骤有哪些？","a":"Step1确保调用者进程存在，否则返回START_PERMISSION_DENIED；Step2处理FLAG_ACTIVITY_FORWARD_RESULT；Step3若未找到目标Activity或ActivityInfo为空则报错返回；Step4权限检查：checkPermission(START_ANY_ACTIVITY)和checkComponentPermission必须全部通过，否则抛SecurityException；Step5生成ActivityRecord并调用startActivityUncheckedLocked。带Locked后缀的函数须保证线程安全。","ch":"第8章 ActivityManagerService"},{"q":"startActivityUncheckedLocked中判断需要启动新Task的条件是什么？新Task下结果如何传递？","a":"条件：sourceRecord为空；或sourceRecord的launchMode为LAUNCH_SINGLE_INSTANCE；或目标ActivityRecord的launchMode为LAUNCH_SINGLE_INSTANCE或LAUNCH_SINGLE_TASK，均设置FLAG_ACTIVITY_NEW_TASK。由于startActivity的结果无法跨越Task传递，新Task情况下返回RESULT_CANCELED（sendActivityResultLocked）。之后通过findTaskLocked/findActivityLocked细化处理，最终调用startActivityLocked(2)真正执行启动。","ch":"第8章 ActivityManagerService"},{"q":"startActivityLocked(2)做了哪些工作？appToken有什么作用？","a":"Step1非新task时遍历mHistory找目标所在老task，不可见则仅加入mHistory并在WMS注册但不启动；Step2将Activity放到stack最顶层（mHistory.add、putInHistory、frontOfTask标记root）；Step3执行切换动画（TRANSIT_TASK_OPEN或TRANSIT_ACTIVITY_OPEN，受FLAG_ACTIVITY_NO_ANIMATION控制）；Step4调用WMS的addAppToken注册appToken——它是Activity在WMS中'有档可查'的凭证；Step5检查affinity、resetTaskIfNeededLocked；Step6调用resumeTopActivityLocked。","ch":"第8章 ActivityManagerService"},{"q":"resumeTopActivityLocked的处理流程要点是什么？","a":"Step1调用topRunningActivityLocked从mHistory栈顶往下找第一个非finishing、不等于notTop且可显示（锁屏时需FLAG_SHOW_ON_LOCK_SCREEN）的ActivityRecord赋给next；Step2 next为空则启动Launcher主界面；Step3若mResumedActivity==next且已RESUMED则不重复启动；Step4目标正在stopping则从mStoppingActivities等列表移除；Step5 mPausingActivity非空则等待，否则先pause前一个Activity；Step6-7通知WMS隐藏/显示（setAppVisibility、setAppWillBeHidden）；Step8目标进程已存在则scheduleResumeActivity，否则启动新进程。","ch":"第8章 ActivityManagerService"},{"q":"目标Activity所属进程未启动时，AMS如何启动新进程？等待多久？","a":"调用链：startSpecificActivityLocked→startProcessLocked(1)→startProcessLocked(2)，最终通过Process.start(\"android.app.ActivityThread\", ...)借助Zygote启动新进程，即应用进程主线程是ActivityThread。进程启动后须回调attachApplication通知AMS；AMS预留等待时间：10秒或300秒（因设备而异），超时视为异常。成功attach后AMS调用realStartActivityLocked真正启动Activity，随后走onCreate→onStart→onResume生命周期。","ch":"第8章 ActivityManagerService"},{"q":"什么是ActivityTask？为什么说它不是严格意义的栈？","a":"Task是可以跨进程组合Activity来完成同一任务的'集合'，源码上以Stack栈方式实现（后进先出，BACK键弹出栈顶）。但它不是严格意义的栈——默认行为与栈一致，但系统提供了大量Flag和launchMode属性让开发者能实时调整Task行为（如清空、重排序、另开Task等），可理解为'栈的一种变异'。Task的设计极大促进了跨应用资源复用（如电话本复用短信编辑Activity）。","ch":"第8章 ActivityManagerService"},{"q":"android:taskAffinity属性是什么？在什么情况下生效？","a":"taskAffinity表示Activity希望归属的Task。默认同一应用所有Activity共享同一affinity（即AndroidManifest中的Package Name）；一个Task的affinity取决于其根Activity。生效场景：（1）Intent带FLAG_ACTIVITY_NEW_TASK时——若已有affinity相同的Task则复用，否则新建Task；（2）allowTaskReparenting为true时——Activity具备'动态转移'能力，当其affinity对应的Task转到前台时会被挪到该Task中。","ch":"第8章 ActivityManagerService"},{"q":"四种launchMode的区别是什么？","a":"standard：默认，多实例，总是新建实例，归属调用者的task；singleTop：类似standard，但若目标已在目标task栈顶则通过onNewIntent传递Intent而不新建实例；singleTask：单实例，onNewIntent传Intent，总在新task中启动（位于task根），允许其他Activity进驻其task；singleInstance：同singleTask但不允许其他Activity进驻，永远独占一个孤立task。牢记：无论何种方式，被启动的Activity通常都位于栈顶。","ch":"第8章 ActivityManagerService"},{"q":"FLAG_ACTIVITY_CLEAR_TOP、NO_HISTORY、MULTIPLE_TASK等常用Flag的含义？","a":"CLEAR_TOP：目标Activity已在task中时，销毁其上所有Activity并通过onNewIntent传Intent（launchMode中无对应）；NO_HISTORY：不保存在History Stack（等价android:noHistory）；MULTIPLE_TASK：须与NEW_TASK同用，阻止恢复现有task，总是新建task；EXCLUDE_FROM_RECENTS：不进最近列表；REORDER_TO_FRONT：已运行则只调整顺序置前；NO_USER_ACTION：非用户主观启动（如来电）时不回调onUserLeaveHint；CLEAR_TASK：清除task其他元素，只能与NEW_TASK同用；FLAG_ACTIVITY_BROUGHT_TO_FRONT在使用singleTask时系统自动加上。冲突时以Intent标志优先（如交警手势优先于路面标志）。","ch":"第8章 ActivityManagerService"},{"q":"Instrumentation机制是什么？其生命周期如何？","a":"Instrumentation是允许用户获取（及改变）应用程序与系统之间交互流程的机制，在应用代码运行前被实例化，通过Manifest的<instrumentation>标签描述。典型应用是自动化测试（am instrument命令，如am instrument -e class ... -w <TEST_PACKAGE>/<RUNNER_CLASS>）。生命周期：newInstance→init→onCreate→onStart→callApplicationOnCreate→callActivityOnCreate→callActivityXXX→onDestroy。参数经BindApplication@ActivityThread的handleBindApplication处理，'am instrument'的<COMPONENT>以'/'分隔为Package和Class（unflattenFromString）。未指定时其行为多为'伪实现'（onCreate为空）或'透传'（callActivityOnPause直接调performPause），还可通过start()创建InstrumentationThread新线程运行。","ch":"第8章 ActivityManagerService"},{"q":"NativeActivity的原理是什么？C/C++入口在哪里？","a":"Android通过预先实现的'android.app.NativeActivity'作为中转，免去手写调用本地代码的Java壳。Manifest中声明该activity并通过meta-data（android.app.lib_name）指定so库。NativeActivity在onCreate时加载so并查找'ANativeActivity_onCreate'函数，该函数为本地代码创建新线程并调用android_main，由此进入自定义C/C++逻辑。NDK API头文件和库位于NDK的platforms目录（按API等级和平台分类）。","ch":"第8章 ActivityManagerService"},{"q":"优秀的GUI系统应至少满足哪几个条件？","a":"1) 流畅性：评判GUI优劣的重要准则，画面经常滞后会被用户抛弃（Project Butter即为此努力）；2) 友好性：GUI是系统“脸面”，包括操作人性化、图形一致性、视觉元素合理搭配；3) 可扩展性：开发者可在系统内建基础上添加新界面、新交互方式和更复杂的图形处理功能。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Android显示系统的分层架构是什么（从底层到上层）？","a":"1) Linux内核提供统一framebuffer显示驱动（设备节点/dev/graphics/fb*，fb0为主屏）；2) HAL层提供Gralloc（含fb和gralloc两个设备，前者打开并配置framebuffer、提供post/setSwapInterval，后者管理帧缓冲区分配释放）和Composer（供厂商定制UI合成）；3) EGL为OpenGL ES配置本地窗口（FramebufferNativeWindow）；4) OpenGL ES是接口协议，EGL读取egl.cfg动态加载libagl（软件）或libhgl（硬件）实现；5) SurfaceFlinger通过mDisplays（DisplayDevice）用eglGetDisplay、eglCreateWindowSurface搭建OpenGL ES环境。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"HAL（硬件抽象层）需要解决哪三个关键问题？","a":"1) 硬件接口抽象：从众多设备中提取共同属性，用C语言模拟继承——子类结构第一个成员必须是父类结构（如gralloc_module_t以hw_module_t common开头）；2) 接口的稳定性：接口由Android预定义于hardware/libhardware/include/hardware，厂商只需按定义“填空”；3) 灵活的使用方法：厂商按统一接口实现HAL库，开发商将库放到指定路径，系统通过hw_get_module自动加载，上层无需更改。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"HAL模块的加载入口和命名规则是什么？","a":"入口函数是hw_get_module(id, &module)。它按HAL_LIBRARY_PATH1(/system/lib/hw)和HAL_LIBRARY_PATH2(/vendor/lib/hw)查找匹配ID的库，库名形式如gralloc.[ro.hardware].so、gralloc.[ro.product.board].so、gralloc.[ro.board.platform].so、gralloc.[ro.arch].so，都不存在时用默认gralloc.default.so。每个模块必须有HAL_MODULE_INFO_SYM变量，且其结构必须以hw_module_t开头（tag为HARDWARE_MODULE_TAG）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Gralloc模块提供哪两种设备？各自职责和核心接口是什么？","a":"1) fb设备（GRALLOC_HARDWARE_FB0即“fb0”）：主屏幕，负责打开内核framebuffer并配置，核心接口有post（将buffer送显，要求尺寸与屏幕一致且未locked，下次VSYNC显示）、setSwapInterval（设置缓冲交换间隔）、setUpdateRect（设置刷新区域，需驱动支持update-on-demand）；2) gpu0/gralloc设备（GRALLOC_HARDWARE_GPU0）：负责图形缓冲区分配与释放，核心接口是alloc（gralloc_alloc）和free（gralloc_free）。两者由FramebufferNativeWindow的fbDev和grDev管理。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"fb设备的打开过程（fb_device_open）做了什么？","a":"1) 校验设备名为GRALLOC_HARDWARE_FB0；2) 分配并memset初始化fb_context_t（HAL中常见的“壳”结构，参数device返回的是其内部的device.common）；3) 设置核心接口：close=fb_close、setSwapInterval=fb_setSwapInterval、post=fb_post；4) 调用mapFrameBuffer(m)完成内存映射与参数配置——打开/dev/graphics/fb0或/dev/fb0，通过ioctl(FBIOGET_FSCREENINFO/FBIOGET_VSCREENINFO)读取参数、ioctl(FBIOPUT_VSCREENINFO)配置，并用mmap将fb映射到内存（地址保存在module->framebuffer->base）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"什么是Framebuffer？Android中如何访问它？","a":"Framebuffer是Linux内核提供的图形硬件抽象描述，是包含屏幕显示信息的缓冲区，在“一切皆文件”的Linux中被看作终端显示设备的“化身”，设备节点为/dev/graphics/fb*（fb0为主显示屏幕，必须存在）。Android各子系统不直接使用内核驱动，而是通过HAL层间接访问：上层只能经Gralloc操作帧缓冲区，保证对framebuffer的有序使用和统一管理。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"为什么Android需要两种本地窗口（Native Window）？分别是什么？","a":"若系统只有一种本地窗口（直接管理Framebuffer），多个UI程序会争抢唯一的帧缓冲区，像共用画板涂鸦一样混乱。因此设计两类窗口：1) 面向管理者SurfaceFlinger的FramebufferNativeWindow——直接使用帧缓冲区，可将结果显示到屏幕；2) 面向应用程序的Surface——从内存缓冲区分配空间。SurfaceFlinger收集所有程序的显示需求，统一图像混合后输出到自己的NativeWindow上。应用也可用Skia等第三方图形库，只要与SurfaceFlinger间协议不变。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"ANativeWindow协议包含哪些核心成员函数？","a":"ANativeWindow是本地窗口的“协议”（Android平台EGLNativeWindowType即ANativeWindow*）：1) setSwapInterval——设置交换间隔；2) dequeueBuffer——EGL申请一个buffer（出队列，暗示窗口有多份buffer）；3) queueBuffer——渲染完成后unlock并post buffer；4) cancelBuffer——取消已dequeue的buffer（注意同步）；5) query——向本地窗口咨询信息；6) perform——执行各种操作（NATIVE_WINDOW_SET_USAGE/SET_CROP/SET_BUFFER_COUNT/SET_BUFFERS_TRANSFORM/SET_BUFFERS_TIMESTAMP等）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"FramebufferNativeWindow的构造函数做了哪些事？","a":"1) hw_get_module(GRALLOC_HARDWARE_MODULE_ID)加载Gralloc模块；2) framebuffer_open和gralloc_open分别打开fbDev和grDev；3) 根据fbDev->numFramebuffers确定mNumBuffers（范围MIN_NUM_FRAME_BUFFERS=2到MAX_NUM_FRAME_BUFFERS=3），初始化mNumFreeBuffers和mBufferHead；4) 为每个buffer创建NativeBuffer并调用grDev->alloc（usage为GRALLOC_USAGE_HW_FB）分配空间；5) 用fb设备属性（flags/xdpi/ydpi/minSwapInterval等）填充窗口属性；6) 将setSwapInterval、dequeueBuffer、queueBuffer、query、perform等填入ANativeWindow函数指针，履行协议。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"什么是双缓冲（Double Buffering）？为什么需要它？","a":"若只用一个buffer，等于直接以屏幕为画板实时作画，用户会看到未完成的中间画面（如2.5s才能画完5个图形，画面很“卡”）。双缓冲使用两块buffer：Back Buffer供CPU/GPU后台绘制，Frame Buffer用于屏幕显示；Back Buffer准备就绪后才交换，保证用户看到的总是完整画面。此外还有三缓冲（Triple Buffering）、四缓冲等，统称多缓冲（Multiple Buffering）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"FramebufferNativeWindow::dequeueBuffer的实现要点？","a":"1) getSelf将入参ANativeWindow*转回FramebufferNativeWindow（因C的struct无成员函数，需借助函数指针+传入window参数）；2) Mutex::Autolock加锁；3) 计算mBufferHead并自增，超过mNumBuffers则归0实现循环；4) 若mNumFreeBuffers为0，用mCondition.wait等待其他地方（queueBuffer中）释放唤醒；5) mNumFreeBuffers--，记录mCurrentBufferIndex，返回buffers[index]。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Gralloc申请缓冲区的usage标志有哪些典型值？","a":"定义于hardware/libhardware/include/hardware/Gralloc.h：GRALLOC_USAGE_HW_TEXTURE（用于OpenGL ES Texture）、GRALLOC_USAGE_HW_RENDER（用于OpenGL ES渲染）、GRALLOC_USAGE_HW_2D（2D硬件图形设备）、GRALLOC_USAGE_HW_COMPOSER（用于HWComposer HAL模块）、GRALLOC_USAGE_HW_FB（用于framebuffer设备，对应gralloc_alloc_framebuffer）、GRALLOC_USAGE_HW_VIDEO_ENCODER（硬件视频编码器）等。屏幕显示用的缓冲区申请HW_FB；不支持page-flipping时可能退化为ashmem内存。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Surface类是什么？其核心成员mGraphicBufferProducer的作用？","a":"Surface是面向应用程序的本地窗口，继承ANativeObjectBase<ANativeWindow,...>，构造时将ANativeWindow函数指针赋为hook_XX（内部钩住Surface真正实现）。核心成员mGraphicBufferProducer（sp<IGraphicBufferProducer>，历经mSurfaceTexture→mBufferProducer→mGraphicBufferProducer改名）是Surface与BufferQueue通信的关键，dequeueBuffer/requestBuffer/queueBuffer等协议都通过它实现。缓冲区记录在mSlots[NUM_BUFFER_SLOTS]（最多32个BufferSlot，含GraphicBuffer和dirtyRegion）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"应用进程中Java层Surface（mSurface）是如何获得有效值的？","a":"ViewRootImpl持有Java层mSurface，初始为空。ViewRootImpl向WindowManagerService发起relayout请求时，WMS先让WindowStateAnimator生成SurfaceControl，再通过Surface.copyFrom()复制到mSurface：copyFrom调用JNI函数nativeCreateFromSurfaceControl（android_view_Surface.cpp），从SurfaceControl中提取出C++层Surface对象记录到Java Surface成员中，此后即可从该变量还原底层Surface。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"与Surface相关的3个匿名Binder服务是什么？访问顺序如何？","a":"1) ISurfaceComposer——实名Binder SurfaceFlinger在ServiceManager注册名为“SurfaceFlinger”，但实现的接口是ISurfaceComposer，提供createConnection；2) ISurfaceComposerClient——由createConnection获得的匿名Binder，服务端实现是SurfaceFlinger::Client，提供createSurface/destroySurface；3) IGraphicBufferProducer——由createSurface返回的gbp，服务器端实现是BufferQueue，提供requestBuffer、dequeueBuffer、queueBuffer、cancelBuffer、connect、disconnect等。访问顺序只能依次：ISurfaceComposer→ISurfaceComposerClient→IGraphicBufferProducer。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"BufferQueue中的BufferState有哪几种？生命周期如何迁移？","a":"BufferState：FREE(0)——可用可被dequeue，owner是BufferQueue；DEQUEUED(1)——已被producer dequeue，owner是producer，BufferQueue和consumer都不能操作；QUEUED(2)——已被客户端queued，不能dequeue但可acquire，owner是BufferQueue；ACQUIRED(3)——owner变为consumer，release后回到FREE。生命周期：FREE→DEQUEUED→QUEUED→ACQUIRED→FREE。三个Owner（BufferQueue中介、Producer主动生产、Consumer被动消费）都必须经BufferQueue中转。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"BufferQueue如何通知Consumer有新帧可消费？","a":"BufferQueue内部定义了ConsumerListener接口（含onFrameAvailable和onBuffersReleased两个纯虚函数）：当一块buffer数据准备就绪（被queued）可以消费时，BufferQueue调用onFrameAvailable()通知Consumer（注意此时没有共享锁保护）；当BufferQueue释放其slot中的一个或多个GraphicBuffer引用时调用onBuffersReleased()。Layer继承了FrameAvailableListener，收到通知后onFrameQueued会增加mQueuedFrames计数并向SurfaceFlinger发出INVALIDATE信号（signalLayerUpdate）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"BufferQueue::dequeueBuffer的核心流程是什么？","a":"1) 加Mutex自动锁，循环查找可用Slot：遍历mSlots统计DEQUEUED数量、寻找FREE状态且mFrameNumber最小的Slot；2) 若Client未设置buffer count，禁止dequeue多个buffer；3) 找不到可用Slot时mDequeueCondition.wait等待释放唤醒；4) 将选中Slot的mBufferState置为DEQUEUED；5) 若mGraphicBuffer为NULL或宽高/格式/usage不符，重置Slot并返回BUFFER_NEEDS_REALLOCATION标志；6) 需要重分配时调用mGraphicBufferAlloc->createGraphicBuffer实际分配空间并写入Slot。客户端收到REALLOCATION标志后须再调requestBuffer获取buffer。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"requestBuffer如何实现跨进程共享同一块物理内存？","a":"跨进程时只有Slot序号bufferIdx被传给Server；Server端BnGraphicBufferProducer取出mSlots[slot].mGraphicBuffer，在reply中按序写入：bool(buffer!=0)→GraphicBuffer对象→result。GraphicBuffer继承Flattenable，flatten时把ashmem句柄native_handle（numFds/numInts及数据写入buf[6]-[8]和fds）打包传输；Client端unflatten用native_handle_create重建handle并调用GraphicBufferMapper::registerBuffer（内部调gralloc_register_buffer→gralloc_map）将同一物理内存映射到自己进程空间，实现Surface与BufferQueue的缓冲区共享。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"BufferQueue的mSlots为什么设计为最多32个？","a":"主要目的是提高图形渲染速度：若只有少量buffer，当生产者（应用）产出效率高于消费者处理速度时，会很快dequeue完所有缓冲区而陷入等待。32是最大容量NUM_BUFFER_SLOTS，实际数量可设置：Layer::onFirstRef中按宏TARGET_DISABLE_TRIPLE_BUFFERING调用setDefaultMaxBufferCount(2或3)，保存于BufferQueue的mDefaultMaxBufferCount；应用也可通过IGraphicBufferProducer::setBufferCount设置mOverrideMaxBufferCount（默认0表示不关心），BufferQueue会权衡各值取最佳方案。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"以开机动画BootAnimation为例，应用程序绘图流程是什么？","a":"1) 构造函数new SurfaceComposerClient建立与SurfaceFlinger的连接（并linkToComposerDeath监听死亡）；2) readyToRun中session()->createSurface()经Client转发MessageCreateLayer，由SurfaceFlinger::createLayer创建Layer，返回handle和gbp；setLayer(0x40000000)设置Z-Order；control->getSurface()得到Surface；3) EGL配置：eglGetDisplay→eglInitialize→eglChooseConfig→eglCreateWindowSurface→eglCreateContext→eglMakeCurrent；4) threadLoop中用OpenGL ES API绘图，通过Surface（IGraphicBufferProducer）与BufferQueue交互完成dequeue/queue。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Layer是什么？Layer、Handle、gbp（IGraphicBufferProducer）有何关系？","a":"Layer在SurfaceFlinger中表示“层”，即一个画面，屏幕最终显示是所有Layer按Z-Order混合（Flinger）的结果。createNormalLayer新建Layer并setBuffers，handle由Layer::getHandle返回——Handle是继承BBinder和LayerCleaner的空壳，析构时通过LayerCleaner调用SurfaceFlinger::onLayerDestroyed自动清理图层；gbp由Layer::getBufferQueue返回（mSurfaceFlingerConsumer->getBufferQueue()），Server端实现是BufferQueue。一个Client可创建多个Layer（一对多），每个Layer对应一个BufferQueue。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Layer的BufferQueue由谁持有？如何创建？","a":"Layer不直接持有BufferQueue，而是由内部成员mSurfaceFlingerConsumer（SurfaceFlingerConsumer类）管理，其真正持有BufferQueue的是ConsumerBase::mBufferQueue。创建时机在Layer::onFirstRef（第一次被引用时）：new SurfaceTextureLayer(mFlinger)（BufferQueue的子类），再new SurfaceFlingerConsumer(mTextureName, true, GL_TEXTURE_EXTERNAL_OES, false, bq)。handle和BufferQueue都是匿名Binder Server，应用调createSurface时可同时获得。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"SurfaceFlinger如何创建和管理Layer（addClientLayer）？","a":"SurfaceFlinger::createLayer根据flags&eFXSurfaceMask分两种：eFXSurfaceNormal（普通，createNormalLayer）和eFXSurfaceDim（Dim效果，createDimLayer；早期还有Blur已被Dim替代）。成功后调用addClientLayer：client->attachLayer(handle, layer)让Layer与Client关联（记录于Client的mLayers），并加mStateLock后将Layer加入mCurrentState.layersSortedByZ（按Z-Order排序）、把gbc加入mGraphicBufferProducerList，最后setTransactionFlags(eTransactionNeeded)通知有业务待处理。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"什么是Screen Tearing？其产生原因？","a":"屏幕上显示的画面来源于多个“帧”，出现画面割裂/拼凑感的显示错误。原因：CPU/GPU绘图过程与屏幕刷新使用同一块buffer且速度不同步。例如显示器刷新率66Hz（0.015s/帧）而CPU/GPU达100Hz（0.01s/帧），刷新进行到一半时buffer内容已被替换为下一帧，导致屏幕上下部分分属两帧。单缓冲难以规避；双缓冲（Back Buffer绘制完再交换）可大幅降低，但交换时机需在VBI垂直消隐期。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"VSYNC的概念与作用？","a":"VSync（Vertical Synchronization，垂直同步）利用Vertical Blanking Interval（VBI，扫描完一屏回到第一行之间的空隙）时期出现的Vertical Sync Pulse保证双缓冲在最佳时间点交换，避免Screen Tearing。行频=场频×纵坐标分辨率，场频即每秒整屏刷新次数。VSync并非Google首创（PC领域早已有），但Android 4.1的Project Butter赋予其新功用：整个显示系统（CPU/GPU渲染与Display）都以VSync为节拍同步，收到VSync Pulse后立即开始下一帧渲染，60Hz下每帧只有约16ms准备时间。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"什么是Jank？双缓冲在FPS低于刷新率时为何失效？","a":"Jank指屏幕重复显示上一帧的卡顿现象：第2个VSync到来时第2帧数据尚未准备好，只能继续显示第1帧，且第2帧完成后还要等下一个VSync。双缓冲下若CPU/GPU处理时间超过16ms：第一个VSync时B未准备好只能继续显示A；B完成后又因错过VSync只能等下一轮交换，期间CPU/GPU因没有可用buffer而空闲；下次VSync开始工作后又超时，循环导致越来越多Jank。解决方案是Triple Buffering增加第三个buffer C，让CPU无需等待即可继续准备下一帧，充分利用空闲时间。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Project Butter是什么？包含哪两个重要组成部分？","a":"Project Butter（“黄油计划”）是Google在2012年I/O大会宣布、Android 4.1正式搭载的改善UI响应速度的计划，目标是让Android摆脱UI交互“滞后”感、如加黄油般顺滑。两个重要组成部分：1) VSync——全系统以VSync信号同步渲染与显示；2) Triple Buffering——三缓冲机制，缓解生产速度跟不上显示节奏时的等待浪费。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"SurfaceFlinger是如何启动的？onFirstRef做了什么？","a":"由system_init（System_init.cpp，被SystemServer在JNI层加载调用）根据属性system_init.startsurfaceflinger调用SurfaceFlinger::instantiate()创建名为“SurfaceFlinger”的实名Binder Server。强指针首次引用触发onFirstRef：1) mEventQueue.init(this)初始化MessageQueue（内部new Looper(true)和自定义Handler）；2) run(“SurfaceFlinger”, PRIORITY_URGENT_DISPLAY)启动业务线程（SurfaceFlinger继承Thread）；3) mReadyToRunBarrier.wait()等待新线程在readyToRun中调用open()解禁。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"SurfaceFlinger的消息循环机制是怎样的？","a":"SurfaceFlinger::threadLoop只调用waitForEvent()→mEventQueue.waitMessage()：do-while死循环中mLooper->pollOnce(-1)读取并处理消息（即使ALOOPER_POLL_TIMEOUT也不退出）。MessageQueue是“大杂烩”，内含Looper（mMessageEnvelope存消息）和自定义Handler；Handler收到INVALIDATE/REFRESH/TRANSACTION消息后回调SurfaceFlinger::onMessageReceived。注意此Handler是MessageQueue中为SurfaceFlinger专门设计的，非Java层Handler。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Client::createSurface的工作方式（postMessageSync）是什么？","a":"Client是ISurfaceComposerClient的服务端（每个UI应用在SurfaceFlinger中对应一个Client）。createSurface内部定义MessageCreateLayer（继承MessageBase），将其通过mFlinger->postMessageSync(msg)推送到SurfaceFlinger的消息队列。postMessageSync调用mEventQueue.postMessage后msg->wait()（Barrier::wait）阻塞Binder线程；SurfaceFlinger线程执行MessageBase::handleMessage→handler()（即flinger->createLayer）后barrier.open()唤醒等待者，保证请求不丢失且不打断SurfaceFlinger当前操作，实现同步。另有postMessageAsync为异步版本。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"VSync信号的“信号源”如何确定？硬件源与软件源分别如何工作？","a":"由HWComposer构造函数决定：若能加载HAL模块HWC_HARDWARE_MODULE_ID=“hwcomposer”、打开hwc_composer_device_t且版本≥HWC_DEVICE_API_VERSION_1_1，则用硬件源（needVSyncThread=false），通过mHwc->registerProcs注册回调procs.vsync/hook_invalidate/hook_hotplug，硬件事件经hook_vsync→HWComposer::vsync→mEventHandler.onVSyncReceived传递（mEventHandler即SurfaceFlinger）；否则创建VSyncThread软件模拟：threadLoop中计算下一次vsync时间（period优先取硬件值，其次1e9/fbDev->fps，默认1e9/60约16ms），clock_nanosleep(CLOCK_MONOTONIC)休眠后回调onVSyncReceived，返回true被系统再次调用形成循环。系统属性debug.sf.no_hw_vsync可强制软件模拟。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"EventThread如何分发VSync事件？","a":"SurfaceFlinger::onVSyncReceived将信号转交mEventThread->onVSyncReceived：填充mVSyncEvent[type]（类型DISPLAY_EVENT_VSYNC、时间戳、count++）并mCondition.broadcast()唤醒EventThread线程（注意onVSyncReceived运行在SurfaceFlinger线程）。EventThread::threadLoop中waitForEvent等待事件，醒来后从mDisplayEventConnections筛选出signalConnections，逐个通过conn->postEvent(event)经Connection分发。两类听众：SurfaceFlinger内部的MessageQueue（readyToRun中setEventThread绑定并建Connection）和需要刷新UI的应用进程（通过createDisplayEventConnection）。Connection首次被引用时经registerDisplayEventConnection注册。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"MessageQueue如何接收VSync事件（Connection与BitTube）？","a":"MessageQueue::setEventThread中：mEvents=eventThread->createEventConnection()创建EventThread::Connection；mEventTube=mEvents->getDataChannel()获取BitTube（数据传输通道，基于AF_UNIX域Socket Pair）；再mLooper->addFd(tube的fd, cb_eventReceiver)将fd注册到Looper的mRequests管理。EventThread是Server写Tube，MessageQueue是Client读；事件到来时Looper触发cb_eventReceiver→eventReceiver，若类型为DISPLAY_EVENT_VSYNC，按宏INVALIDATE_ON_VSYNC（默认1）执行mHandler->dispatchInvalidate()（否则dispatchRefresh()）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"dispatchInvalidate与dispatchRefresh的处理差异？","a":"dispatchInvalidate（INVALIDATE_ON_VSYNC=1时）：依次执行handleMessageTransaction()（处理客户端发起的Layer属性变更业务）→handleMessageInvalidate()（即handlePageFlip，处理数据无效/翻页）→signalRefresh()；dispatchRefresh：只执行handleMessageRefresh()。即Invalidate比Refresh多做了Transaction和Invalidate两步——先准备数据再刷新。handleMessageRefresh是刷新主流程：preComposition→rebuildLayerStacks→setUpHWComposer→doDebugFlashRegions→doComposition→postComposition。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"SurfaceFlinger::handleTransactionLocked做了什么？","a":"分两部分：Part1处理Flags（eTransactionNeeded=0x01、eTraversalNeeded=0x02、eDisplayTransactionNeeded=0x04）：遍历mCurrentState.layersSortedByZ，对getTransactionFlags表明需要doTransaction的Layer调用layer->doTransaction()；若返回eVisibleRegion则置mVisibleRegionsDirty=true。Part2“内务”处理：对比mCurrentState与mDrawingState中layersSortedByZ，检测新增/移除的Layer（移除意味着被遮挡区域可能显露），移除时通知Layer的onRemoved回调；最后commitTransaction()提交，mTransactionCV.broadcast()唤醒等待线程。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Layer::doTransaction做了什么？sequence变量的作用？","a":"对比drawingState(front)与currentState(temp)：1) 尺寸变化时调mSurfaceFlingerConsumer->setDefaultBufferSize更新默认宽高（requestBuffers未指定宽高时使用）；2) front.active!=temp.active时返回eVisibleRegion需重算可见区域；3) temp.sequence!=front.sequence时置eVisibleRegion和contentDirty=true，并根据transform判断mNeedsFiltering。sequence是int计数：当position、z-order、alpha、matrix、transparent region、flags、crop等属性变化（setXXX函数）时mCurrentState::sequence自增——平时只收集变化，VSync时统一处理，节约资源且避免频繁变化带来画面不稳定。最后commitTransaction()把mCurrentState赋给mDrawingState。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"handleMessageInvalidate（handlePageFlip）的核心流程？","a":"遍历mDrawingState.layersSortedByZ，对每个Layer调用latchBuffer（“锁住/闩上”当前要处理的buffer）：1) 若mQueuedFrames>0，先android_atomic_dec计数，多个queued frame时signalLayerUpdate再安排一次invalidate；2) 调mSurfaceFlingerConsumer->updateTexImage(&r)（r为Reject结构，通过rejecter->reject校验buffer是否符合要求，不符则releaseBufferLocked）；3) 成功则mActiveBuffer=getCurrentBuffer()更新活跃缓冲区，并配置glTexParameterx（GL_TEXTURE_EXTERNAL_OES，GL_CLAMP_TO_EDGE）；4) 返回dirtyRegion。之后invalidateLayerStack更新各DisplayDevice的脏区域。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"SurfaceFlingerConsumer::updateTexImage的步骤？","a":"1) acquireBufferLocked(&item)从BufferQueue的FIFO队头acquire一个buffer（enqueued的buffer压入队尾，acquire取队头），封装为BufferItem（item.mBuf为Slot序号）；2) 旧EGLImage非空时先eglDestroyImageKHR销毁；3) 调用rejecter->reject（BufferRejecter接口）验证buffer合法性（如size），被拒则releaseBufferLocked返回；4) releaseAndUpdateLocked生成Texture：内部调glBindTexture和glEGLImageTargetTexture2DOES（OpenGL ES对glTexImage2D的扩展，避免大图直接影响速度，与eglCreateImageKHR配套）；5) 处理完后release buffer（回到FREE供生产者dequeue），更新GLConsumer的mCurrentTexture、mCurrentTextureBuf等。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"preComposition做了什么？VSync Rate如何控制？","a":"preComposition遍历所有Layers逐个调用onPreComposition()（返回mQueuedFrames>0），只要有Layer存在queued frames则needExtraInvalidate=true，触发signalLayerUpdate→MessageQueue::invalidate→IDisplayEventConnection::requestNextVsync→EventThread::requestNextVsync（connection->count<0即disabled时置0并可接收一次事件，mCondition.broadcast()唤醒EventThread）。VSync Rate：setVsyncRate(1)每个VSync都报告，2为隔一个报告一次，0为不报告除非主动requestNextVsync；count含义：≥1连续接收、=0一次性事件未接收、=-1 disabled。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"rebuildLayerStacks的工作内容？","a":"当mVisibleRegionsDirty为true时：重置标志并invalidateHwcGeometry（置mHwWorkListDirty=true）；对mDisplays中每个DisplayDevice：1) computeVisibleRegions计算dirtyRegion（需重绘区域）和opaqueRegion（不透明区域，会遮挡Z-Order更小的Layer）；2) 遍历Layers，依据LayerStack匹配归属（s.layerStack==hw->getLayerStack()），对visibleNonTransparentRegion做Display的Transform变换并与bounds相交得drawRegion，非空则加入layersSortedByZ（天然按Z-Order有序）；3) 结果保存到hw：setVisibleLayersSortedByZ、undefinedRegion（bounds减去不透明区域）、dirtyRegion.orSelf。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"computeVisibleRegions如何计算各Layer的可见/脏/不透明区域？","a":"按Z-Order递减遍历（值大者靠近用户）。维护全局累积变量aboveCoveredLayers（上面遮盖区域）和aboveOpaqueLayers（上面不透明区域）。对每个Layer：visibleRegion=变换后bounds；若alpha==255且非translucent且无ROT_INVALID则opaqueRegion=visibleRegion；coveredRegion=aboveCoveredLayers与visibleRegion交集；aboveCoveredLayers并入visibleRegion；visibleRegion减去aboveOpaqueLayers（扣除被遮挡部分）。脏区域：contentDirty时dirty=visibleRegion并上老visibleRegion；否则dirty=(visibleRegion与oldCoveredRegion交集)|(newExposed-oldExposed)（考虑上次未显示完的missedDirty）；再减去aboveOpaqueLayers，累加到outDirtyRegion；aboveOpaqueLayers并入opaqueRegion。最终outOpaqueRegion=aboveOpaqueLayers。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"HWC HAL模块提供哪些接口？CompositionType有哪些值？","a":"接口：prepare（每帧合成前调用，判断HWC能完成哪些Layer，通过hwc_layer_1_t.compositionType回应）、set（代替早期eglSwapBuffers，把prepare达成的Work List实际交给HWC处理，内部会调eglSwapBuffers）、eventControl（控制HWC_EVENT_VSYNC等事件开关）、blank（屏幕开关）、query（查询状态）、registerProcs（注册回调hwc_procs：invalidate/vsync/hotplug）。CompositionType：HWC_BACKGROUND（prepare前设置，背景图层仅backgroundColor有效）、HWC_FRAMEBUFFER_TARGET（prepare前设置，GLES合成目标framebuffer surface，1.1+）、HWC_FRAMEBUFFER（prepare前设置，Layer由OpenGL ES绘制）、HWC_OVERLAY（prepare中由HWC设置，该Layer由HWC硬件处理）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"setUpHWComposer的三步工作是什么？","a":"一句话：把需显示的Layer数据准备好并“报告”给HWC决定由谁（OpenGL ES或HWC）合成。1) 构造Work List：mHwWorkListDirty为true时对各Display调用hwc.createWorkList(id, count)申请DisplayData::list空间（Work List是SurfaceFlinger给HWC的“报告”标准格式）；2) 逐Layer调用setPerFrameData填充数据：设置可见区域visibleRegion和mActiveBuffer（当前活跃GraphicBuffer，可能为NULL表示未生产或内存不足），注意参数类型是HWComposer::HWCLayerInterface；3) 调用displayhardware下的HWComposer::prepare()，内部将各Display的list汇总为mLists（二级指针）传给HAL模块的mHwc->prepare，HWC据此判定哪些Layer可由它处理。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"doComposition和doComposeSurfaces的流程？","a":"doComposition遍历各DisplayDevice：取dirtyRegion（mRepaintEverything为true则全屏）→doDisplayComposition（根据SWAP_RECTANGLE/PARTIAL_UPDATES微调dirtyRegion后调doComposeSurfaces，最后hw->swapBuffers）→清dirtyRegion/swapRegion→compositionComplete通知HWC→最后postFramebuffer（调hwc.commit()→HAL的set接口）。doComposeSurfaces：hasGlesComposition（有HWC_FRAMEBUFFER层的hasFbComp或cur==end）时makeCurrent设置渲染环境、glMatrixMode(GL_MODELVIEW)+glLoadIdentity，需要HWC合成时glClearColor(0,0,0,0)+glClear；遍历可见Layers，HWC_OVERLAY的跳过（HWC处理，必要时clearWithOpenGL），HWC_FRAMEBUFFER的调layer->draw→onDraw。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Layer::onDraw与drawWithOpenGL做了什么？","a":"onDraw：mActiveBuffer为0（应用尚未首次绘制）时，对下方无遮盖的holes区域clearWithOpenGL涂黑；否则bindTextureImage把当前缓冲区绑定到OpenGL纹理，再调drawWithOpenGL。drawWithOpenGL分两部分：Part1判断BLEND——s.alpha<0xFF时glColor4f设置alpha并glEnable(GL_BLEND)+glBlendFunc(src, GL_ONE_MINUS_SRC_ALPHA)（mPremultipliedAlpha即预乘alpha（ra,ga,ba,a）时src为GL_ONE否则GL_SRC_ALPHA）；完全不透明则glDisable(GL_BLEND)。Part2绘制——计算texCoords[4]纹理坐标（做1.0f-v翻转），glEnableClientState(GL_TEXTURE_COORD_ARRAY)、glTexCoordPointer、glVertexPointer设置顶点，glDrawArrays(GL_TRIANGLE_FAN, 0, count)绘制。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"DisplayDevice::swapBuffers何时调用eglSwapBuffers？","a":"并非任何情况都调用，满足其一即可：1) hwc.initCheck()!=NO_ERROR——HWC模块无法正确加载使用；2) hwc.hasGlesComposition(mHwcDisplayId)且hwc.supportsFramebufferTarget()——存在compositionType为HWC_FRAMEBUFFER的Layer且HWC支持Framebuffer Target。eglSwapBuffers(mDisplay, mSurface)交换前后台buffer，将合成结果显示到屏幕。若全部由HWC_OVERLAY硬件合成则无需经GLES交换。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"GL_TRIANGLE_FAN与GL_TRIANGLE_STRIP两种三角形绘制模式的区别？","a":"OpenGL ES取消了对QUAD的支持，只提供这两种方式（N个顶点都产生N-2个三角形）：GL_TRIANGLE_FAN——第n个三角形顶点为(1, n+1, n+2)，即所有三角形共享第一个顶点，呈扇形；GL_TRIANGLE_STRIP——N为奇数时第n个三角形顶点是(n, n+1, n+2)，N为偶数时是(n+1, n, n+2)，呈条带状连续排列。SurfaceFlinger的drawWithOpenGL中使用GL_TRIANGLE_FAN绘制Layer的四个顶点（左上、左下、右下、右上）。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"Android开机会依次显示哪些画面？BootAnimation为何是分析绘图流程的好例子？","a":"最多4个：1) BootLoader（静态图片）；2) Kernel（静态图片）；3) Android阶段最多2个——前一个是文字或静态图片（默认图片，图片不存在则显示文字），另一个是动画。动画实现类BootAnimation是/frameworks/base/cmds/bootanimation下的C++程序（init脚本中service bootanim启动，user/group为graphics），它借助SurfaceFlinger完成绘制；因非Java应用，无上层JNI和GLSurfaceView牵绊，且应用与SurfaceFlinger都基于OpenGL ES，是审视BufferQueue使用细节的最佳例子。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"ISurfaceComposerClient、IGraphicBufferProducer、Surface三者关系？","a":"ISurfaceComposerClient：应用与SurfaceFlinger间的通道，应用进程封装在SurfaceComposerClient中，由SurfaceFlinger（实名Binder，接口ISurfaceComposer）的createConnection获得，服务端实现是SurfaceFlinger::Client。IGraphicBufferProducer：由ISurfaceComposerClient::createSurface得到，同时SurfaceFlinger进程创建Layer代表一个“画面”（ISurface即控制画面的handle，保存于应用端SurfaceControl）；其Server端实现是BufferQueue。Surface：逻辑上是ISurface的使用者，继承上是本地窗口；内部持有IGraphicBufferProducer，EGL经Surface这个Native Window请求功能时，Surface再利用ISurface和IGraphicBufferProducer取得远程服务。","ch":"第9章 GUI系统——SurfaceFlinger"},{"q":"WindowManagerService(WMS)是什么？从用户、SurfaceFlinger、WMS三个角度看\"窗口\"分别是什么？","a":"WMS是Android的\"窗口管理员\"，系统级服务。\"窗口\"是个抽象概念：从用户角度看是一个\"界面\"（如拨号面板）；从SurfaceFlinger角度看是一个Layer，承载界面相关的数据和属性；从WMS角度看是一个WindowState，用于管理界面相关的状态。三者与ViewRoot的目标一致——正确高效地显示UI，只是职责不同。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"从I/O系统角度，WMS要完成的两大功能是什么？它与SurfaceFlinger的重要区别是什么？","a":"两大功能：①全局的窗口管理（Output）——应用的显示请求在SurfaceFlinger和WMS协助下有序输出到屏幕；②全局的事件管理派发（Input）——WMS还要\"兼职\"派发输入事件（键盘、触摸屏、鼠标、轨迹球等）。区别在于SurfaceFlinger只做与\"显示\"相关的事，WMS额外负责输入事件的派发与寻窗。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WMS作为系统服务具有哪些基本属性？WMS启动前屏幕如何显示？","a":"属性：①由SystemServer负责启动（启动时机较晚）；②直到系统关机才能退出；③发生异常时必须能自动重启。WMS启动前系统只需显示开机画面，如BootAnimation直接通过OpenGL ES与SurfaceFlinger配合输出图像——说明在Android中显示UI并不一定要通过WMS。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"实现窗口管理器涉及的元素有哪些？WMS内部需包含哪些子功能？","a":"涉及的元素：WMS、SurfaceFlinger、有图形显示需求的程序（Application Window/System Window/Sub Window优先级不同）、InputManagerService(IMS)、ActivityManagerService(AMS)、Binder通信。WMS子功能：窗口添加与删除、启动窗口、窗口动画、窗口大小、窗口层级（Z-Order）、事件派发。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WMS如何启动和注册？其AIDL接口IWindowManager提供哪些典型接口？","a":"SystemServer中调用WindowManagerService.main()创建WMS，并通过ServiceManager.addService(Context.WINDOW_SERVICE, wm)注册，其他进程可用\"window\"名称查询获取。IWindowManager.aidl典型接口：openSession（建立Session连接）、addWindowToken/removeWindowToken/addAppToken、prepareAppTransition等动画接口、setAppStartingWindow（启动窗口）、setAppVisibility、updateRotation、screenshotApplications等。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"4.1版本前后WMS的工作方式有何变化？调用者访问WMS的两种典型方式是什么？","a":"4.1中main()创建WMThread作为WMS独立主线程；4.1后WMThread不复存在，改用SystemServer中的wmHandlerThread，其他Service也可向其投递事件。两种访问方式：①事件投递——通过WMS的mH成员（与wmHandlerThread关联）把消息投递到其消息队列，如showStrictModeViolation；②直接调用——刻不容缓的事件直接调用WMS内部实现（处理仍运行在调用者线程中），如isKeyguardLocked。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WMS、AMS与Activity三者间如何进行IPC通信？","a":"Activity运行在应用进程，AMS和WMS运行在系统进程，需Binder通信。AMS与WMS驻留同一进程（都由SystemServer启动），可直接函数调用（如AMS.self().setWindowManager(wm)），WMS通过ActivityManagerNative.getDefault()拿到的实为AMS内存地址。应用访问WMS：实名Binder经ServiceManager获取IWindowManager，再通过openSession获得匿名Binder IWindowSession处理琐碎请求；WMS回访应用则用IWindow（应用端实现为W类，提供resized、dispatchAppVisibility、dispatchScreenState等回调）。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"一个新Activity启动时在AMS和WMS中分别如何记录？","a":"AMS在startActivity时生成ActivityRecord记录该Activity；WMS则用WindowState表示该窗口，并使用AppWindowToken对应AMS中的ActivityRecord。三者（Activity-ActivityRecord-WindowState/AppWindowToken）形成紧密联系，为窗口显示与管理打下基础。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"Android窗口三大类型及其类型值范围是什么？各举例说明。","a":"①Application Window：1-99，普通应用窗口，如TYPE_BASE_APPLICATION=1、TYPE_APPLICATION_STARTING=3（启动窗口，应用窗口出现后消失）、LAST_APPLICATION_WINDOW=99；②Sub Window：1000-1999，子窗口，属性受父窗口限制，如TYPE_APPLICATION_PANEL、TYPE_APPLICATION_MEDIA、TYPE_APPLICATION_ATTACHED_DIALOG（menu）；③System Window：2000-2999，如TYPE_STATUS_BAR、TYPE_KEYGUARD、TYPE_TOAST、TYPE_INPUT_METHOD、TYPE_WALLPAPER、TYPE_NAVIGATION_BAR等。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WMS中assignLayersLocked如何分配窗口最终层级值（mLayer）？窗口间隔为何是5？","a":"前提是windows已按mBaseLayer有序排列。遍历窗口：若当前窗口mBaseLayer与前一窗口相同（或是IM窗口/壁纸），则curLayer+=WINDOW_LAYER_MULTIPLIER(5)，w.mLayer=curLayer；否则curBaseLayer=curLayer=w.mBaseLayer。间隔设为5而非1，是为后期可能新增的effect surface预留空间。数值越大优先级越高，显示越靠近用户。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WindowState的mBaseLayer和mSubLayer如何计算？","a":"mBaseLayer = mPolicy.windowTypeToLayerLw(type) * TYPE_LAYER_MULTIPLIER(10000) + TYPE_LAYER_OFFSET(1000)。Step1：windowTypeToLayerLw做类型到Layer的映射（取决于WindowManagerPolicy，如PhoneWindowManager中应用窗口=2、输入法=9、状态栏=15）；Step2：乘10000为同类型多窗口预留间隔；Step3：加偏移1000用于移动同一层级的整组窗口。子窗口还需计算mSubLayer（如APPLICATION_PANEL_SUBLAYER=1在父窗口之上，APPLICATION_MEDIA_SUBLAYER=-2在父窗口之下），子窗口类型取决于父窗口类型。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"什么是Window Policy（窗口策略）？相关的4个类及关系是什么？","a":"Window Policy是Android显示系统遵循的统一窗口显示规则，针对不同产品（手机有Status Bar、平板有Combined Bar）策略不同，开发商可定制。相关4类：WindowManagerPolicy（策略接口类，定义getContentInsetHintLw、hasSystemNavBar等规范）；PhoneWindowManager（默认实现）；PolicyManager（提供makeNewWindow/makeNewWindowManager静态接口，通过反射加载com.android.internal.policy.impl.Policy）；Policy（Policy的生产者，接口为IPolicy，默认生成PhoneWindow和PhoneWindowManager）。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WindowManager.LayoutParams中有哪些重要属性？","a":"①Type：窗口类型（三大类）；②Flags：窗口标志，如FLAG_NOT_FOCUSABLE、FLAG_NOT_TOUCH_MODAL、FLAG_KEEP_SCREEN_ON、FLAG_FULLSCREEN（隐藏Status Bar等装饰窗口）、FLAG_SECURE（不出现在截屏）、FLAG_LAYOUT_IN_SCREEN、FLAG_LAYOUT_INSET_DECOR、FLAG_SHOW_WALLPAPER、FLAG_HARDWARE_ACCELERATED等；③systemUiVisibility：系统UI可见性，其Flags定义在View类中（如SYSTEM_UI_FLAG_LOW_PROFILE、HIDE_NAVIGATION、FULLSCREEN、LAYOUT_FULLSCREEN等）。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"SYSTEM_UI_FLAG_FULLSCREEN与SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN的区别？","a":"SYSTEM_UI_FLAG_FULLSCREEN（不带LAYOUT）：真正进入全屏，隐藏系统装饰窗口，应用内容区域要扣除系统窗口所占位置。SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN：只是\"假设\"已是全屏——保留StatusBar等系统窗口的同时让View从屏幕(0,0)开始布局，View顶部一小部分可能被StatusBar遮盖。适用于透明状态栏场景（用户透过状态栏可见应用内容）或需在显示/隐藏系统装饰窗口间切换时保持布局不变。SYSTEM_UI_FLAG_FULLSCREEN对FEATURE_ACTION_BAR_OVERLAY的ActionBar也能隐藏；暂态全屏用前者，长时间全屏（如游戏）最好用Window标志。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"以StatusBar为例，系统窗口的添加流程是怎样的？","a":"PhoneStatusBar.addStatusBarWindow先填写WindowManager.LayoutParams（宽MATCH_PARENT、高为状态栏高度、类型TYPE_STATUS_BAR、FLAG_NOT_FOCUSABLE|FLAG_TOUCHABLE_WHEN_WAKING等），然后mWindowManager.addView(mStatusBarWindow, lp)。mWindowManager实为本地WindowManagerImpl对象（经ContextImpl的SYSTEM_SERVICE_MAP获取），它转调单例WindowManagerGlobal.addView。ViewManager接口定义了addView/updateViewLayout/removeView，WindowManager接口继承自ViewManager。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WindowManagerGlobal.addView的本地处理逻辑是什么？","a":"①findViewLocked检查mViews[]中是否已添加过该view，重复则抛异常；②为view新建ViewRootImpl；③维护三个平行数组mViews、mRoots、mParams（同一index描述同一对象，每次添加时new新数组并System.arraycopy扩容）；④最后调用root.setView(view, wparams, panelParentView)——真正的跨进程操作从这里开始。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"ViewRootImpl.setView中如何将窗口注册到WMS？为什么要先requestLayout？","a":"setView先保存mView=view并调用requestLayout()发起第一次layout——因为WMS还负责事件派发，注册前应用要确保View树已做好接收事件的准备。随后调用mWindowSession.addToDisplay(mWindow, mSeq, mWindowAttributes, viewVisibility, displayId, contentInsets, mInputChannel)，Session服务端（Session.java）再直接调用WMS的addWindow。参数中mWindow（IWindow，W类）用于WMS回访，mSeq用于状态同步（记录在WindowState.mSeq）。WMS不关心View树内容，只关心大小、层级等属性。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WMS.addWindow的主要步骤有哪些？","a":"Step1 mPolicy.checkAddPermission权限检查（非系统窗口任何人可加，TYPE_TOAST例外允许应用，TYPE_PHONE等需SYSTEM_ALERT_WINDOW权限）；Step2 mWindowMap查重（一个IWindow只能添加唯一窗口）；Step3 子窗口需找父窗口且父窗口不能是子窗口；Step4 根据类型检查Token有效性（应用窗口/IM/壁纸/DREAM必须在mTokenMap中有案）；Step5 new WindowState（内含mBaseLayer分配）；Step6 客户端死亡则返回；Step7 Policy调整参数（adjustWindowParamsLw、prepareAddWindowLw）；Step8 新Token加入mTokenMap；Step9 addWindowToListInOrderLocked排序插入（壁纸相关调adjustWallpaperWindowsLocked）；Step10 getContentInsetHintLw计算ContentInset；Step11 assignLayersLocked分配层级。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WMS中的mWindowMap和mTokenMap有何区别？attrs.token是什么？","a":"mWindowMap是<IBinder, WindowState>的HashMap，key是IWindow，映射到WMS中对应的WindowState；mTokenMap是<IBinder, WindowToken>的HashMap。attrs.token是IBinder类型，代表窗口的\"主人\"——AMS为每个Activity创建的ActivityRecord本质就是一个IBinder，启动Activity时自动赋值。token有效性检查：应用窗口、TYPE_INPUT_METHOD、TYPE_WALLPAPER、TYPE_DREAM必须在mTokenMap中事先存在（由AMS自动完成），且ViewRoot的windowType须与AMS登记的token.windowType一致，否则报ADD_BAD_APP_TOKEN。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"addWindowToListInOrderLocked对系统窗口（如StatusBar，appWindowToken为null）如何定位插入？","a":"attached==null且token.appWindowToken==null时，用窗口的mBaseLayer做参考：从windows列表末尾（N-1）向前遍历，找到第一个mBaseLayer<=myLayer的窗口，插入其之后（i++位置）。由于从大至小遍历，一旦myLayer大于某窗口的mBaseLayer就必然大于其后所有窗口。同一类型窗口后创建的优先级高（如StatusBar的mBaseLayer=15*10000+1000=151000）。最终layer仍由assignLayersLocked分配。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"Activity窗口的添加流程是怎样的？与系统窗口添加有何异同？","a":"流程：AMS在startActivityLocked中调用WMS.addAppToken将ActivityRecord记入mTokenMap（否则后续addWindow会失败）；Activity经历onCreate→onStart→onResume，handleResumeActivity中performResumeActivity触发onResume，随后取DecorView（设为INVISIBLE）、设置类型TYPE_BASE_APPLICATION，调WindowManagerImpl.addView(decor, l)→最终同样进入WMS.addWindow。相同点：WMS一视同仁生成WindowState。不同点：应用窗口加入全局列表时走addWindowToListInOrderLocked中token.appWindowToken!=null分支——若应用已有窗口，TYPE_BASE_APPLICATION被placeWindowBefore放在该应用窗口队列最底端；若无窗口，则通过mAnimatingAppTokens查找参考位置（placeWindowBefore/placeWindowAfter）或按BaseLayer插入。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"Surface的五种状态（mDrawState）分别是什么？","a":"①NO_SURFACE(0)：Surface还没有创建；②DRAW_PENDING(1)：Surface已创建但窗口还没开始绘制，Surface处于隐藏状态；③COMMIT_DRAW_PENDING(2)：窗口第一次绘制完毕但Surface还没显示，将在下一次layout中显示；④READY_TO_SHOW(3)：绘制请求已提交，还在等待其他因素（类似进程Ready状态）；⑤HAS_DRAWN(4)：窗口已经第一次显示在屏幕上。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"ViewRootImpl如何通过relayout申请Surface？为什么初始mSurface是\"空壳\"？","a":"performTraversals中调用relayoutWindow→mWindowSession.relayout(...)，WMS端relayoutWindow核心调用winAnimator.createSurfaceLocked()生成SurfaceControl，再outSurface.copyFrom(surfaceControl)。ViewRootImpl中mSurface=new Surface()初始是空壳，因为无参构造不调用nativeCreate，未与SurfaceFlinger建立联系。AIDL的out参数Surface在服务端new后经writeToParcel（JNI实现）写入reply，客户端经readFromParcel→nativeReadFromParcel读取，获得与IGraphicBufferProducer（Buffer的管理者）挂钩的有效Surface(C++)对象。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"createSurfaceLocked做了什么？Surface的跨进程创建链条是什么？","a":"createSurfaceLocked（WindowStateAnimator中）：置mDrawState=DRAW_PENDING，new SurfaceControl(mSession.mSurfaceSession, title, w, h, format, flags)，置mWin.mHasSurface=true，然后在Surface.openTransaction/closeTransaction之间设置属性。链条：WindowState.attach()→Session.windowAddedLocked生成mSurfaceSession→createSurfaceLocked中nativeCreate→android_view_SurfaceSession_getClient取得SurfaceComposerClient（SurfaceFlinger的\"代表\"）→client->createSurface()在SurfaceFlinger中创建。destroySurfaceLocked负责销毁。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"Surface的openTransaction/closeTransaction的作用是什么？","a":"它们调用JNI的SurfaceComposerClient::openGlobalTransaction/closeGlobalTransaction，最终在close时通过ISurfaceComposer::setTransactionState()统一提交。两者之间的所有Surface属性设置（setSize、setLayer、setPosition、setAlpha等）不会及时生效，而是业务关闭后统一告知SurfaceFlinger。好处：①频繁变更属性时提高效率；②避免属性过快更新带来画面不稳定等负面影响。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"performLayoutAndPlaceSurfacesLockedInner的整体结构是什么？","a":"WMS中最长最难理解却最核心的函数。分两部分：①try块中openTransaction开启业务，执行do...while循环（退出条件pendingLayoutChanges==0，最多6次）：repeats<4时调performLayoutLockedInner计算窗口大小；对默认Display应用mPolicy的beginPostLayoutPolicyLw/applyPostLayoutPolicyLw/finishPostLayoutPolicyLw并更新pendingLayoutChanges；然后处理动画相关计算；finally中closeTransaction把结果统一报知SurfaceFlinger。②收尾工作：执行app transition、销毁不再可见的窗口、移除退出tokens、移除退出应用，最后scheduleAnimationLocked安排动画。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"pendingLayoutChanges有哪些可选值？performLayoutLockedInner如何执行layout？","a":"可选值（\"或\"关系）：FINISH_LAYOUT_REDO_LAYOUT=0x0001（需重新layout）、FINISH_LAYOUT_REDO_CONFIG=0x0002（Configuration可能改变，发SEND_NEW_CONFIGURATION消息）、FINISH_LAYOUT_REDO_WALLPAPER=0x0004（壁纸需挪动）、FINISH_LAYOUT_REDO_ANIM=0x0008（需重新计算动画）。performLayoutLockedInner：layoutNeeded为false直接返回；先处理Root Windows（无父窗口，mPolicy.layoutWindowLw(win, attrs, null)），从topAttached开始处理Attached Windows（传入win.mAttachedWindow作参考），最后mPolicy.finishLayoutLw()。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"窗口大小计算的三步Policy流程是什么？为什么这样设计？","a":"①mPolicy.beginLayoutLw：初始化PhoneWindowManager中各区域变量（mOverscanScreen*、mUnrestrictedScreen*、mRestrictedScreen*、mSystem*、mCur*、mContent*、mDock*，初始满屏；处理导航栏位置——竖屏底端/横屏右侧，状态栏computeFrameLw）；②mPolicy.layoutWindowLw：按窗口flags、softInputMode、systemUiVisibility分Case计算pf(父窗口)、df(屏幕)、cf(内容)、vf(可见)四个临时Rect，最后win.computeFrameLw(pf,df,cf,vf)确认得到mParentFrame/mDisplayFrame/mContentFrame/mVisibleFrame；③mPolicy.finishLayoutLw：清理（4.3中为空实现）。这样设计是为了兼容多种设备——提取共性、降低产品间切换代价。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"layoutWindowLw对普通窗口分哪4种Case处理？ContentInsets与VisibleInsets有何区别？","a":"Case1：FLAG_LAYOUT_IN_SCREEN+FLAG_LAYOUT_INSET_DECOR且非FULLSCREEN（应用窗口典型情况，需考虑状态栏避免被挡）；Case2：FLAG_LAYOUT_IN_SCREEN或SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN/LAYOUT_HIDE_NAVIGATION（希望满屏）；Case3：attached!=null子窗口（setAttachedWindowFrames）；Case4：其他（仅TYPE_STATUS_BAR_PANEL与否的区分，它可显示在状态栏之上）。ContentInsets是显示窗口\"内容\"的区域，VisibleInsets是窗口\"可见\"部分——adjustResize时二者一致（内容缩小可见也缩小）；adjustPan时窗口不变，软键盘盖住部分可见区域，二者不一致。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"windowSoftInputMode的可选值分哪两类？adjustResize与adjustPan的区别？","a":"分两类（\"或\"关系）：state开头控制activity成为焦点时软键盘隐藏或可见（stateUnspecified/stateUnchanged/stateHidden/stateAlwaysHidden/stateVisible/stateAlwaysVisible）；adjust开头控制如何调整窗口以容纳软键盘（adjustUnspecified/adjustResize/adjustPan）。adjustResize：Activity窗口总是被重新设置大小以容纳软键盘（如短信编辑界面）；adjustPan：窗口大小不变，但窗口内容做适当平移，保证用户能及时看到输入结果（如通讯录编辑界面，输入法覆盖部分可见区域）。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"启动窗口（Starting Window）的作用、触发条件和设置流程是什么？","a":"作用：新Activity启动时先显示预览窗口，转移用户注意力，使启动过程流畅（App启动慢时尤有益）。触发：AMS的ActivityStack.startActivityLocked中NH>0（切换到新Task或另一进程）且SHOW_APP_STARTING_PREVIEW=true、doShow=true时，调WMS.setAppStartingWindow。流程：WMS再次验证（AppWindowToken非空、屏幕非frozen/disabled、startingData为null）；transferFrom非空时移交已有启动窗口或复用其startingData；否则createIfNeeded=true时新建（但windowIsTranslucent/windowIsFloating/windowShowWallpaper主题不建）；发ADD_STARTING消息（sendMessageAtFrontOfQueue保证及时处理）→mPolicy.addStartingWindow（PhoneWindowManager）生成PhoneWindow，类型TYPE_APPLICATION_STARTING、MATCH_PARENT满屏、不可touch/focus，wm.addView(decorView, params)走与Activity窗口相同的添加流程。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"启动窗口如何销毁？涉及哪三个方面？","a":"主窗口显示后启动窗口销毁，WMS收到REMOVE_STARTING或FINISHED_STARTING消息处理。三方面：①窗口拥有者——WindowManagerImpl通过mViews/mRoots/mParams管理窗口，PhoneWindowManager.removeStartingWindow后由WindowManagerImpl执行removeView，清理分ViewRootImpl.die（immediate为true直接doDie，否则入MSG_DIE消息；doDie先checkThread验证线程——只有创建UI的线程才能操作它，再dispatchDetachedFromWindow并置mAdded=false）和removeItem；②Surface——dispatchDetachedFromWindow中mSurface.release释放缓冲区；③WMS中WindowState——通过sWindowSession.remove(mWindow)→Session→WMS.removeWindow，最后performLayoutAndPlaceSurfacesLocked调整界面。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"窗口动画分为哪两类？动画的本质和4种基本变换是什么？为什么动画不需要额外窗口？","a":"两类：进入动画（Enter Animation）和退出动画（Exit Animation），可定制。本质：快速连续显示若干图像产生\"动\"的错觉，更新速率需达12帧/秒以上才平滑。4种基本变换（可用Matrix统一实现）：平移Translate、旋转Rotate、缩放Scale、透明度Alpha。不需要额外窗口的原因：任何动画效果都可分解为\"窗口本身\"+\"特定时间点的Matrix变换矩阵\"+\"一个代表Alpha变换的float值\"。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"Android有哪些核心窗口动画管理者？Window相关和App相关的Transit类型有哪些？","a":"三个核心管理者：AppWindowAnimator（AppWindowToken.mAppAnimator）、WindowStateAnimator（WindowState.mWinAnimator，从旧版WindowState分离，还负责Surface相关操作）、ScreenRotationAnimation（WindowAnimator.mScreenRotationAnimation，WMS的mAnimator是WindowAnimator对象）。Window相关（WindowManagerPolicy.java）：TRANSIT_ENTER/EXIT/SHOW/HIDE/PREVIEW_DONE。App相关（AppTransition.java）：TRANSIT_UNSET/NONE/ACTIVITY_OPEN/ACTIVITY_CLOSE/TASK_OPEN/TASK_CLOSE。ENTER_MASK=0x1000、EXIT_MASK=0x2000，通过MASK鉴别进入或退出动画。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"WindowStateAnimator的applyEnterAnimationLocked和applyAnimationLocked流程？","a":"applyEnterAnimationLocked：mEnterAnimationPending为true时transit=TRANSIT_ENTER（\"从无到有\"，如addWindow或从GONE变VISIBLE），否则TRANSIT_SHOW，再调applyAnimationLocked(transit, true)。applyAnimationLocked：若正在执行的动画类型一致则不重复执行；okToDisplay()时先mPolicy.selectAnimationLw选择动画资源id（特殊窗口如StatusBar/NavigationBar），anim为0则按transit取attr（TRANSIT_ENTER→windowEnterAnimation、TRANSIT_EXIT→windowExitAnimation），经mAppTransition.loadAnimation（内部AnimationUtils.loadAnimation）加载，最后setAnimation保存到mAnimation并初始化（restrictDuration、scaleCurrentDuration）——此时只是设置，并未真正执行。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"App Transition的动画定制类型（mNextAppTransitionType）有哪些？","a":"①ANIM_NONE：默认，按属性读取动画（如TRANSIT_ACTIVITY_OPEN优先用android:activityOpenEnterAnimation/activityOpenExitAnimation）；②ANIM_CUSTOM：通过Activity.overridePendingTransition定制，对应WMS的overridePendingAppTransition；③ANIM_SCALE_UP：startActivity的ActivityOptions指定，画面从小到大，对应overridePendingAppTransitionScaleUp，由createScaleUpAnimationLocked生成；④ANIM_THUMBNAIL/ANIM_THUMBNAIL_DELAYED：启动前先从指定位置Scale Up缩略图，DELAYED表示先延时，由createThumbnailAnimationLocked生成。最终动画都存入AppWindowAnimator。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"窗口动画的执行机制：触发源、Choreographer和animateLocked的流程？","a":"触发源是VSYNC信号——scheduleAnimationLocked通过线程唯一的mChoreographer.postCallback(CALLBACK_ANIMATION, mAnimationRunnable)注册（mAnimationScheduled防止重复）。Choreographer（\"编舞者\"）是VSYNC的接收者和转发者，将注册者分为Input、Animation、Traversal三类存于CallbackQueue[]。VSYNC到达后mAnimationRunnable.run()复位mAnimationScheduled并调WindowAnimator.animateLocked：openTransaction/setAnimationTransaction→Step1 updateAppWindowsLocked（App动画）→Step2 ScreenRotationAnimation步进→Step3 performAnimationsLocked（updateWindowsLocked/updateWallpaperLocked）对每个winAnimator.stepAnimationLocked单步→Step4对每个窗口prepareSurfaceLocked准备Surface数据（computeShownFrameLocked计算、setPosition/setSize/setWindowCrop/setAlpha/setLayer/setMatrix）→closeTransaction统一提交SurfaceFlinger。mAnimating为true则继续schedule下一次；wasAnimating为true时动画最后一次step后requestTraversalLocked发DO_TRAVERSAL消息。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"stepAnimationLocked中mLocalAnimating、mAnimating、mWasAnimating各是什么含义？stepAnimation做什么？","a":"mLocalAnimating：指示动画是否已执行过第一次step——为false时需先初始化（mAnimation.initialize尺寸、setStartTime起始时间）再置true；mAnimating：当前正在执行动画中；mWasAnimating：记录上一次的mAnimating，供WMS判断动画是否刚结束。stepAnimation：先清空mTransformation（getTransformation根据当前时间与起始时间直接计算新变换值，不依赖上次结果），调用mAnimation.getTransformation(currentTime, mTransformation)，返回more指示动画是否结束。Transformation封装Matrix（平移/旋转/缩放）和float（Alpha），是\"动态计算\"；Animation是\"静态描述\"（起点、终点、时长、速率）。窗口计算shownFrame时考虑selfTransformation、attachedTransformation、appTransformation三种变换。","ch":"第10章 GUI系统之“窗口管理员”——WMS"},{"q":"ViewRoot（ViewRootImpl）是View树的根吗？它和View是什么关系？","a":"不是。ViewRoot并不属于View树，与View没有任何继承（\"血缘\"）关系，既非View的子类也非父类。它是\"View树的管理者\"，内部有mView成员变量指向所管理的View树的根（如id为top的元素）。其核心任务是与WindowManagerService（WMS）进行通信，负责窗口注册、遍历调度、事件传递等。","ch":"第11章 View体系"},{"q":"Activity、Window、PhoneWindow三者是什么关系？","a":"Activity不直接管理View树或ViewRoot，中间通过mWindow成员变量（Window类型）建立联系。Window是基类，表示\"UI界面的外框/框架抽象\"，由Activity.attach中PolicyManager.makeNewWindow创建，默认生成PhoneWindow子类。PhoneWindow负责规划框内的具体布局和内容（DecorView等），每个Activity中有且仅有一个PhoneWindow实例。Activity无需随Window子类不同而修改。","ch":"第11章 View体系"},{"q":"Window、WindowManager、WindowManagerImpl三者关系如何？","a":"Window面向Activity表示界面外框；它不直接与WMS通信（一个应用可能有多个Window，各自通信会浪费资源且管理混乱），于是把通信职责交给作为其成员变量mWindowManager的WindowManager。WindowManager是接口类，真正实现是WindowManagerImpl，后者是整个应用进程中所有Window的统一管理者，类似\"地方与中央\"的关系。","ch":"第11章 View体系"},{"q":"WindowManagerGlobal管理哪三个数组？Android 4.3前后有何变化？","a":"早期WindowManagerImpl在每个进程中只有一个实例（通过getDefault()获取），内部维护3个全局数组：mViews（View树根/DecorView）、mRoots（ViewRootImpl）、mParams（WindowManager.LayoutParams），三数组元素一一对应，同一index描述同一个Activity的View树、ViewRoot和布局属性。Android 4.3起改由WindowManagerGlobal类统一管理这些数组，本质未变。一个进程可有多个ViewRoot，Activity与ViewRoot一对一。","ch":"第11章 View体系"},{"q":"ViewRootImpl与WMS如何建立双向通信？","a":"每个ViewRootImpl内部有static的IWindowSession变量（sWindowSession/mWindowSession），是ViewRoot调用WMS的openSession()接口创建的，用于ViewRoot到WMS的通信；同时ViewRoot通过IWindowSession.add()/addToDisplay()向WMS提供一个IWindow对象（内部类W），使WMS也能反向回调ViewRoot。IWindowSession和IWindow都是匿名Binder Server，而WMS本身是ServiceManager中注册的实名Binder。","ch":"第11章 View体系"},{"q":"请描述Activity中View Tree创建的主要流程（handleLaunchActivity开始的步骤）。","a":"Step1：AMS通知启动Activity转化为ActivityThread的LAUNCH_ACTIVITY消息，调用handleLaunchActivity。Step2：performLaunchActivity——通过ClassLoader和mInstrumentation.newActivity创建Activity，调用attach（内部mWindow=PolicyManager.makeNewWindow得到PhoneWindow），再经callActivityOnCreate调用onCreate（其中setContentView构造DecorView）。Step3：handleResumeActivity——调用performResumeActivity触发onResume，然后通过wm.addView(decor,l)将DecorView添加到WindowManagerGlobal并创建ViewRootImpl，最后root.setView注册到WMS。","ch":"第11章 View体系"},{"q":"setContentView做了什么？DecorView和mContentParent如何生成？","a":"setContentView由onCreate发起，通过PhoneWindow完成DecorView构造：若mContentParent为null（第一次调用）则调用installDecor，否则先removeAllViews清理旧内容。installDecor做两件事：1) generateDecor() new一个DecorView（继承自FrameLayout）；2) generateLayout(mDecor)——读取窗口样式（windowIsFloating、windowNoTitle等），据此挑选匹配的layout资源并inflate后addView到mDecor，返回id为ID_ANDROID_CONTENT（com.android.internal.R.id.content）的ViewGroup作为mContentParent。最后mLayoutInflater.inflate(layoutResID, mContentParent)填充应用内容。setContentView不负责真正显示。","ch":"第11章 View体系"},{"q":"handleResumeActivity中DecorView是如何被添加并注册到WMS的？","a":"performResumeActivity触发onResume后：取得activity.getWindow()和getDecorView()，先decor.setVisibility(View.INVISIBLE)，设置LayoutParams（l.type=TYPE_BASE_APPLICATION），然后调用a.getWindowManager()（返回WindowManagerImpl）的addView(decor,l)。WindowManagerGlobal.addView中先findViewLocked查重（重复添加直接返回），new ViewRootImpl，把view/root/params存入mViews/mRoots/mParams三个数组，最后root.setView(view,wparams,panelParentView)——将DecorView记入ViewRootImpl的mView，并通过mWindowSession.addToDisplay向WMS注册窗口。","ch":"第11章 View体系"},{"q":"setView中requestLayout的作用和addToDisplay的调用时机？","a":"ViewRootImpl.setView中：先把View树的根记入mView，然后调用requestLayout()。源码注释表明要在添加到WMS之前schedule第一次layout（\"Schedule the first layout -before- adding to the window manager\"），确保在收到系统其他事件前先完成relayout——这是第一次遍历的触发源。之后通过mWindowSession.addToDisplay(mWindow, mSeq, mWindowAttributes...)（最终调用WMS的addWindow）向WMS申请注册窗口。","ch":"第11章 View体系"},{"q":"ViewRoot的工作方式和触发源有哪些？为什么用Handler处理消息？","a":"触发源分两类：1) View Tree内部请求——如View调用invalidate/requestLayout，请求沿View Tree层层上传到ViewRoot；2) 外部状态更新——WMS回调通知界面大小改变、触摸/按键事件等。ViewRoot通常不直接处理，而是先入队再由内部ViewRootHandler统一处理。这个Handler与主线程MessageQueue挂钩，证明ViewRoot操作在主线程进行，因此处理事件时不能有耗时操作，否则阻塞主线程引发ANR。","ch":"第11章 View体系"},{"q":"什么是View Tree的遍历（Traversal）？UI显示三要素对应哪三个函数？","a":"遍历是系统综合考量View树各元素\"请求\"并公平分配结果的过程。UI显示三要素：尺寸大小、位置、内容，分别对应performMeasure（计算绘图区域大小）、performLayout（计算绘图位置）、performDraw（在确定的大小位置上绘制UI内容）。遍历主体是ViewRootImpl.performTraversals（七百多行），按三步顺序执行，各步通过递归方式自上而下处理View树。","ch":"第11章 View体系"},{"q":"View Tree在什么情况下会执行遍历？请举例。","a":"1) 应用刚启动：setView中调用requestLayout()发起第一次遍历；2) 外部事件：用户触摸、按键等事件可能影响UI显示，必要时发起遍历；3) 内部事件：如时钟应用定时刷新、View的Visibility从GONE到VISIBLE等。具体例子：View.requestLayout()、View.setLayoutParams()、View.invalidate()、dispatchAppVisibility（应用可见性变化）。最终由ViewRootImpl通过scheduleTraversals安排遍历。","ch":"第11章 View体系"},{"q":"requestLayout的实现原理是什么？为何要checkThread？","a":"View.requestLayout()：先置位mPrivateFlags的PFLAG_FORCE_LAYOUT和PFLAG_INVALIDATED，然后把请求上传给mParent.requestLayout()。ViewParent可能是ViewGroup（未重写，继续向上一级传递）或ViewRootImpl。ViewRootImpl的requestLayout：1) checkThread()检查当前是否为主线程（生成ViewRootImpl的线程），Android规定只有主线程能操作UI，也避免了多线程访问无需额外同步；2) 置mLayoutRequested=true；3) scheduleTraversals()安排遍历。","ch":"第11章 View体系"},{"q":"invalidate的作用和传递流程？与postInvalidate的区别？","a":"invalidate意为\"使无效\"，将当前UI判定为无效引发重绘，只能从UI线程调用，其他线程需用postInvalidate。实现：先skipInvalidate()判断（View不可见且无动画则忽略），满足标志条件后置PFLAG_INVALIDATED、PFLAG_DIRTY并清除PFLAG_DRAWING_CACHE_VALID，然后调用mParent.invalidateChild(this,dirty)沿View树向上传递。ViewGroup.invalidateChild是\"从下而上\"回溯收集dirty区域；ViewRootImpl.invalidateChild是\"从上而下\"真正发起遍历实现重绘。","ch":"第11章 View体系"},{"q":"scheduleTraversals如何驱动遍历？Choreographer扮演什么角色？","a":"scheduleTraversals中用mTraversalScheduled标志防止重复调度，然后调用mChoreographer.postCallback(Choreographer.CALLBACK_TRAVERSAL, mTraversalRunnable, null)注册回调。Choreographer是\"Project Butter\"项目的产物。当VSYNC信号来临时，mTraversalRunnable的run()被调用，直接执行doTraversal()：复位mTraversalScheduled后调用performTraversals()执行真正的遍历。这样保证UI更新与VSYNC同步、在最快时间内有序组织界面刷新。","ch":"第11章 View体系"},{"q":"performMeasure的执行条件有哪些（三个层级）？","a":"层级1（或关系）：mFirst（第一次performTraversals）、windowShouldResize（layoutRequested且windowSizeMayChange且宽高不符）、insetsChanged（WMS要求的content insets变化）、viewVisibilityChanged（可见性变化或需产生新Surface）、params!=null（LayoutParams属性变化）。层级2：!mStopped（Activity处于stop状态时其Window也被stopped，不执行）。层级3（或关系）：focusChangedDueToTouchMode、mWidth!=host.getMeasuredWidth()、mHeight!=host.getMeasuredHeight()、contentInsetsChanged。满足后performMeasure调用mView.measure(childWidthMeasureSpec, childHeightMeasureSpec)。","ch":"第11章 View体系"},{"q":"MeasureSpec是什么？三种mode的含义及与LayoutParams的对应关系？","a":"MeasureSpec是一个int值，格式为mode（最高二位）+size，通过MeasureSpec.makeMeasureSpec生成，getMode/getSize分别取出mode和size。三种mode：UNSPECIFIED=0（父对象无强制约束）；EXACTLY=1（父对象要求子对象严格按给定值约束自己）；AT_MOST=2（子对象可在给定范围内自行选择）。与LayoutParams关联：MATCH_PARENT对应EXACTLY，WRAP_CONTENT对应AT_MOST。树根的spec由ViewRootImpl通过getRootMeasureSpec(mWidth, lp.width)生成。","ch":"第11章 View体系"},{"q":"自定义View时应该重载measure还是onMeasure？为什么？","a":"应该重载onMeasure而不是直接重载measure。真正的测量工作在onMeasure中进行，View默认实现是setMeasuredDimension(getDefaultSize(getSuggestedMinimumWidth(),widthMeasureSpec),...)。扩展View通常有自身考虑因素，需重载onMeasure，且结束时必须调用setMeasuredDimension保存结果到mMeasuredWidth/mMeasuredHeight（其中还包含state，需经resolveSizeAndState整合），否则getMeasuredWidth/Height无法取到正确值。","ch":"第11章 View体系"},{"q":"以FrameLayout为例说明onMeasure的流程。","a":"Step1：判断父对象mode，宽或高任一不是EXACTLY则需match parent处理。Step2：for循环遍历子对象，用measureChildWithMargins（考虑padding和margin，生成新spec后调用child.measure）向下递归测量；可见性为GONE且mMeasureAllChildren为false的子对象跳过。Step3：取子对象最大宽高：maxWidth=max(maxWidth, child.getMeasuredWidth()+lp.leftMargin+lp.rightMargin)。Step4：叠加ViewGroup自身padding、getSuggestedMinimumWidth/Height（mMinHeight与mBackground.getMinimumHeight()取大）及foreground宽高。Step5：resolveSizeAndState整合后setMeasuredDimension记录。","ch":"第11章 View体系"},{"q":"padding和margin有什么区别？为什么View只有padding？","a":"padding指View\"内容区域\"与外围边框的距离，有left/right/top/bottom四个方向，View类拥有padding属性。margin是\"内容\"内部各元素之间的间距，用于区分ViewGroup中多个子对象。一个非ViewGroup的View实例，其\"内容\"本身不可分割，不存在内部对象间距的说法，所以View不提供margin属性；margin由ViewGroup.MarginLayoutParams类专门处理（android:layout_marginLeft等）。","ch":"第11章 View体系"},{"q":"performLayout的执行条件是什么？Layout与measure的关系？","a":"官方定义Layout是two pass process：measure pass（measure()，自上而下遍历）+ layout pass（layout()，也自上而下，父对象负责用measure阶段算出的尺寸为子元素定位）。即Layout=measure()+layout()，对应onMeasure+onLayout。执行条件：didLayout = layoutRequested && !mStopped，其中layoutRequested由mLayoutRequested（requestLayout发起、第一次遍历、宽高与期望值不符等时为true）决定。performLayout调用host.layout(0,0,host.getMeasuredWidth(),host.getMeasuredHeight())。","ch":"第11章 View体系"},{"q":"View.layout(l,t,r,b)做了什么？onLayout为什么在View中是空的？","a":"layout的l/t/r/b是View与父对象左、上、右、下边框的距离。与measure不同，layout通过setFrame直接将这4个值记录到成员变量mLeft/mTop/mRight/mBottom（4个值同时决定了位置和大小，getWidth()=mRight-mLeft）。若changed为true（边距与上次相比有变化）或PFLAG_LAYOUT_REQUIRED置位，则调用onLayout(changed,l,t,r,b)——它是对子对象布局调整的过程。View的onLayout实现体为空，因为它没有子对象；ViewGroup的子类（如FrameLayout）必须重载它来实现具体布局。","ch":"第11章 View体系"},{"q":"FrameLayout的onLayout如何计算子View的位置？","a":"FrameLayout子对象是\"层叠\"的，不存在竞争空间问题，位置取决于子对象自身与父对象的调整。先算出parentLeft/parentRight/parentTop/parentBottom（考虑padding），再根据子对象的lp.gravity通过Gravity.getAbsoluteGravity计算：如Gravity.CENTER_HORIZONTAL时childLeft=parentLeft+(parentRight-parentLeft-width)/2+lp.leftMargin-lp.rightMargin；LEFT时childLeft=parentLeft+lp.leftMargin；RIGHT时childLeft=parentRight-width-lp.rightMargin。childTop计算类似，最后调用child.layout(childLeft,childTop,childLeft+width,childTop+height)。","ch":"第11章 View体系"},{"q":"drawSoftware的流程是什么？","a":"4步：1) lockCanvas——mSurface.lockCanvas(dirty)锁定并取得Canvas，lock异常则drawSoftware失败返回false；2) 坐标变换——canvas.translate(0,-yoff)平移及mTranslator变换；3) mView.draw(canvas)——从View树顶层元素开始递归绘制；4) unlockCanvasAndPost——释放Canvas并把绘制结果通过Surface提交给SurfaceFlinger，由后者合成渲染到Framebuffer显示。dirty参数表示需要重绘的区域。","ch":"第11章 View体系"},{"q":"Surface::lock做了哪些事？backBuffer/frontBuffer是什么？","a":"Step1：检查mLockedBuffer是否已存在（最多同时locked一个buffer），是则返回INVALID_OPERATION；Step2-4：若mConnectedToCpu为false则connect(NATIVE_WINDOW_API_CPU)并setUsage(SW_READ_OFTEN|SW_WRITE_OFTEN)；Step5：dequeueBuffer从buffer队列申请可用buffer；Step6：backBuffer是当前处理的buffer，frontBuffer（mPostedBuffer）是上一次处理的buffer——注意不是双缓冲概念。若两者宽高格式一致（canCopyBack）则通过copyBlt把frontBuffer中非dirty区域数据复制过来，否则须重绘整个屏幕；Step7：backBuffer->lock锁定内存得到vaddr；Step8：mLockedBuffer=backBuffer并通过outBuffer返回宽高及bits地址。","ch":"第11章 View体系"},{"q":"Canvas、Surface、Bitmap（Skia）三者如何协作？","a":"Canvas（底层为SkCanvas）是\"作画工具集/打印机\"，Bitmap（SkBitmap）是\"纸张\"，Surface是数据中介，负责管理SurfaceFlinger分配的存储UI数据的内存块。Surface.lockCanvas的JNI实现中：surface->lock取得ANativeWindow_Buffer（其bits就是存储数据的内存），用outBuffer配置SkBitmap并bitmap.setPixels(outBuffer.bits)，然后SkNEW_ARGS(SkCanvas,(bitmap))用bitmap构造本地SkCanvas，塞回Java层Canvas对象。绘制完成后unlockCanvasAndPost→Surface::unlockAndPost：mLockedBuffer->unlock()解锁、queueBuffer()入队供SurfaceFlinger合成，mPostedBuffer记录已提交buffer，mLockedBuffer清零。","ch":"第11章 View体系"},{"q":"Skia是什么？有哪些优秀特性？","a":"Skia是Android Java层View Tree绘制UI所用的2D图形引擎库，本地层Canvas和Bitmap的实现也基于Skia。最初由Skia Inc开发（创始人Mike Reed博士），2005年被Google收购（为Android做准备），也用于Chrome、Firefox等。源码在external/skia。特性：跨平台；高度优化的渲染器；可选硬件加速（如基于OpenGL）；动画实现；图片解码（JPG/PNG/GIF/BMP）；文本绘制；多种特效支持。","ch":"第11章 View体系"},{"q":"View.draw的绘制顺序（6个步骤）是什么？","a":"Step1：绘制背景（mBackground不为空时，若mScrollX/mScrollY为0直接background.draw(canvas)，否则先translate再画再还原）；Step2：保存canvas的layers（为fading准备，可跳过）；Step3：onDraw(canvas)绘制内容区域；Step4：dispatchDraw(canvas)绘制子对象；Step5：绘制fading并restore layers（可跳过）；Step6：onDrawScrollBars(canvas)绘制decorations（scrollbar）。若无水平/垂直fading edges（常见Case），跳过Step2和Step5。dirtyOpaque时可跳过背景和onDraw。子类只需重载onDraw，不必重载draw。","ch":"第11章 View体系"},{"q":"View和Drawable的本质区别是什么？Drawable有哪些常见形式？","a":"View既负责UI显示，也能处理各种事件（触摸、按键等）；Drawable只是\"Something that can be drawn\"——图像数据的抽象，不处理事件，这是二者本质区别。View实现了Drawable.Callback接口，当Drawable需要重绘时回调invalidateDrawable（获取drawable.getBounds()区域后调用View.invalidate）。Drawable常见形式：Bitmap（PNG/JPEG图）、Nine Patch（防拉伸变形的PNG扩展）、Shape、Layers（多层叠加）、States（多状态如按钮normal/pressed）、Levels（按level选图如信号格）、Scale（按level定尺寸）。","ch":"第11章 View体系"},{"q":"Visibility的三种取值有什么区别？gravity和layout_gravity有何不同？","a":"Visibility：VISIBLE可见；INVISIBLE不可见但保留所占空间；GONE相当于完全移除，不保留空间。gravity表示View内部\"内容\"的重心位置（如Button中文字的位置），且并非View基类属性（View没实现onDraw），由TextView等子类自行处理，存储在mGravity中；layout_gravity表示View自身在其父View（ViewGroup）中的重心位置。Gravity类中AXIS_X_SHIFT=0、AXIS_Y_SHIFT=4，各4个bit分别表示specified/pull_before/pull_after/clip，如FILL_VERTICAL=TOP|BOTTOM。","ch":"第11章 View体系"},{"q":"Scrollbar与mScrollX/mScrollY有什么区别？","a":"Scrollbar是\"内容\"（如文本）的滚动条，给用户看的提示组件，指示当前显示内容在整体内容中的位置，由ScrollabilityCache（mScrollCache）管理，不影响View显示内容；mScrollX/mScrollY则是View视图本身的滚动位置，是基于\"内存\"的真实属性变化。如Launcher拖动屏幕改变的是mScrollX（当前显示界面距整个ViewGroup左边界的位移），而View的可视区域（父类分配的）不会因滚动而改变，变的只是显示的内容。","ch":"第11章 View体系"},{"q":"View的dispatchTouchEvent中onTouch和onTouchEvent的优先级？","a":"View.dispatchTouchEvent中：先经onFilterTouchEventForSecurity过滤，然后若设置了OnTouchListener（setOnTouchListener）且View为ENABLED且li.mOnTouchListener.onTouch(this,event)返回true，则直接返回true消费事件；否则才调用onTouchEvent(event)。即onTouch优先级高于onTouchEvent。onTouch更简捷高效，onTouchEvent（重载方式）更适用于View扩展类。若View被disabled，onTouchEvent仍会\"签收\"事件（返回是否clickable/longClickable），只是不做回应。","ch":"第11章 View体系"},{"q":"onTouchEvent如何处理ACTION_DOWN/MOVE/UP/CANCEL？","a":"ACTION_DOWN：事件序列起点，mHasPerformedLongPress=false、setPressed(true)（配合refreshDrawableState刷新状态图），checkForLongClick按ViewConfiguration.getLongPressTimeout()postDelayed监测长按（UP/MOVE会removeLongPressCallback移除）。ACTION_MOVE：pointInView结合mTouchSlop判断手势是否移出View范围，超出则移除tap/longPress回调并setPressed(false)。ACTION_UP：结束点，未执行过长按且处于Pressed等条件满足时通过post(mPerformClick)排队调用performClick触发onClick（post是为了让状态先更新）。ACTION_CANCEL：系统判定手势废弃（非用户产生），应视为手势结束做清理：setPressed(false)、removeTapCallback、removeLongPressCallback。","ch":"第11章 View体系"},{"q":"ViewGroup.dispatchTouchEvent中拦截（intercept）的判断逻辑？","a":"收到ACTION_DOWN时先cancelAndClearTouchTargets和resetTouchState清理旧状态。intercepted判断：若actionMasked==ACTION_DOWN或mFirstTouchTarget!=null，则再看FLAG_DISALLOW_INTERCEPT——若disallowIntercept为false则调用onInterceptTouchEvent(ev)由子类决定是否拦截，否则intercepted=false；若不是DOWN且mFirstTouchTarget为空，则intercepted=true继续拦截。若intercepted为true，该事件及后续事件直到ACTION_UP前都直接投递给ViewGroup自身onTouchEvent，不再下传。建议继承ViewGroup时重载onInterceptTouchEvent而非dispatchTouchEvent。","ch":"第11章 View体系"},{"q":"ViewGroup不拦截事件时，如何确定Touch事件的归属子View？","a":"不是广播式挨个发送，而是通过canViewReceivePointerEvents（child能否接收Pointer Events）和isTransformedTouchPointInView（(x,y)坐标是否落在child管辖范围内）两个判断，从childrenCount-1到0倒序遍历mChildren筛选，不符合直接continue跳过。找到归属者后调用dispatchTransformedTouchEvent(ev,false,child,idBitsToAssign)——内部调用child的dispatchTouchEvent（child可能是View或ViewGroup，递归流转）。若child返回false表示未处理，事件继续流转寻求真正处理者；处理成功则记入TouchTarget（mFirstTouchTarget）并break。","ch":"第11章 View体系"},{"q":"Android有哪些动画类型？动画的本质是什么？","a":"至少4种：Property Animation（3.0引入，官方推荐，以对象属性为动画契机，突破View动画限制）；View Animation（常用的补间动画，提供大小、旋转、透明度、位移等基础效果）；Drawable Animation（逐帧连续放映图片，效果佳但制作成本高、增大包体积）；Window Animation（系统内部窗口切换动画）。本质（Wikipedia）：Animation is the rapid display of a sequence of images to create an illusion of movement——动画是时间和图像的关系，人眼图像存储时间约0.34秒，以足够速率切换静止图片（电影24帧/秒、电视25帧/秒）即产生连续运动感。","ch":"第11章 View体系"},{"q":"View动画的xml资源格式和关键属性？","a":"xml放res/anim/下，根节点必须是<alpha>、<scale>、<translate>、<rotate>或<set>（组合，实现类AnimationSet）。alpha用fromAlpha/toAlpha（0.0透明~1.0不透明）；scale用fromXScale/toXScale/fromYScale/toYScale/pivotX/pivotY（1.0为不变）；translate用fromXDelta/toXDelta/fromYDelta/toYDelta（%p相对父对象，%相对自身）；rotate用fromDegrees/toDegrees/pivotX/pivotY。通用属性：android:duration（时长）、android:startOffset（延时）、android:interpolator（变化速率，如@android:anim/LinearInterpolator）、shareInterpolator。使用：AnimationUtils.loadAnimation(this,R.anim.example_anim)后image.startAnimation(anim)。","ch":"第11章 View体系"},{"q":"Animation、AnimationSet、Interpolator、Transformation的关系及动画驱动机制？","a":"AnimationSet继承自Animation（类似View与ViewGroup关系），内部mAnimations的ArrayList记录多个子动画。Animation核心是getTransformation接口，返回当前时间点的Transformation（含Matrix和mAlpha——Alpha是Matrix无法表达的，所以单独定义）。Interpolator给出变化速率，子类实现getInterpolation(float input)，input是归一化的时间位置（0.0~1.0），返回值也是0.0~1.0，且input为1时输出必为1.0。如LinearInterpolator直接返回input；AccelerateInterpolator返回input*input（mFactor=1.0时）。计算由applyTransformation(interpolatedTime,t)完成，如Alpha：t.setAlpha(mFromAlpha+(mToAlpha-mFromAlpha)*interpolatedTime)。驱动机制：没有Timer，而是View主动调用getTransformation查询——startAnimation内部最后调用invalidate(true)发起重绘，在draw过程中不断查询动画状态。","ch":"第11章 View体系"},{"q":"UiAutomator的工作原理是什么？依赖哪些模块？","a":"UiAutomator是官方自动化测试框架，不与被测程序同进程，可跨进程测试。它只是\"壳\"，倚赖3个模块：UiAutomation、Accessibility Service（本为帮助残障人士，其获取/控制界面元素能力正是UiAutomator所需）、ViewRoot（Accessibility Service的权限最终由ViewRoot赋予）。命令\"adb shell uiautomator runtest\"实际是shell脚本，最终exec app_process（Zygote承载体）启动虚拟机运行com.android.commands.uiautomator.Launcher。执行流程：UiObject/UiDevice/UiSelector -> QueryController -> UiAutomatorBridge -> UiAutomation -> AccessibilityManagerService -> ViewRoot/WMS/InputManager。如click()先findAccessibilityNodeInfo，经getRootInActiveWindow（4次重试，间隔250ms）最终调用ViewRootImpl中AccessibilityInteractionController处理，通过IAccessibilityInteractionConnectionCallback回传结果。","ch":"第11章 View体系"},{"q":"Android硬件事件分为哪几类？各自特点？","a":"按键事件KeyEvent：物理按键产生（Home、Back、Menu、Volume等），影响因素有按键状态（按下/松开）、状态持续长短（长/短按）、按键数量（组合键），基础接口有onKeyDown/onKeyUp/onKeyLongPress/onKeyMultiple。触摸事件TouchEvent：点击、拖动及其组合，是最常用最复杂的类型，含TOUCH_DOWN/TOUCH_MOVE/TOUCH_UP，MOVE可派生fling事件；影响因素有触摸点状态、移动（距离、速度）、触摸点数量（多点）、时间因素。另有MouseEvent、TrackBallEvent（已淘汰）。","ch":"第12章 InputManagerService与输入事件"},{"q":"InputEvent类的继承结构是怎样的？getDevice()返回哪些设备源？","a":"统一抽象接口为InputEvent，两个子类：KeyEvent表达按键事件；MotionEvent统一管理所有能产生Movement的事件源（Trackball、Finger、Mouse等）。getDevice()返回InputDevice类型，设备源包括SOURCE_UNKNOWN、SOURCE_KEYBOARD、SOURCE_DPAD、SOURCE_GAMEPAD、SOURCE_TOUCHSCREEN、SOURCE_MOUSE、SOURCE_STYLUS、SOURCE_TRACKBALL、SOURCE_TOUCHPAD、SOURCE_TOUCH_NAVIGATION、SOURCE_JOYSTICK、SOURCE_ANY，涵盖常见输入设备。","ch":"第12章 InputManagerService与输入事件"},{"q":"应用程序监听事件有哪两种方法？OnKeyListener接口参数含义？","a":"方法一：通过View的监听器回调，如setOnKeyListener、setOnTouchListener、setOnGenericMotionListener、setOnHoverListener、setOnDragListener；方法二：重载View类中的函数（如onKeyDown等）。两者各具特点按需选择。OnKeyListener接口为boolean onKey(View v, int keyCode, KeyEvent event)：View是处理此事件的View对象，keyCode对应具体物理按键，KeyEvent是事件描述体（可获取getRepeatCount()、getScanCode()、getSource()等）。","ch":"第12章 InputManagerService与输入事件"},{"q":"Android输入事件投递系统的工作流程分为哪4个部分？","a":"按处理顺序：1）采集：通过Linux内核驱动收集硬件原始信息，Android通过/dev/input下的节点访问；2）前期处理：对原始数据提炼转化，去掉冗余内容并简化格式；3）WMS分配：WMS记录所有窗口完整状态，是InputEvent派发者——按键消息直接发给'最前端'窗口，触摸消息需先计算触摸点落点区域再投递；4）应用程序处理：开发者利用已'可理解、好处理'的事件实现软件功能。","ch":"第12章 InputManagerService与输入事件"},{"q":"InputManagerService如何创建和启动？与WMS有何联系？","a":"由SystemServer统一启动：new InputManagerService(context, wmHandler)→传入WindowManagerService.main(...)→注册ServiceManager（名称Context.INPUT_SERVICE=\"input\"）→inputManager.setWindowManagerCallbacks(wm.getInputMonitor())→inputManager.start()。IMS实例直接传入WMS以便调用。start()调用本地函数nativeStart(mPtr)，mPtr是nativeInit创建的NativeInputManager对象的C++指针（int保存）；Java层IMS只是Native层InputManager的包装。","ch":"第12章 InputManagerService与输入事件"},{"q":"InputManager.start()创建了哪两个线程？各自职责和协作方式？","a":"创建InputReaderThread和InputDispatcherThread，优先级PRIORITY_URGENT_DISPLAY。InputReaderThread核心是InputReader类，不断轮询设备节点读取Event，但不直接访问设备节点，而是通过EventHub读取/dev/input下文件判断新事件并通知InputReader。InputDispatcherThread核心是InputDispatcher类，负责分发。构造InputManager时InputReader就与InputDispatcher建立关联；InputReader.loopOnce()中通过mQueuedListener->flush()告知Dispatcher事件，Dispatcher可注册监听notifyConfigurationChanged、notifyKey、notifyMotion、notifySwitch、notifyDeviceReset等回调。","ch":"第12章 InputManagerService与输入事件"},{"q":"InputDispatcher.dispatchKeyLocked的处理步骤有哪些？","a":"Step1前期处理（针对按键repeatCount）；Step2检查是否INTERCEPT_KEY_RESULT_TRY_AGAIN_LATER，不满足时间要求则直接返回；Step3发送前检查系统策略（Policy）是否先期处理，如Home等系统按键先由WMS处理；Step4判断是否放弃当前事件；Step5确定事件接收方（inputTargets）——调用findFocusedWindowTargetsLocked查找焦点窗口，是最重要一步；Step6通过dispatchEventLocked投递消息到目标。","ch":"第12章 InputManagerService与输入事件"},{"q":"findFocusedWindowTargetsLocked如何查找按键事件的投递目标？","a":"按键消息发给'最前端'（焦点）窗口：1）mFocusedWindowHandle为NULL时，若有焦点应用（mFocusedApplicationHandle，说明应用还在启动中）则handleTargetsNotReadyLocked等待后重试；两者皆无则INPUT_EVENT_INJECTION_FAILED；2）checkInjectionPermission检查权限，失败返回PERMISSION_DENIED；3）窗口paused则等待；4）窗口还在处理上一个事件（isWindowReadyForMoreInputLocked）则等待；5）全部通过则INPUT_EVENT_INJECTION_SUCCEEDED并addWindowTargetLocked加入inputTargets（FLAG_FOREGROUND|FLAG_DISPATCH_AS_IS）。","ch":"第12章 InputManagerService与输入事件"},{"q":"InputMonitor扮演什么角色？包含哪些回调接口？","a":"InputMonitor是WMS与InputDispatcher之间的'中介'。方向一（Dispatcher→WMS）：它实现IMS的WindowManagerCallbacks接口，含notifyConfigurationChanged、notifyLidSwitchChanged、notifyInputChannelBroken（连接Dispatcher与应用的Socket通道断开）、notifyANR（Application Not Responding）、interceptKeyBeforeQueueing、interceptMotionBeforeQueueingWhenScreenOff、interceptKeyBeforeDispatching（保证WMS对消息拥有绝对优先处理权）、dispatchUnhandledKey（事件无人处理时交WMS协商）、getPointerLayer。方向二（WMS→Dispatcher）：WMS通过InputMonitor的updateInputWindowsLw()告知当前焦点窗口（mFocusedWindowHandle由此赋值）。","ch":"第12章 InputManagerService与输入事件"},{"q":"InputChannel是什么？基于什么机制实现？","a":"InputChannel是InputDispatcher与应用程序窗口间的通信通道，并非Binder Server，而是基于Unix Domain Socket实现：openInputChannelPair用socketpair(AF_UNIX, SOCK_SEQPACKET, 0, sockets)打开一对通道（双向通信），并设置双方SO_SNDBUF/SO_RCVBUF缓冲区大小；Server端名称加' (server)'后缀使用sockets[0]，Client端加' (client)'使用sockets[1]，InputChannel中的mFd实际就是socket编号。每新增一个应用窗口，WMS的addWindow中都会调用openInputChannelPair新建一对通道。","ch":"第12章 InputManagerService与输入事件"},{"q":"ViewRootImpl在事件处理中扮演什么角色？入队后如何处理？","a":"ViewRootImpl是WMS与应用程序窗口间的'桥梁'（类似InputMonitor之于WMS），也是应用进程中事件派发与管理的负责人。收到InputEvent后先调用enqueueInputEvent入队，分两种情况：紧急事件（processImmediately为true）直接调用doProcessInputEvents处理；其他事件通过scheduleProcessInputEvents推送到消息队列按顺序处理。最终由ViewTree中某一特定View对象完成具体事件处理。","ch":"第12章 InputManagerService与输入事件"},{"q":"Android事件注入有哪几种方式？各有什么限制？","a":"1）InputManager.injectInputEvent(InputEvent, mode)内部API：@hide，普通应用无权使用，多用于系统模块（如hdmi server中KeyEvent.obtain构造后以INJECT_INPUT_EVENT_MODE_ASYNC注入）；2）Instrumentation接口（如sendKeyDownUpSync）：使用方便但只对本应用自身有效，无法跨应用进程；3）/system/bin下的input程序：通过adb shell使用，如input keyevent 3模拟HOME键；4）直接写/dev/input/eventX节点：相当于从'源头'控制事件，节点权限高，禁止普通应用写入，需特殊处理设备。","ch":"第12章 InputManagerService与输入事件"},{"q":"什么是多媒体（Multi-Media）？","a":"多媒体是多种形式媒体内容（文本、音频、视频、图片、动画等）的组合。Android提供了一整套灵活的多媒体解决方案应对厂商定制需求；对应用开发者而言多媒体的代名词常是MediaPlayer和MediaRecorder，它们高度封装但内部实现细节复杂。","ch":"第13章 音频系统"},{"q":"Android音频系统的三大核心是什么？","a":"AudioFlinger、AudioPolicyService和AudioTrack/AudioRecorder。前两者属于System Service，驻留在mediaserver进程中，负责处理AudioTrack/AudioRecorder的请求；AudioTrack/AudioRecorder则运行在应用进程中，通过Binder与系统服务通信。","ch":"第13章 音频系统"},{"q":"声音的三个重要属性是什么？各与什么有关？","a":"响度（Loudness）：声音大小，与振幅直接相关，振幅越大响度越大；音调（Pitch）：与频率相关，频率越高音调越高；音色（Quality）：由物体本身结构特性决定。这三个属性是所有音频效果处理的基础。","ch":"第13章 音频系统"},{"q":"音频录制和回放的基本流程是什么？","a":"录制：MIC采集模拟信号→ADC模数转换成二进制数据→渲染处理（音效、过滤）→压缩→存储。回放是逆向过程：读取文件并解码→选取匹配的回放设备→沿设计路径传输→DAC数模转换成模拟信号→经回放设备还原声音。","ch":"第13章 音频系统"},{"q":"音频采样（Audio Sampling）涉及哪些核心要素？","a":"样本（Sample）：被采样的原始连续波形；采样器（Sampler）：将样本转换为离散信号的关键（可以是子系统、操作过程或算法），理想采样器要求不产生失真；量化（Quantization）：将连续值近似为有限个离散值；编码（Coding）：将量化值进行二进制表示，通常与量化同步进行。","ch":"第13章 音频系统"},{"q":"什么是PCM？它有哪些可调属性？","a":"PCM（Pulse-code modulation，脉冲编码调制）是将模拟信号数字化的经典方式，通过对原始模拟信号抽样、量化和编码产生PCM流，是计算机、DVD、数字电话等系统中数字音频的标准格式。可调属性有采样速率（Sampling Rate，常用44.1kHz/48kHz/96kHz）和采样深度（Bit Depth，位深越大量化越精确、失真越小）。","ch":"第13章 音频系统"},{"q":"Nyquist–Shannon采样定律的中心思想是什么？","a":"当对被采样的模拟信号进行还原时，其最高频率只有采样频率的一半。即要完整重构原始模拟信号，采样频率必须是它的两倍以上。如人声范围20~20kHz，采样频率应选40kHz左右；太小会失真，太大浪费资源且人耳无法感知音质提升。","ch":"第13章 音频系统"},{"q":"声道的发展经历了哪几个阶段？4.1和5.1环绕声的含义？","a":"Monaural单声道（一种音源）→Stereophonic立体声（双声道，利用声音到达双耳的时间/强度差产生空间感）→多声道环绕声。4.1：前左、前右、后左、后右4个音源加1个低音喇叭（Subwoofer）；5.1：再加中置（Center Channel）和两个Surround Channel，代表技术如杜比数字、DTS、SDDS。","ch":"第13章 音频系统"},{"q":"Weber–Fechner定律对音频系统有什么指导意义？","a":"Weber定律：ΔI/I=C，即引起感官变化的刺激差别量与原刺激量的比值固定；Fechner改进为S=C log R，刺激量与感知呈对数关系。因此系统音量等级（如0~20）到输出电平的映射不应平均分配，而应采用对数方式计算，实现见audiosystem.cpp。","ch":"第13章 音频系统"},{"q":"数字音频格式分为哪几类？各有什么例子？","a":"不压缩格式：如PCM数据，Windows存为wav、Mac存为aiff，文件体积大；无损压缩格式：不破坏音频信息可完整还原，如FLAC、APE(Monkey's Audio)、WV(WavPack)、m4a(Apple Lossless)；有损压缩格式：满足音质下大幅减小体积，如MP3、AAC，压缩比率越大体积越小但效果越差。","ch":"第13章 音频系统"},{"q":"文件格式（File Format）和编码器（Codec）有什么区别？","a":"编码器负责对原始数据进行前期处理（如压缩算法减小体积），之后才以某种特定的文件格式保存。两者不一定一对一关系，如AVI容器支持多种音频和视频编码方式。","ch":"第13章 音频系统"},{"q":"典型声卡包含哪三部分？","a":"Connectors：用于声卡与外放设备（扬声器、耳机）的连接，又称jacks；Audio Circuits：声卡的主要实现体，负责信号放大、混音及模数/数模转换；Interface：连接声卡与计算机总线的单元（如PCI总线）。可用cat /proc/asound/cards查看已安装声卡。","ch":"第13章 音频系统"},{"q":"Linux音频框架OSS和ALSA有什么区别？","a":"OSS（Open Sound System）：早期Linux采用的UNIX音频体系，符合\"一切皆文件\"理念，使用/dev/dsp、/dev/mixer、/dev/sequencer等设备节点，因知识产权问题及对新特性支持不足被内核放弃。ALSA（Advanced Linux Sound Architecture）：Linux社区为取代OSS提出，GPL/LGPL开源，Kernel 2.5正式引入，API更多更复杂（提供alsa-lib简化开发），支持SMP和线程安全，并兼容OSS API。","ch":"第13章 音频系统"},{"q":"什么是TinyAlsa？为什么Android采用它？","a":"TinyAlsa是ALSA的缩减版本。早期Android音频架构基于ALSA，后来Android不再依赖ALSA用户空间实现（alsa-lib），改用tinyalsa库。它位于external/tinyalsa目录，只包含mixer.c（Mixer接口）、pcm.c（PCM接口）及tinycap/tinymix/tinyplay工具，不涉及Raw MIDI、Sequencer、Timer等接口，对一般嵌入式设备已足够。","ch":"第13章 音频系统"},{"q":"Android音频框架的各层次分别完成什么任务？","a":"APP层：音乐播放器等应用；Framework层：MediaPlayer/MediaRecorder、AudioTrack/AudioRecorder及AudioManager/AudioService/AudioSystem等封装；Libraries层：libmedia（AudioTrack等C++实现）、libaudioflinger（AudioFlinger和AudioPolicyService）、MediaPlayerService等；HAL层：服务对象是AudioFlinger，通过audio_hw_device、audio_stream_in/out等结构体统一接口，实现驻留在audio.primary.*、audio.a2dp.*等库中。","ch":"第13章 音频系统"},{"q":"为什么说AudioFlinger才是Android音频系统中真正的\"隔离板\"？","a":"音频HAL的服务对象是AudioFlinger：AudioFlinger不直接调用底层音频驱动，其上层（包括同层的MediaPlayerService）只需与AudioFlinger通信即可实现音频功能。无论底层从ALSA-lib变为tinyalsa，上层实现都保持兼容。AudioPolicyService则采用虚拟设备方式让厂商定制音频策略。","ch":"第13章 音频系统"},{"q":"AudioFlinger服务是如何启动的？","a":"AudioFlinger是Native层服务，由mediaserver程序启动。Main_mediaserver.cpp的main函数依次调用AudioFlinger::instantiate()、MediaPlayerService::instantiate()、CameraService::instantiate()、AudioPolicyService::instantiate()。mediaserver编译为/system/bin/mediaserver，开机时由init根据init.rc配置启动。instantiate是BinderService模板类的实现，通过publish调用defaultServiceManager()->addService注册服务。","ch":"第13章 音频系统"},{"q":"AudioFlinger的实际初始化工作在哪里完成？","a":"在onFirstRef()中。AudioFlinger继承自BinderService<AudioFlinger>和BnAudioFlinger，而BnAudioFlinger层层继承自RefBase，addService的参数是强指针引用，因此第一次被强引用时触发onFirstRef。其中读取属性ro.audio.flinger_standbytime_ms设置standby时间，并初始化mMode=AUDIO_MODE_NORMAL等有效内部变量，之后其他进程可通过ServiceManager访问它并调用createTrack、openOutput等接口。","ch":"第13章 音频系统"},{"q":"AudioFlinger和AudioPolicyService的职能如何分工？","a":"AudioPolicyService是策略的制定者：决定何时打开音频接口设备、某种Stream类型对应什么设备等；AudioFlinger是策略的执行者：负责具体与音频设备通信、维护系统中的音频设备、处理多路音频流的混音等。这种分离设计降低了耦合性。","ch":"第13章 音频系统"},{"q":"Android支持哪三大类音频设备接口（Audio Interface）？","a":"AUDIO_HARDWARE_MODULE_ID_PRIMARY（主音频设备，必须存在）、AUDIO_HARDWARE_MODULE_ID_A2DP（蓝牙A2DP音频）、AUDIO_HARDWARE_MODULE_ID_USB（USB音频，早期版本不支持）。每种接口由对应的so库支持，库文件命名如audio.a2dp.so，查找路径为/system/lib/hw和/vendor/lib/hw。","ch":"第13章 音频系统"},{"q":"AudioFlinger::loadHwModule_l的执行步骤是什么？","a":"Step1：遍历mAudioHwDevs检查该interface是否已加载，已加载直接返回；Step2：调用load_audio_interface加载对应HAL库并打开设备，创建audio_hw_device_t实例；Step3：初始化，init_check返回0表示成功，必要时set_master_volume，操作device前后需改变mHardwareStatus状态（结束复原为AUDIO_HW_IDLE）；Step4：以nextUniqueId生成的全局唯一id为key，将AudioHwDevice加入mAudioHwDevs。","ch":"第13章 音频系统"},{"q":"AudioFlinger::openOutput的主要流程是什么？","a":"Step1：findSuitableHwDev_l查找合适的音频接口设备；Step2：通过open_output_stream打开audio_stream_out_t输出流；Step3：生成AudioStreamOut对象封装audio_hw_device_t和audio_stream_out_t；Step4：创建PlaybackThread——不需要混音（DIRECT标志、非PCM16位或非立体声）时创建DirectOutputThread，否则创建MixerThread，并加入mPlaybackThreads；Step5：若是primary output则设置mPrimaryHardwareDev及模式等。","ch":"第13章 音频系统"},{"q":"MixerThread的构造函数做了哪些工作？它如何进入线程循环？","a":"构造：创建AudioMixer对象（混音关键）、检查声道数（要求FCC_2双声道）、创建NBAIO的AudioStreamOutSink并negotiate、根据initFastMixer决定是否使用fast mixer。进入循环：mPlaybackThreads存储PlaybackThread强指针，Thread基类继承自RefBase，强指针第一次引用时调用onFirstRef，其中调用run()启动新线程并间接进入threadLoop循环处理混音业务。","ch":"第13章 音频系统"},{"q":"PlaybackThread::threadLoop主循环包含哪些步骤？","a":"循环条件!exitPending()；Step2 processConfigEvents处理配置事件（OUTPUT/INPUT的OPENED/CLOSED/CONFIG_CHANGED等）；Step3判断是否满足Standby条件（无活跃Track且超时或被挂起），是则threadLoop_standby；Step4 prepareTracks_l准备音频数据；Step5数据就绪（MIXER_TRACKS_READY）则threadLoop_mix混音，否则threadLoop_sleepTime计算休眠时间；Step6 sleepTime为0时threadLoop_write写入HAL，否则usleep休眠；Step7 threadLoop_removeTracks移除需要删除的Track。","ch":"第13章 音频系统"},{"q":"什么是Buffer Underrun？如何应对？","a":"当生产者-消费者关系中生产速度不及消费速度时出现Underrun。音频回放中表现为声音断断续续或重复播放当前buffer数据。需要AudioTrack和AudioFlinger协同解决：消费者端在prepareTracks_l中计算minFrames（通常为mNormalFrameCount，采样率不一致时加rounding和interpolation余量及getUnreleasedFrames），检查framesReady是否达到minFrames。","ch":"第13章 音频系统"},{"q":"prepareTracks_l中音量是如何计算的？","a":"取mStreamTypes[track->streamType()].volume（该stream类型音量）与masterVolume相乘得v；从proxy->getVolumeLR()取vlr，低16位为vl（左声道）、高16位为vr（右声道），并校验不超过MAX_GAIN_INT；静音或pausing时vl/vr/va直接置0；还计算sendLevel得到va（Aux Level）。最后通过mAudioMixer->setParameter设置VOLUME0/VOLUME1/AUXLEVEL参数，在threadLoop_mix中真正生效。","ch":"第13章 音频系统"},{"q":"哪些情况下Track会被加入tracksToRemove？","a":"FastTrack状态为STOPPING_2、PAUSED、TERMINATED、STOPPED、FLUSHED，或状态为ACTIVE但underrun次数超过限额（mRetryCount）；普通Track数据未准备就绪且是STATIC TRACK或已停止/暂停的。被移除时其相关output会收到stop请求（由AudioSystem::stopOutput发起）。","ch":"第13章 音频系统"},{"q":"AudioMixer的核心结构和hook机制是什么？","a":"AudioMixer内部核心是mState（state_t类型），其中tracks[MAX_NUM_TRACKS=32]数组最多支持32路同时混音，track_t描述每个Track的音量、声道、重采样器、bufferProvider等属性。process()调用mState.hook函数指针执行混音：初始化时指向process__nop；状态/参数变化时invalidateState使其指向process__validate，后者根据活跃Track数、是否重采样等选择process__OneTrack16BitsStereoNoResampling（单路16bit立体声不重采样）、process__genericNoResampling或process__genericResampling。","ch":"第13章 音频系统"},{"q":"Android中声音被划分为哪些Stream类型？","a":"AudioSystem.java定义：STREAM_VOICE_CALL(0)通话、STREAM_SYSTEM(1)系统、STREAM_RING(2)铃声短信、STREAM_MUSIC(3)音乐、STREAM_ALARM(4)闹铃、STREAM_NOTIFICATION(5)通知；隐藏类型：STREAM_BLUETOOTH_SCO(6)蓝牙通话、STREAM_SYSTEM_ENFORCED(7)强制系统声音（如防偷拍快门声）、STREAM_DTMF(8)、STREAM_TTS(9)。","ch":"第13章 音频系统"},{"q":"AudioPolicyService要解决的核心问题有哪些？","a":"问题1：各类型声音输出到哪些回放设备（如插耳机后音乐改从耳机输出，来电铃声同时从喇叭和耳机输出）；问题2：路由策略——从播放实例（源）到设备（目标）需经Audio Interface和output的选择，类似路由器；问题3：各音频类型音量调节范围和默认值不同（DEFAULT_STREAM_VOLUME数组定义）。","ch":"第13章 音频系统"},{"q":"AudioPolicyService的启动/构造流程是什么？","a":"与AudioFlinger同在mediaserver进程，由Main_mediaserver.cpp启动，注册名为media.audio_
