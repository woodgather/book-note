<style>
:root {
  color-scheme: light;
  --primary: #2563eb;
  --primary-light: #3b82f6;
  --primary-dark: #1e40af;
  --accent: #f59e0b;
  --bg: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #ffffff;
  --bg-hover: #eff6ff;
  --bg-active: #dbeafe;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
  --radius: 8px;
  --radius-sm: 4px;
  --sidebar-w: 320px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Layout */
.layout { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  position: fixed;
  top: 0; left: 0; bottom: 0;
  overflow-y: auto;
  z-index: 100;
  box-shadow: var(--shadow);
}

.sidebar-header {
  position: sticky;
  top: 0;
  background: var(--bg-sidebar);
  padding: 18px 20px 12px;
  border-bottom: 1px solid var(--border);
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 10px;
}

.brand-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.5px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-size: 13px;
  color: var(--text);
}
.search-box .ic { color: var(--text-muted); font-size: 14px; }

.toolbar {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.toolbar button {
  flex: 1;
  padding: 6px 8px;
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.toolbar button:hover { background: var(--bg-hover); color: var(--primary); border-color: var(--primary-light); }

/* TOC */
.toc {
  padding: 8px 0 80px;
}

.toc-list, .toc-sub {
  list-style: none;
}
.toc-item { position: relative; }

.toc-row {
  display: flex;
  align-items: center;
  padding: 7px 14px 7px 12px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text);
  border-left: 3px solid transparent;
  transition: background 0.12s;
  user-select: none;
}
.toc-row:hover { background: var(--bg-hover); }
.toc-row.active {
  background: var(--bg-active);
  border-left-color: var(--primary);
  color: var(--primary-dark);
  font-weight: 600;
}

.toc-toggle {
  width: 16px; height: 16px;
  margin-right: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 10px;
  transition: transform 0.15s;
  flex-shrink: 0;
}
.toc-toggle.empty { visibility: hidden; }
.toc-item.open > .toc-row > .toc-toggle { transform: rotate(90deg); }
.toc-item.no-children > .toc-row > .toc-toggle { opacity: 0.3; }

.toc-icon {
  margin-right: 8px;
  font-size: 13px;
  width: 18px;
  text-align: center;
  flex-shrink: 0;
}
.toc-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Sub lists */
.toc-sub {
  display: none;
  background: #fafbfc;
}
.toc-item.open > .toc-sub { display: block; }

.toc-sub .toc-row {
  padding-left: 38px;
  font-size: 13px;
  color: var(--text-muted);
}
.toc-sub .toc-sub .toc-row { padding-left: 60px; font-size: 12.5px; }

/* Main content */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 32px 56px 80px;
  max-width: 1100px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.breadcrumb span.sep { color: var(--text-light); }
.breadcrumb a { color: var(--text-muted); }
.breadcrumb a:hover { color: var(--primary); }

.cover {
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
  color: #fff;
  border-radius: var(--radius);
  padding: 40px 36px;
  margin-bottom: 32px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.cover::before {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
}
.cover h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 8px;
  position: relative;
}
.cover .sub {
  font-size: 16px;
  opacity: 0.92;
  margin-bottom: 20px;
  position: relative;
}
.cover .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 13px;
  opacity: 0.85;
  position: relative;
}
.cover .meta span::before { content: "•"; margin-right: 8px; opacity: 0.6; }
.cover .meta span:first-child::before { display: none; }

.chapter {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.chapter-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 8px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--bg-active);
}
.chapter-num {
  display: inline-block;
  padding: 2px 10px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  border-radius: 12px;
  letter-spacing: 0.5px;
}
.chapter-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary-dark);
  letter-spacing: 0.3px;
}
.chapter-tagline {
  color: var(--text-muted);
  font-size: 14px;
  font-style: italic;
  margin: 8px 0 18px;
  padding-left: 12px;
  border-left: 3px solid var(--accent);
}

.section { margin: 20px 0; }
.section-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  width: 4px; height: 16px;
  background: var(--primary);
  border-radius: 2px;
}

.subsection { margin: 14px 0 14px 18px; }
.subsection-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--primary-dark);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.subsection-title::before {
  content: '▸';
  color: var(--accent);
  font-size: 12px;
}

.content { margin: 8px 0 8px 12px; }
.content p { margin-bottom: 8px; color: var(--text); }
.content ul { list-style: none; padding-left: 0; margin: 6px 0; }
.content li {
  position: relative;
  padding: 4px 0 4px 20px;
  font-size: 14px;
  color: var(--text);
}
.content li::before {
  content: '';
  position: absolute;
  left: 6px; top: 13px;
  width: 6px; height: 6px;
  background: var(--primary-light);
  border-radius: 50%;
}

.highlight {
  background: linear-gradient(transparent 60%, #fef3c7 60%);
  padding: 0 2px;
  font-weight: 600;
}

.code {
  background: #f1f5f9;
  border-left: 3px solid var(--primary);
  padding: 10px 14px;
  margin: 10px 0;
  border-radius: var(--radius-sm);
  font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 13px;
  color: #0f172a;
  overflow-x: auto;
}

.tag {
  display: inline-block;
  padding: 2px 8px;
  background: var(--bg-active);
  color: var(--primary-dark);
  font-size: 12px;
  border-radius: 10px;
  margin: 0 4px 4px 0;
  font-weight: 500;
}

.note {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-left: 4px solid var(--accent);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  margin: 10px 0;
  font-size: 13.5px;
  color: #78350f;
}
.note .label {
  font-weight: 700;
  color: #92400e;
  margin-right: 6px;
}

.divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border-strong), transparent);
  margin: 18px 0;
}

/* Back to top */
#backToTop {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 44px; height: 44px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  visibility: hidden;
  transition: all 0.2s;
  z-index: 50;
}
#backToTop.show { opacity: 1; visibility: visible; }
#backToTop:hover { background: var(--primary-dark); transform: translateY(-2px); }

/* Scrollbar */
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.sidebar::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

/* Responsive */
@media (max-width: 900px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.2s; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 20px; }
  .menu-btn { display: flex !important; }
}

.menu-btn {
  display: none;
  position: fixed;
  top: 16px; left: 16px;
  width: 40px; height: 40px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 18px;
  z-index: 200;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg);
}

footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  padding: 32px 0;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
</style>
</head>

const MIND_DATA = [
  {

      { title: '1.2　追寻 Linus 足迹：Linux 简介',
        blocks: [
          { p: '1991 年，Linus Torvalds 在赫尔辛基大学读书时，为了运行 Unix 类系统而开发了自己的内核，并以 Minix 为参考。最初只是个人项目，但通过 GNU 工具链（gcc、bash、glibc）的拼接，Linux 迅速成长为完整的类 Unix 系统。' },
          { p: 'Linux 的关键时间节点：' },
          { ul: [

            '1996：2.0 发布，SMP 与多平台支持。',
            '2003：2.6 内核主线发布，引入 O(1) 调度、preempt、内核态抢占等。'
          ] },

      { title: '1.3　操作系统和内核简介',

          { ul: [
            '管理硬件资源：CPU、内存、I/O 设备。',
            '向上层提供抽象接口：进程、文件、网络 socket。',
            '保证多用户多进程环境下的安全与公平。'
          ] },
          { note: '内核在特权级（ring 0）运行，用户程序在非特权级（ring 3）。CPU 通过 MMU、特权级切换提供保护。' }
        ]
      },
      { title: '1.4　Linux 内核和传统 Unix 内核的比较',
        blocks: [
          { p: '传统 Unix 多数是<span class="highlight">单内核</span>（Monolithic），少数研究型系统是<span class="highlight">微内核</span>（Microkernel）。Linux 沿袭单内核路线，但吸收了微内核思想的部分优势。' },
          { sub: [
            { title: '单内核与微内核设计之比较', blocks: [
              { p: '单内核：整个内核作为一个大二进制映像运行在内核态，模块化通过动态加载实现。微内核：只把最核心的功能（IPC、调度、虚拟内存）放内核态，驱动与文件系统作为服务跑在用户态。' },

                '微内核优点：稳定性好，可热替换服务。',
                '微内核缺点：IPC 频繁导致性能明显下降。'
              ] },
              { p: 'Linux 采用单内核 + 模块化 + 线程化内核 + 抢占式调度的折中方案，兼顾性能与可维护性。' }
            ] }
          ] }
        ]
      },
      { title: '1.5　Linux 内核版本',

        sub: [
          { title: '2.4.1　无 libc 库抑或无标准头文件', blocks: [
            { p: '内核是独立运行在裸机或 hypervisor 上的程序，不能链接 glibc，只能使用内核内置的 printk、kmalloc、memcpy 等。' }

          { title: '2.4.6　同步和并发', blocks: [

      }
    ]

        blocks: [

      },
      { title: '10.10　禁止抢占',
        blocks: [

      },
      { title: '10.11　顺序和屏障',
        blocks: [
          { p: '编译器与 CPU 都会重排指令。内存屏障保证特定顺序：' },
          { ul: [
            'rmb()：读屏障。',
            'wmb()：写屏障。',
            'mb()：读写屏障。',
            'smp_mb()：跨 CPU 屏障。'
          ] }

      },
      { title: '10.12　SMP 屏障的起源',
        blocks: [

        ]
      },
      { title: '10.13　抢占模型总结',
        blocks: [
          { p: 'Linux 支持三种抢占模型：PREEMPT_NONE（无）、PREEMPT_VOLUNTARY（自愿）、PREEMPT（完全）。' }

      },
      { title: '10.14　RCU',
        blocks: [

          ] }
        ]
      },

        blocks: [
          { p: '选择同步原语的经验法则：' },
          { ul: [
            '临界区极短、不睡眠：自旋锁。',
            '临界区长、可能睡眠：信号量/互斥体。',
            '读多写少：rwlock / RCU。',

            '单变量：原子操作。'
          ] }
        ]
      }
    ]

/* ============================================================
   渲染导航
   ============================================================ */
const TOC_ROOT = document.getElementById('tocRoot');

function createRow(item) {
  const li = document.createElement('li');
  li.className = 'toc-item';
  if (item.children && item.children.length) li.classList.add('has-children');
  else li.classList.add('no-children');

  const row = document.createElement('div');
  row.className = 'toc-row';
  row.dataset.target = item.id;
  row.innerHTML = `
    <span class="toc-toggle">▶</span>
    <span class="toc-icon">${item.icon || '·'}</span>
    <span class="toc-text">${item.title}</span>
  `;
  li.appendChild(row);

  if (item.children && item.children.length) {
    const sub = document.createElement('ul');
    sub.className = 'toc-sub';
    item.children.forEach(c => sub.appendChild(createRow(c)));
    li.appendChild(sub);
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      li.classList.toggle('open');
    });
  } else {
    row.addEventListener('click', () => {
      const target = document.getElementById(item.id);
      if (target) {
        document.querySelectorAll('.toc-row.active').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        window.scrollTo({ top: target.offsetTop - 20, behavior: 'smooth' });
        updateBreadcrumb(item);
      }
    });
  }
  return li;
}

MIND_DATA.forEach(ch => TOC_ROOT.appendChild(createRow(ch)));

/* ============================================================
   渲染主内容
   ============================================================ */
const CONTENT = document.getElementById('content');

function renderBlocks(blocks) {
  if (!blocks) return '';
  return blocks.map(b => {
    if (b.p) return `<p>${b.p}</p>`;
    if (b.ul) return `<ul>${b.ul.map(i => `<li>${i}</li>`).join('')}</ul>`;
    if (b.code) return `<pre class="code">${escapeHtml(b.code)}</pre>`;
    if (b.note) return `<div class="note"><span class="label">提示</span>${b.note}</div>`;
    return '';
  }).join('');
}

function renderSubs(subs) {
  if (!subs) return '';
  return subs.map(s => `
    <div class="subsection">
      <div class="subsection-title">${s.title}</div>
      <div class="content">${renderBlocks(s.blocks)}${renderSubs(s.subsection)}</div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

MIND_DATA.forEach((ch, idx) => {
  const chapterEl = document.createElement('section');
  chapterEl.className = 'chapter';
  chapterEl.id = ch.id;
  chapterEl.innerHTML = `
    <div class="chapter-head">
      <span class="chapter-num">第 ${ch.id === 'ch-extra' ? '附' : idx + 1} 章</span>
      <h2 class="chapter-title">${ch.title.replace(/^第\s*\S+\s*章\s*/, '')}</h2>
    </div>
    <div class="chapter-tagline">${ch.summary || ''}</div>
    ${ch.sections.map(sec => `
      <div class="section">
        <div class="section-title">${sec.title}</div>
        <div class="content">${renderBlocks(sec.blocks)}</div>
        ${renderSubs(sec.subs)}
      </div>
    `).join('')}
  `;
  CONTENT.appendChild(chapterEl);
});

/* ============================================================
   交互逻辑
   ============================================================ */
function expandAll() {
  document.querySelectorAll('.toc-item').forEach(li => li.classList.add('open'));
}
function collapseAll() {
  document.querySelectorAll('.toc-item').forEach(li => li.classList.remove('open'));
  document.querySelectorAll('.toc-row.active').forEach(r => r.classList.remove('active'));
}

function updateBreadcrumb(item) {
  const path = [];
  let cur = item;
  // simple: just show chapter title
  document.getElementById('crumb-current').textContent = cur.title;
}

/* Search */
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('.toc-item').forEach(li => li.style.display = '');
    return;
  }
  document.querySelectorAll('.toc-item').forEach(li => {
    const txt = li.querySelector('.toc-text').textContent.toLowerCase();
    if (txt.includes(q)) {
      li.style.display = '';
      // open parents
      let p = li.parentElement;
      while (p && p.classList && p.classList.contains('toc-item')) {
        p.classList.add('open');
        p = p.parentElement;
      }
    } else {
      li.style.display = 'none';
    }
  });
});

/* Back to top */
const backBtn = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 400) backBtn.classList.add('show');
  else backBtn.classList.remove('show');
});

/* 默认折叠：仅展开第一章 */
collapseAll();
document.querySelector('.toc-item').classList.add('open');
</script>
