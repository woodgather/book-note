<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深入理解Android：WiFi模块 NFC和GPS卷 · Anki 知识卡片</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--panel:#fff;--line:#e5e8f0;--txt:#1f2430;--sub:#6b7280;
--accent:#2563eb;--correct:#10b981;--shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex:0 0 auto;position:sticky;top:0;z-index:30;flex-wrap:wrap}
header .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
header h1{font-size:17px;font-weight:700}
header .meta{font-size:12px;color:var(--sub);margin-top:2px}
header .stats{margin-left:auto;font-size:12.5px;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:6px 14px;border-radius:999px;white-space:nowrap}
.toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:0 0 auto}
.toolbar input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;outline:none;background:var(--bg);min-width:200px;flex:0 0 200px}
.toolbar input[type=text]:focus{border-color:var(--accent)}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;outline:none;background:var(--bg);color:var(--txt)}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.toolbar .mode{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.toolbar .mode button{border:0;background:transparent;padding:5px 14px;font-size:12.5px;cursor:pointer;border-radius:6px;color:var(--sub);font-weight:600}
.toolbar .mode button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
.toolbar .spacer{flex:1}
.toolbar .hint{font-size:12px;color:var(--sub)}
.view{flex:1;overflow:auto;padding:24px}
/* ---------- flip card (single view) ---------- */
.study{max-width:640px;margin:0 auto}
.study .progress{font-size:12.5px;color:var(--sub);margin-bottom:12px;text-align:center}
.card-wrap{perspective:1500px;margin-bottom:18px}
.card{position:relative;width:100%;min-height:320px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;border-radius:16px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;box-shadow:var(--shadow);background:var(--panel);border:1px solid var(--line);padding:34px 36px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);overflow-y:auto;max-height:70vh}
.face .tag{font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--accent);text-transform:uppercase;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.face .tag .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.face .tag .chap{color:var(--sub);font-weight:500;text-transform:none;letter-spacing:0}
.face .front-body{flex:1;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1.55;text-align:center;padding:10px}
.face .hint-bot{font-size:12px;color:var(--sub);text-align:center;margin-top:12px}
.face.back h3{font-size:18px;font-weight:700;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.face.back .ans-list{list-style:none;padding:0}
.face.back .ans-list > li{padding:10px 14px;margin-bottom:8px;background:var(--bg);border-radius:10px;line-height:1.6;font-size:14.5px;font-weight:600;border-left:3px solid var(--accent)}
.face.back .ans-list ul.sub{margin:8px 0 2px 18px;list-style:disc;color:var(--txt);font-weight:400;font-size:13.5px}
.face.back .ans-list ul.sub li{margin-bottom:4px;line-height:1.55}
.face.back .def-ans{font-size:15px;line-height:1.75;padding:12px 16px;background:var(--bg);border-radius:10px;border-left:3px solid var(--accent)}
.face.back ul.sub{margin:10px 0 0 22px;list-style:disc}
.face.back ul.sub li{font-size:13.5px;line-height:1.6;margin-bottom:3px}
.study-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.study-actions button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 18px;font-size:13.5px;cursor:pointer;color:var(--txt);box-shadow:var(--shadow);font-weight:600}
.study-actions button:hover{border-color:var(--accent);color:var(--accent)}
.study-actions button.again{border-color:#fecaca;color:#dc2626;background:#fef2f2}
.study-actions button.good{border-color:#bbf7d0;color:#16a34a;background:#f0fdf4}
.study-actions button.next{margin-left:8px}
/* ---------- browse (2 columns) ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.mini-head{padding:10px 14px;font-size:11.5px;color:var(--sub);display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.mini-head .pill{padding:2px 8px;border-radius:999px;color:#fff;font-weight:600;font-size:10.5px;letter-spacing:.3px}
.mini-head .sec{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-body{padding:14px 16px;cursor:pointer;min-height:84px;display:flex;align-items:center;justify-content:center}
.mini-body.flipped{background:var(--bg)}
.mini-front{font-size:15px;font-weight:700;line-height:1.5;text-align:center}
.mini-back{font-size:13.5px;line-height:1.65;display:none;width:100%}
.mini-back ul{list-style:none;padding:0}
.mini-back ul > li{padding:6px 10px;margin-bottom:5px;background:#fff;border-radius:7px;border-left:2px solid var(--accent);font-weight:600;font-size:13px}
.mini-back ul ul{list-style:disc;margin:4px 0 2px 16px;font-weight:400;font-size:12.5px;color:var(--txt)}
.mini-back ul ul li{background:transparent;border:0;padding:1px 0;margin:0}
.mini-back .def-ans{background:#fff;padding:8px 12px;border-radius:7px;border-left:2px solid var(--accent)}
.mini-body.flipped .mini-front{display:none}
.mini-body.flipped .mini-back{display:block}
.flip-all{display:flex;gap:6px;align-items:center}
.flip-all button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--txt)}
.flip-all button:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.toolbar input[type=text]{min-width:0;flex:1}}
</style>
</head>

加入工程会导致Source Insight运行非常慢</li><li>建议：只把当前分析的源码目录加入工程（如 /framework/base）</li><li>通过 Project → Add and Remove Project Files 动态添加/删除工程中的目录</li><li>一般先把framework/base下的目录加入工程，有需要再添加其他目录</li></ul>", "backText": "定位：阅读源码的必备工具；Windows软件，Linux上可通过wine安装; 新建源码工程：菜单 Project → New Project，指定源码目录; 注意：把Android全部源码加入工程会导致Source Insight运行非常慢; 建议：只把当前分析的源码目录加入工程（如 /framework/base）; 通过 Project → Add and Remove Project Files 动态添加/删除工程中的目录; 一般先把framework/base下的目录加入工程，有需要再添加其他目录"}, {"id": "c35", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "定位", "back": "<div class=\"def-ans\">阅读源码的必备工具；Windows软件，Linux上可通过wine安装</div>", "backText": "阅读源码的必备工具；Windows软件，Linux上可通过wine安装"}, {"id": "c36", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "新建源码工程", "back": "<div class=\"def-ans\">菜单 Project → New Project，指定源码目录</div>", "backText": "菜单 Project → New Project，指定源码目录"}, {"id": "c37", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "注意", "back": "<div class=\"def-ans\">把Android全部源码加入工程会导致Source Insight运行非常慢</div>", "backText": "把Android全部源码加入工程会导致Source Insight运行非常慢"}, {"id": "c38", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "建议", "back": "<div class=\"def-ans\">只把当前分析的源码目录加入工程（如 /framework/base）</div>", "backText": "只把当前分析的源码目录加入工程（如 /framework/base）"}, {"id": "c39", "type": "outline", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "1.2.2 Eclipse的使用", "back": "<ul class=\"ans-list\"><li>定位：Android推荐IDE；可查看Java与Native代码，也能调试系统核心进程</li><li>导入Android Framework Java源码（必须先编译整个Android源码）<ul class=\"sub\"><li>步骤1：把源码目录 /development/ide/eclipse/.classpath 复制到Android源码根目录</li><li>步骤2：编辑.classpath文件（保存各模块源码路径），注释掉非Framework相关目录以加快导入</li><li>步骤3：Eclipse菜单 New → Java Project，Location设为Android源码所在路径；导入耗时较长</li><li>提示：导入前必须取消自动编译；导入完毕后千万不要clean工程，否则删除编译产物</li></ul></li><li>导入Android Native代码<ul class=\"sub\"><li>步骤1：切换到C/C++视图</li><li>步骤2：New → C/C++，选择 Convert to a C/C++ project，将Java工程转为C++工程</li><li>步骤3：Properties → C/C++ General → Paths and Symbols，Includes页面导入 /development/ide/eclipse/android-include-paths.xml</li><li>步骤4：Symbols页面导入 android-symbols.xml</li><li>步骤5：Source Location页面用Add Folder过滤需导入的C++文件（作者仅导入frameworks目录下的Native代码）</li><li>步骤6：右击C++工程 → Index → Rebuild 重新生成Native代码索引</li></ul></li><li>调试SystemServer<ul class=\"sub\"><li>步骤1：先编译Android源码工程；编译报错大多是.classpath包含了不需要的模块</li><li>步骤2：右键工程 → Debug As → Debug Configurations → Remote Java Application</li><li>步骤3：新建配置，Remote调试端口号设为8600（SystemServer进程的调试端口），Host为localhost</li><li>Eclipse连接8600端口后通过JDWP协议调试SystemServer</li></ul></li></ul>", "backText": "定位：Android推荐IDE；可查看Java与Native代码，也能调试系统核心进程; 导入Android Framework Java源码（必须先编译整个Android源码）; 导入Android Native代码; 调试SystemServer"}, {"id": "c41", "type": "outline", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "导入Android Framework Java源码（必须先编译整个Android源码）", "back": "<ul class=\"ans-list\"><li>步骤1：把源码目录 /development/ide/eclipse/.classpath 复制到Android源码根目录</li><li>步骤2：编辑.classpath文件（保存各模块源码路径），注释掉非Framework相关目录以加快导入</li><li>步骤3：Eclipse菜单 New → Java Project，Location设为Android源码所在路径；导入耗时较长</li><li>提示：导入前必须取消自动编译；导入完毕后千万不要clean工程，否则删除编译产物</li></ul>", "backText": "步骤1：把源码目录 /development/ide/eclipse/.classpath 复制到Android源码根目录; 步骤2：编辑.classpath文件（保存各模块源码路径），注释掉非Framework相关目录以加快导入; 步骤3：Eclipse菜单 New → Java Project，Location设为Android源码所在路径；导入耗时较长; 提示：导入前必须取消自动编译；导入完毕后千万不要clean工程，否则删除编译产物"}, {"id": "c42", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "步骤1", "back": "<div class=\"def-ans\">把源码目录 /development/ide/eclipse/.classpath 复制到Android源码根目录</div>", "backText": "把源码目录 /development/ide/eclipse/.classpath 复制到Android源码根目录"}, {"id": "c43", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "步骤2", "back": "<div class=\"def-ans\">编辑.classpath文件（保存各模块源码路径），注释掉非Framework相关目录以加快导入</div>", "backText": "编辑.classpath文件（保存各模块源码路径），注释掉非Framework相关目录以加快导入"}, {"id": "c44", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "步骤3", "back": "<div class=\"def-ans\">Eclipse菜单 New → Java Project，Location设为Android源码所在路径；导入耗时较长</div>", "backText": "Eclipse菜单 New → Java Project，Location设为Android源码所在路径；导入耗时较长"}, {"id": "c45", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "提示", "back": "<div class=\"def-ans\">导入前必须取消自动编译；导入完毕后千万不要clean工程，否则删除编译产物</div>", "backText": "导入前必须取消自动编译；导入完毕后千万不要clean工程，否则删除编译产物"}, {"id": "c46", "type": "outline", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "导入Android Native代码", "back": "<ul class=\"ans-list\"><li>步骤1：切换到C/C++视图</li><li>步骤2：New → C/C++，选择 Convert to a C/C++ project，将Java工程转为C++工程</li><li>步骤3：Properties → C/C++ General → Paths and Symbols，Includes页面导入 /development/ide/eclipse/android-include-paths.xml</li><li>步骤4：Symbols页面导入 android-symbols.xml</li><li>步骤5：Source Location页面用Add Folder过滤需导入的C++文件（作者仅导入frameworks目录下的Native代码）</li><li>步骤6：右击C++工程 → Index → Rebuild 重新生成Native代码索引</li></ul>", "backText": "步骤1：切换到C/C++视图; 步骤2：New → C/C++，选择 Convert to a C/C++ project，将Java工程转为C++工程; 步骤3：Properties → C/C++ General → Paths and Symbols，Includes页面导入 /development/ide/eclipse/android-include-paths.xml; 步骤4：Symbols页面导入 android-symbols.xml; 步骤5：Source Location页面用Add Folder过滤需导入的C++文件（作者仅导入frameworks目录下的Native代码）; 步骤6：右击C++工程 → Index → Rebuild 重新生成Native代码索引"}, {"id": "c50", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "步骤4", "back": "<div class=\"def-ans\">Symbols页面导入 android-symbols.xml</div>", "backText": "Symbols页面导入 android-symbols.xml"}, {"id": "c51", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "步骤5", "back": "<div class=\"def-ans\">Source Location页面用Add Folder过滤需导入的C++文件（作者仅导入frameworks目录下的Native代码）</div>", "backText": "Source Location页面用Add Folder过滤需导入的C++文件（作者仅导入frameworks目录下的Native代码）"}, {"id": "c52", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "步骤6", "back": "<div class=\"def-ans\">右击C++工程 → Index → Rebuild 重新生成Native代码索引</div>", "backText": "右击C++工程 → Index → Rebuild 重新生成Native代码索引"}, {"id": "c53", "type": "outline", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "调试SystemServer", "back": "<ul class=\"ans-list\"><li>步骤1：先编译Android源码工程；编译报错大多是.classpath包含了不需要的模块</li><li>步骤2：右键工程 → Debug As → Debug Configurations → Remote Java Application</li><li>步骤3：新建配置，Remote调试端口号设为8600（SystemServer进程的调试端口），Host为localhost</li><li>Eclipse连接8600端口后通过JDWP协议调试SystemServer</li></ul>", "backText": "步骤1：先编译Android源码工程；编译报错大多是.classpath包含了不需要的模块; 步骤2：右键工程 → Debug As → Debug Configurations → Remote Java Application; 步骤3：新建配置，Remote调试端口号设为8600（SystemServer进程的调试端口），Host为localhost; Eclipse连接8600端口后通过JDWP协议调试SystemServer"}, {"id": "c57", "type": "outline", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "1.2.3 BusyBox的使用", "back": "<ul class=\"ans-list\"><li>定位：Linux平台上的\"瑞士军刀\"，提供grep、find等常用工具</li><li>背景：Android系统去掉了大多数标准Linux工具，导致调试研究困难，需在手机上安装BusyBox</li><li>下载：busybox.net官网已按平台提供编译好的版本；作者下载busybox-armv7l（arm v7为ARM指令集版本，Cortex-A8/A9系列CPU支持）</li><li>安装命令：adb push busybox /system/xbin → cd /system/xbin → chmod 755 busybox → busybox --install .</li><li>运行busybox提供的命令：直接执行grep，或busybox xxx执行xxx命令</li></ul>", "backText": "定位：Linux平台上的\"瑞士军刀\"，提供grep、find等常用工具; 背景：Android系统去掉了大多数标准Linux工具，导致调试研究困难，需在手机上安装BusyBox; 下载：busybox.net官网已按平台提供编译好的版本；作者下载busybox-armv7l（arm v7为ARM指令集版本，Cortex-A8/A9系列CPU支持）; 安装命令：adb push busybox /system/xbin → cd /system/xbin → chmod 755 busybox → busybox --install .; 运行busybox提供的命令：直接执行grep，或busybox xxx执行xxx命令"}, {"id": "c59", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "背景", "back": "<div class=\"def-ans\">Android系统去掉了大多数标准Linux工具，导致调试研究困难，需在手机上安装BusyBox</div>", "backText": "Android系统去掉了大多数标准Linux工具，导致调试研究困难，需在手机上安装BusyBox"}, {"id": "c60", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "下载", "back": "<div class=\"def-ans\">busybox.net官网已按平台提供编译好的版本；作者下载busybox-armv7l（arm v7为ARM指令集版本，Cortex-A8/A9系列CPU支持）</div>", "backText": "busybox.net官网已按平台提供编译好的版本；作者下载busybox-armv7l（arm v7为ARM指令集版本，Cortex-A8/A9系列CPU支持）"}, {"id": "c61", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "安装命令", "back": "<div class=\"def-ans\">adb push busybox /system/xbin → cd /system/xbin → chmod 755 busybox → busybox --install .</div>", "backText": "adb push busybox /system/xbin → cd /system/xbin → chmod 755 busybox → busybox --install ."}, {"id": "c62", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.2 工具使用", "front": "运行busybox提供的命令", "back": "<div class=\"def-ans\">直接执行grep，或busybox xxx执行xxx命令</div>", "backText": "直接执行grep，或busybox xxx执行xxx命令"}, {"id": "c63", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.3 本书资源下载说明", "front": "背景", "back": "<div class=\"def-ans\">为解决国内读者无法从Android官网下载源码的问题，作者在115网盘分享本书所用Android源码及其他资源</div>", "backText": "为解决国内读者无法从Android官网下载源码的问题，作者在115网盘分享本书所用Android源码及其他资源"}, {"id": "c64", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.3 本书资源下载说明", "front": "资源清单", "back": "<div class=\"def-ans\">Android 4.2.2源码压缩包；.classpath配置文件；busybox-armv7l；Eclipse代码折叠插件Coffee Byte Java</div>", "backText": "Android 4.2.2源码压缩包；.classpath配置文件；busybox-armv7l；Eclipse代码折叠插件Coffee Byte Java"}, {"id": "c65", "type": "def", "part": "开篇导读", "partColor": "#8b5cf6", "chapter": "全书导读（前言 & 第1章 准备工作）", "section": "1.3 本书资源下载说明", "front": "特别说明", "back": "<div class=\"def-ans\">本书对wpa_supplicant的分析使用Android 4.1源码中的版本（wpa_supplicant_8_4.1）</div>", "backText": "本书对wpa_supplicant的分析使用Android 4.1源码中的版本（wpa_supplicant_8_4.1）"}, {"id": "c66", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.1 概述", "front": "Netd定位", "back": "<div class=\"def-ans\">Android系统中专门负责网络管理和控制的后台daemon程序，位于Framework层和Kernel层之间，是网络相关消息和命令转发及处理的中枢模块</div>", "backText": "Android系统中专门负责网络管理和控制的后台daemon程序，位于Framework层和Kernel层之间，是网络相关消息和命令转发及处理的中枢模块"}, {"id": "c67", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.1 概述", "front": "Netd三大功能", "back": "<ul class=\"ans-list\"><li>设置防火墙（Firewall）、NAT、带宽控制、软接入点（Soft AP）控制、网络设备绑定（Tether）等</li><li>Android系统中DNS信息的缓存和管理</li><li>网络服务搜索（NSD）：服务注册（Registration）、服务搜索（Browse）、服务名解析（Resolve）</li></ul>", "backText": "设置防火墙（Firewall）、NAT、带宽控制、软接入点（Soft AP）控制、网络设备绑定（Tether）等; Android系统中DNS信息的缓存和管理; 网络服务搜索（NSD）：服务注册（Registration）、服务搜索（Browse）、服务名解析（Resolve）"}, {"id": "c68", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.1 概述", "front": "网络服务搜索（NSD）", "back": "<div class=\"def-ans\">服务注册（Registration）、服务搜索（Browse）、服务名解析（Resolve）</div>", "backText": "服务注册（Registration）、服务搜索（Browse）、服务名解析（Resolve）"}, {"id": "c69", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.1 概述", "front": "Netd工作流程两部分（与Vold类似）", "back": "<ul class=\"ans-list\"><li>接收并处理来自Framework层NetworkManagementService或NsdService的命令，由对应的Command对象处理</li><li>接收并解析来自Kernel的UEvent消息，再转发给Framework层对应Service</li></ul>", "backText": "接收并处理来自Framework层NetworkManagementService或NsdService的命令，由对应的Command对象处理; 接收并解析来自Kernel的UEvent消息，再转发给Framework层对应Service"}, {"id": "c70", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "交互关系", "back": "<div class=\"def-ans\">NetworkManagementService连接\"netd\"socket、NsdService连接\"mdns\"socket；所有调用域名解析API（getaddrinfo、gethostbyname等）的进程借由\"dnsproxyd\"socket与Netd建立链接</div>", "backText": "NetworkManagementService连接\"netd\"socket、NsdService连接\"mdns\"socket；所有调用域名解析API（getaddrinfo、gethostbyname等）的进程借由\"dnsproxyd\"socket与Netd建立链接"}, {"id": "c71", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "2.2.1 main函数分析", "back": "<ul class=\"ans-list\"><li>blockSigpipe()屏蔽SIGPIPE信号</li><li>NetlinkManager::Instance()创建NetlinkManager（NM）</li><li>new CommandListener()（创建\"netd\"监听socket），nm-&gt;setBroadcaster(cl)将CL设为NM的消息发送者</li><li>nm-&gt;start()启动NetlinkManager</li><li>setenv(\"ANDROID_DNS_MODE\", \"local\", 1)：使Netd自身DNS解析不走代理流程</li><li>new DnsProxyListener()并startListener()（\"dnsproxyd\"socket）；new MDnsSdListener()并startListener()（\"mdns\"socket）；cl-&gt;startListener()</li><li>主进程while(1)循环等待</li><li>四个重要成员：NetlinkManager（收Kernel UEvent经Broadcaster发给Framework）；CommandListener/DnsProxyListener/MDnsSdListener（各自创建socket并处理客户端命令）</li></ul>", "backText": "blockSigpipe()屏蔽SIGPIPE信号; NetlinkManager::Instance()创建NetlinkManager（NM）; new CommandListener()（创建\"netd\"监听socket），nm->setBroadcaster(cl)将CL设为NM的消息发送者; nm->start()启动NetlinkManager; setenv(\"ANDROID_DNS_MODE\", \"local\", 1)：使Netd自身DNS解析不走代理流程; new DnsProxyListener()并startListener()（\"dnsproxyd\"socket）；new MDnsSdListener()并startListener()（\"mdns\"socket）；cl->startListener()"}, {"id": "c72", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "NetlinkManager", "back": "<div class=\"def-ans\">:Instance()创建NetlinkManager（NM）</div>", "backText": ":Instance()创建NetlinkManager（NM）"}, {"id": "c73", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "四个重要成员", "back": "<div class=\"def-ans\">NetlinkManager（收Kernel UEvent经Broadcaster发给Framework）；CommandListener/DnsProxyListener/MDnsSdListener（各自创建socket并处理客户端命令）</div>", "backText": "NetlinkManager（收Kernel UEvent经Broadcaster发给Framework）；CommandListener/DnsProxyListener/MDnsSdListener（各自创建socket并处理客户端命令）"}, {"id": "c74", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "2.2.2 NetlinkManager分析", "back": "<ul class=\"ans-list\"><li>start注册三个UEvent socket（setupSocket同时创建对应NetlinkHandler）<ul class=\"sub\"><li>NETLINK_KOBJECT_UEVENT：kobject事件，ASCII格式，关注/sys/class/net下模块加载/卸载</li><li>NETLINK_ROUTE（RTMGRP_LINK）：路由/链路变化消息，二进制格式，如网线插拔触发的链路通断</li><li>NETLINK_NFLOG：与带宽控制预警相关（iptables扩展项，并非所有Kernel支持）</li></ul></li><li>家族成员关系：NetlinkHandler和CommandListener均间接派生自SocketListener；UEvent消息封装为NetlinkEvent对象（ASCII调用parseAsciiNetlinkMessage，二进制调用parseBinaryNetlinkMessage）；处理结果经mBroadcaster传给Framework</li><li>NetlinkHandler::onEvent按subsys分类处理<ul class=\"sub\"><li>subsys=\"net\"：NlActionAdd→notifyInterfaceAdded、Remove→notifyInterfaceRemoved、Change→notifyInterfaceChanged、LinkUp/LinkDown→notifyInterfaceLinkChanged</li><li>subsys=\"qlog\"：数据量超配额→notifyQuotaLimitReached</li><li>subsys=\"xt_idletimer\"：跟踪NIC工作状态（idle/active）→notifyInterfaceClassActivity</li></ul></li><li>工作流程：每个Handler单独创建线程接收socket消息；Kernel发UEvent后onDataAvailable→创建NetlinkEvent解析→onEvent分类处理→经mBroadcaster转发给NetworkManagementService</li></ul>", "backText": "start注册三个UEvent socket（setupSocket同时创建对应NetlinkHandler）; 家族成员关系：NetlinkHandler和CommandListener均间接派生自SocketListener；UEvent消息封装为NetlinkEvent对象（ASCII调用parseAsciiNetlinkMessage，二进制调用parseBinaryNetlinkMessage）；处理结果经mBroadcaster传给Framework; NetlinkHandler::onEvent按subsys分类处理; 工作流程：每个Handler单独创建线程接收socket消息；Kernel发UEvent后onDataAvailable→创建NetlinkEvent解析→onEvent分类处理→经mBroadcaster转发给NetworkManagementService"}, {"id": "c75", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "start注册三个UEvent socket（setupSocket同时创建对应NetlinkHandler）", "back": "<ul class=\"ans-list\"><li>NETLINK_KOBJECT_UEVENT：kobject事件，ASCII格式，关注/sys/class/net下模块加载/卸载</li><li>NETLINK_ROUTE（RTMGRP_LINK）：路由/链路变化消息，二进制格式，如网线插拔触发的链路通断</li><li>NETLINK_NFLOG：与带宽控制预警相关（iptables扩展项，并非所有Kernel支持）</li></ul>", "backText": "NETLINK_KOBJECT_UEVENT：kobject事件，ASCII格式，关注/sys/class/net下模块加载/卸载; NETLINK_ROUTE（RTMGRP_LINK）：路由/链路变化消息，二进制格式，如网线插拔触发的链路通断; NETLINK_NFLOG：与带宽控制预警相关（iptables扩展项，并非所有Kernel支持）"}, {"id": "c76", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "NETLINK_KOBJECT_UEVENT", "back": "<div class=\"def-ans\">kobject事件，ASCII格式，关注/sys/class/net下模块加载/卸载</div>", "backText": "kobject事件，ASCII格式，关注/sys/class/net下模块加载/卸载"}, {"id": "c77", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "NETLINK_ROUTE（RTMGRP_LINK）", "back": "<div class=\"def-ans\">路由/链路变化消息，二进制格式，如网线插拔触发的链路通断</div>", "backText": "路由/链路变化消息，二进制格式，如网线插拔触发的链路通断"}, {"id": "c78", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "NETLINK_NFLOG", "back": "<div class=\"def-ans\">与带宽控制预警相关（iptables扩展项，并非所有Kernel支持）</div>", "backText": "与带宽控制预警相关（iptables扩展项，并非所有Kernel支持）"}, {"id": "c79", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "家族成员关系", "back": "<div class=\"def-ans\">NetlinkHandler和CommandListener均间接派生自SocketListener；UEvent消息封装为NetlinkEvent对象（ASCII调用parseAsciiNetlinkMessage，二进制调用parseBinaryNetlinkMessage）；处理结果经mBroadcaster传给Framework</div>", "backText": "NetlinkHandler和CommandListener均间接派生自SocketListener；UEvent消息封装为NetlinkEvent对象（ASCII调用parseAsciiNetlinkMessage，二进制调用parseBinaryNetlinkMessage）；处理结果经mBroadcaster传给Framework"}, {"id": "c80", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "NetlinkHandler::onEvent按subsys分类处理", "back": "<ul class=\"ans-list\"><li>subsys=\"net\"：NlActionAdd→notifyInterfaceAdded、Remove→notifyInterfaceRemoved、Change→notifyInterfaceChanged、LinkUp/LinkDown→notifyInterfaceLinkChanged</li><li>subsys=\"qlog\"：数据量超配额→notifyQuotaLimitReached</li><li>subsys=\"xt_idletimer\"：跟踪NIC工作状态（idle/active）→notifyInterfaceClassActivity</li></ul>", "backText": "subsys=\"net\"：NlActionAdd→notifyInterfaceAdded、Remove→notifyInterfaceRemoved、Change→notifyInterfaceChanged、LinkUp/LinkDown→notifyInterfaceLinkChanged; subsys=\"qlog\"：数据量超配额→notifyQuotaLimitReached; subsys=\"xt_idletimer\"：跟踪NIC工作状态（idle/active）→notifyInterfaceClassActivity"}, {"id": "c81", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "subsys=\"net\"", "back": "<div class=\"def-ans\">NlActionAdd→notifyInterfaceAdded、Remove→notifyInterfaceRemoved、Change→notifyInterfaceChanged、LinkUp/LinkDown→notifyInterfaceLinkChanged</div>", "backText": "NlActionAdd→notifyInterfaceAdded、Remove→notifyInterfaceRemoved、Change→notifyInterfaceChanged、LinkUp/LinkDown→notifyInterfaceLinkChanged"}, {"id": "c82", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "subsys=\"qlog\"", "back": "<div class=\"def-ans\">数据量超配额→notifyQuotaLimitReached</div>", "backText": "数据量超配额→notifyQuotaLimitReached"}, {"id": "c83", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "subsys=\"xt_idletimer\"", "back": "<div class=\"def-ans\">跟踪NIC工作状态（idle/active）→notifyInterfaceClassActivity</div>", "backText": "跟踪NIC工作状态（idle/active）→notifyInterfaceClassActivity"}, {"id": "c84", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "工作流程", "back": "<div class=\"def-ans\">每个Handler单独创建线程接收socket消息；Kernel发UEvent后onDataAvailable→创建NetlinkEvent解析→onEvent分类处理→经mBroadcaster转发给NetworkManagementService</div>", "backText": "每个Handler单独创建线程接收socket消息；Kernel发UEvent后onDataAvailable→创建NetlinkEvent解析→onEvent分类处理→经mBroadcaster转发给NetworkManagementService"}, {"id": "c85", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "2.2.3 CommandListener分析", "back": "<ul class=\"ans-list\"><li>职责：接收来自Framework层NetworkManagementService的命令，收到后转交给对应命令处理对象</li><li>定义11个网络相关Command类（均派生自NetdCommand）和10个控制类（Controller）</li><li>构造函数：registerCmd注册InterfaceCmd、IpFwdCmd、TetherCmd、NatCmd、ListTtysCmd、PppdCmd、SoftapCmd、BandwidthControlCmd、IdletimerControlCmd、ResolverCmd、FirewallCmd；创建10个Controller（静态单例）</li><li>工作流程：客户端发送命令名（如\"nat\"）→ CL按名字匹配命令对象 → 由该对象的runCommand函数完成实际处理</li></ul>", "backText": "职责：接收来自Framework层NetworkManagementService的命令，收到后转交给对应命令处理对象; 定义11个网络相关Command类（均派生自NetdCommand）和10个控制类（Controller）; 构造函数：registerCmd注册InterfaceCmd、IpFwdCmd、TetherCmd、NatCmd、ListTtysCmd、PppdCmd、SoftapCmd、BandwidthControlCmd、IdletimerControlCmd、ResolverCmd、FirewallCmd；创建10个Controller（静态单例）; 工作流程：客户端发送命令名（如\"nat\"）→ CL按名字匹配命令对象 → 由该对象的runCommand函数完成实际处理"}, {"id": "c86", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "职责", "back": "<div class=\"def-ans\">接收来自Framework层NetworkManagementService的命令，收到后转交给对应命令处理对象</div>", "backText": "接收来自Framework层NetworkManagementService的命令，收到后转交给对应命令处理对象"}, {"id": "c87", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "构造函数", "back": "<div class=\"def-ans\">registerCmd注册InterfaceCmd、IpFwdCmd、TetherCmd、NatCmd、ListTtysCmd、PppdCmd、SoftapCmd、BandwidthControlCmd、IdletimerControlCmd、ResolverCmd、FirewallCmd；创建10个Controller（静态单例）</div>", "backText": "registerCmd注册InterfaceCmd、IpFwdCmd、TetherCmd、NatCmd、ListTtysCmd、PppdCmd、SoftapCmd、BandwidthControlCmd、IdletimerControlCmd、ResolverCmd、FirewallCmd；创建10个Controller（静态单例）"}, {"id": "c89", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "2.2.4 DnsProxyListener分析", "back": "<ul class=\"ans-list\"><li>Android DNS简介：DNS在域名和IP地址之间建立映射；Bionic C基于NetBSD resolver library实现并修改</li><li>两个常用解析API：getaddrinfo（域名→IP）、getnameinfo（IP→域名）</li><li>Android对Bionic C的修改：裁剪name-server-switch；DNS配置文件/system/etc/resolv.conf；系统属性保存DNS（net.dns1/net.dns2）；进程特定DNS（net.dns1.&lt;pid&gt;）；不同网络设备对应DNS（net.wlan.dns1）</li><li>getaddrinfo的Android定制：调用android_getaddrinfo_proxy；读ANDROID_DNS_MODE环境变量（\"local\"则走正常流程）；检查net.dns1.&lt;pid&gt;；否则连接\"/dev/socket/dnsproxyd\"转发给DnsProxyListener</li><li>DPL命令仅两个：GetAddrInfoCmd（对应getaddrinfo）、GetHostByAddrCmd（对应gethostbyaddr）；GetAddrInfoHandler最终调用Bionic C的getaddrinfo</li><li>设计好处：所有DNS记录都缓存在Netd进程中，成为公共资源，最大程度信息共享</li></ul>", "backText": "Android DNS简介：DNS在域名和IP地址之间建立映射；Bionic C基于NetBSD resolver library实现并修改; 两个常用解析API：getaddrinfo（域名→IP）、getnameinfo（IP→域名）; Android对Bionic C的修改：裁剪name-server-switch；DNS配置文件/system/etc/resolv.conf；系统属性保存DNS（net.dns1/net.dns2）；进程特定DNS（net.dns1.<pid>）；不同网络设备对应DNS（net.wlan.dns1）; getaddrinfo的Android定制：调用android_getaddrinfo_proxy；读ANDROID_DNS_MODE环境变量（\"local\"则走正常流程）；检查net.dns1.<pid>；否则连接\"/dev/socket/dnsproxyd\"转发给DnsProxyListener; DPL命令仅两个：GetAddrInfoCmd（对应getaddrinfo）、GetHostByAddrCmd（对应gethostbyaddr）；GetAddrInfoHandler最终调用Bionic C的getaddrinfo; 设计好处：所有DNS记录都缓存在Netd进程中，成为公共资源，最大程度信息共享"}, {"id": "c90", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "Android DNS简介", "back": "<div class=\"def-ans\">DNS在域名和IP地址之间建立映射；Bionic C基于NetBSD resolver library实现并修改</div>", "backText": "DNS在域名和IP地址之间建立映射；Bionic C基于NetBSD resolver library实现并修改"}, {"id": "c91", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "两个常用解析API", "back": "<div class=\"def-ans\">getaddrinfo（域名→IP）、getnameinfo（IP→域名）</div>", "backText": "getaddrinfo（域名→IP）、getnameinfo（IP→域名）"}, {"id": "c92", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "Android对Bionic C的修改", "back": "<div class=\"def-ans\">裁剪name-server-switch；DNS配置文件/system/etc/resolv.conf；系统属性保存DNS（net.dns1/net.dns2）；进程特定DNS（net.dns1.&lt;pid&gt;）；不同网络设备对应DNS（net.wlan.dns1）</div>", "backText": "裁剪name-server-switch；DNS配置文件/system/etc/resolv.conf；系统属性保存DNS（net.dns1/net.dns2）；进程特定DNS（net.dns1.<pid>）；不同网络设备对应DNS（net.wlan.dns1）"}, {"id": "c93", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "getaddrinfo的Android定制", "back": "<div class=\"def-ans\">调用android_getaddrinfo_proxy；读ANDROID_DNS_MODE环境变量（\"local\"则走正常流程）；检查net.dns1.&lt;pid&gt;；否则连接\"/dev/socket/dnsproxyd\"转发给DnsProxyListener</div>", "backText": "调用android_getaddrinfo_proxy；读ANDROID_DNS_MODE环境变量（\"local\"则走正常流程）；检查net.dns1.<pid>；否则连接\"/dev/socket/dnsproxyd\"转发给DnsProxyListener"}, {"id": "c94", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "DPL命令仅两个", "back": "<div class=\"def-ans\">GetAddrInfoCmd（对应getaddrinfo）、GetHostByAddrCmd（对应gethostbyaddr）；GetAddrInfoHandler最终调用Bionic C的getaddrinfo</div>", "backText": "GetAddrInfoCmd（对应getaddrinfo）、GetHostByAddrCmd（对应gethostbyaddr）；GetAddrInfoHandler最终调用Bionic C的getaddrinfo"}, {"id": "c95", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "设计好处", "back": "<div class=\"def-ans\">所有DNS记录都缓存在Netd进程中，成为公共资源，最大程度信息共享</div>", "backText": "所有DNS记录都缓存在Netd进程中，成为公共资源，最大程度信息共享"}, {"id": "c96", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "2.2.5 MDnsSdListener分析", "back": "<ul class=\"ans-list\"><li>Apple Bonjour技术：基于组播域名服务（mDNS）的零配置网络标准；解决Addressing（自行选IP并检测冲突）、Naming（组播DNS查询）、Service Discovery（查找服务并解析IP和端口）三个问题</li><li>实现：Apple开源工程mdnsresponder/mdnsd；开发者用Bonjour API发起注册/查询/解析请求</li><li>Bonjour三个核心API（dns_sd.h，链接libmdnssd.so）<ul class=\"sub\"><li>DNSServiceRegister：服务注册（flags重名冲突处理、regtype格式\"_服务名._传输协议\"、port等）</li><li>DNSServiceBrowse：服务搜索</li><li>DNSServiceResolve：服务解析（返回IP地址和端口号）</li></ul></li><li>MDnsSdListener：对应Framework层NsdService（Android 4.1新增）；内部类Monitor与mdnsd通信（为每个DNSService建Element对象保存在list中）；Handler是注册的Command</li><li>运行三步：①Netd创建MDnsSdListener，Monitor启动线程与mdnsd通信（socketpair+poll）；②NsdService发\"start-service\"命令；③NsdService发其他命令（如\"discovery\"）由Monitor处理</li><li>Monitor::startService：读属性init.svc.mdnsd，若mdnsd非running则property_set(\"ctl.start\")启动并wait_for_property等待</li><li>Handler::serviceRegister：allocateServiceRef分配DNSServiceRef→DNSServiceRegister注册→startMonitoring→回复CommandOkay；回调经sendBroadcast(ServiceRegistrationSucceeded)返回NsdService</li></ul>", "backText": "Apple Bonjour技术：基于组播域名服务（mDNS）的零配置网络标准；解决Addressing（自行选IP并检测冲突）、Naming（组播DNS查询）、Service Discovery（查找服务并解析IP和端口）三个问题; 实现：Apple开源工程mdnsresponder/mdnsd；开发者用Bonjour API发起注册/查询/解析请求; Bonjour三个核心API（dns_sd.h，链接libmdnssd.so）; MDnsSdListener：对应Framework层NsdService（Android 4.1新增）；内部类Monitor与mdnsd通信（为每个DNSService建Element对象保存在list中）；Handler是注册的Command; 运行三步：①Netd创建MDnsSdListener，Monitor启动线程与mdnsd通信（socketpair+poll）；②NsdService发\"start-service\"命令；③NsdService发其他命令（如\"discovery\"）由Monitor处理; Monitor::startService：读属性init.svc.mdnsd，若mdnsd非running则property_set(\"ctl.start\")启动并wait_for_property等待"}, {"id": "c97", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "Apple Bonjour技术", "back": "<div class=\"def-ans\">基于组播域名服务（mDNS）的零配置网络标准；解决Addressing（自行选IP并检测冲突）、Naming（组播DNS查询）、Service Discovery（查找服务并解析IP和端口）三个问题</div>", "backText": "基于组播域名服务（mDNS）的零配置网络标准；解决Addressing（自行选IP并检测冲突）、Naming（组播DNS查询）、Service Discovery（查找服务并解析IP和端口）三个问题"}, {"id": "c98", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "实现", "back": "<div class=\"def-ans\">Apple开源工程mdnsresponder/mdnsd；开发者用Bonjour API发起注册/查询/解析请求</div>", "backText": "Apple开源工程mdnsresponder/mdnsd；开发者用Bonjour API发起注册/查询/解析请求"}, {"id": "c99", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "Bonjour三个核心API（dns_sd.h，链接libmdnssd.so）", "back": "<ul class=\"ans-list\"><li>DNSServiceRegister：服务注册（flags重名冲突处理、regtype格式\"_服务名._传输协议\"、port等）</li><li>DNSServiceBrowse：服务搜索</li><li>DNSServiceResolve：服务解析（返回IP地址和端口号）</li></ul>", "backText": "DNSServiceRegister：服务注册（flags重名冲突处理、regtype格式\"_服务名._传输协议\"、port等）; DNSServiceBrowse：服务搜索; DNSServiceResolve：服务解析（返回IP地址和端口号）"}, {"id": "c100", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "DNSServiceRegister", "back": "<div class=\"def-ans\">服务注册（flags重名冲突处理、regtype格式\"_服务名._传输协议\"、port等）</div>", "backText": "服务注册（flags重名冲突处理、regtype格式\"_服务名._传输协议\"、port等）"}, {"id": "c101", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "DNSServiceResolve", "back": "<div class=\"def-ans\">服务解析（返回IP地址和端口号）</div>", "backText": "服务解析（返回IP地址和端口号）"}, {"id": "c102", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "MDnsSdListener", "back": "<div class=\"def-ans\">对应Framework层NsdService（Android 4.1新增）；内部类Monitor与mdnsd通信（为每个DNSService建Element对象保存在list中）；Handler是注册的Command</div>", "backText": "对应Framework层NsdService（Android 4.1新增）；内部类Monitor与mdnsd通信（为每个DNSService建Element对象保存在list中）；Handler是注册的Command"}, {"id": "c103", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "运行三步", "back": "<div class=\"def-ans\">①Netd创建MDnsSdListener，Monitor启动线程与mdnsd通信（socketpair+poll）；②NsdService发\"start-service\"命令；③NsdService发其他命令（如\"discovery\"）由Monitor处理</div>", "backText": "①Netd创建MDnsSdListener，Monitor启动线程与mdnsd通信（socketpair+poll）；②NsdService发\"start-service\"命令；③NsdService发其他命令（如\"discovery\"）由Monitor处理"}, {"id": "c104", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "Monitor", "back": "<div class=\"def-ans\">:startService：读属性init.svc.mdnsd，若mdnsd非running则property_set(\"ctl.start\")启动并wait_for_property等待</div>", "backText": ":startService：读属性init.svc.mdnsd，若mdnsd非running则property_set(\"ctl.start\")启动并wait_for_property等待"}, {"id": "c105", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.2 Netd工作流程", "front": "Handler", "back": "<div class=\"def-ans\">:serviceRegister：allocateServiceRef分配DNSServiceRef→DNSServiceRegister注册→startMonitoring→回复CommandOkay；回调经sendBroadcast(ServiceRegistrationSucceeded)返回NsdService</div>", "backText": ":serviceRegister：allocateServiceRef分配DNSServiceRef→DNSServiceRegister注册→startMonitoring→回复CommandOkay；回调经sendBroadcast(ServiceRegistrationSucceeded)返回NsdService"}, {"id": "c106", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.1 iptables、tc和ip命令", "back": "<ul class=\"ans-list\"><li>iptables：与Kernel netfilter配合设置过滤（filter）或NAT规则<ul class=\"sub\"><li>三要素：Table（表）→Chain（链，Rule集合）→Rule（规则：匹配则执行Target，否则继续下一条）</li><li>四个Table：filter、nat、mangle、raw；filter默认Chain有INPUT、OUTPUT、FORWARD</li><li>四个默认Target：ACCEPT、DROP、RETURN、QUEUE；扩展Target REJECT会反馈信息</li><li>常用参数：-t表、-A追加、-D删除、-I插入、-N新建链、-L显示；-i入网卡、-o出网卡、-p协议、-s源IP、-j跳转</li><li>iptables仅支持IPv4，IPv6需用ip6tables</li></ul></li><li>tc（Traffic Control）：通过建立数据包队列并控制发送方式实现流量控制；只能限制本机发出的包（可借助IFB设备在输入方向控制）<ul class=\"sub\"><li>队列规则（qdisc）两类：Classless（fifo、SFQ、RED、TBF）；Classfull（借助filter分类送入类中排队，层层过滤）</li><li>tc流控步骤：①物理设备绑定qdisc；②队列上建立class；③为每分类建立基于路由的filter；④配合filter建立特定路由表</li></ul></li><li>ip命令：可替代ifconfig、route、arp；语法 ip [OPTIONS] OBJECT [COMMAND]</li></ul>", "backText": "iptables：与Kernel netfilter配合设置过滤（filter）或NAT规则; tc（Traffic Control）：通过建立数据包队列并控制发送方式实现流量控制；只能限制本机发出的包（可借助IFB设备在输入方向控制）; ip命令：可替代ifconfig、route、arp；语法 ip [OPTIONS] OBJECT [COMMAND]"}, {"id": "c107", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "iptables：与Kernel netfilter配合设置过滤（filter）或NAT规则", "back": "<ul class=\"ans-list\"><li>三要素：Table（表）→Chain（链，Rule集合）→Rule（规则：匹配则执行Target，否则继续下一条）</li><li>四个Table：filter、nat、mangle、raw；filter默认Chain有INPUT、OUTPUT、FORWARD</li><li>四个默认Target：ACCEPT、DROP、RETURN、QUEUE；扩展Target REJECT会反馈信息</li><li>常用参数：-t表、-A追加、-D删除、-I插入、-N新建链、-L显示；-i入网卡、-o出网卡、-p协议、-s源IP、-j跳转</li><li>iptables仅支持IPv4，IPv6需用ip6tables</li></ul>", "backText": "三要素：Table（表）→Chain（链，Rule集合）→Rule（规则：匹配则执行Target，否则继续下一条）; 四个Table：filter、nat、mangle、raw；filter默认Chain有INPUT、OUTPUT、FORWARD; 四个默认Target：ACCEPT、DROP、RETURN、QUEUE；扩展Target REJECT会反馈信息; 常用参数：-t表、-A追加、-D删除、-I插入、-N新建链、-L显示；-i入网卡、-o出网卡、-p协议、-s源IP、-j跳转; iptables仅支持IPv4，IPv6需用ip6tables"}, {"id": "c108", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "三要素", "back": "<div class=\"def-ans\">Table（表）→Chain（链，Rule集合）→Rule（规则：匹配则执行Target，否则继续下一条）</div>", "backText": "Table（表）→Chain（链，Rule集合）→Rule（规则：匹配则执行Target，否则继续下一条）"}, {"id": "c109", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "四个Table", "back": "<div class=\"def-ans\">filter、nat、mangle、raw；filter默认Chain有INPUT、OUTPUT、FORWARD</div>", "backText": "filter、nat、mangle、raw；filter默认Chain有INPUT、OUTPUT、FORWARD"}, {"id": "c110", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "四个默认Target", "back": "<div class=\"def-ans\">ACCEPT、DROP、RETURN、QUEUE；扩展Target REJECT会反馈信息</div>", "backText": "ACCEPT、DROP、RETURN、QUEUE；扩展Target REJECT会反馈信息"}, {"id": "c111", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "常用参数", "back": "<div class=\"def-ans\">-t表、-A追加、-D删除、-I插入、-N新建链、-L显示；-i入网卡、-o出网卡、-p协议、-s源IP、-j跳转</div>", "backText": "-t表、-A追加、-D删除、-I插入、-N新建链、-L显示；-i入网卡、-o出网卡、-p协议、-s源IP、-j跳转"}, {"id": "c112", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "tc（Traffic Control）：通过建立数据包队列并控制发送方式实现流量控制；只能限制本机发出的包（可借助IFB设备在输入方向控制）", "back": "<ul class=\"ans-list\"><li>队列规则（qdisc）两类：Classless（fifo、SFQ、RED、TBF）；Classfull（借助filter分类送入类中排队，层层过滤）</li><li>tc流控步骤：①物理设备绑定qdisc；②队列上建立class；③为每分类建立基于路由的filter；④配合filter建立特定路由表</li></ul>", "backText": "队列规则（qdisc）两类：Classless（fifo、SFQ、RED、TBF）；Classfull（借助filter分类送入类中排队，层层过滤）; tc流控步骤：①物理设备绑定qdisc；②队列上建立class；③为每分类建立基于路由的filter；④配合filter建立特定路由表"}, {"id": "c113", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "队列规则（qdisc）两类", "back": "<div class=\"def-ans\">Classless（fifo、SFQ、RED、TBF）；Classfull（借助filter分类送入类中排队，层层过滤）</div>", "backText": "Classless（fifo、SFQ、RED、TBF）；Classfull（借助filter分类送入类中排队，层层过滤）"}, {"id": "c114", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "tc流控步骤", "back": "<div class=\"def-ans\">①物理设备绑定qdisc；②队列上建立class；③为每分类建立基于路由的filter；④配合filter建立特定路由表</div>", "backText": "①物理设备绑定qdisc；②队列上建立class；③为每分类建立基于路由的filter；④配合filter建立特定路由表"}, {"id": "c115", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "ip命令", "back": "<div class=\"def-ans\">可替代ifconfig、route、arp；语法 ip [OPTIONS] OBJECT [COMMAND]</div>", "backText": "可替代ifconfig、route、arp；语法 ip [OPTIONS] OBJECT [COMMAND]"}, {"id": "c116", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.2 CommandListener构造函数和测试工具ndc", "back": "<ul class=\"ans-list\"><li>构造函数后半部分：createChildChains初始化各Table的Chain（filter表INPUT/FORWARD/OUTPUT、raw表PREROUTING、mangle表POSTROUTING、nat表PREROUTING/POSTROUTING）；setupOemIptablesHook（OEM自定义规则，/system/bin/oem-iptables-init.sh）；各Controller的setupIptablesHooks；sBandwidthCtrl-&gt;enableBandwidthControl(false)</li><li>构造后filter表中的Chain：bw_INPUT/bw_OUTPUT/bw_FORWARD（带宽）、fw_INPUT/fw_OUTPUT/fw_FORWARD（防火墙）、natctrl_FORWARD（NAT）、oem_fwd/oem_out（OEM）</li><li>ndc测试工具：监视Netd事件（ndc monitor）；连接\"netd\"socket发送命令；对网络HAL层开发者很有帮助</li></ul>", "backText": "构造函数后半部分：createChildChains初始化各Table的Chain（filter表INPUT/FORWARD/OUTPUT、raw表PREROUTING、mangle表POSTROUTING、nat表PREROUTING/POSTROUTING）；setupOemIptablesHook（OEM自定义规则，/system/bin/oem-iptables-init.sh）；各Controller的setupIptablesHooks；sBandwidthCtrl->enableBandwidthControl(false); 构造后filter表中的Chain：bw_INPUT/bw_OUTPUT/bw_FORWARD（带宽）、fw_INPUT/fw_OUTPUT/fw_FORWARD（防火墙）、natctrl_FORWARD（NAT）、oem_fwd/oem_out（OEM）; ndc测试工具：监视Netd事件（ndc monitor）；连接\"netd\"socket发送命令；对网络HAL层开发者很有帮助"}, {"id": "c117", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "构造函数后半部分", "back": "<div class=\"def-ans\">createChildChains初始化各Table的Chain（filter表INPUT/FORWARD/OUTPUT、raw表PREROUTING、mangle表POSTROUTING、nat表PREROUTING/POSTROUTING）；setupOemIptablesHook（OEM自定义规则，/system/bin/oem-iptables-init.sh）；各Controller的setupIptablesHooks；sBandwidthCtrl-&gt;enableBandwidthControl(false)</div>", "backText": "createChildChains初始化各Table的Chain（filter表INPUT/FORWARD/OUTPUT、raw表PREROUTING、mangle表POSTROUTING、nat表PREROUTING/POSTROUTING）；setupOemIptablesHook（OEM自定义规则，/system/bin/oem-iptables-init.sh）；各Controller的setupIptablesHooks；sBandwidthCtrl->enableBandwidthControl(false)"}, {"id": "c118", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "构造后filter表中的Chain", "back": "<div class=\"def-ans\">bw_INPUT/bw_OUTPUT/bw_FORWARD（带宽）、fw_INPUT/fw_OUTPUT/fw_FORWARD（防火墙）、natctrl_FORWARD（NAT）、oem_fwd/oem_out（OEM）</div>", "backText": "bw_INPUT/bw_OUTPUT/bw_FORWARD（带宽）、fw_INPUT/fw_OUTPUT/fw_FORWARD（防火墙）、natctrl_FORWARD（NAT）、oem_fwd/oem_out（OEM）"}, {"id": "c119", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "ndc测试工具", "back": "<div class=\"def-ans\">监视Netd事件（ndc monitor）；连接\"netd\"socket发送命令；对网络HAL层开发者很有帮助</div>", "backText": "监视Netd事件（ndc monitor）；连接\"netd\"socket发送命令；对网络HAL层开发者很有帮助"}, {"id": "c120", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.3 InterfaceCmd命令", "back": "<ul class=\"ans-list\"><li>作用：管理和控制系统中的网络设备；与InterfaceController、ThrottleController、SecondaryTableController交互</li><li>IFB设备：IMQ的替代者，Linux流量控制虚拟设备；输入数据包经ingress qdisc重定向到IFB，在IFB输出方向配置多种qdisc即可对输入流量做队列调度；IFB Device 0用于输入流控、1用于输出流控</li><li>Netdevice编程：socket句柄+ioctl操作底层网络设备；核心结构struct ifreq；常用SIOCGIFFLAGS/SIOCSIFFLAGS；Android封装ifc_utils（libnetutils）：ifc_init、ifc_up、ifc_set_flags</li><li>Linux策略路由：依据策略对IP包进行路由选择；Kernel最多255张路由表，4张内置（255 local、254 main、253 default、0保留）；用iproute2（ip命令）配置</li><li>命令选项六类：NIC设备信息管理（list、readrxcounter/readtxcounter读/proc/net/dev）；输入输出流量控制（setthrottle，实现在ThrottleController，核心用tc：htb qdisc+class+ifb0+ingress重定向filter）；Route控制（默认路由用ifc_add_route，secondary多路由表用SecondaryTableController，如ip route add ... table 78）；Driver控制（加载libnetcmdiface.so向驱动发命令）；IFC设备控制；IPv6控制（ipv6privacyextensions写/proc/sys/net/ipv6/.../use_tempaddr；ipv6写disable_ipv6）</li></ul>", "backText": "作用：管理和控制系统中的网络设备；与InterfaceController、ThrottleController、SecondaryTableController交互; IFB设备：IMQ的替代者，Linux流量控制虚拟设备；输入数据包经ingress qdisc重定向到IFB，在IFB输出方向配置多种qdisc即可对输入流量做队列调度；IFB Device 0用于输入流控、1用于输出流控; Netdevice编程：socket句柄+ioctl操作底层网络设备；核心结构struct ifreq；常用SIOCGIFFLAGS/SIOCSIFFLAGS；Android封装ifc_utils（libnetutils）：ifc_init、ifc_up、ifc_set_flags; Linux策略路由：依据策略对IP包进行路由选择；Kernel最多255张路由表，4张内置（255 local、254 main、253 default、0保留）；用iproute2（ip命令）配置; 命令选项六类：NIC设备信息管理（list、readrxcounter/readtxcounter读/proc/net/dev）；输入输出流量控制（setthrottle，实现在ThrottleController，核心用tc：htb qdisc+class+ifb0+ingress重定向filter）；Route控制（默认路由用ifc_add_route，secondary多路由表用SecondaryTableController，如ip route add ... table 78）；Driver控制（加载libnetcmdiface.so向驱动发命令）；IFC设备控制；IPv6控制（ipv6privacyextensions写/proc/sys/net/ipv6/.../use_tempaddr；ipv6写disable_ipv6）"}, {"id": "c121", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "作用", "back": "<div class=\"def-ans\">管理和控制系统中的网络设备；与InterfaceController、ThrottleController、SecondaryTableController交互</div>", "backText": "管理和控制系统中的网络设备；与InterfaceController、ThrottleController、SecondaryTableController交互"}, {"id": "c122", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "IFB设备", "back": "<div class=\"def-ans\">IMQ的替代者，Linux流量控制虚拟设备；输入数据包经ingress qdisc重定向到IFB，在IFB输出方向配置多种qdisc即可对输入流量做队列调度；IFB Device 0用于输入流控、1用于输出流控</div>", "backText": "IMQ的替代者，Linux流量控制虚拟设备；输入数据包经ingress qdisc重定向到IFB，在IFB输出方向配置多种qdisc即可对输入流量做队列调度；IFB Device 0用于输入流控、1用于输出流控"}, {"id": "c123", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "Netdevice编程", "back": "<div class=\"def-ans\">socket句柄+ioctl操作底层网络设备；核心结构struct ress_dest_rule（基于源/目标IP）、set_uid_rule（按uid设置单进程防火墙）</li><li>启动防火墙（FirewallController::enableFirewall）：先清空fw_*链规则，再设置INPUT→DROP、OUTPUT→REJECT、FORWARD→REJECT；Android采用\"先禁止全部、再单独放行\"的严厉策略</li><li>设置进程防火墙（setUidRule）：允许用\"-I\"插入RETURN规则，禁止用\"-D\"删除；局限：多个应用共享同一uid时无法单独禁止</li></ul>", "backText": "IpFwd：控制内核ipforward功能（status/enable/disable），借助TetherController读写/proc/sys/net/ipv4/ip_forward; FirewallCmd：enable/is_enabled、set_interface_rule（针对NIC）、set_egress_source_rule/set_egress_dest_rule（基于源/目标IP）、set_uid_rule（按uid设置单进程防火墙）; 启动防火墙（FirewallController::enableFirewall）：先清空fw_*链规则，再设置INPUT→DROP、OUTPUT→REJECT、FORWARD→REJECT；Android采用\"先禁止全部、再单独放行\"的严厉策略; 设置进程防火墙（setUidRule）：允许用\"-I\"插入RETURN规则，禁止用\"-D\"删除；局限：多个应用共享同一uid时无法单独禁止"}, {"id": "c127", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "IpFwd", "back": "<div class=\"def-ans\">控制内核ipforward功能（status/enable/disable），借助TetherController读写/proc/sys/net/ipv4/ip_forward</div>", "backText": "控制内核ipforward功能（status/enable/disable），借助TetherController读写/proc/sys/net/ipv4/ip_forward"}, {"id": "c128", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "FirewallCmd", "back": "<div class=\"def-ans\">enable/is_enabled、set_interface_rule（针对NIC）、set_egress_source_rule/set_egress_dest_rule（基于源/目标IP）、set_uid_rule（按uid设置单进程防火墙）</div>", "backText": "enable/is_enabled、set_interface_rule（针对NIC）、set_egress_source_rule/set_egress_dest_rule（基于源/目标IP）、set_uid_rule（按uid设置单进程防火墙）"}, {"id": "c129", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "启动防火墙（FirewallController", "back": "<div class=\"def-ans\">:enableFirewall）：先清空fw_*链规则，再设置INPUT→DROP、OUTPUT→REJECT、FORWARD→REJECT；Android采用\"先禁止全部、再单独放行\"的严厉策略</div>", "backText": ":enableFirewall）：先清空fw_*链规则，再设置INPUT→DROP、OUTPUT→REJECT、FORWARD→REJECT；Android采用\"先禁止全部、再单独放行\"的严厉策略"}, {"id": "c130", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "设置进程防火墙（setUidRule）", "back": "<div class=\"def-ans\">允许用\"-I\"插入RETURN规则，禁止用\"-D\"删除；局限：多个应用共享同一uid时无法单独禁止</div>", "backText": "允许用\"-I\"插入RETURN规则，禁止用\"-D\"删除；局限：多个应用共享同一uid时无法单独禁止"}, {"id": "c131", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.5 ListTtysCmd和PppdCmd命令", "back": "<ul class=\"ans-list\"><li>TTY终端三类：串行端口终端/dev/ttySn；伪终端（master为/dev/ptmx，slave为/dev/pts/下文件，adb shell登录使用）；控制台终端/dev/ttyN和/dev/console</li><li>伪终端编程：open(\"/dev/ptmx\")得fd→grantpt获取权限、unlockpt解锁→ptsname获得从端设备名→从端打开</li><li>Netd中logwrap使用伪终端在父子进程间传递log：子进程dup2重定向stdout/stderr后执行，父进程读ptmx内容用ALOG输出；原因：①开源子进程不用ALOG宏；②伪终端不缓存数据</li><li>PPP协议：链路层点对点协议；组成LCP（链路控制）、NCP（网络控制协议簇）、认证协议（PAP、CHAP）；pppd为运行PPP的后台进程，与Kernel PPP驱动联动</li><li>ListTtysCmd：枚举/sys/class/tty列出所有tty设备</li><li>PppdCmd：attach（启动pppd）/detach（杀死pppd）；启动参数含波特率、iplocal:ipremote、ms-dns等；配置后手机相当于一个Modem</li></ul>", "backText": "TTY终端三类：串行端口终端/dev/ttySn；伪终端（master为/dev/ptmx，slave为/dev/pts/下文件，adb shell登录使用）；控制台终端/dev/ttyN和/dev/console; 伪终端编程：open(\"/dev/ptmx\")得fd→grantpt获取权限、unlockpt解锁→ptsname获得从端设备名→从端打开; Netd中logwrap使用伪终端在父子进程间传递log：子进程dup2重定向stdout/stderr后执行，父进程读ptmx内容用ALOG输出；原因：①开源子进程不用ALOG宏；②伪终端不缓存数据; PPP协议：链路层点对点协议；组成LCP（链路控制）、NCP（网络控制协议簇）、认证协议（PAP、CHAP）；pppd为运行PPP的后台进程，与Kernel PPP驱动联动; ListTtysCmd：枚举/sys/class/tty列出所有tty设备; PppdCmd：attach（启动pppd）/detach（杀死pppd）；启动参数含波特率、iplocal:ipremote、ms-dns等；配置后手机相当于一个Modem"}, {"id": "c132", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "TTY终端三类", "back": "<div class=\"def-ans\">串行端口终端/dev/ttySn；伪终端（master为/dev/ptmx，slave为/dev/pts/下文件，adb shell登录使用）；控制台终端/dev/ttyN和/dev/console</div>", "backText": "串行端口终端/dev/ttySn；伪终端（master为/dev/ptmx，slave为/dev/pts/下 "<ul class=\"ans-list\"><li>BandwidthControlCmd：Android带宽控制，可针对设备/应用设配额与预警值（超限收到对应NETLINK_NFLOG的qlog UEvent）；依赖iptables扩展模块libxt_quota2<ul class=\"sub\"><li>选项：enable/disable；removequota/getquota/setquota等配额增删查；addnaughtyapps/removenaughtyapps（按uid单进程控制）；setglobalalert等预警值增删；gettetherstats</li></ul></li><li>IdletimerControlCmd：利用iptables扩展模块libxt_idletimer；格式 iptables -t raw -A idletimer -i nic -j IDLETIMER --timeout 秒 --label label --send_nl_msg 1；超时后经/sys/net/xt_idletimer触发UEvent</li></ul>", "backText": "BandwidthControlCmd：Android带宽控制，可针对设备/应用设配额与预警值（超限收到对应NETLINK_NFLOG的qlog UEvent）；依赖iptables扩展模块libxt_quota2; IdletimerControlCmd：利用iptables扩展模块libxt_idletimer；格式 iptables -t raw -A idletimer -i nic -j IDLETIMER --timeout 秒 --label label --send_nl_msg 1；超时后经/sys/net/xt_idletimer触发UEvent"}, {"id": "c139", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "选项", "back": "<div class=\"def-ans\">enable/disable；removequota/getquota/setquota等配额增删查；addnaughtyapps/removenaughtyapps（按uid单进程控制）；setglobalalert等预警值增删；gettetherstats</div>", "backText": "enable/disable；removequota/getquota/setquota等配额增删查；addnaughtyapps/removenaughtyapps（按uid单进程控制）；setglobalalert等预警值增删；gettetherstats"}, {"id": "c140", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "IdletimerControlCmd", "back": "<div class=\"def-ans\">利用iptables扩展模块libxt_idletimer；格式 iptables -t raw -A idletimer -i nic -j IDLETIMER --timeout 秒 --label label --send_nl_msg 1；超时后经/sys/net/xt_idletimer触发UEvent</div>", "backText": "利用iptables扩展模块libxt_idletimer；格式 iptables -t raw -A idletimer -i nic -j IDLETIMER --timeout 秒 --label label --send_nl_msg 1；超时后经/sys/net/xt_idletimer触发UEvent"}, {"id": "c141", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.7 NatCmd命令", "back": "<ul class=\"ans-list\"><li>NAT背景：对数据包的源/目的IP、端口进行改写；分类SNAT（改源地址）、DNAT（改目的地址）</li><li>Linux NAT由iptables的nat表完成，三条默认Chain：PREROUTING（DNAT）、POSTROUTING（SNAT）、OUTPUT（本地包DNAT）</li><li>NatCmd仅支持enable/disable；Android的NAT并非只用nat表，还借助ip route命令和filter表</li><li>enableNat触发的iptables调用：natctrl_FORWARD链按连接状态设规则（ESTABLISHED,RELATED→RETURN、INVALID→DROP）；nat表natctrl_nat_POSTROUTING对出口设备做MASQUERADE（自动读取当前IP做SNAT）</li></ul>", "backText": "NAT背景：对数据包的源/目的IP、端口进行改写；分类SNAT（改源地址）、DNAT（改目的地址）; Linux NAT由iptables的nat表完成，三条默认Chain：PREROUTING（DNAT）、POSTROUTING（SNAT）、OUTPUT（本地包DNAT）; NatCmd仅支持enable/disable；Android的NAT并非只用nat表，还借助ip route命令和filter表; enableNat触发的iptables调用：natctrl_FORWARD链按连接状态设规则（ESTABLISHED,RELATED→RETURN、INVALID→DROP）；nat表natctrl_nat_POSTROUTING对出口设备做MASQUERADE（自动读取当前IP做SNAT）"}, {"id": "c142", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "NAT背景", "back": "<div class=\"def-ans\">对数据包的源/目的IP、端口进行改写；分类SNAT（改源地址）、DNAT（改目的地址）</div>", "backText": "对数据包的源/目的IP、端口进行改写；分类SNAT（改源地址）、DNAT（改目的地址）"}, {"id": "c143", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "enableNat触发的iptables调用", "back": "<div class=\"def-ans\">natctrl_FORWARD链按连接状态设规则（ESTABLISHED,RELATED→RETURN、INVALID→DROP）；nat表natctrl_nat_POSTROUTING对出口设备做MASQUERADE（自动读取当前IP做SNAT）</div>", "backText": "natctrl_FORWARD链按连接状态设规则（ESTABLISHED,RELATED→RETURN、INVALID→DROP）；nat表natctrl_nat_POSTROUTING对出口设备做MASQUERADE（自动读取当前IP做SNAT）"}, {"id": "c144", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.8 TetherCmd和SoftapCmd命令", "back": "<ul class=\"ans-list\"><li>绑定（Tether）：把手机当Modem用；Android 4.2支持三种方式：Soft AP（Wi-Fi）、Bluetooth、USB；TetherCmd还支持逆绑定（reverse tethering）</li><li>TetherCmd（USB绑定）<ul class=\"sub\"><li>背景：RNDIS（微软USB网络设备驱动规范）；DHCP（BOOTP增强版，手机为服务器端）；DNSmasq（Android中充当DHCP服务器的开源软件）</li><li>步骤①：添加需Tether的接口（USB绑定接口名为rndis0）→TetherController::tetherInterface保存到mInterfaces链表</li><li>步骤②：\"start\"启动：TetherController::startTethering配置并启动dnsmasq（--dhcp-range地址池、--dhcp-option-force=43,ANDROID_METERED、租约1小时等）</li></ul></li><li>SoftapCmd<ul class=\"sub\"><li>背景：AP（基站设备）与Station（带无线接口的设备）；Soft AP：用软件在Station中实现AP功能；hostapd：用户空间AP和认证服务器守护进程（802.11接入管理、802.1X/WPA/WPA2/EAP认证、RADIUS）</li><li>步骤①：为Wi-Fi加载不同固件（fwReloadSoftap按角色取固件路径，经wifi_change_fw_path写/sys/module/wlan/parameters/fwpath触发驱动加载）</li><li>步骤②：配置Soft AP（setSoftap将配置写入/data/misc/wifi/hostapd.conf：interface、driver=nl80211、ssid默认AndroidAP、channel=6、加密方式）</li><li>步骤③：启动AP（startap启动hostapd进程，-e entropy.bin + hostapd.conf）</li></ul></li></ul>", "backText": "绑定（Tether）：把手机当Modem用；Android 4.2支持三种方式：Soft AP（Wi-Fi）、Bluetooth、USB；TetherCmd还支持逆绑定（reverse tethering）; TetherCmd（USB绑定）; SoftapCmd"}, {"id": "c145", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "绑定（Tether）", "back": "<div class=\"def-ans\">把手机当Modem用；Android 4.2支持三种方式：Soft AP（Wi-Fi）、Bluetooth、USB；TetherCmd还支持逆绑定（reverse tethering）</div>", "backText": "把手机当Modem用；Android 4.2支持三种方式：Soft AP（Wi-Fi）、Bluetooth、USB；TetherCmd还支持逆绑定（reverse tethering）"}, {"id": "c146", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "TetherCmd（USB绑定）", "back": "<ul class=\"ans-list\"><li>背景：RNDIS（微软USB网络设备驱动规范）；DHCP（BOOTP增强版，手机为服务器端）；DNSmasq（Android中充当DHCP服务器的开源软件）</li><li>步骤①：添加需Tether的接口（USB绑定接口名为rndis0）→TetherController::tetherInterface保存到mInterfaces链表</li><li>步骤②：\"start\"启动：TetherController::startTethering配置并启动dnsmasq（--dhcp-range地址池、--dhcp-option-force=43,ANDROID_METERED、租约1小时等）</li></ul>", "backText": "背景：RNDIS（微软USB网络设备驱动规范）；DHCP（BOOTP增强版，手机为服务器端）；DNSmasq（Android中充当DHCP服务器的开源软件）; 步骤①：添加需Tether的接口（USB绑定接口名为rndis0）→TetherController::tetherInterface保存到mInterfaces链表; 步骤②：\"start\"启动：TetherContr 和认证服务器守护进程（802.11接入管理、802.1X/WPA/WPA2/EAP认证、RADIUS）; 步骤①：为Wi-Fi加载不同固件（fwReloadSoftap按角色取固件路径，经wifi_change_fw_path写/sys/module/wlan/parameters/fwpath触发驱动加载）; 步骤②：配置Soft AP（setSoftap将配置写入/data/misc/wifi/hostapd.conf：interface、driver=nl80211、ssid默认AndroidAP、channel=6、加密方式）; 步骤③：启动AP（startap启动hostapd进程，-e entropy.bin + hostapd.conf）"}, {"id": "c154", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "步骤③", "back": "<div class=\"def-ans\">启动AP（startap启动hostapd进程，-e entropy.bin + hostapd.conf）</div>", "backText": "启动AP（startap启动hostapd进程，-e entropy.bin + hostapd.conf）"}, {"id": "c155", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "2.3.9 ResolverCmd命令", "back": "<ul class=\"ans-list\"><li>与Android系统DNS实现相关，用于给不同NIC设备配置不同的DNS</li><li>四个选项：setdefaultif（设置默认NIC）、setifdns（设置不同NIC的DNS）、flushdefaultif、flushif</li></ul>", "backText": "与Android系统DNS实现相关，用于给不同NIC设备配置不同的DNS; 四个选项：setdefaultif（设置默认NIC）、setifdns（设置不同NIC的DNS）、flushdefaultif、flushif"}, {"id": "c156", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.3 CommandListener中的命令", "front": "四个选项", "back": "<div class=\"def-ans\">setdefaultif（设置默认NIC）、setifdns（设置不同NIC的DNS）、flushdefaultif、flushif</div>", "backText": "setdefaultif（设置默认NIC）、setifdns（设置不同NIC的DNS）、flushdefaultif、flushif"}, {"id": "c157", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.4 NetworkManagementService介绍", "front": "2.4.1 create函数", "back": "<ul class=\"ans-list\"><li>流程：new NetworkManagementService→mThread.start()→connectedSignal.await()等待初始化完成后返回（CountDownLatch同步）</li><li>构造要点：创建NativeDaemonConnector（连接\"netd\"socket收发数据）；以mConnector为Runnable建线程；Watchdog.getInstance().addMonitor(this)加入监控</li><li>NetdCallbackReceiver：onDaemonConnected（首次经mConnectedSignal.countDown()使create返回，之后prepareNativeDaemon()）；onEvent处理来自Netd的消息（InterfaceChange、BandwidthControl、InterfaceClassActivity三种）</li></ul>", "backText": "流程：new NetworkManagementService→mThread.start()→connectedSignal.await()等待初始化完成后返回（CountDownLatch同步）; 构造要点：创建NativeDaemonConnector（连接\"netd\"socket收发数据）；以mConnector为Runnable建线程；Watchdog.getInstance().addMonitor(this)加入监控; NetdCallbackReceiver：onDaemonConnected（首次经mConnectedSignal.countDown()使create返回，之后prepareNativeDaemon()）；onEvent处理来自Netd的消息（InterfaceChange、BandwidthControl、InterfaceClassActivity三种）"}, {"id": "c158", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.4 NetworkManagementService介绍", "front": "流程", "back": "<div class=\"def-ans\">new NetworkManagementService→mThread.start()→connectedSignal.await()等待初始化完成后返回（CountDownLatch同步）</div>", "backText": "new NetworkManagementService→mThread.start()→connectedSignal.await()等待初始化完成后返回（CountDownLatch同步）"}, {"id": "c159", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.4 NetworkManagementService介绍", "front": "构造要点", "back": "<div class=\"def-ans\">创建NativeDaemonConnector（连接\"netd\"socket收发数据）；以mConnector为Runnable建线程；Watchdog.getInstance().addMonitor(this)加入监控</div>", "backText": "创建NativeDaemonConnector（连接\"netd\"socket收发数据）；以mConnector为Runnable建线程；Watchdog.getInstance().addMonitor(this)加入监控"}, {"id": "c160", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.4 NetworkManagementService介绍", "front": "NetdCallbackReceiver", "back": "<div class=\"def-ans\">onDaemonConnected（首次经mConnectedSignal.countDown()使create返回，之后prepareNativeDaemon()）；onEvent处理来自Netd的消息（InterfaceChange、BandwidthControl、InterfaceClassActivity三种）</div>", "backText": "onDaemonConnected（首次经mConnectedSignal.countDown()使create返回，之后prepareNativeDaemon()）；onEvent处理来自Netd的消息（InterfaceChange、BandwidthControl、InterfaceClassActivity三种）"}, {"id": "c161", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.4 NetworkManagementService介绍", "front": "2.4.2 systemReady函数", "back": "<ul class=\"ans-list\"><li>systemReady()直接调用prepareNativeDaemon()</li><li>流程：检查/proc/net/xt_qtaguid/ctrl判断Kernel是否支持带宽控制→支持则mConnector.execute(\"bandwidth\",\"enable\")→设置系统属性net.qtaguid_enabled→遍历mActiveQuotas恢复配额设置→setFirewallEnabled恢复防火墙规则</li><li>交互方式示例：mConnector.execute(\"firewall\", \"enable\"/\"disable\")发送命令给Netd（先enforceSystemUid检查权限）</li></ul>", "backText": "systemReady()直接调用prepareNativeDaemon(); 流程：检查/proc/net/xt_qtaguid/ctrl判断Kernel是否支持带宽控制→支持则mConnector.execute(\"bandwidth\",\"enable\")→设置系统属性net.qtaguid_enabled→遍历mActiveQuotas恢复配额设置→setFirewallEnabled恢复防火墙规则; 交互方式示例：mConnector.execute(\"firewall\", \"enable\"/\"disable\")发送命令给Netd（先enforceSystemUid检查权限）"}, {"id": "c163", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.4 NetworkManagementService介绍", "front": "交互方式示例", "back": "<div class=\"def-ans\">mConnector.execute(\"firewall\", \"enable\"/\"disable\")发送命令给Netd（先enforceSystemUid检查权限）</div>", "backText": "mConnector.execute(\"firewall\", \"enable\"/\"disable\")发送命令给Netd（先enforceSystemUid检查权限）"}, {"id": "c164", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.5 本章总结和参考资料说明", "front": "核心观点", "back": "<div class=\"def-ans\">Netd代码简单但背景知识复杂（DNS、Apple Bonjour、iptables实现NAT/防火墙/带宽控制/流量控制/路由控制、USB绑定、Wi-Fi Soft AP等）</div>", "backText": "Netd代码简单但背景知识复杂（DNS、Apple Bonjour、iptables实现NAT/防火墙/带宽控制/流量控制/路由控制、USB绑定、Wi-Fi Soft AP等）"}, {"id": "c165", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.5 本章总结和参考资料说明", "front": "Netd两大工作主线", "back": "<div class=\"def-ans\">NM接收Kernel UEvent消息转发Framework；CL/DPL/MDnsSdListener接收并处理客户端请求</div>", "backText": "NM接收Kernel UEvent消息转发Framework；CL/DPL/MDnsSdListener接收并处理客户端请求"}, {"id": "c166", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第2章 深入理解Netd", "section": "2.5 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">Linux PF_NETLINK（man PF_NETLINK）；DNS/Bonjour（Apple开发文档）；iptables教程与指南；tc（Traffic Control HOWTO）；NetDevice编程（man netdevice）；Linux策略路由；TTY/ptmx（man ptmx）；PPP（Linux PPP HOWTO）；RNDIS/DHCP/DNSmasq；Softap和hostapd（man hostapd、《802.11无线网络权威指南》）</div>", "backText": "Linux PF_NETLINK（man PF_NETLINK）；DNS/Bonjour（Apple开发文档）；iptables教程与指南；tc（Traffic Control HOWTO）；NetDevice编程（man netdevice）；Linux策略路由；TTY/ptmx（man ptmx）；PPP（Linux PPP HOWTO）；RNDIS/DHCP/DNSmasq；Softap和hostapd（man hostapd、《802.11无线网络权威指南》）"}, {"id": "c167", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.1 概述", "front": "本章两大内容", "back": "<div class=\"def-ans\">IEEE 802.11协议理论知识（无线频谱、802.11/802.X协议、关键概念如AP、MAC帧、无线网络安全）；Linux下通过Wireless Extension和nl80211 API操作无线设备</div>", "backText": "IEEE 802.11协议理论知识（无线频谱、802.11/802.X协议、关键概念如AP、MAC帧、无线网络安全）；Linux下通过Wireless Extension和nl80211 API操作无线设备"}, {"id": "c168", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.1 概述", "front": "涉及源码文件", "back": "<div class=\"def-ans\">wireless.h、driver_wext.c、netlink.h、driver_nl80211.c、nl80211_copy.h</div>", "backText": "wireless.h、driver_wext.c、netlink.h、driver_nl80211.c、nl80211_copy.h"}, {"id": "c169", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.2 无线电频谱和802.11协议的发展历程", "front": "3.2.1 无线电频谱知识", "back": "<ul class=\"ans-list\"><li>无线频谱（单位Hz）是重要资源，各国均有国家级管制</li><li>主要管制机构：FCC（美国）、ERO（欧洲）、MIIT（中国工信部无线电管理局）、ITU（国际电信联盟）</li><li>频谱按频率高低划分使用；部分频段须授权使用，部分无须授权</li><li>无须授权的频谱大部分集中在ISM（Industrial Scientific Medical，国际共用）频段</li><li>美国ISM频段：902-908MHz、2400-2483.5MHz、5725-5850MHz；各国普遍将2.4GHz划入ISM，因此Wi-Fi、蓝牙均可工作于此频段</li><li>无须授权仍受功率限制，大功率会干扰其他设备</li></ul>", "backText": "无线频谱（单位Hz）是重要资源，各国均有国家级管制; 主要管制机构：FCC（美国）、ERO（欧洲）、MIIT（中国工信部无线电管理局）、ITU（国际电信联盟）; 频谱按频率高低划分使用；部分频段须授权使用，部分无须授权; 无须授权的频谱大部分集中在ISM（Industrial Scientific Medical，国际共用）频段; 美国ISM频段：902-908MHz、2400-2483.5MHz、5725-5850MHz；各国普遍将2.4GHz划入ISM，因此Wi-Fi、蓝牙均可工作于此频段; 无须授权仍受功率限制，大功率会干扰其他设备"}, {"id": "c170", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.2 无线电频谱和802.11协议的发展历程", "front": "主要管制机构", "back": "<div class=\"def-ans\">FCC（美国）、ERO（欧洲）、MIIT（中国工信部无线电管理局）、ITU（国际电信联盟）</div>", "backText": "FCC（美国）、ERO（欧洲）、MIIT（中国工信部无线电管理局）、ITU（国际电信联盟）"}, {"id": "c171", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.2 无线电频谱和802.11协议的发展历程", "front": "美国ISM频段", "back": "<div class=\"def-ans\">902-908MHz、2400-2483.5MHz、5725-5850MHz；各国普遍将2.4GHz划入ISM，因此Wi-Fi、蓝牙均可工作于此频段</div>", "backText": "902-908MHz、2400-2483.5MHz、5725-5850MHz；各国普遍将2.4GHz划入ISM，因此Wi-Fi、蓝牙均可工作于此频段"}, {"id": "c172", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.2 无线电频谱和802.11协议的发展历程", "front": "3.2.2 IEEE 802.11发展历程", "back": "<ul class=\"ans-list\"><li>IEEE：美国电气和电子工程师协会；802为其中负责局域网标准的委员会（LMSC），成立于1980年2月</li><li>802.11代表第11工作组，负责无线局域网MAC及PHY技术规范</li><li>工作组内细分任务组（TG），编号为字母（a、b、c……）</li><li>TG编号大小写含义不同：小写（如802.11b）表示基于802.11的修订、不能独立存在；大写（如802.1X）表示体系完备的独立标准</li><li>802.11-2012标准全文共2793页，涵盖a、b、d、e、g、h、i、j、k、n、p、r、s、u、v、w、y、z各版本技术规范</li></ul>", "backText": "IEEE：美国电气和电子工程师协会；802为其中负责局域网标准的委员会（LMSC），成立于1980年2月; 802.11代表第11工作组，负责无线局域网MAC及PHY技术规范; 工作组内细分任务组（TG），编号为字母（a、b、c……）; TG编号大小写含义不同：小写（如802.11b）表示基于802.11的修订、不能独立存在；大写（如802.1X）表示体系完备的独立标准; 802.11-2012标准全文共2793页，涵盖a、b、d、e、g、h、i、j、k、n、p、r、s、u、v、w、y、z各版本技术规范"}, {"id": "c173", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.2 无线电频谱和802.11协议的发展历程", "front": "IEEE", "back": "<div class=\"def-ans\">美国电气和电子工程师协会；802为其中负责局域网标准的委员会（LMSC），成立于1980年2月</div>", "backText": "美国电气和电子工程师协会；802为其中负责局域网标准的委员会（LMSC），成立于1980年2月"}, {"id": "c174", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.2 无线电频谱和802.11协议的发展历程", "front": "TG编号大小写含义不同", "back": "<div class=\"def-ans\">小写（如802.11b）表示基于802.11的修订、不能独立存在；大写（如802.1X）表示体系完备的独立标准</div>", "backText": "小写（如802.11b）表示基于802.11的修订、不能独立存在；大写（如802.1X）表示体系完备的独立标准"}, {"id": "c175", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.1 OSI基本参考模型及相关基本概念", "back": "<ul class=\"ans-list\"><li>OSI/RM：ISO/IEC 7498标准（1983年），将网络体系划分为七层</li><li>七层由上到下：应用层（HTTP/FTP）、表示层（语法转换、压缩加密）、会话层、传输层（TCP/UDP）、网络层（IP，路由器）、数据链路层（成帧、差错控制，二层交换机/网桥）、物理层（bit）</li><li>TCP/IP模型可视为OSI/RM的简化版本</li><li>数据链路层被ISO/IEC 8802划分为MAC子层（解决LAN共用信道竞争分配）和LLC子层（端到端帧交换、差错应答与流量控制）；802.11只涉及MAC层</li><li>有线网络用CSMA/CD（载波监听多路访问/冲突检测）；无线网络用CSMA/CA（冲突避免）——设备难以同时收发、且冲突中断浪费传输资源</li><li>CSMA/CA信道利用率低于CSMA/CD，存在隐藏终端问题（802.11b在1Mbps时利用率最高约90%，11Mbps时约65%）</li><li>CSMA/CA避免碰撞的两种方法：发送前监听并随机退避（backoff）；RTS-CTS握手</li><li>RTS/CTS原理：发送端先发RTS（含数据帧长度），目标端回CTS；周围站点据此静默——听到RTS但听不到CTS的站可正常发送；听不到RTS但听到CTS的站须关闭发送</li><li>RTS（20字节）、CTS（14字节）很短；802.11允许三种选择：总是使用、帧长超过阈值时使用、不使用</li><li>协调功能（CF）：DCF（分布式）、PCF（点协调）、HCF（混合型）、MCF（Mesh）；对应基于竞争与无竞争服务</li><li>Service/Entity/SAP：层功能用Service表示；Entity为封装一组功能的模块；上层经Service Access Point访问下层服务；原语（primitive）如M_UNITDATA.request/indication</li><li>SDU与PDU：上层传给MAC的数据为MSDU；MAC封装头后构成MPDU；N+1层PDU对N层而言即N-SDU</li><li>MIB（管理信息库）：虚拟数据库，树形结构，条目经OID访问；802.11定义的MIB属性文件为802.11mib.txt</li></ul>", "backText": "OSI/RM：ISO/IEC 7498标准（1983年），将网络体系划分为七层; 七层由上到下：应用层（HTTP/FTP）、表示层（语法转换、压缩加密）、会话层、传输层（TCP/UDP）、网络层（IP，路由器）、数据链路层（成帧、差错控制，二层交换机/网桥）、物理层（bit）; TCP/IP模型可视为OSI/RM的简化版本; 数据链路层被ISO/IEC 8802划分为MAC子层（解决LAN共用信道竞争分配）和LLC子层（端到端帧交换、差错应答与流量控制）；802.11只涉及MAC层; 有线网络用CSMA/CD（载波监听多路访问/冲突检测）；无线网络用CSMA/CA（冲突避免）——设备难以同时收发、且冲突中断浪费传输资源; CSMA/CA信道利用率低于CSMA/CD，存在隐藏终端问题（802.11b在1Mbps时利用率最高约90%，11Mbps时约65%）"}, {"id": "c176", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "OSI/RM", "back": "<div class=\"def-ans\">ISO/IEC 7498标准（1983年），将网络体系划分为七层</div>", "backText": "ISO/IEC 7498标准（1983年），将网络体系划分为七层"}, {"id": "c177", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "七层由上到下", "back": "<div class=\"def-ans\">应用层（HTTP/FTP）、表示层（语法转换、压缩加密）、会话层、传输层（TCP/UDP）、网络层（IP，路由器）、数据链路层（成帧、差错控制，二层交换机/网桥）、物理层（bit）</div>", "backText": "应用层（HTTP/FTP）、表示层（语法转换、压缩加密）、会话层、传输层（TCP/UDP）、网络层（IP，路由器）、数据链路层（成帧、差错控制，二层交换机/网桥）、物理层（bit）"}, {"id": "c178", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "CSMA/CA避免碰撞的两种方法", "back": "<div class=\"def-ans\">发送前监听并随机退避（backoff）；RTS-CTS握手</div>", "backText": "发送前监听并随机退避（backoff）；RTS-CTS握手"}, {"id": "c179", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "RTS/CTS原理", "back": "<div class=\"def-ans\">发送端先发RTS（含数据帧长度），目标端回CTS；周围站点据此静默——听到RTS但听不到CTS的站可正常发送；听不到RTS但听到CTS的站须关闭发送</div>", "backText": "发送端先发RTS（含数据帧长度），目标端回CTS；周围站点据此静默——听到RTS但听不到CTS的站可正常发送；听不到RTS但听到CTS的站须关闭发送"}, {"id": "c180", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "协调功能（CF）", "back": "<div class=\"def-ans\">DCF（分布式）、PCF（点协调）、HCF（混合型）、MCF（Mesh）；对应基于竞争与无竞争服务</div>", "backText": "DCF（分布式）、PCF（点协调）、HCF（混合型）、MCF（Mesh）；对应基于竞争与无竞争服务"}, {"id": "c181", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Service/Entity/SAP", "back": "<div class=\"def-ans\">层功能用Service表示；Entity为封装一组功能的模块；上层经Service Access Point访问下层服务；原语（primitive）如M_UNITDATA.request/indication</div>", "backText": "层功能用Service表示；Entity为封装一组功能的模块；上层经Service Access Point访问下层服务；原语（primitive）如M_UNITDATA.request/indication"}, {"id": "c182", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "SDU与PDU", "back": "<div class=\"def-ans\">上层传给MAC的数据为MSDU；MAC封装头后构成MPDU；N+1层PDU对N层而言即N-SDU</div>", "backText": "上层传给MAC的数据为MSDU；MAC封装头后构成MPDU；N+1层PDU对N层而言即N-SDU"}, {"id": "c183", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MIB（管理信息库）", "back": "<div class=\"def-ans\">虚拟数据库，树形结构，条目经OID访问；802.11定义的MIB属性文件为802.11mib.txt</div>", "backText": "虚拟数据库，树形结构，条目经OID访问；802.11定义的MIB属性文件为802.11mib.txt"}, {"id": "c184", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.2 802.11知识点导读", "back": "<ul class=\"ans-list\"><li>802.11规范全称《Part 11：Wireless LAN MAC and Physical Layer (PHY) Specifications》</li><li>2012年版共2793页、20小节（clause）、23个附录（A～W）</li><li>规范类似手册，重视细节精准但前后逻辑连贯性差，难以形成由浅入深的知识框架</li><li>本章按组件与网络结构→服务→MAC服务与帧→MAC管理实体→安全性顺序介绍核心内容</li><li>物理层涉及大量无线电与信号处理知识，对软件工程师意义不大，本书不做介绍</li></ul>", "backText": "802.11规范全称《Part 11：Wireless LAN MAC and Physical Layer (PHY) Specifications》; 2012年版共2793页、20小节（clause）、23个附录（A～W）; 规范类似手册，重视细节精准但前后逻辑连贯性差，难以形成由浅入深的知识框架; 本章按组件与网络结构→服务→MAC服务与帧→MAC管理实体→安全性顺序介绍核心内容; 物理层涉及大量无线电与信号处理知识，对软件工程师意义不大，本书不做介绍"}, {"id": "c185", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "802.11规范全称《Part 11", "back": "<div class=\"def-ans\">Wireless LAN MAC and Physical Layer (PHY) Specifications》</div>", "backText": "Wireless LAN MAC and Physical Layer (PHY) Specifications》"}, {"id": "c186", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.3 802.11组件", "back": "<ul class=\"ans-list\"><li>四大物理组件<ul class=\"sub\"><li>WM（Wireless Medium，无线媒介）：传送无线MAC帧数据的物理层</li><li>STA（Station，工作站）：携带无线网卡的设备；无线网卡与有线网卡MAC地址分配自同一地址池</li><li>AP（Access Point，接入点）：本身也是一个STA，为已关联（associated）STA提供分布式服务（DS）</li><li>DS（Distribution System，分布式系统）：互连一组BSS和LAN以构成ESS的系统；绝大多数情况下即有线网络</li></ul></li><li>STA分类：按功能有普通STA、AP、提供QoS的STA；按移动性分Portable STA与Mobile STA</li><li>BSS（基本服务集）是无线网络的基本构建组件<ul class=\"sub\"><li>Independent BSS（IBSS）：不需要AP，STA直接互交，即ad-hoc对等网络</li><li>Infrastructure BSS：所有交互必须经过AP；STA须完成关联、授权等步骤才能加入；一个STA一次只能属于一个BSS</li></ul></li><li>ESS（扩展服务集）：一个或多个互连BSS对外表现为单一BSS；STA跨BSS移动时无需切换即可继续上网；ESS内部各BSS拥有相同SSID</li><li>BSSID：每个BSS的唯一编号；基础结构型网络中即AP的MAC地址；IBSS中为随机生成的MAC地址</li><li>SSID：网络名，为可读字符串；ESS的SSID即其网络名</li><li>Portal：将WLAN与LAN结合的逻辑模块，在二者间转换MAC帧，目前功能由AP实现</li><li>QoS BSS：在WLAN中支持QoS需求的扩展，实现复杂、效果不如LAN</li></ul>", "backText": "四大物理组件; STA分类：按功能有普通STA、AP、提供QoS的STA；按移动性分Portable STA与Mobile STA; BSS（基本服务集）是无线网络的基本构建组件; ESS（扩展服务集）：一个或多个互连BSS对外表现为单一BSS；STA跨BSS移动时无需切换即可继续上网；ESS内部各BSS拥有相同SSID; BSSID：每个BSS的唯一编号；基础结构型网络中即AP的MAC地址；IBSS中为随机生成的MAC地址; SSID：网络名，为可读字符串；ESS的SSID即其网络名"}, {"id": "c187", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "四大物理组件", "back": "<ul class=\"ans-list\"><li>WM（Wireless Medium，无线媒介）：传送无线MAC帧数据的物理层</li><li>STA（Station，工作站）：携带无线网卡的设备；无线网卡与有线网卡MAC地址分配自同一地址池</li><li>AP（Access Point，接入点）：本身也是一个STA，为已关联（associated）STA提供分布式服务（DS）</li><li>DS（Distribution System，分布式系统）：互连一组BSS和LAN以构成ESS的系统；绝大多数情况下即有线网络</li></ul>", "backText": "WM（Wireless Medium，无线媒介）：传送无线MAC帧数据的物理层; STA（Station，工作站）：携带无线网卡的设备；无线网卡与有线网卡MAC地址分配自同一地址池; AP（Access Point，接入点）：本身也是一个STA，为已关联（associated）STA提供分布式服务（DS）; DS（Distribution System，分布式系统）：互连一组BSS和LAN以构成ESS的系统；绝大多数情况下即有线网络"}, {"id": "c188", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "STA分类", "back": "<div class=\"def-ans\">按功能有普通STA、AP、提供QoS的STA；按移动性分Portable STA与Mobile STA</div>", "backText": "按功能有普通STA、AP、提供QoS的STA；按移动性分Portable STA与Mobile STA"}, {"id": "c189", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "BSS（基本服务集）是无线网络的基本构建组件", "back": "<ul class=\"ans-lis
