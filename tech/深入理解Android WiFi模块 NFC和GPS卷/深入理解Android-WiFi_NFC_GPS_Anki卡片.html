eckState); 触发源头：Wi-Fi连接成功后ConnectivityService的handleConnect被触发，其内部发送CONNECTIVITY_ACTION广播"}, {"id": "c539", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "触发源头", "back": "<div class=\"def-ans\">Wi-Fi连接成功后ConnectivityService的handleConnect被触发，其内部发送CONNECTIVITY_ACTION广播</div>", "backText": "Wi-Fi连接成功后ConnectivityService的handleConnect被触发，其内部发送CONNECTIVITY_ACTION广播"}, {"id": "c540", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "CMD_DELAYED_CAPTIVE_CHECK处理流程（DelayedCaptiveCheckState）", "back": "<ul class=\"ans-list\"><li>enter：sendMessageDelayed延迟10秒（DELAYED_CHECK_INTERVAL_MS）发送CMD_DELAYED_CAPTIVE_CHECK（携带递增的mDelayedCheckToken）</li><li>processMessage：token匹配时lookupHost(mServer)解析服务器IP；server有效则调用isCaptivePortal(server)判断AP是否需要Captive Portal Check，需要时setNotificationVisible(true)在状态栏添加提醒信息；最后transitionTo(mActiveNetworkState)</li><li>isCaptivePortal原理：向\"http://clients3.google.com/generate_204\"发送HTTP GET请求——若网络提供商未设置Portal Check则返回204；若设置了则一定会重定向到特定网页，返回值不是204</li><li>实例：作者用AirPcap截获小区宽带数据，手机发HTTP GET后服务器回复HTTP 302，状态栏因此出现需登录的提示项</li></ul>", "backText": "enter：sendMessageDelayed延迟10秒（DELAYED_CHECK_INTERVAL_MS）发送CMD_DELAYED_CAPTIVE_CHECK（携带递增的mDelayedCheckToken）; processMessage：token匹配时lookupHost(mServer)解析服务器IP；server有效则调用isCaptivePortal(server)判断AP是否需要Captive Portal Check，需要时setNotificationVisible(true)在状态栏添加提醒信息；最后transitionTo(mActiveNetworkState); isCaptivePortal原理：向\"http://clients3.google.com/generate_204\"发送HTTP GET请求——若网络提供商未设置Portal Check则返回204；若设置了则一定会重定向到特定网页，返回值不是204; 实例：作者用AirPcap截获小区宽带数据，手机发HTTP GET后服务器回复HTTP 302，状态栏因此出现需登录的提示项"}, {"id": "c541", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "enter", "back": "<div class=\"def-ans\">sendMessageDelayed延迟10秒（DELAYED_CHECK_INTERVAL_MS）发送CMD_DELAYED_CAPTIVE_CHECK（携带递增的mDelayedCheckToken）</div>", "backText": "sendMessageDelayed延迟10秒（DELAYED_CHECK_INTERVAL_MS）发送CMD_DELAYED_CAPTIVE_CHECK（携带递增的mDelayedCheckToken）"}, {"id": "c542", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "processMessage", "back": "<div class=\"def-ans\">token匹配时lookupHost(mServer)解析服务器IP；server有效则调用isCaptivePortal(server)判断AP是否需要Captive Portal Check，需要时setNotificationVisible(true)在状态栏添加提醒信息；最后transitionTo(mActiveNetworkState)</div>", "backText": "token匹配时lookupHost(mServer)解析服务器IP；server有效则调用isCaptivePortal(server)判断AP是否需要Captive Portal Check，需要时setNotificationVisible(true)在状态栏添加提醒信息；最后transitionTo(mActiveNetworkState)"}, {"id": "c543", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "isCaptivePortal原理", "back": "<div class=\"def-ans\">向\"http://clients3.google.com/generate_204\"发送HTTP GET请求——若网络提供商未设置Portal Check则返回204；若设置了则一定会重定向到特定网页，返回值不是204</div>", "backText": "向\"http://clients3.google.com/generate_204\"发送HTTP GET请求——若网络提供商未设置Portal Check则返回204；若设置了则一定会重定向到特定网页，返回值不是204"}, {"id": "c544", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "实例", "back": "<div class=\"def-ans\">作者用AirPcap截获小区宽带数据，手机发HTTP GET后服务器回复HTTP 302，状态栏因此出现需登录的提示项</div>", "backText": "作者用AirPcap截获小区宽带数据，手机发HTTP GET后服务器回复HTTP 302，状态栏因此出现需登录的提示项"}, {"id": "c545", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "版本差异与疑问解答", "back": "<ul class=\"ans-list\"><li>CaptivePortalTracker出现于4.2版本；4.1版本中Captive Portal Check由WifiWatchdogStateMachine完成（其内部定义了WalledGardenCheckState）</li><li>作者发现4.2版本处理疑似有问题：CaptivePortalTracker并未被真正触发执行检查</li><li>疑问解答：WifiStateMachine从CaptivePortalCheckState转ConnectedState的路径在ConnectivityService的handleCaptivePortalTrackerCheck函数中——最终调用WifiStateMachine的captivePortalCheckComplete，发送CMD_CAPTIVE_CHECK_COMPLETE</li></ul>", "backText": "CaptivePortalTracker出现于4.2版本；4.1版本中Captive Portal Check由WifiWatchdogStateMachine完成（其内部定义了WalledGardenCheckState）; 作者发现4.2版本处理疑似有问题：CaptivePortalTracker并未被真正触发执行检查; 疑问解答：WifiStateMachine从CaptivePortalCheckState转ConnectedState的路径在ConnectivityService的handleCaptivePortalTrackerCheck函数中——最终调用WifiStateMachine的captivePortalCheckComplete，发送CMD_CAPTIVE_CHECK_COMPLETE"}, {"id": "c546", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "作者发现4.2版本处理疑似有问题", "back": "<div class=\"def-ans\">CaptivePortalTracker并未被真正触发执行检查</div>", "backText": "CaptivePortalTracker并未被真正触发执行检查"}, {"id": "c547", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "疑问解答", "back": "<div class=\"def-ans\">WifiStateMachine从CaptivePortalCheckState转ConnectedState的路径在ConnectivityService的handleCaptivePortalTrackerCheck函数中——最终调用WifiStateMachine的captivePortalCheckComplete，发送CMD_CAPTIVE_CHECK_COMPLETE</div>", "backText": "WifiStateMachine从CaptivePortalCheckState转ConnectedState的路径在ConnectivityService的handleCaptivePortalTrackerCheck函数中——最终调用WifiStateMachine的captivePortalCheckComplete，发送CMD_CAPTIVE_CHECK_COMPLETE"}, {"id": "c548", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.6 本章总结和参考资料说明", "front": "作者观点", "back": "<div class=\"def-ans\">WifiService实现过于复杂、运行效率较低——WPAS作为核心已完成绝大部分工作，Java层却有63个状态</div>", "backText": "WifiService实现过于复杂、运行效率较低——WPAS作为核心已完成绝大部分工作，Java层却有63个状态"}, {"id": "c549", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.6 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">维基百科对Captive Portal的介绍</div>", "backText": "维基百科对Captive Portal的介绍"}, {"id": "c550", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.1 概述", "front": "WSC使用方式", "back": "<div class=\"def-ans\">输入PIN码、按下Push Button、或用支持NFC的手机到AP旁刷一下（NFC方式），即可自动完成安全设置配置</div>", "backText": "输入PIN码、按下Push Button、或用支持NFC的手机到AP旁刷一下（NFC方式），即可自动完成安全设置配置"}, {"id": "c551", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.1 概述", "front": "P2P（商品名Wi-Fi Direct）", "back": "<div class=\"def-ans\">支持多个Wi-Fi设备在没有AP的情况下相互连接；与IBSS不同（IBSS中各STA完全对等，P2P不然）</div>", "backText": "支持多个Wi-Fi设备在没有AP的情况下相互连接；与IBSS不同（IBSS中各STA完全对等，P2P不然）"}, {"id": "c552", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "目的", "back": "<div class=\"def-ans\">简化无线网络配置（Simple Configuration之名的由来）</div>", "backText": "简化无线网络配置（Simple Configuration之名的由来）"}, {"id": "c553", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "安全设置信息的传输手段", "back": "<div class=\"def-ans\">借助Wi-Fi传输称为In-Band交换；借助其他方式（如NFC）称为Out-of-Band交换</div>", "backText": "借助Wi-Fi传输称为In-Band交换；借助其他方式（如NFC）称为Out-of-Band交换"}, {"id": "c554", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "6.2.1 WSC应用场景", "back": "<ul class=\"ans-list\"><li>WSC定义两个应用场景（usage model）：Primary UM和Secondary UM</li><li>Primary UM：设置一个新的安全WLAN并为该WLAN添加无线设备，是最常见的场景</li><li>Secondary UM：从WLAN中移除设备、通过添加新AP/路由器扩充覆盖范围、密钥信息更换（Re-keying credentials）等</li><li>Primary UM的两种常见案例：PIN和PBC</li><li>PIN方法流程：STA从设置选项中获取PIN码→用户将PIN码输入AP的设置页面→AP和STA基于PIN码完成安全设置协商→STA扫描、关联、四次握手加入目标AP</li><li>PIN码为8位字符串（最后一位是前7位的校验和），系统每次生成的PIN码不固定</li><li>PBC（Push Button Configuration）方法：AP和设备上各有一个标记WPS的按钮，用户在双方各按一次按钮即触发安全设置协商；Android手机可通过软件按钮模拟</li></ul>", "backText": "WSC定义两个应用场景（usage model）：Primary UM和Secondary UM; Primary UM：设置一个新的安全WLAN并为该WLAN添加无线设备，是最常见的场景; Secondary UM：从WLAN中移除设备、通过添加新AP/路由器扩充覆盖范围、密钥信息更换（Re-keying credentials）等; Primary UM的两种常见案例：PIN和PBC; PIN方法流程：STA从设置选项中获取PIN码→用户将PIN码输入AP的设置页面→AP和STA基于PIN码完成安全设置协商→STA扫描、关联、四次握手加入目标AP; PIN码为8位字符串（最后一位是前7位的校验和），系统每次生成的PIN码不固定"}, {"id": "c555", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "WSC定义两个应用场景（usage model）", "back": "<div class=\"def-ans\">Primary UM和Secondary UM</div>", "backText": "Primary UM和Secondary UM"}, {"id": "c556", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "Primary UM", "back": "<div class=\"def-ans\">设置一个新的安全WLAN并为该WLAN添加无线设备，是最常见的场景</div>", "backText": "设置一个新的安全WLAN并为该WLAN添加无线设备，是最常见的场景"}, {"id": "c557", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "Secondary UM", "back": "<div class=\"def-ans\">从WLAN中移除设备、通过添加新AP/路由器扩充覆盖范围、密钥信息更换（Re-keying credentials）等</div>", "backText": "从WLAN中移除设备、通过添加新AP/路由器扩充覆盖范围、密钥信息更换（Re-keying credentials）等"}, {"id": "c558", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "PIN方法流程", "back": "<div class=\"def-ans\">STA从设置选项中获取PIN码→用户将PIN码输入AP的设置页面→AP和STA基于PIN码完成安全设置协商→STA扫描、关联、四次握手加入目标AP</div>", "backText": "STA从设置选项中获取PIN码→用户将PIN码输入AP的设置页面→AP和STA基于PIN码完成安全设置协商→STA扫描、关联、四次握手加入目标AP"}, {"id": "c559", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "6.2.2 WSC核心组件及接口", "back": "<ul class=\"ans-list\"><li>三大核心组件：Enrollee（类似supplicant，向Registrar发起注册请求）、Registrar（检查Enrollee合法性，还可配置AP）、AP（也需注册到Registrar，从Registrar角度看AP也是Enrollee）</li><li>组件交互：Enrollee从Registrar获取AP的安全配置信息，再利用该信息加入AP的无线网络</li><li>组件是逻辑概念：AP与Registrar可由同一实体实现（即Standalone AP，家用无线路由器即如此），也可分别实现（此时Registrar称External Registrar）；Android手机扮演Enrollee</li><li>规范定义组件间交互接口E、M、A</li><li>普适case（STA + Standalone AP，In-Band交互）下STA的Interface E：发送携带WSC IE的Probe Request寻找支持WSC的AP；能生成动态PIN码；关联后实现RP协议的Enrollee功能</li><li>Standalone AP的Interface E：回复携带WSC IE的Probe Response；实现RP协议的Registrar功能</li><li>Interface A：STA须实现802.1X supplicant并支持EAP-WSC算法；AP须发送携带WSC IE的Beacon帧、实现802.1X authenticator及EAP-WSC算法</li><li>规范中E/M/A还涉及UPnP（本书不讨论）；可选Out-of-Band手段有NFC和USB</li><li>WSC核心知识集中在WSC IE和RP（Registration Protocol）</li></ul>", "backText": "三大核心组件：Enrollee（类似supplicant，向Registrar发起注册请求）、Registrar（检查Enrollee合法性，还可配置AP）、AP（也需注册到Registrar，从Registrar角度看AP也是Enrollee）; 组件交互：Enrollee从Registrar获取AP的安全配置信息，再利用该信息加入AP的无线网络; 组件是逻辑概念：AP与Registrar可由同一实体实现（即Standalone AP，家用无线路由器即如此），也可分别实现（此时Registrar称External Registrar）；Android手机扮演Enrollee; 规范定义组件间交互接口E、M、A; 普适case（STA + Standalone AP，In-Band交互）下STA的Interface E：发送携带WSC IE的Probe Request寻找支持WSC的AP；能生成动态PIN码；关联后实现RP协议的Enrollee功能; Standalone AP的Interface E：回复携带WSC IE的Probe Response；实现RP协议的Registrar功能"}, {"id": "c560", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "三大核心组件", "back": "<div class=\"def-ans\">Enrollee（类似supplicant，向Registrar发起注册请求）、Registrar（检查Enrollee合法性，还可配置AP）、AP（也需注册到Registrar，从Registrar角度看AP也是Enrollee）</div>", "backText": "Enrollee（类似supplicant，向Registrar发起注册请求）、Registrar（检查Enrollee合法性，还可配置AP）、AP（也需注册到Registrar，从Registrar角度看AP也是Enrollee）"}, {"id": "c561", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "组件交互", "back": "<div class=\"def-ans\">Enrollee从Registrar获取AP的安全配置信息，再利用该信息加入AP的无线网络</div>", "backText": "Enrollee从Registrar获取AP的安全配置信息，再利用该信息加入AP的无线网络"}, {"id": "c562", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "组件是逻辑概念", "back": "<div class=\"def-ans\">AP与Registrar可由同一实体实现（即Standalone AP，家用无线路由器即如此），也可分别实现（此时Registrar称External Registrar）；Android手机扮演Enrollee</div>", "backText": "AP与Registrar可由同一实体实现（即Standalone AP，家用无线路由器即如此），也可分别实现（此时Registrar称External Registrar）；Android手机扮演Enrollee"}, {"id": "c563", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "Standalone AP的Interface E", "back": "<div class=\"def-ans\">回复携带WSC IE的Probe Response；实现RP协议的Registrar功能</div>", "backText": "回复携带WSC IE的Probe Response；实现RP协议的Registrar功能"}, {"id": "c564", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.2 WSC基础知识", "front": "Interface A", "back": "<div class=\"def-ans\">STA须实现802.1X supplicant并支持EAP-WSC算法；AP须发送携带WSC IE的Beacon帧、实现802.1X authenticator及EAP-WSC算法</div>", "backText": "STA须实现802.1X supplicant并支持EAP-WSC算法；AP须发送携带WSC IE的Beacon帧、实现802.1X authenticator及EAP-WSC算法"}, {"id": "c565", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "第一阶段Discovery Phase", "back": "<div class=\"def-ans\">STA借助Beacon/Probe帧搜索周围AP，开启WSC的帧必须携带WSC IE；结束后确定目标AP</div>", "backText": "STA借助Beacon/Probe帧搜索周围AP，开启WSC的帧必须携带WSC IE；结束后确定目标AP"}, {"id": "c566", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "与非WSC流程不同", "back": "<div class=\"def-ans\">STA和AP不先开展四次握手，而是先开展EAP-WSC流程</div>", "backText": "STA和AP不先开展四次握手，而是先开展EAP-WSC流程"}, {"id": "c567", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "WSC的核心工作", "back": "<div class=\"def-ans\">帮助STA和AP完成安全配置信息协商，用户只需输入PIN码或按按钮</div>", "backText": "帮助STA和AP完成安全配置信息协商，用户只需输入PIN码或按按钮"}, {"id": "c568", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "6.3.1 WSC IE和Attribute介绍", "back": "<ul class=\"ans-list\"><li>WSC IE属于Vendor定义的IE：Element ID=221（Vendor Specific）、OUI=0x00-50-F2-04（00-50-F2为Microsoft，04代表WPS）</li><li>WSC IE的Data域由一个或多个Attribute组成，格式为TLV：Type 2字节、Length 2字节（Value最大0xFFFF字节）</li><li>Attribute不仅用于WSC IE，还用于EAP-WSC包</li><li>Version属性：Type=0x104a；已废弃但为兼容必须在WSC IE中包含且Value=0x10</li><li>Version2属性：作为Vendor Extension（Type=0x1049，Vendor ID=14122/0x00372a，由WFA注册）的子属性包含；Vendor Extension可含多个子属性（如Request to Enroll——表示Enrollee希望开展后续EAP-WSC流程）</li><li>Request Type属性（须含于Probe/Association Request帧）：0x01=Enrollee, open 802.1X（想开展WSC流程）；0x00=Enrollee, Info only</li><li>Response Type属性：AP取0x03、Registrar取0x02、Enrollee取0x00/0x01</li><li>Configuration Methods属性（Type=0x1008，每一位代表一种支持的配置方法）：Display（动态PIN码，分Physical/Virtual）、Label（静态PIN码）、Keypad（可输入PIN码）、Push Button（分Physical/Virtual）</li><li>Primary Device Type属性（Type=0x1054）：含Category ID（如Telephone=0x000a）、OUI（WFA 0x00-50-f2-04）、Sub Category（如Smartphone-dual mode=0x0005）</li><li>Device Password ID属性：标示设备Password类型，默认0x0000=PIN；其他取值如0x0004 PushButton</li><li>RF Bands属性：设备支持的无线频率（如2.4GHz和5GHz）</li></ul>", "backText": "WSC IE属于Vendor定义的IE：Element ID=221（Vendor Specific）、OUI=0x00-50-F2-04（00-50-F2为Microsoft，04代表WPS）; WSC IE的Data域由一个或多个Attribute组成，格式为TLV：Type 2字节、Length 2字节（Value最大0xFFFF字节）; Attribute不仅用于WSC IE，还用于EAP-WSC包; Version属性：Type=0x104a；已废弃但为兼容必须在WSC IE中包含且Value=0x10; Version2属性：作为Vendor Extension（Type=0x1049，Vendor ID=14122/0x00372a，由WFA注册）的子属性包含；Vendor Extension可含多个子属性（如Request to Enroll——表示Enrollee希望开展后续EAP-WSC流程）; Request Type属性（须含于Probe/Association Request帧）：0x01=Enrollee, open 802.1X（想开展WSC流程）；0x00=Enrollee, Info only"}, {"id": "c569", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "WSC IE属于Vendor定义的IE", "back": "<div class=\"def-ans\">Element ID=221（Vendor Specific）、OUI=0x00-50-F2-04（00-50-F2为Microsoft，04代表WPS）</div>", "backText": "Element ID=221（Vendor Specific）、OUI=0x00-50-F2-04（00-50-F2为Microsoft，04代表WPS）"}, {"id": "c570", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "Version属性", "back": "<div class=\"def-ans\">Type=0x104a；已废弃但为兼容必须在WSC IE中包含且Value=0x10</div>", "backText": "Type=0x104a；已废弃但为兼容必须在WSC IE中包含且Value=0x10"}, {"id": "c571", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "Version2属性", "back": "<div class=\"def-ans\">作为Vendor Extension（Type=0x1049，Vendor ID=14122/0x00372a，由WFA注册）的子属性包含；Vendor Extension可含多个子属性（如Request to Enroll——表示Enrollee希望开展后续EAP-WSC流程）</div>", "backText": "作为Vendor Extension（Type=0x1049，Vendor ID=14122/0x00372a，由WFA注册）的子属性包含；Vendor Extension可含多个子属性（如Request to Enroll——表示Enrollee希望开展后续EAP-WSC流程）"}, {"id": "c572", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "Response Type属性", "back": "<div class=\"def-ans\">AP取0x03、Registrar取0x02、Enrollee取0x00/0x01</div>", "backText": "AP取0x03、Registrar取0x02、Enrollee取0x00/0x01"}, {"id": "c573", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "Device Password ID属性", "back": "<div class=\"def-ans\">标示设备Password类型，默认0x0000=PIN；其他取值如0x0004 PushButton</div>", "backText": "标示设备Password类型，默认0x0000=PIN；其他取值如0x0004 PushButton"}, {"id": "c574", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "RF Bands属性", "back": "<div class=\"def-ans\">设备支持的无线频率（如2.4GHz和5GHz）</div>", "backText": "设备支持的无线频率（如2.4GHz和5GHz）"}, {"id": "c575", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "6.3.2 802.11管理帧WSC IE设置", "back": "<ul class=\"ans-list\"><li>WSC规范规定不同管理帧中WSC IE必须包含特定属性</li><li>Probe Request帧WSC IE：包含Version、Request Type、Configuration Methods、UUID-E、Primary Device Type、RF Bands等</li><li>Probe Response帧WSC IE：AP侧属性集合；含Selected Registrar属性——AP已选择合适Registrar时为0x01，否则0x00</li><li>Association Request/Response帧的WSC IE设置较简单；Beacon帧WSC IE属性较多（必选项与可选项之分）</li><li>通过实例可判断AP是否真正支持WSC（示例AP仅含必选项，仅支持WPS不支持WSC 2.0）</li></ul>", "backText": "WSC规范规定不同管理帧中WSC IE必须包含特定属性; Probe Request帧WSC IE：包含Version、Request Type、Configuration Methods、UUID-E、Primary Device Type、RF Bands等; Probe Response帧WSC IE：AP侧属性集合；含Selected Registrar属性——AP已选择合适Registrar时为0x01，否则0x00; Association Request/Response帧的WSC IE设置较简单；Beacon帧WSC IE属性较多（必选项与可选项之分）; 通过实例可判断AP是否真正支持WSC（示例AP仅含必选项，仅支持WPS不支持WSC 2.0）"}, {"id": "c576", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "Probe Request帧WSC IE", "back": "<div class=\"def-ans\">包含Version、Request Type、Configuration Methods、UUID-E、Primary Device Type、RF Bands等</div>", "backText": "包含Version、Request Type、Configuration Methods、UUID-E、Primary Device Type、RF Bands等"}, {"id": "c577", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "Probe Response帧WSC IE", "back": "<div class=\"def-ans\">AP侧属性集合；含Selected Registrar属性——AP已选择合适Registrar时为0x01，否则0x00</div>", "backText": "AP侧属性集合；含Selected Registrar属性——AP已选择合适Registrar时为0x01，否则0x00"}, {"id": "c578", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "6.3.3 EAP-WSC介绍", "back": "<ul class=\"ans-list\"><li>WSC利用EAP扩展功能定义了EAP-WSC算法：Type=254（Vendor定义）、Vendor-Id=0x00372a、Vendor Type=0x0000-0001（WFA中表示Simple-Config）</li><li>Op-Code有六种取值；Flags含MF位（0x01，More Fragments分片）和LF位（0x02，Length Field）</li><li>Message data为WSC定义的Attribute；不同EAP-WSC包携带的Attribute有严格要求</li><li>流程启动前的三次EAP交换：AP发EAP-Request/Identity → STA回复EAP-Response/Identity且Identity设为\"WFA-SimpleConfig-Enrollee-1-0\" → AP发送EAP-Request/WSC_Start</li><li>M1（STA→AP）：Message Type=0x04、UUID-E、MAC地址、Enrollee Nonce、Public Key（D-H Key）、Authentication/Encryption Type Flags、Connection Type Flags</li><li>密钥机制：PIN码不是PSK；双方采用Diffie-Hellman（D-H）密钥交换算法确定对称密钥（D-H只用于密钥交换，不能加密解密消息）</li><li>M2（AP→STA）：Registrar Nonce、Registrar的Public Key、Authenticator（HMAC-SHA-256+AuthKey取前64位）；AP发M2前经D-H计算KDK（Key Derivation Key），再派生三种Key：AuthKey（256位，认证属性）、KeyWrapKey（128位，加密Nonce和ConfigData）、EMSK</li><li>M3（STA→AP）：含Registrar Nonce、E Hash1/E Hash2、Authenticator；E Hash1/2计算：AuthKey+PIN前半/后半经HMAC生成PSK1/PSK2 → AuthKey加密两个128位随机Nonce得E-S1/E-S2 → HMAC(AuthKey, E-S1/2 + PSK1/2 + 双方D-H Key)得E Hash1/2</li><li>M4（AP→STA）：AP用其在设置界面收到的PIN码计算R Hash1/R Hash2（PIN错误时STA比较会发现不一致而终止流程）；Encrypted Settings为KeyWrapKey加密的R-S1</li><li>M5（STA→AP）：Encrypted Settings为KeyWrapKey加密的E-S1；M6（AP→STA）：Encrypted Settings为KeyWrapKey加密的R-S2；M7（STA→AP）：发送KeyWrapKey加密的E-S2供AP验证</li><li>M8（AP→STA）：Encrypted Settings由KeyWrapKey加密，内含最重要的Credential属性集合（AP的安全设置信息：SSID、认证/加密算法、密钥等），STA解密后即得安全配置</li><li>流程收尾：STA处理完M8回复WSC_DONE → AP发EAP-FAIL和Deauthentication → STA取消关联、重新扫描，利用新配置信息加入目标网络</li></ul>", "backText": "WSC利用EAP扩展功能定义了EAP-WSC算法：Type=254（Vendor定义）、Vendor-Id=0x00372a、Vendor Type=0x0000-0001（WFA中表示Simple-Config）; Op-Code有六种取值；Flags含MF位（0x01，More Fragments分片）和LF位（0x02，Length Field）; Message data为WSC定义的Attribute；不同EAP-WSC包携带的Attribute有严格要求; 流程启动前的三次EAP交换：AP发EAP-Request/Identity → STA回复EAP-Response/Identity且Identity设为\"WFA-SimpleConfig-Enrollee-1-0\" → AP发送EAP-Request/WSC_Start; M1（STA→AP）：Message Type=0x04、UUID-E、MAC地址、Enrollee Nonce、Public Key（D-H Key）、Authentication/Encryption Type Flags、Connection Type Flags; 密钥机制：PIN码不是PSK；双方采用Diffie-Hellman（D-H）密钥交换算法确定对称密钥（D-H只用于密钥交换，不能加密解密消息）"}, {"id": "c579", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "WSC利用EAP扩展功能定义了EAP-WSC算法", "back": "<div class=\"def-ans\">Type=254（Vendor定义）、Vendor-Id=0x00372a、Vendor Type=0x0000-0001（WFA中表示Simple-Config）</div>", "backText": "Type=254（Vendor定义）、Vendor-Id=0x00372a、Vendor Type=0x0000-0001（WFA中表示Simple-Config）"}, {"id": "c580", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "流程启动前的三次EAP交换", "back": "<div class=\"def-ans\">AP发EAP-Request/Identity → STA回复EAP-Response/Identity且Identity设为\"WFA-SimpleConfig-Enrollee-1-0\" → AP发送EAP-Request/WSC_Start</div>", "backText": "AP发EAP-Request/Identity → STA回复EAP-Response/Identity且Identity设为\"WFA-SimpleConfig-Enrollee-1-0\" → AP发送EAP-Request/WSC_Start"}, {"id": "c581", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "M1（STA→AP）", "back": "<div class=\"def-ans\">Message Type=0x04、UUID-E、MAC地址、Enrollee Nonce、Public Key（D-H Key）、Authentication/Encryption Type Flags、Connection Type Flags</div>", "backText": "Message Type=0x04、UUID-E、MAC地址、Enrollee Nonce、Public Key（D-H Key）、Authentication/Encryption Type Flags、Connection Type Flags"}, {"id": "c582", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "密钥机制", "back": "<div class=\"def-ans\">PIN码不是PSK；双方采用Diffie-Hellman（D-H）密钥交换算法确定对称密钥（D-H只用于密钥交换，不能加密解密消息）</div>", "backText": "PIN码不是PSK；双方采用Diffie-Hellman（D-H）密钥交换算法确定对称密钥（D-H只用于密钥交换，不能加密解密消息）"}, {"id": "c583", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "M2（AP→STA）", "back": "<div class=\"def-ans\">Registrar Nonce、Registrar的Public Key、Authenticator（HMAC-SHA-256+AuthKey取前64位）；AP发M2前经D-H计算KDK（Key Derivation Key），再派生三种Key：AuthKey（256位，认证属性）、KeyWrapKey（128位，加密Nonce和ConfigData）、EMSK</div>", "backText": "Registrar Nonce、Registrar的Public Key、Authenticator（HMAC-SHA-256+AuthKey取前64位）；AP发M2前经D-H计算KDK（Key Derivation Key），再派生三种Key：AuthKey（256位，认证属性）、KeyWrapKey（128位，加密Nonce和ConfigData）、EMSK"}, {"id": "c584", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "M3（STA→AP）", "back": "<div class=\"def-ans\">含Registrar Nonce、E Hash1/E Hash2、Authenticator；E Hash1/2计算：AuthKey+PIN前半/后半经HMAC生成PSK1/PSK2 → AuthKey加密两个128位随机Nonce得E-S1/E-S2 → HMAC(AuthKey, E-S1/2 + PSK1/2 + 双方D-H Key)得E Hash1/2</div>", "backText": "含Registrar Nonce、E Hash1/E Hash2、Authenticator；E Hash1/2计算：AuthKey+PIN前半/后半经HMAC生成PSK1/PSK2 → AuthKey加密两个128位随机Nonce得E-S1/E-S2 → HMAC(AuthKey, E-S1/2 + PSK1/2 + 双方D-H Key)得E Hash1/2"}, {"id": "c585", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "M4（AP→STA）", "back": "<div class=\"def-ans\">AP用其在设置界面收到的PIN码计算R Hash1/R Hash2（PIN错误时STA比较会发现不一致而终止流程）；Encrypted Settings为KeyWrapKey加密的R-S1</div>", "backText": "AP用其在设置界面收到的PIN码计算R Hash1/R Hash2（PIN错误时STA比较会发现不一致而终止流程）；Encrypted Settings为KeyWrapKey加密的R-S1"}, {"id": "c586", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "M5（STA→AP）", "back": "<div class=\"def-ans\">Encrypted Settings为KeyWrapKey加密的E-S1；M6（AP→STA）：Encrypted Settings为KeyWrapKey加密的R-S2；M7（STA→AP）：发送KeyWrapKey加密的E-S2供AP验证</div>", "backText": "Encrypted Settings为KeyWrapKey加密的E-S1；M6（AP→STA）：Encrypted Settings为KeyWrapKey加密的R-S2；M7（STA→AP）：发送KeyWrapKey加密的E-S2供AP验证"}, {"id": "c587", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "M8（AP→STA）", "back": "<div class=\"def-ans\">Encrypted Settings由KeyWrapKey加密，内含最重要的Credential属性集合（AP的安全设置信息：SSID、认证/加密算法、密钥等），STA解密后即得安全配置</div>", "backText": "Encrypted Settings由KeyWrapKey加密，内含最重要的Credential属性集合（AP的安全设置信息：SSID、认证/加密算法、密钥等），STA解密后即得安全配置"}, {"id": "c588", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.3 Registration Protocol详解", "front": "流程收尾", "back": "<div class=\"def-ans\">STA处理完M8回复WSC_DONE → AP发EAP-FAIL和Deauthentication → STA取消关联、重新扫描，利用新配置信息加入目标网络</div>", "backText": "STA处理完M8回复WSC_DONE → AP发EAP-FAIL和Deauthentication → STA取消关联、重新扫描，利用新配置信息加入目标网络"}, {"id": "c589", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "6.4.1 Settings中的WSC处理", "back": "<ul class=\"ans-list\"><li>选择\"WPS PIN\"条目后弹出WpsDialog对话框，PIN和PBC方法都在WpsDialog中实现</li><li>WpsDialog实现WifiManager.WpsListener：onStartSuccess（PIN非空时显示WPAS动态生成的PIN码；否则显示PBC提示）、onCompletion、onFailure</li><li>WpsDialog注册监听NETWORK_STATE_CHANGED_ACTION广播，成功加入网络后在handleEvent中处理</li><li>onStart中构造WpsInfo对象（setup=mWpsSetup，PIN对应WpsInfo.DISPLAY），调用WifiManager.startWps（内部向WifiStateMachine发送START_WPS消息）</li></ul>", "backText": "选择\"WPS PIN\"条目后弹出WpsDialog对话框，PIN和PBC方法都在WpsDialog中实现; WpsDialog实现WifiManager.WpsListener：onStartSuccess（PIN非空时显示WPAS动态生成的PIN码；否则显示PBC提示）、onCompletion、onFailure; WpsDialog注册监听NETWORK_STATE_CHANGED_ACTION广播，成功加入网络后在handleEvent中处理; onStart中构造WpsInfo对象（setup=mWpsSetup，PIN对应WpsInfo.DISPLAY），调用WifiManager.startWps（内部向WifiStateMachine发送START_WPS消息）"}, {"id": "c590", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "6.4.2 WifiStateMachine的处理", "back": "<ul class=\"ans-list\"><li>STA未连接时WifiStateMachine处于DisconnectedState，其父状态ConnectedModeState处理START_WPS消息</li><li>START_WPS处理：按WpsInfo.setup分派——PBC调WifiConfigStore.startWpsPbc；DISPLAY（PIN）调startWpsWithPinFromDevice；成功后回复WifiManager并转入WpsRunningState</li><li>startWpsWithPinFromDevice：调用mWifiNative.startWpsPinDisplay(BSSID)，向WPAS发送\"WPS_PIN any\"命令，WPAS计算并返回动态PIN码；成功则markAllNetworksDisabled停用其他网络</li><li>WPAS完成WSC流程后发送WPS-SUCCESS给WifiMonitor，WifiMonitor向WifiStateMachine发送WPS_SUCCESS_EVENT</li><li>WpsRunningState收到WPS_SUCCESS_EVENT后回复WifiManager.WPS_COMPLETED（触发WpsListener.onCompletion）并转入DisconnectedState</li><li>App层与Framework对WSC的处理本质上就是发送\"WPS_PIN any\"命令触发WPAS</li></ul>", "backText": "STA未连接时WifiStateMachine处于DisconnectedState，其父状态ConnectedModeState处理START_WPS消息; START_WPS处理：按WpsInfo.setup分派——PBC调WifiConfigStore.startWpsPbc；DISPLAY（PIN）调startWpsWithPinFromDevice；成功后回复WifiManager并转入WpsRunningState; startWpsWithPinFromDevice：调用mWifiNative.startWpsPinDisplay(BSSID)，向WPAS发送\"WPS_PIN any\"命令，WPAS计算并返回动态PIN码；成功则markAllNetworksDisabled停用其他网络; WPAS完成WSC流程后发送WPS-SUCCESS给WifiMonitor，WifiMonitor向WifiStateMachine发送WPS_SUCCESS_EVENT; WpsRunningState收到WPS_SUCCESS_EVENT后回复WifiManager.WPS_COMPLETED（触发WpsListener.onCompletion）并转入DisconnectedState; App层与Framework对WSC的处理本质上就是发送\"WPS_PIN any\"命令触发WPAS"}, {"id": "c591", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "START_WPS处理", "back": "<div class=\"def-ans\">按WpsInfo.setup分派——PBC调WifiConfigStore.startWpsPbc；DISPLAY（PIN）调startWpsWithPinFromDevice；成功后回复WifiManager并转入WpsRunningState</div>", "backText": "按WpsInfo.setup分派——PBC调WifiConfigStore.startWpsPbc；DISPLAY（PIN）调startWpsWithPinFromDevice；成功后回复WifiManager并转入WpsRunningState"}, {"id": "c592", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "startWpsWithPinFromDevice", "back": "<div class=\"def-ans\">调用mWifiNative.startWpsPinDisplay(BSSID)，向WPAS发送\"WPS_PIN any\"命令，WPAS计算并返回动态PIN码；成功则markAllNetworksDisabled停用其他网络</div>", "backText": "调用mWifiNative.startWpsPinDisplay(BSSID)，向WPAS发送\"WPS_PIN any\"命令，WPAS计算并返回动态PIN码；成功则markAllNetworksDisabled停用其他网络"}, {"id": "c593", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "6.4.3 wpa_supplicant中的WSC处理", "back": "<ul class=\"ans-list\"><li>WSC模块初始化<ul class=\"sub\"><li>在wpa_supplicant_init_iface最后调用wpas_wps_init；WPAS代码中WSC称WPS2</li><li>wps_context是WPS模块核心数据结构；设置两个重要回调：cred_cb（=wpa_supplicant_wps_cred，解析credential属性集时用）、event_cb（=wpa_supplicant_wps_event，通知事件如\"WSC-SUCCESS\"）</li><li>从wpa_supplicant.conf初始化设备信息（device_name、manufacturer、model_name等）</li><li>config_methods字符串转标志位；Label与Display不能同时配置（静态与动态PIN码互斥）</li><li>设置主/次设备类型、OS版本；根据硬件模式设置RF Bands；默认认证算法WPA2PSK|WPAPSK、加密算法AES|TKIP</li><li>设置UUID（未配置则由MAC地址生成）；调用wps_registrar_init创建wps_registrar对象</li></ul></li><li>WPS_PIN命令处理<ul class=\"sub\"><li>ctrl_iface.c的wpa_supplicant_ctrl_iface_wps_pin处理\"WPS_PIN any\"（cmd=\"any\"时_bssid=NULL）</li><li>调用wpas_wps_start_pin启动WPS流程；PIN码以\"%08d\"字符串形式返回给WifiStateMachine</li><li>wpas_wps_start_pin：wpas_clear_wps清空旧WPS信息；wpas_wps_add_network创建wpa_ssid对象（key_mgmt=WPA_KEY_MGMT_WPS，identity为\"WFA-SimpleConfig-Enrollee-1-0\"），ssid-&gt;temporary=1</li><li>无传入PIN时用wps_generate_pin生成随机PIN（8位，末位为前7位校验和），写入wpa_ssid的eap成员phase1</li><li>注册120秒超时任务（WPS_PBC_WALK_TIME）；wpas_wps_reassoc重新关联并发起扫描（进入Discovery Phase）</li></ul></li><li>发起扫描请求<ul class=\"sub\"><li>wpa_supplicant_scan中调用wpa_supplicant_extra_ies处理WSC IE</li><li>wpas_wps_in_use判断是否需要在Probe Request中加WSC IE：检查wpa_ssid的key_mgmt是否含WPA_KEY_MGMT_WPS；返回1=PIN方法、2=PBC方法</li><li>wps_build_probe_req_ie构造WSC IE：含Version、Req Type、Config Methods、UUID-E、Primary Device Type、RF Bands、Assoc State、Config Error、Dev Password ID（PBC时DEV_PW_PUSHBUTTON）、WPS2下还有Manufacturer/Model Name等</li></ul></li><li>处理扫描结果<ul class=\"sub\"><li>wpa_supplicant_get_scan_results：WPS进行中时排序函数改为wpa_scan_result_wps_compar</li><li>排序规则：支持WSC的AP排在前面；两个都支持WSC时Selected Registrar=1的排前；都不支持WSC时按信号强度和质量排序</li><li>wpa_supplicant_pick_network按优先级遍历，经wpa_supplicant_select_bss、wpa_scan_res_match选择目标AP</li><li>WPS相关wpa_ssid未设ssid时，wpas_wps_ssid_wildcard_ok判断可跳过ssid检查；wpas_wps_ssid_bss_match中PIN Enrollee通过wps_is_addr_authorized检查AuthorizedMACs子属性</li><li>选中目标AP后进入关联流程；WSC情况下关联后开展EAP-WSC流程（非WSC则开展4-Way Handshake）</li></ul></li></ul>", "backText": "WSC模块初始化; WPS_PIN命令处理; 发起扫描请求; 处理扫描结果"}, {"id": "c594", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "WSC模块初始化", "back": "<ul class=\"ans-list\"><li>在wpa_supplicant_init_iface最后调用wpas_wps_init；WPAS代码中WSC称WPS2</li><li>wps_context是WPS模块核心数据结构；设置两个重要回调：cred_cb（=wpa_supplicant_wps_cred，解析credential属性集时用）、event_cb（=wpa_supplicant_wps_event，通知事件如\"WSC-SUCCESS\"）</li><li>从wpa_supplicant.conf初始化设备信息（device_name、manufacturer、model_name等）</li><li>config_methods字符串转标志位；Label与Display不能同时配置（静态与动态PIN码互斥）</li><li>设置主/次设备类型、OS版本；根据硬件模式设置RF Bands；默认认证算法WPA2PSK|WPAPSK、加密算法AES|TKIP</li><li>设置UUID（未配置则由MAC地址生成）；调用wps_registrar_init创建wps_registrar对象</li></ul>", "backText": "在wpa_supplicant_init_iface最后调用wpas_wps_init；WPAS代码中WSC称WPS2; wps_context是WPS模块核心数据结构；设置两个重要回调：cred_cb（=wpa_supplicant_wps_cred，解析credential属性集时用）、event_cb（=wpa_supplicant_wps_event，通知事件如\"WSC-SUCCESS\"）; 从wpa_supplicant.conf初始化设备信息（device_name、manufacturer、model_name等）; config_methods字符串转标志位；Label与Display不能同时配置（静态与动态PIN码互斥）; 设置主/次设备类型、OS版本；根据硬件模式设置RF Bands；默认认证算法WPA2PSK|WPAPSK、加密算法AES|TKIP; 设置UUID（未配置则由MAC地址生成）；调用wps_registrar_init创建wps_registrar对象"}, {"id": "c595", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "WPS_PIN命令处理", "back": "<ul class=\"ans-list\"><li>ctrl_iface.c的wpa_supplicant_ctrl_iface_wps_pin处理\"WPS_PIN any\"（cmd=\"any\"时_bssid=NULL）</li><li>调用wpas_wps_start_pin启动WPS流程；PIN码以\"%08d\"字符串形式返回给WifiStateMachine</li><li>wpas_wps_start_pin：wpas_clear_wps清空旧WPS信息；wpas_wps_add_network创建wpa_ssid对象（key_mgmt=WPA_KEY_MGMT_WPS，identity为\"WFA-SimpleConfig-Enrollee-1-0\"），ssid-&gt;temporary=1</li><li>无传入PIN时用wps_generate_pin生成随机PIN（8位，末位为前7位校验和），写入wpa_ssid的eap成员phase1</li><li>注册120秒超时任务（WPS_PBC_WALK_TIME）；wpas_wps_reassoc重新关联并发起扫描（进入Discovery Phase）</li></ul>", "backText": "ctrl_iface.c的wpa_supplicant_ctrl_iface_wps_pin处理\"WPS_PIN any\"（cmd=\"any\"时_bssid=NULL）; 调用wpas_wps_start_pin启动WPS流程；PIN码以\"%08d\"字符串形式返回给WifiStateMachine; wpas_wps_start_pin：wpas_clear_wps清空旧WPS信息；wpas_wps_add_network创建wpa_ssid对象（key_mgmt=WPA_KEY_MGMT_WPS，identity为\"WFA-SimpleConfig-Enrollee-1-0\"），ssid->temporary=1; 无传入PIN时用wps_generate_pin生成随机PIN（8位，末位为前7位校验和），写入wpa_ssid的eap成员phase1; 注册120秒超时任务（WPS_PBC_WALK_TIME）；wpas_wps_reassoc重新关联并发起扫描（进入Discovery Phase）"}, {"id": "c596", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "wpas_wps_start_pin", "back": "<div class=\"def-ans\">wpas_clear_wps清空旧WPS信息；wpas_wps_add_network创建wpa_ssid对象（key_mgmt=WPA_KEY_MGMT_WPS，identity为\"WFA-SimpleConfig-Enrollee-1-0\"），ssid-&gt;temporary=1</div>", "backText": "wpas_clear_wps清空旧WPS信息；wpas_wps_add_network创建wpa_ssid对象（key_mgmt=WPA_KEY_MGMT_WPS，identity为\"WFA-SimpleConfig-Enrollee-1-0\"），ssid->temporary=1"}, {"id": "c597", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "发起扫描请求", "back": "<ul class=\"ans-list\"><li>wpa_supplicant_scan中调用wpa_supplicant_extra_ies处理WSC IE</li><li>wpas_wps_in_use判断是否需要在Probe Request中加WSC IE：检查wpa_ssid的key_mgmt是否含WPA_KEY_MGMT_WPS；返回1=PIN方法、2=PBC方法</li><li>wps_build_probe_req_ie构造WSC IE：含Version、Req Type、Config Methods、UUID-E、Primary Device Type、RF Bands、Assoc State、Config Error、Dev Password ID（PBC时DEV_PW_PUSHBUTTON）、WPS2下还有Manufacturer/Model Name等</li></ul>", "backText": "wpa_supplicant_scan中调用wpa_supplicant_extra_ies处理WSC IE; wpas_wps_in_use判断是否需要在Probe Request中加WSC IE：检查wpa_ssid的key_mgmt是否含WPA_KEY_MGMT_WPS；返回1=PIN方法、2=PBC方法; wps_build_probe_req_ie构造WSC IE：含Version、Req Type、Config Methods、UUID-E、Primary Device Type、RF Bands、Assoc State、Config Error、Dev Password ID（PBC时DEV_PW_PUSHBUTTON）、WPS2下还有Manufacturer/Model Name等"}, {"id": "c598", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "wps_build_probe_req_ie构造WSC IE", "back": "<div class=\"def-ans\">含Version、Req Type、Config Methods、UUID-E、Primary Device Type、RF Bands、Assoc State、Config Error、Dev Password ID（PBC时DEV_PW_PUSHBUTTON）、WPS2下还有Manufacturer/Model Name等</div>", "backText": "含Version、Req Type、Config Methods、UUID-E、Primary Device Type、RF Bands、Assoc State、Config Error、Dev Password ID（PBC时DEV_PW_PUSHBUTTON）、WPS2下还有Manufacturer/Model Name等"}, {"id": "c599", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "处理扫描结果", "back": "<ul class=\"ans-list\"><li>wpa_supplicant_get_scan_results：WPS进行中时排序函数改为wpa_scan_result_wps_compar</li><li>排序规则：支持WSC的AP排在前面；两个都支持WSC时Selected Registrar=1的排前；都不支持WSC时按信号强度和质量排序</li><li>wpa_supplicant_pick_network按优先级遍历，经wpa_supplicant_select_bss、wpa_scan_res_match选择目标AP</li><li>WPS相关wpa_ssid未设ssid时，wpas_wps_ssid_wildcard_ok判断可跳过ssid检查；wpas_wps_ssid_bss_match中PIN Enrollee通过wps_is_addr_authorized检查AuthorizedMACs子属性</li><li>选中目标AP后进入关联流程；WSC情况下关联后开展EAP-WSC流程（非WSC则开展4-Way Handshake）</li></ul>", "backText": "wpa_supplicant_get_scan_results：WPS进行中时排序函数改为wpa_scan_result_wps_compar; 排序规则：支持WSC的AP排在前面；两个都支持WSC时Selected Registrar=1的排前；都不支持WSC时按信号强度和质量排序; wpa_supplicant_pick_network按优先级遍历，经wpa_supplicant_select_bss、wpa_scan_res_match选择目标AP; WPS相关wpa_ssid未设ssid时，wpas_wps_ssid_wildcard_ok判断可跳过ssid检查；wpas_wps_ssid_bss_match中PIN Enrollee通过wps_is_addr_authorized检查AuthorizedMACs子属性; 选中目标AP后进入关联流程；WSC情况下关联后开展EAP-WSC流程（非WSC则开展4-Way Handshake）"}, {"id": "c600", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "排序规则", "back": "<div class=\"def-ans\">支持WSC的AP排在前面；两个都支持WSC时Selected Registrar=1的排前；都不支持WSC时按信号强度和质量排序</div>", "backText": "支持WSC的AP排在前面；两个都支持WSC时Selected Registrar=1的排前；都不支持WSC时按信号强度和质量排序"}, {"id": "c601", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "6.4.4 EAP-WSC处理流程分析", "back": "<ul class=\"ans-list\"><li>EAP-WSC涉及EAPOL四个状态机（SUPP_PAE、KEY_RX、SUPP_BE、Port Timers）与EAP SM的联动；关联成功后初态：PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、BE=IDLE、EAP_SM=DISABLED</li><li>发送EAPOL-Start<ul class=\"sub\"><li>关联流程最后eapol_sm_notify_portEnabled置portEnabled=1，SUPP_PAE进入CONNECTING</li><li>支持WPS时startWhen=1（否则3）；Port Timers SM递减startWhen到0后经eapol_sm_step重新遍历，PAE再次进入CONNECTING（此时send_start=1），调用eapol_sm_txStart</li><li>eapol_sm_txStart经eapol_send（实例为wpa_supplicant_eapol_send）最终发出EAPOL-Start帧</li></ul></li><li>状态机切换处理<ul class=\"sub\"><li>AP回EAP-Request/Identity，STA收到EAP包经wpa_supplicant_rx_eapol→eapol_sm_rx_eapol处理；收EAP_PACKET时存入eapReqData、置eapolEap=TRUE并触发eapol_sm_step</li><li>eapol_sm_step：先按序运行PAE、KEY_RX、BE，再运行EAP SM；任一状态机状态变化则循环（最多100次）重新遍历直至稳定</li><li>状态机联动规律：PAE_RESTART置eapRestart=TRUE促使EAP_SM进入INITIALIZE；EAP处理Identity后构造EAP-Response/Identity并置eapResp=TRUE；eapResp使BE进入RESPONSE状态由txsuppResp发送回复包</li><li>后续M1～M8期间PAE保持Authenticating不变；BE循环RECEIVE→REQUEST→RESPONSE，EAP SM根据EAP包内容转移；KEY_RX不参与</li><li>key_mgmt=WPA_KEY_MGMT_WPS时force_disabled被置FALSE，EAP SM才能从DISABLED转入INITIALIZE</li></ul></li><li>EAP-Request/Identity处理<ul class=\"sub\"><li>EAP SM的RECEIVED状态调用eap_sm_parseEapReq解析：记录reqId、reqMethod；reqMethod=EAP_TYPE_EXPANDED（254）时进一步取reqVendor（0x372a）和reqVendorMethod（0x1，SimpleConfig）</li><li>IDENTITY状态：eap_sm_processIdentity处理Identity，eap_sm_buildIdentity构造EAP-Response/Identity——identity为\"WFA-SimpleConfig-Enrollee-1-0\"</li></ul></li><li>EAP-Request/WSC_Start处理<ul class=\"sub\"><li>EAP SM进入GET_METHOD状态：eap_sm_allowMethod检查是否支持该vendor方法（EAP-WSC已在eap_register_methods注册）；sm-&gt;m指向eap_method对象；调用m-&gt;init初始化EAP-WSC算法</li><li>EAP-WSC模块定制三函数：eap_wsc_init/deinit（资源初始化与释放）、eap_wsc_process（处理EAP-WSC包）</li><li>METHOD状态调用sm-&gt;m-&gt;process（即eap_wsc_process）生成回复数据</li></ul></li><li>eap_wsc_process介绍<ul class=\"sub\"><li>eap_hdr_validate校验头部（EAP_VENDOR_WFA、EAP_VENDOR_TYPE_WSC）；解析Op-Code、Flags；处理LF（Message Length）和MF（分片，WAIT_FRAG_ACK状态）标志</li><li>初始状态WAIT_START时收到WSC_Start后转入MESG状态</li><li>两个关键函数：wps_process_msg（Enrollee侧调wps_enrollee_process_msg处理收到的M2/M4/M6/M8等，返回WPS_DONE/WPS_CONTINUE/WPS_FAILURE/WPS_PENDING）、wps_get_msg（Enrollee侧调wps_enrollee_get_msg构造M1/M3/M5/M7/WSC_Done消息）</li><li>用eap_wsc_build_msg构造回复的EAP-WSC消息包</li></ul></li><li>M8消息处理<ul class=\"sub\"><li>wps_process_m8：先校验Enrollee Nonce和Authenticator（防中间人篡改，失败则SEND_WSC_NACK）→wps_decrypt_encr_settings用KeyWrapKey解密Encrypted Settings→wps_validate_m8_encr校验→wps_parse_msg解析→wps_process_key_wrap_auth校验→wps_process_creds处理Credential属性集、wps_process_ap_settings_e处理AP设置</li><li>wps_process_cred_e最后经cred_cb回调（wpa_supplicant_wps_cred）把credential交给WPAS</li><li>wpa_supplicant_wps_cred：wps_cred_processing控制处理方式（0=WPAS内部处理，1=发给客户端，2=内部处理也发送）；校验认证算法（OPEN/SHARED/WPAPSK/WPA2PSK）</li><li>更新wpa_ssid：清除EAP-WSC临时配置（identity/phase1/eap_methods）、写入cred的SSID、按encr_type设置pairwise_cipher（TKIP→WPA_CIPHER_TKIP，AES→CCMP）、按auth_type设置key_mgmt/proto（如WPA2PSK→key_mgmt=WPA_KEY_MGMT_PSK、proto=RSN）</li><li>cred-&gt;key_len为2×PMK_LEN时按十六进制解析为PSK；wpas_wps_security_workaround处理混合加密模式AP的兼容问题；需要时wpa_config_write将配置写入配置文件</li><li>STA与AP断开后即用新网络配置发起关联；MSG_Done构造中WPAS发送WPS-SUCCESS给WifiMonitor</li><li>经验总结：EAP-WSC代码难点不在算法本身而在状态机联动；建议读者自行研究M1～M7处理流程</li></ul></li></ul>", "backText": "EAP-WSC涉及EAPOL四个状态机（SUPP_PAE、KEY_RX、SUPP_BE、Port Timers）与EAP SM的联动；关联成功后初态：PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、BE=IDLE、EAP_SM=DISABLED; 发送EAPOL-Start; 状态机切换处理; EAP-Request/Identity处理; EAP-Request/WSC_Start处理; eap_wsc_process介绍"}, {"id": "c602", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "发送EAPOL-Start", "back": "<ul class=\"ans-list\"><li>关联流程最后eapol_sm_notify_portEnabled置portEnabled=1，SUPP_PAE进入CONNECTING</li><li>支持WPS时startWhen=1（否则3）；Port Timers SM递减startWhen到0后经eapol_sm_step重新遍历，PAE再次进入CONNECTING（此时send_start=1），调用eapol_sm_txStart</li><li>eapol_sm_txStart经eapol_send（实例为wpa_supplicant_eapol_send）最终发出EAPOL-Start帧</li></ul>", "backText": "关联流程最后eapol_sm_notify_portEnabled置portEnabled=1，SUPP_PAE进入CONNECTING; 支持WPS时startWhen=1（否则3）；Port Timers SM递减startWhen到0后经eapol_sm_step重新遍历，PAE再次进入CONNECTING（此时send_start=1），调用eapol_sm_txStart; eapol_sm_txStart经eapol_send（实例为wpa_supplicant_eapol_send）最终发出EAPOL-Start帧"}, {"id": "c603", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "状态机切换处理", "back": "<ul class=\"ans-list\"><li>AP回EAP-Request/Identity，STA收到EAP包经wpa_supplicant_rx_eapol→eapol_sm_rx_eapol处理；收EAP_PACKET时存入eapReqData、置eapolEap=TRUE并触发eapol_sm_step</li><li>eapol_sm_step：先按序运行PAE、KEY_RX、BE，再运行EAP SM；任一状态机状态变化则循环（最多100次）重新遍历直至稳定</li><li>状态机联动规律：PAE_RESTART置eapRestart=TRUE促使EAP_SM进入INITIALIZE；EAP处理Identity后构造EAP-Response/Identity并置eapResp=TRUE；eapResp使BE进入RESPONSE状态由txsuppResp发送回复包</li><li>后续M1～M8期间PAE保持Authenticating不变；BE循环RECEIVE→REQUEST→RESPONSE，EAP SM根据EAP包内容转移；KEY_RX不参与</li><li>key_mgmt=WPA_KEY_MGMT_WPS时force_disabled被置FALSE，EAP SM才能从DISABLED转入INITIALIZE</li></ul>", "backText": "AP回EAP-Request/Identity，STA收到EAP包经wpa_supplicant_rx_eapol→eapol_sm_rx_eapol处理；收EAP_PACKET时存入eapReqData、置eapolEap=TRUE并触发eapol_sm_step; eapol_sm_step：先按序运行PAE、KEY_RX、BE，再运行EAP SM； settings用KeyWrapKey解密Encrypted Settings→wps_validate_m8_encr校验→wps_parse_msg解析→wps_process_key_wrap_auth校验→wps_process_creds处理Credential属性集、wps_process_ap_settings_e处理AP设置</li><li>wps_process_cred_e最后经cred_cb回调（wpa_supplicant_wps_cred）把credential交给WPAS</li><li>wpa_supplicant_wps_cred：wps_cred_processing控制处理方式（0=WPAS内部处理，1=发给客户端，2=内部处理也发送）；校验认证算法（OPEN/SHARED/WPAPSK/WPA2PSK）</li><li>更新wpa_ssid：清除EAP-WSC临时配置（identity/phase1/eap_methods）、写入cred的SSID、按encr_type设置pairwise_cipher（TKIP→WPA_CIPHER_TKIP，AES→CCMP）、按auth_type设置key_mgmt/proto（如WPA2PSK→key_mgmt=WPA_KEY_MGMT_PSK、proto=RSN）</li><li>cred-&gt;key_len为2×PMK_LEN时按十六进制解析为PSK；wpas_wps_security_workaround处理混合加密模式AP的兼容问题；需要时wpa_config_write将配置写入配置文件</li><li>STA与AP断开后即用新网络配置发起关联；MSG_Done构造中WPAS发送WPS-SUCCESS给WifiMonitor</li><li>经验总结：EAP-WSC代码难点不在算法本身而在状态机联动；建议读者自行研究M1～M7处理流程</li></ul>", "backText": "wps_process_m8：先校验Enrollee Nonce和Authenticator（防中间人篡改，失败则SEND_WSC_NACK）→wps_decrypt_encr_settings用KeyWrapKey解密Encrypted Settings→wps_validate_m8_encr校验→wps_parse_msg解析→wps_process_key_wrap_auth校验→wps_process_creds处理Credential属性集、wps_process_ap_settings_e处理AP设置; wps_process_cred_e最后经cred_cb回调（wpa_supplicant_wps_cred）把credential交给WPAS; wpa_supplicant_wps_cred：wps_cred_processing控制处理方式（0=WPAS内部处理，1=发给客户端，2=内部处理也发送）；校验认证算法（OPEN/SHARED/WPAPSK/WPA2PSK）; 更新wpa_ssid：清除EAP-WSC临时配置（identity/phase1/eap_methods）、写入cred的SSID、按encr_type设置pairwise_cipher（TKIP→WPA_CIPHER_TKIP，AES→CCMP）、按auth_type设置key_mgmt/proto（如WPA2PSK→key_mgmt=WPA_KEY_MGMT_PSK、proto=RSN）; cred->key_len为2×PMK_LEN时按十六进制解析为PSK；wpas_wps_security_workaround处理混合加密模式AP的兼容问题；需要时wpa_config_write将配置写入配置文件; STA与AP断开后即用新网络配置发起关联；MSG_Done构造中WPAS发送WPS-SUCCESS给WifiMonitor"}, {"id": "c614", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "wps_process_m8", "back": "<div class=\"def-ans\">先校验Enrollee Nonce和Authenticator（防中间人篡改，失败则SEND_WSC_NACK）→wps_decrypt_encr_settings用KeyWrapKey解密Encrypted Settings→wps_validate_m8_encr校验→wps_parse_msg解析→wps_process_key_wrap_auth校验→wps_process_creds处理Credential属性集、wps_process_ap_settings_e处理AP设置</div>", "backText": "先校验Enrollee Nonce和Authenticator（防中间人篡改，失败则SEND_WSC_NACK）→wps_decrypt_encr_settings用KeyWrapKey解密Encrypted Settings→wps_validate_m8_encr校验→wps_parse_msg解析→wps_process_key_wrap_auth校验→wps_process_creds处理Credential属性集、wps_process_ap_settings_e处理AP设置"}, {"id": "c615", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "wpa_supplicant_wps_cred", "back": "<div class=\"def-ans\">wps_cred_processing控制处理方式（0=WPAS内部处理，1=发给客户端，2=内部处理也发送）；校验认证算法（OPEN/SHARED/WPAPSK/WPA2PSK）</div>", "backText": "wps_cred_processing控制处理方式（0=WPAS内部处理，1=发给客户端，2=内部处理也发送）；校验认证算法（OPEN/SHARED/WPAPSK/WPA2PSK）"}, {"id": "c616", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "更新wpa_ssid", "back": "<div class=\"def-ans\">清除EAP-WSC临时配置（identity/phase1/eap_methods）、写入cred的SSID、按encr_type设置pairwise_cipher（TKIP→WPA_CIPHER_TKIP，AES→CCMP）、按auth_type设置key_mgmt/proto（如WPA2PSK→key_mgmt=WPA_KEY_MGMT_PSK、proto=RSN）</div>", "backText": "清除EAP-WSC临时配置（identity/phase1/eap_methods）、写入cred的SSID、按encr_type设置pairwise_cipher（TKIP→WPA_CIPHER_TKIP，AES→CCMP）、按auth_type设置key_mgmt/proto（如WPA2PSK→key_mgmt=WPA_KEY_MGMT_PSK、proto=RSN）"}, {"id": "c617", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.4 WSC代码分析", "front": "经验总结", "back": "<div class=\"def-ans\">EAP-WSC代码难点不在算法本身而在状态机联动；建议读者自行研究M1～M7处理流程</div>", "backText": "EAP-WSC代码难点不在算法本身而在状态机联动；建议读者自行研究M1～M7处理流程"}, {"id": "c618", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.5 本章总结和参考资料说明", "front": "核心是WSC理论知识", "back": "<div class=\"def-ans\">最重要的是RP协议、WSC IE及各种Attribute的作用，建议结合实例图学习</div>", "backText": "最重要的是RP协议、WSC IE及各种Attribute的作用，建议结合实例图学习"}, {"id": "c619", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.5 本章总结和参考资料说明", "front": "掌握理论后学习Android实现", "back": "<div class=\"def-ans\">Settings、WifiService相关模块、wpa_supplicant相关模块；EAP-WSC算法本身难度不大</div>", "backText": "Settings、WifiService相关模块、wpa_supplicant相关模块；EAP-WSC算法本身难度不大"}, {"id": "c620", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第6章 深入理解Wi-Fi Simple Configuration", "section": "6.5 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">WSC规范2.0.2版（第1节Introduction、第4节Core Architecture、第6.1节In-band Setup Using a Standalone AP/Registrar、第8节Message Encoding、第7节Registration Protocol Definition、第11节Push Button Configuration）；维基百科Diffie-Hellman key exchange词条</div>", "backText": "WSC规范2.0.2版（第1节Introduction、第4节Core Architecture、第6.1节In-band Setup Using a Standalone AP/Registrar、第8节Message Encoding、第7节Registration Protocol Definition、第11节Push Button Configuration）；维基百科Diffie-Hellman key exchange词条"}, {"id": "c621", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.1 概述", "front": "Android平台P2P功能集中点", "back": "<div class=\"def-ans\">Framework中的WifiP2pService（功能类似WifiService，处理P2P相关工作）、wpa_supplicant中的P2P模块</div>", "backText": "Framework中的WifiP2pService（功能类似WifiService，处理P2P相关工作）、wpa_supplicant中的P2P模块"}, {"id": "c622", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.1 概述", "front": "本章分析方法", "back": "<div class=\"def-ans\">先介绍P2P基础知识，再分析Settings、WifiP2pService及WPAS相关模块</div>", "backText": "先介绍P2P基础知识，再分析Settings、WifiP2pService及WPAS相关模块"}, {"id": "c623", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.1 概述", "front": "涉及源码文件", "back": "<div class=\"def-ans\">WifiP2pSettings.java、WifiP2pService.java、p2p_supplicant.c、p2p.c、p2p_pd.c、p2p_go_neg.c、driver_nl80211.c、ctrl_iface.c</div>", "backText": "WifiP2pSettings.java、WifiP2pService.java、p2p_supplicant.c、p2p.c、p2p_pd.c、p2p_go_neg.c、driver_nl80211.c、ctrl_iface.c"}, {"id": "c624", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "P2P是Wi-Fi Display（Miracast）的基础", "back": "<div class=\"def-ans\">手机可直接连接智能电视并传输媒体内容</div>", "backText": "手机可直接连接智能电视并传输媒体内容"}, {"id": "c625", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "7.2.1 P2P架构", "back": "<ul class=\"ans-list\"><li>三个组件（\"一个设备，两种角色\"）：P2P Device（角色实体，即Wi-Fi设备）、P2P Group Owner（GO，类似Infrastructure BSS中的AP）、P2P Client（类似STA）</li><li>P2P技术模仿Infrastructure BSS：组建Group前均为P2P Device；协商完成后有且只有一个Device扮演GO，其余扮演Client</li><li>一个P2P Group只能有一个GO，可支持1∶n个Client连接；周围不支持P2P的STA（Legacy Client）也可发现并关联GO（但不能处理P2P协议特有功能）</li><li>建Group流程与Infrastructure BSS类似：先通过WSC获取安全配置信息，Client再用协商好的安全设置关联GO（RSNA流程，含4-Way Handshake）</li><li>依赖技术：必须支持802.11g及以上、安全必须支持WPA2、必须支持WMM（源自802.11e的QoS）、WSC为前置依赖</li><li>P2P特有技术项：必选三项为P2P Discovery（核心）、P2P Group Operation（GO管理Group的职责）、P2P PowerManagement（省电）；可选一项为Managed P2P Device Operation（企业级IT统一管理）</li></ul>", "backText": "三个组件（\"一个设备，两种角色\"）：P2P Device（角色实体，即Wi-Fi设备）、P2P Group Owner（GO，类似Infrastructure BSS中的AP）、P2P Client（类似STA）; P2P技术模仿Infrastructure BSS：组建Group前均为P2P Device；协商完成后有且只有一个Device扮演GO，其余扮演Client; 一个P2P Group只能有一个GO，可支持1∶n个Client连接；周围不支持P2P的STA（Legacy Client）也可发现并关联GO（但不能处理P2P协议特有功能）; 建Group流程与Infrastructure BSS类似：先通过WSC获取安全配置信息，Client再用协商好的安全设置关联GO（RSNA流程，含4-Way Handshake）; 依赖技术：必须支持802.11g及以上、安全必须支持WPA2、必须支持WMM（源自802.11e的QoS）、WSC为前置依赖; P2P特有技术项：必选三项为P2P Discovery（核心）、P2P Group Operation（GO管理Group的职责）、P2P PowerManagement（省电）；可选一项为Managed P2P Device Operation（企业级IT统一管理）"}, {"id": "c626", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "P2P技术模仿Infrastructure BSS", "back": "<div class=\"def-ans\">组建Group前均为P2P Device；协商完成后有且只有一个Device扮演GO，其余扮演Client</div>", "backText": "组建Group前均为P2P Device；协商完成后有且只有一个Device扮演GO，其余扮演Client"}, {"id": "c627", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "建Group流程与Infrastructure BSS类似", "back": "<div class=\"def-ans\">先通过WSC获取安全配置信息，Client再用协商好的安全设置关联GO（RSNA流程，含4-Way Handshake）</div>", "backText": "先通过WSC获取安全配置信息，Client再用协商好的安全设置关联GO（RSNA流程，含4-Way Handshake）"}, {"id": "c628", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "依赖技术", "back": "<div class=\"def-ans\">必须支持802.11g及以上、安全必须支持WPA2、必须支持WMM（源自802.11e的QoS）、WSC为前置依赖</div>", "backText": "必须支持802.11g及以上、安全必须支持WPA2、必须支持WMM（源自802.11e的QoS）、WSC为前置依赖"}, {"id": "c629", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "P2P特有技术项", "back": "<div class=\"def-ans\">必选三项为P2P Discovery（核心）、P2P Group Operation（GO管理Group的职责）、P2P PowerManagement（省电）；可选一项为Managed P2P Device Operation（企业级IT统一管理）</div>", "backText": "必选三项为P2P Discovery（核心）、P2P Group Operation（GO管理Group的职责）、P2P PowerManagement（省电）；可选一项为Managed P2P Device Operation（企业级IT统一管理）"}, {"id": "c630", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "7.2.2 P2P Discovery技术", "back": "<ul class=\"ans-list\"><li>作用：使多个P2P Device互相发现并构建Group；包含四个子项：Device Discovery（搜索周围P2P设备）、Service Discovery（搜索指定服务，可选，类似Bonjour）、Group Formation（决定谁当GO谁当Client）、P2P Invitation（激活Persistent Group或邀请Client加入现有Group）</li><li>Group分两类：Temporary Group（临时，安全配置信息每次组建都变化）；Persistent Group（永久，GO由指定设备扮演如打印机，安全信息保存复用）</li><li>Device Discovery利用Probe Request/Response帧，但比Infrastructure BSS扫描复杂：P2P Device既要发Probe Request也要接收并回复Probe Response（BSS中只有AP回复）</li><li>两个状态：Search State（在2.4GHz的1、6、11频段即Social Channels上发送Probe Request，帧中必须含P2P IE）；Listen State（随机选定一个Listen Channel监听并回复，只处理含P2P IE的Probe Request）</li><li>两个阶段：Scan Phase（在所有频段发Probe Request做主动扫描，之后进入Find Phase）；Find Phase（在Search State和Listen State间来回切换）</li><li>Listen State时长为100TU的随机整数倍，随机化的目的是防止两设备同时进Listen/Search的\"Lock-Step怪圈\"</li><li>Probe Request帧要求：SSID必须为P2P Wildcard SSID\"DIRECT-\"；必须包含P2P IE（Vendor IE，Element ID=221，OUI=50-6F-9A-09，09代表P2P）；MAC头Address1为广播地址或目标P2P Device Address</li><li>两种地址：P2P Device Address（全局唯一，作用等同MAC地址，用于Discovery）；P2P Interface Address（加入Group后与成员交互使用，Group结束后作废）</li><li>P2P Capability属性：分Device Capability Bitmap和Group Capability Bitmap，每bit代表一种P2P特性；P2P Client Discoverability场景：已当Client的设备不回复Probe Response，由GO通过Device Discoverability Request/Response帧代答</li><li>Listen Channel属性字段：Country String、Operating Class（如81，2.407GHz起始、13频道、间隔25MHz）、Channel Number；另有含义不同的Operating Channel属性（设备当GO时Group工作的频段）</li><li>Probe Response帧含WSC IE和P2P IE，P2P IE中额外含P2P Device Info属性（含Primary Device Type、Config Methods、Device Name、P2P Device Address等）</li><li>Group Formation两阶段：GO Negotiation（协商谁做GO）；Provisioning（借助WSC交换安全配置信息，之后Client关联GO）</li><li>P2P Public Action帧：802.11管理帧Action帧，Frame Body含Category和Action Detail；P2P使用Category=4（Public）中Vendor Specific子类型及Category=127（Vendor Specific）</li><li>GO Negotiation（GON）三次帧交换：GON Request、GON Response、GON Confirmation，仅交换信息决定GO角色</li><li>GO Intent属性：Tie Breaker位（随机0/1，决胜因素）+ Intent值（0~15，15表示必须当GO，默认7）；比较规则：Intent大者当GO；Intent相同时Tie Breaker为1者当GO；双方Intent均为15则GON失败</li><li>GON Request其他属性：Configuration Timeout（单位10ms）；Channel List（Country String+各Operating Class的Channel信息）；Intended P2P Interface Address</li><li>Android中收到GON Request会弹出提示框，用户\"接受\"才继续Group Formation</li><li>GON Response属性：Status（0成功）；P2P Group ID（唯一标示Group，必须含P2P Device Address+SSID；SSID规则：开头\"DIRECT-xy\"，Android后接设备名如\"Android_4aa9\"）；只有将当GO的设备才在GON Response中包含P2P Group ID属性</li><li>Provision Discovery（PD）：为确定双方使用的WSC配置方法（Config Method属性，共13种方法）；含PD Request和PD Response两次交换；Response方支持则设置相同Config Method值，不支持则设0（发起方换一种方法重试）；PD另一作用是提前提醒用户执行WSC操作（如输入PIN码）</li><li>PD设计的动机：Group Formation（GON+Provisioning）要求15秒内完成，而WSC规范允许2分钟（需用户参与）；PD在Group Formation之前提前获取用户输入的安全信息</li><li>注意：Provision Discovery不属于Group Formation，是为加快Group Formation速度而设计</li></ul>", "backText": "作用：使多个P2P Device互相发现并构建Group；包含四个子项：Device Discovery（搜索周围P2P设备）、Service Discovery（搜索指定服务，可选，类似Bonjour）、Group Formation（决定谁当GO谁当Client）、P2P Invitation（激活Persistent Group或邀请Client加入现有Group）; Group分两类：Temporary Group（临时，安全配置信息每次组建都变化）；Persistent Group（永久，GO由指定设备扮演如打印机，安全信息保存复用）; Device Discovery利用Probe Request/Response帧，但比Infrastructure BSS扫描复杂：P2P Device既要发Probe Request也要接收并回复Probe Response（BSS中只有AP回复）; 两个状态：Search State（在2.4GHz的1、6、11频段即Social Channels上发送Probe Request，帧中必须含P2P IE）；Listen State（随机选定一个Listen Channel监听并回复，只处理含P2P IE的Probe Request）; 两个阶段：Scan Phase（在所有频段发Probe Request做主动扫描，之后进入Find Phase）；Find Phase（在Search State和Listen State间来回切换）; Listen State时长为100TU的随机整数倍，随机化的目的是防止两设备同时进Listen/Search的\"Lock-Step怪圈\""}, {"id": "c631", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "作用", "back": "<div class=\"def-ans\">使多个P2P Device互相发现并构建Group；包含四个子项：Device Discovery（搜索周围P2P设备）、Service Discovery（搜索指定服务，可选，类似Bonjour）、Group Formation（决定谁当GO谁当Client）、P2P Invitation（激活Persistent Group或邀请Client加入现有Group）</div>", "backText": "使多个P2P Device互相发现并构建Group；包含四个子项：Device Discovery（搜索周围P2P设备）、Service Discovery（搜索指定服务，可选，类似Bonjour）、Group Formation（决定谁当GO谁当Client）、P2P Invitation（激活Persistent Group或邀请Client加入现有Group）"}, {"id": "c632", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "Group分两类", "back": "<div class=\"def-ans\">Temporary Group（临时，安全配置信息每次组建都变化）；Persistent Group（永久，GO由指定设备扮演如打印机，安全信息保存复用）</div>", "backText": "Temporary Group（临时，安全配置信息每次组建都变化）；Persistent Group（永久，GO由指定设备扮演如打印机，安全信息保存复用）"}, {"id": "c633", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "两个状态", "back": "<div class=\"def-ans\">Search State（在2.4GHz的1、6、11频段即Social Channels上发送Probe Request，帧中必须含P2P IE）；Listen State（随机选定一个Listen Channel监听并回复，只处理含P2P IE的Probe Request）</div>", "backText": "Search State（在2.4GHz的1、6、11频段即Social Channels上发送Probe Request，帧中必须含P2P IE）；Listen State（随机选定一个Listen Channel监听并回复，只处理含P2P IE的Probe Request）"}, {"id": "c634", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "两个阶段", "back": "<div class=\"def-ans\">Scan Phase（在所有频段发Probe Request做主动扫描，之后进入Find Phase）；Find Phase（在Search State和Listen State间来回切换）</div>", "backText": "Scan Phase（在所有频段发Probe Request做主动扫描，之后进入Find Phase）；Find Phase（在Search State和Listen State间来回切换）"}, {"id": "c635", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "Probe Request帧要求", "back": "<div class=\"def-ans\">SSID必须为P2P Wildcard SSID\"DIRECT-\"；必须包含P2P IE（Vendor IE，Element ID=221，OUI=50-6F-9A-09，09代表P2P）；MAC头Address1为广播地址或目标P2P Device Address</div>", "backText": "SSID必须为P2P Wildcard SSID\"DIRECT-\"；必须包含P2P IE（Vendor IE，Element ID=221，OUI=50-6F-9A-09，09代表P2P）；MAC头Address1为广播地址或目标P2P Device Address"}, {"id": "c636", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "两种地址", "back": "<div class=\"def-ans\">P2P Device Address（全局唯一，作用等同MAC地址，用于Discovery）；P2P Interface Address（加入Group后与成员交互使用，Group结束后作废）</div>", "backText": "P2P Device Address（全局唯一，作用等同MAC地址，用于Discovery）；P2P Interface Address（加入Group后与成员交互使用，Group结束后作废）"}, {"id": "c637", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "P2P Capability属性", "back": "<div class=\"def-ans\">分Device Capability Bitmap和Group Capability Bitmap，每bit代表一种P2P特性；P2P Client Discoverability场景：已当Client的设备不回复Probe Response，由GO通过Device Discoverability Request/Response帧代答</div>", "backText": "分Device Capability Bitmap和Group Capability Bitmap，每bit代表一种P2P特性；P2P Client Discoverability场景：已当Client的设备不回复Probe Response，由GO通过Device Discoverability Request/Response帧代答"}, {"id": "c638", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "Listen Channel属性字段", "back": "<div class=\"def-ans\">Country String、Operating Class（如81，2.407GHz起始、13频道、间隔25MHz）、Channel Number；另有含义不同的Operating Channel属性（设备当GO时Group工作的频段）</div>", "backText": "Country String、Operating Class（如81，2.407GHz起始、13频道、间隔25MHz）、Channel Number；另有含义不同的Operating Channel属性（设备当GO时Group工作的频段）"}, {"id": "c639", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "Group Formation两阶段", "back": "<div class=\"def-ans\">GO Negotiation（协商谁做GO）；Provisioning（借助WSC交换安全配置信息，之后Client关联GO）</div>", "backText": "GO Negotiation（协商谁做GO）；Provisioning（借助WSC交换安全配置信息，之后Client关联GO）"}, {"id": "c640", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "P2P Public Action帧", "back": "<div class=\"def-ans\">802.11管理帧Action帧，Frame Body含Category和Action Detail；P2P使用Category=4（Public）中Vendor Specific子类型及Category=127（Vendor Specific）</div>", "backText": "802.11管理帧Action帧，Frame Body含Category和Action Detail；P2P使用Category=4（Public）中Vendor Specific子类型及Category=127（Vendor Specific）"}, {"id": "c641", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "GO Negotiation（GON）三次帧交换", "back": "<div class=\"def-ans\">GON Request、GON Response、GON Confirmation，仅交换信息决定GO角色</div>", "backText": "GON Request、GON Response、GON Confirmation，仅交换信息决定GO角色"}, {"id": "c642", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "GO Intent属性", "back": "<div class=\"def-ans\">Tie Breaker位（随机0/1，决胜因素）+ Intent值（0~15，15表示必须当GO，默认7）；比较规则：Intent大者当GO；Intent相同时Tie Breaker为1者当GO；双方Intent均为15则GON失败</div>", "backText": "Tie Breaker位（随机0/1，决胜因素）+ Intent值（0~15，15表示必须当GO，默认7）；比较规则：Intent大者当GO；Intent相同时Tie Breaker为1者当GO；双方Intent均为15则GON失败"}, {"id": "c643", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "GON Request其他属性", "back": "<div class=\"def-ans\">Configuration Timeout（单位10ms）；Channel List（Country String+各Operating Class的Channel信息）；Intended P2P Interface Address</div>", "backText": "Configuration Timeout（单位10ms）；Channel List（Country String+各Operating Class的Channel信息）；Intended P2P Interface Address"}, {"id": "c644", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "GON Response属性", "back": "<div class=\"def-ans\">Status（0成功）；P2P Group ID（唯一标示Group，必须含P2P Device Address+SSID；SSID规则：开头\"DIRECT-xy\"，Android后接设备名如\"Android_4aa9\"）；只有将当GO的设备才在GON Response中包含P2P Group ID属性</div>", "backText": "Status（0成功）；P2P Group ID（唯一标示Group，必须含P2P Device Address+SSID；SSID规则：开头\"DIRECT-xy\"，Android后接设备名如\"Android_4aa9\"）；只有将当GO的设备才在GON Response中包含P2P Group ID属性"}, {"id": "c645", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "Provision Discovery（PD）", "back": "<div class=\"def-ans\">为确定双方使用的WSC配置方法（Config Method属性，共13种方法）；含PD Request和PD Response两次交换；Response方支持则设置相同Config Method值，不支持则设0（发起方换一种方法重试）；PD另一作用是提前提醒用户执行WSC操作（如输入PIN码）</div>", "backText": "为确定双方使用的WSC配置方法（Config Method属性，共13种方法）；含PD Request和PD Response两次交换；Response方支持则设置相同Config Method值，不支持则设0（发起方换一种方法重试）；PD另一作用是提前提醒用户执行WSC操作（如输入PIN码）"}, {"id": "c646", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "PD设计的动机", "back": "<div class=\"def-ans\">Group Formation（GON+Provisioning）要求15秒内完成，而WSC规范允许2分钟（需用户参与）；PD在Group Formation之前提前获取用户输入的安全信息</div>", "backText": "Group Formation（GON+Provisioning）要求15秒内完成，而WSC规范允许2分钟（需用户参与）；PD在Group Formation之前提前获取用户输入的安全信息"}, {"id": "c647", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "注意", "back": "<div class=\"def-ans\">Provision Discovery不属于Group Formation，是为加快Group Formation速度而设计</div>", "backText": "Provision Discovery不属于Group Formation，是为加快Group Formation速度而设计"}, {"id": "c648", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "7.2.3 P2P工作流程", "back": "<ul class=\"ans-list\"><li>P2P规范附录A用状态机描述整体工作流程：三大阶段Find Phase、Group Formation Procedure、Operational Phase</li><li>Group Formation Procedure阶段含三个状态：GON、WSC Provisioning Registrar、WSC Provisioning Enrollee</li><li>Search状态含两个子状态：Search子状态及Service Discovery子状态（后者为可选）</li><li>每个状态有Entry Action（EA）、Exit Action（EXA）和Internal Behavior</li><li>状态流转：初始Off→Scan；Find Phase含Listen和Search两状态；Group Formation含GON及WSC Provisioning两状态；Operational Phase含P2P GO和P2P Client两状态</li></ul>", "backText": "P2P规范附录A用状态机描述整体工作流程：三大阶段Find Phase、Group Formation Procedure、Operational Phase; Group Formation Procedure阶段含三个状态：GON、WSC Provisioning Registrar、WSC Provisioning Enrollee; Search状态含两个子状态：Search子状态及Service Discovery子状态（后者为可选）; 每个状态有Entry Action（EA）、Exit Action（EXA）和Internal Behavior; 状态流转：初始Off→Scan；Find Phase含Listen和Search两状态；Group Formation含GON及WSC Provisioning两状态；Operational Phase含P2P GO和P2P Client两状态"}, {"id": "c649", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "P2P规范附录A用状态机描述整体工作流程", "back": "<div class=\"def-ans\">三大阶段Find Phase、Group Formation Procedure、Operational Phase</div>", "backText": "三大阶段Find Phase、Group Formation Procedure、Operational Phase"}, {"id": "c650", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "Search状态含两个子状态", "back": "<div class=\"def-ans\">Search子状态及Service Discovery子状态（后者为可选）</div>", "backText": "Search子状态及Service Discovery子状态（后者为可选）"}, {"id": "c651", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.2 P2P基础知识", "front": "状态流转", "back": "<div class=\"def-ans\">初始Off→Scan；Find Phase含Listen和Search两状态；Group Formation含GON及WSC Provisioning两状态；Operational Phase含P2P GO和P2P Client两状态</div>", "backText": "初始Off→Scan；Find Phase含Listen和Search两状态；Group Formation含GON及WSC Provisioning两状态；Operational Phase含P2P GO和P2P Client两状态"}, {"id": "c652", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "WifiP2pSettings", "back": "<div class=\"def-ans\">Settings应用中处理P2P UI/UE逻辑的主要类</div>", "backText": "Settings应用中处理P2P UI/UE逻辑的主要类"}, {"id": "c653", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "WifiP2pService", "back": "<div class=\"def-ans\">位于SystemServer进程中，与WifiP2pSettings交互；与第5章WifiService并列（WifiService管WLAN连接，WifiP2pService专管Wi-Fi P2P）</div>", "backText": "位于SystemServer进程中，与WifiP2pSettings交互；与第5章WifiService并列（WifiService管WLAN连接，WifiP2pService专管Wi-Fi P2P）"}, {"id": "c654", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "7.3.1 WifiP2pSettings工作流程", "back": "<ul class=\"ans-list\"><li>用户操作三步：进入WifiP2pSettings界面→搜索周围P2P设备→选择设备发起连接</li><li>onActivityCreated：加载R.xml.wifi_p2p_settings；注册监听P2P特有广播：WIFI_P2P_STATE_CHANGED_ACTION（P2P功能enable/disable）、WIFI_P2P_PEERS_CHANGED_ACTION（设备列表变化，需requestPeers重新获取）、WIFI_P2P_CONNECTION_CHANGED_ACTION（携带WifiP2pInfo和NetworkInfo）、WIFI_P2P_THIS_DEVICE_CHANGED_ACTION、WIFI_P2P_DISCOVERY_CHANGED_ACTION、WIFI_P2P_PERSISTENT_GROUPS_CHANGED_ACTION；getSystemService(WIFI_P2P_SERVICE)创建WifiP2pManager并initialize建立连接</li><li>WIFI_P2P_STATE_CHANGED_ACTION处理：使能SEARCH/RENAME按钮并调用requestPeers（回调PeerListener.onPeersAvailable返回WifiP2pDeviceList）</li><li>startSearch函数：调用WifiP2pManager.discoverPeers触发搜索；RENAME按钮更改本机P2P设备名</li><li>WIFI_P2P_DISCOVERY_CHANGED_ACTION处理：STARTED时按钮显示\"Searching...\"，否则显示\"Search For Devices\"</li><li>WIFI_P2P_PEERS_CHANGED_ACTION处理：requestPeers→onPeersAvailable回调，将每个WifiP2pDevice包装为WifiP2pPeer（Preference子类）加入mPeersGroup显示</li><li>onPreferenceTreeClick：已连接弹DIALOG_DISCONNECT，INVITED弹DIALOG_CANCEL_CONNECT，否则构造WifiP2pConfig（deviceAddress+wps.setup，WSC方法优先级PBC→KEYPAD→DISPLAY）调用WifiP2pManager.connect发起连接</li><li>WIFI_P2P_CONNECTION_CHANGED_ACTION处理：requestGroupInfo（回调GroupInfoListener.onGroupInfoAvailable保存WifiP2pGroup并更新UI）；NetworkInfo未连接则重新startSearch</li><li>关键API：initialize（经AsyncChannel与WifiP2pService建立交互）、discoverPeers、requestPeers、connect、requestGroupInfo；重要数据结构WifiP2pDevice、WifiP2pGroup</li></ul>", "backText": "用户操作三步：进入WifiP2pSettings界面→搜索周围P2P设备→选择设备发起连接; onActivityCreated：加载R.xml.wifi_p2p_settings；注册监听P2P特有广播：WIFI_P2P_STATE_CHANGED_ACTION（P2P功能enable/disable）、WIFI_P2P_PEERS_CHANGED_ACTION（设备列表变化，需requestPeers重新获取）、WIFI_P2P_CONNECTION_CHANGED_ACTION（携带WifiP2pInfo和NetworkInfo）、WIFI_P2P_THIS_DEVICE_CHANGED_ACTION、WIFI_P2P_DISCOVERY_CHANGED_ACTION、WIFI_P2P_PERSISTENT_GROUPS_CHANGED_ACTION；getSystemService(WIFI_P2P_SERVICE)创建WifiP2pManager并initialize建立连接; WIFI_P2P_STATE_CHANGED_ACTION处理：使能SEARCH/RENAME按钮并调用requestPeers（回调PeerListener.onPeersAvailable返回WifiP2pDeviceList）; startSearch函数：调用WifiP2pManager.discoverPeers触发搜索；RENAME按钮更改本机P2P设备名; WIFI_P2P_DISCOVERY_CHANGED_ACTION处理：STARTED时按钮显示\"Searching...\"，否则显示\"Search For Devices\"; WIFI_P2P_PEERS_CHANGED_ACTION处理：requestPeers→onPeersAvailable回调，将每个WifiP2pDevice包装为WifiP2pPeer（Preference子类）加入mPeersGroup显示"}, {"id": "c655", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "用户操作三步", "back": "<div class=\"def-ans\">进入WifiP2pSettings界面→搜索周围P2P设备→选择设备发起连接</div>", "backText": "进入WifiP2pSettings界面→搜索周围P2P设备→选择设备发起连接"}, {"id": "c656", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "onActivityCreated", "back": "<div class=\"def-ans\">加载R.xml.wifi_p2p_settings；注册监听P2P特有广播：WIFI_P2P_STATE_CHANGED_ACTION（P2P功能enable/disable）、WIFI_P2P_PEERS_CHANGED_ACTION（设备列表变化，需requestPeers重新获取）、WIFI_P2P_CONNECTION_CHANGED_ACTION（携带WifiP2pInfo和NetworkInfo）、WIFI_P2P_THIS_DEVICE_CHANGED_ACTION、WIFI_P2P_DISCOVERY_CHANGED_ACTION、WIFI_P2P_PERSISTENT_GROUPS_CHANGED_ACTION；getSystemService(WIFI_P2P_SERVICE)创建WifiP2pManager并initialize建立连接</div>", "backText": "加载R.xml.wifi_p2p_settings；注册监听P2P特有广播：WIFI_P2P_STATE_CHANGED_ACTION（P2P功能enable/disable）、WIFI_P2P_PEERS_CHANGED_ACTION（设备列表变化，需requestPeers重新获取）、WIFI_P2P_CONNECTION_CHANGED_ACTION（携带WifiP2pInfo和NetworkInfo）、WIFI_P2P_THIS_DEVICE_CHANGED_ACTION、WIFI_P2P_DISCOVERY_CHANGED_ACTION、WIFI_P2P_PERSISTENT_GROUPS_CHANGED_ACTION；getSystemService(WIFI_P2P_SERVICE)创建WifiP2pManager并initialize建立连接"}, {"id": "c657", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "startSearch函数", "back": "<div class=\"def-ans\">调用WifiP2pManager.discoverPeers触发搜索；RENAME按钮更改本机P2P设备名</div>", "backText": "调用WifiP2pManager.discoverPeers触发搜索；RENAME按钮更改本机P2P设备名"}, {"id": "c658", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "onPreferenceTreeClick", "back": "<div class=\"def-ans\">已连接弹DIALOG_DISCONNECT，INVITED弹DIALOG_CANCEL_CONNECT，否则构造WifiP2pConfig（deviceAddress+wps.setup，WSC方法优先级PBC→KEYPAD→DISPLAY）调用WifiP2pManager.connect发起连接</div>", "backText": "已连接弹DIALOG_DISCONNECT，INVITED弹DIALOG_CANCEL_CONNECT，否则构造WifiP2pConfig（deviceAddress+wps.setup，WSC方法优先级PBC→KEYPAD→DISPLAY）调用WifiP2pManager.connect发起连接"}, {"id": "c659", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "关键API", "back": "<div class=\"def-ans\">initialize（经AsyncChannel与WifiP2pService建立交互）、discoverPeers、requestPeers、connect、requestGroupInfo；重要数据结构WifiP2pDevice、WifiP2pGroup</div>", "backText": "initialize（经AsyncChannel与WifiP2pService建立交互）、discoverPeers、requestPeers、connect、requestGroupInfo；重要数据结构WifiP2pDevice、WifiP2pGroup"}, {"id": "c660", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "7.3.2 WifiP2pService工作流程", "back": "<ul class=\"ans-list\"><li>构造函数：P2P虚拟网络接口名\"p2p0\"；NetworkInfo类型TYPE_WIFI_P2P；hasSystemFeature(FEATURE_WIFI_DIRECT)判断是否支持；默认primaryDeviceType\"10-0050F204-5\"（Telephone类）；核心工作由内部状态机P2pStateMachine完成</li><li>P2pStateMachine共15个状态；p2pSupported时初始状态为P2pDisabledState，否则P2pNotSupportedState；层级关系根为DefaultState</li><li>CMD_ENABLE_P2P处理（P2pDisabledState）：来自WifiStateMachine（DriverStartedState的EA经mWifiP2pChannel发送）；mNwService.setInterfaceUp(\"p2p0\")；WifiMonitor.startMonitoring()连接wpa_supplicant；转入P2pEnablingState</li><li>SUP_CONNECTION_EVENT处理（P2pEnablingState）：转入InactiveState；其父状态P2pEnabledState的EA发送WIFI_P2P_STATE_CHANGED_ACTION（STATE_ENABLED）、WIFI_P2P_CONNECTION_CHANGED_ACTION广播，并调用initializeP2pSettings</li><li>initializeP2pSettings：setPersistentReconnect(true)；getPersistedDeviceName（查settings.db secure表wifi_p2p_device_name字段，缺省取android_id前4字符加\"Android_\"前缀）；setDeviceName、setP2pSsidPostfix、setDeviceType、setConfigMethods、setConcurrencyPriority(\"sta\")（STA优先于P2P）、p2pGetDeviceAddress、updateThisDevice(AVAILABLE)、p2pFlush、updatePersistentNetworks(RELOAD)（mGroups类型WifiP2pGroupList保存Group信息）</li><li>DISCOVER_PEERS处理（P2pEnabledState）：发送\"P2P_FIND 120\"给WPAS，成功则回复DISCOVER_PEERS_SUCCEEDED并发WIFI_P2P_DISCOVERY_CHANGED_ACTION广播</li><li>P2P_DEVICE_FOUND_EVENT处理（P2pEnabledState）：WifiMonitor按WPAS的P2P-DEVICE-FOUND消息构建WifiP2pDevice；本机设备跳过；mPeers.update加入/更新WifiP2pDeviceList，发WIFI_P2P_PEERS_CHANGED_ACTION广播</li><li>CONNECT处理（InactiveState）：取WifiP2pConfig；mAutonomousGroup=false；调connect(config, TRY_REINVOCATION=true)；更新对端status为INVITED；connectRet==NEEDS_PROVISION_REQ则转ProvisionDiscoveryState，否则转GroupNegotiationState</li><li>connect函数：保存mSavedPeerConfig；join=对端isGroupOwner()（结合isGroupLimit、p2pGetSsid、mGroups.getNetworkId判断）；join为false时若tryInvocation且isInvitationCapable则查Persistent Group，netId&gt;=0时p2pReinvoke重启Persistent Group；p2pStopFind</li><li>ProvisionDiscoveryState EA：mWifiNative.p2pProvisionDiscovery(mSavedPeerConfig)发送PD Request；PBC场景对端收到P2P_PROV_DISC_PBC_REQ_EVENT、本机收P2P_PROV_DISC_PBC_RSP_EVENT</li><li>P2P_PROV_DISC_PBC_RSP_EVENT处理：校验deviceAddress，wps.setup==WpsInfo.PBC时调p2pConnectWithPinDisplay（内部触发WPAS发GON Request，对端弹提示框），转入GroupNegotiationState</li><li>P2P_GROUP_STARTED_EVENT处理（GroupNegotiationState）：保存WifiP2pGroup；本机是GO则startDhcpServer（dnsmasq）；否则创建DhcpStateMachine并CMD_START_DHCP获取IP、更新GO状态为CONNECTED；转入GroupCreatedState</li><li>GroupCreatedState EA：NetworkInfo置CONNECTED、updateThisDevice(CONNECTED)；GO时setWifiP2pInfoOnGroupFormation(SERVER_ADDRESS=\"192.168.49.1\")并发WIFI_P2P_CONNECTION_CHANGED_ACTION广播</li><li>AP_STA_CONNECTED_EVENT处理（GroupCreatedState）：P2P Client关联上本机GO时mGroup.addClient(deviceAddress)、mPeers.updateStatus(CONNECTED)、发WIFI_P2P_PEERS_CHANGED_ACTION广播</li><li>工作流程总结（9步）：CMD_ENABLE_P2P→SUP_CONNECTION_EVENT→P2pEnabledState初始化→DISCOVER_PEERS→P2P_DEVICE_FOUND_EVENT→CONNECT→ProvisionDiscoveryState（PD流程→GroupNegotiationState）→P2P_GROUP_STARTED_EVENT（GO启DhcpServer）→AP_STA_CONNECTED_EVENT</li></ul>", "backText": "构造函数：P2P虚拟网络接口名\"p2p0\"；NetworkInfo类型TYPE_WIFI_P2P；hasSystemFeature(FEATURE_WIFI_DIRECT)判断是否支持；默认primaryDeviceType\"10-0050F204-5\"（Telephone类）；核心工作由内部状态机P2pStateMachine完成; P2pStateMachine共15个状态；p2pSupported时初始状态为P2pDisabledState，否则P2pNotSupportedState；层级关系根为DefaultState; CMD_ENABLE_P2P处理（P2pDisabledState）：来自WifiStateMachine（DriverStartedState的EA经mWifiP2pChannel发送）；mNwService.setInterfaceUp(\"p2p0\")；WifiMonitor.startMonitoring()连接wpa_supplicant；转入P2pEnablingState; SUP_CONNECTION_EVENT处理（P2pEnablingState）：转入InactiveState；其父状态P2pEnabledState的EA发送WIFI_P2P_STATE_CHANGED_ACTION（STATE_ENABLED）、WIFI_P2P_CONNECTION_CHANGED_ACTION广播，并调用initializeP2pSettings; initializeP2pSettings：setPersistentReconnect(true)；getPersistedDeviceName（查settings.db secure表wifi_p2p_device_name字段，缺省取android_id前4字符加\"Android_\"前缀）；setDeviceName、setP2pSsidPostfix、setDeviceType、setConfigMethods、setConcurrencyPriority(\"sta\")（STA优先于P2P）、p2pGetDeviceAddress、updateThisDevice(AVAILABLE)、p2pFlush、updatePersistentNetworks(RELOAD)（mGroups类型WifiP2pGroupList保存Group信息）; DISCOVER_PEERS处理（P2pEnabledState）：发送\"P2P_FIND 120\"给WPAS，成功则回复DISCOVER_PEERS_SUCCEEDED并发WIFI_P2P_DISCOVERY_CHANGED_ACTION广播"}, {"id": "c661", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "构造函数", "back": "<div class=\"def-ans\">P2P虚拟网络接口名\"p2p0\"；NetworkInfo类型TYPE_WIFI_P2P；hasSystemFeature(FEATURE_WIFI_DIRECT)判断是否支持；默认primaryDeviceType\"10-0050F204-5\"（Telephone类）；核心工作由内部状态机P2pStateMachine完成</div>", "backText": "P2P虚拟网络接口名\"p2p0\"；NetworkInfo类型TYPE_WIFI_P2P；hasSystemFeature(FEATURE_WIFI_DIRECT)判断是否支持；默认primaryDeviceType\"10-0050F204-5\"（Telephone类）；核心工作由内部状态机P2pStateMachine完成"}, {"id": "c662", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.3 WifiP2pSettings和WifiP2pService介绍", "front": "initializeP2pSettings", "back": "<div class=\"def-ans\">setPersistentReconnect(true)；getPersistedDeviceName（查settings.db secure表wifi_p2p_device_name字段，缺省取android_id前4字符加\"Android_\"前缀）；setDeviceName、setP2pSsidPostfix、setDeviceType、setConfigMethods、setConcurrencyPriority(\"sta\")（STA优先于P2P）、p2pGetDeviceAddress、updateThisDevice(AVAILABLE)、p2pFlush、updatePersistentNetworks(REL
