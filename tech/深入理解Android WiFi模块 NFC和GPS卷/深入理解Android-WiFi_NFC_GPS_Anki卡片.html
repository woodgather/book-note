vice设计数据结构，仅通信机制（netlink vs ioctl）不同</li></ul>", "backText": "流程：nlmsg_alloc分配消息→nl80211_cmd（genlmsg_put，命令为NL80211_CMD_TRIGGER_SCAN）→nla_put_u32设置NL80211_ATTR_IFINDEX→nla_put_nested嵌套NL80211_ATTR_SCAN_SSIDS→send_and_recv_msgs发送; nl80211_copy.h定义94条命令与155条属性，注释详细; nl80211与wext本质无大区别：都围绕MAC层service设计数据结构，仅通信机制（netlink vs ioctl）不同"}, {"id": "c300", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "流程", "back": "<div class=\"def-ans\">nlmsg_alloc分配消息→nl80211_cmd（genlmsg_put，命令为NL80211_CMD_TRIGGER_SCAN）→nla_put_u32设置NL80211_ATTR_IFINDEX→nla_put_nested嵌套NL80211_ATTR_SCAN_SSIDS→send_and_recv_msgs发送</div>", "backText": "nlmsg_alloc分配消息→nl80211_cmd（genlmsg_put，命令为NL80211_CMD_TRIGGER_SCAN）→nla_put_u32设置NL80211_ATTR_IFINDEX→nla_put_nested嵌套NL80211_ATTR_SCAN_SSIDS→send_and_recv_msgs发送"}, {"id": "c301", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "nl80211与wext本质无大区别", "back": "<div class=\"def-ans\">都围绕MAC层service设计数据结构，仅通信机制（netlink vs ioctl）不同</div>", "backText": "都围绕MAC层service设计数据结构，仅通信机制（netlink vs ioctl）不同"}, {"id": "c302", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.5 本章总结和参考资料说明", "front": "全章逻辑", "back": "<div class=\"def-ans\">无线频谱与802.11发展历程 → OSI/RM及Entity/SAP/MIB基本概念 → 802.11组件、网络结构与服务 → MAC帧格式与MLME（理解后续wpa_supplicant的核心）→ 安全性 → Linux Wi-Fi API（wext简单易上手，nl80211使用最多）</div>", "backText": "无线频谱与802.11发展历程 → OSI/RM及Entity/SAP/MIB基本概念 → 802.11组件、网络结构与服务 → MAC帧格式与MLME（理解后续wpa_supplicant的核心）→ 安全性 → Linux Wi-Fi API（wext简单易上手，nl80211使用最多）"}, {"id": "c303", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.5 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">《Real 802.11 Security》；《802.11无线网络权威指南（第2版）》（802.11书籍的\"圣经\"）；《802.11-2012》官方规范；ISO/IEC 7498-1（OSI模型）、ISO/IEC 8802-2（LLC）、IEEE 802.1X-2010；RFC3748（EAP）；Linux Wireless官网；libnl官网；微软\"How 802.11 Wireless Works\"</div>", "backText": "《Real 802.11 Security》；《802.11无线网络权威指南（第2版）》（802.11书籍的\"圣经\"）；《802.11-2012》官方规范；ISO/IEC 7498-1（OSI模型）、ISO/IEC 8802-2（LLC）、IEEE 802.1X-2010；RFC3748（EAP）；Linux Wireless官网；libnl官网；微软\"How 802.11 Wireless Works\""}, {"id": "c304", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "wpa_supplicant（简称WPAS）", "back": "<div class=\"def-ans\">开源项目，实现Station对无线网络的管理与控制；官方地址 hostap.epitest.fi</div>", "backText": "开源项目，实现Station对无线网络的管理与控制；官方地址 hostap.epitest.fi"}, {"id": "c305", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "安全功能", "back": "<div class=\"def-ans\">支持WPA/WPA2（WPA-PSK个人版、WPA-Enterprise/RADIUS）、CCMP/TKIP/WEP104/WEP40加密、PMKSA缓存与预认证、802.11r（Fast Transition快速BSS切换）、802.11w（管理帧保护）、WPS/P2P/TDLS</div>", "backText": "支持WPA/WPA2（WPA-PSK个人版、WPA-Enterprise/RADIUS）、CCMP/TKIP/WEP104/WEP40加密、PMKSA缓存与预认证、802.11r（Fast Transition快速BSS切换）、802.11w（管理帧保护）、WPS/P2P/TDLS"}, {"id": "c306", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "EAP支持", "back": "<div class=\"def-ans\">多达25种EAP Method，如EAP-TLS、EAP-PEAP、EAP-TTLS、EAP-SIM等</div>", "backText": "多达25种EAP Method，如EAP-TLS、EAP-PEAP、EAP-TTLS、EAP-SIM等"}, {"id": "c307", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "驱动支持", "back": "<div class=\"def-ans\">nl80211/cfg80211、Linux Wireless Extension（V19以后）、Windows NDIS</div>", "backText": "nl80211/cfg80211、Linux Wireless Extension（V19以后）、Windows NDIS"}, {"id": "c308", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "Android中的位置", "back": "<div class=\"def-ans\">Android 4.1的external下有wpa_supplicant_6与wpa_supplicant_8；本书分析wpa_supplicant_8</div>", "backText": "Android 4.1的external下有wpa_supplicant_6与wpa_supplicant_8；本书分析wpa_supplicant_8"}, {"id": "c309", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "wpa_supplicant_8三个主要子目录", "back": "<div class=\"def-ans\">hostapd（Soft AP模式）、wpa_supplicant（Station模式，本书重点）、src（公共代码）</div>", "backText": "hostapd（Soft AP模式）、wpa_supplicant（Station模式，本书重点）、src（公共代码）"}, {"id": "c310", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "本章两条分析路线", "back": "<div class=\"def-ans\">路线一为初始化流程（了解数据结构及关系）；路线二为命令行发送命令使手机加入WPA-PSK网络（了解命令处理、scan、association、4-Way Handshake）</div>", "backText": "路线一为初始化流程（了解数据结构及关系）；路线二为命令行发送命令使手机加入WPA-PSK网络（了解命令处理、scan、association、4-Way Handshake）"}, {"id": "c311", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.1 概述", "front": "注意区分", "back": "<div class=\"def-ans\">wpa_supplicant既指程序，也是核心数据结构名</div>", "backText": "wpa_supplicant既指程序，也是核心数据结构名"}, {"id": "c312", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "4.2.1 wpa_supplicant架构", "back": "<ul class=\"ans-list\"><li>规模：500多个文件、约20万行代码</li><li>event loop模块：WPAS基于事件驱动，无多线程，所有事件处理在主线程完成</li><li>driver i/f模块：隔离driver wrapper（如wext、ndiswrapper、nl80211），使其他模块与平台/驱动无关</li><li>driver events：driver wrapper通过事件方式向WPAS上层反馈信息</li><li>状态机：RFC4137定义EAP状态机、802.1X定义EAPOL状态机，WPAS分别实现，另有自有的WPA/WPA2状态机</li><li>EAP method模块、TLS模块、crypto模块支持各EAP方法</li><li>l2_packet模块：收发EAPOL/EAP消息（属LLC层数据）</li><li>configuration模块：处理大量配置参数</li><li>ctrl i/f模块：C/S结构Server端接口；Linux/UNIX下用Unix域socket，客户端有wpa_cli（命令行）、wpa_gui（Qt）</li></ul>", "backText": "规模：500多个文件、约20万行代码; event loop模块：WPAS基于事件驱动，无多线程，所有事件处理在主线程完成; driver i/f模块：隔离driver wrapper（如wext、ndiswrapper、nl80211），使其他模块与平台/驱动无关; driver events：driver wrapper通过事件方式向WPAS上层反馈信息; 状态机：RFC4137定义EAP状态机、802.1X定义EAPOL状态机，WPAS分别实现，另有自有的WPA/WPA2状态机; EAP method模块、TLS模块、crypto模块支持各EAP方法"}, {"id": "c313", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "规模", "back": "<div class=\"def-ans\">500多个文件、约20万行代码</div>", "backText": "500多个文件、约20万行代码"}, {"id": "c314", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "event loop模块", "back": "<div class=\"def-ans\">WPAS基于事件驱动，无多线程，所有事件处理在主线程完成</div>", "backText": "WPAS基于事件驱动，无多线程，所有事件处理在主线程完成"}, {"id": "c315", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "driver i/f模块", "back": "<div class=\"def-ans\">隔离driver wrapper（如wext、ndiswrapper、nl80211），使其他模块与平台/驱动无关</div>", "backText": "隔离driver wrapper（如wext、ndiswrapper、nl80211），使其他模块与平台/驱动无关"}, {"id": "c316", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "driver events", "back": "<div class=\"def-ans\">driver wrapper通过事件方式向WPAS上层反馈信息</div>", "backText": "driver wrapper通过事件方式向WPAS上层反馈信息"}, {"id": "c317", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "状态机", "back": "<div class=\"def-ans\">RFC4137定义EAP状态机、802.1X定义EAPOL状态机，WPAS分别实现，另有自有的WPA/WPA2状态机</div>", "backText": "RFC4137定义EAP状态机、802.1X定义EAPOL状态机，WPAS分别实现，另有自有的WPA/WPA2状态机"}, {"id": "c318", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "l2_packet模块", "back": "<div class=\"def-ans\">收发EAPOL/EAP消息（属LLC层数据）</div>", "backText": "收发EAPOL/EAP消息（属LLC层数据）"}, {"id": "c319", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "configuration模块", "back": "<div class=\"def-ans\">处理大量配置参数</div>", "backText": "处理大量配置参数"}, {"id": "c320", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "ctrl i/f模块", "back": "<div class=\"def-ans\">C/S结构Server端接口；Linux/UNIX下用Unix域socket，客户端有wpa_cli（命令行）、wpa_gui（Qt）</div>", "backText": "C/S结构Server端接口；Linux/UNIX下用Unix域socket，客户端有wpa_cli（命令行）、wpa_gui（Qt）"}, {"id": "c321", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "4.2.2 wpa_supplicant编译配置", "back": "<ul class=\"ans-list\"><li>编译环境：source build/envsetup、lunch（选full-eng）</li><li>BoardConfig.mk关键配置：WPA_SUPPLICANT_VERSION=VER_0_8_X、BOARD_WPA_SUPPLICANT_DRIVER=NL80211、BOARD_WLAN_DEVICE=bcmdhd、BOARD_WPA_SUPPLICANT_PRIVATE_LIB=lib_driver_cmd_bcmdhd</li><li>android.cfg（编译配置文件）：CONFIG_DRIVER_WEXT、CONFIG_DRIVER_NL80211、CONFIG_LIBNL20等；与BoardConfig.mk重复时后者优先级高</li><li>编译步骤：先mmm编lib_driver_cmd_bcmdhd静态库，再mmm external/wpa_supplicant_8（同时生成wpa_cli）</li><li>部署：替换/system/bin/wpa_supplicant并chmod 0755，wpa_cli push到/system/bin</li></ul>", "backText": "编译环境：source build/envsetup、lunch（选full-eng）; BoardConfig.mk关键配置：WPA_SUPPLICANT_VERSION=VER_0_8_X、BOARD_WPA_SUPPLICANT_DRIVER=NL80211、BOARD_WLAN_DEVICE=bcmdhd、BOARD_WPA_SUPPLICANT_PRIVATE_LIB=lib_driver_cmd_bcmdhd; android.cfg（编译配置文件）：CONFIG_DRIVER_WEXT、CONFIG_DRIVER_NL80211、CONFIG_LIBNL20等；与BoardConfig.mk重复时后者优先级高; 编译步骤：先mmm编lib_driver_cmd_bcmdhd静态库，再mmm external/wpa_supplicant_8（同时生成wpa_cli）; 部署：替换/system/bin/wpa_supplicant并chmod 0755，wpa_cli push到/system/bin"}, {"id": "c322", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "编译环境", "back": "<div class=\"def-ans\">source build/envsetup、lunch（选full-eng）</div>", "backText": "source build/envsetup、lunch（选full-eng）"}, {"id": "c323", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "BoardConfig.mk关键配置", "back": "<div class=\"def-ans\">WPA_SUPPLICANT_VERSION=VER_0_8_X、BOARD_WPA_SUPPLICANT_DRIVER=NL80211、BOARD_WLAN_DEVICE=bcmdhd、BOARD_WPA_SUPPLICANT_PRIVATE_LIB=lib_driver_cmd_bcmdhd</div>", "backText": "WPA_SUPPLICANT_VERSION=VER_0_8_X、BOARD_WPA_SUPPLICANT_DRIVER=NL80211、BOARD_WLAN_DEVICE=bcmdhd、BOARD_WPA_SUPPLICANT_PRIVATE_LIB=lib_driver_cmd_bcmdhd"}, {"id": "c324", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "android.cfg（编译配置文件）", "back": "<div class=\"def-ans\">CONFIG_DRIVER_WEXT、CONFIG_DRIVER_NL80211、CONFIG_LIBNL20等；与BoardConfig.mk重复时后者优先级高</div>", "backText": "CONFIG_DRIVER_WEXT、CONFIG_DRIVER_NL80211、CONFIG_LIBNL20等；与BoardConfig.mk重复时后者优先级高"}, {"id": "c325", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "编译步骤", "back": "<div class=\"def-ans\">先mmm编lib_driver_cmd_bcmdhd静态库，再mmm external/wpa_supplicant_8（同时生成wpa_cli）</div>", "backText": "先mmm编lib_driver_cmd_bcmdhd静态库，再mmm external/wpa_supplicant_8（同时生成wpa_cli）"}, {"id": "c326", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "部署", "back": "<div class=\"def-ans\">替换/system/bin/wpa_supplicant并chmod 0755，wpa_cli push到/system/bin</div>", "backText": "替换/system/bin/wpa_supplicant并chmod 0755，wpa_cli push到/system/bin"}, {"id": "c327", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "4.2.3 wpa_supplicant命令和控制API", "back": "<ul class=\"ans-list\"><li>Android中客户端是Framework的WifiService，Settings的Wi-Fi操作经WifiService发命令给WPAS执行</li><li>常见命令：PING（心跳，回复\"PONG\"）、MIB、STATUS、ADD_NETWORK（添加网络返回network id）、SET_NETWORK &lt;id&gt; &lt;variable&gt; &lt;value&gt;、ENABLE_NETWORK &lt;id&gt;（触发加入该网络）</li><li>Interactive Request（WPAS主动要求客户端输入）：格式CTRL-REQ-&lt;field&gt;-&lt;network id&gt;-&lt;text&gt;，回复CTRL-RSP-&lt;field&gt;-&lt;network id&gt;-&lt;value&gt;；field包括PASSWORD、IDENTITY、PIN等</li><li>通知事件：CTRL-EVENT-&lt;field&gt;-&lt;text&gt;；另有\"WPA：XXX\"和\"WPS-XXX\"事件</li><li>控制API（wpa_ctrl.h，链接libwpa_client.so）：wpa_ctrl_open/close创建销毁wpa_ctrl对象；wpa_ctrl_request发送命令并收回复</li><li>solicited event（命令回复）与unsolicited event（CTRL-EVENT通知）区别；msg_cb回调用于在等待命令回复时处理通知事件</li><li>wpa_ctrl_attach打开通知监听；wpa_ctrl_recv直接接收unsolicited event</li><li>常见用法：客户端创建两个wpa_ctrl对象——一个attach后专职收通知，另一个专职发命令收回复（WifiService即此做法）</li></ul>", "backText": "Android中客户端是Framework的WifiService，Settings的Wi-Fi操作经WifiService发命令给WPAS执行; 常见命令：PING（心跳，回复\"PONG\"）、MIB、STATUS、ADD_NETWORK（添加网络返回network id）、SET_NETWORK <id> <variable> <value>、ENABLE_NETWORK <id>（触发加入该网络）; Interactive Request（WPAS主动要求客户端输入）：格式CTRL-REQ-<field>-<network id>-<text>，回复CTRL-RSP-<field>-<network id>-<value>；field包括PASSWORD、IDENTITY、PIN等; 通知事件：CTRL-EVENT-<field>-<text>；另有\"WPA：XXX\"和\"WPS-XXX\"事件; 控制API（wpa_ctrl.h，链接libwpa_client.so）：wpa_ctrl_open/close创建销毁wpa_ctrl对象；wpa_ctrl_request发送命令并收回复; solicited event（命令回复）与unsolicited event（CTRL-EVENT通知）区别；msg_cb回调用于在等待命令回复时处理通知事件"}, {"id": "c328", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "常见命令", "back": "<div class=\"def-ans\">PING（心跳，回复\"PONG\"）、MIB、STATUS、ADD_NETWORK（添加网络返回network id）、SET_NETWORK &lt;id&gt; &lt;variable&gt; &lt;value&gt;、ENABLE_NETWORK &lt;id&gt;（触发加入该网络）</div>", "backText": "PING（心跳，回复\"PONG\"）、MIB、STATUS、ADD_NETWORK（添加网络返回network id）、SET_NETWORK <id> <variable> <value>、ENABLE_NETWORK <id>（触发加入该网络）"}, {"id": "c329", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "通知事件", "back": "<div class=\"def-ans\">CTRL-EVENT-&lt;field&gt;-&lt;text&gt;；另有\"WPA：XXX\"和\"WPS-XXX\"事件</div>", "backText": "CTRL-EVENT-<field>-<text>；另有\"WPA：XXX\"和\"WPS-XXX\"事件"}, {"id": "c330", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "常见用法", "back": "<div class=\"def-ans\">客户端创建两个wpa_ctrl对象——一个attach后专职收通知，另一个专职发命令收回复（WifiService即此做法）</div>", "backText": "客户端创建两个wpa_ctrl对象——一个attach后专职收通知，另一个专职发命令收回复（WifiService即此做法）"}, {"id": "c331", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "4.2.4 git的使用", "back": "<ul class=\"ans-list\"><li>WPAS注释少，需借助git查历史版本溯源</li><li>git clone git://w1.fi/srv/git/hostap.git 下载官方代码</li><li>git blame &lt;file&gt; | grep &lt;变量&gt;：定位变量最早出现的patch</li><li>git log &lt;commit id&gt; / git show &lt;commit id&gt;：查看commit说明以理解变量含义</li></ul>", "backText": "WPAS注释少，需借助git查历史版本溯源; git clone git://w1.fi/srv/git/hostap.git 下载官方代码; git blame <file> | grep <变量>：定位变量最早出现的patch; git log <commit id> / git show <commit id>：查看commit说明以理解变量含义"}, {"id": "c332", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "git clone git", "back": "<div class=\"def-ans\">//w1.fi/srv/git/hostap.git 下载官方代码</div>", "backText": "//w1.fi/srv/git/hostap.git 下载官方代码"}, {"id": "c333", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.2 初识wpa_supplicant", "front": "git blame <file> | grep <变量>", "back": "<div class=\"def-ans\">定位变量最早出现的patch</div>", "backText": "定位变量最早出现的patch"}, {"id": "c334", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "启动机制与配置文件", "back": "<ul class=\"ans-list\"><li>Android通过\"setprop ctrl.start wpa_supplicant\"触发init进程fork子进程启动WPAS；init.rc中定义为service</li><li>\"-c\"参数指定配置文件，如/data/misc/wifi/wpa_supplicant.conf</li><li>ctrl_interface：控制接口unix域socket文件名；update_config：运行时修改需回存配置文件</li><li>WPS相关配置（device_name～config_method）、P2P相关（p2p等）</li><li>network配置项对应每个无线网络：ssid、key_mgmt、认证方法、密码、priority（多网络可用时优先选priority高者）；WPAS找到已保存网络会自动尝试加入</li></ul>", "backText": "Android通过\"setprop ctrl.start wpa_supplicant\"触发init进程fork子进程启动WPAS；init.rc中定义为service; \"-c\"参数指定配置文件，如/data/misc/wifi/wpa_supplicant.conf; ctrl_interface：控制接口unix域socket文件名；update_config：运行时修改需回存配置文件; WPS相关配置（device_name～config_method）、P2P相关（p2p等）; network配置项对应每个无线网络：ssid、key_mgmt、认证方法、密码、priority（多网络可用时优先选priority高者）；WPAS找到已保存网络会自动尝试加入"}, {"id": "c335", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "ctrl_interface", "back": "<div class=\"def-ans\">控制接口unix域socket文件名；update_config：运行时修改需回存配置文件</div>", "backText": "控制接口unix域socket文件名；update_config：运行时修改需回存配置文件"}, {"id": "c336", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "network配置项对应每个无线网络", "back": "<div class=\"def-ans\">ssid、key_mgmt、认证方法、密码、priority（多网络可用时优先选priority高者）；WPAS找到已保存网络会自动尝试加入</div>", "backText": "ssid、key_mgmt、认证方法、密码、priority（多网络可用时优先选priority高者）；WPAS找到已保存网络会自动尝试加入"}, {"id": "c337", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "4.3.1 main函数分析（main.c）", "back": "<ul class=\"ans-list\"><li>流程：os_program_init()→参数解析getopt→wpa_supplicant_init(&amp;params)→wpa_supplicant_add_iface()（逐个添加接口）→wpa_supplicant_run(global)→wpa_supplicant_deinit(global)</li><li>参数：-c配置文件、-D driver名、-e初始随机数文件、-i网络接口名（如wlan0）</li><li>重要数据结构：wpa_interface（描述一个无线网络设备）、wpa_global（全局上下文；ifaces指向wpa_supplicant对象单链表；drv_priv为driver wrapper全局上下文数组）</li><li>wpa_supplicant：WPAS核心数据结构，一个interface对应一个，通过next链接成链表</li><li>ctrl_iface_global_priv：全局控制接口信息，含通信socket句柄</li><li>Android平台用select或epoll实现多路I/O复用</li></ul>", "backText": "流程：os_program_init()→参数解析getopt→wpa_supplicant_init(&params)→wpa_supplicant_add_iface()（逐个添加接口）→wpa_supplicant_run(global)→wpa_supplicant_deinit(global); 参数：-c配置文件、-D driver名、-e初始随机数文件、-i网络接口名（如wlan0）; 重要数据结构：wpa_interface（描述一个无线网络设备）、wpa_global（全局上下文；ifaces指向wpa_supplicant对象单链表；drv_priv为driver wrapper全局上下文数组）; wpa_supplicant：WPAS核心数据结构，一个interface对应一个，通过next链接成链表; ctrl_iface_global_priv：全局控制接口信息，含通信socket句柄; Android平台用select或epoll实现多路I/O复用"}, {"id": "c338", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "流程", "back": "<div class=\"def-ans\">os_program_init()→参数解析getopt→wpa_supplicant_init(&amp;params)→wpa_supplicant_add_iface()（逐个添加接口）→wpa_supplicant_run(global)→wpa_supplicant_deinit(global)</div>", "backText": "os_program_init()→参数解析getopt→wpa_supplicant_init(&params)→wpa_supplicant_add_iface()（逐个添加接口）→wpa_supplicant_run(global)→wpa_supplicant_deinit(global)"}, {"id": "c339", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "参数", "back": "<div class=\"def-ans\">-c配置文件、-D driver名、-e初始随机数文件、-i网络接口名（如wlan0）</div>", "backText": "-c配置文件、-D driver名、-e初始随机数文件、-i网络接口名（如wlan0）"}, {"id": "c340", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "重要数据结构", "back": "<div class=\"def-ans\">wpa_interface（描述一个无线网络设备）、wpa_global（全局上下文；ifaces指向wpa_supplicant对象单链表；drv_priv为driver wrapper全局上下文数组）</div>", "backText": "wpa_interface（描述一个无线网络设备）、wpa_global（全局上下文；ifaces指向wpa_supplicant对象单链表；drv_priv为driver wrapper全局上下文数组）"}, {"id": "c341", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_supplicant", "back": "<div class=\"def-ans\">WPAS核心数据结构，一个interface对应一个，通过next链接成链表</div>", "backText": "WPAS核心数据结构，一个interface对应一个，通过next链接成链表"}, {"id": "c342", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "ctrl_iface_global_priv", "back": "<div class=\"def-ans\">全局控制接口信息，含通信socket句柄</div>", "backText": "全局控制接口信息，含通信socket句柄"}, {"id": "c343", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "4.3.2 wpa_supplicant_init函数分析", "back": "<ul class=\"ans-list\"><li>主要工作：初始化wpa_global及全局资源（随机数、eloop事件循环、消息全局回调）</li><li>关键步骤：wpa_msg_register_ifname_cb→wpa_debug_open_file→eap_register_methods()（关键点①）→创建wpa_global→eloop_init()（关键点②）→random_init→wpa_supplicant_global_ctrl_iface_init→wpas_notify_supplicant_initialized→遍历wpa_drivers计数drv_count并分配drv_priv数组（关键点③）</li><li>消息全局回调（wpa_debug.c）：wpa_msg_get_ifname_func（获取网卡接口名）；wpa_msg_cb_func（把输出信息发给客户端，消息前缀\"&lt;3&gt;\"即由其添加）</li><li>eap_register_methods：按编译宏注册EAP方法（如EAP_MD5→eap_peer_md5_register()）；注册时填充struct eap_method（与RFC4137关系密切）</li><li>eloop_init与event loop模块：核心结构体eloop_data；基于epoll或select的I/O复用</li><li>eloop支持5种事件：read event、write event、exception event、timeout event、signal（信号事件）</li><li>事件注册API：eloop_register_read_sock、eloop_register_sock、eloop_register_timeout、eloop_register_signal</li><li>eloop_run：while循环中枢——计算最近超时时间→填fd_set→select→先处理信号→处理超时→按读/写/异常分发表</li><li>wpa_drivers数组：成员为wpa_driver_ops对象指针，按CONFIG_DRIVER_WEXT/CONFIG_DRIVER_NL80211等编译选项决定；wpa_driver_ops是driver i/f核心结构（函数指针隔离上层与具体driver）</li><li>术语：driver wrapper指WPAS中用户空间的Kernel wlan驱动代理；\"driver\"专指Kernel内wlan驱动</li><li>wpa_driver_nl80211_ops要点：name=\"nl80211\"、get_bssid、scan2=wpa_driver_nl80211_scan、get_scan_results2、authenticate/associate、global_init=nl80211_global_init、init2=wpa_driver_nl80211_init、Android下driver_cmd=wpa_driver_nl80211_driver_cmd</li></ul>", "backText": "主要工作：初始化wpa_global及全局资源（随机数、eloop事件循环、消息全局回调）; 关键步骤：wpa_msg_register_ifname_cb→wpa_debug_open_file→eap_register_methods()（关键点①）→创建wpa_global→eloop_init()（关键点②）→random_init→wpa_supplicant_global_ctrl_iface_init→wpas_notify_supplicant_initialized→遍历wpa_drivers计数drv_count并分配drv_priv数组（关键点③）; 消息全局回调（wpa_debug.c）：wpa_msg_get_ifname_func（获取网卡接口名）；wpa_msg_cb_func（把输出信息发给客户端，消息前缀\"<3>\"即由其添加）; eap_register_methods：按编译宏注册EAP方法（如EAP_MD5→eap_peer_md5_register()）；注册时填充struct eap_method（与RFC4137关系密切）; eloop_init与event loop模块：核心结构体eloop_data；基于epoll或select的I/O复用; eloop支持5种事件：read event、write event、exception event、timeout event、signal（信号事件）"}, {"id": "c344", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "主要工作", "back": "<div class=\"def-ans\">初始化wpa_global及全局资源（随机数、eloop事件循环、消息全局回调）</div>", "backText": "初始化wpa_global及全局资源（随机数、eloop事件循环、消息全局回调）"}, {"id": "c345", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "关键步骤", "back": "<div class=\"def-ans\">wpa_msg_register_ifname_cb→wpa_debug_open_file→eap_register_methods()（关键点①）→创建wpa_global→eloop_init()（关键点②）→random_init→wpa_supplicant_global_ctrl_iface_init→wpas_notify_supplicant_initialized→遍历wpa_drivers计数drv_count并分配drv_priv数组（关键点③）</div>", "backText": "wpa_msg_register_ifname_cb→wpa_debug_open_file→eap_register_methods()（关键点①）→创建wpa_global→eloop_init()（关键点②）→random_init→wpa_supplicant_global_ctrl_iface_init→wpas_notify_supplicant_initialized→遍历wpa_drivers计数drv_count并分配drv_priv数组（关键点③）"}, {"id": "c346", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "消息全局回调（wpa_debug.c）", "back": "<div class=\"def-ans\">wpa_msg_get_ifname_func（获取网卡接口名）；wpa_msg_cb_func（把输出信息发给客户端，消息前缀\"&lt;3&gt;\"即由其添加）</div>", "backText": "wpa_msg_get_ifname_func（获取网卡接口名）；wpa_msg_cb_func（把输出信息发给客户端，消息前缀\"<3>\"即由其添加）"}, {"id": "c347", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "eap_register_methods", "back": "<div class=\"def-ans\">按编译宏注册EAP方法（如EAP_MD5→eap_peer_md5_register()）；注册时填充struct eap_method（与RFC4137关系密切）</div>", "backText": "按编译宏注册EAP方法（如EAP_MD5→eap_peer_md5_register()）；注册时填充struct eap_method（与RFC4137关系密切）"}, {"id": "c348", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "eloop_init与event loop模块", "back": "<div class=\"def-ans\">核心结构体eloop_data；基于epoll或select的I/O复用</div>", "backText": "核心结构体eloop_data；基于epoll或select的I/O复用"}, {"id": "c349", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "eloop支持5种事件", "back": "<div class=\"def-ans\">read event、write event、exception event、timeout event、signal（信号事件）</div>", "backText": "read event、write event、exception event、timeout event、signal（信号事件）"}, {"id": "c350", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "事件注册API", "back": "<div class=\"def-ans\">eloop_register_read_sock、eloop_register_sock、eloop_register_timeout、eloop_register_signal</div>", "backText": "eloop_register_read_sock、eloop_register_sock、eloop_register_timeout、eloop_register_signal"}, {"id": "c351", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "eloop_run", "back": "<div class=\"def-ans\">while循环中枢——计算最近超时时间→填fd_set→select→先处理信号→处理超时→按读/写/异常分发表</div>", "backText": "while循环中枢——计算最近超时时间→填fd_set→select→先处理信号→处理超时→按读/写/异常分发表"}, {"id": "c352", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_drivers数组", "back": "<div class=\"def-ans\">成员为wpa_driver_ops对象指针，按CONFIG_DRIVER_WEXT/CONFIG_DRIVER_NL80211等编译选项决定；wpa_driver_ops是driver i/f核心结构（函数指针隔离上层与具体driver）</div>", "backText": "成员为wpa_driver_ops对象指针，按CONFIG_DRIVER_WEXT/CONFIG_DRIVER_NL80211等编译选项决定；wpa_driver_ops是driver i/f核心结构（函数指针隔离上层与具体driver）"}, {"id": "c353", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "术语", "back": "<div class=\"def-ans\">driver wrapper指WPAS中用户空间的Kernel wlan驱动代理；\"driver\"专指Kernel内wlan驱动</div>", "backText": "driver wrapper指WPAS中用户空间的Kernel wlan驱动代理；\"driver\"专指Kernel内wlan驱动"}, {"id": "c354", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_driver_nl80211_ops要点", "back": "<div class=\"def-ans\">name=\"nl80211\"、get_bssid、scan2=wpa_driver_nl80211_scan、get_scan_results2、authenticate/associate、global_init=nl80211_global_init、init2=wpa_driver_nl80211_init、Android下driver_cmd=wpa_driver_nl80211_driver_cmd</div>", "backText": "name=\"nl80211\"、get_bssid、scan2=wpa_driver_nl80211_scan、get_scan_results2、authenticate/associate、global_init=nl80211_global_init、init2=wpa_driver_nl80211_init、Android下driver_cmd=wpa_driver_nl80211_driver_cmd"}, {"id": "c355", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "4.3.3 wpa_supplicant_add_iface函数分析", "back": "<ul class=\"ans-list\"><li>流程：wpa_supplicant_alloc()→设global→wpa_supplicant_init_iface()（核心）→wpas_notify_iface_added→逐ssid调用wpas_notify_network_added→头插法挂入global-&gt;ifaces链表</li><li>wpa_ssid结构体：配置文件中每个network项的代码映射；通过next构成单链表</li><li>安全成员：passphrase（字符串密码）；psk（实际密钥，由passphrase与ssid计算，见802.11-2012附录M.4）</li><li>pairwise_cipher/group_cipher：WPA_CIPHER_NONE/WEP40/WEP104/TKIP/CCMP；默认DEFAULT_PAIRWISE=CCMP|TKIP、DEFAULT_GROUP=CCMP|TKIP|WEP104|WEP40</li><li>key_mgmt（对应802.11 AKM suite）：WPA_KEY_MGMT_IEEE8021X/PSK/NONE/WPS等；DEFAULT_KEY_MGMT=PSK|IEEE8021X</li><li>proto：WPA_PROTO_WPA、WPA_PROTO_RSN（RSN即WPA2）</li><li>auth_alg：OPEN（WPA/RSN必须）、SHARED、LEAP（思科）、FT；eapol_flags：动态WEP Key</li><li>其他成员：proactive_key_caching（OPC/OKC机会性PMK缓存，切换AP可跳过802.1X直接进4-Way Handshake）；disable；mode（WPAS_MODE_INFRA等）</li><li>wpa_supplicant结构体成员：drv_priv（保存init2返回的driver wrapper上下文）；current_bss（类型wpa_bss——无线网络在WPAS中的代表）</li><li>安全成员：pairwise_cipher、group_cipher、key_mgmt、wpa_proto、mgmt_group_cipher（与802.11w相关）；countermeasures（TKIP MIC对策：60秒内两次MIC错误则停止TKIP通信60秒）</li><li>功能成员：sched_scan_timeout（计划扫描，需Kernel 3.0+驱动支持）；bgscan（后台扫描与漫游）；gas（GAS/ANQP与802.11u）；CONFIG_SME（编译宏）</li><li>wpa_states取值：WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED</li></ul>", "backText": "流程：wpa_supplicant_alloc()→设global→wpa_supplicant_init_iface()（核心）→wpas_notify_iface_added→逐ssid调用wpas_notify_network_added→头插法挂入global->ifaces链表; wpa_ssid结构体：配置文件中每个network项的代码映射；通过next构成单链表; 安全成员：passphrase（字符串密码）；psk（实际密钥，由passphrase与ssid计算，见802.11-2012附录M.4）; pairwise_cipher/group_cipher：WPA_CIPHER_NONE/WEP40/WEP104/TKIP/CCMP；默认DEFAULT_PAIRWISE=CCMP|TKIP、DEFAULT_GROUP=CCMP|TKIP|WEP104|WEP40; key_mgmt（对应802.11 AKM suite）：WPA_KEY_MGMT_IEEE8021X/PSK/NONE/WPS等；DEFAULT_KEY_MGMT=PSK|IEEE8021X; proto：WPA_PROTO_WPA、WPA_PROTO_RSN（RSN即WPA2）"}, {"id": "c357", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_ssid结构体", "back": "<div class=\"def-ans\">配置文件中每个network项的代码映射；通过next构成单链表</div>", "backText": "配置文件中每个network项的代码映射；通过next构成单链表"}, {"id": "c358", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "安全成员", "back": "<div class=\"def-ans\">passphrase（字符串密码）；psk（实际密钥，由passphrase与ssid计算，见802.11-2012附录M.4）</div>", "backText": "passphrase（字符串密码）；psk（实际密钥，由passphrase与ssid计算，见802.11-2012附录M.4）"}, {"id": "c359", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "pairwise_cipher/group_cipher", "back": "<div class=\"def-ans\">WPA_CIPHER_NONE/WEP40/WEP104/TKIP/CCMP；默认DEFAULT_PAIRWISE=CCMP|TKIP、DEFAULT_GROUP=CCMP|TKIP|WEP104|WEP40</div>", "backText": "WPA_CIPHER_NONE/WEP40/WEP104/TKIP/CCMP；默认DEFAULT_PAIRWISE=CCMP|TKIP、DEFAULT_GROUP=CCMP|TKIP|WEP104|WEP40"}, {"id": "c360", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "key_mgmt（对应802.11 AKM suite）", "back": "<div class=\"def-ans\">WPA_KEY_MGMT_IEEE8021X/PSK/NONE/WPS等；DEFAULT_KEY_MGMT=PSK|IEEE8021X</div>", "backText": "WPA_KEY_MGMT_IEEE8021X/PSK/NONE/WPS等；DEFAULT_KEY_MGMT=PSK|IEEE8021X"}, {"id": "c361", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "proto", "back": "<div class=\"def-ans\">WPA_PROTO_WPA、WPA_PROTO_RSN（RSN即WPA2）</div>", "backText": "WPA_PROTO_WPA、WPA_PROTO_RSN（RSN即WPA2）"}, {"id": "c362", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "auth_alg", "back": "<div class=\"def-ans\">OPEN（WPA/RSN必须）、SHARED、LEAP（思科）、FT；eapol_flags：动态WEP Key</div>", "backText": "OPEN（WPA/RSN必须）、SHARED、LEAP（思科）、FT；eapol_flags：动态WEP Key"}, {"id": "c363", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "其他成员", "back": "<div class=\"def-ans\">proactive_key_caching（OPC/OKC机会性PMK缓存，切换AP可跳过802.1X直接进4-Way Handshake）；disable；mode（WPAS_MODE_INFRA等）</div>", "backText": "proactive_key_caching（OPC/OKC机会性PMK缓存，切换AP可跳过802.1X直接进4-Way Handshake）；disable；mode（WPAS_MODE_INFRA等）"}, {"id": "c364", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_supplicant结构体成员", "back": "<div class=\"def-ans\">drv_priv（保存init2返回的driver wrapper上下文）；current_bss（类型wpa_bss——无线网络在WPAS中的代表）</div>", "backText": "drv_priv（保存init2返回的driver wrapper上下文）；current_bss（类型wpa_bss——无线网络在WPAS中的代表）"}, {"id": "c366", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "功能成员", "back": "<div class=\"def-ans\">sched_scan_timeout（计划扫描，需Kernel 3.0+驱动支持）；bgscan（后台扫描与漫游）；gas（GAS/ANQP与802.11u）；CONFIG_SME（编译宏）</div>", "backText": "sched_scan_timeout（计划扫描，需Kernel 3.0+驱动支持）；bgscan（后台扫描与漫游）；gas（GAS/ANQP与802.11u）；CONFIG_SME（编译宏）"}, {"id": "c367", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_states取值", "back": "<div class=\"def-ans\">WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED</div>", "backText": "WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED"}, {"id": "c368", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "4.3.4 wpa_supplicant_init_iface函数分析", "back": "<ul class=\"ans-list\"><li>之一：解析配置文件wpa_config_read——遇\"network={\"调wpa_config_read_network生成wpa_ssid并挂链表；其余项由wpa_config_process_global解析；blob项用于存证书等；wpa_config：配置文件在代码中的代表</li><li>之二：复制ifname；eapol_sm_notify_portEnabled/portValid置FALSE；wpa_supplicant_set_driver按名找到wpa_driver_nl80211_ops并调global_init</li><li>nl80211_global_init：创建nl80211_global；netlink_init创建netlink socket收内核网卡状态事件（UP/DORMANT/REMOVED），回调newlink_cb/dellink_cb，加入RTMGRP_LINK组播组</li><li>wpa_driver_nl80211_init_nl_global：nl_cb_alloc创建回调；genl_connect连接内核创建global-&gt;nl（发消息）与global-&gt;nl_event（收消息）；genl_ctrl_resolve查询\"nl80211\"family编号</li><li>加入\"scan\"、\"mlme\"、\"regulatory\"三个组播组；eloop_register_read_sock注册nl_event，回调wpa_driver_nl80211_event_receive→nl_recvmsgs→process_global_event</li><li>之三：wpa_drv_init调driver wrapper的init2→wpa_driver_nl80211_init：创建wpa_driver_nl80211_data；nl80211_get_phy_name读/sys/class/net/wlan0/phy80211/name；rfkill_init；wpa_driver_nl80211_finish_drv_init；创建PF_PACKET域eapol_tx_sock；返回i802_bss对象</li><li>rfkill背景：Kernel子系统，控制射频设备（Wi-Fi/GPS/BT/FM）电源；hard block与soft block；用户空间经/dev/rfkill；WPAS只监控不操作rfkill</li><li>PF_PACKET背景：socket域之一，直接在数据链路层收发（可实现EAP/EAPOL等协议）；socket_type为SOCK_DGRAM或SOCK_RAW；struct sockaddr_ll表达物理层地址</li><li>回调对象辨析：真正使用的回调仅两个：bss-&gt;nl_cb（process_bss_event）与global-&gt;nl_cb（process_global_event）</li><li>wpa_driver_nl80211_finish_drv_init：①if_nametoindex取ifindex；②设为NL80211_IFTYPE_STATION；③linux_set_iface_flags（SIOCSIFFLAGS+IFF_UP）启用网卡，失败时查rfkill_is_blocked；④netlink_send_oper_ifla设IfOperStatus为IF_OPER_DORMANT；⑤wpa_driver_nl80211_capa获取capability；⑥linux_get_ifhwaddr取MAC</li><li>Virtual Interface背景：一块物理网卡多个虚拟设备/虚拟MAC（如P2P Concurrent设备）；nl80211_iftype枚举：ADHOC、STATION、AP、AP_VLAN、WDS、MONITOR、MESH_POINT、P2P_CLIENT、P2P_GO等</li><li>IfOperStatus（RFC2863）：UNKNOWN、NOTPRESENT、DOWN、LOWERLAYERDOWN、TESTING、DORMANT、UP</li><li>wpa_driver_nl80211_capa：发NL80211_CMD_GET_WIPHY获取设备信息；填充drv-&gt;capa（key_mgmt、enc、auth默认值）及flags；AP相关变量：device_ap_sme、poll_command_supported、data_tx_status、use_monitor</li><li>之四：wpa_supplicant_init_wpa（wpas_glue.c）——创建wpa_sm_ctx填函数指针，wpa_sm_init创建wpa_sm；wpa_sm相关结构：wpa_sm_ctx（函数指针集合）、wpa_sm（eapol成员指向eapol_sm，含pmksa=pmksa_cache_init创建的PMKSA缓存）</li><li>MIB变量：dot11RSNAConfigPMKLifetime（PMKSA有效期，默认43200秒）、dot11RSNAConfigPMKReauthThreshold（有效期过70%需重认证）、dot11RSNAConfigSATimeout（认证最长60秒）</li><li>新capability：probe_resp_offloads、max_scan_ssids、max_sched_scan_ssids与sched_scan_supported、max_match_sets、max_remain_on_chan、max_stations</li><li>之五：wpa_supplicant_driver_init→wpas_wps_init→wpa_supplicant_init_eapol（4.4节）→wpa_supplicant_ctrl_iface_init→gas_query_init→wpas_p2p_init（CONFIG_P2P）→wpa_bss_init</li><li>wpa_supplicant_driver_init：wpa_supplicant_update_mac_addr（l2_packet_init：PF_PACKET+SOCK_DGRAM，ETH_P_EAPOL，回调wpa_supplicant_rx_eapol收EAPOL/EAP帧——对4-Way Handshake至关重要）；无使能网络则设状态WPA_INACTIVE</li><li>wpa_supplicant_ctrl_iface_init：创建unix域socket；Android定制：addr.sun_path=\"wpa_&lt;ifname&gt;\"（如wpa_wlan0）；eloop注册读回调wpa_supplicant_ctrl_iface_receive处理客户端命令</li><li>wpa_bss_init：初始化双链表；注册10秒周期超时任务wpa_bss_timeout→wpa_bss_flush_by_age（bss_expiration_age默认1800秒）删除过期wpa_bss</li></ul>", "backText": "之一：解析配置文件wpa_config_read——遇\"network={\"调wpa_config_read_network生成wpa_ssid并挂链表；其余项由wpa_config_process_global解析；blob项用于存证书等；wpa_config：配置文件在代码中的代表; 之二：复制ifname；eapol_sm_notify_portEnabled/portValid置FALSE；wpa_supplicant_set_driver按名找到wpa_driver_nl80211_ops并调global_init; nl80211_global_init：创建nl80211_global；netlink_init创建netlink socket收内核网卡状态事件（UP/DORMANT/REMOVED），回调newlink_cb/dellink_cb，加入RTMGRP_LINK组播组; wpa_driver_nl80211_init_nl_global：nl_cb_alloc创建回调；genl_connect连接内核创建global->nl（发消息）与global->nl_event（收消息）；genl_ctrl_resolve查询\"nl80211\"family编号; 加入\"scan\"、\"mlme\"、\"regulatory\"三个组播组；eloop_register_read_sock注册nl_event，回调wpa_driver_nl80211_event_receive→nl_recvmsgs→process_global_event; 之三：wpa_drv_init调driver wrapper的init2→wpa_driver_nl80211_init：创建wpa_driver_nl80211_data；nl80211_get_phy_name读/sys/class/net/wlan0/phy80211/name；rfkill_init；wpa_driver_nl80211_finish_drv_init；创建PF_PACKET域eapol_tx_sock；返回i802_bss对象"}, {"id": "c369", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "之一", "back": "<div class=\"def-ans\">解析配置文件wpa_config_read——遇\"network={\"调wpa_config_read_network生成wpa_ssid并挂链表；其余项由wpa_config_process_global解析；blob项用于存证书等；wpa_config：配置文件在代码中的代表</div>", "backText": "解析配置文件wpa_config_read——遇\"network={\"调wpa_config_read_network生成wpa_ssid并挂链表；其余项由wpa_config_process_global解析；blob项用于存证书等；wpa_config：配置文件在代码中的代表"}, {"id": "c370", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "之二", "back": "<div class=\"def-ans\">复制ifname；eapol_sm_notify_portEnabled/portValid置FALSE；wpa_supplicant_set_driver按名找到wpa_driver_nl80211_ops并调global_init</div>", "backText": "复制ifname；eapol_sm_notify_portEnabled/portValid置FALSE；wpa_supplicant_set_driver按名找到wpa_driver_nl80211_ops并调global_init"}, {"id": "c371", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "nl80211_global_init", "back": "<div class=\"def-ans\">创建nl80211_global；netlink_init创建netlink socket收内核网卡状态事件（UP/DORMANT/REMOVED），回调newlink_cb/dellink_cb，加入RTMGRP_LINK组播组</div>", "backText": "创建nl80211_global；netlink_init创建netlink socket收内核网卡状态事件（UP/DORMANT/REMOVED），回调newlink_cb/dellink_cb，加入RTMGRP_LINK组播组"}, {"id": "c372", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "之三", "back": "<div class=\"def-ans\">wpa_drv_init调driver wrapper的init2→wpa_driver_nl80211_init：创建wpa_driver_nl80211_data；nl80211_get_phy_name读/sys/class/net/wlan0/phy80211/name；rfkill_init；wpa_driver_nl80211_finish_drv_init；创建PF_PACKET域eapol_tx_sock；返回i802_bss对象</div>", "backText": "wpa_drv_init调driver wrapper的init2→wpa_driver_nl80211_init：创建wpa_driver_nl80211_data；nl80211_get_phy_name读/sys/class/net/wlan0/phy80211/name；rfkill_init；wpa_driver_nl80211_finish_drv_init；创建PF_PACKET域eapol_tx_sock；返回i802_bss对象"}, {"id": "c373", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "rfkill背景", "back": "<div class=\"def-ans\">Kernel子系统，控制射频设备（Wi-Fi/GPS/BT/FM）电源；hard block与soft block；用户空间经/dev/rfkill；WPAS只监控不操作rfkill</div>", "backText": "Kernel子系统，控制射频设备（Wi-Fi/GPS/BT/FM）电源；hard block与soft block；用户空间经/dev/rfkill；WPAS只监控不操作rfkill"}, {"id": "c374", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "PF_PACKET背景", "back": "<div class=\"def-ans\">socket域之一，直接在数据链路层收发（可实现EAP/EAPOL等协议）；socket_type为SOCK_DGRAM或SOCK_RAW；struct sockaddr_ll表达物理层地址</div>", "backText": "socket域之一，直接在数据链路层收发（可实现EAP/EAPOL等协议）；socket_type为SOCK_DGRAM或SOCK_RAW；struct sockaddr_ll表达物理层地址"}, {"id": "c375", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "回调对象辨析", "back": "<div class=\"def-ans\">真正使用的回调仅两个：bss-&gt;nl_cb（process_bss_event）与global-&gt;nl_cb（process_global_event）</div>", "backText": "真正使用的回调仅两个：bss->nl_cb（process_bss_event）与global->nl_cb（process_global_event）"}, {"id": "c376", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "Virtual Interface背景", "back": "<div class=\"def-ans\">一块物理网卡多个虚拟设备/虚拟MAC（如P2P Concurrent设备）；nl80211_iftype枚举：ADHOC、STATION、AP、AP_VLAN、WDS、MONITOR、MESH_POINT、P2P_CLIENT、P2P_GO等</div>", "backText": "一块物理网卡多个虚拟设备/虚拟MAC（如P2P Concurrent设备）；nl80211_iftype枚举：ADHOC、STATION、AP、AP_VLAN、WDS、MONITOR、MESH_POINT、P2P_CLIENT、P2P_GO等"}, {"id": "c377", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "IfOperStatus（RFC2863）", "back": "<div class=\"def-ans\">UNKNOWN、NOTPRESENT、DOWN、LOWERLAYERDOWN、TESTING、DORMANT、UP</div>", "backText": "UNKNOWN、NOTPRESENT、DOWN、LOWERLAYERDOWN、TESTING、DORMANT、UP"}, {"id": "c378", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_driver_nl80211_capa", "back": "<div class=\"def-ans\">发NL80211_CMD_GET_WIPHY获取设备信息；填充drv-&gt;capa（key_mgmt、enc、auth默认值）及flags；AP相关变量：device_ap_sme、poll_command_supported、data_tx_status、use_monitor</div>", "backText": "发NL80211_CMD_GET_WIPHY获取设备信息；填充drv->capa（key_mgmt、enc、auth默认值）及flags；AP相关变量：device_ap_sme、poll_command_supported、data_tx_status、use_monitor"}, {"id": "c379", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "之四", "back": "<div class=\"def-ans\">wpa_supplicant_init_wpa（wpas_glue.c）——创建wpa_sm_ctx填函数指针，wpa_sm_init创建wpa_sm；wpa_sm相关结构：wpa_sm_ctx（函数指针集合）、wpa_sm（eapol成员指向eapol_sm，含pmksa=pmksa_cache_init创建的PMKSA缓存）</div>", "backText": "wpa_supplicant_init_wpa（wpas_glue.c）——创建wpa_sm_ctx填函数指针，wpa_sm_init创建wpa_sm；wpa_sm相关结构：wpa_sm_ctx（函数指针集合）、wpa_sm（eapol成员指向eapol_sm，含pmksa=pmksa_cache_init创建的PMKSA缓存）"}, {"id": "c380", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "MIB变量", "back": "<div class=\"def-ans\">dot11RSNAConfigPMKLifetime（PMKSA有效期，默认43200秒）、dot11RSNAConfigPMKReauthThreshold（有效期过70%需重认证）、dot11RSNAConfigSATimeout（认证最长60秒）</div>", "backText": "dot11RSNAConfigPMKLifetime（PMKSA有效期，默认43200秒）、dot11RSNAConfigPMKReauthThreshold（有效期过70%需重认证）、dot11RSNAConfigSATimeout（认证最长60秒）"}, {"id": "c381", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "新capability", "back": "<div class=\"def-ans\">probe_resp_offloads、max_scan_ssids、max_sched_scan_ssids与sched_scan_supported、max_match_sets、max_remain_on_chan、max_stations</div>", "backText": "probe_resp_offloads、max_scan_ssids、max_sched_scan_ssids与sched_scan_supported、max_match_sets、max_remain_on_chan、max_stations"}, {"id": "c382", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "之五", "back": "<div class=\"def-ans\">wpa_supplicant_driver_init→wpas_wps_init→wpa_supplicant_init_eapol（4.4节）→wpa_supplicant_ctrl_iface_init→gas_query_init→wpas_p2p_init（CONFIG_P2P）→wpa_bss_init</div>", "backText": "wpa_supplicant_driver_init→wpas_wps_init→wpa_supplicant_init_eapol（4.4节）→wpa_supplicant_ctrl_iface_init→gas_query_init→wpas_p2p_init（CONFIG_P2P）→wpa_bss_init"}, {"id": "c383", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_supplicant_driver_init", "back": "<div class=\"def-ans\">wpa_supplicant_update_mac_addr（l2_packet_init：PF_PACKET+SOCK_DGRAM，ETH_P_EAPOL，回调wpa_supplicant_rx_eapol收EAPOL/EAP帧——对4-Way Handshake至关重要）；无使能网络则设状态WPA_INACTIVE</div>", "backText": "wpa_supplicant_update_mac_addr（l2_packet_init：PF_PACKET+SOCK_DGRAM，ETH_P_EAPOL，回调wpa_supplicant_rx_eapol收EAPOL/EAP帧——对4-Way Handshake至关重要）；无使能网络则设状态WPA_INACTIVE"}, {"id": "c384", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_supplicant_ctrl_iface_init", "back": "<div class=\"def-ans\">创建unix域socket；Android定制：addr.sun_path=\"wpa_&lt;ifname&gt;\"（如wpa_wlan0）；eloop注册读回调wpa_supplicant_ctrl_iface_receive处理客户端命令</div>", "backText": "创建unix域socket；Android定制：addr.sun_path=\"wpa_<ifname>\"（如wpa_wlan0）；eloop注册读回调wpa_supplicant_ctrl_iface_receive处理客户端命令"}, {"id": "c385", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.3 wpa_supplicant初始化流程", "front": "wpa_bss_init", "back": "<div class=\"def-ans\">初始化双链表；注册10秒周期超时任务wpa_bss_timeout→wpa_bss_flush_by_age（bss_expiration_age默认1800秒）删除过期wpa_bss</div>", "backText": "初始化双链表；注册10秒周期超时任务wpa_bss_timeout→wpa_bss_flush_by_age（bss_expiration_age默认1800秒）删除过期wpa_bss"}, {"id": "c386", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "4.4.1 EAP模块分析（基于RFC4137）", "back": "<ul class=\"ans-list\"><li>RFC4137：\"State Machine for EAP Peer and Authenticator\"；本节重点SUPP端SM</li><li>SUPP SM共13个状态（如INITIALIZE、IDLE、DISCARD、FAILURE等）；每个状态可有Entry Action（EA）；UCT=Unconditional Transition无条件转换</li><li>RFC4137三层模型：底层Lower Layer（LL，收发EAP包）→中间SUPP SM层→顶层EAP Method（EM）层；WPAS中LL层即EAPOL模块</li><li>LL与SUPP SM交互变量：LL收包存eapReqData并置eapReq=TRUE触发SM；SM处理后置eapResp=TRUE或eapNoResp=TRUE；验证结束置eapSuccess/eapFailure</li><li>altAccept/altReject：更合适命名为lowerLayerSuccess/lowerLayerFailure；802.11下收到Disassociate/Deauthenticate帧=Failure，收到4-Way Handshake第一帧=Success</li><li>数据结构与类型（eap_i.h）：枚举EapDecision、EapMethodState；struct eap_sm：RFC4137 EAP SUPP SM代表，成员命名几乎严格按规范；m指向eap_method单链表；eapol_cb指向eapol_callbacks（LL层代表）</li><li>WPAS状态机通用宏（state_machine.h）：SM_STATE(machine,state)定义某状态EA函数；SM_ENTRY为EA入口公共代码；SM_ENTER调用指定状态EA；SM_STEP定义状态机步进函数；SM_STEP_RUN调用之</li><li>EAP SM实现：SM_STEP(EAP)先处理UCT（eapRestart&amp;&amp;portEnabled→INITIALIZE；num_rounds&gt;EAP_MAX_AUTH_ROUNDS(50)→FAILURE），否则按当前状态分发</li><li>小结：掌握RFC4137与状态切换图是理解EAP SUPP SM的基石；日志（wpa_printf输出entering state）对分析WPAS日志很重要</li></ul>", "backText": "RFC4137：\"State Machine for EAP Peer and Authenticator\"；本节重点SUPP端SM; SUPP SM共13个状态（如INITIALIZE、IDLE、DISCARD、FAILURE等）；每个状态可有Entry Action（EA）；UCT=Unconditional Transition无条件转换; RFC4137三层模型：底层Lower Layer（LL，收发EAP包）→中间SUPP SM层→顶层EAP Method（EM）层；WPAS中LL层即EAPOL模块; LL与SUPP SM交互变量：LL收包存eapReqData并置eapReq=TRUE触发SM；SM处理后置eapResp=TRUE或eapNoResp=TRUE；验证结束置eapSuccess/eapFailure; altAccept/altReject：更合适命名为lowerLayerSuccess/lowerLayerFailure；802.11下收到Disassociate/Deauthenticate帧=Failure，收到4-Way Handshake第一帧=Success; 数据结构与类型（eap_i.h）：枚举EapDecision、EapMethodState；struct eap_sm：RFC4137 EAP SUPP SM代表，成员命名几乎严格按规范；m指向eap_method单链表；eapol_cb指向eapol_callbacks（LL层代表）"}, {"id": "c387", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "RFC4137", "back": "<div class=\"def-ans\">\"State Machine for EAP Peer and Authenticator\"；本节重点SUPP端SM</div>", "backText": "\"State Machine for EAP Peer and Authenticator\"；本节重点SUPP端SM"}, {"id": "c388", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "RFC4137三层模型", "back": "<div class=\"def-ans\">底层Lower Layer（LL，收发EAP包）→中间SUPP SM层→顶层EAP Method（EM）层；WPAS中LL层即EAPOL模块</div>", "backText": "底层Lower Layer（LL，收发EAP包）→中间SUPP SM层→顶层EAP Method（EM）层；WPAS中LL层即EAPOL模块"}, {"id": "c389", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "LL与SUPP SM交互变量", "back": "<div class=\"def-ans\">LL收包存eapReqData并置eapReq=TRUE触发SM；SM处理后置eapResp=TRUE或eapNoResp=TRUE；验证结束置eapSuccess/eapFailure</div>", "backText": "LL收包存eapReqData并置eapReq=TRUE触发SM；SM处理后置eapResp=TRUE或eapNoResp=TRUE；验证结束置eapSuccess/eapFailure"}, {"id": "c390", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "altAccept/altReject", "back": "<div class=\"def-ans\">更合适命名为lowerLayerSuccess/lowerLayerFailure；802.11下收到Disassociate/Deauthenticate帧=Failure，收到4-Way Handshake第一帧=Success</div>", "backText": "更合适命名为lowerLayerSuccess/lowerLayerFailure；802.11下收到Disassociate/Deauthenticate帧=Failure，收到4-Way Handshake第一帧=Success"}, {"id": "c391", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "数据结构与类型（eap_i.h）", "back": "<div class=\"def-ans\">枚举EapDecision、EapMethodState；struct eap_sm：RFC4137 EAP SUPP SM代表，成员命名几乎严格按规范；m指向eap_method单链表；eapol_cb指向eapol_callbacks（LL层代表）</div>", "backText": "枚举EapDecision、EapMethodState；struct eap_sm：RFC4137 EAP SUPP SM代表，成员命名几乎严格按规范；m指向eap_method单链表；eapol_cb指向eapol_callbacks（LL层代表）"}, {"id": "c392", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "WPAS状态机通用宏（state_machine.h）", "back": "<div class=\"def-ans\">SM_STATE(machine,state)定义某状态EA函数；SM_ENTRY为EA入口公共代码；SM_ENTER调用指定状态EA；SM_STEP定义状态机步进函数；SM_STEP_RUN调用之</div>", "backText": "SM_STATE(machine,state)定义某状态EA函数；SM_ENTRY为EA入口公共代码；SM_ENTER调用指定状态EA；SM_STEP定义状态机步进函数；SM_STEP_RUN调用之"}, {"id": "c393", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "EAP SM实现", "back": "<div class=\"def-ans\">SM_STEP(EAP)先处理UCT（eapRestart&amp;&amp;portEnabled→INITIALIZE；num_rounds&gt;EAP_MAX_AUTH_ROUNDS(50)→FAILURE），否则按当前状态分发</div>", "backText": "SM_STEP(EAP)先处理UCT（eapRestart&&portEnabled→INITIALIZE；num_rounds>EAP_MAX_AUTH_ROUNDS(50)→FAILURE），否则按当前状态分发"}, {"id": "c394", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "小结", "back": "<div class=\"def-ans\">掌握RFC4137与状态切换图是理解EAP SUPP SM的基石；日志（wpa_printf输出entering state）对分析WPAS日志很重要</div>", "backText": "掌握RFC4137与状态切换图是理解EAP SUPP SM的基石；日志（wpa_printf输出entering state）对分析WPAS日志很重要"}, {"id": "c395", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "4.4.2 EAPOL模块分析（基于IEEE 802.1X-2004）", "back": "<ul class=\"ans-list\"><li>802.1X中EAPOL模块是EAP SUPP的LL层</li><li>802.1X为EAPOL Supplicant定义5个状态机：Port Timers SM（超时控制）、Supplicant PAE SM（Port Access Entity，维护Port状态）、Supplicant Backend SM（发送EAPOL回复）、The Key Receiver SM（处理EAPOL-Key帧）、The Supplicant Key Transmit SM（WPAS未实现）</li><li>规范统称PACP（Port Access Control Protocol）State Machine</li><li>Port Timers SM：WPAS未用状态机宏，而是eloop注册1秒超时函数eapol_port_timers_tick递减authWhile/heldWhile/startWhen/idleWhile，最后必调eapol_sm_step联动其他状态机</li><li>Key Receiver SM：NO_KEY_RECEIVE与KEY_RECEIVE两状态；rxKey=TRUE时进入KEY_RECEIVE并调eapol_sm_processKey</li><li>PAE SM：状态较多（LOGOFF、CONNECTING、AUTHENTICATING、AUTHENTICATED、HELD等）；函数txStart（发EAPOL-Start）、txLogoff（发EAPOL-Logoff）</li><li>Backend SM：authPeriod默认30秒；函数abortSupp、txSuppResp（发EAPOL-Packet）</li><li>数据结构：struct eapol_sm存储PACP状态机信息；eapol_ctx定义EAPOL模块与wpa_supplicant等其他模块的交互接口；WPAS其他模块一般只与EAPOL模块交互，EAP模块由EAPOL触发</li><li>初始化wpa_supplicant_init_eapol：填eapol_ctx（eapol_send=wpa_supplicant_eapol_send、eapol_done_cb等）→eapol_sm_init；默认值：portControl=Auto、heldPeriod=60、startPeriod=30、maxStart=3、authPeriod=30</li><li>状态机联动eapol_sm_step：for循环（上限100防死循环）中依次SM_STEP_RUN(SUPP_PAE)、(KEY_RX)、(SUPP_BE)、eap_peer_sm_step；changed为TRUE则继续循环；结束时回调sm-&gt;ctx-&gt;cb</li><li>初始化后状态：SUPP_PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、SUPP_BE=IDLE、EAP_SM=DISABLED</li><li>学习建议：EAPOL/EAP状态机严格遵循协议，先理解协议状态切换与变量再看代码</li></ul>", "backText": "802.1X中EAPOL模块是EAP SUPP的LL层; 802.1X为EAPOL Supplicant定义5个状态机：Port Timers SM（超时控制）、Supplicant PAE SM（Port Access Entity，维护Port状态）、Supplicant Backend SM（发送EAPOL回复）、The Key Receiver SM（处理EAPOL-Key帧）、The Supplicant Key Transmit SM（WPAS未实现）; 规范统称PACP（Port Access Control Protocol）State Machine; Port Timers SM：WPAS未用状态机宏，而是eloop注册1秒超时函数eapol_port_timers_tick递减authWhile/heldWhile/startWhen/idleWhile，最后必调eapol_sm_step联动其他状态机; Key Receiver SM：NO_KEY_RECEIVE与KEY_RECEIVE两状态；rxKey=TRUE时进入KEY_RECEIVE并调eapol_sm_processKey; PAE SM：状态较多（LOGOFF、CONNECTING、AUTHENTICATING、AUTHENTICATED、HELD等）；函数txStart（发EAPOL-Start）、txLogoff（发EAPOL-Logoff）"}, {"id": "c396", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "802.1X为EAPOL Supplicant定义5个状态机", "back": "<div class=\"def-ans\">Port Timers SM（超时控制）、Supplicant PAE SM（Port Access Entity，维护Port状态）、Supplicant Backend SM（发送EAPOL回复）、The Key Receiver SM（处理EAPOL-Key帧）、The Supplicant Key Transmit SM（WPAS未实现）</div>", "backText": "Port Timers SM（超时控制）、Supplicant PAE SM（Port Access Entity，维护Port状态）、Supplicant Backend SM（发送EAPOL回复）、The Key Receiver SM（处理EAPOL-Key帧）、The Supplicant Key Transmit SM（WPAS未实现）"}, {"id": "c397", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "Port Timers SM", "back": "<div class=\"def-ans\">WPAS未用状态机宏，而是eloop注册1秒超时函数eapol_port_timers_tick递减authWhile/heldWhile/startWhen/idleWhile，最后必调eapol_sm_step联动其他状态机</div>", "backText": "WPAS未用状态机宏，而是eloop注册1秒超时函数eapol_port_timers_tick递减authWhile/heldWhile/startWhen/idleWhile，最后必调eapol_sm_step联动其他状态机"}, {"id": "c398", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "Key Receiver SM", "back": "<div class=\"def-ans\">NO_KEY_RECEIVE与KEY_RECEIVE两状态；rxKey=TRUE时进入KEY_RECEIVE并调eapol_sm_processKey</div>", "backText": "NO_KEY_RECEIVE与KEY_RECEIVE两状态；rxKey=TRUE时进入KEY_RECEIVE并调eapol_sm_processKey"}, {"id": "c399", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "PAE SM", "back": "<div class=\"def-ans\">状态较多（LOGOFF、CONNECTING、AUTHENTICATING、AUTHENTICATED、HELD等）；函数txStart（发EAPOL-Start）、txLogoff（发EAPOL-Logoff）</div>", "backText": "状态较多（LOGOFF、CONNECTING、AUTHENTICATING、AUTHENTICATED、HELD等）；函数txStart（发EAPOL-Start）、txLogoff（发EAPOL-Logoff）"}, {"id": "c400", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "Backend SM", "back": "<div class=\"def-ans\">authPeriod默认30秒；函数abortSupp、txSuppResp（发EAPOL-Packet）</div>", "backText": "authPeriod默认30秒；函数abortSupp、txSuppResp（发EAPOL-Packet）"}, {"id": "c401", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "数据结构", "back": "<div class=\"def-ans\">struct eapol_sm存储PACP状态机信息；eapol_ctx定义EAPOL模块与wpa_supplicant等其他模块的交互接口；WPAS其他模块一般只与EAPOL模块交互，EAP模块由EAPOL触发</div>", "backText": "struct eapol_sm存储PACP状态机信息；eapol_ctx定义EAPOL模块与wpa_supplicant等其他模块的交互接口；WPAS其他模块一般只与EAPOL模块交互，EAP模块由EAPOL触发"}, {"id": "c402", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "初始化wpa_supplicant_init_eapol", "back": "<div class=\"def-ans\">填eapol_ctx（eapol_send=wpa_supplicant_eapol_send、eapol_done_cb等）→eapol_sm_init；默认值：portControl=Auto、heldPeriod=60、startPeriod=30、maxStart=3、authPeriod=30</div>", "backText": "填eapol_ctx（eapol_send=wpa_supplicant_eapol_send、eapol_done_cb等）→eapol_sm_init；默认值：portControl=Auto、heldPeriod=60、startPeriod=30、maxStart=3、authPeriod=30"}, {"id": "c403", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "状态机联动eapol_sm_step", "back": "<div class=\"def-ans\">for循环（上限100防死循环）中依次SM_STEP_RUN(SUPP_PAE)、(KEY_RX)、(SUPP_BE)、eap_peer_sm_step；changed为TRUE则继续循环；结束时回调sm-&gt;ctx-&gt;cb</div>", "backText": "for循环（上限100防死循环）中依次SM_STEP_RUN(SUPP_PAE)、(KEY_RX)、(SUPP_BE)、eap_peer_sm_step；changed为TRUE则继续循环；结束时回调sm->ctx->cb"}, {"id": "c404", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "初始化后状态", "back": "<div class=\"def-ans\">SUPP_PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、SUPP_BE=IDLE、EAP_SM=DISABLED</div>", "backText": "SUPP_PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、SUPP_BE=IDLE、EAP_SM=DISABLED"}, {"id": "c405", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.4 EAP和EAPOL模块", "front": "学习建议", "back": "<div class=\"def-ans\">EAPOL/EAP状态机严格遵循协议，先理解协议状态切换与变量再看代码</div>", "backText": "EAPOL/EAP状态机严格遵循协议，先理解协议状态切换与变量再看代码"}, {"id": "c406", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "实验环境与命令流程", "back": "<ul class=\"ans-list\"><li>命令序列：adb root→adb shell→wpa_cli -iwlan0→ADD_NETWORK→SET_NETWORK 0 ssid \"Test\"→SET_NETWORK 0 key_mgmt WPA-PSK→SET_NETWORK 0 psk \"12345Test\"→ENABLE_NETWORK 0→dhcpcd wlan0获取IP</li><li>注意：先在Settings开Wi-Fi；可清空Settings中已知网络避免WifiService干扰；WPAS支持多客户端</li><li>所有客户端命令入口：eloop读回调wpa_supplicant_ctrl_iface_receive——recvfrom收命令；处理\"ATTACH\"/\"DETACH\"/\"LEVEL\"；其余交wpa_supplicant_ctrl_iface_process</li></ul>", "backText": "命令序列：adb root→adb shell→wpa_cli -iwlan0→ADD_NETWORK→SET_NETWORK 0 ssid \"Test\"→SET_NETWORK 0 key_mgmt WPA-PSK→SET_NETWORK 0 psk \"12345Test\"→ENABLE_NETWORK 0→dhcpcd wlan0获取IP; 注意：先在Settings开Wi-Fi；可清空Settings中已知网络避免WifiService干扰；WPAS支持多客户端; 所有客户端命令入口：eloop读回调wpa_supplicant_ctrl_iface_receive——recvfrom收命令；处理\"ATTACH\"/\"DETACH\"/\"LEVEL\"；其余交wpa_supplicant_ctrl_iface_process"}, {"id": "c407", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "命令序列", "back": "<div class=\"def-ans\">adb root→adb shell→wpa_cli -iwlan0→ADD_NETWORK→SET_NETWORK 0 ssid \"Test\"→SET_NETWORK 0 key_mgmt WPA-PSK→SET_NETWORK 0 psk \"12345Test\"→ENABLE_NETWORK 0→dhcpcd wlan0获取IP</div>", "backText": "adb root→adb shell→wpa_cli -iwlan0→ADD_NETWORK→SET_NETWORK 0 ssid \"Test\"→SET_NETWORK 0 key_mgmt WPA-PSK→SET_NETWORK 0 psk \"12345Test\"→ENABLE_NETWORK 0→dhcpcd wlan0获取IP"}, {"id": "c408", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "注意", "back": "<div class=\"def-ans\">先在Settings开Wi-Fi；可清空Settings中已知网络避免WifiService干扰；WPAS支持多客户端</div>", "backText": "先在Settings开Wi-Fi；可清空Settings中已知网络避免WifiService干扰；WPAS支持多客户端"}, {"id": "c409", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "所有客户端命令入口", "back": "<div class=\"def-ans\">eloop读回调wpa_supplicant_ctrl_iface_receive——recvfrom收命令；处理\"ATTACH\"/\"DETACH\"/\"LEVEL\"；其余交wpa_supplicant_ctrl_iface_process</div>", "backText": "eloop读回调wpa_supplicant_ctrl_iface_receive——recvfrom收命令；处理\"ATTACH\"/\"DETACH\"/\"LEVEL\"；其余交wpa_supplicant_ctrl_iface_process"}, {"id": "c410", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "4.5.1 ADD_NETWORK命令处理", "back": "<ul class=\"ans-list\"><li>wpa_supplicant_ctrl_iface_process：分配4096字节reply，按命令名分发；reply_len&lt;0时回复\"FAIL\"</li><li>wpa_supplicant_ctrl_iface_add_network：wpa_config_add_network分配wpa_ssid并挂入wpa_config链表→disabled=1（未启用）→wpa_config_set_network_defaults→返回ssid-&gt;id</li><li>默认值：proto、pairwise_cipher、group_cipher、key_mgmt取DEFAULT_*；eapol_flags=DEFAULT_EAPOL_FLAGS（单播+组播动态WEP Key）；eap_workaround=1；fragment_size=1398</li></ul>", "backText": "wpa_supplicant_ctrl_iface_process：分配4096字节reply，按命令名分发；reply_len<0时回复\"FAIL\"; wpa_supplicant_ctrl_iface_add_network：wpa_config_add_network分配wpa_ssid并挂入wpa_config链表→disabled=1（未启用）→wpa_config_set_network_defaults→返回ssid->id; 默认值：proto、pairwise_cipher、group_cipher、key_mgmt取DEFAULT_*；eapol_flags=DEFAULT_EAPOL_FLAGS（单播+组播动态WEP Key）；eap_workaround=1；fragment_size=1398"}, {"id": "c411", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "默认值", "back": "<div class=\"def-ans\">proto、pairwise_cipher、group_cipher、key_mgmt取DEFAULT_*；eapol_flags=DEFAULT_EAPOL_FLAGS（单播+组播动态WEP Key）；eap_workaround=1；fragment_size=1398</div>", "backText": "proto、pairwise_cipher、group_cipher、key_mgmt取DEFAULT_*；eapol_flags=DEFAULT_EAPOL_FLAGS（单播+组播动态WEP Key）；eap_workaround=1；fragment_size=1398"}, {"id": "c412", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "4.5.2 SET_NETWORK命令处理", "back": "<ul class=\"ans-list\"><li>流程：解析\"&lt;id&gt; &lt;variable&gt; &lt;value&gt;\"→wpa_config_get_network按id找wpa_ssid→wpa_config_set设置值（宏+数组实现）→wpa_sm_pmksa_cache_flush清PMKSA缓存</li><li>本例结果：ssid=\"Test\"、key_mgmt=WPA_KEY_MGMT_PSK、passphrase=\"12345Test\"（命令中psk实际存入passphrase变量）</li><li>设置psk且ssid已有值时调wpa_config_update_psk：pbkdf2_sha1(passphrase, ssid, ssid_len, 4096, psk, PMK_LEN)将passphrase转成PSK</li><li>背景区分：Passphrase/Password为人读字符串，Key为二进制/十六进制；STA与AP交互用Key，用户设置Passphrase</li></ul>", "backText": "流程：解析\"<id> <variable> <value>\"→wpa_config_get_network按id找wpa_ssid→wpa_config_set设置值（宏+数组实现）→wpa_sm_pmksa_cache_flush清PMKSA缓存; 本例结果：ssid=\"Test\"、key_mgmt=WPA_KEY_MGMT_PSK、passphrase=\"12345Test\"（命令中psk实际存入passphrase变量）; 设置psk且ssid已有值时调wpa_config_update_psk：pbkdf2_sha1(passphrase, ssid, ssid_len, 4096, psk, PMK_LEN)将passphrase转成PSK; 背景区分：Passphrase/Password为人读字符串，Key为二进制/十六进制；STA与AP交互用Key，用户设置Passphrase"}, {"id": "c413", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "流程", "back": "<div class=\"def-ans\">解析\"&lt;id&gt; &lt;variable&gt; &lt;value&gt;\"→wpa_config_get_network按id找wpa_ssid→wpa_config_set设置值（宏+数组实现）→wpa_sm_pmksa_cache_flush清PMKSA缓存</div>", "backText": "解析\"<id> <variable> <value>\"→wpa_config_get_network按id找wpa_ssid→wpa_config_set设置值（宏+数组实现）→wpa_sm_pmksa_cache_flush清PMKSA缓存"}, {"id": "c414", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "本例结果", "back": "<div class=\"def-ans\">ssid=\"Test\"、key_mgmt=WPA_KEY_MGMT_PSK、passphrase=\"12345Test\"（命令中psk实际存入passphrase变量）</div>", "backText": "ssid=\"Test\"、key_mgmt=WPA_KEY_MGMT_PSK、passphrase=\"12345Test\"（命令中psk实际存入passphrase变量）"}, {"id": "c415", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "背景区分", "back": "<div class=\"def-ans\">Passphrase/Password为人读字符串，Key为二进制/十六进制；STA与AP交互用Key，用户设置Passphrase</div>", "backText": "Passphrase/Password为人读字符串，Key为二进制/十六进制；STA与AP交互用Key，用户设置Passphrase"}, {"id": "c416", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "4.5.3 ENABLE_NETWORK命令处理", "back": "<ul class=\"ans-list\"><li>wpa_supplicant_ctrl_iface_enable_network：参数\"all\"使能所有网络；disabled==2为P2P情况；调wpa_supplicant_enable_network</li><li>wpa_supplicant_enable_network：current_ssid为空时置reassociate=1并wpa_supplicant_req_scan(wpa_s,0,0)发起扫描；置disabled=0</li><li>无线网络扫描流程<ul class=\"sub\"><li>wpa_supplicant_req_scan：取消旧超时并按sec/usec重新注册（0,0表示立即执行）</li><li>wpa_supplicant_scan之一（参数准备）：ap_scan参数（默认1：WPAS完成AP扫描选择及后续关联、EAPOL认证绝大部分工作；0：驱动完成；2：类似0，NDIS常用）；max_ssids=min(wpa_s-&gt;max_scan_ssids, WPAS_MAX_SCAN_SSIDS)</li><li>wpa_driver_scan_params：一个scan请求对应的数据结构（可含多ssid）；wpa_supplicant_scan核心工作即正确填充它</li><li>wpa_supplicant_scan之二：状态置WPA_SCANNING；connect_without_scan非空（如WPS已知目标网络）则跳过扫描直接wpa_supplicant_associate；prev_scan_ssid记录上次扫描最后一个ssid（分批扫描续扫）；scan_ssid=1的网络（hidden ssid AP）加入params.ssids[]；wpa_supplicant_extra_ies（WPS等）</li><li>wpa_supplicant_scan之三：wpa_supplicant_trigger_scan→driver wrapper的scan2→wpa_driver_nl80211_scan：构造NL80211_CMD_TRIGGER_SCAN，填IFINDEX/SCAN_SSIDS/IE/SCAN_FREQUENCIES等；返回仅代表命令发送成功，扫描结束经driver event返回</li><li>扫描结果接收：driver完成后向\"scan\"组播发消息→process_global_event→NL80211_CMD_NEW_SCAN_RESULTS（置scan_complete_events=1、send_scan_event）</li><li>send_scan_event：填充scan_info（本次扫描请求的ssid与频率信息）；最终wpa_supplicant_event(ctx, EVENT_SCAN_RESULTS, &amp;event)</li><li>wpa_supplicant_event（events.c）是driver event统一入口；EVENT_SCAN_RESULTS→wpa_supplicant_event_scan_results</li><li>_wpa_supplicant_event_scan_results之一：wpa_supplicant_get_scan_results——wpa_drv_get_scan_results2（nl80211发NL80211_CMD_GET_SCAN取结果）；qsort按信噪比SNR等排序；wpa_bss_update更新wpa_bss链表；随机数池利用扫描结果增强随机性</li><li>之二：wpas_notify_scan_done通知客户端；核心wpa_supplicant_pick_network根据scan_res、wpa_bss与wpa_ssid匹配（ssid、安全设置、速率等）选出目标网络</li><li>之三：wpa_supplicant_need_to_roam判断是否漫游/切换；wpa_supplicant_connect(wpa_s, selected, ssid)发起关联</li></ul></li><li>关联流程<ul class=\"sub\"><li>wpa_supplicant_connect——WPS PBC overlap检查；wpa_supplicant_scard_init（EAP-SIM/AKA）；wpa_supplicant_associate发起关联</li><li>wpa_supplicant_associate之一：主要填充struct wpa_driver_associate_params；清wpa_s-&gt;bssid、设pending_bssid；取消扫描；清旧WPA/RSN IE</li><li>之二：按key_mgmt分支处理；auth_alg（WPA必须WPA_AUTH_ALG_OPEN）；目标AP含WPA IE（0x0050f201，MS OUI）或RSN IE时：pmksa_cache_set_current尝试OPC缓存；wpa_supplicant_set_suites结合AP的RSN/WPA IE生成关联用IE——本例结果proto=WPA_PROTO_RSN、cipher=WPA_CIPHER_CCMP、key_mgmt=WPA_KEY_MGMT_PSK；置状态WPA_ASSOCIATING</li><li>之三：填params（ssid/bssid/freq/wpa_ie/pairwise_suite/group_suite/key_mgmt_suite/auth_alg/mode/wep key/drop_unencrypted等）；wpa_drv_associate发关联请求；注册认证超时（ap_scan=1时10秒）；wpa_supplicant_initiate_eapol配置eapol/eap sm</li><li>wpa_driver_nl80211_associate：无SME（多数手机）时走wpa_driver_nl80211_connect发送NL80211_CMD_CONNECT——connect命令一次完成authentication+association两步</li><li>关联事件处理：driver返回NL80211_CMD_CONNECT→mlme_event_connect；status!=WLAN_STATUS_SUCCESS→EVENT_ASSOC_REJECT；成功则wpa_supplicant_event(ctx, EVENT_ASSOC)</li><li>wpa_supplicant_event_assoc：wpa_supplicant_event_associnfo更新RSN/WPA IE到assoc_wpa_ie；置状态WPA_ASSOCIATED；wpa_drv_get_bssid更新wpa_s-&gt;bssid；取current_bss；eapol_sm_notify_portEnabled(TRUE)触发EAPOL状态机动作</li></ul></li><li>4-Way Handshake（四次握手）<ul class=\"sub\"><li>背景：PTK加密单播，由PMK派生（SOHO下PMK即PSK）；GTK加密组播，由GMK派生；Group Key Handshake须在4-Way Handshake后</li><li>EAPOL-Key帧格式：Key Descriptor Type（RC4/WPA/RSN）；Key Information标志位（Key Descriptor Version、Key Type（1=PTK/0=GTK）、Install、Key ACK、Key MIC、Secure、Error、Request、Encrypted Key Data等）；Key Length；Replay Counter（防重放）；Key Nonce；Key IV；Key RSC；Key MIC；Key Data</li><li>四次握手流程<ul class=\"sub\"><li>Message A（AP→STA：Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B</li><li>Message B（含SNonce与MIC，Key Data含关联时获得的RSN IE以防中途更改安全参数）；AP处理：派生PTK、校验MIC→发Message C</li><li>Message C（Install=1、Secure=1、Encrypted Key Data=1；Key Data用KEK加密，内含AP的RSN IE、可能含GTK）；STA处理：校验Replay Counter/MIC、解密Key Data、取GTK、发Message D、安装PTK</li><li>Message D（含MIC）；AP处理：再校验MIC、安装PTK</li></ul></li><li>PTK组成（CCMP）：KCK（算MIC）、KEK（加解密Key Data）、TK（后续数据加密）</li><li>wpa_sm_rx_eapol（wpa.c）：只处理type=IEEE802_1X_TYPE_EAPOL_KEY；校验Key Descriptor Version、Replay Counter防重放、ACK/SMK位；MIC校验用KCK；Encrypted Key Data用KEK解密；Key Type=1时含MIC→process_3_of_4（Message C），否则process_1_of_4（Message A）；Key Type=0且MIC→process_1_of_2（Group Key Handshake）</li><li>wpa_supplicant_process_1_of_4：置WPA_4WAY_HANDSHAKE；解析Key Data IE；wpa_supplicant_get_pmk按pmkid查PMKSA；random_get_bytes生成SNonce；PTK先存临时变量tptk（收到Message C的MIC校验通过后才复制到sm-&gt;ptk）；wpa_derive_ptk派生；wpa_supplicant_send_2_of_4发Message B</li><li>wpa_supplicant_process_3_of_4：校验RSN（wpa_supplicant_validate_ie防安全参数中途改变）；wpa_supplicant_send_4_of_4发Message D；Install位→wpa_supplicant_install_ptk经wpa_driver_nl80211_set_key装key到驱动；Secure位→eapol_sm_notify_portValid(TRUE)；置WPA_GROUP_HANDSHAKE；ie.gtk→wpa_supplicant_pairwise_gtk；wpa_sm_set_rekey_offload（WoWLAN）</li><li>KDE与GTK格式：KDE Type=0xdd；GTK的OUI=00-0F-AC、Data Type=1；KeyID 0～3；Tx位=1表示收发组播都用该GTK</li><li>wpa_supplicant_pairwise_gtk：解析KeyID/Tx→拷贝GTK→check_group_cipher→install_gtk（含Key RSC）→wpa_supplicant_key_neg_complete</li><li>wpa_supplicant_key_neg_complete：取消认证超时；wpa_sm_set_state(WPA_COMPLETED)；eapol_sm_notify_portValid(TRUE)、PSK下eapol_sm_notify_eap_success(TRUE)；注册1秒后wpa_sm_start_preauth</li><li>wpa_sm_set_state→回调→wpa_supplicant_set_state：进入WPA_COMPLETED时wpa_drv_set_operstate(1)（IfOperStatus→UP）、wpa_drv_set_supp_port(1)；DISCONNECTED等状态时operstate=0（DORMANT）</li><li>4-Way Handshake中EAPOL/EAP状态机变化：eapSuccess→SUPP_PAE进AUTHENTICATING→SUPP_BE进SUCCESS；第二轮suppSuccess+portValid→SUPP_PAE进AUTHENTICATED（suppPortStatus=Authorized）；最后dhcpcd取IP即可上网</li></ul></li></ul>", "backText": "wpa_supplicant_ctrl_iface_enable_network：参数\"all\"使能所有网络；disabled==2为P2P情况；调wpa_supplicant_enable_network; wpa_supplicant_enable_network：current_ssid为空时置reassociate=1并wpa_supplicant_req_scan(wpa_s,0,0)发起扫描；置disabled=0; 无线网络扫描流程; 关联流程; 4-Way Handshake（四次握手）"}, {"id": "c417", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_enable_network", "back": "<div class=\"def-ans\">current_ssid为空时置reassociate=1并wpa_supplicant_req_scan(wpa_s,0,0)发起扫描；置disabled=0</div>", "backText": "current_ssid为空时置reassociate=1并wpa_supplicant_req_scan(wpa_s,0,0)发起扫描；置disabled=0"}, {"id": "c418", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "无线网络扫描流程", "back": "<ul class=\"ans-list\"><li>wpa_supplicant_req_scan：取消旧超时并按sec/usec重新注册（0,0表示立即执行）</li><li>wpa_supplicant_scan之一（参数准备）：ap_scan参数（默认1：WPAS完成AP扫描选择及后续关联、EAPOL认证绝大部分工作；0：驱动完成；2：类似0，NDIS常用）；max_ssids=min(wpa_s-&gt;max_scan_ssids, WPAS_MAX_SCAN_SSIDS)</li><li>wpa_driver_scan_params：一个scan请求对应的数据结构（可含多ssid）；wpa_supplicant_scan核心工作即正确填充它</li><li>wpa_supplicant_scan之二：状态置WPA_SCANNING；connect_without_scan非空（如WPS已知目标网络）则跳过扫描直接wpa_supplicant_associate；prev_scan_ssid记录上次扫描最后一个ssid（分批扫描续扫）；scan_ssid=1的网络（hidden ssid AP）加入params.ssids[]；wpa_supplicant_extra_ies（WPS等）</li><li>wpa_supplicant_scan之三：wpa_supplicant_trigger_scan→driver wrapper的scan2→wpa_driver_nl80211_scan：构造NL80211_CMD_TRIGGER_SCAN，填IFINDEX/SCAN_SSIDS/IE/SCAN_FREQUENCIES等；返回仅代表命令发送成功，扫描结束经driver event返回</li><li>扫描结果接收：driver完成后向\"scan\"组播发消息→process_global_event→NL80211_CMD_NEW_SCAN_RESULTS（置scan_complete_events=1、send_scan_event）</li><li>send_scan_event：填充scan_info（本次扫描请求的ssid与频率信息）；最终wpa_supplicant_event(ctx, EVENT_SCAN_RESULTS, &amp;event)</li><li>wpa_supplicant_event（events.c）是driver event统一入口；EVENT_SCAN_RESULTS→wpa_supplicant_event_scan_results</li><li>_wpa_supplicant_event_scan_results之一：wpa_supplicant_get_scan_results——wpa_drv_get_scan_results2（nl80211发NL80211_CMD_GET_SCAN取结果）；qsort按信噪比SNR等排序；wpa_bss_update更新wpa_bss链表；随机数池利用扫描结果增强随机性</li><li>之二：wpas_notify_scan_done通知客户端；核心wpa_supplicant_pick_network根据scan_res、wpa_bss与wpa_ssid匹配（ssid、安全设置、速率等）选出目标网络</li><li>之三：wpa_supplicant_need_to_roam判断是否漫游/切换；wpa_supplicant_connect(wpa_s, selected, ssid)发起关联</li></ul>", "backText": "wpa_supplicant_req_scan：取消旧超时并按sec/usec重新注册（0,0表示立即执行）; wpa_supplicant_scan之一（参数准备）：ap_scan参数（默认1：WPAS完成AP扫描选择及后续关联、EAPOL认证绝大部分工作；0：驱动完成；2：类似0，NDIS常用）；max_ssids=min(wpa_s->max_scan_ssids, WPAS_MAX_SCAN_SSIDS); wpa_driver_scan_params：一个scan请求对应的数据结构（可含多ssid）；wpa_supplicant_scan核心工作即正确填充它; wpa_supplicant_scan之二：状态置WPA_SCANNING；connect_without_scan非空（如WPS已知目标网络）则跳过扫描直接wpa_supplicant_associate；prev_scan_ssid记录上次扫描最后一个ssid（分批扫描续扫）；scan_ssid=1的网络（hidden ssid AP）加入params.ssids[]；wpa_supplicant_extra_ies（WPS等）; wpa_supplicant_scan之三：wpa_supplicant_trigger_scan→driver wrapper的scan2→wpa_driver_nl80211_scan：构造NL80211_CMD_TRIGGER_SCAN，填IFINDEX/SCAN_SSIDS/IE/SCAN_FREQUENCIES等；返回仅代表命令发送成功，扫描结束经driver event返回; 扫描结果接收：driver完成后向\"scan\"组播发消息→process_global_event→NL80211_CMD_NEW_SCAN_RESULTS（置scan_complete_events=1、send_scan_event）"}, {"id": "c419", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_req_scan", "back": "<div class=\"def-ans\">取消旧超时并按sec/usec重新注册（0,0表示立即执行）</div>", "backText": "取消旧超时并按sec/usec重新注册（0,0表示立即执行）"}, {"id": "c420", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_scan之一（参数准备）", "back": "<div class=\"def-ans\">ap_scan参数（默认1：WPAS完成AP扫描选择及后续关联、EAPOL认证绝大部分工作；0：驱动完成；2：类似0，NDIS常用）；max_ssids=min(wpa_s-&gt;max_scan_ssids, WPAS_MAX_SCAN_SSIDS)</div>", "backText": "ap_scan参数（默认1：WPAS完成AP扫描选择及后续关联、EAPOL认证绝大部分工作；0：驱动完成；2：类似0，NDIS常用）；max_ssids=min(wpa_s->max_scan_ssids, WPAS_MAX_SCAN_SSIDS)"}, {"id": "c421", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_driver_scan_params", "back": "<div class=\"def-ans\">一个scan请求对应的数据结构（可含多ssid）；wpa_supplicant_scan核心工作即正确填充它</div>", "backText": "一个scan请求对应的数据结构（可含多ssid）；wpa_supplicant_scan核心工作即正确填充它"}, {"id": "c422", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "
