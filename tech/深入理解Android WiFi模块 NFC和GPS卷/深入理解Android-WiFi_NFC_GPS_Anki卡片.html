 "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "之二", "back": "<div class=\"def-ans\">wpas_notify_scan_done通知客户端；核心wpa_supplicant_pick_network根据scan_res、wpa_bss与wpa_ssid匹配（ssid、安全设置、速率等）选出目标网络</div>", "backText": "wpas_notify_scan_done通知客户端；核心wpa_supplicant_pick_network根据scan_res、wpa_bss与wpa_ssid匹配（ssid、安全设置、速率等）选出目标网络"}, {"id": "c427", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "之三", "back": "<div class=\"def-ans\">wpa_supplicant_need_to_roam判断是否漫游/切换；wpa_supplicant_connect(wpa_s, selected, ssid)发起关联</div>", "backText": "wpa_supplicant_need_to_roam判断是否漫游/切换；wpa_supplicant_connect(wpa_s, selected, ssid)发起关联"}, {"id": "c428", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "关联流程", "back": "<ul class=\"ans-list\"><li>wpa_supplicant_connect——WPS PBC overlap检查；wpa_supplicant_scard_init（EAP-SIM/AKA）；wpa_supplicant_associate发起关联</li><li>wpa_supplicant_associate之一：主要填充struct wpa_driver_associate_params；清wpa_s-&gt;bssid、设pending_bssid；取消扫描；清旧WPA/RSN IE</li><li>之二：按key_mgmt分支处理；auth_alg（WPA必须WPA_AUTH_ALG_OPEN）；目标AP含WPA IE（0x0050f201，MS OUI）或RSN IE时：pmksa_cache_set_current尝试OPC缓存；wpa_supplicant_set_suites结合AP的RSN/WPA IE生成关联用IE——本例结果proto=WPA_PROTO_RSN、cipher=WPA_CIPHER_CCMP、key_mgmt=WPA_KEY_MGMT_PSK；置状态WPA_ASSOCIATING</li><li>之三：填params（ssid/bssid/freq/wpa_ie/pairwise_suite/group_suite/key_mgmt_suite/auth_alg/mode/wep key/drop_unencrypted等）；wpa_drv_associate发关联请求；注册认证超时（ap_scan=1时10秒）；wpa_supplicant_initiate_eapol配置eapol/eap sm</li><li>wpa_driver_nl80211_associate：无SME（多数手机）时走wpa_driver_nl80211_connect发送NL80211_CMD_CONNECT——connect命令一次完成authentication+association两步</li><li>关联事件处理：driver返回NL80211_CMD_CONNECT→mlme_event_connect；status!=WLAN_STATUS_SUCCESS→EVENT_ASSOC_REJECT；成功则wpa_supplicant_event(ctx, EVENT_ASSOC)</li><li>wpa_supplicant_event_assoc：wpa_supplicant_event_associnfo更新RSN/WPA IE到assoc_wpa_ie；置状态WPA_ASSOCIATED；wpa_drv_get_bssid更新wpa_s-&gt;bssid；取current_bss；eapol_sm_notify_portEnabled(TRUE)触发EAPOL状态机动作</li></ul>", "backText": "wpa_supplicant_connect——WPS PBC overlap检查；wpa_supplicant_scard_init（EAP-SIM/AKA）；wpa_supplicant_associate发起关联; wpa_supplicant_associate之一：主要填充struct wpa_driver_associate_params；清wpa_s->bssid、设pending_bssid；取消扫描；清旧WPA/RSN IE; 之二：按key_mgmt分支处理；auth_alg（WPA必须WPA_AUTH_ALG_OPEN）；目标AP含WPA IE（0x0050f201，MS OUI）或RSN IE时：pmksa_cache_set_current尝试OPC缓存；wpa_supplicant_set_suites结合AP的RSN/WPA IE生成关联用IE——本例结果proto=WPA_PROTO_RSN、cipher=WPA_CIPHER_CCMP、key_mgmt=WPA_KEY_MGMT_PSK；置状态WPA_ASSOCIATING; 之三：填params（ssid/bssid/freq/wpa_ie/pairwise_suite/group_suite/key_mgmt_suite/auth_alg/mode/wep key/drop_unencrypted等）；wpa_drv_associate发关联请求；注册认证超时（ap_scan=1时10秒）；wpa_supplicant_initiate_eapol配置eapol/eap sm; wpa_driver_nl80211_associate：无SME（多数手机）时走wpa_driver_nl80211_connect发送NL80211_CMD_CONNECT——connect命令一次完成authentication+association两步; 关联事件处理：driver返回NL80211_CMD_CONNECT→mlme_event_connect；status!=WLAN_STATUS_SUCCESS→EVENT_ASSOC_REJECT；成功则wpa_supplicant_event(ctx, EVENT_ASSOC)"}, {"id": "c429", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_associate之一", "back": "<div class=\"def-ans\">主要填充struct wpa_driver_associate_params；清wpa_s-&gt;bssid、设pending_bssid；取消扫描；清旧WPA/RSN IE</div>", "backText": "主要填充struct wpa_driver_associate_params；清wpa_s->bssid、设pending_bssid；取消扫描；清旧WPA/RSN IE"}, {"id": "c432", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_driver_nl80211_associate", "back": "<div class=\"def-ans\">无SME（多数手机）时走wpa_driver_nl80211_connect发送NL80211_CMD_CONNECT——connect命令一次完成authentication+association两步</div>", "backText": "无SME（多数手机）时走wpa_driver_nl80211_connect发送NL80211_CMD_CONNECT——connect命令一次完成authentication+association两步"}, {"id": "c433", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "关联事件处理", "back": "<div class=\"def-ans\">driver返回NL80211_CMD_CONNECT→mlme_event_connect；status!=WLAN_STATUS_SUCCESS→EVENT_ASSOC_REJECT；成功则wpa_supplicant_event(ctx, EVENT_ASSOC)</div>", "backText": "driver返回NL80211_CMD_CONNECT→mlme_event_connect；status!=WLAN_STATUS_SUCCESS→EVENT_ASSOC_REJECT；成功则wpa_supplicant_event(ctx, EVENT_ASSOC)"}, {"id": "c434", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_event_assoc", "back": "<div class=\"def-ans\">wpa_supplicant_event_associnfo更新RSN/WPA IE到assoc_wpa_ie；置状态WPA_ASSOCIATED；wpa_drv_get_bssid更新wpa_s-&gt;bssid；取current_bss；eapol_sm_notify_portEnabled(TRUE)触发EAPOL状态机动作</div>", "backText": "wpa_supplicant_event_associnfo更新RSN/WPA IE到assoc_wpa_ie；置状态WPA_ASSOCIATED；wpa_drv_get_bssid更新wpa_s->bssid；取current_bss；eapol_sm_notify_portEnabled(TRUE)触发EAPOL状态机动作"}, {"id": "c435", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "4-Way Handshake（四次握手）", "back": "<ul class=\"ans-list\"><li>背景：PTK加密单播，由PMK派生（SOHO下PMK即PSK）；GTK加密组播，由GMK派生；Group Key Handshake须在4-Way Handshake后</li><li>EAPOL-Key帧格式：Key Descriptor Type（RC4/WPA/RSN）；Key Information标志位（Key Descriptor Version、Key Type（1=PTK/0=GTK）、Install、Key ACK、Key MIC、Secure、Error、Request、Encrypted Key Data等）；Key Length；Replay Counter（防重放）；Key Nonce；Key IV；Key RSC；Key MIC；Key Data</li><li>四次握手流程<ul class=\"sub\"><li>Message A（AP→STA：Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B</li><li>Message B（含SNonce与MIC，Key Data含关联时获得的RSN IE以防中途更改安全参数）；AP处理：派生PTK、校验MIC→发Message C</li><li>Message C（Install=1、Secure=1、Encrypted Key Data=1；Key Data用KEK加密，内含AP的RSN IE、可能含GTK）；STA处理：校验Replay Counter/MIC、解密Key Data、取GTK、发Message D、安装PTK</li><li>Message D（含MIC）；AP处理：再校验MIC、安装PTK</li></ul></li><li>PTK组成（CCMP）：KCK（算MIC）、KEK（加解密Key Data）、TK（后续数据加密）</li><li>wpa_sm_rx_eapol（wpa.c）：只处理type=IEEE802_1X_TYPE_EAPOL_KEY；校验Key Descriptor Version、Replay Counter防重放、ACK/SMK位；MIC校验用KCK；Encrypted Key Data用KEK解密；Key Type=1时含MIC→process_3_of_4（Message C），否则process_1_of_4（Message A）；Key Type=0且MIC→process_1_of_2（Group Key Handshake）</li><li>wpa_supplicant_process_1_of_4：置WPA_4WAY_HANDSHAKE；解析Key Data IE；wpa_supplicant_get_pmk按pmkid查PMKSA；random_get_bytes生成SNonce；PTK先存临时变量tptk（收到Message C的MIC校验通过后才复制到sm-&gt;ptk）；wpa_derive_ptk派生；wpa_supplicant_send_2_of_4发Message B</li><li>wpa_supplicant_process_3_of_4：校验RSN（wpa_supplicant_validate_ie防安全参数中途改变）；wpa_supplicant_send_4_of_4发Message D；Install位→wpa_supplicant_install_ptk经wpa_driver_nl80211_set_key装key到驱动；Secure位→eapol_sm_notify_portValid(TRUE)；置WPA_GROUP_HANDSHAKE；ie.gtk→wpa_supplicant_pairwise_gtk；wpa_sm_set_rekey_offload（WoWLAN）</li><li>KDE与GTK格式：KDE Type=0xdd；GTK的OUI=00-0F-AC、Data Type=1；KeyID 0～3；Tx位=1表示收发组播都用该GTK</li><li>wpa_supplicant_pairwise_gtk：解析KeyID/Tx→拷贝GTK→check_group_cipher→install_gtk（含Key RSC）→wpa_supplicant_key_neg_complete</li><li>wpa_supplicant_key_neg_complete：取消认证超时；wpa_sm_set_state(WPA_COMPLETED)；eapol_sm_notify_portValid(TRUE)、PSK下eapol_sm_notify_eap_success(TRUE)；注册1秒后wpa_sm_start_preauth</li><li>wpa_sm_set_state→回调→wpa_supplicant_set_state：进入WPA_COMPLETED时wpa_drv_set_operstate(1)（IfOperStatus→UP）、wpa_drv_set_supp_port(1)；DISCONNECTED等状态时operstate=0（DORMANT）</li><li>4-Way Handshake中EAPOL/EAP状态机变化：eapSuccess→SUPP_PAE进AUTHENTICATING→SUPP_BE进SUCCESS；第二轮suppSuccess+portValid→SUPP_PAE进AUTHENTICATED（suppPortStatus=Authorized）；最后dhcpcd取IP即可上网</li></ul>", "backText": "背景：PTK加密单播，由PMK派生（SOHO下PMK即PSK）；GTK加密组播，由GMK派生；Group Key Handshake须在4-Way Handshake后; EAPOL-Key帧格式：Key Descriptor Type（RC4/WPA/RSN）；Key Information标志位（Key Descriptor Version、Key Type（1=PTK/0=GTK）、Install、Key ACK、Key MIC、Secure、Error、Request、Encrypted Key Data等）；Key Length；Replay Counter（防重放）；Key Nonce；Key IV；Key RSC；Key MIC；Key Data; 四次握手流程; PTK组成（CCMP）：KCK（算MIC）、KEK（加解密Key Data）、TK（后续数据加密）; wpa_sm_rx_eapol（wpa.c）：只处理type=IEEE802_1X_TYPE_EAPOL_KEY；校验Key Descriptor Version、Replay Counter防重放、ACK/SMK位；MIC校验用KCK；Encrypted Key Data用KEK解密；Key Type=1时含MIC→process_3_of_4（Message C），否则process_1_of_4（Message A）；Key Type=0且MIC→process_1_of_2（Group Key Handshake）; wpa_supplicant_process_1_of_4：置WPA_4WAY_HANDSHAKE；解析Key Data IE；wpa_supplicant_get_pmk按pmkid查PMKSA；random_get_bytes生成SNonce；PTK先存临时变量tptk（收到Message C的MIC校验通过后才复制到sm->ptk）；wpa_derive_ptk派生；wpa_supplicant_send_2_of_4发Message B"}, {"id": "c436", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "背景", "back": "<div class=\"def-ans\">PTK加密单播，由PMK派生（SOHO下PMK即PSK）；GTK加密组播，由GMK派生；Group Key Handshake须在4-Way Handshake后</div>", "backText": "PTK加密单播，由PMK派生（SOHO下PMK即PSK）；GTK加密组播，由GMK派生；Group Key Handshake须在4-Way Handshake后"}, {"id": "c437", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "EAPOL-Key帧格式", "back": "<div class=\"def-ans\">Key Descriptor Type（RC4/WPA/RSN）；Key Information标志位（Key Descriptor Version、Key Type（1=PTK/0=GTK）、Install、Key ACK、Key MIC、Secure、Error、Request、Encrypted Key Data等）；Key Length；Replay Counter（防重放）；Key Nonce；Key IV；Key RSC；Key MIC；Key Data</div>", "backText": "Key Descriptor Type（RC4/WPA/RSN）；Key Information标志位（Key Descriptor Version、Key Type（1=PTK/0=GTK）、Install、Key ACK、Key MIC、Secure、Error、Request、Encrypted Key Data等）；Key Length；Replay Counter（防重放）；Key Nonce；Key IV；Key RSC；Key MIC；Key Data"}, {"id": "c438", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "四次握手流程", "back": "<ul class=\"ans-list\"><li>Message A（AP→STA：Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B</li><li>Message B（含SNonce与MIC，Key Data含关联时获得的RSN IE以防中途更改安全参数）；AP处理：派生PTK、校验MIC→发Message C</li><li>Message C（Install=1、Secure=1、Encrypted Key Data=1；Key Data用KEK加密，内含AP的RSN IE、可能含GTK）；STA处理：校验Replay Counter/MIC、解密Key Data、取GTK、发Message D、安装PTK</li><li>Message D（含MIC）；AP处理：再校验MIC、安装PTK</li></ul>", "backText": "Message A（AP→STA：Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B; Message B（含SNonce与MIC，Key Data含关联时获得的RSN IE以防中途更改安全参数）；AP处理：派生PTK、校验MIC→发Message C; Message C（Install=1、Secure=1、Encrypted Key Data=1；Key Data用KEK加密，内含AP的RSN IE、可能含GTK）；STA处理：校验Replay Counter/MIC、解密Key Data、取GTK、发Message D、安装PTK; Message D（含MIC）；AP处理：再校验MIC、安装PTK"}, {"id": "c439", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "Message A（AP→STA", "back": "<div class=\"def-ans\">Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B</div>", "backText": "Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B"}, {"id": "c440", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "PTK组成（CCMP）", "back": "<div class=\"def-ans\">KCK（算MIC）、KEK（加解密Key Data）、TK（后续数据加密）</div>", "backText": "KCK（算MIC）、KEK（加解密Key Data）、TK（后续数据加密）"}, {"id": "c441", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_sm_rx_eapol（wpa.c）", "back": "<div class=\"def-ans\">只处理type=IEEE802_1X_TYPE_EAPOL_KEY；校验Key Descriptor Version、Replay Counter防重放、ACK/SMK位；MIC校验用KCK；Encrypted Key Data用KEK解密；Key Type=1时含MIC→process_3_of_4（Message C），否则process_1_of_4（Message A）；Key Type=0且MIC→process_1_of_2（Group Key Handshake）</div>", "backText": "只处理type=IEEE802_1X_TYPE_EAPOL_KEY；校验Key Descriptor Version、Replay Counter防重放、ACK/SMK位；MIC校验用KCK；Encrypted Key Data用KEK解密；Key Type=1时含MIC→process_3_of_4（Message C），否则process_1_of_4（Message A）；Key Type=0且MIC→process_1_of_2（Group Key Handshake）"}, {"id": "c442", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_process_1_of_4", "back": "<div class=\"def-ans\">置WPA_4WAY_HANDSHAKE；解析Key Data IE；wpa_supplicant_get_pmk按pmkid查PMKSA；random_get_bytes生成SNonce；PTK先存临时变量tptk（收到Message C的MIC校验通过后才复制到sm-&gt;ptk）；wpa_derive_ptk派生；wpa_supplicant_send_2_of_4发Message B</div>", "backText": "置WPA_4WAY_HANDSHAKE；解析Key Data IE；wpa_supplicant_get_pmk按pmkid查PMKSA；random_get_bytes生成SNonce；PTK先存临时变量tptk（收到Message C的MIC校验通过后才复制到sm->ptk）；wpa_derive_ptk派生；wpa_supplicant_send_2_of_4发Message B"}, {"id": "c443", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_process_3_of_4", "back": "<div class=\"def-ans\">校验RSN（wpa_supplicant_validate_ie防安全参数中途改变）；wpa_supplicant_send_4_of_4发Message D；Install位→wpa_supplicant_install_ptk经wpa_driver_nl80211_set_key装key到驱动；Secure位→eapol_sm_notify_portValid(TRUE)；置WPA_GROUP_HANDSHAKE；ie.gtk→wpa_supplicant_pairwise_gtk；wpa_sm_set_rekey_offload（WoWLAN）</div>", "backText": "校验RSN（wpa_supplicant_validate_ie防安全参数中途改变）；wpa_supplicant_send_4_of_4发Message D；Install位→wpa_supplicant_install_ptk经wpa_driver_nl80211_set_key装key到驱动；Secure位→eapol_sm_notify_portValid(TRUE)；置WPA_GROUP_HANDSHAKE；ie.gtk→wpa_supplicant_pairwise_gtk；wpa_sm_set_rekey_offload（WoWLAN）"}, {"id": "c444", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "KDE与GTK格式", "back": "<div class=\"def-ans\">KDE Type=0xdd；GTK的OUI=00-0F-AC、Data Type=1；KeyID 0～3；Tx位=1表示收发组播都用该GTK</div>", "backText": "KDE Type=0xdd；GTK的OUI=00-0F-AC、Data Type=1；KeyID 0～3；Tx位=1表示收发组播都用该GTK"}, {"id": "c445", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "wpa_supplicant_pairwise_gtk", "back": "<div class=\"def-ans\">解析KeyID/Tx→拷贝GTK→check_group_cipher→install_gtk（含Key RSC）→wpa_supplicant_key_neg_complete</div>", "backText": "解析KeyID/Tx→拷贝GTK→check_group_cipher→install_gtk（含Key RSC）→wpa_supplicant_key_neg_complete"}, {"id": "c446", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.5 wpa_supplicant连接无线网络分析", "front": "4-Way Handshake中EAPOL/EAP状态机变化", "back": "<div class=\"def-ans\">eapSuccess→SUPP_PAE进AUTHENTICATING→SUPP_BE进SUCCESS；第二轮suppSuccess+portValid→SUPP_PAE进AUTHENTICATED（suppPortStatus=Authorized）；最后dhcpcd取IP即可上网</div>", "backText": "eapSuccess→SUPP_PAE进AUTHENTICATING→SUPP_BE进SUCCESS；第二轮suppSuccess+portValid→SUPP_PAE进AUTHENTICATED（suppPortStatus=Authorized）；最后dhcpcd取IP即可上网"}, {"id": "c447", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.6 本章总结和参考资料说明", "front": "本章总结", "back": "<ul class=\"ans-list\"><li>WPAS启动路线：多种多样的数据结构及其复杂关系，兼具背景含义的成员变量深入解析</li><li>EAPOL/EAP模块：先协议理论后代码实现；状态机代码比状态切换图复杂，建议对照学习</li><li>扫描、关联及4-Way Handshake：以最简单的WPA-PSK实例讲解核心流程；实际流程远比书中内容庞大（WPS、P2P、802.11r、802.11w等均穿插其中）；先掌握最简流程再渐进加入其他功能</li><li>分析目标是Android 4.1的WPAS；Android 4.2版本变化主要是新增功能与bug修复</li></ul>", "backText": "WPAS启动路线：多种多样的数据结构及其复杂关系，兼具背景含义的成员变量深入解析; EAPOL/EAP模块：先协议理论后代码实现；状态机代码比状态切换图复杂，建议对照学习; 扫描、关联及4-Way Handshake：以最简单的WPA-PSK实例讲解核心流程；实际流程远比书中内容庞大（WPS、P2P、802.11r、802.11w等均穿插其中）；先掌握最简流程再渐进加入其他功能; 分析目标是Android 4.1的WPAS；Android 4.2版本变化主要是新增功能与bug修复"}, {"id": "c448", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.6 本章总结和参考资料说明", "front": "WPAS启动路线", "back": "<div class=\"def-ans\">多种多样的数据结构及其复杂关系，兼具背景含义的成员变量深入解析</div>", "backText": "多种多样的数据结构及其复杂关系，兼具背景含义的成员变量深入解析"}, {"id": "c449", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.6 本章总结和参考资料说明", "front": "EAPOL/EAP模块", "back": "<div class=\"def-ans\">先协议理论后代码实现；状态机代码比状态切换图复杂，建议对照学习</div>", "backText": "先协议理论后代码实现；状态机代码比状态切换图复杂，建议对照学习"}, {"id": "c450", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.6 本章总结和参考资料说明", "front": "扫描、关联及4-Way Handshake", "back": "<div class=\"def-ans\">以最简单的WPA-PSK实例讲解核心流程；实际流程远比书中内容庞大（WPS、P2P、802.11r、802.11w等均穿插其中）；先掌握最简流程再渐进加入其他功能</div>", "backText": "以最简单的WPA-PSK实例讲解核心流程；实际流程远比书中内容庞大（WPS、P2P、802.11r、802.11w等均穿插其中）；先掌握最简流程再渐进加入其他功能"}, {"id": "c451", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第4章 深入理解wpa_supplicant", "section": "4.6 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">维基百科EAP；wpa_supplicant官方开发文档；《802.11-2012》附录M.4（passphrase-to-PSK映射）；8.4.2.27.2 Cipher suites；8.4.2.27.3 AKM suites；第12章Fast BSS Transition；rfkill资料；RFC2863；RFC4137 PDF（图示状态机）；IEEE 802.1X-2004；第11.6节Keys and key distribution；WoWLAN资料</div>", "backText": "维基百科EAP；wpa_supplicant官方开发文档；《802.11-2012》附录M.4（passphrase-to-PSK映射）；8.4.2.27.2 Cipher suites；8.4.2.27.3 AKM suites；第12章Fast BSS Transition；rfkill资料；RFC2863；RFC4137 PDF（图示状态机）；IEEE 802.1X-2004；第11.6节Keys and key distribution；WoWLAN资料"}, {"id": "c452", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.1 概述", "front": "分析路线一", "back": "<div class=\"def-ans\">WifiService的创建及初始化</div>", "backText": "WifiService的创建及初始化"}, {"id": "c453", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.1 概述", "front": "分析路线二", "back": "<div class=\"def-ans\">在Settings中打开Wi-Fi、扫描无线网络及加入目标无线网络</div>", "backText": "在Settings中打开Wi-Fi、扫描无线网络及加入目标无线网络"}, {"id": "c454", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.1 概述", "front": "类图结构要点", "back": "<div class=\"def-ans\">IWifiManager、IWifiManager.Stub、IWifiManager.Stub.Proxy由aidl编译生成；WifiService派生自IWifiManager.Stub，是Binder服务端；WifiManager通过成员变量mService与WifiService进行Binder交互</div>", "backText": "IWifiManager、IWifiManager.Stub、IWifiManager.Stub.Proxy由aidl编译生成；WifiService派生自IWifiManager.Stub，是Binder服务端；WifiManager通过成员变量mService与WifiService进行Binder交互"}, {"id": "c455", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "WifiService在SystemServer进程中被创建", "back": "<div class=\"def-ans\">new WifiService(context)并通过ServiceManager.addService注册</div>", "backText": "new WifiService(context)并通过ServiceManager.addService注册"}, {"id": "c456", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "正式分析前需先掌握两个基础知识", "back": "<div class=\"def-ans\">HSM（Hierarchical State Machine，层次状态机）和AsyncChannel</div>", "backText": "HSM（Hierarchical State Machine，层次状态机）和AsyncChannel"}, {"id": "c457", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "5.2.1 HSM和AsyncChannel介绍", "back": "<ul class=\"ans-list\"><li>两者对应Framework中的StateMachine类和AsyncChannel类，仅由Framework内部使用，不包含在SDK中</li><li>HSM（层次状态机）核心概念<ul class=\"sub\"><li>在传统状态机基础上引入状态间的层级关系，类似Java父子类的派生继承关系</li><li>父状态实现generic（通用）功能，子状态实现特定处理；但父子状态是两个毫无派生关系的类</li><li>状态由State类表达；addState(状态, 父状态)添加状态并指定层级；setInitialState设置初始状态；start启动状态机</li><li>每个State的核心函数：enter（Entry Action）、exit（Exit Action）、processMessage（成功返回HANDLED，否则返回NOT_HANDLED）</li><li>消息处理向上冒泡：子状态返回NOT_HANDLED时交给父状态处理；全部无法处理时调用unhandledMessage</li><li>transitionTo切换状态；deferMessage保留消息留待下一个新状态处理（deferred消息在新状态进入后优先处理）</li><li>外界通过obtainMessage/sendMessage向HSM发消息；停止状态机用quit或quitNow</li><li>EA执行顺序：start后初始状态及其祖先状态的enter按祖先→子孙顺序执行</li><li>状态切换时执行顺序：旧状态的exit沿派生树向上执行（直到最近公共祖先），然后新状态的enter沿派生树向下执行；类似C++构造/析构函数的顺序</li></ul></li><li>AsyncChannel（异步通道）核心概念<ul class=\"sub\"><li>用于两个Handler之间的通信（同进程或跨进程）：源Handler通过sendMessage发消息，目标Handler通过replyToMessage回复结果</li><li>两种应用模式：①简单request/response模式——Server端无须维护Client信息，Client用connectSync或connect连接；②Server端维护Client信息——Server可向Client主动推送消息（WifiService相关模块多用第二种）</li><li>第二种模式异步连接六步骤：①Client调connect，收到CMD_CHANNEL_HALF_CONNECTED；②Client发CMD_CHANNEL_FULL_CONNECTION给Server；③Server处理成功后发CMD_CHANNEL_FULLY_CONNECTED；④Client收到即连接建立；⑤双方用sendMessage/replyToMessage收发消息；⑥任一端调disconnect</li><li>实现细节：AsyncChannel对象无法通过Binder跨进程传递，正确做法是Server自己new一个AsyncChannel并connect回Client（两端各存在一个AsyncChannel对象）</li><li>WifiManager的init函数：通过Binder调WifiService的getWifiServiceMessenger，创建ServiceHandler，再调mAsyncChannel.connect</li><li>WifiService端AsyncServiceHandler收到CMD_CHANNEL_FULL_CONNECTION后新建AsyncChannel并connect回Client，CMD_CHANNEL_HALF_CONNECTED时存入mClients用于向Client发消息</li></ul></li></ul>", "backText": "两者对应Framework中的StateMachine类和AsyncChannel类，仅由Framework内部使用，不包含在SDK中; HSM（层次状态机）核心概念; AsyncChannel（异步通道）核心概念"}, {"id": "c458", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "HSM（层次状态机）核心概念", "back": "<ul class=\"ans-list\"><li>在传统状态机基础上引入状态间的层级关系，类似Java父子类的派生继承关系</li><li>父状态实现generic（通用）功能，子状态实现特定处理；但父子状态是两个毫无派生关系的类</li><li>状态由State类表达；addState(状态, 父状态)添加状态并指定层级；setInitialState设置初始状态；start启动状态机</li><li>每个State的核心函数：enter（Entry Action）、exit（Exit Action）、processMessage（成功返回HANDLED，否则返回NOT_HANDLED）</li><li>消息处理向上冒泡：子状态返回NOT_HANDLED时交给父状态处理；全部无法处理时调用unhandledMessage</li><li>transitionTo切换状态；deferMessage保留消息留待下一个新状态处理（deferred消息在新状态进入后优先处理）</li><li>外界通过obtainMessage/sendMessage向HSM发消息；停止状态机用quit或quitNow</li><li>EA执行顺序：start后初始状态及其祖先状态的enter按祖先→子孙顺序执行</li><li>状态切换时执行顺序：旧状态的exit沿派生树向上执行（直到最近公共祖先），然后新状态的enter沿派生树向下执行；类似C++构造/析构函数的顺序</li></ul>", "backText": "在传统状态机基础上引入状态间的层级关系，类似Java父子类的派生继承关系; 父状态实现generic（通用）功能，子状态实现特定处理；但父子状态是两个毫无派生关系的类; 状态由State类表达；addState(状态, 父状态)添加状态并指定层级；setInitialState设置初始状态；start启动状态机; 每个State的核心函数：enter（Entry Action）、exit（Exit Action）、processMessage（成功返回HANDLED，否则返回NOT_HANDLED）; 消息处理向上冒泡：子状态返回NOT_HANDLED时交给父状态处理；全部无法处理时调用unhandledMessage; transitionTo切换状态；deferMessage保留消息留待下一个新状态处理（deferred消息在新状态进入后优先处理）"}, {"id": "c459", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "每个State的核心函数", "back": "<div class=\"def-ans\">enter（Entry Action）、exit（Exit Action）、processMessage（成功返回HANDLED，否则返回NOT_HANDLED）</div>", "backText": "enter（Entry Action）、exit（Exit Action）、processMessage（成功返回HANDLED，否则返回NOT_HANDLED）"}, {"id": "c460", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "消息处理向上冒泡", "back": "<div class=\"def-ans\">子状态返回NOT_HANDLED时交给父状态处理；全部无法处理时调用unhandledMessage</div>", "backText": "子状态返回NOT_HANDLED时交给父状态处理；全部无法处理时调用unhandledMessage"}, {"id": "c461", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "EA执行顺序", "back": "<div class=\"def-ans\">start后初始状态及其祖先状态的enter按祖先→子孙顺序执行</div>", "backText": "start后初始状态及其祖先状态的enter按祖先→子孙顺序执行"}, {"id": "c462", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "状态切换时执行顺序", "back": "<div class=\"def-ans\">旧状态的exit沿派生树向上执行（直到最近公共祖先），然后新状态的enter沿派生树向下执行；类似C++构造/析构函数的顺序</div>", "backText": "旧状态的exit沿派生树向上执行（直到最近公共祖先），然后新状态的enter沿派生树向下执行；类似C++构造/析构函数的顺序"}, {"id": "c463", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "AsyncChannel（异步通道）核心概念", "back": "<ul class=\"ans-list\"><li>用于两个Handler之间的通信（同进程或跨进程）：源Handler通过sendMessage发消息，目标Handler通过replyToMessage回复结果</li><li>两种应用模式：①简单request/response模式——Server端无须维护Client信息，Client用connectSync或connect连接；②Server端维护Client信息——Server可向Client主动推送消息（WifiService相关模块多用第二种）</li><li>第二种模式异步连接六步骤：①Client调connect，收到CMD_CHANNEL_HALF_CONNECTED；②Client发CMD_CHANNEL_FULL_CONNECTION给Server；③Server处理成功后发CMD_CHANNEL_FULLY_CONNECTED；④Client收到即连接建立；⑤双方用sendMessage/replyToMessage收发消息；⑥任一端调disconnect</li><li>实现细节：AsyncChannel对象无法通过Binder跨进程传递，正确做法是Server自己new一个AsyncChannel并connect回Client（两端各存在一个AsyncChannel对象）</li><li>WifiManager的init函数：通过Binder调WifiService的getWifiServiceMessenger，创建ServiceHandler，再调mAsyncChannel.connect</li><li>WifiService端AsyncServiceHandler收到CMD_CHANNEL_FULL_CONNECTION后新建AsyncChannel并connect回Client，CMD_CHANNEL_HALF_CONNECTED时存入mClients用于向Client发消息</li></ul>", "backText": "用于两个Handler之间的通信（同进程或跨进程）：源Handler通过sendMessage发消息，目标Handler通过replyToMessage回复结果; 两种应用模式：①简单request/response模式——Server端无须维护Client信息，Client用connectSync或connect连接；②Server端维护Client信息——Server可向Client主动推送消息（WifiService相关模块多用第二种）; 第二种模式异步连接六步骤：①Client调connect，收到CMD_CHANNEL_HALF_CONNECTED；②Client发CMD_CHANNEL_FULL_CONNECTION给Server；③Server处理成功后发CMD_CHANNEL_FULLY_CONNECTED；④Client收到即连接建立；⑤双方用sendMessage/replyToMessage收发消息；⑥任一端调disconnect; 实现细节：AsyncChannel对象无法通过Binder跨进程传递，正确做法是Server自己new一个AsyncChannel并connect回Client（两端各存在一个AsyncChannel对象）; WifiManager的init函数：通过Binder调WifiService的getWifiServiceMessenger，创建ServiceHandler，再调mAsyncChannel.connect; WifiService端AsyncServiceHandler收到CMD_CHANNEL_FULL_CONNECTION后新建AsyncChannel并connect回Client，CMD_CHANNEL_HALF_CONNECTED时存入mClients用于向Client发消息"}, {"id": "c464", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "用于两个Handler之间的通信（同进程或跨进程）", "back": "<div class=\"def-ans\">源Handler通过sendMessage发消息，目标Handler通过replyToMessage回复结果</div>", "backText": "源Handler通过sendMessage发消息，目标Handler通过replyToMessage回复结果"}, {"id": "c465", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "两种应用模式", "back": "<div class=\"def-ans\">①简单request/response模式——Server端无须维护Client信息，Client用connectSync或connect连接；②Server端维护Client信息——Server可向Client主动推送消息（WifiService相关模块多用第二种）</div>", "backText": "①简单request/response模式——Server端无须维护Client信息，Client用connectSync或connect连接；②Server端维护Client信息——Server可向Client主动推送消息（WifiService相关模块多用第二种）"}, {"id": "c466", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "第二种模式异步连接六步骤", "back": "<div class=\"def-ans\">①Client调connect，收到CMD_CHANNEL_HALF_CONNECTED；②Client发CMD_CHANNEL_FULL_CONNECTION给Server；③Server处理成功后发CMD_CHANNEL_FULLY_CONNECTED；④Client收到即连接建立；⑤双方用sendMessage/replyToMessage收发消息；⑥任一端调disconnect</div>", "backText": "①Client调connect，收到CMD_CHANNEL_HALF_CONNECTED；②Client发CMD_CHANNEL_FULL_CONNECTION给Server；③Server处理成功后发CMD_CHANNEL_FULLY_CONNECTED；④Client收到即连接建立；⑤双方用sendMessage/replyToMessage收发消息；⑥任一端调disconnect"}, {"id": "c467", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "实现细节", "back": "<div class=\"def-ans\">AsyncChannel对象无法通过Binder跨进程传递，正确做法是Server自己new一个AsyncChannel并connect回Client（两端各存在一个AsyncChannel对象）</div>", "backText": "AsyncChannel对象无法通过Binder跨进程传递，正确做法是Server自己new一个AsyncChannel并connect回Client（两端各存在一个AsyncChannel对象）"}, {"id": "c468", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "WifiManager的init函数", "back": "<div class=\"def-ans\">通过Binder调WifiService的getWifiServiceMessenger，创建ServiceHandler，再调mAsyncChannel.connect</div>", "backText": "通过Binder调WifiService的getWifiServiceMessenger，创建ServiceHandler，再调mAsyncChannel.connect"}, {"id": "c469", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "5.2.2 WifiService构造函数分析", "back": "<ul class=\"ans-list\"><li>从系统属性\"wifi.interface\"读取无线网络设备接口名，默认\"wlan0\"</li><li>创建核心对象WifiStateMachine（WifiService相关模块的核心）</li><li>调用mWifiStateMachine.enableRssiPolling(true)启用RSSI轮询机制：RSSI（接收信号强度指示）反映无线网络质量，WPAS支持的RSSI信息包括接收信号强度、连接速度、噪声强度和频率</li><li>与BatteryStatsService交互获取mBatteryStats；注册广播事件</li><li>创建HandlerThread(\"WifiService\")，在其Looper上创建两个Handler：mAsyncServiceHandler（交互对象来自WifiManager）、mWifiStateMachineHandler（交互对象来自WifiStateMachine）</li></ul>", "backText": "从系统属性\"wifi.interface\"读取无线网络设备接口名，默认\"wlan0\"; 创建核心对象WifiStateMachine（WifiService相关模块的核心）; 调用mWifiStateMachine.enableRssiPolling(true)启用RSSI轮询机制：RSSI（接收信号强度指示）反映无线网络质量，WPAS支持的RSSI信息包括接收信号强度、连接速度、噪声强度和频率; 与BatteryStatsService交互获取mBatteryStats；注册广播事件; 创建HandlerThread(\"WifiService\")，在其Looper上创建两个Handler：mAsyncServiceHandler（交互对象来自WifiManager）、mWifiStateMachineHandler（交互对象来自WifiStateMachine）"}, {"id": "c470", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "5.2.3 WifiStateMachine介绍", "back": "<ul class=\"ans-list\"><li>构造函数之一：创建核心成员对象<ul class=\"sub\"><li>NetworkInfo：代表一个网络设备的状态信息，类型TYPE_WIFI</li><li>mBatteryStats、mNwService（NetworkManagementService的Binder客户端）</li><li>mP2pSupported：判断系统是否支持Wi-Fi Display/Wi-Fi Direct</li><li>WifiNative：用于和wpa_supplicant交互（对应控制API），JNI模块为android_net_wifi_Wifi</li><li>WifiConfigStore：对应配置文件/data/misc/wifi/ipconfig.txt，存储每个无线网络的配置项（代理地址、静态IP等）</li><li>WifiMonitor：内部创建线程，借助WifiNative接收并处理来自WPAS的信息</li><li>DhcpInfoInternal（保存DHCP信息）、WifiInfo（存储当前连接网络的信息如IP地址、ssid）</li><li>SupplicantStateTracker：跟踪WPAS的状态，本身也是一个StateMachine</li><li>LinkProperties：描述网络链接属性（IP地址、DNS地址、路由设置）</li><li>WifiApConfigStore：与Soft AP模式相关的StateMachine，配置存于/data/misc/wifi/softap.conf</li><li>其他配置：mDefaultFrameworkScanIntervalMs（默认300秒）、mDriverStopDelayMs（默认120秒，与紧急呼叫模式有关）、mBackgroundScanSupported、mScanResultCache（LruCache保存扫描结果）、WakeLock申请</li><li>注册处理ACTION_START_SCAN、ACTION_SCREEN_ON/OFF、ACTION_DELAYED_DRIVER_STOP广播</li></ul></li><li>WifiNative的两个关键方法<ul class=\"sub\"><li>startSupplicant：根据是否支持P2P选择p2p_supplicant或wpa_supplicant；若WPAS已在运行（init.svc.wpa_supplicant属性为running）直接返回；通过property_set(\"ctl.start\")触发init运行wpa_supplicant；循环查询属性值变为\"running\"表示成功（最多约20秒）</li><li>connectToSupplicant：Android 4.2支持STA和P2P设备并发工作：STA用PRIMARY(0)标示，P2P用SECONDARY(1)；通过wpa_ctrl_open创建两个wpa_ctrl对象：ctrl_conn（发送命令并接收回复）和monitor_conn（接收unsolicited event，需调用wpa_ctrl_attach）；exit_sockets保存socketpair句柄</li></ul></li><li>WifiMonitor（内部MonitorThread线程，专收WPAS消息）<ul class=\"sub\"><li>线程run：先connectToSupplicant，成功则向WifiStateMachine发SUP_CONNECTION_EVENT</li><li>循环调用mWifiNative.waitForEvent()获取消息；只处理以\"CTRL-EVENT-\"为前缀的消息</li><li>解析并映射事件：CONNECTED、STATE-CHANGED、SCAN-RESULTS、DRIVER-STATE、EAP-FAILURE、LINK_SPEED、DISCONNECTED等</li><li>分发处理：STATE_CHANGE→handleSupplicantStateChange；DRIVER_STATE→handleDriverEvent（DRIVER-EVENT来自wlan芯片厂商提供的库，如bcmdhd的driver_cmd_nl80211.c）；其余→handleEvent</li><li>WPAS状态（wpa_sm状态机）共10个：WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED</li><li>Java层SupplicantState定义13个状态（后3个DORMANT、UNINITIALIZED、INVALID为WifiService自定义）</li><li>handleEvent：DISCONNECTED/CONNECTED→handleNetworkStateChange；SCAN_RESULTS→向WifiStateMachine发SCAN_RESULTS_EVENT</li></ul></li><li>SupplicantStateTracker：从StateMachine派生，定义8个状态：mDefaultState（父）、mUninitializedState、mInactiveState、mDisconnectState、mScanState、mHandshakeState、mCompletedState、mDormantState；较简单，不影响主流程</li><li>构造函数之二：WifiStateMachine状态体系<ul class=\"sub\"><li>WifiStateMachine共定义30个状态（从mDefaultState、mInitialState到mSoftApStoppingState等），状态数量在Android系统中非常突出；加上SupplicantStateTracker的8个状态和P2pStateMachine的15个状态，Java层Wi-Fi相关状态机多达63个状态</li><li>初始状态为mInitialState</li><li>InitialState.enter：通过\"wlan.driver.status\"属性判断驱动是否已加载——已加载则transitionTo(mDriverLoadedState)，否则转mDriverUnloadedState；同时获取WifiP2pManager并连接WifiP2pService；调用mNwService.disableIpv6禁止IPv6</li><li>正常启动后WifiStateMachine最终进入DriverUnloadedState</li></ul></li></ul>", "backText": "构造函数之一：创建核心成员对象; WifiNative的两个关键方法; WifiMonitor（内部MonitorThread线程，专收WPAS消息）; SupplicantStateTracker：从StateMachine派生，定义8个状态：mDefaultState（父）、mUninitializedState、mInactiveState、mDisconnectState、mScanState、mHandshakeState、mCompletedState、mDormantState；较简单，不影响主流程; 构造函数之二：WifiStateMachine状态体系"}, {"id": "c471", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "构造函数之一：创建核心成员对象", "back": "<ul class=\"ans-list\"><li>NetworkInfo：代表一个网络设备的状态信息，类型TYPE_WIFI</li><li>mBatteryStats、mNwService（NetworkManagementService的Binder客户端）</li><li>mP2pSupported：判断系统是否支持Wi-Fi Display/Wi-Fi Direct</li><li>WifiNative：用于和wpa_supplicant交互（对应控制API），JNI模块为android_net_wifi_Wifi</li><li>WifiConfigStore：对应配置文件/data/misc/wifi/ipconfig.txt，存储每个无线网络的配置项（代理地址、静态IP等）</li><li>WifiMonitor：内部创建线程，借助WifiNative接收并处理来自WPAS的信息</li><li>DhcpInfoInternal（保存DHCP信息）、WifiInfo（存储当前连接网络的信息如IP地址、ssid）</li><li>SupplicantStateTracker：跟踪WPAS的状态，本身也是一个StateMachine</li><li>LinkProperties：描述网络链接属性（IP地址、DNS地址、路由设置）</li><li>WifiApConfigStore：与Soft AP模式相关的StateMachine，配置存于/data/misc/wifi/softap.conf</li><li>其他配置：mDefaultFrameworkScanIntervalMs（默认300秒）、mDriverStopDelayMs（默认120秒，与紧急呼叫模式有关）、mBackgroundScanSupported、mScanResultCache（LruCache保存扫描结果）、WakeLock申请</li><li>注册处理ACTION_START_SCAN、ACTION_SCREEN_ON/OFF、ACTION_DELAYED_DRIVER_STOP广播</li></ul>", "backText": "NetworkInfo：代表一个网络设备的状态信息，类型TYPE_WIFI; mBatteryStats、mNwService（NetworkManagementService的Binder客户端）; mP2pSupported：判断系统是否支持Wi-Fi Display/Wi-Fi Direct; WifiNative：用于和wpa_supplicant交互（对应控制API），JNI模块为android_net_wifi_Wifi; WifiConfigStore：对应配置文件/data/misc/wifi/ipconfig.txt，存储每个无线网络的配置项（代理地址、静态IP等）; WifiMonitor：内部创建线程，借助WifiNative接收并处理来自WPAS的信息"}, {"id": "c472", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "NetworkInfo", "back": "<div class=\"def-ans\">代表一个网络设备的状态信息，类型TYPE_WIFI</div>", "backText": "代表一个网络设备的状态信息，类型TYPE_WIFI"}, {"id": "c473", "type": "def", "part": "Wi-Fi 篇", "partColor 发SUP_CONNECTION_EVENT; 循环调用mWifiNative.waitForEvent()获取消息；只处理以\"CTRL-EVENT-\"为前缀的消息; 解析并映射事件：CONNECTED、STATE-CHANGED、SCAN-RESULTS、DRIVER-STATE、EAP-FAILURE、LINK_SPEED、DISCONNECTED等; 分发处理：STATE_CHANGE→handleSupplicantStateChange；DRIVER_STATE→handleDriverEvent（DRIVER-EVENT来自wlan芯片厂商提供的库，如bcmdhd的driver_cmd_nl80211.c）；其余→handleEvent; WPAS状态（wpa_sm状态机）共10个：WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED; Java层SupplicantState定义13个状态（后3个DORMANT、UNINITIALIZED、INVALID为WifiService自定义）"}, {"id": "c485", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "线程run", "back": "<div class=\"def-ans\">先connectToSupplicant，成功则向WifiStateMachine发SUP_CONNECTION_EVENT</div>", "backText": "先connectToSupplicant，成功则向WifiStateMachine发SUP_CONNECTION_EVENT"}, {"id": "c486", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "解析并映射事件", "back": "<div class=\"def-ans\">CONNECTED、STATE-CHANGED、SCAN-RESULTS、DRIVER-STATE、EAP-FAILURE、LINK_SPEED、DISCONNECTED等</div>", "backText": "CONNECTED、STATE-CHANGED、SCAN-RESULTS、DRIVER-STATE、EAP-FAILURE、LINK_SPEED、DISCONNECTED等"}, {"id": "c487", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "分发处理", "back": "<div class=\"def-ans\">STATE_CHANGE→handleSupplicantStateChange；DRIVER_STATE→handleDriverEvent（DRIVER-EVENT来自wlan芯片厂商提供的库，如bcmdhd的driver_cmd_nl80211.c）；其余→handleEvent</div>", "backText": "STATE_CHANGE→handleSupplicantStateChange；DRIVER_STATE→handleDriverEvent（DRIVER-EVENT来自wlan芯片厂商提供的库，如bcmdhd的driver_cmd_nl80211.c）；其余→handleEvent"}, {"id": "c488", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "WPAS状态（wpa_sm状态机）共10个", "back": "<div class=\"def-ans\">WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED</div>", "backText": "WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED"}, {"id": "c489", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "handleEvent", "back": "<div class=\"def-ans\">DISCONNECTED/CONNECTED→handleNetworkStateChange；SCAN_RESULTS→向WifiStateMachine发SCAN_RESULTS_EVENT</div>", "backText": "DISCONNECTED/CONNECTED→handleNetworkStateChange；SCAN_RESULTS→向WifiStateMachine发SCAN_RESULTS_EVENT"}, {"id": "c491", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "构造函数之二：WifiStateMachine状态体系", "back": "<ul class=\"ans-list\"><li>WifiStateMachine共定义30个状态（从mDefaultState、mInitialState到mSoftApStoppingState等），状态数量在Android系统中非常突出；加上SupplicantStateTracker的8个状态和P2pStateMachine的15个状态，Java层Wi-Fi相关状态机多达63个状态</li><li>初始状态为mInitialState</li><li>InitialState.enter：通过\"wlan.driver.status\"属性判断驱动是否已加载——已加载则transitionTo(mDriverLoadedState)，否则转mDriverUnloadedState；同时获取WifiP2pManager并连接WifiP2pService；调用mNwService.disableIpv6禁止IPv6</li><li>正常启动后WifiStateMachine最终进入DriverUnloadedState</li></ul>", "backText": "WifiStateMachine共定义30个状态（从mDefaultState、mInitialState到mSoftApStoppingState等），状态数量在Android系统中非常突出；加上SupplicantStateTracker的8个状态和P2pStateMachine的15个状态，Java层Wi-Fi相关状态机多达63个状态; 初始状态为mInitialState; InitialState.enter：通过\"wlan.driver.status\"属性判断驱动是否已加载——已加载则transitionTo(mDriverLoadedState)，否则转mDriverUnloadedState；同时获取WifiP2pManager并连接WifiP2pService；调用mNwService.disableIpv6禁止IPv6; 正常启动后WifiStateMachine最终进入DriverUnloadedState"}, {"id": "c492", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.2 WifiService的创建及初始化", "front": "InitialState.enter", "back": "<div class=\"def-ans\">通过\"wlan.driver.status\"属性判断驱动是否已加载——已加载则transitionTo(mDriverLoadedState)，否则转mDriverUnloadedState；同时获取WifiP2pManager并连接WifiP2pService；调用mNwService.disableIpv6禁止IPv6</div>", "backText": "通过\"wlan.driver.status\"属性判断驱动是否已加载——已加载则transitionTo(mDriverLoadedState)，否则转mDriverUnloadedState；同时获取WifiP2pManager并连接WifiP2pService；调用mNwService.disableIpv6禁止IPv6"}, {"id": "c493", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "第一部分", "back": "<div class=\"def-ans\">Settings中的处理，利用WifiManager操作无线网络</div>", "backText": "Settings中的处理，利用WifiManager操作无线网络"}, {"id": "c494", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "第二部分", "back": "<div class=\"def-ans\">分析所涉及的WifiManager关键函数如何促使WifiService完成一系列复杂操作</div>", "backText": "分析所涉及的WifiManager关键函数如何促使WifiService完成一系列复杂操作"}, {"id": "c495", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "5.3.1 Settings操作Wi-Fi分析", "back": "<ul class=\"ans-list\"><li>UI与类的对应关系：WifiSettings对应Wi-Fi设置页面（AP列表）；WifiEnabler中的mSwitch是Wi-Fi开关按钮；WifiDialog对应无线网络设置对话框，其配置信息由WifiConfigController控制管理；WifiSettings的内部类Scanner处理扫描相关工作</li><li>WifiSettings相关类初始化<ul class=\"sub\"><li>构造函数注册广播接收对象，关注的广播：WIFI_STATE_CHANGED_ACTION、SCAN_RESULTS_AVAILABLE_ACTION、NETWORK_IDS_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION、CONFIGURED_NETWORKS_CHANGED_ACTION、LINK_CONFIGURATION_CHANGED_ACTION、NETWORK_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION</li><li>四个重要广播：WIFI_STATE_CHANGED_ACTION（Wi-Fi状态：DISABLED/DISABLING/ENABLED/ENABLING/UNKNOWN五种）；SCAN_RESULTS_AVAILABLE_ACTION（扫描完毕）；SUPPLICANT_STATE_CHANGED_ACTION（WPAS状态变化）；NETWORK_STATE_CHANGED_ACTION（Wi-Fi连接状态变化，携带NetworkInfo对象）</li><li>WifiEnabler构造：关注三个广播，真正处理的只有WIFI_STATE_CHANGED_ACTION（用于更新Switch界面）</li></ul></li><li>启用Wi-Fi功能：用户点击开关→WifiEnabler.onCheckedChanged→mWifiManager.setWifiEnabled(isChecked)→触发WifiService一系列动作</li><li>WifiSettings.handleEvent按广播类型分发：WIFI_STATE_ENABLED时updateWifiState调mScanner.resume()；SCAN_RESULTS等→updateAccessPoints（更新AP列表）；NETWORK_STATE_CHANGED→更新mConnected、updateConnectionState等</li><li>触发扫描：Scanner（Handler子类）handleMessage中调用mWifiManager.startScanActive()发起主动扫描，失败重试最多3次，然后每1秒（WIFI_RESCAN_INTERVAL_MS）发起一次扫描</li><li>更新AP列表：updateAccessPoints→constructAccessPoints——先getConfiguredNetworks（从WPAS读取已保存网络信息）创建AccessPoint对象；再getScanResults获取扫描结果，跳过无SSID或[IBSS]网络；最后排序并显示到PreferenceScreen</li><li>加入目标无线网络：onPreferenceTreeClick选中AccessPoint：无安全设置的网络直接generateOpenNetworkConfig后mWifiManager.connect；否则showDialog弹出WifiDialog；用户输入密码点\"连接\"→WifiSettings.submit：isEdit或requireKeyStore则mWifiManager.save，否则mWifiManager.connect</li><li>知识点总结：WifiSettings与WifiEnabler两个广播接收对象互相干扰（同一广播两次处理）；SUPPLICANT_STATE_CHANGED_ACTION广播次数多；提炼WifiManager三个关键函数：setWifiEnabled、startScanActive、connect</li></ul>", "backText": "UI与类的对应关系：WifiSettings对应Wi-Fi设置页面（AP列表）；WifiEnabler中的mSwitch是Wi-Fi开关按钮；WifiDialog对应无线网络设置对话框，其配置信息由WifiConfigController控制管理；WifiSettings的内部类Scanner处理扫描相关工作; WifiSettings相关类初始化; 启用Wi-Fi功能：用户点击开关→WifiEnabler.onCheckedChanged→mWifiManager.setWifiEnabled(isChecked)→触发WifiService一系列动作; WifiSettings.handleEvent按广播类型分发：WIFI_STATE_ENABLED时updateWifiState调mScanner.resume()；SCAN_RESULTS等→updateAccessPoints（更新AP列表）；NETWORK_STATE_CHANGED→更新mConnected、updateConnectionState等; 触发扫描：Scanner（Handler子类）handleMessage中调用mWifiManager.startScanActive()发起主动扫描，失败重试最多3次，然后每1秒（WIFI_RESCAN_INTERVAL_MS）发起一次扫描; 更新AP列表：updateAccessPoints→constructAccessPoints——先getConfiguredNetworks（从WPAS读取已保存网络信息）创建AccessPoint对象；再getScanResults获取扫描结果，跳过无SSID或[IBSS]网络；最后排序并显示到PreferenceScreen"}, {"id": "c496", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "UI与类的对应关系", "back": "<div class=\"def-ans\">WifiSettings对应Wi-Fi设置页面（AP列表）；WifiEnabler中的mSwitch是Wi-Fi开关按钮；WifiDialog对应无线网络设置对话框，其配置信息由WifiConfigController控制管理；WifiSettings的内部类Scanner处理扫描相关工作</div>", "backText": "WifiSettings对应Wi-Fi设置页面（AP列表）；WifiEnabler中的mSwitch是Wi-Fi开关按钮；WifiDialog对应无线网络设置对话框，其配置信息由WifiConfigController控制管理；WifiSettings的内部类Scanner处理扫描相关工作"}, {"id": "c497", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "WifiSettings相关类初始化", "back": "<ul class=\"ans-list\"><li>构造函数注册广播接收对象，关注的广播：WIFI_STATE_CHANGED_ACTION、SCAN_RESULTS_AVAILABLE_ACTION、NETWORK_IDS_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION、CONFIGURED_NETWORKS_CHANGED_ACTION、LINK_CONFIGURATION_CHANGED_ACTION、NETWORK_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION</li><li>四个重要广播：WIFI_STATE_CHANGED_ACTION（Wi-Fi状态：DISABLED/DISABLING/ENABLED/ENABLING/UNKNOWN五种）；SCAN_RESULTS_AVAILABLE_ACTION（扫描完毕）；SUPPLICANT_STATE_CHANGED_ACTION（WPAS状态变化）；NETWORK_STATE_CHANGED_ACTION（Wi-Fi连接状态变化，携带NetworkInfo对象）</li><li>WifiEnabler构造：关注三个广播，真正处理的只有WIFI_STATE_CHANGED_ACTION（用于更新Switch界面）</li></ul>", "backText": "构造函数注册广播接收对象，关注的广播：WIFI_STATE_CHANGED_ACTION、SCAN_RESULTS_AVAILABLE_ACTION、NETWORK_IDS_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION、CONFIGURED_NETWORKS_CHANGED_ACTION、LINK_CONFIGURATION_CHANGED_ACTION、NETWORK_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION; 四个重要广播：WIFI_STATE_CHANGED_ACTION（Wi-Fi状态：DISABLED/DISABLING/ENABLED/ENABLING/UNKNOWN五种）；SCAN_RESULTS_AVAILABLE_ACTION（扫描完毕）；SUPPLICANT_STATE_CHANGED_ACTION（WPAS状态变化）；NETWORK_STATE_CHANGED_ACTION（Wi-Fi连接状态变化，携带NetworkInfo对象）; WifiEnabler构造：关注三个广播，真正处理的只有WIFI_STATE_CHANGED_ACTION（用于更新Switch界面）"}, {"id": "c498", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "四个重要广播", "back": "<div class=\"def-ans\">WIFI_STATE_CHANGED_ACTION（Wi-Fi状态：DISABLED/DISABLING/ENABLED/ENABLING/UNKNOWN五种）；SCAN_RESULTS_AVAILABLE_ACTION（扫描完毕）；SUPPLICANT_STATE_CHANGED_ACTION（WPAS状态变化）；NETWORK_STATE_CHANGED_ACTION（Wi-Fi连接状态变化，携带NetworkInfo对象）</div>", "backText": "WIFI_STATE_CHANGED_ACTION（Wi-Fi状态：DISABLED/DISABLING/ENABLED/ENABLING/UNKNOWN五种）；SCAN_RESULTS_AVAILABLE_ACTION（扫描完毕）；SUPPLICANT_STATE_CHANGED_ACTION（WPAS状态变化）；NETWORK_STATE_CHANGED_ACTION（Wi-Fi连接状态变化，携带NetworkInfo对象）"}, {"id": "c499", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "WifiEnabler构造", "back": "<div class=\"def-ans\">关注三个广播，真正处理的只有WIFI_STATE_CHANGED_ACTION（用于更新Switch界面）</div>", "backText": "关注三个广播，真正处理的只有WIFI_STATE_CHANGED_ACTION（用于更新Switch界面）"}, {"id": "c500", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "启用Wi-Fi功能", "back": "<div class=\"def-ans\">用户点击开关→WifiEnabler.onCheckedChanged→mWifiManager.setWifiEnabled(isChecked)→触发WifiService一系列动作</div>", "backText": "用户点击开关→WifiEnabler.onCheckedChanged→mWifiManager.setWifiEnabled(isChecked)→触发WifiService一系列动作"}, {"id": "c501", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "触发扫描", "back": "<div class=\"def-ans\">Scanner（Handler子类）handleMessage中调用mWifiManager.startScanActive()发起主动扫描，失败重试最多3次，然后每1秒（WIFI_RESCAN_INTERVAL_MS）发起一次扫描</div>", "backText": "Scanner（Handler子类）handleMessage中调用mWifiManager.startScanActive()发起主动扫描，失败重试最多3次，然后每1秒（WIFI_RESCAN_INTERVAL_MS）发起一次扫描"}, {"id": "c502", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "更新AP列表", "back": "<div class=\"def-ans\">updateAccessPoints→constructAccessPoints——先getConfiguredNetworks（从WPAS读取已保存网络信息）创建AccessPoint对象；再getScanResults获取扫描结果，跳过无SSID或[IBSS]网络；最后排序并显示到PreferenceScreen</div>", "backText": "updateAccessPoints→constructAccessPoints——先getConfiguredNetworks（从WPAS读取已保存网络信息）创建AccessPoint对象；再getScanResults获取扫描结果，跳过无SSID或[IBSS]网络；最后排序并显示到PreferenceScreen"}, {"id": "c503", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "加入目标无线网络", "back": "<div class=\"def-ans\">onPreferenceTreeClick选中AccessPoint：无安全设置的网络直接generateOpenNetworkConfig后mWifiManager.connect；否则showDialog弹出WifiDialog；用户输入密码点\"连接\"→WifiSettings.submit：isEdit或requireKeyStore则mWifiManager.save，否则mWifiManager.connect</div>", "backText": "onPreferenceTreeClick选中AccessPoint：无安全设置的网络直接generateOpenNetworkConfig后mWifiManager.connect；否则showDialog弹出WifiDialog；用户输入密码点\"连接\"→WifiSettings.submit：isEdit或requireKeyStore则mWifiManager.save，否则mWifiManager.connect"}, {"id": "c504", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "知识点总结", "back": "<div class=\"def-ans\">WifiSettings与WifiEnabler两个广播接收对象互相干扰（同一广播两次处理）；SUPPLICANT_STATE_CHANGED_ACTION广播次数多；提炼WifiManager三个关键函数：setWifiEnabled、startScanActive、connect</div>", "backText": "WifiSettings与WifiEnabler两个广播接收对象互相干扰（同一广播两次处理）；SUPPLICANT_STATE_CHANGED_ACTION广播次数多；提炼WifiManager三个关键函数：setWifiEnabled、startScanActive、connect"}, {"id": "c505", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "5.3.2 WifiService操作Wi-Fi分析", "back": "<ul class=\"ans-list\"><li>setWifiEnabled函数分析<ul class=\"sub\"><li>WifiStateMachine发送消息：enable时发CMD_LOAD_DRIVER（携带WIFI_STATE_ENABLING）和CMD_START_SUPPLICANT；disable时发CMD_STOP_SUPPLICANT和CMD_UNLOAD_DRIVER</li><li>CMD_LOAD_DRIVER处理：DriverUnloadedState→transitionTo(mDriverLoadingState)；DriverLoadingState.enter中创建工作线程（持有WakeLock）：先setWifiState(WIFI_STATE_ENABLING)（发送WIFI_STATE_CHANGED_ACTION广播），再调mWifiNative.loadDriver，成功发CMD_LOAD_DRIVER_SUCCESS</li><li>wifi_load_driver（wifi.c）：若定义WIFI_DRIVER_MODULE_PATH宏（如\"/lib/modules/dhd.ko\"），则insmod加载驱动模块，然后设置\"wlan.driver.status\"属性；未定义宏则直接设属性\"ok\"</li><li>CMD_LOAD_DRIVER_SUCCESS：转mDriverLoadedState；CMD_START_SUPPLICANT在DriverLoadingState中deferMessage推迟到下一状态</li><li>CMD_START_SUPPLICANT处理（DriverLoadedState）：mNwService.wifiFirmwareReload(interface, \"STA\")加载wlan固件；mNwService.setInterfaceDown和setInterfaceIpv6PrivacyExtensions；mWifiNative.startSupplicant启动WPAS进程，成功后mWifiMonitor.startMonitoring()启动Monitor线程，transitionTo(mSupplicantStartingState)</li><li>SUP_CONNECTION_EVENT处理（SupplicantStartingState）：setWifiState(WIFI_STATE_ENABLED)广播；重置mSupplicantRestartCount；发CMD_RESET_SUPPLICANT_STATE；重置mLastBssid/mLastNetworkId/mLastSignalLevel；mWifiInfo.setMacAddress；mWifiConfigStore.initialize()；initializeWpsDetails()；sendSupplicantConnectionChangedBroadcast(true)；transitionTo(mDriverStartedState)</li><li>SupplicantStartedState.enter：读取扫描间隔（config_wifi_supplicant_scan_interval，默认15000ms）；向WPAS发送\"SCAN_INTERVAL 时间\"命令</li><li>DriverStartedState.enter：mIsRunning=true；setBluetoothCoexistenceScanMode告知wlan驱动蓝牙是否启用（2.4GHz共存）；setCountryCode()和setFrequencyBand()设置国家码和频段（通过\"DRIVER XXX\"命令发给WPAS，Android特有命令，由厂商库处理）；组播过滤设置；mIsScanMode分支——ap_scan=1：WPAS完成AP扫描选择及关联、EAPOL认证等大部分工作；=0：驱动完成；=2：类似0（SCAN_ONLY_MODE对应2，CONNECT_MODE对应1）——扫描模式时转mScanModeState，正常模式时reconnect()+status()后转mDisconnectedState；处理屏幕状态（setSuspendOptimizations发\"DRIVER SETSUSPENDMODE\"命令）；setPowerSave(true)；支持P2P时发CMD_ENABLE_P2P</li><li>DisconnectedState.enter：P2P临时断开处理；读取Framework扫描间隔（WIFI_FRAMEWORK_SCAN_INTERVAL_MS）；后台扫描设置——mEnableBackgroundScan时enableBackgroundScan(true)，否则setScanAlarm(true)（AlarmManager定时发ACTION_START_SCAN）；无P2P连接且无已保存AP则延迟发送CMD_NO_NETWORKS_PERIODIC_SCAN</li><li>setWifiEnabled流程总结（状态迁移链）：DriverUnloadedState → DriverLoadingState（loadDriver，defer CMD_START_SUPPLICANT）→ DriverLoadedState（加载固件、启动WPAS）→ SupplicantStartingState（初始化WPS/WifiConfigStore）→ DriverStartedState（父状态SupplicantStartedState的enter先执行）→ DisconnectedState</li></ul></li><li>startScanActive函数分析<ul class=\"sub\"><li>调用链：WifiManager.startScanActive→WifiService.startScan→WifiStateMachine.startScan(forceActive=true)→发送CMD_START_SCAN</li><li>CMD_START_SCAN处理：DisconnectedState收到后先取消后台扫描，返回NOT_HANDLED向上传递；最终由祖父状态DriverStartedState处理——forceActive时setScanMode发\"DRIVER SCAN-ACTIVE\"命令，mWifiNative.scan()发\"SCAN\"命令触发扫描，然后恢复setScanMode，置mScanResultIsPending=true</li><li>SCAN_RESULTS_EVENT处理：WPAS扫描完毕通知WifiMonitor→发SCAN_RESULTS_EVENT；DisconnectedState返回NOT_HANDLED→父状态ConnectModeState处理（setScanResultHandling(CONNECT_MODE)）→祖父状态SupplicantStartedState处理：setScanResults(mWifiNative.scanResults())从WPAS获取扫描结果，sendScanResultsAvailableBroadcast()广播，mScanResultIsPending=false</li></ul></li><li>connect函数分析<ul class=\"sub\"><li>WifiManager.connect(config, listener)：通过AsyncChannel发送CONNECT_NETWORK消息（arg1为INVALID_NETWORK_ID即-1，obj为WifiConfiguration）</li><li>CONNECT_NETWORK处理（ConnectModeState）：mWifiConfigStore.saveNetwork(config)——addOrUpdateNetworkNative触发\"ADD_NETWORK\"、\"SET_NETWORK\"等命令；新网络则mWifiNative.enableNetwork发\"ENABLE_NETWORK\"命令；mWifiNative.saveConfig()发\"SAVE_CONFIG\"；发送CONFIGURED_NETWORKS_CHANGED广播</li><li>selectNetwork(netId)选择网络；mWifiNative.reconnect()发RECONNECT命令（WPAS处理即调wpa_supplicant_req_scan）；回复CONNECT_NETWORK_SUCCEEDED、transitionTo(mDisconnectingState)（考虑到之前可能连接其他AP需先断开）</li><li>ENABLE_NETWORK过程中WPAS完成802.11身份认证、关联、四次握手等工作，wpa_sm状态变化触发WifiMonitor发SUPPLICANT_STATE_CHANGE_EVENT</li><li>NETWORK_CONNECTION_EVENT处理（ConnectModeState）：WPAS加入成功后发\"CTRL-EVENT-CONNECTED\"，WifiMonitor据此发NETWORK_CONNECTION_EVENT；记录mLastNetworkId和mLastBssid，更新mWifiInfo，setNetworkDetailedState(OBTAINING_IPADDR)，发送NETWORK_STATE_CHANGED_ACTION广播，transitionTo(mObtainingIpState)</li><li>ObtainingIpState.enter：判断目标AP是否静态IP——动态IP时创建DhcpStateMachine、发送CMD_START_DHCP</li><li>CMD_PRE/POST_DHCP_ACTION处理（由父状态L2ConnectedState处理）：CMD_PRE_DHCP_ACTION→handlePreDhcpSetup（设置蓝牙共存模式等），回复CMD_PRE_DHCP_ACTION_COMPLETE——DhcpStateMachine随后启动dhcpcd进程从AP获取IP地址；CMD_POST_DHCP_ACTION→handlePostDhcpSetup；DHCP_SUCCESS时handleSuccessfulIpConfiguration（发LINK_CONFIGURATION_CHANGED_ACTION广播）并transitionTo(mVerifyingLinkState)</li><li>VerifyingLinkState：enter中setNetworkDetailedState(VERIFYING_POOR_LINK)、发送广播；processMessage处理WifiWatchdogStateMachine的消息——收到POOR_LINK_DETECTED不动作，收到GOOD_LINK_DETECTED（信号良好）则transitionTo(mCaptivePortalCheckState)</li><li>CaptivePortalCheckState（Android 4.2新引入）：与Captive Portal（强制网络门户）有关——未认证用户初次上网时被强制打开特定页面，常见于机场、酒店等公共场所<ul class=\"sub\"><li>enter：setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播</li><li>processMessage：收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)</li></ul></li><li>ConnectedState仅处理POOR_LINK_DETECTED消息，是第二条分析路线的终点</li><li>connect流程总结（关键点链）：CONNECT_NETWORK → ConnectModeState处理（WPAS完成802.11认证/关联/四次握手）→ NETWORK_CONNECTION_EVENT（转ObtainingIpState）→ DHCP交互（L2ConnectedState处理，转VerifyingLinkState）→ 与WifiWatchdogStateMachine交互（转CaptivePortalCheckState）→ 最终转ConnectedState</li></ul></li></ul>", "backText": "setWifiEnabled函数分析; startScanActive函数分析; connect函数分析"}, {"id": "c506", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "setWifiEnabled函数分析", "back": "<ul class=\"ans-list\"><li>WifiStateMachine发送消息：enable时发CMD_LOAD_DRIVER（携带WIFI_STATE_ENABLING）和CMD_START_SUPPLICANT；disable时发CMD_STOP_SUPPLICANT和CMD_UNLOAD_DRIVER</li><li>CMD_LOAD_DRIVER处理：DriverUnloadedState→transitionTo(mDriverLoadingState)；DriverLoadingState.enter中创建工作线程（持有WakeLock）：先setWifiState(WIFI_STATE_ENABLING)（发送WIFI_STATE_CHANGED_ACTION广播），再调mWifiNative.loadDriver，成功发CMD_LOAD_DRIVER_SUCCESS</li><li>wifi_load_driver（wifi.c）：若定义WIFI_DRIVER_MODULE_PATH宏（如\"/lib/modules/dhd.ko\"），则insmod加载驱动模块，然后设置\"wlan.driver.status\"属性；未定义宏则直接设属性\"ok\"</li><li>CMD_LOAD_DRIVER_SUCCESS：转mDriverLoadedState；CMD_START_SUPPLICANT在DriverLoadingState中deferMessage推迟到下一状态</li><li>CMD_START_SUPPLICANT处理（DriverLoadedState）：mNwService.wifiFirmwareReload(interface, \"STA\")加载wlan固件；mNwService.setInterfaceDown和setInterfaceIpv6PrivacyExtensions；mWifiNative.startSupplicant启动WPAS进程，成功后mWifiMonitor.startMonitoring()启动Monitor线程，transitionTo(mSupplicantStartingState)</li><li>SUP_CONNECTION_EVENT处理（SupplicantStartingState）：setWifiState(WIFI_STATE_ENABLED)广播；重置mSupplicantRestartCount；发CMD_RESET_SUPPLICANT_STATE；重置mLastBssid/mLastNetworkId/mLastSignalLevel；mWifiInfo.setMacAddress；mWifiConfigStore.initialize()；initializeWpsDetails()；sendSupplicantConnectionChangedBroadcast(true)；transitionTo(mDriverStartedState)</li><li>SupplicantStartedState.enter：读取扫描间隔（config_wifi_supplicant_scan_interval，默认15000ms）；向WPAS发送\"SCAN_INTERVAL 时间\"命令</li><li>DriverStartedState.enter：mIsRunning=true；setBluetoothCoexistenceScanMode告知wlan驱动蓝牙是否启用（2.4GHz共存）；setCountryCode()和setFrequencyBand()设置国家码和频段（通过\"DRIVER XXX\"命令发给WPAS，Android特有命令，由厂商库处理）；组播过滤设置；mIsScanMode分支——ap_scan=1：WPAS完成AP扫描选择及关联、EAPOL认证等大部分工作；=0：驱动完成；=2：类似0（SCAN_ONLY_MODE对应2，CONNECT_MODE对应1）——扫描模式时转mScanModeState，正常模式时reconnect()+status()后转mDisconnectedState；处理屏幕状态（setSuspendOptimizations发\"DRIVER SETSUSPENDMODE\"命令）；setPowerSave(true)；支持P2P时发CMD_ENABLE_P2P</li><li>DisconnectedState.enter：P2P临时断开处理；读取Framework扫描间隔（WIFI_FRAMEWORK_SCAN_INTERVAL_MS）；后台扫描设置——mEnableBackgroundScan时enableBackgroundScan(true)，否则setScanAlarm(true)（AlarmManager定时发ACTION_START_SCAN）；无P2P连接且无已保存AP则延迟发送CMD_NO_NETWORKS_PERIODIC_SCAN</li><li>setWifiEnabled流程总结（状态迁移链）：DriverUnloadedState → DriverLoadingState（loadDriver，defer CMD_START_SUPPLICANT）→ DriverLoadedState（加载固件、启动WPAS）→ SupplicantStartingState（初始化WPS/WifiConfigStore）→ DriverStartedState（父状态SupplicantStartedState的enter先执行）→ DisconnectedState</li></ul>", "backText": "WifiStateMachine发送消息：enable时发CMD_LOAD_DRIVER（携带WIFI_STATE_ENABLING）和CMD_START_SUPPLICANT；disable时发CMD_STOP_SUPPLICANT和CMD_UNLOAD_DRIVER; CMD_LOAD_DRIVER处理：DriverUnloadedState→transitionTo(mDriverLoadingState)；DriverLoadingState.enter中创建工作线程（持有WakeLock）：先setWifiState(WIFI_STATE_ENABLING)（发送WIFI_STATE_CHANGED_ACTION广播），再调mWifiNative.loadDriver，成功发CMD_LOAD_DRIVER_SUCCESS; wifi_load_driver（wifi.c）：若定义WIFI_DRIVER_MODULE_PATH宏（如\"/lib/modules/dhd.ko\"），则insmod加载驱动模块，然后设置\"wlan.driver.status\"属性；未定义宏则直接设属性\"ok\"; CMD_LOAD_DRIVER_SUCCESS：转mDriverLoadedState；CMD_START_SUPPLICANT在DriverLoadingState中deferMessage推迟到下一状态; CMD_START_SUPPLICANT处理（DriverLoadedState）：mNwService.wifiFirmwareReload(interface, \"STA\")加载wlan固件；mNwService.setInterfaceDown和setInterfaceIpv6PrivacyExtensions；mWifiNative.startSupplicant启动WPAS进程，成功后mWifiMonitor.startMonitoring()启动Monitor线程，transitionTo(mSupplicantStartingState); SUP_CONNECTION_EVENT处理（SupplicantStartingState）：setWifiState(WIFI_STATE_ENABLED)广播；重置mSupplicantRestartCount；发CMD_RESET_SUPPLICANT_STATE；重置mLastBssid/mLastNetworkId/mLastSignalLevel；mWifiInfo.setMacAddress；mWifiConfigStore.initialize()；initializeWpsDetails()；sendSupplicantConnectionChangedBroadcast(true)；transitionTo(mDriverStartedState)"}, {"id": "c507", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "WifiStateMachine发送消息", "back": "<div class=\"def-ans\">enable时发CMD_LOAD_DRIVER（携带WIFI_STATE_ENABLING）和CMD_START_SUPPLICANT；disable时发CMD_STOP_SUPPLICANT和CMD_UNLOAD_DRIVER</div>", "backText": "enable时发CMD_LOAD_DRIVER（携带WIFI_STATE_ENABLING）和CMD_START_SUPPLICANT；disable时发CMD_STOP_SUPPLICANT和CMD_UNLOAD_DRIVER"}, {"id": "c508", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "CMD_LOAD_DRIVER处理", "back": "<div class=\"def-ans\">DriverUnloadedState→transitionTo(mDriverLoadingState)；DriverLoadingState.enter中创建工作线程（持有WakeLock）：先setWifiState(WIFI_STATE_ENABLING)（发送WIFI_STATE_CHANGED_ACTION广播），再调mWifiNative.loadDriver，成功发CMD_LOAD_DRIVER_SUCCESS</div>", "backText": "DriverUnloadedState→transitionTo(mDriverLoadingState)；DriverLoadingState.enter中创建工作线程（持有WakeLock）：先setWifiState(WIFI_STATE_ENABLING)（发送WIFI_STATE_CHANGED_ACTION广播），再调mWifiNative.loadDriver，成功发CMD_LOAD_DRIVER_SUCCESS"}, {"id": "c509", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "wifi_load_driver（wifi.c）", "back": "<div class=\"def-ans\">若定义WIFI_DRIVER_MODULE_PATH宏（如\"/lib/modules/dhd.ko\"），则insmod加载驱动模块，然后设置\"wlan.driver.status\"属性；未定义宏则直接设属性\"ok\"</div>", "backText": "若定义WIFI_DRIVER_MODULE_PATH宏（如\"/lib/modules/dhd.ko\"），则insmod加载驱动模块，然后设置\"wlan.driver.status\"属性；未定义宏则直接设属性\"ok\""}, {"id": "c510", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "CMD_LOAD_DRIVER_SUCCESS", "back": "<div class=\"def-ans\">转mDriverLoadedState；CMD_START_SUPPLICANT在DriverLoadingState中deferMessage推迟到下一状态</div>", "backText": "转mDriverLoadedState；CMD_START_SUPPLICANT在DriverLoadingState中deferMessage推迟到下一状态"}, {"id": "c511", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "SupplicantStartedState.enter", "back": "<div class=\"def-ans\">读取扫描间隔（config_wifi_supplicant_scan_interval，默认15000ms）；向WPAS发送\"SCAN_INTERVAL 时间\"命令</div>", "backText": "读取扫描间隔（config_wifi_supplicant_scan_interval，默认15000ms）；向WPAS发送\"SCAN_INTERVAL 时间\"命令"}, {"id": "c512", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "DriverStartedState.enter", "back": "<div class=\"def-ans\">mIsRunning=true；setBluetoothCoexistenceScanMode告知wlan驱动蓝牙是否启用（2.4GHz共存）；setCountryCode()和setFrequencyBand()设置国家码和频段（通过\"DRIVER XXX\"命令发给WPAS，Android特有命令，由厂商库处理）；组播过滤设置；mIsScanMode分支——ap_scan=1：WPAS完成AP扫描选择及关联、EAPOL认证等大部分工作；=0：驱动完成；=2：类似0（SCAN_ONLY_MODE对应2，CONNECT_MODE对应1）——扫描模式时转mScanModeState，正常模式时reconnect()+status()后转mDisconnectedState；处理屏幕状态（setSuspendOptimizations发\"DRIVER SETSUSPENDMODE\"命令）；setPowerSave(true)；支持P2P时发CMD_ENABLE_P2P</div>", "backText": "mIsRunning=true；setBluetoothCoexistenceScanMode告知wlan驱动蓝牙是否启用（2.4GHz共存）；setCountryCode()和setFrequencyBand()设置国家码和频段（通过\"DRIVER XXX\"命令发给WPAS，Android特有命令，由厂商库处理）；组播过滤设置；mIsScanMode分支——ap_scan=1：WPAS完成AP扫描选择及关联、EAPOL认证等大部分工作；=0：驱动完成；=2：类似0（SCAN_ONLY_MODE对应2，CONNECT_MODE对应1）——扫描模式时转mScanModeState，正常模式时reconnect()+status()后转mDisconnectedState；处理屏幕状态（setSuspendOptimizations发\"DRIVER SETSUSPENDMODE\"命令）；setPowerSave(true)；支持P2P时发CMD_ENABLE_P2P"}, {"id": "c513", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "DisconnectedState.enter", "back": "<div class=\"def-ans\">P2P临时断开处理；读取Framework扫描间隔（WIFI_FRAMEWORK_SCAN_INTERVAL_MS）；后台扫描设置——mEnableBackgroundScan时enableBackgroundScan(true)，否则setScanAlarm(true)（AlarmManager定时发ACTION_START_SCAN）；无P2P连接且无已保存AP则延迟发送CMD_NO_NETWORKS_PERIODIC_SCAN</div>", "backText": "P2P临时断开处理；读取Framework扫描间隔（WIFI_FRAMEWORK_SCAN_INTERVAL_MS）；后台扫描设置——mEnableBackgroundScan时enableBackgroundScan(true)，否则setScanAlarm(true)（AlarmManager定时发ACTION_START_SCAN）；无P2P连接且无已保存AP则延迟发送CMD_NO_NETWORKS_PERIODIC_SCAN"}, {"id": "c514", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "setWifiEnabled流程总结（状态迁移链）", "back": "<div class=\"def-ans\">DriverUnloadedState → DriverLoadingState（loadDriver，defer CMD_START_SUPPLICANT）→ DriverLoadedState（加载固件、启动WPAS）→ SupplicantStartingState（初始化WPS/WifiConfigStore）→ DriverStartedState（父状态SupplicantStartedState的enter先执行）→ DisconnectedState</div>", "backText": "DriverUnloadedState → DriverLoadingState（loadDriver，defer CMD_START_SUPPLICANT）→ DriverLoadedState（加载固件、启动WPAS）→ SupplicantStartingState（初始化WPS/WifiConfigStore）→ DriverStartedState（父状态SupplicantStartedState的enter先执行）→ DisconnectedState"}, {"id": "c515", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "startScanActive函数分析", "back": "<ul class=\"ans-list\"><li>调用链：WifiManager.startScanActive→WifiService.startScan→WifiStateMachine.startScan(forceActive=true)→发送CMD_START_SCAN</li><li>CMD_START_SCAN处理：DisconnectedState收到后先取消后台扫描，返回NOT_HANDLED向上传递；最终由祖父状态DriverStartedState处理——forceActive时setScanMode发\"DRIVER SCAN-ACTIVE\"命令，mWifiNative.scan()发\"SCAN\"命令触发扫描，然后恢复setScanMode，置mScanResultIsPending=true</li><li>SCAN_RESULTS_EVENT处理：WPAS扫描完毕通知WifiMonitor→发SCAN_RESULTS_EVENT；DisconnectedState返回NOT_HANDLED→父状态ConnectModeState处理（setScanResultHandling(CONNECT_MODE)）→祖父状态SupplicantStartedState处理：setScanResults(mWifiNative.scanResults())从WPAS获取扫描结果，sendScanResultsAvailableBroadcast()广播，mScanResultIsPending=false</li></ul>", "backText": "调用链：WifiManager.startScanActive→WifiService.startScan→WifiStateMachine.startScan(forceActive=true)→发送CMD_START_SCAN; CMD_START_SCAN处理：DisconnectedState收到后先取消后台扫描，返回NOT_HANDLED向上传递；最终由祖父状态DriverStartedState处理——forceActive时setScanMode发\"DRIVER SCAN-ACTIVE\"命令，mWifiNative.scan()发\"SCAN\"命令触发扫描，然后恢复setScanMode，置mScanResultIsPending=true; SCAN_RESULTS_EVENT处理：WPAS扫描完毕通知WifiMonitor→发SCAN_RESULTS_EVENT；DisconnectedState返回NOT_HANDLED→父状态ConnectModeState处理（setScanResultHandling(CONNECT_MODE)）→祖父状态SupplicantStartedState处理：setScanResults(mWifiNative.scanResults())从WPAS获取扫描结果，sendScanResultsAvailableBroadcast()广播，mScanResultIsPending=false"}, {"id": "c516", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "调用链", "back": "<div class=\"def-ans\">WifiManager.startScanActive→WifiService.startScan→WifiStateMachine.startScan(forceActive=true)→发送CMD_START_SCAN</div>", "backText": "WifiManager.startScanActive→WifiService.startScan→WifiStateMachine.startScan(forceActive=true)→发送CMD_START_SCAN"}, {"id": "c517", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "CMD_START_SCAN处理", "back": "<div class=\"def-ans\">DisconnectedState收到后先取消后台扫描，返回NOT_HANDLED向上传递；最终由祖父状态DriverStartedState处理——forceActive时setScanMode发\"DRIVER SCAN-ACTIVE\"命令，mWifiNative.scan()发\"SCAN\"命令触发扫描，然后恢复setScanMode，置mScanResultIsPending=true</div>", "backText": "DisconnectedState收到后先取消后台扫描，返回NOT_HANDLED向上传递；最终由祖父状态DriverStartedState处理——forceActive时setScanMode发\"DRIVER SCAN-ACTIVE\"命令，mWifiNative.scan()发\"SCAN\"命令触发扫描，然后恢复setScanMode，置mScanResultIsPending=true"}, {"id": "c518", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "SCAN_RESULTS_EVENT处理", "back": "<div class=\"def-ans\">WPAS扫描完毕通知WifiMonitor→发SCAN_RESULTS_EVENT；DisconnectedState返回NOT_HANDLED→父状态ConnectModeState处理（setScanResultHandling(CONNECT_MODE)）→祖父状态SupplicantStartedState处理：setScanResults(mWifiNative.scanResults())从WPAS获取扫描结果，sendScanResultsAvailableBroadcast()广播，mScanResultIsPending=false</div>", "backText": "WPAS扫描完毕通知WifiMonitor→发SCAN_RESULTS_EVENT；DisconnectedState返回NOT_HANDLED→父状态ConnectModeState处理（setScanResultHandling(CONNECT_MODE)）→祖父状态SupplicantStartedState处理：setScanResults(mWifiNative.scanResults())从WPAS获取扫描结果，sendScanResultsAvailableBroadcast()广播，mScanResultIsPending=false"}, {"id": "c519", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "connect函数分析", "back": "<ul class=\"ans-list\"><li>WifiManager.connect(config, listener)：通过AsyncChannel发送CONNECT_NETWORK消息（arg1为INVALID_NETWORK_ID即-1，obj为WifiConfiguration）</li><li>CONNECT_NETWORK处理（ConnectModeState）：mWifiConfigStore.saveNetwork(config)——addOrUpdateNetworkNative触发\"ADD_NETWORK\"、\"SET_NETWORK\"等命令；新网络则mWifiNative.enableNetwork发\"ENABLE_NETWORK\"命令；mWifiNative.saveConfig()发\"SAVE_CONFIG\"；发送CONFIGURED_NETWORKS_CHANGED广播</li><li>selectNetwork(netId)选择网络；mWifiNative.reconnect()发RECONNECT命令（WPAS处理即调wpa_supplicant_req_scan）；回复CONNECT_NETWORK_SUCCEEDED、transitionTo(mDisconnectingState)（考虑到之前可能连接其他AP需先断开）</li><li>ENABLE_NETWORK过程中WPAS完成802.11身份认证、关联、四次握手等工作，wpa_sm状态变化触发WifiMonitor发SUPPLICANT_STATE_CHANGE_EVENT</li><li>NETWORK_CONNECTION_EVENT处理（ConnectModeState）：WPAS加入成功后发\"CTRL-EVENT-CONNECTED\"，WifiMonitor据此发NETWORK_CONNECTION_EVENT；记录mLastNetworkId和mLastBssid，更新mWifiInfo，setNetworkDetailedState(OBTAINING_IPADDR)，发送NETWORK_STATE_CHANGED_ACTION广播，transitionTo(mObtainingIpState)</li><li>ObtainingIpState.enter：判断目标AP是否静态IP——动态IP时创建DhcpStateMachine、发送CMD_START_DHCP</li><li>CMD_PRE/POST_DHCP_ACTION处理（由父状态L2ConnectedState处理）：CMD_PRE_DHCP_ACTION→handlePreDhcpSetup（设置蓝牙共存模式等），回复CMD_PRE_DHCP_ACTION_COMPLETE——DhcpStateMachine随后启动dhcpcd进程从AP获取IP地址；CMD_POST_DHCP_ACTION→handlePostDhcpSetup；DHCP_SUCCESS时handleSuccessfulIpConfiguration（发LINK_CONFIGURATION_CHANGED_ACTION广播）并transitionTo(mVerifyingLinkState)</li><li>VerifyingLinkState：enter中setNetworkDetailedState(VERIFYING_POOR_LINK)、发送广播；processMessage处理WifiWatchdogStateMachine的消息——收到POOR_LINK_DETECTED不动作，收到GOOD_LINK_DETECTED（信号良好）则transitionTo(mCaptivePortalCheckState)</li><li>CaptivePortalCheckState（Android 4.2新引入）：与Captive Portal（强制网络门户）有关——未认证用户初次上网时被强制打开特定页面，常见于机场、酒店等公共场所<ul class=\"sub\"><li>enter：setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播</li><li>processMessage：收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)</li></ul></li><li>ConnectedState仅处理POOR_LINK_DETECTED消息，是第二条分析路线的终点</li><li>connect流程总结（关键点链）：CONNECT_NETWORK → ConnectModeState处理（WPAS完成802.11认证/关联/四次握手）→ NETWORK_CONNECTION_EVENT（转ObtainingIpState）→ DHCP交互（L2ConnectedState处理，转VerifyingLinkState）→ 与WifiWatchdogStateMachine交互（转CaptivePortalCheckState）→ 最终转ConnectedState</li></ul>", "backText": "WifiManager.connect(config, listener)：通过AsyncChannel发送CONNECT_NETWORK消息（arg1为INVALID_NETWORK_ID即-1，obj为WifiConfiguration）; CONNECT_NETWORK处理（ConnectModeState）：mWifiConfigStore.saveNetwork(config)——addOrUpdateNetworkNative触发\"ADD_NETWORK\"、\"SET_NETWORK\"等命令；新网络则mWifiNative.enableNetwork发\"ENABLE_NETWORK\"命令；mWifiNative.saveConfig()发\"SAVE_CONFIG\"；发送CONFIGURED_NETWORKS_CHANGED广播; selectNetwork(netId)选择网络；mWifiNative.reconnect()发RECONNECT命令（WPAS处理即调wpa_supplicant_req_scan）；回复CONNECT_NETWORK_SUCCEEDED、transitionTo(mDisconnectingState)（考虑到之前可能连接其他AP需先断开）; ENABLE_NETWORK过程中WPAS完成802.11身份认证、关联、四次握手等工作，wpa_sm状态变化触发WifiMonitor发SUPPLICANT_STATE_CHANGE_EVENT; NETWORK_CONNECTION_EVENT处理（ConnectModeState）：WPAS加入成功后发\"CTRL-EVENT-CONNECTED\"，WifiMonitor据此发NETWORK_CONNECTION_EVENT；记录mLastNetworkId和mLastBssid，更新mWifiInfo，setNetworkDetailedState(OBTAINING_IPADDR)，发送NETWORK_STATE_CHANGED_ACTION广播，transitionTo(mObtainingIpState); ObtainingIpState.enter：判断目标AP是否静态IP——动态IP时创建DhcpStateMachine、发送CMD_START_DHCP"}, {"id": "c520", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "ObtainingIpState.enter", "back": "<div class=\"def-ans\">判断目标AP是否静态IP——动态IP时创建DhcpStateMachine、发送CMD_START_DHCP</div>", "backText": "判断目标AP是否静态IP——动态IP时创建DhcpStateMachine、发送CMD_START_DHCP"}, {"id": "c521", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "VerifyingLinkState", "back": "<div class=\"def-ans\">enter中setNetworkDetailedState(VERIFYING_POOR_LINK)、发送广播；processMessage处理WifiWatchdogStateMachine的消息——收到POOR_LINK_DETECTED不动作，收到GOOD_LINK_DETECTED（信号良好）则transitionTo(mCaptivePortalCheckState)</div>", "backText": "enter中setNetworkDetailedState(VERIFYING_POOR_LINK)、发送广播；processMessage处理WifiWatchdogStateMachine的消息——收到POOR_LINK_DETECTED不动作，收到GOOD_LINK_DETECTED（信号良好）则transitionTo(mCaptivePortalCheckState)"}, {"id": "c522", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "CaptivePortalCheckState（Android 4.2新引入）：与Captive Portal（强制网络门户）有关——未认证用户初次上网时被强制打开特定页面，常见于机场、酒店等公共场所", "back": "<ul class=\"ans-list\"><li>enter：setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播</li><li>processMessage：收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)</li></ul>", "backText": "enter：setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播; processMessage：收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)"}, {"id": "c523", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "enter", "back": "<div class=\"def-ans\">setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播</div>", "backText": "setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播"}, {"id": "c524", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "processMessage", "back": "<div class=\"def-ans\">收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)</div>", "backText": "收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)"}, {"id": "c525", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.3 加入无线网络分析", "front": "connect流程总结（关键点链）", "back": "<div class=\"def-ans\">CONNECT_NETWORK → ConnectModeState处理（WPAS完成802.11认证/关联/四次握手）→ NETWORK_CONNECTION_EVENT（转ObtainingIpState）→ DHCP交互（L2ConnectedState处理，转VerifyingLinkState）→ 与WifiWatchdogStateMachine交互（转CaptivePortalCheckState）→ 最终转ConnectedState</div>", "backText": "CONNECT_NETWORK → ConnectModeState处理（WPAS完成802.11认证/关联/四次握手）→ NETWORK_CONNECTION_EVENT（转ObtainingIpState）→ DHCP交互（L2ConnectedState处理，转VerifyingLinkState）→ 与WifiWatchdogStateMachine交互（转CaptivePortalCheckState）→ 最终转ConnectedState"}, {"id": "c526", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "概述与创建", "back": "<div class=\"def-ans\">用于监控无线网络的信号质量；在WifiService的checkAndStartWifi函数中通过makeWifiWatchdogStateMachine创建</div>", "backText": "用于监控无线网络的信号质量；在WifiService的checkAndStartWifi函数中通过makeWifiWatchdogStateMachine创建"}, {"id": "c527", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "makeWifiWatchdogStateMachine", "back": "<div class=\"def-ans\">通过ConnectivityManager判断是否只支持Wi-Fi（sWifiOnly）；设置Settings.Global.WIFI_WATCHDOG_ON默认为true；new并start()启动HSM</div>", "backText": "通过ConnectivityManager判断是否只支持Wi-Fi（sWifiOnly）；设置Settings.Global.WIFI_WATCHDOG_ON默认为true；new并start()启动HSM"}, {"id": "c528", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "构造函数分析", "back": "<ul class=\"ans-list\"><li>mWsmChannel（AsyncChannel）以connectSync方式连接WifiStateMachine</li><li>setupNetworkReceiver创建广播接收对象，接收NETWORK_STATE_CHANGED_ACTION、WIFI_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION等广播并转为内部事件</li><li>共定义9个状态；Watchdog开启时初始状态为NotConnectedState，否则为mWatchdogDisabledState</li><li>WifiWatchdogStateMachine完全靠广播事件驱动</li></ul>", "backText": "mWsmChannel（AsyncChannel）以connectSync方式连接WifiStateMachine; setupNetworkReceiver创建广播接收对象，接收NETWORK_STATE_CHANGED_ACTION、WIFI_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION等广播并转为内部事件; 共定义9个状态；Watchdog开启时初始状态为NotConnectedState，否则为mWatchdogDisabledState; WifiWatchdogStateMachine完全靠广播事件驱动"}, {"id": "c529", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "EVENT_NETWORK_STATE_CHANGE处理流程（由NotConnectedState的父状态WatchdogEnabledState处理）", "back": "<ul class=\"ans-list\"><li>从Intent中取NetworkInfo和WifiInfo，updateCurrentBssid更新BSSID信息</li><li>DetailedState为VERIFYING_POOR_LINK时：保存mLinkProperties；若mPoorNetworkDetectionEnabled且mWifiInfo/mCurrentBssid有效则transitionTo(mVerifyingLinkState)，否则sendLinkStatusNotification(true)直接发GOOD_LINK_DETECTED</li><li>DetailedState为CONNECTED时transitionTo(mOnlineWatchState)</li></ul>", "backText": "从Intent中取NetworkInfo和WifiInfo，updateCurrentBssid更新BSSID信息; DetailedState为VERIFYING_POOR_LINK时：保存mLinkProperties；若mPoorNetworkDetectionEnabled且mWifiInfo/mCurrentBssid有效则transitionTo(mVerifyingLinkState)，否则sendLinkStatusNotification(true)直接发GOOD_LINK_DETECTED; DetailedState为CONNECTED时transitionTo(mOnlineWatchState)"}, {"id": "c530", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "VerifyingLinkState与CMD_RSSI_FETCH处理流程", "back": "<ul class=\"ans-list\"><li>enter：mSampleCount=0、mCurrentBssid.newLinkDetected()，向自己发送CMD_RSSI_FETCH</li><li>processMessage收到CMD_RSSI_FETCH：通过mWsmChannel向WifiStateMachine发送RSSI_PKTCNT_FETCH——WifiStateMachine处理时调用WifiNative的signalPoll和pktcntPoll获取RSSI、LinkSpeed、发送Packet总数、发送失败Packet总数；同时每1000ms再次发起CMD_RSSI_FETCH</li><li>收到RSSI_PKTCNT_FETCH_SUCCEEDED：用指数加权移动平均算法（Volume-weighted Exponential Moving Average）判断信号质量；rssi &gt;= mGoodLinkTargetRssi时累加mSampleCount，采样次数达到mGoodLinkTargetCount才认为网络变好并发GOOD_LINK_DETECTED；rssi不达标则mSampleCount清零</li><li>检测到Poor link时发送POOR_LINK_DETECTED给WifiStateMachine处理</li></ul>", "backText": "enter：mSampleCount=0、mCurrentBssid.newLinkDetected()，向自己发送CMD_RSSI_FETCH; processMessage收到CMD_RSSI_FETCH：通过mWsmChannel向WifiStateMachine发送RSSI_PKTCNT_FETCH——WifiStateMachine处理时调用WifiNative的signalPoll和pktcntPoll获取RSSI、LinkSpeed、发送Packet总数、发送失败Packet总数；同时每1000ms再次发起CMD_RSSI_FETCH; 收到RSSI_PKTCNT_FETCH_SUCCEEDED：用指数加权移动平均算法（Volume-weighted Exponential Moving Average）判断信号质量；rssi >= mGoodLinkTargetRssi时累加mSampleCount，采样次数达到mGoodLinkTargetCount才认为网络变好并发GOOD_LINK_DETECTED；rssi不达标则mSampleCount清零; 检测到Poor link时发送POOR_LINK_DETECTED给WifiStateMachine处理"}, {"id": "c531", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "enter", "back": "<div class=\"def-ans\">mSampleCount=0、mCurrentBssid.newLinkDetected()，向自己发送CMD_RSSI_FETCH</div>", "backText": "mSampleCount=0、mCurrentBssid.newLinkDetected()，向自己发送CMD_RSSI_FETCH"}, {"id": "c532", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "processMessage收到CMD_RSSI_FETCH", "back": "<div class=\"def-ans\">通过mWsmChannel向WifiStateMachine发送RSSI_PKTCNT_FETCH——WifiStateMachine处理时调用WifiNative的signalPoll和pktcntPoll获取RSSI、LinkSpeed、发送Packet总数、发送失败Packet总数；同时每1000ms再次发起CMD_RSSI_FETCH</div>", "backText": "通过mWsmChannel向WifiStateMachine发送RSSI_PKTCNT_FETCH——WifiStateMachine处理时调用WifiNative的signalPoll和pktcntPoll获取RSSI、LinkSpeed、发送Packet总数、发送失败Packet总数；同时每1000ms再次发起CMD_RSSI_FETCH"}, {"id": "c533", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "收到RSSI_PKTCNT_FETCH_SUCCEEDED", "back": "<div class=\"def-ans\">用指数加权移动平均算法（Volume-weighted Exponential Moving Average）判断信号质量；rssi &gt;= mGoodLinkTargetRssi时累加mSampleCount，采样次数达到mGoodLinkTargetCount才认为网络变好并发GOOD_LINK_DETECTED；rssi不达标则mSampleCount清零</div>", "backText": "用指数加权移动平均算法（Volume-weighted Exponential Moving Average）判断信号质量；rssi >= mGoodLinkTargetRssi时累加mSampleCount，采样次数达到mGoodLinkTargetCount才认为网络变好并发GOOD_LINK_DETECTED；rssi不达标则mSampleCount清零"}, {"id": "c534", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.4 WifiWatchdogStateMachine介绍", "front": "总结", "back": "<div class=\"def-ans\">目的简单（监测信号质量并做相应动作），但使用较高级的算法判断网络质量</div>", "backText": "目的简单（监测信号质量并做相应动作），但使用较高级的算法判断网络质量"}, {"id": "c535", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "概述", "back": "<div class=\"def-ans\">Android 4.2中Captive Portal Check功能集中在CaptivePortalTracker类中，它也是一个HSM；创建于ConnectivityService构造函数中</div>", "backText": "Android 4.2中Captive Portal Check功能集中在CaptivePortalTracker类中，它也是一个HSM；创建于ConnectivityService构造函数中"}, {"id": "c536", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "构造函数分析", "back": "<ul class=\"ans-list\"><li>获取TelephonyManager；注册广播接收对象只监听ConnectivityManager.CONNECTIVITY_ACTION</li><li>读取Settings.Global.CAPTIVE_PORTAL_SERVER作为测试服务器地址，未设置时用DEFAULT_SERVER即\"clients3.google.com\"</li><li>读取CAPTIVE_PORTAL_DETECTION_ENABLED判断是否开启该功能（默认开启）</li><li>只有4个状态：mDefaultState、mNoActiveNetworkState、mActiveNetworkState、mDelayedCaptiveCheckState；初始状态mNoActiveNetworkState</li></ul>", "backText": "获取TelephonyManager；注册广播接收对象只监听ConnectivityManager.CONNECTIVITY_ACTION; 读取Settings.Global.CAPTIVE_PORTAL_SERVER作为测试服务器地址，未设置时用DEFAULT_SERVER即\"clients3.google.com\"; 读取CAPTIVE_PORTAL_DETECTION_ENABLED判断是否开启该功能（默认开启）; 只有4个状态：mDefaultState、mNoActiveNetworkState、mActiveNetworkState、mDelayedCaptiveCheckState；初始状态mNoActiveNetworkState"}, {"id": "c537", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "只有4个状态", "back": "<div class=\"def-ans\">mDefaultState、mNoActiveNetworkState、mActiveNetworkState、mDelayedCaptiveCheckState；初始状态mNoActiveNetworkState</div>", "backText": "mDefaultState、mNoActiveNetworkState、mActiveNetworkState、mDelayedCaptiveCheckState；初始状态mNoActiveNetworkState"}, {"id": "c538", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第5章 深入理解WifiService", "section": "5.5 Captive Portal Check介绍", "front": "CMD_CONNECTIVITY_CHANGE处理流程", "back": "<ul class=\"ans-list\"><li>广播接收对象onReceive收到CONNECTIVITY_ACTION后向状态机发送CMD_CONNECTIVITY_CHANGE（携带NetworkInfo）</li><li>NoActiveNetworkState.processMessage：若info.isConnected()且isActiveNetwork(info)则保存mNetworkInfo并transitionTo(mDelayedCaptiveCheckState)</li><li>触发源头：Wi-Fi连接成功后ConnectivityService的handleConnect被触发，其内部发送CONNECTIVITY_ACTION广播</li></ul>", "backText": "广播接收对象onReceive收到CONNECTIVITY_ACTION后向状态机发送CMD_CONNECTIVITY_CHANGE（携带NetworkInfo）; NoActiveNetworkState.processMessage：若info.isConnected()且isActiveNetwork(info)则保存mNetworkInfo并transitionTo(mDelayedCaptiveCh
