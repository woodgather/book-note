CT命令）、notifyTransactionListeners（AID被选中，AID代表SE上的Applet）、notifySeFieldActivated/Deactivated、notifySeApduReceived（收到APDU命令）、notifySeEmvCardRemoval（EMV为Europay/MasterCard/Visa制定的IC卡金融支付标准）、notifySeMifareAccess（NXP芯片专用）</li><li>NfcService对CE处理很简单：接收底层通知事件并转化为广播（如ACTION_EMV_CARD_REMOVAL）发给感兴趣的应用</li></ul>", "backText": "通过NfcAdapterExtras为CE客户端提供INfcAdapterExtras实现; NativeNfcManager的CE相关回调：notifyTargetDeselected（NFCIP-1的DESELECT命令）、notifyTransactionListeners（AID被选中，AID代表SE上的Applet）、notifySeFieldActivated/Deactivated、notifySeApduReceived（收到APDU命令）、notifySeEmvCardRemoval（EMV为Europay/MasterCard/Visa制定的IC卡金融支付标准）、notifySeMifareAccess（NXP芯片专用）; NfcService对CE处理很简单：接收底层通知事件并转化为广播（如ACTION_EMV_CARD_REMOVAL）发给感兴趣的应用"}, {"id": "c785", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NativeNfcManager的CE相关回调", "back": "<div class=\"def-ans\">notifyTargetDeselected（NFCIP-1的DESELECT命令）、notifyTransactionListeners（AID被选中，AID代表SE上的Applet）、notifySeFieldActivated/Deactivated、notifySeApduReceived（收到APDU命令）、notifySeEmvCardRemoval（EMV为Europay/MasterCard/Visa制定的IC卡金融支付标准）、notifySeMifareAccess（NXP芯片专用）</div>", "backText": "notifyTargetDeselected（NFCIP-1的DESELECT命令）、notifyTransactionListeners（AID被选中，AID代表SE上的Applet）、notifySeFieldActivated/Deactivated、notifySeApduReceived（收到APDU命令）、notifySeEmvCardRemoval（EMV为Europay/MasterCard/Visa制定的IC卡金融支付标准）、notifySeMifareAccess（NXP芯片专用）"}, {"id": "c786", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NfcService对CE处理很简单", "back": "<div class=\"def-ans\">接收底层通知事件并转化为广播（如ACTION_EMV_CARD_REMOVAL）发给感兴趣的应用</div>", "backText": "接收底层通知事件并转化为广播（如ACTION_EMV_CARD_REMOVAL）发给感兴趣的应用"}, {"id": "c787", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "模块总结", "back": "<div class=\"def-ans\">芯片无关模块难度不大；芯片相关模块（com.android.nfc.dhimpl包）难度大，需结合芯片手册研究</div>", "backText": "芯片无关模块难度不大；芯片相关模块（com.android.nfc.dhimpl包）难度大，需结合芯片手册研究"}, {"id": "c788", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.4 NFC HAL层讨论", "front": "与Wi-Fi对比", "back": "<div class=\"def-ans\">Wi-Fi借助nl80211机制或wireless extension API实现了上下层解耦</div>", "backText": "Wi-Fi借助nl80211机制或wireless extension API实现了上下层解耦"}, {"id": "c789", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.4 NFC HAL层讨论", "front": "未来Linux NFC软件架构", "back": "<div class=\"def-ans\">用户空间neard（NFC Daemon）通过AF_NFC socket和Generic Netlink与内核NFC子系统通信；neard用插件支持Handover、NPP、SNEP等协议</div>", "backText": "用户空间neard（NFC Daemon）通过AF_NFC socket和Generic Netlink与内核NFC子系统通信；neard用插件支持Handover、NPP、SNEP等协议"}, {"id": "c790", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.4 NFC HAL层讨论", "front": "内核NFC子系统核心模块", "back": "<div class=\"def-ans\">Control Command Handler、LLCP Handler、Raw Data Handler、Core</div>", "backText": "Control Command Handler、LLCP Handler、Raw Data Handler、Core"}, {"id": "c791", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.5 本章总结和参考资料说明", "front": "NFC理论知识", "back": "<div class=\"def-ans\">围绕三种运行模式（R/W、P2P、CE）展开</div>", "backText": "围绕三种运行模式（R/W、P2P、CE）展开"}, {"id": "c792", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.5 本章总结和参考资料说明", "front": "Android NFC模块结构", "back": "<div class=\"def-ans\">通过三个示例程序展示Android NFC API的使用</div>", "backText": "通过三个示例程序展示Android NFC API的使用"}, {"id": "c793", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.5 本章总结和参考资料说明", "front": "NFC系统模块", "back": "<div class=\"def-ans\">详细介绍NfcService及重要成员，深入分析NFC Tag分发和Android Beam实现细节</div>", "backText": "详细介绍NfcService及重要成员，深入分析NFC Tag分发和Android Beam实现细节"}, {"id": "c794", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.5 本章总结和参考资料说明", "front": "建议后续任务", "back": "<div class=\"def-ans\">学习NFC Forum其他规范；结合Connection Handover规范分析Android中NFC Handover实现代码</div>", "backText": "学习NFC Forum其他规范；结合Connection Handover规范分析Android中NFC Handover实现代码"}, {"id": "c795", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.5 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">《Near Field Communication From Theory to Practice》（最详尽的NFC资料）；NFC Technology Overview（NFC Forum官方）；NDEF/RTD/LLCP/SNEP等NFC Forum官方规范；NCI Specification官方文档；Linux Kernel 3.8 NFC Subsystem文档；《Professional NFC Application Development for Android》</div>", "backText": "《Near Field Communication From Theory to Practice》（最详尽的NFC资料）；NFC Technology Overview（NFC Forum官方）；NDEF/RTD/LLCP/SNEP等NFC Forum官方规范；NCI Specification官方文档；Linux Kernel 3.8 NFC Subsystem文档；《Professional NFC Application Development for Android》"}, {"id": "c796", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.1 概述", "front": "本章结构", "back": "<div class=\"def-ans\">先讲GPS基础知识（原理对其他GNSS同样适用），再讲Android位置管理软件架构与代码实现</div>", "backText": "先讲GPS基础知识（原理对其他GNSS同样适用），再讲Android位置管理软件架构与代码实现"}, {"id": "c797", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "9.2.1 卫星导航基本原理", "back": "<ul class=\"ans-list\"><li>测距原理<ul class=\"sub\"><li>卫星与接收器各有时钟（假设完美同步），距离 D = Δt × c（信号传播速度光速×传播时间）</li><li>二维定位（三球交汇的二维形式）：以两颗卫星为圆心、测得距离为半径作圆，交点即为接收器可能位置</li><li>二维需2颗卫星，三维定位需3颗卫星；接收器时钟精度远低于卫星钟（0.1ms偏差即30km距离误差），需引入第4颗卫星解决</li></ul></li><li>坐标系（ECI/ECEF/WGS-84）<ul class=\"sub\"><li>ECI（地心惯性坐标系）：原点为地球质心，不随地球旋转，用于描述GPS卫星位置</li><li>ECEF（地心地球固连坐标系）：随地球旋转，X轴指向0经度、Y轴指向东经90度，用于描述接收器位置</li><li>WGS-84：美国国防部建立的标准地球模型，将地球视为椭球体（半长轴6378137.00m、半短轴6356752.31m）</li><li>笛卡尔坐标（x,y,z）与椭球坐标（φ经度,λ纬度,h高度）可相互转换；GPS高度指点到椭球面的距离</li></ul></li><li>高度计算：GPS大地高h基于椭球面（Ellipsoid），日常海拔（正高H）基于大地水准面（Geoid，重力等位面）；h与H之差为大地水准面高N</li><li>时间系统（四种）<ul class=\"sub\"><li>IAT（国际原子时）：1967年以铯原子能级跃迁辐射9192631770周定义为1秒，起始1958年1月1日</li><li>UTC（协调世界时）：1972年面世，以原子秒长为基础尽量接近UT，通过加入正/负闰秒使与UT差不超过0.9秒；NTP获取的就是UTC</li><li>GPST（GPS时间）：使用原子秒，时间原点1980年1月6日UTC 0时；比IAT慢19秒，与UTC差为整数秒且随时间积累；格式为周数+周内秒</li><li>本地时间：基于UTC分24个时区，遵循ISO 8601格式（北京时间为+08）</li></ul></li><li>卫星轨道相关知识<ul class=\"sub\"><li>开普勒三定律：第一定律——卫星绕地球做椭圆运动、地球为焦点之一；第二定律——相同时间内扫过面积相等；第三定律——半长轴立方与周期平方之比为常量</li><li>轨道参数：轨道倾角、仰角、天顶角、方位角</li><li>轨道分类：GEO（高约35786km，细分为GSO/IGSO/PEO）；MEO（约10000km，多为导航卫星如GPS）；LEO（约1000km）；高椭圆轨道（适合高纬度国家如俄罗斯）</li><li>星历表（Ephemeris）：记录卫星详细轨道与位置参数，可算任意时刻卫星位置和速度，数据量大、传输时间长</li><li>历书（Almanac）：星历的简化集，精度较低、数据量小、传输时间短</li></ul></li></ul>", "backText": "测距原理; 坐标系（ECI/ECEF/WGS-84）; 高度计算：GPS大地高h基于椭球面（Ellipsoid），日常海拔（正高H）基于大地水准面（Geoid，重力等位面）；h与H之差为大地水准面高N; 时间系统（四种）; 卫星轨道相关知识"}, {"id": "c798", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "测距原理", "back": "<ul class=\"ans-list\"><li>卫星与接收器各有时钟（假设完美同步），距离 D = Δt × c（信号传播速度光速×传播时间）</li><li>二维定位（三球交汇的二维形式）：以两颗卫星为圆心、测得距离为半径作圆，交点即为接收器可能位置</li><li>二维需2颗卫星，三维定位需3颗卫星；接收器时钟精度远低于卫星钟（0.1ms偏差即30km距离误差），需引入第4颗卫星解决</li></ul>", "backText": "卫星与接收器各有时钟（假设完美同步），距离 D = Δt × c（信号传播速度光速×传播时间）; 二维定位（三球交汇的二维形式）：以两颗卫星为圆心、测得距离为半径作圆，交点即为接收器可能位置; 二维需2颗卫星，三维定位需3颗卫星；接收器时钟精度远低于卫星钟（0.1ms偏差即30km距离误差），需引入第4颗卫星解决"}, {"id": "c799", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "二维定位（三球交汇的二维形式）", "back": "<div class=\"def-ans\">以两颗卫星为圆心、测得距离为半径作圆，交点即为接收器可能位置</div>", "backText": "以两颗卫星为圆心、测得距离为半径作圆，交点即为接收器可能位置"}, {"id": "c800", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "坐标系（ECI/ECEF/WGS-84）", "back": "<ul class=\"ans-list\"><li>ECI（地心惯性坐标系）：原点为地球质心，不随地球旋转，用于描述GPS卫星位置</li><li>ECEF（地心地球固连坐标系）：随地球旋转，X轴指向0经度、Y轴指向东经90度，用于描述接收器位置</li><li>WGS-84：美国国防部建立的标准地球模型，将地球视为椭球体（半长轴6378137.00m、半短轴6356752.31m）</li><li>笛卡尔坐标（x,y,z）与椭球坐标（φ经度, 0km，多为导航卫星如GPS）；LEO（约1000km）；高椭圆轨道（适合高纬度国家如俄罗斯）; 星历表（Ephemeris）：记录卫星详细轨道与位置参数，可算任意时刻卫星位置和速度，数据量大、传输时间长; 历书（Almanac）：星历的简化集，精度较低、数据量小、传输时间短"}, {"id": "c811", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "开普勒三定律", "back": "<div class=\"def-ans\">第一定律——卫星绕地球做椭圆运动、地球为焦点之一；第二定律——相同时间内扫过面积相等；第三定律——半长轴立方与周期平方之比为常量</div>", "backText": "第一定律——卫星绕地球做椭圆运动、地球为焦点之一；第二定律——相同时间内扫过面积相等；第三定律——半长轴立方与周期平方之比为常量"}, {"id": "c812", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "轨道参数", "back": "<div class=\"def-ans\">轨道倾角、仰角、天顶角、方位角</div>", "backText": "轨道倾角、仰角、天顶角、方位角"}, {"id": "c813", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "轨道分类", "back": "<div class=\"def-ans\">GEO（高约35786km，细分为GSO/IGSO/PEO）；MEO（约10000km，多为导航卫星如GPS）；LEO（约1000km）；高椭圆轨道（适合高纬度国家如俄罗斯）</div>", "backText": "GEO（高约35786km，细分为GSO/IGSO/PEO）；MEO（约10000km，多为导航卫星如GPS）；LEO（约1000km）；高椭圆轨道（适合高纬度国家如俄罗斯）"}, {"id": "c814", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "星历表（Ephemeris）", "back": "<div class=\"def-ans\">记录卫星详细轨道与位置参数，可算任意时刻卫星位置和速度，数据量大、传输时间长</div>", "backText": "记录卫星详细轨道与位置参数，可算任意时刻卫星位置和速度，数据量大、传输时间长"}, {"id": "c815", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "历书（Almanac）", "back": "<div class=\"def-ans\">星历的简化集，精度较低、数据量小、传输时间短</div>", "backText": "星历的简化集，精度较低、数据量小、传输时间短"}, {"id": "c816", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "9.2.2 GPS系统组成及原理", "back": "<ul class=\"ans-list\"><li>GPS系统三段组成<ul class=\"sub\"><li>空间段（SS）：由GPS卫星组成</li><li>控制段（CS）：主控站（位于美国科罗拉多）、数个监控站、地面控制站及地面天线；空间段与控制段可双向通信</li><li>用户段（US）：分民用与军用用户，军用需授权获取更高精度数据；用户段只能从空间段单向获取数据</li><li>GPS提供两类服务：SPS标准定位服务（面向全球民用）与PPS精密定位服务（面向美国及其盟国军事部门）</li></ul></li><li>GPS空间段<ul class=\"sub\"><li>由32颗卫星组成，分布在6个轨道面，倾角55度，轨道高度20180km，运行周期约12小时</li><li>设计保证地球任意地点、任意时刻至少被4颗卫星信号覆盖（3颗用于定位，1颗用于解算时钟误差）</li></ul></li><li>GPS通信频段<ul class=\"sub\"><li>使用L频段三个频率：L1（1575.42MHz）、L2（1227.60MHz）、L5（1176.45MHz）</li><li>2005年前：L1传民用心A码与军用P(Y)码，L2仅传P(Y)码</li><li>IIR(M)卫星在L2增加L2C民用信号，可双频联合减少电离层影响提高精度；IIF卫星在L5发播民用信号；III型卫星将支持L1C以增强与其他GNSS的互操作性</li></ul></li><li>GPS信号组成<ul class=\"sub\"><li>载波：L1与L2</li><li>测距码：精心设计的伪随机噪声PRN；C/A码——频率1.023MHz、周期1ms、码长1023、码元宽度293.05m、测距精度2~3m；P码——频率10.23MHz、周期7天、码元宽度29.3m、精度0.3m，供军事用途，加密后称Y码</li><li>导航电文（D码）：携带星历、时间等定位所需信息，传输速率50bps</li><li>C/A码仅在L1发送，P码在L1与L2同时发送（双频可消除电离层延时）</li></ul></li><li>GPS导航电文<ul class=\"sub\"><li>基本单位为帧（Frame/Page），一帧1500比特、传输需30秒；每帧分5个子帧（各300比特），每子帧10个字码（各30位）</li><li>完整导航电文由25帧组成（37500比特），全部传完需12.5分钟</li><li>子帧1~3内容为发射卫星自身的GPS时间与星历数据；子帧4~5携带各卫星的历书数据</li><li>TLM（遥测字）：前8位为同步用前导码10001011</li><li>HOW（转换字）：前17位为星期时间TOW，第18位警告标志、第19位反欺骗A-S标志、20~22位子帧ID</li></ul></li><li>定位计算相关知识<ul class=\"sub\"><li>定位原理：接收器钟差统一为一个参数Δt0，测得伪距 PSR = R + Δt0·c</li><li>4颗卫星建立4个方程组成方程组求解（Xuser, Yuser, Zuser, Δt0）；常用泰勒级数线性化+偏微分迭代求解</li><li>测速：基于多普勒效应（相对运动导致收发频率差即多普勒频移）</li><li>误差来源：卫星钟误差（10ns≈3m）、卫星轨道位置（约5m）、电离层/对流层影响光速、接收器时钟不同步、多路径效应（反射信号）</li><li>DOP（精度衰减因子）描述卫星空间分布对精度的影响：GDOP几何、PDOP位置、HDOP水平、VDOP垂直、TDOP时间；卫星间夹角越大误差重合区域越小、DOP越小</li><li>DOP质量分级：1~3非常高、4~5高、6一般、&gt;6差</li><li>TTFF（首次定位时间）：冷启动（无有效星历/时间/位置，至少12.5分钟）；暖启动（有历书≤180天等条件，至少30秒）；热启动（星历/时间/位置有效，10秒内）</li><li>减小TTFF的关键是星历/历书获取瓶颈，由此催生AGPS：通过移动网络（远快于卫星信号速率）下载星历等辅助数据</li></ul></li><li>NMEA-0183和GPX（数据格式）<ul class=\"sub\"><li>NMEA-0183：美国国家海洋电子协会制定的海用电子设备标准格式，输出ASCII文本（时间、经纬度、高度、卫星数、DOP等）；由类型化语句组成（如$GPGGA）</li><li>GPX：以XML封装GPS数据的交换格式；三个核心概念——Waypoint（wpt路点/兴趣点）、Route（rte路径，有序路点列表）、Track（trk轨迹，记录实际走过并带时间戳的点）</li><li>KML：基于XML的地理信息格式，由谷歌地球等使用，Android DDMS也支持</li></ul></li><li>GPS增强系统<ul class=\"sub\"><li>DGPS（差分GPS）：在位置精确已知的基站测得伪距误差并作为修正值播发；伪距差分要求距基站200km内，载波相位差分要求20km内</li><li>修正数据格式：RTCM SC104与RTCA DO-229C；修正数据经卫星播发的系统即SBAS（星基增强系统）</li><li>主要SBAS系统：美国WAAS、欧盟EGNOS、印度GAGAN、中国北斗、日本MSAS</li><li>AGPS（辅助GPS）：全球参考网络（如IGS）收集卫星数据作为辅助数据（Aiding Data）存于服务器，手机经移动网络下载以加快定位</li><li>CP与UP：Control Plane用于手机与基站间控制信息传输；User Plane传输数据包（TCP/IP、HTTP等），获取Aiding Data更具通用性和扩展性</li><li>AGPS运行模式：MSB（终端基定位）——手机下载辅助数据并自行计算位置，适合连续定位；MSA（终端辅助）——手机只传伪距给位置服务器计算后返回，终端要求低但延时大</li><li>Standalone（Autonomous）模式：仅用GPS卫星信号定位；无GPS信号环境可用Cell-ID（蜂窝小区ID）定位</li></ul></li></ul>", "backText": "GPS系统三段组成; GPS空间段; GPS通信频段; GPS信号组成; GPS导航电文; 定位计算相关知识"}, {"id": "c817", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS系统三段组成", "back": "<ul class=\"ans-list\"><li>空间段（SS）：由GPS卫星组成</li><li>控制段（CS）：主控站（位于美国科罗拉多）、数个监控站、地面控制站及地面天线；空间段与控制段可双向通信</li><li>用户段（US）：分民用与军用用户，军用需授权获取更高精度数据；用户段只能从空间段单向获取数据</li><li>GPS提供两类服务：SPS标准定位服务（面向全球民用）与PPS精密定位服务（面向美国及其盟国军事部门）</li></ul>", "backText": "空间段（SS）：由GPS卫星组成; 控制段（CS）：主控站（位于美国科罗拉多）、数个监控站、地面控制站及地面天线；空间段与控制段可双向通信; 用户段（US）：分民用与军用用户，军用需授权获取更高精度数据；用户段只能从空间段单向获取数据; GPS提供两类服务：SPS标准定位服务（面向全球民用）与PPS精密定位服务（面向美国及其盟国军事部门）"}, {"id": "c818", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "空间段（SS）", "back": "<div class=\"def-ans\">由GPS卫星组成</div>", "backText": "由GPS卫星组成"}, {"id": "c819", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "控制段（CS）", "back": "<div class=\"def-ans\">主控站（位于美国科罗拉多）、数个监控站、地面控制站及地面天线；空间段与控制段可双向通信</div>", "backText": "主控站（位于美国科罗拉多）、数个监控站、地面控制站及地面天线；空间段与控制段可双向通信"}, {"id": "c820", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "用户段（US）", "back": "<div class=\"def-ans\">分民用与军用用户，军用需授权获取更高精度数据；用户段只能从空间段单向获取数据</div>", "backText": "分民用与军用用户，军用需授权获取更高精度数据；用户段只能从空间段单向获取数据"}, {"id": "c821", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS提供两类服务", "back": "<div class=\"def-ans\">SPS标准定位服务（面向全球民用）与PPS精密定位服务（面向美国及其盟国军事部门）</div>", "backText": "SPS标准定位服务（面向全球民用）与PPS精密定位服务（面向美国及其盟国军事部门）"}, {"id": "c822", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS空间段", "back": "<ul class=\"ans-list\"><li>由32颗卫星组成，分布在6个轨道面，倾角55度，轨道高度20180km，运行周期约12小时</li><li>设计保证地球任意地点、任意时刻至少被4颗卫星信号覆盖（3颗用于定位，1颗用于解算时钟误差）</li></ul>", "backText": "由32颗卫星组成，分布在6个轨道面，倾角55度，轨道高度20180km，运行周期约12小时; 设计保证地球任意地点、任意时刻至少被4颗卫星信号覆盖（3颗用于定位，1颗用于解算时钟误差）"}, {"id": "c823", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS通信频段", "back": "<ul class=\"ans-list\"><li>使用L频段三个频率：L1（1575.42MHz）、L2（1227.60MHz）、L5（1176.45MHz）</li><li>2005年前：L1传民用心A码与军用P(Y)码，L2仅传P(Y)码</li><li>IIR(M)卫星在L2增加L2C民用信号，可双频联合减少电离层影响提高精度；IIF卫星在L5发播民用信号；III型卫星将支持L1C以增强与其他GNSS的互操作性</li></ul>", "backText": "使用L频段三个频率：L1（1575.42MHz）、L2（1227.60MHz）、L5（1176.45MHz）; 2005年前：L1传民用心A码与军用P(Y)码，L2仅传P(Y)码; IIR(M)卫星在L2增加L2C民用信号，可双频联合减少电离层影响提高精度；IIF卫星在L5发播民用信号；III型卫星将支持L1C以增强与其他GNSS的互操作性"}, {"id": "c824", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "使用L频段三个频率", "back": "<div class=\"def-ans\">L1（1575.42MHz）、L2（1227.60MHz）、L5（1176.45MHz）</div>", "backText": "L1（1575.42MHz）、L2（1227.60MHz）、L5（1176.45MHz）"}, {"id": "c825", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "2005年前", "back": "<div class=\"def-ans\">L1传民用心A码与军用P(Y)码，L2仅传P(Y)码</div>", "backText": "L1传民用心A码与军用P(Y)码，L2仅传P(Y)码"}, {"id": "c826", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS信号组成", "back": "<ul class=\"ans-list\"><li>载波：L1与L2</li><li>测距码：精心设计的伪随机噪声PRN；C/A码——频率1.023MHz、周期1ms、码长1023、码元宽度293.05m、测距精度2~3m；P码——频率10.23MHz、周期7天、码元宽度29.3m、精度0.3m，供军事用途，加密后称Y码</li><li>导航电文（D码）：携带星历、时间等定位所需信息，传输速率50bps</li><li>C/A码仅在L1发送，P码在L1与L2同时发送（双频可消除电离层延时）</li></ul>", "backText": "载波：L1与L2; 测距码：精心设计的伪随机噪声PRN；C/A码——频率1.023MHz、周期1ms、码长1023、码元宽度293.05m、测距精度2~3m；P码——频率10.23MHz、周期7天、码元宽度29.3m、精度0.3m，供军事用途，加密后称Y码; 导航电文（D码）：携带星历、时间等定位所需信息，传输速率50bps; C/A码仅在L1发送，P码在L1与L2同时发送（双频可消除电离层延时）"}, {"id": "c827", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "测距码", "back": "<div class=\"def-ans\">精心设计的伪随机噪声PRN；C/A码——频率1.023MHz、周期1ms、码长1023、码元宽度293.05m、测距精度2~3m；P码——频率10.23MHz、周期7天、码元宽度29.3m、精度0.3m，供军事用途，加密后称Y码</div>", "backText": "精心设计的伪随机噪声PRN；C/A码——频率1.023MHz、周期1ms、码长1023、码元宽度293.05m、测距精度2~3m；P码——频率10.23MHz、周期7天、码元宽度29.3m、精度0.3m，供军事用途，加密后称Y码"}, {"id": "c828", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "导航电文（D码）", "back": "<div class=\"def-ans\">携带星历、时间等定位所需信息，传输速率50bps</div>", "backText": "携带星历、时间等定位所需信息，传输速率50bps"}, {"id": "c829", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS导航电文", "back": "<ul class=\"ans-list\"><li>基本单位为帧（Frame/Page），一帧1500比特、传输需30秒；每帧分5个子帧（各300比特），每子帧10个字码（各30位）</li><li>完整导航电文由25帧组成（37500比特），全部传完需12.5分钟</li><li>子帧1~3内容为发射卫星自身的GPS时间与星历数据；子帧4~5携带各卫星的历书数据</li><li>TLM（遥测字）：前8位为同步用前导码10001011</li><li>HOW（转换字）：前17位为星期时间TOW，第18位警告标志、第19位反欺骗A-S标志、20~22位子帧ID</li></ul>", "backText": "基本单位为帧（Frame/Page），一帧1500比特、传输需30秒；每帧分5个子帧（各300比特），每子帧10个字码（各30位）; 完整导航电文由25帧组成（37500比特），全部传完需12.5分钟; 子帧1~3内容为发射卫星自身的GPS时间与星历数据；子帧4~5携带各卫星的历书数据; TLM（遥测字）：前8位为同步用前导码10001011; HOW（转换字）：前17位为星期时间TOW，第18位警告标志、第19位反欺骗A-S标志、20~22位子帧ID"}, {"id": "c830", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "TLM（遥测字）", "back": "<div class=\"def-ans\">前8位为同步用前导码10001011</div>", "backText": "前8位为同步用前导码10001011"}, {"id": "c831", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "HOW（转换字）", "back": "<div class=\"def-ans\">前17位为星期时间TOW，第18位警告标志、第19位反欺骗A-S标志、20~22位子帧ID</div>", "backText": "前17位为星期时间TOW，第18位警告标志、第19位反欺骗A-S标志、20~22位子帧ID"}, {"id": "c832", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "定位计算相关知识", "back": "<ul class=\"ans-list\"><li>定位原理：接收器钟差统一为一个参数Δt0，测得伪距 PSR = R + Δt0·c</li><li>4颗卫星建立4个方程组成方程组求解（Xuser, Yuser, Zuser, Δt0）；常用泰勒级数线性化+偏微分迭代求解</li><li>测速：基于多普勒效应（相对运动导致收发频率差即多普勒频移）</li><li>误差来源：卫星钟误差（10ns≈3m）、卫星轨道位置（约5m）、电离层/对流层影响光速、接收器时钟不同步、多路径效应（反射信号）</li><li>DOP（精度衰减因子）描述卫星空间分布对精度的影响：GDOP几何、PDOP位置、HDOP水平、VDOP垂直、TDOP时间；卫星间夹角越大误差重合区域越小、DOP越小</li><li>DOP质量分级：1~3非常高、4~5高、6一般、&gt;6差</li><li>TTFF（首次定位时间）：冷启动（无有效星历/时间/位置，至少12.5分钟）；暖启动（有历书≤180天等条件，至少30秒）；热启动（星历/时间/位置有效，10秒内）</li><li>减小TTFF的关键是星历/历书获取瓶颈，由此催生AGPS：通过移动网络（远快于卫星信号速率）下载星历等辅助数据</li></ul>", "backText": "定位原理：接收器钟差统一为一个参数Δt0，测得伪距 PSR = R + Δt0·c; 4颗卫星建立4个方程组成方程组求解（Xuser, Yuser, Zuser, Δt0）；常用泰勒级数线性化+偏微分迭代求解; 测速：基于多普勒效应（相对运动导致收发频率差即多普勒频移）; 误差来源：卫星钟误差（10ns≈3m）、卫星轨道位置（约5m）、电离层/对流层影响光速、接收器时钟不同步、多路径效应（反射信号）; DOP（精度衰减因子）描述卫星空间分布对精度的影响：GDOP几何、PDOP位置、HDOP水平、VDOP垂直、TDOP时间；卫星间夹角越大误差重合区域越小、DOP越小; DOP质量分级：1~3非常高、4~5高、6一般、>6差"}, {"id": "c833", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "定位原理", "back": "<div class=\"def-ans\">接收器钟差统一为一个参数Δt0，测得伪距 PSR = R + Δt0·c</div>", "backText": "接收器钟差统一为一个参数Δt0，测得伪距 PSR = R + Δt0·c"}, {"id": "c834", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "测速", "back": "<div class=\"def-ans\">基于多普勒效应（相对运动导致收发频率差即多普勒频移）</div>", "backText": "基于多普勒效应（相对运动导致收发频率差即多普勒频移）"}, {"id": "c835", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "误差来源", "back": "<div class=\"def-ans\">卫星钟误差（10ns≈3m）、卫星轨道位置（约5m）、电离层/对流层影响光速、接收器时钟不同步、多路径效应（反射信号）</div>", "backText": "卫星钟误差（10ns≈3m）、卫星轨道位置（约5m）、电离层/对流层影响光速、接收器时钟不同步、多路径效应（反射信号）"}, {"id": "c836", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "DOP（精度衰减因子）描述卫星空间分布对精度的影响", "back": "<div class=\"def-ans\">GDOP几何、PDOP位置、HDOP水平、VDOP垂直、TDOP时间；卫星间夹角越大误差重合区域越小、DOP越小</div>", "backText": "GDOP几何、PDOP位置、HDOP水平、VDOP垂直、TDOP时间；卫星间夹角越大误差重合区域越小、DOP越小"}, {"id": "c837", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "DOP质量分级", "back": "<div class=\"def-ans\">1~3非常高、4~5高、6一般、&gt;6差</div>", "backText": "1~3非常高、4~5高、6一般、>6差"}, {"id": "c838", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "TTFF（首次定位时间）", "back": "<div class=\"def-ans\">冷启动（无有效星历/时间/位置，至少12.5分钟）；暖启动（有历书≤180天等条件，至少30秒）；热启动（星历/时间/位置有效，10秒内）</div>", "backText": "冷启动（无有效星历/时间/位置，至少12.5分钟）；暖启动（有历书≤180天等条件，至少30秒）；热启动（星历/时间/位置有效，10秒内）"}, {"id": "c839", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "NMEA-0183和GPX（数据格式）", "back": "<ul class=\"ans-list\"><li>NMEA-0183：美国国家海洋电子协会制定的海用电子设备标准格式，输出ASCII文本（时间、经纬度、高度、卫星数、DOP等）；由类型化语句组成（如$GPGGA）</li><li>GPX：以XML封装GPS数据的交换格式；三个核心概念——Waypoint（wpt路点/兴趣点）、Route（rte路径，有序路点列表）、Track（trk轨迹，记录实际走过并带时间戳的点）</li><li>KML：基于XML的地理信息格式，由谷歌地球等使用，Android DDMS也支持</li></ul>", "backText": "NMEA-0183：美国国家海洋电子协会制定的海用电子设备标准格式，输出ASCII文本（时间、经纬度、高度、卫星数、DOP等）；由类型化语句组成（如$GPGGA）; GPX：以XML封装GPS数据的交换格式；三个核心概念——Waypoint（wpt路点/兴趣点）、Route（rte路径，有序路点列表）、Track（trk轨迹，记录实际走过并带时间戳的点）; KML：基于XML的地理信息格式，由谷歌地球等使用，Android DDMS也支持"}, {"id": "c840", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "NMEA-0183", "back": "<div class=\"def-ans\">美国国家海洋电子协会制定的海用电子设备标准格式，输出ASCII文本（时间、经纬度、高度、卫星数、DOP等）；由类型化语句组成（如$GPGGA）</div>", "backText": "美国国家海洋电子协会制定的海用电子设备标准格式，输出ASCII文本（时间、经纬度、高度、卫星数、DOP等）；由类型化语句组成（如$GPGGA）"}, {"id": "c841", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPX", "back": "<div class=\"def-ans\">以XML封装GPS数据的交换格式；三个核心概念——Waypoint（wpt路点/兴趣点）、Route（rte路径，有序路点列表）、Track（trk轨迹，记录实际走过并带时间戳的点）</div>", "backText": "以XML封装GPS数据的交换格式；三个核心概念——Waypoint（wpt路点/兴趣点）、Route（rte路径，有序路点列表）、Track（trk轨迹，记录实际走过并带时间戳的点）"}, {"id": "c842", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "KML", "back": "<div class=\"def-ans\">基于XML的地理信息格式，由谷歌地球等使用，Android DDMS也支持</div>", "backText": "基于XML的地理信息格式，由谷歌地球等使用，Android DDMS也支持"}, {"id": "c843", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "GPS增强系统", "back": "<ul class=\"ans-list\"><li>DGPS（差分GPS）：在位置精确已知的基站测得伪距误差并作为修正值播发；伪距差分要求距基站200km内，载波相位差分要求20km内</li><li>修正数据格式：RTCM SC104与RTCA DO-229C；修正数据经卫星播发的系统即SBAS（星基增强系统）</li><li>主要SBAS系统：美国WAAS、欧盟EGNOS、印度GAGAN、中国北斗、日本MSAS</li><li>AGPS（辅助GPS）：全球参考网络（如IGS）收集卫星数据作为辅助数据（Aiding Data）存于服务器，手机经移动网络下载以加快定位</li><li>CP与UP：Control Plane用于手机与基站间控制信息传输；User Plane传输数据包（TCP/IP、HTTP等），获取Aiding Data更具通用性和扩展性</li><li>AGPS运行模式：MSB（终端基定位）——手机下载辅助数据并自行计算位置，适合连续定位；MSA（终端辅助）——手机只传伪距给位置服务器计算后返回，终端要求低但延时大</li><li>Standalone（Autonomous）模式：仅用GPS卫星信号定位；无GPS信号环境可用Cell-ID（蜂窝小区ID）定位</li></ul>", "backText": "DGPS（差分GPS）：在位置精确已知的基站测得伪距误差并作为修正值播发；伪距差分要求距基站200km内，载波相位差分要求20km内; 修正数据格式：RTCM SC104与RTCA DO-229C；修正数据经卫星播发的系统即SBAS（星基增强系统）; 主要SBAS系统：美国WAAS、欧盟EGNOS、印度GAGAN、中国北斗、日本MSAS; AGPS（辅助GPS）：全球参考网络（如IGS）收集卫星数据作为辅助数据（Aiding Data）存于服务器，手机经移动网络下载以加快定位; CP与UP：Control Plane用于手机与基站间控制信息传输；User Plane传输数据包（TCP/IP、HTTP等），获取Aiding Data更具通用性和扩展性; AGPS运行模式：MSB（终端基定位）——手机下载辅助数据并自行计算位置，适合连续定位；MSA（终端辅助）——手机只传伪距给位置服务器计算后返回，终端要求低但延时大"}, {"id": "c844", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "DGPS（差分GPS）", "back": "<div class=\"def-ans\">在位置精确已知的基站测得伪距误差并作为修正值播发；伪距差分要求距基站200km内，载波相位差分要求20km内</div>", "backText": "在位置精确已知的基站测得伪距误差并作为修正值播发；伪距差分要求距基站200km内，载波相位差分要求20km内"}, {"id": "c845", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "修正数据格式", "back": "<div class=\"def-ans\">RTCM SC104与RTCA DO-229C；修正数据经卫星播发的系统即SBAS（星基增强系统）</div>", "backText": "RTCM SC104与RTCA DO-229C；修正数据经卫星播发的系统即SBAS（星基增强系统）"}, {"id": "c846", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "主要SBAS系统", "back": "<div class=\"def-ans\">美国WAAS、欧盟EGNOS、印度GAGAN、中国北斗、日本MSAS</div>", "backText": "美国WAAS、欧盟EGNOS、印度GAGAN、中国北斗、日本MSAS"}, {"id": "c847", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "AGPS（辅助GPS）", "back": "<div class=\"def-ans\">全球参考网络（如IGS）收集卫星数据作为辅助数据（Aiding Data）存于服务器，手机经移动网络下载以加快定位</div>", "backText": "全球参考网络（如IGS）收集卫星数据作为辅助数据（Aiding Data）存于服务器，手机经移动网络下载以加快定位"}, {"id": "c848", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "CP与UP", "back": "<div class=\"def-ans\">Control Plane用于手机与基站间控制信息传输；User Plane传输数据包（TCP/IP、HTTP等），获取Aiding Data更具通用性和扩展性</div>", "backText": "Control Plane用于手机与基站间控制信息传输；User Plane传输数据包（TCP/IP、HTTP等），获取Aiding Data更具通用性和扩展性"}, {"id": "c849", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "AGPS运行模式", "back": "<div class=\"def-ans\">MSB（终端基定位）——手机下载辅助数据并自行计算位置，适合连续定位；MSA（终端辅助）——手机只传伪距给位置服务器计算后返回，终端要求低但延时大</div>", "backText": "MSB（终端基定位）——手机下载辅助数据并自行计算位置，适合连续定位；MSA（终端辅助）——手机只传伪距给位置服务器计算后返回，终端要求低但延时大"}, {"id": "c850", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "Standalone（Autonomous）模式", "back": "<div class=\"def-ans\">仅用GPS卫星信号定位；无GPS信号环境可用Cell-ID（蜂窝小区ID）定位</div>", "backText": "仅用GPS卫星信号定位；无GPS信号环境可用Cell-ID（蜂窝小区ID）定位"}, {"id": "c851", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "9.2.3 OMA-SUPL协议", "back": "<ul class=\"ans-list\"><li>概述：OMA-SUPL（Secure User Plane Location）是OMA制定的一整套AGPS服务与标准，最新版本3.0（仅支持代理模式）</li><li>相关协议缩写：RRLP（无线资源LCS协议）、RRC、LPP（LTE定位协议）、LPPe（LPP扩展）、OTDOA（观察到达时间差定位技术）</li><li>SUPL架构<ul class=\"sub\"><li>SET（SUPL Enabled Terminal）：AGPS服务客户端，如Android手机</li><li>SLP（SUPL Location Platform）：含SLC（SUPL Location Center，与SET交互处理请求）和SPC（SUPL Positioning Center，定位计算）；SET直连SPC为非代理模式，经SLC交互为代理模式</li><li>SUPL Agent：需要位置信息的应用，可位于SET或SUPL Network中；定位请求只能由它发起——SET中为SET Initiated，网络中为Network Initiated</li><li>Network Initiated时SLP需通过SUPL INIT通知SET参与定位，支持SIP、WAP、SMS、UDP/TCP等方式；SLC与SPC间协议为ILP</li></ul></li><li>ULP协议（User Location Protocol，描述SET与SLP交互）<ul class=\"sub\"><li>SET Initiated流程：①SET与SLP建立基于TLS的数据链接；②SET发SUPL START（携带locationId——基站Cell Info或Wi-Fi AP信息，及sETCapabilities能力）；③SLP回SUPL RESPONSE（posMethod定位方法与sLPCapabilities）；④SET发SUPL POS INIT（含初始位置）；⑤通过一个或多个SUPL POS消息计算位置（MSB/MSA方式不同）；⑥SLP发SUPL END并断开TLS链接</li><li>Network Initiated流程：SUPL Agent与SLP间用MLP（Mobile Location Protocol）；SLP收到SLIR请求后向SET发SUPL INIT（无链接时经OMA Push或数据短信发送），最终经SLIA将定位结果返回Agent</li></ul></li><li>意义：本节内容可覆盖Android GPS相关模块（不含驱动及芯片底层）代码约80%的背景知识</li></ul>", "backText": "概述：OMA-SUPL（Secure User Plane Location）是OMA制定的一整套AGPS服务与标准，最新版本3.0（仅支持代理模式）; 相关协议缩写：RRLP（无线资源LCS协议）、RRC、LPP（LTE定位协议）、LPPe（LPP扩展）、OTDOA（观察到达时间差定位技术）; SUPL架构; ULP协议（User Location Protocol，描述SET与SLP交互）; 意义：本节内容可覆盖Android GPS相关模块（不含驱动及芯片底层）代码约80%的背景知识"}, {"id": "c852", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "概述", "back": "<div class=\"def-ans\">OMA-SUPL（Secure User Plane Location）是OMA制定的一整套AGPS服务与标准，最新版本3.0（仅支持代理模式）</div>", "backText": "OMA-SUPL（Secure User Plane Location）是OMA制定的一整套AGPS服务与标准，最新版本3.0（仅支持代理模式）"}, {"id": "c853", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section PS基础知识", "front": "Network Initiated流程", "back": "<div class=\"def-ans\">SUPL Agent与SLP间用MLP（Mobile Location Protocol）；SLP收到SLIR请求后向SET发SUPL INIT（无链接时经OMA Push或数据短信发送），最终经SLIA将定位结果返回Agent</div>", "backText": "SUPL Agent与SLP间用MLP（Mobile Location Protocol）；SLP收到SLIR请求后向SET发SUPL INIT（无链接时经OMA Push或数据短信发送），最终经SLIA将定位结果返回Agent"}, {"id": "c861", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.2 GPS基础知识", "front": "意义", "back": "<div class=\"def-ans\">本节内容可覆盖Android GPS相关模块（不含驱动及芯片底层）代码约80%的背景知识</div>", "backText": "本节内容可覆盖Android GPS相关模块（不含驱动及芯片底层）代码约80%的背景知识"}, {"id": "c862", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "9.3.1 LocationManager架构", "back": "<ul class=\"ans-list\"><li>核心为LocationManagerService（LMS），由SystemServer创建并运行于system_process进程；客户端为LocationManager（LM），二者通过Binder交互</li><li>位置提供者（Location Provider，LP）必须实现LocationProviderInterface接口，实例由LMS创建和管理</li><li>Framework直接实现两个LP：PassiveProvider（被动式，自身不产生位置更新，由其他LP更新触发）与GpsLocationProvider（系统GPS提供者），均运行在system_process进程</li><li>网络定位（Network Location）原理：事先获知基站/AP位置并存于服务商服务器，手机查询所连基站或AP位置并按信号强度推算位置；速度快、耗电少、室内外可用但精度低于GPS；Android原生不提供，由第三方提供（Google GMS的NetworkLocation.apk、国内的NetworkLocation_Baidu.apk）</li><li>应用进程LP通过ILocationProviderProxy接口由LMS管理，需实现LocationProviderBase抽象类</li><li>FusedLocationProvider（融合定位）：自身不产生位置，综合GpsLP与NetworkLP，按功耗与精度需求选择/返回最优结果</li><li>Geocoder：位置信息与地址信息相互转换，由第三方应用实现IGeocodeProvider接口</li></ul>", "backText": "核心为LocationManagerService（LMS），由SystemServer创建并运行于system_process进程；客户端为LocationManager（LM），二者通过Binder交互; 位置提供者（Location Provider，LP）必须实现LocationProviderInterface接口，实例由LMS创建和管理; Framework直接实现两个LP：PassiveProvider（被动式，自身不产生位置更新，由其他LP更新触发）与GpsLocationProvider（系统GPS提供者），均运行在system_process进程; 网络定位（Network Location）原理：事先获知基站/AP位置并存于服务商服务器，手机查询所连基站或AP位置并按信号强度推算位置；速度快、耗电少、室内外可用但精度低于GPS；Android原生不提供，由第三方提供（Google GMS的NetworkLocation.apk、国内的NetworkLocation_Baidu.apk）; 应用进程LP通过ILocationProviderProxy接口由LMS管理，需实现LocationProviderBase抽象类; FusedLocationProvider（融合定位）：自身不产生位置，综合GpsLP与NetworkLP，按功耗与精度需求选择/返回最优结果"}, {"id": "c863", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "Framework直接实现两个LP", "back": "<div class=\"def-ans\">PassiveProvider（被动式，自身不产生位置更新，由其他LP更新触发）与GpsLocationProvider（系统GPS提供者），均运行在system_process进程</div>", "backText": "PassiveProvider（被动式，自身不产生位置更新，由其他LP更新触发）与GpsLocationProvider（系统GPS提供者），均运行在system_process进程"}, {"id": "c864", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "网络定位（Network Location）原理", "back": "<div class=\"def-ans\">事先获知基站/AP位置并存于服务商服务器，手机查询所连基站或AP位置并按信号强度推算位置；速度快、耗电少、室内外可用但精度低于GPS；Android原生不提供，由第三方提供（Google GMS的NetworkLocation.apk、国内的NetworkLocation_Baidu.apk）</div>", "backText": "事先获知基站/AP位置并存于服务商服务器，手机查询所连基站或AP位置并按信号强度推算位置；速度快、耗电少、室内外可用但精度低于GPS；Android原生不提供，由第三方提供（Google GMS的NetworkLocation.apk、国内的NetworkLocation_Baidu.apk）"}, {"id": "c865", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "FusedLocationProvider（融合定位）", "back": "<div class=\"def-ans\">自身不产生位置，综合GpsLP与NetworkLP，按功耗与精度需求选择/返回最优结果</div>", "backText": "自身不产生位置，综合GpsLP与NetworkLP，按功耗与精度需求选择/返回最优结果"}, {"id": "c866", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "Geocoder", "back": "<div class=\"def-ans\">位置信息与地址信息相互转换，由第三方应用实现IGeocodeProvider接口</div>", "backText": "位置信息与地址信息相互转换，由第三方应用实现IGeocodeProvider接口"}, {"id": "c867", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "9.3.2 LocationManager应用示例", "back": "<ul class=\"ans-list\"><li>示例（LocationActivity.java）支持\"GpsLP单独定位\"与\"GpsLP+NetworkLP同时定位\"，显示经纬度与地址</li><li>使用步骤：①getSystemService(Context.LOCATION_SERVICE)获取LocationManager；②requestLocationUpdates(provider, 最小时间间隔, 最小距离变化, listener)注册回调，provider取值\"gps\"/\"network\"/\"passive\"；③位置更新时LocationListener.onLocationChanged被回调；④getLastKnownLocation获取上次保存的位置</li><li>Geocoder自Android 2.3起支持；getFromLocation(纬度, 经度, N)根据位置查地址，因需网络查询通常放在AsyncTask中执行</li><li>LM只提供基础定位功能；地图等高级位置功能需使用Google Play Services的Location API</li><li>注意：有些应用只传定位条件（精度）而不指定LP；不带GPS的平台若指定从GPS取数据将得不到位置信息</li></ul>", "backText": "示例（LocationActivity.java）支持\"GpsLP单独定位\"与\"GpsLP+NetworkLP同时定位\"，显示经纬度与地址; 使用步骤：①getSystemService(Context.LOCATION_SERVICE)获取LocationManager；②requestLocationUpdates(provider, 最小时间间隔, 最小距离变化, listener)注册回调，provider取值\"gps\"/\"network\"/\"passive\"；③位置更新时LocationListener.onLocationChanged被回调；④getLastKnownLocation获取上次保存的位置; Geocoder自Android 2.3起支持；getFromLocation(纬度, 经度, N)根据位置查地址，因需网络查询通常放在AsyncTask中执行; LM只提供基础定位功能；地图等高级位置功能需使用Google Play Services的Location API; 注意：有些应用只传定位条件（精度）而不指定LP；不带GPS的平台若指定从GPS取数据将得不到位置信息"}, {"id": "c868", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "使用步骤", "back": "<div class=\"def-ans\">①getSystemService(Context.LOCATION_SERVICE)获取LocationManager；②requestLocationUpdates(provider, 最小时间间隔, 最小距离变化, listener)注册回调，provider取值\"gps\"/\"network\"/\"passive\"；③位置更新时LocationListener.onLocationChanged被回调；④getLastKnownLocation获取上次保存的位置</div>", "backText": "①getSystemService(Context.LOCATION_SERVICE)获取LocationManager；②requestLocationUpdates(provider, 最小时间间隔, 最小距离变化, listener)注册回调，provider取值\"gps\"/\"network\"/\"passive\"；③位置更新时LocationListener.onLocationChanged被回调；④getLastKnownLocation获取上次保存的位置"}, {"id": "c869", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "注意", "back": "<div class=\"def-ans\">有些应用只传定位条件（精度）而不指定LP；不带GPS的平台若指定从GPS取数据将得不到位置信息</div>", "backText": "有些应用只传定位条件（精度）而不指定LP；不带GPS的平台若指定从GPS取数据将得不到位置信息"}, {"id": "c870", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "9.3.3 LocationManager系统模块", "back": "<ul class=\"ans-list\"><li>LMS初始化<ul class=\"sub\"><li>systemReady创建工作线程（后台优先级），LocationWorkerHandler负责将LP位置信息返回客户端</li><li>init()：创建LocationBlacklist（按Java包名禁止某些LP的黑白名单）、LocationFudger（由细精度位置经数学模糊生成粗精度位置，默认最大2000m/最小200m）、GeofenceManager（地理围栏：客户端设定圆心与半径，进入/离开时回调通知；Android 4.2 SDK未公开API），监听APK安装/卸载与用户切换，最后updateProvidersLocked</li><li>loadProvidersLocked：先创建PassiveProvider（永远启用；被TwilightService用于判断白天/黑夜），再在isSupported时创建GpsLocationProvider</li><li>第三方LP包名由config_locationProviderPackageNames指定（原生仅\"com.android.location.fused\"）；LMS会检查第三方LP的签名与版本（数据一致性保护）</li><li>通过LocationProviderProxy.createAndBind加载NetworkLP与FusedLP，并创建GeocoderProxy</li></ul></li><li>LocationProviderProxy（LPProxy）与ServiceWatcher<ul class=\"sub\"><li>LPProxy核心为ServiceWatcher：连接并监视应用进程中的LP服务</li><li>start→bindBestPackageLocked：检查目标应用签名、按action查找Service、绑定并获取ILocationProvider接口实例</li><li>onServiceConnected后调用service.getProperties()获取ProviderProperties（requiresNetwork/requiresSatellite/hasMonetaryCost/supportsAltitude/powerRequirement/accuracy等属性），并按需enable、setRequest</li></ul></li><li>GpsLocationProvider（GpsLP）初始化<ul class=\"sub\"><li>static代码块调用class_init_native()初始化JNI</li><li>创建NtpTrustedTime：用SNTP与NTP服务器同步获取UTC时间；服务器默认\"2.android.pool.ntp.org\"</li><li>创建GpsNetInitiatedHandler处理来自HAL的NI（Network Initiated）事件；解析配置文件/etc/gps.conf：NTP_SERVER、XTRA_SERVER_1~3（LTO=Long Term Orbits，类似离线地图的星历数据，有效期约4天）、SUPL_HOST=supl.google.com、SUPL_PORT=7276、C2K_HOST/C2K_PORT</li><li>listenForBroadcasts：注册三类接收——发往localhost:7275的数据短信（7275为OMA-SUPL端口，SUPL INIT可由数据短信触发）、WAP推送短信（MIME类型application/vnd.omaloc-supl-init）、ALARM_WAKEUP/ALARM_TIMEOUT与CONNECTIVITY_ACTION</li><li>checkSmsSuplInit/checkWapSuplInit将短信内容经native_agps_ni_message传给GPS HAL层</li><li>构造中还通过PASSIVE_PROVIDER注册NetworkLocationListener，将NetworkLP位置经native_inject_location注入GPS HAL</li></ul></li><li>GPS启动流程（Java层）<ul class=\"sub\"><li>设置界面三选项：使用无线网络（NETWORK_PROVIDER）、使用GPS卫星（GPS_PROVIDER）、使用辅助性GPS（写Settings.Global.ASSISTED_GPS_ENABLED）；均修改settings数据库location_providers_allowed字段</li><li>LMS通过ContentObserver监听该字段变化→updateProvidersLocked调用LP的enable/disable，并回调客户端LocationListener的onProviderEnabled/onProviderDisabled</li><li>GpsLP的handleEnable：native_init()初始化HAL模块→native_supports_xtra()判断Xtra支持→native_set_agps_server设置SUPL/C2K服务器地址与端口</li><li>HAL通过JNI回调setEngineCapabilities上报引擎能力：GPS_CAPABILITY_SCHEDULING（支持工作周期内定时通知位置=连续定位）、GPS_CAPABILITY_MSB/MSA（支持MSB/MSA模式AGPS）、GPS_CAPABILITY_SINGLE_SHOT（单次定位）、GPS_CAPABILITY_ON_DEMAND_TIME</li></ul></li><li>GPS导航流程<ul class=\"sub\"><li>客户端requestLocationUpdates后GpsLP.setRequest被调；handleSetRequest记录mFixInterval，支持SCHEDULING则native_set_position_mode设为PERIODIC并传间隔，未启动则startNavigating</li><li>startNavigating：默认GPS_POSITION_MODE_STANDALONE；若ASSISTED_GPS_ENABLED开启且支持MSB则设为GPS_POSITION_MODE_MS_BASED；不支持SCHEDULING且间隔≥60秒时设置超时停止导航</li><li>不支持SCHEDULING的模块由两个Alarm模拟：ALARM_TIMEOUT停止导航、ALARM_WAKEUP重启导航（hibernate休眠机制）</li><li>reportLocation（JNI回调）：按flags（LOCATION_HAS_LAT_LONG/ALTITUDE/SPEED/BEARING/ACCURACY）填充Location对象，经mILocationManager.reportLocation交给LMS通知客户端；首次收到经纬度时计算TTFF并回调GpsStatusListener.onFirstFix</li><li>reportStatus：处理GPS_STATUS_SESSION_BEGIN/END（导航开始结束）、ENGINE_ON/OFF，更新mNavigating/mEngineOn，并发GPS_ENABLED_CHANGE广播</li><li>reportSvStatus：native_read_sv_status读取卫星信息（最多32颗）——mSvs编号、mSnrs信噪比、mSvElevations高度角、mSvAzimuths方位角、mSvMasks三个32位掩码（EPHEMERIS_MASK是否取得星历、ALMANAC_MASK是否取得历书、USED_FOR_FIX_MASK是否参与上次定位）；可实现类似GpsTestPlus的卫星显示应用</li></ul></li><li>AGPS工作流程（GpsLP中）<ul class=\"sub\"><li>网络事件处理：GpsLP监听Sticky广播CONNECTIVITY_ACTION→updateNetworkState→handleUpdateNetworkState：将网络状态经native_update_network_state传给HAL；若TYPE_MOBILE_SUPL且连接状态为OPENING则获取APN、requestRouteToHost路由SUPL数据、native_agps_data_conn_open打开数据通道；网络可用时触发INJECT_NTP_TIME与DOWNLOAD_XTRA_DATA</li><li>reportAGpsStatus（HAL→GpsLP）：GPS_REQUEST_AGPS_DATA_CONN时置状态OPENING，经ConnectivityManager.startUsingNetworkFeature申请移动数据；另有GPS_RELEASE_AGPS_DATA_CONN、GPS_AGPS_DATA_CONNECTED/CONN_DONE/CONN_FAILED等状态</li><li>Xtra数据下载：handleDownloadXtraData用GpsXtraDownloader在后台线程下载LTO数据，成功后native_inject_xtra_data注入HAL；期间持有WakeLock</li><li>总结：GpsLP监控网络事件+接收HAL的AGPS状态通知即可完成AGPS流程</li></ul></li><li>GPS JNI与HAL层<ul class=\"sub\"><li>分层架构：Java层GpsLocationProvider.java→JNI层libandroid_server.so中com_android_server_location_GpsLocationProvider.cpp→HAL层动态库gps.xxx.so（接口定义在gps.h）→内核层GPS驱动</li><li>各大厂商均未公开GPS HAL实现；高通QRD的GPS HAL为C/S架构，仅把上层请求转成QMI（QC MSM Interface）消息发给服务处理</li><li>JNI初始化（class_init_native）：获取Java层回调MethodId；hw_get_module(GPS_HARDWARE_MODULE_ID=\"gps\")加载HAL模块并open，取gps_device_t的get_gps_interface获得核心接口GpsInterface；再经get_extension获取扩展接口：GpsXtraInterface、AGpsInterface、GpsNiInterface、GpsDebugInterface、AGpsRilInterface</li><li>Java层native函数（Java→JNI→HAL）：class_init_native、native_init、native_cleanup、native_set_position_mode（mode取STANDALONE=0/MS_BASED=1/MS_ASSISTED=2；recurrence取PERIODIC=0/SINGLE=1）、native_start/stop、native_delete_aiding_data、native_read_sv_status、native_read_nmea、native_inject_location、native_inject_time、native_inject_xtra_data、native_agps_data_conn_open/closed/failed、native_agps_ni_message、native_set_agps_server（AGPS_TYPE_SUPL=1/AGPS_TYPE_C2K=2）、native_send_ni_response、native_agps_set_ref_location_cellid（mcc移动国家码——中国460、mnc移动网络码、lac位置区码、cid基站编号）、native_agps_set_id、native_update_network_state</li><li>JNI回调Java层函数（HAL→JNI→Java）：reportLocation、reportStatus、reportSvStatus、reportAGpsStatus、reportNmea、setEngineCapabilities、xtraDownloadRequest、reportNiNotification、requestRefLocation、requestSetID、requestUtcTime</li><li>gps.h中HAL接口：GpsInterface（init/start/stop/cleanup/inject_time/inject_location/delete_aiding_data/set_position_mode/get_extension）；GpsXtraInterface（init/inject_xtra_data）；AGpsInterface（init/data_conn_open(apn)/data_conn_closed/data_conn_failed/set_server）；GpsNiInterface（init/respond）；AGpsRilInterface</li></ul></li><li>本章代码评价与延伸<ul class=\"sub\"><li>与WifiService/WifiP2pService/NfcService相比LMS不复杂：服务本身简单；GpsLP分层接口设计合理，使HAL层以上代码不受底层硬件影响</li><li>建议进一步学习：PassiveProvider与FusedLocationProvider、LocationFudger（位置模糊）、GeofenceManager；可反编译NetworkLocation.apk研究NetworkLP与Geocoder实现</li></ul></li></ul>", "backText": "LMS初始化; LocationProviderProxy（LPProxy）与ServiceWatcher; GpsLocationProvider（GpsLP）初始化; GPS启动流程（Java层）; GPS导航流程; AGPS工作流程（GpsLP中）"}, {"id": "c871", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "LMS初始化", "back": "<ul class=\"ans-list\"><li>systemReady创建工作线程（后台优先级），LocationWorkerHandler负责将LP位置信息返回客户端</li><li>init()：创建LocationBlacklist（按Java包名禁止某些LP的黑白名单）、LocationFudger（由细精度位置经数学模糊生成粗精度位置，默认最大2000m/最小200m）、GeofenceManager（地理围栏：客户端设定圆心与半径，进入/离开时回调通知；Android 4.2 SDK未公开API），监听APK安装/卸载与用户切换，最后updateProvidersLocked</li><li>loadProvidersLocked：先创建PassiveProvider（永远启用；被TwilightService用于判断白天/黑夜），再在isSupported时创建GpsLocationProvider</li><li>第三方LP包名由config_locationProviderPackageNames指定（原生仅\"com.android.location.fused\"）；LMS会检查第三方LP的签名与版本（数据一致性保护）</li><li>通过LocationProviderProxy.createAndBind加载NetworkLP与FusedLP，并创建GeocoderProxy</li></ul>", "backText": "systemReady创建工作线程（后台优先级），LocationWorkerHandler负责将LP位置信息返回客户端; init()：创建LocationBlacklist（按Java包名禁止某些LP的黑白名单）、LocationFudger（由细精度位置经数学模糊生成粗精度位置，默认最大2000m/最小200m）、GeofenceManager（地理围栏：客户端设定圆心与半径，进入/离开时回调通知；Android 4.2 SDK未公开API），监听APK安装/卸载与用户切换，最后updateProvidersLocked; loadProvidersLocked：先创建PassiveProvider（永远启用；被TwilightService用于判断白天/黑夜），再在isSupported时创建GpsLocationProvider; 第三方LP包名由config_locationProviderPackageNames指定（原生仅\"com.android.location.fused\"）；LMS会检查第三方LP的签名与版本（数据一致性保护）; 通过LocationProviderProxy.createAndBind加载NetworkLP与FusedLP，并创建GeocoderProxy"}, {"id": "c872", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "init()", "back": "<div class=\"def-ans\">创建LocationBlacklist（按Java包名禁止某些LP的黑白名单）、LocationFudger（由细精度位置经数学模糊生成粗精度位置，默认最大2000m/最小200m）、GeofenceManager（地理围栏：客户端设定圆心与半径，进入/离开时回调通知；Android 4.2 SDK未公开API），监听APK安装/卸载与用户切换，最后updateProvidersLocked</div>", "backText": "创建LocationBlacklist（按Java包名禁止某些LP的黑白名单）、LocationFudger（由细精度位置经数学模糊生成粗精度位置，默认最大2000m/最小200m）、GeofenceManager（地理围栏：客户端设定圆心与半径，进入/离开时回调通知；Android 4.2 SDK未公开API），监听APK安装/卸载与用户切换，最后updateProvidersLocked"}, {"id": "c873", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "loadProvidersLocked", "back": "<div class=\"def-ans\">先创建PassiveProvider（永远启用；被TwilightService用于判断白天/黑夜），再在isSupported时创建GpsLocationProvider</div>", "backText": "先创建PassiveProvider（永远启用；被TwilightService用于判断白天/黑夜），再在isSupported时创建GpsLocationProvider"}, {"id": "c874", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "LocationProviderProxy（LPProxy）与ServiceWatcher", "back": "<ul class=\"ans-list\"><li>LPProxy核心为ServiceWatcher：连接并监视应用进程中的LP服务</li><li>start→bindBestPackageLocked：检查目标应用签名、按action查找Service、绑定并获取ILocationProvider接口实例</li><li>onServiceConnected后调用service.getProperties()获取ProviderProperties（requiresNetwork/requiresSatellite/hasMonetaryCost/supportsAltitude/powerRequirement/accuracy等属性），并按需enable、setRequest</li></ul>", "backText": "LPProxy核心为ServiceWatcher：连接并监视应用进程中的LP服务; start→bindBestPackageLocked：检查目标应用签名、按action查找Service、绑定并获取ILocationProvider接口实例; onServiceConnected后调用service.getProperties()获取ProviderProperties（requiresNetwork/requiresSatellite/hasMonetaryCost/supportsAltitude/powerRequirement/accuracy等属性），并按需enable、setRequest"}, {"id": "c875", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "LPProxy核心为ServiceWatcher", "back": "<div class=\"def-ans\">连接并监视应用进程中的LP服务</div>", "backText": "连接并监视应用进程中的LP服务"}, {"id": "c876", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "start→bindBestPackageLocked", "back": "<div class=\"def-ans\">检查目标应用签名、按action查找Service、绑定并获取ILocationProvider接口实例</div>", "backText": "检查目标应用签名、按action查找Service、绑定并获取ILocationProvider接口实例"}, {"id": "c877", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "GpsLocationProvider（GpsLP）初始化", "back": "<ul class=\"ans-list\"><li>static代码块调用class_init_native()初始化JNI</li><li>创建NtpTrustedTime：用SNTP与NTP服务器同步获取UTC时间；服务器默认\"2.android.pool.ntp.org\"</li><li>创建GpsNetInitiatedHandler处理来自HAL的NI（Network Initiated）事件；解析配置文件/etc/gps.conf：NTP_SERVER、XTRA_SERVER_1~3（LTO=Long Term Orbits，类似离线地图的星历数据，有效期约4天）、SUPL_HOST=supl.google.com、SUPL_PORT=7276、C2K_HOST/C2K_PORT</li><li>listenForBroadcasts：注册三类接收——发往localhost:7275的数据短信（7275为OMA-SUPL端口，SUPL INIT可由数据短信触发）、WAP推送短信（MIME类型application/vnd.omaloc-supl-init）、ALARM_WAKEUP/ALARM_TIMEOUT与CONNECTIVITY_ACTION</li><li>checkSmsSuplInit/checkWapSuplInit将短信内容经native_agps_ni_message传给GPS HAL层</li><li>构造中还通过PASSIVE_PROVIDER注册NetworkLocationListener，将NetworkLP位置经native_inject_location注入GPS HAL</li></ul>", "backText": "static代码块调用class_init_native()初始化JNI; 创建NtpTrustedTime：用SNTP与NTP服务器同步获取UTC时间；服务器默认\"2.android.pool.ntp.org\"; 创建GpsNetInitiatedHandler处理来自HAL的NI（Network Initiated）事件；解析配置文件/etc/gps.conf：NTP_SERVER、XTRA_SERVER_1~3（LTO=Long Term Orbits，类似离线地图的星历数据，有效期约4天）、SUPL_HOST=supl.google.com、SUPL_PORT=7276、C2K_HOST/C2K_PORT; listenForBroadcasts：注册三类接收——发往localhost:7275的数据短信（7275为OMA-SUPL端口，SUPL INIT可由数据短信触发）、WAP推送短信（MIME类型application/vnd.omaloc-supl-init）、ALARM_WAKEUP/ALARM_TIMEOUT与CONNECTIVITY_ACTION; checkSmsSuplInit/checkWapSuplInit将短信内容经native_agps_ni_message传给GPS HAL层; 构造中还通过PASSIVE_PROVIDER注册NetworkLocationListener，将NetworkLP位置经native_inject_location注入GPS HAL"}, {"id": "c878", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "创建NtpTrustedTime", "back": "<div class=\"def-ans\">用SNTP与NTP服务器同步获取UTC时间；服务器默认\"2.android.pool.ntp.org\"</div>", "backText": "用SNTP与NTP服务器同步获取UTC时间；服务器默认\"2.android.pool.ntp.org\""}, {"id": "c879", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "listenForBroadcasts", "back": "<div class=\"def-ans\">注册三类接收——发往localhost:7275的数据短信（7275为OMA-SUPL端口，SUPL INIT可由数据短信触发）、WAP推送短信（MIME类型application/vnd.omaloc-supl-init）、ALARM_WAKEUP/ALARM_TIMEOUT与CONNECTIVITY_ACTION</div>", "backText": "注册三类接收——发往localhost:7275的数据短信（7275为OMA-SUPL端口，SUPL INIT可由数据短信触发）、WAP推送短信（MIME类型application/vnd.omaloc-supl-init）、ALARM_WAKEUP/ALARM_TIMEOUT与CONNECTIVITY_ACTION"}, {"id": "c880", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "GPS启动流程（Java层）", "back": "<ul class=\"ans-list\"><li>设置界面三选项：使用无线网络（NETWORK_PROVIDER）、使用GPS卫星（GPS_PROVIDER）、使用辅助性GPS（写Settings.Global.ASSISTED_GPS_ENABLED）；均修改settings数据库location_providers_allowed字段</li><li>LMS通过ContentObserver监听该字段变化→updateProvidersLocked调用LP的enable/disable，并回调客户端LocationListener的onProviderEnabled/onProviderDisabled</li><li>GpsLP的handleEnable：native_init()初始化HAL模块→native_supports_xtra()判断Xtra支持→native_set_agps_server设置SUPL/C2K服务器地址与端口</li><li>HAL通过JNI回调setEngineCapabilities上报引擎能力：GPS_CAPABILITY_SCHEDULING（支持工作周期内定时通知位置=连续定位）、GPS_CAPABILITY_MSB/MSA（支持MSB/MSA模式AGPS）、GPS_CAPABILITY_SINGLE_SHOT（单次定位）、GPS_CAPABILITY_ON_DEMAND_TIME</li></ul>", "backText": "设置界面三选项：使用无线网络（NETWORK_PROVIDER）、使用GPS卫星（GPS_PROVIDER）、使用辅助性GPS（写Settings.Global.ASSISTED_GPS_ENABLED）；均修改settings数据库location_providers_allowed字段; LMS通过ContentObserver监听该字段变化→updateProvidersLocked调用LP的enable/disable，并回调客户端LocationListener的onProviderEnabled/onProviderDisabled; GpsLP的handleEnable：native_init()初始化HAL模块→native_supports_xtra()判断Xtra支持→native_set_agps_server设置SUPL/C2K服务器地址与端口; HAL通过JNI回调setEngineCapabilities上报引擎能力：GPS_CAPABILITY_SCHEDULING（支持工作周期内定时通知位置=连续定位）、GPS_CAPABILITY_MSB/MSA（支持MSB/MSA模式AGPS）、GPS_CAPABILITY_SINGLE_SHOT（单次定位）、GPS_CAPABILITY_ON_DEMAND_TIME"}, {"id": "c881", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "设置界面三选项", "back": "<div class=\"def-ans\">使用无线网络（NETWORK_PROVIDER）、使用GPS卫星（GPS_PROVIDER）、使用辅助性GPS（写Settings.Global.ASSISTED_GPS_ENABLED）；均修改settings数据库location_providers_allowed字段</div>", "backText": "使用无线网络（NETWORK_PROVIDER）、使用GPS卫星（GPS_PROVIDER）、使用辅助性GPS（写Settings.Global.ASSISTED_GPS_ENABLED）；均修改settings数据库location_providers_allowed字段"}, {"id": "c882", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "GpsLP的handleEnable", "back": "<div class=\"def-ans\">native_init()初始化HAL模块→native_supports_xtra()判断Xtra支持→native_set_agps_server设置SUPL/C2K服务器地址与端口</div>", "backText": "native_init()初始化HAL模块→native_supports_xtra()判断Xtra支持→native_set_agps_server设置SUPL/C2K服务器地址与端口"}, {"id": "c883", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "GPS导航流程", "back": "<ul class=\"ans-list\"><li>客户端requestLocationUpdates后GpsLP.setRequest被调；handleSetRequest记录mFixInterval，支持SCHEDULING则native_set_position_mode设为PERIODIC并传间隔，未启动则startNavigating</li><li>startNavigating：默认GPS_POSITION_MODE_STANDALONE；若ASSISTED_GPS_ENABLED开启且支持MSB则设为GPS_POSITION_MODE_MS_BASED；不支持SCHEDULING且间隔≥60秒时设置超时停止导航</li><li>不支持SCHEDULING的模块由两个Alarm模拟：ALARM_TIMEOUT停止导航、ALARM_WAKEUP重启导航（hibernate休眠机制）</li><li>reportLocation（JNI回调）：按flags（LOCATION_HAS_LAT_LONG/ALTITUDE/SPEED/BEARING/ACCURACY）填充Location对象，经mILocationManager.reportLocation交给LMS通知客户端；首次收到经纬度时计算TTFF并回调GpsStatusListener.onFirstFix</li><li>reportStatus：处理GPS_STATUS_SESSION_BEGIN/END（导航开始结束）、ENGINE_ON/OFF，更新mNavigating/mEngineOn，并发GPS_ENABLED_CHANGE广播</li><li>reportSvStatus：native_read_sv_status读取卫星信息（最多32颗）——mSvs编号、mSnrs信噪比、mSvElevations高度角、mSvAzimuths方位角、mSvMasks三个32位掩码（EPHEMERIS_MASK是否取得星历、ALMANAC_MASK是否取得历书、USED_FOR_FIX_MASK是否参与上次定位）；可实现类似GpsTestPlus的卫星显示应用</li></ul>", "backText": "客户端requestLocationUpdates后GpsLP.setRequest被调；handleSetRequest记录mFixInterval，支持SCHEDULING则native_set_position_mode设为PERIODIC并传间隔，未启动则startNavigating; startNavigating：默认GPS_POSITION_MODE_STANDALONE；若ASSISTED_GPS_ENABLED开启且支持MSB则设为GPS_POSITION_MODE_MS_BASED；不支持SCHEDULING且间隔≥60秒时设置超时停止导航; 不支持SCHEDULING的模块由两个Alarm模拟：ALARM_TIMEOUT停止导航、ALARM_WAKEUP重启导航（hibernate休眠机制）; reportLocation（JNI回调）：按flags（LOCATION_HAS_LAT_LONG/ALTITUDE/SPEED/BEARING/ACCURACY）填充Location对象，经mILocationManager.reportLocation交给LMS通知客户端；首次收到经纬度时计算TTFF并回调GpsStatusListener.onFirstFix; reportStatus：处理GPS_STATUS_SESSION_BEGIN/END（导航开始结束）、ENGINE_ON/OFF，更新mNavigating/mEngineOn，并发GPS_ENABLED_CHANGE广播; reportSvStatus：native_read_sv_status读取卫星信息（最多32颗）——mSvs编号、mSnrs信噪比、mSvElevations高度角、mSvAzimuths方位角、mSvMasks三个32位掩码（EPHEMERIS_MASK是否取得星历、ALMANAC_MASK是否取得历书、USED_FOR_FIX_MASK是否参与上次定位）；可实现类似GpsTestPlus的卫星显示应用"}, {"id": "c884", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "startNavigating", "back": "<div class=\"def-ans\">默认GPS_POSITION_MODE_STANDALONE；若ASSISTED_GPS_ENABLED开启且支持MSB则设为GPS_POSITION_MODE_MS_BASED；不支持SCHEDULING且间隔≥60秒时设置超时停止导航</div>", "backText": "默认GPS_POSITION_MODE_STANDALONE；若ASSISTED_GPS_ENABLED开启且支持MSB则设为GPS_POSITION_MODE_MS_BASED；不支持SCHEDULING且间隔≥60秒时设置超时停止导航"}, {"id": "c885", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "不支持SCHEDULING的模块由两个Alarm模拟", "back": "<div class=\"def-ans\">ALARM_TIMEOUT停止导航、ALARM_WAKEUP重启导航（hibernate休眠机制）</div>", "backText": "ALARM_TIMEOUT停止导航、ALARM_WAKEUP重启导航（hibernate休眠机制）"}, {"id": "c886", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "reportLocation（JNI回调）", "back": "<div class=\"def-ans\">按flags（LOCATION_HAS_LAT_LONG/ALTITUDE/SPEED/BEARING/ACCURACY）填充Location对象，经mILocationManager.reportLocation交给LMS通知客户端；首次收到经纬度时计算TTFF并回调GpsStatusListener.onFirstFix</div>", "backText": "按flags（LOCATION_HAS_LAT_LONG/ALTITUDE/SPEED/BEARING/ACCURACY）填充Location对象，经mILocationManager.reportLocation交给LMS通知客户端；首次收到经纬度时计算TTFF并回调GpsStatusListener.onFirstFix"}, {"id": "c887", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "reportStatus", "back": "<div class=\"def-ans\">处理GPS_STATUS_SESSION_BEGIN/END（导航开始结束）、ENGINE_ON/OFF，更新mNavigating/mEngineOn，并发GPS_ENABLED_CHANGE广播</div>", "backText": "处理GPS_STATUS_SESSION_BEGIN/END（导航开始结束）、ENGINE_ON/OFF，更新mNavigating/mEngineOn，并发GPS_ENABLED_CHANGE广播"}, {"id": "c888", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "reportSvStatus", "back": "<div class=\"def-ans\">native_read_sv_status读取卫星信息（最多32颗）——mSvs编号、mSnrs信噪比、mSvElevations高度角、mSvAzimuths方位角、mSvMasks三个32位掩码（EPHEMERIS_MASK是否取得星历、ALMANAC_MASK是否取得历书、USED_FOR_FIX_MASK是否参与上次定位）；可实现类似GpsTestPlus的卫星显示应用</div>", "backText": "native_read_sv_status读取卫星信息（最多32颗）——mSvs编号、mSnrs信噪比、mSvElevations高度角、mSvAzimuths方位角、mSvMasks三个32位掩码（EPHEMERIS_MASK是否取得星历、ALMANAC_MASK是否取得历书、USED_FOR_FIX_MASK是否参与上次定位）；可实现类似GpsTestPlus的卫星显示应用"}, {"id": "c889", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "AGPS工作流程（GpsLP中）", "back": "<ul class=\"ans-list\"><li>网络事件处理：GpsLP监听Sticky广播CONNECTIVITY_ACTION→updateNetworkState→handleUpdateNetworkState：将网络状态经native_update_network_state传给HAL；若TYPE_MOBILE_SUPL且连接状态为OPENING则获取APN、requestRouteToHost路由SUPL数据、native_agps_data_conn_open打开数据通道；网络可用时触发INJECT_NTP_TIME与DOWNLOAD_XTRA_DATA</li><li>reportAGpsStatus（HAL→GpsLP）：GPS_REQUEST_AGPS_DATA_CONN时置状态OPENING，经ConnectivityManager.startUsingNetworkFeature申请移动数据；另有GPS_RELEASE_AGPS_DATA_CONN、GPS_AGPS_DATA_CONNECTED/CONN_DONE/CONN_FAILED等状态</li><li>Xtra数据下载：handleDownloadXtraData用GpsXtraDownloader在后台线程下载LTO数据，成功后native_inject_xtra_data注入HAL；期间持有WakeLock</li><li>总结：GpsLP监控网络事件+接收HAL的AGPS状态通知即可完成AGPS流程</li></ul>", "backText": "网络事件处理：GpsLP监听Sticky广播CONNECTIVITY_ACTION→updateNetworkState→handleUpdateNetworkState：将网络状态经native_update_network_state传给HAL；若TYPE_MOBILE_SUPL且连接状态为OPENING则获取APN、requestRouteToHost路由SUPL数据、native_agps_data_conn_open打开数据通道；网络可用时触发INJECT_NTP_TIME与DOWNLOAD_XTRA_DATA; reportAGpsStatus（HAL→GpsLP）：GPS_REQUEST_AGPS_DATA_CONN时置状态OPENING，经ConnectivityManager.startUsingNetworkFeature申请移动数据；另有GPS_RELEASE_AGPS_DATA_CONN、GPS_AGPS_DATA_CONNECTED/CONN_DONE/CONN_FAILED等状态; Xtra数据下载：handleDownloadXtraData用GpsXtraDownloader在后台线程下载LTO数据，成功后native_inject_xtra_data注入HAL；期间持有WakeLock; 总结：GpsLP监控网络事件+接收HAL的AGPS状态通知即可完成AGPS流程"}, {"id": "c890", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "网络事件处理", "back": "<div class=\"def-ans\">GpsLP监听Sticky广播CONNECTIVITY_ACTION→updateNetworkState→handleUpdateNetworkState：将网络状态经native_update_network_state传给HAL；若TYPE_MOBILE_SUPL且连接状态为OPENING则获取APN、requestRouteToHost路由SUPL数据、native_agps_data_conn_open打开数据通道；网络可用时触发INJECT_NTP_TIME与DOWNLOAD_XTRA_DATA</div>", "backText": "GpsLP监听Sticky广播CONNECTIVITY_ACTION→updateNetworkState→handleUpdateNetworkState：将网络状态经native_update_network_state传给HAL；若TYPE_MOBILE_SUPL且连接状态为OPENING则获取APN、requestRouteToHost路由SUPL数据、native_agps_data_conn_open打开数据通道；网络可用时触发INJECT_NTP_TIME与DOWNLOAD_XTRA_DATA"}, {"id": "c891", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "reportAGpsStatus（HAL→GpsLP）", "back": "<div class=\"def-ans\">GPS_REQUEST_AGPS_DATA_CONN时置状态OPENING，经ConnectivityManager.startUsingNetworkFeature申请移动数据；另有GPS_RELEASE_AGPS_DATA_CONN、GPS_AGPS_DATA_CONNECTED/CONN_DONE/CONN_FAILED等状态</div>", "backText": "GPS_REQUEST_AGPS_DATA_CONN时置状态OPENING，经ConnectivityManager.startUsingNetworkFeature申请移动数据；另有GPS_RELEASE_AGPS_DATA_CONN、GPS_AGPS_DATA_CONNECTED/CONN_DONE/CONN_FAILED等状态"}, {"id": "c892", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "Xtra数据下载", "back": "<div class=\"def-ans\">handleDownloadXtraData用GpsXtraDownloader在后台线程下载LTO数据，成功后native_inject_xtra_data注入HAL；期间持有WakeLock</div>", "backText": "handleDownloadXtraData用GpsXtraDownloader在后台线程下载LTO数据，成功后native_inject_xtra_data注入HAL；期间持有WakeLock"}, {"id": "c893", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "总结", "back": "<div class=\"def-ans\">GpsLP监控网络事件+接收HAL的AGPS状态通知即可完成AGPS流程</div>", "backText": "GpsLP监控网络事件+接收HAL的AGPS状态通知即可完成AGPS流程"}, {"id": "c894", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "GPS JNI与HAL层", "back": "<ul class=\"ans-list\"><li>分层架构：Java层GpsLocationProvider.java→JNI层libandroid_server.so中com_android_server_location_GpsLocationProvider.cpp→HAL层动态库gps.xxx.so（接口定义在gps.h）→内核层GPS驱动</li><li>各大厂商均未公开GPS HAL实现；高通QRD的GPS HAL为C/S架构，仅把上层请求转成QMI（QC MSM Interface）消息发给服务处理</li><li>JNI初始化（class_init_native）：获取Java层回调MethodId；hw_get_module(GPS_HARDWARE_MODULE_ID=\"gps\")加载HAL模块并open，取gps_device_t的get_gps_interface获得核心接口GpsInterface；再经get_extension获取扩展接口：GpsXtraInterface、AGpsInterface、GpsNiInterface、GpsDebugInterface、AGpsRilInterface</li><li>Java层native函数（Java→JNI→HAL）：class_init_native、native_init、native_cleanup、native_set_position_mode（mode取STANDALONE=0/MS_BASED=1/MS_ASSISTED=2；recurrence取PERIODIC=0/SINGLE=1）、native_start/stop、native_delete_aiding_data、native_read_sv_status、native_read_nmea、native_inject_location、native_inject_time、native_inject_xtra_data、native_agps_data_conn_open/closed/failed、native_agps_ni_message、native_set_agps_server（AGPS_TYPE_SUPL=1/AGPS_TYPE_C2K=2）、native_send_ni_response、native_agps_set_ref_location_cellid（mcc移动国家码——中国460、mnc移动网络码、lac位置区码、cid基站编号）、native_agps_set_id、native_update_network_state</li><li>JNI回调Java层函数（HAL→JNI→Java）：reportLocation、reportStatus、reportSvStatus、reportAGpsStatus、reportNmea、setEngineCapabilities、xtraDownloadRequest、reportNiNotification、requestRefLocation、requestSetID、requestUtcTime</li><li>gps.h中HAL接口：GpsInterface（init/start/stop/cleanup/inject_time/inject_location/delete_aiding_data/set_position_mode/get_extension）；GpsXtraInterface（init/inject_xtra_data）；AGpsInterface（init/data_conn_open(apn)/data_conn_closed/data_conn_failed/set_server）；GpsNiInterface（init/respond）；AGpsRilInterface</li></ul>", "backText": "分层架构：Java层GpsLocationProvider.java→JNI层libandroid_server.so中com_android_server_location_GpsLocationProvider.cpp→HAL层动态库gps.xxx.so（接口定义在gps.h）→内核层GPS驱动; 各大厂商均未公开GPS HAL实现；高通QRD的GPS HAL为C/S架构，仅把上层请求转成QMI（QC MSM Interface）消息发给服务处理; JNI初始化（class_init_native）：获取Java层回调MethodId；hw_get_module(GPS_HARDWARE_MODULE_ID=\"gps\")加载HAL模块并open，取gps_device_t的get_gps_interface获得核心接口GpsInterface；再经get_extension获取扩展接口：GpsXtraInterface、AGpsInterface、GpsNiInterface、GpsDebugInterface、AGpsRilInterface; Java层native函数（Java→JNI→HAL）：class_init_native、native_init、native_cleanup、native_set_position_mode（mode取STANDALONE=0/MS_BASED=1/MS_ASSISTED=2；recurrence取PERIODIC=0/SINGLE=1）、native_start/stop、native_delete_aiding_data、native_read_sv_status、native_read_nmea、native_inject_location、native_inject_time、native_inject_xtra_data、native_agps_data_conn_open/closed/failed、native_agps_ni_message、native_set_agps_server（AGPS_TYPE_SUPL=1/AGPS_TYPE_C2K=2）、native_send_ni_response、native_agps_set_ref_location_cellid（mcc移动国家码——中国460、mnc移动网络码、lac位置区码、cid基站编号）、native_agps_set_id、native_update_network_state; JNI回调Java层函数（HAL→JNI→Java）：reportLocation、reportStatus、reportSvStatus、reportAGpsStatus、reportNmea、setEngineCapabilities、xtraDownloadRequest、reportNiNotification、requestRefLocation、requestSetID、requestUtcTime; gps.h中HAL接口：GpsInterface（init/start/stop/cleanup/inject_time/inject_location/delete_aiding_data/set_position_mode/get_extension）；GpsXtraInterface（init/inject_xtra_data）；AGpsInterface（init/data_conn_open(apn)/data_conn_closed/data_conn_failed/set_server）；GpsNiInterface（init/respond）；AGpsRilInterface"}, {"id": "c895", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "分层架构", "back": "<div class=\"def-ans\">Java层GpsLocationProvider.java→JNI层libandroid_server.so中com_android_server_location_GpsLocationProvider.cpp→HAL层动态库gps.xxx.so（接口定义在gps.h）→内核层GPS驱动</div>", "backText": "Java层GpsLocationProvider.java→JNI层libandroid_server.so中com_android_server_location_GpsLocationProvider.cpp→HAL层动态库gps.xxx.so（接口定义在gps.h）→内核层GPS驱动"}, {"id": "c896", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "JNI初始化（class_init_native）", "back": "<div class=\"def-ans\">获取Java层回调MethodId；hw_get_module(GPS_HARDWARE_MODULE_ID=\"gps\")加载HAL模块并open，取gps_device_t的get_gps_interface获得核心接口GpsInterface；再经get_extension获取扩展接口：GpsXtraInterface、AGpsInterface、GpsNiInterface、GpsDebugInterface、AGpsRilInterface</div>", "backText": "获取Java层回调MethodId；hw_get_module(GPS_HARDWARE_MODULE_ID=\"gps\")加载HAL模块并open，取gps_device_t的get_gps_interface获得核心接口GpsInterface；再经get_extension获取扩展接口：GpsXtraInterface、AGpsInterface、GpsNiInterface、GpsDebugInterface、AGpsRilInterface"}, {"id": "c897", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "Java层native函数（Java→JNI→HAL）", "back": "<div class=\"def-ans\">class_init_native、native_init、native_cleanup、native_set_position_mode（mode取STANDALONE=0/MS_BASED=1/MS_ASSISTED=2；recurrence取PERIODIC=0/SINGLE=1）、native_start/stop、native_delete_aiding_data、native_read_sv_status、native_read_nmea、native_inject_location、native_inject_time、native_inject_xtra_data、native_agps_data_conn_open/closed/failed、native_agps_ni_message、native_set_agps_server（AGPS_TYPE_SUPL=1/AGPS_TYPE_C2K=2）、native_send_ni_response、native_agps_set_ref_location_cellid（mcc移动国家码——中国460、mnc移动网络码、lac位置区码、cid基站编号）、native_agps_set_id、native_update_network_state</div>", "backText": "class_init_native、native_init、native_cleanup、native_set_position_mode（mode取STANDALONE=0/MS_BASED=1/MS_ASSISTED=2；recurrence取PERIODIC=0/SINGLE=1）、native_start/stop、native_delete_aiding_data、native_read_sv_status、native_read_nmea、native_inject_location、native_inject_time、native_inject_xtra_data、native_agps_data_conn_open/closed/failed、native_agps_ni_message、native_set_agps_server（AGPS_TYPE_SUPL=1/AGPS_TYPE_C2K=2）、native_send_ni_response、native_agps_set_ref_location_cellid（mcc移动国家码——中国460、mnc移动网络码、lac位置区码、cid基站编号）、native_agps_set_id、native_update_network_state"}, {"id": "c898", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "JNI回调Java层函数（HAL→JNI→Java）", "back": "<div class=\"def-ans\">reportLocation、reportStatus、reportSvStatus、reportAGpsStatus、reportNmea、setEngineCapabilities、xtraDownloadRequest、reportNiNotification、requestRefLocation、requestSetID、requestUtcTime</div>", "backText": "reportLocation、reportStatus、reportSvStatus、reportAGpsStatus、reportNmea、setEngineCapabilities、xtraDownloadRequest、reportNiNotification、requestRefLocation、requestSetID、requestUtcTime"}, {"id": "c899", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "gps.h中HAL接口", "back": "<div class=\"def-ans\">GpsInterface（init/start/stop/cleanup/inject_time/inject_location/delete_aiding_data/set_position_mode/get_extension）；GpsXtraInterface（init/inject_xtra_data）；AGpsInterface（init/data_conn_open(apn)/data_conn_closed/data_conn_failed/set_server）；GpsNiInterface（init/respond）；AGpsRilInterface</div>", "backText": "GpsInterface（init/start/stop/cleanup/inject_time/inject_location/delete_aiding_data/set_position_mode/get_extension）；GpsXtraInterface（init/inject_xtra_data）；AGpsInterface（init/data_conn_open(apn)/data_conn_closed/data_conn_failed/set_server）；GpsNiInterface（init/respond）；AGpsRilInterface"}, {"id": "c900", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "本章代码评价与延伸", "back": "<ul class=\"ans-list\"><li>与WifiService/WifiP2pService/NfcService相比LMS不复杂：服务本身简单；GpsLP分层接口设计合理，使HAL层以上代码不受底层硬件影响</li><li>建议进一步学习：PassiveProvider与FusedLocationProvider、LocationFudger（位置模糊）、GeofenceManager；可反编译NetworkLocation.apk研究NetworkLP与Geocoder实现</li></ul>", "backText": "与WifiService/WifiP2pService/NfcService相比LMS不复杂：服务本身简单；GpsLP分层接口设计合理，使HAL层以上代码不受底层硬件影响; 建议进一步学习：PassiveProvider与FusedLocationProvider、LocationFudger（位置模糊）、GeofenceManager；可反编译NetworkLocation.apk研究NetworkLP与Geocoder实现"}, {"id": "c901", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.3 Android中的位置管理", "front": "建议进一步学习", "back": "<div class=\"def-ans\">PassiveProvider与FusedLocationProvider、LocationFudger（位置模糊）、GeofenceManager；可反编译NetworkLocation.apk研究NetworkLP与Geocoder实现</div>", "backText": "PassiveProvider与FusedLocationProvider、LocationFudger（位置模糊）、GeofenceManager；可反编译NetworkLocation.apk研究NetworkLP与Geocoder实现"}, {"id": "c902", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.4 本章总结和参考资料说明", "front": "内容分两大块", "back": "<div class=\"def-ans\">GPS基础知识（面广但难度不大）+ Android位置管理模块代码（难度不大）</div>", "backText": "GPS基础知识（面广但难度不大）+ Android位置管理模块代码（难度不大）"}, {"id": "c903", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.4 本章总结和参考资料说明", "front": "GPS是全书难度最大的一章", "back": "<div class=\"def-ans\">背景知识庞杂、历经几十年发展、知识更新快</div>", "backText": "背景知识庞杂、历经几十年发展、知识更新快"}, {"id": "c904", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "9.4 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">《GPS Essentials of Satellite Navigation Companium》（作者认为对软件工程师最全面、最通俗易懂的GPS书）；美国GPS官方网站gps.gov；官方规范Interface Specification GPS 200G/705C；《Understanding the GPS》；NMEA Reference Manual；OMA SUPL Architecture 3.0与OMA User Plane Location Protocol 3.0官方文档；Google Play Services Location API官方文档</div>", "backText": "《GPS Essentials of Satellite Navigation Companium》（作者认为对软件工程师最全面、最通俗易懂的GPS书）；美国GPS官方网站gps.gov；官方规范Interface Specification GPS 200G/705C；《Understanding the GPS》；NMEA Reference Manual；OMA SUPL Architecture 3.0与OMA User Plane Location Protocol 3.0官方文档；Google Play Services Location API官方文档"}, {"id": "c905", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "附录", "front": "邓凡平来信观点", "back": "<ul class=\"ans-list\"><li>本书定位：初学者可入门但比普通入门书难；中级学者（1~2年经验、有改bug经验但缺全局理解）适用；高级学者可当参考书但内容偏浅</li><li>NFC与GPS的实际问题非常少；面试更看重对NFC芯片datasheet的了解；本书未涵盖Wi-Fi/NFC/GPS的HAL层内容</li><li>Wi-Fi驱动与协议结合紧密，有驱动经验即可自行钻研；NFC HAL趋势或类似wpa_supplicant（不再有NXP/Broadcom特定内容）；GPS驱动代码一般不对外公开</li><li>高通CODEAurora开源项目中的GPS HAL为C/S架构，Client端只是发命令收回复，无核心技术</li><li>Wi-Fi/NFC/GPS核心都由芯片厂商完成，可发挥空间少（NFC CE模式特别是安全交付方案仍有空间）</li></ul>", "backText": "本书定位：初学者可入门但比普通入门书难；中级学者（1~2年经验、有改bug经验但缺全局理解）适用；高级学者可当参考书但内容偏浅; NFC与GPS的实际问题非常少；面试更看重对NFC芯片datasheet的了解；本书未涵盖Wi-Fi/NFC/GPS的HAL层内容; Wi-Fi驱动与协议结合紧密，有驱动经验即可自行钻研；NFC HAL趋势或类似wpa_supplicant（不再有NXP/Broadcom特定内容）；GPS驱动代码一般不对外公开; 高通CODEAurora开源项目中的GPS HAL为C/S架构，Client端只是发命令收回复，无核心技术; Wi-Fi/NFC/GPS核心都由芯片厂商完成，可发挥空间少（NFC CE模式特别是安全交付方案仍有空间）"}, {"id": "c906", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "附录", "front": "本书定位", "back": "<div class=\"def-ans\">初学者可入门但比普通入门书难；中级学者（1~2年经验、有改bug经验但缺全局理解）适用；高级学者可当参考书但内容偏浅</div>", "backText": "初学者可入门但比普通入门书难；中级学者（1~2年经验、有改bug经验但缺全局理解）适用；高级学者可当参考书但内容偏浅"}, {"id": "c907", "type": "outline", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "附录", "front": "吴劲良回信观点", "back": "<ul class=\"ans-list\"><li>本书对不同层次读者各有收获：引初学者入门、给中级学者分析线索、给高级学者思考机会</li><li>GPS HAL各厂家不公开（Broadcom、MTK、RDA只提供so）；GPS一般用UART接口</li><li>无线模组新人培养路径：功能验证测试→单独调试模组→承担实际任务；学习NL802.11、USB/SDIO/UART/I2C等接口驱动，按Wi-Fi driver→netd→wpa_supplicant→HAL→framework从内核学起；最终要在头脑中形成并能画出Android网络结构图</li><li>实际工作重点在模组移植调试（涉及内核驱动调试）；调稳一款新Wi-Fi如调一个小系统，常耗时一两个月</li><li>Wi-Fi/BT/NFC/GPS核心技术都在芯片厂芯片设计中，driver编写只占很小部分，但该方向技术人员需求仍大</li></ul>", "backText": "本书对不同层次读者各有收获：引初学者入门、给中级学者分析线索、给高级学者思考机会; GPS HAL各厂家不公开（Broadcom、MTK、RDA只提供so）；GPS一般用UART接口; 无线模组新人培养路径：功能验证测试→单独调试模组→承担实际任务；学习NL802.11、USB/SDIO/UART/I2C等接口驱动，按Wi-Fi driver→netd→wpa_supplicant→HAL→framework从内核学起；最终要在头脑中形成并能画出Android网络结构图; 实际工作重点在模组移植调试（涉及内核驱动调试）；调稳一款新Wi-Fi如调一个小系统，常耗时一两个月; Wi-Fi/BT/NFC/GPS核心技术都在芯片厂芯片设计中，driver编写只占很小部分，但该方向技术人员需求仍大"}, {"id": "c908", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "附录", "front": "本书对不同层次读者各有收获", "back": "<div class=\"def-ans\">引初学者入门、给中级学者分析线索、给高级学者思考机会</div>", "backText": "引初学者入门、给中级学者分析线索、给高级学者思考机会"}, {"id": "c909", "type": "def", "part": "GPS 篇", "partColor": "#d97706", "chapter": "第9章 深入理解GPS", "section": "附录", "front": "无线模组新人培养路径", "back": "<div class=\"def-ans\">功能验证测试→单独调试模组→承担实际任务；学习NL802.11、USB/SDIO/UART/I2C等接口驱动，按Wi-Fi driver→netd→wpa_supplicant→HAL→framework从内核学起；最终要在头脑中形成并能画出Android网络结构图</div>", "backText": "功能验证测试→单独调试模组→承担实际任务；学习NL802.11、USB/SDIO/UART/I2C等接口驱动，按Wi-Fi driver→netd→wpa_supplicant→HAL→framework从内核学起；最终要在头脑中形成并能画出Android网络结构图"}];
var PARTS = [{"name": "开篇导读", "key": "intro", "color": "#8b5cf6", "files": ["ch1.md"]}, {"name": "Wi-Fi 篇", "key": "wifi", "color": "#2563eb", "files": ["ch2.md", "ch3.md", "ch4.md", "ch5.md", "ch6.md", "ch7.md"]}, {"name": "NFC 篇", "key": "nfc", "color": "#059669", "files": ["ch8.md"]}, {"name": "GPS 篇", "key": "gps", "color": "#d97706", "files": ["ch9.md"]}];
var state = {view:'browse', part:'all', chapter:'all', query:'', flipped:{}, idx:0, deck:[]};

function el(tag, cls, html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function filtered(){
  var q=state.query.trim().toLowerCase();
  return CARDS.filter(function(c){
    if(state.part!=='all'&&c.part!==state.part)return false;
    if(state.chapter!=='all'&&c.chapter!==state.chapter)return false;
    if(q&&!(c.front.toLowerCase().indexOf(q)>=0||c.backText.toLowerCase().indexOf(q)>=0||c.section.toLowerCase().indexOf(q)>=0))return false;
    return true;
  });
}
function chaptersOf(part){
  var m={};
  CARDS.forEach(function(c){if(part==='all'||c.part===part)m[c.chapter]=1});
  return Object.keys(m);
}

function buildToolbar(){
  var tb=document.getElementById('tb');
  tb.innerHTML='';
  var mode=el('div','mode');
  var b1=el('button','on','📚 全部浏览');var b2=el('button','','🎯 单卡学习');
  if(state.view==='study'){b1.classList.remove('on');b2.classList.add('on');}
  b1.onclick=function(){state.view='browse';render();};
  b2.onclick=function(){state.view='study';state.idx=0;state.deck=filtered();render();};
  mode.appendChild(b1);mode.appendChild(b2);tb.appendChild(mode);

  var selP=el('select');
  var opt=el('option',null,'全部部分');opt.value='all';selP.appendChild(opt);
  PARTS.forEach(function(p){var o=el('option',null,p.name);o.value=p.name;if(state.part===p.name)o.selected=1;selP.appendChild(o);});
  selP.onchange=function(){state.part=selP.value;state.chapter='all';render();};
  tb.appendChild(selP);

  var selC=el('select');
  var oa=el('option',null,'全部章节');oa.value='all';selC.appendChild(oa);
  chaptersOf(state.part).forEach(function(ch){var o=el('option',null,ch);o.value=ch;if(state.chapter===ch)o.selected=1;selC.appendChild(o);});
  selC.onchange=function(){state.chapter=selC.value;render();};
  tb.appendChild(selC);

  var input=el('input');input.type='text';input.placeholder='搜索卡片（正面 / 答案 / 小节）…';input.value=state.query;
  input.addEventListener('input',function(){state.query=input.value;render();});
  tb.appendChild(input);

  var sp=el('div','spacer');tb.appendChild(sp);

  if(state.view==='browse'){
    var fa=el('div','flip-all');
    var ba=el('button',null,'翻开全部');var bc=el('button',null,'收起全部');
    ba.onclick=function(){flipAll(true)};
    bc.onclick=function(){flipAll(false)};
    fa.appendChild(ba);fa.appendChild(bc);
    tb.appendChild(fa);
  }
  var cnt=el('span','hint',filtered().length+' 张卡片');
  tb.appendChild(cnt);
}

function flipAll(open){
  document.querySelectorAll('#view .mini-body').forEach(function(b){
    b.classList.toggle('flipped',open);
  });
}

function renderBrowse(){
  var v=document.getElementById('view');
  v.className='view';v.innerHTML='';
  var list=filtered();
  if(!list.length){v.appendChild(el('div','empty','没有匹配的卡片'));return;}
  var grid=el('div','grid');
  list.forEach(function(c){
    var m=el('div','mini');
    var head=el('div','mini-head');
    var pill=el('span','pill',c.part);pill.style.background=c.partColor;
    head.appendChild(pill);
    head.appendChild(el('span','sec',c.chapter+' · '+c.section));
    m.appendChild(head);
    var body=el('div','mini-body');
    body.style.setProperty('--accent',c.partColor);
    var front=el('div','mini-front',esc(c.front));
    var back=el('div','mini-back',c.back);
    // replace list styles with accent color
    body.appendChild(front);body.appendChild(back);
    body.onclick=function(e){
      e.stopPropagation();
      body.classList.toggle('flipped');
    };
    m.appendChild(body);
    grid.appendChild(m);
  });
  v.appendChild(grid);
}

function renderStudy(){
  var v=document.getElementById('view'); v.className='view'; v.innerHTML='';
  state.deck=filtered();
  var wrap=el('div','study');
  var total=state.deck.length;
  if(!total){wrap.appendChild(el('div','empty','没有匹配的卡片'));v.appendChild(wrap);return;}
  if(state.idx>=total)state.idx=total-1;
  var c=state.deck[state.idx];
  var prog=el('div','progress',(state.idx+1)+' / '+total+' 张卡片 · '+c.part+' · '+c.chapter);
  wrap.appendChild(prog);

  var cw=el('div','card-wrap');
  var card=el('div','card');
  card.style.setProperty('--accent',c.partColor);
  var front=el('div','face front');
  var ft=el('div','tag','<span class="dot" style="background:'+c.partColor+'"></span>'+esc(c.section)+'<span class="chap">'+esc(c.chapter)+'</span>');
  front.appendChild(ft);
  front.appendChild(el('div','front-body',esc(c.front)));
  front.appendChild(el('div','hint-bot','点击卡片查看答案 · 空格键翻卡 · ← → 切换'));
  var back=el('div','face back');
  back.appendChild(ft.cloneNode(true));
  back.appendChild(el('h3',null,esc(c.front)));
  var ans=el('div');ans.innerHTML=c.back;back.appendChild(ans);
  card.appendChild(front);card.appendChild(back);
  card.onclick=function(){card.classList.toggle('flipped')};
  cw.appendChild(card);
  wrap.appendChild(cw);

  var acts=el('div','study-actions');
  var prev=el('button',null,'← 上一张');prev.onclick=function(){state.idx=Math.max(0,state.idx-1);renderStudy();};
  var next=el('button','next','下一张 →');next.onclick=function(){state.idx=Math.min(total-1,state.idx+1);renderStudy();};
  acts.appendChild(prev);acts.appendChild(next);
  wrap.appendChild(acts);

  v.appendChild(wrap);
}

function render(){
  buildToolbar();
  if(state.view==='browse')renderBrowse();
  else renderStudy();
}

document.addEventListener('keydown',function(e){
  if(state.view!=='study')return;
  if(e.code==='Space'){e.preventDefault();document.querySelector('.card').classList.toggle('flipped');}
  if(e.code==='ArrowRight'){state.idx=Math.min(state.deck.length-1,state.idx+1);renderStudy();}
  if(e.code==='ArrowLeft'){state.idx=Math.max(0,state.idx-1);renderStudy();}
});

render();
</script>
