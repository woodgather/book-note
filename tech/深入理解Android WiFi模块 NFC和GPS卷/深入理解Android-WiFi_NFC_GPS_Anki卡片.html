深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "7.4.1 P2P模块初始化", "back": "<ul class=\"ans-list\"><li>wpas_p2p_init（p2p_supplicant.c）：检查drv_flags含WPA_DRIVER_FLAGS_P2P_CAPABLE才初始化；WPA_DRIVER_FLAGS_P2P_MGMT时由wifi driver直接处理P2P</li><li>初始化p2p_config：设置回调函数（p2p_scan→wpas_p2p_scan、get_noa、go_connected等约20个，定义P2P模块与外界交互接口）；设置P2P Device Address、dev_name/manufacturer/model_name、uuid和config_methods（取自wps）、listen channel/reg_class、国家码（默认\"XX\\x04\"）、wpas_p2p_setup_channels校验驱动支持的channels、concurrent_operations、max_peers=100、p2p_ssid_postfix</li><li>调用p2p_init（p2p.c）创建p2p_data对象（p2p-&gt;cfg指向p2p_config拷贝）</li><li>Driver Flags（driver.h）含义：WPA_DRIVER_FLAGS_AP(0x40)支持AP（使设备能当GO）；P2P_CONCURRENT(0x200)支持STA+P2P并发；P2P_CAPABLE(0x800)支持P2P；P2P_MGMT_AND_NON_P2P(0x2000)；Galaxy Note 2取值0x2EAC0</li><li>重要数据结构：p2p_config（20个回调函数）、p2p_data（P2P模块代表）、p2p_device（一个P2P设备）、p2p_group（含p2p_group_member链表即Client信息）</li><li>p2p_init细节：ANDROID_P2P时min_disc_int=2（listen最短200ms）；随机初始化next_tie_breaker；设置dev_capab（SERVICE_DISCOVERY、INVITATION_PROCEDURE、CONCURRENT_OPER、CLIENT_DISCOVERABILITY）；初始化devices链表；注册p2p_expiration_timeout超时任务检测不活跃p2p_device</li><li>注册Action帧监听：nl80211_mgmt_subscribe_non_ap注册监听；处理函数为process_bss_event</li><li>注册两类帧：P2P Public Action帧（\"\\x04\\x09\\x50\\x6f\\x9a\\x09\"，Category=0x04+OUI 50-6F-9A+Type 09；GON、P2P Invitation、Provision Discovery、Device Discoverability使用）；P2P Action帧（\"\\x7f\\x50\\x6f\\x9a\\x09\"，Category=0x7F；Notice of Absence、P2P Presence、GO Discoverability使用）；另有GAS Public Action帧监听（与Service Discovery相关）</li><li>后续三大流程：搜索周围P2P设备（Device Discovery）、发起Provision Discovery、Group Formation（重点Group Negotiation）；GON后本机当Client则做Provisioning（Enrollee）并加入Group，当GO则做Provisioning（Registrar）并处理Client加入</li></ul>", "backText": "wpas_p2p_init（p2p_supplicant.c）：检查drv_flags含WPA_DRIVER_FLAGS_P2P_CAPABLE才初始化；WPA_DRIVER_FLAGS_P2P_MGMT时由wifi driver直接处理P2P; 初始化p2p_config：设置回调函数（p2p_scan→wpas_p2p_scan、get_noa、go_connected等约20个，定义P2P模块与外界交互接口）；设置P2P Device Address、dev_name/manufacturer/model_name、uuid和config_methods（取自wps）、listen channel/reg_class、国家码（默认\"XX\\x04\"）、wpas_p2p_setup_channels校验驱动支持的channels、concurrent_operations、max_peers=100、p2p_ssid_postfix; 调用p2p_init（p2p.c）创建p2p_data对象（p2p->cfg指向p2p_config拷贝）; Driver Flags（driver.h）含义：WPA_DRIVER_FLAGS_AP(0x40)支持AP（使设备能当GO）；P2P_CONCURRENT(0x200)支持STA+P2P并发；P2P_CAPABLE(0x800)支持P2P；P2P_MGMT_AND_NON_P2P(0x2000)；Galaxy Note 2取值0x2EAC0; 重要数据结构：p2p_config（20个回调函数）、p2p_data（P2P模块代表）、p2p_device（一个P2P设备）、p2p_group（含p2p_group_member链表即Client信息）; p2p_init细节：ANDROID_P2P时min_disc_int=2（listen最短200ms）；随机初始化next_tie_breaker；设置dev_capab（SERVICE_DISCOVERY、INVITATION_PROCEDURE、CONCURRENT_OPER、CLIENT_DISCOVERABILITY）；初始化devices链表；注册p2p_expiration_timeout超时任务检测不活跃p2p_device"}, {"id": "c670", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "初始化p2p_config", "back": "<div class=\"def-ans\">设置回调函数（p2p_scan→wpas_p2p_scan、get_noa、go_connected等约20个，定义P2P模块与外界交互接口）；设置P2P Device Address、dev_name/manufacturer/model_name、uuid和config_methods（取自wps）、listen channel/reg_class、国家码（默认\"XX\\x04\"）、wpas_p2p_setup_channels校验驱动支持的channels、concurrent_operations、max_peers=100、p2p_ssid_postfix</div>", "backText": "设置回调函数（p2p_scan→wpas_p2p_scan、get_noa、go_connected等约20个，定义P2P模块与外界交互接口）；设置P2P Device Address、dev_name/manufacturer/model_name、uuid和config_methods（取自wps）、listen channel/reg_class、国家码（默认\"XX\\x04\"）、wpas_p2p_setup_channels校验驱动支持的channels、concurrent_operations、max_peers=100、p2p_ssid_postfix"}, {"id": "c671", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "Driver Flags（driver.h）含义", "back": "<div class=\"def-ans\">WPA_DRIVER_FLAGS_AP(0x40)支持AP（使设备能当GO）；P2P_CONCURRENT(0x200)支持STA+P2P并发；P2P_CAPABLE(0x800)支持P2P；P2P_MGMT_AND_NON_P2P(0x2000)；Galaxy Note 2取值0x2EAC0</div>", "backText": "WPA_DRIVER_FLAGS_AP(0x40)支持AP（使设备能当GO）；P2P_CONCURRENT(0x200)支持STA+P2P并发；P2P_CAPABLE(0x800)支持P2P；P2P_MGMT_AND_NON_P2P(0x2000)；Galaxy Note 2取值0x2EAC0"}, {"id": "c672", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "重要数据结构", "back": "<div class=\"def-ans\">p2p_config（20个回调函数）、p2p_data（P2P模块代表）、p2p_device（一个P2P设备）、p2p_group（含p2p_group_member链表即Client信息）</div>", "backText": "p2p_config（20个回调函数）、p2p_data（P2P模块代表）、p2p_device（一个P2P设备）、p2p_group（含p2p_group_member链表即Client信息）"}, {"id": "c673", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_init细节", "back": "<div class=\"def-ans\">ANDROID_P2P时min_disc_int=2（listen最短200ms）；随机初始化next_tie_breaker；设置dev_capab（SERVICE_DISCOVERY、INVITATION_PROCEDURE、CONCURRENT_OPER、CLIENT_DISCOVERABILITY）；初始化devices链表；注册p2p_expiration_timeout超时任务检测不活跃p2p_device</div>", "backText": "ANDROID_P2P时min_disc_int=2（listen最短200ms）；随机初始化next_tie_breaker；设置dev_capab（SERVICE_DISCOVERY、INVITATION_PROCEDURE、CONCURRENT_OPER、CLIENT_DISCOVERABILITY）；初始化devices链表；注册p2p_expiration_timeout超时任务检测不活跃p2p_device"}, {"id": "c674", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "注册Action帧监听", "back": "<div class=\"def-ans\">nl80211_mgmt_subscribe_non_ap注册监听；处理函数为process_bss_event</div>", "backText": "nl80211_mgmt_subscribe_non_ap注册监听；处理函数为process_bss_event"}, {"id": "c675", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "注册两类帧", "back": "<div class=\"def-ans\">P2P Public Action帧（\"\\x04\\x09\\x50\\x6f\\x9a\\x09\"，Category=0x04+OUI 50-6F-9A+Type 09；GON、P2P Invitation、Provision Discovery、Device Discoverability使用）；P2P Action帧（\"\\x7f\\x50\\x6f\\x9a\\x09\"，Category=0x7F；Notice of Absence、P2P Presence、GO Discoverability使用）；另有GAS Public Action帧监听（与Service Discovery相关）</div>", "backText": "P2P Public Action帧（\"\\x04\\x09\\x50\\x6f\\x9a\\x09\"，Category=0x04+OUI 50-6F-9A+Type 09；GON、P2P Invitation、Provision Discovery、Device Discoverability使用）；P2P Action帧（\"\\x7f\\x50\\x6f\\x9a\\x09\"，Category=0x7F；Notice of Absence、P2P Presence、GO Discoverability使用）；另有GAS Public Action帧监听（与Service Discovery相关）"}, {"id": "c676", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "后续三大流程", "back": "<div class=\"def-ans\">搜索周围P2P设备（Device Discovery）、发起Provision Discovery、Group Formation（重点Group Negotiation）；GON后本机当Client则做Provisioning（Enrollee）并加入Group，当GO则做Provisioning（Registrar）并处理Client加入</div>", "backText": "搜索周围P2P设备（Device Discovery）、发起Provision Discovery、Group Formation（重点Group Negotiation）；GON后本机当Client则做Provisioning（Enrollee）并加入Group，当GO则做Provisioning（Registrar）并处理Client加入"}, {"id": "c677", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "7.4.2 P2P Device Discovery流程分析", "back": "<ul class=\"ans-list\"><li>入口：P2pStateMachine发\"P2P_FIND 120\"命令→p2p_ctrl_find（解析timeout、type、dev_id）→wpas_p2p_find→p2p_find</li><li>P2P_FIND三种Discovery Type：P2P_FIND_START_WITH_FULL（默认，先扫描所有频段再扫social channels）；P2P_FIND_ONLY_SOCIAL（只扫social channels，更快）；P2P_FIND_PROGRESSIVE（类似FULL但Search State阶段逐个扫所有频段）</li><li>GO工作在Operation Channel，Listen Channel只在最初Device Discovery阶段使用</li><li>wpas_p2p_find：wpas_p2p_clear_pending_action_tx清待发Action帧；取消sched_scan；最终调p2p_find</li><li>p2p_find：p2p_set_state(P2P_SEARCH)；注册p2p_find_timeout超时任务；按type调用p2p-&gt;cfg-&gt;p2p_scan（P2P_SCAN_FULL或P2P_SCAN_SOCIAL）</li><li>wpas_p2p_scan：params.ssids[0]=\"DIRECT-\"（P2P_WILDCARD_SSID）；wps_build_probe_req_ie构造WSC IE；p2p_scan_ie构造P2P IE；P2P_SCAN_SOCIAL时freqs={2412,2437,2462}；scan_res_handler=wpas_p2p_scan_res_handler；wpa_drv_scan发起扫描</li><li>扫描结果处理：wpas_p2p_scan_res_handler对每个结果调p2p_scan_res_handler→p2p_add_device，完毕后调p2p_scan_res_handled</li><li>p2p_add_device：p2p_parse_ies解析IE到p2p_message；p2p_create_device创建p2p_device并加入devices链表；记录last_seen、listen_freq、oper_freq（GO的Probe Response含Group Info属性）；p2p_copy_wps_info复制WSC IE；p2p_add_group_clients按Group Info添加Client；回调p2p-&gt;cfg-&gt;dev_found（→wpas_dev_found向WifiMonitor发P2P-DEVICE-FOUND消息）</li><li>p2p_scan_res_handled：p2p_scan_running=0；state==P2P_SEARCH时调p2p_continue_find</li><li>p2p_continue_find→p2p_listen_in_find：按country/reg_class/channel算listen频段；随机计算listen时长tu=(随机数%(max-min+1)+min)*100（100TU倍数）；p2p_build_probe_resp_ies构造Probe Response IE；回调start_listen（→wpas_start_listen）</li><li>wpas_start_listen：wpa_drv_set_ap_wps_ie（为driver设置Probe/Assoc Response的P2P IE）；wpa_drv_probe_req_report（driver收到Probe Request后发EVENT_RX_PROBE_REQ给WPAS，由WPAS回复）；wpa_drv_remain_on_channel（driver在指定频段停留duration毫秒）</li><li>扫描过程中若发现go_neg_peer则直接p2p_connect_send发GON Request</li></ul>", "backText": "入口：P2pStateMachine发\"P2P_FIND 120\"命令→p2p_ctrl_find（解析timeout、type、dev_id）→wpas_p2p_find→p2p_find; P2P_FIND三种Discovery Type：P2P_FIND_START_WITH_FULL（默认，先扫描所有频段再扫social channels）；P2P_FIND_ONLY_SOCIAL（只扫social channels，更快）；P2P_FIND_PROGRESSIVE（类似FULL但Search State阶段逐个扫所有频段）; GO工作在Operation Channel，Listen Channel只在最初Device Discovery阶段使用; wpas_p2p_find：wpas_p2p_clear_pending_action_tx清待发Action帧；取消sched_scan；最终调p2p_find; p2p_find：p2p_set_state(P2P_SEARCH)；注册p2p_find_timeout超时任务；按type调用p2p->cfg->p2p_scan（P2P_SCAN_FULL或P2P_SCAN_SOCIAL）; wpas_p2p_scan：params.ssids[0]=\"DIRECT-\"（P2P_WILDCARD_SSID）；wps_build_probe_req_ie构造WSC IE；p2p_scan_ie构造P2P IE；P2P_SCAN_SOCIAL时freqs={2412,2437,2462}；scan_res_handler=wpas_p2p_scan_res_handler；wpa_drv_scan发起扫描"}, {"id": "c678", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "入口", "back": "<div class=\"def-ans\">P2pStateMachine发\"P2P_FIND 120\"命令→p2p_ctrl_find（解析timeout、type、dev_id）→wpas_p2p_find→p2p_find</div>", "backText": "P2pStateMachine发\"P2P_FIND 120\"命令→p2p_ctrl_find（解析timeout、type、dev_id）→wpas_p2p_find→p2p_find"}, {"id": "c679", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "P2P_FIND三种Discovery Type", "back": "<div class=\"def-ans\">P2P_FIND_START_WITH_FULL（默认，先扫描所有频段再扫social channels）；P2P_FIND_ONLY_SOCIAL（只扫social channels，更快）；P2P_FIND_PROGRESSIVE（类似FULL但Search State阶段逐个扫所有频段）</div>", "backText": "P2P_FIND_START_WITH_FULL（默认，先扫描所有频段再扫social channels）；P2P_FIND_ONLY_SOCIAL（只扫social channels，更快）；P2P_FIND_PROGRESSIVE（类似FULL但Search State阶段逐个扫所有频段）"}, {"id": "c680", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "wpas_p2p_find", "back": "<div class=\"def-ans\">wpas_p2p_clear_pending_action_tx清待发Action帧；取消sched_scan；最终调p2p_find</div>", "backText": "wpas_p2p_clear_pending_action_tx清待发Action帧；取消sched_scan；最终调p2p_find"}, {"id": "c681", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_find", "back": "<div class=\"def-ans\">p2p_set_state(P2P_SEARCH)；注册p2p_find_timeout超时任务；按type调用p2p-&gt;cfg-&gt;p2p_scan（P2P_SCAN_FULL或P2P_SCAN_SOCIAL）</div>", "backText": "p2p_set_state(P2P_SEARCH)；注册p2p_find_timeout超时任务；按type调用p2p->cfg->p2p_scan（P2P_SCAN_FULL或P2P_SCAN_SOCIAL）"}, {"id": "c682", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "wpas_p2p_scan", "back": "<div class=\"def-ans\">params.ssids[0]=\"DIRECT-\"（P2P_WILDCARD_SSID）；wps_build_probe_req_ie构造WSC IE；p2p_scan_ie构造P2P IE；P2P_SCAN_SOCIAL时freqs={2412,2437,2462}；scan_res_handler=wpas_p2p_scan_res_handler；wpa_drv_scan发起扫描</div>", "backText": "params.ssids[0]=\"DIRECT-\"（P2P_WILDCARD_SSID）；wps_build_probe_req_ie构造WSC IE；p2p_scan_ie构造P2P IE；P2P_SCAN_SOCIAL时freqs={2412,2437,2462}；scan_res_handler=wpas_p2p_scan_res_handler；wpa_drv_scan发起扫描"}, {"id": "c683", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "扫描结果处理", "back": "<div class=\"def-ans\">wpas_p2p_scan_res_handler对每个结果调p2p_scan_res_handler→p2p_add_device，完毕后调p2p_scan_res_handled</div>", "backText": "wpas_p2p_scan_res_handler对每个结果调p2p_scan_res_handler→p2p_add_device，完毕后调p2p_scan_res_handled"}, {"id": "c684", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_add_device", "back": "<div class=\"def-ans\">p2p_parse_ies解析IE到p2p_message；p2p_create_device创建p2p_device并加入devices链表；记录last_seen、listen_freq、oper_freq（GO的Probe Response含Group Info属性）；p2p_copy_wps_info复制WSC IE；p2p_add_group_clients按Group Info添加Client；回调p2p-&gt;cfg-&gt;dev_found（→wpas_dev_found向WifiMonitor发P2P-DEVICE-FOUND消息）</div>", "backText": "p2p_parse_ies解析IE到p2p_message；p2p_create_device创建p2p_device并加入devices链表；记录last_seen、listen_freq、oper_freq（GO的Probe Response含Group Info属性）；p2p_copy_wps_info复制WSC IE；p2p_add_group_clients按Group Info添加Client；回调p2p->cfg->dev_found（→wpas_dev_found向WifiMonitor发P2P-DEVICE-FOUND消息）"}, {"id": "c685", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_scan_res_handled", "back": "<div class=\"def-ans\">p2p_scan_running=0；state==P2P_SEARCH时调p2p_continue_find</div>", "backText": "p2p_scan_running=0；state==P2P_SEARCH时调p2p_continue_find"}, {"id": "c686", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "wpas_start_listen", "back": "<div class=\"def-ans\">wpa_drv_set_ap_wps_ie（为driver设置Probe/Assoc Response的P2P IE）；wpa_drv_probe_req_report（driver收到Probe Request后发EVENT_RX_PROBE_REQ给WPAS，由WPAS回复）；wpa_drv_remain_on_channel（driver在指定频段停留duration毫秒）</div>", "backText": "wpa_drv_set_ap_wps_ie（为driver设置Probe/Assoc Response的P2P IE）；wpa_drv_probe_req_report（driver收到Probe Request后发EVENT_RX_PROBE_REQ给WPAS，由WPAS回复）；wpa_drv_remain_on_channel（driver在指定频段停留duration毫秒）"}, {"id": "c687", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "7.4.3 Provision Discovery流程分析", "back": "<ul class=\"ans-list\"><li>命令入口：ProvisionDiscoveryState EA发\"P2P_PROV_DISC &lt;addr&gt; pbc\"→p2p_ctrl_prov_disc→wpas_p2p_prov_disc→p2p_prov_disc_req</li><li>p2p_prov_disc_req（p2p.c）：p2p_get_device找p2p_device；dev-&gt;req_config_methods=config_methods；user_initiated_pd=!join；调p2p_send_prov_disc_req</li><li>p2p_send_prov_disc_req（p2p_pd.c）：确定频段；dev-&gt;dialog_token自增；p2p_build_prov_disc_req构造PD Request帧；pending_action_state=P2P_PENDING_PD；p2p_send_action发送（涉及Off Channel发送）；保存pending_pd_devaddr</li><li>PD Response属于Action帧，接收链：process_bss_event（NL80211_CMD_FRAME）→mlme_event→mlme_event_mgmt（stype==WLAN_FC_STYPE_ACTION时发EVENT_RX_ACTION）→wpa_supplicant_event→wpas_p2p_rx_action→p2p_rx_action→p2p_rx_action_public→p2p_rx_p2p_action分类分发</li><li>p2p_rx_p2p_action是P2P Public Action帧处理总入口，按data[0]分发：P2P_GO_NEG_REQ/RESP/CONF→p2p_process_go_neg_req/resp/conf；P2P_INVITATION_REQ/RESP；P2P_PROV_DISC_REQ/RESP；P2P_DEV_DISC_REQ/RESP；非Public类Action帧在p2p_rx_action中处理（P2P_NOA、P2P_PRESENCE_REQ/RESP、P2P_GO_DISC_REQ）</li><li>p2p_process_prov_disc_resp（p2p_pd.c）：p2p_parse解析；校验dialog_token；msg.wps_config_methods与dev-&gt;req_config_methods不一致则回调prov_disc_fail；置wps_prov_info；调send_action_done和prov_disc_resp（→wpas_prov_disc_resp）</li><li>wpas_prov_disc_resp：pending_pd_before_join场景则wpas_p2p_join_start；WPS_CONFIG_DISPLAY→wpas_prov_disc_local_keypad；WPS_CONFIG_KEYPAD→wps_generate_pin生成PIN后wpas_prov_disc_local_display；WPS_CONFIG_PUSHBUTTON→wpa_msg发送P2P_EVENT_PROV_DISC_PBC_RESP给客户端，触发Java层P2P_PROV_DISC_PBC_RSP_EVENT处理</li></ul>", "backText": "命令入口：ProvisionDiscoveryState EA发\"P2P_PROV_DISC <addr> pbc\"→p2p_ctrl_prov_disc→wpas_p2p_prov_disc→p2p_prov_disc_req; p2p_prov_disc_req（p2p.c）：p2p_get_device找p2p_device；dev->req_config_methods=config_methods；user_initiated_pd=!join；调p2p_send_prov_disc_req; p2p_send_prov_disc_req（p2p_pd.c）：确定频段；dev->dialog_token自增；p2p_build_prov_disc_req构造PD Request帧；pending_action_state=P2P_PENDING_PD；p2p_send_action发送（涉及Off Channel发送）；保存pending_pd_devaddr; PD Response属于Action帧，接收链：process_bss_event（NL80211_CMD_FRAME）→mlme_event→mlme_event_mgmt（stype==WLAN_FC_STYPE_ACTION时发EVENT_RX_ACTION）→wpa_supplicant_event→wpas_p2p_rx_action→p2p_rx_action→p2p_rx_action_public→p2p_rx_p2p_action分类分发; p2p_rx_p2p_action是P2P Public Action帧处理总入口，按data[0]分发：P2P_GO_NEG_REQ/RESP/CONF→p2p_process_go_neg_req/resp/conf；P2P_INVITATION_REQ/RESP；P2P_PROV_DISC_REQ/RESP；P2P_DEV_DISC_REQ/RESP；非Public类Action帧在p2p_rx_action中处理（P2P_NOA、P2P_PRESENCE_REQ/RESP、P2P_GO_DISC_REQ）; p2p_process_prov_disc_resp（p2p_pd.c）：p2p_parse解析；校验dialog_token；msg.wps_config_methods与dev->req_config_methods不一致则回调prov_disc_fail；置wps_prov_info；调send_action_done和prov_disc_resp（→wpas_prov_disc_resp）"}, {"id": "c688", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "命令入口", "back": "<div class=\"def-ans\">ProvisionDiscoveryState EA发\"P2P_PROV_DISC &lt;addr&gt; pbc\"→p2p_ctrl_prov_disc→wpas_p2p_prov_disc→p2p_prov_disc_req</div>", "backText": "ProvisionDiscoveryState EA发\"P2P_PROV_DISC <addr> pbc\"→p2p_ctrl_prov_disc→wpas_p2p_prov_disc→p2p_prov_disc_req"}, {"id": "c689", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_prov_disc_req（p2p.c）", "back": "<div class=\"def-ans\">p2p_get_device找p2p_device；dev-&gt;req_config_methods=config_methods；user_initiated_pd=!join；调p2p_send_prov_disc_req</div>", "backText": "p2p_get_device找p2p_device；dev->req_config_methods=config_methods；user_initiated_pd=!join；调p2p_send_prov_disc_req"}, {"id": "c690", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "wpas_prov_disc_resp", "back": "<div class=\"def-ans\">pending_pd_before_join场景则wpas_p2p_join_start；WPS_CONFIG_DISPLAY→wpas_prov_disc_local_keypad；WPS_CONFIG_KEYPAD→wps_generate_pin生成PIN后wpas_prov_disc_local_display；WPS_CONFIG_PUSHBUTTON→wpa_msg发送P2P_EVENT_PROV_DISC_PBC_RESP给客户端，触发Java层P2P_PROV_DISC_PBC_RSP_EVENT处理</div>", "backText": "pending_pd_before_join场景则wpas_p2p_join_start；WPS_CONFIG_DISPLAY→wpas_prov_disc_local_keypad；WPS_CONFIG_KEYPAD→wps_generate_pin生成PIN后wpas_prov_disc_local_display；WPS_CONFIG_PUSHBUTTON→wpa_msg发送P2P_EVENT_PROV_DISC_PBC_RESP给客户端，触发Java层P2P_PROV_DISC_PBC_RSP_EVENT处理"}, {"id": "c691", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "7.4.4 GO Negotiation流程分析", "back": "<ul class=\"ans-list\"><li>命令入口：P2pStateMachine收到P2P_PROV_DISC_PBC_RSP_EVENT后p2pConnectWithPinDisplay发\"P2P_CONNECT &lt;addr&gt; pbc go_intent=7\"→p2p_ctrl_connect→wpas_p2p_connect</li><li>wpas_p2p_connect：go_intent默认取conf的p2p_go_intent；join=0；wpas_p2p_create_iface判断（含WPA_DRIVER_FLAGS_P2P_MGMT_AND_NON_P2P标志时返回1）需创建新virtual interface供P2P用（其地址即P2P Interface Address，内部调wpa_driver_nl80211_if_add）；iftype=WPA_IF_P2P_GROUP（go_intent==15时为WPA_IF_P2P_GO）；wpas_p2p_start_go_neg（→p2p_connect）</li><li>p2p_connect：p2p_prepare_channel校验频段；p2p-&gt;go_intent、intended_addr赋值；非P2P_IDLE先p2p_stop_find；若p2p_scan_running则置start_after_scan=P2P_AFTER_SCAN_CONNECT；否则p2p_connect_send</li><li>p2p_connect_send（p2p_go_neg.c）：p2p_build_go_neg_req构造GON Request；p2p_set_state(P2P_CONNECT)；pending_action_state=P2P_PENDING_GO_NEG_REQUEST；go_neg_peer=dev；dev置P2P_DEV_WAIT_GO_NEG_RESPONSE；p2p_send_action发送</li><li>GON Response处理：p2p_process_go_neg_resp解析后调p2p_go_det(p2p-&gt;go_intent, *msg.go_intent)按规则判GO角色（返回&gt;0本机当GO，0对端当GO，-1双方都想当GO即失败）；p2p_build_go_neg_conf构造GON Confirmation；p2p_send_action发送</li><li>EVENT_TX_STATUS处理链（GON Confirmation发送后的TX Report）：driver发NL80211_CMD_FRAME_TX_STATUS→EVENT_TX_STATUS→offchannel_send_action_tx_status（释放pending_action_tx，回调pending_action_tx_status_cb→wpas_p2p_send_action_tx_status）→p2p_send_action_cb（按pending_action_state分发）</li><li>p2p_go_neg_conf_cb：回调send_action_done；go_neg_peer存在则p2p_go_complete</li><li>p2p_go_complete：p2p_set_state(P2P_PROVISIONING)进入Group Formation的Provisioning阶段；回调go_neg_completed（→wpas_go_neg_completed）</li><li>wpas_go_neg_completed：wpa_msg发P2P_EVENT_GO_NEG_SUCCESS（导致P2pStateMachine收到P2P_GO_NEGOTIATION_SUCCESS_EVENT）；create_p2p_iface时wpas_p2p_init_group_interface再创建一个wpa_supplicant对象管理P2P Group专用virtual interface（新对象MAC为P2P Interface Address，用于Group操作；原wpa_supplicant MAC为P2P Device Address）；本机当GO则wpas_start_wps_go（启动WSC Registrar），否则wpas_start_wps_enrollee；注册Group Formation超时（约15秒）</li></ul>", "backText": "命令入口：P2pStateMachine收到P2P_PROV_DISC_PBC_RSP_EVENT后p2pConnectWithPinDisplay发\"P2P_CONNECT <addr> pbc go_intent=7\"→p2p_ctrl_connect→wpas_p2p_connect; wpas_p2p_connect：go_intent默认取conf的p2p_go_intent；join=0；wpas_p2p_create_iface判断（含WPA_DRIVER_FLAGS_P2P_MGMT_AND_NON_P2P标志时返回1）需创建新virtual interface供P2P用（其地址即P2P Interface Address，内部调wpa_driver_nl80211_if_add）；iftype=WPA_IF_P2P_GROUP（go_intent==15时为WPA_IF_P2P_GO）；wpas_p2p_start_go_neg（→p2p_connect）; p2p_connect：p2p_prepare_channel校验频段；p2p->go_intent、intended_addr赋值；非P2P_IDLE先p2p_stop_find；若p2p_scan_running则置start_after_scan=P2P_AFTER_SCAN_CONNECT；否则p2p_connect_send; p2p_connect_send（p2p_go_neg.c）：p2p_build_go_neg_req构造GON Request；p2p_set_state(P2P_CONNECT)；pending_action_state=P2P_PENDING_GO_NEG_REQUEST；go_neg_peer=dev；dev置P2P_DEV_WAIT_GO_NEG_RESPONSE；p2p_send_action发送; GON Response处理：p2p_process_go_neg_resp解析后调p2p_go_det(p2p->go_intent, *msg.go_intent)按规则判GO角色（返回>0本机当GO，0对端当GO，-1双方都想当GO即失败）；p2p_build_go_neg_conf构造GON Confirmation；p2p_send_action发送; EVENT_TX_STATUS处理链（GON Confirmation发送后的TX Report）：driver发NL80211_CMD_FRAME_TX_STATUS→EVENT_TX_STATUS→offchannel_send_action_tx_status（释放pending_action_tx，回调pending_action_tx_status_cb→wpas_p2p_send_action_tx_status）→p2p_send_action_cb（按pending_action_state分发）"}, {"id": "c693", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "wpas_p2p_connect", "back": "<div class=\"def-ans\">go_intent默认取conf的p2p_go_intent；join=0；wpas_p2p_create_iface判断（含WPA_DRIVER_FLAGS_P2P_MGMT_AND_NON_P2P标志时返回1）需创建新virtual interface供P2P用（其地址即P2P Interface Address，内部调wpa_driver_nl80211_if_add）；iftype=WPA_IF_P2P_GROUP（go_intent==15时为WPA_IF_P2P_GO）；wpas_p2p_start_go_neg（→p2p_connect）</div>", "backText": "go_intent默认取conf的p2p_go_intent；join=0；wpas_p2p_create_iface判断（含WPA_DRIVER_FLAGS_P2P_MGMT_AND_NON_P2P标志时返回1）需创建新virtual interface供P2P用（其地址即P2P Interface Address，内部调wpa_driver_nl80211_if_add）；iftype=WPA_IF_P2P_GROUP（go_intent==15时为WPA_IF_P2P_GO）；wpas_p2p_start_go_neg（→p2p_connect）"}, {"id": "c694", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_connect", "back": "<div class=\"def-ans\">p2p_prepare_channel校验频段；p2p-&gt;go_intent、intended_addr赋值；非P2P_IDLE先p2p_stop_find；若p2p_scan_running则置start_after_scan=P2P_AFTER_SCAN_CONNECT；否则p2p_connect_send</div>", "backText": "p2p_prepare_channel校验频段；p2p->go_intent、intended_addr赋值；非P2P_IDLE先p2p_stop_find；若p2p_scan_running则置start_after_scan=P2P_AFTER_SCAN_CONNECT；否则p2p_connect_send"}, {"id": "c695", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_connect_send（p2p_go_neg.c）", "back": "<div class=\"def-ans\">p2p_build_go_neg_req构造GON Request；p2p_set_state(P2P_CONNECT)；pending_action_state=P2P_PENDING_GO_NEG_REQUEST；go_neg_peer=dev；dev置P2P_DEV_WAIT_GO_NEG_RESPONSE；p2p_send_action发送</div>", "backText": "p2p_build_go_neg_req构造GON Request；p2p_set_state(P2P_CONNECT)；pending_action_state=P2P_PENDING_GO_NEG_REQUEST；go_neg_peer=dev；dev置P2P_DEV_WAIT_GO_NEG_RESPONSE；p2p_send_action发送"}, {"id": "c696", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "GON Response处理", "back": "<div class=\"def-ans\">p2p_process_go_neg_resp解析后调p2p_go_det(p2p-&gt;go_intent, *msg.go_intent)按规则判GO角色（返回&gt;0本机当GO，0对端当GO，-1双方都想当GO即失败）；p2p_build_go_neg_conf构造GON Confirmation；p2p_send_action发送</div>", "backText": "p2p_process_go_neg_resp解析后调p2p_go_det(p2p->go_intent, *msg.go_intent)按规则判GO角色（返回>0本机当GO，0对端当GO，-1双方都想当GO即失败）；p2p_build_go_neg_conf构造GON Confirmation；p2p_send_action发送"}, {"id": "c697", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_go_neg_conf_cb", "back": "<div class=\"def-ans\">回调send_action_done；go_neg_peer存在则p2p_go_complete</div>", "backText": "回调send_action_done；go_neg_peer存在则p2p_go_complete"}, {"id": "c698", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "p2p_go_complete", "back": "<div class=\"def-ans\">p2p_set_state(P2P_PROVISIONING)进入Group Formation的Provisioning阶段；回调go_neg_completed（→wpas_go_neg_completed）</div>", "backText": "p2p_set_state(P2P_PROVISIONING)进入Group Formation的Provisioning阶段；回调go_neg_completed（→wpas_go_neg_completed）"}, {"id": "c699", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.4 wpa_supplicant中的P2P", "front": "wpas_go_neg_completed", "back": "<div class=\"def-ans\">wpa_msg发P2P_EVENT_GO_NEG_SUCCESS（导致P2pStateMachine收到P2P_GO_NEGOTIATION_SUCCESS_EVENT）；create_p2p_iface时wpas_p2p_init_group_interface再创建一个wpa_supplicant对象管理P2P Group专用virtual interface（新对象MAC为P2P Interface Address，用于Group操作；原wpa_supplicant MAC为P2P Device Address）；本机当GO则wpas_start_wps_go（启动WSC Registrar），否则wpas_start_wps_enrollee；注册Group Formation超时（约15秒）</div>", "backText": "wpa_msg发P2P_EVENT_GO_NEG_SUCCESS（导致P2pStateMachine收到P2P_GO_NEGOTIATION_SUCCESS_EVENT）；create_p2p_iface时wpas_p2p_init_group_interface再创建一个wpa_supplicant对象管理P2P Group专用virtual interface（新对象MAC为P2P Interface Address，用于Group操作；原wpa_supplicant MAC为P2P Device Address）；本机当GO则wpas_start_wps_go（启动WSC Registrar），否则wpas_start_wps_enrollee；注册Group Formation超时（约15秒）"}, {"id": "c700", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.5 本章总结和参考资料说明", "front": "三大内容回顾", "back": "<div class=\"def-ans\">P2P理论知识（仅规范最基础部分，需反复琢磨并结合代码理解）；WifiP2pSettings与WifiP2pService（较简单易掌握）；WPAS中P2P模块及运行机制（P2P与wifi driver实现考虑多如off channel、TX Report处理，流程显得繁琐）</div>", "backText": "P2P理论知识（仅规范最基础部分，需反复琢磨并结合代码理解）；WifiP2pSettings与WifiP2pService（较简单易掌握）；WPAS中P2P模块及运行机制（P2P与wifi driver实现考虑多如off channel、TX Report处理，流程显得繁琐）"}, {"id": "c701", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.5 本章总结和参考资料说明", "front": "留给读者的任务", "back": "<div class=\"def-ans\">通读P2P规范，学习Group Operation、Invitation、Device Discoverability、P2P Power Management；继续研究wpas_start_wps_go代码掌握WPAS中WSC Registrar及AP工作流程</div>", "backText": "通读P2P规范，学习Group Operation、Invitation、Device Discoverability、P2P Power Management；继续研究wpas_start_wps_go代码掌握WPAS中WSC Registrar及AP工作流程"}, {"id": "c702", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第7章 深入理解Wi-Fi P2P", "section": "7.5 本章总结和参考资料说明", "front": "参考资料", "back": "<div class=\"def-ans\">Wi-Fi P2P规范1.1版全文（第2章Architectural Overview、3.1节P2P Discovery、3.2节P2P Group Operation、3.3节P2P Power Management、4.2节Management Frames、4.1节P2P Information Elements、附录A P2P State Machine）；802.11规范附录J（Country information element and regulatory classes）；802.11-2012的8.4.1.11节Action Field</div>", "backText": "Wi-Fi P2P规范1.1版全文（第2章Architectural Overview、3.1节P2P Discovery、3.2节P2P Group Operation、3.3节P2P Power Management、4.2节Management Frames、4.1节P2P Information Elements、附录A P2P State Machine）；802.11规范附录J（Country information element and regulatory classes）；802.11-2012的8.4.1.11节Action Field"}, {"id": "c703", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.1 概述", "front": "本章结构", "back": "<div class=\"def-ans\">先讲NFC基础知识（核心），再讲Android平台NFC实现，最后探讨开源NFC模块</div>", "backText": "先讲NFC基础知识（核心），再讲Android平台NFC实现，最后探讨开源NFC模块"}, {"id": "c704", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "8.2.1 NFC概述", "back": "<ul class=\"ans-list\"><li>NFC融合三条技术路线<ul class=\"sub\"><li>RFID路线：从条形码→RFID→NFC Tag与NFC Reader；NFC Tag是被动式（Passive）RFID Tag，自身无电源，依靠NFC Reader通过电磁感应供电</li><li>磁条卡路线：演化为Proximity Coupling Smart Card（有效距离10cm，规范ISO/IEC 14443；对比：Close Coupling为1cm/ISO 10536，Vicinity Coupling为1m/ISO 15693）；Smart Card安全性要求远高于RFID Tag，可运行Java Card OS等嵌入式系统/Applets</li><li>移动终端路线：NFC与智能终端融合，拓展应用场景，如NFC Connection Handover（通过NFC协商用蓝牙或Wi-Fi传输数据，NFC本身不适合大数据量传输）</li></ul></li><li>三种运行模式（从用户角度看）<ul class=\"sub\"><li>Reader/Write（R/W）模式：与NFC Tag/NFC Reader相关</li><li>Peer-to-Peer（P2P）模式：支持两个NFC设备交互</li><li>Card Emulation（CE）模式：把设备模拟成Smart Card，实现手机支付、门禁卡等功能</li></ul></li><li>RF层规范：ISO 18092（NFCIP-1，定义NFC RF层工作流程）、ISO 14443 Type A/Type B、FeliCa<ul class=\"sub\"><li>ISO 14443为非接触式IC卡标准，定义Type A和Type B两种卡</li><li>Type A由Philips制订（MIFARE芯片，现归NXP，全球约70%非接触式IC卡使用，如北京公交卡）；Type B主要用在法国</li><li>FeliCa（Type F）由Sony开发，成为日本工业标准JIS X6319-4，主要用于日本市场</li><li>Type A/B/F区别在RF层信号调制解调方法、传输速率及数据编码方式</li></ul></li><li>RF层之上是Mode Switch：确定对端NFC设备类型并选择合适的RF层协议通信</li><li>NFC Forum规范框架（只定义P2P和R/W模式规范；CE模式NFC Forum无规范）<ul class=\"sub\"><li>RF层三规范：Analog Specifications（RF电气特性）、Digital Protocol Specification（实现不同底层协议设备互通）、NFC Activities Specification</li><li>应用层规范：Connection Handover（协商蓝牙/Wi-Fi传输）、Personal Health Device Communication</li></ul></li><li>NCI（NFC Controller Interface）：定义Device Host（如手机）与NFC芯片交互的标准接口</li></ul>", "backText": "NFC融合三条技术路线; 三种运行模式（从用户角度看）; RF层规范：ISO 18092（NFCIP-1，定义NFC RF层工作流程）、ISO 14443 Type A/Type B、FeliCa; RF层之上是Mode Switch：确定对端NFC设备类型并选择合适的RF层协议通信; NFC Forum规范框架（只定义P2P和R/W模式规范；CE模式NFC Forum无规范）; NCI（NFC Controller Interface）：定义Device Host（如手机）与NFC芯片交互的标准接口"}, {"id": "c705", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "NFC融合三条技术路线", "back": "<ul class=\"ans-list\"><li>RFID路线：从条形码→RFID→NFC Tag与NFC Reader；NFC Tag是被动式（Passive）RFID Tag，自身无电源，依靠NFC Reader通过电磁感应供电</li><li>磁条卡路线：演化为Proximity Coupling Smart Card（有效距离10cm，规范ISO/IEC 14443；对比：Close Coupling为1cm/ISO 10536，Vicinity Coupling为1m/ISO 15693）；Smart Card安全性要求远高于RFID Tag，可运行Java Card OS等嵌入式系统/Applets</li><li>移动终端路线：NFC与智能终端融合，拓展应用场景，如NFC Connection Handover（通过NFC协商用蓝牙或Wi-Fi传输数据，NFC本身不适合大数据量传输）</li></ul>", "backText": "RFID路线：从条形码→RFID→NFC Tag与NFC Reader；NFC Tag是被动式（Passive）RFID Tag，自身无电源，依靠NFC Reader通过电磁感应供电; 磁条卡路线：演化为Proximity Coupling Smart Card（有效距离10cm，规范ISO/IEC 14443；对比：Close Coupling为1cm/ISO 10536，Vicinity Coupling为1m/ISO 15693）；Smart Card安全性要求远高于RFID Tag，可运行Java Card OS等嵌入式系统/Applets; 移动终端路线：NFC与智能终端融合，拓展应用场景，如NFC Connection Handover（通过NFC协商用蓝牙或Wi-Fi传输数据，NFC本身不适合大数据量传输）"}, {"id": "c706", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "RFID路线", "back": "<div class=\"def-ans\">从条形码→RFID→NFC Tag与NFC Reader；NFC Tag是被动式（Passive）RFID Tag，自身无电源，依靠NFC Reader通过电磁感应供电</div>", "backText": "从条形码→RFID→NFC Tag与NFC Reader；NFC Tag是被动式（Passive）RFID Tag，自身无电源，依靠NFC Reader通过电磁感应供电"}, {"id": "c707", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "磁条卡路线", "back": "<div class=\"def-ans\">演化为Proximity Coupling Smart Card（有效距离10cm，规范ISO/IEC 14443；对比：Close Coupling为1cm/ISO 10536，Vicinity Coupling为1m/ISO 15693）；Smart Card安全性要求远高于RFID Tag，可运行Java Card OS等嵌入式系统/Applets</div>", "backText": "演化为Proximity Coupling Smart Card（有效距离10cm，规范ISO/IEC 14443；对比：Close Coupling为1cm/ISO 10536，Vicinity Coupling为1m/ISO 15693）；Smart Card安全性要求远高于RFID Tag，可运行Java Card OS等嵌入式系统/Applets"}, {"id": "c708", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "移动终端路线", "back": "<div class=\"def-ans\">NFC与智能终端融合，拓展应用场景，如NFC Connection Handover（通过NFC协商用蓝牙或Wi-Fi传输数据，NFC本身不适合大数据量传输）</div>", "backText": "NFC与智能终端融合，拓展应用场景，如NFC Connection Handover（通过NFC协商用蓝牙或Wi-Fi传输数据，NFC本身不适合大数据量传输）"}, {"id": "c709", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "三种运行模式（从用户角度看）", "back": "<ul class=\"ans-list\"><li>Reader/Write（R/W）模式：与NFC Tag/NFC Reader相关</li><li>Peer-to-Peer（P2P）模式：支持两个NFC设备交互</li><li>Card Emulation（CE）模式：把设备模拟成Smart Card，实现手机支付、门禁卡等功能</li></ul>", "backText": "Reader/Write（R/W）模式：与NFC Tag/NFC Reader相关; Peer-to-Peer（P2P）模式：支持两个NFC设备交互; Card Emulation（CE）模式：把设备模拟成Smart Card，实现手机支付、门禁卡等功能"}, {"id": "c710", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "Reader/Write（R/W）模式", "back": "<div class=\"def-ans\">与NFC Tag/NFC Reader相关</div>", "backText": "与NFC Tag/NFC Reader相关"}, {"id": "c711", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "Peer-to-Peer（P2P）模式", "back": "<div class=\"def-ans\">支持两个NFC设备交互</div>", "backText": "支持两个NFC设备交互"}, {"id": "c712", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "Card Emulation（CE）模式", "back": "<div class=\"def-ans\">把设备模拟成Smart Card，实现手机支付、门禁卡等功能</div>", "backText": "把设备模拟成Smart Card，实现手机支付、门禁卡等功能"}, {"id": "c713", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "RF层规范：ISO 18092（NFCIP-1，定义NFC RF层工作流程）、ISO 14443 Type A/Type B、FeliCa", "back": "<ul class=\"ans-list\"><li>ISO 14443为非接触式IC卡标准，定义Type A和Type B两种卡</li><li>Type A由Philips制订（MIFARE芯片，现归NXP，全球约70%非接触式IC卡使用，如北京公交卡）；Type B主要用在法国</li><li>FeliCa（Type F）由Sony开发，成为日本工业标准JIS X6319-4，主要用于日本市场</li><li>Type A/B/F区别在RF层信号调制解调方法、传输速率及数据编码方式</li></ul>", "backText": "ISO 14443为非接触式IC卡标准，定义Type A和Type B两种卡; Type A由Philips制订（MIFARE芯片，现归NXP，全球约70%非接触式IC卡使用，如北京公交卡）；Type B主要用在法国; FeliCa（Type F）由Sony开发，成为日本工业标准JIS X6319-4，主要用于日本市场; Type A/B/F区别在RF层信号调制解调方法、传输速率及数据编码方式"}, {"id": "c714", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "RF层之上是Mode Switch", "back": "<div class=\"def-ans\">确定对端NFC设备类型并选择合适的RF层协议通信</div>", "backText": "确定对端NFC设备类型并选择合适的RF层协议通信"}, {"id": "c715", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "NFC Forum规范框架（只定义P2P和R/W模式规范；CE模式NFC Forum无规范）", "back": "<ul class=\"ans-list\"><li>RF层三规范：Analog Specifications（RF电气特性）、Digital Protocol Specification（实现不同底层协议设备互通）、NFC Activities Specification</li><li>应用层规范：Connection Handover（协商蓝牙/Wi-Fi传输）、Personal Health Device Communication</li></ul>", "backText": "RF层三规范：Analog Specifications（RF电气特性）、Digital Protocol Specification（实现不同底层协议设备互通）、NFC Activities Specification; 应用层规范：Connection Handover（协商蓝牙/Wi-Fi传输）、Personal Health Device Communication"}, {"id": "c716", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "RF层三规范", "back": "<div class=\"def-ans\">Analog Specifications（RF电气特性）、Digital Protocol Specification（实现不同底层协议设备互通）、NFC Activities Specification</div>", "backText": "Analog Specifications（RF电气特性）、Digital Protocol Specification（实现不同底层协议设备互通）、NFC Activities Specification"}, {"id": "c717", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "应用层规范", "back": "<div class=\"def-ans\">Connection Handover（协商蓝牙/Wi-Fi传输）、Personal Health Device Communication</div>", "backText": "Connection Handover（协商蓝牙/Wi-Fi传输）、Personal Health Device Communication"}, {"id": "c718", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "NCI（NFC Controller Interface）", "back": "<div class=\"def-ans\">定义Device Host（如手机）与NFC芯片交互的标准接口</div>", "backText": "定义Device Host（如手机）与NFC芯片交互的标准接口"}, {"id": "c719", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "8.2.2 NFC R/W运行模式", "back": "<ul class=\"ans-list\"><li>角色与组件：智能终端内NFC芯片包含NFC Controller（可与Device Host或Secure Element交互）、Antenna（天线）、CLF（非接触式前端，负责射频信号调制解调）</li><li>R/W模式中只有NFC Reader能发起操作，称为Initiator/Active Device；NFC Tag靠电磁感应供电，只能作为Target（Passive Device）</li><li>NFC Forum定义四种Tag类型（Type 1/2/3/4），区别在存储空间、数据传输率、底层协议；兼容的RFID Tag也可被NFC Reader读写</li><li>通用数据结构：NDEF（NFC Data Exchange Format）与NFC Record<ul class=\"sub\"><li>每次交互数据封装在一个NDEF Message中，一个NDEF Message可含多个NFC Record</li><li>第一个Record置MB（Message Begin）位，最后一个Record置ME（Message End）位</li><li>Record分Header和Payload两部分；Header首字节含6个标志：MB、ME、CF（Chunk Flag，分片）、SR（Short Record，Payload限255字节内）、IL（ID_LENGTH标志）、TNF（Type Name Format，指明Payload类型）</li><li>其他字段：Type Length、Payload Length（SR置位时仅1字节）、ID Length、Type（如URI、MIME，便于应用分派处理）、ID（配合URI类型，指向另一个Record）</li></ul></li><li>TNF七种数据类型：Empty、NFC Forum Well-Known Type（URI、TEXT等，遵循RTD规范）、MIME（RFC2046）、Absolute URI（RFC 3986）、NFC Forum External Type、Unknown、Unchanged（用于Record分片）</li><li>RTD规范定义的WKT常用类型：URI Record（\"U\"）、Text Record（\"T\"）、Signature Record（\"Sig\"）、Smart Poster（\"Sp\"）、Generic Control（\"Gc\"）；External Type留给第三方</li><li>URI Record实例：Payload=ID Code（1字节，如0x01代表\"http://www\"）+data（如\"nfc.com\"）；单Record消息置MB=ME=SR=1，TNF=0x01，Type=\"U\"</li><li>R/W模式中应用最重要的工作是解析NDEF消息</li></ul>", "backText": "角色与组件：智能终端内NFC芯片包含NFC Controller（可与Device Host或Secure Element交互）、Antenna（天线）、CLF（非接触式前端，负责射频信号调制解调）; R/W模式中只有NFC Reader能发起操作，称为Initiator/Active Device；NFC Tag靠电磁感应供电，只能作为Target（Passive Device）; NFC Forum定义四种Tag类型（Type 1/2/3/4），区别在存储空间、数据传输率、底层协议；兼容的RFID Tag也可被NFC Reader读写; 通用数据结构：NDEF（NFC Data Exchange Format）与NFC Record; TNF七种数据类型：Empty、NFC Forum Well-Known Type（URI、TEXT等，遵循RTD规范）、MIME（RFC2046）、Absolute URI（RFC 3986）、NFC Forum External Type、Unknown、Unchanged（用于Record分片）; RTD规范定义的WKT常用类型：URI Record（\"U\"）、Text Record（\"T\"）、Signature Record（\"Sig\"）、Smart Poster（\"Sp\"）、Generic Control（\"Gc\"）；External Type留给第三方"}, {"id": "c720", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "角色与组件", "back": "<div class=\"def-ans\">智能终端内NFC芯片包含NFC Controller（可与Device Host或Secure Element交互）、Antenna（天线）、CLF（非接触式前端，负责射频信号调制解调）</div>", "backText": "智能终端内NFC芯片包含NFC Controller（可与Device Host或Secure Element交互）、Antenna（天线）、CLF（非接触式前端，负责射频信号调制解调）"}, {"id": "c721", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "通用数据结构：NDEF（NFC Data Exchange Format）与NFC Record", "back": "<ul class=\"ans-list\"><li>每次交互数据封装在一个NDEF Message中，一个NDEF Message可含多个NFC Record</li><li>第一个Record置MB（Message Begin）位，最后一个Record置ME（Message End）位</li><li>Record分Header和Payload两部分；Header首字节含6个标志：MB、ME、CF（Chunk Flag，分片）、SR（Short Record，Payload限255字节内）、IL（ID_LENGTH标志）、TNF（Type Name Format，指明Payload类型）</li><li>其他字段：Type Length、Payload Length（SR置位时仅1字节）、ID Length、Type（如URI、MIME，便于应用分派处理）、ID（配合URI类型，指向另一个Record）</li></ul>", "backText": "每次交互数据封装在一个NDEF Message中，一个NDEF Message可含多个NFC Record; 第一个Record置MB（Message Begin）位，最后一个Record置ME（Message End）位; Record分Header和Payload两部分；Header首字节含6个标志：MB、ME、CF（Chunk Flag，分片）、SR（Short Record，Payload限255字节内）、IL（ID_LENGTH标志）、TNF（Type Name Format，指明Payload类型）; 其他字段：Type Length、Payload Length（SR置位时仅1字节）、ID Length、Type（如URI、MIME，便于应用分派处理）、ID（配合URI类型，指向另一个Record）"}, {"id": "c722", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "其他字段", "back": "<div class=\"def-ans\">Type Length、Payload Length（SR置位时仅1字节）、ID Length、Type（如URI、MIME，便于应用分派处理）、ID（配合URI类型，指向另一个Record）</div>", "backText": "Type Length、Payload Length（SR置位时仅1字节）、ID Length、Type（如URI、MIME，便于应用分派处理）、ID（配合URI类型，指向另一个Record）"}, {"id": "c723", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "TNF七种数据类型", "back": "<div class=\"def-ans\">Empty、NFC Forum Well-Known Type（URI、TEXT等，遵循RTD规范）、MIME（RFC2046）、Absolute URI（RFC 3986）、NFC Forum External Type、Unknown、Unchanged（用于Record分片）</div>", "backText": "Empty、NFC Forum Well-Known Type（URI、TEXT等，遵循RTD规范）、MIME（RFC2046）、Absolute URI（RFC 3986）、NFC Forum External Type、Unknown、Unchanged（用于Record分片）"}, {"id": "c724", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "RTD规范定义的WKT常用类型", "back": "<div class=\"def-ans\">URI Record（\"U\"）、Text Record（\"T\"）、Signature Record（\"Sig\"）、Smart Poster（\"Sp\"）、Generic Control（\"Gc\"）；External Type留给第三方</div>", "backText": "URI Record（\"U\"）、Text Record（\"T\"）、Signature Record（\"Sig\"）、Smart Poster（\"Sp\"）、Generic Control（\"Gc\"）；External Type留给第三方"}, {"id": "c725", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "URI Record实例", "back": "<div class=\"def-ans\">Payload=ID Code（1字节，如0x01代表\"http://www\"）+data（如\"nfc.com\"）；单Record消息置MB=ME=SR=1，TNF=0x01，Type=\"U\"</div>", "backText": "Payload=ID Code（1字节，如0x01代表\"http://www\"）+data（如\"nfc.com\"）；单Record消息置MB=ME=SR=1，TNF=0x01，Type=\"U\""}, {"id": "c726", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "8.2.3 NFC P2P运行模式", "back": "<ul class=\"ans-list\"><li>P2P模式满足NFC设备间双向交互需求；协议栈最高层为LLC层，使用协议LLCP</li><li>LLC层之上协议：SNEP（Simple NDEF Exchange Protocol，直接交换NDEF消息）、Protocol Bindings（可绑定IP、OBEX）、Other Protocols（常用CHP，Connection Handover Protocol）</li><li>Android 4.2的NFC P2P模块支持SNEP和CHP</li><li>LLCP要点<ul class=\"sub\"><li>提供无链接（类UDP）和面向链接（类TCP，需先建立逻辑链接，处理丢包、重传、确认）两种传输服务；SNEP和CHP均使用面向链接服务</li><li>数据包格式：3字节LLCP Header（DSAP/SSAP、PTYPE、Sequence）+Payload</li><li>DSAP/SSAP为目标/源服务接入点，作用类似TCP/UDP端口号；因NFC近距离通信双方进入有效距离即已确定，无需MAC/IP地址</li><li>SAP示例：SNEP服务端监听SSAP 0x04，客户端设置DSAP=0x04发包</li><li>Link Activation（链路激活）：双方分饰Initiator/Target；Initiator发PAX（Parameter Exchange）包交换LLC配置，Target回复自己的配置，校验通过后Logical Link建立</li><li>WKS告知本机哪些Well-Known服务端口有模块监听——必须在Link Activation触发前就完成监听</li><li>面向链接流程：Client发CONNECT包→Server回CC（Connection Complete）→用I包（承载数据）和RR包（接收确认）传输</li><li>设备分开时触发Link Deactivation；链路激活/去激活可能频繁触发</li></ul></li><li>SNEP要点<ul class=\"sub\"><li>基于面向链接传输的Well-Known Service，端口号0x04，服务名\"urn:nfc:sn:snep\"</li><li>Request/Response方式：客户端发Request（如PUT/GET），服务端回Response告知处理结果</li><li>消息格式：1字节Version + Request/Response字段 + 其他</li></ul></li></ul>", "backText": "P2P模式满足NFC设备间双向交互需求；协议栈最高层为LLC层，使用协议LLCP; LLC层之上协议：SNEP（Simple NDEF Exchange Protocol，直接交换NDEF消息）、Protocol Bindings（可绑定IP、OBEX）、Other Protocols（常用CHP，Connection Handover Protocol）; Android 4.2的NFC P2P模块支持SNEP和CHP; LLCP要点; SNEP要点"}, {"id": "c727", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "LLC层之上协议", "back": "<div class=\"def-ans\">SNEP（Simple NDEF Exchange Protocol，直接交换NDEF消息）、Protocol Bindings（可绑定IP、OBEX）、Other Protocols（常用CHP，Connection Handover Protocol）</div>", "backText": "SNEP（Simple NDEF Exchange Protocol，直接交换NDEF消息）、Protocol Bindings（可绑定IP、OBEX）、Other Protocols（常用CHP，Connection Handover Protocol）"}, {"id": "c728", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "LLCP要点", "back": "<ul class=\"ans-list\"><li>提供无链接（类UDP）和面向链接（类TCP，需先建立逻辑链接，处理丢包、重传、确认）两种传输服务；SNEP和CHP均使用面向链接服务</li><li>数据包格式：3字节LLCP Header（DSAP/SSAP、PTYPE、Sequence）+Payload</li><li>DSAP/SSAP为目标/源服务接入点，作用类似TCP/UDP端口号；因NFC近距离通信双方进入有效距离即已确定，无需MAC/IP地址</li><li>SAP示例：SNEP服务端监听SSAP 0x04，客户端设置DSAP=0x04发包</li><li>Link Activation（链路激活）：双方分饰Initiator/Target；Initiator发PAX（Parameter Exchange）包交换LLC配置，Target回复自己的配置，校验通过后Logical Link建立</li><li>WKS告知本机哪些Well-Known服务端口有模块监听——必须在Link Activation触发前就完成监听</li><li>面向链接流程：Client发CONNECT包→Server回CC（Connection Complete）→用I包（承载数据）和RR包（接收确认）传输</li><li>设备分开时触发Link Deactivation；链路激活/去激活可能频繁触发</li></ul>", "backText": "提供无链接（类UDP）和面向链接（类TCP，需先建立逻辑链接，处理丢包、重传、确认）两种传输服务；SNEP和CHP均使用面向链接服务; 数据包格式：3字节LLCP Header（DSAP/SSAP、PTYPE、Sequence）+Payload; DSAP/SSAP为目标/源服务接入点，作用类似TCP/UDP端口号；因NFC近距离通信双方进入有效距离即已确定，无需MAC/IP地址; SAP示例：SNEP服务端监听SSAP 0x04，客户端设置DSAP=0x04发包; Link Activation（链路激活）：双方分饰Initiator/Target；Initiator发PAX（Parameter Exchange）包交换LLC配置，Target回复自己的配置，校验通过后Logical Link建立; WKS告知本机哪些Well-Known服务端口有模块监听——必须在Link Activation触发前就完成监听"}, {"id": "c729", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "数据包格式", "back": "<div class=\"def-ans\">3字节LLCP Header（DSAP/SSAP、PTYPE、Sequence）+Payload</div>", "backText": "3字节LLCP Header（DSAP/SSAP、PTYPE、Sequence）+Payload"}, {"id": "c730", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "SAP示例", "back": "<div class=\"def-ans\">SNEP服务端监听SSAP 0x04，客户端设置DSAP=0x04发包</div>", "backText": "SNEP服务端监听SSAP 0x04，客户端设置DSAP=0x04发包"}, {"id": "c731", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "Link Activation（链路激活）", "back": "<div class=\"def-ans\">双方分饰Initiator/Target；Initiator发PAX（Parameter Exchange）包交换LLC配置，Target回复自己的配置，校验通过后Logical Link建立</div>", "backText": "双方分饰Initiator/Target；Initiator发PAX（Parameter Exchange）包交换LLC配置，Target回复自己的配置，校验通过后Logical Link建立"}, {"id": "c732", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "面向链接流程", "back": "<div class=\"def-ans\">Client发CONNECT包→Server回CC（Connection Complete）→用I包（承载数据）和RR包（接收确认）传输</div>", "backText": "Client发CONNECT包→Server回CC（Connection Complete）→用I包（承载数据）和RR包（接收确认）传输"}, {"id": "c733", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "SNEP要点", "back": "<ul class=\"ans-list\"><li>基于面向链接传输的Well-Known Service，端口号0x04，服务名\"urn:nfc:sn:snep\"</li><li>Request/Response方式：客户端发Request（如PUT/GET），服务端回Response告知处理结果</li><li>消息格式：1字节Version + Request/Response字段 + 其他</li></ul>", "backText": "基于面向链接传输的Well-Known Service，端口号0x04，服务名\"urn:nfc:sn:snep\"; Request/Response方式：客户端发Request（如PUT/GET），服务端回Response告知处理结果; 消息格式：1字节Version + Request/Response字段 + 其他"}, {"id": "c734", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "Request/Response方式", "back": "<div class=\"def-ans\">客户端发Request（如PUT/GET），服务端回Response告知处理结果</div>", "backText": "客户端发Request（如PUT/GET），服务端回Response告知处理结果"}, {"id": "c735", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "消息格式", "back": "<div class=\"def-ans\">1字节Version + Request/Response字段 + 其他</div>", "backText": "1字节Version + Request/Response字段 + 其他"}, {"id": "c736", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "8.2.4 NFC CE运行模式", "back": "<ul class=\"ans-list\"><li>CE模式使带NFC芯片的设备可充当智能卡（信用卡），应用于购票、支付、门禁卡、汽车钥匙、公交卡等</li><li>交互结构：SE（Secure Element）与NFC芯片（NFCC）通过SWP（Single Wire Protocol）或S2C（NFC-WI）交互；NFCC通过HCI协议与NFC Mobile交互，SE也可通过ISO 7816与NFC Mobile交互</li><li>CE模式中NFC Mobile被NFC Reader识别成智能卡；NFCC收到数据/命令后交给应用处理</li><li>支付类应用=提供UI的APK+运行在SE中、安全性有保障的应用程序</li><li>SE与NFC三种组合方式<ul class=\"sub\"><li>嵌入式安全芯片：出厂内置不可替换，运行小系统处理支付/安全（可参考NXP pn65芯片，其内部SmartMX模块运行Java Card OS、可装Applets）</li><li>支付型SD卡（NFC-SD方案）：SD卡嵌入安全模块，相关国际标准ISO 7816，中国银联曾主推</li><li>UICC即SIM卡（NFC-SIM方案）：运营商主推；国际上大多使用NFC-SIM方案，商品名\"闪付\"</li></ul></li><li>SWP细节（ETSI TS 102613）：CLF与UICC通过Gnd、Vcc、SWIO三线相连；SWIO速率212kbps~1.6Mbps，单包小于30字节</li><li>UICC电源由CLF提供而非手机电池——手机电池耗尽时仍可通过外部电磁感应供电，保证支付不受影响</li><li>NFC Forum没有CE相关规范</li></ul>", "backText": "CE模式使带NFC芯片的设备可充当智能卡（信用卡），应用于购票、支付、门禁卡、汽车钥匙、公交卡等; 交互结构：SE（Secure Element）与NFC芯片（NFCC）通过SWP（Single Wire Protocol）或S2C（NFC-WI）交互；NFCC通过HCI协议与NFC Mobile交互，SE也可通过ISO 7816与NFC Mobile交互; CE模式中NFC Mobile被NFC Reader识别成智能卡；NFCC收到数据/命令后交给应用处理; 支付类应用=提供UI的APK+运行在SE中、安全性有保障的应用程序; SE与NFC三种组合方式; SWP细节（ETSI TS 102613）：CLF与UICC通过Gnd、Vcc、SWIO三线相连；SWIO速率212kbps~1.6Mbps，单包小于30字节"}, {"id": "c737", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "交互结构", "back": "<div class=\"def-ans\">SE（Secure Element）与NFC芯片（NFCC）通过SWP（Single Wire Protocol）或S2C（NFC-WI）交互；NFCC通过HCI协议与NFC Mobile交互，SE也可通过ISO 7816与NFC Mobile交互</div>", "backText": "SE（Secure Element）与NFC芯片（NFCC）通过SWP（Single Wire Protocol）或S2C（NFC-WI）交互；NFCC通过HCI协议与NFC Mobile交互，SE也可通过ISO 7816与NFC Mobile交互"}, {"id": "c738", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "SE与NFC三种组合方式", "back": "<ul class=\"ans-list\"><li>嵌入式安全芯片：出厂内置不可替换，运行小系统处理支付/安全（可参考NXP pn65芯片，其内部SmartMX模块运行Java Card OS、可装Applets）</li><li>支付型SD卡（NFC-SD方案）：SD卡嵌入安全模块，相关国际标准ISO 7816，中国银联曾主推</li><li>UICC即SIM卡（NFC-SIM方案）：运营商主推；国际上大多使用NFC-SIM方案，商品名\"闪付\"</li></ul>", "backText": "嵌入式安全芯片：出厂内置不可替换，运行小系统处理支付/安全（可参考NXP pn65芯片，其内部SmartMX模块运行Java Card OS、可装Applets）; 支付型SD卡（NFC-SD方案）：SD卡嵌入安全模块，相关国际标准ISO 7816，中国银联曾主推; UICC即SIM卡（NFC-SIM方案）：运营商主推；国际上大多使用NFC-SIM方案，商品名\"闪付\""}, {"id": "c739", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "嵌入式安全芯片", "back": "<div class=\"def-ans\">出厂内置不可替换，运行小系统处理支付/安全（可参考NXP pn65芯片，其内部SmartMX模块运行Java Card OS、可装Applets）</div>", "backText": "出厂内置不可替换，运行小系统处理支付/安全（可参考NXP pn65芯片，其内部SmartMX模块运行Java Card OS、可装Applets）"}, {"id": "c740", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "支付型SD卡（NFC-SD方案）", "back": "<div class=\"def-ans\">SD卡嵌入安全模块，相关国际标准ISO 7816，中国银联曾主推</div>", "backText": "SD卡嵌入安全模块，相关国际标准ISO 7816，中国银联曾主推"}, {"id": "c741", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "UICC即SIM卡（NFC-SIM方案）", "back": "<div class=\"def-ans\">运营商主推；国际上大多使用NFC-SIM方案，商品名\"闪付\"</div>", "backText": "运营商主推；国际上大多使用NFC-SIM方案，商品名\"闪付\""}, {"id": "c742", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "SWP细节（ETSI TS 102613）", "back": "<div class=\"def-ans\">CLF与UICC通过Gnd、Vcc、SWIO三线相连；SWIO速率212kbps~1.6Mbps，单包小于30字节</div>", "backText": "CLF与UICC通过Gnd、Vcc、SWIO三线相连；SWIO速率212kbps~1.6Mbps，单包小于30字节"}, {"id": "c743", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "8.2.5 NCI原理", "back": "<ul class=\"ans-list\"><li>NCI是NFC Forum 2012年制定的规范，关注DH（Device Host，主机设备）如何控制NFCC（NFC Controller）并与之交互</li><li>传输层：NFCC与DH物理连线支持SPI、I2C、UART、USB</li><li>DH-NFCEE：DH中所有NFC相关应用视为执行环境（EE=Execution Environment）；NFCEE模块可集成在NFCC中或独立芯片连接（如SmartMX SE）</li><li>NCI模块结构：NCI Core（负责控制消息与数据消息传递、DH初始化、重置和配置NFCC）；Transport Mapping（在NCI Core与传输层之间转换数据格式）；NCI Module（含RF Discovery、RF Interface等功能模块）</li><li>工作原理：DH通过Control Message控制NFCC（Commands只能由DH发给NFCC、Responses、Notifications）；通过RF Interface与远端NFC设备交互、通过NFCEE Interface与本机NFCEE交互</li><li>NCI规范140多页；其重要作用是统一Android NFC HAL层实现</li><li>因NCI推出较晚，NXP在Android平台HAL层尚未采用；博通的HAL参考了NCI</li><li>Linux Kernel 3.8新增NFC子系统：HAL层只需通过netlink消息与内核NFC驱动交互，芯片相关代码移入Kernel，摆脱被芯片\"绑架\"</li></ul>", "backText": "NCI是NFC Forum 2012年制定的规范，关注DH（Device Host，主机设备）如何控制NFCC（NFC Controller）并与之交互; 传输层：NFCC与DH物理连线支持SPI、I2C、UART、USB; DH-NFCEE：DH中所有NFC相关应用视为执行环境（EE=Execution Environment）；NFCEE模块可集成在NFCC中或独立芯片连接（如SmartMX SE）; NCI模块结构：NCI Core（负责控制消息与数据消息传递、DH初始化、重置和配置NFCC）；Transport Mapping（在NCI Core与传输层之间转换数据格式）；NCI Module（含RF Discovery、RF Interface等功能模块）; 工作原理：DH通过Control Message控制NFCC（Commands只能由DH发给NFCC、Responses、Notifications）；通过RF Interface与远端NFC设备交互、通过NFCEE Interface与本机NFCEE交互; NCI规范140多页；其重要作用是统一Android NFC HAL层实现"}, {"id": "c744", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "传输层", "back": "<div class=\"def-ans\">NFCC与DH物理连线支持SPI、I2C、UART、USB</div>", "backText": "NFCC与DH物理连线支持SPI、I2C、UART、USB"}, {"id": "c745", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "DH-NFCEE", "back": "<div class=\"def-ans\">DH中所有NFC相关应用视为执行环境（EE=Execution Environment）；NFCEE模块可集成在NFCC中或独立芯片连接（如SmartMX SE）</div>", "backText": "DH中所有NFC相关应用视为执行环境（EE=Execution Environment）；NFCEE模块可集成在NFCC中或独立芯片连接（如SmartMX SE）"}, {"id": "c746", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "NCI模块结构", "back": "<div class=\"def-ans\">NCI Core（负责控制消息与数据消息传递、DH初始化、重置和配置NFCC）；Transport Mapping（在NCI Core与传输层之间转换数据格式）；NCI Module（含RF Discovery、RF Interface等功能模块）</div>", "backText": "NCI Core（负责控制消息与数据消息传递、DH初始化、重置和配置NFCC）；Transport Mapping（在NCI Core与传输层之间转换数据格式）；NCI Module（含RF Discovery、RF Interface等功能模块）"}, {"id": "c747", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "工作原理", "back": "<div class=\"def-ans\">DH通过Control Message控制NFCC（Commands只能由DH发给NFCC、Responses、Notifications）；通过RF Interface与远端NFC设备交互、通过NFCEE Interface与本机NFCEE交互</div>", "backText": "DH通过Control Message控制NFCC（Commands只能由DH发给NFCC、Responses、Notifications）；通过RF Interface与远端NFC设备交互、通过NFCEE Interface与本机NFCEE交互"}, {"id": "c748", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "Linux Kernel 3.8新增NFC子系统", "back": "<div class=\"def-ans\">HAL层只需通过netlink消息与内核NFC驱动交互，芯片相关代码移入Kernel，摆脱被芯片\"绑架\"</div>", "backText": "HAL层只需通过netlink消息与内核NFC驱动交互，芯片相关代码移入Kernel，摆脱被芯片\"绑架\""}, {"id": "c749", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "8.2.6 NFC相关规范", "back": "<ul class=\"ans-list\"><li>应重点掌握：NFC三种运行模式及相关的数据类型定义、协议栈、工作方式</li><li>对HAL层实现感兴趣者应研究NCI规范</li><li>NFC涉及规范非常多（RFID、ISO 14443、FeliCa、NFC Forum各规范、NCI等）</li></ul>", "backText": "应重点掌握：NFC三种运行模式及相关的数据类型定义、协议栈、工作方式; 对HAL层实现感兴趣者应研究NCI规范; NFC涉及规范非常多（RFID、ISO 14443、FeliCa、NFC Forum各规范、NCI等）"}, {"id": "c750", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.2 NFC基础知识", "front": "应重点掌握", "back": "<div class=\"def-ans\">NFC三种运行模式及相关的数据类型定义、协议栈、工作方式</div>", "backText": "NFC三种运行模式及相关的数据类型定义、协议栈、工作方式"}, {"id": "c751", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "因HAL层无统一接口，存在两套实现（Android 4.2；4.1只支持NXP）", "back": "<ul class=\"ans-list\"><li>NXP pn系列：Nfc.apk，通过nxp目录dhimpl模块与libnfc_jni、libnfc（external/libnfc-nxp）交互</li><li>博通2079x系列：NfcNci.apk，通过nci目录dhimpl模块与libnfc_nci_jni、libnfc_nci（external/libnfc-nci）交互</li><li>libnfc_jni/libnfc_nci_jni使用厂商封装的私有API，可读性差；根源是Kernel中缺乏统一的用户空间与NFC驱动交互方法</li></ul>", "backText": "NXP pn系列：Nfc.apk，通过nxp目录dhimpl模块与libnfc_jni、libnfc（external/libnfc-nxp）交互; 博通2079x系列：NfcNci.apk，通过nci目录dhimpl模块与libnfc_nci_jni、libnfc_nci（external/libnfc-nci）交互; libnfc_jni/libnfc_nci_jni使用厂商封装的私有API，可读性差；根源是Kernel中缺乏统一的用户空间与NFC驱动交互方法"}, {"id": "c752", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NXP pn系列", "back": "<div class=\"def-ans\">Nfc.apk，通过nxp目录dhimpl模块与libnfc_jni、libnfc（external/libnfc-nxp）交互</div>", "backText": "Nfc.apk，通过nxp目录dhimpl模块与libnfc_jni、libnfc（external/libnfc-nxp）交互"}, {"id": "c753", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "博通2079x系列", "back": "<div class=\"def-ans\">NfcNci.apk，通过nci目录dhimpl模块与libnfc_nci_jni、libnfc_nci（external/libnfc-nci）交互</div>", "backText": "NfcNci.apk，通过nci目录dhimpl模块与libnfc_nci_jni、libnfc_nci（external/libnfc-nci）交互"}, {"id": "c754", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "本章以Nfc.apk为主线分析", "back": "<div class=\"def-ans\">先讲NFC应用程序（客户端视角），再讲NFC系统模块</div>", "backText": "先讲NFC应用程序（客户端视角），再讲NFC系统模块"}, {"id": "c755", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "8.3.1 NFC应用示例", "back": "<ul class=\"ans-list\"><li>NFC R/W模式示例——Tag分发系统（Tag Dispatch System）<ul class=\"sub\"><li>机制：扫描到Tag后先尝试直接读取数据；NDEF消息能映射成系统支持类型（仅MIME和URI两大类）则发ACTION_NDEF_DISCOVERED；否则发ACTION_TECH_DISCOVERED（携带Tag对象）；再不行发ACTION_TAG_DISCOVERED</li><li>前台分发系统（Foreground Dispatch System）：只由当前活跃Activity在启动时设置分发条件（enableForegroundDispatch），优先分发给前台Activity，退到后台需取消（disableForegroundDispatch）</li><li>ACTION_NDEF_DISCOVERED：Intent携带NDEF消息；Android额外定义AAR（Android Application Record，NDEF中封装应用包名）——先按IntentFilter精确匹配，不匹配则启动AAR指定应用，未安装则从Google Play下载</li><li>ACTION_TECH_DISCOVERED：应用通过\"android.nfc.tech\"包（NfcA、NfcB、NfcF、NfcV、MifareClassic、Ndef、NdefFormatable等）按Tag的getTechList创建对应TagTechnology对象（connect/transceive/close）直接操作Tag；一个Tag可同时支持多种Technology（如北京公交卡=MifareClassic+NfcA+NdefFormatable）</li><li>ACTION_TAG_DISCOVERED：最后兜底，应用根据Tag的getId/getTechList自行构造处理对象</li><li>客户端关键API：NfcAdapter.getDefaultAdapter获取适配器、PendingIntent、IntentFilter、techLists、onNewIntent中处理三种Action</li></ul></li><li>NFC P2P模式示例——Android Beam<ul class=\"sub\"><li>基于SNEP协议；Android还定义了类似的NPP（Ndef Push Protocol，SAP 0x10，服务名\"com.android.npp\"），系统先用SNEP，老旧设备不支持时用NPP</li><li>发送端：Activity实现CreateNdefPushCompleteCallback/CreateNdefMessageCallback；调用setNdefPushMessageCallback和setOnNdefPushCompleteCallback；createNdefMessage返回NdefMessage</li><li>双方靠近时都弹出\"数据发送通知框\"（SendUi），由用户触摸决定谁发送</li><li>接收端：收到NDEF消息后经Tag分发系统（ACTION_NDEF_DISCOVERED）启动目标Activity，onNewIntent中setIntent、onResume中processIntent取出EXTRA_NDEF_MESSAGES</li><li>Beam还支持发送file/content类型的大数据，通过Handover选择蓝牙传输</li></ul></li><li>NFC CE模式示例<ul class=\"sub\"><li>Android SDK未直接提供CE API；系统内部提供com.android.nfc_extras.jar（位于/system/framework），应用需uses-library声明并拥有android.permission.NFC权限</li><li>权限双重检查：除NFC权限外还检查应用签名，签名须记录在/etc/nfcee_access.xml（如Google Wallet、Samsung Wallet的签名）</li><li>关键API流程：NfcAdapterExtras.get→getEmbeddedExecutionEnvironment（EE通常即SE）→setCardEmulationRoute（ROUTE_ON_WHEN_SCREEN_ON启用CE/ROUTE_OFF关闭）→mEe.open（开启后NFC其他功能如R/W、P2P被禁止）→transceive（命令格式遵循ISO 7816-4，不同芯片/SE命令不同，是CE模式难点）→close</li></ul></li></ul>", "backText": "NFC R/W模式示例——Tag分发系统（Tag Dispatch System）; NFC P2P模式示例——Android Beam; NFC CE模式示例"}, {"id": "c756", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NFC R/W模式示例——Tag分发系统（Tag Dispatch System）", "back": "<ul class=\"ans-list\"><li>机制：扫描到Tag后先尝试直接读取数据；NDEF消息能映射成系统支持类型（仅MIME和URI两大类）则发ACTION_NDEF_DISCOVERED；否则发ACTION_TECH_DISCOVERED（携带Tag对象）；再不行发ACTION_TAG_DISCOVERED</li><li>前台分发系统（Foreground Dispatch System）：只由当前活跃Activity在启动时设置分发条件（enableForegroundDispatch），优先分发给前台Activity，退到后台需取消（disableForegroundDispatch）</li><li>ACTION_NDEF_DISCOVERED：Intent携带NDEF消息；Android额外定义AAR（Android Application Record，NDEF中封装应用包名）——先按IntentFilter精确匹配，不匹配则启动AAR指定应用，未安装则从Google Play下载</li><li>ACTION_TECH_DISCOVERED：应用通过\"android.nfc.tech\"包（NfcA、NfcB、NfcF、NfcV、MifareClassic、Ndef、NdefFormatable等）按Tag的getTechList创建对应TagTechnology对象（connect/transceive/close）直接操作Tag；一个Tag可同时支持多种Technology（如北京公交卡=MifareClassic+NfcA+NdefFormatable）</li><li>ACTION_TAG_DISCOVERED：最后兜底，应用根据Tag的getId/getTechList自行构造处理对象</li><li>客户端关键API：NfcAdapter.getDefaultAdapter获取适配器、PendingIntent、IntentFilter、techLists、onNewIntent中处理三种Action</li></ul>", "backText": "机制：扫描到Tag后先尝试直接读取数据；NDEF消息能映射成系统支持类型（仅MIME和URI两大类）则发ACTION_NDEF_DISCOVERED；否则发ACTION_TECH_DISCOVERED（携带Tag对象）；再不行发ACTION_TAG_DISCOVERED; 前台分发系统（Foreground Dispatch System）：只由当前活跃Activity在启动时设置分发条件（enableForegroundDispatch），优先分发给前台Activity，退到后台需取消（disableForegroundDispatch）; ACTION_NDEF_DISCOVERED：Intent携带NDEF消息；Android额外定义AAR（Android Application Record，NDEF中封装应用包名）——先按IntentFilter精确匹配，不匹配则启动AAR指定应用，未安装则从Google Play下载; ACTION_TECH_DISCOVERED：应用通过\"android.nfc.tech\"包（NfcA、NfcB、NfcF、NfcV、MifareClassic、Ndef、NdefFormatable等）按Tag的getTechList创建对应TagTechnology对象（connect/transceive/close）直接操作Tag；一个Tag可同时支持多种Technology（如北京公交卡=MifareClassic+NfcA+NdefFormatable）; ACTION_TAG_DISCOVERED：最后兜底，应用根据Tag的getId/getTechList自行构造处理对象; 客户端关键API：NfcAdapter.getDefaultAdapter获取适配器、PendingIntent、IntentFilter、techLists、onNewIntent中处理三种Action"}, {"id": "c757", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "机制", "back": "<div class=\"def-ans\">扫描到Tag后先尝试直接读取数据；NDEF消息能映射成系统支持类型（仅MIME和URI两大类）则发ACTION_NDEF_DISCOVERED；否则发ACTION_TECH_DISCOVERED（携带Tag对象）；再不行发ACTION_TAG_DISCOVERED</div>", "backText": "扫描到Tag后先尝试直接读取数据；NDEF消息能映射成系统支持类型（仅MIME和URI两大类）则发ACTION_NDEF_DISCOVERED；否则发ACTION_TECH_DISCOVERED（携带Tag对象）；再不行发ACTION_TAG_DISCOVERED"}, {"id": "c758", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "ACTION_NDEF_DISCOVERED", "back": "<div class=\"def-ans\">Intent携带NDEF消息；Android额外定义AAR（Android Application Record，NDEF中封装应用包名）——先按IntentFilter精确匹配，不匹配则启动AAR指定应用，未安装则从Google Play下载</div>", "backText": "Intent携带NDEF消息；Android额外定义AAR（Android Application Record，NDEF中封装应用包名）——先按IntentFilter精确匹配，不匹配则启动AAR指定应用，未安装则从Google Play下载"}, {"id": "c759", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "ACTION_TECH_DISCOVERED", "back": "<div class=\"def-ans\">应用通过\"android.nfc.tech\"包（NfcA、NfcB、NfcF、NfcV、MifareClassic、Ndef、NdefFormatable等）按Tag的getTechList创建对应TagTechnology对象（connect/transceive/close）直接操作Tag；一个Tag可同时支持多种Technology（如北京公交卡=MifareClassic+NfcA+NdefFormatable）</div>", "backText": "应用通过\"android.nfc.tech\"包（NfcA、NfcB、NfcF、NfcV、MifareClassic、Ndef、NdefFormatable等）按Tag的getTechList创建对应TagTechnology对象（connect/transceive/close）直接操作Tag；一个Tag可同时支持多种Technology（如北京公交卡=MifareClassic+NfcA+NdefFormatable）"}, {"id": "c760", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "ACTION_TAG_DISCOVERED", "back": "<div class=\"def-ans\">最后兜底，应用根据Tag的getId/getTechList自行构造处理对象</div>", "backText": "最后兜底，应用根据Tag的getId/getTechList自行构造处理对象"}, {"id": "c761", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "客户端关键API", "back": "<div class=\"def-ans\">NfcAdapter.getDefaultAdapter获取适配器、PendingIntent、IntentFilter、techLists、onNewIntent中处理三种Action</div>", "backText": "NfcAdapter.getDefaultAdapter获取适配器、PendingIntent、IntentFilter、techLists、onNewIntent中处理三种Action"}, {"id": "c762", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NFC P2P模式示例——Android Beam", "back": "<ul class=\"ans-list\"><li>基于SNEP协议；Android还定义了类似的NPP（Ndef Push Protocol，SAP 0x10，服务名\"com.android.npp\"），系统先用SNEP，老旧设备不支持时用NPP</li><li>发送端：Activity实现CreateNdefPushCompleteCallback/CreateNdefMessageCallback；调用setNdefPushMessageCallback和setOnNdefPushCompleteCallback；createNdefMessage返回NdefMessage</li><li>双方靠近时都弹出\"数据发送通知框\"（SendUi），由用户触摸决定谁发送</li><li>接收端：收到NDEF消息后经Tag分发系统（ACTION_NDEF_DISCOVERED）启动目标Activity，onNewIntent中setIntent、onResume中processIntent取出EXTRA_NDEF_MESSAGES</li><li>Beam还支持发送file/content类型的大数据，通过Handover选择蓝牙传输</li></ul>", "backText": "基于SNEP协议；Android还定义了类似的NPP（Ndef Push Protocol，SAP 0x10，服务名\"com.android.npp\"），系统先用SNEP，老旧设备不支持时用NPP; 发送端：Activity实现CreateNdefPushCompleteCallback/CreateNdefMessageCallback；调用setNdefPushMessageCallback和setOnNdefPushCompleteCallback；createNdefMessage返回NdefMessage; 双方靠近时都弹出\"数据发送通知框\"（SendUi），由用户触摸决定谁发送; 接收端：收到NDEF消息后经Tag分发系统（ACTION_NDEF_DISCOVERED）启动目标Activity，onNewIntent中setIntent、onResume中processIntent取出EXTRA_NDEF_MESSAGES; Beam还支持发送file/content类型的大数据，通过Handover选择蓝牙传输"}, {"id": "c763", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "发送端", "back": "<div class=\"def-ans\">Activity实现CreateNdefPushCompleteCallback/CreateNdefMessageCallback；调用setNdefPushMessageCallback和setOnNdefPushCompleteCallback；createNdefMessage返回NdefMessage</div>", "backText": "Activity实现CreateNdefPushCompleteCallback/CreateNdefMessageCallback；调用setNdefPushMessageCallback和setOnNdefPushCompleteCallback；createNdefMessage返回NdefMessage"}, {"id": "c764", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "接收端", "back": "<div class=\"def-ans\">收到NDEF消息后经Tag分发系统（ACTION_NDEF_DISCOVERED）启动目标Activity，onNewIntent中setIntent、onResume中processIntent取出EXTRA_NDEF_MESSAGES</div>", "backText": "收到NDEF消息后经Tag分发系统（ACTION_NDEF_DISCOVERED）启动目标Activity，onNewIntent中setIntent、onResume中processIntent取出EXTRA_NDEF_MESSAGES"}, {"id": "c765", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NFC CE模式示例", "back": "<ul class=\"ans-list\"><li>Android SDK未直接提供CE API；系统内部提供com.android.nfc_extras.jar（位于/system/framework），应用需uses-library声明并拥有android.permission.NFC权限</li><li>权限双重检查：除NFC权限外还检查应用签名，签名须记录在/etc/nfcee_access.xml（如Google Wallet、Samsung Wallet的签名）</li><li>关键API流程：NfcAdapterExtras.get→getEmbeddedExecutionEnvironment（EE通常即SE）→setCardEmulationRoute（ROUTE_ON_WHEN_SCREEN_ON启用CE/ROUTE_OFF关闭）→mEe.open（开启后NFC其他功能如R/W、P2P被禁止）→transceive（命令格式遵循ISO 7816-4，不同芯片/SE命令不同，是CE模式难点）→close</li></ul>", "backText": "Android SDK未直接提供CE API；系统内部提供com.android.nfc_extras.jar（位于/system/framework），应用需uses-library声明并拥有android.permission.NFC权限; 权限双重检查：除NFC权限外还检查应用签名，签名须记录在/etc/nfcee_access.xml（如Google Wallet、Samsung Wallet的签名）; 关键API流程：NfcAdapterExtras.get→getEmbeddedExecutionEnvironment（EE通常即SE）→setCardEmulationRoute（ROUTE_ON_WHEN_SCREEN_ON启用CE/ROUTE_OFF关闭）→mEe.open（开启后NFC其他功能如R/W、P2P被禁止）→transceive（命令格式遵循ISO 7816-4，不同芯片/SE命令不同，是CE模式难点）→close"}, {"id": "c766", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "权限双重检查", "back": "<div class=\"def-ans\">除NFC权限外还检查应用签名，签名须记录在/etc/nfcee_access.xml（如Google Wallet、Samsung Wallet的签名）</div>", "backText": "除NFC权限外还检查应用签名，签名须记录在/etc/nfcee_access.xml（如Google Wallet、Samsung Wallet的签名）"}, {"id": "c767", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "关键API流程", "back": "<div class=\"def-ans\">NfcAdapterExtras.get→getEmbeddedExecutionEnvironment（EE通常即SE）→setCardEmulationRoute（ROUTE_ON_WHEN_SCREEN_ON启用CE/ROUTE_OFF关闭）→mEe.open（开启后NFC其他功能如R/W、P2P被禁止）→transceive（命令格式遵循ISO 7816-4，不同芯片/SE命令不同，是CE模式难点）→close</div>", "backText": "NfcAdapterExtras.get→getEmbeddedExecutionEnvironment（EE通常即SE）→setCardEmulationRoute（ROUTE_ON_WHEN_SCREEN_ON启用CE/ROUTE_OFF关闭）→mEe.open（开启后NFC其他功能如R/W、P2P被禁止）→transceive（命令格式遵循ISO 7816-4，不同芯片/SE命令不同，是CE模式难点）→close"}, {"id": "c768", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "8.3.2 NFC系统模块", "back": "<ul class=\"ans-list\"><li>NfcService介绍<ul class=\"sub\"><li>NfcApplication.onCreate中创建核心NfcService；NfcService构造函数创建核心成员</li><li>核心成员：mNfcTagService（TagService，与NFC Tag交互）、mNfcAdapter（NfcAdapterService，与其他NFC客户端交互）、mExtrasService（NfcAdapterExtrasService，与CE客户端交互）、mDeviceHost（NativeNfcManager，与芯片厂商模块交互）、HandoverManager（Connection Handover）、mNfcDispatcher（NfcDispatcher，派发Tag通知）、mP2pLinkManager（LLCP相关工作）、mSecureElement（NativeNfcSecureElement，与SE交互）、mNfceeAccessControl（读/etc/nfcee_access.xml判权限）</li><li>向ServiceManager注册名为\"nfc\"的Binder服务；通过EnableDisableTask（TASK_BOOT）完成初始化</li></ul></li><li>客户端Binder接口对应关系：NfcAdapter.sService（INfcAdapter↔NfcService.NfcAdapterService）、NfcAdapter.sTagService（INfcTag↔TagService）、NfcAdapterExtras.sService（INfcAdapterExtras↔NfcAdapterExtrasService）</li><li>解耦设计：DeviceHost接口族（DeviceHost、TagEndpoint、NfcDepEndpoint、LlcpSocket、LlcpServerSocket、DeviceHostListener等）将芯片无关逻辑与芯片相关逻辑分离；Native*类在nxp目录与NXP芯片绑定；DeviceHostListener由Native层向NfcService上报事件（onRemoteEndpointDiscovered发现Tag、onLlcpActivited链路激活等）</li><li>P2pLinkManager包含三个Server：SnepServer（SNEP，SAP 0x04）、NdefPushServer（NPP）、HandoverServer；P2pEventManager处理用户交互（震动、提示音）；SendUi显示\"触摸即可发送\"界面</li><li>enableInternal流程：启动WatchDog线程监视底层操作超时→mDeviceHost.initialize()初始化底层→P2pLinkManager.enableDisable启动SnepServer/NdefPushServer/HandoverServer→updateState(STATE_ON)→initSoundPool→applyRouting启动Polling流程</li><li>SnepServer.start：创建ServerThread循环createLlcpServerSocket（SAP 0x04、服务名urn:nfc:sn:snep）→accept等待客户端→按对端MIU确定分片长度→每个连接创建一个ConnectionThread</li><li>NFC Tag处理流程（notifyNdefMessageListeners）<ul class=\"sub\"><li>NativeNfcManager.notifyNdefMessageListeners（由libnfc_jni在JNI层调用）→DeviceHostListener.onRemoteEndpointDiscovered→NfcService发MSG_NDEF_TAG消息</li><li>NfcServiceHandler处理：playSound→tag.findAndReadNdef()读取NDEF→startPresenceChecking（检测Tag是否在有效距离内）→dispatchTagEndpoint</li><li>dispatchTagEndpoint：构造客户端Tag对象并注册→NfcDispatcher.dispatchTag</li><li>NfcDispatcher.dispatchTag：构造DispatchInfo（Intent携带EXTRA_TAG、EXTRA_ID、EXTRA_NDEF_MESSAGES）→tryOverrides处理前台分发→mHandoverManager.tryHandover→tryNdef（ACTION_NDEF_DISCOVERED，含AAR精确匹配→getLaunchIntentForPackage→market://下载Intent）→tryTech（ACTION_TECH_DISCOVERED）→setTagIntent+tryStartActivity（ACTION_TAG_DISCOVERED，查PackageManagerService）</li></ul></li><li>Android Beam工作流程（notifyLlcpLinkActivation）<ul class=\"sub\"><li>notifyLlcpLinkActivation→onLlcpLinkActivated→MSG_LLCP_LINK_ACTIVATION→llcpActivated：对端为Target则先connect，再doCheckLlcp/doActivateLlcp激活链路，调P2pLinkManager.onLlcpActivated</li><li>onLlcpActivated：链路状态置UP→mEventListener.onP2pInRange（提示音、SendUi截屏）→prepareMessageToSend：有回调则从CreateNdefMessageCallback取数据；无回调则取前台应用包名createDefaultNdef构造含两条Record的NDEF（URI指向Play商店+AAR包名）→onP2pSendConfirmationRequested显示确认界面</li><li>发送：SendUi.onTouch→P2pEventManager.onSendConfirmed→P2pLinkManager.onP2pSendConfirmed→sendNdefMessage创建SendTask→doSnepProtocol：SnepClient.connect→snepClient.put（SNEP PUT请求）；SNEP失败则用NPP（NdefPushClient.push）重试</li><li>接收：SnepServer.ConnectionThread→handleRequest（校验Version，处理REQUEST_GET/REQUEST_PUT）→Callback.doPut→onReceiveComplete→MSG_RECEIVE_COMPLETE→P2pEventManager取消SendUi→NfcService.sendMockNdefTag发MSG_MOCK_NDEF→创建模拟Tag对象（Tag.createMockTag）→复用Tag分发系统分发给目标应用</li></ul></li><li>CE模式处理<ul class=\"sub\"><li>通过NfcAdapterExtras为CE客户端提供INfcAdapterExtras实现</li><li>NativeNfcManager的CE相关回调：notifyTargetDeselected（NFCIP-1的DESELECT命令）、notifyTransactionListeners（AID被选中，AID代表SE上的Applet）、notifySeFieldActivated/Deactivated、notifySeApduReceived（收到APDU命令）、notifySeEmvCardRemoval（EMV为Europay/MasterCard/Visa制定的IC卡金融支付标准）、notifySeMifareAccess（NXP芯片专用）</li><li>NfcService对CE处理很简单：接收底层通知事件并转化为广播（如ACTION_EMV_CARD_REMOVAL）发给感兴趣的应用</li></ul></li><li>模块总结：芯片无关模块难度不大；芯片相关模块（com.android.nfc.dhimpl包）难度大，需结合芯片手册研究</li></ul>", "backText": "NfcService介绍; 客户端Binder接口对应关系：NfcAdapter.sService（INfcAdapter↔NfcService.NfcAdapterService）、NfcAdapter.sTagService（INfcTag↔TagService）、NfcAdapterExtras.sService（INfcAdapterExtras↔NfcAdapterExtrasService）; 解耦设计：DeviceHost接口族（DeviceHost、TagEndpoint、NfcDepEndpoint、LlcpSocket、LlcpServerSocket、DeviceHostListener等）将芯片无关逻辑与芯片相关逻辑分离；Native*类在nxp目录与NXP芯片绑定；DeviceHostListener由Native层向NfcService上报事件（onRemoteEndpointDiscovered发现Tag、onLlcpActivited链路激活等）; P2pLinkManager包含三个Server：SnepServer（SNEP，SAP 0x04）、NdefPushServer（NPP）、HandoverServer；P2pEventManager处理用户交互（震动、提示音）；SendUi显示\"触摸即可发送\"界面; enableInternal流程：启动WatchDog线程监视底层操作超时→mDeviceHost.initialize()初始化底层→P2pLinkManager.enableDisable启动SnepServer/NdefPushServer/HandoverServer→updateState(STATE_ON)→initSoundPool→applyRouting启动Polling流程; SnepServer.start：创建ServerThread循环createLlcpServerSocket（SAP 0x04、服务名urn:nfc:sn:snep）→accept等待客户端→按对端MIU确定分片长度→每个连接创建一个ConnectionThread"}, {"id": "c769", "type": "outline", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "NfcService介绍", "back": "<ul class=\"ans-list\"><li>NfcApplication.onCreate中创建核心NfcService；NfcService构造函数创建核心成员</li><li>核心成员：mNfcTagService（TagService，与NFC Tag交互）、mNfcAdapter（NfcAdapterService，与其他NFC客户端交互）、mExtrasService（NfcAdapterExtrasService，与CE客户端交互）、mDeviceHost（NativeNfcManager，与芯片厂商模块交互）、HandoverManager（Connection Handover）、mNfcDispatcher（NfcDispatcher，派发Tag通知）、mP2pLinkManager（LLCP相关工作）、mSecureElement（NativeNfcSecureElement，与SE交互）、mNfceeAccessControl（读/etc/nfcee_access.xml判权限）</li><li>向ServiceManager注册名为\"nfc\"的Binder服务；通过EnableDisableTask（TASK_BOOT）完成初始化</li></ul>", "backText": "NfcApplication.onCreate中创建核心NfcService；NfcService构造函数创建核心成员; 核心成员：mNfcTagService（TagService，与NFC Tag交互）、mNfcAdapter（NfcAdapterService，与其他NFC客户端交互）、mExtrasService（NfcAdapterExtrasService，与CE客户端交互）、mDeviceHost（NativeNfcManager，与芯片厂商模块交互）、HandoverManager（Connection Handover）、mNfcDispatcher（NfcDispatcher，派发Tag通知）、mP2pLinkManager（LLCP相关工作）、mSecureElement（NativeNfcSecureElement，与SE交互）、mNfceeAccessControl（读/etc/nfcee_access.xml判权限）; 向ServiceManager注册名为\"nfc\"的Binder服务；通过EnableDisableTask（TASK_BOOT）完成初始化"}, {"id": "c770", "type": "def", "part": "NFC 篇", "partColor": "#059669", "chapter": "第8章 深入理解NFC", "section": "8.3 Android中的NFC", "front": "核心成员", "back": "<div class=\"def-ans\">mNfcTagService（TagService，与NFC Tag交互）、mNfcAdapter（NfcAdapterService，与其他NFC客户端交互）、mExtrasService（NfcAdapterExtrasService，与CE客户端交互）、mDeviceHost（NativeNfcManager，与芯片厂商模块交互）、HandoverManager（Connection Handover）、mNfcDispatcher（NfcDispatcher，派发Tag通知）、mP2pLinkManager（LLCP相关工作）、mSecureElement（NativeNfcSecureElement，与SE交互）、mNfceeAccessControl（读/etc/nfcee_access.xml判权限）</div>", "backText": "mNfcTagService（TagService，与NFC Tag交互）、mNfcAdapter（NfcAdapterService，与其他NFC客户端交互）、mExtrasService（NfcAdapterExtrasService，与CE客户端交互）、mDeviceHost（NativeNfcManager，与芯片厂商模块交互）、HandoverManager（Connection Handover）、mNfcDispatcher（NfcDispatcher，派发Tag通知）、mP2pLinkManager（LLCP相关工作）、mSecureElement（NativeNfcSecureElement，与SE交互）、mNfceeAccessControl（读/e
