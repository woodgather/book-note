模块，在二者间转换MAC帧，目前功能由AP实现"}, {"id": "c196", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "QoS BSS", "back": "<div class=\"def-ans\">在WLAN中支持QoS需求的扩展，实现复杂、效果不如LAN</div>", "backText": "在WLAN中支持QoS需求的扩展，实现复杂、效果不如LAN"}, {"id": "c197", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.4 802.11 Service介绍", "back": "<ul class=\"ans-list\"><li>服务分类：按模块分SS（Station Service）与DSS（Distribution System Service）；按功能分：6种支持MSDU传输、3种访问控制与数据机密性、2种频谱管理、1种QoS、1种时间同步、1种无线电测量</li><li>数据传输服务（6种）<ul class=\"sub\"><li>Distribution Service：STA传送任何数据都会使用；AP收到帧后经DS传输到目的地</li><li>Integration Service：当DSS发现目的端为LAN时，经Portal转换无线数据发送到有线网（家用无线路由器即实现了此功能）</li><li>Transition Type分类：No-Transition、BSS-Transition（ESS内BSS间切换）、ESS-Transition（跨ESS切换）</li><li>association（关联）：STA传输数据前必须与AP建立映射关系；一个STA同一时刻只能关联一个AP</li><li>reassociation（重新关联）：STA发生transition时切换关联关系，只能由STA发起</li><li>disassociation（取消关联）：STA和AP均可发起</li></ul></li><li>访问控制和数据机密性服务（3种）：Authentication/Deauthentication；Confidentiality（加密方法有WEP、TKIP、CCMP）</li><li>频谱管理服务（2种，均针对5GHz频段）：TPC（传输功率控制，避免干扰卫星）；DFS（动态频率选择，避免干扰雷达）</li><li>QoS服务、时间同步服务（TSF机制）、无线电测量服务（查询周围AP信息，源自802.11k）</li><li>最关键的三个服务：数据传输、安全相关、无线电测量（用于发现周围AP）</li><li>Service的具体调用通过发送不同的MAC帧触发；与service直接相关的是管理帧</li></ul>", "backText": "服务分类：按模块分SS（Station Service）与DSS（Distribution System Service）；按功能分：6种支持MSDU传输、3种访问控制与数据机密性、2种频谱管理、1种QoS、1种时间同步、1种无线电测量; 数据传输服务（6种）; 访问控制和数据机密性服务（3种）：Authentication/Deauthentication；Confidentiality（加密方法有WEP、TKIP、CCMP）; 频谱管理服务（2种，均针对5GHz频段）：TPC（传输功率控制，避免干扰卫星）；DFS（动态频率选择，避免干扰雷达）; QoS服务、时间同步服务（TSF机制）、无线电测量服务（查询周围AP信息，源自802.11k）; 最关键的三个服务：数据传输、安全相关、无线电测量（用于发现周围AP）"}, {"id": "c198", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "服务分类", "back": "<div class=\"def-ans\">按模块分SS（Station Service）与DSS（Distribution System Service）；按功能分：6种支持MSDU传输、3种访问控制与数据机密性、2种频谱管理、1种QoS、1种时间同步、1种无线电测量</div>", "backText": "按模块分SS（Station Service）与DSS（Distribution System Service）；按功能分：6种支持MSDU传输、3种访问控制与数据机密性、2种频谱管理、1种QoS、1种时间同步、1种无线电测量"}, {"id": "c199", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "数据传输服务（6种）", "back": "<ul class=\"ans-list\"><li>Distribution Service：STA传送任何数据都会使用；AP收到帧后经DS传输到目的地</li><li>Integration Service：当DSS发现目的端为LAN时，经Portal转换无线数据发送到有线网（家用无线路由器即实现了此功能）</li><li>Transition Type分类：No-Transition、BSS-Transition（ESS内BSS间切换）、ESS-Transition（跨ESS切换）</li><li>association（关联）：STA传输数据前必须与AP建立映射关系；一个STA同一时刻只能关联一个AP</li><li>reassociation（重新关联）：STA发生transition时切换关联关系，只能由STA发起</li><li>disassociation（取消关联）：STA和AP均可发起</li></ul>", "backText": "Distribution Service：STA传送任何数据都会使用；AP收到帧后经DS传输到目的地; Integration Service：当DSS发现目的端为LAN时，经Portal转换无线数据发送到有线网（家用无线路由器即实现了此功能）; Transition Type分类：No-Transition、BSS-Transition（ESS内BSS间切换）、ESS-Transition（跨ESS切换）; association（关联）：STA传输数据前必须与AP建立映射关系；一个STA同一时刻只能关联一个AP; reassociation（重新关联）：STA发生transition时切换关联关系，只能由STA发起; disassociation（取消关联）：STA和AP均可发起"}, {"id": "c200", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Distribution Service", "back": "<div class=\"def-ans\">STA传送任何数据都会使用；AP收到帧后经DS传输到目的地</div>", "backText": "STA传送任何数据都会使用；AP收到帧后经DS传输到目的地"}, {"id": "c201", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Integration Service", "back": "<div class=\"def-ans\">当DSS发现目的端为LAN时，经Portal转换无线数据发送到有线网（家用无线路由器即实现了此功能）</div>", "backText": "当DSS发现目的端为LAN时，经Portal转换无线数据发送到有线网（家用无线路由器即实现了此功能）"}, {"id": "c202", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Transition Type分类", "back": "<div class=\"def-ans\">No-Transition、BSS-Transition（ESS内BSS间切换）、ESS-Transition（跨ESS切换）</div>", "backText": "No-Transition、BSS-Transition（ESS内BSS间切换）、ESS-Transition（跨ESS切换）"}, {"id": "c203", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "association（关联）", "back": "<div class=\"def-ans\">STA传输数据前必须与AP建立映射关系；一个STA同一时刻只能关联一个AP</div>", "backText": "STA传输数据前必须与AP建立映射关系；一个STA同一时刻只能关联一个AP"}, {"id": "c204", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "reassociation（重新关联）", "back": "<div class=\"def-ans\">STA发生transition时切换关联关系，只能由STA发起</div>", "backText": "STA发生transition时切换关联关系，只能由STA发起"}, {"id": "c205", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "disassociation（取消关联）", "back": "<div class=\"def-ans\">STA和AP均可发起</div>", "backText": "STA和AP均可发起"}, {"id": "c206", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "访问控制和数据机密性服务（3种）", "back": "<div class=\"def-ans\">Authentication/Deauthentication；Confidentiality（加密方法有WEP、TKIP、CCMP）</div>", "backText": "Authentication/Deauthentication；Confidentiality（加密方法有WEP、TKIP、CCMP）"}, {"id": "c207", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "最关键的三个服务", "back": "<div class=\"def-ans\">数据传输、安全相关、无线电测量（用于发现周围AP）</div>", "backText": "数据传输、安全相关、无线电测量（用于发现周围AP）"}, {"id": "c208", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.5 802.11 MAC服务和帧", "back": "<ul class=\"ans-list\"><li>MAC服务定义（三种服务/原语）<ul class=\"sub\"><li>MA-UNITDATA.request：LLC发送数据；参数含源/目标MAC地址、data（MSDU，不超过2304字节）、priority（用户优先级UP）、service class</li><li>MA-UNITDATA.indication：MAC收到完整、安全校验无误的帧后通知LLC接收；reception status对802.11永远返回success</li><li>MA-UNITDATA-STATUS.indication：返回request处理结果；transmission status为Successful或Undeliverable</li></ul></li><li>MAC帧基本格式<ul class=\"sub\"><li>三大组成：MAC Header（Frame Control 2字节、Duration、Address等）、Frame Body（最长2312字节）、FCS（帧校验序列）</li><li>QoS数据帧附加QoS Control字段，HT数据帧附加HT Control字段</li></ul></li><li>Frame Control域（2字节16位）：Protocol Version（当前为0）；Type/Subtype（控制、数据、管理三类帧）；To DS/From DS；More Fragments（分片）；Retry（重传）；Power Management（省电）；More Data；Protected Frame（加密）；Order（按序处理）</li><li>省电模式（Power Save）<ul class=\"sub\"><li>STA分Active与PS两种状态，PS下关闭收发器省电</li><li>AP须记录关联STA的电源状态并缓存其数据（每个STA分配AID）；定时发送数据缓存状态</li><li>STA通过PS-POLL控制帧获取缓存数据，一次取一帧；More Data=1表示仍有缓存帧</li></ul></li><li>Duration/ID域（2字节）：PS-POLL帧中表示AID（取值1～2007）；其他帧表示距下一帧到来的微秒数</li><li>Address域<ul class=\"sub\"><li>MAC地址6字节：前24位OUI（厂商代码），后24位厂商唯一编号；第48位区分单播/组播；第47位为G/L位（全球/本地唯一）</li><li>字节序Big-endian、比特序Little-endian（以太网传输时二者不一致）</li><li>规范定义五种地址：BSSID、DA（最终接收者）、SA（最初发出者）、TA（发到WM的发送端）、RA（接收端）</li><li>帧头有4个Address域：Address 1=接收端、Address 2=发送端、Address 3=辅助信息、Address 4用于无线桥接（或Mesh）</li><li>IBSS中Address 3为BSSID；去往DS时SA=TA、RA=BSSID；来自DS时RA=DA、TA=BSSID</li></ul></li><li>Sequence Control域（16位）：前4位Fragment Number，后12位Sequence Number；控制帧无编号，重传帧不使用新编号</li><li>控制帧：RTS（Duration=数据/管理帧+CTS+ACK+3 SIFS）、CTS、ACK、PS-POLL；另有CF-End等</li><li>管理帧<ul class=\"sub\"><li>所有管理帧含MAC Header的6个域，Frame Body携带管理信息：定长字段（Fixed Field）与信息元素（IE）</li><li>定长字段：Authentication Algorithm Number（0开放系统、1共享密钥、2快速BSS切换、3 SAE）；Beacon Interval（单位TU=1024微秒，一般100 TU）；Capability Information；Listen Interval；AID；Reason Code（67个取值）；Status Code</li><li>IE结构：Element ID + Length + Information；结构递归嵌套（Subelement）</li><li>常用管理帧：Beacon（AP定时发送宣告网络存在，即网络心跳）；Probe Request/Response（STA主动搜索网络）；Association Request/Response；Authentication帧</li><li>管理帧共15种，定长字段42种，IE达120种</li></ul></li><li>数据帧：QoS Control与HT Control仅QoS/HT时出现</li><li>上层协议封装：Ethernet帧经RFC 1042转换为LLC帧——增加SNAP header（DSAP、SSAP、Control=0x03、OUI=0x000000）；也支持802.1h封装</li><li>Radiotap头：网卡添加在MAC头前的数据，记录信号强度、噪声强度、传输速率等物理层信息（AirPcap+Wireshark是常用的抓包分析手段）</li></ul>", "backText": "MAC服务定义（三种服务/原语）; MAC帧基本格式; Frame Control域（2字节16位）：Protocol Version（当前为0）；Type/Subtype（控制、数据、管理三类帧）；To DS/From DS；More Fragments（分片）；Retry（重传）；Power Management（省电）；More Data；Protected Frame（加密）；Order（按序处理）; 省电模式（Power Save）; Duration/ID域（2字节）：PS-POLL帧中表示AID（取值1～2007）；其他帧表示距下一帧到来的微秒数; Address域"}, {"id": "c209", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MAC服务定义（三种服务/原语）", "back": "<ul class=\"ans-list\"><li>MA-UNITDATA.request：LLC发送数据；参数含源/目标MAC地址、data（MSDU，不超过2304字节）、priority（用户优先级UP）、service class</li><li>MA-UNITDATA.indication：MAC收到完整、安全校验无误的帧后通知LLC接收；reception status对802.11永远返回success</li><li>MA-UNITDATA-STATUS.indication：返回request处理结果；transmission status为Successful或Undeliverable</li></ul>", "backText": "MA-UNITDATA.request：LLC发送数据；参数含源/目标MAC地址、data（MSDU，不超过2304字节）、priority（用户优先级UP）、service class; MA-UNITDATA.indication：MAC收到完整、安全校验无误的帧后通知LLC接收；reception status对802.11永远返回success; MA-UNITDATA-STATUS.indication：返回request处理结果；transmission status为Successful或Undeliverable"}, {"id": "c210", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MA-UNITDATA.request", "back": "<div class=\"def-ans\">LLC发送数据；参数含源/目标MAC地址、data（MSDU，不超过2304字节）、priority（用户优先级UP）、service class</div>", "backText": "LLC发送数据；参数含源/目标MAC地址、data（MSDU，不超过2304字节）、priority（用户优先级UP）、service class"}, {"id": "c211", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MA-UNITDATA.indication", "back": "<div class=\"def-ans\">MAC收到完整、安全校验无误的帧后通知LLC接收；reception status对802.11永远返回success</div>", "backText": "MAC收到完整、安全校验无误的帧后通知LLC接收；reception status对802.11永远返回success"}, {"id": "c212", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MA-UNITDATA-STATUS.indication", "back": "<div class=\"def-ans\">返回req 63eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "定长字段", "back": "<div class=\"def-ans\">Authentication Algorithm Number（0开放系统、1共享密钥、2快速BSS切换、3 SAE）；Beacon Interval（单位TU=1024微秒，一般100 TU）；Capability Information；Listen Interval；AID；Reason Code（67个取值）；Status Code</div>", "backText": "Authentication Algorithm Number（0开放系统、1共享密钥、2快速BSS切换、3 SAE）；Beacon Interval（单位TU=1024微秒，一般100 TU）；Capability Information；Listen Interval；AID；Reason Code（67个取值）；Status Code"}, {"id": "c226", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "IE结构", "back": "<div class=\"def-ans\">Element ID + Length + Information；结构递归嵌套（Subelement）</div>", "backText": "Element ID + Length + Information；结构递归嵌套（Subelement）"}, {"id": "c227", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "常用管理帧", "back": "<div class=\"def-ans\">Beacon（AP定时发送宣告网络存在，即网络心跳）；Probe Request/Response（STA主动搜索网络）；Association Request/Response；Authentication帧</div>", "backText": "Beacon（AP定时发送宣告网络存在，即网络心跳）；Probe Request/Response（STA主动搜索网络）；Association Request/Response；Authentication帧"}, {"id": "c228", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "数据帧", "back": "<div class=\"def-ans\">QoS Control与HT Control仅QoS/HT时出现</div>", "backText": "QoS Control与HT Control仅QoS/HT时出现"}, {"id": "c229", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "上层协议封装", "back": "<div class=\"def-ans\">Ethernet帧经RFC 1042转换为LLC帧——增加SNAP header（DSAP、SSAP、Control=0x03、OUI=0x000000）；也支持802.1h封装</div>", "backText": "Ethernet帧经RFC 1042转换为LLC帧——增加SNAP header（DSAP、SSAP、Control=0x03、OUI=0x000000）；也支持802.1h封装"}, {"id": "c230", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Radiotap头", "back": "<div class=\"def-ans\">网卡添加在MAC头前的数据，记录信号强度、噪声强度、传输速率等物理层信息（AirPcap+Wireshark是常用的抓包分析手段）</div>", "backText": "网卡添加在MAC头前的数据，记录信号强度、噪声强度、传输速率等物理层信息（AirPcap+Wireshark是常用的抓包分析手段）"}, {"id": "c231", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.6 802.11 MAC管理实体", "back": "<ul class=\"ans-list\"><li>Entity模型：MAC_SAP为LLC服务；MLME（MAC子层管理实体）提供MLME_SAP；PHY细分PLCP和PMD；PLME提供PLME_SAP；SME（Station Management Entity）独立于MAC/PHY</li><li>MLME_SAP共82个原语，相当于定义了一套接口函数，wpa_supplicant是对它们的实现；常用原语：Scan、Authenticate、Associate</li><li>MLME-SCAN<ul class=\"sub\"><li>request关键参数：BSSType、BSSID、SSID（长度0为wild ssid）、ScanType（ACTIVE/PASSIVE）、ProbeDelay、ChannelList、MinChannelTime/MaxChannelTime</li><li>ACTIVE扫描：STA在每个信道发Probe Request，等待MinChannelTime～MaxChannelTime</li><li>PASSIVE扫描：不发送任何信号，在各信道切换并等待Beacon帧</li><li>confirm返回BSSDescriptionSet与ResultCode；规范未定义网络加入（join）原语，但实际实现需要join处理</li></ul></li><li>MLME-AUTHENTICATE：含request/confirm/indication/response四个原语；参数含PeerSTAAddress、AuthenticationType（OPEN_SYSTEM/SHARED_KEY/FAST_BSS_TRANSITION/SAE）、ResultCode</li><li>MLME-ASSOCIATE：关键参数：CapabilityInformation、ListenInterval、RSN（安全信息RSNE）、ResultCode、AssociationID、SupportedRates；RSN场景下关联成功后还需802.1X认证</li><li>STA状态转换（基础结构型网络）<ul class=\"sub\"><li>State 1：未认证未关联，只能发Authentication帧，不能发数据帧</li><li>State 2：已认证未关联，发Association帧，仍不能发数据帧</li><li>State 3：已认证已关联但未通过RSN认证，只能发送4-Way Handshake（四次握手）帧</li><li>State 4：4-Way Handshake成功，完全加入网络</li><li>MAC帧按类别分Class 1/2/3，不同状态下允许发送的帧类别不同</li></ul></li></ul>", "backText": "Entity模型：MAC_SAP为LLC服务；MLME（MAC子层管理实体）提供MLME_SAP；PHY细分PLCP和PMD；PLME提供PLME_SAP；SME（Station Management Entity）独立于MAC/PHY; MLME_SAP共82个原语，相当于定义了一套接口函数，wpa_supplicant是对它们的实现；常用原语：Scan、Authenticate、Associate; MLME-SCAN; MLME-AUTHENTICATE：含request/confirm/indication/response四个原语；参数含PeerSTAAddress、AuthenticationType（OPEN_SYSTEM/SHARED_KEY/FAST_BSS_TRANSITION/SAE）、ResultCode; MLME-ASSOCIATE：关键参数：CapabilityInformation、ListenInterval、RSN（安全信息RSNE）、ResultCode、AssociationID、SupportedRates；RSN场景下关联成功后还需802.1X认证; STA状态转换（基础结构型网络）"}, {"id": "c232", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Entity模型", "back": "<div class=\"def-ans\">MAC_SAP为LLC服务；MLME（MAC子层管理实体）提供MLME_SAP；PHY细分PLCP和PMD；PLME提供PLME_SAP；SME（Station Management Entity）独立于MAC/PHY</div>", "backText": "MAC_SAP为LLC服务；MLME（MAC子层管理实体）提供MLME_SAP；PHY细分PLCP和PMD；PLME提供PLME_SAP；SME（Station Management Entity）独立于MAC/PHY"}, {"id": "c233", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MLME-SCAN", "back": "<ul class=\"ans-list\"><li>request关键参数：BSSType、BSSID、SSID（长度0为wild ssid）、ScanType（ACTIVE/PASSIVE）、ProbeDelay、ChannelList、MinChannelTime/MaxChannelTime</li><li>ACTIVE扫描：STA在每个信道发Probe Request，等待MinChannelTime～MaxChannelTime</li><li>PASSIVE扫描：不发送任何信号，在各信道切换并等待Beacon帧</li><li>confirm返回BSSDescriptionSet与ResultCode；规范未定义网络加入（join）原语，但实际实现需要join处理</li></ul>", "backText": "request关键参数：BSSType、BSSID、SSID（长度0为wild ssid）、ScanType（ACTIVE/PASSIVE）、ProbeDelay、ChannelList、MinChannelTime/MaxChannelTime; ACTIVE扫描：STA在每个信道发Probe Request，等待MinChannelTime～MaxChannelTime; PASSIVE扫描：不发送任何信号，在各信道切换并等待Beacon帧; confirm返回BSSDescriptionSet与ResultCode；规范未定义网络加入（join）原语，但实际实现需要join处理"}, {"id": "c234", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "request关键参数", "back": "<div class=\"def-ans\">BSSType、BSSID、SSID（长度0为wild ssid）、ScanType（ACTIVE/PASSIVE）、ProbeDelay、ChannelList、MinChannelTime/MaxChannelTime</div>", "backText": "BSSType、BSSID、SSID（长度0为wild ssid）、ScanType（ACTIVE/PASSIVE）、ProbeDelay、ChannelList、MinChannelTime/MaxChannelTime"}, {"id": "c235", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "ACTIVE扫描", "back": "<div class=\"def-ans\">STA在每个信道发Probe Request，等待MinChannelTime～MaxChannelTime</div>", "backText": "STA在每个信道发Probe Request，等待MinChannelTime～MaxChannelTime"}, {"id": "c236", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "PASSIVE扫描", "back": "<div class=\"def-ans\">不发送任何信号，在各信道切换并等待Beacon帧</div>", "backText": "不发送任何信号，在各信道切换并等待Beacon帧"}, {"id": "c237", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MLME-AUTHENTICATE", "back": "<div class=\"def-ans\">含request/confirm/indication/response四个原语；参数含PeerSTAAddress、AuthenticationType（OPEN_SYSTEM/SHARED_KEY/FAST_BSS_TRANSITION/SAE）、ResultCode</div>", "backText": "含request/confirm/indication/response四个原语；参数含PeerSTAAddress、AuthenticationType（OPEN_SYSTEM/SHARED_KEY/FAST_BSS_TRANSITION/SAE）、ResultCode"}, {"id": "c238", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "MLME-ASSOCIATE", "back": "<div class=\"def-ans\">关键参数：CapabilityInformation、ListenInterval、RSN（安全信息RSNE）、ResultCode、AssociationID、SupportedRates；RSN场景下关联成功后还需802.1X认证</div>", "backText": "关键参数：CapabilityInformation、ListenInterval、RSN（安全信息RSNE）、ResultCode、AssociationID、SupportedRates；RSN场景下关联成功后还需802.1X认证"}, {"id": "c239", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "STA状态转换（基础结构型网络）", "back": "<ul class=\"ans-list\"><li>State 1：未认证未关联，只能发Authentication帧，不能发数据帧</li><li>State 2：已认证未关联，发Association帧，仍不能发数据帧</li><li>State 3：已认证已关联但未通过RSN认证，只能发送4-Way Handshake（四次握手）帧</li><li>State 4：4-Way Handshake成功，完全加入网络</li><li>MAC帧按类别分Class 1/2/3，不同状态下允许发送的帧类别不同</li></ul>", "backText": "State 1：未认证未关联，只能发Authentication帧，不能发数据帧; State 2：已认证未关联，发Association帧，仍不能发数据帧; State 3：已认证已关联但未通过RSN认证，只能发送4-Way Handshake（四次握手）帧; State 4：4-Way Handshake成功，完全加入网络; MAC帧按类别分Class 1/2/3，不同状态下允许发送的帧类别不同"}, {"id": "c240", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "State 1", "back": "<div class=\"def-ans\">未认证未关联，只能发Authentication帧，不能发数据帧</div>", "backText": "未认证未关联，只能发Authentication帧，不能发数据帧"}, {"id": "c241", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "State 2", "back": "<div class=\"def-ans\">已认证未关联，发Association帧，仍不能发数据帧</div>", "backText": "已认证未关联，发Association帧，仍不能发数据帧"}, {"id": "c242", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "State 3", "back": "<div class=\"def-ans\">已认证已关联但未通过RSN认证，只能发送4-Way Handshake（四次握手）帧</div>", "backText": "已认证已关联但未通过RSN认证，只能发送4-Way Handshake（四次握手）帧"}, {"id": "c243", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "State 4", "back": "<div class=\"def-ans\">4-Way Handshake成功，完全加入网络</div>", "backText": "4-Way Handshake成功，完全加入网络"}, {"id": "c244", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "3.3.7 无线网络安全技术知识点", "back": "<ul class=\"ans-list\"><li>安全三要素：数据完整性（Integrity）、数据机密性（Confidentiality）、身份验证与访问控制（Authentication and Access Control）</li><li>安全技术演进：WEP（802.11最早方案）→ WPA（WFA中间方案）→ 802.11i的RSN（WFA称WPA2）</li><li>Key与Password本质相同：Password为可读的Key，Key一般指算法生成的不可读内容</li><li>WEP数据加密<ul class=\"sub\"><li>采用流密码：数据与密钥流XOR加密；安全性完全依赖Key Stream的随机性</li><li>PRNG输入为IV（初始向量，24位）+ WEP Key（40/104/128位），输出Key Stream</li><li>对Data和ICV（完整性校验值，CRC-32计算）一起XOR加密；帧载荷=IV+密文Data+ICV</li><li>主要弱点：所有数据使用同一个WEP Key加密</li></ul></li><li>WEP身份验证（Pre-RSNA Authentication）<ul class=\"sub\"><li>开放系统认证：等同无验证，总是成功</li><li>共享密钥认证：四步交互——STA发Authentication请求；AP回128字节质询明文；STA用WEP加密后回发；AP解密校验ICV并比对</li></ul></li><li>RSN数据加密与完整性校验<ul class=\"sub\"><li>WPA的改进：以Michael算法（MIC）替代CRC；采用TKIP为每个MAC帧生成不同Key（密钥混合Key Mixing）</li><li>TKIP加密流程：Michael算法生成MIC → Phase 1密钥混合（TA、TK、TSC前32位→TTAK）→ Phase 2密钥混合（TTAK+TSC后16位→WEP种子）→ 用WEP方式XOR加密Data与MIC；本质仍为流密码</li><li>CCMP（WPA2采用）：基于AES块加密（Counter Mode with CBC-MAC Protocol）；PN（帧编号，48位）+KeyId构成CCMP Header；A2、Priority、PN构成Nonce；MAC头构成AAD</li><li>规范另有BIP（广播/组播管理帧完整性校验协议）</li></ul></li><li>EAP（RFC3748）<ul class=\"sub\"><li>最基础的身份验证协议，既是协议也是框架</li><li>角色：Authenticator（验证者，通常为AP）、Supplicant（申请者，通常为手机）、BAS（后端认证服务器）、AAA（如RADIUS）、EAP Server</li><li>Supplicant经EAPOL（EAP Over LAN）发送验证请求；EAP支持PPP、EAPOL、802.11 WLAN、TCP、UDP等底层</li><li>EAP协议栈：EAP Layer（收发数据、处理重传与重复包）→ EAP Supplicant/Authenticator Layer（按Type分发）→ EAP Method（具体验证算法）</li><li>EAP格式：Code（1 Request、2 Response、3 Success、4 Failure）、Identifier、Length、Data（含Type与Type Data）</li><li>Method Type：1 Identity、2 Notification、3 Nak、4 MD5质询、5 OTP、6 GTC、254扩展</li></ul></li><li>802.1X<ul class=\"sub\"><li>详述EAP在有线LAN上的实现（EAPOL）</li><li>核心概念Port：Controlled Port（认证通过前不允许传任何数据，通过后Port Authorized）与UnControlled Port（只允许EAPOL等少量数据通过）</li><li>PAE（Port Access Entity）：负责PACP协议相关算法处理，分Supplicant PAE与Authenticator PAE</li><li>EAPOL格式：Protocol Version、Packet Type、Packet Body Length；EAPOL-Key用于交换密钥信息（EAPOL在802.11帧中的类型为0x888e）</li><li>EAPOL认证流程（MD5示例）：EAPOL-Start（可选）→ EAP-Request/Identity → EAP-Response/Identity（转RADIUS Access-Request）→ RADIUS Access-Challenge → EAP-Response/MD5 Challenge → 认证成功（EAP-Success）；支持定期握手；Supplicant可发EAPOL-Logoff主动下线</li></ul></li><li>RSNA（强健安全网络联合）<ul class=\"sub\"><li>三步过程：①网络发现——检查Beacon/Probe Response中的RSNE IE，以Open System认证完成Authentication和Association；②进行802.1X认证并分配会话密钥；③通过4-Way Handshake与Group Key Handshake完成密钥管理</li><li>PMK（成对主密钥）来源：Personal/SOHO环境为PSK（预共享密钥）；Enterprise环境经EAPOL与RADIUS等AS交互获取</li><li>单播密钥派生：PMK（256位）经PRF结合双方Nonce与MAC地址扩展出PTK；PTK含EAPOL KCK（算MIC）、EAPOL KEK（加密密钥消息）及TK（数据加密密钥）</li><li>4-Way Handshake流程：①AP发ANonce；②STA派生PTK并回发SNonce与MIC；③AP发送GTK（用KEK加密）与MIC；④STA回发确认并安装PTK；⑤双方Install密钥开始加密通信</li><li>组播/单播可用不同加密方法（混合加密）；限制：组播用CCMP时单播不能用TKIP</li><li>PMK缓存（PMKSA）：含AP的MAC地址、PMK生命周期、PMKID；关联时STA把PMKID放入RSNE，双方都有缓存则跳过802.1X协商直接进入4-Way Handshake</li><li>安全体系总结：WEP解决完整性与机密性（保护弱）→TKIP/CCMP（AES）解决完整性与机密性→RSNA解决认证与密钥派生/缓存</li><li>简单公式：WPA-企业=802.1X+EAP+TKIP；WPA2-企业=802.1X+EAP+CCMP；WPA-个人=PSK+TKIP；WPA2-个人=PSK+CCMP</li></ul></li></ul>", "backText": "安全三要素：数据完整性（Integrity）、数据机密性（Confidentiality）、身份验证与访问控制（Authentication and Access Control）; 安全技术演进：WEP（802.11最早方案）→ WPA（WFA中间方案）→ 802.11i的RSN（WFA称WPA2）; Key与Password本质相同：Password为可读的Key，Key一般指算法生成的不可读内容; WEP数据加密; WEP身份验证（Pre-RSNA Authentication）; RSN数据加密与完整性校验"}, {"id": "c245", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "安全三要素", "back": "<div class=\"def-ans\">数据完整性（Integrity）、数据机密性（Confidentiality）、身份验证与访问控制（Authentication and Access Control）</div>", "backText": "数据完整性（Integrity）、数据机密性（Confidentiality）、身份验证与访问控制（Authentication and Access Control）"}, {"id": "c246", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "安全技术演进", "back": "<div class=\"def-ans\">WEP（802.11最早方案）→ WPA（WFA中间方案）→ 802.11i的RSN（WFA称WPA2）</div>", "backText": "WEP（802.11最早方案）→ WPA（WFA中间方案）→ 802.11i的RSN（WFA称WPA2）"}, {"id": "c247", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Key与Password本质相同", "back": "<div class=\"def-ans\">Password为可读的Key，Key一般指算法生成的不可读内容</div>", "backText": "Password为可读的Key，Key一般指算法生成的不可读内容"}, {"id": "c248", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "WEP数据加密", "back": "<ul class=\"ans-list\"><li>采用流密码：数据与密钥流XOR加密；安全性完全依赖Key Stream的随机性</li><li>PRNG输入为IV（初始向量，24位）+ WEP Key（40/104/128位），输出Key Stream</li><li>对Data和ICV（完整性校验值，CRC-32计算）一起XOR加密；帧载荷=IV+密文Data+ICV</li><li>主要弱点：所有数据使用同一个WEP Key加密</li></ul>", "backText": "采用流密码：数据与密钥流XOR加密；安全性完全依赖Key Stream的随机性; PRNG输入为IV（初始向量，24位）+ WEP Key（40/104/128位），输出Key Stream; 对Data和ICV（完整性校验值，CRC-32计算）一起XOR加密；帧载荷=IV+密文Data+ICV; 主要弱点：所有数据使用同一个WEP Key加密"}, {"id": "c249", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "采用流密码", "back": "<div class=\"def-ans\">数据与密钥流XOR加密；安全性完全依赖Key Stream的随机性</div>", "backText": "数据与密钥流XOR加密；安全性完全依赖Key Stream的随机性"}, {"id": "c250", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "主要弱点", "back": "<div class=\"def-ans\">所有数据使用同一个WEP Key加密</div>", "backText": "所有数据使用同一个WEP Key加密"}, {"id": "c251", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "WEP身份验证（Pre-RSNA Authentication）", "back": "<ul class=\"ans-list\"><li>开放系统认证：等同无验证，总是成功</li><li>共享密钥认证：四步交互——STA发Authentication请求；AP回128字节质询明文；STA用WEP加密后回发；AP解密校验ICV并比对</li></ul>", "backText": "开放系统认证：等同无验证，总是成功; 共享密钥认证：四步交互——STA发Authentication请求；AP回128字节质询明文；STA用WEP加密后回发；AP解密校验ICV并比对"}, {"id": "c252", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "开放系统认证", "back": "<div class=\"def-ans\">等同无验证，总是成功</div>", "backText": "等同无验证，总是成功"}, {"id": "c253", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "共享密钥认证", "back": "<div class=\"def-ans\">四步交互——STA发Authentication请求；AP回128字节质询明文；STA用WEP加密后回发；AP解密校验ICV并比对</div>", "backText": "四步交互——STA发Authentication请求；AP回128字节质询明文；STA用WEP加密后回发；AP解密校验ICV并比对"}, {"id": "c254", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "RSN数据加密与完整性校验", "back": "<ul class=\"ans-list\"><li>WPA的改进：以Michael算法（MIC）替代CRC；采用TKIP为每个MAC帧生成不同Key（密钥混合Key Mixing）</li><li>TKIP加密流程：Michael算法生成MIC → Phase 1密钥混合（TA、TK、TSC前32位→TTAK）→ Phase 2密钥混合（TTAK+TSC后16位→WEP种子）→ 用WEP方式XOR加密Data与MIC；本质仍为流密码</li><li>CCMP（WPA2采用）：基于AES块加密（Counter Mode with CBC-MAC Protocol）；PN（帧编号，48位）+KeyId构成CCMP Header；A2、Priority、PN构成Nonce；MAC头构成AAD</li><li>规范另有BIP（广播/组播管理帧完整性校验协议）</li></ul>", "backText": "WPA的改进：以Michael算法（MIC）替代CRC；采用TKIP为每个MAC帧生成不同Key（密钥混合Key Mixing）; TKIP加密流程：Michael算法生成MIC → Phase 1密钥混合（TA、TK、TSC前32位→TTAK）→ Phase 2密钥混合（TTAK+TSC后16位→WEP种子）→ 用WEP方式XOR加密Data与MIC；本质仍为流密码; CCMP（WPA2采用）：基于AES块加密（Counter Mode with CBC-MAC Protocol）；PN（帧编号，48位）+KeyId构成CCMP Header；A2、Priority、PN构成Nonce；MAC头构成AAD; 规范另有BIP（广播/组播管理帧完整性校验协议）"}, {"id": "c255", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "WPA的改进", "back": "<div class=\"def-ans\">以Michael算法（MIC）替代CRC；采用TKIP为每个MAC帧生成不同Key（密钥混合Key Mixing）</div>", "backText": "以Michael算法（MIC）替代CRC；采用TKIP为每个MAC帧生成不同Key（密钥混合Key Mixing）"}, {"id": "c256", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "TKIP加密流程", "back": "<div class=\"def-ans\">Michael算法生成MIC → Phase 1密钥混合（TA、TK、TSC前32位→TTAK）→ Phase 2密钥混合（TTAK+TSC后16位→WEP种子）→ 用WEP方式XOR加密Data与MIC；本质仍为流密码</div>", "backText": "Michael算法生成MIC → Phase 1密钥混合（TA、TK、TSC前32位→TTAK）→ Phase 2密钥混合（TTAK+TSC后16位→WEP种子）→ 用WEP方式XOR加密Data与MIC；本质仍为流密码"}, {"id": "c257", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "CCMP（WPA2采用）", "back": "<div class=\"def-ans\">基于AES块加密（Counter Mode with CBC-MAC Protocol）；PN（帧编号，48位）+KeyId构成CCMP Header；A2、Priority、PN构成Nonce；MAC头构成AAD</div>", "backText": "基于AES块加密（Counter Mode with CBC-MAC Protocol）；PN（帧编号，48位）+KeyId构成CCMP Header；A2、Priority、PN构成Nonce；MAC头构成AAD"}, {"id": "c258", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "EAP（RFC3748）", "back": "<ul class=\"ans-list\"><li>最基础的身份验证协议，既是协议也是框架</li><li>角色：Authenticator（验证者，通常为AP）、Supplicant（申请者，通常为手机）、BAS（后端认证服务器）、AAA（如RADIUS）、EAP Server</li><li>Supplicant经EAPOL（EAP Over LAN）发送验证请求；EAP支持PPP、EAPOL、802.11 WLAN、TCP、UDP等底层</li><li>EAP协议栈：EAP Layer（收发数据、处理重传与重复包）→ EAP Supplicant/Authenticator Layer（按Type分发）→ EAP Method（具体验证算法）</li><li>EAP格式：Code（1 Request、2 Response、3 Success、4 Failure）、Identifier、Length、Data（含Type与Type Data）</li><li>Method Type：1 Identity、2 Notification、3 Nak、4 MD5质询、5 OTP、6 GTC、254扩展</li></ul>", "backText": "最基础的身份验证协议，既是协议也是框架; 角色：Authenticator（验证者，通常为AP）、Supplicant（申请者，通常为手机）、BAS（后端认证服务器）、AAA（如RADIUS）、EAP Server; Supplicant经EAPOL（EAP Over LAN）发送验证请求；EAP支持PPP、EAPOL、802.11 WLAN、TCP、UDP等底层; EAP协议栈：EAP Layer（收发数据、处理重传与重复包）→ EAP Supplicant/Authenticator Layer（按Type分发）→ EAP Method（具体验证算法）; EAP格式：Code（1 Request、2 Response、3 Success、4 Failure）、Identifier、Length、Data（含Type与Type Data）; Method Type：1 Identity、2 Notification、3 Nak、4 MD5质询、5 OTP、6 GTC、254扩展"}, {"id": "c259", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "角色", "back": "<div class=\"def-ans\">Authenticator（验证者，通常为AP）、Supplicant（申请者，通常为手机）、BAS（后端认证服务器）、AAA（如RADIUS）、EAP Server</div>", "backText": "Authenticator（验证者，通常为AP）、Supplicant（申请者，通常为手机）、BAS（后端认证服务器）、AAA（如RADIUS）、EAP Server"}, {"id": "c260", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "EAP协议栈", "back": "<div class=\"def-ans\">EAP Layer（收发数据、处理重传与重复包）→ EAP Supplicant/Authenticator Layer（按Type分发）→ EAP Method（具体验证算法）</div>", "backText": "EAP Layer（收发数据、处理重传与重复包）→ EAP Supplicant/Authenticator Layer（按Type分发）→ EAP Method（具体验证算法）"}, {"id": "c261", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "EAP格式", "back": "<div class=\"def-ans\">Code（1 Request、2 Response、3 Success、4 Failure）、Identifier、Length、Data（含Type与Type Data）</div>", "backText": "Code（1 Request、2 Response、3 Success、4 Failure）、Identifier、Length、Data（含Type与Type Data）"}, {"id": "c262", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "Method Type", "back": "<div class=\"def-ans\">1 Identity、2 Notification、3 Nak、4 MD5质询、5 OTP、6 GTC、254扩展</div>", "backText": "1 Identity、2 Notification、3 Nak、4 MD5质询、5 OTP、6 GTC、254扩展"}, {"id": "c263", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "802.1X", "back": "<ul class=\"ans-list\"><li>详述EAP在有线LAN上的实现（EAPOL）</li><li>核心概念Port：Controlled Port（认证通过前不允许传任何数据，通过后Port Authorized）与UnControlled Port（只允许EAPOL等少量数据通过）</li><li>PAE（Port Access Entity）：负责PACP协议相关算法处理，分Supplicant PAE与Authenticator PAE</li><li>EAPOL格式：Protocol Version、Packet Type、Packet Body Length；EAPOL-Key用于交换密钥信息（EAPOL在802.11帧中的类型为0x888e）</li><li>EAPOL认证流程（MD5示例）：EAPOL-Start（可选）→ EAP-Request/Identity → EAP-Response/Identity（转RADIUS Access-Request）→ RADIUS Access-Challenge → EAP-Response/MD5 Challenge → 认证成功（EAP-Success）；支持定期握手；Supplicant可发EAPOL-Logoff主动下线</li></ul>", "backText": "详述EAP在有线LAN上的实现（EAPOL）; 核心概念Port：Controlled Port（认证通过前不允许传任何数据，通过后Port Authorized）与UnControlled Port（只允许EAPOL等少量数据通过）; PAE（Port Access Entity）：负责PACP协议相关算法处理，分Supplicant PAE与Authenticator PAE; EAPOL格式：Protocol Version、Packet Type、Packet Body Length；EAPOL-Key用于交换密钥信息（EAPOL在802.11帧中的类型为0x888e）; EAPOL认证流程（MD5示例）：EAPOL-Start（可选）→ EAP-Request/Identity → EAP-Response/Identity（转RADIUS Access-Request）→ RADIUS Access-Challenge → EAP-Response/MD5 Challenge → 认证成功（EAP-Success）；支持定期握手；Supplicant可发EAPOL-Logoff主动下线"}, {"id": "c264", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "核心概念Port", "back": "<div class=\"def-ans\">Controlled Port（认证通过前不允许传任何数据，通过后Port Authorized）与UnControlled Port（只允许EAPOL等少量数据通过）</div>", "backText": "Controlled Port（认证通过前不允许传任何数据，通过后Port Authorized）与UnControlled Port（只允许EAPOL等少量数据通过）"}, {"id": "c265", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "PAE（Port Access Entity）", "back": "<div class=\"def-ans\">负责PACP协议相关算法处理，分Supplicant PAE与Authenticator PAE</div>", "backText": "负责PACP协议相关算法处理，分Supplicant PAE与Authenticator PAE"}, {"id": "c266", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "EAPOL格式", "back": "<div class=\"def-ans\">Protocol Version、Packet Type、Packet Body Length；EAPOL-Key用于交换密钥信息（EAPOL在802.11帧中的类型为0x888e）</div>", "backText": "Protocol Version、Packet Type、Packet Body Length；EAPOL-Key用于交换密钥信息（EAPOL在802.11帧中的类型为0x888e）"}, {"id": "c267", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "EAPOL认证流程（MD5示例）", "back": "<div class=\"def-ans\">EAPOL-Start（可选）→ EAP-Request/Identity → EAP-Response/Identity（转RADIUS Access-Request）→ RADIUS Access-Challenge → EAP-Response/MD5 Challenge → 认证成功（EAP-Success）；支持定期握手；Supplicant可发EAPOL-Logoff主动下线</div>", "backText": "EAPOL-Start（可选）→ EAP-Request/Identity → EAP-Response/Identity（转RADIUS Access-Request）→ RADIUS Access-Challenge → EAP-Response/MD5 Challenge → 认证成功（EAP-Success）；支持定期握手；Supplicant可发EAPOL-Logoff主动下线"}, {"id": "c268", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "RSNA（强健安全网络联合）", "back": "<ul class=\"ans-list\"><li>三步过程：①网络发现——检查Beacon/Probe Response中的RSNE IE，以Open System认证完成Authentication和Association；②进行802.1X认证并分配会话密钥；③通过4-Way Handshake与Group Key Handshake完成密钥管理</li><li>PMK（成对主密钥）来源：Personal/SOHO环境为PSK（预共享密钥）；Enterprise环境经EAPOL与RADIUS等AS交互获取</li><li>单播密钥派生：PMK（256位）经PRF结合双方Nonce与MAC地址扩展出PTK；PTK含EAPOL KCK（算MIC）、EAPOL KEK（加密密钥消息）及TK（数据加密密钥）</li><li>4-Way Handshake流程：①AP发ANonce；②STA派生PTK并回发SNonce与MIC；③AP发送GTK（用KEK加密）与MIC；④STA回发确认并安装PTK；⑤双方Install密钥开始加密通信</li><li>组播/单播可用不同加密方法（混合加密）；限制：组播用CCMP时单播不能用TKIP</li><li>PMK缓存（PMKSA）：含AP的MAC地址、PMK生命周期、PMKID；关联时STA把PMKID放入RSNE，双方都有缓存则跳过802.1X协商直接进入4-Way Handshake</li><li>安全体系总结：WEP解决完整性与机密性（保护弱）→TKIP/CCMP（AES）解决完整性与机密性→RSNA解决认证与密钥派生/缓存</li><li>简单公式：WPA-企业=802.1X+EAP+TKIP；WPA2-企业=802.1X+EAP+CCMP；WPA-个人=PSK+TKIP；WPA2-个人=PSK+CCMP</li></ul>", "backText": "三步过程：①网络发现——检查Beacon/Probe Response中的RSNE IE，以Open System认证完成Authentication和Association；②进行802.1X认证并分配会话密钥；③通过4-Way Handshake与Group Key Handshake完成密钥管理; PMK（成对主密钥）来源：Personal/SOHO环境为PSK（预共享密钥）；Enterprise环境经EAPOL与RADIUS等AS交互获取; 单播密钥派生：PMK（256位）经PRF结合双方Nonce与MAC地址扩展出PTK；PTK含EAPOL KCK（算MIC）、EAPOL KEK（加密密钥消息）及TK（数据加密密钥）; 4-Way Handshake流程：①AP发ANonce；②STA派生PTK并回发SNonce与MIC；③AP发送GTK（用KEK加密）与MIC；④STA回发确认并安装PTK；⑤双方Install密钥开始加密通信; 组播/单播可用不同加密方法（混合加密）；限制：组播用CCMP时单播不能用TKIP; PMK缓存（PMKSA）：含AP的MAC地址、PMK生命周期、PMKID；关联时STA把PMKID放入RSNE，双方都有缓存则跳过802.1X协商直接进入4-Way Handshake"}, {"id": "c269", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "三步过程", "back": "<div class=\"def-ans\">①网络发现——检查Beacon/Probe Response中的RSNE IE，以Open System认证完成Authentication和Association；②进行802.1X认证并分配会话密钥；③通过4-Way Handshake与Group Key Handshake完成密钥管理</div>", "backText": "①网络发现——检查Beacon/Probe Response中的RSNE IE，以Open System认证完成Authentication和Association；②进行802.1X认证并分配会话密钥；③通过4-Way Handshake与Group Key Handshake完成密钥管理"}, {"id": "c270", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "PMK（成对主密钥）来源", "back": "<div class=\"def-ans\">Personal/SOHO环境为PSK（预共享密钥）；Enterprise环境经EAPOL与RADIUS等AS交互获取</div>", "backText": "Personal/SOHO环境为PSK（预共享密钥）；Enterprise环境经EAPOL与RADIUS等AS交互获取"}, {"id": "c271", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "单播密钥派生", "back": "<div class=\"def-ans\">PMK（256位）经PRF结合双方Nonce与MAC地址扩展出PTK；PTK含EAPOL KCK（算MIC）、EAPOL KEK（加密密钥消息）及TK（数据加密密钥）</div>", "backText": "PMK（256位）经PRF结合双方Nonce与MAC地址扩展出PTK；PTK含EAPOL KCK（算MIC）、EAPOL KEK（加密密钥消息）及TK（数据加密密钥）"}, {"id": "c272", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "4-Way Handshake流程", "back": "<div class=\"def-ans\">①AP发ANonce；②STA派生PTK并回发SNonce与MIC；③AP发送GTK（用KEK加密）与MIC；④STA回发确认并安装PTK；⑤双方Install密钥开始加密通信</div>", "backText": "①AP发ANonce；②STA派生PTK并回发SNonce与MIC；③AP发送GTK（用KEK加密）与MIC；④STA回发确认并安装PTK；⑤双方Install密钥开始加密通信"}, {"id": "c273", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "PMK缓存（PMKSA）", "back": "<div class=\"def-ans\">含AP的MAC地址、PMK生命周期、PMKID；关联时STA把PMKID放入RSNE，双方都有缓存则跳过802.1X协商直接进入4-Way Handshake</div>", "backText": "含AP的MAC地址、PMK生命周期、PMKID；关联时STA把PMKID放入RSNE，双方都有缓存则跳过802.1X协商直接进入4-Way Handshake"}, {"id": "c274", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "安全体系总结", "back": "<div class=\"def-ans\">WEP解决完整性与机密性（保护弱）→TKIP/CCMP（AES）解决完整性与机密性→RSNA解决认证与密钥派生/缓存</div>", "backText": "WEP解决完整性与机密性（保护弱）→TKIP/CCMP（AES）解决完整性与机密性→RSNA解决认证与密钥派生/缓存"}, {"id": "c275", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.3 802.11无线网络技术", "front": "简单公式", "back": "<div class=\"def-ans\">WPA-企业=802.1X+EAP+TKIP；WPA2-企业=802.1X+EAP+CCMP；WPA-个人=PSK+TKIP；WPA2-个人=PSK+CCMP</div>", "backText": "WPA-企业=802.1X+EAP+TKIP；WPA2-企业=802.1X+EAP+CCMP；WPA-个人=PSK+TKIP；WPA2-个人=PSK+CCMP"}, {"id": "c276", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "Linux常用无线编程API两套", "back": "<ul class=\"ans-list\"><li>Linux Wireless Extensions（wext）：Jean Tourrilhes于1997年开发，用户空间程序通过ioctl控制无线网卡驱动</li><li>cfg80211 + nl80211：替代wext；cfg80211供驱动开发，nl80211供用户空间进程操作基于cfg80211的驱动</li><li>ioctl不被Linux驱动开发推荐：支持可变个数参数、参数类型无法由函数原型说明</li><li>网卡分SoftMAC（MLME基本在软件层，cfg80211仅支持此类，市面上占绝大多数）与FullMAC（MLME全在硬件）</li></ul>", "backText": "Linux Wireless Extensions（wext）：Jean Tourrilhes于1997年开发，用户空间程序通过ioctl控制无线网卡驱动; cfg80211 + nl80211：替代wext；cfg80211供驱动开发，nl80211供用户空间进程操作基于cfg80211的驱动; ioctl不被Linux驱动开发推荐：支持可变个数参数、参数类型无法由函数原型说明; 网卡分SoftMAC（MLME基本在软件层，cfg80211仅支持此类，市面上占绝大多数）与FullMAC（MLME全在硬件）"}, {"id": "c277", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "cfg80211 + nl80211", "back": "<div class=\"def-ans\">替代wext；cfg80211供驱动开发，nl80211供用户空间进程操作基于cfg80211的驱动</div>", "backText": "替代wext；cfg80211供驱动开发，nl80211供用户空间进程操作基于cfg80211的驱动"}, {"id": "c278", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "ioctl不被Linux驱动开发推荐", "back": "<div class=\"def-ans\">支持可变个数参数、参数类型无法由函数原型说明</div>", "backText": "支持可变个数参数、参数类型无法由函数原型说明"}, {"id": "c279", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "3.4.1 Linux Wireless Extensions介绍", "back": "<ul class=\"ans-list\"><li>wext API定义于wireless.h；Android 4.2中wext版本为20（宏WIRELESS_EXT）</li><li>常用数据结构<ul class=\"sub\"><li>struct iwreq：用户空间请求统一入口；ifr_name指定网卡设备名（如wlan0），iwreq_data联合体（最大16字节）存储具体参数</li><li>iwreq_data成员：iw_point（参数超过16字节时指向外部内存）、iw_param、iw_freq（值0-1000代表channel，大于1000代表频率）、essid、nwid、bitrate、txpower、rts、mode等</li><li>struct iw_scan_req：scan_type（IW_SCAN_TYPE_ACTIVE/PASSIVE）、essid_len、num_channels（0为扫描所有允许信道）、bssid（全FF为wildcard）、min/max_channel_time、channel_list（最多32个）</li></ul></li><li>使用实例（wpa_supplicant的wpa_driver_wext_scan）：构造iwreq→填写iw_scan_req（flags=IW_SCAN_THIS_ESSID只扫描指定ESSID）→ioctl(sock, SIOCSIWSCAN, &amp;iwr)通知驱动扫描</li></ul>", "backText": "wext API定义于wireless.h；Android 4.2中wext版本为20（宏WIRELESS_EXT）; 常用数据结构; 使用实例（wpa_supplicant的wpa_driver_wext_scan）：构造iwreq→填写iw_scan_req（flags=IW_SCAN_THIS_ESSID只扫描指定ESSID）→ioctl(sock, SIOCSIWSCAN, &iwr)通知驱动扫描"}, {"id": "c280", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "常用数据结构", "back": "<ul class=\"ans-list\"><li>struct iwreq：用户空间请求统一入口；ifr_name指定网卡设备名（如wlan0），iwreq_data联合体（最大16字节）存储具体参数</li><li>iwreq_data成员：iw_point（参数超过16字节时指向外部内存）、iw_param、iw_freq（值0-1000代表channel，大于1000代表频率）、essid、nwid、bitrate、txpower、rts、mode等</li><li>struct iw_scan_req：scan_type（IW_SCAN_TYPE_ACTIVE/PASSIVE）、essid_len、num_channels（0为扫描所有允许信道）、bssid（全FF为wildcard）、min/max_channel_time、channel_list（最多32个）</li></ul>", "backText": "struct iwreq：用户空间请求统一入口；ifr_name指定网卡设备名（如wlan0），iwreq_data联合体（最大16字节）存储具体参数; iwreq_data成员：iw_point（参数超过16字节时指向外部内存）、iw_param、iw_freq（值0-1000代表channel，大于1000代表频率）、essid、nwid、bitrate、txpower、rts、mode等; struct iw_scan_req：scan_type（IW_SCAN_TYPE_ACTIVE/PASSIVE）、essid_len、num_channels（0为扫描所有允许信道）、bssid（全FF为wildcard）、min/max_channel_time、channel_list（最多32个）"}, {"id": "c281", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "struct iwreq", "back": "<div class=\"def-ans\">用户空间请求统一入口；ifr_name指定网卡设备名（如wlan0），iwreq_data联合体（最大16字节）存储具体参数</div>", "backText": "用户空间请求统一入口；ifr_name指定网卡设备名（如wlan0），iwreq_data联合体（最大16字节）存储具体参数"}, {"id": "c282", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "iwreq_data成员", "back": "<div class=\"def-ans\">iw_point（参数超过16字节时指向外部内存）、iw_param、iw_freq（值0-1000代表channel，大于1000代表频率）、essid、nwid、bitrate、txpower、rts、mode等</div>", "backText": "iw_point（参数超过16字节时指向外部内存）、iw_param、iw_freq（值0-1000代表channel，大于1000代表频率）、essid、nwid、bitrate、txpower、rts、mode等"}, {"id": "c283", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "struct iw_scan_req", "back": "<div class=\"def-ans\">scan_type（IW_SCAN_TYPE_ACTIVE/PASSIVE）、essid_len、num_channels（0为扫描所有允许信道）、bssid（全FF为wildcard）、min/max_channel_time、channel_list（最多32个）</div>", "backText": "scan_type（IW_SCAN_TYPE_ACTIVE/PASSIVE）、essid_len、num_channels（0为扫描所有允许信道）、bssid（全FF为wildcard）、min/max_channel_time、channel_list（最多32个）"}, {"id": "c284", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "3.4.2 nl80211介绍", "back": "<ul class=\"ans-list\"><li>nl80211基于netlink机制（非ioctl），使用难度较大；netlink是Linux基于socket的IPC机制</li><li>libnl开源库是最著名的netlink编程框架；Android在system/core/libnl_2目录移植并精简了libnl</li><li>netlink编程基础<ul class=\"sub\"><li>socket创建：domain必须为AF_NETLINK；protocol指定内核子系统（NETLINK_ROUTE、NETLINK_KOBJECT_UEVENT等）</li><li>寻址：struct sockaddr_nl——nl_pid（0表示目标是Kernel）；nl_groups为多播组掩码（如RTMGRP_LINK）</li><li>消息头struct nlmsghdr：nlmsg_len、nlmsg_type、nlmsg_flags、nlmsg_seq（序列号）、nlmsg_pid</li><li>消息类型：NLMSG_NOOP、NLMSG_ERROR（error=0表示成功）、NLMSG_DONE（大数据分片的最后一个分片）</li><li>按C/S角度分：Request（须置NLM_F_REQUEST）、Response、Notification；常用flags：NLM_F_REQUEST、NLM_F_MULTI（内核单消息上限约4KB）、NLM_F_ACK</li><li>帮助宏：NLMSG_ALIGN、NLMSG_LENGTH、NLMSG_DATA、NLMSG_NEXT、NLMSG_OK、NLMSG_PAYLOAD；典型解析模式为recvmsg后用NLMSG_OK/NLMSG_NEXT循环</li><li>nlattr结构（nla_len、nla_type）：以属性方式规范Payload</li></ul></li><li>libnl开源库<ul class=\"sub\"><li>架构：核心libnl之上的libnl-route、libnl-nf、libnl-genl</li><li>nl_sock：nl_socket_alloc/free；nl_connect绑定protocol；回调管理nl_socket_modify_cb（NL_CB_ACK等/NL_CB_CUSTOM）；nl_cb_err处理错误消息</li><li>消息处理：nlmsg_size/total_size计算长度；nlmsg_for_each遍历；nlmsg_alloc/free/put管理nl_msg</li><li>收发：发送nl_sendto/nl_send/nl_send_simple；接收nl_recv与nl_recvmsgs（经cb回调分发）</li><li>libnl-genl：genl消息含genlmsghdr（cmd、version）；genl机制：内核维护虚拟Generic Netlink Bus，Controller（family name为\"nlctrl\"）动态分配family编号；常用API：genl_ctrl_resolve（按名字查family）、genl_ctrl_alloc_cache、genl_ctrl_search_by_name</li></ul></li><li>nl80211实例（wpa_driver_nl80211_scan）<ul class=\"sub\"><li>流程：nlmsg_alloc分配消息→nl80211_cmd（genlmsg_put，命令为NL80211_CMD_TRIGGER_SCAN）→nla_put_u32设置NL80211_ATTR_IFINDEX→nla_put_nested嵌套NL80211_ATTR_SCAN_SSIDS→send_and_recv_msgs发送</li><li>nl80211_copy.h定义94条命令与155条属性，注释详细</li><li>nl80211与wext本质无大区别：都围绕MAC层service设计数据结构，仅通信机制（netlink vs ioctl）不同</li></ul></li></ul>", "backText": "nl80211基于netlink机制（非ioctl），使用难度较大；netlink是Linux基于socket的IPC机制; libnl开源库是最著名的netlink编程框架；Android在system/core/libnl_2目录移植并精简了libnl; netlink编程基础; libnl开源库; nl80211实例（wpa_driver_nl80211_scan）"}, {"id": "c285", "type": "outline", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "netlink编程基础", "back": "<ul class=\"ans-list\"><li>socket创建：domain必须为AF_NETLINK；protocol指定内核子系统（NETLINK_ROUTE、NETLINK_KOBJECT_UEVENT等）</li><li>寻址：struct sockaddr_nl——nl_pid（0表示目标是Kernel）；nl_groups为多播组掩码（如RTMGRP_LINK）</li><li>消息头struct nlmsghdr：nlmsg_len、nlmsg_type、nlmsg_flags、nlmsg_seq（序列号）、nlmsg_pid</li><li>消息类型：NLMSG_NOOP、NLMSG_ERROR（error=0表示成功）、NLMSG_DONE（大数据分片的最后一个分片）</li><li>按C/S角度分：Request（须置NLM_F_REQUEST）、Response、Notification；常用flags：NLM_F_REQUEST、NLM_F_MULTI（内核单消息上限约4KB）、NLM_F_ACK</li><li>帮助宏：NLMSG_ALIGN、NLMSG_LENGTH、NLMSG_DATA、NLMSG_NEXT、NLMSG_OK、NLMSG_PAYLOAD；典型解析模式为recvmsg后用NLMSG_OK/NLMSG_NEXT循环</li><li>nlattr结构（nla_len、nla_type）：以属性方式规范Payload</li></ul>", "backText": "socket创建：domain必须为AF_NETLINK；protocol指定内核子系统（NETLINK_ROUTE、NETLINK_KOBJECT_UEVENT等）; 寻址：struct sockaddr_nl——nl_pid（0表示目标是Kernel）；nl_groups为多播组掩码（如RTMGRP_LINK）; 消息头struct nlmsghdr：nlmsg_len、nlmsg_type、nlmsg_flags、nlmsg_seq（序列号）、nlmsg_pid; 消息类型：NLMSG_NOOP、NLMSG_ERROR（error=0表示成功）、NLMSG_DONE（大数据分片的最后一个分片）; 按C/S角度分：Request（须置NLM_F_REQUEST）、Response、Notification；常用flags：NLM_F_REQUEST、NLM_F_MULTI（内核单消息上限约4KB）、NLM_F_ACK; 帮助宏：NLMSG_ALIGN、NLMSG_LENGTH、NLMSG_DATA、NLMSG_NEXT、NLMSG_OK、NLMSG_PAYLOAD；典型解析模式为recvmsg后用NLMSG_OK/NLMSG_NEXT循环"}, {"id": "c286", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "socket创建", "back": "<div class=\"def-ans\">domain必须为AF_NETLINK；protocol指定内核子系统（NETLINK_ROUTE、NETLINK_KOBJECT_UEVENT等）</div>", "backText": "domain必须为AF_NETLINK；protocol指定内核子系统（NETLINK_ROUTE、NETLINK_KOBJECT_UEVENT等）"}, {"id": "c287", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "寻址", "back": "<div class=\"def-ans\">struct sockaddr_nl——nl_pid（0表示目标是Kernel）；nl_groups为多播组掩码（如RTMGRP_LINK）</div>", "backText": "struct sockaddr_nl——nl_pid（0表示目标是Kernel）；nl_groups为多播组掩码（如RTMGRP_LINK）"}, {"id": "c288", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "消息头struct nlmsghdr", "back": "<div class=\"def-ans\">nlmsg_len、nlmsg_type、nlmsg_flags、nlmsg_seq（序列号）、nlmsg_pid</div>", "backText": "nlmsg_len、nlmsg_type、nlmsg_flags、nlmsg_seq（序列号）、nlmsg_pid"}, {"id": "c289", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "消息类型", "back": "<div class=\"def-ans\">NLMSG_NOOP、NLMSG_ERROR（error=0表示成功）、NLMSG_DONE（大数据分片的最后一个分片）</div>", "backText": "NLMSG_NOOP、NLMSG_ERROR（error=0表示成功）、NLMSG_DONE（大数据分片的最后一个分片）"}, {"id": "c290", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "按C/S角度分", "back": "<div class=\"def-ans\">Request（须置NLM_F_REQUEST）、Response、Notification；常用flags：NLM_F_REQUEST、NLM_F_MULTI（内核单消息上限约4KB）、NLM_F_ACK</div>", "backText": "Request（须置NLM_F_REQUEST）、Response、Notification；常用flags：NLM_F_REQUEST、NLM_F_MULTI（内核单消息上限约4KB）、NLM_F_ACK"}, {"id": "c291", "type": "def", "part": "Wi-Fi 篇", "partColor": "#2563eb", "chapter": "第3章 Wi-Fi基础知识", "section": "3.4 Linux Wi-Fi编程API", "front": "帮助宏", "back": "<div class=\"def-ans\">NLMSG_ALIGN、NLMSG_LENGTH、NLMSG_DATA、NLMSG_NEXT、NLMSG_OK、NLMSG_PAYLOAD；典型解析模式为recvmsg后用NLMSG_OK/NLMSG_NEXT循环</div>", "backText": "NLMSG_ALIGN、NLMSG_LENGTH、NLMSG_DATA、NLMSG_NEXT、NLMSG_OK、NLMSG_PAYLOAD；典型解析模式为recvmsg后用NLMSG_OK/NLMSG_NEXT循环"}, {"id": "c292", "type": "d
