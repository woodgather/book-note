ver", "c": [{"t": "步骤1：先编译Android源码工程；编译报错大多是.classpath包含了不需要的模块", "c": []}, {"t": "步骤2：右键工程 → Debug As → Debug Configurations → Remote Java Application", "c": []}, {"t": "步骤3：新建配置，Remote调试端口号设为8600（SystemServer进程的调试端口），Host为localhost", "c": []}, {"t": "Eclipse连接8600端口后通过JDWP协议调试SystemServer", "c": []}]}]}, {"t": "1.2.3 BusyBox的使用", "c": [{"t": "定位：Linux平台上的\"瑞士军刀\"，提供grep、find等常用工具", "c": []}, {"t": "背景：Android系统去掉了大多数标准Linux工具，导致调试研究困难，需在手机上安装BusyBox", "c": []}, {"t": "下载：busybox.net官网已按平台提供编译好的版本；作者下载busybox-armv7l（arm v7为ARM指令集版本，Cortex-A8/A9系列CPU支持）", "c": []}, {"t": "安装命令：adb push busybox /system/xbin → cd /system/xbin → chmod 755 busybox → busybox --install .", "c": []}, {"t": "运行busybox提供的命令：直接执行grep，或busybox xxx执行xxx命令", "c": []}]}], "id": "s2"}, {"title": "1.3 本书资源下载说明", "nodes": [{"t": "背景：为解决国内读者无法从Android官网下载源码的问题，作者在115网盘分享本书所用Android源码及其他资源", "c": []}, {"t": "资源清单：Android 4.2.2源码压缩包；.classpath配置文件；busybox-armv7l；Eclipse代码折叠插件Coffee Byte Java", "c": []}, {"t": "特别说明：本书对wpa_supplicant的分析使用Android 4.1源码中的版本（wpa_supplicant_8_4.1）", "c": []}, {"t": "Wi-Fi协议数据包（用AirPcap工具截获，共4个）：p2p_cap（P2P）、wps_pbc（WSC PBC）、wps_pin（WSC PIN）、wpa_supplicant_analysis（STA加入AP）", "c": []}, {"t": "没有AirPcap工具的读者可用Wireshark直接导入这些数据包分析Wi-Fi", "c": []}], "id": "s3"}]}]}, {"name": "Wi-Fi 篇", "color": "#2563eb", "chapters": [{"title": "第2章 深入理解Netd", "sections": [{"title": "2.1 概述", "nodes": [{"t": "Netd定位：Android系统中专门负责网络管理和控制的后台daemon程序，位于Framework层和Kernel层之间，是网络相关消息和命令转发及处理的中枢模块", "c": []}, {"t": "Netd三大功能", "c": [{"t": "设置防火墙（Firewall）、NAT、带宽控制、软接入点（Soft AP）控制、网络设备绑定（Tether）等", "c": []}, {"t": "Android系统中DNS信息的缓存和管理", "c": []}, {"t": "网络服务搜索（NSD）：服务注册（Registration）、服务搜索（Browse）、服务名解析（Resolve）", "c": []}]}, {"t": "Netd工作流程两部分（与Vold类似）", "c": [{"t": "接收并处理来自Framework层NetworkManagementService或NsdService的命令，由对应的Command对象处理", "c": []}, {"t": "接收并解析来自Kernel的UEvent消息，再转发给Framework层对应Service", "c": []}]}], "id": "s4"}, {"title": "2.2 Netd工作流程", "nodes": [{"t": "Netd由init进程根据init.rc配置项启动；启动时创建三个TCP监听socket：netd、dnsproxyd、mdns", "c": []}, {"t": "交互关系：NetworkManagementService连接\"netd\"socket、NsdService连接\"mdns\"socket；所有调用域名解析API（getaddrinfo、gethostbyname等）的进程借由\"dnsproxyd\"socket与Netd建立链接", "c": []}, {"t": "2.2.1 main函数分析", "c": [{"t": "blockSigpipe()屏蔽SIGPIPE信号", "c": []}, {"t": "NetlinkManager::Instance()创建NetlinkManager（NM）", "c": []}, {"t": "new CommandListener()（创建\"netd\"监听socket），nm->setBroadcaster(cl)将CL设为NM的消息发送者", "c": []}, {"t": "nm->start()启动NetlinkManager", "c": []}, {"t": "setenv(\"ANDROID_DNS_MODE\", \"local\", 1)：使Netd自身DNS解析不走代理流程", "c": []}, {"t": "new DnsProxyListener()并startListener()（\"dnsproxyd\"socket）；new MDnsSdListener()并startListener()（\"mdns\"socket）；cl->startListener()", "c": []}, {"t": "主进程while(1)循环等待", "c": []}, {"t": "四个重要成员：NetlinkManager（收Kernel UEvent经Broadcaster发给Framework）；CommandListener/DnsProxyListener/MDnsSdListener（各自创建socket并处理客户端命令）", "c": []}]}, {"t": "2.2.2 NetlinkManager分析", "c": [{"t": "start注册三个UEvent socket（setupSocket同时创建对应NetlinkHandler）", "c": [{"t": "NETLINK_KOBJECT_UEVENT：kobject事件，ASCII格式，关注/sys/class/net下模块加载/卸载", "c": []}, {"t": "NETLINK_ROUTE（RTMGRP_LINK）：路由/链路变化消息，二进制格式，如网线插拔触发的链路通断", "c": []}, {"t": "NETLINK_NFLOG：与带宽控制预警相关（iptables扩展项，并非所有Kernel支持）", "c": []}]}, {"t": "家族成员关系：NetlinkHandler和CommandListener均间接派生自SocketListener；UEvent消息封装为NetlinkEvent对象（ASCII调用parseAsciiNetlinkMessage，二进制调用parseBinaryNetlinkMessage）；处理结果经mBroadcaster传给Framework", "c": []}, {"t": "NetlinkHandler::onEvent按subsys分类处理", "c": [{"t": "subsys=\"net\"：NlActionAdd→notifyInterfaceAdded、Remove→notifyInterfaceRemoved、Change→notifyInterfaceChanged、LinkUp/LinkDown→notifyInterfaceLinkChanged", "c": []}, {"t": "subsys=\"qlog\"：数据量超配额→notifyQuotaLimitReached", "c": []}, {"t": "subsys=\"xt_idletimer\"：跟踪NIC工作状态（idle/active）→notifyInterfaceClassActivity", "c": []}]}, {"t": "工作流程：每个Handler单独创建线程接收socket消息；Kernel发UEvent后onDataAvailable→创建NetlinkEvent解析→onEvent分类处理→经mBroadcaster转发给NetworkManagementService", "c": []}]}, {"t": "2.2.3 CommandListener分析", "c": [{"t": "职责：接收来自Framework层NetworkManagementService的命令，收到后转交给对应命令处理对象", "c": []}, {"t": "定义11个网络相关Command类（均派生自NetdCommand）和10个控制类（Controller）", "c": []}, {"t": "构造函数：registerCmd注册InterfaceCmd、IpFwdCmd、TetherCmd、NatCmd、ListTtysCmd、PppdCmd、SoftapCmd、BandwidthControlCmd、IdletimerControlCmd、ResolverCmd、FirewallCmd；创建10个Controller（静态单例）", "c": []}, {"t": "工作流程：客户端发送命令名（如\"nat\"）→ CL按名字匹配命令对象 → 由该对象的runCommand函数完成实际处理", "c": []}]}, {"t": "2.2.4 DnsProxyListener分析", "c": [{"t": "Android DNS简介：DNS在域名和IP地址之间建立映射；Bionic C基于NetBSD resolver library实现并修改", "c": []}, {"t": "两个常用解析API：getaddrinfo（域名→IP）、getnameinfo（IP→域名）", "c": []}, {"t": "Android对Bionic C的修改：裁剪name-server-switch；DNS配置文件/system/etc/resolv.conf；系统属性保存DNS（net.dns1/net.dns2）；进程特定DNS（net.dns1.<pid>）；不同网络设备对应DNS（net.wlan.dns1）", "c": []}, {"t": "getaddrinfo的Android定制：调用android_getaddrinfo_proxy；读ANDROID_DNS_MODE环境变量（\"local\"则走正常流程）；检查net.dns1.<pid>；否则连接\"/dev/socket/dnsproxyd\"转发给DnsProxyListener", "c": []}, {"t": "DPL命令仅两个：GetAddrInfoCmd（对应getaddrinfo）、GetHostByAddrCmd（对应gethostbyaddr）；GetAddrInfoHandler最终调用Bionic C的getaddrinfo", "c": []}, {"t": "设计好处：所有DNS记录都缓存在Netd进程中，成为公共资源，最大程度信息共享", "c": []}]}, {"t": "2.2.5 MDnsSdListener分析", "c": [{"t": "Apple Bonjour技术：基于组播域名服务（mDNS）的零配置网络标准；解决Addressing（自行选IP并检测冲突）、Naming（组播DNS查询）、Service Discovery（查找服务并解析IP和端口）三个问题", "c": []}, {"t": "实现：Apple开源工程mdnsresponder/mdnsd；开发者用Bonjour API发起注册/查询/解析请求", "c": []}, {"t": "Bonjour三个核心API（dns_sd.h，链接libmdnssd.so）", "c": [{"t": "DNSServiceRegister：服务注册（flags重名冲突处理、regtype格式\"_服务名._传输协议\"、port等）", "c": []}, {"t": "DNSServiceBrowse：服务搜索", "c": []}, {"t": "DNSServiceResolve：服务解析（返回IP地址和端口号）", "c": []}]}, {"t": "MDnsSdListener：对应Framework层NsdService（Android 4.1新增）；内部类Monitor与mdnsd通信（为每个DNSService建Element对象保存在list中）；Handler是注册的Command", "c": []}, {"t": "运行三步：①Netd创建MDnsSdListener，Monitor启动线程与mdnsd通信（socketpair+poll）；②NsdService发\"start-service\"命令；③NsdService发其他命令（如\"discovery\"）由Monitor处理", "c": []}, {"t": "Monitor::startService：读属性init.svc.mdnsd，若mdnsd非running则property_set(\"ctl.start\")启动并wait_for_property等待", "c": []}, {"t": "Handler::serviceRegister：allocateServiceRef分配DNSServiceRef→DNSServiceRegister注册→startMonitoring→回复CommandOkay；回调经sendBroadcast(ServiceRegistrationSucceeded)返回NsdService", "c": []}]}], "id": "s5"}, {"title": "2.3 CommandListener中的命令", "nodes": [{"t": "CL共11个命令，反映Netd在网络管理和控制方面的职责", "c": []}, {"t": "2.3.1 iptables、tc和ip命令", "c": [{"t": "iptables：与Kernel netfilter配合设置过滤（filter）或NAT规则", "c": [{"t": "三要素：Table（表）→Chain（链，Rule集合）→Rule（规则：匹配则执行Target，否则继续下一条）", "c": []}, {"t": "四个Table：filter、nat、mangle、raw；filter默认Chain有INPUT、OUTPUT、FORWARD", "c": []}, {"t": "四个默认Target：ACCEPT、DROP、RETURN、QUEUE；扩展Target REJECT会反馈信息", "c": []}, {"t": "常用参数：-t表、-A追加、-D删除、-I插入、-N新建链、-L显示；-i入网卡、-o出网卡、-p协议、-s源IP、-j跳转", "c": []}, {"t": "iptables仅支持IPv4，IPv6需用ip6tables", "c": []}]}, {"t": "tc（Traffic Control）：通过建立数据包队列并控制发送方式实现流量控制；只能限制本机发出的包（可借助IFB设备在输入方向控制）", "c": [{"t": "队列规则（qdisc）两类：Classless（fifo、SFQ、RED、TBF）；Classfull（借助filter分类送入类中排队，层层过滤）", "c": []}, {"t": "tc流控步骤：①物理设备绑定qdisc；②队列上建立class；③为每分类建立基于路由的filter；④配合filter建立特定路由表", "c": []}]}, {"t": "ip命令：可替代ifconfig、route、arp；语法 ip [OPTIONS] OBJECT [COMMAND]", "c": []}]}, {"t": "2.3.2 CommandListener构造函数和测试工具ndc", "c": [{"t": "构造函数后半部分：createChildChains初始化各Table的Chain（filter表INPUT/FORWARD/OUTPUT、raw表PREROUTING、mangle表POSTROUTING、nat表PREROUTING/POSTROUTING）；setupOemIptablesHook（OEM自定义规则，/system/bin/oem-iptables-init.sh）；各Controller的setupIptablesHooks；sBandwidthCtrl->enableBandwidthControl(false)", "c": []}, {"t": "构造后filter表中的Chain：bw_INPUT/bw_OUTPUT/bw_FORWARD（带宽）、fw_INPUT/fw_OUTPUT/fw_FORWARD（防火墙）、natctrl_FORWARD（NAT）、oem_fwd/oem_out（OEM）", "c": []}, {"t": "ndc测试工具：监视Netd事件（ndc monitor）；连接\"netd\"socket发送命令；对网络HAL层开发者很有帮助", "c": []}]}, {"t": "2.3.3 InterfaceCmd命令", "c": [{"t": "作用：管理和控制系统中的网络设备；与InterfaceController、ThrottleController、SecondaryTableController交互", "c": []}, {"t": "IFB设备：IMQ的替代者，Linux流量控制虚拟设备；输入数据包经ingress qdisc重定向到IFB，在IFB输出方向配置多种qdisc即可对输入流量做队列调度；IFB Device 0用于输入流控、1用于输出流控", "c": []}, {"t": "Netdevice编程：socket句柄+ioctl操作底层网络设备；核心结构struct ifreq；常用SIOCGIFFLAGS/SIOCSIFFLAGS；Android封装ifc_utils（libnetutils）：ifc_init、ifc_up、ifc_set_flags", "c": []}, {"t": "Linux策略路由：依据策略对IP包进行路由选择；Kernel最多255张路由表，4张内置（255 local、254 main、253 default、0保留）；用iproute2（ip命令）配置", "c": []}, {"t": "命令选项六类：NIC设备信息管理（list、readrxcounter/readtxcounter读/proc/net/dev）；输入输出流量控制（setthrottle，实现在ThrottleController，核心用tc：htb qdisc+class+ifb0+ingress重定向filter）；Route控制（默认路由用ifc_add_route，secondary多路由表用SecondaryTableController，如ip route add ... table 78）；Driver控制（加载libnetcmdiface.so向驱动发命令）；IFC设备控制；IPv6控制（ipv6privacyextensions写/proc/sys/net/ipv6/.../use_tempaddr；ipv6写disable_ipv6）", "c": []}]}, {"t": "2.3.4 IpFwd和FirewallCmd命令", "c": [{"t": "IpFwd：控制内核ipforward功能（status/enable/disable），借助TetherController读写/proc/sys/net/ipv4/ip_forward", "c": []}, {"t": "FirewallCmd：enable/is_enabled、set_interface_rule（针对NIC）、set_egress_source_rule/set_egress_dest_rule（基于源/目标IP）、set_uid_rule（按uid设置单进程防火墙）", "c": []}, {"t": "启动防火墙（FirewallController::enableFirewall）：先清空fw_*链规则，再设置INPUT→DROP、OUTPUT→REJECT、FORWARD→REJECT；Android采用\"先禁止全部、再单独放行\"的严厉策略", "c": []}, {"t": "设置进程防火墙（setUidRule）：允许用\"-I\"插入RETURN规则，禁止用\"-D\"删除；局限：多个应用共享同一uid时无法单独禁止", "c": []}]}, {"t": "2.3.5 ListTtysCmd和PppdCmd命令", "c": [{"t": "TTY终端三类：串行端口终端/dev/ttySn；伪终端（master为/dev/ptmx，slave为/dev/pts/下文件，adb shell登录使用）；控制台终端/dev/ttyN和/dev/console", "c": []}, {"t": "伪终端编程：open(\"/dev/ptmx\")得fd→grantpt获取权限、unlockpt解锁→ptsname获得从端设备名→从端打开", "c": []}, {"t": "Netd中logwrap使用伪终端在父子进程间传递log：子进程dup2重定向stdout/stderr后执行，父进程读ptmx内容用ALOG输出；原因：①开源子进程不用ALOG宏；②伪终端不缓存数据", "c": []}, {"t": "PPP协议：链路层点对点协议；组成LCP（链路控制）、NCP（网络控制协议簇）、认证协议（PAP、CHAP）；pppd为运行PPP的后台进程，与Kernel PPP驱动联动", "c": []}, {"t": "ListTtysCmd：枚举/sys/class/tty列出所有tty设备", "c": []}, {"t": "PppdCmd：attach（启动pppd）/detach（杀死pppd）；启动参数含波特率、iplocal:ipremote、ms-dns等；配置后手机相当于一个Modem", "c": []}]}, {"t": "2.3.6 BandwidthControlCmd和IdletimerControlCmd命令", "c": [{"t": "BandwidthControlCmd：Android带宽控制，可针对设备/应用设配额与预警值（超限收到对应NETLINK_NFLOG的qlog UEvent）；依赖iptables扩展模块libxt_quota2", "c": [{"t": "选项：enable/disable；removequota/getquota/setquota等配额增删查；addnaughtyapps/removenaughtyapps（按uid单进程控制）；setglobalalert等预警值增删；gettetherstats", "c": []}]}, {"t": "IdletimerControlCmd：利用iptables扩展模块libxt_idletimer；格式 iptables -t raw -A idletimer -i nic -j IDLETIMER --timeout 秒 --label label --send_nl_msg 1；超时后经/sys/net/xt_idletimer触发UEvent", "c": []}]}, {"t": "2.3.7 NatCmd命令", "c": [{"t": "NAT背景：对数据包的源/目的IP、端口进行改写；分类SNAT（改源地址）、DNAT（改目的地址）", "c": []}, {"t": "Linux NAT由iptables的nat表完成，三条默认Chain：PREROUTING（DNAT）、POSTROUTING（SNAT）、OUTPUT（本地包DNAT）", "c": []}, {"t": "NatCmd仅支持enable/disable；Android的NAT并非只用nat表，还借助ip route命令和filter表", "c": []}, {"t": "enableNat触发的iptables调用：natctrl_FORWARD链按连接状态设规则（ESTABLISHED,RELATED→RETURN、INVALID→DROP）；nat表natctrl_nat_POSTROUTING对出口设备做MASQUERADE（自动读取当前IP做SNAT）", "c": []}]}, {"t": "2.3.8 TetherCmd和SoftapCmd命令", "c": [{"t": "绑定（Tether）：把手机当Modem用；Android 4.2支持三种方式：Soft AP（Wi-Fi）、Bluetooth、USB；TetherCmd还支持逆绑定（reverse tethering）", "c": []}, {"t": "TetherCmd（USB绑定）", "c": [{"t": "背景：RNDIS（微软USB网络设备驱动规范）；DHCP（BOOTP增强版，手机为服务器端）；DNSmasq（Android中充当DHCP服务器的开源软件）", "c": []}, {"t": "步骤①：添加需Tether的接口（USB绑定接口名为rndis0）→TetherController::tetherInterface保存到mInterfaces链表", "c": []}, {"t": "步骤②：\"start\"启动：TetherController::startTethering配置并启动dnsmasq（--dhcp-range地址池、--dhcp-option-force=43,ANDROID_METERED、租约1小时等）", "c": []}]}, {"t": "SoftapCmd", "c": [{"t": "背景：AP（基站设备）与Station（带无线接口的设备）；Soft AP：用软件在Station中实现AP功能；hostapd：用户空间AP和认证服务器守护进程（802.11接入管理、802.1X/WPA/WPA2/EAP认证、RADIUS）", "c": []}, {"t": "步骤①：为Wi-Fi加载不同固件（fwReloadSoftap按角色取固件路径，经wifi_change_fw_path写/sys/module/wlan/parameters/fwpath触发驱动加载）", "c": []}, {"t": "步骤②：配置Soft AP（setSoftap将配置写入/data/misc/wifi/hostapd.conf：interface、driver=nl80211、ssid默认AndroidAP、channel=6、加密方式）", "c": []}, {"t": "步骤③：启动AP（startap启动hostapd进程，-e entropy.bin + hostapd.conf）", "c": []}]}]}, {"t": "2.3.9 ResolverCmd命令", "c": [{"t": "与Android系统DNS实现相关，用于给不同NIC设备配置不同的DNS", "c": []}, {"t": "四个选项：setdefaultif（设置默认NIC）、setifdns（设置不同NIC的DNS）、flushdefaultif、flushif", "c": []}]}], "id": "s6"}, {"title": "2.4 NetworkManagementService介绍", "nodes": [{"t": "NMService通过\"netd\"socket和Netd交互；在SystemServer的ServerThread中创建并注册，随后调用systemReady()", "c": []}, {"t": "ServerThread是Android Java Framework中枢线程，创建绝大部分重要Service（AMS、WMS、PMS、WifiService、WifiP2pService等）", "c": []}, {"t": "2.4.1 create函数", "c": [{"t": "流程：new NetworkManagementService→mThread.start()→connectedSignal.await()等待初始化完成后返回（CountDownLatch同步）", "c": []}, {"t": "构造要点：创建NativeDaemonConnector（连接\"netd\"socket收发数据）；以mConnector为Runnable建线程；Watchdog.getInstance().addMonitor(this)加入监控", "c": []}, {"t": "NetdCallbackReceiver：onDaemonConnected（首次经mConnectedSignal.countDown()使create返回，之后prepareNativeDaemon()）；onEvent处理来自Netd的消息（InterfaceChange、BandwidthControl、InterfaceClassActivity三种）", "c": []}]}, {"t": "2.4.2 systemReady函数", "c": [{"t": "systemReady()直接调用prepareNativeDaemon()", "c": []}, {"t": "流程：检查/proc/net/xt_qtaguid/ctrl判断Kernel是否支持带宽控制→支持则mConnector.execute(\"bandwidth\",\"enable\")→设置系统属性net.qtaguid_enabled→遍历mActiveQuotas恢复配额设置→setFirewallEnabled恢复防火墙规则", "c": []}, {"t": "交互方式示例：mConnector.execute(\"firewall\", \"enable\"/\"disable\")发送命令给Netd（先enforceSystemUid检查权限）", "c": []}]}], "id": "s7"}, {"title": "2.5 本章总结和参考资料说明", "nodes": [{"t": "核心观点：Netd代码简单但背景知识复杂（DNS、Apple Bonjour、iptables实现NAT/防火墙/带宽控制/流量控制/路由控制、USB绑定、Wi-Fi Soft AP等）", "c": []}, {"t": "Netd两大工作主线：NM接收Kernel UEvent消息转发Framework；CL/DPL/MDnsSdListener接收并处理客户端请求", "c": []}, {"t": "NetworkManagementService内容非常简单", "c": []}, {"t": "参考资料：Linux PF_NETLINK（man PF_NETLINK）；DNS/Bonjour（Apple开发文档）；iptables教程与指南；tc（Traffic Control HOWTO）；NetDevice编程（man netdevice）；Linux策略路由；TTY/ptmx（man ptmx）；PPP（Linux PPP HOWTO）；RNDIS/DHCP/DNSmasq；Softap和hostapd（man hostapd、《802.11无线网络权威指南》）", "c": []}], "id": "s8"}]}, {"title": "第3章 Wi-Fi基础知识", "sections": [{"title": "3.1 概述", "nodes": [{"t": "Wi-Fi（Wireless Fidelity）是无线网络通信技术的品牌，由Wi-Fi联盟（WFA）拥有", "c": []}, {"t": "WFA负责Wi-Fi认证与商标授权；严格来说Wi-Fi是一个认证名称，用于测试设备是否符合IEEE 802.11系列协议规范", "c": []}, {"t": "通过认证的设备授予Wi-Fi CERTIFIED商标；WFA的Test Plan参考802.11制订但不完全一致，Wi-Fi可视为802.11规范子集的扩展", "c": []}, {"t": "本章两大内容：IEEE 802.11协议理论知识（无线频谱、802.11/802.X协议、关键概念如AP、MAC帧、无线网络安全）；Linux下通过Wireless Extension和nl80211 API操作无线设备", "c": []}, {"t": "涉及源码文件：wireless.h、driver_wext.c、netlink.h、driver_nl80211.c、nl80211_copy.h", "c": []}], "id": "s9"}, {"title": "3.2 无线电频谱和802.11协议的发展历程", "nodes": [{"t": "3.2.1 无线电频谱知识", "c": [{"t": "无线频谱（单位Hz）是重要资源，各国均有国家级管制", "c": []}, {"t": "主要管制机构：FCC（美国）、ERO（欧洲）、MIIT（中国工信部无线电管理局）、ITU（国际电信联盟）", "c": []}, {"t": "频谱按频率高低划分使用；部分频段须授权使用，部分无须授权", "c": []}, {"t": "无须授权的频谱大部分集中在ISM（Industrial Scientific Medical，国际共用）频段", "c": []}, {"t": "美国ISM频段：902-908MHz、2400-2483.5MHz、5725-5850MHz；各国普遍将2.4GHz划入ISM，因此Wi-Fi、蓝牙均可工作于此频段", "c": []}, {"t": "无须授权仍受功率限制，大功率会干扰其他设备", "c": []}]}, {"t": "3.2.2 IEEE 802.11发展历程", "c": [{"t": "IEEE：美国电气和电子工程师协会；802为其中负责局域网标准的委员会（LMSC），成立于1980年2月", "c": []}, {"t": "802.11代表第11工作组，负责无线局域网MAC及PHY技术规范", "c": []}, {"t": "工作组内细分任务组（TG），编号为字母（a、b、c……）", "c": []}, {"t": "TG编号大小写含义不同：小写（如802.11b）表示基于802.11的修订、不能独立存在；大写（如802.1X）表示体系完备的独立标准", "c": []}, {"t": "802.11-2012标准全文共2793页，涵盖a、b、d、e、g、h、i、j、k、n、p、r、s、u、v、w、y、z各版本技术规范", "c": []}]}], "id": "s10"}, {"title": "3.3 802.11无线网络技术", "nodes": [{"t": "3.3.1 OSI基本参考模型及相关基本概念", "c": [{"t": "OSI/RM：ISO/IEC 7498标准（1983年），将网络体系划分为七层", "c": []}, {"t": "七层由上到下：应用层（HTTP/FTP）、表示层（语法转换、压缩加密）、会话层、传输层（TCP/UDP）、网络层（IP，路由器）、数据链路层（成帧、差错控制，二层交换机/网桥）、物理层（bit）", "c": []}, {"t": "TCP/IP模型可视为OSI/RM的简化版本", "c": []}, {"t": "数据链路层被ISO/IEC 8802划分为MAC子层（解决LAN共用信道竞争分配）和LLC子层（端到端帧交换、差错应答与流量控制）；802.11只涉及MAC层", "c": []}, {"t": "有线网络用CSMA/CD（载波监听多路访问/冲突检测）；无线网络用CSMA/CA（冲突避免）——设备难以同时收发、且冲突中断浪费传输资源", "c": []}, {"t": "CSMA/CA信道利用率低于CSMA/CD，存在隐藏终端问题（802.11b在1Mbps时利用率最高约90%，11Mbps时约65%）", "c": []}, {"t": "CSMA/CA避免碰撞的两种方法：发送前监听并随机退避（backoff）；RTS-CTS握手", "c": []}, {"t": "RTS/CTS原理：发送端先发RTS（含数据帧长度），目标端回CTS；周围站点据此静默——听到RTS但听不到CTS的站可正常发送；听不到RTS但听到CTS的站须关闭发送", "c": []}, {"t": "RTS（20字节）、CTS（14字节）很短；802.11允许三种选择：总是使用、帧长超过阈值时使用、不使用", "c": []}, {"t": "协调功能（CF）：DCF（分布式）、PCF（点协调）、HCF（混合型）、MCF（Mesh）；对应基于竞争与无竞争服务", "c": []}, {"t": "Service/Entity/SAP：层功能用Service表示；Entity为封装一组功能的模块；上层经Service Access Point访问下层服务；原语（primitive）如M_UNITDATA.request/indication", "c": []}, {"t": "SDU与PDU：上层传给MAC的数据为MSDU；MAC封装头后构成MPDU；N+1层PDU对N层而言即N-SDU", "c": []}, {"t": "MIB（管理信息库）：虚拟数据库，树形结构，条目经OID访问；802.11定义的MIB属性文件为802.11mib.txt", "c": []}]}, {"t": "3.3.2 802.11知识点导读", "c": [{"t": "802.11规范全称《Part 11：Wireless LAN MAC and Physical Layer (PHY) Specifications》", "c": []}, {"t": "2012年版共2793页、20小节（clause）、23个附录（A～W）", "c": []}, {"t": "规范类似手册，重视细节精准但前后逻辑连贯性差，难以形成由浅入深的知识框架", "c": []}, {"t": "本章按组件与网络结构→服务→MAC服务与帧→MAC管理实体→安全性顺序介绍核心内容", "c": []}, {"t": "物理层涉及大量无线电与信号处理知识，对软件工程师意义不大，本书不做介绍", "c": []}]}, {"t": "3.3.3 802.11组件", "c": [{"t": "四大物理组件", "c": [{"t": "WM（Wireless Medium，无线媒介）：传送无线MAC帧数据的物理层", "c": []}, {"t": "STA（Station，工作站）：携带无线网卡的设备；无线网卡与有线网卡MAC地址分配自同一地址池", "c": []}, {"t": "AP（Access Point，接入点）：本身也是一个STA，为已关联（associated）STA提供分布式服务（DS）", "c": []}, {"t": "DS（Distribution System，分布式系统）：互连一组BSS和LAN以构成ESS的系统；绝大多数情况下即有线网络", "c": []}]}, {"t": "STA分类：按功能有普通STA、AP、提供QoS的STA；按移动性分Portable STA与Mobile STA", "c": []}, {"t": "BSS（基本服务集）是无线网络的基本构建组件", "c": [{"t": "Independent BSS（IBSS）：不需要AP，STA直接互交，即ad-hoc对等网络", "c": []}, {"t": "Infrastructure BSS：所有交互必须经过AP；STA须完成关联、授权等步骤才能加入；一个STA一次只能属于一个BSS", "c": []}]}, {"t": "ESS（扩展服务集）：一个或多个互连BSS对外表现为单一BSS；STA跨BSS移动时无需切换即可继续上网；ESS内部各BSS拥有相同SSID", "c": []}, {"t": "BSSID：每个BSS的唯一编号；基础结构型网络中即AP的MAC地址；IBSS中为随机生成的MAC地址", "c": []}, {"t": "SSID：网络名，为可读字符串；ESS的SSID即其网络名", "c": []}, {"t": "Portal：将WLAN与LAN结合的逻辑模块，在二者间转换MAC帧，目前功能由AP实现", "c": []}, {"t": "QoS BSS：在WLAN中支持QoS需求的扩展，实现复杂、效果不如LAN", "c": []}]}, {"t": "3.3.4 802.11 Service介绍", "c": [{"t": "服务分类：按模块分SS（Station Service）与DSS（Distribution System Service）；按功能分：6种支持MSDU传输、3种访问控制与数据机密性、2种频谱管理、1种QoS、1种时间同步、1种无线电测量", "c": []}, {"t": "数据传输服务（6种）", "c": [{"t": "Distribution Service：STA传送任何数据都会使用；AP收到帧后经DS传输到目的地", "c": []}, {"t": "Integration Service：当DSS发现目的端为LAN时，经Portal转换无线数据发送到有线网（家用无线路由器即实现了此功能）", "c": []}, {"t": "Transition Type分类：No-Transition、BSS-Transition（ESS内BSS间切换）、ESS-Transition（跨ESS切换）", "c": []}, {"t": "association（关联）：STA传输数据前必须与AP建立映射关系；一个STA同一时刻只能关联一个AP", "c": []}, {"t": "reassociation（重新关联）：STA发生transition时切换关联关系，只能由STA发起", "c": []}, {"t": "disassociation（取消关联）：STA和AP均可发起", "c": []}]}, {"t": "访问控制和数据机密性服务（3种）：Authentication/Deauthentication；Confidentiality（加密方法有WEP、TKIP、CCMP）", "c": []}, {"t": "频谱管理服务（2种，均针对5GHz频段）：TPC（传输功率控制，避免干扰卫星）；DFS（动态频率选择，避免干扰雷达）", "c": []}, {"t": "QoS服务、时间同步服务（TSF机制）、无线电测量服务（查询周围AP信息，源自802.11k）", "c": []}, {"t": "最关键的三个服务：数据传输、安全相关、无线电测量（用于发现周围AP）", "c": []}, {"t": "Service的具体调用通过发送不同的MAC帧触发；与service直接相关的是管理帧", "c": []}]}, {"t": "3.3.5 802.11 MAC服务和帧", "c": [{"t": "MAC服务定义（三种服务/原语）", "c": [{"t": "MA-UNITDATA.request：LLC发送数据；参数含源/目标MAC地址、data（MSDU，不超过2304字节）、priority（用户优先级UP）、service class", "c": []}, {"t": "MA-UNITDATA.indication：MAC收到完整、安全校验无误的帧后通知LLC接收；reception status对802.11永远返回success", "c": []}, {"t": "MA-UNITDATA-STATUS.indication：返回request处理结果；transmission status为Successful或Undeliverable", "c": []}]}, {"t": "MAC帧基本格式", "c": [{"t": "三大组成：MAC Header（Frame Control 2字节、Duration、Address等）、Frame Body（最长2312字节）、FCS（帧校验序列）", "c": []}, {"t": "QoS数据帧附加QoS Control字段，HT数据帧附加HT Control字段", "c": []}]}, {"t": "Frame Control域（2字节16位）：Protocol Version（当前为0）；Type/Subtype（控制、数据、管理三类帧）；To DS/From DS；More Fragments（分片）；Retry（重传）；Power Management（省电）；More Data；Protected Frame（加密）；Order（按序处理）", "c": []}, {"t": "省电模式（Power Save）", "c": [{"t": "STA分Active与PS两种状态，PS下关闭收发器省电", "c": []}, {"t": "AP须记录关联STA的电源状态并缓存其数据（每个STA分配AID）；定时发送数据缓存状态", "c": []}, {"t": "STA通过PS-POLL控制帧获取缓存数据，一次取一帧；More Data=1表示仍有缓存帧", "c": []}]}, {"t": "Duration/ID域（2字节）：PS-POLL帧中表示AID（取值1～2007）；其他帧表示距下一帧到来的微秒数", "c": []}, {"t": "Address域", "c": [{"t": "MAC地址6字节：前24位OUI（厂商代码），后24位厂商唯一编号；第48位区分单播/组播；第47位为G/L位（全球/本地唯一）", "c": []}, {"t": "字节序Big-endian、比特序Little-endian（以太网传输时二者不一致）", "c": []}, {"t": "规范定义五种地址：BSSID、DA（最终接收者）、SA（最初发出者）、TA（发到WM的发送端）、RA（接收端）", "c": []}, {"t": "帧头有4个Address域：Address 1=接收端、Address 2=发送端、Address 3=辅助信息、Address 4用于无线桥接（或Mesh）", "c": []}, {"t": "IBSS中Address 3为BSSID；去往DS时SA=TA、RA=BSSID；来自DS时RA=DA、TA=BSSID", "c": []}]}, {"t": "Sequence Control域（16位）：前4位Fragment Number，后12位Sequence Number；控制帧无编号，重传帧不使用新编号", "c": []}, {"t": "控制帧：RTS（Duration=数据/管理帧+CTS+ACK+3 SIFS）、CTS、ACK、PS-POLL；另有CF-End等", "c": []}, {"t": "管理帧", "c": [{"t": "所有管理帧含MAC Header的6个域，Frame Body携带管理信息：定长字段（Fixed Field）与信息元素（IE）", "c": []}, {"t": "定长字段：Authentication Algorithm Number（0开放系统、1共享密钥、2快速BSS切换、3 SAE）；Beacon Interval（单位TU=1024微秒，一般100 TU）；Capability Information；Listen Interval；AID；Reason Code（67个取值）；Status Code", "c": []}, {"t": "IE结构：Element ID + Length + Information；结构递归嵌套（Subelement）", "c": []}, {"t": "常用管理帧：Beacon（AP定时发送宣告网络存在，即网络心跳）；Probe Request/Response（STA主动搜索网络）；Association Request/Response；Authentication帧", "c": []}, {"t": "管理帧共15种，定长字段42种，IE达120种", "c": []}]}, {"t": "数据帧：QoS Control与HT Control仅QoS/HT时出现", "c": []}, {"t": "上层协议封装：Ethernet帧经RFC 1042转换为LLC帧——增加SNAP header（DSAP、SSAP、Control=0x03、OUI=0x000000）；也支持802.1h封装", "c": []}, {"t": "Radiotap头：网卡添加在MAC头前的数据，记录信号强度、噪声强度、传输速率等物理层信息（AirPcap+Wireshark是常用的抓包分析手段）", "c": []}]}, {"t": "3.3.6 802.11 MAC管理实体", "c": [{"t": "Entity模型：MAC_SAP为LLC服务；MLME（MAC子层管理实体）提供MLME_SAP；PHY细分PLCP和PMD；PLME提供PLME_SAP；SME（Station Management Entity）独立于MAC/PHY", "c": []}, {"t": "MLME_SAP共82个原语，相当于定义了一套接口函数，wpa_supplicant是对它们的实现；常用原语：Scan、Authenticate、Associate", "c": []}, {"t": "MLME-SCAN", "c": [{"t": "request关键参数：BSSType、BSSID、SSID（长度0为wild ssid）、ScanType（ACTIVE/PASSIVE）、ProbeDelay、ChannelList、MinChannelTime/MaxChannelTime", "c": []}, {"t": "ACTIVE扫描：STA在每个信道发Probe Request，等待MinChannelTime～MaxChannelTime", "c": []}, {"t": "PASSIVE扫描：不发送任何信号，在各信道切换并等待Beacon帧", "c": []}, {"t": "confirm返回BSSDescriptionSet与ResultCode；规范未定义网络加入（join）原语，但实际实现需要join处理", "c": []}]}, {"t": "MLME-AUTHENTICATE：含request/confirm/indication/response四个原语；参数含PeerSTAAddress、AuthenticationType（OPEN_SYSTEM/SHARED_KEY/FAST_BSS_TRANSITION/SAE）、ResultCode", "c": []}, {"t": "MLME-ASSOCIATE：关键参数：CapabilityInformation、ListenInterval、RSN（安全信息RSNE）、ResultCode、AssociationID、SupportedRates；RSN场景下关联成功后还需802.1X认证", "c": []}, {"t": "STA状态转换（基础结构型网络）", "c": [{"t": "State 1：未认证未关联，只能发Authentication帧，不能发数据帧", "c": []}, {"t": "State 2：已认证未关联，发Association帧，仍不能发数据帧", "c": []}, {"t": "State 3：已认证已关联但未通过RSN认证，只能发送4-Way Handshake（四次握手）帧", "c": []}, {"t": "State 4：4-Way Handshake成功，完全加入网络", "c": []}, {"t": "MAC帧按类别分Class 1/2/3，不同状态下允许发送的帧类别不同", "c": []}]}]}, {"t": "3.3.7 无线网络安全技术知识点", "c": [{"t": "安全三要素：数据完整性（Integrity）、数据机密性（Confidentiality）、身份验证与访问控制（Authentication and Access Control）", "c": []}, {"t": "安全技术演进：WEP（802.11最早方案）→ WPA（WFA中间方案）→ 802.11i的RSN（WFA称WPA2）", "c": []}, {"t": "Key与Password本质相同：Password为可读的Key，Key一般指算法生成的不可读内容", "c": []}, {"t": "WEP数据加密", "c": [{"t": "采用流密码：数据与密钥流XOR加密；安全性完全依赖Key Stream的随机性", "c": []}, {"t": "PRNG输入为IV（初始向量，24位）+ WEP Key（40/104/128位），输出Key Stream", "c": []}, {"t": "对Data和ICV（完整性校验值，CRC-32计算）一起XOR加密；帧载荷=IV+密文Data+ICV", "c": []}, {"t": "主要弱点：所有数据使用同一个WEP Key加密", "c": []}]}, {"t": "WEP身份验证（Pre-RSNA Authentication）", "c": [{"t": "开放系统认证：等同无验证，总是成功", "c": []}, {"t": "共享密钥认证：四步交互——STA发Authentication请求；AP回128字节质询明文；STA用WEP加密后回发；AP解密校验ICV并比对", "c": []}]}, {"t": "RSN数据加密与完整性校验", "c": [{"t": "WPA的改进：以Michael算法（MIC）替代CRC；采用TKIP为每个MAC帧生成不同Key（密钥混合Key Mixing）", "c": []}, {"t": "TKIP加密流程：Michael算法生成MIC → Phase 1密钥混合（TA、TK、TSC前32位→TTAK）→ Phase 2密钥混合（TTAK+TSC后16位→WEP种子）→ 用WEP方式XOR加密Data与MIC；本质仍为流密码", "c": []}, {"t": "CCMP（WPA2采用）：基于AES块加密（Counter Mode with CBC-MAC Protocol）；PN（帧编号，48位）+KeyId构成CCMP Header；A2、Priority、PN构成Nonce；MAC头构成AAD", "c": []}, {"t": "规范另有BIP（广播/组播管理帧完整性校验协议）", "c": []}]}, {"t": "EAP（RFC3748）", "c": [{"t": "最基础的身份验证协议，既是协议也是框架", "c": []}, {"t": "角色：Authenticator（验证者，通常为AP）、Supplicant（申请者，通常为手机）、BAS（后端认证服务器）、AAA（如RADIUS）、EAP Server", "c": []}, {"t": "Supplicant经EAPOL（EAP Over LAN）发送验证请求；EAP支持PPP、EAPOL、802.11 WLAN、TCP、UDP等底层", "c": []}, {"t": "EAP协议栈：EAP Layer（收发数据、处理重传与重复包）→ EAP Supplicant/Authenticator Layer（按Type分发）→ EAP Method（具体验证算法）", "c": []}, {"t": "EAP格式：Code（1 Request、2 Response、3 Success、4 Failure）、Identifier、Length、Data（含Type与Type Data）", "c": []}, {"t": "Method Type：1 Identity、2 Notification、3 Nak、4 MD5质询、5 OTP、6 GTC、254扩展", "c": []}]}, {"t": "802.1X", "c": [{"t": "详述EAP在有线LAN上的实现（EAPOL）", "c": []}, {"t": "核心概念Port：Controlled Port（认证通过前不允许传任何数据，通过后Port Authorized）与UnControlled Port（只允许EAPOL等少量数据通过）", "c": []}, {"t": "PAE（Port Access Entity）：负责PACP协议相关算法处理，分Supplicant PAE与Authenticator PAE", "c": []}, {"t": "EAPOL格式：Protocol Version、Packet Type、Packet Body Length；EAPOL-Key用于交换密钥信息（EAPOL在802.11帧中的类型为0x888e）", "c": []}, {"t": "EAPOL认证流程（MD5示例）：EAPOL-Start（可选）→ EAP-Request/Identity → EAP-Response/Identity（转RADIUS Access-Request）→ RADIUS Access-Challenge → EAP-Response/MD5 Challenge → 认证成功（EAP-Success）；支持定期握手；Supplicant可发EAPOL-Logoff主动下线", "c": []}]}, {"t": "RSNA（强健安全网络联合）", "c": [{"t": "三步过程：①网络发现——检查Beacon/Probe Response中的RSNE IE，以Open System认证完成Authentication和Association；②进行802.1X认证并分配会话密钥；③通过4-Way Handshake与Group Key Handshake完成密钥管理", "c": []}, {"t": "PMK（成对主密钥）来源：Personal/SOHO环境为PSK（预共享密钥）；Enterprise环境经EAPOL与RADIUS等AS交互获取", "c": []}, {"t": "单播密钥派生：PMK（256位）经PRF结合双方Nonce与MAC地址扩展出PTK；PTK含EAPOL KCK（算MIC）、EAPOL KEK（加密密钥消息）及TK（数据加密密钥）", "c": []}, {"t": "4-Way Handshake流程：①AP发ANonce；②STA派生PTK并回发SNonce与MIC；③AP发送GTK（用KEK加密）与MIC；④STA回发确认并安装PTK；⑤双方Install密钥开始加密通信", "c": []}, {"t": "组播/单播可用不同加密方法（混合加密）；限制：组播用CCMP时单播不能用TKIP", "c": []}, {"t": "PMK缓存（PMKSA）：含AP的MAC地址、PMK生命周期、PMKID；关联时STA把PMKID放入RSNE，双方都有缓存则跳过802.1X协商直接进入4-Way Handshake", "c": []}, {"t": "安全体系总结：WEP解决完整性与机密性（保护弱）→TKIP/CCMP（AES）解决完整性与机密性→RSNA解决认证与密钥派生/缓存", "c": []}, {"t": "简单公式：WPA-企业=802.1X+EAP+TKIP；WPA2-企业=802.1X+EAP+CCMP；WPA-个人=PSK+TKIP；WPA2-个人=PSK+CCMP", "c": []}]}]}], "id": "s11"}, {"title": "3.4 Linux Wi-Fi编程API", "nodes": [{"t": "Linux常用无线编程API两套", "c": [{"t": "Linux Wireless Extensions（wext）：Jean Tourrilhes于1997年开发，用户空间程序通过ioctl控制无线网卡驱动", "c": []}, {"t": "cfg80211 + nl80211：替代wext；cfg80211供驱动开发，nl80211供用户空间进程操作基于cfg80211的驱动", "c": []}, {"t": "ioctl不被Linux驱动开发推荐：支持可变个数参数、参数类型无法由函数原型说明", "c": []}, {"t": "网卡分SoftMAC（MLME基本在软件层，cfg80211仅支持此类，市面上占绝大多数）与FullMAC（MLME全在硬件）", "c": []}]}, {"t": "3.4.1 Linux Wireless Extensions介绍", "c": [{"t": "wext API定义于wireless.h；Android 4.2中wext版本为20（宏WIRELESS_EXT）", "c": []}, {"t": "常用数据结构", "c": [{"t": "struct iwreq：用户空间请求统一入口；ifr_name指定网卡设备名（如wlan0），iwreq_data联合体（最大16字节）存储具体参数", "c": []}, {"t": "iwreq_data成员：iw_point（参数超过16字节时指向外部内存）、iw_param、iw_freq（值0-1000代表channel，大于1000代表频率）、essid、nwid、bitrate、txpower、rts、mode等", "c": []}, {"t": "struct iw_scan_req：scan_type（IW_SCAN_TYPE_ACTIVE/PASSIVE）、essid_len、num_channels（0为扫描所有允许信道）、bssid（全FF为wildcard）、min/max_channel_time、channel_list（最多32个）", "c": []}]}, {"t": "使用实例（wpa_supplicant的wpa_driver_wext_scan）：构造iwreq→填写iw_scan_req（flags=IW_SCAN_THIS_ESSID只扫描指定ESSID）→ioctl(sock, SIOCSIWSCAN, &iwr)通知驱动扫描", "c": []}]}, {"t": "3.4.2 nl80211介绍", "c": [{"t": "nl80211基于netlink机制（非ioctl），使用难度较大；netlink是Linux基于socket的IPC机制", "c": []}, {"t": "libnl开源库是最著名的netlink编程框架；Android在system/core/libnl_2目录移植并精简了libnl", "c": []}, {"t": "netlink编程基础", "c": [{"t": "socket创建：domain必须为AF_NETLINK；protocol指定内核子系统（NETLINK_ROUTE、NETLINK_KOBJECT_UEVENT等）", "c": []}, {"t": "寻址：struct sockaddr_nl——nl_pid（0表示目标是Kernel）；nl_groups为多播组掩码（如RTMGRP_LINK）", "c": []}, {"t": "消息头struct nlmsghdr：nlmsg_len、nlmsg_type、nlmsg_flags、nlmsg_seq（序列号）、nlmsg_pid", "c": []}, {"t": "消息类型：NLMSG_NOOP、NLMSG_ERROR（error=0表示成功）、NLMSG_DONE（大数据分片的最后一个分片）", "c": []}, {"t": "按C/S角度分：Request（须置NLM_F_REQUEST）、Response、Notification；常用flags：NLM_F_REQUEST、NLM_F_MULTI（内核单消息上限约4KB）、NLM_F_ACK", "c": []}, {"t": "帮助宏：NLMSG_ALIGN、NLMSG_LENGTH、NLMSG_DATA、NLMSG_NEXT、NLMSG_OK、NLMSG_PAYLOAD；典型解析模式为recvmsg后用NLMSG_OK/NLMSG_NEXT循环", "c": []}, {"t": "nlattr结构（nla_len、nla_type）：以属性方式规范Payload", "c": []}]}, {"t": "libnl开源库", "c": [{"t": "架构：核心libnl之上的libnl-route、libnl-nf、libnl-genl", "c": []}, {"t": "nl_sock：nl_socket_alloc/free；nl_connect绑定protocol；回调管理nl_socket_modify_cb（NL_CB_ACK等/NL_CB_CUSTOM）；nl_cb_err处理错误消息", "c": []}, {"t": "消息处理：nlmsg_size/total_size计算长度；nlmsg_for_each遍历；nlmsg_alloc/free/put管理nl_msg", "c": []}, {"t": "收发：发送nl_sendto/nl_send/nl_send_simple；接收nl_recv与nl_recvmsgs（经cb回调分发）", "c": []}, {"t": "libnl-genl：genl消息含genlmsghdr（cmd、version）；genl机制：内核维护虚拟Generic Netlink Bus，Controller（family name为\"nlctrl\"）动态分配family编号；常用API：genl_ctrl_resolve（按名字查family）、genl_ctrl_alloc_cache、genl_ctrl_search_by_name", "c": []}]}, {"t": "nl80211实例（wpa_driver_nl80211_scan）", "c": [{"t": "流程：nlmsg_alloc分配消息→nl80211_cmd（genlmsg_put，命令为NL80211_CMD_TRIGGER_SCAN）→nla_put_u32设置NL80211_ATTR_IFINDEX→nla_put_nested嵌套NL80211_ATTR_SCAN_SSIDS→send_and_recv_msgs发送", "c": []}, {"t": "nl80211_copy.h定义94条命令与155条属性，注释详细", "c": []}, {"t": "nl80211与wext本质无大区别：都围绕MAC层service设计数据结构，仅通信机制（netlink vs ioctl）不同", "c": []}]}]}], "id": "s12"}, {"title": "3.5 本章总结和参考资料说明", "nodes": [{"t": "全章逻辑：无线频谱与802.11发展历程 → OSI/RM及Entity/SAP/MIB基本概念 → 802.11组件、网络结构与服务 → MAC帧格式与MLME（理解后续wpa_supplicant的核心）→ 安全性 → Linux Wi-Fi API（wext简单易上手，nl80211使用最多）", "c": []}, {"t": "本章是作者耗时最长的一章；后续章节在分析wpa_supplicant时以背景知识方式补充", "c": []}, {"t": "参考资料：《Real 802.11 Security》；《802.11无线网络权威指南（第2版）》（802.11书籍的\"圣经\"）；《802.11-2012》官方规范；ISO/IEC 7498-1（OSI模型）、ISO/IEC 8802-2（LLC）、IEEE 802.1X-2010；RFC3748（EAP）；Linux Wireless官网；libnl官网；微软\"How 802.11 Wireless Works\"", "c": []}], "id": "s13"}]}, {"title": "第4章 深入理解wpa_supplicant", "sections": [{"title": "4.1 概述", "nodes": [{"t": "wpa_supplicant（简称WPAS）：开源项目，实现Station对无线网络的管理与控制；官方地址 hostap.epitest.fi", "c": []}, {"t": "安全功能：支持WPA/WPA2（WPA-PSK个人版、WPA-Enterprise/RADIUS）、CCMP/TKIP/WEP104/WEP40加密、PMKSA缓存与预认证、802.11r（Fast Transition快速BSS切换）、802.11w（管理帧保护）、WPS/P2P/TDLS", "c": []}, {"t": "EAP支持：多达25种EAP Method，如EAP-TLS、EAP-PEAP、EAP-TTLS、EAP-SIM等", "c": []}, {"t": "驱动支持：nl80211/cfg80211、Linux Wireless Extension（V19以后）、Windows NDIS", "c": []}, {"t": "Android中的位置：Android 4.1的external下有wpa_supplicant_6与wpa_supplicant_8；本书分析wpa_supplicant_8", "c": []}, {"t": "wpa_supplicant_8三个主要子目录：hostapd（Soft AP模式）、wpa_supplicant（Station模式，本书重点）、src（公共代码）", "c": []}, {"t": "WPAS是Android用户空间Wi-Fi核心模块，Framework层所有Wi-Fi操作最终经其完成", "c": []}, {"t": "本章两条分析路线：路线一为初始化流程（了解数据结构及关系）；路线二为命令行发送命令使手机加入WPA-PSK网络（了解命令处理、scan、association、4-Way Handshake）", "c": []}, {"t": "注意区分：wpa_supplicant既指程序，也是核心数据结构名", "c": []}], "id": "s14"}, {"title": "4.2 初识wpa_supplicant", "nodes": [{"t": "4.2.1 wpa_supplicant架构", "c": [{"t": "规模：500多个文件、约20万行代码", "c": []}, {"t": "event loop模块：WPAS基于事件驱动，无多线程，所有事件处理在主线程完成", "c": []}, {"t": "driver i/f模块：隔离driver wrapper（如wext、ndiswrapper、nl80211），使其他模块与平台/驱动无关", "c": []}, {"t": "driver events：driver wrapper通过事件方式向WPAS上层反馈信息", "c": []}, {"t": "状态机：RFC4137定义EAP状态机、802.1X定义EAPOL状态机，WPAS分别实现，另有自有的WPA/WPA2状态机", "c": []}, {"t": "EAP method模块、TLS模块、crypto模块支持各EAP方法", "c": []}, {"t": "l2_packet模块：收发EAPOL/EAP消息（属LLC层数据）", "c": []}, {"t": "configuration模块：处理大量配置参数", "c": []}, {"t": "ctrl i/f模块：C/S结构Server端接口；Linux/UNIX下用Unix域socket，客户端有wpa_cli（命令行）、wpa_gui（Qt）", "c": []}]}, {"t": "4.2.2 wpa_supplicant编译配置", "c": [{"t": "编译环境：source build/envsetup、lunch（选full-eng）", "c": []}, {"t": "BoardConfig.mk关键配置：WPA_SUPPLICANT_VERSION=VER_0_8_X、BOARD_WPA_SUPPLICANT_DRIVER=NL80211、BOARD_WLAN_DEVICE=bcmdhd、BOARD_WPA_SUPPLICANT_PRIVATE_LIB=lib_driver_cmd_bcmdhd", "c": []}, {"t": "android.cfg（编译配置文件）：CONFIG_DRIVER_WEXT、CONFIG_DRIVER_NL80211、CONFIG_LIBNL20等；与BoardConfig.mk重复时后者优先级高", "c": []}, {"t": "编译步骤：先mmm编lib_driver_cmd_bcmdhd静态库，再mmm external/wpa_supplicant_8（同时生成wpa_cli）", "c": []}, {"t": "部署：替换/system/bin/wpa_supplicant并chmod 0755，wpa_cli push到/system/bin", "c": []}]}, {"t": "4.2.3 wpa_supplicant命令和控制API", "c": [{"t": "Android中客户端是Framework的WifiService，Settings的Wi-Fi操作经WifiService发命令给WPAS执行", "c": []}, {"t": "常见命令：PING（心跳，回复\"PONG\"）、MIB、STATUS、ADD_NETWORK（添加网络返回network id）、SET_NETWORK <id> <variable> <value>、ENABLE_NETWORK <id>（触发加入该网络）", "c": []}, {"t": "Interactive Request（WPAS主动要求客户端输入）：格式CTRL-REQ-<field>-<network id>-<text>，回复CTRL-RSP-<field>-<network id>-<value>；field包括PASSWORD、IDENTITY、PIN等", "c": []}, {"t": "通知事件：CTRL-EVENT-<field>-<text>；另有\"WPA：XXX\"和\"WPS-XXX\"事件", "c": []}, {"t": "控制API（wpa_ctrl.h，链接libwpa_client.so）：wpa_ctrl_open/close创建销毁wpa_ctrl对象；wpa_ctrl_request发送命令并收回复", "c": []}, {"t": "solicited event（命令回复）与unsolicited event（CTRL-EVENT通知）区别；msg_cb回调用于在等待命令回复时处理通知事件", "c": []}, {"t": "wpa_ctrl_attach打开通知监听；wpa_ctrl_recv直接接收unsolicited event", "c": []}, {"t": "常见用法：客户端创建两个wpa_ctrl对象——一个attach后专职收通知，另一个专职发命令收回复（WifiService即此做法）", "c": []}]}, {"t": "4.2.4 git的使用", "c": [{"t": "WPAS注释少，需借助git查历史版本溯源", "c": []}, {"t": "git clone git://w1.fi/srv/git/hostap.git 下载官方代码", "c": []}, {"t": "git blame <file> | grep <变量>：定位变量最早出现的patch", "c": []}, {"t": "git log <commit id> / git show <commit id>：查看commit说明以理解变量含义", "c": []}]}], "id": "s15"}, {"title": "4.3 wpa_supplicant初始化流程", "nodes": [{"t": "启动机制与配置文件", "c": [{"t": "Android通过\"setprop ctrl.start wpa_supplicant\"触发init进程fork子进程启动WPAS；init.rc中定义为service", "c": []}, {"t": "\"-c\"参数指定配置文件，如/data/misc/wifi/wpa_supplicant.conf", "c": []}, {"t": "ctrl_interface：控制接口unix域socket文件名；update_config：运行时修改需回存配置文件", "c": []}, {"t": "WPS相关配置（device_name～config_method）、P2P相关（p2p等）", "c": []}, {"t": "network配置项对应每个无线网络：ssid、key_mgmt、认证方法、密码、priority（多网络可用时优先选priority高者）；WPAS找到已保存网络会自动尝试加入", "c": []}]}, {"t": "4.3.1 main函数分析（main.c）", "c": [{"t": "流程：os_program_init()→参数解析getopt→wpa_supplicant_init(&params)→wpa_supplicant_add_iface()（逐个添加接口）→wpa_supplicant_run(global)→wpa_supplicant_deinit(global)", "c": []}, {"t": "参数：-c配置文件、-D driver名、-e初始随机数文件、-i网络接口名（如wlan0）", "c": []}, {"t": "重要数据结构：wpa_interface（描述一个无线网络设备）、wpa_global（全局上下文；ifaces指向wpa_supplicant对象单链表；drv_priv为driver wrapper全局上下文数组）", "c": []}, {"t": "wpa_supplicant：WPAS核心数据结构，一个interface对应一个，通过next链接成链表", "c": []}, {"t": "ctrl_iface_global_priv：全局控制接口信息，含通信socket句柄", "c": []}, {"t": "Android平台用select或epoll实现多路I/O复用", "c": []}]}, {"t": "4.3.2 wpa_supplicant_init函数分析", "c": [{"t": "主要工作：初始化wpa_global及全局资源（随机数、eloop事件循环、消息全局回调）", "c": []}, {"t": "关键步骤：wpa_msg_register_ifname_cb→wpa_debug_open_file→eap_register_methods()（关键点①）→创建wpa_global→eloop_init()（关键点②）→random_init→wpa_supplicant_global_ctrl_iface_init→wpas_notify_supplicant_initialized→遍历wpa_drivers计数drv_count并分配drv_priv数组（关键点③）", "c": []}, {"t": "消息全局回调（wpa_debug.c）：wpa_msg_get_ifname_func（获取网卡接口名）；wpa_msg_cb_func（把输出信息发给客户端，消息前缀\"<3>\"即由其添加）", "c": []}, {"t": "eap_register_methods：按编译宏注册EAP方法（如EAP_MD5→eap_peer_md5_register()）；注册时填充struct eap_method（与RFC4137关系密切）", "c": []}, {"t": "eloop_init与event loop模块：核心结构体eloop_data；基于epoll或select的I/O复用", "c": []}, {"t": "eloop支持5种事件：read event、write event、exception event、timeout event、signal（信号事件）", "c": []}, {"t": "事件注册API：eloop_register_read_sock、eloop_register_sock、eloop_register_timeout、eloop_register_signal", "c": []}, {"t": "eloop_run：while循环中枢——计算最近超时时间→填fd_set→select→先处理信号→处理超时→按读/写/异常分发表", "c": []}, {"t": "wpa_drivers数组：成员为wpa_driver_ops对象指针，按CONFIG_DRIVER_WEXT/CONFIG_DRIVER_NL80211等编译选项决定；wpa_driver_ops是driver i/f核心结构（函数指针隔离上层与具体driver）", "c": []}, {"t": "术语：driver wrapper指WPAS中用户空间的Kernel wlan驱动代理；\"driver\"专指Kernel内wlan驱动", "c": []}, {"t": "wpa_driver_nl80211_ops要点：name=\"nl80211\"、get_bssid、scan2=wpa_driver_nl80211_scan、get_scan_results2、authenticate/associate、global_init=nl80211_global_init、init2=wpa_driver_nl80211_init、Android下driver_cmd=wpa_driver_nl80211_driver_cmd", "c": []}]}, {"t": "4.3.3 wpa_supplicant_add_iface函数分析", "c": [{"t": "流程：wpa_supplicant_alloc()→设global→wpa_supplicant_init_iface()（核心）→wpas_notify_iface_added→逐ssid调用wpas_notify_network_added→头插法挂入global->ifaces链表", "c": []}, {"t": "wpa_ssid结构体：配置文件中每个network项的代码映射；通过next构成单链表", "c": []}, {"t": "安全成员：passphrase（字符串密码）；psk（实际密钥，由passphrase与ssid计算，见802.11-2012附录M.4）", "c": []}, {"t": "pairwise_cipher/group_cipher：WPA_CIPHER_NONE/WEP40/WEP104/TKIP/CCMP；默认DEFAULT_PAIRWISE=CCMP|TKIP、DEFAULT_GROUP=CCMP|TKIP|WEP104|WEP40", "c": []}, {"t": "key_mgmt（对应802.11 AKM suite）：WPA_KEY_MGMT_IEEE8021X/PSK/NONE/WPS等；DEFAULT_KEY_MGMT=PSK|IEEE8021X", "c": []}, {"t": "proto：WPA_PROTO_WPA、WPA_PROTO_RSN（RSN即WPA2）", "c": []}, {"t": "auth_alg：OPEN（WPA/RSN必须）、SHARED、LEAP（思科）、FT；eapol_flags：动态WEP Key", "c": []}, {"t": "其他成员：proactive_key_caching（OPC/OKC机会性PMK缓存，切换AP可跳过802.1X直接进4-Way Handshake）；disable；mode（WPAS_MODE_INFRA等）", "c": []}, {"t": "wpa_supplicant结构体成员：drv_priv（保存init2返回的driver wrapper上下文）；current_bss（类型wpa_bss——无线网络在WPAS中的代表）", "c": []}, {"t": "安全成员：pairwise_cipher、group_cipher、key_mgmt、wpa_proto、mgmt_group_cipher（与802.11w相关）；countermeasures（TKIP MIC对策：60秒内两次MIC错误则停止TKIP通信60秒）", "c": []}, {"t": "功能成员：sched_scan_timeout（计划扫描，需Kernel 3.0+驱动支持）；bgscan（后台扫描与漫游）；gas（GAS/ANQP与802.11u）；CONFIG_SME（编译宏）", "c": []}, {"t": "wpa_states取值：WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED", "c": []}]}, {"t": "4.3.4 wpa_supplicant_init_iface函数分析", "c": [{"t": "之一：解析配置文件wpa_config_read——遇\"network={\"调wpa_config_read_network生成wpa_ssid并挂链表；其余项由wpa_config_process_global解析；blob项用于存证书等；wpa_config：配置文件在代码中的代表", "c": []}, {"t": "之二：复制ifname；eapol_sm_notify_portEnabled/portValid置FALSE；wpa_supplicant_set_driver按名找到wpa_driver_nl80211_ops并调global_init", "c": []}, {"t": "nl80211_global_init：创建nl80211_global；netlink_init创建netlink socket收内核网卡状态事件（UP/DORMANT/REMOVED），回调newlink_cb/dellink_cb，加入RTMGRP_LINK组播组", "c": []}, {"t": "wpa_driver_nl80211_init_nl_global：nl_cb_alloc创建回调；genl_connect连接内核创建global->nl（发消息）与global->nl_event（收消息）；genl_ctrl_resolve查询\"nl80211\"family编号", "c": []}, {"t": "加入\"scan\"、\"mlme\"、\"regulatory\"三个组播组；eloop_register_read_sock注册nl_event，回调wpa_driver_nl80211_event_receive→nl_recvmsgs→process_global_event", "c": []}, {"t": "之三：wpa_drv_init调driver wrapper的init2→wpa_driver_nl80211_init：创建wpa_driver_nl80211_data；nl80211_get_phy_name读/sys/class/net/wlan0/phy80211/name；rfkill_init；wpa_driver_nl80211_finish_drv_init；创建PF_PACKET域eapol_tx_sock；返回i802_bss对象", "c": []}, {"t": "rfkill背景：Kernel子系统，控制射频设备（Wi-Fi/GPS/BT/FM）电源；hard block与soft block；用户空间经/dev/rfkill；WPAS只监控不操作rfkill", "c": []}, {"t": "PF_PACKET背景：socket域之一，直接在数据链路层收发（可实现EAP/EAPOL等协议）；socket_type为SOCK_DGRAM或SOCK_RAW；struct sockaddr_ll表达物理层地址", "c": []}, {"t": "回调对象辨析：真正使用的回调仅两个：bss->nl_cb（process_bss_event）与global->nl_cb（process_global_event）", "c": []}, {"t": "wpa_driver_nl80211_finish_drv_init：①if_nametoindex取ifindex；②设为NL80211_IFTYPE_STATION；③linux_set_iface_flags（SIOCSIFFLAGS+IFF_UP）启用网卡，失败时查rfkill_is_blocked；④netlink_send_oper_ifla设IfOperStatus为IF_OPER_DORMANT；⑤wpa_driver_nl80211_capa获取capability；⑥linux_get_ifhwaddr取MAC", "c": []}, {"t": "Virtual Interface背景：一块物理网卡多个虚拟设备/虚拟MAC（如P2P Concurrent设备）；nl80211_iftype枚举：ADHOC、STATION、AP、AP_VLAN、WDS、MONITOR、MESH_POINT、P2P_CLIENT、P2P_GO等", "c": []}, {"t": "IfOperStatus（RFC2863）：UNKNOWN、NOTPRESENT、DOWN、LOWERLAYERDOWN、TESTING、DORMANT、UP", "c": []}, {"t": "wpa_driver_nl80211_capa：发NL80211_CMD_GET_WIPHY获取设备信息；填充drv->capa（key_mgmt、enc、auth默认值）及flags；AP相关变量：device_ap_sme、poll_command_supported、data_tx_status、use_monitor", "c": []}, {"t": "之四：wpa_supplicant_init_wpa（wpas_glue.c）——创建wpa_sm_ctx填函数指针，wpa_sm_init创建wpa_sm；wpa_sm相关结构：wpa_sm_ctx（函数指针集合）、wpa_sm（eapol成员指向eapol_sm，含pmksa=pmksa_cache_init创建的PMKSA缓存）", "c": []}, {"t": "MIB变量：dot11RSNAConfigPMKLifetime（PMKSA有效期，默认43200秒）、dot11RSNAConfigPMKReauthThreshold（有效期过70%需重认证）、dot11RSNAConfigSATimeout（认证最长60秒）", "c": []}, {"t": "新capability：probe_resp_offloads、max_scan_ssids、max_sched_scan_ssids与sched_scan_supported、max_match_sets、max_remain_on_chan、max_stations", "c": []}, {"t": "之五：wpa_supplicant_driver_init→wpas_wps_init→wpa_supplicant_init_eapol（4.4节）→wpa_supplicant_ctrl_iface_init→gas_query_init→wpas_p2p_init（CONFIG_P2P）→wpa_bss_init", "c": []}, {"t": "wpa_supplicant_driver_init：wpa_supplicant_update_mac_addr（l2_packet_init：PF_PACKET+SOCK_DGRAM，ETH_P_EAPOL，回调wpa_supplicant_rx_eapol收EAPOL/EAP帧——对4-Way Handshake至关重要）；无使能网络则设状态WPA_INACTIVE", "c": []}, {"t": "wpa_supplicant_ctrl_iface_init：创建unix域socket；Android定制：addr.sun_path=\"wpa_<ifname>\"（如wpa_wlan0）；eloop注册读回调wpa_supplicant_ctrl_iface_receive处理客户端命令", "c": []}, {"t": "wpa_bss_init：初始化双链表；注册10秒周期超时任务wpa_bss_timeout→wpa_bss_flush_by_age（bss_expiration_age默认1800秒）删除过期wpa_bss", "c": []}]}], "id": "s16"}, {"title": "4.4 EAP和EAPOL模块", "nodes": [{"t": "4.4.1 EAP模块分析（基于RFC4137）", "c": [{"t": "RFC4137：\"State Machine for EAP Peer and Authenticator\"；本节重点SUPP端SM", "c": []}, {"t": "SUPP SM共13个状态（如INITIALIZE、IDLE、DISCARD、FAILURE等）；每个状态可有Entry Action（EA）；UCT=Unconditional Transition无条件转换", "c": []}, {"t": "RFC4137三层模型：底层Lower Layer（LL，收发EAP包）→中间SUPP SM层→顶层EAP Method（EM）层；WPAS中LL层即EAPOL模块", "c": []}, {"t": "LL与SUPP SM交互变量：LL收包存eapReqData并置eapReq=TRUE触发SM；SM处理后置eapResp=TRUE或eapNoResp=TRUE；验证结束置eapSuccess/eapFailure", "c": []}, {"t": "altAccept/altReject：更合适命名为lowerLayerSuccess/lowerLayerFailure；802.11下收到Disassociate/Deauthenticate帧=Failure，收到4-Way Handshake第一帧=Success", "c": []}, {"t": "数据结构与类型（eap_i.h）：枚举EapDecision、EapMethodState；struct eap_sm：RFC4137 EAP SUPP SM代表，成员命名几乎严格按规范；m指向eap_method单链表；eapol_cb指向eapol_callbacks（LL层代表）", "c": []}, {"t": "WPAS状态机通用宏（state_machine.h）：SM_STATE(machine,state)定义某状态EA函数；SM_ENTRY为EA入口公共代码；SM_ENTER调用指定状态EA；SM_STEP定义状态机步进函数；SM_STEP_RUN调用之", "c": []}, {"t": "EAP SM实现：SM_STEP(EAP)先处理UCT（eapRestart&&portEnabled→INITIALIZE；num_rounds>EAP_MAX_AUTH_ROUNDS(50)→FAILURE），否则按当前状态分发", "c": []}, {"t": "小结：掌握RFC4137与状态切换图是理解EAP SUPP SM的基石；日志（wpa_printf输出entering state）对分析WPAS日志很重要", "c": []}]}, {"t": "4.4.2 EAPOL模块分析（基于IEEE 802.1X-2004）", "c": [{"t": "802.1X中EAPOL模块是EAP SUPP的LL层", "c": []}, {"t": "802.1X为EAPOL Supplicant定义5个状态机：Port Timers SM（超时控制）、Supplicant PAE SM（Port Access Entity，维护Port状态）、Supplicant Backend SM（发送EAPOL回复）、The Key Receiver SM（处理EAPOL-Key帧）、The Supplicant Key Transmit SM（WPAS未实现）", "c": []}, {"t": "规范统称PACP（Port Access Control Protocol）State Machine", "c": []}, {"t": "Port Timers SM：WPAS未用状态机宏，而是eloop注册1秒超时函数eapol_port_timers_tick递减authWhile/heldWhile/startWhen/idleWhile，最后必调eapol_sm_step联动其他状态机", "c": []}, {"t": "Key Receiver SM：NO_KEY_RECEIVE与KEY_RECEIVE两状态；rxKey=TRUE时进入KEY_RECEIVE并调eapol_sm_processKey", "c": []}, {"t": "PAE SM：状态较多（LOGOFF、CONNECTING、AUTHENTICATING、AUTHENTICATED、HELD等）；函数txStart（发EAPOL-Start）、txLogoff（发EAPOL-Logoff）", "c": []}, {"t": "Backend SM：authPeriod默认30秒；函数abortSupp、txSuppResp（发EAPOL-Packet）", "c": []}, {"t": "数据结构：struct eapol_sm存储PACP状态机信息；eapol_ctx定义EAPOL模块与wpa_supplicant等其他模块的交互接口；WPAS其他模块一般只与EAPOL模块交互，EAP模块由EAPOL触发", "c": []}, {"t": "初始化wpa_supplicant_init_eapol：填eapol_ctx（eapol_send=wpa_supplicant_eapol_send、eapol_done_cb等）→eapol_sm_init；默认值：portControl=Auto、heldPeriod=60、startPeriod=30、maxStart=3、authPeriod=30", "c": []}, {"t": "状态机联动eapol_sm_step：for循环（上限100防死循环）中依次SM_STEP_RUN(SUPP_PAE)、(KEY_RX)、(SUPP_BE)、eap_peer_sm_step；changed为TRUE则继续循环；结束时回调sm->ctx->cb", "c": []}, {"t": "初始化后状态：SUPP_PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、SUPP_BE=IDLE、EAP_SM=DISABLED", "c": []}, {"t": "学习建议：EAPOL/EAP状态机严格遵循协议，先理解协议状态切换与变量再看代码", "c": []}]}], "id": "s17"}, {"title": "4.5 wpa_supplicant连接无线网络分析", "nodes": [{"t": "实验环境与命令流程", "c": [{"t": "命令序列：adb root→adb shell→wpa_cli -iwlan0→ADD_NETWORK→SET_NETWORK 0 ssid \"Test\"→SET_NETWORK 0 key_mgmt WPA-PSK→SET_NETWORK 0 psk \"12345Test\"→ENABLE_NETWORK 0→dhcpcd wlan0获取IP", "c": []}, {"t": "注意：先在Settings开Wi-Fi；可清空Settings中已知网络避免WifiService干扰；WPAS支持多客户端", "c": []}, {"t": "所有客户端命令入口：eloop读回调wpa_supplicant_ctrl_iface_receive——recvfrom收命令；处理\"ATTACH\"/\"DETACH\"/\"LEVEL\"；其余交wpa_supplicant_ctrl_iface_process", "c": []}]}, {"t": "4.5.1 ADD_NETWORK命令处理", "c": [{"t": "wpa_supplicant_ctrl_iface_process：分配4096字节reply，按命令名分发；reply_len<0时回复\"FAIL\"", "c": []}, {"t": "wpa_supplicant_ctrl_iface_add_network：wpa_config_add_network分配wpa_ssid并挂入wpa_config链表→disabled=1（未启用）→wpa_config_set_network_defaults→返回ssid->id", "c": []}, {"t": "默认值：proto、pairwise_cipher、group_cipher、key_mgmt取DEFAULT_*；eapol_flags=DEFAULT_EAPOL_FLAGS（单播+组播动态WEP Key）；eap_workaround=1；fragment_size=1398", "c": []}]}, {"t": "4.5.2 SET_NETWORK命令处理", "c": [{"t": "流程：解析\"<id> <variable> <value>\"→wpa_config_get_network按id找wpa_ssid→wpa_config_set设置值（宏+数组实现）→wpa_sm_pmksa_cache_flush清PMKSA缓存", "c": []}, {"t": "本例结果：ssid=\"Test\"、key_mgmt=WPA_KEY_MGMT_PSK、passphrase=\"12345Test\"（命令中psk实际存入passphrase变量）", "c": []}, {"t": "设置psk且ssid已有值时调wpa_config_update_psk：pbkdf2_sha1(passphrase, ssid, ssid_len, 4096, psk, PMK_LEN)将passphrase转成PSK", "c": []}, {"t": "背景区分：Passphrase/Password为人读字符串，Key为二进制/十六进制；STA与AP交互用Key，用户设置Passphrase", "c": []}]}, {"t": "4.5.3 ENABLE_NETWORK命令处理", "c": [{"t": "wpa_supplicant_ctrl_iface_enable_network：参数\"all\"使能所有网络；disabled==2为P2P情况；调wpa_supplicant_enable_network", "c": []}, {"t": "wpa_supplicant_enable_network：current_ssid为空时置reassociate=1并wpa_supplicant_req_scan(wpa_s,0,0)发起扫描；置disabled=0", "c": []}, {"t": "无线网络扫描流程", "c": [{"t": "wpa_supplicant_req_scan：取消旧超时并按sec/usec重新注册（0,0表示立即执行）", "c": []}, {"t": "wpa_supplicant_scan之一（参数准备）：ap_scan参数（默认1：WPAS完成AP扫描选择及后续关联、EAPOL认证绝大部分工作；0：驱动完成；2：类似0，NDIS常用）；max_ssids=min(wpa_s->max_scan_ssids, WPAS_MAX_SCAN_SSIDS)", "c": []}, {"t": "wpa_driver_scan_params：一个scan请求对应的数据结构（可含多ssid）；wpa_supplicant_scan核心工作即正确填充它", "c": []}, {"t": "wpa_supplicant_scan之二：状态置WPA_SCANNING；connect_without_scan非空（如WPS已知目标网络）则跳过扫描直接wpa_supplicant_associate；prev_scan_ssid记录上次扫描最后一个ssid（分批扫描续扫）；scan_ssid=1的网络（hidden ssid AP）加入params.ssids[]；wpa_supplicant_extra_ies（WPS等）", "c": []}, {"t": "wpa_supplicant_scan之三：wpa_supplicant_trigger_scan→driver wrapper的scan2→wpa_driver_nl80211_scan：构造NL80211_CMD_TRIGGER_SCAN，填IFINDEX/SCAN_SSIDS/IE/SCAN_FREQUENCIES等；返回仅代表命令发送成功，扫描结束经driver event返回", "c": []}, {"t": "扫描结果接收：driver完成后向\"scan\"组播发消息→process_global_event→NL80211_CMD_NEW_SCAN_RESULTS（置scan_complete_events=1、send_scan_event）", "c": []}, {"t": "send_scan_event：填充scan_info（本次扫描请求的ssid与频率信息）；最终wpa_supplicant_event(ctx, EVENT_SCAN_RESULTS, &event)", "c": []}, {"t": "wpa_supplicant_event（events.c）是driver event统一入口；EVENT_SCAN_RESULTS→wpa_supplicant_event_scan_results", "c": []}, {"t": "_wpa_supplicant_event_scan_results之一：wpa_supplicant_get_scan_results——wpa_drv_get_scan_results2（nl80211发NL80211_CMD_GET_SCAN取结果）；qsort按信噪比SNR等排序；wpa_bss_update更新wpa_bss链表；随机数池利用扫描结果增强随机性", "c": []}, {"t": "之二：wpas_notify_scan_done通知客户端；核心wpa_supplicant_pick_network根据scan_res、wpa_bss与wpa_ssid匹配（ssid、安全设置、速率等）选出目标网络", "c": []}, {"t": "之三：wpa_supplicant_need_to_roam判断是否漫游/切换；wpa_supplicant_connect(wpa_s, selected, ssid)发起关联", "c": []}]}, {"t": "关联流程", "c": [{"t": "wpa_supplicant_connect——WPS PBC overlap检查；wpa_supplicant_scard_init（EAP-SIM/AKA）；wpa_supplicant_associate发起关联", "c": []}, {"t": "wpa_supplicant_associate之一：主要填充struct wpa_driver_associate_params；清wpa_s->bssid、设pending_bssid；取消扫描；清旧WPA/RSN IE", "c": []}, {"t": "之二：按key_mgmt分支处理；auth_alg（WPA必须WPA_AUTH_ALG_OPEN）；目标AP含WPA IE（0x0050f201，MS OUI）或RSN IE时：pmksa_cache_set_current尝试OPC缓存；wpa_supplicant_set_suites结合AP的RSN/WPA IE生成关联用IE——本例结果proto=WPA_PROTO_RSN、cipher=WPA_CIPHER_CCMP、key_mgmt=WPA_KEY_MGMT_PSK；置状态WPA_ASSOCIATING", "c": []}, {"t": "之三：填params（ssid/bssid/freq/wpa_ie/pairwise_suite/group_suite/key_mgmt_suite/auth_alg/mode/wep key/drop_unencrypted等）；wpa_drv_associate发关联请求；注册认证超时（ap_scan=1时10秒）；wpa_supplicant_initiate_eapol配置eapol/eap sm", "c": []}, {"t": "wpa_driver_nl80211_associate：无SME（多数手机）时走wpa_driver_nl80211_connect发送NL80211_CMD_CONNECT——connect命令一次完成authentication+association两步", "c": []}, {"t": "关联事件处理：driver返回NL80211_CMD_CONNECT→mlme_event_connect；status!=WLAN_STATUS_SUCCESS→EVENT_ASSOC_REJECT；成功则wpa_supplicant_event(ctx, EVENT_ASSOC)", "c": []}, {"t": "wpa_supplicant_event_assoc：wpa_supplicant_event_associnfo更新RSN/WPA IE到assoc_wpa_ie；置状态WPA_ASSOCIATED；wpa_drv_get_bssid更新wpa_s->bssid；取current_bss；eapol_sm_notify_portEnabled(TRUE)触发EAPOL状态机动作", "c": []}]}, {"t": "4-Way Handshake（四次握手）", "c": [{"t": "背景：PTK加密单播，由PMK派生（SOHO下PMK即PSK）；GTK加密组播，由GMK派生；Group Key Handshake须在4-Way Handshake后", "c": []}, {"t": "EAPOL-Key帧格式：Key Descriptor Type（RC4/WPA/RSN）；Key Information标志位（Key Descriptor Version、Key Type（1=PTK/0=GTK）、Install、Key ACK、Key MIC、Secure、Error、Request、Encrypted Key Data等）；Key Length；Replay Counter（防重放）；Key Nonce；Key IV；Key RSC；Key MIC；Key Data", "c": []}, {"t": "四次握手流程", "c": [{"t": "Message A（AP→STA：Key ACK=1、Key Type=1、无MIC、ANonce）；STA处理：生成SNonce→派生PTK→发Message B", "c": []}, {"t": "Message B（含SNonce与MIC，Key Data含关联时获得的RSN IE以防中途更改安全参数）；AP处理：派生PTK、校验MIC→发Message C", "c": []}, {"t": "Message C（Install=1、Secure=1、Encrypted Key Data=1；Key Data用KEK加密，内含AP的RSN IE、可能含GTK）；STA处理：校验Replay Counter/MIC、解密Key Data、取GTK、发Message D、安装PTK", "c": []}, {"t": "Message D（含MIC）；AP处理：再校验MIC、安装PTK", "c": []}]}, {"t": "PTK组成（CCMP）：KCK（算MIC）、KEK（加解密Key Data）、TK（后续数据加密）", "c": []}, {"t": "wpa_sm_rx_eapol（wpa.c）：只处理type=IEEE802_1X_TYPE_EAPOL_KEY；校验Key Descriptor Version、Replay Counter防重放、ACK/SMK位；MIC校验用KCK；Encrypted Key Data用KEK解密；Key Type=1时含MIC→process_3_of_4（Message C），否则process_1_of_4（Message A）；Key Type=0且MIC→process_1_of_2（Group Key Handshake）", "c": []}, {"t": "wpa_supplicant_process_1_of_4：置WPA_4WAY_HANDSHAKE；解析Key Data IE；wpa_supplicant_get_pmk按pmkid查PMKSA；random_get_bytes生成SNonce；PTK先存临时变量tptk（收到Message C的MIC校验通过后才复制到sm->ptk）；wpa_derive_ptk派生；wpa_supplicant_send_2_of_4发Message B", "c": []}, {"t": "wpa_supplicant_process_3_of_4：校验RSN（wpa_supplicant_validate_ie防安全参数中途改变）；wpa_supplicant_send_4_of_4发Message D；Install位→wpa_supplicant_install_ptk经wpa_driver_nl80211_set_key装key到驱动；Secure位→eapol_sm_notify_portValid(TRUE)；置WPA_GROUP_HANDSHAKE；ie.gtk→wpa_supplicant_pairwise_gtk；wpa_sm_set_rekey_offload（WoWLAN）", "c": []}, {"t": "KDE与GTK格式：KDE Type=0xdd；GTK的OUI=00-0F-AC、Data Type=1；KeyID 0～3；Tx位=1表示收发组播都用该GTK", "c": []}, {"t": "wpa_supplicant_pairwise_gtk：解析KeyID/Tx→拷贝GTK→check_group_cipher→install_gtk（含Key RSC）→wpa_supplicant_key_neg_complete", "c": []}, {"t": "wpa_supplicant_key_neg_complete：取消认证超时；wpa_sm_set_state(WPA_COMPLETED)；eapol_sm_notify_portValid(TRUE)、PSK下eapol_sm_notify_eap_success(TRUE)；注册1秒后wpa_sm_start_preauth", "c": []}, {"t": "wpa_sm_set_state→回调→wpa_supplicant_set_state：进入WPA_COMPLETED时wpa_drv_set_operstate(1)（IfOperStatus→UP）、wpa_drv_set_supp_port(1)；DISCONNECTED等状态时operstate=0（DORMANT）", "c": []}, {"t": "4-Way Handshake中EAPOL/EAP状态机变化：eapSuccess→SUPP_PAE进AUTHENTICATING→SUPP_BE进SUCCESS；第二轮suppSuccess+portValid→SUPP_PAE进AUTHENTICATED（suppPortStatus=Authorized）；最后dhcpcd取IP即可上网", "c": []}]}]}], "id": "s18"}, {"title": "4.6 本章总结和参考资料说明", "nodes": [{"t": "本章总结", "c": [{"t": "WPAS启动路线：多种多样的数据结构及其复杂关系，兼具背景含义的成员变量深入解析", "c": []}, {"t": "EAPOL/EAP模块：先协议理论后代码实现；状态机代码比状态切换图复杂，建议对照学习", "c": []}, {"t": "扫描、关联及4-Way Handshake：以最简单的WPA-PSK实例讲解核心流程；实际流程远比书中内容庞大（WPS、P2P、802.11r、802.11w等均穿插其中）；先掌握最简流程再渐进加入其他功能", "c": []}, {"t": "分析目标是Android 4.1的WPAS；Android 4.2版本变化主要是新增功能与bug修复", "c": []}]}, {"t": "参考资料：维基百科EAP；wpa_supplicant官方开发文档；《802.11-2012》附录M.4（passphrase-to-PSK映射）；8.4.2.27.2 Cipher suites；8.4.2.27.3 AKM suites；第12章Fast BSS Transition；rfkill资料；RFC2863；RFC4137 PDF（图示状态机）；IEEE 802.1X-2004；第11.6节Keys and key distribution；WoWLAN资料", "c": []}], "id": "s19"}]}, {"title": "第5章 深入理解WifiService", "sections": [{"title": "5.1 概述", "nodes": [{"t": "WifiService是Android Java Framework中负责Wi-Fi功能的核心服务，是Java Framework层Wi-Fi功能的总入口", "c": []}, {"t": "WifiService借助wpa_supplicant（WPAS）管理和控制Android平台中的Wi-Fi功能；WPAS才是整个Wi-Fi模块的真正核心", "c": []}, {"t": "分析路线一：WifiService的创建及初始化", "c": []}, {"t": "分析路线二：在Settings中打开Wi-Fi、扫描无线网络及加入目标无线网络", "c": []}, {"t": "额外介绍WifiWatchdogStateMachine和Captive Portal Check两个知识点", "c": []}, {"t": "类图结构要点：IWifiManager、IWifiManager.Stub、IWifiManager.Stub.Proxy由aidl编译生成；WifiService派生自IWifiManager.Stub，是Binder服务端；WifiManager通过成员变量mService与WifiService进行Binder交互", "c": []}], "id": "s20"}, {"title": "5.2 WifiService的创建及初始化", "nodes": [{"t": "WifiService在SystemServer进程中被创建：new WifiService(context)并通过ServiceManager.addService注册", "c": []}, {"t": "SystemServer随后调用wifi.checkAndStartWifi()：若关机前Wi-Fi打开，则重启后自动打开Wi-Fi（该函数内涉及WifiWatchdogStateMachine的创建）", "c": []}, {"t": "SystemServer中还创建ConnectivityService并注册为CONNECTIVITY_SERVICE", "c": []}, {"t": "正式分析前需先掌握两个基础知识：HSM（Hierarchical State Machine，层次状态机）和AsyncChannel", "c": []}, {"t": "5.2.1 HSM和AsyncChannel介绍", "c": [{"t": "两者对应Framework中的StateMachine类和AsyncChannel类，仅由Framework内部使用，不包含在SDK中", "c": []}, {"t": "HSM（层次状态机）核心概念", "c": [{"t": "在传统状态机基础上引入状态间的层级关系，类似Java父子类的派生继承关系", "c": []}, {"t": "父状态实现generic（通用）功能，子状态实现特定处理；但父子状态是两个毫无派生关系的类", "c": []}, {"t": "状态由State类表达；addState(状态, 父状态)添加状态并指定层级；setInitialState设置初始状态；start启动状态机", "c": []}, {"t": "每个State的核心函数：enter（Entry Action）、exit（Exit Action）、processMessage（成功返回HANDLED，否则返回NOT_HANDLED）", "c": []}, {"t": "消息处理向上冒泡：子状态返回NOT_HANDLED时交给父状态处理；全部无法处理时调用unhandledMessage", "c": []}, {"t": "transitionTo切换状态；deferMessage保留消息留待下一个新状态处理（deferred消息在新状态进入后优先处理）", "c": []}, {"t": "外界通过obtainMessage/sendMessage向HSM发消息；停止状态机用quit或quitNow", "c": []}, {"t": "EA执行顺序：start后初始状态及其祖先状态的enter按祖先→子孙顺序执行", "c": []}, {"t": "状态切换时执行顺序：旧状态的exit沿派生树向上执行（直到最近公共祖先），然后新状态的enter沿派生树向下执行；类似C++构造/析构函数的顺序", "c": []}]}, {"t": "AsyncChannel（异步通道）核心概念", "c": [{"t": "用于两个Handler之间的通信（同进程或跨进程）：源Handler通过sendMessage发消息，目标Handler通过replyToMessage回复结果", "c": []}, {"t": "两种应用模式：①简单request/response模式——Server端无须维护Client信息，Client用connectSync或connect连接；②Server端维护Client信息——Server可向Client主动推送消息（WifiService相关模块多用第二种）", "c": []}, {"t": "第二种模式异步连接六步骤：①Client调connect，收到CMD_CHANNEL_HALF_CONNECTED；②Client发CMD_CHANNEL_FULL_CONNECTION给Server；③Server处理成功后发CMD_CHANNEL_FULLY_CONNECTED；④Client收到即连接建立；⑤双方用sendMessage/replyToMessage收发消息；⑥任一端调disconnect", "c": []}, {"t": "实现细节：AsyncChannel对象无法通过Binder跨进程传递，正确做法是Server自己new一个AsyncChannel并connect回Client（两端各存在一个AsyncChannel对象）", "c": []}, {"t": "WifiManager的init函数：通过Binder调WifiService的getWifiServiceMessenger，创建ServiceHandler，再调mAsyncChannel.connect", "c": []}, {"t": "WifiService端AsyncServiceHandler收到CMD_CHANNEL_FULL_CONNECTION后新建AsyncChannel并connect回Client，CMD_CHANNEL_HALF_CONNECTED时存入mClients用于向Client发消息", "c": []}]}]}, {"t": "5.2.2 WifiService构造函数分析", "c": [{"t": "从系统属性\"wifi.interface\"读取无线网络设备接口名，默认\"wlan0\"", "c": []}, {"t": "创建核心对象WifiStateMachine（WifiService相关模块的核心）", "c": []}, {"t": "调用mWifiStateMachine.enableRssiPolling(true)启用RSSI轮询机制：RSSI（接收信号强度指示）反映无线网络质量，WPAS支持的RSSI信息包括接收信号强度、连接速度、噪声强度和频率", "c": []}, {"t": "与BatteryStatsService交互获取mBatteryStats；注册广播事件", "c": []}, {"t": "创建HandlerThread(\"WifiService\")，在其Looper上创建两个Handler：mAsyncServiceHandler（交互对象来自WifiManager）、mWifiStateMachineHandler（交互对象来自WifiStateMachine）", "c": []}]}, {"t": "5.2.3 WifiStateMachine介绍", "c": [{"t": "构造函数之一：创建核心成员对象", "c": [{"t": "NetworkInfo：代表一个网络设备的状态信息，类型TYPE_WIFI", "c": []}, {"t": "mBatteryStats、mNwService（NetworkManagementService的Binder客户端）", "c": []}, {"t": "mP2pSupported：判断系统是否支持Wi-Fi Display/Wi-Fi Direct", "c": []}, {"t": "WifiNative：用于和wpa_supplicant交互（对应控制API），JNI模块为android_net_wifi_Wifi", "c": []}, {"t": "WifiConfigStore：对应配置文件/data/misc/wifi/ipconfig.txt，存储每个无线网络的配置项（代理地址、静态IP等）", "c": []}, {"t": "WifiMonitor：内部创建线程，借助WifiNative接收并处理来自WPAS的信息", "c": []}, {"t": "DhcpInfoInternal（保存DHCP信息）、WifiInfo（存储当前连接网络的信息如IP地址、ssid）", "c": []}, {"t": "SupplicantStateTracker：跟踪WPAS的状态，本身也是一个StateMachine", "c": []}, {"t": "LinkProperties：描述网络链接属性（IP地址、DNS地址、路由设置）", "c": []}, {"t": "WifiApConfigStore：与Soft AP模式相关的StateMachine，配置存于/data/misc/wifi/softap.conf", "c": []}, {"t": "其他配置：mDefaultFrameworkScanIntervalMs（默认300秒）、mDriverStopDelayMs（默认120秒，与紧急呼叫模式有关）、mBackgroundScanSupported、mScanResultCache（LruCache保存扫描结果）、WakeLock申请", "c": []}, {"t": "注册处理ACTION_START_SCAN、ACTION_SCREEN_ON/OFF、ACTION_DELAYED_DRIVER_STOP广播", "c": []}]}, {"t": "WifiNative的两个关键方法", "c": [{"t": "startSupplicant：根据是否支持P2P选择p2p_supplicant或wpa_supplicant；若WPAS已在运行（init.svc.wpa_supplicant属性为running）直接返回；通过property_set(\"ctl.start\")触发init运行wpa_supplicant；循环查询属性值变为\"running\"表示成功（最多约20秒）", "c": []}, {"t": "connectToSupplicant：Android 4.2支持STA和P2P设备并发工作：STA用PRIMARY(0)标示，P2P用SECONDARY(1)；通过wpa_ctrl_open创建两个wpa_ctrl对象：ctrl_conn（发送命令并接收回复）和monitor_conn（接收unsolicited event，需调用wpa_ctrl_attach）；exit_sockets保存socketpair句柄", "c": []}]}, {"t": "WifiMonitor（内部MonitorThread线程，专收WPAS消息）", "c": [{"t": "线程run：先connectToSupplicant，成功则向WifiStateMachine发SUP_CONNECTION_EVENT", "c": []}, {"t": "循环调用mWifiNative.waitForEvent()获取消息；只处理以\"CTRL-EVENT-\"为前缀的消息", "c": []}, {"t": "解析并映射事件：CONNECTED、STATE-CHANGED、SCAN-RESULTS、DRIVER-STATE、EAP-FAILURE、LINK_SPEED、DISCONNECTED等", "c": []}, {"t": "分发处理：STATE_CHANGE→handleSupplicantStateChange；DRIVER_STATE→handleDriverEvent（DRIVER-EVENT来自wlan芯片厂商提供的库，如bcmdhd的driver_cmd_nl80211.c）；其余→handleEvent", "c": []}, {"t": "WPAS状态（wpa_sm状态机）共10个：WPA_DISCONNECTED、WPA_INTERFACE_DISABLED、WPA_INACTIVE、WPA_SCANNING、WPA_AUTHENTICATING、WPA_ASSOCIATING、WPA_ASSOCIATED、WPA_4WAY_HANDSHAKE、WPA_GROUP_HANDSHAKE、WPA_COMPLETED", "c": []}, {"t": "Java层SupplicantState定义13个状态（后3个DORMANT、UNINITIALIZED、INVALID为WifiService自定义）", "c": []}, {"t": "handleEvent：DISCONNECTED/CONNECTED→handleNetworkStateChange；SCAN_RESULTS→向WifiStateMachine发SCAN_RESULTS_EVENT", "c": []}]}, {"t": "SupplicantStateTracker：从StateMachine派生，定义8个状态：mDefaultState（父）、mUninitializedState、mInactiveState、mDisconnectState、mScanState、mHandshakeState、mCompletedState、mDormantState；较简单，不影响主流程", "c": []}, {"t": "构造函数之二：WifiStateMachine状态体系", "c": [{"t": "WifiStateMachine共定义30个状态（从mDefaultState、mInitialState到mSoftApStoppingState等），状态数量在Android系统中非常突出；加上SupplicantStateTracker的8个状态和P2pStateMachine的15个状态，Java层Wi-Fi相关状态机多达63个状态", "c": []}, {"t": "初始状态为mInitialState", "c": []}, {"t": "InitialState.enter：通过\"wlan.driver.status\"属性判断驱动是否已加载——已加载则transitionTo(mDriverLoadedState)，否则转mDriverUnloadedState；同时获取WifiP2pManager并连接WifiP2pService；调用mNwService.disableIpv6禁止IPv6", "c": []}, {"t": "正常启动后WifiStateMachine最终进入DriverUnloadedState", "c": []}]}]}], "id": "s21"}, {"title": "5.3 加入无线网络分析", "nodes": [{"t": "第一部分：Settings中的处理，利用WifiManager操作无线网络", "c": []}, {"t": "第二部分：分析所涉及的WifiManager关键函数如何促使WifiService完成一系列复杂操作", "c": []}, {"t": "5.3.1 Settings操作Wi-Fi分析", "c": [{"t": "UI与类的对应关系：WifiSettings对应Wi-Fi设置页面（AP列表）；WifiEnabler中的mSwitch是Wi-Fi开关按钮；WifiDialog对应无线网络设置对话框，其配置信息由WifiConfigController控制管理；WifiSettings的内部类Scanner处理扫描相关工作", "c": []}, {"t": "WifiSettings相关类初始化", "c": [{"t": "构造函数注册广播接收对象，关注的广播：WIFI_STATE_CHANGED_ACTION、SCAN_RESULTS_AVAILABLE_ACTION、NETWORK_IDS_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION、CONFIGURED_NETWORKS_CHANGED_ACTION、LINK_CONFIGURATION_CHANGED_ACTION、NETWORK_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION", "c": []}, {"t": "四个重要广播：WIFI_STATE_CHANGED_ACTION（Wi-Fi状态：DISABLED/DISABLING/ENABLED/ENABLING/UNKNOWN五种）；SCAN_RESULTS_AVAILABLE_ACTION（扫描完毕）；SUPPLICANT_STATE_CHANGED_ACTION（WPAS状态变化）；NETWORK_STATE_CHANGED_ACTION（Wi-Fi连接状态变化，携带NetworkInfo对象）", "c": []}, {"t": "WifiEnabler构造：关注三个广播，真正处理的只有WIFI_STATE_CHANGED_ACTION（用于更新Switch界面）", "c": []}]}, {"t": "启用Wi-Fi功能：用户点击开关→WifiEnabler.onCheckedChanged→mWifiManager.setWifiEnabled(isChecked)→触发WifiService一系列动作", "c": []}, {"t": "WifiSettings.handleEvent按广播类型分发：WIFI_STATE_ENABLED时updateWifiState调mScanner.resume()；SCAN_RESULTS等→updateAccessPoints（更新AP列表）；NETWORK_STATE_CHANGED→更新mConnected、updateConnectionState等", "c": []}, {"t": "触发扫描：Scanner（Handler子类）handleMessage中调用mWifiManager.startScanActive()发起主动扫描，失败重试最多3次，然后每1秒（WIFI_RESCAN_INTERVAL_MS）发起一次扫描", "c": []}, {"t": "更新AP列表：updateAccessPoints→constructAccessPoints——先getConfiguredNetworks（从WPAS读取已保存网络信息）创建AccessPoint对象；再getScanResults获取扫描结果，跳过无SSID或[IBSS]网络；最后排序并显示到PreferenceScreen", "c": []}, {"t": "加入目标无线网络：onPreferenceTreeClick选中AccessPoint：无安全设置的网络直接generateOpenNetworkConfig后mWifiManager.connect；否则showDialog弹出WifiDialog；用户输入密码点\"连接\"→WifiSettings.submit：isEdit或requireKeyStore则mWifiManager.save，否则mWifiManager.connect", "c": []}, {"t": "知识点总结：WifiSettings与WifiEnabler两个广播接收对象互相干扰（同一广播两次处理）；SUPPLICANT_STATE_CHANGED_ACTION广播次数多；提炼WifiManager三个关键函数：setWifiEnabled、startScanActive、connect", "c": []}]}, {"t": "5.3.2 WifiService操作Wi-Fi分析", "c": [{"t": "setWifiEnabled函数分析", "c": [{"t": "WifiStateMachine发送消息：enable时发CMD_LOAD_DRIVER（携带WIFI_STATE_ENABLING）和CMD_START_SUPPLICANT；disable时发CMD_STOP_SUPPLICANT和CMD_UNLOAD_DRIVER", "c": []}, {"t": "CMD_LOAD_DRIVER处理：DriverUnloadedState→transitionTo(mDriverLoadingState)；DriverLoadingState.enter中创建工作线程（持有WakeLock）：先setWifiState(WIFI_STATE_ENABLING)（发送WIFI_STATE_CHANGED_ACTION广播），再调mWifiNative.loadDriver，成功发CMD_LOAD_DRIVER_SUCCESS", "c": []}, {"t": "wifi_load_driver（wifi.c）：若定义WIFI_DRIVER_MODULE_PATH宏（如\"/lib/modules/dhd.ko\"），则insmod加载驱动模块，然后设置\"wlan.driver.status\"属性；未定义宏则直接设属性\"ok\"", "c": []}, {"t": "CMD_LOAD_DRIVER_SUCCESS：转mDriverLoadedState；CMD_START_SUPPLICANT在DriverLoadingState中deferMessage推迟到下一状态", "c": []}, {"t": "CMD_START_SUPPLICANT处理（DriverLoadedState）：mNwService.wifiFirmwareReload(interface, \"STA\")加载wlan固件；mNwService.setInterfaceDown和setInterfaceIpv6PrivacyExtensions；mWifiNative.startSupplicant启动WPAS进程，成功后mWifiMonitor.startMonitoring()启动Monitor线程，transitionTo(mSupplicantStartingState)", "c": []}, {"t": "SUP_CONNECTION_EVENT处理（SupplicantStartingState）：setWifiState(WIFI_STATE_ENABLED)广播；重置mSupplicantRestartCount；发CMD_RESET_SUPPLICANT_STATE；重置mLastBssid/mLastNetworkId/mLastSignalLevel；mWifiInfo.setMacAddress；mWifiConfigStore.initialize()；initializeWpsDetails()；sendSupplicantConnectionChangedBroadcast(true)；transitionTo(mDriverStartedState)", "c": []}, {"t": "SupplicantStartedState.enter：读取扫描间隔（config_wifi_supplicant_scan_interval，默认15000ms）；向WPAS发送\"SCAN_INTERVAL 时间\"命令", "c": []}, {"t": "DriverStartedState.enter：mIsRunning=true；setBluetoothCoexistenceScanMode告知wlan驱动蓝牙是否启用（2.4GHz共存）；setCountryCode()和setFrequencyBand()设置国家码和频段（通过\"DRIVER XXX\"命令发给WPAS，Android特有命令，由厂商库处理）；组播过滤设置；mIsScanMode分支——ap_scan=1：WPAS完成AP扫描选择及关联、EAPOL认证等大部分工作；=0：驱动完成；=2：类似0（SCAN_ONLY_MODE对应2，CONNECT_MODE对应1）——扫描模式时转mScanModeState，正常模式时reconnect()+status()后转mDisconnectedState；处理屏幕状态（setSuspendOptimizations发\"DRIVER SETSUSPENDMODE\"命令）；setPowerSave(true)；支持P2P时发CMD_ENABLE_P2P", "c": []}, {"t": "DisconnectedState.enter：P2P临时断开处理；读取Framework扫描间隔（WIFI_FRAMEWORK_SCAN_INTERVAL_MS）；后台扫描设置——mEnableBackgroundScan时enableBackgroundScan(true)，否则setScanAlarm(true)（AlarmManager定时发ACTION_START_SCAN）；无P2P连接且无已保存AP则延迟发送CMD_NO_NETWORKS_PERIODIC_SCAN", "c": []}, {"t": "setWifiEnabled流程总结（状态迁移链）：DriverUnloadedState → DriverLoadingState（loadDriver，defer CMD_START_SUPPLICANT）→ DriverLoadedState（加载固件、启动WPAS）→ SupplicantStartingState（初始化WPS/WifiConfigStore）→ DriverStartedState（父状态SupplicantStartedState的enter先执行）→ DisconnectedState", "c": []}]}, {"t": "startScanActive函数分析", "c": [{"t": "调用链：WifiManager.startScanActive→WifiService.startScan→WifiStateMachine.startScan(forceActive=true)→发送CMD_START_SCAN", "c": []}, {"t": "CMD_START_SCAN处理：DisconnectedState收到后先取消后台扫描，返回NOT_HANDLED向上传递；最终由祖父状态DriverStartedState处理——forceActive时setScanMode发\"DRIVER SCAN-ACTIVE\"命令，mWifiNative.scan()发\"SCAN\"命令触发扫描，然后恢复setScanMode，置mScanResultIsPending=true", "c": []}, {"t": "SCAN_RESULTS_EVENT处理：WPAS扫描完毕通知WifiMonitor→发SCAN_RESULTS_EVENT；DisconnectedState返回NOT_HANDLED→父状态ConnectModeState处理（setScanResultHandling(CONNECT_MODE)）→祖父状态SupplicantStartedState处理：setScanResults(mWifiNative.scanResults())从WPAS获取扫描结果，sendScanResultsAvailableBroadcast()广播，mScanResultIsPending=false", "c": []}]}, {"t": "connect函数分析", "c": [{"t": "WifiManager.connect(config, listener)：通过AsyncChannel发送CONNECT_NETWORK消息（arg1为INVALID_NETWORK_ID即-1，obj为WifiConfiguration）", "c": []}, {"t": "CONNECT_NETWORK处理（ConnectModeState）：mWifiConfigStore.saveNetwork(config)——addOrUpdateNetworkNative触发\"ADD_NETWORK\"、\"SET_NETWORK\"等命令；新网络则mWifiNative.enableNetwork发\"ENABLE_NETWORK\"命令；mWifiNative.saveConfig()发\"SAVE_CONFIG\"；发送CONFIGURED_NETWORKS_CHANGED广播", "c": []}, {"t": "selectNetwork(netId)选择网络；mWifiNative.reconnect()发RECONNECT命令（WPAS处理即调wpa_supplicant_req_scan）；回复CONNECT_NETWORK_SUCCEEDED、transitionTo(mDisconnectingState)（考虑到之前可能连接其他AP需先断开）", "c": []}, {"t": "ENABLE_NETWORK过程中WPAS完成802.11身份认证、关联、四次握手等工作，wpa_sm状态变化触发WifiMonitor发SUPPLICANT_STATE_CHANGE_EVENT", "c": []}, {"t": "NETWORK_CONNECTION_EVENT处理（ConnectModeState）：WPAS加入成功后发\"CTRL-EVENT-CONNECTED\"，WifiMonitor据此发NETWORK_CONNECTION_EVENT；记录mLastNetworkId和mLastBssid，更新mWifiInfo，setNetworkDetailedState(OBTAINING_IPADDR)，发送NETWORK_STATE_CHANGED_ACTION广播，transitionTo(mObtainingIpState)", "c": []}, {"t": "ObtainingIpState.enter：判断目标AP是否静态IP——动态IP时创建DhcpStateMachine、发送CMD_START_DHCP", "c": []}, {"t": "CMD_PRE/POST_DHCP_ACTION处理（由父状态L2ConnectedState处理）：CMD_PRE_DHCP_ACTION→handlePreDhcpSetup（设置蓝牙共存模式等），回复CMD_PRE_DHCP_ACTION_COMPLETE——DhcpStateMachine随后启动dhcpcd进程从AP获取IP地址；CMD_POST_DHCP_ACTION→handlePostDhcpSetup；DHCP_SUCCESS时handleSuccessfulIpConfiguration（发LINK_CONFIGURATION_CHANGED_ACTION广播）并transitionTo(mVerifyingLinkState)", "c": []}, {"t": "VerifyingLinkState：enter中setNetworkDetailedState(VERIFYING_POOR_LINK)、发送广播；processMessage处理WifiWatchdogStateMachine的消息——收到POOR_LINK_DETECTED不动作，收到GOOD_LINK_DETECTED（信号良好）则transitionTo(mCaptivePortalCheckState)", "c": []}, {"t": "CaptivePortalCheckState（Android 4.2新引入）：与Captive Portal（强制网络门户）有关——未认证用户初次上网时被强制打开特定页面，常见于机场、酒店等公共场所", "c": [{"t": "enter：setNetworkDetailedState(CAPTIVE_PORTAL_CHECK)、发送广播", "c": []}, {"t": "processMessage：收到CMD_CAPTIVE_CHECK_COMPLETE后mNwService.enableIpv6启用IPv6、setNetworkDetailedState(CONNECTED)、transitionTo(mConnectedState)", "c": []}]}, {"t": "ConnectedState仅处理POOR_LINK_DETECTED消息，是第二条分析路线的终点", "c": []}, {"t": "connect流程总结（关键点链）：CONNECT_NETWORK → ConnectModeState处理（WPAS完成802.11认证/关联/四次握手）→ NETWORK_CONNECTION_EVENT（转ObtainingIpState）→ DHCP交互（L2ConnectedState处理，转VerifyingLinkState）→ 与WifiWatchdogStateMachine交互（转CaptivePortalCheckState）→ 最终转ConnectedState", "c": []}]}]}], "id": "s22"}, {"title": "5.4 WifiWatchdogStateMachine介绍", "nodes": [{"t": "概述与创建：用于监控无线网络的信号质量；在WifiService的checkAndStartWifi函数中通过makeWifiWatchdogStateMachine创建", "c": []}, {"t": "makeWifiWatchdogStateMachine：通过ConnectivityManager判断是否只支持Wi-Fi（sWifiOnly）；设置Settings.Global.WIFI_WATCHDOG_ON默认为true；new并start()启动HSM", "c": []}, {"t": "构造函数分析", "c": [{"t": "mWsmChannel（AsyncChannel）以connectSync方式连接WifiStateMachine", "c": []}, {"t": "setupNetworkReceiver创建广播接收对象，接收NETWORK_STATE_CHANGED_ACTION、WIFI_STATE_CHANGED_ACTION、RSSI_CHANGED_ACTION、SUPPLICANT_STATE_CHANGED_ACTION等广播并转为内部事件", "c": []}, {"t": "共定义9个状态；Watchdog开启时初始状态为NotConnectedState，否则为mWatchdogDisabledState", "c": []}, {"t": "WifiWatchdogStateMachine完全靠广播事件驱动", "c": []}]}, {"t": "EVENT_NETWORK_STATE_CHANGE处理流程（由NotConnectedState的父状态WatchdogEnabledState处理）", "c": [{"t": "从Intent中取NetworkInfo和WifiInfo，updateCurrentBssid更新BSSID信息", "c": []}, {"t": "DetailedState为VERIFYING_POOR_LINK时：保存mLinkProperties；若mPoorNetworkDetectionEnabled且mWifiInfo/mCurrentBssid有效则transitionTo(mVerifyingLinkState)，否则sendLinkStatusNotification(true)直接发GOOD_LINK_DETECTED", "c": []}, {"t": "DetailedState为CONNECTED时transitionTo(mOnlineWatchState)", "c": []}]}, {"t": "VerifyingLinkState与CMD_RSSI_FETCH处理流程", "c": [{"t": "enter：mSampleCount=0、mCurrentBssid.newLinkDetected()，向自己发送CMD_RSSI_FETCH", "c": []}, {"t": "processMessage收到CMD_RSSI_FETCH：通过mWsmChannel向WifiStateMachine发送RSSI_PKTCNT_FETCH——WifiStateMachine处理时调用WifiNative的signalPoll和pktcntPoll获取RSSI、LinkSpeed、发送Packet总数、发送失败Packet总数；同时每1000ms再次发起CMD_RSSI_FETCH", "c": []}, {"t": "收到RSSI_PKTCNT_FETCH_SUCCEEDED：用指数加权移动平均算法（Volume-weighted Exponential Moving Average）判断信号质量；rssi >= mGoodLinkTargetRssi时累加mSampleCount，采样次数达到mGoodLinkTargetCount才认为网络变好并发GOOD_LINK_DETECTED；rssi不达标则mSampleCount清零", "c": []}, {"t": "检测到Poor link时发送POOR_LINK_DETECTED给WifiStateMachine处理", "c": []}]}, {"t": "总结：目的简单（监测信号质量并做相应动作），但使用较高级的算法判断网络质量", "c": []}], "id": "s23"}, {"title": "5.5 Captive Portal Check介绍", "nodes": [{"t": "概述：Android 4.2中Captive Portal Check功能集中在CaptivePortalTracker类中，它也是一个HSM；创建于ConnectivityService构造函数中", "c": []}, {"t": "构造函数分析", "c": [{"t": "获取TelephonyManager；注册广播接收对象只监听ConnectivityManager.CONNECTIVITY_ACTION", "c": []}, {"t": "读取Settings.Global.CAPTIVE_PORTAL_SERVER作为测试服务器地址，未设置时用DEFAULT_SERVER即\"clients3.google.com\"", "c": []}, {"t": "读取CAPTIVE_PORTAL_DETECTION_ENABLED判断是否开启该功能（默认开启）", "c": []}, {"t": "只有4个状态：mDefaultState、mNoActiveNetworkState、mActiveNetworkState、mDelayedCaptiveCheckState；初始状态mNoActiveNetworkState", "c": []}]}, {"t": "CMD_CONNECTIVITY_CHANGE处理流程", "c": [{"t": "广播接收对象onReceive收到CONNECTIVITY_ACTION后向状态机发送CMD_CONNECTIVITY_CHANGE（携带NetworkInfo）", "c": []}, {"t": "NoActiveNetworkState.processMessage：若info.isConnected()且isActiveNetwork(info)则保存mNetworkInfo并transitionTo(mDelayedCaptiveCheckState)", "c": []}, {"t": "触发源头：Wi-Fi连接成功后ConnectivityService的handleConnect被触发，其内部发送CONNECTIVITY_ACTION广播", "c": []}]}, {"t": "CMD_DELAYED_CAPTIVE_CHECK处理流程（DelayedCaptiveCheckState）", "c": [{"t": "enter：sendMessageDelayed延迟10秒（DELAYED_CHECK_INTERVAL_MS）发送CMD_DELAYED_CAPTIVE_CHECK（携带递增的mDelayedCheckToken）", "c": []}, {"t": "processMessage：token匹配时lookupHost(mServer)解析服务器IP；server有效则调用isCaptivePortal(server)判断AP是否需要Captive Portal Check，需要时setNotificationVisible(true)在状态栏添加提醒信息；最后transitionTo(mActiveNetworkState)", "c": []}, {"t": "isCaptivePortal原理：向\"http://clients3.google.com/generate_204\"发送HTTP GET请求——若网络提供商未设置Portal Check则返回204；若设置了则一定会重定向到特定网页，返回值不是204", "c": []}, {"t": "实例：作者用AirPcap截获小区宽带数据，手机发HTTP GET后服务器回复HTTP 302，状态栏因此出现需登录的提示项", "c": []}]}, {"t": "版本差异与疑问解答", "c": [{"t": "CaptivePortalTracker出现于4.2版本；4.1版本中Captive Portal Check由WifiWatchdogStateMachine完成（其内部定义了WalledGardenCheckState）", "c": []}, {"t": "作者发现4.2版本处理疑似有问题：CaptivePortalTracker并未被真正触发执行检查", "c": []}, {"t": "疑问解答：WifiStateMachine从CaptivePortalCheckState转ConnectedState的路径在ConnectivityService的handleCaptivePortalTrackerCheck函数中——最终调用WifiStateMachine的captivePortalCheckComplete，发送CMD_CAPTIVE_CHECK_COMPLETE", "c": []}]}], "id": "s24"}, {"title": "5.6 本章总结和参考资料说明", "nodes": [{"t": "本章介绍了WifiService相关模块、WifiWatchdogStateMachine以及CaptivePortalTracker", "c": []}, {"t": "HSM和AsyncChannel是本章重要知识，需认真学习其用法", "c": []}, {"t": "WifiService中的WifiStateMachine是核心：定义的状态之多、处理之曲折在Android系统中非常突出（30个状态）；建议用Eclipse调试加深认识", "c": []}, {"t": "作者观点：WifiService实现过于复杂、运行效率较低——WPAS作为核心已完成绝大部分工作，Java层却有63个状态", "c": []}, {"t": "参考资料：维基百科对Captive Portal的介绍", "c": []}], "id": "s25"}]}, {"title": "第6章 深入理解Wi-Fi Simple Configuration", "sections": [{"title": "6.1 概述", "nodes": [{"t": "WFA在802.11标准之外推出两项重要规范：WSC和P2P", "c": []}, {"t": "WSC（Wi-Fi Simple Configuration）：用于简化SOHO环境中无线网络的配置和使用", "c": []}, {"t": "WSC使用方式：输入PIN码、按下Push Button、或用支持NFC的手机到AP旁刷一下（NFC方式），即可自动完成安全设置配置", "c": []}, {"t": "P2P（商品名Wi-Fi Direct）：支持多个Wi-Fi设备在没有AP的情况下相互连接；与IBSS不同（IBSS中各STA完全对等，P2P不然）", "c": []}, {"t": "本章先讲基础知识，再分析Settings、WifiService（WifiStateMachine）及WPAS相关代码", "c": []}], "id": "s26"}, {"title": "6.2 WSC基础知识", "nodes": [{"t": "WSC规范早期名为WPS（Wi-Fi Protected Setup），WPA2出现后WFA制订了升级版WSC（以2.0.2版为例全文约150页）", "c": []}, {"t": "目的：简化无线网络配置（Simple Configuration之名的由来）", "c": []}, {"t": "安全设置信息的传输手段：借助Wi-Fi传输称为In-Band交换；借助其他方式（如NFC）称为Out-of-Band交换", "c": []}, {"t": "6.2.1 WSC应用场景", "c": [{"t": "WSC定义两个应用场景（usage model）：Primary UM和Secondary UM", "c": []}, {"t": "Primary UM：设置一个新的安全WLAN并为该WLAN添加无线设备，是最常见的场景", "c": []}, {"t": "Secondary UM：从WLAN中移除设备、通过添加新AP/路由器扩充覆盖范围、密钥信息更换（Re-keying credentials）等", "c": []}, {"t": "Primary UM的两种常见案例：PIN和PBC", "c": []}, {"t": "PIN方法流程：STA从设置选项中获取PIN码→用户将PIN码输入AP的设置页面→AP和STA基于PIN码完成安全设置协商→STA扫描、关联、四次握手加入目标AP", "c": []}, {"t": "PIN码为8位字符串（最后一位是前7位的校验和），系统每次生成的PIN码不固定", "c": []}, {"t": "PBC（Push Button Configuration）方法：AP和设备上各有一个标记WPS的按钮，用户在双方各按一次按钮即触发安全设置协商；Android手机可通过软件按钮模拟", "c": []}]}, {"t": "6.2.2 WSC核心组件及接口", "c": [{"t": "三大核心组件：Enrollee（类似supplicant，向Registrar发起注册请求）、Registrar（检查Enrollee合法性，还可配置AP）、AP（也需注册到Registrar，从Registrar角度看AP也是Enrollee）", "c": []}, {"t": "组件交互：Enrollee从Registrar获取AP的安全配置信息，再利用该信息加入AP的无线网络", "c": []}, {"t": "组件是逻辑概念：AP与Registrar可由同一实体实现（即Standalone AP，家用无线路由器即如此），也可分别实现（此时Registrar称External Registrar）；Android手机扮演Enrollee", "c": []}, {"t": "规范定义组件间交互接口E、M、A", "c": []}, {"t": "普适case（STA + Standalone AP，In-Band交互）下STA的Interface E：发送携带WSC IE的Probe Request寻找支持WSC的AP；能生成动态PIN码；关联后实现RP协议的Enrollee功能", "c": []}, {"t": "Standalone AP的Interface E：回复携带WSC IE的Probe Response；实现RP协议的Registrar功能", "c": []}, {"t": "Interface A：STA须实现802.1X supplicant并支持EAP-WSC算法；AP须发送携带WSC IE的Beacon帧、实现802.1X authenticator及EAP-WSC算法", "c": []}, {"t": "规范中E/M/A还涉及UPnP（本书不讨论）；可选Out-of-Band手段有NFC和USB", "c": []}, {"t": "WSC核心知识集中在WSC IE和RP（Registration Protocol）", "c": []}]}], "id": "s27"}, {"title": "6.3 Registration Protocol详解", "nodes": [{"t": "以STA与Standalone AP的In-Band交互为例介绍RP协议完整流程", "c": []}, {"t": "第一阶段Discovery Phase：STA借助Beacon/Probe帧搜索周围AP，开启WSC的帧必须携带WSC IE；结束后确定目标AP", "c": []}, {"t": "用户将STA显示的PIN码输入目标AP设置页面后，STA关联到目标AP", "c": []}, {"t": "与非WSC流程不同：STA和AP不先开展四次握手，而是先开展EAP-WSC流程", "c": []}, {"t": "EAP-WSC从EAPOL-Start开始、以EAP-Fail结束，共14次EAPOL/EAP帧交换；双方在此过程中协商安全配置信息（认证方法、加密方法、PSK等）", "c": []}, {"t": "M1～M8属于EAP-WSC算法内容，用于双方确认身份及传输安全配置信息", "c": []}, {"t": "EAP-WSC以EAP-Fail结束，但协商已完成；STA收到EAP-Fail后断开连接（AP发Deauthentication帧）", "c": []}, {"t": "STA利用协商好的安全配置信息重新关联AP，后续与非WSC一致（RSNA：四次握手、Group Handshake）", "c": []}, {"t": "WSC的核心工作：帮助STA和AP完成安全配置信息协商，用户只需输入PIN码或按按钮", "c": []}, {"t": "6.3.1 WSC IE和Attribute介绍", "c": [{"t": "WSC IE属于Vendor定义的IE：Element ID=221（Vendor Specific）、OUI=0x00-50-F2-04（00-50-F2为Microsoft，04代表WPS）", "c": []}, {"t": "WSC IE的Data域由一个或多个Attribute组成，格式为TLV：Type 2字节、Length 2字节（Value最大0xFFFF字节）", "c": []}, {"t": "Attribute不仅用于WSC IE，还用于EAP-WSC包", "c": []}, {"t": "Version属性：Type=0x104a；已废弃但为兼容必须在WSC IE中包含且Value=0x10", "c": []}, {"t": "Version2属性：作为Vendor Extension（Type=0x1049，Vendor ID=14122/0x00372a，由WFA注册）的子属性包含；Vendor Extension可含多个子属性（如Request to Enroll——表示Enrollee希望开展后续EAP-WSC流程）", "c": []}, {"t": "Request Type属性（须含于Probe/Association Request帧）：0x01=Enrollee, open 802.1X（想开展WSC流程）；0x00=Enrollee, Info only", "c": []}, {"t": "Response Type属性：AP取0x03、Registrar取0x02、Enrollee取0x00/0x01", "c": []}, {"t": "Configuration Methods属性（Type=0x1008，每一位代表一种支持的配置方法）：Display（动态PIN码，分Physical/Virtual）、Label（静态PIN码）、Keypad（可输入PIN码）、Push Button（分Physical/Virtual）", "c": []}, {"t": "Primary Device Type属性（Type=0x1054）：含Category ID（如Telephone=0x000a）、OUI（WFA 0x00-50-f2-04）、Sub Category（如Smartphone-dual mode=0x0005）", "c": []}, {"t": "Device Password ID属性：标示设备Password类型，默认0x0000=PIN；其他取值如0x0004 PushButton", "c": []}, {"t": "RF Bands属性：设备支持的无线频率（如2.4GHz和5GHz）", "c": []}]}, {"t": "6.3.2 802.11管理帧WSC IE设置", "c": [{"t": "WSC规范规定不同管理帧中WSC IE必须包含特定属性", "c": []}, {"t": "Probe Request帧WSC IE：包含Version、Request Type、Configuration Methods、UUID-E、Primary Device Type、RF Bands等", "c": []}, {"t": "Probe Response帧WSC IE：AP侧属性集合；含Selected Registrar属性——AP已选择合适Registrar时为0x01，否则0x00", "c": []}, {"t": "Association Request/Response帧的WSC IE设置较简单；Beacon帧WSC IE属性较多（必选项与可选项之分）", "c": []}, {"t": "通过实例可判断AP是否真正支持WSC（示例AP仅含必选项，仅支持WPS不支持WSC 2.0）", "c": []}]}, {"t": "6.3.3 EAP-WSC介绍", "c": [{"t": "WSC利用EAP扩展功能定义了EAP-WSC算法：Type=254（Vendor定义）、Vendor-Id=0x00372a、Vendor Type=0x0000-0001（WFA中表示Simple-Config）", "c": []}, {"t": "Op-Code有六种取值；Flags含MF位（0x01，More Fragments分片）和LF位（0x02，Length Field）", "c": []}, {"t": "Message data为WSC定义的Attribute；不同EAP-WSC包携带的Attribute有严格要求", "c": []}, {"t": "流程启动前的三次EAP交换：AP发EAP-Request/Identity → STA回复EAP-Response/Identity且Identity设为\"WFA-SimpleConfig-Enrollee-1-0\" → AP发送EAP-Request/WSC_Start", "c": []}, {"t": "M1（STA→AP）：Message Type=0x04、UUID-E、MAC地址、Enrollee Nonce、Public Key（D-H Key）、Authentication/Encryption Type Flags、Connection Type Flags", "c": []}, {"t": "密钥机制：PIN码不是PSK；双方采用Diffie-Hellman（D-H）密钥交换算法确定对称密钥（D-H只用于密钥交换，不能加密解密消息）", "c": []}, {"t": "M2（AP→STA）：Registrar Nonce、Registrar的Public Key、Authenticator（HMAC-SHA-256+AuthKey取前64位）；AP发M2前经D-H计算KDK（Key Derivation Key），再派生三种Key：AuthKey（256位，认证属性）、KeyWrapKey（128位，加密Nonce和ConfigData）、EMSK", "c": []}, {"t": "M3（STA→AP）：含Registrar Nonce、E Hash1/E Hash2、Authenticator；E Hash1/2计算：AuthKey+PIN前半/后半经HMAC生成PSK1/PSK2 → AuthKey加密两个128位随机Nonce得E-S1/E-S2 → HMAC(AuthKey, E-S1/2 + PSK1/2 + 双方D-H Key)得E Hash1/2", "c": []}, {"t": "M4（AP→STA）：AP用其在设置界面收到的PIN码计算R Hash1/R Hash2（PIN错误时STA比较会发现不一致而终止流程）；Encrypted Settings为KeyWrapKey加密的R-S1", "c": []}, {"t": "M5（STA→AP）：Encrypted Settings为KeyWrapKey加密的E-S1；M6（AP→STA）：Encrypted Settings为KeyWrapKey加密的R-S2；M7（STA→AP）：发送KeyWrapKey加密的E-S2供AP验证", "c": []}, {"t": "M8（AP→STA）：Encrypted Settings由KeyWrapKey加密，内含最重要的Credential属性集合（AP的安全设置信息：SSID、认证/加密算法、密钥等），STA解密后即得安全配置", "c": []}, {"t": "流程收尾：STA处理完M8回复WSC_DONE → AP发EAP-FAIL和Deauthentication → STA取消关联、重新扫描，利用新配置信息加入目标网络", "c": []}]}], "id": "s28"}, {"title": "6.4 WSC代码分析", "nodes": [{"t": "WSC代码贯穿App层（Settings）、Framework层（WifiStateMachine）、wpa_supplicant", "c": []}, {"t": "6.4.1 Settings中的WSC处理", "c": [{"t": "选择\"WPS PIN\"条目后弹出WpsDialog对话框，PIN和PBC方法都在WpsDialog中实现", "c": []}, {"t": "WpsDialog实现WifiManager.WpsListener：onStartSuccess（PIN非空时显示WPAS动态生成的PIN码；否则显示PBC提示）、onCompletion、onFailure", "c": []}, {"t": "WpsDialog注册监听NETWORK_STATE_CHANGED_ACTION广播，成功加入网络后在handleEvent中处理", "c": []}, {"t": "onStart中构造WpsInfo对象（setup=mWpsSetup，PIN对应WpsInfo.DISPLAY），调用WifiManager.startWps（内部向WifiStateMachine发送START_WPS消息）", "c": []}]}, {"t": "6.4.2 WifiStateMachine的处理", "c": [{"t": "STA未连接时WifiStateMachine处于DisconnectedState，其父状态ConnectedModeState处理START_WPS消息", "c": []}, {"t": "START_WPS处理：按WpsInfo.setup分派——PBC调WifiConfigStore.startWpsPbc；DISPLAY（PIN）调startWpsWithPinFromDevice；成功后回复WifiManager并转入WpsRunningState", "c": []}, {"t": "startWpsWithPinFromDevice：调用mWifiNative.startWpsPinDisplay(BSSID)，向WPAS发送\"WPS_PIN any\"命令，WPAS计算并返回动态PIN码；成功则markAllNetworksDisabled停用其他网络", "c": []}, {"t": "WPAS完成WSC流程后发送WPS-SUCCESS给WifiMonitor，WifiMonitor向WifiStateMachine发送WPS_SUCCESS_EVENT", "c": []}, {"t": "WpsRunningState收到WPS_SUCCESS_EVENT后回复WifiManager.WPS_COMPLETED（触发WpsListener.onCompletion）并转入DisconnectedState", "c": []}, {"t": "App层与Framework对WSC的处理本质上就是发送\"WPS_PIN any\"命令触发WPAS", "c": []}]}, {"t": "6.4.3 wpa_supplicant中的WSC处理", "c": [{"t": "WSC模块初始化", "c": [{"t": "在wpa_supplicant_init_iface最后调用wpas_wps_init；WPAS代码中WSC称WPS2", "c": []}, {"t": "wps_context是WPS模块核心数据结构；设置两个重要回调：cred_cb（=wpa_supplicant_wps_cred，解析credential属性集时用）、event_cb（=wpa_supplicant_wps_event，通知事件如\"WSC-SUCCESS\"）", "c": []}, {"t": "从wpa_supplicant.conf初始化设备信息（device_name、manufacturer、model_name等）", "c": []}, {"t": "config_methods字符串转标志位；Label与Display不能同时配置（静态与动态PIN码互斥）", "c": []}, {"t": "设置主/次设备类型、OS版本；根据硬件模式设置RF Bands；默认认证算法WPA2PSK|WPAPSK、加密算法AES|TKIP", "c": []}, {"t": "设置UUID（未配置则由MAC地址生成）；调用wps_registrar_init创建wps_registrar对象", "c": []}]}, {"t": "WPS_PIN命令处理", "c": [{"t": "ctrl_iface.c的wpa_supplicant_ctrl_iface_wps_pin处理\"WPS_PIN any\"（cmd=\"any\"时_bssid=NULL）", "c": []}, {"t": "调用wpas_wps_start_pin启动WPS流程；PIN码以\"%08d\"字符串形式返回给WifiStateMachine", "c": []}, {"t": "wpas_wps_start_pin：wpas_clear_wps清空旧WPS信息；wpas_wps_add_network创建wpa_ssid对象（key_mgmt=WPA_KEY_MGMT_WPS，identity为\"WFA-SimpleConfig-Enrollee-1-0\"），ssid->temporary=1", "c": []}, {"t": "无传入PIN时用wps_generate_pin生成随机PIN（8位，末位为前7位校验和），写入wpa_ssid的eap成员phase1", "c": []}, {"t": "注册120秒超时任务（WPS_PBC_WALK_TIME）；wpas_wps_reassoc重新关联并发起扫描（进入Discovery Phase）", "c": []}]}, {"t": "发起扫描请求", "c": [{"t": "wpa_supplicant_scan中调用wpa_supplicant_extra_ies处理WSC IE", "c": []}, {"t": "wpas_wps_in_use判断是否需要在Probe Request中加WSC IE：检查wpa_ssid的key_mgmt是否含WPA_KEY_MGMT_WPS；返回1=PIN方法、2=PBC方法", "c": []}, {"t": "wps_build_probe_req_ie构造WSC IE：含Version、Req Type、Config Methods、UUID-E、Primary Device Type、RF Bands、Assoc State、Config Error、Dev Password ID（PBC时DEV_PW_PUSHBUTTON）、WPS2下还有Manufacturer/Model Name等", "c": []}]}, {"t": "处理扫描结果", "c": [{"t": "wpa_supplicant_get_scan_results：WPS进行中时排序函数改为wpa_scan_result_wps_compar", "c": []}, {"t": "排序规则：支持WSC的AP排在前面；两个都支持WSC时Selected Registrar=1的排前；都不支持WSC时按信号强度和质量排序", "c": []}, {"t": "wpa_supplicant_pick_network按优先级遍历，经wpa_supplicant_select_bss、wpa_scan_res_match选择目标AP", "c": []}, {"t": "WPS相关wpa_ssid未设ssid时，wpas_wps_ssid_wildcard_ok判断可跳过ssid检查；wpas_wps_ssid_bss_match中PIN Enrollee通过wps_is_addr_authorized检查AuthorizedMACs子属性", "c": []}, {"t": "选中目标AP后进入关联流程；WSC情况下关联后开展EAP-WSC流程（非WSC则开展
