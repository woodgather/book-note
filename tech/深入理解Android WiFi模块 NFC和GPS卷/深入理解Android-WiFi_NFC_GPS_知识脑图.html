4-Way Handshake）", "c": []}]}]}, {"t": "6.4.4 EAP-WSC处理流程分析", "c": [{"t": "EAP-WSC涉及EAPOL四个状态机（SUPP_PAE、KEY_RX、SUPP_BE、Port Timers）与EAP SM的联动；关联成功后初态：PAE=DISCONNECTED、KEY_RX=NO_KEY_RECEIVE、BE=IDLE、EAP_SM=DISABLED", "c": []}, {"t": "发送EAPOL-Start", "c": [{"t": "关联流程最后eapol_sm_notify_portEnabled置portEnabled=1，SUPP_PAE进入CONNECTING", "c": []}, {"t": "支持WPS时startWhen=1（否则3）；Port Timers SM递减startWhen到0后经eapol_sm_step重新遍历，PAE再次进入CONNECTING（此时send_start=1），调用eapol_sm_txStart", "c": []}, {"t": "eapol_sm_txStart经eapol_send（实例为wpa_supplicant_eapol_send）最终发出EAPOL-Start帧", "c": []}]}, {"t": "状态机切换处理", "c": [{"t": "AP回EAP-Request/Identity，STA收到EAP包经wpa_supplicant_rx_eapol→eapol_sm_rx_eapol处理；收EAP_PACKET时存入eapReqData、置eapolEap=TRUE并触发eapol_sm_step", "c": []}, {"t": "eapol_sm_step：先按序运行PAE、KEY_RX、BE，再运行EAP SM；任一状态机状态变化则循环（最多100次）重新遍历直至稳定", "c": []}, {"t": "状态机联动规律：PAE_RESTART置eapRestart=TRUE促使EAP_SM进入INITIALIZE；EAP处理Identity后构造EAP-Response/Identity并置eapResp=TRUE；eapResp使BE进入RESPONSE状态由txsuppResp发送回复包", "c": []}, {"t": "后续M1～M8期间PAE保持Authenticating不变；BE循环RECEIVE→REQUEST→RESPONSE，EAP SM根据EAP包内容转移；KEY_RX不参与", "c": []}, {"t": "key_mgmt=WPA_KEY_MGMT_WPS时force_disabled被置FALSE，EAP SM才能从DISABLED转入INITIALIZE", "c": []}]}, {"t": "EAP-Request/Identity处理", "c": [{"t": "EAP SM的RECEIVED状态调用eap_sm_parseEapReq解析：记录reqId、reqMethod；reqMethod=EAP_TYPE_EXPANDED（254）时进一步取reqVendor（0x372a）和reqVendorMethod（0x1，SimpleConfig）", "c": []}, {"t": "IDENTITY状态：eap_sm_processIdentity处理Identity，eap_sm_buildIdentity构造EAP-Response/Identity——identity为\"WFA-SimpleConfig-Enrollee-1-0\"", "c": []}]}, {"t": "EAP-Request/WSC_Start处理", "c": [{"t": "EAP SM进入GET_METHOD状态：eap_sm_allowMethod检查是否支持该vendor方法（EAP-WSC已在eap_register_methods注册）；sm->m指向eap_method对象；调用m->init初始化EAP-WSC算法", "c": []}, {"t": "EAP-WSC模块定制三函数：eap_wsc_init/deinit（资源初始化与释放）、eap_wsc_process（处理EAP-WSC包）", "c": []}, {"t": "METHOD状态调用sm->m->process（即eap_wsc_process）生成回复数据", "c": []}]}, {"t": "eap_wsc_process介绍", "c": [{"t": "eap_hdr_validate校验头部（EAP_VENDOR_WFA、EAP_VENDOR_TYPE_WSC）；解析Op-Code、Flags；处理LF（Message Length）和MF（分片，WAIT_FRAG_ACK状态）标志", "c": []}, {"t": "初始状态WAIT_START时收到WSC_Start后转入MESG状态", "c": []}, {"t": "两个关键函数：wps_process_msg（Enrollee侧调wps_enrollee_process_msg处理收到的M2/M4/M6/M8等，返回WPS_DONE/WPS_CONTINUE/WPS_FAILURE/WPS_PENDING）、wps_get_msg（Enrollee侧调wps_enrollee_get_msg构造M1/M3/M5/M7/WSC_Done消息）", "c": []}, {"t": "用eap_wsc_build_msg构造回复的EAP-WSC消息包", "c": []}]}, {"t": "M8消息处理", "c": [{"t": "wps_process_m8：先校验Enrollee Nonce和Authenticator（防中间人篡改，失败则SEND_WSC_NACK）→wps_decrypt_encr_settings用KeyWrapKey解密Encrypted Settings→wps_validate_m8_encr校验→wps_parse_msg解析→wps_process_key_wrap_auth校验→wps_process_creds处理Credential属性集、wps_process_ap_settings_e处理AP设置", "c": []}, {"t": "wps_process_cred_e最后经cred_cb回调（wpa_supplicant_wps_cred）把credential交给WPAS", "c": []}, {"t": "wpa_supplicant_wps_cred：wps_cred_processing控制处理方式（0=WPAS内部处理，1=发给客户端，2=内部处理也发送）；校验认证算法（OPEN/SHARED/WPAPSK/WPA2PSK）", "c": []}, {"t": "更新wpa_ssid：清除EAP-WSC临时配置（identity/phase1/eap_methods）、写入cred的SSID、按encr_type设置pairwise_cipher（TKIP→WPA_CIPHER_TKIP，AES→CCMP）、按auth_type设置key_mgmt/proto（如WPA2PSK→key_mgmt=WPA_KEY_MGMT_PSK、proto=RSN）", "c": []}, {"t": "cred->key_len为2×PMK_LEN时按十六进制解析为PSK；wpas_wps_security_workaround处理混合加密模式AP的兼容问题；需要时wpa_config_write将配置写入配置文件", "c": []}, {"t": "STA与AP断开后即用新网络配置发起关联；MSG_Done构造中WPAS发送WPS-SUCCESS给WifiMonitor", "c": []}, {"t": "经验总结：EAP-WSC代码难点不在算法本身而在状态机联动；建议读者自行研究M1～M7处理流程", "c": []}]}]}], "id": "s29"}, {"title": "6.5 本章总结和参考资料说明", "nodes": [{"t": "核心是WSC理论知识：最重要的是RP协议、WSC IE及各种Attribute的作用，建议结合实例图学习", "c": []}, {"t": "掌握理论后学习Android实现：Settings、WifiService相关模块、wpa_supplicant相关模块；EAP-WSC算法本身难度不大", "c": []}, {"t": "因使用EAP-WSC，还介绍了EAPOL与EAP状态机联动过程，代码难度较大，需结合状态机切换图学习", "c": []}, {"t": "PBC方法与PIN类似，也用一个PIN码，只不过固定为\"00000000\"", "c": []}, {"t": "参考资料：WSC规范2.0.2版（第1节Introduction、第4节Core Architecture、第6.1节In-band Setup Using a Standalone AP/Registrar、第8节Message Encoding、第7节Registration Protocol Definition、第11节Push Button Configuration）；维基百科Diffie-Hellman key exchange词条", "c": []}], "id": "s30"}]}, {"title": "第7章 深入理解Wi-Fi P2P", "sections": [{"title": "7.1 概述", "nodes": [{"t": "Wi-Fi P2P是WFA推出的技术规范，商品名为Wi-Fi Direct，支持多个Wi-Fi设备在没有AP的情况下相互连接", "c": []}, {"t": "Android平台P2P功能集中点：Framework中的WifiP2pService（功能类似WifiService，处理P2P相关工作）、wpa_supplicant中的P2P模块", "c": []}, {"t": "本章分析方法：先介绍P2P基础知识，再分析Settings、WifiP2pService及WPAS相关模块", "c": []}, {"t": "涉及源码文件：WifiP2pSettings.java、WifiP2pService.java、p2p_supplicant.c、p2p.c、p2p_pd.c、p2p_go_neg.c、driver_nl80211.c、ctrl_iface.c", "c": []}], "id": "s31"}, {"title": "7.2 P2P基础知识", "nodes": [{"t": "P2P规范全名\"Wi-Fi Peer-to-Peer（P2P）Technical Specification\"，版本1.1，约160页", "c": []}, {"t": "P2P使多个Wi-Fi设备在无AP情况下构成P2P Network（P2P Group）并相互通信", "c": []}, {"t": "P2P是Wi-Fi Display（Miracast）的基础：手机可直接连接智能电视并传输媒体内容", "c": []}, {"t": "7.2.1 P2P架构", "c": [{"t": "三个组件（\"一个设备，两种角色\"）：P2P Device（角色实体，即Wi-Fi设备）、P2P Group Owner（GO，类似Infrastructure BSS中的AP）、P2P Client（类似STA）", "c": []}, {"t": "P2P技术模仿Infrastructure BSS：组建Group前均为P2P Device；协商完成后有且只有一个Device扮演GO，其余扮演Client", "c": []}, {"t": "一个P2P Group只能有一个GO，可支持1∶n个Client连接；周围不支持P2P的STA（Legacy Client）也可发现并关联GO（但不能处理P2P协议特有功能）", "c": []}, {"t": "建Group流程与Infrastructure BSS类似：先通过WSC获取安全配置信息，Client再用协商好的安全设置关联GO（RSNA流程，含4-Way Handshake）", "c": []}, {"t": "依赖技术：必须支持802.11g及以上、安全必须支持WPA2、必须支持WMM（源自802.11e的QoS）、WSC为前置依赖", "c": []}, {"t": "P2P特有技术项：必选三项为P2P Discovery（核心）、P2P Group Operation（GO管理Group的职责）、P2P PowerManagement（省电）；可选一项为Managed P2P Device Operation（企业级IT统一管理）", "c": []}]}, {"t": "7.2.2 P2P Discovery技术", "c": [{"t": "作用：使多个P2P Device互相发现并构建Group；包含四个子项：Device Discovery（搜索周围P2P设备）、Service Discovery（搜索指定服务，可选，类似Bonjour）、Group Formation（决定谁当GO谁当Client）、P2P Invitation（激活Persistent Group或邀请Client加入现有Group）", "c": []}, {"t": "Group分两类：Temporary Group（临时，安全配置信息每次组建都变化）；Persistent Group（永久，GO由指定设备扮演如打印机，安全信息保存复用）", "c": []}, {"t": "Device Discovery利用Probe Request/Response帧，但比Infrastructure BSS扫描复杂：P2P Device既要发Probe Request也要接收并回复Probe Response（BSS中只有AP回复）", "c": []}, {"t": "两个状态：Search State（在2.4GHz的1、6、11频段即Social Channels上发送Probe Request，帧中必须含P2P IE）；Listen State（随机选定一个Listen Channel监听并回复，只处理含P2P IE的Probe Request）", "c": []}, {"t": "两个阶段：Scan Phase（在所有频段发Probe Request做主动扫描，之后进入Find Phase）；Find Phase（在Search State和Listen State间来回切换）", "c": []}, {"t": "Listen State时长为100TU的随机整数倍，随机化的目的是防止两设备同时进Listen/Search的\"Lock-Step怪圈\"", "c": []}, {"t": "Probe Request帧要求：SSID必须为P2P Wildcard SSID\"DIRECT-\"；必须包含P2P IE（Vendor IE，Element ID=221，OUI=50-6F-9A-09，09代表P2P）；MAC头Address1为广播地址或目标P2P Device Address", "c": []}, {"t": "两种地址：P2P Device Address（全局唯一，作用等同MAC地址，用于Discovery）；P2P Interface Address（加入Group后与成员交互使用，Group结束后作废）", "c": []}, {"t": "P2P Capability属性：分Device Capability Bitmap和Group Capability Bitmap，每bit代表一种P2P特性；P2P Client Discoverability场景：已当Client的设备不回复Probe Response，由GO通过Device Discoverability Request/Response帧代答", "c": []}, {"t": "Listen Channel属性字段：Country String、Operating Class（如81，2.407GHz起始、13频道、间隔25MHz）、Channel Number；另有含义不同的Operating Channel属性（设备当GO时Group工作的频段）", "c": []}, {"t": "Probe Response帧含WSC IE和P2P IE，P2P IE中额外含P2P Device Info属性（含Primary Device Type、Config Methods、Device Name、P2P Device Address等）", "c": []}, {"t": "Group Formation两阶段：GO Negotiation（协商谁做GO）；Provisioning（借助WSC交换安全配置信息，之后Client关联GO）", "c": []}, {"t": "P2P Public Action帧：802.11管理帧Action帧，Frame Body含Category和Action Detail；P2P使用Category=4（Public）中Vendor Specific子类型及Category=127（Vendor Specific）", "c": []}, {"t": "GO Negotiation（GON）三次帧交换：GON Request、GON Response、GON Confirmation，仅交换信息决定GO角色", "c": []}, {"t": "GO Intent属性：Tie Breaker位（随机0/1，决胜因素）+ Intent值（0~15，15表示必须当GO，默认7）；比较规则：Intent大者当GO；Intent相同时Tie Breaker为1者当GO；双方Intent均为15则GON失败", "c": []}, {"t": "GON Request其他属性：Configuration Timeout（单位10ms）；Channel List（Country String+各Operating Class的Channel信息）；Intended P2P Interface Address", "c": []}, {"t": "Android中收到GON Request会弹出提示框，用户\"接受\"才继续Group Formation", "c": []}, {"t": "GON Response属性：Status（0成功）；P2P Group ID（唯一标示Group，必须含P2P Device Address+SSID；SSID规则：开头\"DIRECT-xy\"，Android后接设备名如\"Android_4aa9\"）；只有将当GO的设备才在GON Response中包含P2P Group ID属性", "c": []}, {"t": "Provision Discovery（PD）：为确定双方使用的WSC配置方法（Config Method属性，共13种方法）；含PD Request和PD Response两次交换；Response方支持则设置相同Config Method值，不支持则设0（发起方换一种方法重试）；PD另一作用是提前提醒用户执行WSC操作（如输入PIN码）", "c": []}, {"t": "PD设计的动机：Group Formation（GON+Provisioning）要求15秒内完成，而WSC规范允许2分钟（需用户参与）；PD在Group Formation之前提前获取用户输入的安全信息", "c": []}, {"t": "注意：Provision Discovery不属于Group Formation，是为加快Group Formation速度而设计", "c": []}]}, {"t": "7.2.3 P2P工作流程", "c": [{"t": "P2P规范附录A用状态机描述整体工作流程：三大阶段Find Phase、Group Formation Procedure、Operational Phase", "c": []}, {"t": "Group Formation Procedure阶段含三个状态：GON、WSC Provisioning Registrar、WSC Provisioning Enrollee", "c": []}, {"t": "Search状态含两个子状态：Search子状态及Service Discovery子状态（后者为可选）", "c": []}, {"t": "每个状态有Entry Action（EA）、Exit Action（EXA）和Internal Behavior", "c": []}, {"t": "状态流转：初始Off→Scan；Find Phase含Listen和Search两状态；Group Formation含GON及WSC Provisioning两状态；Operational Phase含P2P GO和P2P Client两状态", "c": []}]}], "id": "s32"}, {"title": "7.3 WifiP2pSettings和WifiP2pService介绍", "nodes": [{"t": "WifiP2pSettings：Settings应用中处理P2P UI/UE逻辑的主要类", "c": []}, {"t": "WifiP2pService：位于SystemServer进程中，与WifiP2pSettings交互；与第5章WifiService并列（WifiService管WLAN连接，WifiP2pService专管Wi-Fi P2P）", "c": []}, {"t": "7.3.1 WifiP2pSettings工作流程", "c": [{"t": "用户操作三步：进入WifiP2pSettings界面→搜索周围P2P设备→选择设备发起连接", "c": []}, {"t": "onActivityCreated：加载R.xml.wifi_p2p_settings；注册监听P2P特有广播：WIFI_P2P_STATE_CHANGED_ACTION（P2P功能enable/disable）、WIFI_P2P_PEERS_CHANGED_ACTION（设备列表变化，需requestPeers重新获取）、WIFI_P2P_CONNECTION_CHANGED_ACTION（携带WifiP2pInfo和NetworkInfo）、WIFI_P2P_THIS_DEVICE_CHANGED_ACTION、WIFI_P2P_DISCOVERY_CHANGED_ACTION、WIFI_P2P_PERSISTENT_GROUPS_CHANGED_ACTION；getSystemService(WIFI_P2P_SERVICE)创建WifiP2pManager并initialize建立连接", "c": []}, {"t": "WIFI_P2P_STATE_CHANGED_ACTION处理：使能SEARCH/RENAME按钮并调用requestPeers（回调PeerListener.onPeersAvailable返回WifiP2pDeviceList）", "c": []}, {"t": "startSearch函数：调用WifiP2pManager.discoverPeers触发搜索；RENAME按钮更改本机P2P设备名", "c": []}, {"t": "WIFI_P2P_DISCOVERY_CHANGED_ACTION处理：STARTED时按钮显示\"Searching...\"，否则显示\"Search For Devices\"", "c": []}, {"t": "WIFI_P2P_PEERS_CHANGED_ACTION处理：requestPeers→onPeersAvailable回调，将每个WifiP2pDevice包装为WifiP2pPeer（Preference子类）加入mPeersGroup显示", "c": []}, {"t": "onPreferenceTreeClick：已连接弹DIALOG_DISCONNECT，INVITED弹DIALOG_CANCEL_CONNECT，否则构造WifiP2pConfig（deviceAddress+wps.setup，WSC方法优先级PBC→KEYPAD→DISPLAY）调用WifiP2pManager.connect发起连接", "c": []}, {"t": "WIFI_P2P_CONNECTION_CHANGED_ACTION处理：requestGroupInfo（回调GroupInfoListener.onGroupInfoAvailable保存WifiP2pGroup并更新UI）；NetworkInfo未连接则重新startSearch", "c": []}, {"t": "关键API：initialize（经AsyncChannel与WifiP2pService建立交互）、discoverPeers、requestPeers、connect、requestGroupInfo；重要数据结构WifiP2pDevice、WifiP2pGroup", "c": []}]}, {"t": "7.3.2 WifiP2pService工作流程", "c": [{"t": "构造函数：P2P虚拟网络接口名\"p2p0\"；NetworkInfo类型TYPE_WIFI_P2P；hasSystemFeature(FEATURE_WIFI_DIRECT)判断是否支持；默认primaryDeviceType\"10-0050F204-5\"（Telephone类）；核心工作由内部状态机P2pStateMachine完成", "c": []}, {"t": "P2pStateMachine共15个状态；p2pSupported时初始状态为P2pDisabledState，否则P2pNotSupportedState；层级关系根为DefaultState", "c": []}, {"t": "CMD_ENABLE_P2P处理（P2pDisabledState）：来自WifiStateMachine（DriverStartedState的EA经mWifiP2pChannel发送）；mNwService.setInterfaceUp(\"p2p0\")；WifiMonitor.startMonitoring()连接wpa_supplicant；转入P2pEnablingState", "c": []}, {"t": "SUP_CONNECTION_EVENT处理（P2pEnablingState）：转入InactiveState；其父状态P2pEnabledState的EA发送WIFI_P2P_STATE_CHANGED_ACTION（STATE_ENABLED）、WIFI_P2P_CONNECTION_CHANGED_ACTION广播，并调用initializeP2pSettings", "c": []}, {"t": "initializeP2pSettings：setPersistentReconnect(true)；getPersistedDeviceName（查settings.db secure表wifi_p2p_device_name字段，缺省取android_id前4字符加\"Android_\"前缀）；setDeviceName、setP2pSsidPostfix、setDeviceType、setConfigMethods、setConcurrencyPriority(\"sta\")（STA优先于P2P）、p2pGetDeviceAddress、updateThisDevice(AVAILABLE)、p2pFlush、updatePersistentNetworks(RELOAD)（mGroups类型WifiP2pGroupList保存Group信息）", "c": []}, {"t": "DISCOVER_PEERS处理（P2pEnabledState）：发送\"P2P_FIND 120\"给WPAS，成功则回复DISCOVER_PEERS_SUCCEEDED并发WIFI_P2P_DISCOVERY_CHANGED_ACTION广播", "c": []}, {"t": "P2P_DEVICE_FOUND_EVENT处理（P2pEnabledState）：WifiMonitor按WPAS的P2P-DEVICE-FOUND消息构建WifiP2pDevice；本机设备跳过；mPeers.update加入/更新WifiP2pDeviceList，发WIFI_P2P_PEERS_CHANGED_ACTION广播", "c": []}, {"t": "CONNECT处理（InactiveState）：取WifiP2pConfig；mAutonomousGroup=false；调connect(config, TRY_REINVOCATION=true)；更新对端status为INVITED；connectRet==NEEDS_PROVISION_REQ则转ProvisionDiscoveryState，否则转GroupNegotiationState", "c": []}, {"t": "connect函数：保存mSavedPeerConfig；join=对端isGroupOwner()（结合isGroupLimit、p2pGetSsid、mGroups.getNetworkId判断）；join为false时若tryInvocation且isInvitationCapable则查Persistent Group，netId>=0时p2pReinvoke重启Persistent Group；p2pStopFind", "c": []}, {"t": "ProvisionDiscoveryState EA：mWifiNative.p2pProvisionDiscovery(mSavedPeerConfig)发送PD Request；PBC场景对端收到P2P_PROV_DISC_PBC_REQ_EVENT、本机收P2P_PROV_DISC_PBC_RSP_EVENT", "c": []}, {"t": "P2P_PROV_DISC_PBC_RSP_EVENT处理：校验deviceAddress，wps.setup==WpsInfo.PBC时调p2pConnectWithPinDisplay（内部触发WPAS发GON Request，对端弹提示框），转入GroupNegotiationState", "c": []}, {"t": "P2P_GROUP_STARTED_EVENT处理（GroupNegotiationState）：保存WifiP2pGroup；本机是GO则startDhcpServer（dnsmasq）；否则创建DhcpStateMachine并CMD_START_DHCP获取IP、更新GO状态为CONNECTED；转入GroupCreatedState", "c": []}, {"t": "GroupCreatedState EA：NetworkInfo置CONNECTED、updateThisDevice(CONNECTED)；GO时setWifiP2pInfoOnGroupFormation(SERVER_ADDRESS=\"192.168.49.1\")并发WIFI_P2P_CONNECTION_CHANGED_ACTION广播", "c": []}, {"t": "AP_STA_CONNECTED_EVENT处理（GroupCreatedState）：P2P Client关联上本机GO时mGroup.addClient(deviceAddress)、mPeers.updateStatus(CONNECTED)、发WIFI_P2P_PEERS_CHANGED_ACTION广播", "c": []}, {"t": "工作流程总结（9步）：CMD_ENABLE_P2P→SUP_CONNECTION_EVENT→P2pEnabledState初始化→DISCOVER_PEERS→P2P_DEVICE_FOUND_EVENT→CONNECT→ProvisionDiscoveryState（PD流程→GroupNegotiationState）→P2P_GROUP_STARTED_EVENT（GO启DhcpServer）→AP_STA_CONNECTED_EVENT", "c": []}]}], "id": "s33"}, {"title": "7.4 wpa_supplicant中的P2P", "nodes": [{"t": "Android原生代码中WifiService和WifiP2pService共用一个wpa_supplicant进程；厂商可为两者各建进程：Galaxy Note 2中WifiService用wpa_supplicant，WifiP2pService用p2p_supplicant（实为打开了P2P编译选项的wpa_supplicant）", "c": []}, {"t": "p2p_supplicant由init配置文件定义，配置文件/data/misc/wifi/p2p_supplicant.conf，ctrl_iface路径/data/misc/wifi/sockets", "c": []}, {"t": "7.4.1 P2P模块初始化", "c": [{"t": "wpas_p2p_init（p2p_supplicant.c）：检查drv_flags含WPA_DRIVER_FLAGS_P2P_CAPABLE才初始化；WPA_DRIVER_FLAGS_P2P_MGMT时由wifi driver直接处理P2P", "c": []}, {"t": "初始化p2p_config：设置回调函数（p2p_scan→wpas_p2p_scan、get_noa、go_connected等约20个，定义P2P模块与外界交互接口）；设置P2P Device Address、dev_name/manufacturer/model_name、uuid和config_methods（取自wps）、listen channel/reg_class、国家码（默认\"XX\\x04\"）、wpas_p2p_setup_channels校验驱动支持的channels、concurrent_operations、max_peers=100、p2p_ssid_postfix", "c": []}, {"t": "调用p2p_init（p2p.c）创建p2p_data对象（p2p->cfg指向p2p_config拷贝）", "c": []}, {"t": "Driver Flags（driver.h）含义：WPA_DRIVER_FLAGS_AP(0x40)支持AP（使设备能当GO）；P2P_CONCURRENT(0x200)支持STA+P2P并发；P2P_CAPABLE(0x800)支持P2P；P2P_MGMT_AND_NON_P2P(0x2000)；Galaxy Note 2取值0x2EAC0", "c": []}, {"t": "重要数据结构：p2p_config（20个回调函数）、p2p_data（P2P模块代表）、p2p_device（一个P2P设备）、p2p_group（含p2p_group_member链表即Client信息）", "c": []}, {"t": "p2p_init细节：ANDROID_P2P时min_disc_int=2（listen最短200ms）；随机初始化next_tie_breaker；设置dev_capab（SERVICE_DISCOVERY、INVITATION_PROCEDURE、CONCURRENT_OPER、CLIENT_DISCOVERABILITY）；初始化devices链表；注册p2p_expiration_timeout超时任务检测不活跃p2p_device", "c": []}, {"t": "注册Action帧监听：nl80211_mgmt_subscribe_non_ap注册监听；处理函数为process_bss_event", "c": []}, {"t": "注册两类帧：P2P Public Action帧（\"\\x04\\x09\\x50\\x6f\\x9a\\x09\"，Category=0x04+OUI 50-6F-9A+Type 09；GON、P2P Invitation、Provision Discovery、Device Discoverability使用）；P2P Action帧（\"\\x7f\\x50\\x6f\\x9a\\x09\"，Category=0x7F；Notice of Absence、P2P Presence、GO Discoverability使用）；另有GAS Public Action帧监听（与Service Discovery相关）", "c": []}, {"t": "后续三大流程：搜索周围P2P设备（Device Discovery）、发起Provision Discovery、Group Formation（重点Group Negotiation）；GON后本机当Client则做Provisioning（Enrollee）并加入Group，当GO则做Provisioning（Registrar）并处理Client加入", "c": []}]}, {"t": "7.4.2 P2P Device Discovery流程分析", "c": [{"t": "入口：P2pStateMachine发\"P2P_FIND 120\"命令→p2p_ctrl_find（解析timeout、type、dev_id）→wpas_p2p_find→p2p_find", "c": []}, {"t": "P2P_FIND三种Discovery Type：P2P_FIND_START_WITH_FULL（默认，先扫描所有频段再扫social channels）；P2P_FIND_ONLY_SOCIAL（只扫social channels，更快）；P2P_FIND_PROGRESSIVE（类似FULL但Search State阶段逐个扫所有频段）", "c": []}, {"t": "GO工作在Operation Channel，Listen Channel只在最初Device Discovery阶段使用", "c": []}, {"t": "wpas_p2p_find：wpas_p2p_clear_pending_action_tx清待发Action帧；取消sched_scan；最终调p2p_find", "c": []}, {"t": "p2p_find：p2p_set_state(P2P_SEARCH)；注册p2p_find_timeout超时任务；按type调用p2p->cfg->p2p_scan（P2P_SCAN_FULL或P2P_SCAN_SOCIAL）", "c": []}, {"t": "wpas_p2p_scan：params.ssids[0]=\"DIRECT-\"（P2P_WILDCARD_SSID）；wps_build_probe_req_ie构造WSC IE；p2p_scan_ie构造P2P IE；P2P_SCAN_SOCIAL时freqs={2412,2437,2462}；scan_res_handler=wpas_p2p_scan_res_handler；wpa_drv_scan发起扫描", "c": []}, {"t": "扫描结果处理：wpas_p2p_scan_res_handler对每个结果调p2p_scan_res_handler→p2p_add_device，完毕后调p2p_scan_res_handled", "c": []}, {"t": "p2p_add_device：p2p_parse_ies解析IE到p2p_message；p2p_create_device创建p2p_device并加入devices链表；记录last_seen、listen_freq、oper_freq（GO的Probe Response含Group Info属性）；p2p_copy_wps_info复制WSC IE；p2p_add_group_clients按Group Info添加Client；回调p2p->cfg->dev_found（→wpas_dev_found向WifiMonitor发P2P-DEVICE-FOUND消息）", "c": []}, {"t": "p2p_scan_res_handled：p2p_scan_running=0；state==P2P_SEARCH时调p2p_continue_find", "c": []}, {"t": "p2p_continue_find→p2p_listen_in_find：按country/reg_class/channel算listen频段；随机计算listen时长tu=(随机数%(max-min+1)+min)*100（100TU倍数）；p2p_build_probe_resp_ies构造Probe Response IE；回调start_listen（→wpas_start_listen）", "c": []}, {"t": "wpas_start_listen：wpa_drv_set_ap_wps_ie（为driver设置Probe/Assoc Response的P2P IE）；wpa_drv_probe_req_report（driver收到Probe Request后发EVENT_RX_PROBE_REQ给WPAS，由WPAS回复）；wpa_drv_remain_on_channel（driver在指定频段停留duration毫秒）", "c": []}, {"t": "扫描过程中若发现go_neg_peer则直接p2p_connect_send发GON Request", "c": []}]}, {"t": "7.4.3 Provision Discovery流程分析", "c": [{"t": "命令入口：ProvisionDiscoveryState EA发\"P2P_PROV_DISC <addr> pbc\"→p2p_ctrl_prov_disc→wpas_p2p_prov_disc→p2p_prov_disc_req", "c": []}, {"t": "p2p_prov_disc_req（p2p.c）：p2p_get_device找p2p_device；dev->req_config_methods=config_methods；user_initiated_pd=!join；调p2p_send_prov_disc_req", "c": []}, {"t": "p2p_send_prov_disc_req（p2p_pd.c）：确定频段；dev->dialog_token自增；p2p_build_prov_disc_req构造PD Request帧；pending_action_state=P2P_PENDING_PD；p2p_send_action发送（涉及Off Channel发送）；保存pending_pd_devaddr", "c": []}, {"t": "PD Response属于Action帧，接收链：process_bss_event（NL80211_CMD_FRAME）→mlme_event→mlme_event_mgmt（stype==WLAN_FC_STYPE_ACTION时发EVENT_RX_ACTION）→wpa_supplicant_event→wpas_p2p_rx_action→p2p_rx_action→p2p_rx_action_public→p2p_rx_p2p_action分类分发", "c": []}, {"t": "p2p_rx_p2p_action是P2P Public Action帧处理总入口，按data[0]分发：P2P_GO_NEG_REQ/RESP/CONF→p2p_process_go_neg_req/resp/conf；P2P_INVITATION_REQ/RESP；P2P_PROV_DISC_REQ/RESP；P2P_DEV_DISC_REQ/RESP；非Public类Action帧在p2p_rx_action中处理（P2P_NOA、P2P_PRESENCE_REQ/RESP、P2P_GO_DISC_REQ）", "c": []}, {"t": "p2p_process_prov_disc_resp（p2p_pd.c）：p2p_parse解析；校验dialog_token；msg.wps_config_methods与dev->req_config_methods不一致则回调prov_disc_fail；置wps_prov_info；调send_action_done和prov_disc_resp（→wpas_prov_disc_resp）", "c": []}, {"t": "wpas_prov_disc_resp：pending_pd_before_join场景则wpas_p2p_join_start；WPS_CONFIG_DISPLAY→wpas_prov_disc_local_keypad；WPS_CONFIG_KEYPAD→wps_generate_pin生成PIN后wpas_prov_disc_local_display；WPS_CONFIG_PUSHBUTTON→wpa_msg发送P2P_EVENT_PROV_DISC_PBC_RESP给客户端，触发Java层P2P_PROV_DISC_PBC_RSP_EVENT处理", "c": []}]}, {"t": "7.4.4 GO Negotiation流程分析", "c": [{"t": "命令入口：P2pStateMachine收到P2P_PROV_DISC_PBC_RSP_EVENT后p2pConnectWithPinDisplay发\"P2P_CONNECT <addr> pbc go_intent=7\"→p2p_ctrl_connect→wpas_p2p_connect", "c": []}, {"t": "wpas_p2p_connect：go_intent默认取conf的p2p_go_intent；join=0；wpas_p2p_create_iface判断（含WPA_DRIVER_FLAGS_P2P_MGMT_AND_NON_P2P标志时返回1）需创建新virtual interface供P2P用（其地址即P2P Interface Address，内部调wpa_driver_nl80211_if_add）；iftype=WPA_IF_P2P_GROUP（go_intent==15时为WPA_IF_P2P_GO）；wpas_p2p_start_go_neg（→p2p_connect）", "c": []}, {"t": "p2p_connect：p2p_prepare_channel校验频段；p2p->go_intent、intended_addr赋值；非P2P_IDLE先p2p_stop_find；若p2p_scan_running则置start_after_scan=P2P_AFTER_SCAN_CONNECT；否则p2p_connect_send", "c": []}, {"t": "p2p_connect_send（p2p_go_neg.c）：p2p_build_go_neg_req构造GON Request；p2p_set_state(P2P_CONNECT)；pending_action_state=P2P_PENDING_GO_NEG_REQUEST；go_neg_peer=dev；dev置P2P_DEV_WAIT_GO_NEG_RESPONSE；p2p_send_action发送", "c": []}, {"t": "GON Response处理：p2p_process_go_neg_resp解析后调p2p_go_det(p2p->go_intent, *msg.go_intent)按规则判GO角色（返回>0本机当GO，0对端当GO，-1双方都想当GO即失败）；p2p_build_go_neg_conf构造GON Confirmation；p2p_send_action发送", "c": []}, {"t": "EVENT_TX_STATUS处理链（GON Confirmation发送后的TX Report）：driver发NL80211_CMD_FRAME_TX_STATUS→EVENT_TX_STATUS→offchannel_send_action_tx_status（释放pending_action_tx，回调pending_action_tx_status_cb→wpas_p2p_send_action_tx_status）→p2p_send_action_cb（按pending_action_state分发）", "c": []}, {"t": "p2p_go_neg_conf_cb：回调send_action_done；go_neg_peer存在则p2p_go_complete", "c": []}, {"t": "p2p_go_complete：p2p_set_state(P2P_PROVISIONING)进入Group Formation的Provisioning阶段；回调go_neg_completed（→wpas_go_neg_completed）", "c": []}, {"t": "wpas_go_neg_completed：wpa_msg发P2P_EVENT_GO_NEG_SUCCESS（导致P2pStateMachine收到P2P_GO_NEGOTIATION_SUCCESS_EVENT）；create_p2p_iface时wpas_p2p_init_group_interface再创建一个wpa_supplicant对象管理P2P Group专用virtual interface（新对象MAC为P2P Interface Address，用于Group操作；原wpa_supplicant MAC为P2P Device Address）；本机当GO则wpas_start_wps_go（启动WSC Registrar），否则wpas_start_wps_enrollee；注册Group Formation超时（约15秒）", "c": []}]}], "id": "s34"}, {"title": "7.5 本章总结和参考资料说明", "nodes": [{"t": "三大内容回顾：P2P理论知识（仅规范最基础部分，需反复琢磨并结合代码理解）；WifiP2pSettings与WifiP2pService（较简单易掌握）；WPAS中P2P模块及运行机制（P2P与wifi driver实现考虑多如off channel、TX Report处理，流程显得繁琐）", "c": []}, {"t": "留给读者的任务：通读P2P规范，学习Group Operation、Invitation、Device Discoverability、P2P Power Management；继续研究wpas_start_wps_go代码掌握WPAS中WSC Registrar及AP工作流程", "c": []}, {"t": "参考资料：Wi-Fi P2P规范1.1版全文（第2章Architectural Overview、3.1节P2P Discovery、3.2节P2P Group Operation、3.3节P2P Power Management、4.2节Management Frames、4.1节P2P Information Elements、附录A P2P State Machine）；802.11规范附录J（Country information element and regulatory classes）；802.11-2012的8.4.1.11节Action Field", "c": []}], "id": "s35"}]}]}, {"name": "NFC 篇", "color": "#059669", "chapters": [{"title": "第8章 深入理解NFC", "sections": [{"title": "8.1 概述", "nodes": [{"t": "NFC（Near Field Communication，近场通信）由Philips和Sony于2002年末联合推出", "c": []}, {"t": "2004年Nokia、Philips、Sony共同组建NFC Forum非盈利组织，负责制定NFC技术标准并通过认证测试（职责类似Wi-Fi Alliance）", "c": []}, {"t": "与Wi-Fi同样基于无线射频技术，但工作频率为13.56MHz，有效距离约4cm，速率为106/212/424kbps三种", "c": []}, {"t": "4cm的极短有效距离要求交互双方有某种程度的相互信任，决定了NFC与Wi-Fi不同的应用场景", "c": []}, {"t": "NFC技术上已相当完善但尚未普及，重要原因是缺少合适的消费载体；Android智能终端的普及有望改善", "c": []}, {"t": "本章结构：先讲NFC基础知识（核心），再讲Android平台NFC实现，最后探讨开源NFC模块", "c": []}], "id": "s36"}, {"title": "8.2 NFC基础知识", "nodes": [{"t": "NFC是从多种不同技术基础上综合发展而来（RFID、磁条卡、移动终端三条路线的融合）", "c": []}, {"t": "8.2.1 NFC概述", "c": [{"t": "NFC融合三条技术路线", "c": [{"t": "RFID路线：从条形码→RFID→NFC Tag与NFC Reader；NFC Tag是被动式（Passive）RFID Tag，自身无电源，依靠NFC Reader通过电磁感应供电", "c": []}, {"t": "磁条卡路线：演化为Proximity Coupling Smart Card（有效距离10cm，规范ISO/IEC 14443；对比：Close Coupling为1cm/ISO 10536，Vicinity Coupling为1m/ISO 15693）；Smart Card安全性要求远高于RFID Tag，可运行Java Card OS等嵌入式系统/Applets", "c": []}, {"t": "移动终端路线：NFC与智能终端融合，拓展应用场景，如NFC Connection Handover（通过NFC协商用蓝牙或Wi-Fi传输数据，NFC本身不适合大数据量传输）", "c": []}]}, {"t": "三种运行模式（从用户角度看）", "c": [{"t": "Reader/Write（R/W）模式：与NFC Tag/NFC Reader相关", "c": []}, {"t": "Peer-to-Peer（P2P）模式：支持两个NFC设备交互", "c": []}, {"t": "Card Emulation（CE）模式：把设备模拟成Smart Card，实现手机支付、门禁卡等功能", "c": []}]}, {"t": "RF层规范：ISO 18092（NFCIP-1，定义NFC RF层工作流程）、ISO 14443 Type A/Type B、FeliCa", "c": [{"t": "ISO 14443为非接触式IC卡标准，定义Type A和Type B两种卡", "c": []}, {"t": "Type A由Philips制订（MIFARE芯片，现归NXP，全球约70%非接触式IC卡使用，如北京公交卡）；Type B主要用在法国", "c": []}, {"t": "FeliCa（Type F）由Sony开发，成为日本工业标准JIS X6319-4，主要用于日本市场", "c": []}, {"t": "Type A/B/F区别在RF层信号调制解调方法、传输速率及数据编码方式", "c": []}]}, {"t": "RF层之上是Mode Switch：确定对端NFC设备类型并选择合适的RF层协议通信", "c": []}, {"t": "NFC Forum规范框架（只定义P2P和R/W模式规范；CE模式NFC Forum无规范）", "c": [{"t": "RF层三规范：Analog Specifications（RF电气特性）、Digital Protocol Specification（实现不同底层协议设备互通）、NFC Activities Specification", "c": []}, {"t": "应用层规范：Connection Handover（协商蓝牙/Wi-Fi传输）、Personal Health Device Communication", "c": []}]}, {"t": "NCI（NFC Controller Interface）：定义Device Host（如手机）与NFC芯片交互的标准接口", "c": []}]}, {"t": "8.2.2 NFC R/W运行模式", "c": [{"t": "角色与组件：智能终端内NFC芯片包含NFC Controller（可与Device Host或Secure Element交互）、Antenna（天线）、CLF（非接触式前端，负责射频信号调制解调）", "c": []}, {"t": "R/W模式中只有NFC Reader能发起操作，称为Initiator/Active Device；NFC Tag靠电磁感应供电，只能作为Target（Passive Device）", "c": []}, {"t": "NFC Forum定义四种Tag类型（Type 1/2/3/4），区别在存储空间、数据传输率、底层协议；兼容的RFID Tag也可被NFC Reader读写", "c": []}, {"t": "通用数据结构：NDEF（NFC Data Exchange Format）与NFC Record", "c": [{"t": "每次交互数据封装在一个NDEF Message中，一个NDEF Message可含多个NFC Record", "c": []}, {"t": "第一个Record置MB（Message Begin）位，最后一个Record置ME（Message End）位", "c": []}, {"t": "Record分Header和Payload两部分；Header首字节含6个标志：MB、ME、CF（Chunk Flag，分片）、SR（Short Record，Payload限255字节内）、IL（ID_LENGTH标志）、TNF（Type Name Format，指明Payload类型）", "c": []}, {"t": "其他字段：Type Length、Payload Length（SR置位时仅1字节）、ID Length、Type（如URI、MIME，便于应用分派处理）、ID（配合URI类型，指向另一个Record）", "c": []}]}, {"t": "TNF七种数据类型：Empty、NFC Forum Well-Known Type（URI、TEXT等，遵循RTD规范）、MIME（RFC2046）、Absolute URI（RFC 3986）、NFC Forum External Type、Unknown、Unchanged（用于Record分片）", "c": []}, {"t": "RTD规范定义的WKT常用类型：URI Record（\"U\"）、Text Record（\"T\"）、Signature Record（\"Sig\"）、Smart Poster（\"Sp\"）、Generic Control（\"Gc\"）；External Type留给第三方", "c": []}, {"t": "URI Record实例：Payload=ID Code（1字节，如0x01代表\"http://www\"）+data（如\"nfc.com\"）；单Record消息置MB=ME=SR=1，TNF=0x01，Type=\"U\"", "c": []}, {"t": "R/W模式中应用最重要的工作是解析NDEF消息", "c": []}]}, {"t": "8.2.3 NFC P2P运行模式", "c": [{"t": "P2P模式满足NFC设备间双向交互需求；协议栈最高层为LLC层，使用协议LLCP", "c": []}, {"t": "LLC层之上协议：SNEP（Simple NDEF Exchange Protocol，直接交换NDEF消息）、Protocol Bindings（可绑定IP、OBEX）、Other Protocols（常用CHP，Connection Handover Protocol）", "c": []}, {"t": "Android 4.2的NFC P2P模块支持SNEP和CHP", "c": []}, {"t": "LLCP要点", "c": [{"t": "提供无链接（类UDP）和面向链接（类TCP，需先建立逻辑链接，处理丢包、重传、确认）两种传输服务；SNEP和CHP均使用面向链接服务", "c": []}, {"t": "数据包格式：3字节LLCP Header（DSAP/SSAP、PTYPE、Sequence）+Payload", "c": []}, {"t": "DSAP/SSAP为目标/源服务接入点，作用类似TCP/UDP端口号；因NFC近距离通信双方进入有效距离即已确定，无需MAC/IP地址", "c": []}, {"t": "SAP示例：SNEP服务端监听SSAP 0x04，客户端设置DSAP=0x04发包", "c": []}, {"t": "Link Activation（链路激活）：双方分饰Initiator/Target；Initiator发PAX（Parameter Exchange）包交换LLC配置，Target回复自己的配置，校验通过后Logical Link建立", "c": []}, {"t": "WKS告知本机哪些Well-Known服务端口有模块监听——必须在Link Activation触发前就完成监听", "c": []}, {"t": "面向链接流程：Client发CONNECT包→Server回CC（Connection Complete）→用I包（承载数据）和RR包（接收确认）传输", "c": []}, {"t": "设备分开时触发Link Deactivation；链路激活/去激活可能频繁触发", "c": []}]}, {"t": "SNEP要点", "c": [{"t": "基于面向链接传输的Well-Known Service，端口号0x04，服务名\"urn:nfc:sn:snep\"", "c": []}, {"t": "Request/Response方式：客户端发Request（如PUT/GET），服务端回Response告知处理结果", "c": []}, {"t": "消息格式：1字节Version + Request/Response字段 + 其他", "c": []}]}]}, {"t": "8.2.4 NFC CE运行模式", "c": [{"t": "CE模式使带NFC芯片的设备可充当智能卡（信用卡），应用于购票、支付、门禁卡、汽车钥匙、公交卡等", "c": []}, {"t": "交互结构：SE（Secure Element）与NFC芯片（NFCC）通过SWP（Single Wire Protocol）或S2C（NFC-WI）交互；NFCC通过HCI协议与NFC Mobile交互，SE也可通过ISO 7816与NFC Mobile交互", "c": []}, {"t": "CE模式中NFC Mobile被NFC Reader识别成智能卡；NFCC收到数据/命令后交给应用处理", "c": []}, {"t": "支付类应用=提供UI的APK+运行在SE中、安全性有保障的应用程序", "c": []}, {"t": "SE与NFC三种组合方式", "c": [{"t": "嵌入式安全芯片：出厂内置不可替换，运行小系统处理支付/安全（可参考NXP pn65芯片，其内部SmartMX模块运行Java Card OS、可装Applets）", "c": []}, {"t": "支付型SD卡（NFC-SD方案）：SD卡嵌入安全模块，相关国际标准ISO 7816，中国银联曾主推", "c": []}, {"t": "UICC即SIM卡（NFC-SIM方案）：运营商主推；国际上大多使用NFC-SIM方案，商品名\"闪付\"", "c": []}]}, {"t": "SWP细节（ETSI TS 102613）：CLF与UICC通过Gnd、Vcc、SWIO三线相连；SWIO速率212kbps~1.6Mbps，单包小于30字节", "c": []}, {"t": "UICC电源由CLF提供而非手机电池——手机电池耗尽时仍可通过外部电磁感应供电，保证支付不受影响", "c": []}, {"t": "NFC Forum没有CE相关规范", "c": []}]}, {"t": "8.2.5 NCI原理", "c": [{"t": "NCI是NFC Forum 2012年制定的规范，关注DH（Device Host，主机设备）如何控制NFCC（NFC Controller）并与之交互", "c": []}, {"t": "传输层：NFCC与DH物理连线支持SPI、I2C、UART、USB", "c": []}, {"t": "DH-NFCEE：DH中所有NFC相关应用视为执行环境（EE=Execution Environment）；NFCEE模块可集成在NFCC中或独立芯片连接（如SmartMX SE）", "c": []}, {"t": "NCI模块结构：NCI Core（负责控制消息与数据消息传递、DH初始化、重置和配置NFCC）；Transport Mapping（在NCI Core与传输层之间转换数据格式）；NCI Module（含RF Discovery、RF Interface等功能模块）", "c": []}, {"t": "工作原理：DH通过Control Message控制NFCC（Commands只能由DH发给NFCC、Responses、Notifications）；通过RF Interface与远端NFC设备交互、通过NFCEE Interface与本机NFCEE交互", "c": []}, {"t": "NCI规范140多页；其重要作用是统一Android NFC HAL层实现", "c": []}, {"t": "因NCI推出较晚，NXP在Android平台HAL层尚未采用；博通的HAL参考了NCI", "c": []}, {"t": "Linux Kernel 3.8新增NFC子系统：HAL层只需通过netlink消息与内核NFC驱动交互，芯片相关代码移入Kernel，摆脱被芯片\"绑架\"", "c": []}]}, {"t": "8.2.6 NFC相关规范", "c": [{"t": "应重点掌握：NFC三种运行模式及相关的数据类型定义、协议栈、工作方式", "c": []}, {"t": "对HAL层实现感兴趣者应研究NCI规范", "c": []}, {"t": "NFC涉及规范非常多（RFID、ISO 14443、FeliCa、NFC Forum各规范、NCI等）", "c": []}]}], "id": "s37"}, {"title": "8.3 Android中的NFC", "nodes": [{"t": "NFC系统模块运行在\"com.android.nfc\"应用进程中，代码位于packages/apps/Nfc", "c": []}, {"t": "因HAL层无统一接口，存在两套实现（Android 4.2；4.1只支持NXP）", "c": [{"t": "NXP pn系列：Nfc.apk，通过nxp目录dhimpl模块与libnfc_jni、libnfc（external/libnfc-nxp）交互", "c": []}, {"t": "博通2079x系列：NfcNci.apk，通过nci目录dhimpl模块与libnfc_nci_jni、libnfc_nci（external/libnfc-nci）交互", "c": []}, {"t": "libnfc_jni/libnfc_nci_jni使用厂商封装的私有API，可读性差；根源是Kernel中缺乏统一的用户空间与NFC驱动交互方法", "c": []}]}, {"t": "本章以Nfc.apk为主线分析：先讲NFC应用程序（客户端视角），再讲NFC系统模块", "c": []}, {"t": "8.3.1 NFC应用示例", "c": [{"t": "NFC R/W模式示例——Tag分发系统（Tag Dispatch System）", "c": [{"t": "机制：扫描到Tag后先尝试直接读取数据；NDEF消息能映射成系统支持类型（仅MIME和URI两大类）则发ACTION_NDEF_DISCOVERED；否则发ACTION_TECH_DISCOVERED（携带Tag对象）；再不行发ACTION_TAG_DISCOVERED", "c": []}, {"t": "前台分发系统（Foreground Dispatch System）：只由当前活跃Activity在启动时设置分发条件（enableForegroundDispatch），优先分发给前台Activity，退到后台需取消（disableForegroundDispatch）", "c": []}, {"t": "ACTION_NDEF_DISCOVERED：Intent携带NDEF消息；Android额外定义AAR（Android Application Record，NDEF中封装应用包名）——先按IntentFilter精确匹配，不匹配则启动AAR指定应用，未安装则从Google Play下载", "c": []}, {"t": "ACTION_TECH_DISCOVERED：应用通过\"android.nfc.tech\"包（NfcA、NfcB、NfcF、NfcV、MifareClassic、Ndef、NdefFormatable等）按Tag的getTechList创建对应TagTechnology对象（connect/transceive/close）直接操作Tag；一个Tag可同时支持多种Technology（如北京公交卡=MifareClassic+NfcA+NdefFormatable）", "c": []}, {"t": "ACTION_TAG_DISCOVERED：最后兜底，应用根据Tag的getId/getTechList自行构造处理对象", "c": []}, {"t": "客户端关键API：NfcAdapter.getDefaultAdapter获取适配器、PendingIntent、IntentFilter、techLists、onNewIntent中处理三种Action", "c": []}]}, {"t": "NFC P2P模式示例——Android Beam", "c": [{"t": "基于SNEP协议；Android还定义了类似的NPP（Ndef Push Protocol，SAP 0x10，服务名\"com.android.npp\"），系统先用SNEP，老旧设备不支持时用NPP", "c": []}, {"t": "发送端：Activity实现CreateNdefPushCompleteCallback/CreateNdefMessageCallback；调用setNdefPushMessageCallback和setOnNdefPushCompleteCallback；createNdefMessage返回NdefMessage", "c": []}, {"t": "双方靠近时都弹出\"数据发送通知框\"（SendUi），由用户触摸决定谁发送", "c": []}, {"t": "接收端：收到NDEF消息后经Tag分发系统（ACTION_NDEF_DISCOVERED）启动目标Activity，onNewIntent中setIntent、onResume中processIntent取出EXTRA_NDEF_MESSAGES", "c": []}, {"t": "Beam还支持发送file/content类型的大数据，通过Handover选择蓝牙传输", "c": []}]}, {"t": "NFC CE模式示例", "c": [{"t": "Android SDK未直接提供CE API；系统内部提供com.android.nfc_extras.jar（位于/system/framework），应用需uses-library声明并拥有android.permission.NFC权限", "c": []}, {"t": "权限双重检查：除NFC权限外还检查应用签名，签名须记录在/etc/nfcee_access.xml（如Google Wallet、Samsung Wallet的签名）", "c": []}, {"t": "关键API流程：NfcAdapterExtras.get→getEmbeddedExecutionEnvironment（EE通常即SE）→setCardEmulationRoute（ROUTE_ON_WHEN_SCREEN_ON启用CE/ROUTE_OFF关闭）→mEe.open（开启后NFC其他功能如R/W、P2P被禁止）→transceive（命令格式遵循ISO 7816-4，不同芯片/SE命令不同，是CE模式难点）→close", "c": []}]}]}, {"t": "8.3.2 NFC系统模块", "c": [{"t": "NfcService介绍", "c": [{"t": "NfcApplication.onCreate中创建核心NfcService；NfcService构造函数创建核心成员", "c": []}, {"t": "核心成员：mNfcTagService（TagService，与NFC Tag交互）、mNfcAdapter（NfcAdapterService，与其他NFC客户端交互）、mExtrasService（NfcAdapterExtrasService，与CE客户端交互）、mDeviceHost（NativeNfcManager，与芯片厂商模块交互）、HandoverManager（Connection Handover）、mNfcDispatcher（NfcDispatcher，派发Tag通知）、mP2pLinkManager（LLCP相关工作）、mSecureElement（NativeNfcSecureElement，与SE交互）、mNfceeAccessControl（读/etc/nfcee_access.xml判权限）", "c": []}, {"t": "向ServiceManager注册名为\"nfc\"的Binder服务；通过EnableDisableTask（TASK_BOOT）完成初始化", "c": []}]}, {"t": "客户端Binder接口对应关系：NfcAdapter.sService（INfcAdapter↔NfcService.NfcAdapterService）、NfcAdapter.sTagService（INfcTag↔TagService）、NfcAdapterExtras.sService（INfcAdapterExtras↔NfcAdapterExtrasService）", "c": []}, {"t": "解耦设计：DeviceHost接口族（DeviceHost、TagEndpoint、NfcDepEndpoint、LlcpSocket、LlcpServerSocket、DeviceHostListener等）将芯片无关逻辑与芯片相关逻辑分离；Native*类在nxp目录与NXP芯片绑定；DeviceHostListener由Native层向NfcService上报事件（onRemoteEndpointDiscovered发现Tag、onLlcpActivited链路激活等）", "c": []}, {"t": "P2pLinkManager包含三个Server：SnepServer（SNEP，SAP 0x04）、NdefPushServer（NPP）、HandoverServer；P2pEventManager处理用户交互（震动、提示音）；SendUi显示\"触摸即可发送\"界面", "c": []}, {"t": "enableInternal流程：启动WatchDog线程监视底层操作超时→mDeviceHost.initialize()初始化底层→P2pLinkManager.enableDisable启动SnepServer/NdefPushServer/HandoverServer→updateState(STATE_ON)→initSoundPool→applyRouting启动Polling流程", "c": []}, {"t": "SnepServer.start：创建ServerThread循环createLlcpServerSocket（SAP 0x04、服务名urn:nfc:sn:snep）→accept等待客户端→按对端MIU确定分片长度→每个连接创建一个ConnectionThread", "c": []}, {"t": "NFC Tag处理流程（notifyNdefMessageListeners）", "c": [{"t": "NativeNfcManager.notifyNdefMessageListeners（由libnfc_jni在JNI层调用）→DeviceHostListener.onRemoteEndpointDiscovered→NfcService发MSG_NDEF_TAG消息", "c": []}, {"t": "NfcServiceHandler处理：playSound→tag.findAndReadNdef()读取NDEF→startPresenceChecking（检测Tag是否在有效距离内）→dispatchTagEndpoint", "c": []}, {"t": "dispatchTagEndpoint：构造客户端Tag对象并注册→NfcDispatcher.dispatchTag", "c": []}, {"t": "NfcDispatcher.dispatchTag：构造DispatchInfo（Intent携带EXTRA_TAG、EXTRA_ID、EXTRA_NDEF_MESSAGES）→tryOverrides处理前台分发→mHandoverManager.tryHandover→tryNdef（ACTION_NDEF_DISCOVERED，含AAR精确匹配→getLaunchIntentForPackage→market://下载Intent）→tryTech（ACTION_TECH_DISCOVERED）→setTagIntent+tryStartActivity（ACTION_TAG_DISCOVERED，查PackageManagerService）", "c": []}]}, {"t": "Android Beam工作流程（notifyLlcpLinkActivation）", "c": [{"t": "notifyLlcpLinkActivation→onLlcpLinkActivated→MSG_LLCP_LINK_ACTIVATION→llcpActivated：对端为Target则先connect，再doCheckLlcp/doActivateLlcp激活链路，调P2pLinkManager.onLlcpActivated", "c": []}, {"t": "onLlcpActivated：链路状态置UP→mEventListener.onP2pInRange（提示音、SendUi截屏）→prepareMessageToSend：有回调则从CreateNdefMessageCallback取数据；无回调则取前台应用包名createDefaultNdef构造含两条Record的NDEF（URI指向Play商店+AAR包名）→onP2pSendConfirmationRequested显示确认界面", "c": []}, {"t": "发送：SendUi.onTouch→P2pEventManager.onSendConfirmed→P2pLinkManager.onP2pSendConfirmed→sendNdefMessage创建SendTask→doSnepProtocol：SnepClient.connect→snepClient.put（SNEP PUT请求）；SNEP失败则用NPP（NdefPushClient.push）重试", "c": []}, {"t": "接收：SnepServer.ConnectionThread→handleRequest（校验Version，处理REQUEST_GET/REQUEST_PUT）→Callback.doPut→onReceiveComplete→MSG_RECEIVE_COMPLETE→P2pEventManager取消SendUi→NfcService.sendMockNdefTag发MSG_MOCK_NDEF→创建模拟Tag对象（Tag.createMockTag）→复用Tag分发系统分发给目标应用", "c": []}]}, {"t": "CE模式处理", "c": [{"t": "通过NfcAdapterExtras为CE客户端提供INfcAdapterExtras实现", "c": []}, {"t": "NativeNfcManager的CE相关回调：notifyTargetDeselected（NFCIP-1的DESELECT命令）、notifyTransactionListeners（AID被选中，AID代表SE上的Applet）、notifySeFieldActivated/Deactivated、notifySeApduReceived（收到APDU命令）、notifySeEmvCardRemoval（EMV为Europay/MasterCard/Visa制定的IC卡金融支付标准）、notifySeMifareAccess（NXP芯片专用）", "c": []}, {"t": "NfcService对CE处理很简单：接收底层通知事件并转化为广播（如ACTION_EMV_CARD_REMOVAL）发给感兴趣的应用", "c": []}]}, {"t": "模块总结：芯片无关模块难度不大；芯片相关模块（com.android.nfc.dhimpl包）难度大，需结合芯片手册研究", "c": []}]}], "id": "s38"}, {"title": "8.4 NFC HAL层讨论", "nodes": [{"t": "Android在hardware目录定义nfc.h支持NFC HAL操作，但libnfc/libnfc-nci很少使用该接口，而大量使用各厂商自定义API，导致上层模块难以与底层平台/硬件解耦", "c": []}, {"t": "与Wi-Fi对比：Wi-Fi借助nl80211机制或wireless extension API实现了上下层解耦", "c": []}, {"t": "未来Linux NFC软件架构：用户空间neard（NFC Daemon）通过AF_NFC socket和Generic Netlink与内核NFC子系统通信；neard用插件支持Handover、NPP、SNEP等协议", "c": []}, {"t": "内核NFC子系统核心模块：Control Command Handler、LLCP Handler、Raw Data Handler、Core", "c": []}, {"t": "厂商只需实现NFC驱动；Core与驱动交互可用NCI规范（NFC NCI Layer）、HCI规范（NFC HCI Layer）或直接操作驱动", "c": []}], "id": "s39"}, {"title": "8.5 本章总结和参考资料说明", "nodes": [{"t": "NFC理论知识：围绕三种运行模式（R/W、P2P、CE）展开", "c": []}, {"t": "Android NFC模块结构：通过三个示例程序展示Android NFC API的使用", "c": []}, {"t": "NFC系统模块：详细介绍NfcService及重要成员，深入分析NFC Tag分发和Android Beam实现细节", "c": []}, {"t": "建议后续任务：学习NFC Forum其他规范；结合Connection Handover规范分析Android中NFC Handover实现代码", "c": []}, {"t": "参考资料：《Near Field Communication From Theory to Practice》（最详尽的NFC资料）；NFC Technology Overview（NFC Forum官方）；NDEF/RTD/LLCP/SNEP等NFC Forum官方规范；NCI Specification官方文档；Linux Kernel 3.8 NFC Subsystem文档；《Professional NFC Application Development for Android》", "c": []}], "id": "s40"}]}]}, {"name": "GPS 篇", "color": "#d97706", "chapters": [{"title": "第9章 深入理解GPS", "sections": [{"title": "9.1 概述", "nodes": [{"t": "GPS（全球定位系统）源自美国军方项目，为陆海空三大领域提供实时、全天候、全球性导航服务", "c": []}, {"t": "GPS是GNSS（全球导航卫星系统）的一种具体实现；其他GNSS包括欧盟GALILEO、俄罗斯GLONASS、中国北斗", "c": []}, {"t": "支持GPS及其他GNSS几乎是当下智能手机标配；在其之上构建了规模达数十亿美金的LBS（基于位置的服务）产业", "c": []}, {"t": "Android在多种定位技术之上抽象出LocationManager（LM，位置管理）软件架构，GPS是其中最重要的位置提供服务模块，由系统直接提供", "c": []}, {"t": "本章结构：先讲GPS基础知识（原理对其他GNSS同样适用），再讲Android位置管理软件架构与代码实现", "c": []}], "id": "s41"}, {"title": "9.2 GPS基础知识", "nodes": [{"t": "9.2.1 卫星导航基本原理", "c": [{"t": "测距原理", "c": [{"t": "卫星与接收器各有时钟（假设完美同步），距离 D = Δt × c（信号传播速度光速×传播时间）", "c": []}, {"t": "二维定位（三球交汇的二维形式）：以两颗卫星为圆心、测得距离为半径作圆，交点即为接收器可能位置", "c": []}, {"t": "二维需2颗卫星，三维定位需3颗卫星；接收器时钟精度远低于卫星钟（0.1ms偏差即30km距离误差），需引入第4颗卫星解决", "c": []}]}, {"t": "坐标系（ECI/ECEF/WGS-84）", "c": [{"t": "ECI（地心惯性坐标系）：原点为地球质心，不随地球旋转，用于描述GPS卫星位置", "c": []}, {"t": "ECEF（地心地球固连坐标系）：随地球旋转，X轴指向0经度、Y轴指向东经90度，用于描述接收器位置", "c": []}, {"t": "WGS-84：美国国防部建立的标准地球模型，将地球视为椭球体（半长轴6378137.00m、半短轴6356752.31m）", "c": []}, {"t": "笛卡尔坐标（x,y,z）与椭球坐标（φ经度,λ纬度,h高度）可相互转换；GPS高度指点到椭球面的距离", "c": []}]}, {"t": "高度计算：GPS大地高h基于椭球面（Ellipsoid），日常海拔（正高H）基于大地水准面（Geoid，重力等位面）；h与H之差为大地水准面高N", "c": []}, {"t": "时间系统（四种）", "c": [{"t": "IAT（国际原子时）：1967年以铯原子能级跃迁辐射9192631770周定义为1秒，起始1958年1月1日", "c": []}, {"t": "UTC（协调世界时）：1972年面世，以原子秒长为基础尽量接近UT，通过加入正/负闰秒使与UT差不超过0.9秒；NTP获取的就是UTC", "c": []}, {"t": "GPST（GPS时间）：使用原子秒，时间原点1980年1月6日UTC 0时；比IAT慢19秒，与UTC差为整数秒且随时间积累；格式为周数+周内秒", "c": []}, {"t": "本地时间：基于UTC分24个时区，遵循ISO 8601格式（北京时间为+08）", "c": []}]}, {"t": "卫星轨道相关知识", "c": [{"t": "开普勒三定律：第一定律——卫星绕地球做椭圆运动、地球为焦点之一；第二定律——相同时间内扫过面积相等；第三定律——半长轴立方与周期平方之比为常量", "c": []}, {"t": "轨道参数：轨道倾角、仰角、天顶角、方位角", "c": []}, {"t": "轨道分类：GEO（高约35786km，细分为GSO/IGSO/PEO）；MEO（约10000km，多为导航卫星如GPS）；LEO（约1000km）；高椭圆轨道（适合高纬度国家如俄罗斯）", "c": []}, {"t": "星历表（Ephemeris）：记录卫星详细轨道与位置参数，可算任意时刻卫星位置和速度，数据量大、传输时间长", "c": []}, {"t": "历书（Almanac）：星历的简化集，精度较低、数据量小、传输时间短", "c": []}]}]}, {"t": "9.2.2 GPS系统组成及原理", "c": [{"t": "GPS系统三段组成", "c": [{"t": "空间段（SS）：由GPS卫星组成", "c": []}, {"t": "控制段（CS）：主控站（位于美国科罗拉多）、数个监控站、地面控制站及地面天线；空间段与控制段可双向通信", "c": []}, {"t": "用户段（US）：分民用与军用用户，军用需授权获取更高精度数据；用户段只能从空间段单向获取数据", "c": []}, {"t": "GPS提供两类服务：SPS标准定位服务（面向全球民用）与PPS精密定位服务（面向美国及其盟国军事部门）", "c": []}]}, {"t": "GPS空间段", "c": [{"t": "由32颗卫星组成，分布在6个轨道面，倾角55度，轨道高度20180km，运行周期约12小时", "c": []}, {"t": "设计保证地球任意地点、任意时刻至少被4颗卫星信号覆盖（3颗用于定位，1颗用于解算时钟误差）", "c": []}]}, {"t": "GPS通信频段", "c": [{"t": "使用L频段三个频率：L1（1575.42MHz）、L2（1227.60MHz）、L5（1176.45MHz）", "c": []}, {"t": "2005年前：L1传民用心A码与军用P(Y)码，L2仅传P(Y)码", "c": []}, {"t": "IIR(M)卫星在L2增加L2C民用信号，可双频联合减少电离层影响提高精度；IIF卫星在L5发播民用信号；III型卫星将支持L1C以增强与其他GNSS的互操作性", "c": []}]}, {"t": "GPS信号组成", "c": [{"t": "载波：L1与L2", "c": []}, {"t": "测距码：精心设计的伪随机噪声PRN；C/A码——频率1.023MHz、周期1ms、码长1023、码元宽度293.05m、测距精度2~3m；P码——频率10.23MHz、周期7天、码元宽度29.3m、精度0.3m，供军事用途，加密后称Y码", "c": []}, {"t": "导航电文（D码）：携带星历、时间等定位所需信息，传输速率50bps", "c": []}, {"t": "C/A码仅在L1发送，P码在L1与L2同时发送（双频可消除电离层延时）", "c": []}]}, {"t": "GPS导航电文", "c": [{"t": "基本单位为帧（Frame/Page），一帧1500比特、传输需30秒；每帧分5个子帧（各300比特），每子帧10个字码（各30位）", "c": []}, {"t": "完整导航电文由25帧组成（37500比特），全部传完需12.5分钟", "c": []}, {"t": "子帧1~3内容为发射卫星自身的GPS时间与星历数据；子帧4~5携带各卫星的历书数据", "c": []}, {"t": "TLM（遥测字）：前8位为同步用前导码10001011", "c": []}, {"t": "HOW（转换字）：前17位为星期时间TOW，第18位警告标志、第19位反欺骗A-S标志、20~22位子帧ID", "c": []}]}, {"t": "定位计算相关知识", "c": [{"t": "定位原理：接收器钟差统一为一个参数Δt0，测得伪距 PSR = R + Δt0·c", "c": []}, {"t": "4颗卫星建立4个方程组成方程组求解（Xuser, Yuser, Zuser, Δt0）；常用泰勒级数线性化+偏微分迭代求解", "c": []}, {"t": "测速：基于多普勒效应（相对运动导致收发频率差即多普勒频移）", "c": []}, {"t": "误差来源：卫星钟误差（10ns≈3m）、卫星轨道位置（约5m）、电离层/对流层影响光速、接收器时钟不同步、多路径效应（反射信号）", "c": []}, {"t": "DOP（精度衰减因子）描述卫星空间分布对精度的影响：GDOP几何、PDOP位置、HDOP水平、VDOP垂直、TDOP时间；卫星间夹角越大误差重合区域越小、DOP越小", "c": []}, {"t": "DOP质量分级：1~3非常高、4~5高、6一般、>6差", "c": []}, {"t": "TTFF（首次定位时间）：冷启动（无有效星历/时间/位置，至少12.5分钟）；暖启动（有历书≤180天等条件，至少30秒）；热启动（星历/时间/位置有效，10秒内）", "c": []}, {"t": "减小TTFF的关键是星历/历书获取瓶颈，由此催生AGPS：通过移动网络（远快于卫星信号速率）下载星历等辅助数据", "c": []}]}, {"t": "NMEA-0183和GPX（数据格式）", "c": [{"t": "NMEA-0183：美国国家海洋电子协会制定的海用电子设备标准格式，输出ASCII文本（时间、经纬度、高度、卫星数、DOP等）；由类型化语句组成（如$GPGGA）", "c": []}, {"t": "GPX：以XML封装GPS数据的交换格式；三个核心概念——Waypoint（wpt路点/兴趣点）、Route（rte路径，有序路点列表）、Track（trk轨迹，记录实际走过并带时间戳的点）", "c": []}, {"t": "KML：基于XML的地理信息格式，由谷歌地球等使用，Android DDMS也支持", "c": []}]}, {"t": "GPS增强系统", "c": [{"t": "DGPS（差分GPS）：在位置精确已知的基站测得伪距误差并作为修正值播发；伪距差分要求距基站200km内，载波相位差分要求20km内", "c": []}, {"t": "修正数据格式：RTCM SC104与RTCA DO-229C；修正数据经卫星播发的系统即SBAS（星基增强系统）", "c": []}, {"t": "主要SBAS系统：美国WAAS、欧盟EGNOS、印度GAGAN、中国北斗、日本MSAS", "c": []}, {"t": "AGPS（辅助GPS）：全球参考网络（如IGS）收集卫星数据作为辅助数据（Aiding Data）存于服务器，手机经移动网络下载以加快定位", "c": []}, {"t": "CP与UP：Control Plane用于手机与基站间控制信息传输；User Plane传输数据包（TCP/IP、HTTP等），获取Aiding Data更具通用性和扩展性", "c": []}, {"t": "AGPS运行模式：MSB（终端基定位）——手机下载辅助数据并自行计算位置，适合连续定位；MSA（终端辅助）——手机只传伪距给位置服务器计算后返回，终端要求低但延时大", "c": []}, {"t": "Standalone（Autonomous）模式：仅用GPS卫星信号定位；无GPS信号环境可用Cell-ID（蜂窝小区ID）定位", "c": []}]}]}, {"t": "9.2.3 OMA-SUPL协议", "c": [{"t": "概述：OMA-SUPL（Secure User Plane Location）是OMA制定的一整套AGPS服务与标准，最新版本3.0（仅支持代理模式）", "c": []}, {"t": "相关协议缩写：RRLP（无线资源LCS协议）、RRC、LPP（LTE定位协议）、LPPe（LPP扩展）、OTDOA（观察到达时间差定位技术）", "c": []}, {"t": "SUPL架构", "c": [{"t": "SET（SUPL Enabled Terminal）：AGPS服务客户端，如Android手机", "c": []}, {"t": "SLP（SUPL Location Platform）：含SLC（SUPL Location Center，与SET交互处理请求）和SPC（SUPL Positioning Center，定位计算）；SET直连SPC为非代理模式，经SLC交互为代理模式", "c": []}, {"t": "SUPL Agent：需要位置信息的应用，可位于SET或SUPL Network中；定位请求只能由它发起——SET中为SET Initiated，网络中为Network Initiated", "c": []}, {"t": "Network Initiated时SLP需通过SUPL INIT通知SET参与定位，支持SIP、WAP、SMS、UDP/TCP等方式；SLC与SPC间协议为ILP", "c": []}]}, {"t": "ULP协议（User Location Protocol，描述SET与SLP交互）", "c": [{"t": "SET Initiated流程：①SET与SLP建立基于TLS的数据链接；②SET发SUPL START（携带locationId——基站Cell Info或Wi-Fi AP信息，及sETCapabilities能力）；③SLP回SUPL RESPONSE（posMethod定位方法与sLPCapabilities）；④SET发SUPL POS INIT（含初始位置）；⑤通过一个或多个SUPL POS消息计算位置（MSB/MSA方式不同）；⑥SLP发SUPL END并断开TLS链接", "c": []}, {"t": "Network Initiated流程：SUPL Agent与SLP间用MLP（Mobile Location Protocol）；SLP收到SLIR请求后向SET发SUPL INIT（无链接时经OMA Push或数据短信发送），最终经SLIA将定位结果返回Agent", "c": []}]}, {"t": "意义：本节内容可覆盖Android GPS相关模块（不含驱动及芯片底层）代码约80%的背景知识", "c": []}]}], "id": "s42"}, {"title": "9.3 Android中的位置管理", "nodes": [{"t": "9.3.1 LocationManager架构", "c": [{"t": "核心为LocationManagerService（LMS），由SystemServer创建并运行于system_process进程；客户端为LocationManager（LM），二者通过Binder交互", "c": []}, {"t": "位置提供者（Location Provider，LP）必须实现LocationProviderInterface接口，实例由LMS创建和管理", "c": []}, {"t": "Framework直接实现两个LP：PassiveProvider（被动式，自身不产生位置更新，由其他LP更新触发）与GpsLocationProvider（系统GPS提供者），均运行在system_process进程", "c": []}, {"t": "网络定位（Network Location）原理：事先获知基站/AP位置并存于服务商服务器，手机查询所连基站或AP位置并按信号强度推算位置；速度快、耗电少、室内外可用但精度低于GPS；Android原生不提供，由第三方提供（Google GMS的NetworkLocation.apk、国内的NetworkLocation_Baidu.apk）", "c": []}, {"t": "应用进程LP通过ILocationProviderProxy接口由LMS管理，需实现LocationProviderBase抽象类", "c": []}, {"t": "FusedLocationProvider（融合定位）：自身不产生位置，综合GpsLP与NetworkLP，按功耗与精度需求选择/返回最优结果", "c": []}, {"t": "Geocoder：位置信息与地址信息相互转换，由第三方应用实现IGeocodeProvider接口", "c": []}]}, {"t": "9.3.2 LocationManager应用示例", "c": [{"t": "示例（LocationActivity.java）支持\"GpsLP单独定位\"与\"GpsLP+NetworkLP同时定位\"，显示经纬度与地址", "c": []}, {"t": "使用步骤：①getSystemService(Context.LOCATION_SERVICE)获取LocationManager；②requestLocationUpdates(provider, 最小时间间隔, 最小距离变化, listener)注册回调，provider取值\"gps\"/\"network\"/\"passive\"；③位置更新时LocationListener.onLocationChanged被回调；④getLastKnownLocation获取上次保存的位置", "c": []}, {"t": "Geocoder自Android 2.3起支持；getFromLocation(纬度, 经度, N)根据位置查地址，因需网络查询通常放在AsyncTask中执行", "c": []}, {"t": "LM只提供基础定位功能；地图等高级位置功能需使用Google Play Services的Location API", "c": []}, {"t": "注意：有些应用只传定位条件（精度）而不指定LP；不带GPS的平台若指定从GPS取数据将得不到位置信息", "c": []}]}, {"t": "9.3.3 LocationManager系统模块", "c": [{"t": "LMS初始化", "c": [{"t": "systemReady创建工作线程（后台优先级），LocationWorkerHandler负责将LP位置信息返回客户端", "c": []}, {"t": "init()：创建LocationBlacklist（按Java包名禁止某些LP的黑白名单）、LocationFudger（由细精度位置经数学模糊生成粗精度位置，默认最大2000m/最小200m）、GeofenceManager（地理围栏：客户端设定圆心与半径，进入/离开时回调通知；Android 4.2 SDK未公开API），监听APK安装/卸载与用户切换，最后updateProvidersLocked", "c": []}, {"t": "loadProvidersLocked：先创建PassiveProvider（永远启用；被TwilightService用于判断白天/黑夜），再在isSupported时创建GpsLocationProvider", "c": []}, {"t": "第三方LP包名由config_locationProviderPackageNames指定（原生仅\"com.android.location.fused\"）；LMS会检查第三方LP的签名与版本（数据一致性保护）", "c": []}, {"t": "通过LocationProviderProxy.createAndBind加载NetworkLP与FusedLP，并创建GeocoderProxy", "c": []}]}, {"t": "LocationProviderProxy（LPProxy）与ServiceWatcher", "c": [{"t": "LPProxy核心为ServiceWatcher：连接并监视应用进程中的LP服务", "c": []}, {"t": "start→bindBestPackageLocked：检查目标应用签名、按action查找Service、绑定并获取ILocationProvider接口实例", "c": []}, {"t": "onServiceConnected后调用service.getProperties()获取ProviderProperties（requiresNetwork/requiresSatellite/hasMonetaryCost/supportsAltitude/powerRequirement/accuracy等属性），并按需enable、setRequest", "c": []}]}, {"t": "GpsLocationProvider（GpsLP）初始化", "c": [{"t": "static代码块调用class_init_native()初始化JNI", "c": []}, {"t": "创建NtpTrustedTime：用SNTP与NTP服务器同步获取UTC时间；服务器默认\"2.android.pool.ntp.org\"", "c": []}, {"t": "创建GpsNetInitiatedHandler处理来自HAL的NI（Network Initiated）事件；解析配置文件/etc/gps.conf：NTP_SERVER、XTRA_SERVER_1~3（LTO=Long Term Orbits，类似离线地图的星历数据，有效期约4天）、SUPL_HOST=supl.google.com、SUPL_PORT=7276、C2K_HOST/C2K_PORT", "c": []}, {"t": "listenForBroadcasts：注册三类接收——发往localhost:7275的数据短信（7275为OMA-SUPL端口，SUPL INIT可由数据短信触发）、WAP推送短信（MIME类型application/vnd.omaloc-supl-init）、ALARM_WAKEUP/ALARM_TIMEOUT与CONNECTIVITY_ACTION", "c": []}, {"t": "checkSmsSuplInit/checkWapSuplInit将短信内容经native_agps_ni_message传给GPS HAL层", "c": []}, {"t": "构造中还通过PASSIVE_PROVIDER注册NetworkLocationListener，将NetworkLP位置经native_inject_location注入GPS HAL", "c": []}]}, {"t": "GPS启动流程（Java层）", "c": [{"t": "设置界面三选项：使用无线网络（NETWORK_PROVIDER）、使用GPS卫星（GPS_PROVIDER）、使用辅助性GPS（写Settings.Global.ASSISTED_GPS_ENABLED）；均修改settings数据库location_providers_allowed字段", "c": []}, {"t": "LMS通过ContentObserver监听该字段变化→updateProvidersLocked调用LP的enable/disable，并回调客户端LocationListener的onProviderEnabled/onProviderDisabled", "c": []}, {"t": "GpsLP的handleEnable：native_init()初始化HAL模块→native_supports_xtra()判断Xtra支持→native_set_agps_server设置SUPL/C2K服务器地址与端口", "c": []}, {"t": "HAL通过JNI回调setEngineCapabilities上报引擎能力：GPS_CAPABILITY_SCHEDULING（支持工作周期内定时通知位置=连续定位）、GPS_CAPABILITY_MSB/MSA（支持MSB/MSA模式AGPS）、GPS_CAPABILITY_SINGLE_SHOT（单次定位）、GPS_CAPABILITY_ON_DEMAND_TIME", "c": []}]}, {"t": "GPS导航流程", "c": [{"t": "客户端requestLocationUpdates后GpsLP.setRequest被调；handleSetRequest记录mFixInterval，支持SCHEDULING则native_set_position_mode设为PERIODIC并传间隔，未启动则startNavigating", "c": []}, {"t": "startNavigating：默认GPS_POSITION_MODE_STANDALONE；若ASSISTED_GPS_ENABLED开启且支持MSB则设为GPS_POSITION_MODE_MS_BASED；不支持SCHEDULING且间隔≥60秒时设置超时停止导航", "c": []}, {"t": "不支持SCHEDULING的模块由两个Alarm模拟：ALARM_TIMEOUT停止导航、ALARM_WAKEUP重启导航（hibernate休眠机制）", "c": []}, {"t": "reportLocation（JNI回调）：按flags（LOCATION_HAS_LAT_LONG/ALTITUDE/SPEED/BEARING/ACCURACY）填充Location对象，经mILocationManager.reportLocation交给LMS通知客户端；首次收到经纬度时计算TTFF并回调GpsStatusListener.onFirstFix", "c": []}, {"t": "reportStatus：处理GPS_STATUS_SESSION_BEGIN/END（导航开始结束）、ENGINE_ON/OFF，更新mNavigating/mEngineOn，并发GPS_ENABLED_CHANGE广播", "c": []}, {"t": "reportSvStatus：native_read_sv_status读取卫星信息（最多32颗）——mSvs编号、mSnrs信噪比、mSvElevations高度角、mSvAzimuths方位角、mSvMasks三个32位掩码（EPHEMERIS_MASK是否取得星历、ALMANAC_MASK是否取得历书、USED_FOR_FIX_MASK是否参与上次定位）；可实现类似GpsTestPlus的卫星显示应用", "c": []}]}, {"t": "AGPS工作流程（GpsLP中）", "c": [{"t": "网络事件处理：GpsLP监听Sticky广播CONNECTIVITY_ACTION→updateNetworkState→handleUpdateNetworkState：将网络状态经native_update_network_state传给HAL；若TYPE_MOBILE_SUPL且连接状态为OPENING则获取APN、requestRouteToHost路由SUPL数据、native_agps_data_conn_open打开数据通道；网络可用时触发INJECT_NTP_TIME与DOWNLOAD_XTRA_DATA", "c": []}, {"t": "reportAGpsStatus（HAL→GpsLP）：GPS_REQUEST_AGPS_DATA_CONN时置状态OPENING，经ConnectivityManager.startUsingNetworkFeature申请移动数据；另有GPS_RELEASE_AGPS_DATA_CONN、GPS_AGPS_DATA_CONNECTED/CONN_DONE/CONN_FAILED等状态", "c": []}, {"t": "Xtra数据下载：handleDownloadXtraData用GpsXtraDownloader在后台线程下载LTO数据，成功后native_inject_xtra_data注入HAL；期间持有WakeLock", "c": []}, {"t": "总结：GpsLP监控网络事件+接收HAL的AGPS状态通知即可完成AGPS流程", "c": []}]}, {"t": "GPS JNI与HAL层", "c": [{"t": "分层架构：Java层GpsLocationProvider.java→JNI层libandroid_server.so中com_android_server_location_GpsLocationProvider.cpp→HAL层动态库gps.xxx.so（接口定义在gps.h）→内核层GPS驱动", "c": []}, {"t": "各大厂商均未公开GPS HAL实现；高通QRD的GPS HAL为C/S架构，仅把上层请求转成QMI（QC MSM Interface）消息发给服务处理", "c": []}, {"t": "JNI初始化（class_init_native）：获取Java层回调MethodId；hw_get_module(GPS_HARDWARE_MODULE_ID=\"gps\")加载HAL模块并open，取gps_device_t的get_gps_interface获得核心接口GpsInterface；再经get_extension获取扩展接口：GpsXtraInterface、AGpsInterface、GpsNiInterface、GpsDebugInterface、AGpsRilInterface", "c": []}, {"t": "Java层native函数（Java→JNI→HAL）：class_init_native、native_init、native_cleanup、native_set_position_mode（mode取STANDALONE=0/MS_BASED=1/MS_ASSISTED=2；recurrence取PERIODIC=0/SINGLE=1）、native_start/stop、native_delete_aiding_data、native_read_sv_status、native_read_nmea、native_inject_location、native_inject_time、native_inject_xtra_data、native_agps_data_conn_open/closed/failed、native_agps_ni_message、native_set_agps_server（AGPS_TYPE_SUPL=1/AGPS_TYPE_C2K=2）、native_send_ni_response、native_agps_set_ref_location_cellid（mcc移动国家码——中国460、mnc移动网络码、lac位置区码、cid基站编号）、native_agps_set_id、native_update_network_state", "c": []}, {"t": "JNI回调Java层函数（HAL→JNI→Java）：reportLocation、reportStatus、reportSvStatus、reportAGpsStatus、reportNmea、setEngineCapabilities、xtraDownloadRequest、reportNiNotification、requestRefLocation、requestSetID、requestUtcTime", "c": []}, {"t": "gps.h中HAL接口：GpsInterface（init/start/stop/cleanup/inject_time/inject_location/delete_aiding_data/set_position_mode/get_extension）；GpsXtraInterface（init/inject_xtra_data）；AGpsInterface（init/data_conn_open(apn)/data_conn_closed/data_conn_failed/set_server）；GpsNiInterface（init/respond）；AGpsRilInterface", "c": []}]}, {"t": "本章代码评价与延伸", "c": [{"t": "与WifiService/WifiP2pService/NfcService相比LMS不复杂：服务本身简单；GpsLP分层接口设计合理，使HAL层以上代码不受底层硬件影响", "c": []}, {"t": "建议进一步学习：PassiveProvider与FusedLocationProvider、LocationFudger（位置模糊）、GeofenceManager；可反编译NetworkLocation.apk研究NetworkLP与Geocoder实现", "c": []}]}]}], "id": "s43"}, {"title": "9.4 本章总结和参考资料说明", "nodes": [{"t": "内容分两大块：GPS基础知识（面广但难度不大）+ Android位置管理模块代码（难度不大）", "c": []}, {"t": "GPS是全书难度最大的一章：背景知识庞杂、历经几十年发展、知识更新快", "c": []}, {"t": "GNSS相关LBS仍在高速发展，建议读者不满足于本书内容，跟上技术发展", "c": []}, {"t": "参考资料：《GPS Essentials of Satellite Navigation Companium》（作者认为对软件工程师最全面、最通俗易懂的GPS书）；美国GPS官方网站gps.gov；官方规范Interface Specification GPS 200G/705C；《Understanding the GPS》；NMEA Reference Manual；OMA SUPL Architecture 3.0与OMA User Plane Location Protocol 3.0官方文档；Google Play Services Location API官方文档", "c": []}], "id": "s44"}, {"title": "附录", "nodes": [{"t": "附录为笔者邓凡平与吴劲良先生关于本书定位的往来邮件", "c": []}, {"t": "邓凡平来信观点", "c": [{"t": "本书定位：初学者可入门但比普通入门书难；中级学者（1~2年经验、有改bug经验但缺全局理解）适用；高级学者可当参考书但内容偏浅", "c": []}, {"t": "NFC与GPS的实际问题非常少；面试更看重对NFC芯片datasheet的了解；本书未涵盖Wi-Fi/NFC/GPS的HAL层内容", "c": []}, {"t": "Wi-Fi驱动与协议结合紧密，有驱动经验即可自行钻研；NFC HAL趋势或类似wpa_supplicant（不再有NXP/Broadcom特定内容）；GPS驱动代码一般不对外公开", "c": []}, {"t": "高通CODEAurora开源项目中的GPS HAL为C/S架构，Client端只是发命令收回复，无核心技术", "c": []}, {"t": "Wi-Fi/NFC/GPS核心都由芯片厂商完成，可发挥空间少（NFC CE模式特别是安全交付方案仍有空间）", "c": []}]}, {"t": "吴劲良回信观点", "c": [{"t": "本书对不同层次读者各有收获：引初学者入门、给中级学者分析线索、给高级学者思考机会", "c": []}, {"t": "GPS HAL各厂家不公开（Broadcom、MTK、RDA只提供so）；GPS一般用UART接口", "c": []}, {"t": "无线模组新人培养路径：功能验证测试→单独调试模组→承担实际任务；学习NL802.11、USB/SDIO/UART/I2C等接口驱动，按Wi-Fi driver→netd→wpa_supplicant→HAL→framework从内核学起；最终要在头脑中形成并能画出Android网络结构图", "c": []}, {"t": "实际工作重点在模组移植调试（涉及内核驱动调试）；调稳一款新Wi-Fi如调一个小系统，常耗时一两个月", "c": []}, {"t": "Wi-Fi/BT/NFC/GPS核心技术都在芯片厂芯片设计中，driver编写只占很小部分，但该方向技术人员需求仍大", "c": []}]}], "id": "s45"}]}]}]};
var OVERVIEW = {"title": "全书概览", "nodes": [{"t": "本书主线：先讲专业知识，再讲 Android 平台代码实现", "c": [{"t": "Wi-Fi 相关：802.11 协议、WSC（Wi-Fi Simple Configuration）、Wi-Fi P2P"}, {"t": "NFC 相关：NFC Forum 定义的一整套 NFC 协议"}, {"t": "GPS 相关：卫星导航原理、AGPS、OMA-SUPL 协议"}, {"t": "每章末附参考资料；读代码务必与专业知识结合"}]}, {"t": "Wi-Fi 篇（第2~7章）：从内核助手到应用服务的完整链路", "c": [{"t": "Netd（第2章）：网络管理 daemon，转发 Kernel UEvent、处理 Framework 命令（防火墙/NAT/带宽/SoftAP/Tether/DNS缓存）"}, {"t": "802.11 基础（第3章）：组件（BSS/ESS/AP/STA）、服务、MAC 帧、MLME、无线安全（WEP→WPA/TKIP→WPA2/CCMP、EAP/802.1X/RSNA）、wext 与 nl80211 API"}, {"t": "wpa_supplicant（第4章）：Wi-Fi 用户空间核心；初始化流程、eloop 事件循环、EAP/EAPOL 状态机、扫描-关联-四次握手"}, {"t": "WifiService（第5章）：Java 层 Wi-Fi 总入口；HSM + AsyncChannel、WifiStateMachine 状态机、加入无线网络全流程、Watchdog 与 Captive Portal"}, {"t": "WSC/WPS（第6章）：PIN/PBC 一键配网；WSC IE 与 Attribute、Registration Protocol（M1~M8）、EAP-WSC"}, {"t": "Wi-Fi P2P（第7章）：无 AP 组网；GO/GC 角色、Device/Service Discovery、GO Negotiation、Provision Discovery"}]}, {"t": "NFC 篇（第8章）：三种运行模式 + Android 实现", "c": [{"t": "R/W 读卡器模式：NDEF/NFC Record、四种 Tag 类型、Tag 分发系统"}, {"t": "P2P 模式：LLCP、SNEP、Android Beam"}, {"t": "CE 卡模拟模式：SE 安全元件、SWP/UICC、移动支付"}, {"t": "Android 实现：NfcService、Tag 分发、Beam 流程、NCI 与 HAL 讨论"}]}, {"t": "GPS 篇（第9章）：定位原理 + 位置管理架构", "c": [{"t": "卫星导航原理：三球交汇、坐标系、时间系统、星历/历书"}, {"t": "GPS 系统组成：空间段/控制段/用户段、信号与导航电文、DOP/TTFF、AGPS 与 OMA-SUPL"}, {"t": "Android 位置管理：LocationManagerService、GpsLocationProvider、JNI/HAL 接口（gps.h）"}]}, {"t": "建议阅读路径", "c": [{"t": "入门：第1章 → 第3章 → 第5章（掌握 Wi-Fi 全貌）"}, {"t": "进阶：第4章（wpa_supplicant 核心数据结构与状态机）→ 第6、7章（WSC 与 P2P）"}, {"t": "拓展：第2章（Netd 背景）→ 第8章（NFC）→ 第9章（GPS）"}]}]};
var state = {active:null, query:''};

function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}

/* ---------- sidebar ---------- */
function buildNav(){
  var nav=document.getElementById('nav');
  var tools=el('div','nav-tools');
  var input=el('input'); input.placeholder='搜索章节 / 小节…'; input.id='q';
  var bAll=el('button',null,'展开全部'); var bNone=el('button',null,'折叠全部');
  bAll.onclick=function(){setAllChapters(true)};
  bNone.onclick=function(){setAllChapters(false)};
  tools.appendChild(input);tools.appendChild(bAll);tools.appendChild(bNone);
  nav.appendChild(tools);
  var home=el('button','sec home'); home.textContent='📖 全书概览'; home.style.fontWeight='600';
  home.style.paddingLeft='16px';
  home.onclick=function(){showOverview()}; home.dataset.home='1';
  var wrap=el('div'); wrap.style.margin='2px 4px 10px'; wrap.appendChild(home); nav.appendChild(wrap);
  DATA.parts.forEach(function(part){
    var p=el('div','part');
    var ph=el('div','part-head');
    var dot=el('span','dot'); dot.style.background=part.color;
    ph.appendChild(dot); ph.appendChild(el('span',null,part.name));
    p.appendChild(ph);
    part.chapters.forEach(function(ch){
      var c=el('div','chap'); c.dataset.chap='1';
      var head=el('div','chap-head');
      var bar=el('span','accentbar'); bar.style.background=part.color;
      var chev=el('span','chev','▶');
      head.appendChild(chev); head.appendChild(bar);
      head.appendChild(el('span',null,ch.title));
      var body=el('div','chap-body');
      ch.sections.forEach(function(sec){
        var b=el('button','sec'); b.textContent=sec.title; b.dataset.sec=sec.id;
        b.style.setProperty('--sec-bg',part.color+'14');
        b.style.setProperty('--sec-fg',part.color);
        b.style.setProperty('--sec-accent',part.color);
        b.onclick=function(){showSection(part,ch,sec)};
        body.appendChild(b);
      });
      head.onclick=function(){c.classList.toggle('open')};
      c.appendChild(head); c.appendChild(body); p.appendChild(c);
    });
    nav.appendChild(p);
  });
  input.addEventListener('input',function(){
    state.query=input.value.trim().toLowerCase();
    filterNav();
  });
}
function setAllChapters(open){
  document.querySelectorAll('#nav .chap').forEach(function(c){
    c.classList.toggle('open',open);
  });
}
function filterNav(){
  var q=state.query;
  document.querySelectorAll('#nav .sec[data-sec]').forEach(function(b){
    var hit=!q||b.textContent.toLowerCase().indexOf(q)>=0;
    b.style.display=hit?'':'none';
  });
  document.querySelectorAll('#nav .chap').forEach(function(c){
    var any=[].some.call(c.querySelectorAll('.sec[data-sec]'),function(b){return b.style.display!=='none'});
    c.style.display=any?'':'none';
    if(q&&any)c.classList.add('open');
    if(!q&&!state.active)c.classList.remove('open');
  });
}

/* ---------- content ---------- */
var depthStyles=[
  {'--d0-bg':'#eef2ff','--d0-bd':'#dbe4ff','--d0-fg':'#1e3a8a','--d-bg':'#e0e7ff','--d-fg':'#4338ca'},
  null,null
];
function renderNodes(nodes, depth, accent){
  var frag=document.createDocumentFragment();
  nodes.forEach(function(n){
    var kids=n.c||[];
    var node=el('div','node depth'+Math.min(depth,2));
    node.style.setProperty('--accent',accent);
    if(depth===0){node.style.setProperty('--d0-bg',accent+'12');node.style.setProperty('--d0-bd',accent+'33');node.style.setProperty('--d0-fg',accent);}
    if(depth===1){node.style.setProperty('--d-bg',accent+'1f');node.style.setProperty('--d-fg',accent);}
    var row=el('div','row');
    if(kids.length){
      node.classList.add('has-kids');
      var caret=el('span','caret','▼');
      row.appendChild(caret);
      row.onclick=function(){node.classList.toggle('closed')};
    }else{
      node.classList.add('leaf');
      var b=el('span','bullet'); b.style.background=accent; row.appendChild(b);
    }
    var txt=el('span',null,n.t);
    if(state.hl){txt.innerHTML=hl(n.t);}
    row.appendChild(txt);
    node.appendChild(row);
    if(kids.length){
      var ch=el('div','children');
      ch.appendChild(renderNodes(kids,depth+1,accent));
      node.appendChild(ch);
    }
    frag.appendChild(node);
  });
  return frag;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hl(t){
  var q=state.hl; if(!q)return esc(t);
  var idx=0,out='',lt=esc(t),lq=esc(q);
  while(true){var i=lt.toLowerCase().indexOf(lq.toLowerCase(),idx);
    if(i<0){out+=lt.slice(idx);break;}
    out+=lt.slice(idx,i)+'<mark>'+lt.slice(i,i+lq.length)+'</mark>';idx=i+lq.length;}
  return out;
}
function crumbs(partName,color,chapTitle,secTitle){
  var c=el('div','crumbs');
  if(partName){
    var pc=el('span','pc',partName); pc.style.color=color; c.appendChild(pc);
    c.appendChild(el('span','sep','/'));
    c.appendChild(el('span',null,chapTitle));
    c.appendChild(el('span','sep','/'));
  }
  c.appendChild(el('span',null,secTitle));
  return c;
}
function flatten(){
  var list=[];
  DATA.parts.forEach(function(p){p.chapters.forEach(function(ch){ch.sections.forEach(function(s){list.push({p:p,ch:ch,s:s})})})});
  return list;
}
var FLAT=flatten();
function showSection(part,ch,sec){
  state.active=sec.id; state.hl=state.query||null;
  var m=document.getElementById('main'); m.innerHTML='';
  m.appendChild(crumbs(part.name,part.color,ch.title,sec.title));
  var h=el('h2','sec-title',sec.title);
  h.style.setProperty('--accent',part.color);
  m.appendChild(h);
  var sub=el('div','chap-sub',ch.title);
  m.appendChild(sub);
  var tip=el('div','tip','💡 点击带 ▼ 标记的节点可折叠 / 展开分支');
  m.appendChild(tip);
  var tree=el('div','tree');
  tree.appendChild(renderNodes(sec.nodes,0,part.color));
  m.appendChild(tree);
  // pager
  var idx=FLAT.findIndex(function(x){return x.s.id===sec.id});
  var pager=el('div','pager');
  var prev=el('button',null,'← 上一节');
  var next=el('button',null,'下一节 →');
  prev.disabled=idx<=0; next.disabled=idx>=FLAT.length-1;
  prev.onclick=function(){if(idx>0){var t=FLAT[idx-1];showSection(t.p,t.ch,t.s);}};
  next.onclick=function(){if(idx<FLAT.length-1){var t=FLAT[idx+1];showSection(t.p,t.ch,t.s);}};
  pager.appendChild(prev);pager.appendChild(next);m.appendChild(pager);
  setActiveNav(sec.id);
  document.getElementById('main').scrollTop=0;
  // auto open its chapter in nav
  var btn=document.querySelector('#nav .sec[data-sec="'+sec.id+'"]');
  if(btn){var chap=btn.closest('.chap');if(chap)chap.classList.add('open');}
}
function setActiveNav(id){
  document.querySelectorAll('#nav .sec').forEach(function(b){b.classList.toggle('active',b.dataset.sec===id)});
}
function showOverview(){
  state.active=null; state.hl=null;
  var m=document.getElementById('main'); m.innerHTML='';
  var hero=el('div','ov-hero');
  var h=el('h2',null,DATA.book);
  hero.appendChild(h);
  hero.appendChild(el('p',null,'作者：'+DATA.author+' ｜ 本脑图整理自全书 '+TOTAL_CH+' 章、'+TOTAL_SEC+' 个小节、约 '+TOTAL_NODES+' 个知识点，覆盖 Wi-Fi、NFC、GPS 三大模块的协议原理与 Android 源码实现。'));
  var cards=el('div','ov-cards');
  DATA.parts.forEach(function(p){
    var card=el('div','ov-card');
    var h4=el('h4'); var dot=el('span','dot'); dot.style.background=p.color;
    h4.appendChild(dot); h4.appendChild(el('span',null,p.name));
    var secs=0; p.chapters.forEach(function(c){secs+=c.sections.length});
    var names=p.chapters.map(function(c){return c.title}).join('；');
    var pe=el('p',null,'共 '+p.chapters.length+' 章 / '+secs+' 节：'+names);
    card.appendChild(h4); card.appendChild(pe); cards.appendChild(card);
  });
  hero.appendChild(cards); m.appendChild(hero);
  var tip=el('div','tip','💡 左侧目录可逐级展开；点击任意小节查看该节知识脑图');
  m.appendChild(tip);
  var tree=el('div','tree');
  tree.appendChild(renderNodes(OVERVIEW.nodes,0,'#7c3aed'));
  m.appendChild(tree);
  setActiveNav(null);
  document.getElementById('main').scrollTop=0;
}

var TOTAL_CH=0,TOTAL_SEC=0;
DATA.parts.forEach(function(p){p.chapters.forEach(function(c){TOTAL_CH++;TOTAL_SEC+=c.sections.length})});
var TOTAL_NODES=1303;
buildNav();
showOverview();
</script>
