<head>

<title>深入理解Android：卷I · Anki卡片全集</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f2ec;
    --card-bg: #fffdf8;
    --ink: #2b2a26;
    --ink-soft: #6b675e;
    --line: #e3ded2;
    --accent: #b4552d;
    --accent-soft: #f3e4d9;
    --ok: #3a7d44;
    --ok-soft: #e4efe5;
    --shadow: 0 1px 2px rgba(60,55,40,.08), 0 6px 18px rgba(60,55,40,.10);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
    background:
      radial-gradient(1200px 400px at 80% -10%, #efe7d8 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    line-height: 1.65;
    padding: 28px 20px 80px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- header ---------- */
  header.masthead { text-align: center; margin-bottom: 22px; }
  .kicker {
    display: inline-block; font-size: 12px; letter-spacing: .35em;
    color: var(--accent); border: 1px solid var(--accent);
    padding: 3px 14px 3px 17px; border-radius: 999px; margin-bottom: 14px;
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: .06em; }
  h1 small { display:block; font-size: 14px; font-weight: 400; color: var(--ink-soft); letter-spacing:.15em; margin-top: 8px; }
  .rule { width: 64px; height: 3px; background: var(--accent); margin: 18px auto 0; border-radius: 2px; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(244,242,236,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    margin: 0 -20px; padding: 12px 20px 10px;
  }
  .toolbar-inner { max-width: 1180px; margin: 0 auto; }
  .tb-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #search {
    flex: 1 1 240px; min-width: 200px;
    font: 15px "Noto Sans SC","Microsoft YaHei",sans-serif;
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card-bg); color: var(--ink); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .btn {
    font: 13px "Noto Sans SC","Microsoft YaHei",sans-serif;
    padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card-bg); color: var(--ink); cursor: pointer; white-space: nowrap;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .chip {
    font: 12.5px "Noto Sans SC","Microsoft YaHei",sans-serif;
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card-bg); cursor: pointer; color: var(--ink-soft); transition: all .15s;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip b { font-weight: 600; margin-left: 4px; opacity: .65; }
  .stats {
    font: 12.5px "Noto Sans SC","Microsoft YaHei",sans-serif;
    color: var(--ink-soft); margin-top: 9px; display: flex; gap: 16px; flex-wrap: wrap; align-items:center;
  }
  .progress { flex: 1 1 120px; min-width: 100px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

  /* ---------- grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin-top: 24px;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  /* ---------- flip card ---------- */
  .card { perspective: 1600px; height: 340px; }
  .card.hidden { display: none; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .55s cubic-bezier(.4,.1,.2,1);
    cursor: pointer;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); }
  .face-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px dashed var(--line); flex: 0 0 auto;
    font-family: "Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  .tag {
    font-size: 11px; color: var(--accent); background: var(--accent-soft);
    padding: 2px 10px; border-radius: 999px; letter-spacing: .04em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .num { font-size: 11px; color: var(--ink-soft); flex: 0 0 auto; }
  .face-body {
    flex: 1 1 auto; overflow-y: auto; padding: 16px 18px;
    font-size: 15px; display: flex; flex-direction: column; justify-content: flex-start;
  }
  .face-body::-webkit-scrollbar { width: 6px; }
  .face-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .q-mark {
    font-family: Georgia, serif; font-size: 34px; color: var(--accent);
    line-height: 1; margin-bottom: 6px; opacity: .8;
  }
  .q-text { font-size: 16.5px; font-weight: 600; line-height: 1.7; }
  .q-hint {
    flex: 0 0 auto; padding: 8px 16px 12px; text-align: center;
    font: 11.5px "Noto Sans SC","Microsoft YaHei",sans-serif; color: var(--ink-soft);
    border-top: 1px dashed var(--line); letter-spacing: .1em; user-select: none;
  }
  .a-text { font-size: 14px; white-space: pre-line; }
  .a-text .kw { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 13px; color: var(--accent); }
  .face-foot {
    flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px 7px 16px; border-top: 1px dashed var(--line);
  }
  .sec-label { font: 11.5px "Noto Sans SC","Microsoft YaHei",sans-serif; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .known-btn {
    flex: 0 0 auto; font: 12px "Noto Sans SC","Microsoft YaHei",sans-serif;
    border: 1px solid var(--line); background: transparent; border-radius: 999px;
    padding: 3px 12px; cursor: pointer; color: var(--ink-soft); transition: all .15s;
  }
  .known-btn:hover { border-color: var(--ok); color: var(--ok); }
  .card.known .known-btn { background: var(--ok); border-color: var(--ok); color: #fff; }
  .card.known .face-head .tag { color: var(--ok); background: var(--ok-soft); }

  .empty {
    grid-column: 1 / -1; text-align: center; color: var(--ink-soft);
    padding: 60px 0; font-size: 15px; letter-spacing: .1em;
  }
  footer { text-align: center; margin-top: 46px; color: var(--ink-soft);
    font: 12.5px "Noto Sans SC","Microsoft YaHei",sans-serif; letter-spacing: .08em; }
</style>

<script>
const CARDS = [{"ch":"第1章 · 阅读前的准备工作","sec":"1.1.1 Android系统架构","q":"Android系统从下往上分为哪四层？各层的主要内容及所用语言是什么？","a":"从下往上依次为：\n1) Linux内核层：包含Linux内核和驱动模块（USB驱动、Camera驱动、蓝牙驱动等），Android2.2（Froyo）基于Linux内核2.6版本；\n2) Libraries层：提供动态库（共享库）、Android运行时库、Dalvik虚拟机等，大部分用C/C++编写，可视为Native层；\n3) Framework层：大部分用Java编写，是Android平台Java世界的基石；\n4) Applications层：与用户直接交互的应用程序，用Java开发。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.1.1 Android系统架构","q":"Java世界和Native世界是如何交互的？","a":"Java虽具有平台无关性，但Java与具体平台之间的隔离由JNI层实现，Java通过JNI层调用Linux OS的系统调用完成对应功能（如创建文件或Socket）。此外还有一个核心的Native世界为系统高效平稳运行提供支持。一般而言，Java世界经由JNI层通过IPC方式与Native世界交互，Android平台上最神秘的IPC方式是Binder，此外Socket也是常用的IPC方式。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.1.2 本书的架构","q":"除Kernel外，本书分析的模块覆盖了哪三层？各层分别包括哪些模块？","a":"1) Native层：init、Audio系统（AudioTrack、AudioFlinger、AudioPolicyService）、Surface系统（Surface、SurfaceFlinger）、常用类（RefBase、sp、wp等）、Vold和Rild；\n2) Java Framework层：zygote、System_server以及Java常用类（Handler、Looper等）；\n3) Java Application层：MediaProvider和Phone。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.1 下载源码","q":"Android源码用什么工具管理？如何通过repo脚本下载Froyo源码？","a":"Android源码采用Git作为版本管理工具（由Linus Torvalds用纯C开发），Google为方便下载提供了repo脚本。步骤：\n1) apt-get install git-core curl；\n2) 建立工作目录并进入；\n3) curl下载repo脚本并chmod a+x repo；\n4) ./repo init -u git://Android.git.kernel.org/platform/manifest.git -b froyo 初始化git库；\n5) ./repo sync 下载源码，大小约2GB。\n注意：Kernel代码必须单独用git clone下载。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.2 编译源码","q":"Froyo编译对JDK有何要求？编译前的准备步骤是什么？","a":"Froyo的编译依赖JDK 1.5。需下载jdk-1_5_0_22-linux-i586.bin并执行（功能是解压），然后在~/.bashrc末尾设置JAVA_HOME、JRE_HOME、CLASSPATH、PATH等环境变量，重新登录系统使JDK资源能被正确找到。之后进入源码目录：先执行.build/envsetup.sh设置Android编译环境，再执行choosecombo命令选择编译目标（目标硬件平台、eng还是user等）。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.2 编译源码","q":"make、mmm、mm三个编译命令有何区别？各自适用什么场景？","a":"make（如make MediaProvider）：编译单个模块且会把它依赖的其他模块也一起编译；缺点是需搜索整个源码定位Android.mk并判断依赖模块是否修改，整体时间较长。\nmmm（如mmm packages/providers/MediaProvider）：编译指定目录下的目标模块，不编译依赖模块，速度快，但初次编译常因依赖模块未编译而报错。\nmm：先cd进入模块目录后执行，同样只编译当前目录模块。\n建议：知道模块名用make模块名（初次编译必须用make）；只知道目录用mmm或mm。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.2 编译源码","q":"如何强制重新编译所有目标文件？编译结果如何部署到手机上测试？","a":"一般编译采用增量编译（只编译发生变化的目标文件），若需重新编译所有目标文件可使用make命令的-B选项，如make -B模块名、mm -B、mmm -B。mm和mmm内部也是调用make命令的，-B选项将强制编译所有目标文件。\n部署测试：如make framework会编译出framework-res.apk和framework.jar，结果在out/target/product/generic/system/framework下，用adb push到手机的system/framework目录替换旧文件；测试前需先杀掉所有使用该模块的进程，进程重启后会重新加载模块（系统服务被杀后由init控制自动重启）。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.3.1 Source Insight介绍","q":"使用Source Insight分析Android源码有哪些实用技巧？","a":"1) 工作减负：不要把所有Android源码都加入工程，只把当前分析的源码目录加进去（如先只加framework/base），分析完后通过Project→Add and Remove Project Files动态删除无须再分析的目录，避免运行速度过慢；\n2) 调节字体：Options→Document options→Screen Fonts选择大字体；\n3) 快速定位文件：通过Project→Rebuild Project解析源码后，可用输入框只输入源码文件名（如app_process）快速定位其所在位置。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.3.3 Busybox的使用","q":"为什么Android手机上需要安装Busybox？如何安装？","a":"Busybox号称Linux平台上的瑞士军刀，提供grep、find等常用工具，但Android系统去掉了标准Linux中的大多数工具，导致调试和研究系统时十分不便，所以需安装Busybox。\n安装：从busybox官网下载对应平台已编译好的Busybox（如HTC G7的CPU支持armv7l，可下载busybox-armv6l），adb push到/system/xbin目录，cd进入该目录后chmod 755 busybox，再执行busybox --install安装即可。注意：给手机安装Busybox须有root权限。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.2 编译源码","q":"ARM v7指令集是什么？哪些CPU支持它？","a":"arm v7表示的是ARM指令集为v7，目前ARM Cortex-A8/A9系列的CPU支持该指令集。下载Busybox时需根据手机的CPU架构选择对应的编译版本。"},{"ch":"第2章 · 深入理解JNI","sec":"2.1 JNI概述","q":"什么是JNI？它能做到哪两点？","a":"JNI是Java Native Interface的缩写，中文译为Java本地调用。通过这种技术可以做到：\n1) Java程序中的函数可以调用Native语言写的函数（Native一般指C/C++编写的函数）；\n2) Native程序中的函数可以调用Java层的函数，即在C/C++程序中可以调用Java的函数。"},{"ch":"第2章 · 深入理解JNI","sec":"2.1 JNI概述","q":"平台无关的Java为什么需要JNI技术？","a":"1) 承载Java世界的虚拟机是用Native语言写的，运行在具体平台上，本身无法平台无关。有了JNI技术后可对Java层屏蔽不同操作系统平台之间的差异（如打开文件，Windows用OpenFile函数，Linux用open函数），从而实现Java本身的平台无关特性；\n2) Java诞生前已有大量Native语言写的程序遍布软件世界，可通过JNI直接复用它们，避免重复制造轮子；另外在要求效率和速度的场合也需要Native语言参与。"},{"ch":"第2章 · 深入理解JNI","sec":"2.2 学习JNI的实例：MediaScanner","q":"MediaScanner实例中Java层、JNI层、Native层分别对应什么？JNI库的命名有什么惯例？","a":"Java世界对应MediaScanner类（部分函数由Native层实现）；JNI层对应libmedia_jni.so；Native层对应libmedia.so（完成实际功能）。MediaScanner通过JNI库libmedia_jni.so和Native层的libmedia.so交互。\n命名惯例：下划线前的media是Native层库的名字（libmedia库），下划线后的jni表示它是一个JNI库；JNI库的名字可以随便取，但Android平台基本采用lib模块名_jni.so的命名方式。JNI层必须实现为动态库形式，这样Java虚拟机才能加载它并调用其函数。"},{"ch":"第2章 · 深入理解JNI","sec":"2.2 学习JNI的实例：MediaScanner","q":"MediaScanner的功能是什么？","a":"MediaScanner是Android平台多媒体系统的重要组成部分，其功能是扫描媒体文件，得到诸如歌曲时长、歌曲作者等媒体信息，并将它们存入到媒体数据库中，供其他应用程序使用。"},{"ch":"第2章 · 深入理解JNI","sec":"2.3.1 加载JNI库","q":"Java层应该在什么时候、什么地方加载JNI库？","a":"原则上是：在调用native函数前，任何时候、任何地方加载都可以。通行的做法是在类的static语句（静态初始化块）中加载，调用System.loadLibrary方法即可。System.loadLibrary的参数是动态库的名字（如media_jni），系统会自动根据不同平台拓展成真实的动态库文件名：Linux上拓展为libmedia_jni.so，Windows平台上拓展为media_jni.dll。"},{"ch":"第2章 · 深入理解JNI","sec":"2.3.2 Java的native函数和总结","q":"Java程序员要使用JNI技术，只需完成哪两项工作？","a":"1) 加载对应的JNI库（在static语句中调用System.loadLibrary）；\n2) 声明由关键字native修饰的函数（native为Java的关键字，表示该函数将由JNI层完成）。\n对Java程序员来说使用JNI很容易，但JNI层要完成的任务没这么轻松。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"JNI函数注册的含义是什么？静态注册的原理是什么？","a":"注册就是将Java层的native函数和JNI层对应的实现函数关联起来，有了这种关联，调用Java层的native函数时就能顺利转到JNI层对应的函数执行。\n静态注册根据函数名来找对应的JNI函数：Java函数全路径名中的.被换成_（如android.media.MediaScanner.native_init对应Java_android_media_MediaScanner_native_1init；Java函数名中本来就有的_则转换成_1）。当Java层调用native函数时，虚拟机会从对应JNI库中按名字寻找JNI层函数，找到后建立关联（保存JNI层函数的函数指针），以后再调用时直接使用这个函数指针。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"静态注册方法如何使用javah完成？具体流程是什么？","a":"1) 先编写Java代码，编译生成.class文件；\n2) 使用Java的工具程序javah，如javah -o output packagename.classname，它会生成一个叫output.h的JNI层头文件，头文件名字一般采用packagename_class.h样式（如android_media_MediaScanner.h）；\n3) 头文件中已声明了对应的JNI层函数（带JNIEXPORT和JNICALL），只需实现里面的函数即可。\n生成的头文件必须包含jni.h，并使用extern \"C\"包裹（C++编译时）。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"静态注册JNI函数方法有哪些弊端？","a":"1) 需要编译所有声明了native函数的Java类，每个所生成的class文件都得用javah生成一个头文件；\n2) javah生成的JNI层函数名特别长，书写起来很不方便；\n3) 初次调用native函数时要根据函数名字搜索对应的JNI层函数来建立关联关系，会影响运行效率。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"JNINativeMethod结构体的定义及各成员含义是什么？","a":"typedef struct {\n  const char* name;    //Java中native函数的名字，不用携带包的路径，如native_init\n  const char* signature; //Java函数的签名信息，用字符串表示，是参数类型和返回值类型的组合\n  void* fnPtr;         //JNI层对应函数的函数指针，注意它是void*类型\n} JNINativeMethod;\n用一个JNINativeMethod数组（如gMethods）记录Java native函数和JNI函数的一一对应关系。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"动态注册JNI函数的完整调用链涉及哪些函数？","a":"在JNI层代码中定义JNINativeMethod数组gMethods后，调用register_android_media_MediaScanner(env)注册，它调用AndroidRuntime的registerNativeMethods函数（第二个参数指明是Java中的哪个类，如android/media/MediaScanner），后者又调用Android平台提供的帮助函数jniRegisterNativeMethods（位于JNIHelp.c）。jniRegisterNativeMethods先用FindClass找到jclass，然后实际调用JNIEnv的RegisterNatives函数完成注册。核心只有两步：\njclass clazz=(*env)->FindClass(env,className);\n(*env)->RegisterNatives(env,clazz,gMethods,numMethods);"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"动态注册的函数在什么时候、什么地方被调用？","a":"当Java层通过System.loadLibrary加载完JNI动态库后，紧接着会查找该库中一个叫JNI_OnLoad的函数，如果有就调用它，动态注册的工作就是在这里完成的。\n所以想使用动态注册方法就必须实现JNI_OnLoad函数，只有在这个函数中才有机会完成动态注册。静态注册则没有这个要求，但建议也实现JNI_OnLoad，因为有一些初始化工作可以在这里做。libmedia_jni.so的JNI_OnLoad函数放在android_media_MediaPlayer.cpp中。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"JNI_OnLoad函数的参数、内部流程和返回值要求是什么？","a":"函数原型：jint JNI_OnLoad(JavaVM* vm, void* reserved)，第一个参数类型为JavaVM，它是虚拟机在JNI层的代表，每个Java进程只有一个这样的JavaVM。\n内部流程：1) 调用vm->GetEnv((void**)&env, JNI_VERSION_1_4)取得JNIEnv，失败则goto bail；2) 调用register_android_media_MediaScanner(env)等完成动态注册；3) 必须返回JNI_VERSION_1_4这个值，否则会报错。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"JNI层代码中一般要包含什么头文件？Android提供了什么帮助头文件？","a":"JNI层代码中一般要包含jni.h这个头文件。Android源码中提供了一个帮助头文件JNIHelp.h，它内部其实就包含了jni.h，所以在自己的代码中直接包含JNIHelp.h即可。JNIHelp.c中还提供了jniRegisterNativeMethods等方便JNI使用的帮助函数。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.2 数据类型转换","q":"Java基本数据类型转换到JNI层时要注意什么？","a":"基本数据类型的转换很简单，如jint对应int、jboolean对应boolean等。务必注意转换成Native类型后对应数据类型的字长，例如jchar在Native语言中是16位，占两个字节，这和普通的char占一个字节的情况完全不一样。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.2 数据类型转换","q":"Java引用数据类型在JNI层如何表示？","a":"除了Java中基本数据类型的数组、Class、String和Throwable外，其余所有Java对象的数据类型在JNI中都用jobject表示。例如processFile(String path, String mimeType, MediaScannerClient client)对应的JNI函数中，String类型对应jstring，MediaScannerClient类型对应jobject。jobject就好比Native层的void*类型，对码农来说是完全透明的，操作它须依靠JNIEnv提供的函数。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.2 数据类型转换","q":"为什么Java层processFile只有三个参数，JNI层对应函数却有五个参数？","a":"JNI层函数固定多了前两个参数：第一个参数JNIEnv，是指向JNI环境的指针；第二个参数jobject代表Java层的MediaScanner对象，表示是在哪个MediaScanner对象上调用的processFile。如果Java层的函数是static函数，那么第二个参数将是jclass，表示是在调用哪个Java Class的静态函数。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.3 JNIEnv介绍","q":"JNIEnv是什么？通过它能做什么？","a":"JNIEnv是一个与线程相关的代表JNI环境的结构体，它实际上提供了一些JNI系统函数，通过这些函数可以做到：调用Java的函数、操作jobject对象等很多事情。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.3 JNIEnv介绍","q":"为什么JNIEnv不能跨线程使用？后台线程如何获得JNIEnv？","a":"JNIEnv是线程相关的变量：线程A有一个JNIEnv，线程B有一个JNIEnv，不能在线程B中使用线程A的JNIEnv结构体。native函数由虚拟机传入的JNIEnv使用当然没问题，但后台线程收到网络消息后需要主动回调Java层函数时，JNIEnv从何而来是问题。\n解决办法：使用JavaVM（全进程只有一个，任何地方都可以保存和使用）。调用JavaVM的AttachCurrentThread函数可得到这个线程的JNIEnv结构体，从而在后台线程中回调Java函数；在后台线程退出前，需调用JavaVM的DetachCurrentThread函数来释放对应的资源。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.3 JNIEnv介绍","q":"JavaVM和JNIEnv的关系是什么？","a":"JavaVM是虚拟机在JNI层的代表，不论进程中有多少个线程，JavaVM是独此一份的，所以可以保存并在任何地方使用都没有问题（如JNI_OnLoad的第一个参数）。JNIEnv是与线程相关的JNI环境代表，每个线程一个。二者关系：调用JavaVM的AttachCurrentThread函数可得到本线程的JNIEnv；线程退出前调用DetachCurrentThread释放对应资源。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.4 通过JNIEnv操作jobject","q":"jfieldID和jmethodID是什么？如何获取？","a":"在JNI规则中，用jfieldID和jmethodID来表示Java类的成员变量和成员函数（它们都是类的属性）。可通过JNIEnv的两个函数得到：\njfieldID GetFieldID(jclass clazz, const char* name, const char* sig);\njmethodID GetMethodID(jclass clazz, const char* name, const char* sig);\n其中jclass代表Java类（可用FindClass得到），name为成员名，sig为签名信息。由于二者都是类的信息，所以第一个参数都是jclass。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.4 通过JNIEnv操作jobject","q":"为什么要保存jmethodID/jfieldID而不是每次查询？","a":"如果每次操作jobject前都去查询jmethodID或jfieldID，将会影响程序运行的效率。所以在初始化的时候可以取出这些ID并保存起来（如MyMediaScannerClient构造函数中取出scanFile和handleStringTag的jmethodID保存为成员变量）以供后续使用。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.4 通过JNIEnv操作jobject","q":"JNI层如何调用Java对象的成员函数？","a":"通过JNIEnv的Call<type>Method系列函数，形式为：NativeType Call<type>Method(JNIEnv* env, jobject obj, jmethodID methodID, ...)。其中type对应Java函数的返回值类型，如CallIntMethod、CallVoidMethod等。第一个参数是代表Java对象的jobject，第二个参数是函数的jmethodID，后面是Java中该函数的参数。\n如果想调用Java中的static函数，则用CallStatic<type>Method系列函数。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.4 通过JNIEnv操作jobject","q":"JNI层如何读写Java对象的成员变量？","a":"获得fieldID后：\n1) 调用Get<type>Field系列函数获取jobject对应的成员变量的值：NativeType Get<type>Field(JNIEnv* env, jobject obj, jfieldID fieldID)；\n2) 调用Set<type>Field系列函数设置成员变量的值：void Set<type>Field(JNIEnv* env, jobject obj, jfieldID fieldID, NativeType value)。\n常用的有GetObjectField/SetObjectField、GetBooleanField/SetBooleanField、GetByteField、GetCharField、GetShortField、GetIntField/SetIntField、GetLongField、GetFloatField、GetDoubleField等。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.5 jstring介绍","q":"jstring是什么？如何从本地字符串创建jstring？","a":"Java中的String是引用类型，由于使用频率较高，JNI规范单独创建了jstring类型来表示它，可以把jstring看成Java中String对象在JNI层的代表。但jstring没有提供成员函数，操作它须依靠JNIEnv。\n创建：1) NewString(JNIEnv* env, const jchar* unicodeChars, jsize len)可从Native的字符串得到一个jstring对象，由于Java String存储的是Unicode字符串，其参数必须是Unicode字符串；2) NewStringUTF将根据Native的一个UTF-8字符串得到一个jstring对象，实际工作中这个函数用得最多。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.5 jstring介绍","q":"如何将Java String转换为本地字符串？使用后必须注意什么？","a":"JNIEnv提供了GetStringChars函数和GetStringUTFChars函数将Java String对象转换成本地字符串：GetStringChars得到一个Unicode字符串，GetStringUTFChars得到一个UTF-8字符串。\n注意：调用这些函数后，在做完相关工作后都必须调用ReleaseStringChars函数或ReleaseStringUTFChars函数来对应地释放资源，否则会导致JVM内存泄露。这一点和jstring的内部实现有关。如processFile中GetStringUTFChars得到pathStr后，用完必须调用env->ReleaseStringUTFChars(path, pathStr)。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.6 JNI类型签名介绍","q":"JNI函数签名的作用是什么？其格式如何？","a":"因为Java支持函数重载，可以定义同名但不同参数的函数，仅仅根据函数名没法找到具体函数。所以JNI技术中将参数类型和返回值类型的组合作为函数的签名信息，有了签名信息和函数名，就能顺利找到Java中的函数。\n格式：(参数1类型标示 参数2类型标示 ... 参数n类型标示)返回值类型标示。括号内是参数类型标识，最右边是返回值类型标识（如void对应V）。签名写错一个标点就会导致注册失败，建议定义字符串宏。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.6 JNI类型签名介绍","q":"JNI签名中引用类型、数组类型的表示规则是什么？举例说明。","a":"当参数类型是引用类型时，格式是L包名;，其中包名中的.换成/。如Ljava/lang/String;表示一个Java String类型，Landroid/media/MediaScannerClient;表示自定义类。注意：引用类型（除基本类型的数组外）的标识最后都有一个分号；如果Java类型是数组，则标识中会有一个[，如processFile的签名(Ljava/lang/String;Ljava/lang/String;Landroid/media/MediaScannerClient;)V，末尾V表示返回值为void。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.6 JNI类型签名介绍","q":"javap工具如何帮助生成JNI签名信息？","a":"Java提供一个叫javap的工具能帮助生成函数或变量的签名信息，用法：javap -s -p xxx，其中xxx为编译后的class文件，s表示输出内部数据类型的签名信息，p表示打印所有函数和成员的签名信息（默认只会打印public成员和函数的签名信息）。有了javap，就不用死记硬背类型标示了。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.7 垃圾回收","q":"在JNI层保存Java层传入的jobject（如save_thiz=thiz）为什么有风险？","a":"和save_thiz对应的Java层中的MediaScanner很有可能已经被垃圾回收了，也就是说save_thiz保存的这个jobject可能是一个野指针，使用它后果会很严重。原因是在JNI层使用save_thiz=thiz这样的赋值语句是不会增加jobject的引用计数的，引用计数没有增加，thiz就有可能被回收。解决办法是使用Global Reference来保存想长期持有的Java对象。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.7 垃圾回收","q":"JNI提供的三种引用类型及其特点是什么？","a":"1) Local Reference（本地引用）：JNI层函数中使用的非全局引用对象都是Local Reference，包括函数调用时传入的jobject和在JNI层函数中创建的jobject。最大特点是一旦JNI层函数返回，这些jobject就可能被垃圾回收；\n2) Global Reference（全局引用）：这种对象如不主动释放，永远不会被垃圾回收；\n3) Weak Global Reference（弱全局引用）：一种特殊的Global Reference，在运行过程中可能会被垃圾回收，所以使用它之前需要调用JNIEnv的IsSameObject判断它是否被回收了。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.7 垃圾回收","q":"如何创建和释放Global Reference？典型使用场景是什么？","a":"调用JNIEnv的NewGlobalRef创建一个Global Reference（如MyMediaScannerClient构造函数中mClient(env->NewGlobalRef(client))，这样mClient就不用担心被回收了）；使用完后必须调用DeleteGlobalRef释放（如析构函数中mEnv->DeleteGlobalRef(mClient)）。\n典型场景：每当JNI层想要保存Java层中的某个对象时，就可以使用Global Reference，使用完后记住释放它即可。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.7 垃圾回收","q":"Local Reference为什么有时需要显式调用DeleteLocalRef？","a":"Local Reference在JNI层函数返回后就会被回收，但如果不及时释放，在高频调用场景下会耗尽内存。例如在循环中每次调用mEnv->NewStringUTF(path)创建jstring，若不调用DeleteLocalRef，循环100次就会创建100个jstring，内存耗费非常可观。而如果调用DeleteLocalRef，pathStr会立即被回收。所以没有及时回收Local Reference或许是进程占用内存过多的一个原因，务必注意。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.8 JNI中的异常处理","q":"JNI中的异常与C++、Java异常有什么不同？产生异常后能做什么？","a":"如果调用JNIEnv的某些函数出错了则会产生一个异常，但这个异常不会中断本地函数的执行，直到从JNI层返回到Java层后，虚拟机才会抛出这个异常。虽然异常不会中断本地函数的运行，但一旦产生异常后，就只能做一些资源清理工作了（例如释放全局引用，或者ReleaseStringChars）；如果这时调用除这些之外的其他JNIEnv函数，则会导致程序死掉。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.8 JNI中的异常处理","q":"JNIEnv提供了哪些异常处理函数？如何使用？","a":"1) ExceptionOccured函数：用来判断是否发生异常；\n2) ExceptionClear函数：用来清理当前JNI层中发生的异常；\n3) ThrowNew函数：用来向Java层抛出异常。\n另外编写代码时应检查函数返回值，如NewStringUTF调用失败返回NULL后直接return false，不能再干别的事情。异常处理是JNI层代码必须关注的事情。"},{"ch":"第2章 · 深入理解JNI","sec":"2.5 本章小结","q":"本章介绍了JNI技术的哪几个重要方面？深入学习JNI的权威资料是什么？","a":"1) JNI函数的注册方法（静态注册和动态注册）；\n2) Java和JNI层数据类型的转换；\n3) JNIEnv和jstring的使用方法，以及JNI中的类型签名；\n4) 垃圾回收在JNI层中的使用（Local/Global Reference），以及异常处理方面的知识。\n建议再认真阅读JDK文档中的《Java Native Interface Specification》，它完整和细致地阐述了JNI技术的各个方面，堪称深入学习JNI的权威指南。"},{"ch":"第3章 · 深入理解init","sec":"3.1 概述","q":"init进程是什么？它有哪些重要职责？","a":"init是一个进程，确切地说是Linux系统中用户空间的第一个进程。由于Android基于Linux内核，init也是Android系统中用户空间的第一个进程，它的进程号是1。\n职责：1) 负责创建系统中的几个关键进程，尤其是zygote——Java世界的开创者；2) Android系统有很多属性，init提供了一个property service（属性服务）来管理它们。本章重点分析init如何创建zygote以及属性服务如何工作。"},{"ch":"第3章 · 深入理解init","sec":"3.2 init分析","q":"init的main函数开头做了哪些与信号和设备相关的准备工作？","a":"1) 设置子进程退出的信号处理函数sigchld_handler（act.sa_flags=SA_NOCLDSTOP），通过sigaction(SIGCHLD, &act, 0)注册；\n2) 创建一些文件夹并挂载设备：mkdir /dev/socket，mount devpts到/dev/pts、mount proc到/proc、mount sysfs到/sys；\n3) open_devnull_stdio()：重定向标准输入/输出/错误输出到/dev/_null_；\n4) log_init()：设置init的日志输出设备为/dev/__kmsg__，该文件打开后会立即被unlink，这样其他进程就无法打开这个文件读取日志信息了。"},{"ch":"第3章 · 深入理解init","sec":"3.2 init分析","q":"init解析哪两个配置文件？动作执行分为哪四个阶段？","a":"init先调用parse_config_file(\"/init.rc\")解析系统配置文件init.rc；再通过get_hardware_name()（读取/proc/cpuinfo得到机器的Hardware名，如HTC G7为bravo），然后parse_config_file(\"/init.<hardware>.rc\")解析与硬件平台相关的配置文件（如init.bravo.rc）。\ninit将动作执行的时间划分为四个阶段：early-init、init、early-boot、boot。由于有些动作必须在其他动作完成后才能执行，所以有了先后之分，哪些动作属于哪个阶段由配置文件决定。"},{"ch":"第3章 · 深入理解init","sec":"3.2 init分析","q":"init如何执行各阶段的Action？","a":"通过action_for_each_trigger(\"阶段名\", action_add_queue_tail)将对应section的command加入到执行队列，再调用drain_action_queue()执行队列里的命令。main函数中依次执行early-init、init阶段动作后启动属性服务、创建socketpair，最后执行early-boot和boot阶段动作。创建zygote的工作就是在某个阶段的动作中完成的（如boot阶段的class_start default）。"},{"ch":"第3章 · 深入理解init","sec":"3.2 init分析","q":"init的开机画面是如何设置的？","a":"load_565rle_image(INIT_IMAGE_FILE)加载INIT_IMAGE_FILE（定义为/initlogo.rle）文件作为系统的开机画面。注意它不是开机动画控制程序bootanimation加载的开机动画文件。如果加载initlogo.rle文件失败（可能是没有这个文件），则会打开/dev/ty0设备并输出ANDROID的字样作为开机画面，在模拟器上看到的开机画面就是它。"},{"ch":"第3章 · 深入理解init","sec":"3.2 init分析","q":"init的无限循环中通过poll监听哪几类事件？","a":"init进入一个for(;;)无限循环，用poll监听来自四个方面的事情（ufds数组）：\n1) ufds[0].fd=device_fd：监听来自内核的Uevent事件（device_init创建利用Uevent与Linux内核交互的socket），到达后调用handle_device_fd处理；\n2) ufds[1].fd=property_set_fd：监听来自属性服务器的事件，调用handle_property_set_fd处理；\n3) ufds[2].fd=signal_recv_fd：由socketpair创建，接收子进程死亡的消息，调用wait_for_one_process处理；\n4) keychord_fd（若初始化成功）：处理keychord事件（与调试有关）。\n每轮循环还会执行drain_action_queue()和restart_processes()重启已死去的进程。"},{"ch":"第3章 · 深入理解init","sec":"3.2 init分析","q":"init中的socketpair有什么作用？","a":"init调用socketpair(AF_UNIX, SOCK_STREAM, 0, s)创建两个已经connect好的socket：signal_fd=s[0]和signal_recv_fd=s[1]。sigchld_handler收到SIGCHLD信号时会往signal_fd中写数据，另外一个socket（signal_recv_fd）就能接收到，导致init从poll函数中返回，进而调用wait_for_one_process处理子进程死亡事件。socketpair是Linux的系统调用。"},{"ch":"第3章 · 深入理解init","sec":"3.2.1 解析配置文件","q":"parse_config_file和parse_config函数的工作流程是什么？","a":"parse_config_file先调用read_file(fn, 0)读取配置文件的内容（如init.rc），失败返回-1；然后调用parse_config做真正的解析。\nparse_config设置parse_state结构（filename、line、ptr、nexttoken，parse_line=parse_line_no_op），在for循环中调用next_token(&state)逐个取token：T_EOF时结束；T_NEWLINE时若nargs非0，先lookup_keyword(args[0])得到关键字类型，若kw_is(kw, SECTION)则先结束上一个section再调parse_new_section解析新section，否则调用state.parse_line继续解析本行；T_TEXT时保存参数。整体思路是先找到section，再针对不同的section使用不同的解析函数来解析。"},{"ch":"第3章 · 深入理解init","sec":"3.2.1 解析配置文件","q":"keywords.h的双次包含技巧是怎么回事？","a":"keywords.h被parser.c包含两次（依赖宏KEYWORD的不同定义）：\n第一次包含前，声明do_class_start、do_class_stop等函数，定义__MAKE_KEYWORD_ENUM__宏和KEYWORD(symbol,flags,nargs,func)为K_##symbol（##为连接符，得到枚举值K_class、K_service等），包含后得到一个关键字枚举，随后#undef；\n第二次包含前，重新定义KEYWORD为[K_##symbol]={#symbol,func,nargs+1,flags,}（#symbol把symbol变成字符串），用它初始化keyword_info结构体数组，得到以枚举值为索引、存储关键字名称name、处理函数func、参数个数nargs、属性flags的信息数组。\n这样一份头文件同时生成了枚举和关键字属性表。"},{"ch":"第3章 · 深入理解init","sec":"3.2.1 解析配置文件","q":"关键字flags有哪三种属性？哪些关键字是section？","a":"关键字的属性有三种：COMMAND、OPTION和SECTION，其中COMMAND有对应的处理函数（如class_start对应do_class_start，start对应do_start，stop对应do_stop，restart对应do_restart）。\n当symbol为on或service时（KEYWORD(on,SECTION,0,0)、KEYWORD(service,SECTION,0,0)）表示section。OPTION如class、oneshot、onrestart、socket等。\n辅助宏kw_is(kw,type)判断属性（keyword_info[kw].flags&(type)），kw_name、kw_func、kw_nargs分别取名称、处理函数、参数个数。"},{"ch":"第3章 · 深入理解init","sec":"3.2.1 解析配置文件","q":"init.rc的组织结构有什么规律？","a":"1) 一个section的内容从这个标识section的关键字（on或service）开始，到下一个标识section的地方结束；\n2) on init、on boot等section的名字对应动作执行的四个阶段，在boot阶段执行的动作都由boot这个section定义，section内每行是COMMAND（如export、ifup、hostname、class_start default）或OPTION；\n3) 还有on property:persist.service.adb.enable=1这样的触发器section，表示待该属性值变为1后执行对应的COMMAND（如start adbd）；\n4) service也是section，如service zygote /system/bin/app_process ...，其后的行是OPTION（socket、onrestart、user、group等）。注释符号是#。"},{"ch":"第3章 · 深入理解init","sec":"3.2.1 解析配置文件","q":"init.rc中on property:persist.service.adb.enable=1这样的配置是什么意思？","a":"它是一个由属性变化触发的section，意思是：待属性persist.service.adb.enable的值变为1后，需要执行对应的COMMAND——start adbd；对应地，当该属性变为0时执行stop adbd。这类触发由属性服务端的property_changed函数完成（property_set设置属性后会调用它，检查并触发相关的action）。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"parse_new_section函数如何分发不同section的解析？","a":"parse_new_section(state, kw, nargs, args)根据关键字kw分支：case K_service时，调用parse_service(state,nargs,args)创建service结构并作为state->context，成功后把state->parse_line设为parse_line_service，即后续行由它解析；case K_on时走解析on section的逻辑。\n如果都无法处理，则state->parse_line=parse_line_no_op（空操作）。即service section用parse_service和parse_line_service两个函数配合解析。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"service结构体包含哪些重要字段？","a":"struct service包含：slist（listnode，链接到全局service_list双向链表）；name（service名字，如zygote）；classname（所属class名，默认default）；flags（service属性）；pid（进程号）；time_started（上一次启动时间）；time_crashed（上一次死亡时间）；nr_crashed（死亡次数）；uid/gid/supp_gids等；sockets（socketinfo链表，描述socket相关信息）；envvars（创建进程所需环境变量）；onrestart（action结构体，存储onrestart OPTION后面的COMMAND）；keycodes/nkeycodes/keychord_id；ioprio_class/ioprio_pri；nargs和args[1]（参数个数与参数，如可执行文件路径/system/bin/app_process）。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"action结构体的作用和组成是什么？","a":"虽然关键字onrestart标识一个OPTION，但这个OPTION后面一般跟着COMMAND，action结构体用来存储这些command信息。\n一个action结构体可存放在三个双向链表中：alist用于存储所有的action，qlist用于链接那些等待执行的action，tlist用于链接那些待某些条件满足后就需要执行的action。成员还包括hash、name，以及commands（COMMAND链表，如zygote有三个onrestart option，会创建三个command结构体）和current（指向当前command）。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"parse_service函数做了哪些事情？","a":"1) 调用service_find_by_name(args[1])检查全局service链表中是否已有同名service，有则返回0不再继续；\n2) calloc分配service结构体（大小为sizeof(*svc)+sizeof(char*)*nargs）；\n3) 设置svc->name=args[1]，svc->classname=\"default\"（这个很关键），把参数拷贝到svc->args并设置nargs；\n4) 初始化onrestart：svc->onrestart.name=\"onrestart\"，list_init(&svc->onrestart.commands)；\n5) 把该service加到全局链表service_list中（list_add_tail）。\nparse_service只搭建了service的架子，具体内容由parse_line_service填充。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"parse_line_service如何处理class、oneshot、onrestart、socket等关键字？","a":"parse_line_service根据lookup_keyword(args[0])的结果switch处理：\ncase K_class：设置svc->classname=args[1]；\ncase K_oneshot：svc->flags|=SVC_ONESHOT；\ncase K_onrestart：创建command结构体，cmd->func=kw_func(kw)、设置nargs并拷贝args，然后list_add_tail加入svc->onrestart.commands链表；\ncase K_socket：创建socketinfo，设置si->name（socket名字）、si->type（类型）、si->perm=strtoul(args[3],0,8)（8进制读写权限），可选uid/gid（decode_uid解码），挂到svc->sockets；\ndefault：parse_error报invalid option错误。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"service的五个属性（flags）分别是什么含义？","a":"1) SVC_DISABLED：不随class自动启动；\n2) SVC_ONESHOT：退出后不需要重启，即这个service只启动一次；\n3) SVC_RUNNING：正在运行（状态）；\n4) SVC_RESTARTING：等待重启（状态）；\n5) SVC_CONSOLE：该service需要使用控制台；\n另外还有SVC_CRITICAL：如果在规定时间内该service不断重启，则系统会重启并进入恢复模式。\nzygote没有使用任何属性，表明它会随着class的处理自动启动、退出后会由init重启、不使用控制台、即使不断重启也不会导致系统进入恢复模式。"},{"ch":"第3章 · 深入理解init","sec":"3.2.2 解析service","q":"init.rc中zygote的service配置解析后得到什么结构？socket zygote stream 666是什么意思？","a":"解析后：service_list链表把解析后的service全部链接到一起（双向链表，prev/next）；zygote的socketinfo也是一个双向链表（zygote只有一个socket）；onrestart通过commands指向一个commands链表，zygote有三个commands（write /sys/android_power/request_state wake、write /sys/power/state on、restart media）。\nsocket zygote stream 666表示将创建一个AF_STREAM类型的socket（其实就是TCP socket），该socket名为zygote，读写权限是666。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"init是如何启动zygote的？do_class_start的调用链是什么？","a":"init.rc的boot section中有class_start default这个COMMAND，对应处理函数do_class_start（位于builtins.c）。当init执行到action_for_each_trigger(\"boot\",action_add_queue_tail)和drain_action_queue()时，do_class_start被执行：它调用service_for_each_class(args[1], service_start_if_not_disabled)，从service_list中找到classname为default的service（args[1]即default），对每个调用service_start_if_not_disabled——若flags不含SVC_DISABLED则调用service_start(svc,NULL)。zygote的classname正是default且未设置SVC_DISABLED，所以会被启动。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"service_start函数的流程是什么？","a":"1) 清除SVC_DISABLED|SVC_RESTARTING标志；若flags含SVC_RUNNING则直接返回（已在运行）；\n2) stat(svc->args[0])判断可执行文件（如/system/bin/app_process）是否存在，不存在则置SVC_DISABLED并返回；\n3) fork()创建子进程；子进程中：get_property_workspace(&fd,&sz)取得属性存储空间信息并add_environment(\"ANDROID_PROPERTY_WORKSPACE\",tmp)加到环境变量，添加svc->envvars中的环境变量，遍历svc->sockets调用create_socket创建socket并用publish_socket把socket信息加到环境变量，设置uid、gid，setpgid(0,getpid())，最后execve(svc->args[0], svc->args, ENV)执行程序（如进入app_process的main函数）；\n4) 父进程init中：记录time_started=gettime()、svc->pid=pid、flags|=SVC_RUNNING，并notify_service_state(svc->name,\"running\")设置属性init.svc.zygote为running。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"zygote是通过哪两个函数共同创建的？","a":"zygote是通过fork和execve（execv）共同创建的：init先fork出子进程，子进程完成环境变量设置、socket创建、uid/gid设置等准备工作后调用execve执行/system/bin/app_process，进入app_process的main函数。fork和execve都是Linux系统上常用的系统调用。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"子进程死亡后init如何得知？sigchld_handler做了什么？","a":"init在main开头用sigaction注册了SIGCHLD的信号处理函数sigchld_handler（sa_flags为SA_NOCLDSTOP）。当子进程（service进程）退出时，sigchld_handler被调用，它只做一件事：write(signal_fd, &s, 1)——往signal_fd（socketpair创建的两个socket之一）中写数据。这样另外一个socket（signal_recv_fd）就能接收到消息，导致init从poll函数返回，进入wait_for_one_process的处理。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"wait_for_one_process函数的流程是什么？","a":"1) 循环调用waitpid(-1,&status,block?0:WNOHANG)等到一个退出的子进程pid，pid<=0则返回-1；\n2) service_find_by_pid(pid)找到死掉的service；\n3) 若flags不含SVC_ONESHOT，则kill(-pid, SIGKILL)杀掉该进程创建的所有子进程（这就是zygote死后Java世界崩溃的原因）；\n4) 遍历sockets，unlink掉ANDROID_SOCKET_DIR下的socket文件；\n5) 清理：svc->pid=0，清除SVC_RUNNING；若是SVC_ONESHOT则置SVC_DISABLED；\n6) SVC_CRITICAL检查：若time_crashed+CRITICAL_CRASH_WINDOW（4分钟）内nr_crashed超过CRITICAL_CRASH_THRESHOLD（4次），则sync()后调用__reboot重启进入recovery模式；\n7) 置SVC_RESTARTING标志，遍历执行onrestart.commands中的COMMAND（cmd->func(cmd->nargs,cmd->args)），notify_service_state(svc->name,\"restarting\")设置init.svc.zygote为restarting。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"onrestart指定的COMMAND在什么时候执行？死亡的service在哪里被真正重启？","a":"onrestart在service重启时使用：wait_for_one_process中把service标志置为SVC_RESTARTING后，会遍历svc->onrestart.commands链表，执行每个command（如zygote的write /sys/android_power/request_state wake、write /sys/power/state on、restart media）。\n而service本身的真正重启在init的main循环中：poll返回后进入下一轮循环，调用restart_processes()重启所有flag标志为SVC_RESTARTING的service，这样zygote就回来了。"},{"ch":"第3章 · 深入理解init","sec":"3.2.3 init控制service","q":"SVC_CRITICAL标识的作用是什么？哪个进程享有这种待遇？","a":"如果设置了SVC_CRITICAL标识，则在规定时间（CRITICAL_CRASH_WINDOW，4分钟）内该服务重启的次数不能超过CRITICAL_CRASH_THRESHOLD（4次），否则机器会在重启时进入recovery模式（sync()后调用__reboot(LINUX_REBOOT_MAGIC1, LINUX_REBOOT_MAGIC2, LINUX_REBOOT_CMD_RESTART2, \"recovery\")）。\n根据init.rc的配置，只有servicemanager进程享有此种待遇。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"Android的属性服务是什么？类似于Windows的什么机制？如何查看系统属性？","a":"Windows平台上有注册表，可存储key/value键值对，系统或应用程序把属性存于其中，重启后仍可根据之前设置的属性进行初始化。Android平台提供了类似的机制，称为属性服务（property service），应用程序可通过它查询或设置属性。\n可以用adb shell登录到真机或模拟器上，然后用getprop命令查看当前系统中有哪些属性。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"property_init和init_property_area做了什么？","a":"property_init先调用init_property_area()初始化属性存储区域，再load_properties_from_file(PROP_PATH_RAMDISK_DEFAULT)加载default.prop文件。\ninit_property_area：1) 调用init_workspace(&pa_workspace, PA_SIZE)创建存储空间，PA_SIZE为32768字节；workspace结构体含data（存储空间起始地址）、size（大小）、fd（共享内存的文件描述符）；init_workspace内部调用Android系统提供的ashmem_create_region函数创建一块共享内存；2) 对fd执行fcntl(F_SETFD, FD_CLOEXEC)；3) 在32768字节中PA_INFO_START（1024）字节用来存储头部信息，剩余为pa_info_array属性数组；4) 设置pa->magic=PROP_AREA_MAGIC、pa->version=PROP_AREA_VERSION；5) 把pa赋给__system_property_area__。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"__system_property_area__是什么？为什么init要给它赋值？其他进程如何映射属性内存？","a":"__system_property_area__是bionic libc库中输出的一个变量。属性区域由init进程创建，但Android希望其他进程也能读取这块内存里的东西，为此做了两项工作：1) 把属性区域创建在共享内存上（ashmem），共享内存可以跨进程；2) 利用gcc的constructor属性指明__libc_prenit函数，当bionic libc库被加载时将自动调用它（类似Windows动态库的DllMain），它调用__libc_init_common，后者调用__system_properties_init完成共享内存到本地进程的映射。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"__system_properties_init如何让客户端进程访问属性存储区域？有什么限制？","a":"1) getenv(\"ANDROID_PROPERTY_WORKSPACE\")取出环境变量（该信息是service_start启动子进程时通过get_property_workspace添加的），从中解析出fd=atoi(env)和sz；\n2) 调用mmap(0, sz, PROT_READ, MAP_SHARED, fd, 0)把init创建的那块内存映射到本地进程空间，这样本地进程就可以使用这块共享内存了；\n3) 校验pa->magic==PROP_AREA_MAGIC且pa->version==PROP_AREA_VERSION，失败则munmap返回-1；\n4) 成功后把pa赋给__system_property_area__。\n注意：映射时指定了PROT_READ属性，所以客户端进程只能读属性，而不能设置属性。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"start_property_service做了什么？Android有哪四个存储属性的文件？","a":"start_property_service：1) 依次load_properties_from_file加载四个属性文件：/system/build.prop（PROP_PATH_SYSTEM_BUILD）、/system/default.prop（PROP_PATH_SYSTEM_DEFAULT）、/data/local.prop（PROP_PATH_LOCAL_OVERRIDE）（另一个/default.prop即PROP_PATH_RAMDISK_DEFAULT在property_init中已加载）；2) 调用load_persistent_properties()加载需要保存到永久介质上的属性，这些文件存储在/data/property目录下且文件名必须以persist.开头；3) create_socket(PROP_SERVICE_NAME, SOCK_STREAM, 0666, 0, 0)创建用于IPC通信的socket，fcntl设置FD_CLOEXEC和O_NONBLOCK，listen(fd,8)，返回fd。\n该fd即为main函数中的property_set_fd，由poll监听，事件到来时调用handle_property_set_fd处理。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"handle_property_set_fd如何处理客户端的设置属性请求？","a":"1) accept接受TCP连接；2) getsockopt(s, SOL_SOCKET, SO_PEERCRED, &cr, &cr_size)取出客户端进程的权限（uid、gid）等属性；3) recv接收prop_msg请求数据后close(s)；4) switch(msg.cmd)，case PROP_MSG_SETPROP：先截断msg.name和msg.value；若memcmp(msg.name,\"ctl.\",4)==0（ctl开头的消息是控制消息，用来执行命令，如setprop ctl.start bootanim开开机动画、setprop ctl.stop bootanim关闭），则check_control_perms(msg.value, cr.uid, cr.gid)通过后调用handle_control_message处理；否则check_perms(msg.name, cr.uid, cr.gid)检查客户端进程是否有足够权限，通过后调用property_set(msg.name, msg.value)设置属性。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"服务端property_set函数的流程和注意事项是什么？","a":"1) 先__system_property_find(name)从属性存储空间中寻找是否已存在该属性：\n若存在：若属性名以ro.开头则表示只读，不能设置，直接返回-1；否则update_prop_info更新属性值，pa->serial++并用__futex_wake(&pa->serial, INT32_MAX)唤醒等待者；\n若不存在：视为新增属性，若pa->count==PA_COUNT_MAX（Android最多支持247项属性）直接返回-1；否则在pa_info_array新建prop_info，拷贝name/value，填充pa->toc，count++、serial++并futex_wake；\n2) 特殊属性处理：属性名以net.开头时（net.change本身除外），调用property_set(\"net.change\", name)记录最近变更的net属性；\n3) 若persistent_properties_loaded且属性名以persist.开头，则write_persistent_property把值写到对应文件；\n4) 最后调用property_changed(name, value)，用于触发init.rc中on property:xxx这样的配置（如persist.service.adb.enable置1后执行start adbd）。"},{"ch":"第3章 · 深入理解init","sec":"3.2.4 属性服务","q":"客户端进程如何设置属性？","a":"客户端通过libcutils库提供的property_set(const char* key, const char* value)发送请求：构造prop_msg，设置msg.cmd=PROP_MSG_SETPROP，strcpy填入msg.name和msg.value，然后调用send_prop_msg(&msg)。\nsend_prop_msg用socket_local_client(PROP_SERVICE_NAME, ANDROID_SOCKET_NAMESPACE_RESERVED, SOCK_STREAM)建立和属性服务器的socket连接，循环send发送prop_msg（EINTR/EAGAIN则重试），发送字节数等于sizeof(prop_msg)则成功返回0，最后close(s)。客户端自己不能直接写属性内存，只能通过socket请求属性服务器代为设置。"},{"ch":"第3章 · 深入理解init","sec":"3.3 本章小结","q":"第3章主要讲解了哪些内容？init.rc解析的难度如何？","a":"本章讲解了init进程如何解析配置文件（重点以zygote的service section为例）以及属性服务器的工作原理，旨在帮助读者认识这个天字号第一进程。相对来说，init.rc的解析难度最大。另外init涉及很多和Linux系统相关的知识（如fork、execve、socketpair、mount、信号等），有兴趣的读者可以自行研究。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.1.1 Android系统架构","q":"Android系统最大的特点之一是什么？Java世界能否脱离Native世界独立运转？","a":"Android系统最大的特点之一就是搭建了一个被广大Java开发者热捧的Java世界。但这个世界并不是空中楼阁，它的运转依赖于另一个被Google极力隐藏的Native世界，Native世界为整个系统高效和平稳地运行提供了强有力的支持。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.1 下载源码","q":"repo脚本是什么？为什么要先设置Ubuntu软件源？","a":"repo脚本是Google为了方便源码下载而提供的，通过该脚本可下载整套源码（./repo init初始化git库后用./repo sync下载）。\n下载源码前，有些下载工具需要从Ubuntu软件源上下载，而各个软件源包含的工具和下载速度不同，所以应先为系统指定一个合适的软件源（如http://mirror.bjtu.edu.cn/ubuntu）。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.2 编译源码","q":"envsetup.sh和choosecombo命令的作用是什么？","a":"进入源码目录后，先执行.build/envsetup.sh，这个脚本用来设置Android的编译环境；再执行choosecombo命令，用来选择编译目标（如目标硬件平台、eng还是user等）。一般而言，手机厂商会设置自己特有的编译选项。"},{"ch":"第1章 · 阅读前的准备工作","sec":"1.2.2 编译源码","q":"修改libaudioflinger库后如何部署测试？为什么要杀掉mediaserver进程？","a":"通过adb命令把新编译的库push到手机上后，要先杀掉mediaserver进程再测试，因为libaudioflinger库目前只有该进程在使用；当mediaserver重启后，就会重新加载新push上来的libaudioflinger库。系统服务被杀掉后一般都会自动重启（由init控制）。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.1 注册JNI函数","q":"静态注册和动态注册native函数的区别是什么？各自适用什么场景？","a":"静态注册：根据函数名建立关联，需用javah为每个class生成头文件，JNI函数名必须遵循Java_包名类名函数名格式（.换_，_换_1）；优点是简单直接，缺点是函数名长、需生成头文件、首次调用要按名搜索影响效率。\n动态注册：用JNINativeMethod结构体数组（name、signature、fnPtr）直接保存映射关系，通过FindClass和RegisterNatives完成注册，在JNI_OnLoad函数中进行；无函数名格式限制，效率高。Android平台大量采用动态注册。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.2 数据类型转换","q":"Java和JNI基本数据类型是如何对应的？jboolean、jchar有什么特殊之处？","a":"Java基本类型在JNI中有对应类型：jboolean、jbyte、jchar、jshort、jint、jlong、jfloat、jdouble、jvoid等，转换非常简单。\n注意字长：jchar在Native语言中是16位，占两个字节，和普通的char占一个字节完全不一样；转换成Native类型后务必注意对应数据类型的字长。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.4 通过JNIEnv操作jobject","q":"操作jobject的本质是什么？为什么jobject是透明的却仍能操作它？","a":"一个Java对象由它的成员变量和成员函数组成，所以操作jobject的本质就是操作这些对象的成员变量和成员函数。\n虽然jobject像void*一样对码农完全透明，但在JNI规则中成员变量和成员函数分别用jfieldID和jmethodID表示（通过GetFieldID/GetMethodID获得），再借助JNIEnv的Get/Set<type>Field和Call<type>Method系列函数，就能轻松操作jobject背后的实际对象。"},{"ch":"第2章 · 深入理解JNI","sec":"2.4.7 垃圾回收","q":"MyMediaScannerClient为什么要用NewGlobalRef保存client对象？","a":"client是从Java层传入的jobject，属于Local Reference，JNI函数返回后它就可能被垃圾回收。而MyMediaScannerClient对象存活期比一次JNI调用长，之后scanFile等函数还要通过mClient回调Java层方法，所以构造函数中用mClient(env->NewGlobalRef(client))创建Global Reference，这样mClient就不用担心被回收了；析构函数中再调用mEnv->DeleteGlobalRef(mClient)释放这个全局引用。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.1 概述","q":"Android系统中的两个世界分别指什么？","a":"Android存在两个完全不同的世界：\n1) Java世界：Google的SDK针对的世界，运行的都是基于Dalvik虚拟机的Java程序；\n2) Native世界：用C/C++开发的程序组成的世界。\nJava世界不是一开始就存在的，它的开创者是zygote进程；系统中重要的Service都驻留于Java世界的system_server进程中。zygote和system_server是Java世界的半边天，任何一个进程的死亡都会导致Java世界崩溃。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.1 概述","q":"为什么说zygote和system_server缺一不可？","a":"zygote是Android Java世界的开创者（盘古），它创建了第一个Java虚拟机，并通过fork繁殖出framework核心system_server进程；system_server则是系统中重要Service（如ActivityManagerService、WindowManagerService、PowerManagerService等）的驻留地。两者组成Java世界的半边天：zygote被杀则所有Java进程失去根基，system_server死亡会导致zygote自杀，最终Java世界崩溃重启。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2 zygote分析","q":"app_process和zygote是什么关系？进程名为何显示为zygote？","a":"zygote最初的名字叫app_process，这个名字在Android.mk文件中指定。app_process是Native应用程序，其原型对应源文件App_main.cpp，由init进程根据init.rc中的配置项fork创建。在运行过程中，app_process通过Linux的setArgv0/set_process_name（pctrl类系统调用）把自己的名字换成\"zygote\"，所以ps命令看到的进程名是\"zygote\"。启动参数如：-Xzygote /system/bin --zygote --start-system-server。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.1 AppRuntime分析","q":"AppRuntime类是什么？它与AndroidRuntime是什么关系？","a":"AppRuntime类的声明和实现均在App_main.cpp中，它是从AndroidRuntime类派生的。AppRuntime重载了onStarted、onZygoteInit和onExit三个函数。app_process的main函数创建AppRuntime对象runtime后，调用的是基类AndroidRuntime的start函数（\"com.android.internal.os.ZygoteInit\", startSystemServer），此后活动由AppRuntime控制。AndroidRuntime构造函数中会把全局变量gCurRuntime设为this。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.1 AppRuntime分析","q":"AndroidRuntime::start函数开创Java世界的三部曲是什么？","a":"start(className,startSystemServer)三部曲：\n1) startVm(&mJavaVM,&env)：创建虚拟机；\n2) startReg(env)：注册JNI函数；\n3) JNI调用com.android.internal.os.ZygoteInit的static main：类名'.'换成'/'符合JNI规范，FindClass+GetStaticMethodID取得main后CallStaticVoidMethod调用，从此进入Java世界。\nstart开头还blockSigpipe处理SIGPIPE信号，并确保ANDROID_ROOT环境变量为\"/system\"。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.1 AppRuntime分析","q":"startVm中JNI check选项的作用和副作用是什么？","a":"JNI check指Native层调用JNI函数时系统所做的检查工作，例如调用NewUTFString时检查字符串是否符合UTF-8要求，还能检查资源是否被正确释放。副作用：\n1) 检查工作比较耗时，影响系统运行速度；\n2) 有些检查过于严格，一旦出错调用进程就会abort。\n因此JNI check一般只在调试的eng版设置，正式发布的user版不设置。是否启用由系统属性dalvik.vm.checkjni和ro.kernel.android.checkjni控制，启用时添加-Xcheck:jni和-Xjnigreflimit:2000（Global reference个数不能超过2000）选项。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.1 AppRuntime分析","q":"startVm中heapsize参数如何设置？默认值是多少？","a":"startVm中通过property_get(\"dalvik.vm.heapsize\", heapsizeOptsBuf+4, \"16m\")读取属性，拼成\"-Xmx16m\"形式的选项传给虚拟机，默认为16MB，绝大多数厂商会修改，一般是32MB。heapsize不能设置得过小，否则在操作大尺寸图片时无法分配所需内存。最终通过JNI_CreateJavaVM(pJavaVM,pEnv,&initArgs)创建虚拟机，pEnv返回当前线程的JNIEnv变量。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.1 虚拟机heapsize的限制","q":"为什么heapsize无法按进程动态配置？","a":"heapsize是系统级属性（如-Xmx16m），是Zygote创建虚拟机时设置的。而zygote是通过fork来创建子进程的，Zygote本身设置的信息会被子进程全部继承——Zygote的堆设为16MB，子进程也只能用16MB，无法在fork后改变。作者想到两个解决方案：\n1) 为Dalvik增加一个允许动态调整最大堆大小的函数；\n2) zygote fork子进程后调用exec家族函数加载另一个映像，该程序重新创建虚拟机、重新注册JNI函数（模拟创世界前两天的工作），最后调用android.app.ActivityThread的main函数——可行但难度大且影响速度。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.1 AppRuntime分析","q":"startReg函数做了什么？gRegJNI数组的作用是什么？","a":"startReg(env)两件事：\n1) androidSetCreateThreadFunc((android_create_thread_fn)javaCreateThreadEtc)：设置Thread类的线程创建函数为javaCreateThreadEtc（偷梁换柱，影响第5章Thread的行为）；\n2) env->PushLocalFrame(200)后，调用register_jni_procs(gRegJNI,NELEM(gRegJNI),env)注册JNI函数，再PopLocalFrame。\ngRegJNI是全局数组，共约100项（如register_android_os_SystemClock、register_android_util_Log等），每项REG_JNI宏封装的mProc函数通过jniRegisterNativeMethods为对应的Java类注册JNI函数。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"ZygoteInit.main函数的五大关键点是什么？","a":"ZygoteInit.main的五步：\n1) registerZygoteSocket()：注册zygote用的Socket服务端；\n2) preloadClasses()和preloadResources()：预加载类和资源，之后gc()一次；\n3) startSystemServer()：argv[1]为\"true\"时启动system_server；\n4) runSelectLoopMode()：ZYGOTE_FORK_MODE为false故走此分支，等待处理客户请求；\n5) catch(MethodAndArgsCaller caller){caller.run();}：截获invokeStaticMain抛出的异常并执行；退出前closeServerSocket()。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"registerZygoteSocket做了什么？zygote的IPC为何不用Binder？","a":"registerZygoteSocket从环境变量ANDROID_SOCKET_ENV中获取Socket的fd（该环境变量由init通过execv传入），然后new LocalServerSocket(createFileDescriptor(fileDesc))创建服务端Socket，保存到静态变量sServerSocket，这个Socket将listen并accept客户端。zygote及系统中其他程序的通信没有使用Binder，而是采用了基于AF_UNIX类型的Socket。两个待思考的问题：谁是客户端？服务端怎么处理客户端的消息？"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"preloadClasses函数如何工作？preloaded-classes文件是怎么来的？","a":"preloadClasses从PRELOADED_CLASSES（\"preloaded-classes\"）文件读取输入流，用BufferedReader逐行读取，忽略#注释行和空行，对每行通过Java反射Class.forName(line)加载类。preloaded-classes在framework/base目录下，共1268行，由framework/base/tools/preload工具生成：判断每个类加载时间是否大于1250微秒（MIN_LOAD_TIME_MICROS=1250），超过的类写入文件，最后由zygote预加载。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"预加载类为什么会导致Android启动慢？如何优化？","a":"preloadClasses要加载1268个类，执行时间比较长，是导致Android系统启动慢的原因之一。这个函数理论上可以去掉，因为系统最终在使用这些类时还是会去加载；但去掉就破坏了Android采用fork机制创建Java进程的本意。fork机制的好处：\n1) zygote预加载的class在fork子进程时仅需复制一份，节约子进程启动时间；\n2) 根据fork的copy-on-write机制，不改变的类甚至不用复制，直接与父进程共享数据，省去不少内存占用。此外开机慢的环节还有：扫描所有apk收集信息、SystemServer创建Service。有人用Berkeley Lab Checkpoint/Restart(BLCR)快照技术提速。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"preloadResources加载的是什么资源？","a":"preloadResources与preloadClass类似，主要加载framework-res.apk中的资源。UI编程中常使用的com.android.R.XXX资源就是系统默认的资源，它们是由zygote加载的。因为后续fork出的所有Java子进程都共享这些已加载的类和资源，各应用无需再重复加载。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"startSystemServer如何创建system_server进程？","a":"先设置args参数：--setuid=1000、--setgid=1000、--setgroups=1001,...,3003、--capabilities=130104352,130104352、--runtime-init、--nice-name=system_server、com.android.server.SystemServer；然后new ZygoteConnection.Arguments(args)解析参数，调用Zygote.forkSystemServer(uid,gid,gids,debugFlags,null)fork子进程。pid==0表示处于子进程（system_server），调用handleSystemServerProcess(parsedArgs)；zygote本身返回true。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"runSelectLoopMode的工作原理是什么？","a":"runSelectLoopMode维护fds和peers两个列表（zygote自身在peers中对应null），把sServerSocket的fd加入fds，进入while(true)循环：fdArray=fds.toArray(fdArray)后调用selectReadable(fdArray)（内部用select多路复用I/O模型），有客户端连接或数据时返回index。index==0表示有新客户端连接，acceptCommandPeer创建ZygoteConnection加入peers和fds；否则客户端发来请求，调用peers.get(index).runOnce()处理。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"selectReadable背后体现的I/O模型是什么？常见I/O模型有哪些？","a":"selectReadable内部调用select，使用多路复用I/O模型：用一个调用同时监视多个fd，当任一fd可读（有客户端连接或有数据）时返回。常用I/O模型包括：阻塞式、非阻塞式、多路复用（select）、异步I/O等。掌握这些知识对编写大型系统很有帮助。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.3 关于zygote的总结","q":"zygote创世纪的七大步骤是什么？","a":"1) 创建AppRuntime对象并调用它的start，此后活动由AppRuntime控制；\n2) 调用startVm创建Java虚拟机，然后调用startReg注册JNI函数；\n3) 通过JNI调用com.android.internal.os.ZygoteInit类的main函数，进入Java世界；\n4) 调用registerZygoteSocket响应子孙后代的请求，同时调用preloadClasses和preloadResources为Java世界添砖加瓦；\n5) 调用startSystemServer分裂子进程system_server为Java世界服务；\n6) 调用runSelectLoopMode后沉沉睡去；\n7) 以后的日子随时守护，接收到子孙后代的请求时醒来为它们工作。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.1 SystemServer的诞生","q":"forkSystemServer中Zygote与SystemServer如何做到生死与共？","a":"Dalvik_dalvik_system_Zygote_forkSystemServer中调用forkAndSpecializeCommon(args)fork出子进程后，若pid>0，把pid保存到gDvm.systemServerPid，并在退出前waitpid(pid,&status,WNOHANG)检查，若SS已退出则kill(getpid(),SIGKILL)干掉自己。另外fork前setSignalHandler()用sigaction注册SIGCHLD处理函数sigchldHandler：waitpid(-1,...)收割死子进程，若pid==gDvm.systemServerPid则kill(getpid(),SIGKILL)，zygote随SS自杀，生死与共。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.1 SystemServer的诞生","q":"sigchldHandler的作用是什么？","a":"sigchldHandler是Zygote在fork子进程前通过setSignalHandler()用sigaction(SIGCHLD,&sa,NULL)注册的信号处理函数，SIGCHLD是子进程死亡的信号。函数中while((pid=waitpid(-1,&status,WNOHANG))>0)循环收割所有已死子进程，判断WIFSIGNALED(status)等状态；如果死去的子进程是SS（pid==gDvm.systemServerPid），则调用kill(getpid(),SIGKILL)把Zygote自己也干掉，实现SS与Zygote生死与共。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"handleSystemServerProcess做了什么？","a":"SS进程（pid==0分支）调用handleSystemServerProcess(parsedArgs)：\n1) closeServerSocket()：关闭从Zygote继承下来的Socket；\n2) setCapabilities(parsedArgs.permittedCapabilities, parsedArgs.effectiveCapabilities)：设置SS进程的能力参数；\n3) RuntimeInit.zygoteInit(parsedArgs.remainingArgs)：进入RuntimeInit继续初始化，remainingArgs中含\"com.android.server.SystemServer\"。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"RuntimeInit.zygoteInit的流程是什么？","a":"RuntimeInit.zygoteInit(argv)：\n1) commonInit()做常规初始化，并重定向标准输出/错误输出（System.setOut/ setErr为AndroidPrintStream）；\n2) zygoteInitNative()：native初始化，最终调用gCurRuntime->onZygoteInit()，在其中通过ProcessState::self()和startThreadPool()与Binder建立联系；\n3) 解析参数，遇--nice-name=system_server则Process.setArgV0设置进程名；\n4) 取出startClass（\"com.android.server.SystemServer\"），调用invokeStaticMain(startClass,startArgs)。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"gCurRuntime是什么？SS为何能使用它？","a":"gCurRuntime是AndroidRuntime.cpp中的全局变量（static AndroidRuntime*gCurRuntime=NULL）。app_process的main函数中创建AppRuntime对象时，AndroidRuntime构造函数会执行SkGraphics::Init()等Skia初始化，并执行gCurRuntime=this把对象自身存入该全局变量。由于SS是从zygote fork出来的，fork复制了内存映像，所以SS也拥有zygote进程中定义的这个gCurRuntime（AppRuntime对象）。zygoteInitNative()就调用gCurRuntime->onZygoteInit()。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"AppRuntime::onZygoteInit的作用是什么？","a":"onZygoteInit()（App_main.cpp）中：sp<ProcessState> proc=ProcessState::self(); 若proc->supportsProcesses()为真，则调用proc->startThreadPool()启动一个线程用于Binder通信。一言以蔽之，SS（及zygote fork的其他子进程）调用zygoteInitNative后，将与Binder通信系统建立联系，从而能够使用Binder。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"invokeStaticMain为什么不直接调用main函数而是抛异常？","a":"invokeStaticMain用Class.forName(className)加载类，getMethod(\"main\", String[].class)取得main的Method并检查其public static修饰符后，并不直接调用，而是throw new ZygoteInit.MethodAndArgsCaller(m,argv)。该异常在ZygoteInit.main的catch(MethodAndArgsCaller caller)中被截获，调用caller.run()，其中mMethod.invoke(null,new Object[]{mArgs})真正调用SystemServer的main。原因：此时代码位于ZygoteInit.main中，相当于Native的入口函数，位于堆栈顶层；若直接调用会浪费之前函数调用占用的堆栈。抛异常的方式近似模拟exec，后续工作交给新类处理。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"SystemServer.main函数做了什么？","a":"com.android.server.SystemServer的main函数：\n1) System.loadLibrary(\"android_servers\")加载libandroid_servers.so库（源码在framework/base/services/jni下）；\n2) 调用native的init1(args)。init1是native函数，实现在com_android_server_SystemServer.cpp中：android_server_SystemServer_init1直接调用system_init()。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"system_init函数做了哪些工作？","a":"system_init.cpp的system_init()：\n1) Binder：sp<ProcessState> proc(ProcessState::self())，取defaultServiceManager()，new GrimReaper并linkToDeath；\n2) 读属性system_init.startsurfaceflinger（默认1）则SurfaceFlinger::instantiate()在system_server中创建SurfaceFlinger；\n3) runtime->callStatic(\"com/android/server/SystemServer\",\"init2\")调用Java层init2；\n4) startThreadPool()后IPCThreadState::self()->joinThreadPool()，把主线程加入Binder通信。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.2 SystemServer的重要使命","q":"SystemServer.init2做了什么？ServerThread.run启动了哪些服务？","a":"init2()创建Thread thr=new ServerThread()，setName(\"android.server.ServerThread\")后thr.start()。ServerThread.run依次启动系统重要服务：EntropyService、PowerManagerService（POWER_SERVICE）、BatteryService，Watchdog.getInstance().init(context,battery,power,alarm,ActivityManagerService.self())初始化看门狗，WindowManagerService.main(...)并addService(WINDOW_SERVICE)，ActivityManagerService.setWindowManager(wm)等，最后Looper.loop()进入消息循环。Java世界核心Service都在这里启动。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.3 关于SystemServer的总结","q":"SystemServer从诞生到服务的完整调用流程是什么？","a":"ZygoteInit.main→startSystemServer→Zygote.forkSystemServer→(pid==0)handleSystemServerProcess→RuntimeInit.zygoteInit→zygoteInitNative（onZygoteInit启动Binder线程池）→invokeStaticMain抛MethodAndArgsCaller异常→ZygoteInit.main截获并caller.run()→SystemServer.main→loadLibrary(android_servers)→init1→system_init（创建SurfaceFlinger，callStatic调init2，主线程joinThreadPool）→init2→new ServerThread().start()→run中启动各Service→Looper.loop()。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.4.1 ActivityManagerService发送请求","q":"AMS如何通过Process.start请求zygote创建应用进程？","a":"ActivityManagerService的startProcessLocked中，若要启动的Activity附属进程不存在，则调用Process.start(\"android.app.ActivityThread\", processName, uid, uid, gids, debugFlags, null)（android.os.Process类，非JDK的Process）。Process.start调用startViaZygote，构造argsForZygote参数（含--runtime-init、--setuid、--setgid等），最后调用zygoteSendArgsAndGetPid。由于AMS驻留于SystemServer进程，实际是SS向Zygote发送消息。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.4.1 ActivityManagerService发送请求","q":"zygoteSendArgsAndGetPid和openZygoteSocketIfNeeded的工作过程？","a":"zygoteSendArgsAndGetPid：先openZygoteSocketIfNeeded()，然后通过sZygoteWriter把参数个数和每个参数逐行写入Socket并flush，再从sZygoteInputStream.readInt()读取Zygote处理完的结果，得到新进程的pid并返回。openZygoteSocketIfNeeded：new LocalSocket()后sZygoteSocket.connect(new LocalSocketAddress(ZYGOTE_SOCKET, LocalSocketAddress.Namespace.RESERVED))连接Zygote，并创建sZygoteInputStream（DataInputStream）和sZygoteWriter（BufferedWriter）。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.4.2 有求必应之响应请求","q":"ZygoteConnection.runOnce如何响应创建进程的请求？","a":"runOnce()：\n1) readArgumentList()读取SS发送过来的参数，mSocket.getAncillaryFileDescriptors()获取附属fd；\n2) new Arguments(args)解析，applyUidSecurityPolicy做安全检查；\n3) 调用Zygote.forkAndSpecialize(uid,gid,gids,debugFlags,rlimits)分裂子进程；\n4) pid==0为子进程，调用handleChildProc(parsedArgs,descriptors,newStderr)，返回true；\n5) 否则是zygote进程，调用handleParentProc(pid,descriptors,parsedArgs)做扫尾工作（把pid传回给请求者），然后继续等待下一次请求。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.4.2 有求必应之响应请求","q":"handleChildProc之后新进程如何走到ActivityThread.main？","a":"handleChildProc根据传入参数设置新进程属性；SS发来的参数含\"--runtime-init\"，故parsedArgs.runtimeInit为true，则调用RuntimeInit.zygoteInit(parsedArgs.remainingArgs)：重定向标准输出/错误输出→commonInit()→zygoteInitNative()（native函数最终调用AppRuntime的onZygoteInit，建立与Binder的关系）→解析参数→invokeStaticMain(startClass,startArgs)→抛MethodAndArgsCaller异常→最终调用android.app.ActivityThread的main函数，即apk进程的main函数。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.4.3 关于zygote分裂的总结","q":"为什么说所有apk程序的父进程都是zygote？","a":"apk程序运行于ActivityThread对应的进程中。当AMS需要启动新进程时，通过Process.start→startViaZygote→zygoteSendArgsAndGetPid向zygote发Socket请求，zygote在runSelectLoopMode中收到请求后调用ZygoteConnection.runOnce→Zygote.forkAndSpecialize fork出子进程，子进程经handleChildProc→RuntimeInit.zygoteInit→invokeStaticMain最终调用android.app.ActivityThread.main。所以所有apk进程都是由zygote fork而来，adb shell后用ps命令查看进程和父进程号（PPID）即可确认。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.2 开机速度优化","q":"Android开机时哪些地方耗时较长？","a":"开机时三个地方耗时比较长：\n1) ZygoteInit.main中preloadClasses加载一千多个类，耗费不少时间；\n2) 开机启动时对系统内所有apk文件进行扫描并收集信息，动作非常耗时；\n3) SystemServer创建的那些Service占用不少时间。\n可优化方向：减少preloadClasses时间；有人使用Berkeley Lab Checkpoint/Restart（BLCR）技术——对系统做快照，把当前信息保存到文件，重启时根据快照恢复之前的状态（想法简单实现复杂）。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.3 Watchdog分析","q":"Watchdog是什么？它看的是哪个门？","a":"Watchdog（看门狗）源自早期嵌入式设备的硬件看门狗：定时检查某参数是否被设置，未设置则判定系统出错强制重启。Android在软件层为SystemServer增加了一条看门狗，它看的是几个重要Service的门：一旦发现Service出问题（死锁），就会杀掉system_server，而zygote也会随其一起自杀，最后导致重启Java世界。SS与Watchdog的交互三步：Watchdog.getInstance().init()、Watchdog.getInstance().start()、Watchdog.getInstance().addMonitor()。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.3 Watchdog分析","q":"Watchdog类的结构和初始化过程是怎样的？","a":"Watchdog extends Thread，在单独线程中执行，采用单例模式（getInstance中if(sWatchdog==null) sWatchdog=new Watchdog()）。构造函数super(\"watchdog\")，并构造mHandler=new HeartbeatHandler()（Handler，消息处理的地方）和mGlobalPssCollected=new GlobalPssCollected()（与内存信息有关）。init(context,battery,power,alarm,activity)保存mResolver、mBattery、mPower、mAlarm、mActivity等成员，并记录mBootTime=System.currentTimeMillis()。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.3 Watchdog分析","q":"Watchdog.run的检查流程是怎样的？","a":"run()中外层while(true)循环：每轮置mCompleted=false，通过mHandler.sendEmptyMessage(MONITOR)给另一线程的消息队列发消息请求检查各Service健康情况；然后synchronized(this)中wait(timeout)等待结果（TIME_TO_WAIT，mForceKillSystem为true也会退出等待）。若mCompleted为true且无mForceKillSystem，继续循环；若第一次未通过（!waitedHalf），置waitedHalf=true再检查一次；两次检查后仍有问题，且!Debug.isDebuggerConnected()，则Process.killProcess(Process.myPid())并System.exit(10)干掉SS自己。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.3 Watchdog分析","q":"哪些Service需要接受Watchdog检查？HeartbeatHandler如何检查？","a":"需要交给Watchdog检查的Service有三个：ActivityManagerService、PowerManagerService、WindowManagerService。这些Service需实现monitor接口并通过Watchdog.getInstance().addMonitor(this)把自己加入检查队列（如PowerManagerService在构造函数中调用）。HeartbeatHandler的handleMessage处理MONITOR消息：遍历mMonitors，逐个置mCurrentMonitor并调用mCurrentMonitor.monitor()检查；全部通过则synchronized(Watchdog.this)中置mCompleted=true、mCurrentMonitor=null。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.3 Watchdog分析","q":"Watchdog通过monitor函数到底检查什么？","a":"以PowerManagerService为例，其monitor()实现是synchronized(mLocks){}——即尝试获取mLocks这把锁再立刻释放。原来Watchdog最怕系统服务死锁：若某函数占着锁长时间不返回（例如函数需与硬件交互而硬件未及时返回），monitor会被阻塞无法完成，mCompleted无法置true，Watchdog重试一次后仍失败就会杀掉system_server导致Java世界重启。此外Watchdog还能检查内存的使用情况。"},{"ch":"第5章 · 深入理解常见类","sec":"5.1 概述","q":"sp和wp是什么？它们的目的何在？","a":"sp并不是smart pointer（智能指针），其真实意思是strong pointer（强指针），wp则是weak pointer（弱指针）。RefBase是Android中所有对象的始祖（类似MFC的CObject、Java的Object），RefBase结合sp和wp实现了一套通过引用计数控制对象生命周期的机制。sp和wp的目的就是帮助健忘的程序员回收new出来的内存，可能是模仿Java的weak reference机制。Java层最实用的则是Looper和Handler。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"RefBase的\"影子对象\"是什么？何时创建？","a":"类A从RefBase派生后，RefBase构造函数执行mRefs(new weakref_impl(this))，即new实际对象的同时会悄悄new一个weakref_impl对象，称为影子对象（实际对象内部通过成员mRefs持有它）。weakref_impl从RefBase的内部类weakref_type派生（C++内部类即nested class，与Java内部类不同，它需要显式成员指向外部类对象）。构造影子对象的内存开销在今天的嵌入式设备上已不成问题。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"weakref_impl有哪些关键成员？初值是什么？","a":"weakref_impl(RefBase*base)构造函数：mStrong(INITIAL_STRONG_VALUE)——强引用计数，初始值为0x1000000；mWeak(0)——弱引用计数，初始值为0；mBase(base)——影子对象所指向的实际对象；mFlags(0)——生命周期标志；mStrongRefs/mWeakRefs(NULL)、mTrackEnabled、mRetain等为调试相关成员。release版中addStrongRef/removeStrongRef/addWeakRef/removeWeakRef/printRefs/trackMe等函数都是空实现，可跳过不看。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"sp的构造函数对引用计数有什么影响？","a":"sp<T>::sp(T*other)中m_ptr(other)保存实际对象指针，然后调用other->incStrong(this)。incStrong里：先refs->addWeakRef(id)（空操作）、refs->incWeak(id)使影子对象弱引用计数加1；再addStrongRef(id)（空操作）、android_atomic_inc(&refs->mStrong)使强引用计数加1并返回旧值c；若c!=INITIAL_STRONG_VALUE说明已被强引用过，直接return；若是第一次强引用，则android_atomic_add(-INITIAL_STRONG_VALUE,&refs->mStrong)把mStrong修正为1，并调用onFirstRef()通知对象第一次被强引用（派生类可重载完成初始化）。结果：强弱引用计数各加1。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"incWeak函数做了什么？","a":"RefBase::weakref_type::incWeak(const void*id)：先static_cast<weakref_impl*>(this)把基类指针转成影子对象类型，调用impl->addWeakRef(id)（release版为空），然后const int32_t c=android_atomic_inc(&impl->mWeak)以原子操作把影子对象的弱引用计数加1。影子对象强弱引用计数的值是彻底理解sp和wp的关键。android_atomic_xxx是Android平台提供的原子操作函数，多线程编程必需。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"wp的构造函数对引用计数有什么影响？","a":"wp<T>::wp(const sp<T>&other)：m_ptr(other.m_ptr)指向实际对象，然后m_refs=m_ptr->createWeak(this)。createWeak(id)调用mRefs->incWeak(id)使弱引用计数加1，并返回mRefs（影子对象本身）作为返回值保存在wp的m_refs成员中。所以wp化后弱引用计数加1、强引用计数不变。wp有两个成员变量（m_ptr保存实际对象、m_refs保存影子对象），sp只有一个保存实际对象的成员（实际对象内部已包含影子对象）。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"decWeak中引用计数减到0时如何处理？","a":"weakref_type::decWeak(id)：android_atomic_dec(&impl->mWeak)返回旧值c，若c!=1直接返回（弱引用计数未到0）；若c==1（减后为0），按mFlags处理：\n1) flags不是OBJECT_LIFETIME_WEAK时：若impl->mStrong==INITIAL_STRONG_VALUE（从未被强引用过），delete impl->mBase删掉实际对象；否则delete impl删掉影子对象自己；\n2) flags为OBJECT_LIFETIME_WEAK时：调用impl->mBase->onLastWeakRef(id)，若flags不是OBJECT_LIFETIME_FOREVER则delete impl->mBase。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"decStrong的流程是什么？","a":"RefBase::decStrong(id)：removeStrongRef(id)（空操作）后android_atomic_dec(&refs->mStrong)，若c==1（强引用计数减为0）则：先调用onLastStrongRef(id)；若mFlags不含OBJECT_LIFETIME_WEAK，则delete this删除实际对象（会调用A的析构→RefBase的析构，其中若mRefs->mWeak==0才delete mRefs，本例弱计数为1所以影子对象暂不删）；随后refs->removeWeakRef(id)和refs->decWeak(id)使弱引用计数也减1。注意decStrong进入时就已把mRefs保存到局部refs，delete this后仍可使用。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"第一板斧例子（spA后wpA再析构）的最终结果是什么？","a":"例子中A*pA=new A后，sp<A>spA(pA)使强弱计数各加1（强1弱1），wp<A>wpA(spA)使弱计数加1（强1弱2）。大括号结束时先析构wp再析构sp：wp析构调用decWeak，弱计数减为1，未到0无对象被删；sp析构调用decStrong，强计数减为0，delete this删掉实际对象，再decWeak使弱计数为0，delete impl删掉影子对象。总结规律（flags为0时）：\n1) sp化强弱计数各加1，sp析构各减1；\n2) wp化弱计数加1，wp析构减1；\n3) 强引用为0将导致实际对象被delete；\n4) 弱引用为0将导致影子对象被delete。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.2 第二板斧——由弱生强","q":"wp如何由弱生强？promote函数做了什么？","a":"wp<T>::promote()返回sp<T>(m_ptr,m_refs)，调用sp的特殊构造函数：m_ptr((p&&refs->attemptIncStrong(this))?p:0)。即关键在attemptIncStrong(this)：成功则m_ptr为实际对象指针（由弱生强成功，得到一个sp），失败则m_ptr为NULL。promote完成后强弱引用计数均加1。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.2 第二板斧——由弱生强","q":"attemptIncStrong的关键流程是什么？","a":"weakref_type::attemptIncStrong(id)：\n1) incWeak(id)先使弱计数加1；\n2) curCount=impl->mStrong，若curCount>0且不是INITIAL_STRONG_VALUE，用android_atomic_cmpxchg(curCount,curCount+1,&impl->mStrong)循环使强计数加1（多线程下可能循环多次）；\n3) 若curCount<=0或为INITIAL_STRONG_VALUE，通过allow判断（结合mFlags与onIncStrongAttempted(FIRST_INC_STRONG,id)）决定是否允许由弱生强，失败则decWeak(id)返回false；\n4) 成功则android_atomic_inc强计数加1，若原为INITIAL_STRONG_VALUE则减去之并调用onFirstRef()，返回true。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.2 第二板斧——由弱生强","q":"attemptIncStrong中allow判断为何要精心设计？","a":"impl的mBase对象（实际对象）有可能已经被delete了。curCount为0表示强引用计数经历了INITIAL_STRONG_VALUE→1→...→0的过程；mFlags用于决定是否继续执行后面使用mBase的判断（如onIncStrongAttempted），如果不做这些判断，一旦mBase指向已回收的地址就会segment fault。curCount==INITIAL_STRONG_VALUE时（对象从未被强引用），allow=(mFlags非WEAK)||mBase->onIncStrongAttempted(...)；否则allow=(mFlags为WEAK)&&mBase->onIncStrongAttempted(...)。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.3 第三板斧——破解生死魔咒","q":"extendObjectLifetime支持哪几种生命周期模式？","a":"RefBase提供extendObjectLifetime(int32_t mode)，枚举：OBJECT_LIFETIME_WEAK=0x0001、OBJECT_LIFETIME_FOREVER=0x0003（B11包含WEAK的B01）。三种模式：\n1) flags为0：强引用计数控制实际对象生命周期，弱引用计数控制影子对象生命周期，强计数为0实际对象即被delete，用wp时要注意及时promote以免segment fault；\n2) LIFETIME_WEAK：强计数为0而弱计数不为0时实际对象不被delete，强弱计数同时为0时实际对象和影子对象才一起被delete；\n3) LIFETIME_FOREVER：对象长生不老，彻底摆脱引用计数控制，须在适当时候手动删除这些\"老妖精\"。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.3 第三板斧——破解生死魔咒","q":"OBJECT_LIFETIME_WEAK模式下对象何时真正销毁？","a":"在构造函数中调用extendObjectLifetime(OBJECT_LIFETIME_WEAK)后：sp析构走decStrong，强计数减为0时调用onLastStrongRef，但因mFlags含WEAK，不执行delete this；随后decWeak使弱计数减1。直到wp也析构、decWeak使弱计数减为0时，走else分支：调用mBase->onLastWeakRef(id)，因flags不是FOREVER，delete impl->mBase删除实际对象；实际对象的析构（RefBase析构）检查mRefs->mWeak==0成立，把影子对象也delete掉。即只有强弱引用计数同时为0时，实际对象和影子对象才会一起被delete。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.4 轻量级的引用计数控制类LightRefBase","q":"LightRefBase是什么样的类？如何使用？","a":"LightRefBase是轻量级的引用计数控制模板类（RefBase是重量级）。它只有一个引用计数变量mutable volatile int32_t mCount（初值0）：incStrong时android_atomic_inc加1；decStrong时android_atomic_dec返回1（即减到0）则delete static_cast<const T*>(this)自杀；另有getStrongCount()。由于只提供incStrong/decStrong，它只支持sp控制。用法：class A:public LightRefBase<A>{...}，派生时要指明LightRefBase<A>。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.1 一个变量引发的思考","q":"Thread构造函数中canCallJava参数的含义是什么？","a":"Thread(bool canCallJava=true)中canCallJava表示这个线程是否会使用JNI函数。Thread::run中：mCanCallJava为true时调用createThreadEtc(_threadLoop,this,...)，其内部经函数指针gCreateThreadFn（初始为androidCreateRawThreadEtc）调用；mCanCallJava为false时直接调用androidCreateRawThreadEtc(_threadLoop,this,...)。两者传入的线程函数都是_threadLoop，区别在于gCreateThreadFn可能被替换。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.1 一个变量引发的思考","q":"zygote如何偷梁换柱修改线程创建函数？javaThreadShell做了什么？","a":"AndroidRuntime::startReg中androidSetCreateThreadFunc((android_create_thread_fn)javaCreateThreadEtc)把函数指针gCreateThreadFn（初始为androidCreateRawThreadEtc）换成javaCreateThreadEtc。后者把entryFunction、userData、threadName打包进malloc的args数组，再androidCreateRawThreadEtc(AndroidRuntime::javaThreadShell,args,...)，真线程函数换成javaThreadShell：先javaAttachThread把线程attach到JNI环境（可调用JNI函数），再调实际线程函数干活，最后javaDetachThread()释放资源。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.1 一个变量引发的思考","q":"mCanCallJava为true（attach/detach）为什么尤其重要？","a":"mCanCallJava为true创建的新线程：1) 在调用线程函数之前attach到JNI环境，线程函数可以无忧无虑地使用JNI函数；2) 线程函数退出后从JNI环境detach，释放一些资源。第二点尤其重要：进程退出前dalvik虚拟机会检查是否有attach了却未detach的线程，若有则直接abort（不是好事）。关闭JNI check选项就不会做这个检查，但该检查与资源释放有关，建议重视。如果直接用POSIX线程创建函数，凡使用过attach的最后都必须detach。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.1 一个变量引发的思考","q":"_threadLoop的工作流程是什么？线程何时退出？","a":"_threadLoop(user)中self为继承Thread的对象：sp<Thread>strong(self->mHoldSelf)、wp<Thread>weak(strong)保住自身引用后clear mHoldSelf，记录mTid=gettid()。进入do-while循环：第一次先调用self->readyToRun()（成功且mExitPending为false才调threadLoop），之后每轮调用子类实现的self->threadLoop()。退出条件：1) result为false——threadLoop主动返回false（千万别写错返回值）；2) mExitPending为true——外界requestExit()设置，属被动退出。退出时置mExitPending=true、mRunning=false并broadcast mThreadExitedCondition。threadLoop运行在循环中，返回值决定是否退出。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"Mutex类如何实现？lock/unlock/tryLock的用法是什么？","a":"Mutex(int type,const char*name)封装pthread_mutex：type为SHARED时用pthread_mutexattr_setpshared(PTHREAD_PROCESS_SHARED)支持跨进程的线程同步（Audio、Surface系统中常见），否则pthread_mutex_init(&mMutex,NULL)普通初始化。lock()即pthread_mutex_lock（若区域已被别人锁住则等待，系统保证一次只有一个线程能lock成功）；unlock()即pthread_mutex_unlock释放互斥区域；tryLock()即pthread_mutex_trylock，只是尝试锁住，使用者需根据返回值判断是否成功。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"Autolock是什么？解决了什么问题？","a":"Autolock是定义在Mutex内部的类，是为\"懒人\"设计的：直接使用Mutex需要显式lock且在分支繁多的代码中处处记得unlock，稍有不慎忘了就死锁。Autolock利用C++构造和析构函数自动调用：inline Autolock(Mutex&mutex):mLock(mutex){mLock.lock();}构造时加锁，inline ~Autolock(){mLock.unlock();}析构时解锁。用法：定义Mutex xlock后，在使用处定义Mutex::Autolock autoLock(xlock)，其生命周期内lock/unlock自动一一对应调用，绝对不会出错。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"Condition类提供哪些函数？使用时要注意什么？","a":"Condition封装pthread_cond_xxx，用于等待者/触发者场景（线程A做初始化，B、C等待条件）：wait(Mutex&mutex)等待事件；waitRelative(Mutex&mutex,nsecs_t reltime)超时等待，超过时间条件仍不满足则退出等待；signal()由触发者通知条件满足，但等待者只有一个会被唤醒；broadcast()唤醒所有等待者。构造时type为SHARED表示支持跨进程条件同步。重点：Condition必须配合Mutex使用，wait/waitRelative/signal/broadcast的调用都要放在Mutex的lock和unlock范围中，wait和waitRelative尤其是强制性的。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"为什么Thread.requestExitAndWait中要用while循环反复检测mRunning？","a":"requestExitAndWait()：requestExit()设置mExitPending为true后，用Mutex::Autolock_l(mLock)锁住，在while(mRunning==true)循环中调用mThreadExitedCondition.wait(mLock)等待。之所以用while反复检测mRunning而不是if判断一次，是因为某些时候即使条件变量没有被触发（虚假唤醒），wait也会返回，所以醒来后必须重新检查条件是否满足。工作线程退出前在_threadLoop中mLock.lock()后置mRunning=false并mThreadExitedCondition.broadcast()唤醒等待者，随后unlock。这是Condition+Mutex配合的典型例子。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"什么是原子操作？为什么g_flag++需要Mutex保护？","a":"原子操作就是该操作绝不会在执行完毕前被任何其他任务或事件打断，是最小的执行单位。g_flag++/g_flag--不是原子操作：从汇编看，一条C++语句对应数条汇编指令——1) 从内存取数据到寄存器；2) 寄存器中递增；3) 结果写回内存。多线程时这三条指令可能被打断：线程1执行第一条后，线程2抢先把三条执行完，线程1继续执行用的就是旧值，再操作便无意义。所以要用Mutex加锁保护，但Mutex使用繁琐且会导致用户态转入内核态的较大开销，于是有了原子操作函数。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"Android提供了哪些原子操作函数？各自的语义是什么？","a":"Atomic.h（system/core/include/cutils）：\n1) android_atomic_write(value,addr)：原子赋值；\n2) android_atomic_inc/dec(addr)：原子加1/减1；\n3) android_atomic_add/and/or(value,addr)：原子加、与、或；\n4) android_atomic_cmpxchg(oldvalue,newvalue,addr)：仅当oldValue等于*addr时赋新值。\n除write外返回值都是操作前的旧值；cmpxchg返回0表示进行了赋值，非零表示没有。X86实现在libcutils/Atomic.c的__i386__/__x86_64__段，ARM在atomic-android-arm.S。原子操作避免锁的使用，多核并行编程的最高境界就是完全不用锁。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.2 常用同步类","q":"X86平台上如何用内嵌汇编实现原子递增？","a":"Windows API的InterlockedIncrement可用Linux内嵌汇编实现：#define LOCK \"lock\"，INT32 i=1; __asm__ __volatile__(LOCK \"xaddl %0,%1\" : \"+r\"(i),\"+m\"(*lpAddend) :: \"memory\")。在SMP系统上LOCK定义成\"lock;\"表示锁总线，同一时刻只能有一个CPU访问总线；非SMP系统LOCK定义成空。由于InterlockedIncrement要返回递增前的旧值，所以使用xaddl指令——它先交换源和目的的操作数再进行递增操作。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.1 Looper类分析","q":"消息驱动的工作原理是什么？Looper和Handler各扮演什么角色？","a":"Java应用程序靠消息驱动工作，原理：有一个消息队列可以投递消息（一般加至队列尾，优先级高的消息可加至队列头）；有一个消息循环不断从队列头取出消息处理。Android中：\n1) Looper类：用于封装消息循环，并且有一个消息队列；\n2) Handler类：有点像辅助类，封装了消息投递、消息处理等接口。\n事件源（按键、触摸屏等物理事件，或系统/应用本身发出的请求）把消息加入队列，处理线程取出处理。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.1 Looper类分析","q":"Looper.prepare做了什么？ThreadLocal的作用是什么？","a":"prepare()先检查sThreadLocal.get()!=null，不为null则抛RuntimeException(\"Only one Looper may be created per thread\")——一个线程只能调用一次prepare；否则sThreadLocal.set(new Looper())。sThreadLocal是static final ThreadLocal，Java线程局部变量类（Thread Local Variable，实现与操作系统TLS有关），set/get设置和获取调用线程的局部变量，结果都与调用线程有关。prepare把Looper对象设置到调用线程的TLV中，巧妙地把Looper和调用线程关联。Looper构造函数：mQueue=new MessageQueue()、mRun=true、mThread=Thread.currentThread()。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.1 Looper类分析","q":"Looper.loop的消息循环如何工作？","a":"loop()先Looper me=myLooper()（返回保存在调用线程TLV中的Looper对象），取出me.mQueue，进入while(true)循环：Message msg=queue.next()取消息；若msg.target==null则return退出消息循环（target为空是退出标志）；否则调用msg.target.dispatchMessage(msg)把消息交给其Handler处理，然后msg.recycle()回收消息。Looper的作用：封装消息队列；prepare把Looper和调用线程绑定；loop处理该队列的消息。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.1 Looper类分析","q":"Looper、Message和Handler三者的关系是什么？","a":"1) Looper中有一个Message队列（MessageQueue），里面存储一个个待处理的Message；\n2) Message中有一个target，是Handler类型，这个Handler是用来处理Message的。\nHandler则封装了很多琐碎的工作：把消息投递到消息队列、处理消息等。相比RefBase/sp/wp三者关系的复杂，这三者关系简单得多。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.2 Handler分析","q":"Handler有哪四个构造函数？区别是什么？","a":"Handler成员：final MessageQueue mQueue、final Looper mLooper、final Callback mCallback。四个构造函数：\n1) Handler()：mLooper=Looper.myLooper()（为null则抛RuntimeException），mQueue=mLooper.mQueue，mCallback=null；\n2) Handler(Callback callback)：同1，但设置mCallback；\n3) Handler(Looper looper)：looper由外部传入（哪个线程的Looper不确定），mQueue=looper.mQueue；\n4) Handler(Looper,Callback)：同3再加mCallback。\n共同点：mQueue最终都指向某个Looper的消息队列。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.2 Handler分析","q":"没有Handler时向Looper消息队列插入消息的原始方法是什么？","a":"原始方法三步：\n1) 调用Looper的myQueue，返回消息队列对象MessageQueue；\n2) 构造一个Message，填充它的成员，尤其是target变量；\n3) 调用MessageQueue的enqueueMessage，将消息插入消息队列。\n这种方法麻烦且极容易出错。Handler作为辅助类简化了这些工作，其mQueue直接指向Looper的消息队列，目的就是方便往该队列插入和处理消息。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.2 Handler分析","q":"Handler提供了哪些常用的消息操作函数？","a":"Handler封装了创建消息和插入消息队列的工作：\n1) hasMessages(int what)：查看消息队列中是否有消息码是what的消息；\n2) obtainMessage(int what)：从Handler中创建一个消息码是what的消息；\n3) removeMessages(int what)：从消息队列中移除消息码是what的消息；\n4) sendEmptyMessage(int what)：发送一个只填充了消息码的消息；\n5) sendMessage(Message msg)：发送消息，添加到队列尾；\n6) sendMessageAtFrontOfQueue(Message msg)：发送消息到队列头，优先级很高。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.2 Handler分析","q":"sendMessage的调用链是什么？","a":"sendMessage(msg)→sendMessageDelayed(msg,0)（delayMillis小于0则置0）→sendMessageAtTime(msg,SystemClock.uptimeMillis()+delayMillis)（把相对时间换算成绝对时间uptimeMillis）。sendMessageAtTime中取mQueue，若queue不为null，则msg.target=this把Message的target设置为自己，然后sent=queue.enqueueMessage(msg,uptimeMillis)加入消息队列。Handler把target设为自己，是因为它除封装消息添加外还封装了消息处理的接口。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.2 Handler分析","q":"dispatchMessage定义的消息处理优先级是什么？","a":"dispatchMessage(msg)三级优先：\n1) 若Message本身带了callback（msg.callback!=null，如post的Runnable），则直接交给Message的callback处理（handleCallback(msg)）；\n2) 否则若本Handler设置了全局mCallback（构造时传入的Callback），则交给mCallback处理，mCallback.handleMessage(msg)返回true则结束；\n3) 上述都没有，才交给Handler子类重载的handleMessage(msg)处理。\n通常情况下我们一般采用第三种方法：从Handler派生并重载handleMessage来完成处理工作。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.3 Looper和Handler的同步关系","q":"跨线程创建Handler时myLooper为null的问题是怎么回事？","a":"例：线程1创建线程2（LooperThread），线程2的run中Looper.prepare()后myLooper=Looper.myLooper()再Looper.loop()。线程1随即执行Looper looper=lpThread.myLooper; Handler thread2Handler=new Handler(looper)。问题：myLooper的创建在线程2中，而线程1立刻去取值，很可能线程2的run还没来得及给myLooper赋值，线程1取到的looper是初值null。另外Handler(looper)绝不能替换成new Handler(Looper.myLooper())——myLooper返回的是调用线程（线程1）的Looper，而不是想要的线程2的Looper。此问题需用同步方式解决，Android提供了HandlerThread。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.4 HandlerThread介绍","q":"HandlerThread如何解决myLooper可能为空的问题？","a":"HandlerThread extends Thread，用wait/notifyAll同步：\n1) getLooper()（线程1调用）：synchronized(this)中while(isAlive()&&mLooper==null){wait();}——新线程还没创建Looper则等待，再返回mLooper；\n2) run()（线程2）：Looper.prepare()在本线程创建Looper，synchronized(this)中mLooper=Looper.myLooper()后notifyAll()通知线程1，然后setThreadPriority(mPriority)、onLooperPrepared()回调，最后Looper.loop()进入消息循环。\n小小的wait/notifyAll解决难题，应多用HandlerThread避免重复发明轮子。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.4 HandlerThread介绍","q":"为什么说HandlerThread降低了消息线程的使用难度？","a":"自己实现带消息循环的线程需要：在线程run里Looper.prepare()、正确处理跨线程获取Looper的同步问题（wait/notify或类似机制）、再Looper.loop()进入循环，任何一处出错（如myLooper为null、错用Looper.myLooper取到别的线程的Looper）都会铸成大错。HandlerThread把prepare、同步暴露Looper、loop这一整套封装好，使用者只需start后调用getLooper()（保证拿到已创建好的Looper）创建Handler即可，降低了创建和使用带消息队列的线程的难度。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.5 题外话——三板斧的来历","q":"作者是如何在PC上调试RefBase/sp/wp的？","a":"RefBase、sp、wp代码量不大，但flags的引入令人眼花缭乱，而在设备上调试native代码要花很大精力，用log调试也很费时间。解决办法：把代码移植到台式机开发环境，用Visual Studio整一个类似的RefBase。Windows平台上有很直接的InterlockedExchangeXXX系列函数对应Android的原子操作；Linux平台上不考虑多线程时可换成普通非原子操作，更负责任的做法是用汇编实现常用原子操作（内核代码中有现成函数可参考）。方法论：破解代码如攻城略地，要灵活多变，力求破解方法日臻极致。"},{"ch":"第5章 · 深入理解常见类","sec":"5.5 本章小结","q":"第5章分析了哪些常见类？分属哪两层？","a":"Native层：\n1) 对象生命周期相关：RefBase（含影子对象weakref_impl）、sp、wp（三板斧：影子对象、由弱生强、破解生死魔咒/生命周期flags）、轻量级的LightRefBase；\n2) 多线程编程：Thread类（_threadLoop、canCallJava）及同步类Mutex/Autolock、Condition、原子操作函数android_atomic_xxx。\nJava层：使用最广泛的Handler类和Looper类（prepare/loop/ThreadLocal、消息队列、dispatchMessage优先级），以及HandlerThread——它降低了创建和使用带消息队列线程的难度。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.1 概述","q":"编写Activity或Service时为什么极少接触\"进程\"概念？","a":"这是Google有意为之：程序运行时一定要有进程，但编写Activity、Service时极少接触到\"进程\"概念，而它们又不能脱离进程而存在。这个进程由ActivityManagerService发请求给zygote、由zygote通过fork创建，进程入口是android.app.ActivityThread类的main函数，开发者通常无需感知。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.2.2 Welcome to Java World","q":"ZYGOTE_FORK_MODE的作用是什么？","a":"ZygoteInit.main中：if(ZYGOTE_FORK_MODE) runForkMode(); else runSelectLoopMode();。ZYGOTE_FORK_MODE被定义为false，所以zygote走runSelectLoopMode分支——用select多路复用监听Socket，接受客户端连接并处理请求，而不是为每个请求单独fork的模式。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.3.1 SystemServer的诞生","q":"forkAndSpecializeCommon做了什么？","a":"forkSystemServer的native实现先调用forkAndSpecializeCommon(args)：从args取出uid、gid、gids、debugFlags、rlimits；fork前调用setSignalHandler()设置SIGCHLD信号处理函数sigchldHandler；然后pid=fork()创建子进程；在pid==0的子进程分支中根据传入参数做处理，例如设置进程名、设置各种id（用户id、组id）等，即fork+specialize（分化）。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.4.1 ActivityManagerService发送请求","q":"startProcessLocked中debugFlags是如何确定的？","a":"ActivityManagerService.startProcessLocked中，根据系统属性设置调试标志：若SystemProperties.get(\"debug.checkjni\")为\"1\"，则debugFlags|=Zygote.DEBUG_ENABLE_CHECKJNI；若SystemProperties.get(\"debug.assert\")为\"1\"，则debugFlags|=Zygote.DEBUG_ENABLE_ASSERT。该debugFlags随后通过Process.start传给zygote，fork时作用于新进程。"},{"ch":"第4章 · 深入理解Zygote","sec":"4.5.3 Watchdog分析","q":"Watchdog的检查线程如何与Watchdog线程配合？","a":"Watchdog.run在watchdog线程中执行，而HeartbeatHandler的消息处理在另一个线程（持有Service的线程）上。watchdog线程sendEmptyMessage(MONITOR)向那个线程的消息队列发检查请求，然后wait(timeout)等待；HeartbeatHandler.handleMessage在该线程中逐个调用各Service的monitor()，全部通过则置mCompleted=true。watchdog线程醒来检查mCompleted，两次检查（waitedHalf机制）都失败才杀SS，且Debug.isDebuggerConnected()时（调试器连接）不会杀。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"C++的内部类（nested class）与Java内部类有何不同？","a":"weakref_impl从RefBase的内部类weakref_type派生。Android频繁使用C++内部类，初次阅读可能不习惯：C++的内部类学名叫nested class（内嵌类），与Java内部类相似，但有一点不同——C++内部类对象需要一个显式的成员指向外部类对象，而Java的内部类对象有一个隐式的成员指向外部类对象。weakref_impl的mBase成员即显式指向实际对象。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"onFirstRef、onLastStrongRef、onLastWeakRef分别是何时被调用的？","a":"onFirstRef()：第一次被强引用时调用——incStrong或attemptIncStrong中发现mStrong从INITIAL_STRONG_VALUE转为1时，派生类可重载它完成初始化；\nonLastStrongRef(id)：强引用计数减为0时调用（decStrong中c==1分支、attemptIncStrong中途替换场景）；\nonLastWeakRef(id)：flags为OBJECT_LIFETIME_WEAK时弱引用计数减为0、实际对象将被delete前调用（decWeak的else分支中）。"},{"ch":"第5章 · 深入理解常见类","sec":"5.2.1 第一板斧——初识影子对象","q":"RefBase的析构函数为何没有delete掉影子对象？","a":"RefBase::~RefBase()中：if(mRefs->mWeak==0) delete mRefs;——只有弱引用计数为0时才删除影子对象。在第一板斧例子中sp析构触发delete this（实际对象灭亡）时，弱引用计数仍为1，所以RefBase的delete this自杀行为没有把影子对象干掉；随后decStrong继续执行refs->decWeak(id)，弱计数减为0后由decWeak中的delete impl把影子对象删掉。"},{"ch":"第5章 · 深入理解常见类","sec":"5.3.1 一个变量引发的思考","q":"Thread::run中创建线程的两个分支分别调用什么？","a":"Thread::run(name,priority,stack)中用Mutex::Autolock_l(mLock)加锁后：mCanCallJava为true时调用createThreadEtc(_threadLoop,this,name,priority,stack,&mThread)，它内部经androidCreateThreadEtc转发给函数指针gCreateThreadFn；mCanCallJava为false时直接调用androidCreateRawThreadEtc(_threadLoop,this,...)。初始时gCreateThreadFn==androidCreateRawThreadEtc，两分支相同；zygote的startReg将其换成javaCreateThreadEtc后，true分支才会attach JNI环境。"},{"ch":"第5章 · 深入理解常见类","sec":"5.4.2 Handler分析","q":"为什么Handler的mQueue要指向Looper的消息队列？","a":"Handler封装消息投递和消息处理：sendMessageAtTime中把msg.target=this后调用mQueue.enqueueMessage(msg,uptimeMillis)入队，这个mQueue就是目标Looper的消息队列。Looper.loop取出消息后调用msg.target.dispatchMessage(msg)派发回该Handler。队列共享保证了：任何线程通过Handler投递的消息都进入Looper所在线程的消息队列，由绑定线程统一取出、由该Handler处理——这就是Handler能实现跨线程消息传递的原因。"},{"ch":"第6章 · 深入理解Binder","sec":"6.1 概述","q":"Binder是什么？Android的C/S架构与Binder是什么关系？","a":"Binder是Android提供的一种IPC（进程间通信）机制。Android基于Linux内核，还存在管道、socket等其他IPC方式，Binder相对更灵活方便。Android系统基本上可以看作是一个基于Binder通信的C/S架构，Binder就像网络一样把系统各部分连接在一起。注意：Binder只是为C/S架构提供通信方式，业务也可以用Socket或Pipe等其他IPC方式通信。"},{"ch":"第6章 · 深入理解Binder","sec":"6.1 概述","q":"基于Binder的C/S架构中，Client、Server、ServiceManager三者是什么关系？","a":"除Client和Server外，还有一个全局的ServiceManager，负责管理系统中的各种服务：\n1) Server先注册Service到ServiceManager，故Server是其客户端；\n2) Client要先到ServiceManager获取Service信息，故Client也是其客户端；\n3) Client凭此信息与Server建立通路后直接交互，故Client也是Server的客户端；\n4) 三者交互都基于Binder，一个Server可注册多个Service。"},{"ch":"第6章 · 深入理解Binder","sec":"6.1 概述","q":"为什么很多人觉得Binder复杂（BpXXX/BnXXX头晕）？作者怎么提醒？","a":"很多初学者把Binder通信层结构和应用的业务层结构搞混了。Binder是通信机制，业务可以基于Binder通信也可以用别的IPC方式。搞清这两层关系后，完全可以自己实现一个不使用BpXXX和BnXXX的Service——ServiceManager就没有使用它们，而是直接与binder设备交互。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2 庖丁解MediaServer","q":"为什么选择MediaServer作为分析Binder的切入点？","a":"MediaServer（MS）是一个用C++编写的可执行程序，是系统诸多重要Service的栖息地：AudioFlinger（音频核心服务）、AudioPolicyService（音频策略）、MediaPlayerService（多媒体）、CameraService（摄像/照相）。除不涉及Surface系统外，其他重要服务基本都涉及。分析时以MediaPlayerService为主切入点。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.1 MediaServer入口","q":"MediaServer的main函数包含哪5个关键步骤？","a":"1) ProcessState::self()获得实例；\n2) defaultServiceManager()得到IServiceManager；\n3) 调用AudioFlinger、MediaPlayerService、CameraService、AudioPolicyService的instantiate()注册服务；\n4) startThreadPool()创建线程池；\n5) IPCThreadState::self()->joinThreadPool()主线程加入循环。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.2 ProcessState","q":"为什么说ProcessState是独一无二的？self()如何实现单例？","a":"每个进程只有一个ProcessState对象，它代表进程与Binder驱动的关联。self()采用单例模式：检查Static.cpp中定义的全局变量gProcess，不为空直接返回；为空则在互斥锁保护下new一个ProcessState赋给gProcess并返回。因此一个进程只打开一次binder设备。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.2 ProcessState","q":"ProcessState构造函数做了哪两件重要的事？","a":"1) 成员初始化时调用open_driver()打开/dev/binder设备，得到mDriverFD，建立与内核Binder驱动交互的通道；\n2) 若fd有效，调用mmap(0, BINDER_VM_SIZE, PROT_READ, MAP_PRIVATE|MAP_NORESERVE, mDriverFD, 0)进行内存映射，Binder驱动会分配一块内存来接收数据。其中BINDER_VM_SIZE定义为(1*1024*1024)-(4096*2)，即1M-8K。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.2 ProcessState","q":"open_driver函数做了什么？","a":"open_driver()调用open(\"/dev/binder\", O_RDWR)打开/dev/binder设备——这是Android在内核中为完成进程间通信而专门设置的虚拟设备；打开成功后通过ioctl(fd, BINDER_SET_MAX_THREADS, &maxThreads)告诉binder驱动该fd支持的最大线程数为15。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.2 ProcessState","q":"总结ProcessState::self()的作用？","a":"1) 打开/dev/binder设备，相当于与内核的Binder驱动建立了交互通道；\n2) 对返回的fd使用mmap，使Binder驱动分配一块内存来接收数据；\n3) 由于ProcessState具有唯一性（单例），一个进程只打开设备一次。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 defaultServiceManager","q":"defaultServiceManager的核心实现是什么？","a":"它也是单例：检查全局变量gDefaultServiceManager，为空时在锁保护下执行：\ngDefaultServiceManager = interface_cast<IServiceManager>(ProcessState::self()->getContextObject(NULL));\n其中getContextObject(NULL)传参为0（NULL），最终返回一个IServiceManager对象，通过它可以与另一个进程ServiceManager交互。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 defaultServiceManager","q":"ProcessState::getContextObject(NULL)返回什么？","a":"supportsProcesses()根据openDriver是否成功打开设备判断是否支持process（真实设备支持）。支持时调用getStrongProxyForHandle(0)，即根据handle=0创建代理。getStrongProxyForHandle先通过lookupHandleLocked查找handle对应的资源项（handle就像资源数组中的索引），没有则创建新项，项的binder为空时new一个BpBinder(handle)填入并返回。最终返回BpBinder(0)。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 BpBin
