der/BBinder","q":"BpBinder和BBinder分别代表什么？二者关系如何？","a":"BpBinder和BBinder都是从IBinder派生的与Binder通信相关的类：\n1) BpBinder是客户端用来与Server交互的代理类，p即Proxy；\n2) BBinder是与proxy相对的一端，是proxy交互的目的端，代表服务端；\n3) 二者一一对应，某个BpBinder只能和对应的BBinder交互，通过handle来标识对应的BBinder端。\n它们都没有直接操作/dev/binder设备，真正的通信工作另有机关（IPCThreadState）。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 BpBinder/BBinder","q":"handle=0在Binder系统中有什么特殊含义？","a":"在defaultServiceManager中创建BpBinder时传的handle值为0。0在整个Binder系统中有重要含义——0代表的就是ServiceManager所对应的BBinder。后续ProcessState::getContextObject的getStrongProxyForHandle(0)即创建指向ServiceManager的代理。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 BpBinder","q":"BpBinder的构造函数做了什么？","a":"BpBinder(int32_t handle)保存mHandle(handle)，初始化mAlive(1)、mObitsSent(0)、mObituaries(NULL)，调用extendObjectLifetime(OBJECT_LIFETIME_WEAK)（弱引用生命周期），并调用IPCThreadState::self()->incWeakHandle(handle)。收到transact返回DEAD_OBJECT时会把mAlive置0。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 interface_cast","q":"interface_cast是强制指针类型转换吗？它到底是什么？","a":"不是指针转换，只是障眼法模板函数：\ninterface_cast<INTERFACE>(obj){ return INTERFACE::asInterface(obj); }\n即interface_cast<IServiceManager>(obj)等价于IServiceManager::asInterface(obj)。它并不是把BpBinder*转成IServiceManager*，而是以BpBinder对象为参数new了一个BpServiceManager对象。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 IServiceManager","q":"IServiceManager如何定义业务逻辑？DECLARE_META_INTERFACE宏声明了什么？","a":"IServiceManager从IInterface派生，声明了getService、checkService、addService等纯虚业务函数。DECLARE_META_INTERFACE(ServiceManager)宏声明：1) static const String16 descriptor；2) static asInterface(const sp<IBinder>& obj)；3) virtual getInterfaceDescriptor()；4) 构造和析构函数。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 IServiceManager","q":"IMPLEMENT_META_INTERFACE宏做了什么？IServiceManager如何使用？","a":"IMPLEMENT宏定义DECLARE声明的内容。用法一行：IMPLEMENT_META_INTERFACE(ServiceManager, \"android.os.IServiceManager\")。展开后：1) 定义descriptor为该字符串；2) 实现getInterfaceDescriptor返回它；3) 实现asInterface：obj非空时先queryLocalInterface(descriptor)取本地实现，取不到则new BpServiceManager(obj)。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 IServiceManager","q":"IServiceManager家族中各类的派生关系和要点是什么？","a":"1) IServiceManager、BpServiceManager、BnServiceManager都与业务逻辑相关；\n2) BnServiceManager同时从IServiceManager和BBinder派生，可直接参与Binder通信，它是虚类，业务函数需子类实现；\n3) BpServiceManager从BpInterface派生，与BpBinder没有直接血缘；\n4) 注意ServiceManager本身没用这些派生关系，直接打开Binder设备交互。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 BpServiceManager/BpRefBase","q":"BpServiceManager如何与Binder通信关联起来？mRemote是什么？","a":"BpServiceManager的构造函数以sp<IBinder> impl为参调用基类BpInterface<IServiceManager>(impl)，BpInterface又调用基类BpRefBase(remote)。BpRefBase构造中mRemote(o.get())，即mRemote最终等于new出来的BpBinder(0)，并对mRemote incStrong/createWeak。所以BpServiceManager通过成员mRemote指向BpBinder，借助它通信。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.3 defaultServiceManager","q":"defaultServiceManager分析完后得到哪两个关键对象？","a":"1) 一个BpBinder对象，它的handle值是0（代表ServiceManager端）；\n2) 一个BpServiceManager对象，它的mRemote指向那个BpBinder。\nBpServiceManager实现了IServiceManager的业务函数，BpBinder作为通信的代表，业务与通信就此挂钩。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 注册MediaPlayerService","q":"MediaPlayerService::instantiate做了什么？体现了业务层的什么工作原理？","a":"instantiate()调用defaultServiceManager()->addService(String16(\"media.player\"), new MediaPlayerService())，实际由BpServiceManager执行。业务层的工作原理：将请求信息打包后交给通信层处理——addService是业务层函数，它把数据打包进Parcel后传给BpBinder的transact，通信工作交给了BpBinder。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 addService与Parcel","q":"BpServiceManager::addService如何打包数据并发送？","a":"1) 创建Parcel data和reply；\n2) writeInterfaceToken写入接口描述符；\n3) writeString16(name)写服务名；\n4) writeStrongBinder(service)写服务Binder；\n5) remote()->transact(ADD_SERVICE_TRANSACTION, data, &reply)，remote即BpBinder；\n6) reply.readInt32()取结果。业务层就是把请求打包后交给通信层。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 BpBinder::transact","q":"BpBinder::transact做了什么？","a":"BpBinder中没有直接与binder设备交互的代码，它把transact工作交给IPCThreadState：if(mAlive){ status = IPCThreadState::self()->transact(mHandle, code, data, reply, flags); if(status==DEAD_OBJECT) mAlive=0; return status; }否则返回DEAD_OBJECT。mHandle作为参数传递，用于标识通信目的端。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 IPCThreadState","q":"为什么说IPCThreadState是\"劳者一份\"？它如何利用TLS实现？","a":"\"劳者\"是线程，每个线程一份IPCThreadState。self()利用TLS（Thread Local Storage，线程本地存储，每线程都有且不共享，用pthread_getspecific/pthread_setspecific存取）：gHaveTLS时从TLS取对象，取到直接返回，否则new一个（构造函数会pthread_setspecific放入TLS）；首次调用先用pthread_key_create创建key（gTLS）。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 IPCThreadState","q":"IPCThreadState的构造函数初始化了哪些成员？mIn/mOut是什么？","a":"构造函数：mProcess(ProcessState::self())、mMyThreadId(androidGetTid())，并调用pthread_setspecific(gTLS, this)把自己放入TLS，clearCaller()清空调用者信息。mIn和mOut是两个Parcel，可看成发送和接收命令的缓冲区，容量均为256：mIn用来接收来自Binder设备的数据，mOut用来存储发往Binder设备的数据。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 IPCThreadState::transact","q":"IPCThreadState::transact的流程是什么？BC_和BR_消息码是什么？","a":"流程：先data.errorCheck()检查，flags |= TF_ACCEPT_FDS，然后writeTransactionData(BC_TRANSACTION, flags, handle, code, data, NULL)写请求，再waitForResponse(reply)等回复。BC_开头是应用程序向binder设备发消息的消息码，BR_开头是binder设备向应用程序回复的消息码，定义在binder_module.h中，二者对应关系需查看Binder驱动实现。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 writeTransactionData","q":"writeTransactionData做了什么？binder_transaction_data结构填充哪些字段？","a":"填充与binder设备通信的binder_transaction_data tr：tr.target.handle=handle（0代表ServiceManager）；tr.code=code；tr.flags=binderFlags；再填tr.data_size、tr.data.ptr.buffer、tr.offsets_size、tr.data.ptr.offsets。最后mOut.writeInt32(cmd)和mOut.write(&tr)写入mOut，只是写入并不直接发出。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 waitForResponse","q":"waitForResponse的工作流程是什么？","a":"在一个while(1)循环中：1) 调用talkWithDriver()与驱动交互，出错则退出；2) 检查mIn，无数据则continue；3) cmd = mIn.readInt32()读出消息码，switch处理：BR_TRANSACTION_COMPLETE时若不需要reply/acquireResult则finish结束；其他消息交给default分支的executeCommand(cmd)处理；出错时设置reply错误并返回err。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 executeCommand","q":"executeCommand处理BR_TRANSACTION时如何把请求递交给业务层？","a":"从mIn读出binder_transaction_data tr。若tr.target.ptr非空，则sp<BBinder> b((BBinder*)tr.cookie)——BnServiceXXX从BBinder派生，b就是实现BnServiceXXX的业务层对象，调b->transact(tr.code, buffer, &reply, 0)直接定位到业务层；否则调全局变量the_context_object->transact(...)（可用setTheContextObject设置）。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 executeCommand","q":"executeCommand中BR_DEAD_BINDER和BR_SPAWN_LOOPER分别如何处理？","a":"BR_DEAD_BINDER：收到驱动发来的service死掉的消息（只有Bp端能收到），从mIn读出BpBinder* proxy，调proxy->sendObituary()发讣告，然后mOut写入BC_DEAD_BINDER_DONE和proxy回复驱动。BR_SPAWN_LOOPER：收到驱动的指示，调mProcess->spawnPooledThread(false)创建新线程与Binder通信。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.4 talkWithDriver","q":"talkWithDriver如何与binder设备交互？binder_write_read结构如何填充？","a":"不是read/write而是ioctl。填充binder_write_read bwr：write_size=mOut.dataSize()，write_buffer=mOut.data()；需接收时read_size=mIn.dataCapacity()，read_buffer=mIn.data()，收到的数据直接填进mIn。然后ioctl(mDriverFD, BINDER_WRITE_READ, &bwr)，再按write_consumed清mOut、read_consumed设mIn。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.5 startThreadPool","q":"ProcessState::startThreadPool和spawnPooledThread做了什么？","a":"startThreadPool()检查mThreadPoolStarted标志，未启动则置true并调用spawnPooledThread(true)（注意isMain为true），已启动则无实质作用。spawnPooledThread(isMain)：线程池已启动时，用android_atomic_add递增mThreadPoolSeq得到序号，sprintf线程名\"Binder Thread#%d\"，new一个PoolThread(isMain)并t->run(buf)启动。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.5 PoolThread","q":"PoolThread是什么？它的threadLoop做什么？","a":"PoolThread是在IPCThreadState.h中定义的Thread子类，保存mIsMain标志。它的线程函数threadLoop()非常简单：调用IPCThreadState::self()->joinThreadPool(mIsMain)——即在这个新线程中又创建一个IPCThreadState（每个线程一份），然后加入循环处理；返回false使线程函数结束。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.5 joinThreadPool","q":"IPCThreadState::joinThreadPool的流程是什么？BC_ENTER/BC_REGISTER/BC_EXIT_LOOPER有什么区别？","a":"1) mOut.writeInt32(isMain ? BC_ENTER_LOOPER : BC_REGISTER_LOOPER)，主线程发BC_ENTER，新线程发BC_REGISTER；\n2) do循环：处理弱引用和已死亡的BBinder对象，talkWithDriver()发送命令读取请求，从mIn读cmd交给executeCommand处理；\n3) 直到-ECONNREFUSED或-EBADF退出；\n4) 退出前发BC_EXIT_LOOPER并talkWithDriver(false)。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.5 线程服务","q":"MediaServer中到底有几个线程在为Service服务？","a":"两个：1) startThreadPool中新启动的线程通过joinThreadPool读取binder设备查看是否有请求；2) 主线程也调用joinThreadPool读取binder设备。说明binder设备支持多线程操作，其中一定做了同步方面的工作。MS注册了4个服务，繁忙时两个线程可能偏少；若服务负担不重，完全可以不调用startThreadPool，仅用主线程即可胜任。"},{"ch":"第6章 · 深入理解Binder","sec":"6.2.6 彻底明白了吗","q":"如何总结Binder通信层和业务层的关系？","a":"1) Binder是通信机制；\n2) 业务可以基于Binder通信，当然也可以使用别的IPC方式通信。\nBinder之所以复杂，重要原因之一在于Android通过层层封装，巧妙地把通信和业务融合在了一起。透彻理解这一点后，Binder就较为简单了。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.1 ServiceManager原理","q":"ServiceManager有什么特别之处？它为什么没有使用BpXXX/BnXXX封装？","a":"按照IServiceManager家谱，应该有一个从BnServiceManager派生的类处理请求，但源码中没有这样的类，而是由一个独立的程序ServiceManager（Service_manager.c）完成了BnServiceManager未尽的工作。这说明我们确实可以抛开那些封装，直接与binder设备打交道。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.1 ServiceManager","q":"ServiceManager的main函数有哪三个关键步骤？","a":"1) bs=binder_open(128*1024)——打开binder设备并映射128K内存；\n2) binder_become_context_manager(bs)——成为context manager；\n3) binder_loop(bs, svcmgr_handler)——循环处理客户端请求。\n其中svcmgr=BINDER_SERVICE_MANAGER，值为NULL，是magic number。（这些函数实现在Binder.c，不是前文的Binder.cpp）"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.1 ServiceManager","q":"ServiceManager的binder_open做了什么？","a":"binder_open(unsigned mapsize)：malloc一个binder_state结构，bs->fd=open(\"/dev/binder\", O_RDWR)打开设备，bs->mapsize=mapsize，bs->mapped=mmap(NULL, mapsize, PROT_READ, MAP_PRIVATE, bs->fd, 0)做内存映射。与ProcessState一样是打开设备加内存映射，ServiceManager传入的mapsize是128*1024即128K。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.1 ServiceManager","q":"binder_become_context_manager如何让ServiceManager成为老大？","a":"实现非常简单：return ioctl(bs->fd, BINDER_SET_CONTEXT_MGR, 0); 通过BINDER_SET_CONTEXT_MGR命令向驱动注册自己为context manager，从而使自己成为系统中独一无二的manager（handle为0的那个特殊节点）。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.1 ServiceManager","q":"binder_loop是如何\"死磕\"binder设备的？","a":"先readbuf[0]=BC_ENTER_LOOPER并通过binder_write发送，告诉驱动进入循环；然后for(;;)无限循环：设置bwr的read_size/read_buffer（readbuf），ioctl(bs->fd, BINDER_WRITE_READ, &bwr)读取请求，再调binder_parse(bs, 0, readbuf, bwr.read_consumed, func)解析，最终通过函数指针func（svcmgr_handler）处理请求。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.1 svcmgr_handler","q":"svcmgr_handler如何分发处理各请求？SVC_MGR_*有哪些？","a":"校验target和svcmgr_id后按txn->code分case：\n1) SVC_MGR_GET_SERVICE/CHECK_SERVICE：do_find_service查服务名，找到则bio_put_ref；\n2) SVC_MGR_ADD_SERVICE：取服务名和bio_get_ref(msg)，调do_add_service(s, len, ptr, uid)；\n3) SVC_MGR_LIST_SERVICES：遍历svclist返回服务名；default返回-1。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.2 服务的注册","q":"do_add_service的基本流程和参数限制是什么？","a":"先检查ptr非空且0<len<=127（服务名不能超过127），再查svc_can_register(uid, s)权限。然后find_svc查找：已存在且si->ptr非空返回-1，否则填si->ptr；不存在则malloc一个svcinfo保存ptr、len、name，设si->death.func=svcinfo_death，插入svclist链表头。最后binder_acquire和binder_link_to_death——服务进程退出时ServiceManager会收到通知做清理。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.2 svc_can_register","q":"svc_can_register如何进行权限控制？allowed数组的作用？","a":"uid为0（root）或AID_SYSTEM（system）时直接允许；否则遍历allowed数组，仅当uid和服务名都匹配时返回1，否则拒绝。allowed内容如{AID_MEDIA,\"media.audio_flinger\"}、{AID_MEDIA,\"media.player\"}、{AID_MEDIA,\"media.camera\"}、{AID_MEDIA,\"media.audio_policy\"}及若干{AID_RADIO,...}项。权限不够的Server需在allowed中添加相应项。"},{"ch":"第6章 · 深入理解Binder","sec":"6.3.3 ServiceManager意义","q":"ServiceManager存在的意义（重要作用）是什么？","a":"1) 能集中管理系统内的所有服务，并能施加权限控制，并不是任何进程都能注册服务；\n2) 支持通过字符串名称来查找对应的Service，功能很像DNS；\n3) Server进程可能生死无常，若让每个Client都去检测压力太大；有了统一管理机构后，Client只需查询ServiceManager就能把握动向，得到最新信息——这可能是ServiceManager存在的最大意义。"},{"ch":"第6章 · 深入理解Binder","sec":"6.4.1 查询ServiceManager","q":"Client如何获取MediaPlayerService？getService失败时怎么处理？","a":"以IMediaDeathNotifier::getMediaPlayerService()为例：先defaultServiceManager()得到BpServiceManager，然后do-while循环调sm->getService(String16(\"media.player\"))，若binder为0（服务未注册）则usleep(500000)即0.5秒后重试，直到注册为止；拿到binder（BpBinder）后经interface_cast转成BpMediaPlayerService。"},{"ch":"第6章 · 深入理解Binder","sec":"6.4.1 getService","q":"getService返回的binder是什么？其handle标识谁？","a":"getService与ServiceManager通信后返回一个能够与MediaPlayerService通信的BpBinder，再通过障眼法interface_cast转成BpMediaPlayerService。这个binder中的handle值标识的正是目的端MediaPlayerService。之后调用业务函数（如createMediaRecorder、createMetadataRetriever）都会把请求数据打包发给Binder驱动，由handle找到对应端的处理者处理。"},{"ch":"第6章 · 深入理解Binder","sec":"6.4.2 子承父业","q":"从请求到达到业务层处理的完整路径是什么？","a":"MediaServer中有两个线程talkWithDriver，某线程收到请求后由executeCommand处理BR_TRANSACTION：从tr.cookie取得BBinder对象b（BnServiceXXX从BBinder派生，b即业务层对象），调b->transact(tr.code, buffer, &reply, 0)。BBinder::transact中code为PING_TRANSACTION时回复pingBinder()，否则调虚函数onTransact交给子类处理。"},{"ch":"第6章 · 深入理解Binder","sec":"6.4.2 BnMediaPlayerService","q":"BnMediaPlayerService::onTransact如何处理请求？CHECK_INTERFACE的作用？","a":"按消息码switch/case。如CREATE_MEDIA_RECORDER：CHECK_INTERFACE(IMediaPlayerService, data, reply)校验接口描述符；data.readInt32()解析pid；调createMediaRecorder(pid)（由子类MediaPlayerService实现）；reply->writeStrongBinder(recorder->asBinder())写入回复。default返回BBinder::onTransact。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5.1 Binder与线程","q":"Binder中请求与回复的线程对应关系是怎样的？为什么这样设计？","a":"Binder设备把发起请求的线程牢牢拴住，必须收到回复才会放它离开，即哪个线程发出的请求（如调用listServices的线程3），回复就由哪个线程收到（一一对应）。若允许其他线程收到回复再唤醒等待线程，线程等待、唤醒、切换会浪费大量时间片，代码逻辑也会极其复杂。对比socket：同一时刻不能有多个线程操作socket读写，否则数据会乱套；而binder设备支持多线程操作并做了同步。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5.1 BR_SPAWN_LOOPER","q":"BR_SPAWN_LOOPER消息的作用是什么？","a":"executeCommand中处理BR_SPAWN_LOOPER：收到来自Binder驱动的指示，调用mProcess->spawnPooledThread(false)创建一个新线程来和Binder通信。注意传参isMain为false，新线程发出的是BC_REGISTER_LOOPER。为什么驱动会发这个消息，需要研究Binder驱动的实现。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5.2 死亡通知-概念","q":"Binder的死亡通知机制（讣告）是什么？要收到讣告需要做哪两件事？","a":"在Binder系统中，若明确表示了对BnXXX生死的关心，在它\"离世\"后你会收到一份讣告（类比socket关闭时select/poll/epoll的返回通知）。要做两件事：1) 从IBinder::DeathRecipient派生一个类，实现通知函数binderDied——该函数一旦被调用就相当于收到了讣告；2) 把这个类注册到系统，通过binder->linkToDeath(sDeathNotifier)告诉系统你关心哪个BnXXX（对端BBinder）的生死。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5.2 死亡通知-流程","q":"死亡通知（讣告）是如何送达的？","a":"在IPCThreadState::executeCommand的BR_DEAD_BINDER分支：从mIn读出BpBinder* proxy（对应已经死亡的远端BBinder），调用proxy->sendObituary()——Obituary是讣告的意思，最终会传递到注册的DeathNotifier的binderDied中；然后mOut.writeInt32(BC_DEAD_BINDER_DONE)和mOut.writeInt32((int32_t)proxy)告知驱动处理完成。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5.2 死亡通知-处理","q":"收到讣告后如何处理？中途不想接收讣告怎么办？","a":"以MediaMetadataRetriever为例：DeathNotifier::binderDied(who)中加锁后调sService.clear()把自己保存的BpMediaPlayerService干掉，并打印server died的LOG。若DeathNotifier死在对端之前或中途变卦，在其析构函数中调sService->asBinder()->unlinkToDeath(this)，取消对BnMediaPlayerService生死的关心。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5.3 匿名Service","q":"什么是匿名Service？BpMediaPlayer如何得到BnMediaPlayer的handle？","a":"匿名Service就是没在ServiceManager上注册的Service，但确实是基于Binder的C/S结构：BpMediaPlayer由Client用，BnMediaPlayer由MediaPlayerService用。handle事关通信目的端——答案在reply->writeStrongBinder(player->asBinder())：reply写到驱动时，驱动会特殊处理IBinder类型数据，为该BBinder建立独一无二的handle，相当于在驱动中注册了一项服务。"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.1 纯Native Service-main","q":"如何编写一个纯Native的Service（以Test为例）？main框架怎么写？","a":"模仿MediaServer的main：\n{\n ProcessState::self();\n defaultServiceManager();\n sm->addService(\"service.name\", new Test()); //必须注册\n ProcessState::self()->startThreadPool(); //可选\n IPCThreadState::self()->joinThreadPool(); //必须，否则主线程退出\n}"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.1 纯Native Service-ITest","q":"纯Native Service的ITest接口如何定义？","a":"ITest是接口类，需要从IInterface派生，并使用神奇的宏DECLARE_META_INTERFACE(Test)声明asInterface等；然后声明纯虚业务函数如virtual void getTest()=0、virtual void setTest()=0。跨进程C/S要求本地有BnTest，对端提供代理BpTest；为不暴露Bp的身份，Bp的定义和实现都放在BnTest.cpp（ITest.cpp）中——可以暴露但没有必要，因为客户端用的是基类ITest指针。"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.1 纯Native Service-BnTest/BpTest","q":"BnTest和BpTest如何定义和实现？","a":"BnTest继承BnInterface<ITest>，只实现onTransact；因ITest纯虚，BnTest也纯虚，业务由子类Test完成，用IMPLEMENT_META_INTERFACE(Test, ...)展开宏，onTransact中CHECK_INTERFACE后调getTest()。BpTest继承BpInterface<ITest>，打包Parcel后remote()->transact(GET_Test, data, &reply)。"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.2 AIDL-接口定义","q":"Java层使用Binder通信时，aidl文件如何编写？in/out是什么含义？","a":"在Java层定义类似ITest的接口，即aidl文件（如ITest.aidl）：package声明、import复杂类型后声明方法。参数方向标注很重要：in表示输入参数，out表示输出参数（如int getTest(out complicatedDataStructure); int setTest(in String name, in boolean reStartServer);），in和out一定要准确。Eclipse编译会在gen目录下生成ITest.java。"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.2 AIDL-服务端","q":"AIDL生成的Java文件与服务端实现如何配合？","a":"aidl工具生成的com.test.ITest.java实现了类似BnTest的东西。具体业务实现类必须从ITest.Stub派生：class ITestImpl extends ITest.Stub，在其中实现getTest、setTest等业务函数（抛出RemoteException）。ITest.Stub是在aidl生成的Java文件中定义的，非常类似Native层的BnTest。此时Eclipse的src下有自己的包目录，gen下有aidl工具生成的包目录。"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.2 AIDL-客户端","q":"AIDL客户端如何获得代理对象（BpTest）？","a":"把服务端工程gen下的包目录复制到client工程（其中仅有aidl生成的Java文件）。服务端一般驻留于Service进程，客户端在ServiceConnection的onServiceConnected中获得代理（这是比较合适的位置，但不一定）：if(ITestProxy == null) ITestProxy = ITest.Stub.asInterface(service);——通过ITest.Stub.asInterface就得到了BpTest。"},{"ch":"第6章 · 深入理解Binder","sec":"6.6.2 Parcelable","q":"AIDL跨进程传递复杂数据结构时，自定义类必须满足哪三个要求？","a":"以complicatedDataStructure为例：\n1) 必须implements Parcelable接口（实现writeToParcel、readFromParcel等）；\n2) 内部必须有静态的CREATOR类（含createFromParcel和用于数组的newArray）；\n3) 定义complicatedDataStructure.aidl（package加parcelable声明），并在使用它的aidl中import该类。\nAIDL本身只支持简单类型与String。"},{"ch":"第6章 · 深入理解Binder","sec":"6.5 拓展思考","q":"Binder驱动的代码位置和调试手段？","a":"Binder的驱动代码在kernel/drivers/staging/android/binder.c（该目录下还有binder.h头文件）。Binder是一个虚拟设备，代码相对简单，有基本的Linux驱动开发知识就能读懂。/proc/binder目录下的内容可用来查看Binder设备的运行状况。本章许多深入问题（BR_SPAWN_LOOPER触发条件、writeStrongBinder时驱动建立handle等）都需要从驱动的实现中寻找答案。"},{"ch":"第6章 · 深入理解Binder","sec":"6.7 本章小结","q":"本章对Binder的分析脉络是怎样的？","a":"1) 以MediaServer为切入点，讲Android如何层层封装集成Binder（ProcessState、IPCThreadState等）；\n2) 介绍ServiceManager（打开设备、成为context manager、binder_loop）；\n3) 分析MediaPlayerService如何处理客户端请求；\n4) 拓展思考讨论Binder与线程、死亡通知、匿名Service；\n5) 学以致用：纯Native Service与AIDL。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.1 概述","q":"Android Audio系统主要包括哪三方面内容？","a":"①AudioRecord和AudioTrack：Audio系统对外提供的API类，分别完成音频数据的采集和输出；②AudioFlinger（AF）：Audio系统的工作引擎，管理输入输出音频流，承担混音及读写Audio硬件等工作；③AudioPolicyService（AP）：Audio系统的策略控制中心，掌管声音设备的选择与切换、音量控制等功能。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.1 概述","q":"本书破解Audio系统采取的战略步骤是什么？","a":"①从API类AudioTrack开始，从Java层到Native层一步步了解其工作原理，暂时只关注AudioTrack的流程；②提炼AudioTrack和AudioFlinger的交互流程，以此为突破口分析AF；③在分析AudioPolicyService时消灭剩余问题，并通过耳机插入事件实例理解AP的工作流程；④最后在拓展部分介绍AudioFlinger中DuplicatingThread的工作原理。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"AudioTrack Java API使用的典型五步流程是什么？","a":"①调用AudioTrack.getMinBufferSize(8000,双声道,PCM16BIT)根据音频数据特性确定最小缓冲区大小；②new AudioTrack(...)创建对象，传入流类型STREAM_MUSIC、采样率、声道、精度、bufsize和数据加载模式MODE_STREAM；③调用play()开始播放；④调用write(bytes_pkg,0,len)往track中写数据；⑤调用stop()停止播放，再调用release()释放底层资源。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"AudioTrack的MODE_STREAM模式有什么特点？","a":"MODE_STREAM下通过write一次次把音频数据写到AudioTrack中，类似往文件write。这种工作方式每次都需要把数据从用户提供的Buffer拷贝到AudioTrack内部Buffer中，在一定程度上会引起延时。它是相对更常见、也更复杂的模式，书中分析以它为主。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"AudioTrack的MODE_STATIC模式有什么特点和适用场景？","a":"MODE_STATIC下在play之前只需把所有数据通过一次write调用传递到AudioTrack的内部缓冲区，后续不必再传数据。适用于铃声这种内存占用量小、延时要求高的文件。缺点是一次write的数据不能太多，否则系统无法分配足够的内存存储全部数据。注意STATIC模式须先write写数据，再调用play。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"Android音频流类型（stream type）常见的有哪几种？划分依据是什么？","a":"常见的有STREAM_ALARM（警告声）、STREAM_MUSIC（音乐声）、STREAM_RING（铃声）、STREAM_SYSTEM（系统声音如低电提示、锁屏音）、STREAM_VOICE_CALL（通话声）。划分与音频数据本身无关（MUSIC和RING都可能是同一首MP3），也没有固定标准，它和Audio系统对音频的管理策略有关，用于设备选择和音量控制。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"getMinBufferSize的Java层实现做了哪些检查？为何要进Native层？","a":"Java层先检查参数：声道只支持单声道和双声道（channelCount为1或2）；音频精度只支持PCM8和PCM16；采样率须在4000~48000之间，否则返回ERROR_BAD_VALUE。然后调用native_get_min_buff_size进入Native层。因为除了简单计算外，还需查询硬件是否支持这些采样率和采样精度，所以必须进Native层访问Audio系统HAL对象的信息。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"音频系统中的Frame（帧）概念是什么？如何计算？","a":"Frame是用来直观描述数据量多少的单位，1单位Frame等于1个采样点的字节数×声道数（如PCM16双声道的1个Frame等于2×2=4字节）。之所以引入Frame，是因为1个采样点只针对一个声道，无法用独立单位表示全部声道一次采样的数据量。目前声卡驱动内部缓冲区也以Frame为单位分配和管理。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"native_get_min_buff_size计算最小缓冲大小的公式是什么？（上）","a":"先查硬件三值：afSamplingRate输出采样率、afFrameCount硬件内部缓冲帧数、afLatency延时。minBufCount=afLatency/((1000*afFrameCount)/afSamplingRate)，小于2取2；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.1 用例介绍","q":"native_get_min_buff_size计算最小缓冲大小的公式是什么？（下）","a":"minFrameCount=(afFrameCount*sampleRate*minBufCount)/afSamplingRate；minBuffSize=minFrameCount*(PCM16?2:1)*nbChannels。一般分配的缓冲取它的整数倍。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"Java层AudioTrack构造函数主要做了哪三件事？","a":"①调用audioParamCheck检查流类型、采样率、声道、精度、模式等参数是否合法；②调用audioBuffSizeCheck检查缓冲大小（bufferSizeInBytes来自getMinBufferSize，一般能通过）；③调用native_setup，并传入一个WeakReference<AudioTrack>弱引用，把Java对象与Native对象关联。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"native_setup的JNI实现中，STREAM和STATIC两种模式调用set时有何区别？","a":"两者都会创建Native AudioTrack对象并调用set。区别在共享内存参数：STREAM模式下sharedBuffer传0（实际使用的共享内存由AF创建）；STATIC模式下先调用lpJniStorage->allocSharedMem(buffSizeInBytes)创建共享内存，然后把lpJniStorage->mMemBase传给set。两者都传入audioCallback回调，并把threadCanCallJava设为true。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"JNI层如何把Native AudioTrack对象和Java AudioTrack对象关联起来？","a":"JNI层new出Native的AudioTrack对象指针后，调用env->SetIntField(thiz,javaAudioTrackFields.nativeTrackInJavaObj,(int)lpTrack)把它保存到Java对象的一个int变量中；lpJniStorage对象指针也以同样方式保存到Java对象的jniData字段。之后如play时用GetIntField取出指针直接调用，这是Android的常用技法。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"AudioTrackJniStorage辅助类的作用是什么？","a":"JNI层辅助类，保存共享内存和回调相关信息。成员有sp<MemoryHeapBase> mMemHeap、sp<MemoryBase> mMemBase两个重要共享内存对象、audiotrack_callback_cookie mCallbackData（保存audioTrack_class和audioTrack_ref）及mStreamType。其allocSharedMem方法先new一个MemoryHeapBase，再以它为参数new一个MemoryBase，用于STATIC模式数据缓冲。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"共享内存的原理是什么？Linux上一般如何创建进程间共享内存？","a":"进程的4GB内存空间是虚拟地址空间，OS通过内存映射把虚拟地址与物理内存建立对应关系。同一块物理内存页可以同时映射到进程A和进程B，A写入的数据B就能看见，即实现共享内存。Linux一般做法：进程A创建并打开文件得到fd，用mmap指定特定参数映射成内存映射文件；进程B打开同一文件得fd，也用mmap传递fd，A和B就共享了这块内存（文件也可以是设备文件）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"MemoryHeapBase的作用和构造过程是什么？","a":"基于Binder通信的类（客户端用BpMemoryHeapBase，服务端完成Bn端业务），用于创建一块ashmem共享内存。构造时：取系统内存页大小（一般4KB）并把size按页对齐；调用libcutils的ashmem_create_region创建共享内存（真实设备打开/dev/ashmem得fd，模拟器创建tmp文件）；再mapfd通过mmap得到内存地址。构造后mBase指向起始位置，mSize为大小，mFd为文件描述符。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"MemoryBase是何物？它与MemoryHeapBase如何配合？","a":"也是基于Binder通信的类（继承BnMemory），更简单，像辅助类，保存mHeap、mOffset、mSize，提供getMemory/getSize/getOffset/getHeap。用法：先new一个MemoryHeapBase分配整块共享内存，再以它为参数new一个MemoryBase指定offset和size。二者本质是分配一块跨进程共享内存并支持Binder交互。注意它们不提供同步对象，使用时需跨进程同步对象保护。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"Android的ashmem共享内存相比Linux一般文件共享方式有何改进？","a":"ashmem（anonymous shared memory）创建共享内存的原理与Linux打开文件创建共享内存类似，但ashmem设备驱动做了较大改进，例如增加了引用计数、延时分配物理内存的机制（真正使用时才分配内存）等。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"Java层play和write对应的JNI函数做了什么？","a":"play对应android_media_AudioTrack_start：从Java对象取出Native AudioTrack指针（GetIntField）后直接调用lpTrack->start()。write分PCM16和PCM8两个版本，最终都调writeToTrack：STREAM模式调pTrack->write()写数据；STATIC模式直接memcpy到sharedBuffer()->pointer()指向的共享内存（PCM8先转PCM16），所以STATIC要先write后play。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"Java层release/stop对应的JNI层释放流程是什么？","a":"release对应android_media_AudioTrack_native_release：先调用android_media_AudioTrack_native_finalize真正释放资源，再把之前保存在Java对象中的指针变量设置为零。finalize中取出Native AudioTrack指针，若存在则调用lpTrack->stop()并delete lpTrack调用其析构函数。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"Java空间使用Native AudioTrack的总结流程是什么？","a":"①new一个AudioTrack（使用无参构造函数）；②调用set函数传入Java层参数，并设置audiocallback回调函数；③调用start函数；④调用write函数写数据；⑤工作完毕调用stop；⑥最后delete Native对象。掌握精简流程能把注意力集中在关键点上，因为跨Java/Native、跨进程的封装再多，基本流程不变。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"Native AudioTrack的set函数主要做了什么？","a":"先做与AudioSystem相关的判断，再调AudioSystem::getOutput(streamType,sampleRate等)得到audio_io_handle_t类型的output，即AF工作线程索引号（AT一般使用MixerThread）；接着调createTrack建立与AF的关联；若设置了回调cbf（如audioCallback），则new AudioTrackThread(*this,threadCanCallJava)启动回调线程。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"audio_io_handle_t这个值的含义是什么？","a":"audio_io_handle_t是通过typedef定义的int类型，主要被AudioFlinger使用，用来表示内部工作线程的索引号。AF会根据情况创建几个工作线程，AudioSystem::getOutput根据流类型等参数最终选取一个合适的工作线程并返回它在AF中的索引号。该值的来历复杂，涉及AudioFlinger和AudioPolicyService。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"Native AudioTrack::createTrack做了哪些关键事情？","a":"①通过AudioSystem::get_audio_flinger()得到AF的Binder代理BpAudioFlinger；②调用audioFlinger->createTrack(...)发出跨进程请求，返回IAudioTrack对象（实际为BpAudioTrack），后续AT与AF的交互围绕IAudioTrack进行；③调用track->getCblk()取出AF创建的共享内存（STREAM模式下该内存由AF创建）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"createTrack中CB与buffers如何设置？","a":"把共享内存首地址static_cast为audio_track_cblk_t*存入mCblk，并设mCblk->out=1表示输出。STREAM模式设mCblk->buffers=(char*)mCblk+sizeof(audio_track_cblk_t)指向CB之后的数据区；STATIC模式buffers指向sharedBuffer，并调用stepUser更新数据位置。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"IAudioTrack在AT和AF之间起什么作用？","a":"IAudioTrack是联系AT和AF的关键纽带。AT通过AF的createTrack获得IAudioTrack（实际为BpAudioTrack代理），之后对它的start、stop等调用最终都会在AF端（由TrackHandle代理转发给Track）得到实现。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"audio_track_cblk_t（CB）对象的主要成员有哪些？（上）","a":"同步：Mutex lock和Condition cv（初始化为支持跨进程共享）。位置：volatile uint32_t user（当前写位置）、server（当前读位置）及userBase、serverBase（与user/server结合把线性缓冲当环形缓冲用）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"audio_track_cblk_t（CB）对象的主要成员有哪些？（下）","a":"数据：buffers指针、frameCount总帧数、frameSize、channels、sampleRate。播放控制：loopStart/loopEnd/loopCount。其他：volumeLR音量、flowControlFlag、out（AT为1，AudioRecord为0）、forceReady。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"audio_track_cblk_t提供哪些重要函数？","a":"stepUser(uint32_t frameCount)更新写位置；stepServer更新读位置；buffer(offset)返回可写空间起始位置；framesAvailable/framesAvailable_l返回还剩多少空间可写；framesReady返回是否有可读数据。这些函数是AT（生产者）和AF（消费者）协调步伐的关键。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"flowControlFlag的underrun和overrun分别是什么含义？","a":"对音频输出，flowControlFlag对应underrun：生产者提供数据速度跟不上消费者（音频输出设备）的速度，设备循环使用环形缓冲中的旧数据会听到重复声音（machinegun），一般处理是暂停输出等数据准备好再恢复。对音频输入，对应overrun：含义类似，但生产者变成音频输入设备，消费者变成Audio系统的AudioRecord。该参数在AT和AF中的具体作用需结合具体场景分析。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"AudioTrack支持哪两种数据输入方式（Push/Pull）？","a":"①Push方式：用户主动调用write把数据写（push）到AudioTrack，MediaPlayerService一般使用这种方式；②Pull方式：AudioTrackThread利用回调函数以EVENT_MORE_DATA为参数主动从用户那pull数据，ToneGenerator使用这种方式。Java应用的audioCallback收到EVENT_MORE_DATA时只把pBuff->size设为0，不真正提供数据，所以Java用例实际是Push模式。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"event_type枚举包含哪些事件？","a":"EVENT_MORE_DATA=0（需要更多数据）；EVENT_UNDERRUN=1（硬件低负荷）；EVENT_LOOP_END=2（打点播放到达终点）；EVENT_MARKER=3（数据使用警戒通知，setMarkerPosition设置，超过该值仅通知一次，类似Water Marker）；EVENT_NEW_POS=4（进度通知，setPositionUpdatePeriod设置，如每500帧通知一次）；EVENT_BUFFER_END=5（数据全部被消耗）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"AudioTrackThread和processAudioBuffer的作用是什么？（上）","a":"threadLoop仅调mReceiver.processAudioBuffer(this)。processAudioBuffer处理事件通知：数据用尽通知EVENT_UNDERRUN（server==frameCount即数据全用完时再通知EVENT_BUFFER_END，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"AudioTrackThread和processAudioBuffer的作用是什么？（下）","a":"并置flowControlFlag=1）；循环播放完毕通知EVENT_LOOP_END；超过警戒值通知EVENT_MARKER（仅一次）；按帧数进度通知EVENT_NEW_POS；最后循环obtainBuffer取可写缓冲、EVENT_MORE_DATA回调pull数据、releaseBuffer释放。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"processAudioBuffer如何处理Pull取数据？","a":"在do-while循环中：以mRemainingFrames设置audioBuffer.frameCount，调用obtainBuffer(&audioBuffer,1)得到一块可写缓冲；以EVENT_MORE_DATA回调mCbf从用户pull数据写入；对写入量做上限检查和PCM8转PCM16处理；最后releaseBuffer(&audioBuffer)释放缓冲，直到frames用完。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"Native AudioTrack::write的工作方式是什么？","a":"write仅在mSharedBuffer==0（STREAM模式）时可用。它循环处理：以帧为单位设置audioBuffer.frameCount，调用obtainBuffer从共享内存得到一块空闲数据块；把数据memcpy到audioBuffer（PCM8且非DIRECT时先转PCM16）；然后releaseBuffer更新写位置并触发消费者。即：数据传输就是memcpy，而生产者消费者的协调通过obtainBuffer与releaseBuffer完成。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"obtainBuffer和releaseBuffer与CB交互的三个关键调用是什么？","a":"①obtainBuffer先调cblk->framesAvailable()得可写空间大小，为0时用cblk->cv.waitRelative(cblk->lock,waitTimeMs)等待；②再调cblk->buffer(u)得可写空间首地址（u为当前写位置）；③releaseBuffer调cblk->stepUser(audioBuffer->frameCount)更新写位置。即framesAvailable判断可写空间、buffer得到起始地址、stepUser更新写位置。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"Native AudioTrack析构和stop做了什么？","a":"析构中若mStatus为NO_ERROR则先调stop（不调stop析构也会先stop），通知AudioTrackThread退出（requestExitAndWait），mAudioTrack.clear()释放IAudioTrack，最后flushCommands()发出残留IPC命令。stop()置mActive并cv.signal()唤醒等待，调IAudioTrack的stop（最终由AF端处理），清空循环播放设置，STATIC模式还调flush，并请求退出回调线程。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.1 AudioFlinger的诞生","q":"AudioFlinger驻留在哪个进程中？如何创建？","a":"AF驻留于MediaServer进程。Main_MediaServer.cpp的main函数中依次调用AudioFlinger::instantiate()和AudioPolicyService::instantiate()，二者都注册到ServiceManager。instantiate调用defaultServiceManager()->addService(String16(\"media.audio_flinger\"), new AudioFlinger())。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.1 AudioFlinger的诞生","q":"AudioFlinger构造函数做了什么？（上）","a":"AF继承BnAudioFlinger，构造时初始化mMasterVolume=1.0f、mMasterMute=false、mNextThreadId=0；调AudioHardwareInterface::create()创建代表Audio硬件的HAL对象mAudioHardware；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.1 AudioFlinger的诞生","q":"AudioFlinger构造函数做了什么？（下）","a":"mHardwareStatus置AUDIO_HW_INIT；若initCheck()==NO_ERROR，则setMode(MODE_NORMAL)、setMasterVolume(1.0f)、setMasterMute(false)，部分值通过Audio HAL设置到硬件。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.1 AudioFlinger的诞生","q":"AudioHardwareInterface的作用和主要接口是什么？（上）","a":"Audio硬件的HAL封装，工厂模式create，由厂商以动态库实现。核心是创建管理音频输出设备AudioStreamOut（openOutputStream，AF可write）和输入设备AudioStreamIn（openInputStream，AF可read）；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.1 AudioFlinger的诞生","q":"AudioHardwareInterface的作用和主要接口是什么？（下）","a":"还提供initCheck、setVoiceVolume、setMasterVolume、setMode（NORMAL/RINGTONE/IN_CALL）、setMicMute、setParameters/getParameters（key/value）、getInputBufferSize等。HAL层大大简化了应用层工作。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AT和AF交互的完整流程是什么？","a":"①AT调用createTrack，得到一个IAudioTrack对象；②AT调用IAudioTrack的start，表示准备写数据；③AT通过write写数据，这个过程与audio_track_cblk_t密切相关；④最后AT调用IAudioTrack的stop或delete IAudioTrack结束工作。这些调用最终都在AF端实现，所以分析AF可以从AF端入手。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioFlinger::createTrack的主要步骤是什么？","a":"①根据output索引调checkPlaybackThread_l找到对应PlaybackThread工作线程；②按AT进程pid查mClients，无则new一个Client(this,pid)加入（AF按pid标识Client）；③调thread->createTrack_l在工作线程中创建Track并加入mTracks；④new一个TrackHandle(track)包装返回。TrackHandle是Track的Proxy，支持Binder通信，这是典型的Proxy模式。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"为什么AF端需要TrackHandle？它与Track是什么关系？","a":"Track不基于Binder通信，不能接收远端进程请求；TrackHandle基于Binder通信，接收远端（AT）请求并转调Track对应函数，即Proxy模式。不让Track直接继承Binder框架，是因为其继承关系和工作已很复杂，再掺合Binder只会乱上添乱。TrackHandle被new后直接返回而AF不保存它，依赖Binder和RefBase的引用机制管理；AT端delete后触发其析构，调用mTrack->destroy()回收Track。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AF中Track的共享内存（含CB）是在哪里、如何创建的？（上）","a":"在TrackBase构造函数中：size=sizeof(audio_track_cblk_t)加数据缓冲大小frameCount*channelCount*sizeof(int16_t)（sharedBuffer为0时），调mCblkMemory=client->heap()->allocate(size)从Client的MemoryDealer分配共享内存；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AF中Track的共享内存（含CB）是在哪里、如何创建的？（下）","a":"取首地址static_cast为CB指针后，new(mCblk)audio_track_cblk_t()用placement new把CB建在共享内存首部，使AT、AF多进程可见；设frameCount、sampleRate、channels，STREAM模式清空数据区并置flowControlFlag=1。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"placement new在TrackBase中如何使用？","a":"然后执行new(mCblk)audio_track_cblk_t()，用placement new把CB对象创建在共享内存首部，使它能被AT、AF多个进程看见使用；随后设置frameCount、sampleRate、channels，STREAM模式还清空数据区（mBuffer=(char*)mCblk+sizeof(CB)）并置flowControlFlag=1。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"什么是placement new？Audio系统中哪里用到了它？","a":"new(内存地址)类构造函数()的写法是C++的placement new，含义是在括号指定的内存中创建对象（普通new只能在堆上创建，地址由系统分配）。AF的TrackBase构造函数中用new(mCblk)audio_track_cblk_t()把CB对象创建在共享内存首部，因此AT端拿到的共享内存首地址一转成audio_track_cblk_t*就有对象可用。析构时需显式调用mCblk->~audio_track_cblk_t()再delete内存。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioFlinger中的Client对象是什么？","a":"Client是AF对客户端进程的封装：凡使用AudioTrack或AudioRecord的进程都会被当作AF的Client，以进程pid标识。Client持有mAudioFlinger、mMemoryDealer（内存分配器，heap()返回它，TrackBase用它分配共享内存）和mPid。一个Client进程可以创建多个AudioTrack，它们都属于同一个Client。TrackBase析构时mClient.clear()，当强弱引用计数都为0时Client被delete回收。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioFlinger有哪几种工作线程？各自作用是什么？（上）","a":"①PlaybackThread：回放线程，用于音频输出，mOutput为AudioStreamOut*，直接与输出设备联系；②RecordThread：录音线程，用于音频输入，mInput为AudioStreamIn*。PlaybackThread三个子类：MixerThread混音线程，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioFlinger有哪几种工作线程？各自作用是什么？（下）","a":"多源数据混音后输出，最常用、负担最重；DirectOutputThread直接输出线程，选一路流直接输出不混音，延时小；DuplicatingThread多路输出线程，从MixerThread派生，混音后写到多个输出，用于蓝牙A2DP。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"PlaybackThread维护哪些Track数组？","a":"PlaybackThread维护两个Track数组：mActiveTracks表示当前活跃的Track，mTracks表示该线程创建的所有Track；DuplicatingThread还维护mOutputTracks，表示多路输出的目的端。大多数常见音频输出使用MixerThread。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread（AF中第一个混音线程）的来历是什么？（上）","a":"由APS间接创建：APS构造时创建AudioPolicyManagerBase，AMB构造中调mpClientInterface->openOutput(...)即APS的openOutput，后者转调AF的openOutput；AF先mAudioHardware->openOutputStream创建HAL输出对象，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread（AF中第一个混音线程）的来历是什么？（下）","a":"若flags含OUTPUT_FLAG_DIRECT或格式非PCM16或声道非立体声则建DirectOutputThread，否则建MixerThread并传入output；线程加入mPlaybackThreads，以mNextThreadId为索引返回。线程创建受APS控制，AP一创建完Audio系统即就绪。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"为什么AF只用一个MixerThread支持32路Track，而不是一线程一Track？","a":"如果用一个MixerThread对应一个Track，一方面非常难管理和控制，另一方面多线程比较浪费资源，而且AudioPolicyManagerBase仅用mHardwareOutput一个句柄不够用。现方案是一个MixerThread支持32路Track，多路数据通过AudioMixer混音对象在软件层面混音，极大简化了AMB的工作量——通过mHardwareOutput就能控制整个系统的声音。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread的构造和真正启动线程的过程是什么？（上）","a":"MixerThread构造：mType=MIXER，new一个AudioMixer(mFrameCount,mSampleRate)混音器对象。基类PlaybackThread构造：readOutputParameters()读输出HAL信息（如硬件缓冲帧数）；取mMasterVolume/mMasterMute；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread的构造和真正启动线程的过程是什么？（下）","a":"循环设置各流类型音量mStreamTypes；sendConfigEvent(OUTPUT_OPENED)。线程真正启动靠RefBase的onFirstRef：PlaybackThread::onFirstRef中run(buffer,ANDROID_PRIORITY_URGENT_AUDIO)，首次创建sp时触发。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"Track::start做了什么？addTrack_l中的mRetryCount和mFillingUpStatus是什么意思？（上）","a":"Track::start把mState设为RESUMING（原为PAUSED）或ACTIVE，再调playbackThread->addTrack_l(this)。addTrack_l中：mRetryCount=kMaxTrackStartupRetries（50），"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"Track::start做了什么？addTrack_l中的mRetryCount和mFillingUpStatus是什么意思？（下）","a":"解决start后不write数据的问题——MixerThread重试这么多次仍无可读数据就把该Track移出激活队列；mFillingUpStatus=FS_FILLING表示正在填充缓冲，此时除非AT设了强制读标志（CB的forceReady），否则工作线程不读该Track；最后加入mActiveTracks并mWaitWorkCV.broadcast()唤醒线程。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"mFillingUpStatus（FS_FILLING）是干什么的？","a":"mFillingUpStatus解决的问题是：分配了较大数据缓冲时，至少要写多少数据工作线程才认为AT真的需要它工作（不能AT写一个字节就兴师动众）。该状态最初为FS_FILLING表示正在填充数据缓冲，此状态下除非AT设置了强制读数据标志（CB中forceReady变量），否则工作线程不读该Track数据。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread::threadLoop主循环的工作流程是什么？（上）","a":"循环中：①processConfigEvents()处理配置请求和通知（如OUTPUT_OPENED、音量控制、设备切换）；②checkForNewParameters_l()检查参数，需要时重设mixBufferSize、maxPeriod；③调prepareTracks_l(activeTracks,&tracksToRemove)检查活跃Track数据是否就绪，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread::threadLoop主循环的工作流程是什么？（下）","a":"返回mixerStatus；④若MIXER_TRACKS_READY则mAudioMixer->process(curBuf)混音，sleepTime=0；⑤mOutput->write(curBuf,mixBufferSize)把混音结果写入HAL输出流（数据最终归宿）；否则usleep。退出前非standby则mOutput->standby()。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"混音结果最终写到哪？","a":"curBuf即mMixBuffer。sleepTime为0时调用mOutput->write(curBuf,mixBufferSize)把混音数据写入Audio HAL的OutputStream，这是音频数据的最终归宿（bytesWritten<0则回退计数）；否则usleep(sleepTime)。退出循环后若非standby则mOutput->standby()，线程函数返回false结束。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"prepareTracks_l如何判断Track数据可用？不可用时如何处理？（上）","a":"对mActiveTracks每个track先mAudioMixer->setActiveTrack(track->name())（name为混音器32元素数组索引），通过CB查询。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"prepareTracks_l如何判断Track数据可用？不可用时如何处理？（下）","a":"满足cblk->framesReady()且(isReady()||isStopped())且非isPaused()非isTerminated()即数据可用：setBufferProvider(track)设置数据提供者（Track从AudioBufferProvider派生，混音器从它取数据）、enable(MIXING)、设置音量VOLUME0/VOLUME1和格式等，返回MIXER_TRACKS_READY。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"prepareTracks_l对数据未就绪的Track如何处理？","a":"isStopped则reset()清零读写位置；isTerminated/isStopped/isPaused则加入tracksToRemove并disable(MIXING)；数据未准备好时递减mRetryCount，减到0加入移除队列，否则置mixerStatus=MIXER_TRACKS_ENABLED并disable该Track混音。最后对被移除的Track做收尾处理。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"prepareTracks_l数据不可用时怎么处理？","a":"不可用时：isStopped则reset()清零读写位置；isTerminated/isStopped/isPaused则加入tracksToRemove并disable(MIXING)；数据未准备好时递减mRetryCount，减到0加入移除队列，否则置mixerStatus=MIXER_TRACKS_ENABLED并disable该Track混音。最后对被移除的Track做最后处理。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer的state_t和track_t结构是什么？最大支持几路混音？（上）","a":"state_t含enabledTracks（启用Track位图）、needsChanged、frameCount（等于音频输出对象缓冲大小）、mix_t hook（处理函数指针）、outputTemp/resampleTemp临时缓冲和track_t tracks[32]（32字节对齐）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer的state_t和track_t结构是什么？最大支持几路混音？（下）","a":"track_t与每路Track对应，含channelCount、enabled、format、buffer.raw、bufferProvider（该路Track的数据提供者）及每路自己的hook。AudioMixer最大支持32路混音，构造时初始化32个track_t。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer的hook函数机制是什么？（上）","a":"process(output)只调mState.hook(&mState,output)，hook是函数指针，初始为process__nop（什么都不做），显然不是混音最终使用的处理函数，存在动态赋值。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer的hook函数机制是什么？（下）","a":"候选函数共6个：process__validate、process__nop、process__genericNoResampling、process__genericResampling、process__OneTrack16BitsStereoNoResampling、process__TwoTrackStereo16BitsNoResampling（详见另两卡）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer有哪些具体处理函数？（上）","a":"①process__validate：根据Track的格式、数量等信息选择其他处理函数；②process__nop：什么都不做；③process__genericNoResampling：普通无需重采样；④process__genericResampling：普通需重采样；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer有哪些具体处理函数？（下）","a":"⑤process__OneTrack16BitsStereoNoResampling：一路音频流、双声道、PCM16格式、无需重采样；⑥process__TwoTrackStereo16BitsNoResampling：两路音频流同条件。hook初始为process__nop，enable(MIXING)后经invalidateState切到validate动态选择。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AudioMixer的hook函数机制是什么？有哪些处理函数？（下）","a":"候选函数：process__validate（按Track格式、数量选择其他处理函数）、process__nop、process__genericNoResampling（普通无需重采样）、process__genericResampling（普通需重采样）、process__OneTrack16BitsStereoNoResampling（一路双声道PCM16无重采样）、process__TwoTracks16BitsStereoNoResampling（两路同条件）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"process__validate如何选择处理函数？（上）","a":"enable(MIXING)调invalidateState，置needsChanged并把hook改为process__validate。validate按当前Track情况动态选择：需重采样选process__genericResampling，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"process__validate如何选择处理函数？（下）","a":"否则process__genericNoResampling；若all16BitsStereoNoResample且无音量渐变且只有1个Track，则选process__OneTrack16BitsStereoNoResampling。这样按情况选择处理函数，避免杀鸡用宰牛刀。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AF作为数据消费者是如何通过Track使用CB数据缓冲的？（上）","a":"在process__OneTrack16BitsStereoNoResampling等函数中bufferProvider就是Track对象：循环中设b.frameCount=numFrames后调Track的getNextBuffer(&b)取可读数据，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AF作为数据消费者是如何通过Track使用CB数据缓冲的？（下）","a":"做混音（乘音量、写out缓冲），再调Track的releaseBuffer(&b)释放。即getNextBuffer（内部framesReady得帧数、getBuffer得首地址）→消费数据→releaseBuffer（内部stepServer更新读位置）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"Track::getNextBuffer和releaseBuffer的实现要点是什么？（上）","a":"getNextBuffer：cblk->framesReady()按CB读写指针算可读帧数，framesReq超出则取实际值；考虑loopEnd（AT可setLooping设播放端点），bufferEnd取loopEnd与serverBase+frameCount较小者，若s+framesReq>bufferEnd重新计算；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"Track::getNextBuffer和releaseBuffer的实现要点是什么？（下）","a":"buffer->raw=getBuffer(s,framesReq)得首地址，无数据返回NOT_ENOUGH_DATA。releaseBuffer：buffer->raw=0，mFrameCount=buffer->frameCount，step()即cblk->stepServer(mFrameCount)更新读位置，失败置STEPSERVER_FAILED。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"getNextBuffer如何计算可读帧数？","a":"releaseBuffer（TrackBase实现）：buffer->raw=0，mFrameCount=buffer->frameCount（getNextBuffer分配的可读帧数），调用step()即cblk->stepServer(mFrameCount)更新读位置，失败则置STEPSERVER_FAILED标志；最后buffer->frameCount=0。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AT调用stop后为什么可能还能听到一段声音？（上）","a":"Track的stop只是把mState设为STOPPED。prepareTracks_l判断条件是framesReady()&&(isReady()||isStopped())&&!isPaused()&&!isTerminated()——若AT写得快而AF消费慢，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AT调用stop后为什么可能还能听到一段声音？（下）","a":"缓冲中还有未消费数据，判断仍成立，故仅调stop还会播完缓冲中的数据。一般AT端stop后很快被delete，导致AF端TrackHandle也被delete，其析构调mTrack->destroy()，destroyTrack_l置TERMINATED并从mTracks移除回收。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.3 audio_track_cblk_t分析","q":"AT端（生产者/写者）使用CB的流程是什么？","a":"AT在CB中以user表示写位置。流程：①调framesAvailable看是否有空余可写空间（内部调framesAvailable_l）；②调buffer(offset-userBase)获得写空间起始地址；③写完调stepUser更新user位置。framesAvailable_l计算：out为1时返回limit+frameCount-u，limit=(s<loopStart)?s:loopStart，不设循环时loopStart为INT_MAX即limit=s，故返回总帧数减已写帧数。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.3 audio_track_cblk_t分析","q":"AF端（消费者/读者）使用CB的流程是什么？（上）","a":"AF在CB中以server表示读位置。流程：①调framesReady看是否有可读数据——u=user、s=server，out为1且u<loopEnd时返回u-s（写位置减读位置），循环播放时按(loopEnd-loopStart)*loopCount+u-s算；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.3 audio_track_cblk_t分析","q":"AF端（消费者/读者）使用CB的流程是什么？（下）","a":"②根据server和serverBase算可读数据起始地址（与写者buffer算法一样）；③读完调stepServer(frameCount)更新server，若s>=serverBase+frameCount则serverBase+=frameCount，最后cv.signal()唤醒等可写缓冲的写者。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.3 audio_track_cblk_t分析","q":"CB如何通过userBase/serverBase实现环形缓冲？（上）","a":"关键在buffer的计算：返回buffers+(offset-userBase)*frameSize。以1024帧为例：写满后stepUser中u>=userBase+frameCount使userBase+=1024；读者读走前512帧后serverBase同样推进。此时framesAvailable_l返回512+1024-1024=512帧可写，可写地址offset(=userBase+512)-userBase=512，即从缓冲头部重新开始。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.3 audio_track_cblk_t分析","q":"CB环形缓冲的精髓是什么？","a":"可写地址从头部到尾部反复循环利用，这就是环形缓冲。CB对象通过userBase和user等几个变量的巧妙配合，把一段有限长度的线性缓冲变成了一段无限长的缓冲——写者写到哪里，一旦越过缓冲尾部，userBase就同步推进，使offset-userBase的位置回到缓冲头部，从头到尾循环往复，这正是环形缓冲的精髓。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.3 audio_track_cblk_t分析","q":"关于AudioFlinger学习的三点建议是什么？","a":"①首先要搞清数据传输流程，可用流程分析只在一端进行，如AF的start、stop等，流程分析在AT和AF破解中作用重大；②搞清AF中各个类的作用和派生关系，分析时才能准确定位到具体实现函数；③搞清CB对象的工作原理和方式；若只想理解AF工作流程，CB对象可不必过于深究。从生产者消费者角度看，AF的工作就是：MixerThread获取Track的数据，混音后写入音频输出设备。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"AudioPolicyService的构造函数做了哪些事？（上）","a":"①创建两个AudioCommandThread：mTonePlaybackThread播放Tone音（按键音等），mAudioCommandThread（ApmCommandThread）处理路由切换、音量调节等控制命令；②Generic情况直接new AudioPolicyManagerBase(this)，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"AudioPolicyService的构造函数做了哪些事？（下）","a":"否则调厂商的createAudioPolicyManager(this)创建AudioPolicyInterface；③property_get(\"ro.camera.sound.forced\")读属性传给setSystemProperty，决定拍照是否强制发声（防偷拍快门必须出声）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"APS中为什么也存在HAL对象AudioPolicyInterface？它提供哪些重要接口？（上）","a":"APS控制Audio系统，而各硬件厂商的控制策略不一致，故Android把策略内容抽象成HAL对象AudioPolicyInterface，由厂商实现（通用实现为AudioPolicyManagerBase）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"APS中为什么也存在HAL对象AudioPolicyInterface？它提供哪些重要接口？（下）","a":"重要接口：setDeviceConnectionState（设备连接状态）、setPhoneState（通话/来电）、setForceUse（强制使用配置）、getOutput（返回AF工作线程索引）、startOutput/stopOutput、initStreamVolume/setStreamVolumeIndex（音量控制）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"AudioSystem中的stream_type完整枚举有哪些？","a":"DEFAULT=-1、VOICE_CALL=0（通话声）、SYSTEM=1（系统声如开关机提示）、RING=2（来电铃声）、MUSIC=3（媒体播放声）、ALARM=4（闹钟警告声）、NOTIFICATION=5（短信提示声）、BLUETOOTH_SCO=6、ENFORCED_AUDIBLE=7（强制发声，如照相机快门声）、DTMF=8（拨号盘按键声）、TTS=9（文本转语音）。音频流类型主要用于设备选择和音量控制（不同类型音量级个数不同，如MUSIC有15级）。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"audio mode（声音模式）有哪些？Audio为什么强调Phone状态？","a":"audio_mode包括MODE_NORMAL=0（正常）、MODE_RINGTONE（有来电）、MODE_IN_CALL（通话中）等。智能手机硬件上有音频DSP，声音输入输出都经它，D/A转换后到扬声器、听筒、耳机等；AP（应用处理器）和BP（基带处理器）都能向DSP发数据且硬件通路互不干扰，若不协调会出现通话声和音乐声混杂。所以打电话时Phone程序主动设置Audio系统的mode，Audio系统据此处理，如把music音量调小。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"force_use和forced_config（强制使用）如何定义和配合？（上）","a":"forced_config表示强制使用何种设备：FORCE_NONE、FORCE_SPEAKER（扬声器）、FORCE_HEADPHONES、FORCE_BT_SCO、FORCE_BT_A2DP、FORCE_WIRED_ACCESSORY、FORCE_BT_CAR_DOCK、FORCE_BT_DESK_DOCK，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"force_use和forced_config（强制使用）如何定义和配合？（下）","a":"FORCE_DEFAULT=FORCE_NONE。force_use表示什么情况下强制使用（前缀FOR_XXX）：FOR_COMMUNICATION通话、FOR_MEDIA媒体、FOR_RECORD录音、FOR_DOCK。setForceUse(usage,config)即设置什么情况下强制用什么设备，如通话中选扬声器。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"setForceUse的含义是什么？","a":"setForceUse(AudioSystem::force_use usage,AudioSystem::forced_config config)即设置在什么情况下强制使用什么设备，例如手机通话时选择扬声器输出就是强制使用的案例。AMB构造时把mForceUse[i]全部初始化为FORCE_NONE。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"audio_devices输出设备枚举（有线类）有哪些？","a":"DEVICE_OUT_EARPIECE=0x1听筒、DEVICE_OUT_SPEAKER=0x2扬声器、DEVICE_OUT_WIRED_HEADSET=0x4耳机、DEVICE_OUT_WIRED_HEADPHONE=0x8另一种耳机。设备号与AudioSystem.h定义一致，Java层AudioSystem.DEVICE_OUT_WIRED_HEADSET即0x4。设备用位标志表示，可按位与（&）判断设备是否在可用集合中。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"audio_devices输出设备枚举（蓝牙及其他）有哪些？","a":"DEVICE_OUT_BLUETOOTH_SCO=0x10及SCO_HEADSET=0x20、SCO_CARKIT=0x40，SCO用于通话的语音传输；DEVICE_OUT_BLUETOOTH_A2DP=0x80及A2DP_HEADPHONES=0x100、A2DP_SPEAKER=0x200，A2DP用于立体声传输；DEVICE_OUT_AUX_DIGITAL=0x400；DEVICE_OUT_DEFAULT=0x8000。设备同样用位标志表示。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"AudioOutputDescriptor对象的作用是什么？","a":"AudioOutputDescriptor是AudioPolicyManagerBase用来记录和维护音频输出设备（从硬件上看相当于DSP）信息的对象，包括使用该设备的流个数、各流的音量、设备支持的采样率、采样精度等；成员mDevice表示目前使用的输出设备（如耳机、听筒、扬声器）。AMB把mHardwareOutput和对应descriptor以key/value存入mOutputs集合；对Duplicate输出它还持有mOutput1/mOutput2两个子descriptor。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"setOutputDevice做什么？路由设置如何传递？（上）","a":"setOutputDevice为DSP选输出设备：若是Duplicate输出则分别对mOutput1/mOutput2递归调用；设备相同且非force则返回；软件层面更新outputDesc->mDevice=device；再构造AudioParameter并addInt(keyRouting,device)，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"setOutputDevice做什么？路由设置如何传递？（下）","a":"经mpClientInterface->setParameters(mHardwareOutput,param.toString(),delayMs)投递到APS的AudioCommandThread，再传给AF对应MixerThread（只有它持有AudioStreamOut），并applyStreamVolumes设音量。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"routing_strategy枚举和getStrategy的作用是什么？（上）","a":"routing_strategy定义于AudioPolicyManagerBase.h：STRATEGY_MEDIA、STRATEGY_PHONE、STRATEGY_SONIFICATION、STRATEGY_DTMF。getStrategy(stream)把流类型映射为策略：VOICE_CALL、BLUETOOTH_SCO→STRATEGY_PHONE；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"routing_strategy枚举和getStrategy的作用是什么？（下）","a":"RING、NOTIFICATION、ALARM、ENFORCED_AUDIBLE→STRATEGY_SONIFICATION；DTMF→STRATEGY_DTMF；SYSTEM、TTS、MUSIC（default）→STRATEGY_MEDIA。可见流类型不直接和路由相关，AMB内部用routing_strategy控制路由。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.1 AudioPolicyService的创建","q":"updateDeviceForStrategy的作用是什么？","a":"它循环对所有NUM_STRATEGIES个策略调用mDeviceForStrategy[i]=getDeviceForStrategy((routing_strategy)i,false)，重新计算每种策略当前使用的设备并保存到mDeviceForStrategy数组中，起到cache的作用。之后getDeviceForStrategy传入fromCache=true时可直接取旧值，避免重复计算。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AudioSystem::getOutput如何找到AF中的工作线程？","a":"AudioSystem::getOutput先查本地缓存，若无则取得IAudioPolicyService代理，调aps->getOutput(stream,samplingRate,format,channels,flags)；非DIRECT输出还把stream和output的对应关系存入gStreamOutputMap。APS的getOutput加锁后转交mpPolicyManager（AMB）处理。由AP返回线程号是因为Audio系统需根据流类型→路由策略→输出设备→工作线程层层决策。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AudioPolicyManagerBase::getOutput如何根据流类型选工作线程？（上）","a":"①getStrategy(stream)由流类型得路由策略；②getDeviceForStrategy(strategy)得该策略使用的输出设备；③若popCount(device)==2（设备数为2）且a2dpUsedForSonification成立则output=mDuplicatedOutput（与DuplicatingThread相关），"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AudioPolicyManagerBase::getOutput如何根据流类型选工作线程？（下）","a":"否则mHardwareOutput；若只有A2DP设备则output=mA2dpOutput（蓝牙MixerThread），否则mHardwareOutput。返回值即AF工作线程索引号。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AT、AF、AP三者配合完成数据传输的因果关系是什么？","a":"AT的目的是把数据发给对应设备（蓝牙、DSP等）；代表输出设备的HAL对象由MixerThread持有，所以要找到对应的MixerThread；AP维护流类型和输出设备（耳机、蓝牙耳机、听筒等）的关系，不同输出设备使用不同的混音线程；AT根据自己的流类型向AudioSystem查询，得到对应的混音线程号，再createTrack在该线程中创建Track，此后AT的数据由该线程负责处理。三者精妙配合达到预期目的。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AF端Track::start如何与AP交互（startOutput流程）？（上）","a":"Track::start中若非OutputTrack且状态非ACTIVE/RESUMING，先调AudioSystem::startOutput(thread->id(),mStreamType)转给AP，由AMB实现：①按output找AudioOutputDescriptor；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AF端Track::start如何与AP交互（startOutput流程）？（下）","a":"②getStrategy得路由策略；③changeRefCount(stream,1)增加该流使用计数；④setOutputDevice(output,getNewDevice(output))做路由切换；⑤checkAndSetVolume设音量。之后才addTrack_l把Track加入活跃数组。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"getNewDevice如何确定输出设备？其判断顺序体现什么优先级？","a":"getNewDevice根据output找到outputDesc，按顺序判断：若mPhoneState==MODE_IN_CALL或isUsedByStrategy(STRATEGY_PHONE)取PHONE策略设备；否则SONIFICATION；再否则MEDIA，最后DTMF。判断顺序体现系统优先使用的策略：如通话中强制使用扬声器时，即使插着耳机，音乐也首先使用PHONE策略对应的扬声器。fromCache为true时直接从mDeviceForStrategy旧值取设备。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"为什么startOutput会和设备切换有关系？举个例子说明。","a":"因为多个流共存时高优先级策略会改变输出设备。例如第一个AT用MUSIC类型，声音从耳机出（耳机已连接）；此时第二个AT用RING类型，对应SONIFICATION策略优先级高于MUSIC，需要把设备切换为耳机加扬声器（此类声音需同时从两者输出），结果两路Track的声音都从耳机和扬声器听到。当RING的AT调用stop时，该流使用计数减一，触发新的路由切换回到只有耳机，第一路AT的声音恢复为只从耳机输出。stop基本是start的逆向处理。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"耳机插入事件的完整处理链路是什么？（1/3）","a":"①耳机插入触发ACTION_HEADSET_PLUG广播，Java层AudioService的内部类AudioServiceBroadcastReceiver在onReceive中处理：state==1且之前无耳机时，调AudioSystem.setDeviceConnectionState(DEVICE_OUT_WIRED_HEADSET,DEVICE_STATE_AVAILABLE,\"\")并记入mConnectedDevices（拔出则置UNAVAILABLE并移除）；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"耳机插入事件的完整处理链路是什么？（2/3）","a":"②该函数是Native函数，经JNI转入AudioSystem.cpp。②（续）AudioSystem::setDeviceConnectionState取得IAudioPolicyService代理后，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"耳机插入事件的完整处理链路是什么？（3/3）","a":"转调aps->setDeviceConnectionState，最终由AudioPolicyManagerBase处理：更新mAvailableOutputDevices，然后getNewDevice算出新设备（听歌场景为0x4耳机）、updateDeviceForStrategy更新策略设备、setOutputDevice设置新输出设备，完成从扬声器到耳机的路由切换。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"AMB处理setDeviceConnectionState的三个关键调用是什么？","a":"AMB实现中一次只能设一个设备（popCount(device)!=1返回BAD_VALUE），mAvailableOutputDevices|=device后：①getNewDevice(mHardwareOutput,false)算出新设备（听歌场景为0x4耳机）；②updateDeviceForStrategy()更新各策略设备；③setOutputDevice(mHardwareOutput,newDevice)设置新输出设备。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"AMB收到setDeviceConnectionState后做什么？","a":"最终由AMB实现：一次只能设置一个设备（popCount(device)!=1返回BAD_VALUE）；mAvailableOutputDevices|=device；然后①getNewDevice(mHardwareOutput,false)算出新设备（听歌场景为0x4耳机）；②updateDeviceForStrategy()更新各策略设备；③setOutputDevice(mHardwareOutput,newDevice)设置新输出设备。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"getDeviceForStrategy为STRATEGY_MEDIA选设备的顺序是什么？（上）","a":"以听歌+插耳机为例：先试mAvailableOutputDevices&DEVICE_OUT_AUX_DIGITAL（0x400不满足）；再试WIRED_HEADPHONE（0x8不满足）；再试WIRED_HEADSET（0x4满足，device2=0x4）；否则退到SPEAKER。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"getDeviceForStrategy为STRATEGY_MEDIA选设备的顺序是什么？（下）","a":"最终device|=device2得0x4。STRATEGY_PHONE要先看mForceUse[FOR_COMMUNICATION]是否强制了设备；STRATEGY_SONIFICATION在MODE_IN_CALL时与PHONE同设备，否则从SPEAKER起找。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"AudioCommandThread如何处理路由设置命令？","a":"APS的setParameters调mAudioCommandThread->parametersCommand(...)把请求加入命令队列，threadLoop从mAudioCommands取命令按mCommand分发：SET_PARAMETERS时调AudioSystem::setParameters(data->mIO,data->mKeyValuePairs)，mIO为mHardwareOutput。这种用一个队列协调两个线程的方法属于生产者/消费者模型，多线程编程中非常常见。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"路由参数最终如何到达硬件（AudioFlinger之后）？（上）","a":"AudioSystem::setParameters转交AF：af->setParameters(ioHandle,keyValuePairs)。ioHandle==0时直接设到AudioHardwareInterface HAL对象；否则checkPlaybackThread_l(ioHandle)找到对应MixerThread，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"路由参数最终如何到达硬件（AudioFlinger之后）？（下）","a":"thread->setParameters把keyValuePair放入mNewParameters队列；MixerThread线程中checkForNewParameters_l取出参数，调mOutput->setParameters(keyValuePair)，即AudioStreamOut（音频输出设备HAL对象）处理。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"以高通msm7k为例，真实HAL如何完成设备切换？（上）","a":"AudioStreamOutMSM72xx::setParameters解析keyRouting得device，存mDevices后调mHardware->doRouting()；doRouting判断后调doAudioRouteOrMute(sndDevice)，最终do_route_audio_dev_ctrl打开音频控制设备/dev/msm_audio_ctl，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.3 声音路由切换实例分析","q":"以高通msm7k为例，真实HAL如何完成设备切换？（下）","a":"填好path数组后调ioctl(fd,AUDIO_SWITCH_DEVICE,&path)切换设备（此处ioctl返回0表示出错）。路由请求从Java广播到最终ioctl，跨越AudioService→AudioSystem→APS/AMB→AudioCommandThread→AF→MixerThread→HAL全链路。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.4 关于AudioPolicy的总结","q":"学习AudioPolicy至少要理解哪两点？（上）","a":"①AP和AF的关系：AF工作线程由AP控制创建，AP通过线程索引号（mHardwareOutput等）和AudioOutputDescriptor控制系统声音，经向对应MixerThread发控制消息、再由MixerThread传给音频输出HAL对象来控制；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.4 关于AudioPolicy的总结","q":"学习AudioPolicy至少要理解哪两点？（下）","a":"②设备连接导致的路由切换流程：AudioService广播→setDeviceConnectionState→getNewDevice→updateDeviceForStrategy→setOutputDevice→AudioCommandThread→AF→HAL。AudioPolicy无固定流程，要结合流类型、当前可用设备等场景理解。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"DuplicatingThread的来历是什么（A2DP连接时）？（上）","a":"蓝牙A2DP设备连接时，AMB的setDeviceConnectionState检测到A2DP设备后调handleA2dpConnection：①openOutput为mA2dpOutput创建专往蓝牙发数据的MixerThread；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"DuplicatingThread的来历是什么（A2DP连接时）？（下）","a":"②因a2dpUsedForSonification返回true（铃声等SONIFICATION声音需同时从蓝牙和DSP出），调openDuplicateOutput(mA2dpOutput,mHardwareOutput)创建复制输出；③建dupOutputDesc（mOutput1=DSP输出、mOutput2=蓝牙输出）并addOutput保存。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"AF的openDuplicateOutput做了什么？","a":"①checkMixerThread_l(output1)找到蓝牙的MixerThread，checkMixerThread_l(output2)找到DSP的MixerThread；②new DuplicatingThread(this,thread1,++mNextThreadId)，第二参数为代表蓝牙的MT；③thread->addOutputTrack(thread2)把代表DSP的MT加入；④DuplicatingThread加入mPlaybackThreads并返回其索引号。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"DuplicatingThread和OutputTrack的关系是什么？（上）","a":"DT从MT派生，构造时mType=DUPLICATING并addOutputTrack(mainThread)。addOutputTrack为每个目标MT构造一个OutputTrack（Track派生类，构造最后参数NULL表示无客户端参与，在本进程内创建CB+数据缓冲内存），"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"DuplicatingThread和OutputTrack的关系是什么？（下）","a":"设mCblk->out=1（DT往MT写数据），加入目标MT的mTracks和DT的mOutputTracks。DT像MT的客户端（与AT是AF的客户端类似），配合两个OutputTrack把混音数据原封不动发给蓝牙MT和DSP MT，如同数据中继器。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"DuplicatingThread的线程函数如何工作？（上）","a":"DT线程函数与MT类似但有两点不同：①混音前调outputsReady(outputTracks)检查各OutputTrack对应MT的状态，未就绪则memset(curBuf,0,...)；②混音后不直接write硬件，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"DuplicatingThread的线程函数如何工作？（下）","a":"而是循环对每个outputTracks[i]->write(curBuf,writeFrames)把数据写到OutputTrack共享缓冲，由各MT作为二级消费者继续处理。若AT的Track全停且超时则outputTracks[i]->stop()进入standby。DT从MT派生天然有混音功能，prepareTracks_l复用基类。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"OutputTrack::write如何传输数据？mBufferQueue的作用是什么？（上）","a":"write时若该OutputTrack未活跃则先start()；循环从mBufferQueue或inBuffer取数据，obtainBuffer(&mOutBuffer,waitTimeLeftMs)获得DT与MT共享的可写缓冲（与AT中对应代码很相似），"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.1 DuplicatingThread破解","q":"OutputTrack::write如何传输数据？mBufferQueue的作用是什么？（下）","a":"memcpy数据后mCblk->stepUser(outFrames)更新写位置。因MT是DT的二级消费者可能来不及消费，DT用mBufferQueue暂存其数据，上限由kMaxOverFlowBuffers控制（10个）；写完后释放队列缓冲。此方式比直接MT传输缓慢。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.2 拓展思考","q":"CTS的思想对本章Audio系统有什么借鉴意义？","a":"CTS是Google为Android做的兼容性测试：不管硬件驱动怎么实现，都必须通过CTS测试。芯片类型太多、操作不一，容易导致一套硬件一套代码、反复创造低价值，而上层开发者不希望下层驱动变动影响应用。借助HAL层，硬件厂商代码需编译验证，用CTS这种统一测试的思想（或测试驱动开发的态度严格测试驱动）可避免用复杂的应用层程序去测HAL，减少驱动的低质量问题向上扩散。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.2 拓展思考","q":"如何认识ALSA在Android中的使用？","a":"ALSA（Advanced Linux Sound Architecture）提供用户空间库libasound，但其API较多、比较难用，从上层用户角度看不太适合快速简单的应用开发。有了Audio HAL的帮助，应用层不用改动，但实现HAL的厂商要做较大改动。相比之下，Android源码中使用的open/ioctl方法更为方便。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.5.2 拓展思考","q":"什么是Desktop Check？它有什么价值？","a":"Desktop Check（桌面检查）是在调试工具不发达的年代产生的做法：自己虚拟一些应用场景，把参数代入程序，在大脑中Trace代码运行，像考试一样反复检查代码。现代开发常用加log运行看输出，但在时间充裕时，应先用Desktop Check方式反复阅读检查程序、在大脑中模拟运行，最后才用log验证想法。它对提升阅读代码能力也有重要帮助。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.2 AudioTrack（Java空间）","q":"MemoryHeapBase提供哪些获取共享内存信息的函数？","a":"getBaseID()：返回mFd，若为负数说明创建共享内存失败；getBase()：返回共享内存起始地址（mBase）；getSize()：返回mSize即内存大小。这些函数都很简单，作用是让使用者能获取共享内存的位置和大小。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"为什么说volatile不支持跨进程？这引出什么思考？","a":"CB中的user/server虽声明为volatile，但volatile只保证编译器不优化对该变量的访问，并不能解决跨进程、CPU Cache不一致的可见性问题。要回答它需要理解volatile、CPU Cache机制和共享内存的本质。这也是CB中必须使用支持跨进程共享的Mutex和Condition（初始化时设置为进程间共享）来协调生产者消费者的原因之一。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AF中到底有多少种对象？各自是什么角色？（上）","a":"①AudioFlinger本身：继承BnAudioFlinger和IBinder::DeathRecipient，是引擎；②Client：客户端进程封装，以pid标识，持有MemoryDealer；③工作线程家族：ThreadBase为基类，"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"AF中到底有多少种对象？各自是什么角色？（下）","a":"PlaybackThread（含MixerThread、DirectOutputThread、DuplicatingThread）负责输出，RecordThread负责输入；④Track家族及TrackHandle/RecordHandle：基于Binder的Proxy，接收请求派发给对应Track/RecordTrack。多数类以内部类方式封装。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"Track家族如何分布？","a":"TrackBase定义于ThreadBase中；Track定义于PlaybackThread中，RecordTrack定义于RecordThread中；OutputTrack定义于DuplicatingThread中。TrackHandle和RecordHandle基于Binder通信，作为Proxy接收请求并派发。之所以不让Track继承Binder框架，是因为其继承关系和工作已很复杂，再掺合Binder只会乱上添乱。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.3.2 通过流程分析AudioFlinger","q":"MixerThread大致的数据流动轨迹是什么？","a":"MixerThread接收来自AT的数据（通过Track和CB共享内存）→用AudioMixer对象对这些数据进行混音→把混音结果写入自己持有的AudioStreamOut（音频输出设备的HAL抽象）→最终写到音频硬件。即PlaybackThread直接和Audio输出设备建立联系，音频数据的输出终点是PlaybackThread调用mOutput->write。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.2.3 AudioTrack（Native空间）","q":"CB对象的神秘问题：共享内存首地址怎么就变成了CB对象？","a":"AT端只见mCblk=static_cast<audio_track_cblk_t*>(cblk->pointer())，即把共享内存首地址强转为CB指针，但内存里并无对象。答案在AF端：TrackBase构造函数先从Client的heap()分配含CB大小+数据大小的共享内存，然后用placement new（new(mCblk)audio_track_cblk_t()）把CB对象构造在共享内存首部，随后才是数据区。这样CB对象驻留共享内存，AT和AF两端都能看见并使用它。"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AudioSystem在AT与AP之间扮演什么角色？（上）","a":"AudioSystem是Native类（Java层有对应类），定义stream type、audio_devices等重要类型，并充当查询/转发通道：AT的set中调AudioSystem::getOutput，取IAudioPolicyService代理后调aps->getOutput由AP决策；"},{"ch":"第7章 · 深入理解Audio系统","sec":"7.4.2 重回AudioTrack","q":"AudioSystem在AT与AP之间扮演什么角色？（下）","a":"AF的Track::start/stop中调AudioSystem::startOutput/stopOutput也转给AP；AF端路由参数也经AudioSystem::setParameters转给AF。它把AT/AF与AP解耦衔接起来。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.1 概述","q":"Surface系统的“任督二脉”分别指什么？","a":"任脉：应用程序和Surface的关系。不论是Skia画二维图还是OpenGL画三维图，Application最终都要和Surface交互，Surface就像UI的画布，App像在Surface上作画。\n督脉：Surface和SurfaceFlinger（简称SF）之间的关系。Surface向SF提供数据，SF则混合数据，这很像Audio系统中AudioTrack和AudioFlinger的关系。打通这二脉后即可自行修炼更高层次的功夫。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.1 概述","q":"Surface系统中Surface与SurfaceFlinger的分工与Audio系统中的哪对角色类似？","a":"类似AudioTrack与AudioFlinger的关系：Surface向SurfaceFlinger提供（生产）图像数据，SurfaceFlinger负责把各显示层的数据混合后输出到屏幕。数据承载靠共享内存/GraphicBuffer，步调控制靠SharedBuffer家族（相当于Audio中的CB对象），最终图像混合由SF的工作线程完成。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"Activity对象到底是在哪里、如何被创建的？","a":"handleLaunchActivity两个关键点：①performLaunchActivity(r,customIntent)——创建Activity；②handleResumeActivity(r.token,...)——处理Resume并触发把DecorView加入WindowManager等UI流程。Activity的显示正由此展开。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"handleLaunchActivity的两个关键点是什么？","a":"zygote fork出App进程，入口为ActivityThread.main。handleLaunchActivity调用performLaunchActivity：通过mInstrumentation.newActivity根据类名用Java反射创建Activity，new出ContextImpl，再调用callActivityOnCreate触发onCreate（其中一般调用setContentView设置UI外观）。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"Activity的mWindow成员变量的真实类型是什么？在哪里确定？","a":"真实类型是PhoneWindow。Instrumentation.newActivity会调用activity.attach(...)，attach中执行mWindow=PolicyManager.makeNewWindow(this)——PolicyManager通过反射创建单例Policy，Policy.makeNewWindow返回new PhoneWindow(context)，即Window抽象类的实际实现是PhoneWindow。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"PolicyManager是如何创建Window的？phone与mid目录有何含义？","a":"PolicyManager中静态块通过Class.forName(\"com.android.internal.policy.impl.Policy\")创建单例sPolicy，makeNewWindow委托sPolicy.makeNewWindow(context)，Policy返回new PhoneWindow。其所在目录policies/base/phone针对智能手机，平级mid目录针对Mid设备。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"Activity的WindowManager的真实类型是什么？采用了什么设计模式？","a":"attach调用mWindow.setWindowManager(null,...)（实现在Window类）：wm为null时创建WindowManagerImpl.getDefault()单例，再mWindowManager=new LocalWindowManager(wm)。LocalWindowManager与WindowManagerImpl都实现WindowManager接口，采用Proxy模式，前者把工作委托给后者。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"setContentView在PhoneWindow中如何处理？DecorView和mContentParent是什么关系？","a":"installDecor()中generateDecor()创建mDecor（DecorView，FrameLayout派生）；generateLayout按features选布局加入decor，findViewById(ID_ANDROID_CONTENT)得到mContentParent——它是DecorView的一部分，setContentView的View由addView加入其中。故用户设置的View只是DecorView的子View，DecorView还处理标题栏等工作。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"WindowManagerImpl.addView中做了哪两件关键的事？","a":"①创建ViewRoot：root=new ViewRoot(view.getContext())，并把view、root、params分别存入mViews、mRoots、mParams数组；②调用root.setView(view,wparams,panelParentView)，其中view就是DecorView。至此幕后主角ViewRoot正式登场，Activity显示的后续工作都由它驱动。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建","q":"ViewRoot类是如何定义的？它和View是什么关系？","a":"class ViewRoot extends Handler implements ViewParent, View.AttachInfo.Callbacks。从Handler派生故能处理消息；实现ViewParent是View视图体系的根，但没有onDraw、不管绘画。重要成员：Surface mSurface=new Surface()（无参构造）、W类型mWindow（IWindow.Stub）、View mView。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建（ViewRoot与WMS）","q":"ViewRoot的构造函数中如何建立与WindowManagerService的联系？","a":"构造函数调用静态getWindowSession(mainLooper)：sWindowSession=IWindowManager.Stub.asInterface(ServiceManager.getService(\"window\")).openSession(...)。先拿WMS的Binder代理，再跨进程openSession得到IWindowSession。WMS与SurfaceFlinger都驻留system_server进程。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建（ViewRoot与WMS）","q":"ViewRoot.setView函数做了哪三件事？","a":"①保存传入的view（PhoneWindow的DecorView）为成员mView；②调用requestLayout()——它checkThread后置mLayoutRequested=true并scheduleTrversals()，即sendEmptyMessage(DO_TRAVERSAL)给自己这个Handler；③调用sWindowSession.add(mWindow,...)跨进程把W类型的mWindow传给WMS。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建（ViewRoot与WMS）","q":"WMS收到add请求后做了什么？SurfaceSession在哪里被创建？","a":"Session（WMS内部类，Bn端）的add调用外部类WMS的addWindow：创建WindowState对象并调用win.attach()。WindowState.attach调用mSession.windowAddedLocked()，其中若mSurfaceSession为null则new SurfaceSession()并mNumWindow++。即每个Session（对应一个App进程）首次添加窗口时创建一个SurfaceSession对象。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建（ViewRoot与WMS）","q":"IWindowSession和IWindow这两个aidl接口各自的作用是什么？","a":"IWindowSession：每个App进程与WMS建立的一个私有会话，App通过它与WMS通信（add、relayout等）。IWindow：WMS用来向客户端窗口通知事件的回调接口，定义dispatchKey、dispatchPointer、dispatchTrackball等。ViewRoot中W类是IWindow的Bn端，IWindowSession定义于IWindowSession.aidl，编译时由aidl工具生成Bn/Bp代码。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建（ViewRoot与WMS）","q":"一个按键事件是如何从WMS分发到应用View的？","a":"流程：①WMS所在的SystemServer进程接收到按键事件；②WMS找到UI位于屏幕顶端的进程所对应的IWindow对象（此时是Bp端代理）；③调用它的dispatchKey，IWindow的Bn端在ViewRoot中，ViewRoot再根据内部View的位置信息找到真正处理该事件的View，最后调用dispatchKey完成处理。可类比Windows编程：按键转化为消息进入进程消息队列，派发时根据句柄找到对应Window处理。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.1 Activity的创建（ViewRoot与WMS）","q":"为什么说Surface不是“神笔马良”里的画布幻觉，而是实实在在的东西？","a":"SDK说明：Handle on to a raw buffer that is being managed by the screen compositor。即：存在一块Raw buffer（内存或显存）；Surface操作这块Raw buffer；Screen compositor（SurfaceFlinger）管理它。View的onDraw只是画图动作，真正承载绘画结果的画布就是Surface关联的这块缓冲。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.2 Activity的UI绘制","q":"ViewRoot收到DO_TRAVERSAL消息后做什么？performTraversals的两个关键函数是什么？","a":"handleMessage的DO_TRAVERSAL分支调用performTraversals()。该函数很复杂，两个关键点是：①relayoutResult=relayoutWindow(params,viewVisibility,insetsPending)——向WMS请求重设窗口布局并获取/填充Surface；②draw(fullRedrawNeeded)——开始绘制整个视图树。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.2 Activity的UI绘制","q":"ViewRoot.relayoutWindow做了什么？","a":"relayoutWindow调用sWindowSession.relayout(mWindow,params,测量宽高,viewVisibility,insetsPending,mWinFrame,mPendingContentInsets,mPendingVisibleInsets,mPendingConfiguration,mSurface)，注意把ViewRoot的mSurface作为最后一个参数传入。这是跨进程调用，实际由WMS的Session.relayout处理。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.2 Activity的UI绘制","q":"ViewRoot.draw函数的绘图三步曲是什么？","a":"①Surface surface=mSurface; canvas=surface.lockCanvas(dirty)——从mSurface中锁定一块Canvas（dirty为脏区域）；②mView.draw(canvas)——调用DecorView的draw，视图树在这块画布上自由发挥；③surface.unlockCanvasAndPost(canvas)——解锁并投递画布，此后屏幕上就能见到绘制结果。整个Activity绘图流程就是“lock→draw→unlockAndPost”。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.2.2 Activity的UI绘制","q":"关于Activity的创建与显示，可提炼出哪些关键结论？","a":"①顶层View是DecorView，setContentView的View只是其一部分；②Activity持Window（PhoneWindow）和WindowManager（LocalWindowManager）控制显示；③LocalWindowManager委托WindowManagerImpl（Proxy），后者持有ViewRoot；④mView指向DecorView、mSurface含画布，经Binder与WMS交互；⑤绘图=lockCanvas→draw→unlockAndPost。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.2 Surface之乾坤大挪移","q":"“乾坤大挪移”在Surface系统中指什么？乾与坤分别是什么？","a":"指WMS把服务端创建的Surface信息拷到ViewRoot端Surface的过程。乾：WMS中的Surface，用带SurfaceSession参数的构造创建（win.createSurfaceLocked）；坤：ViewRoot的mSurface，用无参构造创建。copyFrom就是挪移：relayoutWindow中win.createSurfaceLocked()得到本地surface后调用outSurface.copyFrom(surface)。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.2 Surface之乾坤大挪移","q":"如何用aidl工具揭秘relayout中Surface的传递真相？","a":"用aidl编译IWindowSession.aidl即可揭秘：Bp端relayout并未把outSurface写进请求包，发送后从_reply中readFromParcel(_reply)读回；Bn端onTransact中_arg10=new Surface()新建Surface，处理后用_arg10.writeToParcel(reply,PARCELABLE_WRITE_RETURN_VALUE)写回reply。这就是隐藏的writeToParcel/readFromParcel。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.2 Surface之乾坤大挪移","q":"乾坤大挪移结束后，ViewRoot的mSurface中最终保存的是什么？涉及哪三个关键Native对象？","a":"三个关键Native对象：①SurfaceComposerClient——由SurfaceSession_init创建；②SurfaceControl——由createSurface返回，被writeToParcel打包；③Native层Surface——readFromParcel时根据Parcel信息new Surface(*parcel)构造，并setSurface设置进Java的mSurface。最终ViewRoot得到的是一个与SF端关联的Native Surface对象。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.2 Surface之乾坤大挪移","q":"WMS的createSurfaceLocked做了什么？","a":"WindowState.createSurfaceLocked中：mSurface=new Surface(mSession.mSurfaceSession,mSession.mPid,标题,0,w,h,format,flags)，即以Session的SurfaceSession为参数构造新Surface；随后在Surface.openTransaction()/closeTransaction()之间做事务处理。它位于system_server进程，是“乾”方。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"Android画图的“四大金刚”是什么？","a":"①Bitmap：存储像素，可当做一块数据存储区域（画布实质指Canvas中封装的这块Bitmap）；②Canvas：记载画图动作，提供画圆、矩形等基本绘图函数；③Drawing primitive：绘图基元，如矩形、圆、弧线、文本、图片等；④Paint：描述绘画使用的颜色、风格（如实线、虚线）等。一般情况下Canvas封装一块Bitmap，作图基于这块Bitmap。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"SurfaceSession构造函数的native init做了什么？","a":"Java层SurfaceSession()调用native的init()。JNI的SurfaceSession_init中：new SurfaceComposerClient并incStrong(clazz)（sp需显式增减强弱引用计数），再SetIntField把client指针存入Java的SurfaceSession对象。核心就是创建与SF交互的SurfaceComposerClient。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"Surface的有参构造函数（带SurfaceSession）的JNI实现做了什么？","a":"Surface_init先从session取出之前保存的SurfaceComposerClient指针，然后sp<SurfaceControl> surface=client->createSurface(pid,dpy,w,h,format,flags)——返回类型是SurfaceControl；最后setSurfaceControl把它设置到Java层Surface对象中保存。注意变量名叫surface但类型是SurfaceControl，易混淆。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"Surface_copyFrom的JNI实现做了什么？","a":"clazz是copyFrom的调用对象（目标），other是参数（源）。分别getSurfaceControl取出两边的SurfaceControl对象，若!SurfaceControl::isSameSurface(surface,rhs)，则setSurfaceControl(env,clazz,rhs)把源对象的SurfaceControl设置到目标Surface中。此时目标（ViewRoot端的Surface）还没有设置SurfaceControl，而源（WMS端）已创建好。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"Surface_writeToParcel的JNI实现做了什么？PARCELABLE_WRITE_RETURN_VALUE有何作用？","a":"从Surface对象取出SurfaceControl，调用SurfaceControl::writeSurfaceToParcel(control,parcel)把信息写入Parcel经Binder传给对端。当flags含PARCELABLE_WRITE_RETURN_VALUE时（relayout正如此），还会setSurfaceControl(env,clazz,0)把本地Surface的SurfaceControl置空——信息已转移走。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"Surface_readFromParcel的JNI实现做了什么？","a":"从Parcel对象取出native数据，getSurface取目标Surface对象，然后sp<Surface> rhs=new Surface(*parcel)——根据服务端传来的Parcel包构造一个新的Native Surface（注意类型是Surface而非SurfaceControl）；若与已有对象不是同一个Surface（!Surface::isSameSurface），则setSurface(env,clazz,rhs)把它赋给Java层的mSurface。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.3 乾坤大挪移的JNI层分析","q":"Surface乾坤大挪移的精简流程可以概括为哪几步？","a":"①创建一个SurfaceComposerClient；②调用其createSurface得到一个SurfaceControl对象；③调用SurfaceControl的writeToParcel把信息写到Parcel包；④根据Parcel包的信息构造一个Native Surface对象，保存到Java层的mSurface中。结果：ViewRoot得到一个Native的Surface对象。这就是后文破解SurfaceFlinger所依赖的精简流程。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.4 Surface和画图","q":"Java层Surface.lockCanvas的JNI实现大致做了什么？","a":"Surface_lockCanvas：取出Native Surface；按dirtyRect设dirtyRegion（空则Rect(0x3FFF,0x3FFF)）；surface->lock(&info,&dirtyRegion)得SurfaceInfo；从CompatibleCanvas取SkCanvas，构造SkBitmap并setPixels(info.bits)，再setBitmapDevice(bitmap)绑定画布，绘画结果就记录在这块存储区。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.3.4 Surface和画图","q":"Java层Surface.unlockCanvasAndPost的JNI实现做了什么？","a":"Surface_unlockCanvasAndPost中：取出Java对象的canvas及其中Native的SkCanvas；nativeCanvas->restoreToCount(saveCount)恢复状态；nativeCanvas->setBitmapDevice(SkBitmap())解除Bitmap绑定；最后调用surface->unlockAndPost()把画完的缓冲投递出去。函数本身很简单，重头戏在Native Surface的lock/unlockAndPost内部。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"什么是显示层（Layer）？SurfaceFlinger如何利用它？","a":"屏幕位于三维坐标系中，Z轴从屏幕内指向屏幕外。编号不同的矩形块叫显示层，每层有自己的属性（颜色、透明度、屏幕位置、宽、高等）和对应的显示内容。Surface系统工作时，SurfaceFlinger对这些按Z轴排序的显示层进行图像混合，混合后的图像就是屏幕上看到的画面。按Z轴排序符合生活中前面物体遮挡后面物体的体验。注意：广义概念称“显示层”，以区别于代码中的Layer类。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"Surface系统提供了哪三种属性、共四种显示层？","a":"①eFXSurfaceNormal属性：大多数UI界面使用，分两种模式——Normal模式（数据通过mView.draw(canvas)画上去，绝大多数UI）和PushBuffer模式（对应视频播放、摄像机摄录/预览，来自Camera的预览数据直接push到Buffer，无须应用层再draw）；②eFXSurfaceBlur属性：UI有朦胧美，像隔着一层毛玻璃；③eFXSurfaceDim属性：UI看起来有点暗，像隔了一层深色玻璃，但不模糊。属性定义参考ISurfaceComposer.h。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"eFXSurfaceBlur和eFXSurfaceDim两种显示层的视觉区别是什么？","a":"Blur（模糊层）：UI看起来有朦胧美，像隔着一层毛玻璃，既暗又模糊；Dim（暗淡层）：UI看起来有点暗，像隔了一层深色玻璃，但从视觉上讲并不模糊。即Blur比Dim多一个模糊效果。两者都由SF端对应的LayerBlur/LayerDim类型实现，且它们没有自己的内部类Surface，直接使用LayerBaseClient的Surface。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"FrameBuffer是什么？Linux的FrameBuffer Device（FBD）起什么作用？","a":"FrameBuffer（帧缓冲）=Frame（帧，一幅图像）+Buffer（存储帧的缓冲区）。Linux平台的虚拟显示设备FBD对应设备文件/dev/fb%d（Android上为/dev/graphics/fb0），它把不同硬件厂商的真实显示设备统一到一个框架下，应用层通过标准的ioctl、mmap等系统调用即可操作显示设备。Buffer就是通过mmap把设备显存映射到用户空间，在这块缓冲上写数据就相当于在屏幕上绘画。这一机制称为Linux FrameBuffer（LFB）。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"DDMS的屏幕截图功能是如何实现的？","a":"framebuffer_service.c的framebuffer_service：open(\"/dev/graphics/fb0\",O_RDONLY)打开fb设备；ioctl(FBIOGET_VSCREENINFO)取屏幕属性；填充fbinfo（bpp、size=xres*yres*bytespp、宽高及RGBA各分量的offset/length）写到输出文件头部；再循环readx从fb读数据、writex写入文件。得到的是RGB565原始数据，可转BMP查看。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"RGB565格式中各分量的offset/length含义是什么？","a":"RGB565表示一个像素中R分量5位、G分量6位、B分量5位，无Alpha分量，一个像素16位占两个字节。x_length是x分量的位数（如R为5）；x_offset是x分量在内存中的位置，如RGB565一个像素两字节但顺序相反，B在前R最后，所以red_offset=11、green_offset=6、blue_offset=0。这些信息在做格式转换（如RGB565转RGB888）时有用。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"PageFlipping（画面交换）的原理是什么？","a":"图像数据一帧一帧有边界（类似TCP，音频流则像UDP），故用PageFlipping：①分配容纳两帧的缓冲，前面的叫FrontBuffer，后面的叫BackBuffer；②消费者用FrontBuffer旧数据，生产者用新数据填BackBuffer，互不干扰；③更新显示时二者互换，循环总能显示最新内容。像翻书动作，本质是只有两个成员的帧缓冲队列。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.1 与Surface相关的基础知识介绍","q":"Surface系统的图像混合有哪两个层面？","a":"①软件层面的混合：例如使用copyBlt进行源数据和目标数据的混合；copyBlt也可由硬件实现（很多2D图形加速就是把copyBlt改由硬件做以提高速度）；②硬件层面的混合：使用Overlay系统提供的接口，必须有硬件支持，主要用于视频输出（视频播放、摄像等），因为视频内容变化快，改用硬件混合效率更高。混合需考虑源颜色和目标颜色叠加等图形学问题。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"SurfaceComposerClient的构造函数做了什么？","a":"SurfaceComposerClient暗示会和SurfaceFlinger交互（SF派生于SurfaceComposer）。构造函数中：sp<ISurfaceComposer> sm(getComposerService())得到SF的Binder代理BpSurfaceFlinger；然后_init(sm, sm->createConnection())；若mClient不为0，还把this加入全局map gActiveConnections中。它建立了与SF的交互通道。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"SurfaceFlinger::createConnection做了什么？Client创建了什么重要资源？","a":"createConnection：token=mTokens.acquire()；new Client(token,this)加入mClientsMap；创建BClient(this,token,client->getControlBlockMemory())返回——BClient接收请求后提交给SF而非Client。Client构造时new MemoryHeapBase(页对齐4096)，getBase()后placement new创建SharedClient——即Surface的CB对象。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"SharedClient的结构是怎样的？","a":"class SharedClient{validate; getIdentity; private: Mutex lock; Condition cv; SharedBufferStack surfaces[NUM_LAYERS_MAX];}，构造时lock(Mutex::SHARED)、cv(Condition::SHARED)——支持跨进程同步。NUM_LAYERS_MAX=31，即一个Client最多31个显示层，每层由对应SharedBufferStack控制生产/消费步调。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"SharedBufferStack有哪些控制读写的成员变量？各自含义？","a":"volatile int32_t head——FrontBuffer编号；available——空闲Buffer个数；queued——脏Buffer（有新数据）个数；inUse——SF当前正在使用的Buffer编号；status——状态码。Buffer按块使用，各有编号（数组索引）。它是通用结构，不限于两个Buffer；若只有两个FB则控制简单：要么SF读1写0，要么反之。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"SurfaceComposerClient::_init初始化了哪些重要成员？","a":"_init中最重要的是三个成员：mSignalServer=sm——SF的代理BpSurfaceFlinger，用于客户端更新完BackBuffer后通知SF做PageFlipping和输出；mControl——共享内存中的SharedClient，Surface系统的ControlBlock；mClient——BClient在客户端的对应物。另初始化mPrebuiltLayerState、mTransactionOpen等。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"SF端围绕一个连接涉及哪几种对象？它们关系如何？","a":"①SurfaceFlinger从BnSurfaceComposer和Thread派生，有单独的工作线程；②BClient与SF之间采用Proxy模式，BClient支持Binder通信，接收客户端请求并派发给SF执行；③Client由createConnection创建，持有共享内存；④SharedClient构建于一块共享内存中，SurfaceComposerClient和Client对象均持有这块共享内存。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.2 SurfaceComposerClient分析","q":"DisplayID是什么？","a":"typedef int32_t DisplayID; 它是一个int整型，意义是屏幕编号，例如双屏手机有内屏和外屏两块屏幕。由于目前Android的Surface系统只支持一块屏幕，所以这个变量的取值都是0。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"SurfaceComposerClient::createSurface的请求端做了什么？","a":"createSurface先以pid生成名字“<pid_xxx>”，再调重载版本：mClient->createSurface(&data,...)跨进程调用返回ISurface（真实类型BpSurface）；若data.token<NUM_LAYERS_MAX则new SurfaceControl(this,surface,data,w,h,format,flags)——以ISurface为参构造SurfaceControl并返回。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"SurfaceFlinger::createSurface响应端的核心逻辑是什么？","a":"①mClientsMap.valueFor(clientId)找Client；②id=client->generateId(pid)，即SharedBufferStack数组索引，超31返回空；③按flags：Normal+ePushBuffers→createPushBuffersSurfaceLocked，Normal→createNormalSurfaceLocked，Blur/Dim→对应createXXX；④getSurface()取ISurface（Bn端）返回。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"createNormalSurfaceLocked的三个关键点是什么？","a":"三关键点：①new Layer(this,display,client,id)（此前按format设格式：TRANSPARENT/TRANSLUCENT→RGBA_8888，OPAQUE→RGB_565）；②layer->setBuffers(w,h,format,flags)设置Buffer；③SF的addLayer_l(layer)把layer按Z轴加入mCurrentState.layersSortedByZ。之后initStates初始化状态。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"SurfaceControl是什么？它的构造函数保存了哪些信息？","a":"SurfaceControl是wrapper类，封装函数方便调用mClient或ISurface的功能。构造保存：mClient（SurfaceComposerClient）、mSurface（createSurface返回的ISurface）、mToken=data.token、mIdentity=data.identity、mWidth/mHeight/mFormat/mFlags。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"LayerBaseClient家族的继承关系是怎样的？","a":"LayerBaseClient从LayerBase派生，四个派生类：Layer、LayerBuffer、LayerDim、LayerBlur。它定义内部类Surface（从ISurface派生，支持Binder通信）；Layer和LayerBuffer分别有内部类SurfaceLayer、SurfaceLayerBuffer继承它，故Normal层getSurface返回的ISurface真实类型是SurfaceLayer；LayerDim/LayerBlur直接用基类Surface。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"LayerBaseClient的构造函数创建了什么关键对象？","a":"构造初始化mIndex=i、mIdentity等，然后lcblk=new SharedBufferServer(client->ctrlblk,i,NUM_BUFFERS,mIdentity)——传SharedClient、Stack数组索引i和常量NUM_BUFFERS（=2）。SF是消费者由SharedBufferServer控制读，客户端用SharedBufferClient控制写。onFirstRef中bindLayer把自己加入Client的mLayers数组。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"Layer::setBuffers做了什么？","a":"setBuffers先从DisplayHardware（显示HAL，0代表第一块屏）取maxTextureSize等信息；然后for(i=0;i<NUM_BUFFERS;i++) mBuffers[i]=new GraphicBuffer()——创建两个GraphicBuffer即PageFlipping的Front/BackBuffer（无参构造，尚无真实存储）；最后mSurface=new SurfaceLayer(mFlinger,clientIndex(),this)。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"SurfaceControl创建后各对象的关系是怎样的？","a":"①SurfaceControl的mClient指向SurfaceComposerClient；②mSurface指向的ISurface，其Binder响应端为SurfaceLayer（Layer的内部类）；③SurfaceLayer的mOwner指向外部类Layer（该变量由基类LayerBaseClient::Surface定义），Layer也有mSurface指向SurfaceLayer，由getSurface返回。内部类最终把请求派发给外部类。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.3 SurfaceControl分析","q":"SurfaceFlinger::addLayer_l做了什么？","a":"ssize_t i=mCurrentState.layersSortedByZ.add(layer,&LayerBase::compareCurrentStateZ)——把新layer按Z轴位置加入排序数组；mCurrentState是SF定义的结构，其layersSortedByZ保存了所有显示层。然后把layer动态转换成LayerBaseClient，若成功则mLayerMap.add(lbc->serverIndex(),lbc)。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.4 writeToParcel和Surface对象的创建","q":"SurfaceControl::writeSurfaceToParcel向Parcel写了哪些内容？","a":"取出token、identity、mClient、mSurface、width、height、format、flags依次写入：writeStrongBinder(client->connection())——Activity端据此构造SurfaceComposerClient；writeStrongBinder(sur->asBinder())——ISurface的Binder；再写token、identity、width、height、format、flags六个int。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.4 writeToParcel和Surface对象的创建","q":"Native的Surface(const Parcel&parcel)构造函数做了什么？","a":"构造中设mBufferMapper；读出mSurface=interface_cast<ISurface>(parcel.readStrongBinder())及token/identity/w/h等；clientBinder非空时：mClient=SurfaceComposerClient::clientForConnection(clientBinder)构造SCC，并new SharedBufferClient(mClient->mControl,mToken,2,mIdentity)。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.4 writeToParcel和Surface对象的创建","q":"Layer端和Native Surface端各有两个GraphicBuffer，为什么示意图中只画两个？","a":"因为四个GraphicBuffer其实操纵的是同一段共享内存。requestBuffer返回的GraphicBuffer通过flatten/unflatten序列化传递，Activity端构造的GraphicBuffer与Layer端的GraphicBuffer管理同一块共享内存。所以Surface中的mBuffers[2]和Layer中的mBuffers[2]是一一对应同一存储的，为简单起见示意图只画两个GraphicBuffer。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.4 writeToParcel和Surface对象的创建","q":"SharedBuffer家族有哪些成员？为什么大量使用内部类？","a":"家族包括基类SharedBufferBase、SharedBufferServer、SharedBufferClient，以及LockCondition、DequeueCondition、QueueUpdate、RetireUpdate、UnlockUpdate等XXXCondition/XXXUpdate内部类，用于更新读写位置。用类封装是因为很多操作使用C++函数对象（Function Object）：对象可保存信息，调用重载的operator()即可利用这些信息。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.4 writeToParcel和Surface对象的创建","q":"SharedBufferBase的构造函数如何建立与SharedBufferStack的关系？","a":"SharedBufferBase(sharedClient,surface
