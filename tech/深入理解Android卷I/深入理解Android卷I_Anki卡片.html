,num,identity)中关键是mSharedStack(sharedClient->surfaces+surface)——使该SharedBufferXXX对象与SharedClient中SharedBufferStack数组的第surface个元素建立关系；mNumBuffers=num（PageFlipping为2）。即SBS和SBC控制的都是数组中的一个元素。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"Native Surface::lock函数的三个关键点是什么？","a":"Surface::lock三关键点：①dequeueBuffer(&backBuffer)从2元素队列取出空闲缓冲；②lockBuffer锁住它；③若frontBuffer（mPostedBuffer，上次绘制所用）存在且尺寸相同，copyBlt(backBuffer,frontBuffer,copyback)把copyback区域旧数据拷过来。之后backBuffer->lock得vaddr填入SurfaceInfo。多线程用mApiLock.tryLock保护。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"Surface::dequeueBuffer内部流程是什么？","a":"dequeueBuffer先mSharedBufferClient->dequeue()返回空闲缓冲号bufIdx（本地tail算出，0/1循环），取backBuffer=mBuffers[bufIdx]；若backBuffer==0（首次）、usage不匹配或needNewBuffer则getBufferLocked：s->requestBuffer(index,usage)跨进程要Buffer，registerBuffer注册映射，最后mBuffers[index]=buffer。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"Layer::requestBuffer做了什么？","a":"Layer::requestBuffer先lcblk->assertReallocate(index)确保该号Buffer未被SF当FrontBuffer用；取SF端mBuffers[index]，强引用计数为1则reallocate(w,h,mFormat,effectiveUsage)分配物理存储，否则new GraphicBuffer(w,h,mFormat,effectiveUsage)；然后mBuffers[index]=buffer并返回。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"Surface::lockBuffer和SharedBufferClient::lock做了什么？","a":"Surface::lockBuffer：validate后调mSharedBufferClient->lock(bufIdx)，其构造LockCondition(this,buf)并waitForCondition。LockCondition的operator()：return(buf!=stack.head||(stack.queued>0&&stack.inUse!=buf))，判断该号Buffer是否被SF当FrontBuffer用。dequeue只按本地tail算编号，故还需lock。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"waitForCondition模板函数是如何工作的？什么是函数对象？","a":"waitForCondition是模板函数：在client.lock互斥锁保护下，while条件不满足且identity/status正常时client.cv.waitRelative(client.lock,1秒)循环等待，超时后再查一次condition()。函数对象是重载了operator()的对象，可当函数用；好处是对象能保存信息（如stack、buf），调用()时可利用这些成员。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"Surface::lock中copyBlt把frontBuffer数据拷到backBuffer的目的是什么？","a":"大部分情况下UI只有一小部分变化（如按钮按下变色），只对应GraphicBuffer中一小块存储（dirtyRegion），整块更新会极大浪费资源。所以需要把变化的和不变的图像叠加：上次绘制的信息保存在mPostedBuffer中（在unlockAndPost里设置），lock时根据copyback=mOldDirtyRegion.subtract(newDirtyRegion)把mPostedBuffer中的旧数据拷贝到BackBuffer，后续绘画只需更新脏区域，节约不少资源。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"Surface::unlockAndPost和queueBuffer做了什么？","a":"unlockAndPost：mLockedBuffer->unlock()；queueBuffer(mLockedBuffer.get())入队；mPostedBuffer=mLockedBuffer保存为旧FrontBuffer。queueBuffer：setDirtyRegion(bufIdx,mDirtyRegion)；mSharedBufferClient->queue(bufIdx)更新写位置；成功后client->signalServer()——通知SF新数据就绪。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.5 lockCanvas和unlockCanvasAndPost分析","q":"SharedBufferClient::queue和updateCondition是如何工作的？","a":"queue(buf)创建QueueUpdate函数对象并updateCondition(update)。updateCondition模板：在client.lock保护下调用update()（operator()），然后client.cv.broadcast()唤醒等待者。QueueUpdate::operator()内容是android_atomic_inc(&stack.queued)，脏Buffer计数加1。与waitForCondition一样都用函数对象。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"GraphicBuffer的类声明和继承关系是怎样的？","a":"GraphicBuffer继承EGLNativeBase<android_native_buffer_t,GraphicBuffer,LightRefBase<GraphicBuffer>>和Flattenable。故：①从struct android_native_buffer_t派生；②LightRefBase提供轻量级引用计数；③Flattenable提供flatten/unflatten序列化，使GraphicBuffer信息可写入Parcel并经Binder传输。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"android_native_buffer_t结构体有哪些关键成员？","a":"android_native_buffer_t第一个成员是struct android_native_base_t common（依编译特性在派生类内存中排第一），构造设magic和version；然后width、height、stride、format、usage、reserved[2]；关键成员buffer_handle_t handle保存与显示内存分配/管理相关的内容；还有reserved_proc[8]。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"buffer_handle_t和native_handle_t是什么？","a":"typedef const native_handle* buffer_handle_t。native_handle_t为struct{int version; int numFds; int numInts; int data[0];}：version为sizeof本结构，numFds/numInts是后随的文件描述符和int个数，data[0]是数据区首地址（柔性数组）。它是GraphicBuffer的精髓——跨进程传递共享内存句柄的核心结构。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"GraphicBuffer的无参构造和reallocate分别做了什么？","a":"无参构造：mOwner(ownData)、mBufferMapper(单例GraphicBufferMapper)，宽高等置0、handle=NULL，不分配存储。reallocate：mOwner非ownData返回INVALID_OPERATION；handle非空先free(handle)；再initSize——由单例GraphicBufferAllocator执行alloc(w,h,format,reqUsage,&handle,&stride)分配并填充尺寸信息。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"GraphicBufferAllocator的构造函数做了什么？为什么要层层封装？","a":"构造中hw_get_module(GRALLOC_HARDWARE_MODULE_ID,&module)会加载“libgralloc.硬件平台名.so”（如G7为libgralloc.qsd-8k.so），再gralloc_open(module,&mAllocDev)。该库用于分配显示内存，层层封装的目的是屏蔽不同硬件平台的差别。可用adb getprop ro.board.platform查平台名；pmem设备可分配连续内存（Camera等需要）。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"GraphicBufferAllocator::alloc如何选择硬件或软件分配方式？","a":"if(usage&GRALLOC_USAGE_HW_MASK) err=mAllocDev->alloc(mAllocDev,w,h,format,usage,handle,stride)——走硬件HAL分配；else err=sw_gralloc_handle_t::alloc(w,h,format,usage,handle,stride)——SW软件分配，与硬件无关。软件方式与硬件方式最终都通过handle（native_handle_t）返回分配结果。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"sw_gralloc_handle_t::alloc是如何分配内存的？","a":"sw_gralloc_handle_t::alloc：计算bpr=(w*bpp+3)&~3及size=bpr*h并按页对齐；ashmem_create_region(\"sw-gralloc-buffer\",size)创建共享内存；mmap(0,size,prot,MAP_SHARED,fd,0)得起始地址base；new一个sw_gralloc_handle_t保存fd、size、base、prot；最后*pStride=stride、*pHandle=hnd返回。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"GraphicBuffer的flatten和unflatten做了什么？为什么说是mini版乾坤大挪移？","a":"响应端reply->write(*buffer)调flatten：宽高等写入buf数组，handle的numFds个fd和numInts个int分别memcpy进Parcel。请求端reply.read(*buffer)调unflatten：恢复width/height/stride/format/usage，native_handle_create后memcpy还原并置mOwner=ownHandle。两端GraphicBuffer由此管理同一块共享内存，关键在传递native_handle。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"sw_gralloc_handle_t::registerBuffer的作用是什么？lock/unlock呢？","a":"registerBuffer：对unflatten得到的共享内存fd做mmap——if(hnd->pid!=getpid()){base=mmap(0,hnd->size,hnd->prot,MAP_SHARED,hnd->fd,0);hnd->base=base;}即在本进程完成内存映射。lock直接返回*vaddr=hnd->base供作画；unlock则return NO_ERROR无任何操作。SW方式下实现都很简单。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.6 GraphicBuffer介绍","q":"从应用层角度如何看待GraphicBuffer？","a":"可以把GraphicBuffer当作一个构架在共享内存之上的数据缓冲。它封装了和硬件相关的细节，简化应用层逻辑。想深入研究的读者建议按流程图来分析，因为流程体现了调用顺序、表达了调用者的意图和目的，把握了流程才不会迷失在茫茫源码海洋中。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.4.7 深入分析Surface的总结","q":"Surface系统最难的部分是什么？包括哪三个问题？","a":"最难的是Native Surface的创建和使用，包括三方面：①Activity的UI和Surface的关系是怎样的（8.2节回答）；②Activity中所使用的Surface是怎么和SurfaceFlinger挂上关系的（8.3节回答）；③进一步深入研究Surface和SF的关系，以及生产/消费步调的中枢控制机构SharedBuffer家族和数据的承载者GraphicBuffer（8.4节回答）。本章前四节都围绕这个Surface展开。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.1 SurfaceFlinger的诞生","q":"SurfaceFlinger在哪里诞生？它的类声明说明了什么？","a":"SF驻留system_server进程（与Audio的几个Service不同），在SystemServer.init1中创建：instantiate()执行defaultServiceManager()->addService(String16(\"SurfaceFlinger\"),new SurfaceFlinger())。类声明BnSurfaceComposer+Thread派生——说明SF有单独工作线程做混合。构造和init只读debug属性，没调run。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.1 SurfaceFlinger的诞生","q":"SF的工作线程是在哪里启动的？onFirstRef做了什么？","a":"在onFirstRef中：run(\"SurfaceFlinger\",PRIORITY_URGENT_DISPLAY)创建并启动工作线程（对象第一次被sp化时调用）；然后mReadyToRunBarrier.wait()等待同步条件。Barrier封装了一个Mutex和一个Condition。该同步条件在工作线程的readyToRun函数末尾通过mReadyToRunBarrier.open()触发。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.1 SurfaceFlinger的诞生","q":"SF的readyToRun做了哪些初始化？bootanim是什么时候启动的？","a":"readyToRun：①graphicPlane(dpy)取屏，new DisplayHardware并setDisplayHardware；②new MemoryHeapBase(4096)后placement new创建surface_flinger_cblk_t（SF的CB，只存信息）；③填充display_cblk_t、hw.makeCurrent；④OpenGL初始化；⑤barrier.open()唤醒onFirstRef的wait；⑥启动bootanim开机动画。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.1 SurfaceFlinger的诞生","q":"GraphicPlane和DisplayHardware分别是什么？","a":"GraphicPlane是屏幕在SF代码中的对应物，目前Android只支持一块屏，SF定义了一元数组GraphicPlane mGraphicPlanes[1]；它的重要函数setDisplayHardware把代表显示设备的HAL对象关联进来。DisplayHardware（派生自DisplayHardwareBase）是显示相关的HAL对象，在工作线程中new出来，其init函数完成FrameBufferNativeWindow创建、Overlay打开和EGL初始化等工作。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.1 SurfaceFlinger的诞生","q":"DisplayHardware::init做了什么？FrameBuffer到底在哪里被使用？","a":"init中mNativeWindow=new FramebufferNativeWindow()——它管理FrameBuffer，内建两个FrameBuffer作Front/BackBuffer；有Overlay模块则overlay_control_open；然后EGL初始化：eglGetDisplay得EGLDisplay，eglCreateWindowSurface把EGL与Display系统绑定。SF把各Surface数据混合后传到FrameBuffer显示。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"SurfaceFlinger工作线程threadLoop的四个关键步骤是什么？","a":"threadLoop四步：①waitForEvent()等重绘事件；②handleTransaction——事务处理（mTransactionCount==0且有eTransactionNeeded|eTraversalNeeded时）；③handlePageFlip——各层取新数据生成纹理；④handleRepaint重绘，再unlockClients()和postFramebuffer()投递。不能绘制时unlockClients后usleep(16667)。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"waitForEvent等待的是什么事件？谁触发它？","a":"waitForEvent在while(true)中mEventQueue.waitMessage(timeout)等消息，收到MessageQueue::INVALIDATE（重绘消息）后return。触发者是客户端：queueBuffer成功后调client->signalServer()（BpSurfaceFlinger），SF端signal()→signalEvent()→mEventQueue.invalidate()加入INVALIDATE消息。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"handlePageFlip做了什么？","a":"①lockPageFlip(currentLayers)——遍历mDrawingState.layersSortedByZ（当前需显示的层，区别于保存所有层的mCurrentState）调用各层lockPageFlip；②visibleRegions为真则computeVisibleRegions算可见区域，mWormholeRegion=screenRegion.subtract(opaqueRegion)；③unlockPageFlip——各层做区域清理。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"Layer::lockPageFlip做了什么？纹理是什么概念？","a":"Layer::lockPageFlip：①lcblk->retireAndLock()返回FrontBuffer索引buf；②newFrontBuffer=getBuffer(buf)，mPostedDirtyRegion=dirty.intersect(bounds)裁剪；③尺寸匹配清mFreezeLock；④getQueuedCount()非0则signalEvent；⑤脏区非空则reloadTexture——把FrontBuffer图像绘成纹理存入mTextures。纹理可看做一张图片。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"handleRepaint和composeSurfaces做了什么？","a":"handleRepaint：mInvalidRegion.orSelf(mDirtyRegion)，空则返回；设OpenGL矩阵，按硬件flags算脏区，再composeSurfaces(mDirtyRegion)，清mDirtyRegion。composeSurfaces遍历mDrawingState.layersSortedByZ，对可见区域与dirty有交集的层调layer->draw(clip)——按Z轴由里到外依次绘制，后画的可能遮盖先画的。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"LayerBase::draw、Layer::onDraw和drawWithOpenGL的关系是什么？","a":"LayerBase::draw先glEnable(GL_SCISSOR_TEST)再调子类onDraw(clip)。Layer::onDraw：取mFrontBufferIndex对应纹理（无则用0号），holes区域clearWithOpenGL，再drawWithOpenGL。后者validateTexture内glBindTexture绑定纹理；glEnable(GL_TEXTURE_2D)，按transform旋转、NPOT时缩放，glScissor裁剪后glDrawArrays绘制。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.2 SF工作线程分析","q":"unlockClients和postFramebuffer分别做了什么？","a":"unlockClients遍历各层调finishPageFlip()——Layer实现为lcblk->unlock(mFrontBufferIndex)，释放占用的FrontBuffer索引。postFramebuffer：mInvalidRegion非空则hw.flip(mInvalidRegion)——其中mPageFlipCount++后eglSwapBuffers(dpy,surface)，完成FrameBuffer的PageFlip，图像显示到屏幕。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"SurfaceFlinger为什么需要事务（Transaction）？以什么例子说明？","a":"事务目的是把控制操作（setPosition等）的修改一次性提交给SF，类似数据库事务一次commit多个SQL。例子：WMS的createSurfaceLocked在Surface.openTransaction()与closeTransaction()之间调用mSurface.setPosition(...)。setPosition、setAlpha、show/hide、setSize、setFlag等都需走事务，因为它们可能影响其他显示层（如A移走后被遮的B可能变可见）。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"SurfaceComposerClient::openGlobalTransaction和openTransaction做了什么？layer_state_t是什么？","a":"openGlobalTransaction（静态）：gLock下遍历全局gActiveConnections中所有SurfaceComposerClient，记入gOpenTransactions并逐个调openTransaction()。openTransaction：mTransactionOpen++（计数控制提交），并确保mPrebuiltLayerState=new layer_state_t。layer_state_t保存Surface的位置、宽高等信息。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"setPosition的调用链是怎样的？状态何时传给SF？","a":"JNI的Surface_setPosition→SurfaceControl::setPosition→client->setPosition(mToken,x,y)→_lockLayerState(id)找到layer_state_t，置s->what|=ePositionChanged并设s->x、s->y。此时只是本地修改，直到closeTransaction才经mClient->setState(count,mStates.array())一次性跨进程提交给SF。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"closeGlobalTransaction的三步是什么？","a":"三步：①sm->openGlobalTransaction()——SF端只android_atomic_inc(&mTransactionCount)；②各client->closeTransaction()——把mStates数组（每Surface一个layer_state_t）经setState提交并clear；③sm->closeGlobalTransaction()——计数减1，减到0时才signalEvent()，并等mResizeTransationPending结束。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"SF的setClientState做了什么？eTraversalNeeded表示什么？","a":"对每个layer_state_t：getLayerUser_l(s.surface|cid)找到显示层；若what&ePositionChanged则layer->setPosition(s.x,s.y)，成功则flags|=eTraversalNeeded。flags非0则setTransactionFlags(flags)——atomic_or设mTransactionFlags并signalEvent()触发threadLoop。eTraversalNeeded表示需遍历所有显示层处理。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"为什么说getTransactionFlags这个名字有点名不副实？","a":"它的实现是return android_atomic_and(~flags,&mTransactionFlags)&flags——先用原子操作把mTransactionFlags中对应位清掉，再返回旧值与flags的与。也就是说它不只是get（读），还修改（清除）了mTransactionFlags，从这个角度看名字名不副实。threadLoop用其结果决定是否调handleTransaction。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"handleTransaction和handleTransactionLocked做了什么？","a":"handleTransaction在mStateLock下调handleTransactionLocked，再对ditchedLayers各层ditch()收尾（被hide的层）。后者：eTraversalNeeded时遍历各层调doTransaction(0)更新层内状态，涉及eVisibleRegion则mVisibleRegionsDirty=true；方向变化则plane.setOrientation处理横竖屏；最后commitTransaction()。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.3 Transaction分析","q":"commitTransaction做了什么？","a":"mDrawingState=mCurrentState——绘制状态使用更新后的当前状态；mResizeTransationPending=false；mTransactionCV.broadcast()——触发条件变量，使等待在closeGlobalTransaction函数中的线程可以放心返回。每个显示层内部也有状态变量，具体的事务处理在各层的doTransaction函数中完成。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.5.4 关于SurfaceFlinger的总结","q":"如何总体评价SurfaceFlinger的复杂度与工作集中点？","a":"SF不如AudioFlinger复杂，工作集中在工作线程。流程：waitForEvent等INVALIDATE消息→handleTransaction处理事务→handlePageFlip各层从FrontBuffer取新数据生成纹理→handleRepaint按Z轴用OpenGL重绘（composeSurfaces/drawWithOpenGL）→unlockClients释放FrontBuffer→postFramebuffer调eglSwapBuffers输出到屏幕。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"Surface系统中的CB对象指什么？SBT有哪些控制参数？","a":"CB指SharedBuffer家族（SBS/SBC/SBT），是生产/消费步调控制的中枢。SBT控制参数：head（FrontBuffer编号）、available（空闲缓冲个数）、queued（SBC投递的脏缓冲个数）、inUse（SBS正在使用的缓冲编号），再联合SBC的tail（SBC自有变量）。虽然PageFlipping只用两Buffer，但SBT算法支持多缓冲，缓冲按块用编号表示。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"SBS（SharedBufferServer）创建时如何初始化控制参数？","a":"SharedBufferServer构造中mSharedStack->init(identity)把inUse设为-1；然后head=num-1（=1）、available=num（=2）、queued=0；再设reallocMask=0，并memset清零dirtyRegion。即创建后head=1、available=2、queued=0、inUse=-1。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"SBC（SharedBufferClient）创建时做了什么？computeTail如何计算？","a":"SharedBufferClient构造初始化tail(0)后调用tail=computeTail()。computeTail用do-while循环读取稳定的avail=stack.available（=2）和head=stack.head（=1），newTail=head-avail+1=1-2+1=0；若newTail<0则+=mNumBuffers，若>=mNumBuffers则-=mNumBuffers，返回newTail=0。即tail初始为0。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"SBC的dequeue流程是怎样的？有什么潜在危险？","a":"dequeue用DequeueCondition（operator()返回stack.available>0）waitForCondition；成功后atomic_dec使available减1；int dequeued=tail（返回tail加1前旧值0）；tail=(tail+1>=mNumBuffers)?0:tail+1在0/1间循环。危险：dequeued是tail旧值且tail是SBC本地变量，SBS端不可见，故该缓冲不保证真空闲——SBS可能正用着，需靠lock保证。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"为什么SBC需要先dequeue再lock两个步骤？","a":"因为二者分工不同：dequeue只是根据本地变量tail计算本次应当使用的Buffer编号（上次用0号这次就用1号，在0/1间循环），并不保证该缓冲未被SF使用；lock则用LockCondition（buf!=stack.head||(stack.queued>0&&stack.inUse!=buf)）确保这个编号的Buffer没有被SF当作FrontBuffer使用。dequeue后available减1，lock后才真正可以安全地在该缓冲上作画。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"SBC的queue和QueueUpdate做了什么？","a":"Activity端绘制完UI后投递BackBuffer：queue(buf)创建QueueUpdate函数对象，经updateCondition（加Mutex、执行后broadcast）调用QueueUpdate::operator()——android_atomic_inc(&stack.queued)，即脏Buffer计数从0变1，表示0号缓冲已进入queued区域等待消费。queue后才会调用signalServer触发SF消费，所以在此之前格局不会变化。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"SBS的retireAndLock（RetireUpdate）流程是怎样的？","a":"retireAndLock用RetireUpdate，其operator()：head=stack.head（1）；atomic_write置inUse=1；循环中queued为0返回NOT_ENOUGH_DATA，否则cmpxchg使queued减1变0；head=(head+1>=numBuffers)?0:head+1变0；再atomic_write置inUse=0、head=0；atomic_inc使available变2；return head（0，新FrontBuffer编号）。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"SBS的unlock（UnlockUpdate）做了什么？PageFlip前后head/tail有何变化？","a":"UnlockUpdate::operator()执行android_atomic_write(-1,&stack.inUse)，即把inUse重新置为-1，释放对缓冲的占用。比较unlock后与SBC/SBS刚创建时的状态图会发现：tail和head刚好反了（创建时head=1、SBC的tail=0；一轮结束后head=0、tail=1），这就是PageFlip——前后台缓冲互换。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.1 Surface系统的CB对象分析","q":"作者对SharedBufferStack中大量使用原子操作而非锁有什么疑问？","a":"这些函数对象大量用原子操作本为避免锁，但updateCondition和waitForCondition本身都用了Mutex——即函数对象实际都在锁保护下执行。那么do{queued=stack.queued;...}while(cmpxchg(queued,queued-1,&stack.queued))这类循环在锁保护下毫无意义（有锁时无其他线程能改queued）。作者把函数对象移到锁外执行，真机运行无异常，但尚不知Google的设计意图。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.2 ViewRoot的你问我答","q":"ViewRoot和View类的关系是什么？","a":"ViewRoot是View视图体系的根。每一个Window（注意是Window，如PhoneWindow）有一个ViewRoot，它的作用是处理layout和View视图体系的绘制工作。视图体系包括Views和ViewGroups（SDK中的View类），这些View需要通过draw画出来，而ViewRoot就是用来draw它们的；ViewRoot本身没有draw/onDraw函数。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.2 ViewRoot的你问我答","q":"ViewRoot和它所控制的View及其子View使用同一个Canvas吗？","a":"是的。ViewRoot提供Canvas给它所控制的View，它们使用同一个Canvas；但Canvas使用的内存不是固定的，而是每次通过Surface的lockCanvas得到的。进一步说：一个Window将和一个Surface绑定在一起，绘制前ViewRoot会从Surface中lock出一个Canvas；Canvas有一个bitmap，绘制UI时数据最终都画在bitmap对应的这块内存上。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.2 ViewRoot的你问我答","q":"同一个ViewRoot下不同类型的View使用同一个Surface吗？SurfaceView有什么不同？","a":"是的，同一Window下各UI单元（按钮、文本框等）共用一个Surface，但SurfaceView除外。SurfaceView的绘制一般在单独的线程上，由应用层主动调用lockCanvas、draw、unlockCanvasAndPost来完成绘制流程，相当于抛开了ViewRoot的控制直接和屏幕打交道，在camera、video方面用得最多。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"LayerBuffer如何被创建？其内部结构是怎样的？","a":"createPushBuffersSurfaceLocked：new LayerBuffer(this,display,client,id)、initStates(w,h,flags)、addLayer_l(layer)。LayerBuffer定义内部类Source（数据提供者），派生BufferSource和OverlaySource；其mSurface真实类型是内部类SurfaceLayerBuffer（继承LayerBaseClient::Surface，是外部类的Proxy）。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"CameraService的registerPreviewBuffers做了什么？BufferHeap是什么？","a":"registerPreviewBuffers从mHardware（Camera HAL，如虚拟设备CameraHardwareStub）取预览尺寸，构造ISurface::BufferHeap buffers(w,h,w,h,YCrCb_420_SP格式,mOrientation,0,mHardware->getPreviewHeap())，再mSurface->registerBuffers(buffers)。BufferHeap是ISurface内部类，封装一个IMemoryHeap。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"CameraHardwareStub为preview准备的内存结构是怎样的？","a":"initHeapLocked中：mPreviewHeap=new MemoryHeapBase(mPreviewFrameSize*kBufferCount)，kBufferCount为4；再创建4个MemoryBase：mBuffers[i]=new MemoryBase(mPreviewHeap,i*mPreviewFrameSize,mPreviewFrameSize)。即一块MemoryHeap上构建4个MemoryBase，构成成员数为4的缓冲队列供preview线程循环使用。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"LayerBuffer::registerBuffers做了什么？","a":"SurfaceLayerBuffer::registerBuffers先getOwner()取外部类LayerBuffer并调其registerBuffers(buffers)；外部类在mLock下new BufferSource(*this,buffers)，getStatus()==NO_ERROR则mSource=source保存数据源。BufferSource内部mBufferHeap指向传入buffers。不论多少层封装，最终数据存储区域还是Camera的mPreviewHeap。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"Camera preview线程是如何生产和传递数据的？postBuffer为何只传offset？","a":"previewThread循环：offset=帧号*mPreviewFrameSize；取mBuffers[帧号]接收硬件数据写入frame=heap->base()+offset；mDataCb(CAMERA_MSG_PREVIEW_FRAME,...)回调传上层；帧号0~3循环。handlePreviewData由mem->getMemory得偏移再postBuffer(offset)。因BufferHeap已把整块MemoryHeap注册到SF端，数据没搬动，只需告知位置。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"BufferSource::postBuffer做了什么？LayerBuffer::Buffer是什么？","a":"BufferSource::postBuffer(offset)：取mBufferHeap，检查offset+mBufferSize是否超heap大小；buffer=new LayerBuffer::Buffer(buffers,offset,mBufferSize)，setBuffer赋给成员mBuffer（旧的被替换），再mLayer.invalidate()触发SF重绘。Buffer的mNativeBuffer中img.base=heap->base()+offset指向内存块起始地址。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"LayerBuffer的onDraw是如何绘制的？","a":"LayerBuffer::onDraw取getSource()（mSource，实际类型BufferSource）调用source->onDraw(clip)；BufferSource::onDraw中sp<Buffer> ourBuffer=getBuffer()（返回成员mBuffer，加Mutex取），然后mLayer.drawWithOpenGL(clip,mTexture)——根据当前Buffer生成一张贴图（纹理）然后绘制它。注意使用Buffer的时候没有锁的控制。"},{"ch":"第8章 · 深入理解Surface系统","sec":"8.6.3 LayerBuffer分析","q":"LayerBuffer的数据传递存在什么问题？作者给出了什么改进建议？","a":"生产者有含4个成员的缓冲队列（Camera线程循环更新mBuffers），消费者只有一个mBuffer（SF工作线程使用），两线程间无锁同步——使用者还在用mBuffers[0]时生产者可能又更新了它，导致屏幕前后帧数据混杂、画面不连续（作者实测加延时可复现）。改LayerBuffer难度大，作者建议在读写具体缓存时加同步（使用时lock、用完unlock），不必修改LayerBuffer。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.1 概述","q":"Vold是什么？它负责哪些工作？","a":"Vold即Volume Daemon，是Android平台外部存储系统的管控中心，一个Native后台进程。\n负责管理和控制外部存储设备，包括SD卡插拔事件检测、挂载、卸载、格式化等。工作重点有二：接收处理内核的Uevent事件；处理来自Java层MountService的请求。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.1 概述","q":"Rild是什么？它在通信系统中处于什么位置？","a":"Rild即Radio Interface Layer Daemon，是智能手机通信管理和控制的后台进程，接打电话、收发短信/彩信、GPRS等都需要它参与。\n它是AP和BP在软件层面通信的中枢：AP上的应用通过Rild发送AT指令给BP（基带处理器），BP的信息也通过Rild回传给AP上的应用程序。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.1 概述","q":"MountService和Vold是什么关系？","a":"MountService是Java世界中和Vold交互的模块，可看成Java世界的Vold：\n一方面接收来自Vold的消息，如应用常监听的ACTION_MEDIA_MOUNTED/ACTION_MEDIA_EJECT广播就是它根据Vold的信息触发的；另一方面向Vold发送控制命令，如挂载、卸载SD卡等都由它发命令给Vold执行。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.1 概述","q":"Phone应用和Rild是什么关系？","a":"Phone是较复杂的Java应用程序，负责与Rild交互。\n简单来说，Phone拨打电话时需要发送对应的命令（AT指令的封装）给Rild执行，Rild再通过串口把AT指令发给BP。Phone和Rild通过rild socket通信，Java层的RIL类是rild socket的客户端。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2 Vold的原理与机制分析","q":"Vold内部由哪三个模块组成？各自职责是什么？","a":"三个模块：\n1) NetlinkManager(NM)：接收来自内核的Uevent消息（如SD卡插拔）并转发给VM；\n2) VolumeManager(VM)：处理消息、执行操作，把信息经CL发给MountService，也执行其命令；\n3) CommandListener(CL)：封装一个Socket，是监听端（服务端），接收MountService的控制命令，VM/NM也经它向MountService发消息。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2 Vold的原理与机制分析","q":"Vold和MountService为什么用Socket通信而不用Binder？","a":"Vold和MountService（system_server进程）间通信没有用Binder，而是直接用Socket。\n这样代码量和类的派生关系都简单不少。事实上Socket是除Binder外Android中最常用的IPC机制，本章的Vold和Rild都用Socket做IPC。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.1 Netlink和Uevent介绍","q":"Linux的Netlink是什么机制？","a":"Netlink是Linux中用户空间进程和Kernel通信的机制：用户进程可接收Kernel的信息（如USB/SD卡插拔消息），也可向Kernel发送控制命令。\nLinux没有为它单独设计系统调用，而是复用Socket接口，只是创建时地址簇为PF_NETLINK，第三个参数用NETLINK_KOBJECT_UEVENT表示接收内核Uevent。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.1 Netlink和Uevent介绍","q":"Uevent是什么？一条SD卡插入的Uevent包含哪些关键字段？","a":"Uevent（U代表User space）是内核通过Netlink发给用户空间的一串字符串，告知发生了什么。\n关键字段：ACTION（add/remove/change）、DEVPATH（设备在/sys中的路径）、SUBSYSTEM（block块设备等）、MAJOR与MINOR（主次设备号，联合标识设备）、DEVNAME、DEVTYPE（disk或partition）、NPARTS（分区数）、SEQNUM（序号）。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.1 Netlink和Uevent介绍","q":"内核在什么情况下会发出Uevent消息？","a":"两种情况：\n1) 设备发生变化时触发：如设备插入、拔出，若Vold此前已建立Netlink通信即可收到；\n2) 应用层触发：设备在/sys对应目录下有名为uevent的文件，往里写入指定数据（如\"add\\n\"）会触发Kernel发送该设备相关的Uevent。Vold启动时就借此获得已有设备的当前信息。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.2 初识Vold","q":"Vold的main函数有哪些关键步骤？","a":"八个关键点：\n1) 创建VolumeManager；2) 创建NetlinkManager；3) 创建CL并分别vm/nm.setBroadcaster(cl)；4) 启动VM；5) process_config按vold.fstab配置VM；6) 启动NM；7) coldboot触发内核发Uevent，并检查UMS状态；8) 启动CL。最后无限sleep循环。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.2 初识Vold","q":"Vold main中的coldboot是干什么的？","a":"coldboot(\"/sys/block\")往/sys/block下各设备对应的uevent文件写入\"add\\n\"，触发内核发送这些设备的Uevent消息。\n目的是让刚启动的Vold获得系统中已存在的存储设备信息（因设备变化发生在Vold启动前的Uevent它收不到）。这是应用层触发Uevent的典型用法。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"Vold使用NM模块的流程是什么？创建NM有什么值得注意的细节？","a":"流程三步：调用Instance创建NM对象（单例模式sInstance）、调用setBroadcaster设置CL对象、调用start启动NM。\n注意：虽然NM设置了CL，但Vold的NM并没有通过CL发送消息和接收命令，所以架构图中NM和CL模块之间没有连接线。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"NetlinkManager::start是如何与内核建立Netlink通信的？","a":"两步：\n1) 建socket：用sockaddr_nl地址（nl_family=AF_NETLINK，nl_pid=getpid()，nl_groups=0xffffffff），socket(PF_NETLINK,SOCK_DGRAM,NETLINK_KOBJECT_UEVENT)，setsockopt设接收缓冲区，必须bind；\n2) 创建NetlinkHandler（传入socket句柄）并调其start，后续工作由它完成。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"NetlinkHandler(NLH)的类派生关系是怎样的？","a":"派生链：NetlinkHandler → NetlinkListener → SocketListener。\nNLH构造时把与Kernel通信的socket句柄传给NetlinkListener，后者又调SocketListener(socket,false)，listen参数为false，表示NLH不是监听端。SocketListener构造中保存mSock、初始化mClientsLock、创建SocketClient列表mClients。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"SocketListener的startListener做了哪些准备工作？","a":"1) mSocketName非空时用android_get_control_socket取句柄；\n2) mListen为true时listen(mSock,4)（NLH为false不走）；为false时以mSock构造SocketClient加入mClients（并非真实客户端）；\n3) pipe创建匿名管道mCtrlPipe（[0]读[1]写，控制线程退出）；\n4) pthread_create创建工作线程，线程函数threadStart。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"SocketListener::runListener的工作循环是怎样的？","a":"while(1)循环：\n1) 把mCtrlPipe[0]和mClients各客户端fd加入read_fds，计算最大fd（select第一参数须为max+1）；\n2) select等待；管道可读则break退出（一般不退出）；\n3) listen端mSock可读表示有客户端connect，accept后加入mClients；\n4) 遍历mClients，对可读fd调onDataAvailable；返回false则close并从列表删除。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"NetlinkListener::onDataAvailable如何处理数据？NetlinkEvent的作用是什么？","a":"onDataAvailable先recv从socket收数据到mBuffer（出错返回false，连接会被close），然后new一个NetlinkEvent并调decode(mBuffer,count)解析，最后调onEvent(evt)。\ndecode把Uevent字符串信息（Action、SUBSYSTEM等）填充到NetlinkEvent对象中，之后处理就不用再解析字符串了。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.3 NetlinkManager模块分析","q":"NetlinkHandler::onEvent如何分发不同子系统的Uevent？","a":"按subsystem分发：\n\"block\"（块设备，磁盘属此类）→ VM的handleBlockEvent；\"switch\" → VM的handleSwitchEvent（处理SD卡挂载为磁盘的通知）；\"battery\"、\"power_supply\" → 与外部存储无关，不处理。\nNM模块总结：从Kernel收Uevent，转成NetlinkEvent对象，最后调VM的处理函数处理。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.4 VolumeManager模块分析","q":"Vold如何使用VM模块？process_config如何解析/etc/vold.fstab？","a":"使用流程：Instance创建VM、setBroadcaster设CL、start启动、process_config配置。\nprocess_config读/etc/vold.fstab，strsep按制表符解析type、label、mount_point。type为dev_mount时：part为auto则new DirectVolume(vm,label,mount_point,-1)，否则atoi(part)指定分区；addPath加sysfs路径，最后addVolume(dv)。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.4 VolumeManager模块分析","q":"DirectVolume是什么？addPath和Uevent的DEVPATH有什么关系？","a":"DirectVolume从Volume类派生，可看成一张外部存储卡在代码中的代表，封装加载/卸载、格式化等操作。构造时保存mPartIdx、创建mPaths列表，初始状态State_NoMedia。\naddPath把存储卡接口的设备路径存入mPaths；此路径与Uevent的DEVPATH对应，收到Uevent时将DEVPATH与之做strncmp前缀比较，即可判断是哪张卡的DirectVolume变动。手机一般只有一个存储卡接口，故只有一个DirectVolume。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.4 VolumeManager模块分析","q":"VM收到block类型的Uevent后如何处理？handleBlockEvent/createDeviceNode做了什么？","a":"onEvent调VM的handleBlockEvent，VM遍历mVolumes中每个Volume调其handleBlockEvent。\nDirectVolume先比对DEVPATH判断归属；若是add动作则取MAJOR/MINOR，createDeviceNode用mknod在/dev/block/vold/下创建设备节点，再按DEVTYPE分派：disk→handleDiskAdded，partition→handlePartitionAdded；remove/change各有对应处理。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.5 CommandListener模块分析","q":"CommandListener是如何创建的？它如何处理命令？","a":"CL用new创建，基类FrameworkListener(\"vold\")监听vold socket。派生链：CommandListener→FrameworkListener→SocketListener，是Socket的监听端。\n构造中registerCmd注册DumpCmd、VolumeCmd、AsecCmd、ShareCmd、StorageCmd、XwarpCmd等命令对象（Command模式，各实现runCommand），存入mCommands列表。其客户端就是MountService。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.5 CommandListener模块分析","q":"FrameworkListener::onDataAvailable收到数据后如何分发命令？","a":"onDataAvailable用read从客户端socket读数据到buffer，遍历buffer遇'\\0'就调dispatchCommand(c, buffer+offset)分发一条命令（缓冲区可能有多条以\\0分隔的命令）。\ndispatchCommand根据命令名（如\"Volume\"、\"Share\"）从mCommands中找到对应命令对象，最终调其runCommand函数处理请求。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"MountService的构造函数做了哪些事？NativeDaemonConnector的作用是什么？","a":"MountService实现INativeDaemonConnectorCallbacks接口。构造中创建HandlerThread并用其Looper创建MountServiceHandler；再创建NativeDaemonConnector(this,\"vold\",10,\"VoldConnector\")并起线程运行。\nNativeDaemonConnector负责与Vold的CL socket通信；接口提供onDaemonConnected（连上后回调）和onEvent（收到数据后回调）。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"SD卡插入后，DirectVolume::handleDiskAdded做了什么？","a":"保存Uevent中MAJOR/MINOR到mDiskMajor/mDiskMinor，由NPARTS得分区数mDiskNumParts（无则按1）；设置mPendingPartMap记录分区加载情况。\n若无分区则置State_Idle，否则（分区未加载完）置State_Pending。最后通过getBroadcaster()（即CL）的sendBroadcast向MountService发送VolumeDiskInserted消息。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"MountService收到VolumeDiskInserted消息后如何处理？","a":"MountService在onEvent中按code处理，VolumeDiskInserted/Removed/BadRemoval同属一类，从中解析出label(\"sdcard\")、path(\"/mnt/sdcard\")和主次设备号。\n对VolumeDiskInserted，单独启动线程调doMountVolume(path)，它通过mConnector.doCommand(\"volume mount /mnt/sdcard\")给Vold发命令——又回到Vold，由CL接收处理。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"CL收到\"volume mount /mnt/sdcard\"后如何处理？","a":"CL按命令名\"volume\"找到VolumeCmd，调其runCommand。按argv[1]分派：mount→vm->mountVolume(argv[2])、unmount→unmountVolume、format→formatVolume等。\nmountVolume内用lookupVolume按挂载路径(/mnt/sdcard)找到DirectVolume，调v->mountVol()。成功后cli->sendMsg(CommandOkay)把结果发回MountService。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"Volume::mountVol挂载SD卡的主流程是怎样的？","a":"1) 已mount则直接返回；\n2) 置State_Checking，Fat::check检查FAT分区（挂为磁盘时须能被Windows识别）；\n3) Fat::doMount到/mnt/secure/staging；\n4) protectFromAutorunStupidity删autorun.inf；\n5) createBindMounts保护.android_secure；\n6) doMoveMount移到/mnt/sdcard；\n7) setState(State_Mounted)。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"protectFromAutorunStupidity是干什么的？","a":"它把存储卡中臭名昭著的自动运行文件autorun.inf找出来并删掉。\n在Windows上把SD卡挂载为磁盘后双击，会自动运行autorun.inf，很多病毒和木马都借它传播。出于安全考虑，Android在挂载SD卡时主动删除该文件。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"createBindMounts如何保护.android_secure目录？","a":"三步：\n1) 旧目录android_secure则rename为/mnt/secure/staging/.android_secure（Linux隐藏目录）；\n2) 用mount的bind选项把.android_secure挂到/mnt/secure/asec——asec是secure container，保存装在SD卡上的APP信息（APP2SD为2.2引入）；\n3) 再把tmpfs只读挂到.android_secure，原内容只能经/mnt/secure/asec访问，且仅root可访问。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.6 Vold实例分析","q":"挂载完成后如何一路通知到应用层的ACTION_MEDIA_MOUNTED广播？","a":"mountVol完成doMoveMount后调setState(Volume::State_Mounted)，该函数通过CL把状态变化消息发给MountService。\nMountService在onEvent收到VolumeStateChange，调notifyVolumeStateChange处理；Volume状态变为Mounted后，它发出ACTION_MEDIA_MOUNTED广播，外部应用（如MediaScannerReceiver）即可监听到，挂载流程至此完成。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.2.7 关于Vold的总结","q":"为什么SD卡拔出或挂载到电脑（UMS）时，有些应用程序会被系统kill掉？","a":"这是本章的思考题：SD卡拔出或挂载为磁盘驱动器都会导致SD卡被卸载。\n卸载后使用SD卡的应用失去存储无法继续工作，系统会kill掉这些进程。这解释了测试中常见的现象：SD卡mount到电脑后，有些应用程序突然退出了。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3 Rild的原理与机制分析","q":"智能手机的AP/BP架构和AT指令是什么？","a":"很多智能手机是双处理器架构：AP（Application Processor）运行操作系统和应用；BP（Baseband Processor）负责射频无线通信。\nAP与BP间用串口通信，协议为AT指令——最早用在Modem上，后由摩托罗拉、爱立信、诺基亚等为GSM设计，格式是以AT开头、后跟字母数字表示具体功能的字符串。Rild运行在AP上，是AP与BP软件通信的中枢。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3 Rild的原理与机制分析","q":"什么是solicited Response和unsolicited Response？","a":"solicited Response（经过请求的回复）：AP发AT请求给BP，BP处理后回复AT指令告知结果，一问一答，回复针对之前的请求。\nunsolicited Response（未经请求的回复）：BP主动给AP发AT指令，一般是通知AP发生了某些事情（如来电、网络信号中断），并非由AP的请求引起。二者对应AP/BP两种交互类型：请求-应答，和BP主动通知。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3 Rild的原理与机制分析","q":"Rild如何解决不同厂商BP通信方式的差异？","a":"挑战：AP/BP集成的手机可能不用AT指令；即使使用，各厂商差异大且是商业秘密，只能给二进制库。\n解决：Rild用dlopen动态加载厂商库；二者通过接口通信——Rild输出RIL_Env接口供动态库使用，动态库输出RIL_RadioFunctions接口供Rild使用；AP和BP交互的实际工作由动态库完成。Android提供参考实现libreference-ril.so（RefRil）。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.1 初识Rild","q":"Rild的main函数有哪些关键步骤？","a":"三步：\n1) 未用-l指定库时读属性rild.libpath，switchUser设组用户radio，dlopen加载库，调RIL_startEventLoop()启动事件处理；\n2) dlsym取得库中RIL_Init地址，调funcs=rilInit(&s_rilEnv,argc,rilArgv)，传入RIL_Env、返回RIL_RadioFunctions；\n3) RIL_register(funcs)把函数表注册到Rild。之后主线程无限sleep。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.2 RIL_startEventLoop分析","q":"RIL_startEventLoop做了什么？eventLoop线程的三个关键点是什么？","a":"RIL_startEventLoop（libRil.so实现）创建detach的工作线程eventLoop，并用s_started+条件变量等待，保证返回前线程已运行。\neventLoop三关键点：1) ril_event_init初始化任务队列；2) 创建匿名管道，读端设为非阻塞，把管道读端作为wakeup事件（persist=true，回调processWakeupCallback）加入event队列；3) 进入ril_event_loop()事件循环。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.2 RIL_startEventLoop分析","q":"ril_event结构体包含哪些字段？","a":"字段包括：next/prev（把ril_event组织成双向链表）、fd（任务对应的文件描述符）、index（任务在监控表中的索引）、persist（是否永久保存在监控表中，任务处理完后据此判断是否移除）、timeout（任务执行时间，可为未来某时刻）、func（任务回调函数）、param（传给任务函数的参数）。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.2 RIL_startEventLoop分析","q":"ril_event_init初始化了哪些队列和数据结构？","a":"ril_event_init初始化：\n- 一个mutex（listMutex）；\n- readFds（fd_set，配合select做多路IO复用）；\n- timer_list：定时任务队列，插入时按执行时间排序；\n- pending_list：保存每次需要执行的任务；\n- watch_table（监控表）：static ril_event* watch_table[MAX_FD_EVENTS]，MAX_FD_EVENTS为8，保存FD已加入readFDs的任务。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.2 RIL_startEventLoop分析","q":"ril_event_add和triggerEvLoop是如何工作的？","a":"ril_event_add：加锁后在watch_table中找第一个空闲索引放入任务并设ev->index，同时FD_SET把任务fd加入readFds（select标准用法），必要时更新nfds。\ntriggerEvLoop：若调用者不是eventLoop线程本身（pthread_equal比较s_tid_dispatch），就write(s_fdWakeupWrite,\"\",1)往管道写端写1字节。Rild通过写匿名管道而非同步对象来触发eventLoop工作。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.2 RIL_startEventLoop分析","q":"ril_event_loop的主循环做了哪些事？","a":"for(;;)循环：\n1) 拷贝readFds到rfds，由timer_list算select等待时间；\n2) select(nfds,&rfds,...)；\n3) processTimeouts()：把timer_list中时间已到的任务移入pending_list；\n4) processReadReadies()：把监控表中有数据可读的任务转入pending_list，persist不为true的同时移出监控表；\n5) firePending()：遍历执行任务函数。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.2 RIL_startEventLoop分析","q":"Rild支持哪两种类型的任务？","a":"两类：\n1) 定时任务：由timeout执行时间决定，与监控表无关，用ril_timer_add加入timer_list；\n2) 非定时任务（Wakeup Event）：FD加入select读集合readFDs，信息存于watch_table，触发条件是FD可读。对管道和Socket，FD可读意味着接收缓冲区有数据，recv不阻塞；对listen端socket，FD可读表示有客户端连上，需调accept。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.3 RIL_Init分析","q":"RefRil库的RIL_Init函数做了哪三项工作？","a":"RIL_Init必须由动态库实现（RefRil在Reference_ril.c）：\n1) 保存Rild传入的RIL_Env到s_rilenv；\n2) 创建detach的工作线程mainLoop；\n3) 返回RIL_RadioFunctions结构体s_callbacks（含版本号及onRequest、onStateRequest、supports、onCancel、getVersion等函数指针）。\nRIL_Env与RIL_RadioFunctions就是隔离通用代码与厂商代码的两个接口。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.3 RIL_Init分析","q":"RIL_RadioFunctions结构体的内容和作用是什么？onRequest为什么没有返回值？","a":"由厂商动态库实现并返回给Rild：version版本号、onRequest（Rild向动态库提交请求的接口，即AP向BP发请求）、onStateRequest（查BP状态）、supports、onCancel、getVersion（RefRil返回\"android reference-ril 1.0\"）。\nonRequest无返回值是因为Rild采用异步请求/处理模式：提交请求后即返回，结果由动态库经RIL_Env回调通知。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.3 RIL_Init分析","q":"RIL_Env结构体包含哪些回调？各自用途是什么？","a":"RIL_Env由Rild实现、传给动态库使用，四个函数指针：\n- OnRequestComplete(t,e,response,len)：动态库完成请求后通知结果，RIL_Token标明是哪个请求；\n- OnUnsolicitedResponse：通知unsolicited Response；\n- RequestTimedCallback：给Rild提交超时任务；\n- RemoveTimedCallback：从超时任务队列移除任务。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.3 RIL_Init分析","q":"什么是异步请求/处理模式？请用Morning Call类比说明。","a":"流程：Rild通过onRequest向动态库提交请求后立即返回做自己的事；动态库处理完后通过RIL_onRequestComplete回调通知结果。\n类比酒店Morning Call：前台预约=提交请求；酒店登记房间并安排值班=动态库处理细节；次日约好时间来电=回调通知，看表核对=核对请求号/上下文。此模式要求保存请求包（含请求号和上下文），缺点是请求量大时占用较多内存。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.3 RIL_Init分析","q":"mainLoop工作线程和at_open、readerLoop各自做什么？","a":"mainLoop：for(;;)中取串口fd，调at_open(fd,onUnsolicited)打开AT模块，再提交initializeCallback超时任务，然后waitForClose——AT模块一旦关闭就重新打开，即监控AT模块。\nat_open：保存fd和unsol回调，创建工作线程readerLoop。readerLoop：循环readline()从串口读数据，SMS unsolicited走s_unsolHandler，其余走processLine按AT指令调回调。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.3 RIL_Init分析","q":"RIL_requestTimedCallback的机制是什么？initializeCallback做了什么？","a":"它封装s_rilenv->RequestTimedCallback。internalRequestTimedCallback构造UserCallbackInfo，ril_event_set初始化事件（回调userTimerCallback），ril_timer_add加入timer_list，再triggerEvLoop触发。\ninitializeCallback：setRadioState(OFF)后，发送AT+CREG=2等指令初始化Modem，radio开着则置SIM_NOT_READY。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.4 RIL_register分析","q":"RIL_register创建了哪些对外通信的socket？persist=false意味着什么？","a":"初始化两个监听端socket并加入eventLoop任务：\n1) \"rild\"：和Java层应用通信（类似Vold与MountService），任务s_listen_event处理函数是listenCallback，persist为false；\n2) \"rild-debug\"：接收测试程序命令，处理函数debugCallback，persist为true。\npersist=false表示listenCallback处理完后任务从监控表移除——即Rild只支持一个客户端连接。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.4 RIL_register分析","q":"listenCallback是如何处理客户端连接的？RecordStream的作用是什么？","a":"监听socket可读（有客户端connect）时触发：\n1) accept连接，socket存入s_fdCommand；2) 检查客户端权限；3) fcntl设为O_NONBLOCK非阻塞；\n4) record_stream_new创建RecordStream，内部分配缓冲区存储客户端数据并管理读写位置；\n5) 构造任务s_commands_event（persist=1，处理函数processCommandsCallback）加入监控表；6) onNewCommandConnect。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.5 关于Rild main函数的总结","q":"Rild main函数执行完后的静态架构是什么样的？","a":"结果：\n- Rild和RefRil库通过RIL_Env、RIL_RadioFunctions两个结构体交互；\n- Rild的eventLoop线程处理任务，来自客户端的数据由processCommandsCallback处理；\n- RefRil的readerLoop线程从串口读数据（直接与BP打交道）；\n- RefRil的mainLoop线程监视readerLoop，AT模块被关闭则重新初始化。\n这些是静态结构，动态配合需结合实例分析。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"PhoneApp如何通过PhoneFactory创建Phone？","a":"PhoneApp.onCreate调PhoneFactory.makeDefaultPhones(this)（工厂模式，屏蔽GSMPhone/CDMAPhone创建细节）。内部：读网络模式设置，先创建RIL对象sCommandsInterface（rild socket的客户端）；按phoneType创建GSMPhone或CDMAPhone，并包一层PhoneProxy返回（Proxy模式，具体工作由真实Phone完成）。\n工厂+代理降低耦合，以后增加TDPhone使用者也无需改太多代码。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"从按下拨号键到RIL.dial的Java层调用链是怎样的？","a":"调用链：PhoneUtils.placeCall → phone.dial(number)（真实类型PhoneProxy，代理到GSMPhone）→ GSMPhone.dial（先去分隔符）→ mCT.dial（GsmCallTracker）→ GsmCallTracker.dial中构造pendingMO（GsmConnection），调cm.dial(...)——cm真实类型是Java层RIL类（实现CommandInterface），由RIL把请求发给Rild。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"Java层RIL类的架构是怎样的？","a":"RIL构造函数创建两个线程：\n- mSenderThread：HandlerThread(\"RILSender\")，其中的Handler mSender负责向Rild发送消息；\n- mReceiverThread：运行RILReceiver，负责从Rild接收消息。\nRILReceiver.run中创建LocalSocket并connect到SOCKET_NAME_RIL连上Rild，然后循环readRilMessage读数据，解析成Parcel后调processResponse处理。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"RIL.dial发送请求的过程是怎样的？为什么要把请求保存到mRequestsList？","a":"RIL.dial创建RILRequest.obtain(RIL_REQUEST_DIAL,result)，往Parcel写号码等参数，然后send(rr)：obtainMessage(EVENT_SEND,rr)发消息给RILSender。\nRILSender的handleMessage先把rr加入mRequestsList，再把数据marshall写入socket。保存请求包是异步模式常见做法：完成通知只回传请求号，请求方凭它找回请求包及上下文；缺点是请求量大时耗内存。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"Rild端processCommandsCallback和processCommandBuffer如何处理客户端请求？","a":"eventLoop收到数据后调processCommandsCallback：用record_stream_get_next从缓冲区循环解析命令（缓冲区可能累积多条命令），每解析出一条调processCommandBuffer。\nprocessCommandBuffer从Parcel读出request和token，校验后分配RequestInfo头插加入s_pendingRequests链表，最后调pRI->pCI->dispatchFunction(p,pRI)。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"s_commands数组和CommandInfo结构的含义是什么？","a":"CommandInfo含三个字段：requestNumber请求号、dispatchFunction请求处理函数（解析参数）、responseFunction结果处理函数（把结果转成Parcel）。\ns_commands由#include\"ril_commands.h\"生成，封装Rild支持的全部命令（约103条），如RIL_REQUEST_DIAL对应dispatchDial/responseVoid；另有s_unsolResponses封装unsolicited处理函数。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"dispatchDial和requestDial分别做了什么？","a":"dispatchDial：从Parcel解析出RIL_Dial结构（address号码等），然后调s_callbacks.onRequest(pRI->pCI->requestNumber,&dial,sizeOfDial,pRI)向RefRil库提交请求。\nrequestDial：组装AT指令，调at_send_command把指令发到串口设备；dial请求发给BP即算完成，故直接调RIL_onRequestComplete(t,RIL_E_SUCCESS,NULL,0)通知结果。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"RIL_onRequestComplete做了哪些工作？","a":"由RIL_Env提供：\n1) RIL_Token转回RequestInfo，checkAndDequeueRequestInfo将其从请求队列取出；\n2) 构造Parcel：写RESPONSE_SOLICITED、token、错误码e，response非空时调responseFunction（dial对应responseVoid）填充结果；\n3) sendResponse(p)经socket发给Java层RIL；4) free释放pRI。\n异步原因：有的请求耗时长，可避免工作线程阻塞。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.3.6 Rild实例分析","q":"Java RIL收到完成通知后processSolicited如何匹配请求？","a":"processResponse按type分发：UNSOLICITED走processUnsolicited，SOLICITED走processSolicited。\nprocessSolicited读出serial和error，调findAndRemoveRequestFromList(serial)按请求号从mRequestsList移除对应RILRequest，解析结果；再经AsyncResult.forMessage(rr.mResult,ret,null)投递到另一线程处理。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.4.1 嵌入式系统的存储知识介绍","q":"MTD是什么？mtdblock又是什么？","a":"MTD（Memory Technology Device，内存技术设备）是Linux提供的针对Flash设备的统一抽象接口层，有了MTD就不用考虑NOR/NAND等Flash差异（作用类似FBD帧缓冲设备）。\nMTD将文件系统与底层Flash隔离，应用层无须关心真实硬件。mtdblock是MTD块设备，如G7上/system对应设备mtdblock3。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.4.1 嵌入式系统的存储知识介绍","q":"为什么Flash上需要FTL转换层或YAFFS这类文件系统？","a":"FAT32、NTFS、Ext2等无法直接用于Flash，因Flash不能在同一位置重复写入（须先整块擦除）。\n需通过转换层把逻辑块地址映射到Flash物理地址，使Flash可当普通磁盘用：FTL针对NOR Flash，NFTL针对NAND Flash；但多一层转换影响I/O效率，于是出现专为Flash设计的YAFFS。YAFFS2支持大容量NAND，YAFFS只支持页大小512字节的NAND；YAFFS用OOB组织文件结构信息，故Vold代码中可见OOB字样。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.4.1 嵌入式系统的存储知识介绍","q":"G7手机上各MTD分区（/proc/mtd）的用途是什么？","a":"以HTC G7为例：MTD0开机画面（Android启动前由Bootloader调用，约1MB）；MTD1恢复模式镜像（约4.5MB）；MTD2 kernel镜像（约3.25MB）；MTD3 system镜像，挂载/system（约250MB）；MTD4缓冲临时文件，挂载/cache（约40MB）；MTD5用户安装软件和数据，挂载/mnt/asec/mtddata（约150.75MB）。\n具体设备和挂载点与机型及ROM有关。"},{"ch":"第9章 · 深入理解Vold和Rild","sec":"9.4.2 Rild和Phone的改进探讨","q":"对Rild和Phone的设计，作者提出了哪些改进设想？","a":"问题：Rild没用Binder；Phone和Rild都是异步模式且都保存请求包，同一请求两层各存一份；直接用AT命令交互，扩展修改麻烦；群发短信用for循环逐条发，两层各存200个请求，而用户更关心统一结果。\n改进：1) 改用Binder通信，定义dial、sendSMS等接口及回传Response的回调——免去AT转换、可扩展性好（如群发接口一条内容和多个目标打包传给Rild）、Phone代码精简；2) 请求信息存共享内存减少内存占用，可用优先级队列组织。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.1 概述","q":"MediaScanner有什么作用？","a":"MediaScanner与媒体文件扫描有关：Music应用中看到的歌曲专辑名、歌曲时长等信息，都是通过它扫描对应歌曲得到的；通过MediaStore接口查询媒体数据库得到系统中所有媒体文件信息也与它有关，因为数据库内容就是由MediaScanner扫描后添加的。\n所以它是多媒体系统中很重要的一部分。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2 android.process.media分析","q":"android.process.media进程包含哪三个组件？各自职责是什么？","a":"APK指定进程名android.process.media，用了四大组件中的三个：\n1) MediaScannerService(MSS)：Service派生，扫描媒体文件并把信息插入媒体数据库；\n2) MediaProvider(MP)：ContentProvider派生，处理媒体文件的数据库操作请求；\n3) MediaScannerReceiver(MSR)：BroadcastReceiver派生，接收外界扫描请求，是MS对外的接口。\n除广播外MSS也支持Binder跨进程调用。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.1 MSR模块分析","q":"MediaScannerReceiver接收哪三种广播？分别触发什么扫描？","a":"MSR在onReceive中处理三种请求：\n1) BOOT_COMPLETED：启动内部存储扫描，实际扫/system/media目录；\n2) MEDIA_MOUNTED且路径等于外部存储挂载路径(/mnt/sdcard)：启动SD卡根目录扫描；\n3) MEDIA_SCANNER_SCAN_FILE且路径以/mnt/sdcard/开头：扫描该单个文件（供外部应用发广播）。\nMSR不支持扫描任意目录（SD卡根目录除外）。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.1 MSR模块分析","q":"MEDIA_MOUNTED广播从哪里来？MSR收到后做什么？","a":"MEDIA_MOUNTED由第9章的MountService发送：SD卡挂载成功后，Vold把State_Mounted状态变化通知MountService，后者发出该广播。\nMSR被唤醒后调scan(context, EXTERNAL_VOLUME)，内部用Bundle携带volume参数，context.startService(new Intent(context,MediaScannerService.class).putExtras(args))启动MSS处理扫描请求。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.2 MSS模块分析","q":"MSS的onCreate做了哪些准备工作？工作线程的run函数做了什么？","a":"onCreate（生命周期内仅一次）：获得PARTIAL_WAKE_LOCK电源锁，防止扫描中系统休眠；创建工作线程（MSS实现了Runnable）。\nrun函数：setThreadPriority(THREAD_PRIORITY_BACKGROUND+LESS_FAVORABLE)调低优先级（否则扫描长期占CPU使系统变慢）；Looper.prepare()；创建mServiceLooper和ServiceHandler；Looper.loop()进入消息循环。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.2 MSS模块分析","q":"MSS的onStartCommand如何把扫描请求投递给工作线程？","a":"onStartCommand先while(mServiceHandler==null)等待工作线程创建好Handler；然后mServiceHandler.obtainMessage构造消息，msg.arg1=startId、msg.obj=intent.getExtras()，sendMessage投递。\n由于mServiceHandler绑定工作线程的Looper，消息最终由工作线程的ServiceHandler.handleMessage处理——主线程收请求，工作线程处理。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.2 MSS模块分析","q":"ServiceHandler如何根据volume确定扫描目录？","a":"handleMessage从Bundle取参数：若无filepath则按volume确定directories——INTERNAL_VOLUME对应{getRootDirectory()+\"/media\"}即/system/media；EXTERNAL_VOLUME对应外部存储路径即/mnt/sdcard。\n然后调scan(directories,volume)扫描（scan支持一次传多个目录，这里只有一个），完成后stopSelf(msg.arg1)。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.2 MSS模块分析","q":"MSS的scan函数的完整流程是什么？用到了哪些特殊Uri和广播？","a":"1) 通过insert特殊Uri(getMediaScannerUri)让MediaProvider做准备；\n2) 发ACTION_MEDIA_SCANNER_STARTED广播；\n3) 外部存储时openDatabase（借特殊Uri）；\n4) createMediaScanner()创建扫描器，调scanDirectories扫描；\n5) delete(scanUri)让MediaProvider清理；\n6) 发ACTION_MEDIA_SCANNER_FINISHED广播，释放电源锁。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.2 MSS模块分析","q":"createMediaScanner做了什么？为什么创建时要设置Locale？","a":"createMediaScanner创建framework层的MediaScanner对象new MediaScanner(this)，再从系统配置获取当前Locale，把language和country拼起来调scanner.setLocale()设置给扫描器。\n设置Locale的原因：扫描时需把媒体文件中的信息（如MP3的TAG）转换成当前系统使用的语言文字，保证界面显示与系统语言一致。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.2.3 android.process.media媒体扫描工作的流程总结","q":"android.process.media中媒体扫描的整体流程分哪几步？","a":"MSR和MSS配合的四步流程：\n1) MSR接收外部发来的扫描请求（广播），并通过startService方式启动MSS处理；\n2) MSS的主线程接收请求，然后投递给工作线程处理；\n3) 工作线程做前期处理（如广播扫描开始消息）后，创建媒体扫描器MediaScanner处理扫描目标；\n4) MS扫描完成后，工作线程做后期处理，然后向系统发送扫描完毕的广播。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.1 Java层分析","q":"MediaScanner类的static块和构造函数做了什么？","a":"static块中System.loadLibrary(\"media_jni\")加载libmedia_jni.so，并调native_init()；构造函数中调native_setup()做JNI层初始化。\n这么重要的库放在不起眼的MediaScanner类中加载，作者猜测是因为开机后多媒体系统中最先启动的就是媒体扫描工作。native_init负责找类并缓存字段ID（mNativeContext），native_setup负责创建Native层MS对象并存指针。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.1 Java层分析","q":"MediaScanner.scanDirectories的四个关键步骤是什么？","a":"1) initialize(volumeName)：初始化各Uri和成员；\n2) prescan(null)：把数据库中已有文件信息取出存入mFileCache；\n3) 逐目录调processDirectory(directories[i], MediaFile.sFileExtensions, mClient)（native函数，sFileExtensions为支持的后缀名集合）；\n4) postscan(directories)：清除失效记录。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.1 Java层分析","q":"initialize函数初始化了哪些内容？","a":"初始化扫描要用的各Uri：\n- acquireProvider(\"media\")得到IMediaProvider对象mMediaProvider操作数据库；\n- mAudioUri(audio_meta表)、mVideoUri(video表)、mImagesUri(images表)、mThumbsUri(thumbs)；\n- 扫描外部存储时支持播放列表和流派，初始化mGenresUri、mPlaylistsUri；因SD卡用FAT文件系统设mCaseInsensitivePaths=true。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.1 Java层分析","q":"prescan解决什么问题？它是如何做的？","a":"问题：文件被删除（如文件管理器删文件却不更新数据库）后，数据库仍残留记录，查询还能得到信息但文件已不存在，后续相关操作都会失败。\nprescan在扫描前从数据库查询所有媒体文件信息：分别查询Audio表（AUDIO_PROJECTION取rowId、路径path、lastModified）及视频、图像等表，构造FileCacheEntry存入mFileCache（HashMap，key为文件路径）。执行完后mFileCache保存的是数据库中的旧信息。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.1 Java层分析","q":"mSeenInFileSystem变量在扫描中起什么作用？","a":"processDirectory扫描SD卡时，每扫描到一个文件，都把mFileCache中对应文件的mSeenInFileSystem设为true，表示该文件目前还存在于SD卡上。\n这样整个SD卡扫完后，mFileCache中旧记录分两类：mSeenInFileSystem为true的（文件还在），和仍为false的（文件已消失，如删掉的50个文件）。它是postscan判断失效记录的依据。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.1 Java层分析","q":"postscan如何清除数据库中的失效记录？","a":"postscan遍历mFileCache的entry：对mSeenInFileSystem为false的，先用inScanDirectory判断文件是否在扫描目录中、再new File(path).exists()确认是否真丢失。\n若确实丢失：播放列表类型有专门处理；其他类型直接mMediaProvider.delete(withAppendedId(mTableUri,mRowId))删除记录（entry携带表Uri和行号，很快），并从mFileCache移除。最后还清理缩略图。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.2 JNI层分析","q":"native_init对应的JNI函数做了什么？","a":"native_init的JNI实现中用env->FindClass(\"android/media/MediaScanner\")找到Java的MS类，再用GetFieldID(clazz,\"mNativeContext\",\"I\")取得该字段ID存到fields.context。\n之后创建的Native层MediaScanner对象指针会通过SetIntField保存到Java MS对象的mNativeContext变量——把Native对象指针关联到Java对象的惯用做法。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.2 JNI层分析","q":"native_setup对应的JNI函数做了什么？createMediaScanner会创建哪种Native对象？","a":"native_setup调createMediaScanner()创建Native层MediaScanner对象mp，SetIntField把指针存入Java对象的mNativeContext。\ncreateMediaScanner：若属性media.stagefright.enable-scan为1返回StagefrightMediaScanner；否则返回PVMediaScanner——即OpenCore的Native MS，本章分析的就是它。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.2 JNI层分析","q":"processDirectory的JNI函数如何衔接Java层与Native层？","a":"JNI函数android_media_MediaScanner_processDirectory中：\n1) 从mNativeContext取出Native的MS指针mp；\n2) 取出path和extensions；\n3) 构造Native层MyMediaScannerClient对象myClient（保存env和client引用）；\n4) 调mp->processDirectory(pathStr,extensionsStr,myClient,ExceptionCheck,env)。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.2 JNI层分析","q":"MediaScanner相关的Java/Native对象之间是什么关系？","a":"1) Java的MediaScanner通过mNativeContext指向Native的MediaScanner（即PVMediaScanner）；\n2) Native的MyMSC通过mClient保存Java层MyMediaScannerClient的引用；\n3) Native的MS调processDirectory/processFile时使用Native的MyMSC；\n4) Native MS类的processFile是虚函数，由派生类（如PVMediaScanner）实现。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.3 PVMediaScanner分析","q":"MediaScanner::processDirectory和doProcessDirectory如何递归扫描目录？","a":"processDirectory（libmedia）先setLocale给MyMSC，再调doProcessDirectory。\ndoProcessDirectory用opendir/readdir枚举目录项：跳过.nomedia文件夹；DT_DIR子目录递归调用自身；DT_REG普通文件用fileMatchesExtension(path,extensions)按后缀名判断是否为支持的类型，若是且大小非零，就调client.scanFile(path,mtime,size)处理。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.3 PVMediaScanner分析","q":"为什么Native的MS会调用Client的scanFile？这个调用的去向是什么？","a":"这是\"四渡赤水\"的第一渡：Native MS扫到文件后调Native MyMSC的scanFile；而Native MyMSC::scanFile的主要工作就是CallVoidMethod(mClient,mScanFileMethodID,...)——回调Java层MyMediaScannerClient的scanFile。\n控制权由此从Native交回Java，由Java的MyMSC.scanFile继续doScanFile。设计得这么绕是码农有意为之，将来可能会改。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.3 PVMediaScanner分析","q":"Java层MyMediaScannerClient的doScanFile做了什么？scanAlways参数是什么含义？","a":"doScanFile(path,…,scanAlways)：\n1) beginFile：把mFileCache对应项的mSeenInFileSystem置true（无则新建），并根据lastModified判断文件在两次扫描间是否被修改；\n2) 若entry非空且(mLastModifiedChanged||scanAlways)才继续——scanAlways控制是否强制扫描，未变化的文件平时可跳过；\n3) 非图片类型调processFile扫描；\n4) 调endFile把信息插入数据库或更新。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.3 PVMediaScanner分析","q":"processFile的调用链是怎样的？PVMediaScanner::processFile做了哪些处理？","a":"第二渡：Java MyMSC调native的processFile→JNI取出PVMS并构造新MyMSC，调mp->processFile(…,myClient)。\nPVMediaScanner::processFile：setLocale；beginFile()（构造mNames/mValues数组）；按后缀分派——.mp3调parseMP3，另有parseMP4/parseMidi/parseOgg/parseWMA；最后endFile()做语言转换并逐个回调handleStringTag。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.3 PVMediaScanner分析","q":"parseMP3和addStringTag是如何处理TAG信息与字符集的？","a":"parseMP3解析MP3得到duration、流派、标题等TAG信息，每得到一项就调client.addStringTag(\"duration\",buffer)等告诉MyMSC。\naddStringTag（基类实现）：若value含非ASCII字符（ch&0x80判断），把name/value暂存到mNames和mValues，等endFile时集中做字符集转换（如韩文TAG转成系统设置的简体中文）；纯ASCII则直接调handleStringTag(name,value)。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.3 PVMediaScanner分析","q":"handleStringTag的最终去向是什么？TAG信息什么时候入库？","a":"Native MyMSC::handleStringTag通过CallVoidMethod回调Java层MyMSC的handleStringTag。\nJava的handleStringTag把TAG按名字存到成员变量：\"title\"→mTitle、\"artist\"→mArtist、\"albumartist\"→mAlbumArtist等。这些信息最终在Java层MyMSC的endFile中组织起来存入媒体数据库。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.3.4 关于MediaScanner的总结","q":"请复述MediaScanner.java注释中总结的\"四渡赤水\"完整调用链。","a":"MS.scanDirectories→MS.processDirectory(native)→Native MS.processDirectory→Native MyMSC.scanFile→Java MyMSC.scanFile→doScanFile→MS.processFile(native)→Native MS.processFile→parseMP3→Native MyMSC.handleStringTag→Java handleStringTag，返回后入库。"},{"ch":"第10章 · 深入理解MediaScanner","sec":"10.4.1 MediaScannerConnection介绍","q":"MediaScannerConnection是什么？推荐使用它的哪种API？","a":"除广播外有MediaScannerConnection类，可直接跨进程调用MSS的scanFile，扫描完后通过回调通知（浏览器下载、彩信等场景）。API有connect/disconnect/scanFile。\n推荐静态函数scanFile(context,paths,mimeTypes,callback)：封装了连接MSS等工作，支持多文件扫描，间接提供文件夹扫描功能。"}];

/* ---------- build ---------- */
const grid = document.getElementById('grid');
const chipsBox = document.getElementById('chips');
let known = {};
try { known = JSON.parse(localStorage.getItem('anki_deepandroid_known') || '{}'); } catch(e) { known = {}; }
let curCh = '全部', curSearch = '', onlyUnknown = false, shuffled = null;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function chapterList(){
  const seen = [];
  CARDS.forEach(c => { if(!seen.includes(c.ch)) seen.push(c.ch); });
  return seen;
}

function buildChips(){
  const chs = chapterList();
  let html = `<span class="chip on" data-ch="全部">全部<b>${CARDS.length}</b></span>`;
  chs.forEach(ch => {
    const n = CARDS.filter(c => c.ch === ch).length;
    html += `<span class="chip" data-ch="${esc(ch)}">${esc(ch)}<b>${n}</b></span>`;
  });
  chipsBox.innerHTML = html;
  chipsBox.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      chipsBox.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
      curCh = el.dataset.ch;
      render();
    });
  });
}

function cardHTML(c, i){
  const isKnown = !!known[key(c)];
  return `
  <div class="card${isKnown ? ' known' : ''}" data-i="${i}">
    <div class="card-inner">
      <div class="face front">
        <div class="face-head"><span class="tag">${esc(c.ch)}</span><span class="num">#${String(i+1).padStart(3,'0')}</span></div>
        <div class="face-body"><div class="q-mark">Q</div><div class="q-text">${esc(c.q)}</div></div>
        <div class="q-hint">点击卡片查看答案</div>
      </div>
      <div class="face back">
        <div class="face-head"><span class="tag">${esc(c.ch)}</span><span class="num">#${String(i+1).padStart(3,'0')}</span></div>
        <div class="face-body"><div class="a-text">${esc(c.a)}</div></div>
        <div class="face-foot">
          <span class="sec-label">${esc(c.sec)}</span>
          <button class="known-btn" onclick="toggleKnown(event, ${i})">${isKnown ? '已掌握 ✓' : '标记掌握'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function key(c){ return c.q; }

function currentList(){
  let list = shuffled || CARDS.map((c,i)=>[c,i]).map(p=>p);
  return list;
}

function render(){
  const list = shuffled || CARDS.map((c,i) => [c,i]);
  const s = curSearch.trim().toLowerCase();
  let html = '', shown = 0;
  list.forEach(([c, i]) => {
    if(curCh !== '全部' && c.ch !== curCh) return;
    if(onlyUnknown && known[key(c)]) return;
    if(s && !(c.q + c.a + c.sec + c.ch).toLowerCase().includes(s)) return;
    html += cardHTML(c, i);
    shown++;
  });
  grid.innerHTML = html || `<div class="empty">没有匹配的卡片</div>`;
  document.getElementById('statCount').textContent = `显示 ${shown} / ${CARDS.length} 张`;
  updateProgress();
  grid.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', e => {
      if(e.target.closest('.known-btn')) return;
      el.classList.toggle('flipped');
    });
  });
}

function updateProgress(){
  const total = CARDS.length;
  const k = Object.keys(known).filter(q => CARDS.some(c => c.q === q)).length;
  document.getElementById('statKnown').textContent = `已掌握 ${k} 张`;
  document.getElementById('progFill').style.width = (total ? (k/total*100) : 0) + '%';
}

function toggleKnown(e, i){
  e.stopPropagation();
  const c = CARDS[i];
  if(known[key(c)]) delete known[key(c)];
  else known[key(c)] = 1;
  localStorage.setItem('anki_deepandroid_known', JSON.stringify(known));
  render();
}

/* ---------- controls ---------- */
document.getElementById('search').addEventListener('input', e => { curSearch = e.target.value; render(); });
document.getElementById('flipAll').addEventListener('click', () => grid.querySelectorAll('.card').forEach(el => el.classList.add('flipped')));
document.getElementById('closeAll').addEventListener('click', () => grid.querySelectorAll('.card').forEach(el => el.classList.remove('flipped')));
document.getElementById('shuffle').addEventListener('click', function(){
  const idx = CARDS.map((_, i) => i);
  for(let n = idx.length - 1; n > 0; n--){ const r = Math.floor(Math.random() * (n+1)); [idx[n], idx[r]] = [idx[r], idx[n]]; }
  shuffled = idx.map(i => [CARDS[i], i]);
  this.classList.add('active');
  document.getElementById('order').classList.remove('active');
  render();
});
document.getElementById('order').addEventListener('click', function(){
  shuffled = null; this.classList.add('active');
  document.getElementById('shuffle').classList.remove('active');
  render();
});
document.getElementById('order').classList.add('active');
document.getElementById('onlyUnknown').addEventListener('click', function(){
  onlyUnknown = !onlyUnknown; this.classList.toggle('active', onlyUnknown); render();
});

buildChips();
render();
</script>
</body>
</html>
