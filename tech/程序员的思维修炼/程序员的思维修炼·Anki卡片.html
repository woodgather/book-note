<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>程序员的思维修炼 · Anki 精华卡片</title>
<style>
:root{
  color-scheme:light;
  --paper:#F2F4F0; --ink:#22303A; --ink2:#5A6B76; --line:#D9DFD6; --gold:#B98A2E;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px 70px}

/* ---------- hero ---------- */
.hero{padding:52px 0 8px;border-bottom:1px solid var(--line)}
.hero .kicker{font-size:12px;letter-spacing:.28em;color:var(--gold);font-weight:700;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-size:32px;font-weight:700;letter-spacing:.02em}
.hero h1 span{color:var(--ink2);font-weight:400}
.hero p.sub{margin-top:12px;color:var(--ink2);font-size:14px;max-width:640px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.chip b{font-family:var(--serif);font-size:14px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* ---------- progress ---------- */
.progressbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:12px 0;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pbar{flex:1;min-width:160px;height:6px;background:#E4E8E0;border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#3E6B6B,#B98A2E);border-radius:99px;transition:width .35s ease}
.ptext{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.ptext b{color:var(--ink);font-family:var(--serif)}
.reset{font-size:12px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:99px;
  padding:4px 13px;cursor:pointer;transition:.2s}
.reset:hover{color:var(--ink);border-color:var(--ink2)}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 6px}
.fbtn{font-size:12.5px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;
  color:var(--ink2);cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--ink);border-color:var(--ink2)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;margin:12px 0 24px;padding:11px 16px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;font-family:var(--sans);background:#fff;color:var(--ink);outline:none;transition:.2s}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,138,46,.12)}
.search::placeholder{color:#9AA8B0}

/* ---------- grid & card ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;align-items:stretch}
.card{perspective:1400px;min-height:238px;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card-inner{position:relative;width:100%;height:100%;min-height:238px;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.25,.8,.3,1.05)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:14px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--c,var(--gold));
  padding:20px 22px 16px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c,var(--gold)) 5%,#fff)}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--c,var(--gold))}
.num{position:absolute;top:16px;right:18px;font-family:var(--serif);font-size:12px;color:#B7C1B9}
.q{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.6;margin-top:10px}
.a{font-size:13.5px;line-height:1.78;margin-top:10px;color:var(--ink)}
.a em{font-style:normal;font-weight:600;color:var(--c,var(--gold))}
.a .note{display:block;margin-top:8px;font-size:12px;color:var(--ink2)}
.hint{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:#9AA8B0}
.hint .ok{color:#3F7D4E;font-weight:600;display:none}
.card.flipped .hint .ok{display:inline}
.noresult{grid-column:1/-1;text-align:center;color:var(--ink2);padding:60px 0;font-size:14px}

/* ---------- footer ---------- */
.foot{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);text-align:center}
.foot b{font-family:var(--serif);color:var(--ink)}

@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .hero h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){
  .card-inner{transition:none}
}
</style>
</head>

<div class="wrap">
  <header class="hero">
    <div class="kicker">PRAGMATIC THINKING &amp; LEARNING</div>

  <footer class="foot">
    整理自《程序员的思维修炼：开发认知潜能的九堂课》—— 安迪·亨特（Andy Hunt）著 · 图灵程序设计丛书<br>

</div>

  5:{name:"第5章 调试你的大脑", c:"#A63D57"},
  6:{name:"第6章 主动学习", c:"#3F7D4E"},

var CARDS = [
/* ============ 总览 ============ */
{ch:0, q:"本书书名中的“湿件（wetware）”指什么？本书的目标是什么？",
 a:"湿件指人脑细胞与思维过程——用计算机模型来类比人类的思维与学习。本书目标是“重构你的湿件”：像设计软件一样，对大脑进行重新设计、重新连线，挖掘和释放认知潜能。",
 n:"与硬件（机器）、软件（程序）并列，大脑是开发中真正运行一切的第三件设施。"},
{ch:0, q:"作者认为：软件到底是在哪里被创建的？",
 a:"在人们的头脑（头脑中的思维模型）里被创建，然后才落到屏幕和纸面上。因此，最重要的开发工具不是语言和 IDE，而是你自己的大脑——它值得你投入最多的关爱与训练。"},
{ch:0, q:"当今时代，软件开发者最需要的两项硬核技能是什么？",
 a:"一是沟通能力（与人协作、倾听、表达），二是学习和思考的能力（如何学习、如何控制注意力、如何调试自己的大脑）。技术更新飞快，唯有这两项让你长期保值。"},
{ch:0, q:"“实用主义（pragmatism）”的态度是什么？",
 a:"做对你有用的事情。不必等科学对某个方法有了完备解释才开始使用——只要它确实有效，就先拿来用；有效本身就是实用的理由。"},
{ch:0, q:"为什么说“始终关注情境”？（诀窍1）",
 a:"一切都不是孤立存在的：任何系统都嵌在更大的系统里，而你自己也总是系统的一部分（观察者会改变被观察者）。现实是非线性的，微小的因素可能产生巨大的影响，脱离情境谈论任何方法都是危险的。"},
{ch:0, q:"事件理论与构建理论有什么区别？",
 a:"事件理论（如万有引力）可以被测量、验证、证伪；构建理论（如德雷福斯模型）是无形的抽象，无法直接测量，只能靠“是否对你有用”来衡量。用后者时，请保持批判但务实的心态。"},

/* ============ 第1章 绪论 ============ */
{ch:1, q:"作者建议的学习方式为什么强调“观察和模仿”？（诀窍4）",
 a:"模仿是人类的天性（镜像神经元机制）：观察高手的做法——他们的现场判断、工作节奏、思维方式——比只读文档和规范有效得多。想办法靠近你想成为的那种人，并像他们那样行动。"},
{ch:1, q:"“十年，四万人小时”意味着成为专家要付出什么？这背后的刻意练习需要哪些条件？",
 a:"研究表明约需十年或更长的刻意练习。条件是：①明确定义的任务；②难度适当（稍高于当前水平）；③有大量信息反馈可比较结果；④提供重复犯错并纠正错误的机会。",
 n:"泛泛的“经验年限”不算数——十年内重复同样的低水平工作不会带来进步。"},
{ch:1, q:"为什么说“新手需要规则，专家需要直觉”会造成管理上的冲突？（诀窍2）",
 a:"管理者常用规则、流程、清单去“帮助”所有人，但这会束缚专家；而专家给新手的直觉式指导又让新手无所适从。理解技能水平差异，才能提供匹配的帮助——这正是下一章德雷福斯模型要解决的问题。"},
{ch:1, q:"“知道你不知道什么”为什么被列为诀窍？（诀窍3）",

{ch:1, q:"什么是“学习如何学习的技能”？（诀窍7）",
 a:"学习本身就是一门可学习、可优化的技能：了解大脑如何运作、如何记忆、如何保持注意力，再把这些用于一切学习——这是回报率最高的一项投资，因为它作用于你所有的学习。"},

/* ============ 第2章 德雷福斯模型 ============ */
{ch:2, q:"德雷福斯技能模型的五个阶段是什么？它是关于“人”的模型吗？",
 a:"新手 → 高级新手 → 胜任者 → 精通者 → 专家。注意：它是基于技能的模型，不是基于人的模型——同一个人，在不同技能上可能处于完全不同的阶段。"},
{ch:2, q:"新手（Novice）有什么特征？他们最需要什么？",
 a:"经验极少，对情境没有感知；想要立竿见影的行动清单，出错时容易慌乱。他们需要与情境无关的明确规则——照着做就能完成任务。"},
{ch:2, q:"高级新手（Advanced Beginner）最大的盲区是什么？",
 a:"他们能凭经验解决熟悉的问题，但不想（也不会）进行全局思维，会忽略更宏大的情境。更糟糕的是：大多数人的大多数技能，会终生停留在这一阶段。"},
{ch:2, q:"胜任者（Competent）的标志性能力是什么？",
 a:"能建立问题的概念模型，主动、足智多谋地独立解决问题；懂得区分相关与不相关，能根据新情况调整计划。团队中起领导作用的常常是他们。"},
{ch:2, q:"精通者（Proficient）相比胜任者的重大突破是什么？",
 a:"能够自我纠正：反思自己以往的表现并做出改进。他们需要全局思维来理解问题，能够有效运用“经验之谈”（maxim）——这类格言对新手只是隐语，对精通者却是行动指南。"},
{ch:2, q:"专家（Expert）的核心特征是什么？大约占人群多少？",
 a:"凭直觉工作，不需要理由；擅长有针对性的特征匹配，从丰富经验中迅速识别模式。约占人群的1%～5%。强行让专家遵循规则，他们的表现反而会明显下降。"},
{ch:2, q:"从新手到专家，要跨越的三个最重要的转变是什么？",
 a:"①从依赖规则到依赖直觉；②看待问题从“等同单元的集合”到“完整的整体”；③从“问题的旁观者”到“系统的一部分”（切身参与其中）。"},
{ch:2, q:"什么是“二阶不胜任”？它与德鲁克—克鲁格效应的关系？",
 a:"二阶不胜任是“不知道自己不知道”。低技能者往往会高估自己约50%，而真正的专家反而常常自我怀疑（知道自己有多少不懂）。这正是“新手无所畏惧，专家心怀敬畏”的原因。"},
{ch:2, q:"技能分布曲线真的是漂亮的钟形吗？",
 a:"不是。糟糕的现实是：大多数人的大多数技能，终生都不会超过“高级新手”阶段。钟形分布是错觉；要成为专家，必须主动投入刻意练习。"},
{ch:2, q:"为什么“专家未必是好老师”？",
 a:"教学是另一门独立的技能。专家凭直觉行动，往往意识不到自己是怎么做到的，难以给新手分解步骤。指导新手时，选择与你水平相近（如胜任级）的人常常更合适。"},
{ch:2, q:"什么时候应当避免形式方法？（诀窍6）",
 a:"在需要创造力、直觉、独创能力的时候。UML、MDA、各种方法论都有用，但没有银弹：形式方法把工作分解为规则，恰好压制了专家赖以工作的直觉，把人拉回新手式思维。"},
{ch:2, q:"“观察和模仿来学习”（诀窍4）与德雷福斯模型如何结合？",
 a:"模仿让你绕过语言直接吸收模式，是跨越阶段的高效通道——看高手怎么做，做专家做什么。同时避免模仿到“表象”：要模仿行为背后的思路与情境判断。"},
{ch:2, q:"如何维持专家水平？（诀窍5）",
 a:"保持实践。技能是大脑的物理连接，不用就会退化；连专家也需要持续练习才能维持水平。“实践保持长久”，中断实践，直觉就会迟钝。"},
/* ============ 第3章 认识你的大脑 ============ */
{ch:3, q:"双CPU类比：大脑的1号CPU和2号CPU分别是什么？",
 a:"1号CPU是线性、逻辑、语言型的处理（即L型），速度较慢，还有“空闲循环”——内心独白；2号CPU是强大的异步模式匹配器（即R型），并行搜索、直觉跳跃。两者通过共享总线连接，因此会互相干扰：L型占用总线时，R型的记忆就取不出来。"},
{ch:3, q:"L型（线性模式）有哪九种能力？",
 a:"语言、分析、符号、抽象、时间、推理、数字、逻辑、线性思维。这是日常逻辑思考和语言表达的基础，但只有L型你永远无法产生直觉和创造性突破。"},
{ch:3, q:"R型（富模式）有哪些特点？",
 a:"非语言、综合、具体（真实性）、类比、整体（非正式）、空间、直觉跳跃式思维、不受理性约束、可获取语言但本身不能创建语言。它一次处理大量输入，提供“整体图景”。"},
{ch:3, q:"为什么描述梦的时候，梦会迅速消失？",
 a:"R型和L型共享内存总线：你一张口说话，L型就占用了总线，R型刚刚存储的记忆无法再被获取。这也解释了“话到嘴边说不出”和灵感稍纵即逝的现象。"},
{ch:3, q:"关于记忆的三个关键事实是什么？",
 a:"①记忆是全息存储的——每个片段都包含整体的线索；②记忆需要不断刷新，像动态RAM一样不刷新就会丢失；③每一次读取都是一次写入——回忆会按当前情境重写记忆，旧记忆并不可靠。"},
{ch:3, q:"R型可以被直接命令吗？我们该如何与它协作？",
 a:"不能命令，只能邀请。R型是异步的后台进程，会在你洗澡、散步、发呆时突然报出答案。你需要创造条件让它启动（捕获想法、浸泡问题、离开键盘），然后由L型紧跟其后把答案具体化。"},
{ch:3, q:"为什么必须随时捕获想法？（诀窍8）",
 a:"R型不可预测，好主意稍纵即逝、无法重现。捕获是“好点子金字塔”的底层：没有随手捕获，就没有后面的整理与行动。随身带纸笔或用手机、语音备忘录，24×7记录。"},
{ch:3, q:"“想了解青蛙，别去解剖它，去构造它”是什么意思？（诀窍9）",
 a:"分析（解剖）只能得到死零件，构造（综合）才能真正理解整体如何运作。综合学习与分析学习并重——写原型、做单元测试、搭小项目，都是构造式的学习。"},
{ch:3, q:"为什么界面美观会影响功能（争取好的设计）？（诀窍10）",
 a:"实验表明美观的界面让人觉得“更好用”，即使功能完全相同。积极情绪会激活更多大脑物质、让人更有创造力；反之丑陋环境触发消极反应（破窗理论的反面）。为快乐而设计。"},
{ch:3, q:"神经形成需要什么条件？“困在斗室”意味着什么？",
 a:"成年大脑也能长出新脑细胞，但只发生在丰富、刺激的环境中——需要身体锻炼、感官体验、新奇与挑战。困在昏暗斗室里写代码的程序员，永远不会有新脑细胞。"},
{ch:3, q:"神经可塑性对“我能学会吗”意味着什么？（诀窍11）",
 a:"大脑终生可塑：相信这一点的人更容易真的进步（德韦克实验）。脑皮层竞争意味着常用技能占据更多资源、不用的技能被挤走——重新连线需要“坚信 + 不断实践”。"},
{ch:3, q:"“R型看森林，L型看树木”来自哪个实验？",
 a:"层次字符实验：判断大字母是H还是S（全局）与判断小字母（局部）由不同半球主导——全局模式靠R型，细节分析靠L型。高手需要两种模式的配合，而不是只偏其一。"},
{ch:3, q:"什么是“共享总线冲突”在协作中的启示？",
 a:"结对编程有效，部分原因是：驾驶员专注L型细节，领航员有自由进行R型模式匹配。齿轮实验中，58%的结对者发现了抽象规则，独立者只有14%。"},

/* ============ 第4章 利用右脑 ============ */
{ch:4, q:"激活大脑最简单的方式是什么？（诀窍12）",
 a:"扩大感观参与：调动视觉、听觉、触觉、运动等多感官通道，学习效果可提高约5倍。例如用乐高积木做设计、用CRC卡模拟对象协作、动手画图——让整个身体参与思考。"},
{ch:4, q:"贝蒂·爱德华的“倒置画像”实验说明了什么？",
 a:"把图片倒过来临摹，画得会明显更好——因为倒置的任务让L型（习惯用符号速记“房子”“眼睛”）失去兴趣退出，R型接管，如实地观察线条与形状。启示：绘画即是观察，阻碍你的是L型的符号化捷径。"},
{ch:4, q:"攀岩教练“先体验、再讲课”的做法体现了什么？（诀窍13）",
 a:"先建立R型的整体体验，再让L型进行语言化的归纳整理——R型开路，L型紧跟。顺序反过来（先听一长串指令再实践）会像滑雪课那样让大脑过载僵住。"},
{ch:4, q:"“酒醉写作，酒醒修改”是什么创作法则？",
 a:"创造阶段完全放开，不受“常识”评判的束缚，坦然接受荒谬的想法（R型自由发挥）；之后再切换L型理性地修改打磨。较差的草稿初案胜过完美的初稿——先让丑陋的第一版存在。"},
{ch:4, q:"“隐喻”为什么重要？（诀窍14、15）",
 a:"隐喻是L型和R型相融之所：用熟悉的经验去理解和探索陌生的领域（莱考夫：不用隐喻我们甚至无法思考）。培养幽默感能建立更强大的隐喻——笑点正是来自两个不相容参照系的碰撞。（诀窍15：培养幽默感以建立更强大的隐喻）"},
{ch:4, q:"什么是异类联想？Po技术和随机并列怎么用？",
 a:"异类联想（Altibujos）是强行让两个不相容的参照系碰撞，距离越远，创造性越大。Po技术：从问题选一个词，再随机找一个词（如香烟+交通灯），逼大脑在两者间建立联系，跳出思维定势。"},
{ch:4, q:"“一切输入都被存储”意味着什么？",
 a:"大脑存储一切，但不一定给你索引。解决问题时它会做“全表扫描”，连你以为早已忘记的信息也能被调用。伊莱亚斯·豪梦见食人族长矛尖上有洞，醒来解决了缝纫机针孔的问题——答案一直在R型里。"},
{ch:4, q:"晨写（Morning Pages）的规则是什么？",
 a:"每天早晨第一件事，至少写三页，用手写，不做任何审查、修改或删减，天天坚持。目的是在防备最低的大脑里，把R型的想法不经L型过滤地倾倒出来。坚持数周后效果才会显现。"},
{ch:4, q:"离开键盘如何帮助解决难题？（诀窍16）",
 a:"把问题写下来，挑一个子问题，出去散步或做点无关的事——让R型接管。庞加莱法即如此：R型只能被邀请不能被命令，答案往往在你停止“努力想”的那一刻到来。"},
{ch:4, q:"“换换脑子”（改变角度）有哪些做法？（诀窍17）",
 a:"逆向思维：调试时故意想想“怎样会引起这个bug”，UI设计先做“最差方案”，倒过来读代码。“很少”发生的事不代表不会发生——极端角度能暴露盲点。"},
{ch:4, q:"为什么要刻意打破日常习惯？",
 a:"大脑会为重复行为建立神经惯例，让L型“自动驾驶”。莎士比亚式的功能转移（把名词用作动词）之所以妙，是因为令大脑超频。定期改变小习惯（换路线上班、换手刷牙）能保持大脑的弹性。"},

/* ============ 第5章 调试你的大脑 ============ */
{ch:5, q:"调试大脑要检查的四大类bug是什么？",
 a:"①认知偏见——思维如何被误导；②时代影响——同代人如何塑造你的价值观；③个性倾向——天生的性格如何影响思维；④硬件故障——大脑古老区域（蜥蜴逻辑）如何压制聪明的新皮层。"},
{ch:5, q:"基本归因错误是什么？为什么危害大？",
 a:"把别人的行为归因于其个性，而忽视行为发生时的情境（对自己的错误却归咎于情境）。危害：忘记了情境就是一切——正常人也会被情境驱使做出极端行为。评估他人时先看情境。"},
{ch:5, q:"“需要定论”的偏见如何伤害项目？",
 a:"人对不确定感不适，于是强行提前下结论（如BDUF大设计先行、拍死截止日期）。但项目结束时你才最博学——过早定论消灭了选择权，而宣布日期并不能消除真实的不确定性。"},
{ch:5, q:"列出至少五种常见的认知偏见。",
 a:"思维定势（锚定）、基本归因错误、自私偏见（成功归我、失败与我无关）、需要定论、认可偏见（只选支持己见的事实）、曝光效应（熟悉即偏爱）、霍桑效应（被观察时行为改变）、虚假记忆、符号约简、名词谬论。"},
{ch:5, q:"什么是名词谬论？",
 a:"以为贴上标签就等于理解了事物：“他是ADHD”“她是X一代”——标签没有增加任何理解力，只是符号约简的幻觉。检验方法：试着解释它的反面，若只会重复标签就说明你并不理解。"},
{ch:5, q:"什么是柏拉图圈和黑天鹅？",
 a:"柏拉图圈：把复杂现实简化为理想“积木”（柏拉图立体）时留下的洞——意料之外的事件就藏在这个洞里。黑天鹅：欧洲人从没见过黑天鹅便认定不存在，直到亲眼所见。从未观察到≠不可能；意想不到的事件改变历史。"},
{ch:5, q:"“相关不等于因果”的经典例子是什么？",
 a:"高压线下的家庭白血病发病率更高≠高压线致癌：可能是高压线下房价便宜→贫困家庭→营养、医疗、早期检测差异所致。现实因果常是X和Y互相强化的循环，而非简单的单向箭头。"},
{ch:5, q:"“很少”不意味着“没有”——如何应用？（诀窍18）",
 a:"每月你都可能经历一次“百万分之一的奇迹”。别把罕见事件当不可能：检查“疯狂的”异常值，问问如果它真的发生你会怎样，绝不说“绝不”（但也不必囤积罐头）。"},
{ch:5, q:"为什么要推迟下结论？（诀窍19）",
 a:"项目进行中你每天都在学到新知识，结束时才是智力高峰、开始时最无知。过早定论会消灭成功的选项。适应不确定性，必要时用带概率的表述报告：如“10月1日上线，把握37%”。"},
{ch:5, q:"“信任记录而不是记忆”（诀窍20）的依据是什么？",
 a:"记忆每一次读取都是写入，会按当前年龄、经历、世界观不断重写——旧记忆不可靠。好记性不如烂笔头：保留工程师笔记、设计决策记录、谈话要点等现实凭据。"},
{ch:5, q:"六代美国世代划分是什么？它想说明什么？",
 a:"大兵一代(1901-24)务实建设者、沉默一代(1925-42)墨守成规者、婴儿潮一代(1943-60)道德仲裁人、X一代(1961-81)自由创业者、新千年一代(1982-2005)忠诚不冒险、祖国一代(2005-)。说明：你的许多“信念”只是你出生时代的烙印，不是普适真理。应对之道：保持多样性，并从多个角度看待问题。（诀窍21）"},
{ch:5, q:"MBTI的四条轴线是什么？如何正确使用它？",
 a:"外向E-内向I（75%偏外向）、感觉S-直觉N（75%偏感觉，而书中鼓励直觉）、思考T-情感F（约各半，性别略偏）、判断J-知觉P（约各半）。它是偏好指示而非判决——“性格不是命运”，重点是：别人用不同的“操作系统”看世界。"},
{ch:5, q:"为什么说“你无法改变别人”？（诀窍22）",
 a:"试图改造他人性格以适合自己只会导致灾难：F型不会被说服无视情感而只讲规则，T型也不会被感情打动而偏离规则。像对待不同操作系统一样尊重差异，寻求妥协而不是改造。"},
{ch:5, q:"“蜥蜴逻辑”的六种表现是什么？",
 a:"①战斗、逃跑或吓呆；②立刻行动（冲动、只关注最兴奋而非最重要的）；③领头意识（阿尔法狗行为）；④守卫领土（绝不共享信息）；⑤受了伤就愤愤不平（责怪别人而不解决问题）；⑥像我这样==好，不像我这样==坏。"},
{ch:5, q:"路怒症研究揭示了我们大脑的什么秘密？",
 a:"衡量路怒倾向的首要指标是车上个性化东西的数量（贴纸、装饰），内容不重要、数量才重要——因为那是蜥蜴脑在“划定领地”。文明的表象之下，原始脑一直在运行。"},
{ch:5, q:"email apnea（电子邮件窒息）是什么？（诀窍23）",
 a:"处理电子邮件时呼吸会短暂中止——原始脑把邮件当威胁进入应激状态。对策：像高级动物一样行动——深呼吸、数到十，让新皮层接管，别让蜥蜴替你回邮件。"},
{ch:5, q:"“相信直觉，但要验证”（诀窍24）如何操作？",
 a:"直觉给方向，验证给证据：建原型、跑单元测试、做基准测试。并用批判性自问清单拷问信念：你怎么知道的？谁说的？与什么比较？这总是发生吗？能想到特例吗？什么阻止了你？"},
{ch:5, q:"“预期影响现实”指什么？",
 a:"你对他人的期望会真的塑造你看到的结果（也影响他们表现）。若坚信老板在报复你、某技术很差，你会只注意到支持该信念的证据。警惕预期制造的现实，凡事权衡正反两面。"},
/* ============ 第6章 主动学习 ============ */
{ch:6, q:"“羊浸式培训”为什么无效？",
 a:"像把羊浸到药水里那样把人“泡”在培训里，指望知识自动渗透——但学习无法强加：只学不练没有用，没有明确目标和反馈只会产生随机结果。Education源于educare，本义是“引出”，而不是灌输。"},
{ch:6, q:"SMART目标是什么？",
 a:"Specific具体、Measurable可度量、Achievable可实现、Relevant相关、Time-boxed时间可控。“我要学Ruby”不是SMART；“今年年底前用Ruby完成一个可运行的Web项目并部署上线”才是。（诀窍25）"},
{ch:6, q:"目标（goal）和任务（objective）有什么区别？",
 a:"目标是理想状态的描述（“成为技术专家”）；任务是帮你接近目标的、可执行的阶段性承诺。没有SMART任务支撑的目标会被日常琐事永远排挤——只有目标是不会实现的。（诀窍26）"},
{ch:6, q:"PIP（实用投资计划）的四个要点是什么？",
 a:"①制定具体计划：现在、明年、五年后分别做什么；②多样化：低风险低回报（经典书籍、成熟技术）+ 高风险高回报（新兴技术）组合；③主动投资：定期重估，该止损就止损；④定期投资：持续小额投入（成本平均法），养成习惯。"},
{ch:6, q:"为什么“时间只能分配，不能创造”？",
 a:"把学习流放到“空闲时间”就意味着永远不会做。像定投一样给学习固定的时间预算，形成定期习惯——知识投资和其他投资一样，需要定期投入。"},
{ch:6, q:"三种学习模式（VAK）是什么？如何利用？（诀窍27）",
 a:"视觉型、听觉型、动觉型。留意自己的用词暗示：“看起来一片漆黑”是视觉型，“找不到突破口/抓不住重点”是动觉型，“挺和谐/很刺耳”是听觉型。发现自己的主导模式后，用它加速学习，同时补强弱势模式。"},
{ch:6, q:"加德纳多元智力理论是什么？它的正确用法？",
 a:"智力不止一种：身体-动觉、语言、逻辑-数学、视觉-空间、音乐、人际、自我认知。正确用法：为学习增添多种通道（边走边听、用图示、动手做），而不是当“我不擅长数学”的借口。"},
{ch:6, q:"成人学习（诺尔斯）的五个特点是什么？",
 a:"①要满足自身兴趣才会主动学习；②学习需要与现实相关；③倾向用经验分析的方法学习；④需要自我引导（而不是被安排）；⑤允许不同的风格、时间和节奏差异。设计学习时据此调整。"},
{ch:6, q:"SQ3R阅读法是哪五步？",
 a:"Survey调查（浏览目录、标题、小结建立框架）→ Question提问（带着问题读）→ Read阅读 → Recite复述（合上书回忆要点）→ Review回顾（事后复习巩固）。",
 n:"配合主动阅读：在书上做标记、写批注、画思维导图。（诀窍29）"},
{ch:6, q:"为什么重复阅读无效？“测试驱动学习”怎么做？",
 a:"被动重读产生“熟悉感”错觉，真正的巩固来自主动回忆（测试）。利用间隔效用安排复习：如2小时后、2天后、2周后、6个月后各回顾一次（2-2-2-6）。"},
{ch:6, q:"思维导图怎么做？为什么手绘是关键？",
 a:"中心写下主题画圈，引出分支，用颜色和图形。它的威力在于评估想法之间的关系，手绘（先草记再整理）的过程最有价值——画完的图不如画的过程重要。切忌机械地顺时针填元素，那只是绕圈的大纲。（诀窍30）"},
{ch:6, q:"什么时候思维导图最有效？",
 a:"非目标导向的“玩”的时候：不确定会发现什么时最有效，R型主导的探索才能呈现真实的思维结构。目标明确的整理任务用大纲反而更合适。"},
{ch:6, q:"为什么说“写文档的过程比文档本身更重要”？（诀窍31）",
 a:"写文档迫使大脑进行内源性聚焦——整理、回忆、建立连接，这个过程促进灵感（机会青睐有准备的人）。文档会过时，但写时获得的深入理解是你的。"},
{ch:6, q:"“以教代学”如何操作？（诀窍32）",
 a:"观察、实践、教学是学习阶梯的第三级：向橡皮鸭解释代码、给孩子讲概念、在用户组做分享、写博客书评。教是最强的学习——你必须在 R型直觉之外把它变成能讲清楚的东西。"},
{ch:6, q:"组织学习小组有什么价值？如何组织？（诀窍28）",
 a:"学习小组把主动阅读、讨论、以教代学结合在一起：轮流讲解章节、互相提问、成员水平参差反而是资源（教别人的同时自己也在学）。公司内部或用户组皆可——组织学习小组学习和辅导，是性价比最高的知识投资方式之一。"},

/* ============ 第7章 积累经验 ============ */
{ch:7, q:"构造主义（派珀特与皮亚杰）的核心主张是什么？",
 a:"我们通过构造而学习，而不是学习来构造。大脑不是被动存储知识的容器——要先探索、先动手，再吸收事实。Logo语言和乐高机器人都是这一思想的产物。在现实生活中，没有课程。"},
{ch:7, q:"“玩耍”在学习中的两层含义是什么？（诀窍33）",
 a:"①非目的性的探索：把玩问题、探索“我可以如何扩展它”；②乐趣：趣味性让学习更有效（苏斯博士韵律版安全广播让人真的在听）。为了更好地学习，请更好地玩。"},
{ch:7, q:"波利亚解题法的四个步骤是什么？",
 a:"①理解：未知量是什么？已知量是什么？条件是什么？②计划：找类似问题、画图、先解更简单的问题、从结论倒推；③执行；④回顾：检查结果、能否用它解决别的问题。"},
{ch:7, q:"“从相似点中学习，从差异中忘却”（诀窍34）警告什么？",
 a:"类比是桥梁也是陷阱：C++写得像C、Java写得像C++都是未完成的过渡。新范式在根本上不同（过程式→面向对象、桌面→云计算），你需要学多少就得忘多少——危险的是停留在混合的中间状态。"},
{ch:7, q:"安全学习环境必须允许哪三件事？（诀窍35）",
 a:"安全地探索、安全地创造、安全地应用。具体条件：自由实验；能原路返回稳定状态；能重现任意时刻的工作产品；能证实细粒度的进展。"},
{ch:7, q:"Starter Kit（启动工具包）是哪三件套？为什么重要？",
 a:"版本控制 + 单元测试 + 项目自动化。版本控制是巨大的Undo按钮，单元测试提供客观的细粒度反馈，自动化把一切可靠地串起来——它们共同构成失败代价接近零的实验环境。"},
{ch:7, q:"内在诀窍（inner game）的核心方法是什么？（诀窍36）",
 a:"培养非判断性的意识：观察——不做判断——然后行动。网球教练不教指令，只让学员喊“弹起”“击球”；贝司老师让学生观察自己演奏。指令过多会让大脑僵死，意识才会自动纠正表现。"},
{ch:7, q:"“尝试会失败，认知会弥补”是什么意思？",
 a:"内在诀窍的中心思想：有意识的过度努力反而导致失败；不带评判的觉知和认知比拼命尝试更有效。调试也如此：先完全弄明白问题是什么，再动手改——“不要动手做，而是要袖手旁观”。"},
{ch:7, q:"压力与创造力的关系？什么是“压力宿醉”？",
 a:"阿马贝尔十年研究发现：面对时间压力时人最没有创造力——与普遍认识恰恰相反；且压力有后效，创造力被压制会持续到之后两天（压力宿醉）。安排恢复时间；最后期限只会让大脑恐慌、把R型拒之门外。"},
{ch:7, q:"善良的撒玛利亚人实验说明了什么？",
 a:"刚学完“好撒玛利亚人”课程的神学院学生，被催促赶去开会时几乎从挡路的乞讨者身上跨过去；不着急的一组则停下来帮助。时间压力压倒了一切道德认知——压力下眼界缩小，R型完全离场。"},
{ch:7, q:"“允许失败”为什么反而促进成功？（诀窍37）",
 a:"被允许失败时，过度活跃的L型评判机制会关闭，人放松下来反而表现出色（“假装评委没听”的贝司学生）。做法：建立失败代价接近零的地带——白板头脑风暴、单元测试、原型。"},
{ch:7, q:"“所有输入都是等价的”是什么意思？如何利用它？",
 a:"大脑不擅长区分实时感知、记忆和想象——看电影时身体反应如临现场，“鸡蛋是白色”的记忆能覆盖眼前真实的桃红色。利用它：想象实践与真实练习同样有效，想象成功就能让大脑为成功形成惯例（诀窍38）。"},
{ch:7, q:"什么是脚手架（scaffolding）？正负两种用法？",
 a:"人为制造体验成功或加大难度的条件：绑绳拖游让游泳者先体验冠军速度（正向脚手架）；负重训练后正常跑起来更轻松（负向脚手架，如用C++几天再回Ruby）。先体验成功的感觉，成功会顺其自然。"},
{ch:7, q:"“让自己始终成为乐队的最差乐手”（派特·麦席尼）利用了什么机制？",
 a:"镜像神经元：观察高手的实践和方法会激励你做出同样的行为，大脑会自动向更高水平调节。我们是天生的模仿者——接近你想成为的人，扮演专家的角色。"},
/* ============ 第8章 控制注意力 ============ */
{ch:8, q:"“不是没时间，而是没带宽”指什么？",
 a:"时间只能分配，注意力才是稀缺资源。L型的“空闲循环”（内心喋喋不休的自言自语）会持续消耗带宽、干扰R型——你必须先学会让这台喋喋不休的机器安静下来。"},
{ch:8, q:"内观冥想（vipassana）的要点是什么？（诀窍39）",
 a:"找安静处坐直、闭眼，把注意力放在呼吸上；不描述、不自言自语，只是觉察；走神了就轻轻拉回来。长期练习能显著改善注意力控制——冥想不是神秘主义，是注意力的力量训练。"},
{ch:8, q:"什么是“思维浸泡”？如何区分浸泡和拖延？（诀窍40）",
 a:"有意识地暂时放下问题，让它在大脑里发酵——创造力不按考勤钟运转。区分标准：如果你真不想做这件事，分心就是浪费；如果有兴趣但很难，思想其实正在后台发酵。要挤出思考的时间，为它预留日程。"},
{ch:8, q:"丹尼特的“多草稿模型”是什么？",
 a:"意识没有中心剧场，而是某一刻“占多数的脑细胞活动草稿”——许多知觉草稿并行竞争，胜出的成为“当下体验”。这解释了为什么注意力管理如此重要：你给什么注意力，什么就成为你的意识。"},
{ch:8, q:"“三法则”（rule of three）是什么检验工具？",
 a:"如果你说不出一个问题会有哪三种可能的出错方式、或一种方案有哪三种后果，说明你的思考还不充分。强制自己凑齐三种，逼大脑离开单一视角。"},
{ch:8, q:"外部信息处理系统为什么重要？（诀窍41）",
 a:"大脑之外的思维支持工具会成为你“思维头脑”的一部分（分布式认知）。用wiki把信息外化：它是文本版的思维导图，可搜索、可链接、可演化——别什么都装在脑子里。"},
{ch:8, q:"“感官调整”是什么？如何利用？",
 a:"一旦有了存放某类想法的地方，你就会得到更多这类想法——就像寻找红色时红色无处不在。建立博客、wiki、笔记本等“容器”，大脑会自动为你收集相关素材。"},
{ch:8, q:"情境切换的代价有多大？",
 a:"多任务处理损失20%～40%的生产力；被中断后平均需要20分钟才能回到原任务；持续被电话和邮件打断的人智商下降约10分——比吸食大麻（降4分）严重得多。切换不是免费的，账单是生产力和错误率。"},
{ch:8, q:"GTD（尽管去做）最重要的三个原则是什么？",
 a:"①扫描输入队列（邮箱、笔记、待办）仅一次——不要反复翻看；②按顺序处理每组工作，而不是抓最有趣的；③不要在头脑中保留清单——全部外化到可靠系统里。"},
{ch:8, q:"应对邮件干扰有哪些策略？（诀窍42、43、44）",
 a:"关闭所有邮件提示，主动加大检查间隔（为自己的通信选择进度，而不是为别人的）；制定交流规则管理干扰（告诉团队什么情况找你、怎么找）；少发送邮件，你就会少收到邮件。"},
{ch:8, q:"被打断时如何保护思路？（诀窍45）",
 a:"屏蔽中断：预感到要被打断时，立刻留下面包屑线索——几个关键词记下当前思路和下一步；提高进出情境的物理成本（关IM、戴耳机、走开一段距离）。"},
{ch:8, q:"双显示器和虚拟桌面为什么有效？（诀窍46、47）",
 a:"双显示器提升20%～30%的生产力——消除“Alt-Tab式”的微情境切换；虚拟桌面按任务组织工作空间（一个桌面写代码、一个桌面处理邮件、一个桌面调试），而不是按应用组织。优化个人工作流以最大化情境。"},

/* ============ 第9章 超越专家 ============ */
{ch:9, q:"“实践保持长久（Practice makes permanent）”是什么意思？",
 a:"老习惯形成的神经高速公路不会消失——你只能在其旁边修新路，但旧路永远在等你回去。复发时不要自责：承认失误、回到新轨道即可。实践不一定完美，但会保持长久。"},
{ch:9, q:"有效改变的五条建议是什么？",
 a:"①制定计划并跟踪进展；②记住“不作为”才是敌人，错误不是；③给新习惯至少三周（或更长）的适应时间；④信念是真实的——你相信改变可能，大脑才会配合；⑤步步为营：设低起点的小步骤，完成就奖励。"},
{ch:9, q:"铃木俊隆那句名言是什么？专家的致命弱点在哪里？",
 a:"“新手的大脑有很多可能性，但是专家心里只有很少。”一旦你相信自己已经是专家，就会停止好奇、抵制改变、被自己的判断囚禁——像专家一样行动是最致命的弱点。要永远保持新手思维：哇，这很酷，它是怎么工作的？"},
{ch:9, q:"“明天上午做什么”——作者建议的起步行动有哪些？",
 a:"承担责任，大方地问“你怎么知道的”、答“我目前还不知道”；挑两件维持情境免受干扰的事立即实施；创建PIP并设定SMART目标；诚实定位自己的德雷福斯阶段；带一支笔一个本子（最好不带横线）；开始写博客、用SQ3R和思维导图读书；每天散步；启动读书小组；加一台显示器。现在就开始（歌德）。"},
{ch:9, q:"本书最后一诀（诀窍48）是什么？为什么？",
 a:"抓住方向盘，你不能自动驾驶。一旦启动自动驾驶你就不会转向——习惯和过去的智慧会让你看不到眼前的现实。永远提高警惕（自由的代价，也是意识的代价）：认识你自己，认识当前时刻，认识你所处的情境。Be aware."}
/*CARDS-END*/
];

/* ---------- render ---------- */
var grid=document.getElementById('grid');
var filtersEl=document.getElementById('filters');
var seen={};
var curFilter=-1; // -1 = all
var kw='';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderFilters(){
  var html='<button class="fbtn on" data-f="-1">全部</button>';
  for(var i=0;i<10;i++){html+='<button class="fbtn" data-f="'+i+'">'+CH[i].name+'</button>';}
  filtersEl.innerHTML=html;
  filtersEl.querySelectorAll('.fbtn').forEach(function(b){
    b.onclick=function(){
      filtersEl.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); curFilter=parseInt(b.dataset.f,10); render();
    };
  });
}

function render(){
  var html='', shown=0;
  for(var i=0;i<CARDS.length;i++){
    var d=CARDS[i];
    if(curFilter>=0 && d.ch!==curFilter) continue;
    if(kw && (d.q+d.a+(d.n||'')).toLowerCase().indexOf(kw)===-1) continue;
    var c=CH[d.ch].c;
    var ans=esc(d.a).replace(/（(诀窍[^）]*)）/g,'（<em>$1</em>）').replace(/(诀窍\s?\d+)/g,'<em>$1</em>');
    html+='<div class="card'+(seen[i]?' flipped':'')+'" data-i="'+i+'" style="--c:'+c+'">'
      +'<div class="card-inner">'
      +'<div class="face front"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="tag">'+CH[d.ch].name+'</span>'
      +'<div class="q">'+esc(d.q)+'</div>'
      +'<div class="hint"><span>思考一下，再看答案</span><span>点击翻面 ↻</span></div></div>'
      +'<div class="face back"><span class="num">'+String(i+1).padStart(2,'0')+'</span>'
      +'<span class="tag">'+CH[d.ch].name+'</span>'
      +'<div class="a">'+ans+(d.n?'<span class="note">※ '+esc(d.n)+'</span>':'')+'</div>'
      +'<div class="hint"><span class="ok">✓ 已复习</span><span>点击返回正面 ↺</span></div></div>'
      +'</div></div>';
    shown++;
  }
  grid.innerHTML=shown?html:'<div class="noresult">没有匹配的卡片，换个关键词试试？</div>';
  grid.querySelectorAll('.card').forEach(function(el){
    el.onclick=function(){
      var i=parseInt(el.dataset.i,10);
      el.classList.toggle('flipped');
      if(el.classList.contains('flipped')){seen[i]=true;}else{delete seen[i];}
      updateProgress();
    };
  });
}

function updateProgress(){
  var n=Object.keys(seen).length, t=CARDS.length;
  document.getElementById('seen').textContent=n;
  document.getElementById('pfill').style.width=(n/t*100)+'%';
  if(n===t) document.getElementById('pfill').style.background='linear-gradient(90deg,#3F7D4E,#B98A2E)';
}

document.getElementById('search').oninput=function(){
  kw=this.value.trim().toLowerCase(); render();
};
document.getElementById('resetBtn').onclick=function(){
  seen={}; render(); updateProgress();
};

document.getElementById('totalChip').textContent=CARDS.length;
document.getElementById('total2').textContent=CARDS.length;
renderFilters(); render(); updateProgress();
</script>
